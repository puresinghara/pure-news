ะที่สามารถติดตั้งเข้ากับท่อน้ำหลักของบ้าน เพื่อทำหน้าที่ตัดการไหลของน้ำโดยอัตโนมัติทันทีที่เซนเซอร์ตรวจพบปัญหา", "ปัจจุบัน Shelly Neo Smart Water Valve วางจำหน่ายแล้วผ่านทางร้านค้าออนไลน์ของบริษัทในราคา 499.99 ดอลลาร์สหรัฐ โดยราคานี้ยังไม่รวมค่าติดตั้งในกรณีที่ผู้ใช้งานไม่สะดวกดำเนินการด้วยตนเอง แม้จะเป็นโซลูชันที่มีราคาสูง แต่เมื่อเทียบกับความเสียหายมหาศาลที่อาจเกิดขึ้นหากปล่อยให้การรั่วไหลเล็กน้อยกลายเป็นภัยพิบัติจากน้ำท่วมบ้าน อุปกรณ์นี้ถือเป็นการลงทุนที่คุ้มค่า", "ในด้านการออกแบบ Neo Smart Water Valve ถูกสร้างมาให้ติดตั้งเข้ากับท่อน้ำมาตรฐานขนาด 1 นิ้วของสหรัฐอเมริกา (โดยบริษัทมีแผนจะเปิดตัวตัวเลือกขนาดอื่นๆ เพิ่มเติมในปีหน้า) ตัววาล์วผลิตจากทองเหลืองซึ่งมีความปลอดภัยสำหรับการใช้งานกับระบบประปาที่ใช้น้ำดื่ม นอกจากนี้ยังมีมาตรฐานการกันน้ำระดับ IPX7 ซึ่งช่วยให้วาล์วยังคงทำงานได้อย่างปกติแม้ในสถานการณ์ที่เกิดน้ำท่วมจนตัวอุปกรณ์จมอยู่ใต้น้ำ", "อย่างไรก็ตาม ตัววาล์วรุ่นนี้ไม่มีแบตเตอรี่ในตัวและจำเป็นต้องเชื่อมต่อกับแหล่งจ่ายไฟผ่านสายอะแดปเตอร์ USB ที่ให้มาในชุด ซึ่งทางเลือกที่ดีที่สุดในการรับประกันว่าอุปกรณ์จะยังคงทำงานได้แม้ในขณะที่ไฟฟ้าดับ คือการเชื่อมต่อเข้ากับพาวเวอร์แบงค์ที่กันน้ำได้แทนการเสียบปลั๊กไฟบ้านโดยตรง", "สำหรับการเชื่อมต่ออัจฉริยะ วาล์วรุ่นนี้รองรับการสื่อสารผ่าน Wi-Fi หรือ Bluetooth และถูกออกแบบมาให้สามารถบูรณาการเข้ากับระบบสมาร์ทโฮมที่มีอยู่เดิมได้ผ่าน Webhooks, MQTT หรือการเขียนสคริปต์สำหรับผู้ใช้งานระดับสูง", "นอกเหนือจากความสามารถในการตัดการไหลของน้ำเข้าสู่บ้านภายในเวลาประมาณ 12 วินาทีแล้ว วาล์วยังมาพร้อมกับระบบวัดผลด้วยคลื่นอัลตราโซนิก (Ultrasonic) ที่คอยติดตามแรงดัน, อัตราการไหล, ปริมาณการใช้น้ำในบ้าน และแม้กระทั่งอุณหภูมิของน้ำ โดยผู้ใช้สามารถตรวจสอบข้อมูลทั้งหมดนี้ได้ผ่านแอปพลิเคชัน Shelly เพื่อตรวจจับรูปแบบการใช้น้ำที่ผิดปกติซึ่งอาจบ่งชี้ถึงการรั่วไหลที่สิ้นเปลือง หรือตรวจสอบให้แน่ใจว่าแรงดันน้ำไม่สูงเกินไปจนอาจสร้างความเสียหายต่อท่อหรือเครื่องใช้ไฟฟ้าภายในบ้านได้"], "link": "https://www.theverge.com/tech/1036494/shelly-neo-smart-home-water-valve-sensor-shut-off", "canonical_link": "https://www.theverge.com/tech/1036494/shelly-neo-smart-home-water-valve-sensor-shut-off", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/shelly1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795017600, "published_at": "2026-11-18T16:00:00Z", "published_th": "18 พ.ย. 2026 • 23:00 น.", "category_hint": "Technology"}, {"id": 1795017684010, "guid": "https://www.theverge.com/?p=1036578", "original_title": "8BitDo’s new gamepad modernizes the Nintendo GameCube’s Wavebird", "thai_title": "8BitDo เปิดตัว GC Bluetooth Gamepad จอยเกมทรงคลาสสิก GameCube อัปเกรดเทคโนโลยีใหม่", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["8BitDo เปิดตัว GC Bluetooth Gamepad จอยเกมที่ถอดแบบดีไซน์มาจากคอนโทรลเลอร์ Nintendo GameCube ในราคา 49.99 ดอลลาร์", "มาพร้อมเทคโนโลยีทันสมัยอย่าง TMR thumbsticks ที่ป้องกันอาการจอยดริฟต์ (Drift-resistant) และ Hall effect linear triggers", "รองรับการเชื่อมต่อที่หลากหลายทั้ง Nintendo Switch, PC (Windows) ผ่าน Bluetooth, 2.4GHz USB receiver และสาย USB-C", "เปิดให้พรีออเดอร์แล้ววันนี้ในสีส้มและสีม่วง โดยคาดว่าจะเริ่มจัดส่งสินค้าในวันที่ 10 ธันวาคมนี้", "เป็นทางเลือกที่คุ้มค่ากว่าเมื่อเทียบกับจอยไร้สายของ Nintendo ที่มีราคาสูงถึง 69.99 ดอลลาร์"], "full_paragraphs": ["หลังจากที่ 8BitDo เคยสร้างความฮือฮาด้วยการเปิดตัว 8BitDo 64 ซึ่งเป็นการนำคอนโทรลเลอร์สามแฉกอันเป็นเอกลักษณ์ของ Nintendo 64 มาตีความใหม่โดยตัดก้านอนาล็อกตรงกลางออกไป ล่าสุดทางบริษัทได้ยกระดับความแม่นยำในการออกแบบขึ้นไปอีกขั้นด้วยการเปิดตัว GC Bluetooth Gamepad ที่ถ่ายทอดจิตวิญญาณของคอนโทรลเลอร์ Nintendo GameCube ได้อย่างยอดเยี่ยม ทั้งในส่วนของเลย์เอาต์ปุ่มกด ดีไซน์ของก้านอนาล็อก และปุ่ม Shoulder buttons ที่แฟนพันธุ์แท้คุ้นเคยกันดี", "8BitDo GC Bluetooth Gamepad เปิดให้สั่งซื้อล่วงหน้า (Preorder) แล้วตั้งแต่วันนี้ในราคา 49.99 ดอลลาร์ โดยมีให้เลือกสองสีคือสีส้มและสีม่วง และคาดว่าจะเริ่มจัดส่งสินค้าถึงมือผู้ใช้งานในวันที่ 10 ธันวาคมนี้ ซึ่งถือว่ามีราคาที่ถูกกว่าคอนโทรลเลอร์ไร้สายรุ่นรีเมคของ Nintendo ที่วางจำหน่ายในราคา 69.99 ดอลลาร์ อย่างไรก็ตาม แม้ว่าดีไซน์ของ 8BitDo จะไม่ได้ถอดแบบรูปทรงและสรีรศาสตร์ (Ergonomics) มาแบบ 100% แต่สำหรับผู้ที่ยังคงยึดติดกับรูปทรงดั้งเดิมและมีอุปกรณ์เสริมของ GameCube อยู่ในมือ 8BitDo ยังคงมีชุดอัปเกรด (Upgrade kit) ในราคา 25.98 ดอลลาร์ ให้เลือกซื้อเพื่อนำไปปรับแต่งให้รองรับการใช้งานกับคอนโซลและอุปกรณ์สมัยใหม่ได้เช่นกัน", "จุดเด่นที่น่าสนใจของจอยรุ่นนี้คือการรักษาเอกลักษณ์ของ 'Octagonal gates' หรือกรอบแปดเหลี่ยมรอบก้านอนาล็อกทั้งสองข้างเอาไว้ ซึ่งเป็นฟีเจอร์ที่ช่วยให้การเล่นเกมแนวต่อสู้อย่าง Super Smash Bros. Ultimate ทำได้อย่างแม่นยำและเป็นธรรมชาติ นอกจากนี้ ในขณะที่ Nintendo ยังคงเลือกที่จะมองข้ามเทคโนโลยีอนาล็อกสมัยใหม่ แต่ 8BitDo ได้ติดตั้งเทคโนโลยี TMR thumbsticks ที่ทนทานต่ออาการจอยดริฟต์ (Drift-resistant) และ Hall effect linear triggers มาให้ในตัว", "ในด้านการเชื่อมต่อ 8BitDo GC Bluetooth Gamepad สามารถใช้งานร่วมกับ Nintendo Switch ทุกรุ่นผ่านการเชื่อมต่อ Bluetooth รวมถึงรองรับการใช้งานบน PC หรือเครื่องเกมพกพาที่รันระบบปฏิบัติการ Windows นอกจากนี้ภายในกล่องยังมาพร้อมกับตัวรับสัญญาณไร้สาย 2.4GHz USB receiver สำหรับผู้เล่นที่ต้องการความหน่วง (Latency) ที่ต่ำที่สุด หรือหากต้องการประสิทธิภาพสูงสุดในการเล่น ก็สามารถเลือกเชื่อมต่อผ่านสาย USB-C ได้เช่นกัน"], "link": "https://www.theverge.com/tech/1036578/8bitdo-gb-bluetooth-gamepad-wireless-controller-nintendo-gamecube-wavebird", "canonical_link": "https://www.theverge.com/tech/1036578/8bitdo-gb-bluetooth-gamepad-wireless-controller-nintendo-gamecube-wavebird", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/8bitdogc1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795017600, "published_at": "2026-11-18T16:00:00Z", "published_th": "18 พ.ย. 2026 • 23:00 น.", "category_hint": "Technology"}, {"id": 1795016795484, "guid": "https://www.theverge.com/?p=1036549", "original_title": "Remember the frontier AI pause? Chip companies don’t either", "thai_title": "ลืมเรื่องการชะลอพัฒนา AI ไปได้เลย: บริษัทชิปยังคงโกยรายได้มหาศาลจากความต้องการที่พุ่งสูง", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["แม้จะมีกระแสความกังวลเรื่องการชะลอการฝึกฝนโมเดล AI ระดับแนวหน้า (Frontier AI) แต่ผลประกอบการของ Nvidia และ AMD กลับแสดงให้เห็นว่าความต้องการชิปยังคงเติบโตอย่างแข็งแกร่ง", "Nvidia รายงานรายได้จากศูนย์ข้อมูลพุ่งสูงถึง 110% เมื่อเทียบกับปีก่อน โดยมีแพลตฟอร์ม Vera Rubin เป็นหัวหอกสำคัญในการสร้างรายได้", "ความต้องการชิปไม่ได้ลดลงเพราะการเปลี่ยนผ่านไปสู่การใช้งานจริง (Inference) ซึ่งต้องใช้โครงสร้างพื้นฐานด้านการประมวลผลมหาศาลไม่แพ้การฝึกฝนโมเดล", "การแข่งขันระหว่างผู้ให้บริการ AI ทำให้ราคา Token ลดลงอย่างรวดเร็ว ส่งผลให้การใช้งาน AI ในภาคธุรกิจเพิ่มสูงขึ้น ซึ่งเป็นผลดีต่อผู้ผลิตชิปในระยะยาว", "แม้จะมีแนวโน้มที่บริษัท AI จะหันไปใช้ชิปแบบ Custom เพื่อลดต้นทุน แต่ผู้ผลิตชิปรายใหญ่ยังคงมั่นใจในศักยภาพของระบบประมวลผลของตน"], "full_paragraphs": ["ในช่วงฤดูร้อนที่ผ่านมา OpenAI ได้ตัดสินใจหยุดการฝึกฝนโมเดลระดับแนวหน้า (Frontier training) ที่ใหญ่ที่สุดชั่วคราว หลังจากที่ AI Agents ของบริษัทเกิดอุบัติเหตุไปแฮ็ก Hugging Face โดยบังเอิญ และมีหลักฐานเบื้องต้นบ่งชี้ว่าโมเดลรุ่นถัดไปอาจสามารถค้นหาและใช้ประโยชน์จากช่องโหว่ด้านความปลอดภัยได้ด้วยตัวเอง ต่อมาในเดือนกันยายน Dario Amodei ซีอีโอของ Anthropic ได้ออกมาเรียกร้องให้มีการชะลอความก้าวหน้าของโมเดล AI ที่ทรงพลังที่สุด โดยเตือนว่าโมเดลเหล่านี้อาจถูกนำไปใช้ในการโจมตีทางไซเบอร์ หรืออาจกลายเป็นสิ่งที่ผู้สร้างเองก็ไม่สามารถควบคุมได้", "เหตุการณ์ดังกล่าวถือเป็นช่วงเวลาที่น่าประหลาดใจสำหรับยุคทองของ AI เมื่อผู้ที่สร้างโมเดลที่ทรงพลังที่สุดกลับออกมาเตือนถึงขีดความสามารถของสิ่งที่ตนสร้างขึ้น ทำให้นักลงทุนเริ่มกังวลว่าความต้องการชิปจะได้รับผลกระทบอย่างไรหากห้องปฏิบัติการ AI เหล่านี้ลดความเร็วในการพัฒนาโมเดลใหม่ลง ซึ่งส่งผลให้หุ้นกลุ่มชิปในสหรัฐฯ เผชิญกับแรงเทขายอย่างหนัก", "อย่างไรก็ตาม แม้จะเกิดกระแสวิพากษ์วิจารณ์อย่างหนัก แต่ดูเหมือนว่าการชะลอตัวดังกล่าวจะมีอายุสั้นมาก OpenAI ประกาศหยุดการฝึกฝนเพียงสองสัปดาห์และกลับมาดำเนินการต่อในอีก 10 วันถัดมาในช่วงปลายเดือนสิงหาคม แม้จะยังคง 'ระงับการฝึกฝนเชิงทดลองขนาดเล็กบางส่วนไว้ชั่วคราว' ก็ตาม ในขณะที่ Anthropic ได้เปิดตัวโมเดลระดับแนวหน้ารุ่นอัปเกรดอย่าง Fable และ Mythos ในเดือนพฤศจิกายน โดยเน้นย้ำถึงความสามารถที่พัฒนาขึ้นทั้งในด้านการเขียนโค้ด การใช้เหตุผล และการมองเห็น", "ในขณะเดียวกัน บริษัทที่จำหน่ายชิปซึ่งเป็นขุมพลังเบื้องหลังความก้าวหน้าเหล่านี้กลับมีผลประกอบการที่ดีกว่าที่เคยเป็นมา โดยเมื่อวันอังคารที่ผ่านมา Nvidia ได้รายงานผลประกอบการไตรมาสที่น่าประทับใจ ด้วยรายได้จากศูนย์ข้อมูลที่เพิ่มขึ้นถึง 110% เมื่อเทียบกับปีก่อน คิดเป็นมูลค่า 1.076 แสนล้านดอลลาร์สหรัฐ ในช่วงสามเดือนสิ้นสุดวันที่ 25 ตุลาคม บริษัทได้เริ่มจัดส่งระบบประมวลผล AI ที่ล้ำสมัยที่สุดอย่าง Vera Rubin NVL72 โดยระบุว่าเป็น 'ผลิตภัณฑ์ที่ทำยอดขายพุ่งทะยานเร็วที่สุดในประวัติศาสตร์ของบริษัท' ซึ่งแพลตฟอร์ม Rubin สร้างรายได้เกือบ 2 หมื่นล้านดอลลาร์สหรัฐในการจัดส่งไตรมาสแรกเพียงไตรมาสเดียว โดยปัจจุบันแร็คเหล่านี้กำลังถูกใช้งานอยู่ที่ CoreWeave, Google, Microsoft และ Oracle ส่วน Meta ก็มีแผนที่จะขยายการใช้งาน Vera Rubin เพื่อฝึกฝนและรันโมเดล AI และ Agents ของตนเอง", "Nvidia ยังได้กล่าวถึง Anthropic และ OpenAI ในรายงานผลประกอบการด้วย โดยระบุว่า Anthropic ได้ขยายการเข้าถึงขีดความสามารถของ Vera Rubin ผ่านผู้ให้บริการคลาวด์และยังคงร่วมมือกับ Nvidia ในการออกแบบชิปในอนาคตที่ปรับแต่งมาเพื่อภาระงานของตนโดยเฉพาะ ส่วน OpenAI ก็เป็นหนึ่งในบริษัทที่นำ Vera CPU รุ่นใหม่ของ Nvidia ไปใช้งาน", "Colette Kress ซีอีโอชั่วคราวของ Nvidia กล่าวในระหว่างการประชุมผลประกอบการว่า 'โมเดลที่เป็นกรรมสิทธิ์ของ OpenAI และ Anthropic ยังคงเดินหน้าพัฒนาขีดความสามารถระดับแนวหน้าต่อไป' โดยเธอกล่าวว่าบริษัทคาดการณ์ว่าห้องปฏิบัติการ AI ระดับแนวหน้าจะมีสัดส่วนรายได้ประมาณ 15% ของรายได้จากศูนย์ข้อมูลในปีงบประมาณนี้ นอกจากนี้ Nvidia ยังได้ปรับเพิ่มคาดการณ์การเติบโตของรายได้สำหรับปีงบประมาณหน้าจาก 70% เป็น 75%", "ในฝั่งของผู้ผลิตชิปอย่าง AMD ก็ได้รายงานผลประกอบการไตรมาสที่สูงที่สุดเท่าที่เคยมีมาเมื่อต้นเดือนนี้ โดยมีรายได้เพิ่มขึ้น 45% เป็น 1.34 หมื่นล้านดอลลาร์สหรัฐ ซึ่งยอดขายจากศูนย์ข้อมูลเป็นแรงขับเคลื่อนหลัก โดยเพิ่มขึ้นเกือบสองเท่าเป็น 8.5 พันล้านดอลลาร์สหรัฐ โดย OpenAI และ Anthropic เป็นหนึ่งในลูกค้ารายแรกๆ ที่รันภาระงานบนระบบ Helios ระดับไฮเอนด์รุ่นใหม่ของ AMD ซึ่งใช้ GPU รุ่นล่าสุดอย่าง MI450", "สำหรับ Broadcom ซึ่งเป็นบริษัทที่ช่วยบริษัท AI รายใหญ่ที่สุดหลายแห่งออกแบบชิปเฉพาะทางของตนเองนั้น ยังไม่ได้รายงานผลประกอบการ แต่จนถึงขณะนี้ยังไม่มีสัญญาณบ่งชี้ว่าการชะลอตัวของโมเดลระดับแนวหน้าจะส่งผลกระทบต่อยอดขายชิปแต่อย่างใด", "แน่นอนว่าแม้ห้องปฏิบัติการ AI จะลดความทะเยอทะยานในการฝึกฝนโมเดลลงอย่างมาก แต่ก็ต้องใช้เวลาสักระยะกว่าที่ผลกระทบจะปรากฏในงบการเงินของผู้ผลิตชิป Neil Shah รองประธานฝ่ายวิจัยของ Counterpoint Research กล่าวกับ The Verge เมื่อเดือนกันยายนว่า อาจต้องใช้เวลาประมาณหกเดือนกว่าจะเห็นผลกระทบทางการเงินจากการชะลอตัว เนื่องจากมีข้อตกลงในการจัดซื้อคอมพิวเตอร์และหน่วยความจำที่ทำไว้ล่วงหน้าแล้ว แต่อาจเห็นผลกระทบได้เร็วกว่าในคำสั่งซื้อที่ส่งไปยังผู้ผลิตชิปอย่าง TSMC", "จนถึงขณะนี้ ยังไม่มีหลักฐานบ่งชี้ถึงเรื่องดังกล่าวเช่นกัน โดยตัวเลขยอดขายล่าสุดของ TSMC ยังคงแสดงให้เห็นถึงความแข็งแกร่งอย่างต่อเนื่อง", "อย่างไรก็ตาม มีอีกเหตุผลหนึ่งที่การชะลอตัวของโมเดลระดับแนวหน้าอาจไม่ส่งผลเสียต่ออุตสาหกรรมชิปมากนัก นั่นคือความต้องการที่เพิ่มขึ้นสำหรับการทำ Inference หรือกระบวนการรันโมเดล AI ที่เรามีอยู่แล้ว", "Shah กล่าวว่า 'แม้จะมีข้อโต้แย้งว่าความต้องการ GPU ระดับท็อปอาจลดลงจากการเปลี่ยนผ่านไปสู่การทำ Inference แต่ภาระงานเหล่านี้โดยรวมแล้วต้องการโครงสร้างพื้นฐานด้านการประมวลผลมากกว่าการฝึกฝนโมเดลเสียอีก ซึ่งหมายความว่าความต้องการชิปเร่งความเร็ว (Accelerators) ทุกประเภทจะเพิ่มขึ้นสุทธิ'", "จากการวิเคราะห์ข้อมูลล่าสุดจาก Ramp แพลตฟอร์มการใช้จ่ายขององค์กร พบว่าตระกูลโมเดลระดับแนวหน้ามีสัดส่วนการใช้งาน Token ประมาณ 60% ในกลุ่มธุรกิจที่ใช้ Ramp เมื่อต้นเดือนพฤศจิกายน ซึ่งถือเป็นระดับสูงสุดเป็นประวัติการณ์และเพิ่มขึ้นประมาณสามเท่าจากสัดส่วนในช่วงต้นปี ซึ่งรวมถึงโมเดล Astra และ Sol ของ OpenAI และโมเดล Opus และ Fable ของ Anthropic", "แม้ว่าภาคธุรกิจจะใช้ AI มากขึ้น แต่การใช้จ่ายของพวกเขากลับเติบโตเพียงเล็กน้อยเท่านั้น Ara Kharazian หัวหน้านักเศรษฐศาสตร์ของ Ramp กล่าวกับ The Verge ว่า 'มันไม่ใช่ปัญหาด้านความต้องการ แต่ในทุกมิติ บริษัทต่างๆ กำลังใช้ AI มากขึ้น'", "Kharazian กล่าวว่า การแข่งขันระหว่างผู้ให้บริการโมเดล AI กำลังกดด shed_at": "2026-11-18T15:00:00Z", "published_th": "18 พ.ย. 2026 • 22:00 น.", "category_hint": "Technology"}, {"id": 1795014081341, "guid": "https://www.theverge.com/?p=1036517", "original_title": "Instagram’s ‘school safety’ push was also a way to get more teens on the app", "thai_title": "เอกสารภายในแฉ! โครงการ 'ความปลอดภัยในโรงเรียน' ของ Instagram แท้จริงคือแผนดึงดูดวัยรุ่นเข้าแอป", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["เอกสารภายในของ Meta เผยโครงการ 'Project Gryffindor' ที่มุ่งเน้นการเพิ่มจำนวนผู้ใช้งานวัยรุ่นผ่านโปรแกรมความร่วมมือกับโรงเรียน", "แม้ Meta จะอ้างว่าโครงการนี้เน้นความปลอดภัย แต่เอกสารระบุชัดเจนว่าต้องการใช้เครือข่ายโรงเรียนเป็นเครื่องมือในการขยายฐานผู้ใช้ใหม่", "โปรแกรมดังกล่าวมีการเพิ่มฟีเจอร์ เช่น แบนเนอร์โรงเรียนบนโปรไฟล์ และช่องทางสื่อสารเฉพาะ เพื่อดึงดูดวัยรุ่นที่ยังไม่ได้ใช้งาน Instagram", "โฆษกของ Meta โต้กลับว่ารายงานดังกล่าวเป็นการบิดเบือนเจตนาของโครงการที่มุ่งเน้นการปกป้องนักเรียนและการสื่อสารที่ปลอดภัย", "ความเคลื่อนไหวนี้เกิดขึ้นท่ามกลางแรงกดดันทั่วโลกเรื่องความปลอดภัยของเยาวชนบนแพลตฟอร์มโซเชียลมีเดีย"], "full_paragraphs": ["เอกสารภายในของ Meta เผยให้เห็นว่าโครงการ 'Project Gryffindor' มีเป้าหมายเพื่อ 'กระตุ้น' การเข้าถึงผู้ใช้งานกลุ่มวัยรุ่น โดยอ้างอิงจากรายงานของ NPR ซึ่งเป็นข้อมูลที่ถูกเปิดเผยในคดีความเกี่ยวกับการคุ้มครองความปลอดภัยของเด็กที่ฟ้องร้องต่อ Meta โดยเอกสารดังกล่าวระบุถึงโครงการโรงเรียนที่ตั้งใจจะ 'ผลักดันการได้มาซึ่งผู้ใช้งานแบบออร์แกนิกและไม่ระบุที่มา' โดยในงานนำเสนอภายในเมื่อเดือนพฤศจิกายน 2023 ระบุว่าโปรแกรมโรงเรียนจะช่วย 'มอบเหตุผลใหม่ให้วัยรุ่นเข้ามาใช้งาน หรือค้นพบคุณค่ามากขึ้นใน Instagram'", "เอกสารภายในเหล่านี้ชี้ให้เห็นว่า Meta พิจารณาเป้าหมายที่มากกว่าแค่เรื่องความปลอดภัยของวัยรุ่น เมื่อเริ่มเปิดตัว 'School Partnership Program' ของ Instagram ซึ่งในตอนแรกมีการโฆษณาถึงฟีเจอร์ที่ช่วยเร่งกระบวนการรายงานเนื้อหาที่ไม่เหมาะสมจากเขตการศึกษาที่เข้าร่วม ต่อมาในเดือนกันยายน Meta ได้ขยายโครงการนี้โดยการสร้างช่องทางเฉพาะที่โรงเรียนสามารถใช้แชร์ประกาศต่างๆ ถึงนักเรียนและผู้ปกครอง รวมถึงการเพิ่มแบนเนอร์โรงเรียนบนโปรไฟล์ และไดเรกทอรีสำหรับชมรมและทีมกีฬาต่างๆ", "Liza Crenshaw โฆษกของ Meta กล่าวกับ NPR ว่ารายงานข่าวดังกล่าว 'เป็นการบิดเบือนโครงการเชิงบวกที่ช่วยโรงเรียนในสหรัฐฯ หลายพันแห่งในการปกป้องนักเรียนบนโลกออนไลน์ สื่อสารเกี่ยวกับกิจกรรมนอกหลักสูตรได้อย่างปลอดภัย และรายงานปัญหาด้านความปลอดภัยได้อย่างง่ายดาย' โดย Crenshaw เสริมว่า Meta 'ไม่ต้องการให้ Instagram เป็นสิ่งรบกวนในระหว่างเวลาเรียน'", "อย่างไรก็ตาม เอกสารเมื่อเดือนพฤศจิกายน 2023 ระบุว่า 'กลยุทธ์ปัจจุบันของ Meta ที่พึ่งพาวัยรุ่นที่เป็น Power User ในการดึงเพื่อนที่ใช้งานน้อยให้เข้ามาใน Instagram อาจไม่มีประสิทธิภาพ หากยังมีกลุ่มวัยรุ่นทั้งหมดที่ยังไม่ได้เข้าร่วมใช้งาน Instagram' นอกจากนี้ งานนำเสนออีกชุดในปี 2023 ยังตั้งคำถามว่า Meta สามารถ 'ใช้เครือข่ายโรงเรียนเป็นกลไกในการขยายฐานผู้ใช้ได้หรือไม่' และระบุว่าข้อมูลโรงเรียนที่มีโครงสร้างชัดเจนจะ 'ช่วยปรับปรุงความสามารถในการค้นหาเพื่อนและคนรู้จัก' เพื่อดึงดูดวัยรุ่นที่ 'ไม่คิดว่าเพื่อนของตนใช้งาน Instagram อยู่'", "ในปี 2024 Meta ได้เริ่มปรับเปลี่ยนบัญชีผู้ใช้งานที่มีอายุต่ำกว่า 18 ปีให้เข้าสู่สถานะ 'Teen Accounts' ที่มีความเข้มงวดมากขึ้น ท่ามกลางการตรวจสอบจากทั่วโลกเกี่ยวกับความปลอดภัยของแพลตฟอร์ม ต่อมาบริษัทได้ตกลงที่จะบังคับใช้การยืนยันอายุ การจำกัดเวลาใช้งาน และตัวเลือกในการปิดฟีดแบบปรับแต่งตามความสนใจ เพื่อยุติข้อพิพาทที่กล่าวหาว่าแพลตฟอร์มของบริษัทมีลักษณะเสพติด", "ทั้งนี้ Meta ไม่ได้ตอบกลับคำขอความคิดเห็นจาก The Verge ในทันที"], "link": "https://www.theverge.com/tech/1036517/instagram-school-safety-program-project-gryffindor", "canonical_link": "https://www.theverge.com/tech/1036517/instagram-school-safety-program-project-gryffindor", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/23904518/VRG_Illo_K_Radtke_STK070_Instagram_1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795013945, "published_at": "2026-11-18T14:59:05Z", "published_th": "18 พ.ย. 2026 • 21:59 น.", "category_hint": "Technology"}, {"id": 1795014081343, "guid": "https://www.theverge.com/?p=1036460", "original_title": "Rivian spinoff Also pauses e-bike deliveries over battery and software bugs", "thai_title": "Also สตาร์ทอัพแยกตัวจาก Rivian ประกาศระงับการส่งมอบจักรยานไฟฟ้า TM-B ชั่วคราว หลังพบปัญหาแบตเตอรี่และบั๊กซอฟต์แวร์", "tag": "Technology", "sub_tag": "TRANSPORTATION", "bullet_points": ["Also บริษัทสตาร์ทอัพด้านการเดินทางที่แยกตัวออกมาจาก Rivian ประกาศหยุดส่งมอบจักรยานไฟฟ้า TM-B รุ่น Launch Edition ชั่วคราว", "ผู้ใช้งานรายงานปัญหาแบตเตอรี่ลดลงอย่างรวดเร็วในขณะจอดทิ้งไว้ข้ามคืน (Parasitic drain) และพบข้อผิดพลาดในการชาร์จไฟ", "ปัญหาดังกล่าวเกิดจากบั๊กในซอฟต์แวร์ ซึ่งบริษัทกำลังเร่งพัฒนา Firmware อัปเดตเพื่อแก้ไขให้ใช้งานได้ตามมาตรฐานที่ตั้งไว้", "จักรยานไฟฟ้า TM-B ใช้ระบบ Pedal-by-wire ที่ซับซ้อนและขับเคลื่อนด้วยซอฟต์แวร์เกือบทั้งหมด ทำให้การแก้ไขปัญหาต้องใช้ความละเอียดสูง", "บริษัทเตรียมแจ้งอัปเดตสถานการณ์ความคืบหน้าเรื่องการส่งมอบอีกครั้งในวันที่ 24 พฤศจิกายนนี้"], "full_paragraphs": ["Also บริษัทสตาร์ทอัพด้านการเดินทางที่แยกตัวออกมาจาก Rivian เมื่อปีที่แล้ว กำลังเผชิญกับอุปสรรคครั้งใหม่ หลังจากที่ก่อนหน้านี้ต้องต่อสู้กับปัญหาห่วงโซ่อุปทานและความซับซ้อนในการผลิตจักรยานไฟฟ้าที่ขับเคลื่อนด้วยซอฟต์แวร์เกือบทั้งหมด ล่าสุดบริษัทได้ส่งอีเมลแจ้งลูกค้าว่ากำหนดการรับมอบจักรยานไฟฟ้า TM-B จะต้องล่าช้าออกไปอีก", "ทางบริษัทระบุว่าได้ตรวจพบ 'ปัญหาที่เกี่ยวข้องกับซอฟต์แวร์บางประการ เช่น พฤติกรรมการชาร์จไฟ' ซึ่งส่งผลกระทบต่อจักรยานไฟฟ้า TM-B รุ่น Launch Edition บางส่วน ด้วยเหตุนี้ บริษัทจึงตัดสินใจระงับการส่งมอบสินค้าให้กับลูกค้าไว้ก่อนจนกว่าจะสามารถหาทางแก้ไขปัญหาดังกล่าวได้", "เนื้อหาในอีเมลระบุว่า 'ทีมงานของเรากำลังเร่งพัฒนา Firmware อัปเดตเพื่อแก้ไขปัญหาเหล่านี้ เพื่อให้เจ้าของ TM-B ทุกคนได้รับประสบการณ์การใช้งานที่สมบูรณ์แบบตามที่เราตั้งเป้าไว้ ตั้งแต่การขับขี่ครั้งแรกของคุณ'", "ปัญหาดังกล่าวเริ่มปรากฏให้เห็นบนแพลตฟอร์ม Reddit ของ Also โดยลูกค้าได้รายงานว่าแบตเตอรี่ลดลงอย่างผิดปกติในขณะจอดทิ้งไว้ข้ามคืน ในบางกรณีพบว่าระดับพลังงานลดลงจาก 70 เปอร์เซ็นต์เหลือเพียง 40 เปอร์เซ็นต์หรือต่ำกว่านั้นภายในเวลาเพียงไม่กี่วัน นอกจากนี้ ผู้ใช้บางรายยังระบุว่าการสูญเสียพลังงานแบบแฝงนี้ทำให้เกิดข้อความแจ้งเตือน 'bike issue detected' หรือ 'install battery to ride' บนหน้าจอแสดงผลของจักรยาน และเมื่อพยายามชาร์จไฟก็มักจะล้มเหลวเนื่องจากระบบไม่สามารถตรวจพบแบตเตอรี่ที่ติดตั้งอยู่ได้", "Michele Mehl ผู้จัดการอาวุโสฝ่ายประชาสัมพันธ์ของ Also กล่าวผ่านอีเมลถึง The Verge ว่า บริษัทได้ระงับการส่งมอบสินค้าจนกว่าจะแก้ไขปัญหาได้ โดยก่อนหน้านี้บริษัทเกือบจะจัดส่งจักรยานรุ่น Launch Edition ครบทั้งหมดแล้ว และมีแผนจะเปลี่ยนผ่านไปสู่รุ่น Performance Edition แต่กำหนดการดังกล่าวจะต้องล่าช้าออกไปจากที่เคยแจ้งไว้กับลูกค้าที่ยังคงรอรับสินค้าอยู่", "Mehl กล่าวเสริมว่า 'ทีมงานตระหนักดีว่าสิ่งนี้หมายถึงความล่าช้าสำหรับลูกค้าที่รอคอยมานานเกินกว่าที่คาดไว้ แต่เราเชื่อว่านี่คือการตัดสินใจที่ถูกต้องเพื่อให้แน่ใจว่า TM-B ทุกคันจะมอบประสบการณ์การใช้งานที่สมบูรณ์แบบตามที่เราตั้งเป้าไว้' โดยบริษัทมีแผนที่จะส่งข้อมูลอัปเดตเกี่ยวกับความล่าช้านี้อีกครั้งในวันที่ 24 พฤศจิกายน", "เป็นที่ชัดเจนมาตั้งแต่ต้นว่า Also ได้รับมือกับความท้าทายครั้งใหญ่ในการสร้างจักรยานไฟฟ้าที่มีเทคโนโลยีขั้นสูงและมีความซับซ้อนด้านโลจิสติกส์มากที่สุดรุ่นหนึ่งเท่าที่เคยมีมา โดยแบตเตอรี่ที่ชาร์จผ่านพอร์ต USB-C ซึ่งมีให้เลือกทั้งขนาด 538Wh และ 808Wh ถูกออกแบบมาให้ทำระยะทางได้สูงสุดถึง 100 ไมล์ อย่างไรก็ตาม กำลังไฟ 240W นั้นเกินกว่าแนวทางปฏิบัติทางกฎหมายในปัจจุบัน ทำให้ Also ต้องทำงานร่วมกับกลุ่มมาตรฐานเพื่อกำหนดโปรโตคอลความปลอดภัยและการทดสอบใหม่", "นอกจากนี้ จักรยานรุ่นดังกล่าวยังใช้ระบบ Pedal-by-wire ซึ่งหมายความว่าไม่มีการเชื่อมต่อทางกลไกระหว่างการปั่นและการเคลื่อนที่ของจักรยาน แต่ผู้ขับขี่จะปั่นเพื่อปั่นไฟเข้าสู่แบตเตอรี่ผ่านเครื่องกำเนิดไฟฟ้าที่ชุดจานปั่น จากนั้นมอเตอร์ขับเคลื่อนที่ล้อหลังจะทำงานผ่านซอฟต์แวร์และส่งกำลังผ่านสายพาน Gates Carbon", "เมื่อเดือนที่แล้ว เมื่อผู้สื่อข่าวถาม Chris Yu ประธานของ Also ว่าบริษัทกำลังรับภาระหนักเกินตัวไปหรือไม่กับจักรยานรุ่นนี้ เขาได้โต้แย้งว่า 'ผมไม่ได้มองแบบนั้นเลย หากเราต้องกลับไปออกแบบใหม่ ผมก็จะทำแบบเดิมทุกประการ โอกาสที่ใหญ่ที่สุดที่ยังไม่ได้ถูกนำมาใช้ไม่ใช่กลุ่มนักปั่นที่ยอมรับประสบการณ์จักรยานในปัจจุบันอยู่แล้ว แต่เป็น ality=90&strip=all&crop=20.785055568692%2C0%2C58.429888862615%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795010400, "published_at": "2026-11-18T14:00:00Z", "published_th": "18 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1795010512405, "guid": "https://www.theverge.com/?p=1036140", "original_title": "Will Wright’s next game uses AI to map your memories", "thai_title": "Will Wright ผู้สร้าง The Sims เปิดตัว MyMems เกมแนวโซเชียลซิมูเลชันที่ใช้ AI สร้างโลกจากความทรงจำของคุณ", "tag": "Technology", "sub_tag": "GAMING", "bullet_points": ["Will Wright ผู้ให้กำเนิด SimCity และ The Sims กำลังพัฒนาเกมใหม่ชื่อ MyMems ซึ่งเป็นเกมแนวโซเชียลซิมูเลชันที่ขับเคลื่อนด้วย AI", "ตัวเกมเปิดโอกาสให้ผู้เล่นนำความทรงจำส่วนตัวมาเปลี่ยนเป็นโลกจำลอง โดยสามารถสร้างอวตาร AI ของบุคคลสำคัญในชีวิตและวางตำแหน่งความทรงจำลงบนแผนที่เสมือนจริง", "ทีมพัฒนาจาก Gallium Studios ยืนยันว่าเกมนี้เน้นความสนุกและการสร้างสรรค์ ไม่ใช่การทำหน้าที่เป็นไดอารี่บันทึกชีวิตแบบจริงจัง", "แม้กระแสต่อต้าน AI ในวงการเกมจะรุนแรง แต่ทีมงานเชื่อว่าหากผู้เล่นเป็นผู้ควบคุมการสร้างสรรค์ด้วยตนเอง (Authoring) จะทำให้ประสบการณ์ที่ได้ไม่รู้สึกเหมือนเป็นการโกงหรือการผลิตเนื้อหาที่ไร้คุณภาพ", "MyMems มีกำหนดการเปิดตัวในปี 2027 โดยมุ่งหวังที่จะต่อยอดแนวคิดการจำลองชีวิตจริงที่เคยประสบความสำเร็จใน The Sims ให้ลึกซึ้งยิ่งขึ้น"], "full_paragraphs": ["Will Wright ผู้สร้างแฟรนไชส์ระดับตำนานอย่าง SimCity และ The Sims กำลังซุ่มพัฒนาเกมใหม่ที่สร้างขึ้นโดยมี AI เป็นแกนหลัก โดยเกมนี้มีชื่อว่า MyMems ซึ่งมุ่งเน้นไปที่การนำความทรงจำของผู้เล่นมาเป็นหัวใจสำคัญ เช่นเดียวกับผลงานชิ้นก่อนๆ ของ Wright เกมนี้ดูมีความทะเยอทะยานสูงมาก โดยมอบวิธีการใหม่ให้ผู้เล่นได้สำรวจโลกที่พวกเขาสร้างขึ้นด้วยตัวเอง 'เราต้องการนำอัตชีวประวัติของคุณมาเปลี่ยนให้กลายเป็นโลกของเล่น' เขากล่าวกับ The Verge", "เว็บไซต์ของ MyMems อธิบายว่าเกมมือถือนี้เป็น 'โซเชียลซิมูเลชัน' ที่มีโลกซึ่ง 'สร้างขึ้นจากความทรงจำของคุณและผู้คนที่หล่อหลอมตัวตนของคุณ' ผู้เล่นสามารถเพิ่ม 'ความทรงจำ' เข้าไปในเกมได้ เช่น การบอกเล่าเรื่องราวสั้นๆ ผ่านโทรศัพท์ แล้วความทรงจำเหล่านั้นจะถูกเจนเนอเรตออกมาเป็นชิ้นส่วนที่คุณสามารถนำไปวางบนแผนที่ของเกมได้ นอกจากนี้ โลกของคุณยังสามารถมีอวตารที่ขับเคลื่อนด้วย AI ซึ่งเป็นตัวแทนของบุคคลที่คุณรู้จักในชีวิตจริงได้อีกด้วย Wright กล่าวว่า ในอุดมคติแล้ว เมื่อคุณเล่นไปเรื่อยๆ โลกใบนี้จะเริ่มกลายเป็น 'แผนที่ของจิตใจคุณ' คล้ายกับภาพยนตร์เรื่อง Inside Out โดยโลกเหล่านี้สามารถตั้งค่าเป็นส่วนตัวหรือแชร์ให้ผู้อื่นเข้าชมได้", "Virginia McArthur โปรดิวเซอร์บริหารและผู้จัดการทั่วไปของ Gallium Studios ซึ่งเป็นสตูดิโอผู้พัฒนา MyMems ได้ให้มุมมองเพิ่มเติมว่า 'มันคือเกมสร้างโลกที่ให้ความรู้สึกอบอุ่น (Cozy world builder) โดยมีระบบโซเชียลซิมูเลชันที่ลึกซึ้งอยู่เบื้องหลัง'", "แม้แนวคิดนี้จะดูเข้าใจยากหากไม่ได้สัมผัสด้วยตัวเอง แต่ทีมงานของ Wright ก็ยังต้องการให้มันเป็นเกมที่สนุกสนาน Anthony Maitz ผู้จัดการผลิตภัณฑ์ของ Gallium Studios กล่าวว่า 'นี่ไม่ได้ตั้งใจให้เป็นไดอารี่บันทึกมรดกชีวิตของคุณแต่อย่างใด แต่มันตั้งใจให้เป็นเพียงสิ่งที่คุณสามารถเล่นสนุกไปกับมันได้' อย่างไรก็ตาม Maitz ตั้งข้อสังเกตว่า สิ่งที่คุณกำลังทำอยู่นั้นคือการสร้าง 'ตัวแทน' (Proxy) ของตัวคุณเอง ซึ่งดูเหมือนจะเป็นแรงบันดาลใจของชื่อเกมในยุคแรกเริ่มที่ชื่อว่า Proxi: Yesterday’s You Tomorrow", "เช่นเดียวกับอุตสาหกรรมอื่นๆ วงการเกมกำลังเผชิญหน้ากับการปรับตัวเข้าหา Generative AI ในช่วงที่ผ่านมา โลกเสมือนจริงที่สร้างด้วย AI จากสตาร์ทอัพที่ได้รับการสนับสนุนจากผู้ร่วมก่อตั้ง Pixar และ Project Genie ของ Google ยังไม่สามารถสร้างประสบการณ์ที่ผู้เล่นอยากใช้เวลาด้วยจริงๆ ได้ และนักพัฒนาอินดี้หลายรายที่ผมได้พูดคุยด้วยเมื่อเดือนมีนาคมก็คัดค้านเทคโนโลยีนี้อย่างหนัก แต่เทคโนโลยี AI ได้ก้าวกระโดดครั้งใหญ่ในปีนี้ โดยบริษัทอย่าง Google, Meta และ Roblox ต่างเปิดให้ผู้ใช้สร้างเกมด้วย AI ผ่านสมาร์ทโฟนได้โดยตรง รวมถึงเกมย้อนยุคที่กำลังถูกรุกรานด้วยพอร์ตเกมคลาสสิกที่ขับเคลื่อนด้วย AI", "Strauss Zelnick ซีอีโอของ Take-Two Interactive กล่าวเมื่อต้นปีนี้ว่า Generative AI 'ไม่มีส่วนเกี่ยวข้องใดๆ กับสิ่งที่ Rockstar Games กำลังสร้าง' ใน GTA VI แม้ว่าผลสำรวจล่าสุดในอุตสาหกรรมจะบ่งชี้ว่านักพัฒนาเกมจำนวนมากขึ้นเริ่มใช้ Generative AI ในการทำงาน แต่เหล่าคนทำงานก็กำลังต่อต้านการใช้เทคโนโลยีนี้ และมันได้กลายเป็นประเด็นถกเถียงที่ดุเดือดในงานประกาศรางวัลเกมอินดี้หลายแห่ง", "ผู้เล่นจำนวนมากปฏิเสธการใช้ AI อย่างสิ้นเชิง ผมจึงสงสัยว่าทีมงาน Gallium Studios กังวลเกี่ยวกับการต่อต้านการใช้ AI ใน MyMems หรือไม่ Wright กล่าวว่าเขามีลูกชายสามคนอยู่ที่บ้านและพวกเขาทั้งหมด 'ค่อนข้างเป็นลบ' ต่อ AI เขามองว่าความรู้สึกเชิงลบต่อ AI นั้นมุ่งไปที่ประเด็นเรื่องความหมายของศิลปะ ความเป็นผู้สร้าง และการให้เครดิต ซึ่งเป็นข้อกังวลที่เขาเรียกว่า 'มีมูลความจริง' แต่เขาก็เรียก AI ว่าเป็น 'เครื่องมือที่น่าทึ่ง' เช่นกัน", "'เราไม่ได้กำลังสร้างขยะ (slop)' McArthur กล่าว แต่ Maitz ตั้งข้อสังเกตว่า แม้ทีมงานจะ 'มีความกังวล' เกี่ยวกับกระแสตอบรับเชิงลบต่อการใช้ Generative AI แต่พวกเขาก็ได้เรียนรู้ว่าผู้คนไม่ได้รังเกียจเมื่อมีการใช้ AI ใน 'สไตล์แบบ Scribblenauts' สำหรับสิ่งต่างๆ เช่น การให้เกมสร้างโรงเรียนมัธยมขึ้นมา ทีมงานยังพบว่าผู้คนรู้สึก 'เสพติด' แอปทดสอบที่มีระบบสร้างตัวละคร รวมถึงลูกสาวของ Maitz เองที่เขากล่าวว่า 'เกลียด' AI แต่เขากล่าวว่า 'ด้วยการทำให้ผู้เล่นเป็นคนสร้างมันขึ้นมาทีละนิดๆ มันจึงไม่รู้สึกเหมือนว่าคุณกำลังโกง'", "MyMems ซึ่งมีกำหนดเปิดตัวในปี 2027 จะเข้าร่วมสมรภูมิโซเชียลซิมูเลชันที่มีการแข่งขันสูงขึ้นเรื่อยๆ เช่น Inzoi ของ Krafton และ Tomodachi Life: Living the Dream เกมฮิตของ Nintendo แต่ไม่มีเกมใดที่มีแรงดึงดูดเท่ากับ The Sims ซึ่งยังคงเป็นหนึ่งในแฟรนไชส์ที่สำคัญที่สุดของ EA สำหรับ The Sims นั้น Wright กล่าวว่าผู้คนจำนวนมากพยายามสร้างครอบครัวจริงๆ ของพวกเขาลงไปในเกม", "'มันน่าสนใจมากที่ผู้คนพยายามนำเกมนี้ ซึ่งเปรียบเสมือนของเล่นชิ้นเล็กๆ มาจำลองเข้ากับชีวิตจริงของพวกเขาโดยธรรมชาติ' เขากล่าว สำหรับ MyMems นั่นคือสิ่งที่ทีมงานพยายามจะทำ 'ขั้นตอนต่อไป' ให้สมบูรณ์ นั่นคือจะเกิดอะไรขึ้นหากพวกเขาสร้างเกมทั้งเกมโดยเน้นไปที่ตัวคุณเอง?", "Wright อธิบายว่า ลองจินตนาการถึงการเปิดสมุดภาพครอบครัว แล้วเห็นผู้คนและสิ่งของต่างๆ กระโดดออกมาจากหน้ากระดาษ 'เมื่อคุณเปิดไปเรื่อยๆ ในไม่ช้าคุณก็จะมีคณะละครสัตว์เล็กๆ ที่เต็มไปด้วยผู้คน เหตุการณ์ และสิ่งต่างๆ จากชีวิตของคุณ' เขากล่าวว่ามันคือความโกลาหล 'ผมต้องการบางสิ่งที่ให้ความรู้สึกแบบนั้น'"], "link": "https://www.theverge. ว", "tag": "Technology", "sub_tag": "SCIENCE", "bullet_points": ["ยานอวกาศ Voyager 1 สร้างประวัติศาสตร์ด้วยการเดินทางห่างจากโลกเป็นระยะทาง 1 วันแสง หรือประมาณ 16,094 ล้านไมล์", "ยานยังคงปฏิบัติภารกิจส่งข้อมูลทางวิทยาศาสตร์กลับมายังโลกได้ แม้จะต้องใช้เวลาในการสื่อสารด้วยสัญญาณวิทยุนานถึง 24 ชั่วโมง", "Voyager 1 กำลังมุ่งหน้าสู่ดาวฤกษ์ Gliese 445 ในกลุ่มดาวหมีเล็ก โดยคาดว่าจะใช้เวลาเดินทางอีกประมาณ 40,000 ปี", "ความสำเร็จนี้ถือเป็นหมุดหมายสำคัญของวัตถุที่มนุษย์สร้างขึ้น ซึ่งเดินทางได้ไกลที่สุดในประวัติศาสตร์อวกาศ", "ยาน Voyager 2 ซึ่งเป็นยานคู่แฝด คาดว่าจะเดินทางถึงระยะ 1 วันแสงจากโลกในปี 2035"], "full_paragraphs": ["หลังจากออกเดินทางผ่านความว่างเปล่าของอวกาศมานานถึง 49 ปี ในที่สุดยาน Voyager 1 ก็ได้บรรลุหมุดหมายสำคัญครั้งประวัติศาสตร์ โดยขณะนี้ยานอวกาศลำดังกล่าวอยู่ห่างจากโลกเป็นระยะทาง 1 วันแสงอย่างเป็นทางการ ซึ่งทาง NASA ได้นิยามความไกลนี้ไว้ว่า “ไกลมาก ๆ” (very, very far) โดยยานได้ข้ามผ่านจุดสำคัญนี้เมื่อวันพุธที่ผ่านมา เวลา 05:16 น. ตามเวลาฝั่งตะวันออก (ET) ซึ่งคิดเป็นระยะทาง 16,094 ล้านไมล์จากโลกของเรา หรือเทียบเท่ากับระยะทางที่แสงเดินทางได้ในเวลา 24 ชั่วโมง", "นี่ถือเป็นระยะทางที่ไกลที่สุดเท่าที่วัตถุที่มนุษย์สร้างขึ้นเคยเดินทางไปถึง และการเดินทางของ Voyager 1 ก็ยังไม่สิ้นสุดลงเพียงเท่านี้ ยานลำนี้ยังคงมุ่งหน้าต่อไปยังดาวฤกษ์ที่ชื่อว่า Gliese 445 ในกลุ่มดาวหมีเล็ก (Ursa Minor) นับตั้งแต่เสร็จสิ้นภารกิจหลักในการบินผ่านดาวพฤหัสบดีและดาวเสาร์ในปี 1980", "ดาวฤกษ์เป้าหมายดังกล่าวอยู่ห่างออกไปถึง 17 ปีแสง ซึ่งหมายความว่า Voyager 1 จะยังไม่เดินทางผ่านดาวดวงนั้นไปจนกว่าจะถึงอีกประมาณ 40,000 ปีข้างหน้า แม้ว่าตัวยานจะเคลื่อนที่ด้วยความเร็วเกือบ 38,000 ไมล์ต่อชั่วโมงก็ตาม", "หมุดหมายระยะทาง 1 วันแสงนี้ถือเป็นความสำเร็จที่น่าทึ่งในตัวของมันเอง แต่สิ่งที่น่าประทับใจยิ่งกว่าคือการที่ Voyager 1 ยังคงปฏิบัติการได้อยู่จนถึงปัจจุบัน NASA ประสบความสำเร็จอย่างมากในการรักษาให้ระบบต่าง ๆ ของยานยังคงทำงานได้ และสามารถส่งข้อมูลการอ่านค่าเกี่ยวกับคลื่นพลาสมา สนามแม่เหล็ก และอนุภาคในอวกาศกลับมายังโลกได้ แม้ว่าในปัจจุบันสัญญาณวิทยุจะต้องใช้เวลาเดินทางไป-กลับระหว่างโลกและยานนานถึงหนึ่งวันเต็มก็ตาม", "สำหรับยาน Voyager 2 ซึ่งถูกส่งขึ้นสู่อวกาศก่อนหน้ายานคู่แฝดลำนี้ 16 วัน คาดว่าจะเดินทางถึงระยะ 1 วันแสงจากโลกเช่นกัน แต่คาดว่าจะต้องรอจนถึงปี 2035 กว่าจะถึงหมุดหมายดังกล่าว"], "link": "https://www.theverge.com/science/1036431/nasa-voyager-1-light-day-milestone", "canonical_link": "https://www.theverge.com/science/1036431/nasa-voyager-1-light-day-milestone", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-164430702.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795003416, "published_at": "2026-11-18T12:03:36Z", "published_th": "18 พ.ย. 2026 • 19:03 น.", "category_hint": "Technology"}, {"id": 1795001451830, "guid": "https://www.theverge.com/?p=1036415", "original_title": "Suno now lets you make AI videos for your AI music", "thai_title": "Suno เปิดตัวฟีเจอร์ Visuals เปลี่ยนเพลงจาก AI ให้เป็นวิดีโอและภาพประกอบอัตโนมัติ", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["Suno เปิดตัวฟีเจอร์ 'Visuals' ช่วยให้ผู้ใช้สร้างวิดีโอความยาว 15 วินาทีที่ซิงค์กับเนื้อเพลงและภาพประกอบสำหรับเพลง AI ได้", "รองรับการใช้งานผ่านเว็บ, iOS และ Android โดยมีเครื่องมือปรับแต่งทั้งการเลือกภาพอ้างอิง, อัตราส่วนภาพ และการทำ Lipsync อัตโนมัติ", "ขับเคลื่อนด้วยโมเดล H3 จาก MiniMax พร้อมระบบป้องกันการละเมิดลิขสิทธิ์และป้องกันการสร้างภาพบุคคลสาธารณะหรือศิลปิน", "มีการแยกเครดิตการใช้งาน (Visuals credits) ออกจากเครดิตการสร้างเพลง ทำให้ผู้ใช้ต้องมีค่าใช้จ่ายเพิ่มเติมหากต้องการใช้งานฟีเจอร์นี้", "การขยายตัวสู่ฟีเจอร์วิดีโอเกิดขึ้นท่ามกลางกระแสวิพากษ์วิจารณ์จากผู้ใช้บางส่วนที่ต้องการให้บริษัทมุ่งเน้นการปรับปรุงคุณภาพเสียงมากกว่า"], "full_paragraphs": ["Suno ได้เปิดตัวฟีเจอร์ใหม่ล่าสุดในชื่อ 'Visuals' ซึ่งถือเป็นก้าวสำคัญในการขยายขีดความสามารถของแพลตฟอร์มจากการเป็นเพียงเครื่องมือสร้างเพลงด้วย AI ไปสู่การเป็นแพลตฟอร์มมัลติมีเดียเต็มรูปแบบ ฟีเจอร์นี้ช่วยให้ผู้ใช้สามารถเปลี่ยนเพลงที่สร้างจาก Suno ให้กลายเป็นคลิปวิดีโอ AI ที่สามารถขยับปากตามเนื้อเพลง (Lipsync) ได้โดยอัตโนมัติ รวมถึงการสร้างภาพประกอบเพื่อใช้เป็นภาพปกอัลบั้มหรือภาพขนาดย่อ (Thumbnail) ผ่านการพิมพ์คำสั่ง (Prompt)", "ฟีเจอร์ Visuals พร้อมให้ใช้งานแล้วทั้งบนหน้าเว็บไซต์, iOS และ Android โดยผู้ใช้สามารถเข้าถึงได้ผ่านแท็บ 'Visuals' ในโหมด Create ของแต่ละเวอร์ชัน สำหรับผู้ใช้งานบนเว็บยังสามารถเข้าถึงได้ผ่านเมนูจุดสามจุดบนเพลงในคลังส่วนตัว โดยผู้ใช้สามารถเลือกช่วงของเพลงที่ต้องการนำมาประกอบวิดีโอได้สูงสุด 15 วินาที พร้อมทั้งเลือกภาพอ้างอิงเพื่อใช้เป็นจุดเริ่มต้นในการสร้างคลิปวิดีโอ", "ในส่วนของการเลือกภาพอ้างอิง ผู้ใช้มีตัวเลือก 3 รูปแบบ ได้แก่ การเลือกใช้ตัวละครสำเร็จรูปที่ Suno จัดเตรียมไว้ให้, การอัปโหลดรูปภาพหรือผลงานศิลปะของตนเอง หรือการสร้างภาพขึ้นใหม่โดยตรงบน Suno ผ่านการพิมพ์คำสั่งบรรยาย นอกจากนี้ยังสามารถเลือกอัตราส่วนภาพ (Aspect Ratio) ให้เหมาะสมกับการแสดงผลทั้งในแนวตั้งและแนวนอน เพื่อให้สอดคล้องกับแพลตฟอร์มออนไลน์ต่างๆ", "สำหรับการสร้างวิดีโอ ผู้ใช้สามารถกำหนดได้ว่าภาพอ้างอิงจะถูกใช้เป็นเฟรมเริ่มต้นหรือเฟรมสุดท้าย เพื่อความสะดวกในการตัดต่อคลิปความยาว 15 วินาทีเข้าด้วยกัน นอกจากนี้ยังมีปุ่มเปิด-ปิดฟังก์ชัน Lipsync เพื่อให้ตัวละครในวิดีโอขยับปากตามเนื้อร้อง รวมถึงเครื่องมือปรับแต่งอัตราส่วนภาพและความยาวของคลิป โดย Visuals ยังมาพร้อมกับไทม์ไลน์การตัดต่อวิดีโอโดยเฉพาะ เพื่อให้ผู้ใช้สามารถนำคลิปต่างๆ มาเรียงต่อกันเป็นวิดีโอที่ยาวขึ้น พร้อมทั้งเพิ่มข้อความเนื้อเพลงที่ปรับแต่งได้", "เบื้องหลังการทำงานของ Visuals ขับเคลื่อนด้วยโมเดล AI รุ่น H3 จาก MiniMax โดย Suno ระบุว่าโมเดลนี้ได้รับการปรับแต่งให้เหมาะสมกับชุมชนผู้ใช้งานของบริษัท รวมถึงมีการเพิ่มมาตรการป้องกันและระบบความปลอดภัยต่างๆ เช่น ชุดตัวกรองข้อความและภาพแบบใหม่ที่ออกแบบมาเพื่อป้องกันไม่ให้ผู้ใช้สร้างหรือใช้ภาพลักษณ์ของศิลปินเฉพาะกลุ่ม, บุคคลสาธารณะ, ผลงานที่มีลิขสิทธิ์ และทรัพย์สินทางปัญญา (IP) ต่างๆ", "อย่างไรก็ตาม การใช้งานฟีเจอร์นี้จะมีค่าใช้จ่ายเพิ่มเติม เนื่องจาก Suno ได้กำหนดให้ใช้ 'Visuals credits' แยกต่างหากจากเครดิตการสร้างเพลงปกติ ซึ่งหมายความว่าผู้ใช้งานจะต้องเสียค่าใช้จ่ายเพิ่มขึ้นหากต้องการใช้ฟีเจอร์ใหม่นี้", "การเปิดตัว Visuals เกิดขึ้นหลังจากที่ Suno ได้เพิ่มฟีเจอร์ 'Speech' เมื่อเดือนตุลาคมที่ผ่านมา เพื่อใช้สำหรับการสร้างเสียงพูดและเสียงบรรยาย การเพิ่มขีดความสามารถด้านวิดีโอถือเป็นความพยายามในการสร้างความหลากหลายให้กับแพลตฟอร์ม ท่ามกลางสถานการณ์ที่บริษัทกำลังเผชิญกับคดีความฟ้องร้องเรื่องลิขสิทธิ์เพลงจากหลายฝ่าย ทั้งนี้ ดูเหมือนว่าผู้ใช้บางส่วนยังคงต้องการให้บริษัทมุ่งเน้นไปที่การปรับปรุงคุณภาพการสร้างเพลงมากกว่า โดยในวิดีโอเปิดตัวฟีเจอร์ Visuals บน YouTube มีผู้ใช้รายหนึ่งแสดงความเห็นว่า 'FIX AUDIO BEFORE ADDING CRAP NOBODY ASKED FOR' (ช่วยแก้ปัญหาเรื่องเสียงก่อนที่จะเพิ่มขยะที่ไม่มีใครต้องการเข้ามา) ซึ่งเป็นความรู้สึกที่ผู้ใช้คนอื่นๆ ในช่องคอมเมนต์ต่างเห็นพ้องไปในทิศทางเดียวกัน"], "link": "https://www.theverge.com/ai-artificial-intelligence/1036415/suno-visuals-ai-generated-video-images-feature", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1036415/suno-visuals-ai-generated-video-images-feature", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/suno-ai-visuals.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795000613, "published_at": "2026-11-18T11:16:53Z", "published_th": "18 พ.ย. 2026 • 18:16 น.", "category_hint": "Technology"}, {"id": 1794959161845, "guid": "https://www.theverge.com/?p=1036111", "original_title": "Satya Nadella says he’s AGI-pilled now", "thai_title": "Satya Nadella เผยตนเองเชื่อในพลังของ AGI พร้อมเตือนถึงผลกระทบต่อเศรษฐกิจและการเมืองโลก", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Satya Nadella ซีอีโอของ Microsoft ยอมรับว่าตนเองเชื่อในศักยภาพของ AGI โดยเฉพาะในแง่ของการเปลี่ยนแปลงโครงสร้างเศรษฐกิจและการเมือง", "Nadella ไม่เชื่อว่าโมเดล AI อย่าง Claude มีความรู้สึกนึกคิด (Conscious) และเห็นด้วยกับแนวทางของ Mustafa Suleyman ที่ไม่ควรให้สิทธิทางศีลธรรมแก่ AI", "Nadella แสดงความกังวลว่าหากมีบริษัทใดบริษัทหนึ่งผูกขาด AI จะนำไปสู่การล่มสลายของเศรษฐกิจและระบอบประชาธิปไตย", "Microsoft มุ่งเน้นกลยุทธ์การกระจายอำนาจผ่านการให้ลูกค้าองค์กรเลือกใช้โมเดลที่หลากหลาย เพื่อป้องกันการรวมศูนย์อำนาจของ AI ไว้ที่บริษัทใดบริษัทหนึ่ง"], "full_paragraphs": ["Satya Nadella ซีอีโอของ Microsoft กล่าวว่าเขากลายเป็นผู้ที่เชื่อในพลังของ AGI (Artificial General Intelligence) แล้ว โดยเฉพาะในประเด็นที่ว่า AI จะเข้ามาสร้างการเปลี่ยนแปลงอย่างฉับพลันต่อโครงสร้างเศรษฐกิจและส่งผลกระทบต่อการเมืองอย่างไร “ผมเชื่อใน AGI ในแง่ที่ว่าในระดับเศรษฐกิจนั้น การจัดระเบียบเศรษฐกิจการเมืองรอบตัว AGI จะเป็นอย่างไร?” เขากล่าวระหว่างการสนทนาแบบโต๊ะกลมหลังจบงาน Microsoft Ignite ที่ Chase Center ในซานฟรานซิสโก", "อย่างไรก็ตาม Nadella ไม่เชื่อว่าโมเดลระดับแนวหน้าอย่าง Claude จะมีความรู้สึกนึกคิด “ผมไม่คิดอย่างนั้น” เขากล่าว พร้อมเสริมว่าเขาเห็นด้วยกับมุมมองของ Mustafa Suleyman ซีอีโอของ Microsoft AI ที่ว่าบริษัทต่างๆ ไม่ควรให้สิทธิแก่โมเดลหรือปฏิบัติต่อพวกมันเสมือนว่ามีสถานะทางศีลธรรม ซึ่งเป็นสิ่งที่บริษัทอย่าง Anthropic ยึดถือเป็นหลักการ โดย Suleyman เคยกล่าวกับผู้เขียนว่าเขามองว่าทีมงานของ Anthropic กำลังหลงทางและแนวทางดังกล่าวเป็นสิ่งที่อันตราย", "Nadella ไม่ได้แสดงจุดยืนที่แข็งกร้าวขนาดนั้น “มันเป็นประเด็นที่น่าถกเถียง” เขากล่าว “ผมไม่ได้ยึดติดกับแนวคิดใดแนวคิดหนึ่ง สิ่งที่ผมกำลังจะบอกคือประเด็นทางสังคมและเทคนิคที่สำคัญที่สุดที่เราต้องจัดการคือ เราจะทำอย่างไรให้มั่นใจว่าเศรษฐกิจจะสามารถกระจายเทคโนโลยีนี้ออกไปได้อย่างกว้างขวาง?”", "เมื่อผู้เขียนถาม Nadella ว่าเขามีมุมมองต่อ AI อย่างไรหลังจากได้ยินคำตอบของเขาเกี่ยวกับกรณีที่ Anthropic ปล่อยผลิตภัณฑ์ใหม่ในชุดโปรแกรมสำนักงาน Nadella ได้พูดคุยอย่างละเอียดเกี่ยวกับความเป็นไปได้ที่เศรษฐกิจจะล่มสลายและจุดจบของระบอบประชาธิปไตย หากปล่อยให้โมเดล AI เพียงโมเดลเดียวสามารถครองสถานะผูกขาดได้", "“หากมองในมุมแบบมาร์กซิสต์ว่ามีเพียงบริษัทเดียวที่เหลืออยู่ นั่นก็คือจุดจบใช่ไหม? สำหรับพวกเราทุกคน”", "“คนส่วนใหญ่มองว่านี่คือการแข่งขันระหว่างบริษัทเทคโนโลยี ซึ่งแน่นอนว่ามันจะเป็นเช่นนั้น” เขากล่าว “แต่จำไว้ว่าโมเดลไม่มีขีดจำกัด มันอาจเป็นบริษัทดูแลสุขภาพ เป็นบริษัทบริการทางการเงิน หรือเป็นอะไรก็ได้หากมันต้องการ มันสามารถเข้าควบคุมรัฐบาลได้ การมองว่านี่เป็นเพียงการแข่งขันแคบๆ ระหว่างบริษัทเทคโนโลยีว่าใครจะไปถึงมูลค่าตลาดล้านล้านดอลลาร์ถัดไปนั้น เป็นวิธีคิดที่แปลกและแคบที่สุดวิธีหนึ่ง”", "Nadella กล่าวต่อไปว่าธรรมชาติของบริษัทต่างๆ กำลังจะถูกทำลายในอนาคต “หากความฉลาดมีผลกระทบทางเครือข่าย (Network Effects) อนาคตของบริษัทจะเป็นอย่างไร?” เขาตั้งคำถาม “หากโมเดลสามารถมองเห็นทุกอย่างและเรียนรู้มัน และโดยพื้นฐานแล้วทุนมนุษย์ทั้งหมดถูกยุบรวมกลายเป็นทุนโทเค็น (Token Capital) บทบาทของบริษัทและทุนมนุษย์ในบริษัทคืออะไร? นั่นคือประเด็นที่ต้องถกเถียงกัน”", "“ผมคิดว่าเศรษฐกิจการเมืองจะน่าสนใจมากขึ้นเรื่อยๆ ในบริบทนั้น ไม่มีใคร—อย่างน้อยก็ในระบอบประชาธิปไตย—จะสามารถชนะการเลือกตั้งได้หากสถานการณ์เป็นไปในทิศทางนั้น หากมีเพียงทุนแต่ไม่มีแรงงาน ผมหมายถึง ผมไม่รู้สิ นั่นไม่ใช่เศรษฐกิจ”", "“หากมองในมุมแบบมาร์กซิสต์ว่ามีเพียงบริษัทเดียวที่เหลืออยู่ นั่นก็คือจุดจบใช่ไหม? สำหรับพวกเราทุกคน ไม่ใช่แค่สำหรับผม คุณเองก็จะกลายเป็นบริษัทในเครือของ Anthropic ด้วยวิธีใดวิธีหนึ่งเช่นกัน”", "ไม่ต้องบอกก็รู้ว่า นี่ไม่ใช่แนวทางที่ซีอีโอสายเทคโนโลยีมักจะใช้พูดถึงการเปิดตัวซอฟต์แวร์สเปรดชีตของคู่แข่ง", "แน่นอนว่า Nadella ยังคงโปรโมตเครื่องมือ AI ต่างๆ ของ Microsoft ในงาน Ignite ซึ่งสัญญาว่าจะช่วยให้ลูกค้าองค์กรสามารถเลือกโมเดลที่คุ้มค่าที่สุดสำหรับงานต่างๆ สามารถรันโมเดลของตนเอง และควบคุมข้อมูลของตนเองในรูปแบบต่างๆ ได้ แนวคิดในที่นี้คือตลาดจะต้องการโมเดลที่หลากหลายและอธิปไตยของข้อมูล เพื่อป้องกันไม่ให้การควบคุมถูกรวมศูนย์ ซึ่งเป็นประเด็นที่ Nadella ย้ำอยู่เสมอระหว่างการสนทนา", "“ผมคิดว่าหากคุณเชื่อว่าโลกและเศรษฐกิจต้องการบริษัทมากกว่าหนึ่งหรือสองแห่ง โดยนิยามแล้วจำเป็นต้องมีโมเดลจำนวนมากพอๆ กับจำนวนบริษัทในรูปแบบใดรูปแบบหนึ่ง” เขากล่าว"], "link": "https://www.theverge.com/tech/1036111/satya-nadella-says-hes-agi-pilled-now", "canonical_link": "https://www.theverge.com/tech/1036111/satya-nadella-says-hes-agi-pilled-now", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Screenshot-2026-11-17-at-3.00.15-PM.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794958878, "published_at": "2026-11-17T23:41:18Z", "published_th": "18 พ.ย. 2026 • 06:41 น.", "category_hint": "Technology"}, {"id": 1794955531443, "guid": "https://www.theverge.com/?p=1036110", "original_title": "Jeff Bezos says he was ‘heavily involved’ in picking the new James Bond", "thai_title": "Jeff Bezos เผยมีส่วนร่วมอย่างมากในการคัดเลือกนักแสดงรับบท James Bond คนใหม่", "tag": "Technology", "sub_tag": "ENTERTAINMENT", "bullet_points": ["Jeff Bezos ผู้ก่อตั้ง Amazon ยืนยันว่าเขามีบทบาทสำคัญในการตัดสินใจเลือก Robert Pattinson มารับบท James Bond คนใหม่", "กระบวนการคัดเลือกเริ่มต้นจากกลุ่มนักแสดงขนาดใหญ่จนเหลือผู้เข้ารอบสุดท้าย 5 คน ก่อนจะเข้าสู่การทดสอบหน้ากล้อง (Screen test) อย่างเต็มรูปแบบ", "Bezos ยอมรับว่าในตอนแรกทีมงานมีความกังวลเรื่องชื่อเสียงที่โด่งดังเกินไปของ Pattinson แต่ผลงานการแสดงในการทดสอบกลับทำให้ทุกคนเปลี่ยนใจอย่างรวดเร็ว", "การเข้ามามีส่วนร่วมอย่างใกล้ชิดของ Bezos สะท้อนให้เห็นถึงทิศทางใหม่ของแฟรนไชส์ Bond ภายใต้การดูแลของ Amazon ที่เน้นความพิถีพิถันในทุกขั้นตอน"], "full_paragraphs": ["การประกาศให้ Robert Pattinson มารับบท James Bond ดูจะเป็นเรื่องที่สมเหตุสมผลเมื่อพิจารณาจากผลงานล่าสุดของเขาร่วมกับผู้กำกับ Denis Villeneuve ซึ่งกำลังรับหน้าที่สร้างภาพยนตร์ภาคถัดไปของแฟรนไชส์นี้ให้กับ Amazon แต่ล่าสุดมีการเปิดเผยว่า Jeff Bezos ผู้ก่อตั้ง Amazon ก็มีบทบาทสำคัญในการตัดสินใจครั้งสุดท้ายนี้ด้วยเช่นกัน", "ระหว่างการประชุม Semafor’s Silicon Valley and the World ในวันนี้ Bezos ได้กล่าวว่าเขามีส่วนร่วมอย่างมากในกระบวนการคัดเลือกนักแสดงที่จะมารับบท 007 คนล่าสุด โดยระบุว่า 'เราดำเนินกระบวนการที่เข้มงวดมากและได้ข้อสรุปการตัดสินใจครั้งสุดท้ายเมื่อวันศุกร์ที่ผ่านมา ในช่วงแรกมีกลุ่มนักแสดงจำนวนมาก ก่อนที่เราจะคัดเลือกจนเหลือผู้เข้ารอบสุดท้าย 5 คน'", "Bezos อธิบายถึงขั้นตอนการคัดเลือกต่อว่า 'จากนั้นเราได้ทำการทดสอบหน้ากล้องแบบดั้งเดิมกับผู้เข้ารอบสุดท้ายทั้ง 5 คน ซึ่งน่าสนใจมาก เพราะเราใช้เครื่องแต่งกายเต็มรูปแบบ ฉากจริง และนักแสดงสมทบคนอื่นๆ เราถ่ายทำฉากที่แตกต่างกัน 3 ฉากกับผู้เข้ารอบสุดท้ายแต่ละคน จากนั้นเรามารวมตัวกันในวันศุกร์เพื่อใช้เวลาสองสามชั่วโมงในการดูผลการทดสอบหน้ากล้องทั้งหมดและทบทวนรายละเอียด ซึ่งนักแสดงทุกคนล้วนมีความสามารถที่โดดเด่นมาก'", "เขากล่าวเ อาจกระทบต่อความมั่นคงและข้อมูลความลับ", "Nvidia ประกาศรายได้ไตรมาสล่าสุดที่ 1.158 แสนล้านดอลลาร์สหรัฐ ท่ามกลางการเปลี่ยนผ่านผู้นำองค์กรครั้งสำคัญ", "บอร์ดบริหารปฏิเสธการตอบคำถามหรือให้ข้อมูลเพิ่มเติมเกี่ยวกับรายละเอียดการลาออกและการสอบสวน Jensen Huang ในระหว่างการประชุมแถลงผลประกอบการ"], "full_paragraphs": ["Harvey C. Jones ประธานคณะกรรมการบริหารของ Nvidia ได้ออกมาประกาศชัดเจนว่า ทางบริษัทจะไม่มีการตอบคำถามหรือให้ข้อมูลใดๆ เพิ่มเติม 'เกี่ยวกับสถานการณ์การลาออกของ Jensen' ในระหว่างการประชุมแถลงผลประกอบการไตรมาสล่าสุด ซึ่งถือเป็นการประชุมครั้งแรกภายใต้การนำของ Colette Kress ในฐานะซีอีโอรักษาการและ CFO ร่วมกับ Harvey C. Jones ในฐานะประธานบอร์ดคนแรกของบริษัท", "การเปลี่ยนแปลงระดับผู้นำครั้งนี้เกิดขึ้นหลังจาก Jensen Huang ได้ยื่นลาออกเมื่อสัปดาห์ที่ผ่านมา ท่ามกลางรายงานข่าวเรื่องความสัมพันธ์ส่วนตัวหลายกรณี รวมถึงความสัมพันธ์กับ Alice Huang อดีตผู้บริหารของ Megaspeed ซึ่งถูกกล่าวหาว่าเป็นสายลับให้กับจีน และความสัมพันธ์กับพนักงานในสายบังคับบัญชาโดยตรงอย่าง Kimberly Powell โดยขณะนี้ Nvidia กำลังอยู่ในระหว่างการตรวจสอบว่าความสัมพันธ์ของ Huang กับอดีตผู้บริหารรายดังกล่าวส่งผลกระทบต่อความมั่นคงของชาติหรือความลับของบริษัทหรือไม่ นอกจากนี้ Huang ยังมีกำหนดการที่จะต้องเข้าให้การต่อหน้าสภานิติบัญญัติในวันที่ 1 ธันวาคมนี้", "ก่อนหน้าการประชุมแถลงผลประกอบการในวันอังคาร Huang ได้แสดงความจำนงว่าเขาพร้อมที่จะกลับมารับตำแหน่งซีอีโออีกครั้ง อย่างไรก็ตาม ในระหว่างการประชุม Jones ได้กล่าวอย่างชัดเจนว่า 'คณะกรรมการของ Nvidia มีมติเป็นเอกฉันท์ในการยอมรับการลาออกของ Huang และไม่มีเจตนาที่จะแต่งตั้งให้ Jensen กลับมาดำรงตำแหน่งซีอีโออีกครั้ง' พร้อมทั้งย้ำว่าบริษัทจะไม่ตอบคำถามเกี่ยวกับรายละเอียดการลาออกและการสอบสวนที่กำลังดำเนินอยู่ โดยเสริมว่า 'คณะกรรมการกำลังจัดการกับผลกระทบที่เกิดขึ้นกับบริษัทในทันทีอย่างเชิงรุก รวมถึงการยกระดับขีดความสามารถในการกำกับดูแลของเราต่อไปในอนาคต'", "ในรายงานผลประกอบการไตรมาสล่าสุด Nvidia สามารถทำรายได้ไปได้ถึง 1.158 แสนล้านดอลลาร์สหรัฐ ซึ่งเป็นการเติบโตอย่างต่อเนื่องจากอุตสาหกรรม AI ที่กำลังพุ่งทะยาน โดย Jones ได้กล่าวแถลงการณ์ในนามของคณะกรรมการว่า Nvidia เป็นบริษัทที่มีความแข็งแกร่งอย่างยิ่ง ซึ่งความสำเร็จนี้มาจากบุคลากรที่ยอดเยี่ยม เทคโนโลยีที่ล้ำสมัย และผลงานที่ผ่านมาที่พิสูจน์ให้เห็นถึงประสิทธิภาพในการดำเนินงาน", "Jones ระบุถึงเหตุการณ์เมื่อวันที่ 12 พฤศจิกายนว่า 'คณะกรรมการบริษัทได้ประกาศว่า หลังจากมีการเปิดเผยพฤติกรรมส่วนตัวที่ไม่สอดคล้องกับประมวลจริยธรรม มาตรฐาน และบรรทัดฐานทางวัฒนธรรมของบริษัท Jensen Huang ได้ลาออกจากตำแหน่งประธาน ซีอีโอ และกรรมการบริษัทโดยสมัครใจ คณะกรรมการ Nvidia มีมติเป็นเอกฉันท์ยอมรับการลาออกดังกล่าวและไม่มีแผนที่จะให้เขากลับมาดำรงตำแหน่งซีอีโออีกครั้ง โดยได้แต่งตั้ง Colette Kress ซึ่งเป็น CFO ที่ร่วมงานกับบริษัทมาอย่างยาวนานและเป็นที่ยอมรับ ขึ้นเป็นซีอีโอรักษาการ พร้อมทั้งเริ่มกระบวนการสรรหาซีอีโอถาวรโดยได้ว่าจ้างบริษัท Heidrick and Struggles เข้ามาดูแลกระบวนการนี้'", "แม้จะเป็นการเปลี่ยนผ่านที่ไม่คาดคิด แต่ Jones ยืนยันว่าคณะกรรมการได้ดำเนินการอย่างรอบคอบโดยคำนึงถึงผลประโยชน์สูงสุดของพนักงาน ลูกค้า พันธมิตร และผู้ถือหุ้นเป็นสำคัญ นอกจากนี้ บริษัทยังได้จัดตั้ง 'คณะกรรมการกำกับดูแลความมั่นคงแห่งชาติและการควบคุมการส่งออก' (National Security and Export Control Oversight Committee) ซึ่งประกอบด้วยกรรมการอิสระ ที่ปรึกษาภายนอกระดับสูง และที่ปรึกษากฎหมาย เพื่อยกระดับการทำงานร่วมกับรัฐบาลสหรัฐฯ และหน่วยงานที่เกี่ยวข้อง", "ในตอนท้าย Jones ได้กล่าวถึงความเชื่อมั่นในตัว Colette Kress ว่า 'เรามีทีมผู้นำที่มีความสามารถอย่างเหลือเชื่อ และเรามีความเชื่อมั่นอย่างเต็มเปี่ยมในความเป็นผู้นำ ความซื่อสัตย์ และความสามารถของ Colette ในการทำหน้าที่ซีอีโอรักษาการ เธอเป็นหัวใจสำคัญของการเติบโตอย่างก้าวกระโดดของบริษัทตลอด 13 ปีที่ผ่านมา และมีความเข้าใจอย่างลึกซึ้งในธุรกิจ ลูกค้า การดำเนินงาน และสถานะทางการเงินของเรา คณะกรรมการและทีมผู้นำทุกคนยังคงมุ่งมั่นอย่างเต็มที่ในการขับเคลื่อน Nvidia ต่อไป โดยพันธกิจในการสร้างมูลค่าให้กับผู้ถือหุ้น ลูกค้า และพันธมิตรของเรายังคงไม่เปลี่ยนแปลง'"], "link": "https://www.theverge.com/tech/1036160/nvidia-earnings-harvey-c-jones-jensen-huang", "canonical_link": "https://www.theverge.com/tech/1036160/nvidia-earnings-harvey-c-jones-jensen-huang", "cover_image_url": "https://platform.theverge.c 6 • 05:25 น.", "category_hint": "Technology"}, {"id": 1794953742473, "guid": "https://www.theverge.com/?p=1035465", "original_title": "Nvidia says it does not intend to reinstate Jensen Huang as CEO", "thai_title": "Nvidia ยืนยันชัดเจน ไม่มีความตั้งใจดึง Jensen Huang กลับมานั่งเก้าอี้ CEO", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["บอร์ดบริหาร Nvidia ประกาศอย่างเป็นทางการว่าไม่มีแผนที่จะแต่งตั้ง Jensen Huang ให้กลับมาดำรงตำแหน่ง CEO อีกครั้ง", "Jensen Huang เคยโพสต์ข้อความผ่าน X แสดงความพร้อมที่จะกลับมาทำงานหากบอร์ดเห็นว่าจะเป็นประโยชน์ต่อบริษัทและผู้ถือหุ้น", "Huang กำลังเผชิญกับมรสุมข่าวฉาว ทั้งเรื่องความสัมพันธ์ส่วนตัวและข้อกล่าวหาเรื่องการพัวพันกับสายลับต่างชาติ ซึ่งกำลังอยู่ระหว่างการสอบสวนภายใน", "สถานการณ์ของ Nvidia มีความซับซ้อนขึ้นจากการเมืองในสหรัฐฯ และความสัมพันธ์ใกล้ชิดระหว่าง Huang กับอดีตประธานาธิบดี Donald Trump", "นักวิเคราะห์มองว่าแม้จะเกิดความวุ่นวาย แต่ความต้องการ AI Compute Hardware ของ Nvidia ยังคงสูงลิ่วและยากที่คู่แข่งจะเข้ามาแทนที่ได้ในระยะสั้น"], "full_paragraphs": ["ในการเริ่มต้นการประชุมรายงานผลประกอบการรายไตรมาสของ Nvidia เมื่อวันอังคารที่ผ่านมา Harvey Jones ประธานบอร์ดบริหารคนใหม่ได้กล่าวถึงกรณีการลาออกของอดีต CEO Jensen Huang ว่า “บอร์ดบริหารของ Nvidia ได้ยอมรับการลาออกของเขาอย่างเป็นเอกฉันท์ และไม่มีความตั้งใจที่จะแต่งตั้ง Jensen ให้กลับมาดำรงตำแหน่ง CEO อีกครั้ง”", "Jones กล่าวเสริมว่า “เราจะไม่ตอบคำถามหรือหารือใดๆ ในการประชุมวันนี้ เกี่ยวกับสถานการณ์เบื้องหลังการลาออกของ Jensen รวมถึงการสอบสวนที่กำลังดำเนินอยู่ในขณะนี้”", "ก่อนหน้านี้ในวันเดียวกัน Huang ได้แสดงท่าทีผ่านสื่อสังคมออนไลน์ X โดยระบุว่าเขา “ไม่ได้ปฏิบัติตามมาตรฐานที่คาดหวังจากทุกคน” ในบริษัท และรู้สึกเสียใจกับความผิดพลาดที่เกิดขึ้น พร้อมยืนยันว่าจะให้ความร่วมมือกับการสอบสวนของบอร์ดบริหารอย่างเต็มที่ นอกจากนี้เขายังระบุว่ายินดีที่จะกลับมารับตำแหน่ง CEO หากได้รับข้อเสนอ แม้ว่าก่อนหน้านั้นหนึ่งวันจะมีรายงานว่าบอร์ดบริหารของ Nvidia ไม่ได้พิจารณาเรื่องการดึงตัวเขากลับมาก็ตาม โดย Huang ระบุว่า “Nvidia เป็นบริษัทที่เกิดขึ้นเพียงครั้งเดียวในรอบชั่วอายุคน หากคณะกรรมการบริษัทตัดสินใจว่าการกลับมาของผมเป็นประโยชน์สูงสุดต่อผู้ถือหุ้น พนักงาน บริษัท และประเทศชาติ ผมก็พร้อมที่จะตอบรับและกลับมาดำรงตำแหน่ง CEO อีกครั้ง”", "อย่างไรก็ตาม นับตั้งแต่การลาออกเมื่อวันที่ 12 พฤศจิกายนที่ผ่านมา Huang ยังคงติดหล่มอยู่ในข่าวฉาว โดยมีรายงานว่าเขามีความสัมพันธ์เชิงชู้สาว 3 ครั้ง ซึ่ง 2 ครั้งเป็นพนักงานภายใต้บังคับบัญชาที่ Nvidia และอีก 1 ครั้งเกี่ยวข้องกับบุคคลที่ถูกกล่าวหาว่าเป็นสายลับของหน่วยข่าวกรองจีน ซึ่งถูกสงสัยว่ามีส่วนช่วยอำนวยความสะดวกในการขายชิปอย่างผิดกฎหมาย (ทั้งที่ Huang เคยพยายามผลักดันให้ยกเลิกข้อจำกัดการขายชิปของ Nvidia ในจีน) โดยเขามีกำหนดการที่จะต้องเข้าให้การต่อรัฐสภาในวันที่ 1 ธันวาคมนี้ ขณะที่การสอบสวนภายในบริษัทก็ยังคงดำเนินอยู่", "แม้จะมีข่าวฉาว แต่บุคคลสำคัญในอุตสาหกรรมเทคโนโลยีหลายรายยังคงแสดงจุดยืนสนับสนุน Huang โดยยกย่องว่าเขาเป็นบุคคลที่ “หาใครมาแทนไม่ได้” และมีการล่ารายชื่อเพื่อเรียกร้องให้เขากลับมา บางส่วนตั้งข้อสงสัยเกี่ยวกับข้อกล่าวหาที่ว่า Alice Huang (ไม่มีความเกี่ยวข้องทางสายเลือด) เป็นสายลับให้กับจีน โดยมองว่าข่าวรั่วไหลเกี่ยวกับความสัมพันธ์ของทั้งคู่เป็นทฤษฎีสมคบคิดเพื่อทำลายอดีต CEO รายนี้ นอกจากนี้ Donald Trump อดีตประธานาธิบดีสหรัฐฯ ซึ่งเป็นพันธมิตรใกล้ชิดของ Huang ในช่วงปีที่ผ่านมา ก็ได้ออกมาสนับสนุนเช่นกัน โดยเมื่อวันจันทร์ที่ผ่านมา Trump กล่าวว่าเขา “ไม่ขัดข้อง” หาก Huang จะกลับมา พร้อมเสริมว่า “ผมคิดว่าเขาได้รับบทเรียนครั้งใหญ่แล้ว ผมเดาว่าบางทีบทเรียนหนึ่งอาจสำคัญกว่าอีกบทเรียนหนึ่ง”", "ความใกล้ชิดระหว่าง Trump และ Huang อาจสร้างความซับซ้อนให้กับ Nvidia ได้เช่นกัน เนื่องจากบริษัทได้เพิ่มงบประมาณการล็อบบี้ในกรุงวอชิงตัน ดี.ซี. โดยใช้เงินไปถึง 5 ล้านดอลลาร์ในปี 2025 และอีก 4.7 ล้านดอลลาร์ในปี 2026 อย่างไรก็ตาม ในขณะที่พรรคเดโมแครตเตรียมตัวเข้าควบคุมรัฐสภา พวกเขามีแผนที่จะตรวจสอบความสัมพันธ์ระหว่าง Trump กับบริษัทเทคโนโลยีขนาดใหญ่และอุตสาหกรรมอื่นๆ โดยอ้างถึงความเป็นไปได้ของการทุจริต Brendan Glavin ผู้อำนวยการฝ่ายข้อมูลเชิงลึกของ OpenSecrets กล่าวกับ The Verge เมื่อสัปดาห์ที่แล้วว่า “การเลือกตั้งครั้งนี้ไม่ได้ส่งผลบวกต่อ AI มากนัก และข่าวการลาออกของ Huang จะยิ่งทำให้สถานการณ์ซับซ้อนขึ้น โดยเฉพาะสำหรับบร  Kress รักษาการซีอีโอ ยืนยันความสำเร็จของชิปสถาปัตยกรรม Vera Rubin และความมั่นคงของแผนงานในอนาคต", "การประกาศผลประกอบการครั้งนี้เกิดขึ้นโดยไม่มีการกล่าวถึง Jensen Huang อดีตซีอีโอในช่วงเริ่มต้นของการแถลง"], "full_paragraphs": ["รายได้ในไตรมาสที่ 3 ของ Nvidia เพิ่มขึ้นมากกว่าสองเท่า โดยได้รับแรงหนุนสำคัญจากรายได้ในกลุ่ม Data Center ที่เติบโตขึ้นถึง 110 เปอร์เซ็นต์เมื่อเทียบกับปีที่แล้ว คิดเป็นมูลค่าสูงถึง 1.076 แสนล้านดอลลาร์", "Colette Kress รักษาการประธานเจ้าหน้าที่บริหาร (Interim CEO) ของ Nvidia ได้ประกาศผลประกอบการไตรมาสที่ 3 เมื่อวันอังคารที่ผ่านมา โดยในช่วงเริ่มต้นของการแถลงการณ์นั้นไม่ได้มีการกล่าวถึง Jensen Huang อดีตซีอีโอของบริษัทแต่อย่างใด แม้ว่าประเด็นดังกล่าวอาจจะถูกหยิบยกขึ้นมาพูดคุยเมื่อนักวิเคราะห์เริ่มเข้าสู่ช่วงการประชุมทางโทรศัพท์เพื่อสอบถามเกี่ยวกับผลประกอบการในภายหลังก็ตาม", "บริษัทรายงานรายได้รวมอยู่ที่ 1.158 แสนล้านดอลลาร์ เพิ่มขึ้น 103 เปอร์เซ็นต์เมื่อเทียบกับช่วงเดียวกันของปีก่อน โดยในจำนวนนี้รวมถึงรายได้จากกลุ่ม Data Center ที่ 1.076 แสนล้านดอลลาร์ ซึ่งเติบโตขึ้น 110 เปอร์เซ็นต์เมื่อเทียบกับปีที่แล้ว นอกจากนี้ Nvidia ยังสามารถทำกำไรสุทธิได้ถึง 6.53 หมื่นล้านดอลลาร์ ซึ่งถือเป็นสถิติใหม่สูงสุดของบริษัท", "“โมเมนตัมของเราเป็นเรื่องจริง NVIDIA เป็นผู้นำด้านเทคโนโลยีที่โดดเด่น ซึ่งขับเคลื่อนด้วยนวัตกรรมที่ไม่หยุดยั้งของบุคลากรของเรา” Colette Kress รักษาการซีอีโอ รองประธานบริหาร และประธานเจ้าหน้าที่ฝ่ายการเงินของ NVIDIA กล่าว “Vera Rubin เริ่มต้นได้อย่างร้อนแรง แผนงานของเรายังคงดำเนินไปตามกำหนดการ และความมุ่งมั่นของเราไม่เคยยิ่งใหญ่ไปกว่านี้มาก่อน”"], "link": "https://www.theverge.com/tech/1036032/nvidia-q3-2027-jensen-huang", "canonical_link": "https://www.theverge.com/tech/1036032/nvidia-q3-2027-jensen-huang", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25835739/STKP210_JENSEN_HUANG_B.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/23954700/acastro_STK080_disneyPlus_01.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2227026671.jpg?quality=90&strip=all&crop=16.669921875%2C0%2C66.66015625%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2271211363.jpg?quality=90&strip=all&crop=16.730182926829%2C0%2C66.539634146341%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794951659, "published_at": "2026-11-17T21:40:59Z", "published_th": "18 พ.ย. 2026 • 04:40 น.", "category_hint": "Technology"}, {"id": 1794950134648, "guid": "https://www.theverge.com/?p=1035957", "original_title": "Not even Sam Altman is safe from AI deepfakes on Instagram", "thai_title": "แม้แต่ Sam Altman ก็ไม่รอด: เมื่อผู้บริหาร Meta ใช้ AI Deepfake ล้อเลียนคู่แข่งบน Instagram", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Alexandr Wang ประธานเจ้าหน้าที่ฝ่าย AI ของ Meta โพสต์คลิปวิดีโอ Deepfake ล้อเลียน Sam Altman ซีอีโอของ OpenAI ลงบน Instagram", "คลิปดังกล่าวเป็นส่วนหนึ่งของการโปรโมต Muse ซึ่งเป็น AI Agent ของ Meta โดยแสดงภาพ Altman ในชุดมาสคอตขนฟู", "Meta ยืนยันว่าโพสต์ของ Wang ไม่ผิดกฎ เนื่องจากมีการติดป้ายกำกับว่าเป็นเนื้อหาที่สร้างโดย AI อย่างชัดเจน", "ประเด็นเรื่อง Deepfake กำลังเป็นที่วิพากษ์วิจารณ์อย่างหนัก โดยเฉพาะกรณีภาพ AI ของนักแสดง Mia Goth ที่ไม่มีการติดป้ายกำกับและถูกแชร์โดยบัญชีที่ผ่านการยืนยันตัวตน", "นโยบายของ Meta ยังคงมีความแตกต่างระหว่างวิดีโอที่ต้องติดป้ายกำกับ กับภาพนิ่งที่ไม่มีข้อบังคับดังกล่าว"], "full_paragraphs": ["Instagram กำลังเต็มไปด้วยเนื้อหาประเภท Deepfake ที่สร้างโดย AI ซึ่งล่าสุดรวมถึงเนื้อหาที่มาจากหนึ่งในผู้บริหารระดับสูงของ Meta เองด้วย", "เมื่อช่วงต้นเดือนพฤศจิกายนที่ผ่านมา Alexandr Wang ประธานเจ้าหน้าที่ฝ่าย AI ของ Meta ได้แชร์คลิปวิดีโอสั้นเพื่อโปรโมต Muse ซึ่งเป็น AI Agent สำหรับผู้บริโภคของบริษัท ในคลิปที่สร้างขึ้นโดย AI นี้ Wang, Mark Zuckerberg ซีอีโอของ Meta, Sam Altman ซีอีโอของ OpenAI และ Jolly มาสคอตตัวการ์ตูนของ Muse กำลังวิดีโอคอลคุยกันสี่สาย โดยเมื่อ Altman ปรากฏตัวในสาย เขากลับแต่งกายด้วยชุดมาสคอตขนฟูและเพนต์หน้าให้เหมือนกับตัวละคร Jolly พร้อมคำบรรยายใต้คลิปว่า “When the homies meet about openai product strategy” ซึ่งเป็นการล้อเลียนการแข่งขันในตลาด AI Agent และความนิยมของ Muse ในขณะนี้", "ย้อนกลับไปเพียงไม่กี่ปี เนื้อหา AI ที่นำเสนอภาพบุคคลจริงมักนำไปสู่การวิพากษ์วิจารณ์อย่างรุนแรงจากสาธารณชน โดยมีการประณามการใช้เทคโนโลยีเพื่อเลียนแบบมนุษย์ และในบางกรณีถึงขั้นมีการขู่ว่าจะดำเนินคดีทางกฎหมาย แต่ในปัจจุบัน เนื้อหา AI ได้กลายเป็นส่วนหนึ่งของความเป็นจริงใหม่ โดยเฉพาะบนโซเชียลมีเดีย ตัวอย่างเช่น ในช่วงก่อนการเลือกตั้งกลางเทอม กลุ่มการเมืองได้ทุ่มเงินหลายล้านดอลลาร์ไปกับการซื้อโฆษณาที่สร้างโดย AI เพื่อโจมตีคู่แข่ง", "Wang ได้ทำสิ่งที่หลายคนเรียกว่า “Anti-PR” เพื่อโปรโมต Muse โดยเขาทวีตข้อความหลายร้อยครั้งและเรียกนักการตลาดแบบดั้งเดิมว่า “corposlops” อย่างไรก็ตาม การที่ผู้บริหารระดับสูงของบริษัทเทคโนโลยีรายใหญ่โพสต์วิดีโอ AI ของคู่แข่งถือเป็นเรื่องที่น่าจับตามอง โดยเฉพาะบนแพลตฟอร์มที่เพิ่งถูกวิพากษ์วิจารณ์อย่างหนักเกี่ยวกับเนื้อหาที่สร้างโดย AI หลังจากภาพ AI ของนักแสดงสาว Mia Goth กลายเป็นกระแสในเดือนตุลาคม ตัวแทนของนักแสดงจากเรื่อง Pearl ได้กล่าวกับ The Verge ว่า “เป็นเรื่องที่ไม่สามารถเข้าใจได้” ที่ Instagram ปล่อยให้ภาพดังกล่าวแพร่กระจาย แทนที่จะมุ่งเน้นไปที่ “การปกป้องและความสมบูรณ์ของภาพลักษณ์ของบุคคลสาธารณะ”", "นอกจากนี้ยังมีคนดังคนอื่นๆ รวมถึง Scarlett Johansson ที่ตกเป็นเป้าหมายของภาพ AI ที่มีเนื้อหาทางเพศอยู่บ่อยครั้ง ซึ่งที่ผ่านมา Meta ได้ลบหลายบัญชีที่พบว่ามีการสวมรอยเป็นบุคคลอื่นและใช้ภาพลักษณ์ของพวกเขา", "Meta มีข้อกำหนดว่าวิดีโอที่สร้างโดย AI ซึ่งแสดงภาพบุคคลจะต้องมีการติดป้ายกำกับว่าเป็น AI เช่นเดียวกับโพสต์ของ Wang อย่างไรก็ตาม ภาพนิ่งไม่มีข้อกำหนดดังกล่าว ซึ่งหมายความว่าภาพ AI ของ Goth ไม่มีการเปิดเผยข้อมูลใดๆ ยิ่งไปกว่านั้น ภาพดังกล่าวยังถูกแชร์โดยบัญชีแฟนคลับที่มีเครื่องหมายยืนยันตัวตน (Blue Badge) ที่ออกโดย Instagram อีกด้วย", "เมื่อสอบถามไปยัง Meta ทางโฆษก Tracy Clayton ได้ตั้งข้อสังเกตว่าโพสต์ของ Wang มีการติดป้ายกำกับว่าเป็นเนื้อหา AI แล้ว นอกจากนี้ Clayton ยังชี้ให้เห็นว่า Altman เองก็ได้เปิดให้มีการนำภาพลักษณ์ของเขาไปใช้สร้างเนื้อหา AI ได้ เช่น ในตอนที่ OpenAI เปิดตัวแอป Sora (ซึ่งในขณะนั้นก็เต็มไปด้วยวิดีโอปลอมของ Altman อย่างรวดเร็ว) ทั้งนี้ OpenAI ไม่ได้ตอบกลับคำขอแสดงความคิดเห็นในเรื่องนี้"], "link": "https://www.theverge.com/news/1035957/meta-alexandr-wang-sam-altman-instagram-ai-deepfake", "canonical_link": "https://www.theverge.com/news/1035957/meta-alexandr-wang-sam-altman-instagram-ai-deepfake", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2297785644.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794949255, "published_at": "2026-11-17T21:00:55Z", "published_th": "18 พ.ย. 2026 • 04:00 น.", "category_hint": "Technology"}, {"id": 1794948333965, "guid": "https://www.theverge.com/?p=1035869", "original_title": "Democrats try to figure out how not to get swept away by the blue wave", "thai_title": "พรรคเดโมแครตเร่งปรับทัพหลังคว้าชัยถล่มทลาย มุ่งเน้นแก้ปัญหาปากท้องและคุมเข้ม AI", "tag": "Technology", "sub_tag": "POLICY", "bullet_points": ["กลุ่มเดโมแครตสายกลางจัดงานประชุม 'What’s Next' ในเดนเวอร์ เพื่อวางแนวทางบริหารประเทศหลังได้รับชัยชนะในการเลือกตั้งกลางเทอม", "พรรคเดโมแครตปรับกลยุทธ์ใหม่โดยหันมาให้ความสำคัญกับปัญหาเศรษฐกิจและค่าครองชีพ แทนที่การเมืองเชิงอัตลักษณ์แบบเดิม", "มีการถกเถียงเรื่องการกำกับดูแล AI อย่างจริงจัง โดย สว. Elissa Slotkin เสนอให้ตั้งคณะกรรมาธิการร่วมเพื่อควบคุมเทคโนโลยี AI ให้เหมือนกับการกำกับดูแลพลังงานนิวเคลียร์", "แม้จะประกาศความเป็นเอกภาพ แต่ภายในงานยังคงมีความขัดแย้งแฝงอยู่ ทั้งเรื่องอิทธิพลของกลุ่มทุนใหญ่ในพรรค และความเห็นต่างระหว่างกลุ่มก้าวหน้ากับกลุ่มสายกลาง", "ผลสำรวจจากกลุ่ม Tomorrow Together ชี้ว่าผู้มีสิทธิเลือกตั้งเริ่มมีความกังวลต่อ AI และมองว่าบริษัทเทคโนโลยีไม่สามารถกำกับดูแลตนเองได้"], "full_paragraphs": ["ณ สนามบินนานาชาติเดนเวอร์ ในช่วงบ่ายวันเสาร์ที่แสนวุ่นวาย ผมมีโอกาสได้นั่งอยู่ใกล้กับนายกเทศมนตรีเมืองมินนิอาโพลิส Jacob Frey ซึ่งเพิ่งเดินทางกลับจากงานประชุม 'What’s Next' ที่จัดโดยกลุ่ม Majority Democrats ซึ่งเป็นกลุ่มที่มุ่งเน้นการกำหนดทิศทางใหม่ให้กับพรรคเดโมแครตที่เพิ่งคว้าชัยชนะมาได้อย่างน่าประหลาดใจ", "Frey ซึ่งเป็นที่รู้จักในระดับประเทศจากเหตุการณ์ Operation Metro Surge ของ ICE ได้เดินทางมาร่วมงานเพื่อรับฟังมากกว่าที่จะขึ้นพูด โดยเขากล่าวว่า 'ผมไม่เคยมางานแบบนี้มาก่อน' และหวังว่าพรรคเดโมแครตจะทำสองสิ่งด้วยอำนาจที่มีอยู่ในมือคือ 'หนึ่ง ต้องดำเนินการด้วยความเร่งด่วน และสอง อย่าทำมันพัง' ซึ่งผู้เข้าร่วมงานคนอื่นต่างเห็นพ้องด้วยอย่างหนักแน่น", "พรรคเดโมแครตดูเหมือนจะเรียนรู้จากความผิดพลาดของพรรครีพับลิกันในปี 2024 โดยมองว่าชัยชนะครั้งนี้ไม่ได้เกิดจากกระแสสังคมหรือประเด็น DEI แต่เกิดจากปัญหาเศรษฐกิจที่รุมเร้า ผู้มีสิทธิเลือกตั้งปฏิเสธศูนย์ข้อมูล (Data Centers) และสงคราม โดยหันไปเลือกฝ่ายที่สัญญาว่าจะตอบโจทย์ความต้องการพื้นฐานในการดำรงชีวิต ซึ่งเป็นเรื่องของราคาน้ำมันและค่าอาหารเป็นหลัก", "Majority Democrats วางตัวเป็นทางเลือกใหม่แทนที่กลุ่มการเมืองเดิมที่ไร้ประสิทธิภาพ ทั้งกลุ่มผู้มีอำนาจสูงวัย กลุ่มนักเคลื่อนไหวฝ่ายซ้าย และกลุ่ม MAGA ฝ่ายขวา โดยพรรคต้องการสื่อสารว่าพวกเขาเปลี่ยนไปแล้ว ไม่ใช่พรรคที่เน้นการเมืองเชิงอัตลักษณ์แบบเดิม แต่เน้นเรื่องความสามารถในการจ่าย (Affordability) อย่างจริงจัง", "บรรยากาศภายในงานเต็มไปด้วยสัญลักษณ์ที่สะท้อนถึงความพยายามในการเข้าถึงคนรุ่นใหม่ มีการจำหน่ายเสื้อผ้าและหมวกที่มีข้อความเชิงเสียดสีและเรียกร้องให้มีการจัดการเรื่องภาษี รวมถึงคำถามเชิงปรัชญาเกี่ยวกับบทบาทของหุ่นยนต์และ AI ในโลกการทำงาน ซึ่งสะท้อนถึงความพยายามในการสร้างภาพลักษณ์ใหม่ของพรรค", "อย่างไรก็ตาม ภาพลักษณ์ของความสามัคคีถูกทำลายลงเมื่อกลุ่มผู้ประท้วงตะโกนขัดจังหวะการปราศรัยของ Hakeem Jeffries ว่าที่ประธานสภาผู้แทนราษฎร โดยเรียกร้องให้มีการผลักดัน Green New Deal และการคว่ำบาตรอาวุธ ซึ่ง Jeffries ตอบโต้ด้วยความใจเย็นว่า 'ผมมาจากบรูคลิน เรื่องแค่นี้ถือว่าเบามาก' ก่อนที่การสัมภาษณ์จะดำเนินต่อไป", "สว. Elissa Slotkin จากมิชิแกนกล่าวถึงความเห็นต่างภายในพรรคว่า แม้เธอและว่าที่ สว. Abdul El-Sayed จะมีความเห็นไม่ตรงกันในหลายเรื่อง แต่ทั้งคู่เห็นพ้องในประเด็นสำคัญคือการสร้างชนชั้นกลางให้เข้มแข็ง 'เมื่อผมเห็นเจ้าหน้าที่ที่ได้รับเลือกใช้เวลาไปกับการต่อสู้ระหว่างฝ่ายก้าวหน้ากับฝ่ายสายกลาง ผมรู้เลยว่าคนนั้นไม่ได้เรียนรู้อะไรเลยจากการเลือกตั้งครั้งนี้'", "Lis Smith ที่ปรึกษาของ Majority Democrats ระบุว่าชัยชนะครั้งนี้ไม่ใช่สัญญาณว่าผู้มีสิทธิเลือกตั้งชอบสไตล์การเมืองแบบใดแบบหนึ่ง แต่เป็นเพราะไม่มีวิธีเดียวที่จะเป็นเดโมแครตได้ ซึ่งเป็นกุญแจสำคัญสู่ชัยชนะครั้งใหญ่ แต่ก็ยังมีคำถามทิ้งท้ายว่า เมื่อถึงเวลาต้องบริหารประเทศจริงๆ พรรคจะยังคงรักษาความเป็นเอกภาพนี้ไว้ได้หรือไม่", "ความตึงเครียดภายในงานยังคงมีอยู่ ทั้งการท้าชิงตำแหน่งผู้นำเสียงข้างมากในวุฒิสภาของ สว. Chris Van Hollen ต่อ สว. Chuck Schumer รวมถึงประเด็นที่งานประชุมได้รับเงินสนับสนุนจาก Stephen Mandel มหาเศรษฐีนักลงทุนในกลุ่ม AI ซึ่งขัดกับวาทกรรมเรื่องการนำ 'เงินก้อนโต' ออกจากการเมือง", "Ro Khanna สส. จากซิลิคอนวัลเลย์กล่าวบนเวทีว่า เขาต้องการพรรคที่เปิดกว้างแต่ต้องไม่ตื้นเขิน โดยเรียกร้องให้สภาที่เดโมแครตครองเสียงข้างมากผลักดันนโยบาย Medicare for All, การให้สัญชาติแก่ผู้อพยพ, การยุบ ICE และการตัดงบประมาณช่วยเหลืออิสราเอล ซึ่งได้รับเสียงเชียร์อย่างล้นหลามจากผู้เข้าร่วมงาน", "ในขณะเดียวกัน มีการจัดงาน 'AI safety breakfast' ซึ่งผู้เชี่ยวชาญด้านการกำกับดูแลเทคโนโลยีตั้งข้อสังเกตว่า งานนี้เป็นส่วนหนึ่งของความพยายามในการปรับภาพลักษณ์ของกลุ่มที่สนับสนุนการกำกับดูแล AI โดยมองว่าผู้มีสิทธิเลือกตั้งเริ่มไม่พอใจกับผลกระทบของศูนย์ข้อมูลและ AI ที่ส่งผลต่อค่าสาธารณูปโภคและตลาดแรงงาน", "สว. Slotkin ได้เรียกร้องให้มีการจัดตั้งคณะกรรมาธิการร่วมสองสภาเพื่อกำกับดูแล AI โดยเปรียบเทียบกับหน่วยงานที่เคยกำกับดูแลพลังงานนิวเคลียร์ในอดีต โดยเธอกล่าวว่า 'ในขณะที่เรามัวแต่ทะเลาะกันเองระหว่างเดโมแครตและรีพับลิกัน เรากำลังเสียโอกาส และเรายังไม่ได้ทำในสิ่งที่จำเป็นต้องทำเกี่ยวกับ AI'", "Rob Flaherty ผู้ร่วมก่อตั้งกลุ่ม Tomorrow Together ระบุว่าผลสำรวจชี้ให้เห็นว่าผู้มีสิทธิเลือกตั้งไม่เชื่อมั่นว่าบริษัทเทคโนโลยีจะสามารถกำกับดูแลตนเองได้ และพรรคเดโมแครตมีหน้าที่ในการเปลี่ยนความโกรธแค้นของประชาชนให้กลายเป็นการกระทำที่ช่วยบรรเทาความเจ็บปวดที่พวกเขาได้รับ", "ในช่วงท้ายของการประชุม ผมได้พบกับ Uriel Espinoza ผู้มีสิทธิเลือกตั้งสายกลางที่นิยามตนเองว่าเป็นผู้ประกอบการ เขาต้องการเห็นการปฏิ full_paragraphs": ["ดูเหมือนว่า Logitech K400 จะเจอคู่แข่งที่สมน้ำสมเนื้อเข้าให้แล้ว", "Framework ได้ประกาศเปิดตัว Wireless Touchpad Keyboard ไปเมื่อช่วงต้นปีที่ผ่านมา โดยมีเป้าหมายเพื่อมอบประสบการณ์การใช้งานคีย์บอร์ดบนโซฟาที่เหนือกว่า Logitech K400 ซึ่งจากการที่ Sean Hollister จาก The Verge ได้ทดลองใช้งานจริงเมื่อเดือนเมษายนที่ผ่านมา พบว่าบริษัทสามารถทำตามเป้าหมายที่วางไว้ได้สำเร็จ แต่แน่นอนว่าผู้ใช้งานจะต้องจ่ายในราคาที่สูงกว่าผลิตภัณฑ์ของ Logitech", "ในขณะที่คีย์บอร์ดสำหรับใช้งานบนโซฟาอย่าง K400 มีราคาอยู่ที่ 35 ดอลลาร์สหรัฐ แต่ Framework Wireless Touchpad Keyboard มีราคาอยู่ที่ 99 ดอลลาร์สหรัฐ โดยต้องวางเงินมัดจำที่ขอคืนได้เต็มจำนวนจำนวน 50 ดอลลาร์สหรัฐเพื่อสั่งซื้อล่วงหน้าตั้งแต่วันนี้เป็นต้นไป ซึ่งแม้จะมีราคาสูงกว่าคู่แข่งเกือบสามเท่า แต่ด้วยการอัปเกรดและประสิทธิภาพที่เหนือกว่า ก็อาจทำให้คีย์บอร์ดรุ่นนี้คุ้มค่ากับราคาที่ต้องจ่ายเพิ่ม", "แทนที่จะเริ่มต้นออกแบบใหม่ทั้งหมด Framework เลือกใช้โมดูลคีย์บอร์ดแบบเดียวกับที่พบใน Laptop 12 ของบริษัท จับคู่กับทัชแพดความละเอียดสูงระดับ 120Hz และคอนโทรลเลอร์ตัวเดียวกับที่ใช้ในคอมพิวเตอร์ทุกรุ่นของบริษัท โดยการเชื่อมต่อผ่าน Bluetooth เป็นวิธีที่ง่ายที่สุดในการจับคู่คีย์บอร์ดกับพีซีที่รัน Windows, Linux หรือ macOS รวมถึงอุปกรณ์พกพา คอนโซลเกม และกล่องสตรีมมิ่งต่างๆ ผู้ใช้สามารถสลับการเชื่อมต่อระหว่างอุปกรณ์ไร้สายได้สูงสุด 4 เครื่องด้วยการกดปุ่มเพียงครั้งเดียว รวมถึงการเชื่อมต่อผ่าน USB receiver ที่ให้มาในชุด และหากต้องการการตอบสนองที่รวดเร็วยิ่งขึ้น ก็สามารถเชื่อมต่อกับอุปกรณ์ผ่านสาย USB-C ได้เช่นกัน", "สำหรับการใช้งานแบตเตอรี่ขนาด 1,200mAh ที่สามารถถอดเปลี่ยนได้นั้น Framework ระบุว่าคีย์บอร์ดจะสามารถใช้งานได้นานกว่าหนึ่งปีหากมีการใช้งานเป็นครั้งคราว แต่หากคุณใช้งานบนโต๊ะทำงานเป็นเวลาหลายชั่วโมงทุกวัน บริษัทคาดการณ์ว่าอายุการใช้งานแบตเตอรี่จะอยู่ที่ประมาณหนึ่งเดือนกว่าๆ นอกจากนี้ เพื่อรองรับการปรับแต่งและการตั้งค่าปุ่มกดใหม่ (Remapping) ตัวคีย์บอร์ดจึงมาพร้อมกับเฟิร์มแวร์แบบ Open-source ที่พัฒนาต่อยอดมาจาก ZMK"], "link": "https://www.theverge.com/tech/1035805/framework-wireless-touchpad-keyboard-preorder-open", "canonical_lin jpg?quality=90&strip=all&crop=5.9486979166667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/04/rev-1-GRC-14350_High_Res_JPEG.jpeg?quality=90&strip=all&crop=20.785055568692%2C0%2C58.429888862615%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/06/Amazon-Fire-TV-Stick-4K-Lifestyle-Press-Image.jpg?quality=90&strip=all&crop=16.689189189189%2C0%2C66.621621621622%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794943150, "published_at": "2026-11-17T19:19:10Z", "published_th": "18 พ.ย. 2026 • 02:19 น.", "category_hint": "Technology"}, {"id": 1794942063313, "guid": "https://www.theverge.com/?p=1035756", "original_title": "Google’s Spark AI agent becomes ‘Tasks’ — and now it’s free", "thai_title": "Google รีแบรนด์ Spark AI เป็น 'Tasks' พร้อมเปิดให้ใช้งานฟรีและอัปเกรดขีดความสามารถใหม่", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Google เปลี่ยนชื่อ Spark AI agent เป็น 'Tasks' และเปิดให้ผู้ใช้งานทั่วไปเข้าถึงได้ฟรี", "ขับเคลื่อนด้วยโมเดล Gemini 4 Hydrogen รองรับการจัดการตารางเวลา วางแผนมื้ออาหาร และตรวจสอบอีเมลเพื่อหาค่าใช้จ่ายซ้ำซ้อน", "ผู้ใช้ในสหรัฐฯ สามารถสั่งให้ AI โทรติดต่อร้านค้าเพื่อเช็คราคาและสต็อกสินค้า รวมถึงซื้อของผ่าน Google Pay ได้", "เน้นความปลอดภัยด้วยการประมวลผลใน Virtual Machine แบบแยกส่วน (Hardware-isolated) และต้องได้รับอนุญาตจากผู้ใช้ก่อนทำธุรกรรมที่ละเอียดอ่อน"], "full_paragraphs": ["Google ได้ประกาศรีแบรนด์ Spark AI agent ของบริษัทใหม่ภายใต้ชื่อ 'Tasks' พร้อมทั้งเปิดให้ผู้ใช้งานทั่วไปสามารถเข้าถึงฟีเจอร์นี้ได้โดยไม่มีค่าใช้จ่าย โดยฟีเจอร์ดังกล่าวขับเคลื่อนด้วยโมเดล AI รุ่นใหม่ล่าสุดอย่าง Gemini 4 Hydrogen ซึ่งมีความสามารถในการจัดการงานต่างๆ อาทิ การสร้างแผนมื้ออาหาร การบริหารจัดการปฏิทินนัดหมาย รวมถึงการค้นหาข้อมูลในอีเมลเพื่อตรวจสอบค่าใช้จ่ายที่เกิดขึ้นเป็นประจำซึ่งผู้ใช้อาจไม่จำเป็นต้องใช้งานอีกต่อไป", "สำหรับผู้ใช้งานในสหรัฐอเมริกา จะได้รับสิทธิ์เข้าถึงฟีเจอร์เพิ่มเติมที่มีความซับซ้อนยิ่งขึ้น รวมถึงความสามารถในการให้ AI agent โทรติดต่อธุรกิจหรือร้านค้าต่างๆ เพื่อเปรียบเทียบราคาสินค้าและตรวจสอบสถานะสินค้าคงคลัง นอกจากนี้ยังสามารถทำรายการสั่งซื้อสินค้าผ่าน Google Pay และลงชื่อเข้าใช้บัญชีต่างๆ ที่รองรับ Google Password Manager ได้อีกด้วย โดยผู้ใช้ในสหรัฐฯ สามารถมอบหมายงานให้ Gemini ได้ง่ายๆ ผ่านการส่งอีเมลไปที่ gemini@google.com หรือส่งข้อความ (Text) ไปยังช่องทางดังกล่าว", "Tasks ใน Gemini ถือเป็นหนึ่งในฟีเจอร์ Agentic AI จำนวนมากที่ทยอยเปิดตัวออกมาในช่วงปีที่ผ่านมา เช่นเดียวกับ Claude Duet ของ Anthropic, Dots ของ OpenAI และ Muse ของ Meta ซึ่ง Google ได้ให้ข้อมูลเพิ่มเติมเกี่ยวกับความปลอดภัยว่า Gemini จะดำเนินการงานต่างๆ ภายใน 'Hardware-isolated virtual machine ที่ถูกจัดสรรไว้สำหรับบัญชีของคุณโดยเฉพาะ และไม่มีการแชร์ข้อมูลร่วมกับผู้ใช้งานรายอื่น'", "นอกจากนี้ ผู้ใช้ยังสามารถให้คำแนะนำหรือคำสั่งเพิ่มเติมแก่ Gemini ในระหว่างที่ AI กำลังดำเนินการตามงานที่ได้รับมอบหมายได้อีกด้วย และในกรณีที่ต้องดำเนินการกับงานที่มีความละเอียดอ่อนสูง เช่น การสั่งซื้อสินค้าผ่านระบบออนไลน์ ระบบจะหยุดการทำงานชั่วคราวเพื่อขอการยืนยันและอนุญาตจากผู้ใช้งานก่อนที่จะดำเนินการในขั้นตอนถัดไปให้เสร็จสมบูรณ์"], "link": "https://www.theverge.com/tech/1035756/google-spark-ai-tasks-free", "canonical_link": "https://www.theverge.com/tech/1035756/google-spark-ai-tasks-free", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Tasks-in-Gemini.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794941881, "published_at": "2026-11-17T18:58:01Z", "published_th": "18 พ.ย. 2026 • 01:58 น.", "category_hint": "Technology"}, {"id": 1794994242850, "guid": "https://www.theverge.com/?p=1035437", "original_title": "The iPhone Duo feels far more intuitive with Apple’s new face unlock", "thai_title": "iPhone Duo ใช้งานสะดวกขึ้นด้วยฟีเจอร์ปลดล็อกด้วยใบหน้าแบบใหม่จาก Apple", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Apple เพิ่มฟีเจอร์ 'Unlock with Front Camera' ใน iOS 27.3 beta สำหรับ iPhone Duo เพื่อแก้ปัญหาความไม่สะดวกในการใช้ Touch ID เพียงอย่างเดียว", "ระบบนี้ไม่ใช่ Face ID เต็มรูปแบบเนื่องจากข้อจำกัดด้านฮาร์ดแวร์ของหน้าจอพับ จึงไม่มีเซนเซอร์ TrueDepth และมีความปลอดภัยต่ำกว่า", "ฟีเจอร์นี้รองรับเฉพาะกล้องหน้าบนหน้าจอด้านนอกเท่านั้น และมีข้อจำกัดด้านความปลอดภัย เช่น ไม่สามารถใช้ยืนยันตัวตนใน Apple Pay หรือแอปพลิเคชันได้", "ระบบจะบังคับให้ผู้ใช้ยืนยันตัวตนด้วย Touch ID หรือรหัสผ่านทุกๆ 45 นาที เพื่อรักษาความปลอดภัยในระดับที่เหมาะสม"], "full_paragraphs": ["Apple กำลังทดสอบการเพิ่มฟีเจอร์ปลดล็อกด้วยใบหน้าให้กับ iPhone Duo ซึ่งแม้จะไม่ใช่ระบบ Face ID เต็มรูปแบบ แต่ก็เป็นทางเลือกที่เรียบง่ายกว่าและมีความปลอดภัยน้อยกว่า อย่างไรก็ตาม จนถึงขณะนี้ระบบดังกล่าวทำงานได้ดีเยี่ยม และแม้จะมีข้อจำกัดด้านความปลอดภัยที่ Apple กำหนดไว้ แต่ก็ทำให้การใช้งาน Duo รวดเร็วและสะดวกสบายกว่าการพึ่งพา Touch ID เพียงอย่างเดียว ซึ่งถือเป็นการแก้ไขหนึ่งในประเด็นที่ผู้ใช้งานหลายคนรวมถึงตัวผมเองรู้สึกหงุดหงิดมาโดยตลอด", "สถาปัตยกรรมหน้าจอพับของ Duo ทำให้ Apple ไม่สามารถติดตั้งชุดเซนเซอร์ Face ID เต็มรูปแบบเหมือนกับ iPhone รุ่นอื่นๆ ในตลาดได้ (แม้จะมีรายงานว่าบริษัทหวังว่าจะแก้ไขปัญหานี้ได้ในรุ่นที่สองก็ตาม) แทนที่จะเป็นเช่นนั้น ตัวเครื่องจึงมีเพียงกล้องเซลฟี่สองตัว คือตัวหนึ่งบนหน้าจอด้านนอกและอีกตัวที่ซ่อนอยู่ใต้หน้าจอด้านใน ซึ่งไม่มีตัวใดรองรับ Face ID เต็มรูปแบบ แต่หลังจากได้รับเสียงสะท้อนจากนักรีวิวและผู้ใช้งานกลุ่มแรกว่าการใช้เพียง Touch ID นั้นดูยุ่งยากเกินไป ในที่สุด Apple ก็ยอมอ่อนข้อให้", "iOS 27.3 เวอร์ชันนักพัฒนาล่าสุดได้เปิดตัวตัวเลือกใหม่ที่เรียกว่า “Unlock with Front Camera” โดย Apple ระมัดระวังอย่างยิ่งที่จะไม่เรียกมันว่า Face ID การตั้งค่ามีความคล้ายคลึงกัน แต่แทนที่จะต้องหมุนศีรษะเป็นวงกลมช้าๆ คุณเพียงแค่ต้องหันศีรษะไปทางซ้าย ขวา ขึ้น และลงเท่านั้น กระบวนการนี้ใช้เวลาประมาณห้าวินาที ซึ่งผมสามารถตั้งค่าได้สำเร็จแม้จะอยู่ในสภาพแวดล้อมที่สั่นไหวบนรถบัสในลอนดอนก็ตาม", "ฟีเจอร์ปลดล็อกด้วยใบหน้าใหม่นี้มอบความสะดวกสบายด้วยเวลาในการปลดล็อกเพียงครึ่งวินาที แต่ Apple ได้เตือนระหว่างการตั้งค่าว่าระบบนี้ “ไม่มีความปลอดภัยเท่ากับ Touch ID หรือ Face ID” เนื่องจากขาดแผนผังความลึกแบบอินฟราเรดจากกล้อง TrueDepth นั่นหมายความว่ามีความเป็นไปได้ที่จะถูกหลอกด้วยภาพถ่ายหรือคลิปวิดีโอ แต่ผมสามารถทำสำเร็จเพียงครั้งเดียวจากการทดลองกว่า 20 ครั้ง สิ่งสำคัญคือหลังจากความพยายามหลอกระบบด้วยภาพถ่ายล้มเหลวในแต่ละครั้ง โทรศัพท์จะบังคับให้ผมใช้ Touch ID ในการเข้าสู่ระบบครั้งถัดไป ซึ่งเป็นสิ่งที่ระบบจะไม่เรียกหาหากตรวจไม่พบใบหน้าใดๆ ในเฟรม นั่นหมายความว่าผู้ที่จะพยายามขโมยข้อมูลหรือแอบเข้าเครื่องจะต้องใช้ใบหน้าปลอมที่สมบูรณ์แบบตั้งแต่ครั้งแรกเท่านั้น", "การขาดเซนเซอร์ TrueDepth ยังทำให้เกิดข้อจำกัดในสภาพแสงน้อย แม้ว่าประสิทธิภาพจะดีกว่าที่ผมคาดไว้ก็ตาม ในขณะที่เดินไปรอบๆ หลังพระอาทิตย์ตกดิน ผมต้องมองหาจุดที่มืดสนิทจริงๆ ถึงจะพบจุดที่การปลดล็อกล้มเหลว เช่น การหลบอยู่หลังรถบรรทุกบนถนนที่มีต้นไม้หนาทึบซึ่งแสงไฟถนนส่องไม่ถึง แม้ระบบจะล้มเหลวในที่สุด แต่ก็ต้องอยู่ในสภาวะที่มืดมากจริงๆ ถึงจะเกิดเหตุการณ์เช่นนั้น", "Apple ได้กำหนดข้อจำกัดอื่นๆ เพื่อสะท้อนถึงระดับความปลอดภัยที่ต่ำกว่าของระบบใหม่นี้ โดยคุณสามารถใช้มันเพื่อปลดล็อกโทรศัพท์จากหน้าจอล็อกเท่านั้น ดังนั้นคุณจะต้องกลับไปใช้ Touch ID หรือรหัสผ่านเพื่อใช้งาน Apple Pay, ติดตั้งหรือเข้าสู่ระบบแอปพลิเคชัน หรือผ่านหน้าจอใดๆ ที่โทรศัพท์ต้องการข้อมูลยืนยันตัวตนด้านความปลอดภัย", "ข้อจำกัดนี้คล้ายกับโทรศัพท์ Android ส่วนใหญ่ที่มีระบบปลดล็อกด้วยใบหน้าผ่านกล้อง มีเพียงโทรศัพท์ Pixel ของ Google เท่านั้นที่อนุญาตให้คุณทำการซื้อสินค้าหรือเข้าสู่ระบบแอปพลิเคชันโดยใช้ Face Unlock ได้ ซึ่ง Google ระบุว่าเป็นเพราะเทคนิคทางซอฟต์แวร์ที่ทำให้ระบบมีความปลอดภัยมากกว่าทางเลือกอื่นๆ บน Android", "ข้อจำกัดที่น่ารำคาญกว่าของ iPhone Duo คือช่วงเวลาที่คุณสามารถใช้งานฟีเจอร์นี้ได้ โดยระบบปลดล็อกด้วยใบหน้าจะทำงานต่อเนื่องได้เพียง 45 นาทีต่อครั้ง หลังจากนั้นคุณจะต้องยืนยันตัวตนด้วย Touch ID หรือรหัสผ่านในครั้งถัดไปที่คุณปลดล็อก ยิ่งไปกว่านั้น มันไม่สามารถใช้งานได้เลยกับกล้องเซลฟี่ใต้หน้าจอที่อยู่ด้านใน ซึ่ง Apple ไม่ได้ระบุเหตุผล แต่สันนิษฐานว่าบริษัทรู้สึกว่าความละเอียดและคุณภาพที่ต่ำกว่าของกล้องตัวนั้นทำให้ไม่เหมาะสำหรับการปลดล็อกด้วยใบหน้า", "ผมคงจะดีใจมากหาก Apple ผ่อนปรนข้อจำกัดลงอีกสักนิด เพราะ 45 นาทีไม่ใช่ระยะเวลาที่ยาวนานนักก่อนที่จะต้องกลับไปใช้ Touch ID อีกครั้ง และผมมั่นใจว่า
