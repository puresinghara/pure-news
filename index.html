นุกสนานและความขรึมขลังของเกมดั้งเดิมเอาไว้ได้อย่างครบถ้วน พร้อมทั้งปรับปรุงองค์ประกอบเกมเพลย์บางส่วนให้ทันสมัยด้วยความสง่างามจนรู้สึกราวกับว่าสิ่งเหล่านี้ควรมีอยู่ตั้งแต่แรก นอกจากนี้ยังให้เกียรติแนวคิดการออกแบบดั้งเดิมด้วยการเชื่อมั่นว่าการสำรวจและการผจญภัยในรูปแบบเดิมนั้นยังคงยอดเยี่ยมอยู่เสมอ สำหรับแฟนเกม การได้เล่นฉบับรีเมคนี้คือการย้ำเตือนซ้ำแล้วซ้ำเล่าว่าทำไมคุณถึงตกหลุมรัก Ocarina of Time ตั้งแต่แรก และเป็นการได้เห็นความยอดเยี่ยมของเกมผ่านมุมมองใหม่ สำหรับผู้เล่นหน้าใหม่ นี่คือวิธีที่ดีที่สุดในการสัมผัสกับเกมคลาสสิกตลอดกาล และเป็นเกมเอ็กซ์คลูซีฟบน Switch 2 ที่ทุกคนไม่ควรพลาด", "หากคุณเพิ่งเคยสัมผัสเกมนี้เป็นครั้งแรก Ocarina of Time คือเกม Zelda 3D ภาคแรก ซึ่งเป็นเกมที่วางรากฐานสำคัญให้กับซีรีส์ เช่น Epona, ระบบ Z-targeting รวมถึงเผ่า Goron และ Gerudo ซีรีส์ Zelda คงไม่เป็นอย่างทุกวันนี้หากไม่มี Ocarina of Time ดังนั้นเกมนี้จึงมีที่พิเศษในใจของแฟนๆ และในประวัติศาสตร์ของ Nintendo เช่นเดียวกับ Super Mario 64 เกมนี้ได้วางแม่แบบให้กับการพัฒนาเกมของบริษัทมานานหลายทศวรรษ และเนื่องจาก Nintendo มักจะเป็นผู้บุกเบิกเส้นทางที่ผู้อื่นเดินตาม เกมนี้จึงมีอิทธิพลอย่างมากต่ออุตสาหกรรมเกมโดยรวม", "การเปลี่ยนแปลงที่เห็นได้ชัดที่สุดใน Ocarina 2026 คือการนำเสนอ ซึ่งถือว่าเป็นการอัปเกรดที่ยอดเยี่ยม พูดง่ายๆ คือนี่เป็นหนึ่งในเกมที่ดูดีที่สุดบน Switch 2 และเป็นหน้าเป็นตาให้กับเครื่องเกมนี้ ชุดของ Link และเด็กๆ ชาว Kokiri ได้รับการออกแบบให้มีรายละเอียดของเส้นใยผ้าที่ชัดเจน ตอกย้ำความเป็นภูตแห่งป่าที่เชื่อมโยงกับธรรมชาติ แสงที่สะท้อนบน Ocarina of Time ดูเหมือนเซรามิกเคลือบของจริง พื้นผิวอิฐในดันเจี้ยนดูเก่าแก่และสมจริง และยิ่งดูน่าขนลุกเมื่อได้รับแสงสลัวจาก Navi เพื่อนภูตของคุณ บอสแต่ละตัวจะแตกสลายกลายเป็นเถ้าถ่านสีม่วงเมื่อถูกกำจัด ทุกส่วนของโลกใบนี้ถูกสร้างขึ้นด้วยความใส่ใจ และในฐานะแฟนเกมที่กลับมาเล่นอีกครั้ง ผมรู้สึกทึ่งกับความสวยงามของมันอย่างต่อเนื่อง", "การปรับปรุงการนำเสนอยังครอบคลุมไปถึงรายละเอียดของแอนิเมชันและการออกแบบเสียง คุณสามารถเห็นแก้มของ Link พองขึ้นเมื่อเขาเป่า Ocarina และการเคลื่อนไหวของนิ้วมือที่ดูสอดคล้องกับตัวโน้ต เมื่อคุณไปถึง Lost Woods การติดตามเสียงตามทิศทางจะมอบประสบการณ์เชิงพื้นที่ที่สมบูรณ์แบบ ดนตรีที่นำมาเรียบเรียงใหม่ยังคงความเร้าใจและยิ่งใหญ่เช่นเดียวกับปี 1998 และผสมผสานเข้ากับความทรงจำของผมได้อย่างไร้รอยต่อ ตัวละครหลายตัวได้รับการพากย์เสียงเต็มรูปแบบในคัทซีนและบทสนทนา ซึ่งทำออกมาได้ดีเยี่ยมทุกตัวละคร ช่วยเพิ่มบุคลิกและหัวใจให้กับตัวละครเหล่านั้น นักพากย์ Ganondorf ถ่ายทอดความร้ายกาจออกมาได้อย่างเต็มที่, King Darunia ดูอบอุ่นและร่าเริง, Saria เพื่อนสนิทในวัยเด็กของ Link ฟังดูอ่อนหวานและจริงใจ, Impa ดูเป็นนักรบหญิงที่เด็ดขาด ส่วนเจ้าหญิง Ruto ในวัยเด็กเป็นตัวละครที่ผมชื่นชอบเป็นพิเศษด้วยนิสัยที่เอาแต่ใจแต่น่ารัก ส่วน Navi มีเสียงที่ดูโตขึ้นเล็กน้อยแต่ยังคงความเป็นเด็ก และมักทำหน้าที่เป็นเสียงแทน Link เนื่องจากเขายังคงเป็นตัวละครที่เงียบขรึม ยกเว้นเสียงตะโกนในการต่อสู้และปฏิกิริยาตกใจ", "ข้อเสียเพียงอย่างเดียวของการเพิ่มเสียงพากย์คือตัวละคร Sheik ซึ่งไม่ใช่ความผิดของนักพากย์ ผมเคยสงสัยว่าฉบับรีเมคจะจัดการกับจุดหักมุมนี้อย่างไร คำตอบคือมันพยายามแต่สุดท้ายก็ล้มเหลวในการสร้างสมดุลที่น่าพอใจ บทสนทนาแสดงให้เห็นว่าเกมต้องการรักษาเจตจำนงเดิมไว้ แต่ทั้งโมเดลตัวละครที่ปรับปรุงใหม่และเสียงพากย์ทำให้ความน่าเชื่อถือน้อยลง แม้นักพากย์จะทำหน้าที่ได้ดีเยี่ยม แต่การรักษาความลับของเนื้อเรื่องที่เคยพึ่งพาข้อจำกัดของเครื่อง N64 นั้นทำได้ยากในปัจจุบัน จนถึงจุดหนึ่งมันดูไม่สมเหตุสมผลที่ Link และ Navi จะไม่สังเกตเห็นความจริง อย่างไรก็ตาม นอกเหนือจากจุดเล็กน้อยนั้น คัทซีนใหม่ๆ ก็ช่วยเพิ่มความดราม่าให้กับเนื้อเรื่องที่ผมชื่นชอบอยู่แล้วได้เป็นอย่างดี", "มีการเน้นไปที่การแสดงออกทางสีหน้าและแอนิเมชันที่ละเอียดอ่อนเพื่อแสดงท่าทาง ทำให้ช่วงเวลาสำคัญมีน้ำหนักมากขึ้น ตัวอย่างที่สมบูรณ์แบบคือฉากบอกลาที่เต็มไปด้วยน้ำตาของ Saria ที่ขอบป่า Kokiri Saria เป็นคนพูดทั้งหมดในขณะที่ Link ยังคงเงียบ ซึ่งอาจจะดูอึดอัด แต่การที่ Link ลังเลเล็กน้อยก่อนจะหันไปเผชิญโชคชะตา แสดงให้เห็นว่าเขารู้สึกผูกพันกับเธอมากเพียงใดแต่ไม่รู้จะพูดอย่างไร เป็นช่วงเวลาที่น่ารักและสร้างสายสัมพันธ์ที่ลึกซึ้ง ในบางครั้งคัทซีนก็ทำให้จุดสำคัญของเนื้อเรื่องชัดเจนขึ้นกว่าเดิม เช่นตอนที่ Link หยิบ Master Sword และ Ganondorf ฉวยโอกาสนั้น เราจะเห็นภาพเหตุการณ์ที่ชัดเจนขึ้น ซึ่งเป็นการตอกย้ำสิ่งที่ผู้สร้างตั้งใจไว้แต่แรก", "แม้ว่าฉบับรีเมคจะยึดตามการออกแบบเดิมอย่างใกล้ชิด แต่ก็ได้เพิ่มฟีเจอร์อำนวยความสะดวก (Quality-of-Life) ที่ช่วยให้ประสบการณ์ราบรื่นและทันสมัยขึ้น สิ่งที่เห็นผลชัดที่สุดคือการเพิ่มปุ่มกระโดด ซึ่งยอดเยี่ยมมาก เกมต้นฉบับขาดปุ่มกระโดดเนื่องจากข้อจำกัดของคอนโทรลเลอร์ในยุคนั้น แต่ในเกมปี 2026 ปุ่มกระโดดให้ความรู้สึกที่เป็นธรรมชาติและเข้ากับการออกแบบฉากและดันเจี้ยนราวกับว่ามันควรมีอยู่ตั้งแต่แรก Ocarina ไม่เคยเป็นเกมที่มีการกระโดดที่ยากลำบาก แต่การสามารถกำหนดจังหวะการกระโดดเองได้ หรือการกระโดดขึ้นเถาวัลย์และบันไดเพื่อความรวดเร็วในการเดินทางนั้นให้ความรู้สึกที่ดีมาก แม้แฟนๆ บางส่วนจะกังขาเรื่องการเพิ่มปุ่มกระโดด แต่เมื่อได้ลองเล่นแล้ว ผมก็นึกภาพไม่ออกเลยว่าจะกลับไปเล่นแบบเดิมได้อย่างไร", "การเพิ่มอื่นๆ แม้จะส่งผลน้อยกว่าแต่ก็น่าชื่นชม แถบอุปกรณ์ (Equipment bar) ที่นำกลับมาจาก Breath of the Wild และ Tears of the Kingdom ช่วยให้คุณเรียกใช้อุปกรณ์ที่ต้องการได้ง่ายขึ้น เช่นเดียวกับรองเท้าและ Lenses of Truth (ที่ตอนนี้ดูเหมือนแว่นตากันลม) ที่ถูกกำหนดไว้ที่ปุ่มทิศทางเพื่อการสลับใช้งานอย่างรวดเร็ว หนึ่งในฟีเจอร์ QOL ที่ผมชอบที่สุดคือ Business Scrub คุณสามารถซื้อหรือหาเมล็ดพันธุ์เพื่อเรียกพ่อค้า Deku ได้ทุกที่ในโลก รวมถึงในดันเจี้ยน ซึ่งเขาจะขายไอเทมจำเป็น เช่น ยา, ระเบิด และลูกธนู ทำให้ไม่ต้องเดินย้อนกลับออกจากดันเจี้ยนเพื่อเติมของก่อนสู้กับบอส แต่ในขณะเดียวกัน คุณก็ต้องใช้อย่างประหยัดเพราะเมล็ดพันธุ์มีจำกัด ทำให้เกมยังคงความท้าทายเอาไว้ได้", "นอกจากนี้ยังมีส่วนเสริมที่กว้างขึ้นอย่าง Threads of Time ซึ่งเป็นระบบติดตามเควสต์ที่คอยบอกทิศทางสำหรับภารกิจหลักและเควสต์ย่อยที่คุณเริ่มทำ ปริศนาบางอย่างใน Ocarina อาจมีความซับซ้อน ซึ่งระบบนี้ไม่ได้ทำหน้าที่เป็นระบบบอกใบ้ แต่เป็นเครื่องเตือนความจำว่าคุณค้างไว้ที่ไหน นอกจากนี้ยังมี Hall of Fallen Foes ซึ่งเป็นห้องจัดแสดงรูปปั้นของสัตว์ประหลาดและบอสที่คุณเคยเอาชนะมาได้ทั่ว Hyrule แม้จะไม่ใช่สิ่งที่ปฏิวัติวงการ แต่การได้ชื่นชมรายละเอียดของดีไซน์เหล่านี้โดยไม่ต้องต่อสู้ด้วยนั้นเป็นเรื่องที่ดี และสำหรับบอสบางตัว คุณยังสามารถท้าทายเพื่อฝึกฝนทักษะได้อีกด้วย", "ทั้งหมดนี้เป็นส่วนเสริมที่เข้ามาเติมเต็มเกมคลาสสิกที่ยังคงความยอดเยี่ยมได้อย่างน่าทึ่ง การออกแบบดันเจี้ยนยังคงเป็นหนึ่งในส่วนที่ดีที่สุดของซีรีส์ แม้จะเป็นความพยายามในรูปแบบ 3D ครั้งแรกก็ตาม ดินแดน Hyrule เต็มไปด้วยสิ่งที่ต้องทำ ความลับที่ต้องค้นหา และผู้คนที่ต้องช่วยเหลือ เกมยังคงย่อยง่ายในแง่ของภารกิจหลัก ซึ่งเป็นเหตุผลว่าทำไมมันถึงถูกนำกลับมาเล่นซ้ำหลายปี แต่ก็ยังอัดแน่นไปด้วยกิจกรรมและเควสต์ย่อยให้สำรวจ และที่น่ายินดีคือมันยังคงความแปลกประหลาดอันน่าทึ่งของ Ocarina of Time ต้นฉบับเอาไว้ เกม Zelda มักจะมีเสน่ห์ที่ตลกขบขันเสมอ แต่ Ocarina นั้นแปลกกว่าภาคอื่นด้วยการออกแบบ NPC ที่พิลึกพิลั่นและช่วงเวลาตลกๆ เช่น การปลุกเจ้าของฟาร์ม Talon หลังจากเขาหลับในเขตปราสาท Hyrule หรือการที่คุณยังต้องแบกเจ้าหญิง Ruto ไว้บนหัวเหมือนกำลังขี่หลังปลาโลมา สิ่งเหล่านี้ยังคงสร้างความแตกต่างที่สนุกสนานให้กับโลกของเกม", "ในขณะเดียวกัน องค์ประกอบที่มืดหม่นก็ยังคงอยู่และได้รับการปรับปรุงให้ดียิ่งขึ้น ครั้งแรกที่ Link ในวัยผู้ใหญ่ก้าวออกจาก Temple of Time เพื่อเห็น Hyrule ที่ล่มสลายนั้นให้ความรู้สึกที่โศกเศร้าและถ่ายทอดออกมาได้อย่างเหมาะสม บอสบางตัวมีความน่ากลัวและสยดสยอง โดยเฉพาะ Dead Hand หรือ Cursed Rich Man ที่ทำออกมาได้น่าตกใจ แม้แต่ ReDead ก็ยังดูน่ากลัว แต่มีการปรับปรุงด้วยตัวบ่งชี้ทางภาพที่ชัดเจนขึ้นทำให้การเผชิญหน้าไม่น่าหงุดหงิดจนเกินไป", "เนื่องจากเกมนี้มีความเคารพต่อต้นฉบับสูง จุดอ่อนของ Ocarina of Time ดั้งเดิมจึงยังคงเป็นจุดอ่อนในฉบับรีเมค เช่น Water Temple ที่แม้จะอ่านแผนที่ได้ง่ายขึ้น แต่การปรับระดับน้ำก็ยังคงน่ารำคาญเล็กน้อย Shadow Temple ยังคงเป็นดันเจี้ยนที่เส้นตรงและอ่อนที่สุดเมื่อเทียบกับดันเจี้ยนอื่น การมีกล้องที่อิสระและปุ่มกระโดดทำให้ช่วงการลอบเร้นในปราสาท Hyrule และป้อมปราการ Gerudo จัดการได้ง่ายขึ้น แต่โดยเฉพาะป้อม Gerudo ก็ยังคงเป็นงานที่น่าเบื่อหน่าย สำหรับผม สิ่งเหล่านี้ถือเป็นการยอมรับเล็กๆ น้อยๆ เพื่อรักษาและให้เกียรติการออกแบบดั้งเดิม มันคงไม่รู้สึกว่าเป็น Ocarina of Time หากตัดช่วงเวลาเหล่านี้ออกไป", "เมื่อ Nintendo รีเมค Ocarina of Time สำหรับ 3DS ในปี 2011 มันยังอยู่ในยุคของเกม Zelda รูปแบบเดิม แต่ในปัจจุบัน ท่ามกลางบริบทของ Breath of the Wild และ Tears of the Kingdom การรีเมค Ocarina of Time จึงมีความรับผิดชอบที่ต่างออกไป นี่ไม่ใช่แค่การกลับมาเยี่ยมชมเกม Zelda เก่าในรูปแบบที่คุ้นเคย แต่เป็นการกลับมาเยี่ยมชมยุคสมัยที่แตกต่างไปจากเดิมอย่างสิ้นเชิง ซึ่งทำให้เกิดคำถามว่าเกม Zelda ในรูปแบบนี้ยังคงรู้สึกทันสมัยอยู่หรือไม่ คำตอบคือใช่ Ocarina of Time ยังคงเป็นความมหัศจรรย์ของการออกแบบเกมและการผจญภัยที่น่าตื่นเต้น ฉบับรีเมคนี้ช่วยขัดเกลาจุดที่ขรุขระ ทิ้งบางส่วนไว้ตามเดิม และปล่อยให้สิ่งที่พิเศษของต้นฉบับเปล่งประกายออกมา การเข้าถึงการรีเมคนี้ด้วยความเคารพต่อแหล่งที่มา ทำให้ Nintendo พิสูจน์ให้เห็นว่าผลงานระดับมาสเตอร์พีซที่แท้จริงนั้นสามารถยืนหยัดผ่านการทดสอบของกาลเวลาได้เสมอ"], "link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless/", "canonical_link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/LOZ-Deku-Tree.jpg?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1793790000, "published_at": "2026-11-04T11:00:00Z", "published_th": "4 พ.ย. 2026 • 18:00 น.", "category_hint": "Review"}, {"id": 1794822849534, "guid": "1943764", "original_title": "Godzilla: Destroy All Monsters Melee Remastered Is A Faithful, If Flawed, Remaster", "thai_title": "รีวิว Godzilla: Destroy All Monsters Melee Remastered – ความสนุกฉบับคลาสสิกที่ถูกบั่นทอนด้วยระบบ Grind", "tag": "Review", "sub_tag": "GAME REVIEW", "bullet_points": ["Godzilla: Destroy All Monsters Melee Remastered ยังคงมอบประสบการณ์ความสนุกแบบดั้งเดิมในการต่อสู้ของเหล่าไคจูที่เล่นง่ายและเฮฮา", "ระบบการเล่นแบบ 3D Brawler ที่ให้ผู้เล่นหยิบจับสิ่งของหรือตึกรามบ้านช่องมาฟาดฟันกันยังคงเป็นจุดเด่นที่สร้างความบันเทิงได้ดีเยี่ยม", "ตัวเกมมีปัญหาเรื่องระบบ Progression ใหม่ที่บังคับให้ผู้เล่นต้อง 'Grind' หรือเล่นซ้ำเพื่อปลดล็อกตัวละครและโหมดต่างๆ ซึ่งขัดกับธรรมชาติของเกมที่ควรจะเป็นความสนุกแบบหยิบมาเล่นได้ทันที", "แม้จะมีโหมด Tournament ที่ช่วยให้เข้าถึงตัวละครได้โดยไม่ต้องปลดล็อก แต่กลับถูกซ่อนไว้อย่างไม่น่าเชื่อและไม่รองรับการเล่นออนไลน์", "โดยรวมถือเป็นเกมที่แฟน Godzilla ควรค่าแก่การเล่นเพื่อความบันเทิง แต่ระบบปลดล็อกที่ยืดเยื้อทำให้เสน่ห์ของเกมลดน้อยลงกว่าต้นฉบับ"], "full_paragraphs": ["Godzilla: Destroy All Monsters Melee Remastered คือเกมแนว 3D Brawler ที่คุณสามารถสวมบทบาทเป็น Godzilla ปี 1990 จับ Godzilla ปี 2000 ทุ่มใส่ตึก หรือดู Anguirus กระโดดถีบศัตรูจนทะลุอาคาร ซึ่งมันเป็นอะไรที่ตลกและสนุกมาก เพียงแค่คำนิยามนี้ก็เพียงพอแล้วที่จะทำให้ผมและแฟนๆ Godzilla คนอื่นๆ พูดว่า 'ได้โปรด เอาเงินผมไปเลย' และตัวเกมก็ทำได้ตามคำสัญญาจริงๆ ซึ่งไม่ใช่เรื่องน่าแปลกใจนักเพราะระบบการเล่นนั้นถอดแบบมาจากเกมต้นฉบับปี 2002 มาแบบหนึ่งต่อหนึ่ง", "ความสนุกของการได้อาละวาดเป็นสัตว์ประหลาดขนาดยักษ์ท่ามกลางเมืองที่พังทลายนั้นเพิ่มขึ้นเป็นทวีคูณเมื่อเล่นกับเพื่อน 3 คนในโหมด Local โดยเฉพาะบน Nintendo Switch ที่คุณสามารถถอด Joy-Con ส่งให้คนข้างๆ แล้วหัวเราะร่าตอนที่คุณเหวี่ยงพวกเขาลงไปในบ่อลาวาบนเกาะ Monster Island แต่น่าเสียดายที่ความสนุกแบบอาร์เคดที่เรียบง่ายและตรงไปตรงมาของเกม กลับถูกขัดขวางด้วยการต้องใช้เวลาหลายชั่วโมงในการ 'Grind' เพื่อปลดล็อกตัวละคร ด่าน และโหมดต่างๆ ของเกม", "ระบบการเล่นที่ต้องใช้ความพยายามอย่างหนักนี้ไม่ได้ช่วยส่งเสริมดีไซน์ของเกมที่เน้นความสนุกแบบ 'หยิบมาเล่นได้ทันที' เลยแม้แต่น้อย มันเปลี่ยนเกมที่เต็มไปด้วยเสียงหัวเราะให้กลายเป็นงานที่น่าเบื่อหน่ายเมื่อสิ่งที่คุณต้องการจริงๆ คือการได้เล่นเป็น Rodan ตั้งแต่เริ่มเกม คุณจะสามารถเข้าถึงตัวละครได้เพียง 4 จาก 12 ตัวเท่านั้น ได้แก่ Godzilla 1990, Gigan, Megalon และ Anguirus ซึ่งตัวละครเริ่มต้นเหล่านี้แสดงให้เห็นถึงความหลากหลายของประเภทสัตว์ประหลาด ยกเว้นพวกที่บินได้อย่าง King Ghidorah และ Rodan", "โดยทั่วไปแล้วสัตว์ประหลาดจะมีชุดท่าโจมตีที่คล้ายคลึงกัน โดยบางตัวจะมีลูกเล่นพิเศษเพิ่มเข้ามา เช่น ความสามารถในการวาร์ปของ Gigan หรือการมุดดินของ Megalon เพื่อโผล่ขึ้นมาจับศัตรู ในช่วงแรกท่าโจมตีอาจดูซ้ำซากจำเจด้วยคอมโบที่เหมือนกัน หรือเอฟเฟกต์การกระทืบเท้าที่คล้ายกัน แต่ก็ยังมีรายละเอียดเล็กๆ น้อยๆ ที่ทำให้แต่ละตัวมีเอกลักษณ์เฉพาะตัว เช่น ท่าป้องกันของ Anguirus ที่จะหันหลังเอาหนามแหลมคมรับการโจมตี ก่อนจะทำให้ศัตรูมึนงงในขณะที่มันสะบัดมือไปมาด้วยท่าทางตลกขบขัน", "แม้จะไม่ใช่เกมต่อสู้ที่มีความลึกซึ้งมากนัก แต่ก็มีความหลากหลายเพียงพอที่จะทำให้การต่อสู้สนุกสนาน เช่น ความสามารถในการหยิบตึกมาทุ่ม หรือการเก็บไอเทมเพิ่มพลังเพื่อเรียก Mothra มาโจมตีทางอากาศ ความหลากหลายนี้ช่วยให้การต่อสู้แต่ละครั้งไม่รู้สึกซ้ำซาก การได้เห็นสัตว์ประหลาด 4 ตัววิ่งวุ่นไปทั่วฉาก พ่นลำแสงออกจากปาก ทุ่มตึกใส่กัน หรือกลิ้งไปมาเพื่อหลบหลีกนั้นเป็นความสนุกที่แท้จริง ประสบการณ์การเล่นคนเดียวอาจจะดูเบาบางไปบ้าง แต่เมื่อเล่นกับเพื่อนมันคือความบันเทิงชั้นยอด ซึ่งเป็นผลมาจากความที่เป็นเกมต่อสู้ที่เข้าถึงง่าย และแม้แต่ในช่วงเวลาที่ผมเล่นคนเดียว เกมก็ยังทำให้ผมหัวเราะได้เป็นระยะจากความรุนแรงแบบการ์ตูนของเหล่าไคจู", "น่าเสียดายที่การปลดล็อกสัตว์ประหลาดตัวอื่นๆ ไม่ได้ตรงไปตรงมาเหมือนในเกมต้นฉบับ ในเกมปี 2002 การปลดล็อกตัวละครทำได้เพียงแค่เล่นโหมด Adventure ให้จบ ซึ่งเป็นโหมดสั้นๆ สไตล์อาร์เคดที่คุณต้องเอาชนะสัตว์ประหลาดไปเรื่อยๆ จนถึง Mechagodzilla ในตอนท้าย แต่ในเวอร์ชัน Remaster นี้กลับมีระบบความก้าวหน้า 3 รูปแบบเข้ามาแทนที่ ได้แก่ ค่า XP ของตัวละครแต่ละตัว, Research Points สำหรับทำโปรเจกต์เพื่อปลดล็อกตัวละครและด่าน, และ Rumors ซึ่งเป็นภารกิจที่ต้องทำเพื่อให้บรรลุโปรเจกต์", "ระบบเหล่านี้ถูกนำมารวมกันเพื่อพยายามยืดเวลาการเล่นและปลดล็อกตัวละครที่คุณชื่นชอบ (อย่าง Rodan!) ซึ่งมันส่งผลเสียมากกว่าผลดี ในช่วง 11 ชั่วโมงที่ผมเล่นมา ส่วนใหญ่ผมใช้เวลาไปกับการเล่นคนเดียวเพื่อพยายามปลดล็อกตัวละคร ซึ่งผมยังทำไม่สำเร็จ โดยเหลืออีก 3 ตัวคือ Destroyah, Mechagodzilla และ Rodan การปลดล็อกแต่ละตัวต้องทำตามรายการเงื่อนไข เช่น ชนะการต่อสู้ 12 ครั้งด้วย Megalon หรือ Gigan ซึ่งจะปลดล็อก Research Project ต่อไป ซึ่งต้องเล่นโหมด Adventure หรือ Multiplayer (ทั้งออนไลน์และ Local) เพื่อเก็บความคืบหน้า", "การทำภารกิจ Rumors และ Research ให้สำเร็จนั้นใช้เวลาแตกต่างกันไป และบางครั้งการทำสำเร็จก็เผยให้เห็นภารกิจใหม่ที่ต้องทำเพิ่มขึ้นอีก ผมเคยเข้าใจผิดอยู่สองสามครั้งว่าแค่ทำ Research เดียวก็จะปลดล็อก Mecha-King Ghidorah ได้แล้ว แต่กลับกลายเป็นว่าต้องไปปลดล็อกโปรเจกต์อื่นก่อน ความเหนื่อยหน่ายนี้ยังลามไปถึงโหมด Adventure ใหม่ๆ ที่ถูกล็อกไว้ตามเลเวลของตัวละครแต่ละตัว ซึ่งมันน่าเบื่อมาก", "โหมด Adventure ใหม่ 2 โหมดที่เพิ่มเข้ามาอย่าง Adventure Gauntlet และ Adventure Challenge ถือเป็นการเปลี่ยนแปลงที่น่ายินดี โดย Gauntlet จะให้คุณสู้กับ CPU 2 ตัวที่เก่งขึ้นเรื่อยๆ ในแต่ละรอบ ส่วน Challenge คือเวอร์ชันที่ยากกว่าเดิมที่ CPU จะเริ่มเกมพร้อมไอเทมเพิ่มพลัง แต่น่าเสียดายที่การปลดล็อกโหมดเหล่านี้ต้องอาศัยการเก็บเลเวลตัวละครทีละตัว ซึ่งใช้เวลานานมาก", "อย่างไรก็ตาม ยังมีวิธีเล่นตัวละครและด่านทั้งหมดโดยไม่ต้อง Grind นั่นคือโหมด Tournament ซึ่งโหมดนี้ถูกซ่อนไว้อย่างแปลกประหลาดในการตั้งค่า แทนที่จะอยู่ในเมนูหลัก การเปิดโหมดนี้จะปิดการใช้งานโหมดอื่นๆ ทั้งหมด ยกเว้น Custom Battle และหยุดการเก็บค่า Research และเลเวล ที่นี่คุณสามารถเล่นเป็นสัตว์ประหลาดตัวไหนก็ได้ในการต่อสู้ 1v1 กับ CPU หรือเล่นกับเพื่อน 3 คนในเครื่องเดียวกัน แต่โหมด Tournament ไม่สามารถเล่นออนไลน์ได้ หมายความว่าคุณยังคงต้องติดอยู่กับการปลดล็อกตัวละครด้วยวิธีที่น่าเบื่อตามที่เกมกำหนดไว้", "ถึงอย่างนั้น โหมดนี้ก็ถือเป็นทางรอดที่ทำให้ผมได้เล่นเป็น Rodan และไล่ทุบ Destroyah กับเพื่อนๆ ได้เสียที มันเป็นวิธีแก้ปัญหาที่แปลกและไม่มีการบอกกล่าวให้ชัดเจนจนกระทั่งผมต้องติดต่อไปยังผู้พัฒนาเพื่อสอบถามว่าเกมมีสูตรโกงหรือไม่ (ซึ่งสูตรของเกมต้นฉบับใช้ไม่ได้) การ Grind ในเกมนี้ให้ความรู้สึกเหมือนเกม Live-service สมัยใหม่ และแม้ผมจะขอบคุณที่ไม่มีระบบ Microtransactions แต่การนำระบบเหล่านี้มาใส่กลับขัดแย้งกับตัวเกมที่ควรจะเน้นความสนุกแบบไร้สาระและบริสุทธิ์", "Destroy All Monsters คือความสนุกที่แท้จริง ไม่ว่าคุณจะเล่นกับเพื่อนต่อหน้าหรือออนไลน์ คุณจะได้พบกับเสียงหัวเราะมากมายจากภาพการต่อสู้ของเหล่าไคจูที่บินว่อนไปทั่วท้องฟ้า ดังนั้นแม้จะต้องฝ่าฟันการ Grind ในโหมดเล่นคนเดียว แต่ความสุขในการเล่นก็ไม่ได้จางหายไป Godzilla: Destroy All Monsters Melee Remastered จะดีที่สุดเมื่อมันจำลองความรู้สึกของการเอาของเล่นไคจูมาฟาดกันในวัยเด็กกับเพื่อนๆ และจะแย่ที่สุดเมื่อมันพยายามยืดเวลาเกมที่ไม่ได้มีความลึกซึ้งอะไรมากมายตั้งแต่แรก", "ผลลัพธ์ที่ได้คือเกม Remaster ที่ผมดีใจที่มันมีอยู่จริงเมื่อพิจารณาจากความขาดแคลนของเกมแนวต่อสู้ไคจู แต่ก็มาพร้อมกับข้อควรระวังหลายประการ ไม่นับรวมความรู้สึกขัดใจที่เกมต้นฉบับบน GameCube และ Xbox ไม่เคยมีการบังคั การณ์ที่ไม่เหมือนใครอย่างแท้จริง", "เนื้อเรื่องเริ่มต้นจาก 'บทสนทนาหลังจบศึก' ที่ดูเหมือนทุกอย่างจบลงแล้ว พร้อมกับการต่อสู้ของผู้กอบกู้ซึ่งเป็นตัวแทนของผู้เล่น โดยบทสนทนานี้ทำหน้าที่เป็นบทสอนเล่น (Tutorial) ผู้กอบกู้เดินทางมาถึงสถานที่ที่เรียกว่า 'ห้องแห่งเสาโอเบลิสก์' และเข้าไปแทรกแซงอดีตของวีรบุรุษทั้งสี่เพื่อนำพาไปสู่โชคชะตาที่แตกต่างจากเดิม", "โครงสร้างที่นำเสนอจุดจบก่อนแล้วย้อนกลับไปในอดีตถือว่ากล้าหาญ สิ่งที่ผู้เล่นจะได้สัมผัสไม่ใช่แค่ตำนานของวีรบุรุษทั้งสี่ แต่เป็นเรื่องราวที่สร้างขึ้นใหม่ว่าทำไมพวกเขาถึงถูกเรียกว่าวีรบุรุษ และผ่านโศกนาฏกรรมหรือการตัดสินใจแบบใดจนถูกดึงเข้าสู่สงครามใหญ่ในภายหลัง", "ผู้เล่นสามารถเลือกเริ่มเรื่องราวของตัวเอกคนใดก็ได้ก่อน ผู้เขียนเลือก Dietrich (ฉายาคนแปลกหน้าแห่ง Dagza) เป็นคนแรก แต่หลังจากปลดล็อกการเคลื่อนไหวอิสระแล้ว ก็สามารถสลับไปเล่นเนื้อเรื่องของตัวเอกคนอื่นได้", "อย่างไรก็ตาม การเล่นเนื้อเรื่องตัวเอกหลายคนขนานกันมีข้อเสีย คือทุกครั้งที่เริ่มตัวเอกใหม่ ผู้เล่นต้องทำกิจกรรมช่วงต้นที่คล้ายคลึงกันซ้ำๆ ซึ่งอาจรู้สึกน่าเบื่อเล็กน้อย แม้ว่ากิจกรรมในแผนที่โลกของตัวเอกแต่ละคนจะแตกต่างกันจนไม่ถึงกับซ้ำซากโดยสิ้นเชิงก็ตาม", "การมองทวีปผ่านชีวิต วัฒนธรรม และวิธีการต่อสู้ของตัวเอกทั้งสี่คน ช่วยให้เข้าใจการตั้งค่าโลกอันมหาศาลของเกมนี้ได้อย่างมีประสิทธิภาพ", "ในส่วนแรก วีรบุรุษทั้งสี่มุ่งหน้าสู่เทศกาลสำคัญที่เรียกว่า 'เทศกาลประลองดาบใหญ่' ผู้เล่นต้องเพิ่มชื่อเสียง สเกาท์เพื่อนร่วมทีม และพัฒนายูนิตภายในกำหนดเวลา โดยในหนึ่งวันสามารถทำกิจกรรมได้พื้นฐาน 4 เทิร์น การเคลื่อนที่และสำรวจแผนที่โลกจะทำให้เวลาเดินไป ในขณะที่กิจกรรมในฐานทัพ 'Dagsion' จะไม่ทำให้เวลาผ่านไป ซึ่งเป็นการนำกลยุทธ์ระดับมหภาคมาใช้ในการตัดสินใจว่าควรไปที่ไหนและทำอะไรภายในเวลาที่จำกัด", "เป้าหมายนั้นชัดเจนคือการพัฒนาตัวละครและสเกาท์เพื่อนร่วมทีม แต่ทรัพยากรที่ต้องใช้มีมากเกินไป กิจกรรมใน Dagsion ต้องใช้ค่าความมุ่งมั่น การสเกาท์ต้องใช้ค่าความสัมพันธ์และชื่อเสียง การเพิ่มค่าความสัมพันธ์ต้องใช้เงินซื้อของขวัญหรืออาหาร แต่ในช่วงต้นเกมทั้งชื่อเสียงและเงินหาได้ยาก ทำให้เกิดวงจรที่ต้องทำกิจกรรมอื่นเพื่อหาทรัพยากร ซึ่งก็ต้องใช้เวลาและทรัพยากรเพิ่มขึ้นไปอีก", "ในช่วงแรก การตัดสินใจว่ากิจกรรมใดเหมาะสมที่สุดนั้นเข้าใจยากมาก ด้วยตัวเลขที่ต้องจัดการจำนวนมาก ผู้เล่นอาจรู้สึกท่วมท้นทันทีที่ปลดล็อกการเคลื่อนไหวอิสระ", "ผู้เขียนเลิกพยายามหาคำตอบที่สมบูรณ์แบบสำหรับเควสต์หลักตั้งแต่เนิ่นๆ ในความเป็นจริง หากสำรวจและสู้รบในแผนที่โลกบ้าง ก็สามารถพัฒนาตัวละครให้เพียงพอต่อการผ่านเควสต์หลักได้ แต่หากมองไปถึงบทสงครามและบทกอบกู้ การสเกาท์เพื่อนร่วมทีมให้มากที่สุดและใช้ทรัพยากรอย่างคุ้มค่าถือเป็นกุญแจสำคัญ การพัฒนากองทัพในระยะยาวคือหัวใจหลักของการเคลียร์เกมนี้", "ใน Dagsion มีตัวละครที่สเกาท์ได้มากมาย การสร้างความสัมพันธ์และทำตามเงื่อนไขเพื่อดึงพวกเขาเข้าพวกถือเป็นความสนุกที่สุดอย่างหนึ่งของเกม", "ระบบความสัมพันธ์ในเกมนี้ไม่ได้เริ่มหลังจากเข้าพวก แต่มีค่าความสัมพันธ์ตั้งแต่ยังเป็นตัวละครที่สเกาท์ได้ ผู้เล่นต้องเพิ่มระดับชื่อเสียง ให้ของขวัญ กินข้าว ชมละคร หรือแช่น้ำพุร้อนเพื่อกระชับความสัมพันธ์ แต่ทั้งหมดนี้ต้องใช้เงินและเวลา ซึ่งเงินมักจะขาดแคลนเสมอเพราะต้องใช้ทั้งซื้ออุปกรณ์และเพิ่มค่าความสัมพันธ์", "ระบบบทสนทนาสนับสนุนมีแนวคิดใหม่ที่น่าสนใจ คือการปลดล็อกบทสนทนาใหม่ผ่านการดูบทสนทนาของตัวละครอื่น ทำให้บทสนทนาไม่ได้เป็นเรื่องสั้นแยกส่วน แต่เชื่อมโยงกันข้ามตัวละคร สร้างความลึกซึ้งให้กับชุมชนในเกม", "ในทางกลับกัน เมื่อถึงบทกอบกู้ จำนวนเพื่อนร่วมทีมอาจสูงถึง 30 คน การจะเพิ่มค่าความสัมพันธ์ให้ครบทุกคนเป็นเรื่องที่ต้องใช้ความพยายามอย่างมหาศาล แม้การจัดยูนิตให้อยู่ติดกันในการต่อสู้จะช่วยเพิ่มค่าความสัมพันธ์ได้ แต่ยูนิตที่เหลือในฐานทัพต้องอาศัยกิจกรรมในฐานทัพเพื่อกระชับความสัมพันธ์เท่านั้น", "บทสนทนาสนับสนุนจำนวนมหาศาลคือเสน่ห์ของเกม แต่การจัดการเพื่อเก็บให้ครบก็เป็นภาระที่มหาศาลเช่นกัน", "เมื่อส่วนแรกดำเนินไป กิจกรรมใหม่ๆ ใน Dagsion จะถูกปลดล็อกเรื่อยๆ เช่น การฝึกฝน, การรับใช้ในวิหาร, การกินอาหาร, การให้ของขวัญ, บ่อน้ำพุร้อน, การชมละคร, การแสดงละคร, การดูและฝึกฝนในลานประลอง และการให้อาหารนก ซึ่งมีหลากหลายมาก การบริหารจัดการกิจกรรมเหล่านี้ให้ทันก่อนถึงวันที่เควสต์หลักจะเกิดขึ้นคือส่วนสำคัญของส่วนแรก", "แต่ละกิจกรรมมีข้อดี เช่น การเพิ่มค่าความสัมพันธ์หรือค่าสถานะ แม้เกมย่อยในโรงละครจะเรียบง่าย แต่รายละเอียดเล็กๆ น้อยๆ เช่น เนื้อหาละครที่สะท้อนประวัติศาสตร์และวัฒนธรรมของโลกในเกมก็น่าประทับใจ", "ปัญหาคือ กิจกรรมเหล่านี้ส่วนใหญ่ทำได้สัปดาห์ละครั้ง แต่การทำใน Dagsion ไม่ทำให้เวลาผ่านไป ดังนั้นทางเลือกที่เหมาะสมที่สุดในเชิงเกมคือการทำทุกกิจกรรมที่มีให้ครบในสัปดาห์นั้นๆ การฝึกฝน, รับใช้, แช่น้ำพุร้อน, ให้ของขวัญ, กินข้าว, ชมละคร และให้อาหารนก ทำซ้ำไปเรื่อยๆ จนถึงวันเควสต์หลัก", "แทบไม่มีการตัดสินใจเชิงกลยุทธ์ว่า 'จะเน้นอะไรและยอมทิ้งอะไร' เพราะเวลาไม่เดิน การทำกิจกรรมจึงเป็นเพียงการไล่เช็คลิสต์จากบนลงล่าง นี่คือสาเหตุหลักของความรู้สึกเหมือนการทำงาน (作業感) ในเกมนี้ แม้จะมีฟังก์ชันข้ามวันไปจนถึงวันเควสต์หลัก แต่เพื่อเพิ่มค่าความสัมพันธ์และเลเวล ผู้เล่นก็ยังต้องทำกิจกรรมเหล่านี้อยู่ดี", "ในส่วนแรกยังมีเควสต์เสริมและเควสต์ภายนอก (Gaiden) ที่ต้องรับและทำภายในกำหนดเวลา การดำเนินเนื้อเรื่องจะปลดล็อกเควสต์ภายนอกจากตัวเอกคนอื่น ซึ่งสามารถท้าทายแผนที่ที่มีกลไกพิเศษได้", "แผนที่เควสต์ภายนอกบางแห่งมีความยากสูง แต่ก็เป็นที่ที่ปลดล็อกยูนิตที่สเกาท์ได้ จึงเป็นส่วนสำคัญในการจัดกองทัพ แม้จะเรียกว่าเควสต์ภายนอก แต่บางแผนที่อย่าง 'Anatolia Gaiden' ก็มีกลไกที่สมบูรณ์แบบอย่างโดดเด่น", "ในทางกลับกัน ต่างจากเควสต์หลักที่ดำเนินไปโดยอัตโนมัติ เควสต์เสริมเหล่านี้หากเลยกำหนดเวลาไปแล้วจะพลาดไปเลย ขึ้นอยู่กับจังหวะการบันทึกอัตโนมัติ การจะย้อนกลับมาทำใหม่อาจเป็นเรื่องยาก", "ฟังก์ชันปฏิทินมี 'ตัวเตือน' (Reminder) ที่มีประโยชน์ แต่บทสอนเล่นไม่ได้อธิบายไว้อย่างชัดเจน ทำให้ผู้เขียนไม่รู้ว่ามีอยู่พักหนึ่ง แม้จะช่วยลดการพลาดเควสต์ได้ แต่ในเกมที่มีเนื้อหาจำกัดเวลาเยอะเช่นนี้ ควรมีการแนะนำที่ชัดเจนกว่านี้", "บอร์ดประกาศสำหรับรับเควสต์เสริมก็ไม่ได้ทำหน้าที่จัดระเบียบข้อมูลได้ดีพอ บางครั้งต้องตรวจสอบจุดต่างๆ บนแผนที่โลกทีละจุดเพื่อหาว่าวัตถุดิบที่ต้องการหาได้จากที่ไหน", "ปัญหาไม่ใช่ความซับซ้อนของเกม แต่คือการออกแบบข้อมูลที่รองรับความซับซ้อนนั้นไม่เพียงพอ", "ในเกมนี้ นอกจากจะมีการต่อสู้บนแผนที่แบบดั้งเดิมแล้ว ยังสามารถสำรวจดันเจี้ยนบนแผนที่โลกได้ ภายในดันเจี้ยนจะมีศัตรูวางอยู่ หากสัมผัสจะเข้าสู่ 'Quick Battle' เหมือน RPG ทั่วไป และสามารถหาไอเทมจากหีบสมบัติได้", "Quick Battle อาจเป็นองค์ประกอบใหม่เพื่อขยายความเป็น RPG แต่ผู้เขียนไม่พบความหมายสำคัญของมัน การวางตำแหน่งหรือการล่อศัตร 25 จะเสื่อมถอยลงไปสู่ความไร้สาระแบบนิยายวิทยาศาสตร์ แต่เรื่องราวในซีรีส์ Modern Warfare มักจะมีความสมจริงมากกว่า เมื่อคุณต้องสวมบทบาทเป็นทหารอังกฤษและสหรัฐฯ ที่ปฏิบัติการนอกกฎหมายในดินแดนต่างแดน และสังหารผู้คนเพียงเพราะความเห็นต่างทางอุดมการณ์ Call of Duty อาจให้ความรู้สึกที่น่ารังเกียจ เหมือนโฆษณาชวนเชื่อราคาถูกที่ออกแบบมาเพื่อเชิดชูสงครามและตอกย้ำเส้นแบ่งระหว่าง 'พวกเขา' กับ 'เรา'", "แต่ Modern Warfare 4 พยายามหลีกเลี่ยงสิ่งเหล่านั้น แม้จะเป็นเพียงก้าวเล็กๆ แต่เกมปีนี้มีความเป็นมนุษยธรรมมากขึ้น โดยล้อไปกับภารกิจ 'No Russian' ในปี 2009 มีภารกิจไม่กี่อย่างที่ให้คุณสวมบทบาทเป็น 'ศัตรู' และบังคับให้คุณตัดสินใจเชิงศีลธรรม ซึ่งผมต้องยอมรับว่ารู้สึกตกใจที่ได้เห็นสิ่งนี้ในเกม CoD ในปี 2019 ทีมพัฒนา Infinity Ward ตั้งคำถามว่าจะเป็นอย่างไรหากเกิดการโจมตีของผู้ก่อการร้ายบนถนนในลอนดอน ในปี 2022 สตูดิโอตั้งคำถามถึงเหตุการณ์เมื่อปฏิบัติการทางทหารระหว่างประเทศผิดพลาดบนแท่นขุดเจาะน้ำมันในเม็กซิโก และในปี 2023 เราได้ไปที่ Lower Manhattan ขณะที่กองทัพรัสเซียบุกโจมตีตลาดหลักทรัพย์นิวยอร์ก ดังนั้นเมื่อเปลี่ยนมุมมองให้เราเล่นเป็นทหารกองกำลังเกาหลีเหนือ ผมประหลาดใจจริงๆ ที่ได้รู้ว่าหากคุณปฏิเสธคำสั่ง คุณจะถูกยิงทิ้งทันที และปล่อยให้ภารกิจดำเนินต่อไปต่อหน้าศพของคุณ โดยไม่มีสถานะ 'Game Over' สำหรับการไม่ปฏิบัติตามคำสั่ง ความโหดร้ายของระบอบเผด็จการยังคงดำเนินต่อไปแม้คุณจะละทิ้งหน้าที่ นี่อาจเป็นการสื่อสารที่เรียบง่ายในเชิงวรรณกรรม แต่ผมคิดว่า Call of Duty กำลังพยายามสื่อสารบางอย่าง", "และมันก็ได้รับความสนใจจริงๆ เพียงสัปดาห์นี้ นักการเมืองเกาหลีใต้คนหนึ่งได้เรียกร้องให้ประธานาธิบดีของประเทศเล่น Modern Warfare 4 เนื่องจากภาพการจำลองการโจมตีเกาหลีเหนือต่อประเทศนั้นมีความโดดเด่นมาก (ซึ่งทำให้การที่ผู้พัฒนาใส่ฟุตเทจภัยพิบัติจริงเข้าไปกลายเป็นความผิดพลาดที่น่าเสียดาย) แม้ว่าจะเป็นเรื่องสำคัญที่ต้องจำไว้ว่าประชากรของประเทศไม่ใช่ผู้นำของประเทศ แต่ข่าวคราวเกี่ยวกับภัยคุกคามจากเกาหลีเหนือก็มีมานานหลายปีแล้ว และใน Modern Warfare 4 ทีม Infinity Ward ต้องการบอกเล่าเรื่องราวที่ 'ถอดมาจากพาดหัวข่าว' ผลลัพธ์ที่ได้คือรูปแบบที่ 'ตอบสนอง' มากขึ้น โดยที่ประเทศที่ติดอาวุธตอบโต้การรุกรานแทนที่จะเป็นผู้เริ่ม ซึ่งให้ความรู้สึกเร่งด่วนและการคาดเดาที่น่าสนใจกว่าการสู้รบในตะวันออกกลาง หรือการแทรกซึมในรัฐตัวแทนที่รัสเซียควบคุมอยู่เบื้องหลัง", "เมื่อเราสลับไปมาระหว่าง John Price อดีตหน่วย SAS สุดแกร่ง (ที่เราติดตามมาตั้งแต่ปี 2007) กับกลุ่มทหารเกณฑ์เกาหลีใต้และพันธมิตรนาวิกโยธินสหรัฐฯ ที่พบว่าตัวเองอยู่ท่ามกลางการรุกรานของเกาหลีเหนือที่โหดร้ายและมีการสูญเสียสูง เราจะได้เห็นการออกแบบแคมเปญของ Call of Duty ในระดับที่ดีที่สุด มีฉากยิงปืนในคลับที่ได้รับแรงบันดาลใจจาก John Wick ซึ่งพัฒนาไปสู่การวิ่งปาร์กูร์ข้ามหลังคาในแมนฮัตตัน มีฉากยิงปืนในลานรถไฟที่น่าประทับใจและชวนให้นึกถึงการออกแบบเกมตู้คลาสสิก มีพื้นที่โลกเปิดกว้างที่เน้นการลอบเร้นและการซุ่มยิง มีการไล่ล่าด้วยรถยนต์ผ่านถนนในปารีส และมีการจู่โจมชายหาดที่เชื่อมโยงทุกอย่างเข้าด้วยกันได้อย่างลงตัว", "นอกจากนั้น ภารกิจที่โดดเด่นที่สุดคือ 'Stranded' ซึ่งทีมเกาหลีใต้อยู่ลึกเข้าไปในดินแดนศัตรูและต้องต่อสู้เพื่อเอาชีวิตรอด ภารกิจนี้แนะนำระบบคราฟต์ไอเทม ซึ่งอาจดูเหมือนสิ่งที่ใส่เข้ามาให้ครบๆ แต่จริงๆ แล้ว Infinity Ward ใช้มันเป็นเครื่องมือสำคัญในการเปิดเผยว่าเครื่องมือแต่ละอย่างที่คุณมีนั้นสำคัญเพียงใด คุณต้องการกล้องเล็งความร้อนหรือไม่? ถ้าใช่ คุณต้องให้ความสำคัญกับมันมากกว่ากระสุน คุณต้องการระเบิดหรือไม่? อาวุธพื้นฐานของคุณก็จะด้อยลง มันช่วยเน้นย้ำว่าทุกแง่มุมของเครื่องมือใน Modern Warfare เสริมซึ่งกันและกันอย่างไร ส่งผลให้เกิดความลึกซึ้งและซับซ้อนที่ทำให้เกม Call of Duty ภาคเก่าๆ ดูธรรมดาไปเลย", "สิ่งนี้ได้รับการเติมเต็มด้วยฉากอย่าง 'Traffic' ที่คุณต้องไล่ล่าด้วยความเร็วสูงผ่านถนนในปารีส ซึ่งแน่นอนว่าสร้างความเสียหายมหาศาล ที่นี่คุณจะได้เห็นความกว้างขวางและความลึกของ AI ศัตรูที่ Infinity Ward สร้างขึ้น ซึ่งไม่ต้องสงสัยเลยว่าทำควบคู่ไปกับโหมด DMZ ใหม่ เราได้เห็นว่าเอนจิ้นของสตูดิโอนี้ซับซ้อนเพียงใด ทั้งการทำลายล้าง กลไกการเข้าที่กำบัง และเอฟเฟกต์ภาพมากมายที่ถาโถมเข้ามาบนหน้าจอพร้อมกัน มันท่วมท้น น่าเกรงขาม และเร้าใจ นี่คือจุดสูงสุดของ Call of Duty", "ระหว่างภารกิจที่โดดเด่นเหล่านี้ มีช่วงเวลาที่คุณถูกขอให้พิจารณาว่ามันเป็นอย่างไรสำหรับเบี้ยบนกระดาน ทหารคนอื่นๆ ผู้ที่ไม่มีชื่อเสียง ผู้ที่ถูกชักใยโดยกองกำลังที่พวกเขาไม่เข้าใจ มันอาจจะดูเรียบง่ายไปบ้างเหมือนเข็มกลัด 'สงครามเป็นเรื่องเลวร้าย' ที่ติดอยู่บนแจ็คเก็ตจากร้านขายของทหาร แต่ก็นะ ผมชอบแบบนี้มากกว่าเรื่องราว 'ooh-rah!' ที่กองทัพสหรัฐฯ เข้ามาช่วยเหลืออีกครั้ง", "ข้อเสียของแคมเปญมาจากรูปแบบและการดำเนินเรื่องมากกว่าเนื้อหา เรื่องราวของ Price จบลงโดยไม่มีเสียงปรบมือ ผมจะไม่เปิดเผยรายละเอียดที่นี่ แต่การกระทำของเขาและสิ่งที่เขาทำเพื่อหยุดยั้งแผนการของ Mads Mikkelsen ที่ถูกนำเสนออย่างแปลกประหลาดนั้นถูกทิ้งไว้ในความมืด ในขณะที่การต่อต้านอย่างสิ้นหวังของทหารเกณฑ์เกาหลีใต้ได้รับความสนใจ ผมคิดว่า Call of Duty อาจพยายามสื่อสารว่า การกระทำที่คลุมเครือทางศีลธรรมและสร้างความเสียหายข้างเคียงของเจ้าหน้าที่ที่สิ้นหวังคนหนึ่งที่ช่วยโลกไว้ได้นั้น ไม่ได้รับแสงสว่าง แต่การป้องกันที่ 'กล้าหาญ' ของทหารชั้นผู้น้อยในแนวหน้าควรได้รับการยกย่อง สงครามเป็นเรื่องยุ่งเหยิง ไม่มีใครถูก ทุกคนแพ้ ยกเว้นบริษัทข้ามชาติที่ส่งอาวุธไปอยู่ในมือมนุษย์ นั่นคือสิ่งที่ผมควรคิดหลังจากเล่นจบใช่ไหม?", "ไม่ว่าผลกระทบทางอารมณ์จะเป็นอย่างไร คุณไม่สามารถโต้แย้งผลกระทบทางกายภาพได้ นี่คือแคมเปญ 8 ชั่วโมงที่กระชับและมีช่วงเวลาที่เทียบเท่ากับสิ่งที่ดีที่สุดของ Modern Warfare มันจบลงก่อนที่จะยืดเยื้อ มีไอเดียใหม่ๆ มากมาย และหากเล่นในโหมดที่ยากที่สุด มันคือปริศนาที่ออกแบบมาอย่างดีซึ่งหมกมุ่นอยู่กับรายละเอียดพอๆ กับฉากอลังการสไตล์ Michael Bay มันห่างไกลจากสิ่งที่เกิดขึ้นใน Black Ops 7 ปีที่แล้วมาก", "หลังจากรู้สึกเกือบจะอินกับแคมเปญ Call of Duty ผมก็ต้องเปิดโหมด Multiplayer ซึ่งได้รับการขัดเกลาจนเกือบสมบูรณ์แบบ เป็นสนามรบที่รวดเร็วและดุเดือดของการเล็งเร็ว การสไลด์ และทางเดินสังหาร การออกแบบแผนที่นั้นยอดเยี่ยมตามสไตล์ Infinity Ward และการยิงปืนก็ดีเหมือนที่เคยเป็นในเกม Modern Warfare ตั้งแต่ปี 2019 ที่ Infinity Ward ลงทุนมหาศาลในการสร้างเอนจิ้นใหม่ ประสบการณ์ Call of Duty ก็หรูหราขึ้น การออกแบบเสียงเพียงอย่างเดียวก็ควรค่าแก่การปรบมือ ทุกเสียงของกลไกปืน ทุกปลอกกระสุนที่ตกลงพื้น ทุกเสียงของเทอร์ไมต์ที่เจาะผ่านที่กำบัง... มันระบุได้ทันทีและสำคัญมาก การเล่น Modern Warfare 4 โดยไม่มีหูฟังดีๆ หรือระบบเสียงรอบทิศทางถือเป็นการเสียเปรียบอย่างตั้งใจ", "มีข้อกังวลเล็กน้อยตามปกติ กลไกการเกิดใหม่บางอย่างน่ารำคาญ (โดยเฉพาะในแผนที่ที่รวดเร็วและโหดร้าย เช่น Shipment ที่เพิ่มเข้ามาสัปดาห์นี้เป็นตัวอย่างที่แย่มาก) และการปรับสมดุลอาวุธบางอย่างยังไม่นิ่งพอ ส่วนหนึ่งมาจากการเปลี่ยนแปลงความเสียหายของอาวุธในนาทีสุดท้ายที่ขยายเวลาการสังหาร (Time-to-kill) ให้ยาวนานกว่าปกติของ Infinity Ward แม้ว่าจะมีความโกลาหลสำหรับผู้เล่นยุคแรกอย่างผม แต่มันแสดงให้เห็นถึงระดับความละเอียดที่ Infinity Ward ต้องจัดการ ผมอยากเห็นเบื้องหลังของ Modern Warfare 4 ว่าสตูดิโอปรับแต่งปืนอย่างไรเพื่อให้ทันกับสิ่งที่ผู้เล่นทำ เวลาในการสังหารที่ต่ำลงเล็กน้อยเป็นการทดลองที่น่าสนใจในการค้นหาว่า Modern Warfare คืออะไรนอกเหนือจากการเลือกปืน และผมยินดีที่จะยอมรับการปรับสมดุลที่แปลกประหลาดเพื่อแลกกับระบบความเสียหายที่ลึกซึ้งและซับซ้อนกว่า", "ระบบการปรับแต่งก็ทำงานได้ดีที่นี่ ด้วยอุปกรณ์เสริมที่เหมาะสม ปืนบางกระบอกจะถูกยกระดับจาก 'มีประโยชน์' เป็น 'จำเป็น' SMG รุ่น ISO Nightshade ดูเหมือนจะโกงไปหน่อยในตอนนี้ และผมโดน LMG รุ่น Type 73 จัดการบ่อยครั้ง ผมเป็นนักแม่นปืนโดยกำเนิด และ Oris 8.6 เป็นปืนโปรดตัวแรกสำหรับการยิงหัวข้ามแผนที่ โดยเฉพาะเมื่อใส่กล้อง 2.1x พร้อมระบบตรวจจับความร้อน เศรษฐกิจโดยรวมของปืนและระยะเทียบกับพลังดูเหมือนจะยังไม่สมดุลนัก ซึ่งกำลังได้รับการแก้ไขในขณะที่ผมพิมพ์อยู่นี้ แต่ผมกำลังเล่น Multiplayer ในสัปดาห์เปิดตัว ดังนั้นย่อมมีความขัดแย้งเกิดขึ้นเสมอ", "จากนั้นก็มี Kill Block แนวคิดแผนที่และโหมด Multiplayer แบบไดนามิกที่หมุนเวียนไปเรื่อยๆ มันดูไร้สาระในตอนแรก แต่ด้วยการใช้ 'แผ่น' ต่างๆ มันสามารถสร้างแผนที่ได้มากกว่า 500 รูปแบบ ทำให้ไม่มีแมตช์ไหนที่เล่นเหมือนเดิม แผนที่ใน Call of Duty มักถูกกำหนดโดยแนวสายตา ถ้าคุณยืนตรงนี้ คุณสามารถยิงใครบางคนตรงนั้นได้ ถ้าคุณดักมุมนี้ คุณจะได้คิล ถ้าคุณซุ่มยิงในเลนนี้ คุณจะได้จัดการมือใหม่มากมาย Kill Block พลิกทุกอย่างกลับหัวกลับหาง บังคับให้ผู้เล่นต้องตอบสนองมากขึ้น และมีส่วนร่วมกับระบบใน Modern Warfare 4 มากกว่าพึ่งพาสัญชาตญาณที่สั่งสมมานานกว่าสองทศวรรษ ด้วยสัญญาว่าจะมีองค์ประกอบแบบโมดูลาร์เพิ่มเติมในอนาคต เช่น แผนที่ยอดนิยมอย่าง Crash ผมมองว่าโหมดนี้จะกลายเป็นอีกหนึ่งเสาหลักในจักรวาล Call of Duty ที่ขยายตัวไม่หยุด นี่คือวิธีสร้างชีวิตชีวาให้กับโหมดการแข่งขันที่มักจะล้มเหลวเมื่อเทียบกับโหมด Team Deathmatch", "ผมต้องยกย่องความซับซ้อนและความมหัศจรรย์ที่ Infinity Ward แสดงให้เห็นในการจัดการปืน อุปกรณ์เสริมแต่ละชิ้นมีความหมาย ปืนส่วนใหญ่ให้ความรู้สึกที่เป็นเอกลักษณ์ และผลตอบรับที่คุณได้รับจากการยิงอาวุธใดๆ นั้นยอดเยี่ยมมาก มันมีมูลค่าการผลิตทั้งหมดของเกมจำลองการทหาร แต่ในการใช้งานจริง มันอ่านง่ายและเรียบง่ายเหมือนเกมอาร์เคด ไม่มีใครทำได้เหมือน Infinity Ward และแม้ว่านี่จะให้ความรู้สึกเหมือนเป็นการทำซ้ำจากเกม Modern Warfare สามภาคที่ผ่านมา แต่ผมจะไม่ตำหนินักพัฒนาที่ยังคงอยู่ในแนวทางของตนและพัฒนาสูตรที่ได้ผล", "และนั่นนำเราไปสู่ DMZ ในตอนแรกผมรู้สึกสงสัย 'นี่คือ Call of Duty ที่วิ่งตามกระแส' ผมคิด 'นี่คือการตามเทรนด์ที่ผิดพลาด' แต่ Infinity Ward ไม่กลัวการเปลี่ยนแปลง และผมก็ไม่ควรเช่นกัน เทรนด์เกม Extraction Shooter ไม่มีทีท่าว่าจะแผ่วลง และด้วยการที่ Call of Duty สามารถทำให้มันทำงานได้ภายในระบบอาร์เคดผสมจำลองของเอนจิ้น ผมต้องยอมรับมัน ผมไม่คิดว่าจะเป็นการกล่าวเกินจริงที่จะบอกว่า DMZ สามารถเป็นเกมแยกต่างหากได้ ซึ่งอัดแน่นไปด้วยเนื้อหาที่สามารถท้าชนกับเกมอย่าง Marathon หรือ Arc Raiders ได้เลย", "เกมมีการตั้งค่าการเข้าถึงที่หลากหลาย ทั้งการควบคุมแบบง่าย ฟังก์ชันเซ็นเซอร์ตรวจจับการเคลื่อนไหว การปรับแต่ง Deadzone/Trigger เอฟเฟกต์การสั่น/ไกปืน การลดเสียงรบกวนในหู การโฟกัสเสียง (PS5 เท่านั้น) ตัวเลือกเสียงโมโน การปรับแต่ง HUD การปรับแต่ง Motion Blur/DoF ฟิลเตอร์สี ตัวเลือกการลดการเคลื่อนไหวของกล้อง ระบบช่วยเล็ง ความไวในการเล็ง ระบบช่วยเคลื่อนที่/วิ่ง และแถบเลื่อน FoV", "แผนที่เมือง Hajin ซึ่งถูกนำกลับมาใช้ใหม่อย่างชาญฉลาดจากแคมเปญนั้นกว้างขวางและเต็มไปด้วยรายละเอียด และงานที่คุณได้รับภายในขอบเขตของเมืองนั้นรวดเร็วและไม่ยุ่งยาก ซึ่งมากกว่าที่ผมจะพูดถึง Marathon ได้ คุณสามารถรับเงินที่คงอยู่แม้ว่าคุณจะตาย คุณสามารถเสียสละพลังชีวิตสูงสุดเพื่อ 'ฟื้นคืนชีพ' จากสถานะล้มลงแต่ยังไม่ตาย และคุณจะได้รับ XP จากการทำเกือบทุกอย่าง ผลลัพธ์ที่ได้คือประสบการณ์ Extraction Shooter ที่ให้ความรู้สึกสบายๆ และเข้าถึงง่ายสำหรับผู้เล่น FPS ทั่วไป นี่ไม่ใช่ 'เกมไลฟ์สไตล์' เหมือนเกม Extraction Shooter อื่นๆ แม้ว่ามันจะมีระบบลอบเร้นแบบกึ่งๆ อยู่ก็ตาม", "ในหลายๆ ด้าน DMZ เลียนแบบสิ่งที่ Activision ทำกับ Warzone คือการจัดการสูตรที่ซับซ้อนให้สมเหตุสมผลภายในระบบนิเวศของ Call of Duty มันเป็นการตีความที่ยอดเยี่ยมของสูตร PvPvE ที่ค่อยๆ พัฒนามาตลอดทศวรรษที่ผ่านมา และผมคิดว่านี่คือจุดที่ DMZ พบช่องว่างของตัวเอง Arc Raiders กลายเป็นเรื่องของ PvE มากขึ้น (จากประสบการณ์ของผม) และ Marathon กับ Tarkov เน้นหนักไปที่ PvP แต่ DMZ กลับเดินอยู่บนเส้นแบ่งระหว่างทั้งสอง และเมื่อเวลาผ่านไปและ Infinity Ward คอยตรวจสอบโหมดนี้และวิธีที่ผู้คนมีส่วนร่วมกับมัน ผมจินตนาการว่าช่องว่างของมันจะชัดเจนยิ่งขึ้นเมื่อเทียบกับเกมในประเภทเดียวกัน เราเริ่มเห็นการเปลี่ยนแปลงบางอย่างแทรกซึมเข้ามาในเกมแล้ว และมันยังเปิดตัวไม่ถึงสัปดาห์ด้วยซ้ำ ซึ่งเป็นสัญญาณที่ดีสำหรับอนาคต", "Modern Warfare 4 แสดงถึงกระแสที่สูงที่สุดของ Call of Duty ในรอบ 7 ปี Infinity Ward จำเป็นต้องสร้างสมดุลที่ผมไม่ขออิจฉา การใส่ความโหยหาอดีตลงในซีรีส์ที่เต็มไปด้วยธรรมเนียมและความคาดหวังจนแทบไม่มีที่ว่างสำหรับสิ่งใหม่ ควบคู่ไปกับนวัตกรรมและความน่าสนใจที่เพียงพอที่จะทำให้ผู้คนสนใจ นอกจากนั้น หลังจากหลายปีที่อ่อนแอ โดยเฉพาะ Black Ops 7 ที่สร้างความเสียหายต่อชื่อเสียงจนแม้แต่แฟนพันธุ์แท้ CoD ที่ภักดีที่สุดก็เริ่มมองเห็นความเสื่อมโทรมของซีรีส์ ดังนั้นแม้ว่าแคมเปญจะดิ้นรนภายใต้น้ำหนักของมรดกตกทอด และ Multiplayer จะยินดีที่จะหมุนไปบนล้อเดิมที่ Modern Warfare ใช้มาสี่ภาคแล้ว แต่ Infinity Ward ก็ทำสำเร็จ หลังจากห่างหายจากการคุมบังเหียนไปสี่ปี ในการกอบกู้ Call of Duty Modern Warfare 4 คือการแก้ไขเส้นทางที่จำเป็นอย่างยิ่งและถูกนำมาใช้อย่างชาญฉลาด"], "link": "https://www.eurogamer.net/call-of-duty-modern-warfare-4-review", "canonical_link": "https://www.eurogamer.net/call-of-duty-modern-warfare-4-review", "cover_image_url": "https://assetsio.gnwcdn.com/CoD-MW4_i33XbuE.jpg?width=1200&quality=85&format=jpg&auto=webp", "gallery_images": ["https://assetsio.gnwcdn.com/pxl_20220402_110941365.portrait_V04meYj.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://i.ytimg.com/vi/JJBvUbqQSuc/hqdefault.jpg", "https://assetsio.gnwcdn.com/paris_chase.webp?width=1200&height=2048&fit=bounds&quality=85 นช่วง 1-2 ปีที่ผ่านมา เกมแนว Extraction Shooter ได้รับความนิยมอย่างมากจากกระแสของเกมอย่าง Marathon และ Arc Raiders แม้ว่า Call of Duty จะเริ่มเข้าสู่ตลาดนี้ด้วย DMZ รุ่นแรกในปี 2022 แต่การกลับมาของ DMZ ในปี 2026 นี้ถือว่ามาได้ถูกจังหวะเวลาอย่างยิ่ง ตลอดสัปดาห์ที่ผ่านมา ผมได้ใช้เวลาสำรวจทั้งซากปรักหักพังของเมือง พื้นที่ป่า และฐานทัพที่แน่นหนา การได้ใช้เวลาหลายชั่วโมงไปกับการขโมยรถ แฮ็กระบบ SAM และกำจัดเป้าหมาย ทำให้ผมกล้ายืนยันว่า DMZ โฉมใหม่ที่ใหญ่และประณีตกว่าเดิมนี้ คือดาวดวงใหม่ที่น่าหลงใหลในแนวเกมนี้", "หัวใจสำคัญของเกมแนว PvPvE คือการออกแบบภารกิจและเลเวลที่กระตุ้นให้ผู้เล่นอยากสำรวจ มอบรางวัลเมื่อผ่านความยากลำบาก และผลักดันให้เกิดปฏิสัมพันธ์กับผู้เล่นอื่นเพื่อรักษาของที่หามาได้ ในแง่นี้ พื้นที่ 'ฮาจิน' (Hajin) ในเกาหลีที่เป็นฉากหลังของเกมทำหน้าที่ได้ดีเยี่ยม มีทั้งหมู่บ้านทางตอนเหนือ ใจกลางเมืองที่อันตรายทางตะวันออก และเรือนจำที่โดดเดี่ยวทางตะวันตก ซึ่งถูกคั่นด้วยป่าเขาที่เต็มไปด้วยจุดยุทธศาสตร์และของรางวัลล้ำค่าที่รอให้ผู้เล่นไปเก็บ", "แม้ว่าเมื่อเทียบกับเกมแนวไซไฟที่มีกราฟิกตระการตา DMZ อาจดูเหมือนเมืองทั่วไปที่พบเห็นได้ในปัจจุบัน แต่ด้วยความกว้างใหญ่ของแผนที่ ทำให้การเล่นหนึ่งรอบ (Run) ประมาณ 30 นาที อาจใช้เวลาไปกับการสำรวจเพียงแค่ส่วนเล็กๆ ของแผนที่เท่านั้น นอกจากนี้ ในขณะที่โหมด Battle Royale อย่าง Warzone จะบีบให้ผู้เล่นมารวมตัวกันด้วยวงที่แคบลง แต่ DMZ กลับใช้ระบบ 'Dynamic Operation' เพื่อสร้างแรงจูงใจในการผจญภัยให้กับทีมแทน", "Dynamic Operation คือภารกิจที่เกิดขึ้นแบบสุ่มระหว่างการเดินทาง ตั้งแต่การเก็บพัสดุ การระเบิดเป้าหมาย ไปจนถึงการคุ้มกัน VIP ภารกิจเหล่านี้มักมีหลายขั้นตอนและต้องเผชิญกับศัตรู NPC ที่วางแนวป้องกันอย่างเป็นระบบ การทำภารกิจสำเร็จจะนำไปสู่การส่งเสบียง (Supply Drop) และเพิ่มมูลค่าของรางวัลตามจำนวนภารกิจที่ทำได้ รูปแบบนี้ให้ความรู้สึกที่สดใหม่และคาดเดาไม่ได้มากกว่ารายการภารกิจแบบเดิมๆ เพราะเราไม่มีทางรู้เลยว่าหลังออกตัวไปแล้วจะมีปฏิบัติการอะไรมารออยู่", "แม้จะมีเหตุการณ์ที่ออกแบบมาเพื่อดึงดูดผู้เล่นอื่นให้เข้ามามีส่วนร่วม แต่ผู้เล่นส่วนใหญ่กลับเลือกที่จะหลีกเลี่ยงการปะทะ ทำให้การต่อสู้กับผู้เล่นอื่นในพื้นที่เปิดค่อนข้างจำกัด อย่างไรก็ตาม การประมาทเพียงนิดเดียวอาจทำให้ความพยายามทั้งหมดพังทลายลงได้ด้วยฝีมือของผู้เล่นคนอื่น และอย่าเข้าใจผิดว่าความเงียบคือความสงบ เพราะผู้เล่นในเกมนี้พร้อมที่จะเปิดฉากยิงทันทีที่เห็นหน้ากัน แม้จะมีระบบ 'พินเพื่อประนีประนอม' (Reconciliation Pin) แต่ช่วงเวลาที่ตึงเครียดที่สุดมักเกิดขึ้นตอนรอเฮลิคอปเตอร์มารับ เมื่อผู้เล่นอื่นตัดสินใจว่า 'เฮลิคอปเตอร์ลำนี้ไม่มีที่ว่างสำหรับคนอื่นนอกจากพวกเรา'", "พื้นที่ฮาจินเต็มไปด้วยชีวิตชีวา มีทั้งกองลาดตระเวนของศัตรูที่ขับรถผ่านไปมา ทั้งรถจี๊ปเดี่ยวหรือขบวนรถขนาดใหญ่ บนฟ้ามีเฮลิคอปเตอร์และโดรนคอยตรวจตรา บางครั้ง NPC ฝ่ายตรงข้ามยังสู้กันเองอีกด้วย การได้ขึ้นรถไฟที่วิ่งตามตารางเวลาเพื่อเดินทางข้ามพื้นที่เป็นสิ่งที่ทำได้จริง ความตึงเครียดมีอยู่ทุกย่างก้าว เพราะศัตรูอาจซุ่มอยู่ทุกที่ รวมถึงหุ่นยนต์สุนัขระเบิดพลีชีพที่คอยดมกลิ่นผู้เล่นตามอาคารต่างๆ", "การต่อสู้กับ NPC จะเริ่มจากระดับง่าย แต่จะทวีความรุนแรงขึ้นเมื่อชื่อเสียงของทีมสูงขึ้น ศัตรูจะเริ่มสวมเกราะ ใช้รถที่แข็งแกร่งขึ้น และใช้อาวุธเกรดสูงขึ้น ทำให้การยิงปะทะมีความกดดันอย่างมาก ผู้เล่นที่เล่นคนเดียวมักจะพยายามเก็บของรางวัลไว้คนเดียว ซึ่งมักจะจบลงด้วยความล้มเหลว เพราะศัตรูมีอยู่ทุกหนทุกแห่งและพร้อมจะจู่โจมจากจุดที่คาดไม่ถึงเสมอ", "ในส่วนของ 'ลูเทแนนท์' (Lieutenant) ซึ่งเป็นบอสระดับสูง ถือเป็นความท้าทายที่ยากที่สุด บางตัวจะซุ่มโจมตีในป่า บางตัวสวมเกราะหนักพร้อมมินิกันเดินตรวจตราในเมือง หากไม่มีอุปกรณ์ระดับสูง การหลีกเลี่ยงการเผชิญหน้ากับพวกเขานับเป็นทางเลือกที่ปลอดภัยกว่า", "สิ่งที่ทำให้เกมแนวนี้มีเสน่ห์คืออิสระในการเล่น (Agency) ผู้เล่นสามารถเลือกได้ว่าจะบุกแบบดุดัน หรือจะค่อยๆ ย่องผ่านไปอย่างอดทน DMZ สร้าง Sandbox ที่รองรับทุกสไตล์การเล่นได้อย่างยอดเยี่ยม แม้แต่ผู้เล่นที่อายุมากขึ้นและมีการตอบสนองไม่ไวเท่าวัยรุ่น ก็ยังสามารถสนุกกับเกมนี้ได้ผ่านการวางแผนและการเตรียมตัวที่ดี", "ระบบการเล่นของ Call of Duty ยังคงเป็นระดับแนวหน้า ทั้งความสมจริงของอาวุธและความคล่องตัวที่ลงตัว การปรับปรุงระบบการปีนป่าย (Mantle) ที่สามารถยกเลิกได้กลางคันถือเป็นการปรับปรุงคุณภาพชีวิต (QoL) ที่ยอดเยี่ยม อย่างไรก็ตาม อาวุธปืนส่วนใหญ่ยังคงอยู่ในกรอบเดิมๆ (ลูกซอง, ไรเฟิลจู่โจม, สไนเปอร์) ซึ่งขาดเอกลักษณ์เฉพาะตัวไปบ้าง", "นอกจากนี้ยังมีภารกิจเนื้อเรื่อง (Story Missions) ที่เป็นเควสต์ต่อเนื่องคล้ายแคมเปญแต่ไม่มีฉากคัตซีน เช่น การเข็นรถเข็นผู้ป่วยที่มีนายพลบาดเจ็บหนีจากศัตรู แม้ภารกิจเหล่านี้จะมีจำนวนจำกัดและรางวัลไม่มากนัก แต่ก็เป็นบทเรียนที่ดีในการทำความเข้าใจจังหวะของเกมและสถานที่ต่างๆ ในแผนที่", "ระหว่างภารกิจ ผู้เล่นจะจัดการอุปกรณ์ที่ฐานทัพ (FOB) ซึ่งของที่หามาได้ต้องนำไปเก็บหรือใช้เพื่อการออกรบครั้งต่อไป การอัปเกรดอาวุธและอุปกรณ์มีค่าใช้จ่าย แต่ก็คุ้มค่าในการเพิ่มโอกาสรอดชีวิต อย่างไรก็ตาม การใช้เงินจำนวนมากไม่ได้หมายความว่าอุปกรณ์จะเก่งขึ้นแบบก้าวกระโดดเสมอไป", "การเก็บเลเวลทำได้ง่ายในช่วงแรก แต่จะเริ่มช้าลงเมื่อถึงช่วงกลางเกม และรางวัลในระดับสูงๆ ก็ไม่ได้ดึงดูดใจพอที่จะทำให้รู้สึกว่าต้องรีบไปให้ถึงระดับ 64 ในส่วนของระบบ特性 (Traits) ของตัวละคร แม้จะมีระบบ Skill Tree แต่ก็ไม่ได้ให้ความรู้สึกถึงความเป็นเอกลักษณ์ของตัวละครแต่ละตัวมากนัก เพราะทุกคนใช้กลุ่ม特性หลักเดียวกัน และการสุ่ม特性ย่อยก็ทำให้คาดเดาผลลัพธ์ได้ยาก", "ท้ายที่สุด ผมพบว่าตัวเองไม่ได้กระตือรือร้นที่จะ 'สร้าง' ตัวละครให้สมบูรณ์แบบอีกต่อไป เพราะเมื่อรู้ว่าทุกอย่างมีความเสี่ยงที่จะสูญเสียไปหากหนีไม่พ้น ความพยายามในการพัฒนาตัวละครจึงดูไร้ความหมายในระยะยาว แม้จะมีระบบที่น่าสนใจ แต่สุดท้ายความสำเร็จในแต่ละรอบก็ขึ้นอยู่กับว่าเราหลบกระสุนได้ดีแค่ไหนมากกว่า", "สรุปแล้ว DMZ ใน Modern Warfare 4 คือการนำระบบการยิงที่สนุกและตื่นเต้นของ Call of Duty มาผสมผสานกับแนวเกมที่ผมชื่นชอบได้อย่างลงตัว แม้จะมีจุดสังเกตในเรื่องของระบบ RPG และแรงจูงใจในการเล่นระยะยาวที่ยังไม่แข็งแกร่งพอ แต่ในฐานะเกมแนว Extraction Shooter ที่มอบประสบการณ์ความตึงเครียดคุณภาพสูง นี่คือหนึ่งในเกมที่คุ้มค่าแก่การเล่นอย่างแน่นอน", "บทสรุปคำตัดสิน (Verdict): 8/10 - Great: โหมด DMZ ใน Call of Duty: Modern Warfare 4 คือผลงานชิ้นสำคัญที่เพิ่มเข้ามาในคลังเกมแนว Extraction Shooter ซึ่งมอบความตื่นเต้นและประสบการณ์การเล่นที่ยอดเยี่ยมโดยไม่ทำให้ผู้เล่นรู้สึกกดดันจนเกินไป"], "link": "https://jp.ign.com/call-of-duty-modern-warfare-4/84514/call-of-duty-modern-warfare-4dmz", "canonical_link": "https://jp.ign.com/call-of-duty-modern-warfare-4/84514/call-of-duty-modern-warfare-4dmz", "cover_image_url": "https://sm.ign.com/t/ign_jp/review/c/call-of-du/call-of-duty-modern-warfare-4-dmz-review_g8e5.1200.jpg", "gallery_images": [], "videos": [], "review_score": "8", "published_ts": 1793251781, "published_at": "2026-10-29T05:29:41Z", "published_th": "29 ต.ค. 2026 • 12:29 น.", "category_hint": "Review", "sub_tag": "CALL OF DUTY"}, {"id": 1794801668383, "guid": "https://jp.ign.com/phantom-blade-zero/84479/phantom-blade-zero", "original_title": "『Phantom Blade Zero』レビュー 記憶に残るボス戦、魅力的な戦闘、そしてあふれんばかりの外連味を備えた、驚くほど滑らかなアクションゲーム", "thai_title": "รีวิว Phantom Blade Zero: เกมแอ็กชันสุดลื่นไหลที่มาพร้อมการต่อสู้กับบอสอันน่าจดจำและสไตล์ที่โดดเด่น", "tag": "Review", "bullet_points": ["Phantom Blade Zero นำเสนอระบบการต่อสู้ที่ลื่นไหลและออกแบบมาอย่างประณีต มอบความพึงพอใจสูงสุดในการเล่นตลอด 50 ชั่วโมง", "จุดเด่นอยู่ที่การออกแบบบอสที่สร้างสรรค์และหลากหลาย พร้อมระบบการสลับอาวุธที่ส่งผลต่อกลยุทธ์การเล่นอย่างมีนัยสำคัญ", "แม้จะมีปัญหาเรื่องเนื้อเรื่องที่ซับซ้อนเกินจำเป็นและบั๊กด้านสภาพแวดล้อม แต่ประสบการณ์การต่อสู้โดยรวมถือว่ายอดเยี่ยม", "ระบบการเล่นมีความสมดุลสูง ไม่ยากจนเกินไปและมีระบบเช็คพอยต์บอสที่ช่วยลดความหงุดหงิดจากการตายซ้ำซาก", "ได้รับคะแนนรีวิว 9/10 (Amazing) จาก IGN โดยยกย่องว่าเป็นหนึ่งในเกมแอ็กชันที่ดีที่สุดในรอบหลายปี"], "full_paragraphs": ["Phantom Blade Zero เป็นเกมที่ดูดีเกินจริงมาตลอดหลายปีที่ผ่านมา โดยเฉพาะเมื่อพิจารณาว่ามาจากสตูดิโอที่เคยทำเกมมือถือมาก่อน ดังนั้นการที่ผมสามารถพูดได้เต็มปากว่ามันเป็นเกมที่เล่นสนุกสมกับรูปลักษณ์ภายนอกหลังจากใช้เวลากว่า 50 ชั่วโมงไปกับการโชว์ลีลากังฟูนั้น ถือเป็นคำชมสูงสุดที่ผมจะมอบให้ได้ นี่คือเกมแอ็กชันที่ลื่นไหลอย่างน่าเหลือเชื่อและมอบความพึงพอใจได้ดีที่สุดเกมหนึ่งที่ผมเคยเล่นในช่วงไม่กี่ปีมานี้ ด้วยระบบการต่อสู้ที่ถูกปรับแต่งมาอย่างยอดเยี่ยม ในแต่ละฉากที่สวยงามนั้นเต็มไปด้วยความลับให้ค้นหาและเควสต์ให้ทำมากมาย ควบคู่ไปกับการต่อสู้ที่ออกแบบมาอย่างชาญฉลาด แม้จะมีจุดอ่อนเรื่องเนื้อเรื่องที่ซับซ้อนเข้าใจยากและปัญหาด้านประสิทธิภาพที่เกิดขึ้นเป็นครั้งคราว แต่ด้วยแอ็กชันที่น่าทึ่งและองค์ประกอบเกือบทุกอย่างที่ทำออกมาได้อย่างยอดเยี่ยม ทำให้แทบไม่มีช่วงเวลาไหนเลยที่ผมจะไม่รู้สึกตื่นเต้นไปกับการฟาดฟันเหล่าจอมยุทธ์ในโลกแห่งนี้", "ความรู้สึกในการเล่น Phantom Blade Zero เหมือนกับการกระโดดเข้าสู่โลกของภาพยนตร์กำลังภายในฟอร์มยักษ์ ผู้เล่นจะได้รับบทเป็นจอมยุทธ์ผู้ลึกลับที่มีเวลาเหลือเพียง 66 วันก่อนจะสิ้นใจ เพื่อออกเดินทางในโลก 'Shadow World' ที่เสื่อมโทรม โดยต้องเผชิญหน้ากับสัตว์ประหลาดและยอดฝีมือมากมาย อย่างไรก็ตาม เนื้อเรื่องไม่ใช่จุดแข็งของเกมนี้ เพราะมีการยัดเยียดรายละเอียดมากเกินไป ทั้งศัพท์เฉพาะทางที่เข้าใจยาก ตัวละครจำนวนมาก และไทม์ไลน์ที่ซับซ้อนเกินความจำเป็น ซึ่งส่วนใหญ่ไม่ได้ส่งผลต่อเนื้อเรื่องหลักเลย ในช่วง 2 ชั่วโมงแรก ผมรู้สึกเหนื่อยล้ากับการอธิบายสถานการณ์ที่สลับไปมาระหว่างอดีตและปัจจุบันจนแทบไม่ได้เริ่มสู้กับบอสตัวแรก แต่โชคดีที่ตัวเอกอย่าง 'Soul' มีบุคลิกที่นิ่งสงบ ทำให้ผมพอจะมองข้ามความยืดเยื้อของเนื้อเรื่องไปได้บ้าง", "ส่วนใหญ่ของเกมคือการสำรวจโลกและการต่อสู้ ซึ่งเป็นส่วนที่เกมให้ความสำคัญและทำออกมาได้ดีเยี่ยม การควบคุมการปัดป้อง (Parry) และการหลบหลีกนั้นให้ความรู้สึกที่เป็นธรรมชาติภายในเวลาไม่กี่นาที ระบบอาวุธ คอมโบ และความสามารถพิเศษถูกนำเสนออย่างเป็นลำดับขั้นตอน ไม่ซับซ้อนจนเกินไปแต่มีความลึกซึ้ง ผมค่อนข้างพิถีพิถันกับจังหวะการต่อสู้ แต่เกมนี้กลับทำให้ผมรู้สึกคุ้นเคยเหมือนได้พบเพื่อนเก่าและติดใจในทันที ซึ่งเป็นสิ่งที่ทำได้ยากมากในเกมแนวนี้", "สิ่งที่น่าประทับใจยิ่งกว่าคืออาวุธหลายสิบชนิดที่มีทักษะเฉพาะตัว ซึ่งเกมกระตุ้นให้เราเปลี่ยนสไตล์การเล่นอยู่เสมอ การสลับอาวุธระหว่างต่อสู้เป็นสิ่งจำเป็นเพราะช่วยฟื้นฟูเกจ 'Killing Intent' ซึ่งศัตรูและบอสส่วนใหญ่จะคอยลดเกจนี้ของเราอยู่ตลอด โชคดีที่เกมนี้อนุญาตให้รีเซ็ตแต้มอัปเกรดอาวุธได้ง่ายมาก ทำให้เราไม่ต้องยึดติดกับอาวุธเดียว และเกมมักจะมอบอาวุธที่เหมาะสมให้เราก่อนจะถึงพื้นที่ที่มีบอสแพ้ทางเสมอ เช่น การพบอาวุธธาตุน้ำก่อนจะถึงพื้นที่บอสธาตุไฟ ซึ่งถือว่าใส่ใจรายละเอียดได้ดีมาก", "นอกจากนี้ยังมีอุปกรณ์เสริมอย่างตะขอเกี่ยวและธนูที่ช่วยในการสำรวจและต่อสู้ รวมถึงเครื่องประดับที่มอบบัฟต่างๆ เช่น การเพิ่มพลังโจมตีเมื่อเลือดเต็ม และผังทักษะที่ช่วยให้เราปรับแต่งสไตล์การต่อสู้ได้อย่างละเอียด ผมใช้เวลาไปกับการลองผิดลองถูกกับอุปกรณ์ต่างๆ มากกว่าเกมอื่น เพราะแม้แต่ท่าปิดฉากศัตรูธรรมดาก็ยังทำออกมาได้สวยงามและคุ้มค่าที่จะลอง", "ในแผนที่ทั้ง 8 แห่ง ผู้เล่นจะมีเวลาเหลือเฟือในการทดลองอุปกรณ์ต่างๆ ทุกแผนที่เต็มไปด้วยศัตรู เควสต์รอง และความลับที่ซ่อนอยู่มากมาย ซึ่งหลายอย่างอาจถูกมองข้ามได้ง่ายๆ เช่น เควสต์ฝึกวิชาจาก Donnie Yen ที่ปรากฏตัวในฐานะชายสวมหน้ากากทองคำ ซึ่งเป็นหนึ่งในเควสต์รองที่ดีที่สุดในเกม แม้เควสต์ส่วนใหญ่จะเป็นการไปเก็บของตามคำสั่ง แต่ก็เป็นแรงจูงใจที่ดีในการสำรวจ และที่น่าสนใจคือเกมใช้แผนที่วาดด้วยมือที่บอกเพียงตำแหน่งคร่าวๆ ทำให้เราต้องสำรวจและเติมเต็มแผนที่ด้วยตัวเองแทนที่จะพึ่งพาไอคอนบนหน้าจอเหมือนเกมยุคใหม่ทั่วไป", "อย่างไรก็ตาม สิ่งที่คอยขัดจังหวะการเล่นคือปัญหาเรื่องภูมิประเทศและการตรวจจับการชน (Hitbox) ตัวเอกมักจะติดขัดกับวัตถุหรือเนินเล็กๆ ทั้งที่สามารถกระโดดตีลังกาได้ไกลหลายเมตร นอกจากนี้ยังมีกำแพงล่องหนที่ทำให้การสำรวจดูติดขัด บางครั้งผมถึงกับตกเหวตายเพราะติดกำแพงล่องหนเหล่านั้น ตลอดการเล่นผมตายไปเกือบ 200 ครั้ง ซึ่งครึ่งหนึ่งเกิดจากการตกเหวหรือติดภูมิประเทศจนขยับไม่ได้ ซึ่งบางครั้งทำให้ผมต้องโหลดเซฟใหม่และเสียเวลาไปถึง 20 นาที", "ถึงกระนั้น หัวใจสำคัญของ Phantom Blade Zero คือการต่อสู้กับบอสที่ออกแบบมาอย่างยอดเยี่ยม การดวลดาบที่ดุเดือดทำให้ผมรู้สึกเหมือนเป็นยอดฝีมือเพียงหนึ่งเดียวที่สามารถรับมือกับพายุแห่งคมดาบได้ การต่อสู้ถูกปรับแต่งมาอย่างละเอียด ทุกการโจมตีมีสัญญาณบอกล่วงหน้าและจังหวะดนตรีที่ช่วยให้เราคาดเดาการโจมตีได้ เมื่อเราเข้าถึงจังหวะของเกมได้ เราจะสามารถป้องกันการโจมตีที่รวดเร็วได้โดยสัญชาตญาณ ซึ่งเป็นเครื่องพิสูจน์ถึงการออกแบบที่สมดุลและชาญฉลาด", "ผมประทับใจระดับความยากที่พอเหมาะ ไม่โหดร้ายจนเกินไปแต่ก็ไม่ประมาทได้ ผมเล่นในระดับความยากสูงสุดและสามารถเอาชนะบอสส่วนใหญ่ได้ในการลอง 2-3 ครั้ง ซึ่งให้ความรู้สึกสดใหม่ที่ทำให้ผมรู้สึกว่าตัวเองเป็นฝ่ายที่บอสต้องเกรงกลัว ไม่ใช่ผมที่ต้องกลัวบอส นอกจากนี้ เกมยังตัดสินใจอย่างชาญฉลาดด้วยการไม่ให้ผู้เล่นต้องเริ่มสู้บอสใหม่ตั้งแต่เฟสแรกหากตายในเฟสที่สอง ซึ่งช่วยลดความหงุดหงิดและทำให้การต่อสู้มีความลื่นไหลมากขึ้น", "ด้วยระบบนี้ ทำให้การออกแบบบอสมีความหลากหลายมากขึ้น แม้จะมีท่าโจมตีที่รุนแรงถึงตาย แต่การที่ไม่ต้องเริ่มสู้ใหม่ทั้งหมดทำให้ผมรู ndreas แม้จะไม่มีเมือง San Fierro หรือ Las Venturas แต่แผนที่นี้ก็มีขนาดใหญ่กว่าภาค San Andreas ถึงสองเท่า ซึ่งถือเป็นความสำเร็จที่น่าทึ่ง", "แม้เวลาจะผ่านไป 13 ปี แต่รายละเอียดในแผนที่ของ GTA V ยังคงสร้างความประหลาดใจได้เสมอ Rockstar เข้าใจดีว่าความสมจริงเกิดจากการสะสมรายละเอียดเล็กๆ น้อยๆ ไม่ว่าจะเป็นกราฟฟิตี้บนกำแพง หรือป้ายประกาศตามเสาไฟ สิ่งเหล่านี้เมื่อรวมกันแล้วจะสร้างโลกที่สมจริงจนผู้เล่นแทบไม่สังเกตเห็นความตั้งใจนั้น เพราะมันดูเป็นธรรมชาติเกินกว่าจะเป็นแค่เกม และนั่นคือหัวใจสำคัญของความสำเร็จนี้", "นวัตกรรมที่สำคัญที่สุดของ GTA V คือ 'ระบบ 3 ตัวละครหลัก' ได้แก่ ไมเคิล อดีตอาชญากรที่เบื่อหน่ายชีวิต, แฟรงคลิน นักเลงหนุ่มผู้ทะเยอทะยาน และเทรเวอร์ จอมคลั่งผู้คาดเดาไม่ได้ ระบบนี้ไม่เพียงแค่แปลกใหม่ แต่ยังช่วยให้ผู้เล่นได้สัมผัสโลกที่กว้างใหญ่ผ่านมุมมองที่แตกต่างกันอย่างเป็นธรรมชาติ โดยไม่ต้องผูกติดอยู่กับตัวละครเดียว", "แม้ใน GTA IV จะมีการนำเสนอตัวละครผ่าน DLC อย่าง The Lost and Damned และ The Ballad of Gay Tony แต่ก็ยังไม่สามารถสลับตัวละครได้แบบเรียลไทม์เหมือนใน GTA V ซึ่งการสลับตัวละครในภาคนี้ทำได้อย่างรวดเร็วผ่านการซูมกล้อง ทำให้เรารู้สึกว่าตัวละครเหล่านั้นมีชีวิตของตัวเองอยู่ตลอดเวลา แม้ในตอนที่เราไม่ได้ควบคุมพวกเขาอยู่ก็ตาม", "ภารกิจใน GTA V มีความหลากหลายและซับซ้อนกว่าภาคก่อนมาก การนำระบบ Checkpoint มาใช้ช่วยขจัดความหงุดหงิดจากการต้องเริ่มภารกิจใหม่ทั้งหมด ทำให้ Rockstar สามารถออกแบบภารกิจที่ยาวและท้าทายขึ้นได้โดยไม่ต้องกังวลว่าผู้เล่นจะถอดใจไปเสียก่อน", "จุดเด่นที่สุดคือภารกิจปล้น (Heists) ที่เป็นการต่อยอดจากภารกิจ 'Three Leaf Clover' ใน GTA IV ให้กลายเป็นแกนหลักของเกม ผู้เล่นสามารถวางแผนและเลือกวิธีการเข้าถึงภารกิจได้หลากหลาย ซึ่งระบบนี้ช่วยดึงศักยภาพของตัวละครทั้ง 3 ออกมาได้อย่างเต็มที่ ทำให้ภารกิจมีความยิ่งใหญ่และมีมิติมากกว่าที่เคยเป็นมา", "นอกจากนี้ ระบบการขับขี่และการยิงปืนยังได้รับการปรับปรุงให้ลื่นไหลและตอบสนองได้ดีขึ้น รถยนต์มีการยึดเกาะถนนที่ดีขึ้น ในขณะที่คลังอาวุธก็มีความหลากหลายและเข้าถึงได้ง่ายผ่านระบบ 'Weapon Wheel' ที่นำมาจาก Max Payne 3 ทำให้ผู้เล่นสามารถพกพาอาวุธได้มากขึ้นและไม่ต้องกังวลเรื่องอาวุธหายอีกต่อไป", "ในเดือนกันยายน 2013 เมื่ al_title": "Phantom Blade Zero review", "thai_title": "รีวิว Phantom Blade Zero: แอ็กชันกังฟูสุดเร้าใจที่ยังต้องรอการขัดเกลา", "tag": "Review", "sub_tag": "GAME REVIEW", "bullet_points": ["Phantom Blade Zero นำเสนอระบบการต่อสู้ที่ลื่นไหลและสวยงามราวกับภาพยนตร์กังฟูชั้นนำ", "ระบบการเล่นผสมผสานความเป็น Soulslike เข้ากับความเร็วสูง โดยเน้นการปัดป้อง (Parry) และการสลับอาวุธเพื่อทำคอมโบ", "จุดอ่อนสำคัญอยู่ที่ความสมดุลของบอสที่มักจะมีเลือดเยอะเกินไป (Spongy) ทำให้การต่อสู้ยืดเยื้อและน่าเบื่อในบางช่วง", "การเล่าเรื่องยังทำได้ไม่ดีนัก โดยเฉพาะการยัดเยียดข้อมูลผ่านตัวอักษรจำนวนมากที่ขาดความน่าสนใจ", "พบปัญหาทางเทคนิค เช่น เฟรมเรตตก การติดขัดของฉาก และบั๊กในเควสต์รอง แม้จะมีการอัปเดตแพตช์แก้ไขแล้วก็ตาม"], "full_paragraphs": ["ผมไม่ได้อยู่ในยุคทองของภาพยนตร์ศิลปะการต่อสู้ แต่มีหลายช่วงเวลาใน Phantom Blade Zero ที่ทำให้ผมรู้สึกราวกับว่าได้หลุดเข้าไปอยู่ในกองถ่ายหนังกำลังภายในจริงๆ มีเหตุการณ์หนึ่งที่ผมจำได้แม่น ขณะที่ผมกำลังเข้าใกล้กลุ่มศัตรูในหุบเขาที่ร่มรื่น ผมค่อยๆ ชักดาบออกมา แล้วศัตรูคนแรกก็พุ่งเข้ามาหาผม ช่างโง่เขลาเสียจริง ผมปัดป้องการโจมตีนั้นได้อย่างสมบูรณ์แบบ ก่อนจะตีลังกากลับหลังไปอยู่ด้านหลังเขาแล้วปักดาบลงบนหลังของเขาอย่างจัง ศัตรูคนถัดมาวิ่งเข้ามา ผมเตะเข้าที่หน้าเขาพร้อมกับแทงคอศัตรูคนแรกไปในเวลาเดียวกัน จากนั้นคนที่สามก็เข้าร่วมวง ซึ่งคนนี้ขี่ม้ามา ผมจึงถีบเขาตกจากม้าแล้วใช้ม้าตัวนั้นเหยียบย่ำเพื่อนของเขาที่ไร้ทางสู้จนจมดิน แล้วในที่สุด ความเงียบก็กลับมาเยือนอีกครั้ง", "นี่คือช่วงเวลาที่ยอดเยี่ยมที่สุดของ Phantom Blade Zero ทั้งมีความเป็นภาพยนตร์ ลื่นไหล และเต็มไปด้วยความประหลาดใจ ระบบการต่อสู้ถ่ายทอดการเคลื่อนไหวที่ไร้รอยต่อและการออกแบบท่าทางที่สร้างสรรค์แบบเดียวกับหนังกำลังภายในที่ดีที่สุด พร้อมด้วยแอนิเมชันการต่อสู้ที่น่าทึ่งจนแทบจะไร้ขีดจำกัดในด้านความหลากหลายและความฉลาดในการออกแบบ มันเป็นเกมที่สวยงามอย่างเหลือเชื่อ ด้วยทิวทัศน์ที่ชวนตะลึงและการเผชิญหน้าในการต่อสู้ที่ทะเยอทะยาน หากเพียงแต่... หากเพียงแต่เกมจะสามารถรักษาความลื่นไหลในระดับนี้ไว้ได้ในทุกส่วนของเนื้อเรื่องอันยิ่งใหญ่ของมัน", "การผจญภัยของเราเกิดขึ้นในโลกแฟนตาซีที่มีกลิ่นอายแบบวูเซีย (Wuxia) ที่เรียกว่า 'Wulin' ซึ่งเป็นโลกใต้ดินของเหล่าจอมยุทธ์ที่เต็มไปด้วยคนพาลที่ก่อความวุ่นวายและสร้างความเดือดร้อนให้กับคนธรรมดาที่เพียงแค่ต้องการใช้ชีวิตอย่างสงบสุข คุณจะได้รับบทเป็น 'Soul' นักรบและสมาชิกนอกคอกขององค์กรที่เรียกว่า 'The Order' หลังจากเล่นจนจบเกม ผมก็ยังไม่แน่ใจนักว่า The Order ยึดถือคุณค่าอะไร แต่ผมมั่นใจว่าเจตนาเริ่มต้นของพวกเขาคงจะดี ผมไม่แน่ใจว่าจะเล่าอะไรให้คุณฟังได้บ้างเกี่ยวกับเนื้อเรื่อง เพราะเราถูกขอไม่ให้เปิดเผยสิ่งที่เกิดขึ้นในบทนำ ดังนั้นคุณคงต้องใช้จินตนาการกันไปก่อน ผมบอกได้เพียงว่ามันเกี่ยวข้องกับการทรยศ ตัวเอกที่มีเวลาเหลืออยู่ไม่มาก ภารกิจล้างแค้น และสิ่งชั่วร้ายจากต่างโลก ซึ่งเป็นส่วนประกอบมาตรฐานที่คุณต้องการสำหรับมหากาพย์แฟนตาซี", "ขอเตือนไว้ก่อนว่า Phantom Blade Zero ใช้เวลาไม่นานในการประเคนชื่อตัวละคร สายเลือด ลัทธิ และนิกายต่างๆ ใส่คุณจนมึนงง วิธีการนำเสนอเนื้อเรื่องของโลกผ่านข้อความจำนวนมหาศาลในคัมภีร์ที่กระจัดกระจายอยู่ทั่ว Wulin ไม่ใช่จุดแข็งของเกมนี้อย่างแน่นอน ตัวละครส่วนใหญ่พูดพร่ำเรื่องไร้สาระ เสนอคำคมหรือหลักการที่ยากจะเชื่อมโยงกับเนื้อเรื่องหลัก คำแนะนำของผมคือปล่อยให้มันผ่านไป แล้วคุณจะค่อยๆ จับประเด็นหลักได้เอง แม้เนื้อหาการเล่าเรื่องจะยังขาดความน่าสนใจ แต่การเล่าเรื่องก็มีการใช้ศิลปะจีนดั้งเดิมเข้ามาประกอบซึ่งถือเป็นอาหารตาที่ยอดเยี่ยม แต่น่าเสียดายที่ผมไม่สามารถชื่นชมส่วนนี้ได้อย่างเต็มที่เพราะเราถูกขอไม่ให้พูดถึงองค์ประกอบเหล่านี้ในรีวิว", "อย่างไรก็ตาม ผมคิดว่าเราทุกคนรู้ดีว่าทำไมเราถึงมาอยู่ที่นี่ นั่นก็เพราะจุดขายหลักของ Phantom Blade Zero คือระบบการต่อสู้ อิทธิพลจาก FromSoftware ปรากฏชัดในหลายแง่มุม ตั้งแต่จุดเช็กพอยต์ 'ระฆัง' ที่กระจายอยู่ทั่วโลก ไปจนถึงบอสหลายระยะที่สามารถโจมตีคุณจนตายได้ในการโจมตีครั้งเดียว ไม่ว่าคุณจะใช้อาวุธแบบไหน สิ่งที่สำคัญที่สุดในการสู้กับบอสคือการหลบการโจมตีสีแดงและปัดป้องการโจมตีสีน้ำเงินให้ถูกต้อง นี่เป็นวิธีที่มีประสิทธิภาพที่สุดในการทำลายการป้องกันของบอสเพื่อให้คุณเข้าสู่ช่วงลงทัณฑ์และใช้ท่าโจมตีหนักๆ ได้ มันคล้ายกับ Sekiro ที่มีความเร็วสูง ดังนั้นถ้าคุณไม่ชอบสไตล์การต่อสู้แบบหลบ/ปัดป้อง เกมนี้อาจไม่ใช่สำหรับคุณ", "บางทีคำว่า 'Soulslite' อาจจะเหมาะกับ Phantom Blade Zero มากกว่า เพราะมีการปรับแต่งที่ชาญฉลาดหลายอย่างที่ช่วยให้การต่อสู้รวดเร็วกว่าเกมแนว Soulslike อื่นๆ เกมนี้ไม่มีหลอด Stamina แบบดั้งเดิม แต่ใช้ทรัพยากรที่เรียกว่า 'sha-chi' ซึ่งจะลดลงเมื่อคุณบล็อกหรือปัดป้องการโจมตีของศัตรูและเมื่อใช้ท่าโจมตีหนัก เป็นวิธีที่ฉลาดในการให้ผู้เล่นใช้ท่าโจมตีเร็ว การวิ่ง และการหลบโดยไม่เสีย Stamina นอกจากนี้ยังมีระบบสองอาวุธที่ส่งเสริมให้สลับอาวุธหลักอยู่เสมอ หาก sha-chi ของอาวุธหนึ่งใกล้หมด ก็แค่สลับไปใช้อีกอันแล้วคุณก็จะมีหลอด sha-chi ใหม่ให้ใช้ทันที (แม้จะมีคูลดาวน์เล็กน้อยเพื่อป้องกันการใช้ระบบนี้ในทางที่ผิด)", "ระบบนี้มีประโยชน์มากเมื่อคุณต้องการโจมตีหนักหรือป้องกันไม่ให้การป้องกันของคุณถูกทำลายเมื่อ sha-chi ต่ำ อีกหนึ่งการปรับแต่งที่น่ายินดีคือจังหวะการปัดป้องและการหลบที่ค่อนข้างกว้าง ซึ่งจำเป็นมากเมื่อศัตรูโจมตีคุณด้วยความเร็วสูง หากคุณต้องการปัดป้องในวินาทีสุดท้าย คุณสามารถยกเลิกท่าทางเกือบทุกอย่างเพื่อทำเช่นนั้นได้ ซึ่งช่วยป้องกันปัญหาที่น่าหงุดหงิดจากการติดอยู่ในแอนิเมชันการโจมตีในขณะที่บอสกำลังเงื้ออาวุธใส่หัวคุณ สิ่งที่น่าเมตตาที่สุดคือหากคุณตายในช่วงที่สองของการสู้กับบอส คุณสามารถกลับเข้าสู่การต่อสู้ที่จุดเริ่มต้นของระยะที่สองได้ทันที ทำให้ความล้มเหลวของคุณเจ็บปวดน้อยลงและให้โอกาสคุณกลับเข้าสู่การต่อสู้พร้อมทรัพยากรเต็มเปี่ยม", "อาวุธแต่ละชนิดมีความโดดเด่นและมอบความสามารถที่น่าตื่นเต้น ดาบชนิดหนึ่งกำหนดให้คุณต้องดื่มเหล้าก่อน ซึ่งจะช่วยให้คุณส่งอาวุธลอยไปโจมตีศัตรูในระยะไกลได้ เป็นท่าทางที่สนุกและตลกดี แม้อาจจะไม่ใช่บิลด์ที่ทรงพลังที่สุดก็ตาม ต่อมาคุณจะได้ดาบรูปทรงกระบองที่พุ่งทะลวงศัตรู ดาบคู่ที่หมุนรอบตัวคุณ และอาวุธที่สามารถเรียกพืชออกมาจากพื้นเพื่อดูด sha-chi ของศัตรู การเรียนรู้และทำความเข้าใจวิธีใช้ความสามารถเหล่านี้เป็นกระบวนการที่น่าสนใจ โดยเฉพาะอย่างยิ่งเมื่อแต่ละอาวุธมีคอมโบเฉพาะตัวที่ค่อยๆ ปลดล็อกเมื่อคุณพบวัสดุอัปเกรดทั่วโลก ในที่สุดคุณจะพบไอเทมเควสต์ที่ช่วยให้คุณ 'หลอมจิต' อาวุธเพื่อปลดล็อกความสามารถแฝงที่ทรงพลังที่สุด ซึ่งสามารถเปลี่ยนอาวุธที่อ่อนแอให้กลายเป็นอาวุธที่ใช้งานได้จริง นอกจากนี้ยังมีอาวุธรองที่เรียกว่า 'phantom edges' ซึ่งใช้เป็นเครื่องมือเสริมในการแก้ปัญหา เช่น การป้องกันของบอสที่สูงหรือการโจมตีที่ไม่สามารถป้องกันได้ ผมทดลองใช้อาวุธอยู่ตลอดเวลาเพื่อปรับแต่งบิลด์ให้เหมาะกับการจัดการศัตรูจำนวนมากและการทำลายการป้องกันของบอส จนผมจับจังหวะการต่อสู้ได้และรู้ว่าควรใช้ท่าไหนในลำดับใดเพื่อสร้างความเสียหายสูงสุด", "เมื่อสู้กับศัตรูทั่วไปใน Wulin อาวุธเหล่านี้ให้ความรู้สึกที่ยอดเยี่ยม การต่อสู้บรรลุสภาวะ 'Flow' ของกังฟูที่สมบูรณ์แบบ คุณสามารถกระโดดไปมาระหว่างศัตรู ปัดป้องการโจมตี ทำลายการป้องกัน และเปิดช่องให้เผด็จศึก ผมชอบที่ Phantom Blade Zero ใจกว้างกับท่าเผด็จศึกเหล่านี้มาก เพียงแค่กด QTE ในจังหวะที่ถูกต้อง คุณก็สามารถจัดการศัตรูสองตัวพร้อมกันได้ แอนิเมชันเหล่านี้ดูเหมือนจะมีไม่สิ้นสุด Soul มักจะใช้อาวุธของศัตรูจัดการตัวมันเอง ทำให้คุณยังคงพบท่าเผด็จศึกใหม่ๆ แม้จะเล่นไปแล้ว 30 ชั่วโมงก็ตาม มันทำให้การต่อสู้มีความประหลาดใจอยู่ตลอดเวลา ในระดับความยาก Pathfinder ปกติ ศัตรูทั่วไปมีความสมดุลดีมาก คุณจะรู้สึกถึงความลื่นไหล แต่ก็ยังพลาดได้หากคุณบุกเข้าไปโดยไม่มีบิลด์ที่เหมาะสมหรือไม่ได้ให้ความสำคัญกับการจัดการศัตรูระยะไกลก่อน", "อย่างไรก็ตาม เมื่อสู้กับบอส อาวุธที่เคยทรงพลังเหล่านี้กลับดูไร้คมไปถนัดตา ในระหว่างการเล่นของผม บอสจำนวนมากรู้สึกว่ามีเลือดเยอะเกินไป (Spongy) โดยเฉพาะในโหมด Pathfinder แม้จะลดความยากลงมาเป็น Wayfarer ซึ่งควรจะเป็นโหมดที่เน้นความสนุกในการลุยผ่านเกม อาวุธที่เคยมีประสิทธิภาพกับศัตรูทั่วไปกลับกลายเป็นเหมือนไม้จิ้มฟันเมื่อสู้กับบอส แม้จะเป็นช่วงที่บอสเปิดช่องให้โจมตีก็ตาม การปัดป้องหรือหลบหลีกที่สำเร็จจะได้รับรางวัลเป็นการลด sha-chi ของบอสเพียงเล็กน้อย ทำให้คุณรู้สึกทันทีว่าการต่อสู้ครั้งนี้จะยาวนานและซ้ำซาก", "ในเกมแนว Soulslike ความเสียหายที่ต่ำมักเป็นคำใบ้ให้คุณเริ่มทดลองบิลด์หรือลองใช้อาวุธอื่นเพื่อหา 'กุญแจ' ในการเอาชนะบอส แต่ Phantom Blade Zero ไม่ได้สื่อสารเรื่องนี้ได้ดีนัก ตัวอย่างเช่น บอสตัวหนึ่งในช่วงต้นเกมที่คุณต้องสู้ด้วยคือศัตรูที่มีโล่หนาม และการโจมตีศัตรูตัวนั้นจะทำให้คุณติดสถานะเลือดไหล เห็นได้ชัดว่าคุณต้องทำลายโล่และใช้อาวุธรอง แต่เมื่อคุณใช้อาวุธขวาน phantom edge กลับไม่มีอะไรเกิดขึ้นมากนัก ความขาดการตอบสนองนี้ทำให้ผมต้องเดินย้อนกลับไปทั่วโลกเพราะคิดว่าพลาดอะไรไป ปรากฏว่าผมมาถูกทางแล้ว แค่ต้องกดใช้ท่าซ้ำๆ หรือใช้เวอร์ชัน 'ชาร์จ' (ซึ่งเกมไม่ได้สนับสนุนนัก เพราะท่าชาร์จของ phantom edge ใช้เวลานานจนไม่เหมาะกับการต่อสู้ที่รวดเร็ว) ในอีกกรณีหนึ่ง phantom edge ที่ยิงน้ำซึ่งระบุว่ามีประสิทธิภาพกับศัตรูธาตุไฟ กลับไม่ได้ผลเลย ผมมักไม่รู้สึกว่าได้รับรางวัลจากการทดลองใช้อาวุธเหล่านี้ และความอึดของบอสทำให้การต่อสู้หลายครั้งรู้สึกยาวนานอย่างไม่เป็นธรรมชาติ", "นี่เป็นหนึ่งในข้อร้องเรียนหลักของผมเกี่ยวกับเกม แต่ก็นี่แหละที่ทำให้เรื่องราวน่าสนใจ สองวันก่อนที่กำหนดการห้ามเผยแพร่รีวิวจะสิ้นสุดลง ผู้พัฒนา S-Game ได้ปล่อยอัปเดตขนาด 67GB ที่เน้นเรื่องประสิทธิภาพและบั๊ก รวมถึงปรับค่าสถานะของบอส ศัตรู ความสามารถ และอาวุธ โดยระบุว่า 'การเปลี่ยนแปลงเหล่านี้มีเป้าหมายเพื่อให้เส้นกราฟความยากรู้สึกราบรื่นขึ้น ทั้งในการสู้กับบอสและเมื่อคุณก้าวหน้าในแต่ละพื้นที่' แน่นอนว่ามันไม่ให้เวลาผมเล่นเกมใหม่ทั้งหมดเพื่อดูว่าการเปลี่ยนแปลงสร้างความแตกต่างหรือไม่ ผมได้กลับไปดูไฟล์เซฟเก่าและพบว่าความอึดของบอสยังคงอยู่ โดยเฉพาะบอสบังคับในช่วงต้นเกม ดังนั้นมันจึงดูเหมือนยังเป็นปัญหาอยู่ เป็นไปได้ว่าเวอร์ชันวางจำหน่ายจะทำให้การปัดป้อง การหลบ และอาวุธรู้สึกมีประสิทธิภาพมากขึ้น แต่ก็นั่นแหละ ผมเขียนได้เฉพาะสิ่งที่ผมได้เล่นมาเท่านั้น", "แม้จะมีความหลากหลายของแอนิเมชันและท่าทางที่บอสใช้ แต่การต่อสู้หลายครั้งดูเหมือนจะตกอยู่ในรูปแบบการป้องกัน/โจมตีที่เข้มงวด ซึ่งคุณไม่มีโอกาสขัดขวางรูปแบบการโจมตีของศัตรูได้มากนัก แต่นั่นไม่ได้หมายความว่าการสู้กับบอสทุกตัวจะรู้สึกเหมือนกันหมด บอสที่มีศัตรูตัวเล็กๆ เข้ามาเสริมช่วยให้คุณรู้สึกว่าทำความเสียหายได้มากขึ้น ในขณะที่การต่อสู้ที่น่าจดจำที่สุดคือการฉีกรูปแบบมาตรฐานไปสู่สิ่งที่แตกต่างออกไป บอสตัวหนึ่งยิงขีปนาวุธในแนวนอนเหมือนเกม Bullet Hell ในขณะที่อีกตัวให้คุณเต้นอยู่บนเสาในขณะที่แลกกระสุนปืนใหญ่กับศัตรู ซึ่งอย่างหลังนั้นยอดเยี่ยมมาก ทั้งสวยงามตระการตา คาดไม่ถึง และเป็นช่วงเวลาที่สนุกอย่างแท้จริง", "แน่นอนว่าส่วนสำคัญของเกมแนว Soulslike/lite คือการสำรวจโลกเพื่อหาของอัปเกรดและผ่อนคลายระหว่างการสู้กับบอส ซึ่งต้องชื่นชมด้านการสำรวจของ Phantom Blade Zero แผนที่โลกถูกสร้างขึ้นจากภาพวาดพู่กันจีนแบบดั้งเดิม โดยมีหมอกที่จางหายไปเพื่อเผยให้เห็นพื้นที่ใหม่เมื่อคุณพบระฆัง แผนที่ที่สวยงามเหล่านี้เป็นเพียงคำใบ้ว่าคุณจะพบอะไรในแต่ละพื้นที่
