ww.skysports.com/football/live-blog/11095/13025492/man-utd-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-and-contracts", "canonical_link": "https://www.skysports.com/football/live-blog/11095/13025492/man-utd-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-and-contracts", "cover_image_url": "https://e1.365dm.com/26/11/1920x1080/skysports-premier-league-manchester-united_7403807.jpg?20261111114625", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795005000, "published_at": "2026-11-18T12:30:00Z", "published_th": "18 พ.ย. 2026 • 19:30 น.", "category_hint": "Football"}, {"id": 1795004266465, "guid": "https://www.skysports.com/football/news/11095/13613260/man-utd-transfer-news-calvin-bassey-and-jarrad-branthwaite-among-targets-with-mauricio-pochettino-set-to-be-backed-in-january", "original_title": "Man Utd expected to back Poch in January transfer window", "thai_title": "แมนฯ ยูไนเต็ด เตรียมหนุนหลัง โปเช็ตติโน่ เสริมทัพตลาดหน้าหนาว", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["แมนเชสเตอร์ ยูไนเต็ด เตรียมเดินหน้าเสริมทัพในตลาดซื้อขายนักเตะเดือนมกราคม โดยเน้นตำแหน่งแบ็กซ้าย เซ็นเตอร์แบ็ก และกองหน้า", "เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่จะมีส่วนร่วมสำคัญในการตัดสินใจเลือกเป้าหมายนักเตะที่จะดึงตัวมาร่วมทีม", "สโมสรให้ความสนใจในตัว คาลวิน บาสซีย์ จากฟูแล่ม และ จาร์ราด แบรนธ์เวต จากเอฟเวอร์ตัน เพื่อมาอุดรอยรั่วในแนวรับ", "อนาคตของ ลิซานโดร มาร์ติเนซ เริ่มมีความไม่แน่นอน เนื่องจากสัญญาปัจจุบันกำลังจะหมดลงในช่วงซัมเมอร์หน้า", "การเสริมทัพในแดนหน้าเป็นเรื่องจำเป็น เนื่องจาก เบนจามิน เซสโก้ กองหน้าตัวหลักยังคงมีอาการบาดเจ็บและต้องพักยาวถึงเดือนมกราคม"], "full_paragraphs": ["แมนเชสเตอร์ ยูไนเต็ด คาดว่าจะให้การสนับสนุน เมาริซิโอ โปเช็ตติโน่ เฮดโค้ชคนใหม่ในการเสริมทัพช่วงตลาดซื้อขายนักเตะเดือนมกราคมนี้ เพื่อแก้ไขสถานการณ์ผลงานที่น่าผิดหวังในช่วงเริ่มต้นฤดูกาล", "ตำแหน่งแบ็กซ้าย เซ็นเตอร์แบ็ก และกองหน้า คือพื้นที่ที่สโมสรต้องการเสริมความแข็งแกร่ง โดยคาดว่าโปเช็ตติโน่จะมีบทบาทสำคัญในการให้ความเห็นเกี่ยวกับเป้าหมายที่สโมสรจะดำเนินการคว้าตัวมาร่วมทีม", "แม้ว่าบอร์ดบริหารของสโมสรจะรู้สึกว่าทีมควรจะมีอันดับที่ดีกว่านี้ในตารางคะแนน แต่ก็ยอมรับว่าพวกเขาควรจะเสริมทัพให้ดีกว่านี้ในช่วงซัมเมอร์ที่ผ่านมาในจุดที่ทีมยังขาดความลึกของขุมกำลัง", "แหล่งข่าวของ Sky Sports News ระบุว่า สโมสรมีแผนที่จะขยับตัวในตลาดรอบหน้าอยู่แล้วตั้งแต่สมัยที่ ไมเคิล คาร์ริค ยังเป็นเฮดโค้ช ก่อนที่เขาจะถูกปลดออกจากตำแหน่งเมื่อเดือนที่แล้ว หลังทำผลงานช่วงออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี", "อย่างไรก็ตาม ในขณะนี้คาดว่าโปเช็ตติโน่จะได้รับเชิญให้เข้ามาหารือในช่วงไม่กี่สัปดาห์ข้างหน้า และจะมีสิทธิ์ตัดสินใจเกี่ยวกับนักเตะใหม่ที่จะดึงตัวเข้ามาในเดือนมกราคม", "สำหรับเป้าหมายในแนวรับ คาลวิน บาสซีย์ ของฟูแล่ม และ จาร์ราด แบรนธ์เวต ของเอฟเวอร์ตัน คือสองนักเตะที่ยูไนเต็ดกำลังจับตามอง แม้ฟูแล่มจะมีผลงานที่ไม่สู้ดีนักในฤดูกาลนี้ แต่บาสซีย์ถือเป็นนักเตะที่โชว์ฟอร์มได้น่าประทับใจ โดยเหลือสัญญาอีกเพียง 6 เดือน แต่ฟูแล่มมีออปชั่นขยายสัญญาเพิ่มได้อีก 1 ปี", "อัลบาโร่ อาร์เบลัว เฮดโค้ชของฟูแล่ม ได้กล่าวถึงกองหลังวัย 26 ปีรายนี้ว่าเป็นหนึ่งในกองหลังที่ดีที่สุดในโลก และยืนยันว่าเป้าหมายของสโมสรคือการต่อสัญญาฉบับใหม่กับบาสซีย์", "ในขณะที่ แบรนธ์เวต เป็นนักเตะที่ยูไนเต็ดให้ความสนใจมาอย่างยาวนาน โดยในปี 2024 ยูไนเต็ดเคยยื่นข้อเสนอขอซื้อตัวกองหลังรายนี้ถึง 2 ครั้ง แต่ถูกปฏิเสธทั้งหมด ซึ่งข้อเสนอครั้งที่สองมีมูลค่าสูงถึงประมาณ 50 ล้านปอนด์ โดยเอฟเวอร์ตันอยู่ในสถานะที่ได้เปรียบในการเจรจาเนื่องจากนักเตะวัย 24 ปีรายนี้ยังมีสัญญาอยู่จนถึงซัมเมอร์ปี 2030", "ยูไนเต็ดกำลังมองหาตัวเลือกเซ็นเตอร์แบ็กเท้าซ้ายเพื่อพิจารณาหาตัวแทนของ ลิซานโดร มาร์ติเนซ ซึ่งอนาคตในถิ่นโอลด์ แทรฟฟอร์ด ดูมีความไม่แน่นอนเมื่อถึงซัมเมอร์หน้า เนื่องจากสัญญาปัจจุบันกำลังจะหมดลง แม้สโมสรจะมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือน แต่มีแนวโน้มว่าเขาจะไม่ได้รับข้อเสนอสัญญาฉบับใหม่ ตามที่ Sky Sports News ได้รายงานไปเมื่อเดือนที่แล้ว", "สโมสรตัดสินใจไม่เสริมแบ็กซ้ายในช่วงซัมเมอร์ที่ผ่านมาเนื่องจากต้องการโฟกัสไปที่การสร้างแดนกลางใหม่ โดยเชื่อว่าเป้าหมายระยะยาวของพวกเขาจะสามารถคว้าตัวได้ง่ายขึ้นในปีหน้า ซึ่งยังคงต้องติดตามว่าจะเป็นเช่นนั้นจริงหรือไม่เมื่อจบฤดูกาล และจะส่งผลอย่างไรต่อผู้เล่นอย่าง ลูอิส ฮอลล์ ของนิวคาสเซิล ยูไนเต็ด แต่ด้วยการที่ทีมต้องใช้ผู้เล่นถึง 5 คนในตำแหน่งนี้โดยประสบความสำเร็จเพียงเล็กน้อย สโมสรจึงจะพิจารณาหาตัวเลือกแบ็กซ้ายเข้ามาเสริมในเดือนมกราคม", "แอนโทนี โรบินสัน แบ็กซ้ายของฟูแล่ม ยังคงเป็นนักเตะที่ถูกจับตามองตามรายงานครั้งแรกของ Sky Sports News เมื่อเดือนมีนาคมที่ผ่านมา ฟูแล่มรับทราบถึงความสนใจที่มีต่อโรบินสันอย่างกว้างขวาง แต่ยังไม่มีสโมสรใดขยับตัวอย่างจริงจังสำหรับนักเตะวัย 29 ปีรายนี้ ซึ่งเคยร่วมงานกับโปเช็ตติโน่สมัยคุมทีมชาติสหรัฐอเมริกา", "อเลฮานโดร บัลเด้ ของบาร์เซโลน่า เป็นนักเตะที่มีข่าวเชื่อมโยงกับยูไนเต็ดในช่วงซัมเมอร์ แต่การย้ายทีมไม่เคยอยู่ในขั้นตอนที่มีความเป็นไปได้สูง ยูไนเต็ดรับทราบถึงความเป็นไปได้ในการคว้าตัวเขา และไม่ได้ตัดโอกาสที่จะกลับไปเจรจาอีกครั้งในเดือนมกราคมหากทุกฝ่ายตกลงกันได้", "รายาน เอต-นูรี ของแมนเชสเตอร์ ซิตี้ เป็นตัวเลือกที่ยูไนเต็ดเคยสำรวจความเป็นไปได้ในช่วงวันสุดท้ายของตลาดซื้อขาย แต่ตัดสินใจไม่ดำเนินการต่อเนื่องจากซิตี้ต้องการให้มีเงื่อนไขบังคับซื้อขาด ซึ่ง Sky Sports News เข้าใจว่าเขาไม่ได้ถูกพิจารณาว่าเป็นเป้าหมายในขณะนี้ เนื่องจากยูไนเต็ดกำลังมองหาตัวเลือกอื่น", "ด้วยการที่ เบนจามิน เซสโก้ กองหน้าตัวหลักต้องพักยาวอย่างน้อยจนถึงเดือนมกราคม สโมสรจะสำรวจหาตัวเลือกเสริมในตลาดรอบหน้าเพื่อปรับสมดุลในแนวรุก แม้ว่ายูไนเต็ดจะทำประตูได้ถึง 7 ลูกในสองเกมล่าสุดก่อนช่วงพักเบรก แต่ทีมยังคงขาดผู้เล่นที่มีรูปร่างแข็งแกร่งในการยืนค้ำแดนหน้าในช่วงที่เซสโก้บาดเจ็บ", "โดมินิก คัลเวิร์ต-เลวิน ของลีดส์ ยูไนเต็ด เคยเป็นนักเตะที่อยู่ในความสนใจ แต่อนาคตของเขาน่าจะยังคงอยู่ที่เอลแลนด์ โร้ด และคาดว่ายูไนเต็ดจะไม่เดินหน้าคว้าตัวกองหน้ารายนี้", "การปล่อยนักเตะออกจากทีมในเดือนมกราคมอาจส่งผลต่อความสามารถในการเสริมทัพของโปเช็ตติโน่ แต่การปล่อยตัวผู้เล่นชุดใหญ่จำนวนมากไม่น่าจะเกิดขึ้น เนื่องจากขนาดของทีมและปัญหาอาการบาดเจ็บระยะยาว รวมถึงโปเช็ตติโน่ยังต้องการเวลาในการประเมินขุมกำลังของเขา", "โจชัว เซิร์กเซ่ ยังคงเป็นนักเตะที่ได้รับความสนใจจากอิตาลี และยูไนเต็ดอาจพิจารณาปล่อยตัวกองหน้าชาวดัตช์รายนี้หากได้รับข้อเสนอที่เหมาะสม แต่จำเป็นต้องหาตัวแทนในตำแหน่งดังกล่าวให้ได้ก่อน", ับตั้งแต่ย้ายมาจาก แอสตัน วิลลา ด้วยค่าตัว 55 ล้านปอนด์ในช่วงซัมเมอร์ที่ผ่านมา อย่างไรก็ตาม วิลเลียม ซาลิบา ได้กลับมาฟิตสมบูรณ์พร้อมทวงตำแหน่งตัวจริงคืนแล้ว ซึ่งถือเป็นช่วงเวลาสำคัญเนื่องจากทัพ 'ปืนใหญ่' มีโปรแกรมหนักรออยู่ในช่วงหลังพักเบรกทีมชาติ ทั้งการพบกับ แมนเชสเตอร์ ซิตี้, เรอัล มาดริด และ ท็อตแนม ฮอตสเปอร์", "การกลับมาของ ซาลิบา ถือเป็นข่าวดีสำหรับแชมป์พรีเมียร์ลีก แต่การจะบอกว่าอาร์เซนอลคิดถึงเขามากในช่วงที่ผ่านมาอาจจะดูน้อยไป เพราะ คอนซา ได้ก้าวขึ้นมาทำหน้าที่แทนได้อย่างยอดเยี่ยม ไม่เพียงแต่เขาจะทดแทนกองหลังชาวฝรั่งเศสได้อย่างไร้รอยต่อ แต่เขายังพิสูจน์ให้เห็นว่ามีมาตรฐานการเล่นที่เทียบเท่ากับช่วงที่ ซาลิบา พาทีมคว้าแชมป์ลีก โดยข้อมูลบางส่วนยังระบุว่า คอนซา ทำผลงานได้ในระดับที่สูงกว่าด้วยซ้ำ", "ด้วยการที่ ซาลิบา กลับมาซ้อมและเรียกความฟิตอย่างต่อเนื่อง อาร์เตตา จึงมีภารกิจในการจัดการเรื่องการส่งผู้เล่นคนสำคัญกลับสู่ทีม ในขณะเดียวกันก็ต้องรักษาความมั่นใจของนักเตะที่กำลังอยู่ในฟอร์มที่ดีที่สุดอย่าง คอนซา เอาไว้ด้วย ซึ่งการตัดสินใจนี้มีความสำคัญอย่างยิ่งเมื่อพิจารณาจากโปรแกรมการแข่งขันที่จะต้องพบกับทีมอย่าง โบรุสเซีย ดอร์ทมุนด์, แมนเชสเตอร์ ซิตี้, ท็อตแนม, เรอัล มาดริด และ แมนเชสเตอร์ ยูไนเต็ด ก่อนถึงช่วงคริสต์มาส", "คอนซา ย้ายมาอาร์เซนอลด้วยชื่อเสียงในด้านการผ่านบอลที่แม่นยำและความสามารถในการดวลตัวต่อตัว ซึ่งเขายังคงรักษามาตรฐานนั้นไว้ได้เป็นอย่างดี โดยในฤดูกาลนี้เขาอยู่อันดับที่สองของพรีเมียร์ลีกทั้งในด้านความแม่นยำในการผ่านบอลและเปอร์เซ็นต์การชนะในการดวลบนพื้นสนาม ซึ่งตัวเลขเหล่านี้ทำให้เขาเป็นหนึ่งในกองหลังที่ดีที่สุดของลีกในแง่ของภาพรวมการเล่น", "ตามปกติแล้วฟอร์มการเล่นระดับนี้ควรทำให้ คอนซา เป็นผู้เล่นที่ขาดไม่ได้ แต่ปัญหาคือหนึ่งในเซ็นเตอร์แบ็กที่ดีที่สุดในโลกกำลังจะกลับมา ซึ่ง ซาลิบา ถือเป็นหัวใจสำคัญของแนวรับที่ อาร์เตตา สร้างขึ้นมาที่สโมสรแห่งนี้", "จุดที่แสดงให้เห็นถึงความสำคัญของ ซาลิบา คือความสูงเฉลี่ยของไลน์กองหลังอาร์เซนอล ในฤดูกาลนี้เมื่อไม่มี ซาลิบา แนวรับของปืนใหญ่ถอยต่ำลงอย่างน้อยหนึ่งเมตร ไม่ว่าจะเป็นจังหวะรุกหรือรับ แม้จะเป็นการเปลี่ยนแปลงเพียงเล็กน้อย แต่ในระดับนี้รายละเอียดเพียงเล็กน้อยก็สร้างความแตกต่างได้มหาศาล", "เมื่อ ซาลิบา ก้าวขึ้นมาเป็นตัวหลักในฤดูกาล 2022/23 แนวรับของอาร์เซนอลก็เปลี่ยนไปอย่างสิ้นเชิง ไลน์กองหลังขยับสูงขึ้นสองเมตรเมื่อเทียบกับฤดูกาลก่อนหน้า ส่วนหนึ่งเป็นเพราะความเร็วของกองหลังชาวฝรั่งเศส ซึ่งมักถูกเปรียบเปรยว่าเป็น 'สูตรโกง' (cheat code) ในการหยุดจังหวะสวนกลับของคู่แข่งได้อย่างง่ายดาย", "การยืนไลน์สูงช่วยให้คู่แข่งอยู่ห่างจากประตูของอาร์เซนอลมากขึ้น นำไปสู่การกดดันที่ดุดันและการครองบอลที่เหนือกว่า ซึ่ง อาร์เตตา มักกล่าวเสมอว่าเป้าหมายสำคัญของทีมคือ 'การไม่เปิดโอกาสให้คู่แข่งได้หายใจ'", "คอนซา ได้ทำหน้าที่กวาดล้างในไลน์กองหลังสูงของอาร์เซนอลในฤดูกาลนี้ได้ดีพอสมควร โดยเขาทำสถิติเข้าสกัดในฐานะคนสุดท้าย (last-man tackle) ได้สำเร็จถึง 3 ครั้ง ซึ่งรวมถึงจังหวะสำคัญที่ช่วยป้องกันประตูจาก มอร์แกน โรเจอร์ส ของเชลซี และ เลียม ดีแลป ของน็อตติงแฮม ฟอเรสต์ ช่วยให้ทีมรักษาชัยชนะได้สำเร็จ", "อย่างไรก็ตาม คู่เซ็นเตอร์แบ็กอย่าง คอนซา และ กาเบรียล ทำสถิติเข้าสกัดในฐานะคนสุดท้ายรวมกันในฤดูกาลนี้ไปแล้ว 7 ครั้ง ซึ่งมากกว่าที่ ซาลิบา และ กาเบรียล ทำไว้ตลอดทั้งฤดูกาลที่แล้ว (5 ครั้ง) ซึ่งสะท้อนว่าคู่แข่งเริ่มมีพื้นที่ในการเล่นและสร้างความกดดันได้มากขึ้นกว่าเดิม", "ในระบบที่อาร์เซนอลภาคภูมิใจกับการไม่เปิดโอกาสให้คู่แข่งได้ลุ้นทำประตู การนำ 'สูตรโกง' อย่าง ซาลิบา กลับมาจึงเป็นเรื่องที่มีมูลค่ามหาศาล", "สถานการณ์หนึ่งที่ คอนซา และ ซาลิบา อาจได้ลงเล่นร่วมกันคือการขยับกองหลังทีมชาติอังกฤษไปเล่นแบ็กขวา ซึ่งเป็นตำแหน่งที่เขาเคยเล่นมาก่อนในอาชีพค้าแข้ง ซึ่งจะสอดคล้องกับแผนการใช้แบ็กขวาของ อาร์เตตา ที่มักจะใช้ผู้เล่นที่ถนัดตำแหน่งนี้โดยธรรมชาติในช่วงหลัง เช่น เยอร์เรียน ทิมเบอร์, เบน ไวท์, ริคคาร์โด คาลาฟิออรี และ ปิเอโร ฮินกาปี ซึ่งล้วนเป็นเซ็นเตอร์แบ็กที่ถูกปรับมาเล่นริมเส้น", "อย่างไรก็ตาม ในช่วงสองปีที่ผ่านมา คอนซา เชี่ยวชาญในตำแหน่งเซ็นเตอร์แบ็กเป็นหลัก จนไม่ได้ลงเล่นในพรีเมียร์ลีกในตำแหน่งแบ็กขวามาเกือบสองปีแล้ว โดยการออกสตาร์ทในลีกครั้งล่าสุดในฐานะแบ็กขวาต้องย้อนไปถึงเดือนธันวาคม 2024 สมัยอยู่กับ แอสตัน วิลลา และตลอด 5,813 นาทีในลีกที่ผ่านมา หรือเทียบเท่ากับเกือบ 65 นัด เขาเล่นในตำแหน่งเซ็นเตอร์แบ็กมาโดยตลอด โดย อาร์เตตา กล่าวเมื่อต้นเดือนนี้ว่า 'เอซรี เขาเล่นเป็นแบ็กได้ แต่ผมคิดว่าตำแหน่งหลักของเขาคือเซ็นเตอร์แบ็ก'", "แน่นอนว่า คอนซา และ ซาลิบา สามารถเล่นเซ็นเตอร์แบ็กคู่กันได้ โดยให้ กาเบรียล ได้พักบ้างในยามจำเป็น ซึ่งอาจหมายถึงการขยับคนใดคนหนึ่งไปเล่นฝั่งซ้ายและถอดเซ็นเตอร์แบ็กเท้าซ้ายออกจากทีม แต่ผู้จัดการทีมอาร์เซนอลก็มั่นใจในเรื่องนี้ โดย อาร์เตตา กล่าวถึง คอนซา ว่า 'เขาสามารถเล่นได้ทั้งขวาและซ้าย วิลลี ก็เคยทำแบบเดียวกันกับทีมชาติและที่อาร์เซนอล นั่นจะเป็นสิ่งที่ส่งผลบวกต่อทีมอย่างมาก'", "แม้ว่านี่อาจเป็นเรื่องปวดหัวสำหรับ อาร์เตตา แต่มันก็เป็นปัญหาในเชิงบวก อาร์เซนอลเคยได้รับผลกระทบจากการบาดเจ็บของ ซาลิบา และ กาเบรียล ในอดีต ซึ่งบางครั้งทำให้พวกเขาพลาดแชมป์พรีเมียร์ลีกและแชมเปียนส์ลีกในช่วงหลายปีที่ผ่านมา", "ตอนนี้ทีมอยู่ในสถานการณ์ที่ดีขึ้น แต่ อาร์เตตา ยังคงต้องตัดสินใจในเรื่องสำคัญให้ถูกต้อง ซึ่งในฤดูกาลนี้ผู้จัดการทีมอาร์เซนอลบางครั้งก็มีการจัดตัวที่น่าตั้งคำถามในแง่ของโปรไฟล์ผู้เล่นที่เลือกใช้", "ในเกมที่แพ้ ไบรท์ตัน 3-0 เขาให้ บรูโน กิมาไรส์ ออกสตาร์ทในแดนกลางเป็นครั้งแรก ในขณะที่ ไมลส์ ลูอิส-สเกลลี ผู้เล่นที่รับมือกับการกดดันได้ดีกว่าอาจเป็นตัวเลือกที่เหมาะสมกว่าในการเจอกับทีมที่เล่นเพรสซิงหนักอย่าง 'นกนางนวล' และในเกมล่าสุดที่ชนะ ฮัลล์ ซิตี้ อาร์เตตา เลือกใช้ ไค ฮาแวร์ตซ์ ในแดนหน้า ทั้งที่เกมต้องการความดุดันของ วิคเตอร์ โยเคเรส ในการปะทะกับสามเซ็นเตอร์แบ็กของทีมเยือน", "ตอนนี้ อาร์เตตา กำลังเผชิญกับภาวะกลืนไม่เข้าคายไม่ออกที่คล้ายกัน แต่เป็นในแนวรับ"], "link": "https://www.skysports.com/football/news/11095/13610324/william-saliba-or-ezri-konsa-mikel-arteta-has-tough-arsenal-selection-dilemma-when-french-defender-returns-to-full-fitness", "canonical_link": "https://www.skysports.com/football/news/11095/13610324/william-saliba-or-ezri-konsa-mikel-arteta-has-tough-arsenal-selection-dilemma-when-french-defender-returns-to-full-fitness", "cover_image_url": "https://e1.365dm.com/26/11/1920x1080/skysports-premier-league-arsenal_7402106.jpg?20261109122847", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-saliba-konsa_7402370.png?20261109172135", "https://e0.365dm.com/26/10/768x432/skysports-premier-league-nottingham-forest_7380014.jpg?20261018164033", "https://e0.365dm.com/26/11/768x432/skysports-konsa-arsenal_7402404.png?20261109175443", "https://e0.365dm.com/26/10/768x432/skysports-ezri-konsa-gabriel_7385703.jpg?20261024153843"], "videos": [], "review_score": "", "published_ts": 1794996000, "published_at": "2026-11-18T10:00:00Z", "published_th": "18 พ.ย. 2026 • 17:00 น.", "category_hint": "Football"}, {"id": 1795000534675, "guid": "https://www.skysports.com/football/news/11095/13549994/lewis-hall-is-englands-best-left-back-because-the-newcastle-player-started-out-as-a-midfielder-in-chelseas-youth-teams", "original_title": "Hall is England's best left-back - because he started out as a midfielder", "thai_title": "ทำไม ลูอิส ฮอลล์ ถึงกลายเป็นแบ็กซ้ายที่ดีที่สุดของทีมชาติอังกฤษ? เพราะเขาเริ่มต้นจากการเป็นกองกลาง", "tag": "Football", "sub_tag": "ENGLAND", "bullet_points": ["ลูอิส ฮอลล์ โชว์ฟอร์มโดดเด่นในเกมที่อังกฤษบุกชนะสเปน 3-2 ที่มาดริด โดยเฉพาะทักษะการครองบอลและการเลี้ยงบอลที่เหนือชั้น", "เอ็ด แบรนด์ อดีตโค้ชทีมเยาวชนเชลซีเผยว่า ฮอลล์ไม่ได้เล่นเป็นแบ็กซ้ายมาตั้งแต่เด็ก แต่เป็นกองกลางตัวรุกหรือหมายเลข 10 มาโดยตลอด", "ทักษะการเล่นในแดนกลางช่วยให้ฮอลล์มีความเข้าใจเกมแบบ 360 องศา ทำให้เขาสามารถขยับเข้าใน (Invert) และสร้างสรรค์เกมได้ดีกว่าแบ็กซ้ายทั่วไป", "แม้จะเคยถูกมองข้ามในการติดทีมชาติชุดลุยฟุตบอลโลกช่วงซัมเมอร์ที่ผ่านมา แต่ปัจจุบันฮอลล์กำลังก้าวขึ้นมาเป็นตัวเลือกอันดับหนึ่งในตำแหน่งแบ็กซ้ายของทีมชาติอังกฤษอย่างเต็มตัว"], "full_paragraphs": ["ลูอิส ฮอลล์ โชว์ฟอร์มได้อย่างยอดเยี่ยมให้กับทีมชาติอังกฤษในเกมที่บุกไปเอาชนะสเปนถึงกรุงมาดริด และกำลังก้าวขึ้นมาเป็นตัวเลือกอันดับหนึ่งในตำแหน่งแบ็กซ้ายอย่างเต็มตัว โดยได้รับข้อมูลเชิงลึกจากผู้ที่เคยใช้งานเขาในฐานะกองกลางสมัยเป็นเยาวชนที่เชลซี อดัม เบต ได้วิเคราะห์ถึงเหตุผลสำคัญที่ทำให้ดาวเตะรายนี้พัฒนาขึ้นอย่างก้าวกระโดด", "ช่วงเวลาที่น่าตื่นตาตื่นใจที่สุดเกิดขึ้นในนาทีที่ 18 เมื่อต้องใช้ผู้เล่นสเปนถึง 5 คนเพื่อหยุดยั้งการลากเลื้อยผ่านแนวรับของเขา แต่จังหวะที่แสดงให้เห็นถึงความมั่นใจและชั้นเชิงของ ลูอิส ฮอลล์ ได้ดีที่สุดคือการพลิกบอลหนี ฟาเบียน รูอิซ และ มิเกล เมริโน ในนาทีที่ 7 ของการแข่งขัน", "สถานการณ์ในจังหวะดังกล่าวดูเหมือนจะเป็นอันตรายสำหรับอังกฤษ แต่ฮอลล์กลับดูนิ่งและสบายมากในบทบาทตรงกลางสนาม ผลงานของเขาในชัยชนะ 3-2 ที่มาดริดเน้นย้ำให้เห็นถึงคุณภาพทั้งในยามที่มีบอลและไม่มีบอล โดยในครึ่งแรกเขาสามารถเลี้ยงบอลผ่านคู่แข่งได้ถึง 5 ครั้ง ซึ่งมากกว่า ลามีน ยามาล ถึง 5 ครั้ง", "เขาควรจะมีชื่อติดทีมชาติไปลุยฟุตบอลโลกในช่วงซัมเมอร์ที่ผ่านมา คนส่วนใหญ่อาจจะเลือกผู้เล่นจากนิวคาสเซิลรายนี้ แต่โชคร้ายสำหรับฮอลล์ที่กุนซือทีมชาติอังกฤษอย่าง โทมัส ทูเคิล ไม่ได้คิดเช่นนั้น ทำให้ทีมต้องเข้าสู่ทัวร์นาเมนต์โดยมีแบ็กซ้ายอาชีพเพียงคนเดียวเท่านั้น", "อย่างไรก็ตาม สิ่งที่น่าขันคือคนที่รู้จักฮอลล์ดีที่สุดอาจจะไม่จัดเขาอยู่ในหมวดหมู่แบ็กซ้ายเสียทีเดียว อันที่จริงท่าหมุนตัวที่ทำให้เหล่าผู้ชนะฟุตบอลโลกของสเปนต้องงุนงงนั้น เป็นจุดเด่นในเกมของเขาตั้งแต่สมัยเป็นเยาวชนที่เชลซี ซึ่งในตอนนั้นเขาไม่ใช่แบ็กซ้ายเลย", "เอ็ด แบรนด์ กล่าวกับ สกาย สปอร์ตส์ ว่า 'บ่อยครั้งที่ผมเล่นแผน 3-4-2-1 โดยใช้หมายเลข 10 ผมมักจะส่งเขาลงเล่นเป็นหมายเลข 10 บ่อยครั้งเพราะเขาเป็นกองกลางตัวกลางมาโดยตลอด หากผมเล่นแผน 4-2-3-1 ผมก็จะให้เขาเล่นเป็นหมายเลข 6 หรือ 8 แทน'", "แบรนด์เคยร่วมงานกับฮอลล์ในฐานะหัวหน้าโค้ชทีมเชลซีชุดอายุต่ำกว่า 18 ปี ในช่วงที่ฮอลล์เป็นหนึ่งในผู้เล่นที่อายุน้อยที่สุดในทีมเพียง 16 ปี 'เขาเป็นเด็กที่นิสัยดีมาก' แบรนด์ประทับใจในตัวเขามากจนการขยับเขาไปเล่นริมเส้นฝั่งซ้ายเป็นเพียงวิธีเดียวที่จะทำให้เขายังคงอยู่ในทีมได้", "เขากล่าวอธิบายว่า 'มีผู้เล่นที่อายุมากกว่าเขาและเป็นผู้เล่นที่ดี ในบางเกมที่ผมต้องการเก็บเขาไว้ในทีม เขาอาจจะต้องเล่นเป็นวิงแบ็กซ้าย แม้ว่าผมจะรู้ดีในตอนนั้นว่ามันไม่ใช่ตำแหน่งที่เขาชอบที่สุดก็ตาม เขาคือกองกลาง'", "เขาย้อนความหลังถึงเกมหนึ่งที่ไปเยือนท็อตแนม ซึ่งเขาให้ฮอลล์เล่นเป็นฟูลแบ็กเต็มตัว 'ผมบอกเขาว่า ดูนะ นี่คือวิธีที่ฉันจะส่งคุณลงสนาม ผมแค่ต้องการนักฟุตบอล 11 คนในทุกตำแหน่ง เพราะเราต้องการให้แน่ใจว่าเราจะได้ครองบอล' และที่เหลือก็กลายเป็นประวัติศาสตร์", "'เขาเริ่มเล่นตรงนั้นมากขึ้นเรื่อยๆ และมันก็ดำเนินไปจากจุดนั้น ปัจจุบันในสายตาของแฟนบอลส่วนใหญ่เขาถูกมองว่าเป็นแบ็กซ้าย ในขณะที่ผมรู้ดีว่าในตอนที่เขาเติบโตขึ้นมา เขาเป็นผู้เล่นเกมรุกที่มีความสามารถในการทำประตูและวิ่งสอดขึ้นไปข้างหน้าเสมอ'", "แบรนด์ชี้ให้เห็นถึงบทบาทสำคัญของ แอนดี ไมเยอร์ส ในการพัฒนาฮอลล์ให้เป็นแบ็กซ้ายในระดับอายุต่ำกว่า 21 ปี ซึ่งทำให้เกมของเขาพัฒนาขึ้น 'เขาทำได้ยอดเยี่ยมตอนที่เป็นหมายเลข 10 แต่ผู้คนปรับตัวและมองเห็นฟุตบอลของคุณในมุมที่ต่างออกไป' และการฝึกฝนในแดนกลางของฮอลล์ยังคงช่วยเขาได้จนถึงทุกวันนี้", "'เขารู้สึกสบายมากในตำแหน่งแบ็กซ้ายเพราะตำแหน่งที่เขาเคยเล่น เมื่อคุณเป็นผู้เล่นที่มีความสามารถแบบเขา ซึ่งคุ้นเคยกับการเล่นตรงกลางสนาม มองเห็นเกมแบบ 360 องศา เมื่อคุณถูกย้ายมาเป็นฟูลแบ็ก คุณจะมองมันและคิดว่ามันง่าย เขาสามารถมองเห็นทุกอย่าง'", "แบรนด์กล่าวถึงผู้เล่นที่ 'แสดงคุณสมบัติทั้งหมดออกมา' และอย่างที่เห็นในเกมกับสเปน เขาไม่ได้ถูกจำกัดอยู่แค่ริมเส้น 'ฟูลแบ็กในเกมสมัยใหม่มีความสำคัญมากในการหุบเข้าใน พวกเขาทำหน้าที่หลายอย่างในแดนกลางอยู่แล้ว ด้วยพรสวรรค์ของเขา เขาจึงทำได้ดีเยี่ยมในจุดนั้น'", "แน่นอนว่าบททดสอบในการเจอกับ ลามีน ยามาล นั้นมีทั้งตอนที่ไม่มีบอลและมีบอล ฮอลล์มีประสบการณ์ที่หลากหลายในการเจอกับดาวรุ่งมหัศจรรย์ของบาร์เซโลนาเมื่อต้นปีนี้ เขาทำผลงานได้ยอดเยี่ยมในเกมเหย้าของนิวคาสเซิลในศึกแชมเปียนส์ลีก แต่เขาก็เป็นส่วนหนึ่งของทีมที่เสียไปถึง 7 ประตูในเกมเยือน", "ในวัย 22 ปี ฮอลล์ยังคงเรียนรู้ด้วยตัวเอง แต่เขาแสดงให้เห็นในมาดริดแล้วว่าเขามีความสามารถมากกว่าที่จะทำหน้าที่ในส่วนอื่นของเกม ทักษะเกมรุกของเขายกระดับเขาให้เหนือกว่าผู้เล่นส่วนใหญ่ในตำแหน่งเดียวกัน แต่เขาก็ไม่ใช่จุดอ่อนในเกมรับอย่างแน่นอน", "'สิ่งที่น่าประทับใจเกี่ยวกับ ลูอิส คือเขาพัฒนาเกมรับขึ้นมากแค่ไหน' แบรนด์กล่าวเสริม 'คุณไม่สามารถเล่นในพรีเมียร์ลีกโดยไม่สามารถป้องกันในระดับหนึ่งได้ เขาจะยิ่งเก่งขึ้นเรื่อยๆ ยิ่งเขาได้รับโอกาสลงสนามมากขึ้น'", "จะมีโอกาสลงสนามมากขึ้นอย่างไม่ต้องสงสัย การที่เขาถูกมองข้ามในช่วงซัมเมอร์นั้นน่าตกใจยิ่งขึ้นเรื่อยๆ แต่ตอนนี้เขาจะได้รับโอกาสติดทีมชาติอย่างต่อเนื่อง และอาชีพการค้าแข้งที่น่าตื่นเต้นกำลังรอฮอลล์อยู่ บททดสอบใหญ่รออยู่ในพรีเมียร์ลีกที่จะพบกับแชมป์เก่าอย่าง อาร์เซนอล ในวันเสาร์นี้", "สำหรับแบรนด์ เขารู้สึกภูมิใจในพัฒนาการของลูกศิษย์และกระตือรือร้นกับศักยภาพที่เขาสามารถพัฒนาได้อีก อดีตกองกลางเชลซีรายนี้ได้เปลี่ยนตัวเองมาเ  หลังจบเกม ดามาร์คัส บีสลีย์ อดีตนักเตะที่เคยถูกยืมตัวไปเล่นให้กับ แมนเชสเตอร์ ซิตี้ ได้กล่าวกับโปเช็ตติโน่ว่า 'แมนเชสเตอร์เป็นสีฟ้า และมันจะเป็นสีฟ้าตลอดไป' ซึ่งโปเช็ตติโน่ได้ตอบกลับไปว่า 'คุณจะได้เห็น ให้เวลาผมหน่อย'", "โปเช็ตติโน่กล่าวเสริมว่า 'ความท้าทายใหม่นี้เป็นความท้าทายที่ยิ่งใหญ่ แต่ในขณะเดียวกัน มันก็เป็นอะดรีนาลีนที่คุณต้องการจะสัมผัส'", "'เราจำเป็นต้องใช้สามัญสำนึกของเรา... เรารู้ดีว่าสถานการณ์ในตอนนี้ไม่ใช่สถานการณ์ที่สโมสรอย่าง แมนเชสเตอร์ ยูไนเต็ด ควรจะเป็น แต่ฐานแฟนบอลของทีมนั้นยอดเยี่ยมมาก'", "โปเช็ตติโน่กำลังจะมุ่งหน้าสู่ โอลด์ แทรฟฟอร์ด หลังจากที่เขาเพิ่งพาทีมชาติสหรัฐอเมริกาผ่านเข้าสู่รอบ 16 ทีมสุดท้ายในศึกฟุตบอลโลกที่จัดขึ้นในบ้านของตัวเองเมื่อปีที่ผ่านมา", "'ทัศนคติคือการเรียนรู้จากทุกคน' โปเช็ตติโน่กล่าวกับผู้สื่อข่าว", "'คุณจำเป็นต้องเปิดใจให้กว้าง เพราะผมคิดว่าผู้เล่นสามารถสอนอะไรเราได้ทุกวัน ตอนนี้ทีมงานสตาฟฟ์โค้ชของเราเก่งขึ้นกว่าเดิมมาก'", "'ฟุตบอลเป็นเรื่องของทัศนคติ และเป็นเรื่องของวิธีการเข้าหา มันเป็นเรื่องของการเชื่อมโยง ความรู้สึก และการสื่อสาร'"], "link": "https://www.skysports.com/football/news/11095/13613499/mauricio-pochettino-incoming-manchester-united-head-coach-calls-for-time-to-topple-manchester-city-ahead-of-old-trafford-arrival", "canonical_link": "https://www.skysports.com/football/news/11095/13613499/mauricio-pochettino-incoming-manchester-united-head-coach-calls-for-time-to-topple-manchester-city-ahead-of-old-trafford-arrival", "cover_image_url": "https://e0.365dm.com/26/11/1920x1080/skysports-pochettino-manchester-united_7409369.jpg?20261118094443", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-football-manchester-united_7409250.jpg?20261118072425", "https://e0.365dm.com/26/11/768x432/skysports-man-utd-transfer_7408997.jpg?20261117183950", "https://e0.365dm.com/26/11/768x432/skysports-poch-julien-laurens_7408527.jpg?20261117111719"], "videos": [], "review_score": "", "published_ts": 1794993660, "published_at": "2026-11-18T09:21:00Z", "published_th": "18 พ.ย. 2026 • 16:21 น.", "category_hint": "Football"}, {"id": 1794989744631, "guid": "https://www.theguardian.com/football/2026/nov/18/premier-league-teams-full-backs-opta-analyst", "original_title": "Overlap, underlap or sit back? How Premier League teams use their full-backs", "thai_title": "เจาะลึกบทบาทฟูลแบ็กยุคใหม่: จากเกมรับสู่หัวใจสำคัญของทีมพรีเมียร์ลีก", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["บทบาทฟูลแบ็กในพรีเมียร์ลีกมีการเปลี่ยนแปลงอย่างมหาศาล จากเดิมที่เน้นเกมรับ กลายเป็นตำแหน่งที่มีความหลากหลายทั้งการเติมเกมรุก การหุบเข้าใน และการสร้างสรรค์โอกาส", "อาร์เซนอลเป็นทีมที่ฟูลแบ็กยืนตำแหน่งสูงที่สุดในลีก โดย เบน ไวท์ และ ริคคาร์โด คาลาฟิออรี มีส่วนร่วมกับประตูรวมกันถึง 6 ลูกในฤดูกาลนี้", "การวิเคราะห์ด้วยข้อมูลจาก Opta Vision เผยให้เห็นความแตกต่างของสไตล์การเล่น เช่น อาร์ชี เกรย์ ของทอตแนม ฮอตสเปอร์ ที่โดดเด่นเรื่องการวิ่งสอด (underlapping) ในขณะที่ เอเดรียน ทรูฟเฟิร์ต ของบอร์นมัธ คือราชาแห่งการเติมเกมริมเส้น (overlapping)", "แมนเชสเตอร์ ซิตี้ ภายใต้การคุมทีมของ เอ็นโซ มาเรสกา มีแนวทางการใช้ฟูลแบ็กที่น่าสนใจ โดยเลือกให้ยืนตำแหน่งต่ำกว่ามาตรฐานของทีมใหญ่ทั่วไป แม้จะครองบอลได้มากที่สุดในลีกก็ตาม"], "full_paragraphs": ["บทบาทของฟูลแบ็กมีการเปลี่ยนแปลงไปอย่างมากในช่วงไม่กี่ปีที่ผ่านมา จากเดิมที่เป็นตำแหน่งที่เน้นเกมรับเป็นหลักและคอยสนับสนุนเกมรุกเพียงเล็กน้อย ปัจจุบันบทบาทนี้ได้พัฒนาไปสู่ความซับซ้อนและมีมิติที่หลากหลายมากขึ้น ไม่ว่าจะเป็นการเติมเกมริมเส้น (overlapping), การวิ่งสอดเข้าใน (underlapping), การหุบเข้าใน (inverted) หรือแม้แต่การเล่นแบบดั้งเดิม", "ลองถาม เบน ไวท์ แบ็กขวาของอาร์เซนอลดูได้ ซึ่งเขาได้กลายเป็นตัวละครสำคัญร่วมกับ ริคคาร์โด คาลาฟิออรี ในฝั่งซ้าย ในช่วงเริ่มต้นฤดูกาลที่ยอดเยี่ยมของ 'ปืนใหญ่' โดยไวท์เคยกล่าวไว้เมื่อไม่กี่ปีก่อนว่า: “การเล่นฟูลแบ็กในแบบที่ [มิเกล อาร์เตตา] ต้องการนั้นแตกต่างจากผู้จัดการทีมคนอื่นอย่างสิ้นเชิง การจะเล่นฟูลแบ็กให้เขา คุณต้องเป็นทั้งกองกลางตัวกลาง, เซ็นเตอร์แบ็ก, ปีก และหมายเลข 10 ในคนเดียวกัน”", "ทั้งไวท์และคาลาฟิออรีมีส่วนร่วมกับประตูให้อาร์เซนอลไปแล้วถึง 6 ลูกในพรีเมียร์ลีกฤดูกาลนี้ (ไวท์: 3 แอสซิสต์; คาลาฟิออรี: 1 ประตู, 2 แอสซิสต์) ซึ่งไม่มีกองหลังคนใดในลีกที่มีส่วนร่วมกับประตูเกิน 3 ลูกในขณะนี้ ดูโอของอาร์เซนอลถือเป็นตัวอย่างที่ชัดเจนถึงอิทธิพลของฟูลแบ็กในยุคปัจจุบัน แต่ด้วยความต้องการของตำแหน่งที่สูงขึ้นกว่าเดิม ทีมต่างๆ ในพรีเมียร์ลีกใช้งานฟูลแบ็กของตนอย่างไร?", "ข้อมูลแสดงให้เห็นว่าฟูลแบ็กของอาร์เซนอลมีค่าเฉลี่ยตำแหน่งการสัมผัสบอลสูงที่สุดในพรีเมียร์ลีกฤดูกาลนี้ โดยอยู่ที่ 58.2 เมตรจากประตูของตนเอง ซึ่งสะท้อนให้เห็นถึงทั้งการครองพื้นที่ของอาร์เซนอล และอิสระที่ไวท์กับคาลาฟิออรีได้รับในการดันขึ้นไปอยู่ในแนวรุก โดยไวท์มีค่าเฉลี่ยการสัมผัสบอลในกรอบเขตโทษคู่แข่ง 3.4 ครั้งต่อ 90 นาที ซึ่งสูงที่สุดในบรรดาฟูลแบ็กหรือวิงแบ็กในลีก ส่วนคาลาฟิออรีรั้งอันดับ 3 ที่ 2.9 ครั้ง", "นอกจากนี้ ฟูลแบ็กของอาร์เซนอลยังมีค่าเฉลี่ยตำแหน่งการสัมผัสบอลที่แคบที่สุดในลีก ซึ่งเน้นย้ำว่าพวกเขาได้ละทิ้งบทบาทฟูลแบ็กแบบดั้งเดิมที่ต้องยืนชิดริมเส้นไปไกลแค่ไหน แต่กลับได้รับคำแนะนำให้หุบเข้าในและเล่นในพื้นที่ตรงกลางสนามแทน", "ทางด้าน ทอตแนม ฮอตสเปอร์ ก็ใช้งานฟูลแบ็กในตำแหน่งที่สูงมากเช่นกัน โดยส่วนใหญ่ในฤดูกาลนี้เป็น อาร์ชี เกรย์ ในฝั่งขวา และ แอนดี โรเบิร์ตสัน ในฝั่งซ้าย ข้อมูลจาก Opta Vision ช่วยให้เราติดตามสิ่งที่พวกเขาทำแม้ในยามที่ไม่มีบอล โดยเกรย์โดดเด่นมากในเรื่องความขยัน เขาเป็นอันดับ 1 ของฟูลแบ็กพรีเมียร์ลีกในการวิ่งสอดเข้าใน (underlapping) ทั้งจำนวนรวม (23 ครั้ง) และต่อ 90 นาที (2.9 ครั้ง) รวมถึงรั้งอันดับ 4 ในการเติมเกมริมเส้น (overlapping) ที่ 1.8 ครั้งต่อ 90 นาที", "แอนดี โรเบิร์ตสัน ก็ไม่น้อยหน้าในฝั่งตรงข้าม นักเตะวัย 32 ปีรายนี้รั้งอันดับ 7 ในการวิ่งสอดเข้าในต่อ 90 นาที (1.4 ครั้ง) และติดท็อป 20 ในการเติมเกมริมเส้น (1.1 ครั้ง) นอกจากนี้เขายังเป็นฟูลแบ็กที่ได้รับบอลในพื้นที่สุดท้าย (final third) มากที่สุด (159 ครั้ง) อีกด้วย", "อาจเป็นเรื่องน่าประหลาดใจที่เห็นฟูลแบ็กของ โคเวนทรี ซิตี้ เล่นในตำแหน่งที่สูงมาก ทั้งที่พวกเขาไม่ได้ครองบอลเป็นหลัก (ครองบอล 39.1% ต่ำที่สุดเป็นอันดับ 2) และเริ่มเกมจากแดนลึก (40.2 เมตรจากประตู ต่ำที่สุดเป็นอันดับ 6) อย่างไรก็ตาม นี่เป็นสิ่งที่พวกเขาทำได้ดีในแชมเปียนชิปเมื่อฤดูกาลที่แล้ว (ค่าเฉลี่ยความสูง 56.8 เมตร สูงที่สุดเป็นอันดับ 6)", "แฟรงค์ แลมพาร์ด ได้ใช้ระบบหลัง 5 ในบางครั้ง ซึ่งทำให้วิงแบ็กของเขาเล่นสูงขึ้นโดยธรรมชาติ แต่เขาก็มีความกล้าหาญในการดันแนวรับขึ้นสูงโดยรวม ส่งผลให้โคเวนทรีทำให้คู่แข่งล้ำหน้าไปแล้วถึง 30 ครั้ง ซึ่งสูงที่สุดเป็นอันดับ 2 ในลีก", "นั่นเปิดโอกาสให้ มิลาน ฟาน เอวิก และ เจย์ ดาซิลวา เติมเกมรุกทางริมเส้น ทั้งคู่สร้างโอกาสให้ทีมได้คนละ 8 ครั้ง โดยมีเพียง แจ็ค รูโดนี (12 ครั้ง) เท่านั้นที่สร้างโอกาสได้มากกว่าสำหรับ 'สกายบลูส์' โดยเฉพาะดาซิลวาที่เป็นช่องทางสำคัญทางฝั่งซ้าย เขาสัมผัสบอลในตำแหน่งที่สูงกว่าฟูลแบ็กคนอื่นๆ ในลีก และโคเวนทรีสร้างโอกาสจากการเล่นโอเพนเพลย์ถึง 42.2% ผ่านทางฝั่งของเขา ซึ่งเป็นสัดส่วนที่สูงที่สุดในพรีเมียร์ลีก", "ไม่น่าแปลกใจที่ นอตทิงแฮม ฟอเรสต์ และ ลีดส์ ยูไนเต็ด จะให้ฟูลแบ็กสัมผัสบอลในตำแหน่งที่สูง เนื่องจากทั้งสองทีมเป็นผู้ใช้งานวิงแบ็กรายใหญ่ที่สุด โดยทั้งสองทีมเป็นเพียง 2 ใน 4 ทีมที่เล่นด้วยระบบวิงแบ็กเป็นหลัก ในขณะที่ระบบหลัง 3 หรือหลัง 5 กลายเป็นสิ่งที่หาได้ยากในพรีเมียร์ลีกยุคปัจจุบัน", "สำหรับลีดส์ เจย์เดน โบเกิล มีอิทธิพลอย่างมากในเกมรุก เขาทำสถิติวิ่งเข้าสู่กรอบเขตโทษคู่แข่งมากกว่าฟูลแบ็กคนอื่นๆ ในฤดูกาลนี้ โดยมีค่าเฉลี่ย 3.9 ครั้งต่อ 90 นาที สูงที่สุดเป็นอันดับ 2 ในลีก รองจาก นิโก โอไรลีย์ ที่ลงเล่นในตำแหน่งฟูลแบ็กเพียง 54.3% ของเวลาทั้งหมด", "ในขณะเดียวกัน คริสตัล พาเลซ กำลังเผชิญกับผลกระทบจากการขาดหายไปของ แดเนียล มูญอซ แม้จะเล่นด้วยระบบวิงแบ็กเพียงอย่างเดียว แต่ตำแหน่งเฉลี่ยของฟูลแบ็กของพวกเขากลับตกลงมาต่ำกว่าค่าเฉลี่ยของลีกในฤดูกาลนี้ หลังจากที่เคยสูงที่สุดในฤดูกาล 2025-26 มูญอซเป็นนักเตะที่วิ่งขึ้นลงริมเส้นฝั่งขวาอย่างไม่รู้จักเหน็ดเหนื่อยในฤดูกาลที่แล้ว และการขาดเขาไปส่งผลกระทบอย่างชัดเจนต่อความสามารถของพาเลซในการดันวิงแบ็กฝั่งขวาขึ้นไปในพื้นที่ริมเส้น", "ปัจจุบันดาวเตะชาวโคลอมเบียย้ายไปอยู่กับ นอตทิงแฮม ฟอเรสต์ ภายใต้การคุมทีมของ โอลิเวอร์ กลาสเนอร์ อดีตผู้จัดการทีมของเขา ซึ่งฟอเรสต์ได้ขยับตำแหน่งการสัมผัสบอลเฉลี่ยของฟูลแบ็กจากอันดับ 5 ที่ต่ำที่สุด ขึ้นมาเป็นอันดับ 4 ที่สูงที่สุด ไม่ใช่แค่เพราะมูญอซเพียงคนเดียว แต่การมีนักเตะที่สามารถวิ่งสอดประสานได้อย่างต่อเนื่อง – ซึ่งเขาเป็นรองเพียง เลฟ เดวิส ของ อิปสวิช ทาวน์ ในเรื่องระยะทางเฉลี่ยของการวิ่งโดยไม่มีบอล – ช่วยทีมได้มาก", "เราไม่สามารถพูดถึงฟูลแบ็กที่เปี่ยมไปด้วยพลังที่สุดของลีกได้หากไม่กล่าวถึง เอเดรียน ทรูฟเฟิร์ต ที่ยังคงรักษาฟอร์มเก่งต่อเนื่องจากฤดูกาลที่แล้ว ดาวเตะชาวฝรั่งเศสคือราชาแห่งการเติมเกมริมเส้น (overlapping) โดยทำไปแล้ว 23 ครั้ง ซึ่งมากกว่าฟูลแบ็กคนอื่นๆ ในลีก หลังจากที่ฤดูกาลที่แล้วเขาทำสถิติเติมเกมริมเส้นมากกว่านักเตะคนอื่นเกือบสองเท่า แม้ผู้จัดการทีมอย่าง อันโดนี อิราโอลา จะย้ายออกไปแล้ว แต่เขาก็ยังได้รับอิสระในการเติมเกมรุกจาก มาร์โก โรเซ เฮดโค้ชคนใหม่ของบอร์นมัธอย่างชัดเจน", "อิราโอลา ย้ายไปคุม ลิเวอร์พูล และฟูลแบ็กของเขากลายเป็นหนึ่งในคู่หูที่มีความไม่สมมาตร (asymmetric) มากที่สุดในลีก มิลอส เคอร์เคซ ซึ่งได้รับอิสระในการเติมเกมรุกเช่นเดียวกับที่เคยทำที่บอร์นมัธภายใต้อิราโอลา กลายเป็นหนึ่งในนักเตะที่เติมเกมริมเส้นมากที่สุดในลีก โดยทำไปแล้ว 15 ครั้ง ในขณะที่อีกฝั่งหนึ่ง โรนัลด์ อเราโฮ ซึ่งปรับตัวมาจากเซ็นเตอร์แบ็ก รับบทบาทที่เน้นเกมรับมากกว่าอย่างเห็นได้ชัด", "แมนเชสเตอร์ ซิตี้ เป็นกรณีที่น่าสนใจ แม้จะมีค่าเฉลี่ยการครองบอลสูงที่สุดในลีก (65.4%) ผ่านบอลสำเร็จมากที่สุดต่อเกม (566 ครั้ง) และมีความโดดเด่นในการครองพื้นที่สูงสุด แต่ทีมของ เอ็นโซ มาเรสกา กลับไม่ใช้ฟูลแบ็กในพื้นที่แดนหน้าเพื่อสร้างความได้เปรียบนั้น โดยค่าเฉลี่ยตำแหน่งการสัมผัสบอลของฟูลแบ็กอยู่ที่ 53.1 เมตรจากประตู ซึ่งทำให้พวกเขาเป็นทีมที่ยืนตำแหน่งต่ำที่สุดเป็นอันดับ 4 ในลีก ซึ่งแตกต่างอย่างสิ้นเชิงจากฤดูกาลสุดท้ายของ เป๊ป กวาร์ดิโอลา ที่ซิตี้เคยมีค่าเฉลี่ยตำแหน่งฟูลแบ็กสูงเป็นอันดับ 3 ของลีก อย่างไรก็ตาม มีหลายวิธีในการเล่นฟูลแบ็กในพรีเมียร์ลีก แต่ความสำคัญที่เพิ่มขึ้นของตำแหน่งนี้ยังคงเป็นความจริงสำหรับทุกทีม"], "link": "https://www.theguardian.com/football/2026/nov/18/premier-league-teams-full-backs-opta-analyst", "canonical_link": "https://www.theguardian.com/football/2026/nov/18/premier-league-teams-full-backs-opta-analyst", "cover_image_url": "https://i.guim.co.uk/img/media/cddb452cd8ee7fd6ace9700d98796771abd3a4f0/0_0_5000_4000/master/5000.jpg?width=140&quality=85&auto=format&fit=max&s=92a4b103c38eea93c2aa9a7e0c7db3c3", "gallery_images": ["https://i.guim.co.uk/img/media/c48823f3e1c26042ca6dd350a7dc3eb748827 ์ลีก โดยเส้นทางของบาโลเตลลี่ไม่ได้เริ่มต้นจากอะคาเดมี่ของสโมสรยักษ์ใหญ่ แต่เขาเริ่มต้นจากการเล่นให้ ลูเมซซาเน่ ทีมในระดับดิวิชั่น 3 ของอิตาลี ใกล้บ้านเกิดในคอนเชซิโอ ก่อนจะไปทดสอบฝีเท้ากับ บาร์เซโลน่า แต่ไม่สำเร็จ และย้ายไปร่วมทีม อินเตอร์ มิลาน ในปี 2006", "ที่อินเตอร์ มิลาน บาโลเตลลี่ได้พบกับ โรแบร์โต้ มันชินี่ ผู้เป็นดั่งอาจารย์ใหญ่ ความสัมพันธ์ของทั้งคู่เปรียบเสมือนพ่อกับลูก ภายใต้การดูแลของกุนซือชาวอิตาลี บาโลเตลลี่ฉายแววโดดเด่นตั้งแต่อายุ 17 ปี โดยช่วยให้ทีมคว้าแชมป์กัลโช่ เซเรีย อา ฤดูกาล 2007-08 และเข้าถึงรอบชิงชนะเลิศโคปปา อิตาเลีย รวมถึงการทำ 2 ประตูใส่ ยูเวนตุส ในรอบก่อนรองชนะเลิศ", "ชีวิตของเขาเปลี่ยนไปเมื่อ โชเซ่ มูรินโญ่ เข้ามารับตำแหน่งต่อจากนั้น ไม่นานก็เกิดความขัดแย้งและการลงโทษทางวินัย โดยมูรินโญ่กล่าวว่าบาโลเตลลี่เป็นนักเตะที่ 'ควบคุมไม่ได้' และเคยวิจารณ์ฟอร์มการเล่นของเขาว่า 'ใกล้เคียงกับศูนย์' ความสัมพันธ์กับมูรินโญ่เต็มไปด้วยความตึงเครียด ซึ่งถือเป็นเรื่องยากที่กุนซือระดับ 'เดอะ สเปเชียล วัน' จะรับมือกับนักเตะคนหนึ่งไม่ได้ แม้บาโลเตลลี่จะคว้าแชมป์เซเรีย อา 3 สมัย และยูฟ่า แชมเปี้ยนส์ลีก กับอินเตอร์ แต่ชื่อเสียงในฐานะตัวปัญหาก็เริ่มบดบังผลงานในสนามของเขา", "ในเดือนสิงหาคม 2010 บาโลเตลลี่ย้ายไปร่วมทีม แมนเชสเตอร์ ซิตี้ เพื่อกลับมาร่วมงานกับมันชินี่อีกครั้ง กุนซือชาวอิตาลีพยายามพิสูจน์ว่าเขาสามารถควบคุมความคาดเดาไม่ได้ของบาโลเตลลี่ให้เป็นประโยชน์ต่อทีมได้ แต่ถึงกระนั้น บาโลเตลลี่ก็ยังคงสร้างประเด็นไม่หยุดหย่อน ทั้งการถูกใบแดง การขับรถชน และวีรกรรมปาปาเป้าใส่ผู้เล่นทีมเยาวชน ซึ่งแสดงให้เห็นถึงความไม่เป็นผู้ใหญ่", "หลังจากช่วยให้ แมนเชสเตอร์ ซิตี้ คว้าแชมป์เอฟเอ คัพ ในปี 2011 ซึ่งเป็นการสิ้นสุดการรอคอยถ้วยรางวัลใหญ่ในรอบ 35 ปี บาโลเตลลี่ก็ถูกวิจารณ์อย่างหนักจากการพยายามยิงท่าตอกส้นในเกมอุ่นเครื่องกับ แอลเอ กาแล็กซี่ จนมันชินี่ต้องเปลี่ยนตัวออกและตั้งคำถามถึงทัศนคติของเขาว่า 'ถ้าคุณจริงจัง คุณก็เล่นได้ 90 นาที แต่ถ้าไม่ คุณก็มานั่งข้างผมที่ม้านั่งสำรองได้เลย'", "บางครั้งความกล้าบ้าบิ่นของเขาก็ได้ผล เช่น ประตูที่ใช้หัวไหล่กระแทกเข้าประตูในเกมกับ นอริช ซิตี้ แต่ในเดือนตุลาคม 2011 เขาก็ตกเป็นข่าวใหญ่เมื่อหน่วยดับเพลิงต้องเข้าไประงับเหตุไฟไหม้ในห้องน้ำที่บ้านพักของเขา โดยบาโลเตลลี่อ้างว่าเป็นฝีมือของเพื่อน แต่ไม่กี่วันต่อมาเขาก็กลายเป็นฮีโร่ด้วยการทำประตูแรกในเกมที่ถล่ม แมนเชสเตอร์ ยูไนเต็ด 6-1 พร้อมโชว์เสื้อ 'Why always me?'", "มีเรื่องเล่ามากมายเกี่ยวกับเขา ทั้งการให้เงินคนไร้บ้าน 1,000 ปอนด์, การบุกไปที่โรงเรียนเพื่อจัดการกับเด็กที่รังแกนักเรียนคนอื่น หรือการขับรถแต่งตัวเป็นซานตาคลอสแจกของขวัญ ซึ่งแม้เจ้าตัวจะปฏิเสธหลายเรื่อง แต่ด้วยชื่อเสียงในตอนนั้นทำให้คนเชื่อว่าเป็นเรื่องจริง แฟนบอลซิตี้ถึงกับแต่งเพลงเชียร์ล้อเลียนอาการแพ้หญ้าของเขา และพฤติกรรมที่ชอบพกเงินสดเต็มกระเป๋าขับรถไปทั่วเมือง", "ในเดือนเมษายน 2012 บาโลเตลลี่ถูกใบแดงในเกมกับ อาร์เซน่อล ซึ่งดูเหมือนจะเป็นจุดจบของความหวังในการคว้าแชมป์ แต่หนึ่งเดือนต่อมา เขากลับเป็นคนแอสซิสต์ให้ เซร์คิโอ อเกวโร่ ทำประตูชัยในนาทีสุดท้ายในเกมกับ ควีนส์ปาร์ค เรนเจอร์ส ซึ่งทำให้ซิตี้คว้าแชมป์พรีเมียร์ลีกสมัยแรกได้สำเร็จ", "มิคาห์ ริชาร์ดส์ อดีตเพื่อนร่วมทีมกล่าวว่า 'เขาบ้าในทางที่ดี เขาเป็นสีสันของทีม เป็นฮีโร่ของแฟนบอลไม่ใช่แค่เรื่องนอกสนาม แต่ในสนามด้วย สิ่งที่ดีที่สุดคือเขาเป็นคนน่ารัก ไม่ได้หยิ่งผยองอย่างที่สื่อพยายามนำเสนอ เขาแค่บ้าๆ บอๆ นิดหน่อยเท่านั้น'", "อย่างไรก็ตาม ในเดือนมกราคม 2013 ความอดทนของมันชินี่ก็สิ้นสุดลงหลังจากมีปากเสียงกันในสนามซ้อม บาโลเตลลี่ถูกขายไปให้ เอซี มิลาน โดยมันชินี่กล่าวว่า 'เขาไม่ใช่คนเลวและเป็นนักเตะที่ยอดเยี่ยม แต่ผมเสียใจแทนเขาที่เขายังคงทำลายพรสวรรค์และคุณภาพของตัวเอง ผมไม่มีคำพูดใดๆ สำหรับพฤติกรรมของเขา ผมหวังว่าเขาจะเข้าใจว่าเขากำลังทำลายอนาคตของตัวเอง'", "เนดุม โอนูโอฮา อดีตเพื่อนร่วมทีมอีกคนกล่าวทิ้งท้ายว่า 'ครั้งหนึ่ง มาริโอเชื่อจริงๆ ว่าเขาเป็นหนึ่งในนักเตะที่ดีที่สุดในโลก มีเรื่องเล่าเกี่ยวกับเขามากมายที่ซิตี้ แต่ที่ผมจำได้แม่นคือตอนที่ใครสักคนพูดถึง ลิโอเนล เมสซี่ และ คริสเตียโน่ โรนัลโด้ แล้วมาริโอก็บอกว่าเขาเก่งเท่ากับคนเหล่านั้น และเขาพูดด้วยความจริงจังอย่างที่สุด'"], "link": "https://www.bbc.co.uk/sport/football/articles/cvgxvg4v981o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cvgxvg4v981o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/033a/live/effd2720-ddf4-11f1-8445-15eb55286f71.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9053/live/0a8541a0-ddf4-11f1-bb8c-51310f5678ed.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8ed9/live/d8473500-e14e-11f1-b11b-dd14e59ca2da.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f890/live/21593d20-a08f-11f1-84af-1fbec28b23b2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/cf03/live/de6139f0-a08e-11f1-84af-1fbec28b23b2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4783/live/9e740110-e14d-11f1-b11b-dd14e59ca2da.jpg"], "videos": [], "review_score": "", "published_ts": 1794896143, "published_at": "2026-11-17T06:15:43Z", "published_th": "17 พ.ย. 2026 • 13:15 น.", "category_hint": "Football"}, {"id": 1794843039513, "guid": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "original_title": "How Frank can restore reputation and save Crystal Palace", "thai_title": "ภารกิจกู้ชีพ! โธมัส แฟรงค์ เตรียมรับงานคุม คริสตัล พาเลซ หวังฟื้นฟูชื่อเสียงในพรีเมียร์ลีก", "tag": "Football", "sub_tag": "CRYSTAL PALACE", "bullet_points": ["โธมัส แฟรงค์ เตรียมเข้ารับตำแหน่งผู้จัดการทีมคนใหม่ของ คริสตัล พาเลซ หลังทีมทำผลงานย่ำแย่รั้งอันดับบ๊วยของตาราง", "ความท้าทายสำคัญของแฟรงค์คือการปรับปรุงเกมรับที่เสียประตูมากที่สุดในลีกถึง 24 ลูก และการสร้างความเชื่อมั่นให้กับทีมที่ขาดคุณภาพหลังจากเสียผู้เล่นตัวหลักไปในช่วงซัมเมอร์", "แม้สถานการณ์จะดูยากลำบาก แต่พาเลซยังมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายในช่วง 10 นัดแรกในรอบ 24 ปี", "แฟรงค์ตั้งเป้าใช้ประสบการณ์จากการคุม เบรนท์ฟอร์ด มาปรับใช้เพื่อสร้างความมั่นคงและยกระดับทีมให้กลับมาแข่งขันได้อีกครั้ง"], "full_paragraphs": ["คริสตัล พาเลซ กำลังจะกลายเป็นสโมสรที่ 3 ในลอนดอนที่ โธมัส แฟรงค์ เข้ามาคุมทีม ต่อจาก เบรนท์ฟอร์ด และ ท็อตแนม ฮอตสเปอร์", "เมื่อเดือนมิถุนายนที่ผ่านมา โธมัส แฟรงค์ ได้กล่าวไว้ว่า \"เมื่อถึงเวลาที่เหมาะสม ผมจะตั้งตารอการกลับมาทำหน้าที่ผู้จัดการทีมอีกครั้ง พร้อมที่จะทุ่มเทให้กับงานด้วยพลังงานและความมุ่งมั่นอย่างเต็มที่\" และเวลานั้นก็มาถึงแล้ว เมื่อกุนซือชาวเดนมาร์กรายนี้กำลังจะได้รับการประกาศให้เป็นนายใหญ่คนใหม่ของ คริสตัล พาเลซ ทีมที่ปัจจุบันรั้งอันดับบ๊วยของตารางพรีเมียร์ลีก โดยมีแต้มห่างจากโซนปลอดภัยอยู่ 2 คะแนน และมีผลต่างประตูได้เสียที่เป็นรอง", "ก่อนหน้านี้ ปิแอร์ เซจ อดีตหัวหน้าผู้ฝึกสอนของพาเลซ เพิ่งถูกปลดออกจากตำแหน่งเมื่อสัปดาห์ที่ผ่านมา หลังจากคุมทีมไปเพียง 16 นัดรวมทุกรายการ ซึ่งการเข้ามารับงานในครั้งนี้ถือเป็นโอกาสสำคัญที่แฟรงค์จะกู้ชื่อเสียงของตนเองกลับคืนมา หลังจากถูก ท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมาหลังคุมทีมได้เพียง 8 เดือน", "ร็อบ กรีน อดีตผู้รักษาประตูทีมชาติอังกฤษและ เวสต์แฮม ยูไนเต็ด กล่าวกับ BBC Sport ว่า \"มันจะเป็นเรื่องที่น่าตกใจสำหรับ โธมัส แฟรงค์ เล็กน้อย เขาเคยประสบความสำเร็จที่ เบรนท์ฟอร์ด ซึ่งเป็นสโมสรที่มีการบริหารจัดการที่ดีเยี่ยม มีการวางแผนและคิดมาอย่างดีในการดึงนักเตะเข้ามาทดแทนคนที่ขายออกไปเพื่อทำกำไร แต่สิ่งนั้นไม่ได้เกิดขึ้นที่ คริสตัล พาเลซ พวกเขาสูญเสียผู้เล่นไปแล้วต้องรีบหาคนมาแทนอย่างฉุกละหุก ทีมชุดนี้ถูกลดทอนคุณภาพลงจากการขายนักเตะออกไปโดยไม่มีใครที่มีคุณภาพเท่าเดิมเข้ามาแทนที่ โธมัส แฟรงค์ จำเป็นต้องค้นหาบางอย่างภายในทีมเพื่อสร้างความเชื่อมั่นว่าพวกเขาสามารถแข่งขันในพรีเมียร์ลีกได้ เพราะในตอนนี้มันดูห่างไกลจากจุดนั้นมาก\"", "นับตั้งแต่ถูกปลดจาก ท็อตแนม ฮอตสเปอร์ หลังคุมทีมในลีกไป 26 นัดเมื่อฤดูกาลที่แล้ว แฟรงค์ว่างเว้นจากการคุมทีมมานานกว่าช่วงเวลาที่เขาคุมทีมสเปอร์สเสียอีก ในช่วงซัมเมอร์เขาเคยออกแถลงการณ์ว่า \"มีการพูดคุยและโอกาสต่างๆ\" เข้ามาให้เขากลับไปทำงาน แต่เขา \"ตัดสินใจที่จะไม่รีบร้อนรับงานถัดไป\"", "พอล โรบินสัน อดีตผู้รักษาประตู ท็อตแนม ฮอตสเปอร์ และทีมชาติอังกฤษ กล่าวว่า \"พาเลซเคยมีหนึ่งในผู้จัดการทีมที่ดีที่สุดเท่าที่พวกเขาเคยมีมา หรืออาจจะดีที่สุดตลอดกาลด้วยซ้ำ ที่พาทีมคว้าถ้วยรางวัลมาครอง ลองดูสิ่งที่พวกเขาทำได้เมื่อฤดูกาลที่แล้วสิ แทนที่จะต่อยอดจากจุดนั้น พวกเขากลับรื้อทีมทิ้ง พวกเขาถอยหลังลงคลอง\"", "แฟรงค์เคยเปรียบเปรยการเป็นผู้จัดการทีมว่าเหมือนการอยู่บน \"วงล้อหนูถีบจักร\" และ \"ละครสัตว์ที่บ้าคลั่ง\" ดังนั้นการที่เขาตัดสินใจกลับมาคุมทีมที่รั้งท้ายตารางในตอนนี้ จึงเป็นเรื่องที่น่าสนใจ โดยแฟรงค์ซึ่งเคยเป็นส่วนหนึ่งของทีมวิเคราะห์ฟุตบอลโลกของ BBC Sport ในช่วงซัมเมอร์ จะกลับมาทำงานด้วยความสดชื่นและพลังงานที่เต็มเปี่ยมหลังจากห่างหายจากวงการไปหลายเดือน", "ระหว่างการรับตำแหน่งที่ เบรนท์ฟอร์ด ในเดือนตุลาคม 2018 จนถึงวันที่ถูกปลดจาก สเปอร์ส เมื่อต้นปีนี้ เขาทำงานโดยไม่มีวันหยุดพักมานานถึง 7 ปีกับอีก 4 เดือน การใช้เวลาช่วงไม่กี่เดือนที่ผ่านมาห่างจากความกดดันของพรีเมียร์ลีก ทำให้แฟรงค์ได้ \"ศึกษา สังเกต และเรียนรู้จากผู้นำคนอื่นๆ ทั้งในและนอกวงการกีฬา\" ตามคำกล่าวของเขาเอง", "แฟรงค์ซึ่งให้ความสำคัญอย่างยิ่งกับการจัดระเบียบลูกตั้งเตะ จะต้องรีบปรับจูนทีมทันทีที่ คริสตัล พาเลซ ซึ่งแพ้ในลีกมา 4 นัดติดต่อกัน โดยทีมเสียประตูไปแล้วถึง 24 ลูก ซึ่งมากที่สุดในพรีเมียร์ลีก และยิงได้เพียง 10 ประตูเท่านั้น", "ทอม อัลนัตต์ นักข่าวฟุตบอลจาก The Times กล่าวกับรายการ Football Daily ของ BBC Radio 5 Live ว่า \"หากคุณต้องการใครสักคนเข้ามาเพื่อสร้างความมั่นคงและความแข็งแกร่งในเกมรับ พร้อมกับปรับปรุงเรื่องลูกตั้งเตะ โธมัส แฟรงค์ คือคนที่สมบูรณ์แบบสำหรับงานนี้\"", "ด้วยการที่พรีเมียร์ลีกเพิ่งผ่านไปเพียง 10 นัด แฟรงค์ยังมีเวลามากพอที่จะพลิกสถานการณ์ และเขาน่าจะมีเป้าหมายในใจสำหรับการเสริมทัพเมื่อตลาดซื้อขายนักเตะเปิดขึ้นในเดือนมกราคม โดยในช่วงซัมเมอร์ที่ผ่านมา พาเลซขาย แม็กซองซ์ ลาครัวซ์ กองหลังชาวฝรั่งเศสให้ เชลซี ในราคา 52 ล้านปอนด์ และ ดาเนียล มูญอซ แบ็กขวาชาวโคลอมเบียให้ นอตทิงแฮม ฟอเรสต์ ในราคา 22 ล้านปอนด์ ซึ่งอัลนัตต์เสริมว่า \"เรารู้ว่าพวกเขาขายนักเตะฝีเท้าดีออกไปเยอะมาก และจนถึงตอนนี้ผมไม่คิดว่าพวกเขาจะหาใครมาแทนที่ได้อย่างเหมาะสม\"", "ความท้าทายอีกประการสำหรับแฟรงค์คือการดึงฟอร์มเก่งของ อดัม วอร์ตัน กองกลางที่ไม่ได้ลงเล่นให้ทีมชาติอังกฤษมาตั้งแต่เดือนมีนาคมให้กลับมาอีกครั้ง ซึ่งสิ่งเหล่านี้คือความท้าทายที่ผู้จัดการทีมคนใหม่พร้อมจะเผชิญ", "พอล โรบินสัน กล่าวทิ้งท้ายว่า \"คริสตัล พาเลซ และ โธมัส แฟรงค์ ดูจะเป็นส่วนผสมที่ลงตัวมาก\" ทั้งนี้ โธมัส แฟรงค์ มีงานหนักรออยู่ เพราะ คริสตัล พาเลซ คือทีมที่แย่ที่สุดในพรีเมียร์ลีกฤดูกาลนี้อย่างไม่ต้องสงสัย โดยรั้งอันดับบ๊วยทั้งในแง่ของคะแนน (7 คะแนน) ผลต่างประตูได้เสีย (-14) และค่าคาดหวังประตูได้เสีย (-8.1)", "ในส่วนของเกมรับคือจุดที่แฟรงค์ต้องให้ความสำคัญมากที่สุด ไม่เพียงแต่เสียประตูมากที่สุด (24 ลูก) แต่ยังปล่อยให้คู่แข่งยิงมากที่สุด (189 ครั้ง) และมีค่าคาดหวังการเสียประตู (xGA) แย่ที่สุดในลีกที่ 21.9", "อย่างไรก็ตาม ในส่วนของเกมรุกถือว่าไม่ได้แย่จนเกินไป แม้จะมีเพียง ฮัลล์ ซิตี้ เท่านั้นที่ยิงน้อยกว่า แต่พาเลซก็สร้างโอกาสได้ดีและอาจโชคร้ายที่ยิงประตูไม่ได้มากกว่านี้จากโอกาสที่มี", "นอกจากนี้ยังมีปัจจัยสำคัญที่เข้าทางแฟรงค์ แม้พาเลซจะรั้งอันดับบ๊วย แต่พวกเขายังไม่ถูกทิ้งห่าง เพราะมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน โดยทีมที่รั้งอันดับสุดท้ายในช่วงเวลานี้ของ 10 ฤดูกาลหลังสุดมีค่าเฉลี่ยเพียง 3 คะแนน แต่สำหรับพาเลซ แม้ผลงานจะแย่เพียงใด พวกเขาก็ยังมีถึง 7 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายหลังผ่านไป 10 นัดในรอบ 24 ปี"], "link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/a30c/live/69f709f0-df63-11f1-a8af-15d7a25dc0d1.png", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794851176, "published_at": "2026-11-16T17:46:16Z", "published_th": "17 พ.ย. 2026 • 00:46 น.", "category_hint": "Football"}, {"id": 1794703574646, "original_title": "White has 'exciting future' despite boos - Rice", "thai_title": "ไรซ์ปกป้อง ไวท์ หลังถูกแฟนบอลโห่ใส่ที่เวมบลีย์ พร้อมชี้อนาคตกับทีมชาติยังสดใส", "tag": "Football", "bullet_points": ["เดแคลน ไรซ์ ออกโรงปกป้อง เบน ไวท์ เพื่อนร่วมทีมอาร์เซนอล หลังถูกแฟนบอลโห่ใส่ในเกมที่อังกฤษชนะโครเอเชีย 2-1", "ไรซ์ชื่นชมความแข็งแกร่งทางจิตใจของไวท์ที่ยังคงทำผลงานได้ดีแม้จะเผชิญกับสถานการณ์ที่ยากลำบาก", "ไวท์เคยถอนตัวจากแคมป์ทีมชาติในฟุตบอลโลก 2022 และไม่ได้ถูกเรียกตัวติดทีมชาติในช่วงที่แกเร็ธ เซาธ์เกต คุมทีม", "เดแคลน ไรซ์ ยืนยันว่าเขากำลังอยู่ในระหว่างการเจรจาสัญญาฉบับใหม่กับอาร์เซนอล ซึ่งคาดว่าจะทำให้เขากลายเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของสโมสร", "ไรซ์เชื่อมั่นว่าความต่อเนื่องในการเล่นฟุตบอลในระดับสูงช่วยให้เขาพัฒนาฝีเท้าได้อย่างมั่นคง"], "full_paragraphs": ["เดแคลน ไรซ์ ได้ออกมาปกป้อง เบน ไวท์ เพื่อนร่วมทีมอาร์เซนอล หลังจากที่กองหลังรายนี้ถูกแฟนบอลโห่ใส่ที่สนามเวมบลีย์ ในระหว่างเกมที่ทีมชาติอังกฤษเอาชนะโครเอเชียไปได้ 2-1 เมื่อวันพฤหัสบดีที่ผ่านมา", "สำหรับ เบน ไวท์ ซึ่งถูกส่งลงสนามในฐานะตัวสำรองในเกมเนชันส์ลีกนัดนี้ เคยตัดสินใจถอนตัวจากแคมป์ทีมชาติอังกฤษในศึกฟุตบอลโลก 2022 ที่กาตาร์ เพื่อเดินทางกลับบ้านด้วยเหตุผลส่วนตัว", "หลังจากเหตุการณ์ดังกล่าว ไวท์ไม่ได้ถูกเรียกตัวติดทีมชาติอีกเลยตลอดช่วงเวลาที่ แกเร็ธ เซาธ์เกต ดำรงตำแหน่งผู้จัดการทีมชาติอังกฤษ นอกจากนี้ เขายังเคยถูกแฟนบอลบางส่วนโห่ใส่ในเกมที่เสมอกับยูเครน 1-1 เมื่อเดือนมีนาคมที่ผ่านมา หลังจากที่เขากลับมาติดทีมชาติอีกครั้งภายใต้การคุมทีมของ โทมัส ทูเคิล", "\"เหตุการณ์ที่เกิดขึ้นกับเบนมันผ่านไปกว่า 5 ปีแล้ว ผมไม่รู้จริงๆ ว่าทำไมเรื่องนี้ถึงยังคงเป็นประเด็นที่ถูกหยิบยกมาพูดถึงอยู่\" ไรซ์กล่าวกับ BBC Radio 5 Live", "\"เมื่อรู้จักเบน และรู้จักตัวตนของเขา ผมบอกได้เลยว่าเขาได้ก้าวข้ามเรื่องราวทั้งหมดนั้นไปเรียบร้อยแล้ว เขาภูมิใจเสมอที่ได้สวมเสื้อทีมชาติ และทุกครั้งที่เขาลงสนาม เขาจะทุ่มเทเต็มร้อยเปอร์เซ็นต์เสมอ\"", "\"มันแสดงให้เห็นถึงตัวตนของเขา การถูกโห่ใส่ตอนลงสนามที่เวมบลีย์ไม่ใช่เรื่องง่ายเลย แต่การที่เขาสามารถแสดงความแข็งแกร่งทางจิตใจเพื่อลงเล่นและทำผลงานได้ดี เหมือนกับที่เขาทำได้ในช่วงหลายเดือนที่ผ่านมานั้น ถือเป็นเครื่องพิสูจน์ตัวเขาได้อย่างแท้จริง\"", "ไรซ์ยังกล่าวเสริมว่า บรรดาผู้เล่นในทีมไม่ได้มีการพูดคุยถึงสถานการณ์นี้เลย และทุกคนต่างก้าวข้ามเรื่องดังกล่าวไปแล้ว พร้อมระบุว่า ไวท์ยังมี \"อนาคตที่น่าตื่นเต้นรออยู่กับทีมชาติอังกฤษชุดนี้\"", "ก่อนหน้านี้ ไวท์เคยกล่าวว่า ผู้คนยังไม่ทราบ \"เรื่องราวทั้งหมด\" เบื้องหลังการตัดสินใจถอนตัวจากแคมป์กาตาร์ แต่เขาก็ยังคงยืนหยัดในการตัดสินใจของตนเอง", "ในประเด็นอื่น ไรซ์ยังยืนยันว่าเขากำลังใกล้ที่จะเซ็นสัญญาฉบับใหม่กับอาร์เซนอล โดย BBC Sport ได้รายงานครั้งแรกเมื่อวันที่ 7 ตุลาคมว่า กองกลางรายนี้เตรียมเซ็นสัญญาฉบับใหม่ระยะยาวที่เอมิเรตส์ สเตเดียม ซึ่งนักเตะวัย 27 ปีได้กล่าวถึงเรื่องนี้ก่อนเกมที่อังกฤษจะพบกับสเปนในวันอาทิตย์ว่า \"สัญญาฉบับใหม่น่าจะเกิดขึ้นในเร็วๆ นี้ และผมโชคดีมากที่ได้อยู่กับสโมสรอย่างอาร์เซนอล ที่ซึ่งผู้จัดการทีมแสดงความเชื่อมั่นในตัวผมอย่างมาก รวมถึงเพื่อนร่วมทีมที่ทุ่มเทพลังให้กับผมอย่างเต็มที่\"", "สัญญาปัจจุบันของไรซ์จะหมดลงในปี 2028 แต่คาดว่าอดีตดาวเตะเวสต์แฮมรายนี้จะขยายระยะเวลาการค้าแข้งในลอนดอนเหนือออกไป หลังจากย้ายมาจากลอนดอน สเตเดียม ในปี 2023 ด้วยค่าตัว 105 ล้านปอนด์ โดยสัญญาฉบับใหม่นี้จะทำให้เขากลายเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของอาร์เซนอลเทียบเท่ากับ บูกาโย ซากา", "ไรซ์สามารถหลีกเลี่ยงความวุ่นวายตลอดอาชีพการค้าแข้งของเขา และเขาเชื่อว่าความต่อเนื่องนี้เองที่ช่วยให้เขาเติบโตขึ้น \"ผมโชคดีมากที่สามารถเล่นในระดับที่สม่ำเสมอได้ตลอดอาชีพการค้าแข้ง ผมตั้งเป้าหมายให้ตัวเองเสมอและผลักดันตัวเองให้มากขึ้น\"", "\"ผมโชคดีมากที่ไม่ต้องกังวลกับเรื่องเหล่านั้น เพราะมันทำให้การเล่นฟุตบอลเป็นเรื่องที่ง่ายขึ้นมาก\""], "link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5f63/live/321873e0-ef8b-11ee-975b-efffd9777018.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6615/live/ce8996a0-7ab8-11f0-83cc-c5da98c419b8.png"], "published_th": "15 พ.ย. 2026 • 05:26 น.", "category_hint": "Football", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "guid": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "published_ts": 1794695216, "published_at": "2026-11-14T22:26:56Z", "videos": [], "review_score": "", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นความคล่องตัวสูง คุณจำเป็นต้องวิ่ง คุณต้องสามารถวิ่งและทำความเร็วสูงได้ พื้นฐานที่สุดคือต้องฟิต\"", "\"ผู้จัดการทีมทุกคนต้องการช่วงปรีซีซั่นที่ดีและเวลาในการถ่ายทอดไอเดียรวมถึงสร้างความฟิต แต่นักเตะจะรู้สึกได้ทันทีว่ามันเป็นคนละระดับกัน นี่คือสิ่งที่ต้องทำทุกวันที่สนามซ้อม ต้องเต็มที่ 100% นั่นคือสิ่งที่เขาขอและต้องการ มันจะเป็นความแตกต่างครั้งใหญ่สำหรับนักเตะและพวกเขาจะเห็นผลลัพธ์ทันที\"", "\"ในเกมแชมเปียนส์ลีก รอบรองชนะเลิศ เราตามหลัง 3-0 (ในเกมพบกับ อาแจ็กซ์) เขาไม่ได้พูดเรื่องแท็กติกในช่วงพักครึ่งเลย เขาแค่บอกว่า 'พวกคุณต้องใช้ร่างกายเข้าสู้ ต้องสู้ คุณต้องการแค่ประตูเดียวเพื่อกลับมาสู่เกม จงเช
