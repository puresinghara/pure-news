่างออกแบบพอร์ตเชื่อมต่อของตนเอง ทำให้เกิดขยะอิเล็กทรอนิกส์จำนวนมากจากการต้องเปลี่ยนสายชาร์จตามรุ่นโทรศัพท์", "พอร์ตอย่าง Motorola CE Bus, Nokia Pop-Port, Apple 30-pin, Sony Ericsson FastPort และ HTC ExtUSB คือตัวอย่างของนวัตกรรมที่เคยได้รับความนิยมก่อนจะถูกแทนที่ด้วยมาตรฐานใหม่", "การเปลี่ยนผ่านสู่มาตรฐานเดียวช่วยลดต้นทุนและเพิ่มความสะดวกสบายให้กับผู้ใช้งานทั่วโลกอย่างมหาศาล"], "full_paragraphs": ["ในยุคที่สายชาร์จยังไม่มีมาตรฐานกลางเหมือนในปัจจุบัน เราเคยผ่านการใช้งานพอร์ตเชื่อมต่อที่น่าสนใจและหลากหลายสำหรับการชาร์จโทรศัพท์มือถือมาแล้วมากมาย", "ในปัจจุบัน USB-C ได้กลายเป็นมาตรฐานหลักสำหรับสมาร์ตโฟนด้วยจุดเด่นด้านการออกแบบที่เสียบได้ทั้งสองด้าน (Reversible) การจ่ายไฟที่มีประสิทธิภาพ และการถ่ายโอนข้อมูลความเร็วสูง โดยเฉพาะอย่างยิ่งเมื่อมีกฎระเบียบจากสหภาพยุโรป (EU) ที่ผลักดันให้กลายเป็นมาตรฐานสากล ซึ่งพอร์ตในยุคก่อนหน้านี้แม้จะมีเสน่ห์เฉพาะตัว แต่ส่วนใหญ่มักมีขนาดใหญ่เทอะทะและขาดฟีเจอร์ที่ครบครัน การที่ไม่มีพอร์ตมาตรฐานกลางในสมัยนั้นส่งผลให้เกิดขยะอิเล็กทรอนิกส์จำนวนมากจากการที่ผู้ใช้ต้องเปลี่ยนสายชาร์จทุกครั้งที่เปลี่ยนไปใช้โทรศัพท์จากผู้ผลิตรายใหม่", "แม้จะมีข้อจำกัดเรื่องแบนด์วิดท์และความเร็วในการชาร์จที่ช้ากว่าปัจจุบัน แต่ผมก็อดไม่ได้ที่จะหวนนึกถึงพอร์ตเชื่อมต่อที่เป็นเอกลักษณ์เหล่านี้จากวันวาน ซึ่งมีรูปร่างและขนาดที่แตกต่างกันไปตามความต้องการของผู้ผลิตและข้อจำกัดทางเทคนิคในขณะนั้น ก่อนที่จะมีฟีเจอร์อย่าง AirDrop ของ Apple เราต้องพึ่งพาสายเคเบิลในการถ่ายโอนไฟล์ขนาดใหญ่ และหากคุณเป็นคนที่เปลี่ยนโทรศัพท์ข้ามยี่ห้อบ่อยๆ คุณอาจจะมีคอลเลกชันสายชาร์จที่มากมายมหาศาลเลยทีเดียว", "เรามาลองย้อนดูพอร์ตชาร์จสุดคลาสสิกที่บางครั้งก็ถูกลืม หรือบางครั้งก็ดูแปลกประหลาด ซึ่งเคยปรากฏอยู่ในโทรศัพท์มือถือยุคก่อนการมาถึงของ USB-C กัน", "พอร์ตแรกคือ CE Bus แบบ 17-pin ที่ปรากฏครั้งแรกบนโทรศัพท์ Motorola ในปี 2000 ซึ่งมีขนาดใหญ่มาก แม้จะไม่สามารถเสียบได้สองด้านและมีตัวล็อกเพื่อยึดให้แน่น แต่พอร์ตนี้มีความโดดเด่นในการจัดการทั้งเรื่องพลังงาน ข้อมูล และเสียงไว้ในที่เดียว มันถูกใช้ใน Motorola V60 หนึ่งในรุ่นที่โดดเด่นที่สุดของยุคโทรศัพท์ฝาพับ และยังเป็นพอร์ตที่ใช้ใน Motorola ROKR E1 ซึ่งเป็นโทรศัพท์รุ่นแรกที่รองรับ iTunes อีกด้วย", "ต่อมาเมื่อโทรศัพท์เริ่มมีขนาดบางลงอย่างเช่น Razr V3 ผู้ผลิตจึงเปลี่ยนไปใช้ Mini-USB ทำให้พอร์ต CE Bus กลายเป็นของล้าสมัยไปในที่สุด การที่บริษัทอื่นๆ หันมาใช้ Mini-USB ยังช่วยลดต้นทุนได้มากกว่าการผลิตโซลูชันเฉพาะทางของแต่ละค่ายเพื่อใช้ในการถ่ายโอนข้อมูลหรือชาร์จอุปกรณ์", "พอร์ต Pop-Port ของ Nokia ถูกออกแบบมาเพื่อรองรับอุปกรณ์เสริมภายนอก ตั้งแต่หูฟังไปจนถึงสายถ่ายโอนข้อมูล ผู้ที่เป็นเจ้าของ Nokia 7210 ในปี 2002 คงจะจำพอร์ต 14-pin นี้ได้ดี ซึ่งรองรับทั้งอุปกรณ์เสริมกล้องและชุดติดตั้งในรถยนต์ อย่างไรก็ตามมันไม่ได้มีความแน่นหนามากนัก และคลิปพลาสติกมักจะเสื่อมสภาพตามกาลเวลา ทำให้การฟังเพลงกลายเป็นเรื่องน่าหงุดหงิด โดยเฉพาะเวลาที่คุณออกไปวิ่งจ็อกกิ้ง", "แม้ว่า Pop-Port จะสามารถใช้ชาร์จไฟได้ แต่โทรศัพท์ Nokia ในยุคนั้นมักจะพึ่งพาหัวชาร์จแบบเข็มกลมขนาด 2.0 มม. แยกต่างหากมากกว่า และเมื่อพอร์ต Mini-USB เริ่มแพร่หลาย Pop-Port ก็ค่อยๆ เลือนหายไปจากตลาด", "พอร์ตเชื่อมต่อที่เป็นกรรมสิทธิ์ของ Apple ปรากฏตัวครั้งแรกในปี 2003 บน iPod รุ่นที่ 3 พอร์ตที่มีลักษณะแบนและกว้างนี้ถูกนำไปใช้ใน iPhone และ iPad รุ่นแรกๆ รวมถึงระบบลำโพงอย่าง Bose SoundDock และ Apple iPod Hi-Fi พินจำนวนมากในพอร์ตนี้ช่วยให้รองรับมาตรฐาน FireWire ซึ่งเป็นมาตรฐานการชาร์จดั้งเดิมของ Apple ในช่วงแรก", "Apple ได้เปลี่ยนมาใช้พอร์ต Lightning แบบ 8-pin ที่มีขนาดเล็กลงและเสียบได้สองด้านในปี 2012 ซึ่งเป็นอีกหนึ่งมาตรฐานเฉพาะของค่ายที่ทำให้ผู้ใช้ Apple ไม่สามารถใช้ที่ชาร์จร่วมกับอุปกรณ์ Android ได้ พอร์ตเหล่านี้ยังมีชิปขนาดเล็กเพื่อควบคุมแรงดันไฟฟ้า ซึ่งช่วยให้บริษัทสามารถเก็บค่าธรรมเนียมลิขสิทธิ์จากผู้ผลิตอุปกรณ์เสริมภายนอกได้ จนกระทั่งในปี 2018 ที่ iPad Pro เปลี่ยนมาใช้ USB-C และตามมาด้วย iPhone 15 series ในปี 2023", "FastPort ที่ดูเทอะทะถูกออกแบบมาเพื่อรองรับการถ่ายโอนข้อมูล การชาร์จ และเอาต์พุตเสียง โดยปรากฏตัวครั้งแรกในปี 2005 บน Sony Ericsson K750i ด้วยตัวล็อกพลาสติกสองด้านที่ยึดเข้ากับรูบนตัวเครื่อง พอร์ต 12-pin ที่บอบบางนี้ชวนให้นึกถึงสกรูของพอร์ต VGA หากตัวล็อกหัก พอร์ตก็จะเสียบไม่ลงล็อก ซึ่งสร้างความลำบากอย่างมากให้กับผู้ใช้", "แม้จะมีข้อบกพร่อง แต่ความอเนกประสงค์ของ FastPort ก็เป็นทิศทางที่อุตสาหกรรมมือถือมุ่งไปเพื่อค้นหามาตรฐานสากล ก่อนจะถูกแทนที่ด้วยการรวมกันของ Micro-USB และช่องเสียบหูฟัง 3.5 มม. ในปี 2010 แม้ช่วงเวลา 5 ปีอาจดูไม่นานในโลกเทคโนโลยี แต่รูปทรงที่ไม่เหมือนใครของมันยังคงเป็นภาพจำที่โดดเด่นจนถึงทุกวันนี้", "HTC Dream ซึ่งเป็นโทรศัพท์ Android รุ่นแรกที่มีวางจำหน่ายในเชิงพาณิชย์ มาพร้อมกับพอร์ต ExtUSB (Extended USB) แบบ 11-pin ที่มีขนาดใหญ่ โดยสังเกตได้จากมุมที่ตัดเฉียง พอร์ตนี้รวมเอาพอร์ต Mini-USB 5-pin เข้ากับพินพิเศษที่ช่วยให้รองรับข้อมูล พลังงาน และเสียงได้ ซึ่งโชคดีที่นั่นหมายความว่าที่ชาร์จ Mini-USB ทั่วไปสามารถใช้งานร่วมกับพอร์ตนี้ได้", "พอร์ตนี้เป็นเอกสิทธิ์เฉพาะสำหรับอุปกรณ์ Android และ Windows Mobile รุ่นแรกๆ ของ HTC ก่อนที่จะเปลี่ยนไปใช้พอร์ต Micro-USB ในช่วงเวลาหนึ่ง โทรศัพท์ที่ใช้พอร์ตนี้ได้ตัดช่องเสียบหูฟัง 3.5 มม. ออกไปก่อนที่ Apple จะทำเช่นนั้นกับ iPhone เสียอีก ทำให้ผู้ใช้ต้องซื้ออะแดปเตอร์ ExtUSB เพื่อเชื่อมต่อหูฟังของตนเอง"], "link": "https://www.engadget.com/2315473/old-school-charging-ports-phones-used-before-usb-c/", "canonical_link": "https://www.engadget.com/2315473/old-school-charging-ports-phones-used-before-usb-c", "cover_image_url": "https://www.engadget.com/img/gallery/5-old-school-charging-ports-you-probably-forgot-phones-had-before-usb-c/l-intro-1794520920.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/5-old-school-charging-ports-you-probably-forgot-phones-had-before-usb-c/intro-1794520920.jpg", "https://www.engadget.com/img/gallery/5-old-school-charging-ports-you-probably-forgot-phones-had-before-usb-c/motorola-ce-bus-connector-1794520921.jpg", "https://www.engadget.com/img/gallery/5-old-school-charging-ports-you-probably-forgot-phones-had-before-usb-c/nokia-pop-port-1794520923.jpg", "https://www.engadget.com/img/gallery/5-old-school-charging-ports-you-probably-forgot-phones-had-before-usb-c/apple-30-pin-connector-1794520923.jpg", "https://www.engadget.com/img/gallery/5-old-school-charging-ports-you-probably-forgot-phones-had-before-usb-c/sony-ericsson-fastport-1794520927.jpg", "https://www.engadget.com/img/gallery/5-old-school-charging-ports-you-probably-forgot-phones-had-before-usb-c/htc-extusb-1794520928.jpg"], "videos": [], "review_score": "", "published_ts": 1794958200, "published_at": "2026-11-17T23:30:00Z", "published_th": "18 พ.ย. 2026 • 06:30 น.", "category_hint": "Gadgets"}, {"id": 1794957365301, "guid": "https://9to5google.com/?p=738338", "original_title": "Material 3 Expressive adds scrolling time picker, AI Studio upgrades Android app creation", "thai_title": "Google อัปเดต Material 3 Expressive เพิ่มตัวเลือกเวลาแบบเลื่อน พร้อมยกระดับการสร้างแอป Android บน Google AI Studio", "tag": "Gadgets", "sub_tag": "MOBILE", "bullet_points": ["Google ปรับโฉม Material 3 Expressive ด้วยดีไซน์ใหม่สำหรับตัวเลือกเวลา (Time Picker) ที่ดูทันสมัยและอ่านง่ายขึ้น", "เปิดตัวฟีเจอร์ 'Scroll Time Picker' ใหม่ ช่วยให้ผู้ใช้เลือกเวลาได้สะดวกผ่านการเลื่อนแนวตั้ง แทนการใช้แป้นพิมพ์หรือหน้าปัดนาฬิกา", "เพิ่มฟีเจอร์ตัวเลือกหน่วยวัดแบบเลื่อน (Scroll fields) สำหรับการตั้งค่าระยะทาง น้ำหนัก หรืออุณหภูมิในแอปพลิเคชัน", "Google AI Studio อัปเกรดเครื่องมือพัฒนาแอป Android ให้รองรับการเชื่อมต่อฐานข้อมูล Cloud Firestore, การเรียกใช้ Gemini API ที่ปลอดภัย และการเผยแพร่แอปสู่ Google Play ได้โดยตรง"], "full_paragraphs": ["Google ได้ทำการปรับโฉมส่วนประกอบตัวเลือกเวลา (Time Picker) ให้เป็นดีไซน์แบบ Material 3 Expressive พร้อมทั้งเพิ่มตัวเลือกการใช้งานแบบเลื่อน (Scrolling variant) เข้ามาใหม่ ในขณะเดียวกัน Google AI Studio ก็ได้ยกระดับประสบการณ์การพัฒนาแอปพลิเคชันบน Android ให้ดียิ่งขึ้นกว่าเดิม", "เมื่อเปรียบเทียบกับ Material 3 แบบเดิม ตัวเลือกเวลาทั้งแบบ Input และแบบหน้าปัด (Dial) ในเวอร์ชัน M3 Expressive ได้ตัดข้อความแนะนำ 'Select time' ที่มุมขวาบนออกไป โดยปุ่ม AM และ PM ได้รับการปรับปรุงทั้งในด้านรูปทรง สีสัน และการตอบสนองที่ดูโดดเด่นยิ่งขึ้น นอกจากนี้ ช่องแสดงชั่วโมงและนาที รวมถึงตัวเลือกแบบหน้าปัดยังได้รับการปรับปรุงให้มีความคมชัด (Contrast) ที่สูงขึ้นอีกด้วย", "การเปลี่ยนแปลงครั้งสำคัญในวันนี้คือการเพิ่ม 'Scroll time picker' เข้ามา ซึ่งแทนที่จะต้องใช้แป้นพิมพ ve-scrolling-time-picker/", "canonical_link": "https://9to5google.com/2026/11/17/material-3-expressive-scrolling-time-picker", "cover_image_url": "https://9to5google.com/wp-content/uploads/sites/4/2026/11/scroll-time-picker-cover.png?w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794956631, "published_at": "2026-11-17T23:03:51Z", "published_th": "18 พ.ย. 2026 • 06:03 น.", "category_hint": "Gadgets"}, {"id": 1794957365303, "guid": "https://www.engadget.com/2320023/kalshi-ordered-to-stop-letting-people-bet-on-trump-speeches", "original_title": "CFTC tells Kalshi to stop letting people bet on Trump's speeches", "thai_title": "CFTC สั่ง Kalshi ระงับการเปิดให้เดิมพันคำพูดของ Donald Trump", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["คณะกรรมาธิการการซื้อขายสัญญาล่วงหน้าสินค้าโภคภัณฑ์ (CFTC) สั่งให้แพลตฟอร์ม Kalshi ยุติการเปิดตลาดเดิมพันที่เกี่ยวข้องกับคำพูดของประธานาธิบดี Donald Trump", "สัญญาที่ถูกสั่งระงับ ได้แก่ ซีรีส์ 'TRUMPSAY' และการเดิมพันว่า 'Trump จะพูดฉายาอะไรบ้างก่อนปี 2027'", "CFTC กังวลว่าตลาดลักษณะนี้มีความเสี่ยงสูงต่อการถูกปั่นราคา เนื่องจากผลลัพธ์ขึ้นอยู่กับพฤติกรรมของบุคคลที่อาจไม่สามารถตรวจสอบได้จากภายนอก", "Kalshi ยอมปฏิบัติตามคำสั่งของ CFTC แม้ว่า Tarek Mansour ซีอีโอของบริษัทจะแสดงความไม่เห็นด้วยก็ตาม", "เหตุการณ์นี้เกิดขึ้นท่ามกลางความขัดแย้งเรื่องจริยธรรมและการตรวจสอบความโปร่งใสในตลาดการทำนายผล (Prediction Markets)"], "full_paragraphs": ["เมื่อวันที่ 13 พฤศจิกายนที่ผ่านมา คณะกรรมาธิการการซื้อขายสัญญาล่วงหน้าสินค้าโภคภัณฑ์ของสหรัฐฯ (CFTC) ได้ออกคำสั่งให้ Kalshi แพลตฟอร์มตลาดการทำนายผล (Prediction Market) ระงับการเปิดตลาดที่เกี่ยวข้องกับประธานาธิบดี Donald Trump โดยสัญญาที่เป็นประเด็นคือซีรีส์ 'TRUMPSAY' และสัญญาที่มีชื่อว่า 'What nicknames will Trump say before 2027?' ซึ่งสัญญาประเภทนี้เปิดโอกาสให้ผู้ใช้งานสามารถวางเดิมพันได้ว่าประธานาธิบดีจะพูดคำเฉพาะเจาะจงใดๆ ภายในกรอบเวลาที่กำหนดหรือไม่", "ทาง CFTC ต้องการเริ่มกระบวนการเพื่อพิจารณาว่า 'การรับรองของ Kalshi ที่ระบุว่าสัญญาเหล่านี้เป็นไปตามพระราชบัญญัติการแลกเปลี่ยนสินค้าโภคภัณฑ์และกฎระเบียบของคณะกรรมาธิการนั้นเป็นเท็จหรือไม่' ทั้งนี้ ทางแพลตฟอร์ม Kalshi ได้ปฏิบัติตามคำสั่งดังกล่าวแล้ว แม้ว่า Tarek Mansour ซีอีโอของ Kalshi จะกล่าวว่าเขาไม่เห็นด้วยกับการระงับการเดิมพันเหล่านี้ก็ตาม", "ก่อนหน้านี้ในเดือนกันยายน หน่วยงานได้ออกคำแนะนำสำหรับเจ้าหน้าที่เกี่ยวกับตลาดการทำนายผลเหล่านี้ โดยระบุว่าตลาดดังกล่าว 'มีความเสี่ยงสูงต่อการถูกปั่นราคา เนื่องจากผลลัพธ์ของการตัดสินขึ้นอยู่กับพฤติกรรมเฉพาะของบุคคล ซึ่งอาจไม่ได้เกิดขึ้นอย่างอิสระและไม่สามารถตรวจสอบได้จากภายนอก'", "ตลาดการเดิมพันที่เกี่ยวข้องกับสุนทรพจน์ของประธานาธิบดี รวมถึงความเชื่อมโยงที่เป็นไปได้ระหว่างตลาดการทำนายผลกับรัฐบาลชุดปัจจุบัน ได้ก่อให้เกิดข้อถกเถียงอย่างกว้างขวาง โดยในช่วงฤดูร้อนที่ผ่านมา Gabriel Perez เจ้าหน้าที่ควบคุมเครื่องอ่านบท (Teleprompter) ของทำเนียบขาว ถูกสั่งพักงานหลังจากมีรายงานว่าเขาทำเงินได้มากกว่า 100,000 ดอลลาร์จากการเดิมพันในสิ่งที่ Trump จะพูด ในเวลานั้น CFTC ระบุว่ายินดีที่จะประนีประนอมกับ Perez หากเขาส่งคืนเงินจำนวนดังกล่าว นอกจากนี้ Kalshi ยังได้ยุติความร่วมมือกับ Donald Trump Jr ในฐานะที่ปรึกษาที่ได้รับค่าตอบแทน โดยระบุว่าเป็นการตัดสินใจร่วมกันหลังจากที่บริษัทการลงทุนของ Trump Jr ได้เพิ่มเงินทุนให้กับ Polymarket ซึ่งเป็นคู่แข่งของ Kalshi", "ที่ผ่านมา CFTC มักจะใช้แนวทางที่ผ่อนปรนในการกำกับดูแลตลาดการทำนายผล แม้ว่าหน่วยงานจะมีความเข้มงวดในการยืนยันสิทธิ์ทางกฎหมายเพื่อเป็นผู้กำกับดูแลเพียงรายเดียวของธุรกิจเหล่านี้ โดยที่ผ่านมา CFTC ได้ฟ้องร้องหลายรัฐที่พยายามนำตลาดการทำนายผลเข้าสู่กระบวนการศาล โดยกล่าวหาว่าตลาดเหล่านี้เข้าข่ายการพนันที่ผิดกฎหมาย"], "link": "https://www.engadget.com/2320023/kalshi-ordered-to-stop-letting-people-bet-on-trump-speeches/", "canonical_link": "https://www.engadget.com/2320023/kalshi-ordered-to-stop-letting-people-bet-on-trump-speeches", "cover_image_url": "https://www.engadget.com/img/gallery/cftc-tells-kalshi-to-stop-letting-people-bet-on-trumps-speeches/l-intro-1794956305.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/cftc-tells-kalshi-to-stop-letting-people-bet-on-trumps-speeches/intro-1794956305.jpg"], "videos": [], "review_score": "", "published_ts": 1794956406, "published_at": "2026-11-17T23:00:06Z", "published_th": "18 พ.ย. 2026 • 06:00 น.", "category_hint": "Gadgets"}, {"id": 1794957365305, "guid": "https://www.engadget.com/2315411/risks-using-old-damaged-charging-cables", "original_title": "The dangers of using your old, damaged charging cables", "thai_title": "อย่าเสี่ยง! อันตรายจากการใช้สายชาร์จเก่าและชำรุดที่อาจทำลายอุปกรณ์หรือก่อให้เกิดไฟไหม้", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["สายชาร์จที่ชำรุดจะมีความต้านทานไฟฟ้าสูงขึ้น ทำให้เกิดความร้อนสะสมจนอาจละลายหรือลุกไหม้ได้", "การดึงสายชาร์จด้วยการกระชากที่ตัวสายทำให้เส้นลวดโลหะภายในเสียหาย แม้ภายนอกจะดูปกติ", "ความเสียหายจากสายชาร์จอาจส่งผลกระทบต่อแบตเตอรี่ พอร์ต USB ของอุปกรณ์ หรือทำให้เกิดไฟฟ้าช็อตได้", "การใช้เทปพันสายไฟเป็นเพียงวิธีแก้ปัญหาชั่วคราวเท่านั้น ไม่ใช่การซ่อมแซมที่ปลอดภัยในระยะยาว", "ควรเปลี่ยนสายชาร์จใหม่ทันทีเมื่อพบสัญญาณความผิดปกติ เพื่อป้องกันความเสียหายที่อาจมีมูลค่าสูงกว่าค่าสายชาร์จหลายเท่า"], "full_paragraphs": ["อย่าปล่อยให้สายชาร์จราคาไม่กี่ร้อยบาทกลายเป็นต้นเหตุของความเสียหายหลักพัน หรือนำไปสู่ค่ารักษาพยาบาลและเหตุไฟไหม้ที่คาดไม่ถึง สายชาร์จมีหน้าที่สำคัญสองประการคือ การชาร์จพลังงานให้กับอุปกรณ์ของคุณ และต้องทำหน้าที่นั้นโดยไม่ก่อให้เกิดความเสียหายต่อตัวคุณหรือตัวอุปกรณ์ อย่างไรก็ตาม คุณไม่สามารถคาดหวังให้สายชาร์จใช้งานได้ตลอดไป เพราะหลังจากผ่านการเสียบและถอดนับครั้งไม่ถ้วน สายชาร์จย่อมเสื่อมสภาพ บิดงอ แตกหัก หรือฉีกขาด ซึ่งผลลัพธ์สุดท้ายคือสายชาร์จที่ไม่ปลอดภัยและจำเป็นต้องเปลี่ยนใหม่", "หากคุณไม่เปลี่ยนสายชาร์จที่ชำรุด คุณกำลังเสี่ยงต่อการทำให้อุปกรณ์เสียหายหรือเสี่ยงต่อการถูกไฟลวกทุกครั้งที่ใช้งาน เพื่อแลกกับเงินเพียงไม่กี่ดอลลาร์ การซื้อสายใหม่ย่อมคุ้มค่ากว่าการฝืนใช้สายชาร์จที่ควรถูกนำไปรีไซเคิลมานานแล้ว", "การดึงสายชาร์จออกโดยการกระชากที่ตัวสายจะทำให้เกิดแรงดึงที่จุดเชื่อมต่อหลังหัวปลั๊ก และคุณมักจะบิดงอสายในจุดเดิมซ้ำๆ โดยเฉพาะบริเวณปลายทั้งสองด้าน ซึ่งจะทำให้เส้นลวดโลหะขนาดเล็กภายในสึกหรอลงก่อนที่จะมีสัญญาณความเสียหายปรากฏให้เห็นที่เปลือกนอก", "สิ่งที่น่าสนใจคือ แม้สายชาร์จจะเสียหายจากภายใน แต่มันก็ยังสามารถใช้งานได้ แม้ว่าการเชื่อมต่ออาจจะติดๆ ดับๆ ก็ตาม หรือแม้แต่ในกรณีที่เห็นความเสียหายทางกายภาพชัดเจน สายก็อาจจะยังคงจ่ายไฟได้อยู่ เพราะเส้นลวดที่เหลืออยู่ยังคงทำหน้าที่นำกระแสไฟได้", "ปัญหาของเรื่องนี้คือหลักฟิสิกส์ล้วนๆ เมื่อมีเส้นลวดที่สมบูรณ์น้อยลงในการนำกระแสไฟ คุณจะพบกับความต้านทานไฟฟ้าที่เพิ่มขึ้น พลังงานจะเปลี่ยนเป็นความร้อนมากขึ้นในขณะที่กระแสไฟไหลผ่าน โดยความร้อนจะกระจุกตัวอยู่ในพื้นที่ขนาดเล็ก นี่คือจุดที่สายชาร์จที่ชำรุดเริ่มเกิดความร้อนสูงเกินไป โดยเฉพาะเมื่อต้องรองรับกระแสไฟที่สูงขึ้นสำหรับการชาร์จเร็ว (Fast Charging)", "คุณอาจมีหัวชาร์จที่มีฟีเจอร์ความปลอดภัยเพื่อป้องกันความร้อนสูงเกินหรือไฟฟ้าลัดวงจร แต่คุณไม่สามารถพึ่งพาสิ่งเหล่านี้ได้เสมอไป เพราะจุดเชื่อมต่อที่เสียหายยังคงร้อนขึ้นได้แม้กระแสไฟที่ไหลผ่านจะอยู่ในขีดจำกัดความปลอดภัย ซึ่งคุณอาจได้รับคำเตือนบนสมาร์ทโฟนหากอุปกรณ์ของคุณมีฟังก์ชันดังกล่าว", "อันตรายที่เกิดขึ้นทันทีคือการถูกไฟลวกหรือไฟฟ้าช็อต ความร้อนจะกระจุกตัวอยู่รอบๆ หัวเชื่อมต่อที่เสียหาย ทำให้มันร้อนจนสามารถลวกนิ้วมือและละลายพลาสติกที่หุ้มอยู่ได้ แม้ว่าคณะกรรมการความปลอดภัยสินค้าอุปโภคบริโภคของสหรัฐฯ (US Consumer Product Safety Commission) จะเคยเรียกคืนสายชาร์จที่ผลิตไม่ได้มาตรฐาน เช่น สาย Lightning ของ heyday ที่วางจำหน่ายใน Target เมื่อปี 2019 แต่สายชาร์จของคุณอาจเสียหายจากการใช้งานหนักเกินไปก็ได้ นอกจากนี้ แม้จะเป็นสายชาร์จที่ดี การชาร์จอุปกรณ์ไว้ใต้หมอนหรือผ้าห่มก็ไม่ใช่ความคิดที่ดี เพราะจะเป็นการกักเก็บความร้อน", "ปัญหาที่อาจเกิดขึ้นรวมถึงการทำลายแบตเตอรี่ของอุปกรณ์หรือลดอายุการใช้งานในระยะยาวจากกระแสไฟที่ไม่สม่ำเสมอ นอกจากนี้ สัญญาณไฟฟ้าที่ผิดปกติยังอาจทำให้พอร์ต USB ของอุปกรณ์พังได้ และยังมีความเสี่ยงต่อการถูกไฟฟ้าช็อตหากคุณใช้สายที่ฉีกขาด แม้สาย USB จะเป็นแรงดันไฟฟ้าต่ำ แต่ก็ไม่ควรเสี่ยง นอกจากนี้ความเสี่ยงจากไฟฟ้าช็อตอาจเพิ่มขึ้นหากสายเชื่อมต่อกับอะแดปเตอร์ หรือตัวอะแดปเตอร์เองได้รับความเสียหาย รวมถึงความชื้นที่เพิ่มความเสี่ยงเข้าไปอีก", "สถานการณ์ที่เลวร้ายที่สุดคือการเกิดไฟไหม้ ผมไม่ได้หมายความว่าสาย USB ที่ฉีกขาดทุกเส้นจะนำไปสู่ไฟไหม้ แต่ก็มีความเป็นไปได้ หั ระบบปฏิบัติการ iOS เริ่มเห็นตัวเลือกในการใช้บริการสำรองข้อมูลของ WhatsApp เอง ซึ่งถือเป็นทางเลือกใหม่นอกเหนือจากการสำรองข้อมูลผ่าน iCloud ของ Apple ตามที่เคยมีรายงานจาก WABetaInfo เมื่อไม่กี่เดือนก่อนหน้านี้", "ในขณะนั้น ฟีเจอร์ดังกล่าวยังไม่เปิดให้ใช้งานแม้แต่ในกลุ่มผู้ทดสอบเบต้า แต่รายงานจาก WABetaInfo ได้ให้รายละเอียดการทำงานไว้ว่า จะมีการมอบพื้นที่จัดเก็บข้อมูลฟรีให้ 2GB พร้อมแผนบริการแบบชำระเงินสำหรับผู้ที่ต้องการพื้นที่มากขึ้น และที่สำคัญคือการบังคับใช้การเข้ารหัสข้อมูลแบบ End-to-end encryption สำหรับข้อมูลที่สำรองไว้บนเซิร์ฟเวอร์ของ WhatsApp", "ล่าสุดมีการรายงานว่า ผู้ใช้ WhatsApp บางส่วนที่ใช้งาน TestFlight build เวอร์ชันล่าสุด เริ่มเห็นตัวเลือกในการเปลี่ยนจากการสำรองข้อมูลผ่าน iCloud มาเป็นบริการของ WhatsApp เองแล้ว ซึ่งบ่งชี้ว่าฟีเจอร์นี้อาจถูกปล่อยให้ใช้งานในวงกว้างในเร็วๆ นี้", "รายงานระบุว่า ผู้ใช้สามารถเปลี่ยนไปใช้ระบบจัดเก็บข้อมูลบนคลาวด์ของ WhatsApp ได้จากหน้าจอสำรองข้อมูลแชท (Chat backup screen) โดยผู้ใช้จะต้องเลือกผู้ให้บริการสำรองข้อมูลที่ต้องการ หากเลือก WhatsApp จะต้องทำการรักษาความปลอดภัยด้วยการเข้ารหัสแบบ End-to-end encryption ซึ่งเป็นขั้นตอนบังคับที่ไม่สามารถข้ามได้ โดยผู้ใช้สามารถเลือกวิธีการเข้ารหัสได้ เช่น การใช้รหัสผ่าน 64 หลัก หรือเลือกใช้ Passkey ซึ่งเป็นวิธีที่ WhatsApp แนะนำเป็นค่าเริ่มต้น หลังจากตั้งค่าเสร็จสิ้น ข้อมูลแชทจะถูกสำรองไว้บนเซิร์ฟเวอร์ของ WhatsApp โดยทางบริษัทจะเก็บข้อมูลไว้เป็นเวลา 4 เดือนหลังจากที่การสมัครสมาชิกสิ้นสุดลง หากผู้ใช้ไม่ต่ออายุ WhatsApp จะทำการลบข้อมูลสำรองนั้นอย่างถาวร", "ประเด็นสำคัญที่ควรทราบคือ ข้อมูลที่สำรองไว้บนเซิร์ฟเวอร์ของ WhatsApp ในขณะนี้ยังไม่สามารถนำไปใช้เพื่อกู้คืนแชทข้ามแพลตฟอร์มได้ หมายความว่าผู้ที่เปลี่ยนจาก iPhone ไปใช้ Android หรือในทางกลับกัน ยังคงต้องพึ่งพาฟีเจอร์โอนย้ายแชท (Chat transfer) ที่มีอยู่ภายในแอปพลิเคชันตามเดิม", "จากภาพหน้าจอที่ปรากฏในรายงาน WhatsApp ยืนยันว่าผู้ใช้จะได้รับพื้นที่จัดเก็บข้อมูลบนคลาวด์ฟรี 2GB ในขณะที่สมาชิก WhatsApp Plus จะได้รับพื้นที่สูงสุดถึง 100GB นอกจากนี้ WABetaInfo ยังเสริมว่าสมาชิก Meta One จะได้รับพื้นที่สูงสุดถึง 4TB ขึ้นอยู่กับแผนที่เลือกใช้งาน", " ว่าจะยังคงให้บริการบนถนนทั่วไปต่อไป และต้องพิสูจน์ให้ DMV เห็นว่าได้แก้ไขข้อบกพร่องต่างๆ อย่างมีประสิทธิภาพก่อนจะกลับมาให้บริการบนทางด่วนได้อีกครั้ง"], "full_paragraphs": ["กรมการขนส่งทางบกแห่งรัฐแคลิฟอร์เนีย (DMV) ได้ออกคำสั่งห้ามไม่ให้ Waymo ให้บริการรถแท็กซี่ไร้คนขับ (Robotaxis) บนทางด่วนของรัฐ โดยระบุในแถลงการณ์ที่ส่งถึง Engadget ว่าการดำเนินงานแบบไร้คนขับของบริษัทถือเป็น 'อันตรายที่อาจเกิดขึ้นต่อความปลอดภัยสาธารณะ' โดยข้อจำกัดนี้มีผลบังคับใช้ตั้งแต่วันที่ 11 พฤศจิกายนที่ผ่านมา ตามข้อมูลจาก DMV ซึ่งในส่วนของ Waymo ได้ตอบสนองต่อคำสั่งดังกล่าวด้วยการระงับการขับขี่บนทางด่วนในทุกตลาดที่ให้บริการทั่วสหรัฐอเมริกาเป็นการชั่วคราว", "ทาง DMV ได้อ้างถึงเหตุการณ์ที่รถแท็กซี่ไร้คนขับของ Waymo จำนวน 3 คันขับเข้าไปในเขตพื้นที่ก่อสร้างที่จำกัดใกล้กับ Burlingame และอีกเหตุการณ์หนึ่งที่รถ Waymo พยายามแซงรถของเจ้าหน้าที่ตำรวจทางหลวงแคลิฟอร์เนีย (California Highway Patrol) ซึ่งกำลังชะลอการจราจรอยู่ โดยเหตุการณ์เหล่านี้เป็นส่วนหนึ่งของเหตุผลที่นำไปสู่การตัดสินใจดังกล่าว นอกจากนี้ ในอดีตเคยมีกรณีที่รถ Waymo พยายามขับผ่านพื้นที่ก่อสร้างบนทางด่วน ซึ่งเป็นเหตุผลที่ทำให้ Waymo เคยระงับบริการบนทางด่วนด้วยความสมัครใจเมื่อเดือนพฤษภาคม และต่อมาได้มีการเรียกคืนรถยนต์จำนวน 3,800 คันในเดือนมิถุนายน แม้ว่าบริษัทจะเริ่มกลับมาให้บริการบนทางหลวงอีกครั้งในเดือนกรกฎาคม แต่ดูเหมือนว่าการแก้ไขปัญหาที่ผ่านมาจะยังไม่สามารถจัดการกับปัญหาดังกล่าวได้อย่างเบ็ดเสร็จ", "Waymo ได้ระบุในแถลงการณ์ถึง Engadget ว่า 'ความปลอดภัยคือรากฐานของทุกสิ่งที่เราทำ หลังจากเหตุการณ์ที่เกิดขึ้นในเขตพื้นที่ก่อสร้างบนทางด่วน U.S. 101 ในรัฐแคลิฟอร์เนียเมื่อเร็วๆ นี้ ซึ่งไม่มีผู้ได้รับบาดเจ็บหรือเกิดการชนกัน ทาง DMV ของแคลิฟอร์เนียได้ใช้มาตรการจำกัดการดำเนินงานบนทางด่วนในรัฐดังกล่าว เพื่อให้สอดคล้องกับหลักการความปลอดภัยที่ต้องมาก่อน เราจึงได้ระงับการดำเนินงานบนทางด่วนในตลาดอื่นๆ ที่เราให้บริการอยู่เป็นการชั่วคราวด้วย เพื่อประเมินประสิทธิภาพการทำงานของเรา'", "ในรัฐอย่างแคลิฟอร์เนีย การสูญเสียสิทธิ์ในการเข้าถึงทางด่วนอาจส่งผลกระทบอย่างมีนัยสำคัญต่อเส้นทางที่รถแท็กซี่ไร้คนขับสามารถใช้ได้ รวมถึงระยะเวลาในการเดินทางและค่าใช้จ่ายในการใช้บริการ Waymo เมื่อเทียบกับบริการคู่แข่งอย่าง Lyft หรือ Uber โดย Waymo จะต้องพิสูจน์ให้ DMV เห็นว่าบริษัทได้ 'ดำเนินการแก้ไขอย่างมีประสิทธิภาพเพื่อจัดการกับข้อบกพร่องที่เป็นต้นเหตุของข้อจำกัดเหล่านี้' ก่อนที่คำสั่งห้ามใช้ทางด่วนจะถูกยกเลิก", "ทั้งนี้ บริษัทระบุว่าจะยังคงให้บริการบนถนนทั่วไป (Surface streets) ต่อไปในระหว่างที่ทำงานร่วมกับหน่วยงานกำกับดูแล นอกจากนี้ Waymo อาจพิจารณาทดสอบการขับขี่บนทางด่วนโดยใช้รถที่มีคนขับเพื่อความปลอดภัย (Human safety drivers) ในพื้นที่นอกรัฐแคลิฟอร์เนีย โดย Waymo เริ่มให้บริการรถแท็กซี่ไร้คนขับบนทางด่วนในแคลิฟอร์เนียเมื่อเดือนพฤศจิกายน 2025 และได้ขยายพื้นที่ให้บริการครอบคลุมทั้ง Sacramento, Bay Area และ San Diego ในเดือนสิงหาคม 2026"], "link": "https://www.engadget.com/2319947/waymo-is-pausing-all-freeway-rides-after-california-dmv-says-the-robotaxis-are-imminent-hazard-to-public-safety/", "canonical_link": "https://www.engadget.com/2319947/waymo-is-pausing-all-freeway-rides-after-california-dmv-says-the-robotaxis-are-imminent-hazard-to-public-safety", "cover_image_url": "https://www.engadget.com/img/gallery/waymo-is-pausing-all-freeway-rides-after-california-dmv-says-the-robotaxis-are-imminent-hazard-to-public-safety/l-intro-1794952210.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/waymo-is-pausing-all-freeway-rides-after-california-dmv-says-the-robotaxis-are-imminent-hazard-to-public-safety/intro-1794952210.jpg"], "videos": ["https://www.youtube.com/embed/PT2wtolCEg8"], "review_score": "", "published_ts": 1794952669, "published_at": "2026-11-17T21:57:49Z", "published_th": "18 พ.ย. 2026 • 04:57 น.", "category_hint": "Gadgets"}, {"id": 1794959241515, "guid": "https://gizmodo.com/?p=2000841324", "original_title": "Waymos Banned on the Freeway in California After Multiple Incidents", "thai_title": "California DMV สั่งระงับ Waymo วิ่งบนทางด่วน หลังพบเหตุการณ์ไม่ปลอดภัยซ้ำซาก", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["California DMV ออกคำสั่งระงับการให้บริการรถยนต์ไร้คนขับของ Waymo บนทางหลวงในรัฐแคลิฟอร์เนีย", "หน่วยงานกำกับดูแลระบุว่าการดำเนินงานของ Waymo บนทางด่วนถือเป็น 'ภัยคุกคามที่ใกล้จะเกิดขึ้นต่อความปลอดภัยสาธารณะ'", "การตัดสินใจครั้งนี้มีขึ้นหลังจากเกิดเหตุการณ์ผิดปกติหลายครั้งที่เกี่ยวข้องกับระบบขับเคลื่อนอัตโนมัติของบริษัท", "Waymo ต้องเผชิญกับแรงกดดันที่เพิ่มขึ้นจากหน่วยงานรัฐในการพิสูจน์ความปลอดภัยของเทคโนโลยีไร้คนขับก่อนจะได้รับอนุญาตให้กลับมาวิ่งบนทางด่วนอีกครั้ง"], "full_paragraphs": ["หน่วยงานกำกับดูแลด้านยานยนต์ของรัฐแคลิฟอร์เนีย หรือ California DMV ได้ออกมาตรการขั้นเด็ดขาดด้วยการสั่งระงับการให้บริการรถยนต์ไร้คนขับของ Waymo บนทางหลวง (Freeway) ทั่วรัฐแคลิฟอร์เนีย หลังจากพบว่าการดำเนินงานของบริษัทส่งผลกระทบต่อความปลอดภัยของผู้ใช้ถนนอย่างมีนัยสำคัญ", "ในแถลงการณ์อย่างเป็นทางการ California DMV ได้ระบุถึงเหตุผลสำคัญของการตัดสินใจครั้งนี้ว่า การที่รถยนต์ไร้คนขับของ Waymo ยังคงวิ่งให้บริการบนทางด่วนนั้นถือเป็น 'ภัยคุกคามที่ใกล้จะเกิดขึ้นต่อความปลอดภัยสาธารณะ' (an imminent hazard to public safety) ซึ่งเป็นคำนิยามที่สะท้อนถึงความกังวลอย่างหนักของหน่วยงานรัฐต่อเทคโนโลยีนี้", "การตัดสินใจดังกล่าวไม่ได้เกิดขึ้นโดยไม่มีที่มาที่ไป แต่เป็นผลสืบเนื่องมาจากรายงานเหตุการณ์ผิดปกติหลายครั้งที่เกี่ยวข้องกับระบบขับเคลื่อนอัตโนมัติของ Waymo ในช่วงที่ผ่านมา ซึ่งเหตุการณ์เหล่านี้สร้างความกังวลให้กับเจ้าหน้าที่รัฐว่าซอฟต์แวร์และระบบเซนเซอร์ของรถยนต์อาจยังไม่พร้อมสำหรับการรับมือกับสภาพการจราจรที่ซับซ้อนและมีความเร็วสูงบนทางด่วน", "แม้ว่า Waymo จะพยายามผลักดันเทคโนโลยีไร้คนขับให้เป็นมาตรฐานใหม่ของการเดินทาง แต่เหตุการณ์ที่เกิดขึ้นในแคลิฟอร์เนียถือเป็นอุปสรรคสำคัญที่ทำให้บริษัทต้องกลับมาทบทวนมาตรฐานความปลอดภัยของตนเองอีกครั้ง โดยทาง DMV ยืนยันว่าความปลอดภัยของประชาชนต้องมาก่อนนวัตกรรมเสมอ", "ในขณะนี้ Waymo ยังคงต้องทำงานร่วมกับหน่วยงานกำกับดูแลอย่างใกล้ชิดเพื่อตรวจสอบหาสาเหตุของปัญหาที่เกิดขึ้น และต้องพิสูจน์ให้เห็นว่าระบบของพวกเขามีความเสถียรและปลอดภัยเพียงพอที่จะกลับมาให้บริการบนทางด่วนได้อีกครั้ง ซึ่งถือเป็นบททดสอบครั้งใหญ่ของบริษัทในอุตสาหกรรมรถยนต์ไร้คนขับ"], "link": "https://gizmodo.com/waymos-banned-on-the-freeway-in-california-after-multiple-incidents-2000841324", "c ช่วงต้นปีที่ผ่านมา ล่าสุด YouTube ได้ประกาศเปิดตัวฟีเจอร์ใหม่ที่เรียกว่า 'Co-Views' ซึ่งเป็นวิธีการที่แพลตฟอร์มใช้เพื่อคาดการณ์จำนวนผู้คนที่กำลังรับชมวิดีโอ YouTube บนหน้าจอทีวี โดยยอดวิวที่ประมาณการได้นี้จะถูกนำไปรวมเข้ากับยอดวิวรวมของวิดีโอนั้นๆ ด้วย", "ปัจจุบันยอดวิวบน YouTube ยังคงอยู่ในช่วงปรับตัวจากการเปลี่ยนแปลงเมื่อต้นปีที่ YouTube เริ่มนับยอดวิวทันทีที่เฟรมแรกของวิดีโอเล่น แต่ถึงอย่างนั้น YouTube ก็ยังคงนับเพียงหนึ่งวิวต่อการเล่นวิดีโอหนึ่งครั้งเท่านั้น อย่างไรก็ตาม YouTube ระบุว่าในขณะนี้อาจมีการนับยอดวิวเพิ่มขึ้นด้วยระบบ 'Co-Views' ใหม่สำหรับการรับชมผ่านทีวี", "ในประกาศอย่างเป็นทางการ YouTube อธิบายว่า 'Co-Views' จะรวม 'จำนวนประมาณการของผู้คนที่รับชมร่วมกันบนทีวี' เข้าไปในยอดวิวรวมของวิดีโอ โดยฟีเจอร์นี้จะมีผลเฉพาะกับการรับชมผ่านทีวีเท่านั้น ส่วนการรับชมผ่านอุปกรณ์มือถือหรือเดสก์ท็อปจะยังคงนับเป็นหนึ่งวิวต่อการเล่นหนึ่งครั้งเช่นเดิม ทั้งนี้ ฟีเจอร์ดังกล่าวครอบคลุมทั้งวิดีโอแบบยาว (Long-form), YouTube Shorts และวิดีโอไลฟ์สด โดยจะมีผลเฉพาะกับข้อมูลในอนาคตเท่านั้น ไม่มีการย้อนกลับไปแก้ไขข้อมูลในอดีต", "YouTube ระบุว่าการเปลี่ยนแปลงนี้ทำขึ้นเพื่อสะท้อนให้เห็นถึง 'ชั่วโมงการรับชมกว่า 1 พันล้านชั่วโมง' ที่เกิดขึ้นบน YouTube ผ่านหน้าจอทีวีในแต่ละวัน โดยข้อมูลที่เพิ่มเข้ามานี้จะช่วยให้ครีเอเตอร์สามารถวางกลยุทธ์ช่องหรือนำเสนอข้อมูลต่อแบรนด์ได้ดียิ่งขึ้น พร้อมทั้งให้ 'ภาพรวมที่สมบูรณ์ยิ่งขึ้นว่าผู้ชมมีส่วนร่วมกับเนื้อหาอย่างไร' ซึ่งสอดคล้องกับมาตรฐานอุตสาหกรรมทีวี รวมถึงวิธีการที่เครือข่ายการออกอากาศและสตรีมมิ่งแบบดั้งเดิมใช้ประมาณการจำนวนผู้คนที่รับชมเนื้อหา อย่างไรก็ตาม ยอดวิวจาก Co-Views จะไม่ถูกนำไปนับรวมในรายได้ของแพลตฟอร์ม เนื่องจากไม่ใช่ 'Qualified Views' หรือยอดวิวที่ผ่านเกณฑ์การสร้างรายได้", "สำหรับคำถามที่ว่า YouTube ใช้วิธีใดในการคำนวณยอดวิวเหล่านี้? แม้คำว่า 'การคาดเดา' อาจดูไม่ถูกต้องนัก แต่ Google ยืนยันว่าไม่ได้มีการใช้กล้องหรือไมโครโฟนแต่อย่างใด แต่เป็นการใช้ 'โมเดลทางสถิติ' แทน", "YouTube ระบุว่า 'YouTube ไม่ได้ใช้การเข้าถึงอุปกรณ์ กล้อง ไมโครโฟน หรือสิ่งอื่นใดในลักษณะนั้น โดย Co-views จะถูกประมาณการโดยใช้โมเดลทางสถิติที่ปลอดภัยต่อความเป็นส่วนตัว ซ เด็ดๆ จากศิลปินระดับตำนานที่คุณอาจจะชื่นชอบ", "แม้ว่าแท็บดังกล่าวจะถูกนำออกจากแถบนำทางหลักไปแล้ว แต่ฟีเจอร์ Samples ยังคงสามารถเข้าถึงได้ผ่านหน้าเพลย์ลิสต์ หน้าศิลปิน และหน้าอัลบั้ม โดยจะปรากฏอยู่ที่มุมขวาบนของหน้าจอ เพื่อให้ผู้ใช้งานได้รับประสบการณ์การฟังเพลงที่เน้นเนื้อหาเฉพาะเจาะจงมากขึ้น", "การเปลี่ยนแปลงในฝั่งเซิร์ฟเวอร์ (Server-side change) นี้ได้ทยอยปล่อยอัปเดตให้ผู้ใช้งานในช่วงหลายสัปดาห์ที่ผ่านมา และในขณะนี้เริ่มมีการใช้งานอย่างแพร่หลายมากขึ้น สำหรับผู้ใช้งานแบบฟรี (Free users) แท็บ 'Upgrade' จะยังคงปรากฏเป็นแท็บที่สี่ในแถบเมนูหลักเช่นเดิม", "ในขณะเดียวกัน YouTube Music ได้ปรับเปลี่ยนดีไซน์ของปุ่มกดในหน้าอัลบั้มและหน้าเพลย์ลิสต์ โดยย้ายปุ่ม Play ไปไว้ทางด้านขวา ส่วนปุ่มดาวน์โหลด (Download), เพิ่มเข้าคลัง (Add to library) และคอมเมนต์ (Comments) จะถูกจัดกลุ่มรวมกันไว้ทางด้านซ้ายแทน", "สำหรับการอัปเดตในอนาคต YouTube ได้ประกาศเมื่อเดือนกันยายนที่ผ่านมาว่า ฟีเจอร์ 'Ask Music' จะสามารถเข้าถึงได้จากมุมขวาบนของหน้าจอ โดยไอคอนประกายไฟของ Gemini นี้กำลังทยอยเปิดให้ผู้ใช้งานได้เริ่มใช้งานกันแล้ว"], "link": "https://9to5google.com/2026/11/17/youtube-music-no-samples-tab/", "canonical_link": "https://9to5google.com/2026/11/17/youtube-music-no-samples-tab", "cover_image_url": "https://9to5google.com/wp-content/uploads/sites/4/2026/09/YouTube-Music-on-Pixel-11-Pro.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794949400, "published_at": "2026-11-17T21:03:20Z", "published_th": "18 พ.ย. 2026 • 04:03 น.", "category_hint": "Gadgets"}, {"id": 1794950143970, "guid": "https://www.engadget.com/2315403/chance-xbox-series-x-plugged-into-wrong-hdmi-port", "original_title": "There's a chance your Xbox Series X is plugged into the wrong HDMI port", "thai_title": "เช็กให้ชัวร์! คุณอาจกำลังเสียบสาย Xbox Series X ผิดช่อง HDMI อยู่ก็ได้", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["ไม่ใช่ทุกพอร์ต HDMI บนทีวีจะรองรับมาตรฐาน 2.1 ซึ่งจำเป็นสำหรับการเล่นเกมที่ความละเอียด 4K/120fps และฟีเจอร์ VRR", "ควรตรวจสอบคู่มือทีวีหรือฉลากด้านหลังเครื่อง เพื่อหาพอร์ตที่รองรับ HDMI 2.1 โดยเฉพาะในทีวีรุ่นเก่าหรือรุ่นระดับกลาง", "สาย HDMI ที่แถมมาในกล่อง Xbox Series X เป็นมาตรฐาน Ultra High Speed ที่ดีอยู่แล้ว ไม่จำเป็นต้องซื้อสายราคาแพงเกินจริง", "การเล่นเกมที่ 120fps บน Xbox Series X มักต้องแลกมาด้วยการลดความละเอียดของภาพลง เพื่อให้ได้เฟรมเรตที่ลื่นไหลตามต้องการ"], "full_paragraphs": ["ฟังดูอาจเป็นคำแนะนำที่ดูแปลกไปสักหน่อยใช่ไหม? เพราะหลายคนคงคิดว่าแค่เสียบสาย HDMI ที่แถมมากับเครื่อง Xbox Series X เข้ากับทีวี ก็พร้อมที่จะสนุกกับเกมโปรดได้ทันที แต่ในความเป็นจริงแล้ว มันไม่ได้ง่ายขนาดนั้นเสมอไป", "แม้ว่าทีวีที่คุณใช้อยู่จะรองรับมาตรฐาน HDMI 2.1 ซึ่งเป็นหัวใจสำคัญที่ทำให้ Xbox Series X แสดงผลความละเอียดและเฟรมเรตได้สูงสุด แต่ไม่ได้หมายความว่าพอร์ต HDMI ทุกช่องบนทีวีของคุณจะรองรับมาตรฐานนี้ทั้งหมด ซึ่งมาตรฐานความละเอียดสูงรุ่นล่าสุดนี้มีความสำคัญมาก เพราะหากขาดมันไป ฟีเจอร์ภาพล้ำสมัยอย่าง Variable Refresh Rate (VRR) ก็จะไม่สามารถใช้งานได้", "สิ่งสำคัญคือคุณต้องทราบข้อมูลจำเพาะของทีวีที่คุณใช้งานอยู่ หากเป็นทีวีรุ่นเก่าที่รองรับเพียง HDMI 2.0 คุณก็สามารถหยุดอ่านบทความนี้ได้เลย เพราะคุณจะทำได้เพียงแค่การแสดงผลสูงสุดที่ 1440p/120 fps หรือ 4K/60 fps เท่านั้น แต่ถ้าคุณมีทีวีจอแบนรุ่นใหม่ระดับกลาง มีโอกาสสูงที่พอร์ตเพียงหนึ่งหรือสองช่องเท่านั้นที่จะรองรับ HDMI 2.1 ซึ่งจะช่วยปลดล็อกการเล่นเกมที่ 4K/120 fps และการปรับเฟรมเรตให้ลื่นไหลด้วย VRR จาก Xbox ได้", "เรามาทำความรู้จักกับช่องเสียบ HDMI ของทีวีให้มากขึ้น รวมถึงพูดคุยกันว่าคุณจำเป็นต้องเปลี่ยนสาย HDMI ที่แถมมาในกล่องหรือไม่ และทำไม HDMI 2.1 ถึงมีความสำคัญอย่างยิ่งสำหรับการเล่นเกมในยุคปัจจุบัน", "ทีวีของคุณรองรับ HDMI 2.1 หรือไม่? คำตอบขึ้นอยู่กับรุ่นของทีวีที่คุณมี หากคุณซื้อทีวีในช่วง 5 ปีที่ผ่านมาและไม่ใช่รุ่นราคาประหยัดจนเกินไป ก็น่าจะรองรับ HDMI 2.1 แต่ต้องจำไว้ว่าแม้จะเป็นทีวีรุ่นใหม่ ก็ไม่มีการรับประกันว่าพอร์ตทุกช่องจะรองรับมาตรฐานนี้ทั้งหมด", "ทีวีระดับไฮเอนด์ส่วนใหญ่ในปัจจุบันจะมีพอร์ต HDMI 2.1 มาให้ทั้งหมด 3 ถึง 4 ช่อง ดังนั้นหากคุณซื้อทีวี OLED หรือ MicroLED ระดับพรีเมียมในช่วงสองสามปีที่ผ่านมา ก็มีแนวโน้มว่าพอร์ต HDMI ทั้งหมดจะรองรับมาตรฐานนี้ แต่ถ้าทีวีของคุณมีอายุหลายปีและเป็นหนึ่งในรุ่นแรกๆ ที่รองรับฟีเจอร์ HDMI 2.1 ก็มีโอกาสสูงที่พอร์ตเพียงช่องเดียวเท่านั้นที่จะสามารถใช้งานประสิทธิภาพสูงสุดที่ 4K/120 fps ของ Xbox Series X ได้", "เพื่อตรวจสอบสถานะพอร์ตของทีวีโดยไม่ต้องก้มๆ เงยๆ หรือใช้ไฟฉายส่อง ให้ลองตรวจสอบคู่มือออนไลน์ของทีวีรุ่นนั้นๆ หรือสังเกตฉลากที่ระบุไว้ที่ด้านหลังของตัวเครื่อง สำหรับทีวี LG OLED ปี 2023 ของผู้เขียนมีพอร์ต HDMI 2.1 มาให้ถึง 4 ช่อง จึงไม่ต้องกังวลเรื่องการเชื่อมต่อ แต่บ่อยครั้งที่แบรนด์ต่างๆ และรุ่นที่ไม่ใหม่มากมักจะจำกัดพอร์ต HDMI 2.1 ไว้ในช่องเฉพาะ ยกตัวอย่างเช่น Sony ทีวี Bravia รุ่นเก่ามักจะสงวนการตั้งค่า 2.1 ไว้ที่พอร์ต 3 และ 4 ซึ่งทั้งหมดนี้ขึ้นอยู่กับรุ่นที่คุณใช้งาน หากไม่แน่ใจให้ตรวจสอบคู่มือออนไลน์ของทีวีเสมอ", "ในกรณีส่วนใหญ่ คุณไม่ควรเปลี่ยนสาย Ultra High Speed HDMI ที่แถมมาในกล่องเครื่องเล่นของ Microsoft อย่างเด็ดขาด เพราะสายเส้นนั้นรองรับมาตรฐาน HDMI 2.1 อย่างเต็มรูปแบบและมีอายุการใช้งานที่ยาวนานกว่าตัวเครื่อง Xbox Series X เสียอีก สำหรับคนส่วนใหญ่จึงไม่มีเหตุผลใดๆ ที่ต้องอัปเกรดสายมาตรฐานที่มากับเครื่อง แน่นอนว่ามีข้อยกเว้นอยู่บ้าง", "ขึ้นอยู่กับการจัดวางพื้นที่เล่นเกมของคุณ คุณอาจต้องการสาย HDMI ที่ยาวกว่าที่ Microsoft ให้มา ซึ่งสายที่แถมมามีความยาว 6 ฟุต (ประมาณ 1.8 เมตร) ซึ่งเพียงพอสำหรับผู้เล่นส่วนใหญ่ แต่หากคุณไม่สามารถวาง Xbox Series X ไว้ใกล้ทีวีได้ตามต้องการ การลงทุนซื้อสายที่ยาวขึ้นก็อาจคุ้มค่า เพียงแค่ต้องตรวจสอบให้แน่ใจว่าเป็นสายที่ผ่านการรับรองมาตรฐาน HDMI 2.1 ก็เพียงพอแล้ว", "นอกจากนี้ยังมีกรณีสำหรับผู้ที่ติดตั้งทีวีแบบแขวนผนัง ผู้เขียนขอยืนยันจากประสบการณ์ส่วนตัวว่าการเสียบสาย HDMI 2.1 ของ Xbox เข้ากับพอร์ตของ LG G3 OLED นั้นเป็นเรื่องยากลำบากมาก เพราะทีวีติดแนบชิดกับผนัง ในกรณีเช่นนี้ การลงทุนซื้อสาย HDMI ที่มีหัวเชื่อมต่อแบบบางพิเศษ (Ultra-thin) ถือว่าคุ้มค่า แต่ต้องย้ำอีกครั้งว่าต้องตรวจสอบให้แน่ใจว่าเป็นมาตรฐาน HDMI 2.1", "ขอร้องว่าอย่าหลงเชื่อคำโฆษณาให้ซื้อสาย HDMI แบบ 'พรีเมียม' เพราะคำนั้นเป็นเพียงเครื่องมือทางการตลาดที่ใช้หลอกล่อผู้ที่ชื่นชอบอุปกรณ์ AV ให้เสียเงินโดยไม่จำเป็น ผู้เขียนจำได้ดีถึงความเจ็บปวดที่เคยถูกโน้มน้าวให้ซื้อสาย HDMI ราคา 75 ดอลลาร์ในปี 2015 หลังจากซื้อทีวี OLED เครื่องแรก เชื่อเถอะว่าสายความเร็วสูงที่แถมมากับ Xbox Series X ของคุณนั้นเพียงพอแล้ว", "มีเกมจำนวนไม่น้อยที่สามารถรันที่ 120 fps บน Xbox Series X (และแม้แต่รุ่นเล็กอย่าง Series S) ตามที่ Pure Xbox ได้ระบุไว้ แต่ข้อควรระวังที่สำคัญคือ มีเกม Xbox เพียงไม่กี่เกมที่สามารถรันที่เฟรมเรตสูงขนาดนั้นพร้อมกับความละเอียด 4K ได้ เกมยุคก่อนที่ได้รับการอัปเกรดสำหรับ Series X อย่าง Halo: The Master Chief Collection สามารถแสดงผลที่ 4K/120 ได้เต็มรูปแบบ แต่เกมระดับแม่เหล็กอย่าง Indiana Jones and the Great Circle, Forza Horizon 6 และ Doom the Dark Ages กลับถูกล็อกไว้ที่ 60 fps บนคอนโซล", "ในกรณีอื่นๆ Xbox Series X มักจะทำเฟรมเรตได้ถึง 120 fps โดยแลกกับการลดความละเอียดของภาพลง เกม Call of Duty ภาคใหม่ๆ แทบทุกภาคล้วนรองรับ 120 fps ตั้งแต่ Black Ops Cold War จนถึง Modern Warfare 4 ในปีนี้ แต่ข้อแลกเปลี่ยนคือมักจะใช้ความละเอียดแบบไดนามิก ซึ่งมักจะลดความคมชัดของภาพในเกมลงเหลือเพียง 1080p หรือ 1400p หากคุณต้องการเฟรมเรตที่สูงขึ้นบน Series X ในกรณีส่วนใหญ่คุณต้องยอมรับการลดความละเอียดของภาพลง", "มีข้อจำกัดที่คุณควรทราบก่อนตัดสินใจซื้อ Xbox Series X แต่เมื่อถึงเวลาใช้งานจริง ประสิทธิภาพการแสดงผลของภาพขึ้นอยู่กับการใช้สาย HDMI ที่เหมาะสม รวมถึงอายุและผู้ผลิตของทีวีที่เชื่อมต่อ ดังนั้นเพื่อให้ได้ประโยชน์สูงสุดจาก Xbox Series X ของคุณ ให้เริ่มต้นด้วยการตรวจสอบให้แน่ใจว่าพอร์ต HDMI 2.1 และสายสัญญาณของคุณพร้อมใช้งานอย่างถูกต้อง"], "link": "https://www.engadget.com/2315403/chance-xbox-series-x-plugged-into-wrong-hdmi-port/", "canonical_link": "https://www.engadget.com/2315403/chance-xbox-series-x-plugged-into-wrong-hdmi-port", "cover_image_url": "https://www.engadget.com/img/gallery/theres-a-chance-your-xbox-series-x-is-plugged-into-the-wrong-hdmi-port/l-intro-1794516377.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/theres-a-chance-your-xbox-series-x-is-plugged-into-the-wrong-hdmi-port/intro-1794516377.jpg", "https://www.engadget.com/img/gallery/theres-a-chance-your-xbox-series-x-is-plugged-into-the-wrong-hdmi-port/am-i-using-the-wron res newer iPhone model", "thai_title": "แอป Apple Health โฉมใหม่ใน iOS 27.3 จำกัดเฉพาะ iPhone รุ่นที่รองรับ Apple Intelligence เท่านั้น", "tag": "Gadgets", "sub_tag": "MOBILE", "bullet_points": ["iOS 27.3 เตรียมเปิดตัวแอป Apple Health โฉมใหม่ในเดือนหน้า พร้อมฟีเจอร์ที่เน้นความเป็นส่วนตัวและข้อมูลเชิงลึกมากขึ้น", "ฟีเจอร์ใหม่ประกอบด้วยแท็บ Insights, แท็บ Longevity, วิดีโอให้ความรู้ และระบบประเมินการเคลื่อนไหวที่บ้าน", "การใช้งานแอป Apple Health เวอร์ชันใหม่จำเป็นต้องใช้ iPhone ที่รองรับ Apple Intelligence เท่านั้น ได้แก่ iPhone 15 Pro หรือรุ่นที่ใหม่กว่า", "ผู้ใช้ iPhone รุ่นเก่าหรือผู้ที่ไม่ได้เปิดใช้งาน Apple Intelligence จะไม่สามารถเข้าถึงฟีเจอร์ใหม่เหล่านี้ได้ และในช่วงแรกจะรองรับเฉพาะบางภาษาเท่านั้น"], "full_paragraphs": ["iOS 27.3 เตรียมเปิดตัวประสบการณ์การใช้งานแอป Apple Health รูปแบบใหม่ทั้งหมดในเดือนหน้า แต่มีเงื่อนไขสำคัญคือคุณจำเป็นต้องมี iPhone ที่รองรับระบบ AI เพื่อใช้งานฟีเจอร์เหล่านี้", "เมื่อ iOS 27.3 เปิดตัวในเดือนหน้า จะมาพร้อมกับการอัปเกรดที่หลากหลายสำหรับ Apple TV, Apple Music, Siri AI, iCloud+, iPhone Duo และบริการอื่นๆ ของ Apple", "อีกหนึ่งไฮไลต์สำคัญคือการปรับโฉมแอป Apple Health ใหม่ทั้งหมด ซึ่งเคยมีการเปิดตัวครั้งแรกไปเมื่อเดือนกันยายนที่ผ่านมาพร้อมกับการเปิดตัว Apple Watch รุ่นใหม่", "แอป Health กำลังได้รับการยกเครื่องใหม่ทั้งหมดใน iOS 27.3 โดยมีเป้าหมายเพื่อให้มีความเป็นส่วนตัวและให้ข้อมูลที่เป็นประโยชน์มากกว่าที่เคยเป็นมา ฟีเจอร์ใหม่ประกอบด้วยแท็บ Insights, แท็บ Longevity, วิดีโอเพื่อการศึกษา, ระบบประเมินการเคลื่อนไหวที่บ้าน และอื่นๆ อีกมากมาย", "อย่างไรก็ตาม สำหรับผู้ใช้ iPhone จำนวนมากที่อัปเดตเป็น iOS 27.3 แอป Health อาจจะยังคงดูเหมือนเดิมไม่เปลี่ยนแปลง เหตุผลก็คือประสบการณ์ใหม่นี้ต้องอาศัยการทำงานของ Apple Intelligence ดังนั้นคุณจึงจำเป็นต้องมี iPhone ที่รองรับ AI เพื่อใช้งาน", "นั่นหมายความว่าจำเป็นต้องใช้ iPhone 15 Pro หรือรุ่นที่ใหม่กว่าเท่านั้นจึงจะสามารถใช้งานได้", "หากคุณใช้ iPhone รุ่นที่เก่ากว่านั้น หรือเลือกที่จะไม่เปิดใช้งาน Apple Intelligence บนอุปกรณ์ของคุณ คุณจะพลาดฟีเจอร์ใหม่ๆ ของแอป Health ไป นอกจากนี้ ฟีเจอร์ดังกล่าวยังจ กำกับทั้งหมด", "Netflix ยืนยันแล้วว่าจะมีการสร้างซีซัน 3 ซึ่งจะเป็นซีซันสุดท้ายเพื่อปิดตำนานเรื่องราวนี้", "ผลงานสร้างสรรค์โดยทีมผู้สร้าง Game of Thrones อย่าง David Benioff และ D.B. Weiss ร่วมกับ Alexander Woo"], "full_paragraphs": ["ในที่สุดก็สิ้นสุดการรอคอยเกือบ 3 ปี นับตั้งแต่การเปิดตัวครั้งแรกของซีรีส์ไซไฟฟอร์มยักษ์ โดยซีซันที่ 2 ของ 3 Body Problem บน Netflix มีกำหนดการสตรีมมิ่งอย่างเป็นทางการในวันที่ 14 มกราคมนี้ ซึ่งถือเป็นช่วงเวลาเกือบ 3 ปีพอดีหลังจากซีซันแรกได้ออกฉาย โดยทาง Netflix ได้ปล่อยตัวอย่างใหม่ที่เต็มไปด้วยฉากแอ็กชันและงานภาพไซไฟสุดตระการตาที่ดูน่าสนใจเป็นอย่างยิ่ง", "สำหรับเนื้อหาในซีซันที่ 2 จะยังคงเป็นการดัดแปลงจากนิยายไตรภาคชุด Remembrance of Earth's Past ของนักเขียน Cixin Liu ต่อเนื่องจากซีซันแรก นอกจากนี้ ทาง Netflix ยังได้อนุมัติให้มีการสร้างซีซันที่ 3 ซึ่งจะเป็นซีซันสุดท้ายของซีรีส์เรื่องนี้อย่างเป็นทางการแล้ว โดยนิยายชุดนี้ถือเป็นปรากฏการณ์ระดับโลกมานานหลายทศวรรษ และซีซันแรกของซีรีส์ก็ถือว่าประสบความสำเร็จในระดับที่น่าพอใจสำหรับแพลตฟอร์ม", "สำหรับผู้ที่ยังไม่เคยรับชม 3 Body Problem เป็นผลงานการสร้างสรรค์ร่วมกันของ David Benioff และ D.B. Weiss ซึ่งเป็นสองผู้สร้างซีรีส์ระดับตำนานอย่าง Game of Thrones ร่วมด้วย Alexander Woo ผู้ร่วมสร้างที่มีผลงานการเขียนบทให้กับซีรีส์ชื่อดังอย่าง The Terror, True Blood และ Wonderfalls", "ซีรีส์เรื่องนี้เปรียบเสมือนการนำเสนอเรื่องราวการรุกรานของมนุษย์ต่างดาวในรูปแบบฮาร์ดไซไฟ (Hard Sci-Fi) ที่แผ่ขยายไปในหลายช่วงเวลา โดยในซีซันแรกนั้นถือว่าทำออกมาได้อย่างสวยงามและโดดเด่นด้วยการแสดงของนักแสดงมากฝีมืออย่าง Benedict Wong, Liam Cunningham และ Rosalind Chao รวมถึงนักแสดงท่านอื่นๆ", "ในขณะนี้เรายังไม่ทราบแน่ชัดว่าซีซันที่ 2 จะจัดการกับประเด็นที่ซับซ้อนในเชิงเนื้อหาจากนิยายต้นฉบับอย่างไร (โดยไม่มีการเปิดเผยเนื้อหาสำคัญในที่นี้) อย่างไรก็ตาม Alexander Woo เคยกล่าวไว้เสมอว่า \"หลักการชี้นำ\" ของซีรีส์เรื่องนี้คือการ \"รักษาจิตวิญญาณ\" ของหนังสือต้นฉบับเอาไว้ ซึ่งเราคงต้องรอติดตามชมกันต่อไป", "อย่างไรก็ตาม มีข่าวที่อาจทำให้แฟนๆ รู้สึกเสียดายอยู่บ้าง คือในขณะที่ซีซันแรกมีจำนวนตอนทั้งหมด 8 ตอน แต่ในซีซันที่ 2 นี้จะเหลือเพียง 6 ตอนเท่านั้น โดยทั้ง 6 ตอนนี้กำกับโดย Jeremy Podeswa และ Miguel Sapochnik ซึ่งเป็นผู้กำกับมือเก๋าจากซีรีส์ Game of Thrones"], "link": "https://www.engadget.com/2319667/3-body-problem-finally-returns-to-netflix-on-january-14/", "canonical_link": "https://www.engadget.com/2319667/3-body-problem-finally-returns-to-netflix-on-january-14", "cover_image_url": "https://www.engadget.com/img/gallery/3-body-problem-finally-returns-to-netflix-on-january-14/l-intro-1794943797.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/3-body-problem-finally-returns-to-netflix-on-january-14/intro-1794943797.jpg"], "videos": ["https://www.youtube.com/embed/KInfw7kCPkc"], "review_score": "", "published_ts": 1794943834, "published_at": "2026-11-17T19:30:34Z", "published_th": "18 พ.ย. 2026 • 02:30 น.", "category_hint": "Gadgets"}, {"id": 1794944796603, "guid": "https://www.engadget.com/2315395/use-keyboard-mouse-with-xbox-series-x", "original_title": "Can you use a keyboard and mouse with an Xbox Series X?", "thai_title": "ไขข้อสงสัย: ใช้คีย์บอร์ดและเมาส์กับ Xbox Series X ได้จริงไหม? มีข้อจำกัดอะไรบ้าง", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["Xbox Series X/S รองรับการใช้งานคีย์บอร์ดและเมาส์ แต่มีข้อจำกัดเรื่องความเข้ากันได้ในแต่ละเกม", "ไม่รองรับการเชื่อมต่อผ่าน Bluetooth จำเป็นต้องใช้แบบมีสายหรือแบบไร้สายที่ใช้ดองเกิล 2.4GHz เท่านั้น", "เมาส์ไม่สามารถใช้ควบคุมหน้า Dashboard ของ Xbox ได้ และบางเกมอาจต้องใช้จอยคอนโทรลเลอร์ควบคู่ไปด้วย", "มีเกมรองรับการใช้งานคีย์บอร์ดและเมาส์มากกว่า 100 เกม รวมถึงเกมดังอย่าง Halo Infinite และ Microsoft Flight Simulator 2024", "การใช้คีย์บอร์ดและเมาส์ช่วยเพิ่มความแม่นยำในเกมยิง (FPS) และความสะดวกในการจัดการเมนูในเกมแนววางแผนหรือจำลองสถานการณ์"], "full_paragraphs": ["แม้ว่าในแง่ของยอดขายคอนโซลยุคปัจจุบัน PS5 จะทำผลงานได้เหนือกว่า Xbox Series X และ S อย่างชัดเจน ซึ่งถือเป็นเรื่องน่าเสียดายสำหรับแฟนๆ ของ Microsoft แต่ในมุมมองของผู้เขียน Xbox Series X ยังคงเป็นคอนโซลที่ยอดเยี่ยมและมาพร้อมกับตัวเลือกด้านการเข้าถึง (Accessibility) ที่หลากหลาย หนึ่งในฟีเจอร์ที่โดดเด่นที่สุดคือการรองรับคีย์บอร์ดและเมาส์ที่ค่อนข้างครอบคลุม", "การนำอุปกรณ์ต่อพ่วงจาก PC มาใช้กับคอนโซลอาจดูเป็นเรื่องแปลกใหม่สำหรับบางคน แต่จริงๆ แล้วมีประวัติมาอย่างยาวนานตั้งแต่สมัย Dreamcast ปัจจุบันมีเกม Xbox จำนวนมากที่รองรับการใช้งานคีย์บอร์ดและเมาส์ไม่มากก็น้อย เราจะมาเจาะลึกกันว่าอุปกรณ์แบบไหนที่ใช้งานกับ Xbox Series X/S ได้ รวมถึงวิธีการตั้งค่าและจำนวนเกมที่รองรับการควบคุมนอกเหนือจากจอยเกมแพด (Gamepad)", "คำตอบคือคุณสามารถใช้งานได้จริง แต่ก็มีข้อควรระวัง แม้ Microsoft จะทำผลงานได้ดีในการมอบฟีเจอร์ด้านการเข้าถึง แต่การรองรับคีย์บอร์ดและเมาส์บน Xbox Series X/S ไม่ได้ครอบคลุมทุกเกม และในบรรดาเกมที่รองรับนั้น ไม่ใช่ทุกเกมที่จะรองรับแบบ Native (รองรับโดยตรง) ซึ่งหมายความว่าในบางเกมคุณอาจจำเป็นต้องมีจอยคอนโทรลเลอร์วางไว้ใกล้ตัวเพื่อใช้กดคำสั่งบางอย่างในการเล่นให้ผ่าน", "นอกจากนี้ยังมีข้อจำกัดอื่นๆ อีก คือในปัจจุบันยังไม่มีวิธีเชื่อมต่อเมาส์หรือคีย์บอร์ดผ่าน Bluetooth กับคอนโซล Xbox Series ได้เลย สำหรับใครที่ต้องการเชื่อมต่ออุปกรณ์ PC คู่ใจ คุณจำเป็นต้องใช้อุปกรณ์แบบมีสายหรือแบบไร้สายที่มาพร้อมกับดองเกิล 2.4GHz เท่านั้น", "ซึ่งถือเป็นเรื่องน่ารำคาญเล็กน้อย เพราะอุปกรณ์เสริมที่ดีที่สุดสำหรับ Xbox Series X/S มักจะเป็นแบบไร้สาย เนื่องจากผู้เล่นส่วนใหญ่มักนั่งห่างจากทีวีขณะเล่นเกม เว้นแต่ว่าคุณจะวาง Xbox ไว้บนโต๊ะทำงานเหมือน PC การใช้คีย์บอร์ดและเมาส์แบบมีสายจึงอาจไม่ใช่ทางเลือกสำหรับการเล่นในห้องนั่งเล่นทั่วไป ดังนั้นการใช้ดองเกิลจึงเป็นทางออกที่ดีที่สุด", "และยังมีอีกหนึ่งข้อจำกัดคือ คุณไม่สามารถใช้เมาส์เพื่อเลื่อนดูหน้า Dashboard ของ Xbox ได้ ซึ่งถือเป็นเรื่องที่น่าผิดหวังเล็กน้อย", "การตั้งค่าคีย์บอร์ดและเมาส์บน Xbox Series X/S นั้นค่อนข้างง่าย แต่ฟังก์ชันการใช้งานหลังจากนั้นจะขึ้นอยู่กับแต่ละเกม วิธีที่ง่ายและใช้งานได้จริงที่สุดคือการเสียบดองเกิลไร้สายของคีย์บอร์ดและเมาส์เข้ากับช่อง USB-A ที่ด้านหลังหรือด้านหน้าของคอนโซล", "เมื่อเชื่อมต่อแล้ว คุณสามารถใช้คีย์บอร์ดเพื่อพิมพ์ข้อความบนหน้า Dashboard ได้ (แม้ว่าเมาส์จะยังใช้งานไม่ได้ก็ตาม) แต่เมื่อเข้าสู่ตัวเกม สถานการณ์จะเปลี่ยนไป เกมอาจจดจำอุปกรณ์ของคุณได้ทันทีและเริ่มใช้งานได้เลย หรือคุณอาจต้องใช้จอยคอนโทรลเลอร์เพื่อเข้าไปที่เมนูการตั้งค่าเพื่อเลือกรูปแบบการควบคุมเป็นคีย์บอร์ดและเมาส์ หากเกมนั้นรองรับ ทั้งนี้ Microsoft เป็นเพียงผู้จัดเตรียมแพลตฟอร์ม แต่ตัวเลือกการเข้าถึงขึ้นอยู่กับผู้พัฒนาเกมแต่ละราย ดังนั้นขั้นตอนการใช้งานจะแตกต่างกันไปในแต่ละเกม", "โดยสรุปคือ คุณควรเตรียมจอยคอนโทรลเลอร์ไว้ใกล้มือเสมอหากต้องการใช้อุปกรณ์ PC กับคอนโซล Xbox เพื่อความไม่ประมาท", "ปัจจุบันมีเกมจำนวนมากที่รองรับคีย์บอร์ดและเมาส์ แม้จะไม่เทียบเท่ากับระดับ PC แต่รายการเกม Xbox ที่รองรับ (ตามรายงานของ Pure Xbox) ก็ถือว่าไม่น้อยเลย โดยมีมากกว่า 100 เกมที่รองรับการใช้งานในระดับต่างๆ แม้จะไม่ใช่การรองรับแบบ Native ทั้งหมด ซึ่งหมายความว่าบางครั้งคุณอาจต้องหยิบจอยคอนโทรลเลอร์ขึ้นมาเพื่อเลื่อนเมนู หากคุณเข้าไปดูใน Xbox Store หน้าข้อมูลของเกมจะระบุระดับการรองรับคีย์บอร์ดและเมาส์ไว้ หากเกมไหนไม่รองรับการควบคุมแบบ PC โดยตรงจะถูกระบุว่า 'Limited' (จำกัด)", "หากคุณกำลังมองหาเกมดังที่รองรับคีย์บอร์ดและเมาส์แบบ Native บน Xbox Series X/S ก็มีตัวอย่างเช่น Microsoft Flight Simulator 2024, Halo Infinite และ Gears of War: E-Day เมื่อพิจารณาว่าเกมหนึ่งต้องการการควบคุมจำลองที่ซับซ้อนซึ่งไม่เหมาะกับจอยแพด และอีกสองเกมเน้นการเล็งยิงจากระยะไกล การใช้คีย์บอร์ดและเมาส์จึงเป็นวิธีที่ยอดเยี่ยมในการสัมผัสประสบการณ์เกมเหล่านี้ ผู้เขียนเองก็ตั้งตารอที่จะเล่น Halo Infinite ซ้ำบน Xbox โดยใช้เมาส์ Inphic F9 Mecha คู่ใจในการจัดการกับศัตรู", "นอกจากนี้ยังมีเกมยิงแนวแข่งขันอย่าง Overwatch ที่รองรับการเล่นข้ามแพลตฟอร์ม ซึ่งระบบจะจับคู่คุณกับผู้เล่นที่ใช้คีย์บอร์ดและเมาส์เหมือนกันโดยอัตโนมัติหากตรวจพบว่าคุณใช้อุปกรณ์ดังกล่าว เพราะในเกมยิงที่รวดเร็ว การใช้จอยคอนโทรลเลอร์ไปสู้กับคนที่ใช้เมาส์และคีย์บอร์ดก็เปรียบเสมือนการถือหมอนไปสู้กับดาบเลเซอร์", "การใช้อุปกรณ์ต่อพ่วงแบบเดสก์ท็อปกับ Xbox Series X/S มีข้อดีหลายประการ แม้บางอย่างอาจดูไม่หวือหวา เช่น การพิมพ์ป้ายทะเบียนใน Forza Horizon 6 ได้เร็วขึ้นเล็กน้อย แต่ในแง่การใช้งานจริงนั้นมีประโยชน์มากกว่ามาก", "สำหรับเกมแนวจำลองสถานการณ์หรือวางแผนที่มีระบบกลไกซับซ้อนและระบบคลังไอเทมที่ละเอียด การใช้เมาส์และคีย์บอร์ดนั้นเหนือกว่าอย่างเห็นได้ชัด ผู้เขียนมีประสบการณ์ที 71993, "guid": "4Aa8tDa5SjWd5dSbMSmFs7", "original_title": "Miami Heat shows off its 'Vice City hardwood' ahead of the big Grand Theft Auto 6 basketball game", "thai_title": "Miami Heat เปิดตัวสนามบาสเกตบอลธีม Vice City ต้อนรับกระแสเกม Grand Theft Auto 6", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["ทีมบาสเกตบอล Miami Heat ปรับโฉมสนามแข่งขันเป็นธีม Vice City เพื่อโปรโมทเกม Grand Theft Auto 6", "การปรับโฉมสนามประกอบด้วยโลโก้ Vice City ขนาดใหญ่กลางสนาม และสโลแกน 'I Heart Vice City' ที่บริเวณใต้แป้น", "มีการเปิดตัวชุดแข่งรุ่นพิเศษ 'Cactus Jack Edition' ที่จะวางจำหน่ายในจำนวนจำกัดเฉพาะในคืนวันแข่งขัน", "Grand Theft Auto 6 มีกำหนดวางจำหน่ายอย่างเป็นทางการในวันที่ 19 พฤศจิกายน โดยคาดการณ์รายได้มหาศาลในไตรมาสแรก", "กิจกรรมพิเศษนี้จะจัดขึ้นในการแข่งขันระหว่าง Miami Heat และ Milwaukee Bucks ในวันที่ 18 พฤศจิกายน"], "full_paragraphs": ["Grand Theft Auto 6 มีกำหนดวางจำหน่ายในเวลาเที่ยงคืนของวันที่ 19 พฤศจิกายน ตามเขตเวลาท้องถิ่นของคุณ ซึ่งหมายความว่าผู้เล่นในนิวซีแลนด์จะได้สัมผัสเกมก่อนใคร ในขณะที่ผู้เล่นในภูมิภาคอื่นอาจยังคงติดภารกิจการทำงาน อย่างไรก็ตาม สำหรับผู้ที่เล่นเกมบน PC อาจต้องรอคอยกันต่อไป เนื่องจากตัวเกมยังไม่มีกำหนดการวางจำหน่ายบนแพลตฟอร์มดังกล่าว จนกว่าทาง Take-Two Interactive จะประกาศความชัดเจนในอนาคต", "แม้จะยังไม่มีกำหนดการบน PC แต่กระแสความตื่นเต้นก่อนการวางจำหน่ายก็ยังคงร้อนแรงไม่แพ้ใคร ล่าสุดทีมบาสเกตบอล NBA อย่าง Miami Heat ได้ร่วมสร้างสีสันด้วยการเปิดตัวสนามแข่งขันในธีม 'Vice City hardwood' เพื่อใช้ในการแข่งขันกับทีม Milwaukee Bucks โดยสนามแห่งนี้ถูกออกแบบมาเพื่อสะท้อนบรรยากาศของเมือง Vice City ในเกมอย่างเต็มรูปแบบ", "การปรับโฉมสนามในครั้งนี้ถือเป็นการเปลี่ยนแปลงครั้งใหญ่ โดยมีโลโก้ Vice City ขนาดมหึมาอยู่บริเวณกลางสนาม โลโก้ VI ปรากฏอยู่ในเขตใต้แป้น (the paint) และมีสโลแกน 'I Heart Vice City' ประดับอยู่ที่ปลายสนามทั้งสองด้าน แม้จะเป็นกลยุทธ์ทางการตลาดที่ชัดเจน แต่ปฏิเสธไม่ได้ว่าผลลัพธ์ที่ออกมานั้นดูน่าประทับใจอย่างยิ่ง", "นอกจากสนามแล้ว ทางทีมยังได้เปิดตัวชุดแข่งธีมพิเศษ 'Vice City Cactus Jack Edition' ซึ่งจะวางจำหน่ายในจำนวนจำกัดเฉพาะในงาน 'A ace-angela-santalbano-actor-game-awards-nomination-2026", "original_title": "Resident Evil Requiem’s Game Awards Nominee Is Ready for Resident Evil 10", "thai_title": "Angela Sant'Albano นักแสดงจาก Resident Evil Requiem เผยความพร้อมหากต้องกลับมาใน Resident Evil 10", "tag": "Gaming", "sub_tag": "RESIDENT EVIL", "bullet_points": ["Angela Sant'Albano ผู้รับบท Grace Ashcroft ใน Resident Evil Requiem ได้รับการเสนอชื่อเข้าชิงรางวัลจากงาน The Game Awards 2026", "นักแสดงสาวเปิดเผยว่าการทำงานผ่าน Motion Capture ให้ความรู้สึกเหมือนการแสดงละครเวทีที่ผสมผสานความใกล้ชิดแบบงานภาพยนตร์เข้าด้วยกัน", "Sant'Albano ทุ่มเทอย่างหนักในการแสดงฉากแอ็กชันและฉากที่ต้องใช้ความเหนื่อยหอบ เพื่อถ่ายทอดความวิตกกังวลของตัวละครออกมาให้สมจริงที่สุด", "มีการปรับเปลี่ยนบทสนทนาโดยเพิ่มคำสบถเพื่อให้ตัวละคร Grace ดูมีความเป็นมนุษย์และเข้าถึงอารมณ์ของหญิงสาววัย 20 กว่าปีได้มากขึ้น", "นักแสดงสาวหวังว่าตัวละคร Grace จะได้กลับมามีบทบาทอีกครั้งในอนาคต โดยเฉพาะในภาคต่ออย่าง Resident Evil 10"], "full_paragraphs": ["Angela Sant'Albano ไม่เคยมีประสบการณ์การแสดงในวิดีโอเกมมาก่อนที่จะมารับบทใน Resident Evil Requiem และเธอยังไม่เคยผ่านงาน Motion Capture มาก่อนด้วยเช่นกัน แต่หลังจากใช้เวลาหลายเดือนในการทุ่มเทร่างกายเข้าสู่โลกแห่งความสยองขวัญของ Grace Ashcroft เธอก็ได้ข้อสรุปว่าสื่อบันเทิงประเภทนี้คือสิ่งที่เหมาะสมกับเธออย่างสมบูรณ์แบบ", "“ฉันบอกได้เลยว่าฉันโชคดีมากที่ได้เป็นส่วนหนึ่งของ Resident Evil” Sant'Albano กล่าวกับ Polygon เพียงไม่กี่สัปดาห์ก่อนที่เธอจะได้รับการเสนอชื่อเข้าชิงรางวัลในงาน The Game Awards 2026 “ฉันยังคงต้องหยิกตัวเองอยู่เลยว่านี่คือเรื่องจริง”", "สิ่งที่ทำให้เธอประหลาดใจมากที่สุดคือความรู้สึกที่ว่าเธอแทบไม่ต้องปรับเปลี่ยนวิธีการแสดงของตัวเองเลย เธอกล่าวว่า Motion Capture มอบความใกล้ชิดแบบงานโทรทัศน์ให้กับเธอ พร้อมกับอิสระทางร่างกายแบบเดียวกับการแสดงละครเวที", "“ลองจินตนาการว่าคุณกำลังแสดงละครเวทีแบบล้อมรอบ ซึ่งคุณมีผู้ชมอยู่รอบตัว 360 องศา แต่ในขณะเดียวกันคุณก็มีความใกล้ชิดแบบงานโทรทัศน์และหน้าจอ เพราะมีกล้องจ่ออยู่ตรงหน้าคุณ” เธอกล่าว “คุณสามารถมีบทสนทนาภายในใจที่ลึกซึ้งไปพร้อมๆ กับการมีอิสระในการเคลื่อนไหวร่างกาย”", "และ Resident Evil Requiem ก็ต้องการการใช้ร่างกายอย่างหนักหน่วง ฉากคัตซีนของเกมถูกบันทึกโดยให้นักแสดงแสดงทุกอย่างด้วยตัวเอง มักจะเป็นในสตูดิโอที่มืดมิดของ Imaginarium Studios ในลอนดอน Sant'Albano ต้องวิ่ง ต่อสู้ คลาน ดิ้นรน และพยายามทำให้ตัวเองอยู่ในสภาวะตื่นตระหนกที่ดูสมจริงก่อนเข้าฉากที่ Grace ต้องหอบหายใจ", "“ฉันจะวิ่งไปรอบๆ ทำวิดพื้น กระโดดตบ หรือทำอะไรก็ได้เพื่อให้หัวใจเต้นแรง” เธอกล่าว “Grace เป็นคนที่มีความวิตกกังวลสูง และใช่ การทำแบบนั้นในขณะที่คุณเลียนแบบความวิตกกังวลในร่างกายและเลียนแบบลมหายใจแบบนั้น มันทำให้คุณรู้สึกวิตกกังวลขึ้นมาจริงๆ”", "บางครั้งการผลิตก็ทำให้ความจริงทางกายภาพดูตรงไปตรงมามากขึ้น ในฉากช่วงต้นเกม Grace ตื่นขึ้นมาโดยถูกล่ามโซ่ไว้กับเตียงผู้ป่วย Sant'Albano ถูกจับเอียงไปมาในขณะที่นอนหงาย และเมื่อ Grace ถูกลากไปตามพื้น Sant'Albano ก็ถูกลากจริงๆ เช่นกัน", "“ฉันเชื่อจริงๆ ว่านั่นคือเหตุผลที่การแสดงออกมาดูสมจริง” เธอกล่าว “เพราะเรานำตัวเองไปอยู่ในสถานการณ์เหล่านั้นจริงๆ”", "อิสระทางร่างกายนี้ยังขยายไปถึงการตัดสินใจเล็กๆ น้อยๆ ในระหว่างการซ้อม Sant'Albano และทีมงานได้รับการสนับสนุนให้ผลักดันความประหม่าและความวิตกกังวลของ Grace ให้ถึงขีดสุดก่อนจะผ่อนปรนลงมา ในจุดหนึ่ง Sant'Albano ตัดสินใจว่ามีสิ่งหนึ่งที่หญิงสาววัย 20 กว่าปีที่กำลังหวาดกลัวน่าจะทำบ่อยกว่าปกติ", "“ฉันแค่จำได้ว่าคิดว่า Grace เป็นเด็กสาวอายุประมาณ 25-27 ปี เธอต้องสบถบ้าง” เธอกล่าว “Angela จะตอบสนองอย่างไรในสถานการณ์เหล่านี้? และฉันก็คิดว่าเธอคงจะพูดคำว่า 'fuck' ออกมา”", "ด้วยเหตุนี้ Capcom จึงเพิ่มคำสบถเข้าไปในบท", "การค้นหาเสียงของ Grace มาจากการขุดลึกลงไปในทุกสิ่งที่ทำให้ตัวละครนี้รู้สึกไม่สบายใจในตัวเอง Sant'Albano ค้นคว้าเรื่องอาการติดอ่างอย่างละเอียด ทั้งช่วงเวลาที่มันเกิดขึ้นและสิ่งที่ทำให้มันแย่ลง ก่อนจะสร้างตัวละครนี้ขึ้นมาจากประวัติอันเจ็บปวด ความสัมพันธ์กับแม่ และความรู้สึกที่ว่าเธอไม่ค่อยเข้าพวกใน FBI", "“ฉันดำดิ่งลงไปในภูมิหลังของเธอเพื่อค้นหาตัวตนของเธอ” เธอกล่าว “และจากนั้นผ่านสิ่งนั้น ทั้งน้ำเสียงและท่าทางของเธอมันก็ดูเป็นธรรมชาติอย่างน่าประหลาด”", "ในตอนนี้ Sant'Albano หวังว่าผลงานชิ้นนี้จะไม่ใช่แค่ครั้งเดียว Grace รอดชีวิตจากเหตุการณ์ใน Requiem และนักแสดงสาวก็มองเห็นภารกิจที่ยังค้างคาอยู่มากมาย ไม่ว่าจะเป็นงานลึกลับของแม่เธอ ความสัมพันธ์กับ Emily และสายสัมพันธ์ที่กำลังเติบโตกับ Leon Kennedy", "“ฉันหวังว่า Grace จะกลับมา” เธอกล่าว “ฉันคิดว่าเรื่องราวของเธอยังไม่จบลงแน่นอน” แต่ถ้า Grace กลับมาจริงๆ ก็อย่าคาดหวังว่าเธอจะกลายเป็น Sarah Connor ใน Terminator 2", "“เธอจะไม่มีวันเป็นเหมือน Leon” เธอกล่าว “และฉันคิดว่านั่นคือสิ่งที่ทำให้เธอพิเศษ”"], "link": "https://www.polygon.com/resident-evil-requiem-grace-angela-santalbano-actor-game-awards-nomination-2026/", "canonical_link": "https://www.polygon.com/resident-evil-requiem-grace-angela-santalbano-actor-game-awards-nomination-2026", "cover_image_url": "https://static0.polygonimages.com/wordpress/wp-content/uploads/2026/11/grace-ashcroft-holding-flashlight.png", "gallery_images": ["https://static0.polygonimages.com/wordpress%2Fwp-content%2Fauthors%2F685c146c54bdb-Matt%20Patches%20Green%20%26%20Purple.jpg?fit=crop&w=90&h=90", "https://static0.polygonimages.com/wordpress/wp-content/uploads/sharedimages/2025/06/resident-evil-requiem-tag-page-cover-art.jpg?q=50&fit=crop&w=32&h=32&dpr=1.5"], "videos": ["https://www.youtube.com/embed/Ore-wryls-o"], "review_score": "", "published_ts": 1794956417, "published_at": "2026-11-17T23:00:17Z", "published_th": "18 พ.ย. 2026 • 06:00 น.", "category_hint": "Gaming"}, {"id": 1794959245556, "guid": "35496090-e661-48de-a87c-d07f23f7e587", "original_title": "Infinity Nikki Players Baffled After Elon Musk's Mom Appears in Game's Update Trailers", "thai_title": "ผู้เล่น Infinity Nikki งงหนัก หลังพบ Maye Musk แม่ของ Elon Musk ปรากฏตัวในตัวอย่างอัปเดตใหม่", "tag": "Gaming", "sub_tag": "GAMING", "bullet_points": ["Maye Musk แม่ของ Elon Musk ปรากฏตัวในตัวอย่างโปรโมตอัปเดต 3.0 ของเกม Infinity Nikki สร้างความประหลาดใจให้กับผู้เล่นทั่วโลก", "การปรากฏตัวดังกล่าวได้รับกระแสตอบรับที่แตกต่างกันอย่างสิ้นเชิงระหว่างฐานแฟนคลับในจีนและกลุ่มผู้เล่นฝั่งตะวันตก", "ผู้เล่นในฝั่งตะวันตกจำนวนมากแสดงความไม่พอใจผ่านทาง Reddit โดยบางส่วนถึงขั้นประกาศเลิกเล่ ไดนามิก เช่น ฝนตก พายุ และหิมะ ซึ่งส่งผลต่อการเล่นในแมตช์", "ปรับปรุงระบบสอนเล่น (Onboarding) สำหรับผู้เล่นใหม่ให้เข้าใจกลไกเกมได้ง่ายและเป็นธรรมชาติมากขึ้น"], "full_paragraphs": ["แนวคิดเรื่องเนื้อหาที่สร้างโดยผู้เล่น (User-Generated Content หรือ UGC) ซึ่งเป็นความหวังในการสร้างแพลตฟอร์มที่เติบโตได้อย่างไร้ขีดจำกัดโดยอาศัยแรงขับเคลื่อนจากชุมชนผู้ใช้งาน ได้กลายเป็นเป้าหมายล่าสุดของเกม Dead by Daylight โดยทางผู้พัฒนา Behaviour Interactive ได้เผยถึงทิศทางในอนาคตของเกม ซึ่งรวมถึงการเปิดโอกาสให้ผู้เล่นสามารถสร้างสรรค์คอนเทนต์ของตนเองขึ้นมาภายในเกมสยองขวัญมัลติเพลเยอร์ยอดนิยมนี้", "\"จะเป็นอย่างไรหากคุณสามารถสร้างประสบการณ์ Dead by Daylight ในแบบของคุณเองได้?\" บล็อกโพสต์ที่สรุปแผนการเปลี่ยนแปลงของเกมระบุไว้ \"ในฐานะหนึ่งในการอัปเดตที่น่าตื่นเต้นที่สุดที่จะมาถึงในปี 2027 Dead by Daylight Workshop จะเปิดประตูสู่เนื้อหาที่สร้างโดยผู้เล่นในรูปแบบที่น่าทึ่ง ตั้งแต่การออกแบบแผนที่ของคุณเอง การนำเข้าสินทรัพย์ (Assets) แบบกำหนดเอง ไปจนถึงการปรับเปลี่ยนกฎของเกม วัตถุประสงค์ และแม้กระทั่งการสร้างโหมดใหม่ทั้งหมด ความเป็นไปได้นั้นมีมากมายมหาศาล\"", "โพสต์ดังกล่าวยังระบุด้วยว่า สิ่งใดก็ตามที่ถูกสร้างขึ้นใน Workshop จะ \"แยกออกจากโหมดคลาสสิกทั้งหมดของเรา โดยจะมีเครื่องมือสร้างสรรค์และการดูแลจัดการโดยเฉพาะ เพื่อให้มั่นใจว่านักสร้างม็อดที่มีประสบการณ์จะมีทุกสิ่งที่จำเป็นในการสร้างผลงานที่ดีที่สุด และผลงานทั้งหมดที่ส่งเข้ามาจะต้องเป็นไปตามแนวทางปฏิบัติอย่างเป็นทางการของเรา\" อย่างไรก็ตาม ยังคงมีความกังวลในแง่ของการใช้งานจริง เพราะแม้ว่าการสร้างแผนที่ Dead by Daylight ของตัวเองจะฟังดูน่าสนใจ แต่ความสำเร็จของมันก็ขึ้นอยู่กับว่าจะมีผู้เล่นคนอื่นเข้ามามีส่วนร่วมกับคอนเทนต์เหล่านั้นมากน้อยเพียงใด", "นอกจากระบบ Workshop แล้ว Behaviour Interactive ยังมีแผนการปรับปรุงด้านอื่น ๆ อีกมากมาย โดยเกมจะได้รับการยกเครื่องงานภาพครั้งใหญ่ ผู้เล่นจะได้เห็นการปรับปรุงระบบแสง สินทรัพย์ที่มีรายละเอียดมากขึ้น และ \"สัมผัสบรรยากาศที่สมจริงยิ่งขึ้น\" ควบคู่ไปกับการปรับปรุงแผนที่เฉพาะจุด เช่น Temple of Purgation และ Backwater Swamp นอกจากนี้ เหล่า Killer และ Survivor จะได้รับการดูแลเป็นพิเศษด้วยการ \"ปรับปรุงพื้นผิวตัวละคร สัดส่วน เส้นผม และแอนิเมชัน เพื่อให้ดูมีชีวิตชีวามากขึ้น ซึ่งรวมถึงการอัปเดตโครงสร้างตัวละคร (Rigs) การจับการเคลื่อนไหว (Motion Capture) ใหม่ และเทคโนโลยีแอนิเมชันใบหน้าแบบใหม่ที่ออกแบบมาเพื่อแสดงออกถึงความกลัว ความเจ็บปวด และการดิ้นรนของตัวละครตลอดการเล่นใน Trial ได้ดียิ่งขึ้น\"", "นอกเหนือจากสิ่งที่กล่าวมาทั้งหมดแล้ว ระบบสภาพอากาศแบบไดนามิกกำลังจะถูกเพิ่มเข้ามาในเกม ซึ่งหมายความว่าผู้เล่นจะต้องรับมือกับสภาพอากาศต่าง ๆ เช่น ฝนตก พายุฝนฟ้าคะนอง หิมะ และลมแรง ซึ่งทั้งหมดนี้สามารถส่งผลกระทบต่อการเล่นในแต่ละแมตช์ได้ นอกจากนี้ การต้อนรับผู้เล่นใหม่ (Onboarding) จะได้รับการปรับปรุงด้วยเช่นกัน โดยจะมีการเพิ่ม \"บทนำที่เป็นภาพยนตร์มากขึ้น คำอธิบายและบทช่วยสอนเกี่ยวกับกลไกของเกมที่ชัดเจนขึ้น และการแนะนำเข้าสู่ตัวเกมที่ค่อยเป็นค่อยไปมากขึ้น\" โดยการอัปเดตครั้งใหญ่นี้ทั้งหมดจะมาถึงในช่วงปี 2027 ดังนั้นโปรดติดตามข่าวสารอย่างใกล้ชิดเมื่อถึงเวลาปล่อยอัปเดตดังกล่าว"], "link": "https://www.rockpapershotgun.com/the-siren-call-of-user-generated-content-has-caught-dead-by-daylight-in-its-snare-as-behaviour-interactive-outline-a-big-revamp-update-slated-for-next-year", "canonical_link": "https://www.rockpapershotgun.com/the-siren-call-of-user-generated-content-has-caught-dead-by-daylight-in-its-snare-as-behaviour-interactive-outline-a-big-revamp-update-slated-for-next-year", "cover_image_url": "https://assetsio.gnwcdn.com/dead-by-daylight-future.jpg?width=1200&quality=85&format=jpg&auto=webp", "gallery_images": ["https://assetsio.gnwcdn.com/me-(1).jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://i.ytimg.com/vi/b2Fvy2VL9Js/hqdefault.jpg"], "videos": ["https://www.youtube.com/embed/b2Fvy2VL9Js"], "review_score": "", "published_ts": 1794951230, "published_at": "2026-11-17T21:33:50Z", "published_th": "18 พ.ย. 2026 • 04:33 น.", "category_hint": "Gaming"}, {"id": 1794951050331, "guid": "https://www.polygon.com/game-awards-2026-how-to-watch-when-date-time", "original_title": "When Are The Game Awards 2026: Date, Time, and How to Watch", "thai_title" , X, Kick, Facebook Live, Instagram Live และ PS5 Live TV นอกจากนี้ยังมีการสตรีมบน Disney Plus และ Roblox เป็นครั้งแรกอีกด้วย", "แม้ว่าผู้จัดงาน The Game Awards จะยังไม่ได้ประกาศกำหนดการความยาวของงานในปี 2026 อย่างเป็นทางการ แต่โดยปกติแล้วงานจะใช้เวลาประมาณ 3 ชั่วโมงครึ่ง รวมช่วงพรีโชว์ 30 นาที ซึ่งเป็นระยะเวลาที่ใกล้เคียงกับงานในปีที่ผ่านมา", "The Game Awards ได้ประกาศรายชื่อผู้เข้าชิงรางวัลประจำปี 2026 ไปเมื่อวันที่ 17 พฤศจิกายนที่ผ่านมา โดย Grand Theft Auto 6 กลายเป็นตัวเก็งอันดับหนึ่งสำหรับรางวัล Game of the Year ในปีนี้ โดยมีชื่อเข้าชิงในสาขา Best Action/Adventure Game, Best Narrative และ Best Art Direction ซึ่งแสดงให้เห็นว่าคณะกรรมการประทับใจในตัวเกมนี้ในทุกด้าน", "ในขณะเดียวกัน Control Resonant, Resident Evil: Requiem และ The Legend of Zelda: Ocarina of Time ก็มีโอกาสคว้ารางวัลใหญ่เช่นกัน โดย Control Resonant และ Resident Evil: Requiem ต่างได้รับเสนอชื่อเข้าชิงรางวัลละ 6 สาขา ในขณะที่ The Legend of Zelda: Ocarina of Time ถือเป็นหนึ่งในเกมที่ได้รับคำวิจารณ์ดีที่สุดแห่งปี", "แฟนเกมสามารถร่วมโหวตให้กับเกมที่ชื่นชอบได้ผ่านทางเว็บไซต์อย่างเป็นทางการของ The Game Awards โดยคะแนนโหวตเหล่านี้จะถูกนำไปตัดสินรางวัล Players' Voice และมีส่วนร่วมในการตัดสินรางวัล Game of the Year ซึ่งการตัดสินรางวัลจะใช้ระบบคะแนนผสมระหว่างคณะกรรมการ (90%) และคะแนนจากสาธารณชน (10%)"], "link": "https://www.polygon.com/game-awards-2026-how-to-watch-when-date-time/", "canonical_link": "https://www.polygon.com/game-awards-2026-how-to-watch-when-date-time", "cover_image_url": "https://static0.polygonimages.com/wordpress/wp-content/uploads/2025/11/signin-bg.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794950401, "published_at": "2026-11-17T21:20:01Z", "published_th": "18 พ.ย. 2026 • 04:20 น.", "category_hint": "Gaming"}, {"id": 1794949257428, "guid": "https://www.polygon.com/mtg-marvels-darkhold-destiny-story-interview", "original_title": "Magic: The Gathering Boss Reveals the Next Marvel Set’s Surprising Origin Story", "thai_title": "ผู้บริหาร Magic: The Gathering เผยเบื้องหลังสุดเซอร์ไพรส์ของชุดการ์ด Marvel ชุดใหม่", "tag": "Gaming", "sub_tag": "MARVEL", "bullet_points": ["Wizards of the Coast เตรียมเปิดตัวชุดการ์ด Darkhold Destiny ในปี 2027 ซึ่งเป็นการร่วมมือกับ Marvel ในรูปแบบเนื้อเรื่องใหม่ที่สร้างขึ้นเพื่อเกมนี้โดยเฉพาะ", "แรงบันดาลใจในการสร้างเนื้อเรื่องต้นฉบับมาจากเกม Guardians of the Galaxy บน Xbox ที่มีเรื่องราวเฉพาะตัวและไม่ได้อิงจากคอมิกหรือภาพยนตร์โดยตรง", "Aaron Forsythe รองประธานฝ่ายออกแบบระบุว่า Marvel ให้การสนับสนุนแนวคิดนี้อย่างเต็มที่ เนื่องจากเชื่อมั่นในศักยภาพการสร้างโลกและเรื่องราวของทีมงาน Magic", "ชุดการ์ด Marvel ก่อนหน้านี้ถูกมองว่าขาดการเล่าเรื่องที่ต่อเนื่อง ต่างจากชุด Lord of the Rings หรือ Final Fantasy ที่มีเนื้อเรื่องชัดเจน", "การนำตัวละครออริจินัลอย่าง Fraxi, Scion of Yggdrasil เข้ามามีบทบาท เพื่อสร้างประสบการณ์การเล่าเรื่องที่ลึกซึ้งยิ่งขึ้นสำหรับผู้เล่น"], "full_paragraphs": ["Magic: The Gathering ได้วางจำหน่ายชุดการ์ดในซีรีส์ Universes Beyond ที่อิงจาก Marvel Comics ไปแล้วสองชุด ได้แก่ Marvel’s Spider-Man ในปี 2025 และ Marvel Super Heroes ในปี 2026 อย่างไรก็ตาม ทีมออกแบบของเกมกำลังใช้แนวทางที่แตกต่างออกไปอย่างสิ้นเชิงสำหรับชุดที่สามที่มีชื่อว่า Darkhold Destiny ซึ่งมีกำหนดวางจำหน่ายในปี 2027 แทนที่จะเป็นเพียงการสร้างการ์ดตามตัวละครไอคอนิกหรือเหตุการณ์ในคอมิกแบบเดิม ทีมงาน Wizards of the Coast ได้ร่วมมือกับ Marvel เพื่อสร้างเนื้อเรื่องใหม่ทั้งหมดที่ออกแบบมาโดยคำนึงถึงกลไกของเกมเป็นหลัก โดย Aaron Forsythe รองประธานฝ่ายออกแบบของ Magic ได้เปิดเผยกับ Polygon ที่งาน MagicCon Atlanta ว่าแรงบันดาลใจสำหรับแนวทางใหม่นี้มาจากแหล่งที่ไม่คาดคิด", "“ลูกสาวของผมกำลังเล่นเกม Guardians of the Galaxy บน Xbox ซึ่งมีเนื้อเรื่องที่ยอดเยี่ยมมาก” Forsythe กล่าว “มันไม่ได้มาจากคอมิก ไม่ได้มาจากภาพยนตร์ พวกเขาแค่ปล่อยให้สตูดิโอเกมสร้างเรื่องราวของตัวเองที่เหมาะสมกับสื่อที่พวกเขาต้องการใช้ มันดูเหมือนว่าพวกเขาควรจะปล่อยให้เราทำแบบนั้นบ้าง”", "Forsythe กล่าวว่าเขาได้รับ “การสนับสนุนอย่างเต็มที่” (total buy-in) จาก Marvel ทันทีที่เขานำเสนอแนวคิดนี้ “ผมคิดว่าส่วนใหญ่มาจากความไว้วางใจที่เราได้สร้างขึ้นจากการทำงานในสองชุดแรกและ Secret Lair” เขากล่าว “พวกเขาเห็นว่าเราไม่ใช่แค่ทีมที่ได้รับลิขสิทธิ์ที่ต้องการเอา Hulk ไปแปะบนเสื้อยืดเท่านั้น เราสร้างโลกและเรื่องราวของเราเอง และในฐานะผู้สร้าง พวกเขาสามารถชื่นชมผลงานที่เราทำและให้ไฟเขียวแก่เราทันที”", "การพัฒนา Darkhold Destiny เริ่มต้นขึ้นก่อนที่ชุด Marvel’s Spider-Man จะวางจำหน่าย โดย Forsythe ระบุว่าชุด Universes Beyond ทั้งหมดใช้เวลาพัฒนาถึง 4 ปี ซึ่งมากกว่าระยะเวลาปกติ 3 ปีของชุดการ์ดในจักรวาล Magic เอง เนื่องจากต้องได้รับคำติชมและตรวจสอบจากพันธมิตรผู้ถือลิขสิทธิ์จำนวนมาก แต่ถึงแม้จะไม่มีคำติชมจากผู้เล่น Forsythe ก็ตระหนักว่ามีบางอย่างขาดหายไปจากชุด Spider-Man และ Marvel Super Heroes ซึ่งไม่เคยเป็นปัญหาในชุด Universes Beyond อื่นๆ", "“ชุด Marvel โดยเฉพาะนั้นไม่ได้ขับเคลื่อนด้วยเนื้อเรื่องที่แท้จริง” เขากล่าว “เรามีการ์ด Saga บางใบที่พูดถึงการตายของ Gwen Stacy ซึ่งเรารู้ว่าผู้คนรู้จักดี ส่วน The Lord of the Rings มีเนื้อเรื่องที่เป็นเส้นตรง ทุกคนรู้ว่าเรื่องราวนั้นดำเนินไปอย่างไร ใน Final Fantasy มีเรื่องราวที่เป็นเส้นตรง 16 เรื่องที่ถักทอเข้าด้วยกันในแบบที่ทุกคนที่เคยสัมผัสเกมเหล่านั้นต่างได้รับประสบการณ์ร่วมกัน แต่สำหรับ Marvel ที่มีเนื้อหามากว่า 60 ปี และเราไม่ได้ใช้ภาพยนตร์ซึ่งเป็นเรื่องราวที่ผู้คนส่วนใหญ่รู้จักในปัจจุบัน เราจึงทำได้เพียงเลือกช่วงเวลา ตัวละคร และเหตุการณ์ต่างๆ มานำเสนอ ซึ่งโดยรวมแล้วมันไม่รู้สึกว่าเป็นการเล่าเรื่องที่ต่อเนื่องเท่าไรนัก”", "ทีมออกแบบของ Magic ได้สร้างตัวละครออริจินัลขึ้นมาใหม่ชื่อว่า Fraxi, Scion of Yggdrasil ซึ่งจะปรากฏตัวใน Darkhold Destiny และในคอมิกที่เชื่อมโยงกันเคียงข้างกับตัวละครยอดนิยมของ Marvel อย่าง Thor และ Doctor Strange โดยมีเป้าหมายเพื่อตอบสนองผู้เล่น Magic ที่ต้องการเนื้อเรื่อง ในขณะเดียวกันก็ดึงดูดแฟนๆ Marvel ให้กลายเป็นผู้เล่นที่จริงจังต่อไป", "“ผมจะไม่บอกว่าไม่มีแฟนๆ ขาจรที่แค่ต้องการซื้อการ์ด Spider-Man แล้วกลับบ้าน” Forsythe กล่าว “แต่ส่วนใหญ่เมื่อคุณได้ลองสัมผัส เมื่อคุณเริ่มสร้างเด็ค เมื่อคุณเห็นเด็ค Commander ของเพื่อน เมื่อคุณออนไลน์และเริ่มอ่านเกี่ยวกับสิ่งต่างๆ ที่มีอยู่ เมื่อคุณไปที่ร้านค้า หรือไปร่วมทัวร์นาเมนต์หรือคอนเวนชัน แน่นอนว่า Spider-Man อาจเป็นจุดเริ่มต้นที่ดึงคุณเข้ามา แต่มันจะเปิดประตูสู่โลกที่กว้างใหญ่และน่าทึ่งนี้”", "Forsythe กล่าวว่า Darkhold Destiny และชุด Universes Beyond อีกสองชุดที่ยังไม่ได้ประกาศซึ่งจะวางจำหน่ายในปีหน้า จะรวมเอาคำติชมที่ได้รับจากผู้เล่นเกี่ยวกับการครอสโอเวอร์ต่างๆ ของเกมเข้ามาด้วย เขาหวังว่าการปรับปรุงเหล่านี้จะกระตุ้นให้ผู้เล่น Magic ที่ยังกังขาได้เปิดใจให้กับ Universes Beyond มากขึ้น เนื่องจากชุดการ์ดที่มีลิขสิทธิ์เหล่านี้ยังช่วยดึงผู้เล่นที่ห่างหายไปให้กลับเข้าสู่วงการอีกครั้ง", "“มีผู้ชมบางส่วนที่ยึดติดกับ IP ของ Magic และต่อต้าน Universes Beyond โดยคิดว่า ‘เราจะแสดงให้พวกเขาเห็น! เราทุกคนจะซื้อ Reality Fracture!’” Forsythe กล่าว “ผมเพียงแค่อยากจะบอกว่า Universes Beyond กำลังดึงดูดแฟนใหม่ๆ และยังช่วยปลุกกระแสให้ผู้คนกลับมาเล่นอีกครั้ง ผมได้ยินมา 25 ครั้งในช่วงสองวันที่ผ่านมาว่ามี IP บางอย่างที่ช่วยกระตุ้นให้คนกลับมา เช่น ‘ผมเกือบลืม Magic ไปแล้ว แต่มันสนุกมาก และสิ่งที่คุณทำทำให้ผมกลับมา และตอนนี้ผมก็อยู่ที่นี่’”"], "link": "https://www.polygon.com/mtg-marvels-darkhold-destiny-story-interview/", "canonical_link": "https://www.polygon.com/mtg-marvels-darkhold-destiny-story-interview", "cover_image_url": "https://static0.polygonimages.com/wordpress/wp-content/uploads/2026/10/magic-darkhold-destiny-3.jpg", "gallery_images": ["https://static0.polygonimages.com/wordpress%2Fwp-content%2Fauthors%2F685906f119d78-P2230974.jpg?fit=crop&w=90&h=90", "https://static0.polygonimages.com/wordpress/wp-content/uploads/2026/04/guardians-of-the-galaxy-team-lineup.jpg?q=49&fit=crop&w=825&dpr=2", "https://static0.polygonimages.com/wordpress/wp-content/uploads/2025/07/babe984goqiqwuefhcosb_1920x1000.jpg?q=49&fit=crop&w=825&dpr=2", "https://static0.polygonimages.com/wordpress/wp-content/uploads/sharedimages/2024/11/mixcollage-24-nov-2024-11-09-pm-6745.jpg?q=50&fit=crop&w=32&h=32&dpr=1.5"], "videos": [], "review_score": "", "published_ts": 1794949217, "published_at": "2026-11-17T21:00:17Z", "published_th": "18 พ.ย. 2026 • 04:00 น.", "category_hint": "Gaming"}, {"id": 1794950156586, "guid": "1963223", "original_title": "This Fighting Game Is Nominated For A TGA Despite Development Shutting Down", "thai_title": "2XKO ได้รับการเสนอชื่อเข้าชิงรางวัล The Game Awards แม้ประกาศยุติการพัฒนาแล้ว", "tag": "Gaming", "sub_tag": "GAMING", "bullet_points": ["2XKO เกมแนวต่อสู้จาก Riot Games ได้รับการเสนอชื่อเข้าชิงรางวัล Best Fighting Game ในงาน The Game Awards 2026", "Riot Games ประกาศยุติการพัฒนาเกมอย่างเป็นทางการภายในสิ้นปี 2026 เนื่องจากฐานผู้เล่นไม่ยั่งยืนตามเป้าหมาย", "ในสาขาเดียวกันยังมีเกมอย่าง Invincible Vs. ที่กำลังเผชิญปัญหาด้านบุคลากรและการอัปเดตในอนาคต", "Grand Theft Auto VI ครองแชมป์ได้รับเสนอชื่อเข้าชิงมากที่สุดถึง 8 สาขา รวมถึงรางวัล Game of the Year", "งานประกาศรางวัล The Game Awards 2026 จะจัดขึ้นในวันที่ 10 ธันวาคมนี้ ที่ Peacock Theater ลอสแอนเจลิส"], "full_paragraphs": ["เมื่อช่วงเช้าที่ผ่านมา Geoff Keighley ได้ประกาศรายชื่อผู้เข้าชิงรางวัลทั้งหมดสำหรับงาน The Game Awards 2026 ซึ่งเป็นงานเฉลิมฉลองประจำปีของวงการเกมที่จัดขึ้นในลอสแอนเจลิส ท่ามกลางรายชื่อเกมที่หลายคนคาดการณ์ไว้ว่าจะติดโผ เช่น Grand Theft Auto VI, The Legend of Zelda: Ocarina of Time และ Control Resonant กลับมีชื่อหนึ่งที่สร้างความประหลาดใจนั่นคือ 2XKO ซึ่งได้รับการเสนอชื่อเข้าชิงในสาขา Best Fighting Game แม้ว่า Riot Games จะประกาศยุติวงจรชีวิตของเกมนี้ไปแล้วเมื่อช่วงต้นปีที่ผ่านมาก็ตาม", "Riot Games ได้ประกาศว่าการพัฒนาอย่างต่อเนื่อง (Active development) สำหรับเกมต่อสู้ที่นำตัวละครจาก League of Legends มาโลดแล่นนี้ จะสิ้นสุดลงในเดือนธันวาคม 2026 โดย Riot ระบุในขณะนั้นว่า “ในช่วงไม่กี่เดือนที่ผ่านมา เราได้ติดตามวิถีของ 2XKO อย่างใกล้ชิด และสิ่งที่เราเห็นได้สะท้อนภาพที่ชัดเจนและสอดคล้องกัน แม้ว่าจะมีผู้เล่นจำนวนมากเข้ามาทดลองเล่นเกมและมีชุมชนที่น่าทึ่งซึ่งเล่นเกมนี้อยู่ทุกวัน แต่เรายังไม่เห็นจำนวนผู้เล่นที่เหนียวแน่นเพียงพอที่จะนำไปสู่เส้นทางที่ยั่งยืนได้”", "ทางทีมงาน 2XKO ได้ทวีตข้อความผ่านบัญชีทางการว่า “แม้การพัฒนาอย่างต่อเนื่องจะสิ้นสุดลง แต่ทีมงาน 2XKO จะยังคงอยู่จนถึงสิ้นปี 2026 เป้าหมายของเราในตอนนี้คือการทำสิ่งที่ถูกต้องให้กับผู้เล่นที่ได้ลงทุนกับเรามาโดยตลอด”", "สำหรับเกม 2XKO ในสาขา Best Fighting Game นั้น ต้องแข่งขันกับเกมอื่นๆ ได้แก่ Invincible Vs., Marvel Tokon: Fighting Souls, Avatar Legends และ My Hero Academia: All’s Justice โดย 2XKO ไม่ใช่เกมเดียวในรายชื่อนี้ที่อนาคตกำลังสั่นคลอน เพราะหลังจากที่ Invincible Vs. เปิดตัวในเดือนเมษายนที่ผ่านมา ผู้พัฒนาอย่าง Quarter up ก็มีรายงานว่าได้เลิกจ้างพนักงานไปถึง 75% พร้อมระบุว่าการอัปเดตในอนาคตจะขึ้นอยู่กับยอดขายโดยรวมของเกมเป็นหลัก", "ในส่วนของภาพรวมการประกาศรางวัลปีนี้ Grand Theft Auto VI ได้รับการเสนอชื่อเข้าชิงมากที่สุดถึง 8 สาขา รวมถึงรางวัลใหญ่ที่สุดอย่าง Game of the Year ในขณะที่ Control Resonant และ Resident Evil Requiem ครองอันดับสองร่วมกันด้วยจำนวน 6 สาขา ส่วน Phantom Blade Zero ตามมาเป็นอันดับสามด้วย 5 สาขา ในด้านของค่ายเกม Nintendo เป็นผู้จัดจำหน่ายที่ได้รับเสนอชื่อเข้าชิงมากที่สุดรวม 12 สาขา จากทั้งหมด 30 รางวัลในงาน", "งานประกาศรางวัล The Game Awards มีกำหนดจัดขึ้นในวันที่ 10 ธันวาคมนี้ โดยจะมีการถ่ายทอดสดจาก Peacock Theater ในลอสแอนเจลิส รัฐแคลิฟอร์เนีย"], "link": "https://www.gamespot.com/articles/this-fighting-game-is-nominated-for-a-tga-despite-development-shutting-down/", "canonical_link": "https://www.gamespot.com/articles/this-fighting-game-is-nominated-for-a-tga-despite-development-shutting-down", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/2xko.jpg?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794949157, "published_at": "2026-11-17T20:59:17Z", "published_th": "18 พ.ย. 2026 • 03:59 น.", "category_hint": "Gaming"}, {"id": 1794949257430, "guid": "U3R22DE7AXzxDYF2MHDBBm", "original_title": "Tomb Raider developer makes fifth round of layoffs in less than 2 years", "thai_title": "Crystal Dynamics สตูดิโอผู้สร้าง Tomb Raider ประกาศปลดพนักงานรอบที่ 5 ในรอบไม่ถึง 2 ปี", "tag": "Gaming", "sub_tag": "PC GAMING", "bullet_points": ["Crystal Dynamics ยืนยันการเลิกจ้างพนักงานจำนวน 8 คน โดยระบุว่าเป็นความจำเป็นทางธุรกิจ", "นี่นับเป็นการปลดพนักงานครั้งที่ 5 ของสตูดิโอในระยะเวลาไม่ถึง 2 ปี รวมพนักงานที่ถูกเลิกจ้างแล้วกว่า 70 คน", "ทางสตูดิโอยืนยันว่าการปรับลดพนักงานครั้งนี้จะไม่ส่งผลกระทบต่อโปรเจกต์เกมที่กำลังพัฒนาอยู่ในปัจจุบัน", "ในช่วงที่ผ่านมาสตูดิโอต้องเผชิญกับความล่าช้าของโปรเจกต์เกม Tomb Raider หลายภาค รวมถึงการยกเลิกโปรเจกต์ Perfect Dark ที่พัฒนาร่วมกับ The Initiative"], "full_paragraphs": ["Crystal Dynamics ได้ออกมายืนยันอย่างเป็นทางการว่ามีการเลิกจ้างพนักงานจำนวน 8 คน ซึ่งถือเป็นการปรับลดพนักงานครั้งล่าสุดของสตูดิโอผู้พัฒนาเกมซีรีส์ Tomb Raider ที่กำลังเผชิญกับสถานการณ์ที่ยากลำบาก", "ทางสตูดิโอได้ให้สัมภาษณ์กับ PC Gamer หลังจากที่มีรายงานข่าวเรื่องนี้ออกมาครั้งแรกโดย Vertical Slice ว่า 'Crystal Dynamics ได้ตัดสินใจเรื่องทางธุรกิจที่ยากลำบากแต่มีความจำเป็น ในการลดจำนวนพนักงานปัจจุบันของสตูดิโอลง 8 คน'", "แถลงการณ์ระบุเพิ่มเติมว่า 'ทุกครั้งที่เรามีการปรับเปลี่ยนบทบาทหน้าที่ในโปรเจกต์ต่างๆ เราได้พยายามอย่างเต็มที่ในการหาตำแหน่งงานใหม่ให้กับเพื่อนร่วมงานที่ยอดเยี่ยมของเราก่อนเสมอ โดยพนักงานทุกคนที่ได้รับผลกระทบจะได้รับเงินชดเชยเต็มจำนวน รวมถึงความช่วยเหลือในการจัดหางานใหม่เพื่อช่วยให้พวกเขาผ่านช่วงเปลี่ยนผ่านนี้ไปได้ เราขออวยพรให้พวกเขาโชคดีและหวังว่าจะได้ร่วมงานกันอีกในอนาคต'", "นอกจากนี้ ทางสตูดิโอยังได้ยืนยันว่าการปรับลดพนักงานในครั้งนี้จะไม่ส่งผลกระทบต่อโปรเจกต์เกมใดๆ ที่กำลังอยู่ระหว่างการพัฒนาในขณะนี้", "หากพิจารณาจากตัวเลขจำนวน 8 คน อาจดูไม่มากนักเมื่อเทียบกับการเลิกจ้างในสตูดิโออื่นๆ เช่น กรณีของ Firaxis ที่มีรายงานว่ามีการปลดพนักงานไปราว 60 คนในวันเดียวกัน อย่างไรก็ตาม สถานการณ์ของ Crystal Dynamics กลับน่ากังวลเนื่องจากสตูดิโอแห่งนี้ประสบปัญหาภายในมาอย่างต่อเนื่อง โดยนี่ถือเป็นการปลดพนักงานอย่างน้อยครั้งที่ 5 ในระยะเวลาไม่ถึง 2 ปี และเกิดขึ้นเพียง 8 เดือนหลังจากรอบการปลดพนักงานครั้งล่าสุด ซึ่งรวมแล้วมีพนักงานถูกเลิกจ้างไปแล้วประมาณ 70 คนในช่วงเวลาดังกล่าว", "ที่ผ่านมาสตูดิโอยังประสบปัญหาในการดำเนินงานกับแฟรนไชส์เรือธงอย่าง Tomb Raider โดยหลังจากที่ Crystal Dynamics ได้สิทธิ์ในการดูแลทรัพย์สินทางปัญญานี้กลับคืนมาในปี 2022 ไม่นานหลังจากถูกซื้อกิจการโดย Embracer แต่ในเดือนมิถุนายนที่ผ่านมา เกม Tomb Raider: Legacy of Atlantis ซึ่งเป็นการรีเมคเกมภาคต้นฉบับ ก็ถูกเลื่อนวางจำหน่ายออกไปเป็นเดือนกุมภา ่ที่ว่า Grand Theft Auto 6 จะได้รับการเสนอชื่อเข้าชิงหรือไม่ แต่อยู่ที่ว่าจะได้เข้าชิงกี่สาขากันแน่ และเมื่อทุกอย่างชัดเจนแล้ว ผลลัพธ์ที่ออกมาก็เป็นไปตามที่คาดการณ์ไว้แทบทุกประการ", "อย่างไรก็ตาม ตัวเลขนี้ยังคงน้อยกว่าสถิติที่ Clair Obscur: Expedition 33 เกมแนว Parry Simulator สุดรักจากค่าย Sandfall Interactive เคยทำไว้ ซึ่ง Oli Welsh จาก Polygon เคยวิเคราะห์ไว้ก่อนหน้านี้ว่า การที่ GTA 6 จะทำลายสถิติดังกล่าวนั้นเป็นเรื่องที่เป็นไปไม่ได้", "ในปี 2025 เกม Clair Obscur ได้รับการเสนอชื่อเข้าชิงถึง 13 สาขาและคว้ารางวัลไปได้ถึง 9 สาขา นั่นหมายความว่าแม้ GTA 6 จะชนะในทุกสาขาที่เข้าชิง ก็ยังไม่สามารถทำลายสถิติของ Clair Obscur ได้ โดยทำได้ดีที่สุดเพียงแค่เสมอเท่านั้น ขึ้นอยู่กับผลโหวตในสาขา Player’s Voice ที่ตัดสินโดยคะแนนจากมหาชน ทั้งนี้ Clair Obscur ยังได้เปรียบในสาขาที่ GTA 6 ไม่มีสิทธิ์เข้าชิงอย่าง Best Indie Game และ Best Debut Indie Game รวมถึงสาขา Best Performance ที่ Clair Obscur กวาดไปถึง 3 ชื่อ (Ben Starr, Charlie Cox และ Jennifer English ซึ่งเป็นผู้ชนะในสาขานี้)", "ไม่ว่าจะเกิดอะไรขึ้น การเข้าชิงรางวัลของ GTA 6 ได้เผยให้เห็นรายละเอียดของเกมที่ผู้คนรอคอยอย่างบ้าคลั่ง ทั้งที่จนถึงปัจจุบันเราได้เห็นเพียงสื่อประชาสัมพันธ์และข้อมูลที่คัดสรรมาแล้วเท่านั้น การเข้าชิงสาขา Best Score and Music ยืนยันว่ามาตรฐานเพลงประกอบระดับตำนานของซีรีส์ Grand Theft Auto ยังคงแข็งแกร่ง ส่วนสาขา Best Game Direction ก็ตอกย้ำถึงความเชี่ยวชาญในการออกแบบเกมของ Rockstar Games และการที่สามารถเข้าชิงสาขา Best Narrative ได้ ในปีที่มีเกมเนื้อเรื่องเข้มข้นมากมาย (แม้จะไม่มีชื่อของ Fire Emblem: Fortune’s Weave ที่มีเนื้อเรื่องซับซ้อนและทะเยอทะยานก็ตาม) บ่งบอกว่า GTA 6 อาจมีมิติที่ลึกซึ้งกว่าแค่เกมแนว Sandbox ที่เต็มไปด้วยความวุ่นวาย", "แต่สิ่งที่น่าสนใจที่สุดอาจเป็นการเข้าชิงสาขา Best Performance ของ Perez แม้ทาง The Game Awards จะไม่ได้ระบุอย่างเป็นทางการว่าเธอรับบทเป็นใครใน GTA 6 แต่รางวัลในสาขานี้มักจะมอบให้กับตัวละครหลัก ซึ่งสอดคล้องกับข่าวลือที่มีมาอย่างยาวนานในหมู่แฟนเกมว่า Perez รับบทเป็น Lucia หนึ่งในตัวละครเอกของเกม การที่ GTA 6 ได้เข้าชิงสาขานี้เพียงชื่อเดียว อาจตีความได้สองทางคือ เธอเป็นน ed-peak-sauron", "cover_image_url": "https://static0.polygonimages.com/wordpress/wp-content/uploads/2026/11/we-ve-almost-reached-peak-sauron.png", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794947640, "published_at": "2026-11-17T20:34:00Z", "published_th": "18 พ.ย. 2026 • 03:34 น.", "category_hint": "Gaming"}, {"id": 1794946557916, "guid": "1962964", "original_title": "Civilization Dev Lays Off 1/3 Of  Staff, New XCOM Game Facing “Development Struggles” – Report", "thai_title": "Firaxis Games สตูดิโอผู้สร้าง Civilization ปลดพนักงาน 1 ใน 3 พร้อมเผยความคืบหน้าเกม XCOM ภาคใหม่ที่กำลังประสบปัญหา", "tag": "Gaming", "sub_tag": "GAMING", "bullet_points": ["Firaxis Games สตูดิโอในเครือ 2K ประกาศปลดพนักงานประมาณ 60 คน หรือคิดเป็น 1 ใน 3 ของพนักงานทั้งหมด", "Heather Hazen หัวหน้าสตูดิโอ Firaxis ตัดสินใจก้าวลงจากตำแหน่งท่ามกลางการปรับโครงสร้างองค์กรครั้งนี้", "รายงานระบุว่าเกม XCOM ภาคใหม่ที่กำลังพัฒนาอยู่กำลังเผชิญกับปัญหาด้านการพัฒนาอย่างหนักและพลาดเป้าหมายสำคัญในช่วงฤดูร้อนที่ผ่านมา", "การปรับลดพนักงานครั้งนี้มีเป้าหมายเพื่อมุ่งเน้นไปที่การออกแบบ เทคโนโลยี และประสบการณ์ของผู้เล่นสำหรับอนาคตของสตูดิโอ", "Sid Meier’s Civilization VII ซึ่งเป็นผลงานล่าสุดของสตูดิโอประสบปัญหาทางเทคนิคมากมายในช่วงเปิดตัวเมื่อเดือนกุมภาพันธ์ 2025"], "full_paragraphs": ["วิกฤตการณ์ในอุตสาหกรรมวิดีโอเกมยังคงดำเนินต่อไป ล่าสุด 2K ซึ่งเป็นบริษัทในเครือของ Take-Two ได้ยืนยันว่า Firaxis Games สตูดิโอผู้พัฒนาเกมซีรีส์ Civilization และ XCOM ได้ทำการปลดพนักงานออกถึง 1 ใน 3 ของจำนวนพนักงานทั้งหมด", "สำนักข่าว Bloomberg ได้ยืนยันข้อมูลการเลิกจ้างดังกล่าวว่าจะส่งผลกระทบต่อพนักงานประมาณ 60 คน โดยเป็นส่วนหนึ่งของการปรับโครงสร้างองค์กร ซึ่งรวมถึงการที่ Heather Hazen หัวหน้าสตูดิโอ Firaxis ได้ตัดสินใจลาออกจากตำแหน่งด้วย", "โฆษกของ Firaxis ได้ยืนยันการปรับโครงสร้างนี้กับ Bloomberg โดยระบุว่าการเลิกจ้างครั้งนี้เป็นความพยายามที่จะ 'มุ่งเน้นไปที่การออกแบบ เทคโนโลยี และประสบการณ์ของผู้เล่น'", "โฆษกกล่าวเสริมว่า 'การตัดสินใจเหล่านี้ไม่ใช่เรื่องง่ายเลย แต่มันเป็นสิ่งจำเป็นสำหรับการสร้างบทต่อไปของ Firaxis'", "ตามรายงานจากแหล่งข่าวของ Bloomberg ระบุว่าในขณะนี้ Firaxis กำลังพัฒนาเกม XCOM ภาคใหม่ แต่โครงการดังกล่าวกลับต้องเผชิญกับ 'ปัญหาด้านการพัฒนา' และพลาดเป้าหมายสำคัญไปในช่วงฤดูร้อนที่ผ่านมา แม้ว่าตัวเกมจะยังคงเดินหน้าพัฒนาต่อไป แต่แหล่งข่าวระบุว่าโครงการอาจต้องมีการปรับเปลี่ยนครั้งใหญ่เนื่องจากการเลิกจ้างพนักงานในครั้งนี้", "สำหรับผลงานล่าสุดของ Firaxis อย่าง Sid Meier’s Civilization VII นั้นได้วางจำหน่ายไปเมื่อเดือนกุมภาพันธ์ 2025 โดยประสบปัญหาทางเทคนิคมากมายในช่วงเปิดตัว แม้ว่าประสบการณ์การเล่นจะได้รับการปรับปรุงให้ดีขึ้นผ่านการอัปเดตต่างๆ ในภายหลังก็ตาม โดยปัจจุบันซีรีส์ Civilization มียอดขายรวมกันมากกว่า 80 ล้านชุดทั่วโลก", "ในส่วนของซีรีส์ XCOM ผลงานล่าสุดจาก Firaxis คือ XCOM: Chimera Squad ที่วางจำหน่ายในปี 2020 และก่อนหน้านั้นคือ XCOM 2 ในปี 2016", "ทั้งนี้ Firaxis ก่อตั้งขึ้นโดย Sid Meier ในปี 1996 ซึ่งในปี 2026 ที่จะถึงนี้จะเป็นการครบรอบ 30 ปีของสตูดิโอ โดย Take-Two ได้เข้าซื้อกิจการบริษัทในปี 2005 และนำสตูดิโอรวมถึงแฟรนไชส์ต่างๆ เข้ามาอยู่ภายใต้การดูแลของ 2K"], "link": "https://www.gamespot.com/articles/civilization-dev-lays-off-1-3-of-staff-new-xcom-game-facing-development-struggles-report/", "canonical_link": "https://www.gamespot.com/articles/civilization-dev-lays-off-1-3-of-staff-new-xcom-game-facing-development-struggles-report", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/civ7.png?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794945942, "published_at": "2026-11-17T20:05:42Z", "published_th": "18 พ.ย. 2026 • 03:05 น.", "category_hint": "Gaming"}, {"id": 1794952873688, "guid": "4afa7653-27a2-4274-ad9c-3e4730f0c287", "original_title": "Nearly Half of Polled IGN Readers Are Taking Time Off to Play GTA 6", "thai_title": "ผลสำรวจเผยแฟนเกมเกือบครึ่งเตรียมลางานเพื่อเล่น GTA 6", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["ผลสำรวจจากผู้อ่าน IGN กว่า 39,000 คน พบว่า 46.5% วางแผนจะลางานหรือใช้สิทธิ์วันลาเพื่อเล่น GTA 6 ในวันวางจำหน่าย", "นักเศรษฐศาสตร์คาดการณ์ว่าเศรษฐกิจสหรัฐ  3 ทศวรรษ นับตั้งแต่ภาพยนตร์เรื่อง GoldenEye ในปี 1995", "ความกังวลเรื่องการเปลี่ยนแบรนด์นาฬิกาเกิดขึ้นเนื่องจาก Robert Pattinson เป็นแบรนด์แอมบาสเดอร์ให้กับ Jaeger-LeCoultre คู่แข่งของ Omega", "ตัวอย่างเปิดตัวของ 007 First Light ไม่ได้มีการโชว์นาฬิกาที่ชัดเจน ทำให้เกิดการคาดเดาว่าอาจมีการเปลี่ยนแปลงพันธมิตรทางธุรกิจในอนาคต", "หากมีการเปลี่ยนแบรนด์จริง Jaeger-LeCoultre รุ่น Reverso อาจเป็นตัวเลือกที่น่าสนใจสำหรับลูกเล่นสายลับในอนาคต"], "full_paragraphs": ["หลังจากผ่านการค้นหาและมีรายชื่อตัวเก็งมากมาย ในที่สุด Robert Pattinson ก็ได้รับเลือกให้เป็นนักแสดงคนต่อไปที่จะมารับบท James Bond ซึ่งการประกาศนี้ได้นำไปสู่คำถามมากมายว่าเขาโด่งดังเกินไปหรือมีอายุมากเกินไปสำหรับบทบาทนี้หรือไม่ รวมถึงภาพลักษณ์ของเขาจะดูเหมือน James Bond หรือไม่ และการแสดงของเขาจะแตกต่างจากนักแสดงคนก่อนๆ อย่างไร อย่างไรก็ตาม สำหรับบางคนคำถามที่เกิดขึ้นนั้นตรงไปตรงมามากกว่า นั่นคือ เขาจะสวมใส่นาฬิกาเรือนไหน?", "James Bond มีความสัมพันธ์กับแบรนด์สินค้าที่ชัดเจนมาอย่างยาวนาน แต่หนึ่งในพันธมิตรที่ยืนหยัดมาได้นานที่สุดคือผู้ผลิตนาฬิกาสุดหรูอย่าง Omega โดย Bond ปรากฏตัวพร้อมกับนาฬิกา Omega ครั้งแรกในภาพยนตร์เรื่อง GoldenEye ปี 1995 และล่าสุดได้สวมใส่ Seamaster Diver 300m รุ่นล่าสุดในผลงานเกม 007 First Light ของปีนี้ แม้จะไม่ใช่ภาพยนตร์ภาคใหม่ แต่ 007 First Light ก็ได้นำเสนอ Seamaster ในรูปแบบที่เป็นเอกลักษณ์เฉพาะตัว ซึ่งถือเป็นครั้งแรกที่สร้างขึ้นสำหรับวิดีโอเกมโดยเฉพาะ และ Omega ได้เพิ่มรุ่นนี้เข้าไปในคอลเลกชัน 007 ที่วางจำหน่ายให้แฟนๆ ได้จับจองกัน", "ดังนั้น เมื่อพิจารณาว่าความสัมพันธ์นี้ดำเนินมาถึง 3 ทศวรรษ เหตุใด 007 First Light จึงอาจเป็นผลงานชิ้นสุดท้ายที่ James Bond สวมใส่นาฬิกา Omega? คำตอบง่ายๆ คือ Robert Pattinson ไม่ได้สวมใส่นาฬิกาแบรนด์นี้ และเมื่อไม่นานมานี้เขาได้กลายเป็นแบรนด์แอมบาสเดอร์ให้กับ Jaeger-LeCoultre ซึ่งเป็นคู่แข่งสัญชาติสวิสของ Omega แม้จะยังไม่มีการยืนยันว่าภาระผูกพันของ Pattinson จะส่งผลโดยตรงต่อข้อตกลงระหว่าง Omega กับ Amazon ซึ่งเป็นเจ้าของสิทธิ์ James Bond รายใหม่หรือไม่ แต่การที่ไม่มีการโชว์นาฬิกาใดๆ เลยในตัวอย่างเปิดตัว (Announcement Trailer) ก็ทำให้เกิดการคาดเดาไปต่างๆ นานา", "ในยุคของ Daniel Craig เขาถือเป็นแอมบาสเดอร์หลักของ Omega โดยมักจะสวมใส่นาฬิการุ่นที่ยังไม่วางจำหน่ายเพื่อสร้างกระแสก่อนการเปิดตัวจริง แต่กรณีของ Pattinson อาจไม่เป็นเช่นนั้น ซึ่งอาจบ่งชี้ถึงการเปลี่ยนแปลงของนาฬิกาที่ Bond จะเลือกใช้ในอนาคต", "หาก Bond เปลี่ยนจาก Omega ไปสู่ Jaeger-LeCoultre ก็ถือว่ามีความเหมาะสมในระดับหนึ่ง เนื่องจากผู้ผลิตนาฬิการายนี้มีผลงานที่หรูหราและมีประวัติศาสตร์อันยาวนานในแต่ละรุ่น แต่ไม่มีรุ่นไหนที่ดูสมเหตุสมผลไปกว่ารุ่น Reverso ที่มีรูปทรงสี่เหลี่ยม นาฬิการุ่นนี้มีการออกแบบที่โดดเด่น ช่วยให้ผู้สวมใส่สามารถหมุนหน้าปัดและพลิกกลับด้านได้ 180 องศา พร้อมดีไซน์ที่หลากหลายที่ด้านหลัง เดิมทีนาฬิการุ่นนี้ถูกสร้างขึ้นสำหรับนักกีฬาโปโลเพื่อปกป้องหน้าปัดนาฬิกาอันมีค่า ซึ่งเราสามารถมองเห็นศักยภาพในการนำไปประยุกต์ใช้เป็นอุปกรณ์สายลับ (Gadget) ที่แปลกใหม่และสร้างสรรค์ในดีไซน์แบบนี้ได้", "หรือบางที Pattinson อาจจะปรากฏตัวพร้อมกับ Seamaster Diver 300m อีกครั้ง และเรื่องราวทั้งหมดนี้อาจเป็นเพียงการคาดเดาไปเอง แต่ถ้าหากเขาไม่ได้สวมใส่มัน และนี่คือครั้งสุดท้ายที่เราจะได้เห็น Bond กับ Omega อย่างน้อย 007 First Light ก็ได้นำเสนอหนึ่งในนาฬิกาที่ยอดเยี่ยมที่สุดในคอลเลกชันทั้งหมดนี้แล้ว"], "link": "https://www.gamespot.com/articles/007-first-light-might-be-the-end-of-the-line-for-james-bonds-favorite-watch/", "canonical_link": "https://www.gamespot.com/articles/007-first-light-might-be-the-end-of-the-line-for-james-bonds-favorite-watch", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/omega-seamaster-diver-300m-chronograph-007-first-light-lead.webp?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794945420, "published_at": "2026-11-17T19:57:00Z", "published_th": "18 พ.ย. 2026 • 02:57 น.", "category_hint": "Gaming"}, {"id": 1794946557920, "guid": "1962894", "original_title": "These Are Some Of The Biggest Snubs At The Game Awards 2026", "thai_title": "เปิดรายชื่อเกมที่น่าเสียดายและถูกมองข้ามในการประกาศรางวัล The Game Awards 2026", "tag": "Gaming", "sub_tag": "GAMING", "bullet_points": ["การประกาศรายชื่อผู้
