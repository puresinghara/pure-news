n, Bournemouth หรือ Bristol โดยมีการวงกลมและไฮไลต์เส้นทางปั่นจักรยาน ถนนในชนบท และสวนสาธารณะเอาไว้ มันคือสมุดบันทึกแห่งประสบการณ์ที่บอกเล่าเรื่องราวว่าผมเคยไปที่ไหนและพบเจออะไรมาบ้าง แผนที่มีเวทมนตร์ในตัวของมันเอง มันมีความสามารถในการเตือนให้คุณระลึกถึงเส้นทางที่คุณเคยเดินผ่านมาและเส้นทางที่คุณยังไม่ได้ไป", "บางทีนั่นอาจเป็นเหตุผลที่ผมรักเกมแนว Metroidvania มาก เพราะจริงๆ แล้วตัวเกมก็คือแผนที่นั่นเอง มีอะไรที่น่าหลงใหลไปกว่าการเอามือทาบไปบนผนังที่กั้นคุณไว้ แล้วรู้ว่าที่ไหนสักแห่งมีเส้นทางลับที่นำไปสู่อีกฝั่งหนึ่ง? ตลอดหลายปีที่ผ่านมา คุณจะพัฒนาสัญชาตญาณสำหรับเรื่องนี้ คุณจะได้เล่นเกมไล่ล่ากับวิศวกรสุดซาดิสต์ที่สร้างพื้นที่เขาวงกตเหล่านี้ คุณอาจจะพูดว่า 'ฉันเห็นมุมที่ดูน่าสงสัยนั่นนะ' แล้วกระโดดทะลุหลังคาไป หรือ 'ฉันเห็นกำแพงที่ดูผิดปกติก้อนนั้น' แล้วเดินทะลุภาพลวงตานั้นไป", "และ Castlevania: Belmont's Curse ก็มีสิ่งเหล่านี้ให้อย่างเต็มเปี่ยม มีความละเอียดอ่อนที่ซ่อนอยู่ตามถนนในปารีสและภายในปราสาทของแดรกคูลามากมาย จนทำให้ผมรู้สึกเหมือนถูกส่งกลับไปเป็นเด็กอีกครั้ง ในตอนที่ผมคอยกด D-Pad ไปตามผนังทุกด้านใน Castlevania: Symphony of the Night เพื่อพยายามค้นหาความลับของมัน", "การที่ Evil Empire ผู้พัฒนา Dead Cells เข้ามาดูแลซีรีส์นี้ถือเป็นการให้เกียรติต่อตำนาน Belmont อย่างแท้จริง เริ่มต้นจาก Rose Belmont ลูกสาวผู้เป็นทายาทของ Trevor Belmont และ Sypha Belnades จาก Castlevania 3 ซึ่งเธอเองก็เป็นนักล่าแวมไพร์ผู้กล้าหาญ Belmont's Curse ทดสอบความมุ่งมั่นของเธออย่างหนักเมื่อสมุนของแดรกคูลาสร้างความวุ่นวายในปารีสที่ล่มสลายในปี 1499 เกมมีบทสอนเล่นที่ยาวนานเพื่อแนะนำกลไกหลักของเธอ นั่นคือชุดไพ่ทาโรต์ที่สามารถผนึกวิญญาณของผู้ที่ถูกครอบงำโดยราชาแวมไพร์ จากนั้นคุณก็จะกลับเข้าสู่ส่วนลึกของปราสาทแดรกคูลา กระโดด ใช้แส้ และสำรวจแผนที่อันกว้างใหญ่ พร้อมปลดล็อกพื้นที่ใหม่ๆ เมื่อคุณได้รับทักษะเพิ่มขึ้น คุณจะได้สืบหาเบาะแสว่าศัตรูหลักคือใครและอยู่ที่ไหน ค่อยๆ เผยให้เห็นเครือข่ายความลับที่เชื่อมโยงกันในขณะที่คุณกลายเป็นส่วนหนึ่งของเรื่องราวที่มีอายุกว่า 500 ปี", "มันให้ความรู้สึกเหมือน Castlevania แบบ 2D ไม่เคยจากไปไหน แต่ในรอบ 17 ปีนับตั้งแต่การวางจำหน่าย Castlevania: The Adventure ReBirth (ซึ่งเป็นเกมรีเมคจากปี 1989) มีเกมแนวนี้เกิดขึ้นใหม่มากมายที่แย่งชิงบัลลังก์ 'Metroidvania' ไม่ว่าจะเป็น Prince of Persia: The Lost Crown, Hollow Knight, Animal Well, Ori และ Metroid ภาคใหม่ๆ ในขณะที่แดรกคูลาจมอยู่กับการเป็นอมตะที่ไม่มีวันตาย โลกก็ได้ก้าวต่อไปแล้ว สิ่งที่เขาให้กำเนิดขึ้นมาใหม่นั้นรวดเร็วขึ้น ดุดันขึ้น และลึกลับขึ้น ซึ่ง Evil Empire ก็เข้าใจจุดนี้ดี", "บางสิ่งที่ Belmont's Curse นำเสนอนั้นได้รับแรงบันดาลใจมาอย่างยอดเยี่ยม วิธีที่กระจกทุกบานเชื่อมต่อกันนั้นทำออกมาได้อย่างเหนือชั้น ปริศนาที่ใช้ดนตรีในส่วนลึกของมหาวิหาร Notre-Dame นั้นยอดเยี่ยมมาก ส่วนการกระโดดข้ามสิ่งกีดขวางที่พาคุณขึ้นไปยังหอคอยนาฬิกานั้นก็ทำได้ดี... เมื่อฟันเฟืองทุกอย่างทำงานประสานกัน แต่ถึงแม้การออกแบบทางเดินที่คดเคี้ยว ความลับซ้อนความลับ และกลไกสภาพแวดล้อมที่ดูซาดิสต์จะมีความอัจฉริยะในบางครั้ง แต่ Belmont's Curse ก็มักจะถูกบั่นทอนลงบ่อยเกินไป", "บางทีผมอาจจะถูกทำให้เสียคนโดยความคล่องตัวของ Hornet จาก Team Cherry หรือ Samus Aran ในเวอร์ชันของ MercurySteam เพราะ Rose รู้สึกเก้งก้างเหมือนเด็กสาวดิจิทัลที่อาศัยอยู่ในโลกอนาล็อก การตอบสนอง การโจมตี และตัวตนของเธอถูกกำหนดโดยทิศทางคลาสสิก 8 ทิศทางของ D-pad แต่ทุกอย่างรอบตัวกลับดูเหมือนจะอยู่ในระนาบที่ลื่นไหลกว่า ความสามารถและการโจมตีบางอย่างของ Rose ทำงานได้แค่ในแนวตรง ขึ้น ลง หรือข้างๆ เท่านั้น ในขณะที่ศัตรูทุกตัวเคลื่อนไหวอย่างเป็นธรรมชาติหรือขว้างอาวุธเป็นเส้นโค้งที่สวยงาม และมันก็เป็นเช่นเดียวกันกับการเดินทาง การพยายามใช้แส้กับศัตรูหรือจุดยึดหากคุณไม่อยู่ในตำแหน่งที่เฉพาะเจาะจงและน่าอึดอัดนั้นเป็นฝันร้าย และมักจะเปลี่ยนส่วนการกระโดดที่ออกแบบมาอย่างชาญฉลาดให้กลายเป็นการต่อสู้กับตัวเกมและเอนจิ้น แทนที่จะได้สนุกกับปริศนา มันมีความตึงเครียดที่ไม่น่าพึงพอใจอยู่ตลอดเวลาระหว่างวิธีที่ผมถูกบังคับให้เคลื่อนที่กับวิธีที่โลกทำงาน", "บ่อยครั้งที่ Rose ติดอยู่ระหว่างศัตรูกับโล่ของมันจนได้รับความเสียหายซ้ำซ้อน แส้ของคุณไม่ยึดเกาะในที่ที่ควรจะเป็น และคุณก็ถูกส่งกลับไปยังจุดเช็คพอยต์อีกครั้ง หากผมจะใจดี ผมอาจจะแย้งว่ามันคือการแสดงออกทางกลไกของคำสาปของ Rose ซึ่งเป็นผลพวงจากมรดกที่ฉุดรั้งพลังที่แท้จริงของเธอในขณะที่เธอต่อสู้กับผลกระทบจากอดีต แต่การควบคุมที่น่าอึดอัดและเฟรมเรตที่ตกต่ำ แม้แต่บน PS5 Pro ก็ทำให้เกิดการตายมากมายจนน่ารำคาญ", "นอกจากนี้ แม้ว่าผมจะชอบการออกแบบเกมที่ซาดิสต์ (ผมคงไม่เล่น Metroidvania ถ้าผมไม่ชอบ) แต่มีบางครั้งที่ Belmont's Curse รู้สึกใจร้ายมากกว่าจะท้าทายอย่างสนุกสนาน จุดเช็คพอยต์บางจุดลงโทษผู้เล่นหนักเกินไป และวิธีที่คุณเข้าถึงการเดินทางด่วน (Fast Travel) เพื่อลดความเจ็บปวดจากการย้อนกลับไปมานั้นมีความซับซ้อนและน่าหงุดหงิดโดยไม่จำเป็น การเอาแผนที่ออกในพื้นที่ที่ชวนเวียนหัวที่สุด? ผมไม่คิดว่ามันฉลาดอย่างที่เกมคิดหรอก มันแค่ทำให้เกิดงานที่น่าเบื่อหน่ายและน่าหงุดหงิดเท่านั้น", "ความตึงเครียดระหว่างการออกแบบและการนำไปใช้นั้นเห็นได้ชัดที่สุดในการต่อสู้กับบอส บางตัวเป็นบททดสอบกลไกที่ชาญฉลาดซึ่งวัดปฏิกิริยาตอบสนองและความอดทนของคุณ บางตัวเป็นการเผชิญหน้าที่เรียบง่ายและตลกขบขัน แต่บางตัวกลับออกแบบมามากเกินไป พยายามยัดเยียดไอเดียมากเกินไปจนรู้สึกไม่สมดุล หากคุณอยู่ในการต่อสู้ที่ยากลำบาก (ขอพูดถึง Death หน่อย) แส้ที่ลื่นไหลหรือการโต้ตอบกับการกระโดดที่แปลกประหลาดก็เพียงพอที่จะทำให้คุณตายได้ ไม่ว่าคุณจะติดตั้งไอเทมเพิ่มสถิติไว้กี่ชิ้น หรือใช้อาวุธประเภทไหนจาก 7 ประเภท คุณก็จะถูกฆ่าด้วยการก้าวพลาดเพียงครั้งเดียวที่ขอบเหว ซึ่งนั่นไม่รู้สึกว่าเป็นสไตล์ของ Belmont เลย", "โชคดีที่จังหวะของเกมทำออกมาได้ดี ในขณะที่ผมเริ่มกำคอนโทรลเลอร์แน่นเกินไปเพราะเบื่อกับการกระโดดข้ามกับดักหนามและเดินทะลุกำแพงเวทมนตร์ Evil Empire ก็ดูเหมือนจะอ่านใจผมออก 'เอาไปเลย การต่อสู้แบบจัดเต็ม!' มันร้องอย่างร่าเริง พร้อมโยนศัตรูที่คุณยังไม่เคยเจอมาให้ 'ฉันไม่มีน้ำยาฟื้นเลือดเหลือแล้ว!' คุณร้องออกมาอย่างสิ้นหวัง 'ดี' ผู้พัฒนากระซิบ สิ่งที่ตามมาคือการฝึกฝนความสิ้นหวังที่บริสุทธิ์ เป็นบททดสอบไหวพริบ และเป็นเครื่องเตือนใจว่าทุกบอสที่คุณกำจัดได้ คุณจะปลดล็อกคาถาใหม่ บางอย่างช่วยเติมเลือดให้คุณถ้าคุณฉลาดพอ บางอย่างมอบโล่ที่เปราะบางแต่ชั่วคราว และบางอย่างช่วยตรึงศัตรูไว้กับที่ ทำให้คุณมีจุดยึดที่เชื่อถือได้สำหรับแส้ของคุณ ช่วยให้คุณพุ่งและกระโดดข้ามอันตรายที่เต็มหน้าจอไปได้", "ในช่วงเวลาเหล่านี้ ที่ปรัชญาเน้นแอ็กชันของ Evil Empire เปล่งประกายออกมา และคุณได้สร้างพื้นที่สำหรับการกระโดดด้วยตัวเอง Belmont's Curse ก็กลายเป็นเกมที่ยอดเยี่ยม DNA  "canonical_link": "https://jp.ign.com/castlevania-belmonts-curse/84406/castlevania-belmonts-curse", "cover_image_url": "https://sm.ign.com/t/ign_jp/review/c/castlevani/castlevania-belmonts-curse-review_jw4q.1200.jpg", "gallery_images": [], "videos": [], "review_score": "8", "published_ts": 1791970264, "published_at": "2026-10-14T09:31:04Z", "published_th": "14 ต.ค. 2026 • 16:31 น.", "category_hint": "Review", "sub_tag": "CASTLEVANIA"}, {"id": 1794801668395, "guid": "https://jp.ign.com/ace-combat-8-wings-of-theve/84348/ace-combat-8-wings-of-theve", "original_title": "『ACE COMBAT 8: WINGS OF THEVE』レビュー シリーズ史上最高の空戦と、屈指のミッションデザイン", "thai_title": "รีวิว ACE COMBAT 8: WINGS OF THEVE – สุดยอดประสบการณ์การรบทางอากาศและงานออกแบบภารกิจระดับขึ้นหิ้ง", "tag": "Review", "bullet_points": ["ACE COMBAT 8 นำเสนอเนื้อเรื่องที่เข้มข้นและสะท้อนประเด็นสังคมสมัยใหม่ได้อย่างลึกซึ้ง โดยเน้นย้ำถึงความสูญเสียจากสงครามผ่านมุมมองของตัวละครที่จับต้องได้", "ระบบการบินและเกมเพลย์ถูกยกระดับสู่จุดสูงสุดของซีรีส์ ด้วยการออกแบบภารกิจที่ยืดหยุ่นและสถานการณ์ในสนามรบที่เปลี่ยนแปลงตลอดเวลา", "งานภาพและเสียงมีความโดดเด่นอย่างมาก โดยเฉพาะการใช้เสียงสื่อสารผ่านวิทยุที่สร้างอารมณ์ร่วมและถ่ายทอดเรื่องราวได้อย่างยอดเยี่ยม", "โหมดมัลติเพลเยอร์มอบประสบการณ์ที่สนุกสนานและท้าทาย แม้จะมีระบบความก้าวหน้า (Progression) และเมนูที่ค่อนข้างซับซ้อนและน่ารำคาญใจอยู่บ้าง"], "full_paragraphs": ["มีทฤษฎีหนึ่งกล่าวว่า 'เป็นไปไม่ได้ที่จะสร้างงานศิลปะต่อต้านสงครามโดยใช้สงครามเป็นฉากหลัง' เพราะไม่ว่าจะทำอย่างไร ผลงานนั้นย่อมกลายเป็นการเชิดชูสงครามไปโดยปริยาย (หรือถูกตีความเช่นนั้น) ข้อโต้แย้งนี้มีส่วนที่น่ารับฟัง เพราะ ACE COMBAT 8: WINGS OF THEVE คือเรื่องราวสงครามที่วาดภาพความยิ่งใหญ่ของการเป็นนักบินเอซผู้กล้าหาญ ทว่าในขณะเดียวกัน เกมนี้กลับกล้าหาญพอที่จะยืนหยัดในจุดยืนต่อต้านสงคราม โดยหยิบยกประเด็นซับซ้อนอย่างบทบาทของโฆษณาชวนเชื่อ พลังของสัญลักษณ์ ชาตินิยม และโลกาภิวัตน์ขึ้นมานำเสนอ เนื้อหาครอบคลุมไปถึงอิทธิพลขององค์กรธุรกิจต่อสถานการณ์โลก โซเชียลมีเดีย ข่าวปลอม ความสูญเสียจากสงคราม และภาพลักษณ์ของโลกที่ไร้พรมแดน แม้เนื้อเรื่องจะสะท้อนสังคมปัจจุบันได้อย่างน่าขนลุก แต่เมื่อมองย้อนกลับไป สิ่งที่ผมตระหนักได้คือความเชื่อลึกๆ ของเกมนี้ที่แม้จะไม่พูดออกมาตรงๆ แต่ก็สื่อสารผ่าน 'ปีกแห่งธีฟ' (Wings of Theve) ว่า สิ่งที่ดีที่สุดสำหรับโลกและตัวละครเหล่านี้คือการที่สงครามจบลง และไม่มีใครต้องขึ้นบินเพื่อทำภารกิจรบอีกต่อไป", "เหตุการณ์ใน ACE COMBAT 8 เกิดขึ้นประมาณ 10 ปีหลังจากภาค ACE COMBAT 7: SKIES UNKNOWN โดยผู้เล่นไม่จำเป็นต้องเคยเล่นภาคก่อนก็สามารถสนุกได้ ในภาคนี้สาธารณรัฐโซทัว (Sotoa) เริ่มต้นการบุกสายฟ้าแลบต่อสหภาพเซ็นทรัลยูเซีย (FCU) ด้วยกำลังทางอากาศและขีปนาวุธจากวงโคจรที่เรียกว่า 'หอกแห่งโทนิทรัส' (Tonitrus Spear) จนเมืองหลวงธีฟ (Theve) ล่มสลาย กองกำลัง FCU ที่เหลือรอดต้องใช้เรือบรรทุกเครื่องบินเก่าแก่ 'เอนดูแรนซ์' (Endurance) เป็นฐานปฏิบัติการป้องกันเมืองอย่างสิ้นหวัง ผู้เล่นจะได้รับบทเป็นนักบินนิรนามที่ถูกช่วยชีวิตขึ้นมาจากทะเล และต้องรับช่วงต่อฉายาในตำนาน 'ปีกแห่งธีฟ' ของ จีน 'เร็กซ์' คอปป์ ยอดนักบินแห่ง FCU", "ทว่าปัญหาคือทุกอย่างเป็นเรื่องโกหก คอปป์เป็นนักบินที่เก่งกาจแต่ไม่เคยยิงเครื่องบินศัตรูตกเลยแม้แต่ลำเดียว จำนวนการยิงตกของเขาเป็นเพียงตำนานที่สร้างขึ้นเพื่อมอบความหวังให้แก่ชาวเมือง ตราบใดที่ 'ปีกแห่งธีฟ' ยังอยู่บนฟ้า ผู้คนก็เชื่อว่าสงครามยังไม่จบ ภารกิจของคอปป์คือการนำหน่วยโจ๊กเกอร์ (Joker Squadron) กลับบ้านอย่างปลอดภัย ซึ่งเขาทำได้ดีเสมอมา จนกระทั่งคุณได้เผชิญหน้ากับ 'เงา 22' (Shadow 22) เอซของโซทัว โชคของคอปป์ก็หมดลง แต่ 'ปีกแห่งธีฟ' ไม่ได้รับอนุญาตให้ตาย คุณจึงต้องรับหน้าที่และคอลไซน์นั้นมาสวมรอย กลายเป็นตำนานเสียเอง และเมื่อตำนานกลายเป็นความจริง คุณก็แค่ต้องเฝ้ามองมันกลายเป็นข่าวและแพร่กระจายไปทั่วโซเชียลมีเดีย แต่สำหรับหน่วยโจ๊กเกอร์ การหนีไม่เพียงพออีกต่อไป คุณต้องสร้างผลงาน เมื่อคุณเริ่มยิงศัตรูตก เส้นแบ่งระหว่างตำนานกับความจริงก็เริ่มเลือนลาง", "ทีมพัฒนา PROJECT ACES ได้ร้อยเรียงเรื่องราวที่น่าหลงใหลโดยมีสมาชิกหน่วยโจ๊กเกอร์เป็นศูนย์กลาง นำโดย เอลลิงตัน 'โปรเฟสเซอร์' แบ็กซ์เตอร์ อดีตครูที่ผันตัวมาเป็นนักบินและเป็นพี่เลี้ยงของคุณ ส่วนสมาชิกที่อายุน้อยที่สุดอย่าง ทาชา เซเวลสกี นักบินผาดโผนพลเรือนที่ถูกบังคับให้เข้าสู่สงครามและปฏิเสธที่จะยิงใครตก รวมถึง วิลเลียม 'นอยซ์' คอสเตอร์ ผู้รักเสียงเพลงที่มักเปิดเพลงดังลั่นผ่านช่องสื่อสาร ทั้งหมดนี้รวมถึงตัวละครสมทบอื่นๆ ช่วยสร้างตำนาน 'ปีกแห่งธีฟ' ให้เป็นรูปเป็นร่างขึ้นมา และตลอดทั้งเกม จิตวิญญาณของคอปป์ก็ยังคงอยู่ไม่จางหายไปไหน", "อาจฟังดูไร้สาระ แต่มันกลับทำงานได้อย่างยอดเยี่ยมเช่นเดียวกับทุกองค์ประกอบใน ACE COMBAT 8 ทำให้ผู้เล่นสร้างความผูกพันกับตัวละครที่ความเป็นความตายมีความหมายอย่างยิ่ง ตัวละครเหล่านี้ถูกเขียนบทมาอย่างซับซ้อนและน่าสนใจ เสริมด้วยการพากย์เสียงที่ยอดเยี่ยม ความสัมพันธ์ระหว่างพวกเขากับผู้เล่นคือแรงขับเคลื่อนหลักของเนื้อเรื่อง ทุกครั้งที่ออกบิน ผมตั้งใจแน่วแน่ว่าจะต้องพาพวกเขากลับมาให้ได้ทุกคน", "ซีรีส์ ACE COMBAT มักเล่าเรื่องผ่านห้องนักบินมานาน แต่ในภาคนี้ผู้เล่นจะได้เดินบนดาดฟ้าเรือเอนดูแรนซ์ ใช้เวลาในโรงเก็บเครื่องบิน ห้องบรรยายสรุป หรือโรงอาหารร่วมกับนักบินคนอื่นและพลเรือนที่อพยพมา ฉากเหล่านี้ไม่เพียงแต่กระชับความสัมพันธ์ แต่ยังทำให้รู้สึกถึงราคาที่ต้องจ่ายจากสงคราม แม้จะทำได้เพียงเดินสำรวจหรือโต้ตอบเล็กน้อย แต่มันเป็นช่วงเวลาที่น่าจดจำและสะเทือนอารมณ์ที่สุดในเกม", "อย่างไรก็ตาม ในฐานะนักบินรบ หัวใจสำคัญยังคงอยู่บนท้องฟ้า ซึ่ง ACE COMBAT 8 ทำได้ดีเยี่ยมจนแทบจะเรียกได้ว่า 'โบยบิน' อย่างแท้จริง เกมยังคงใช้ระบบภารกิจที่คุณต้องเลือกเครื่องบิน อาวุธ และชิ้นส่วนก่อนออกบิน โดยใช้แต้มที่ได้จากการทำภารกิจมาอัปเกรดหรือซื้อเครื่องบินใหม่ คุณสามารถปรับแต่งอาวุธให้เพื่อนร่วมทีมได้ด้วย และเมื่อขึ้นสู่ท้องฟ้า ความสนุกที่แท้จริงก็เริ่มขึ้น แม้จะมีระบบควบคุมแบบมาตรฐาน แต่ผมแนะนำให้เล่นแบบ Expert เพื่อควบคุมการบินได้อย่างเต็มที่ ซึ่งจะมอบความรู้สึกที่ดื่มด่ำและท้าทายในเวลาเดียวกัน", "ความดื่มด่ำเกิดขึ้นในรายละเอียดเล็กๆ เช่น การดึง G-Turn เพื่อหลบมิสไซล์ การล็อกเป้าหมายหลายลำพร้อมกัน หรือการบินมุดผ่านซากปรักหักพังในเมือง เมื่อคุณเข้าสู่ตำแหน่ง 6 นาฬิกาของศัตรูและสอยร่วงด้วยปืนกล หรือการบินตามหลังเครื่องบินขนส่งขนาดใหญ่เพื่อทำลายเครื่องยนต์โดยไม่ใช้มิสไซล์สักนัด 'ปีกแห่งธีฟ' คือการถ่ายทอดความฝันของนักบินรบออกมาได้อย่างสมบูรณ์แบบ การทำลายล้างกลายเป็นศิลปะที่สวยงาม และ ACE COMBAT 8 มอบความตื่นเต้นนี้ให้คุณซ้ำแล้วซ้ำเล่า", "สิ่งที่น่าทึ่งคือการผสมผสานช่วงเวลาเหล่านี้เข้ากับการออกแบบภารกิจและเนื้อเรื่อง หลายครั้งที่คุณต้องตัดสินใจเองว่าจะไปที่ไหน เช่น การติดตามรอยไอพ่นในก้อนเมฆเมื่อเรดาร์ถูกรบกวน หรือการตัดสินใจว่าจะช่วยกองกำลังภาคพื้นดินที่กำลังขอความช่วยเหลืออย่างไร คุณต้องเลือกว่าจะส่งหน่วยโจ๊กเกอร์ไปช่วย หรือจะจัดการด้วยตัวเอง ภารกิจใน ACE COMBAT 8 เปลี่ยนแปลงตลอดเวลาตามสถานการณ์ในสนามรบ เปรียบเสมือนการเต้นบัลเลต์ที่สง่างามซึ่งคุณต้องด้นสดตามจังหวะที่เปลี่ยนไป", "ผมชอบภารกิจที่ให้อำนาจการตัดสินใจแก่หน่วยโจ๊กเกอร์ เช่น ภารกิจต่อสู้กับเรือรบภาคพื้นดินที่มีรางปืนแม่เหล็กไฟฟ้า (Railgun) หรือภารกิจทำลายเรือเหาะที่ซ่อนตัวในเมฆเพื่อนำทางขีปนาวุธ ทุกภารกิจทดสอบทั้งทักษะการเลือกอาวุธและการปรับตัวต่อสถานการณ์ที่คาดไม่ถึง แม้ผมจะพูดถึงแค่ช่วงครึ่งแรกของ 30 ภารกิจเพื่อหลีกเลี่ยงการสปอยล์ แต่ทุกภารกิจล้วนยอดเยี่ยม และช่วงท้ายเกมจะเต็มไปด้วยเทคนิคที่น่าตื่นตาตื่นใจจนคุณต้องอ้าปากค้าง", "ความสำเร็จที่ยิ่งใหญ่ของเนื้อเรื่องคือการถ่ายทอดดราม่าผ่านเสียงสื่อสารทางวิทยุ คุณจะได้ยินเสียงทหารที่เชื่อมั่นในตัวคุณ เสียงที่สงสัยในตัวคุณ หรือเสียงของทหารที่ต้องจบชีวิตลงเพราะคุณไปช่วยไม่ทัน สิ่งเหล่านี้ทำให้คุณรู้สึกถึงความรับผิดชอบ แม้จะบินเก่งแค่ไหน แต่คุณก็ไม่สามารถช่วยทุกคนได้เสมอไป นั่นคือความจริงของสงคราม และทุกครั้งที่เผชิญหน้ากับมัน ผมก็ยิ่งอยากจะบินให้ดีขึ้นเพื่อสมกับฉายาที่ได้รับ", "นอกเหนือจากการต่อสู้ ช่วงเวลาที่ไม่มีการรบก็งดงามไม่แพ้กัน เช่น การบินผ่านเมฆที่วาดออกมาอย่างละเอียด หรือการได้เห็นเครื่องบินลำใหม่ในโรงเก็บเครื่องบิน ACE COMBAT 8 ยังอนุญาตให้คุณบินสำรวจแผนที่ได้อย่างอิสระหลังจากเคลียร์ภารกิจนั้นๆ แล้ว ซึ่งเป็นความรู้สึกที่คอปป์เข้าใจดี และนั่นอาจเป็นเหตุผลว่าทำไมเขาถึงไม่เคยยิงใครตกเลย", "ในส่วนของมัลติเพลเยอร์ โหมดอย่าง Deathmatch และ Co-op Warfare (PvPvE) มอบความสนุกที่แตกต่างกัน แม้ระบบเมนูจะดูซับซ้อนและน่ารำคาญไปบ้าง รวมถึงระบบความก้าวหน้า (Progression) ที่ค่อนข้างช้าและอาจทำให้ผู้เล่นใหม่เสียเปรียบหากเจอผู้เล่นที่มีเครื่องบินดีกว่า แต่เมื่อได้ขึ้นบินแล้ว ประสบการณ์การบินก็ยังคงยอดเยี่ยมและลื่นไหล", "โดยสรุป ACE COMBAT 8: WINGS OF THEVE คือความสำเร็จอันน่าทึ่งของ PROJECT ACES ที่ผสมผสานภาพและเสียงอันน่าทึ่งเข้ากับเนื้อเรื่องที่กินใจและระบบการบินที่ ียบกับภาพยนตร์ Top Gun นั้นเกิดขึ้นนับครั้งไม่ถ้วน แต่ปฏิเสธไม่ได้เลยว่า Wings of Theve ติดหนี้บุญคุณภาคต่อปี 2022 ของโจเซฟ โคซินสกี้ อย่างมาก ไม่ใช่แค่เรื่องกล้องรีเพลย์ที่มองจากด้านหน้า หรือคัตซีนที่เลียนแบบช็อตจำของหนัง แต่เหมือนกับว่า Bandai Namco Aces ได้รับแรงบันดาลใจจากหนึ่งในภาพยนตร์แอ็กชันที่น่าตื่นเต้นที่สุดในศตวรรษที่ 21 ทุกภารกิจให้ความรู้สึกเหมือนเป็นฉากแอ็กชันสุดอลังการของหนังบล็อกบัสเตอร์ฮอลลีวูด", "ทั้งข้อดีและข้อเสีย สิ่งนี้ส่งผลต่อทุกสิ่งที่เกิดขึ้นระหว่างทาง ความแตกต่างที่สำคัญอย่างหนึ่งระหว่าง Wings of Theve กับภาคก่อนๆ คือการลงทุนในเนื้อเรื่อง มีบทนำที่ดูจะฟุ่มเฟือยในสไตล์ของโคจิม่า (ซึ่งทำให้ผมมีเวลาคิดว่าเขาจะตั้งชื่อตัวเอกว่า Tom-Cruiseman หรือเปล่า) คัตซีนมุมมองบุคคลที่หนึ่งไม่สามารถโน้มน้าวผมได้ว่าการมีตัวเอกที่เงียบขรึมนั้นเป็นเรื่องดี รวมถึงการควบคุมที่จำกัด เช่น การมองและการซูม หรือคำสั่ง 'กด X เพื่อจับมือ' อย่างไรก็ตาม ความอึดอัดของฮีโร่ผู้เงียบขรึมถูกบรรเทาลงด้วยการให้รุ่นพี่ของคุณคอยอยู่เคียงข้างเหมือนวิญญาณแบบโอบีวัน เขาเป็นทั้งเสียงในหัวและตัวดำเนินเรื่องที่คอยพูดประโยคสำคัญๆ เช่น “มหาสมุทรตั้งอยู่ที่นั่นราวกับโลงศพที่เปิดออก” ด้วยเสียงกระซิบแหบพร่าที่ฟังดูเหมือนเสียงแบทแมนของคริสเตียน เบล", "นั่นเพิ่มความตลกขบขันโดยไม่ได้ตั้งใจให้กับเนื้อหาที่จริงจังของเกมเกี่ยวกับการทำสงคราม ซึ่งดูเหมือนผู้พัฒนาจะพยายามทำทั้งสองอย่างพร้อมกัน มีการคร่ำครวญถึงความสูญเสียของมนุษย์จากความขัดแย้ง (แม้ว่าบทจะดูโกรธแค้นต่อความชั่วร้ายของโซเชียลมีเดียและการแพร่กระจายของข้อมูลเท็จในยุค AI) และเกมไม่ลังเลที่จะทำให้คุณรู้ว่าคุณเป็นเพียงฟันเฟืองในเครื่องจักรสงครามและเครื่องจักรโฆษณาชวนเชื่อ ในขณะเดียวกัน คุณไม่มีทางเลือกอื่นนอกจากต้องรับบทบาทนี้และกลายเป็นนักบินในตำนานที่มีสถิติการสังหารที่เหลือเชื่อเพื่อสร้างแรงบันดาลใจให้ผู้คนทางบ้าน", "คุณสามารถบอกได้ว่า Shadow Squadron ของกองทัพอากาศโซโทอันคือตัวร้าย เพราะเครื่องบินของพวกมันทาสีดำและเพลงประกอบของพวกมันก็ติดหูอย่างน่ากลัว นี่เป็นเครื่องเตือนใจว่าในขณะที่ Call of Duty และ Battlefield มักจะตกเป็นประเด็นถกเถียงเรื่องความสัมพันธ์ระหว่างกองทัพกับสื่อบันเทิง แต่ Ace Combat กลับหลบเลี่ยงประเด็นเหล่านี้ได้เหมือนเครื่องบิน MiG ที่หลบขีปนาวุธ แต่นี่ไม่ใช่โลกของเรา นี่คือ Strangereal สถานที่ที่เครื่องบินศัตรูเปิดเพลงร็อกยุคเก่าผ่านช่องสื่อสารเพื่อประกาศการมาถึง และหนึ่งในเพื่อนร่วมทีมของคุณดีดกีตาร์โซโล่ที่โศกเศร้าบนเรือบรรทุกเครื่องบินตอนพระอาทิตย์ตกดิน จริงอยู่ แต่มันก็มีเครื่องบินในโลกแห่งความเป็นจริงหลายรุ่นที่ถูกนำเสนอด้วยความเคารพไม่ต่างจากที่ Gran Turismo ให้กับรถยนต์ และแม้จะมีลิฟต์อวกาศ เรือรบทางบก และเครื่องบินขนส่งขนาดมหึมา แต่สถานการณ์ในเกมก็ให้ความรู้สึกสมจริง โดยเฉพาะฉากความเสียหายที่ทำให้นึกถึงภาพที่เราเห็นจากกาซาและยูเครนในช่วงไม่กี่ปีที่ผ่านมา Wings of Theve นั้นท่วมท้น รุนแรง และบ้าบิ่นจนสำหรับผม ความกังวลเหล่านี้ละลายหายไปในระหว่างภารกิจ", "อย่างไรก็ตาม ทั้งหมดนี้ทำให้มีช่วงเวลาพักผ่อนมากเกินไปในเกมที่ทำได้ดีที่สุดเมื่อยึดติดกับคำพูดจากภารกิจที่ 11: “ขยับตัว อย่าคิด เร็วเข้า” หลังจากนั้นผมตระหนักว่านี่อาจเป็นคำนิยามของภารกิจใน Wings of Theve น้อยซีรีส์นักที่จะสื่อถึงความเร่งด่วนได้ดีเท่า Ace Combat และหากภารกิจที่ยากลำบากที่สุดของภาคนี้จะทำลายสมดุลระหว่างความตื่นเต้นกับความเหนื่อยล้าไปบ้าง แต่มันก็มอบความรู้สึกสุดยอดทางประสาทสัมผัสที่หาได้ยาก", "สิ่งที่แยก Ace Combat ออกจากภาคก่อนๆ คือการเน้นที่ความอลังการ แต่ก็มีเนื้อหาที่แท้จริงอยู่ภายใต้ความสวยงามนั้น ตัวอย่างเช่น เมฆเหล่านั้นไม่ได้มีไว้แค่เพื่อความสวยงามของท้องฟ้าในปี 2026 เท่านั้น แต่ยังส่งผลต่อสภาพอากาศ ทัศนวิสัยเป็นดาบสองคมและเป็นปัจจัยทางยุทธวิธีที่สำคัญในการต่อสู้กลางอากาศ และแม้ว่าการบินเข้าไปในเมฆจะทำให้คุณคล่องตัวน้อยลงและลดระยะการล็อกเป้าขีปนาวุธ แต่นั่นก็เป็นแรงจูงใจให้คุณปรับแต่งอุปกรณ์ก่อนเริ่มภารกิจ", "คัตซีนมุมมองบุคคลที่หนึ่งดูเหมือนจะเป็นคำใบ้ว่าผู้พัฒนาอยากให้คุณใช้มุมมองไหนในเกม มุมมองห้องนักบินให้ประสบการณ์ที่อึดอัดอย่างสมจริง แต่มุมมองบุคคลที่สามอาจทำให้หลบหลีกได้ง่ายกว่า ในด้านการปรับแต่ง คุณอาจอยากทุ่มเงินซื้อเครื่องบินใหม่ที่มีสถิติดีกว่า แต่การลงทุนในชิ้นส่วนที่เพิ่มระยะและประสิทธิภาพของขีปนาวุธ รวมถึงลดโอกาสที่เครื่องจะสตอลหรือเพิ่มความทนทานนั้นสมเหตุสมผลกว่า คำสั่งเพื่อนร่วมทีมก็สร้างความแตกต่างได้อย่างน่าประหลาดใจ เช่นเดียวกับการเลือกเครื่องบิน ในภารกิจที่คุณต้องรับมือหลายอย่างพ Review", "sub_tag": "CASTLEVANIA", "bullet_points": ["Castlevania: Belmont’s Curse เป็นเกมภาคใหม่ในรูปแบบ 2D ครั้งแรกในรอบ 13 ปี พัฒนาโดย Evil Empire ร่วมกับคำแนะนำจากทีมงาน Motion Twin", "งานภาพและเสียงทำออกมาได้อย่างยอดเยี่ยม โดยใช้โมเดลโพลีกอนที่ให้ความรู้สึกเหมือนภาพวาดด้วยมือ พร้อมดนตรีประกอบที่สร้างบรรยากาศได้ดี", "ระบบเกมเพลย์ยังคงยึดติดกับสูตรสำเร็จเดิมของแนว Metroidvania มากเกินไป ทำให้ขาดความตื่นเต้นหรือนวัตกรรมใหม่ๆ เมื่อเทียบกับเกมคู่แข่งในปัจจุบัน", "ตัวเกมมีความยากในระดับสูงและมีระบบการเล่นที่ได้รับอิทธิพลจากแนว Soulslike ซึ่งอาจสร้างความหงุดหงิดจากการต้องเดินย้อนกลับไกลเมื่อตาย", "มีตัวเลือกปรับแต่งความยากที่หลากหลาย รวมถึงโหมดอมตะสำหรับผู้ที่ต้องการเน้นเสพเนื้อเรื่องและการสำรวจแผนที่"], "full_paragraphs": ["อาจเป็นเรื่องยากที่จะเชื่อเมื่อพิจารณาว่าชื่อซีรีส์นี้กลายเป็นสัญลักษณ์ของแนวเกมที่ถูกตั้งชื่อตามมัน แต่ความจริงคือเราไม่ได้เห็นเกม Castlevania แบบเลื่อนฉากด้านข้าง (side-scrolling) ภาคใหม่มานานถึง 13 ปีแล้ว โดยภาคสุดท้ายคือ Castlevania: Lords of Shadow – Mirror of Fate ที่วางจำหน่ายบน Nintendo 3DS ในเดือนมีนาคม 2013 ก่อนจะพอร์ตลง Xbox 360 และ PS3 ในปีเดียวกัน", "นับจากนั้นเป็นต้นมา โลกของเกมได้ผ่านคอนโซลมาถึงสองเจเนอเรชัน และในช่วงเวลาดังกล่าว แนวเกม Metroidvania ไม่เพียงแต่พัฒนาไปไกลเท่านั้น แต่ยังมีเกมใหม่ๆ ที่ได้รับความนิยมอย่างสูงเกิดขึ้นมากมาย ไม่ว่าจะเป็น Silksong, Ori, Dead Cells, Animal Well และ Shovel Knight", "แม้ Konami จะยังคงรักษาซีรีส์นี้ไว้ด้วยการรวมฮิตเกมเก่าๆ แต่ Belmont’s Curse ถือเป็นการกลับมาอย่างเต็มตัวครั้งแรกในรอบกว่าทศวรรษ โดยมีทีมงาน Evil Empire (ผู้สร้าง The Rogue Prince of Persia) เป็นหัวเรือหลัก และได้รับคำแนะนำจาก Motion Twin (ผู้สร้าง Dead Cells) ตลอดการพัฒนา", "อย่างไรก็ตาม แม้จะเป็นเรื่องน่ายินดีที่ได้เห็น Castlevania กลับมา แต่ก็ยากที่จะปฏิเสธความรู้สึกที่ว่ามาตรฐานของเกมแนวนี้ได้ถูกยกระดับขึ้นไปไกลมากในช่วงที่ซีรีส์นี้หายไป และการผจญภัยครั้งใหม่นี้ก็ยังไม่สามารถก้าวขึ้นไปเทียบชั้นกับมาตรฐานเหล่านั้นได้", "เนื้อเรื่องติดตาม Rose Belmont ลูกสาวของ Trevor Belmont ฮีโร่จาก Castlevania 3 เมื่อทั้งคู่เดินทางมาถึงปารีสหลังจากมีรายงานว่าเมืองถูกรุกรานโดยเหล่าปีศาจ ด้วยความที่ผู้เป็นพ่อเริ่มมีอายุมากแล้ว เขาจึงส่งมอบแส้ Vampire Killer ให้กับ Rose เพื่อให้เธอรับหน้าที่ผจญภัย ซึ่งแน่นอนว่าท้ายที่สุดแล้วเรื่องราวก็ต้องไปพัวพันกับ Dracula ในไม่ช้า (เหตุการณ์นี้เกิดขึ้นประมาณ 200 ปีก่อนเหตุการณ์ในเกมภาคแรกบน NES)", "ในแง่ของระบบการเล่น ทุกอย่างเป็นไปตามที่คุณคาดหวังจากเกมแนว Metroidvania โดย Rose ต้องสำรวจแผนที่ขนาดใหญ่เพื่อตามหาบอสต่างๆ ซึ่งเมื่อเอาชนะได้ เธอจะได้รับความสามารถพิเศษเพื่อใช้เข้าถึงพื้นที่ที่เคยไปไม่ได้มาก่อน จนกระทั่งสามารถปราบความชั่วร้ายลงได้ (อย่างน้อยก็จนกว่ามันจะกลับมาอีกครั้งในไทม์ไลน์ถัดไป)", "ด้านงานภาพถือว่าโดดเด่นมาก เกมใช้ตัวละครและฉากที่เป็นโพลีกอนแต่ได้รับการออกแบบให้ดูเหมือนภาพวาดด้วยมือ ส่งผลให้ฉากหลังมีความละเอียดสูงมาก โดยเฉพาะช่วงที่เกมพาผู้เล่นเดินผ่านทางเดินกลางแจ้งยาวๆ แล้วกล้องแพนออกเพื่อให้เห็นทัศนียภาพอันกว้างใหญ่ของปารีสที่กำลังลุกเป็นไฟ", "ดนตรีประกอบก็ทำออกมาได้ดีตลอดทั้งเกม แม้จะมีความหม่นหมองและกดดันมากกว่าเพลงประกอบ Castlevania ภาคเก่าๆ ที่มักจะทำให้ผู้เล่นรู้สึกเหมือนเป็นฮีโร่ผู้เก่งกาจ แต่ก็ยังมีเพลงที่ยอดเยี่ยมอยู่หลายเพลง และเมื่อมีการนำธีมคลาสสิกของ Castlevania กลับมาเรียบเรียงใหม่ก็ทำออกมาได้ไพเราะมาก", "การนำเสนอโดยรวมแทบจะไร้ที่ติ แต่ตัวเกมกลับให้ความรู้สึกว่า 'ก็แค่ใช้ได้' มันเป็นเกมที่วิจารณ์ได้ยากเพราะไม่ได้ทำอะไรผิดพลาดอย่างชัดเจน แต่ก็ไม่มีจุดไหนที่ทำให้ผมรู้สึกตื่นเต้นจนต้องร้องเฮออกมาด้วยความดีใจ นี่คือเกมที่ยังคงซื่อสัตย์ต่อกลไกของแนวเกมที่ถูกตั้งชื่อตามมัน และไม่ได้เสี่ยงทำอะไรใหม่ๆ เลย ไม่ว่าจะในแง่ดีหรือแง่ร้าย", "ระบบการต่อสู้ถือว่ามั่นคงพอสมควร คุณเริ่มต้นด้วยดาบและสามารถปลดล็อกอาวุธอื่นๆ ได้ในภายหลัง เช่น หอก, ดาบคู่, แส้ที่เป็นเอกลักษณ์ของซีรีส์ หรือแม้แต่หนังแข็งๆ สำหรับพันหมัด แม้อาวุธแต่ละชนิดจะให้ความรู้สึกต่างกัน แต่พูดตามตรง ผมใช้แค่ดาบมาตรฐาน (และเวอร์ชันอัปเกรดที่ทรงพลังกว่าในภายหลัง) ตลอดทั้งเกม และไม่เคยรู้สึกจำเป็นต้องเปลี่ยนไปใช้อาวุธอื่นเลย", "เช่นเดียวกับระบบ Arcanas ซึ่งเป็นเวทมนตร์ที่คุณสามารถเก็บได้จากการปราบศัตรูระดับบอส มีเวทมนตร์ให้เก็บประมาณ 15 ชนิด แต่ผมกลับพบว่าตัวเองใช้แค่ Holy Cross (ไอเทมรูปทรงบูมเมอแรงจากภาค NES) เป็นส่วนใหญ่ นั่นไม่ได้หมายความว่าการเปลี่ยนไปใช้เวทอื่นไม่สนุก แต่มันไม่เคยให้ความรู้สึกว่าจำเป็นต่อการเอาชีวิตรอด", "เมื่อพูดถึงการเอาชีวิตรอด เตรียมใจไว้เลยว่าคุณจะต้องตายบ่อยมากในเกมนี้ (และไม่ใช่แค่เพราะคุณดื้อรั้นไม่ยอมเปลี่ยนอาวุธเท่านั้น) บอสถูกปรับแต่งมาให้เล่นงานคุณจนกว่าจะจับทางได้ และถึงแม้จะจับทางได้แล้ว พวกมันก็ยังคงเป็นความท้าทายที่ยากลำบาก", "สิ่งที่น่าหงุดหงิดคือ ทุกครั้งที่คุณตาย (ไม่ว่าจะตายจากบอสหรือที่อื่น) คุณจะกลับไปเกิดใหม่ที่ Save Room ล่าสุดที่ใช้งาน ซึ่งมักจะอยู่ห่างออกไปหลายห้อง ทำให้ต้องเดินย้อนกลับมาที่เดิม และบ่อยครั้งที่ทำให้ลืมรูปแบบการโจมตีของบอสไปเสียสนิท", "นี่อาจไม่ใช่ข้อวิจารณ์ที่รุนแรงนัก แต่เป็นสิ่งที่ควรทราบ เกม Castlevania ไม่เคยเป็นเกมที่เล่นง่ายอยู่แล้ว แต่ภาคนี้ให้ความรู้สึกว่าได้รับแรงบันดาลใจมาจากแนว Soulslike มากเกินไป ทั้งที่ควรจะหันไปให้ความสำคัญกับเกมแนว Metroidvania อื่นๆ มากกว่า", "นอกจากนี้ยังมีตัวปรับแต่งเกมที่คุณสามารถเข้าไปปรับได้ในเมนู Settings หากรู้สึกว่าเกมยากเกินไป บางอย่างเป็นเรื่องเล็กน้อย เช่น การเพิ่มจำนวนยาฟื้นพลังที่พกได้ หรือการตั้งค่าให้เกิดใหม่ที่หน้าประตูบอสแทนที่จะเป็น Save Room เพื่อให้รีแมตช์ได้เร็วขึ้น", "ส่วนตัวเลือกอื่นๆ ขึ้นอยู่กับความชอบส่วนบุคคล คุณสามารถปรับแถบความเสียหายที่ทำได้ ความเสียหายที่ได้รับ และค่าประสบการณ์ที่ได้รับ ทำให้คุณสามารถปรับให้ทำดาเมจได้แรงขึ้นถึง 5 เท่า หรือรับค่าประสบการณ์เพิ่ม 3 เท่า หรือจะปรับลดลงหากต้องการความท้าทายที่มากขึ้น", "สุดท้าย ราวกับคาดการณ์ถึงกระแสตอบรับเรื่องความยาก เกมยังมีตัวเลือก 'ป้องกันความตาย' (prevent death) ซึ่งทำให้คุณเป็นอมตะและสามารถลุยผ่านศัตรูและบอสทั้งหมดได้ โดยเน้นไปที่การสำรวจแผนที่และแก้ปริศนาแพลตฟอร์มเท่านั้น แม้จะมีไว้ก็ดี แต่ก็อาจจะดูสุดโต่งไปสักหน่อย", "หากตัดเรื่องความยากออกไป ตัวแผนที่เองก็ไม่ได้ให้ความรู้สึกดึงดูดใจมากนัก แม้จะมีบางส่วนที่ออกแบบมาได้ดีและมีความซับซ้อนชวนปวดหัว โดยเฉพาะการใช้แส้เกี่ยวและการปลดล็อกความสามารถในการทำให้บล็อกบางอย่างปรากฏหรือหายไป แต่การสำรวจแผนที่กลับไม่ค่อยให้ความรู้สึกตื่นเต้น และส่วนใหญ่คุณจะรู้สึกเหมือนแค่พยายามหาพื้นที่ที่ยังไม่ได้สำรวจเท่านั้น", "โดยสรุป Castlevania: Belmont’s Curse ดูดีและฟังดูยอดเยี่ยมในบางช่วง แต่กลไกหลักของเกมไม่ได้สร้างความแปลกใหม่ และจะให้ความรู้สึกที่คุ้นเคยเกินไปสำหรับแฟนเกม Metroidvania ที่เคยผ่านเกมที่ดีกว่านี้มามากมายในช่วง 13 ปีที่ผ่านมา", "ความจริงที่ว่าภูมิทัศน์ของเกมแนว Metroidvania ในปัจจุบันแตกต่างจากปี 2013 อย่างสิ้นเชิง หมายความว่ามีตัวเลือกที่หลากหลายกว่าเดิมมาก ดังนั้น Belmont’s Curse จึงจำเป็นต้องยกระดับตัวเองขึ้นมาเพื่อแข่งขัน แม้จะทำได้ดีในแง่ของภาพและเสียง แต่ระบบเกมเพลย์กลับดูซ้ำซากเกินกว่าจะแนะนำให้เล่นแทนเกมอื่นๆ ที่กล่าวถึงไปข้างต้น", "อย่างไรก็ตาม ผู้ที่ชื่นชอบแนวนี้จะยังคงสนุกกับ Belmont’s Curse ได้อย่างแน่นอน และแฟนๆ Castlevania จะตื่นเต้นกับเนื้อหาใหม่ๆ (รวมถึงการอ้างอิงถึงเกมภาคก่อนๆ ที่น่าประหลาดใจ) แต่ด้วยเกมเพลย์ที่ยึดติดกับตำราเดิมๆ ทำให้ยากที่เกมนี้จะติดอันดับเกม Castlevania ที่ดีที่สุดตลอดกาล ซึ่งหมายความว่ามันคงต้องพอใจกับการเป็นเพียงภาคที่มั่นคงแต่ปลอดภัยของซีรีส์นี้เท่านั้น"], "link": "https://www.videogameschronicle.com/review/castlevania-belmonts-curse-review/", "canonical_link": "https://www.videogameschronicle.com/review/castlevania-belmonts-curse-review", "cover_image_url": "https://www.videogameschronicle.com/files/2026/10/castlevania-belmonts-curse.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1791874831, "published_at": "2026-10-13T07:00:31Z", "published_th": "13 ต.ค. 2026 • 14:00 น.", "category_hint": "Review"}, {"id": 1794821821049, "guid": "https://www.eurogamer.net/valor-mortis-review", "original_title": "Valor Mortis review", "thai_title": "รีวิว Valor Mortis: เมื่อเกมแนว Soulslike ผสานความมันส์ระดับพระกาฬเข้ากับระบบปาร์กัวร์สุดระห่ำ", "tag": "Review", "sub_tag": "GAME REVIEW", "bullet_points": ["Valor Mortis นำเสนอการผสมผสานที่แปลกใหม่ระหว่างเกมเพลย์แนว Soulslike ที่เน้นความอดทนและการจับจังหวะ เข้ากับระบบการเคลื่อนไหวแบบปาร์กัวร์ที่รวดเร็วและดุดัน", "ระบบการต่อสู้มีความลึกซึ้งด้วยการใช้ดาบควบคู่ไปกับปืนพก ทำให้ผู้เล่นสามารถสร้างจังหวะการโจมตีที่ต่อเนื่องและลื่นไหลได้มากกว่าเกมแนวเดียวกันทั่วไป", "การออกแบบฉากมีความซับซ้อนและสวยงาม มีการใช้ทางลัดและเส้นทางลับแบบ Metroidvania ที่กระตุ้นให้ผู้เล่นสำรวจโลกที่เต็มไปด้วยบรรยากาศของสงครามปฏิวัติฝรั่งเศส", "แม้จะมีจุดด้อยในเรื่องของเนื้อเรื่องที่ค่อนข้างคาดเดาได้และการซ้ำซากของศัตรูในช่วงท้ายเกม แต่ประสบการณ์โดยรวมถือเป็นเกมที่มอบความสนุกและท้าทายได้อย่างยอดเยี่ยม"], "full_paragraphs": ["Valor Mortis เล่นตลกกับผู้เล่นด้วยการสร้างภาพลักษณ์ในช่วงแรกให้ดูเหมือนเกมแนว Soulslike ขนานแท้ ไม่ว่าจะเป็นจุดเซฟที่เปรียบเสมือนกองไฟ, ขวดฮีล, การวิ่งกลับไปเก็บวิญญาณที่ทำตกไว้ หรือแม้แต่การเผชิญหน้ากับบอสสุดโหดในช่วงต้นเกม รวมถึงบรรยากาศที่เต็มไปด้วยความหดหู่ท่ามกลางสมรภูมิที่นองไปด้วยเลือดและโคลนตม แต่เมื่อผ่านไปเพียงไม่กี่ชั่วโมง เกมจะเผยธาตุแท้ออกมาด้วยระบบการเล่นมุมมองบุคคลที่หนึ่งที่เน้นการวิ่งไต่กำแพง, การใช้ตะขอโหนตัว, การปัดป้องและฟันดาบ, การยิงปืนสลับกับการเคลื่อนไหวที่รวดเร็ว รวมถึงการสโลว์โมชันเพื่อระเบิดกระสุนใส่หน้าศัตรู ซึ่งต้องบอกว่านี่ไม่ใช่เกม Soulslike แบบที่คุณคุ้นเคยอย่างแน่นอน", "ความประหลาดใจนี้ไม่ใช่เรื่องบังเอิญ เพราะ Valor Mortis เป็นผลงานจาก One More Level สตูดิโอผู้อยู่เบื้องหลังซีรีส์เกมปาร์กัวร์และดาบสุดระห่ำอย่าง Ghostrunner โดยในเกมนี้ผู้เล่นจะได้รับบทเป็น William Dowsett ทหารในกองทัพ Grande Armée ของนโปเลียน ที่ฟื้นคืนชีพขึ้นมาจากกองซากศพของสหายร่วมรบในสนามรบแห่งหนึ่งในยุโรป แม้ในช่วงแรกเกมจะดูเหมือน Soulslike ทั่วไปที่มีเสียงของนโปเลียนคอยกระซิบสั่งการผ่านจิตใจ แต่จังหวะการต่อสู้ด้วยดาบในมุมมองบุคคลที่หนึ่งนั้นมีความเป็นเอกลักษณ์เฉพาะตัวสูง", "ในช่วงแรก อาวุธหลักของคุณคือดาบเซเบอร์ ซึ่งการต่อสู้จะดำเนินไปในรูปแบบการเต้นรำที่ต้องใช้สมาธิและการอดทนรอจังหวะ คุณต้องฟันเพื่อโจมตีและป้องกันเพื่อลดความเสียหาย โดยการโจมตีต่อเนื่องที่สำเร็จจะช่วยฟื้นฟูพลังชีวิตที่เสียไป ศัตรูบางตัวมีการโจมตีที่ป้องกันไม่ได้ซึ่งบังคับให้คุณต้องหลบหลีกอย่างรวดเร็ว หากจับจังหวะได้แม่นยำ คุณจะได้รับโอกาสในการโจมตีสวนกลับแบบสโลว์โมชัน การป้องกันจะใช้ค่า Endurance ซึ่งต้องรอเวลาฟื้นฟู และการลอบโจมตีจากด้านหลังจะช่วยให้คุณสังหารศัตรูได้อย่างรวดเร็ว นอกจากนี้ ระบบการปัดป้อง (Parry) ที่แม่นยำยังช่วยทำลายท่าทางของศัตรูเพื่อเปิดช่องให้คุณทำท่าเผด็จศึกได้อีกด้วย", ัดกว่ารุ่นก่อนหน้าอย่างเห็นได้ชัด", "โดดเด่นด้วยการเพิ่มอนาล็อกสติ๊กคู่ ช่วยให้การเล่นเกมที่รองรับมีความแม่นยำและทันสมัยมากขึ้น โดยเฉพาะเกมพอร์ตอย่าง Banjo-Kazooie", "ระบบตลับเกมลิขสิทธิ์แท้ยังคงเป็นหัวใจสำคัญ ให้ผู้เล่นได้ครอบครองเกมอย่างถูกต้องและไม่ต้องกังวลเรื่องการถูกถอดออกจากหน้าร้านค้าออนไลน์", "ข้อสังเกตสำคัญคือการตัดพอร์ต HDMI-out ออก และความเร็วในการบูตเครื่องที่ค่อนข้างช้า รวมถึงยังไม่มีโหมด Sleep ทำให้ต้องรอโหลดเครื่องใหม่ทุกครั้งที่เปิดใช้งาน"], "full_paragraphs": ["ท่ามกลางข้อถกเถียงเรื่องความเป็นเจ้าของเกมที่ดุเดือดในปัจจุบัน ระบบเครื่องเล่นเกมของ Evercade จึงมีความสำคัญมากกว่าที่เคย โดย Blaze Entertainment ได้เปิดตัว Evercade ครั้งแรกในปี 2020 ในรูปแบบเครื่องเล่นพกพา และได้พัฒนาอย่างต่อเนื่องเพื่อมอบทางเลือกในการเล่นเกมย้อนยุคที่หลากหลาย ตั้งแต่คอนโซลสำหรับเล่นที่บ้าน ไปจนถึงเครื่องพกพาราคาประหยัดและตู้เกมอาร์เคดขนาดมินิ", "จุดขายสำคัญของอุปกรณ์ Evercade คือความสามารถในการเล่นตลับเกมรวมฮิต (Compilation Cartridges) ซึ่งแต่ละตลับบรรจุเกมย้อนยุคไว้หลายเกม ตลอด 6 ปีที่ผ่านมา Blaze ได้ทำข้อตกลงลิขสิทธิ์กับนักพัฒนาและผู้จัดจำหน่ายทั่วโลกเพื่อวางจำหน่ายตลับเกมอย่างเป็นทางการ โดยคาดว่าจะมีตลับเกมรวมถึง 90 ตลับภายในสิ้นปีนี้ ครอบคลุมค่ายเกมชื่อดังมากมาย เช่น Rare, Activision, Atari, Taito, Codemasters, Data East, SNK / Neo Geo และอื่นๆ อีกมากมาย รวมแล้วมีเกมย้อนยุคให้เล่นมากกว่า 750 เกม", "ตลับเกมแต่ละตลับมาพร้อมกล่องและคู่มือสีที่ระบุวิธีควบคุม เคล็ดลับ และข้อมูลของแต่ละเกม สิ่งที่สำคัญที่สุดคือคุณ 'เป็นเจ้าของ' เกมเหล่านี้อย่างแท้จริง เช่นเดียวกับตลับเกมในอดีต ข้อมูลทั้งหมดถูกบรรจุอยู่ในตลับ ไม่มีการถูกถอดออกจากระบบ (Delisted) ตราบใดที่คุณมีเครื่อง Evercade ที่ใช้งานได้ คุณก็จะสามารถเล่นเกมเหล่านี้ได้ตลอดไป", "ในรุ่น Evercade Nexus ทาง Blaze ได้กลับมาสู่ตลาดเครื่องเล่นพกพาด้วยการปรับปรุงครั้งใหญ่เพื่อตอบสนองต่อคำแนะนำและความต้องการของผู้เล่นตลอด 6 ปีที่ผ่านมา โดย Nexus ไม่ใช่เครื่องเล่นขนาดพกพาที่ใส่กระเป๋ากางเกงได้ง่ายนัก แต่มาพร้อมหน้าจอขนาดใหญ่ 5.89 นิ้ว ซึ่งมีขนาดอยู่ระหว่าง Nintendo Switch และ Switch Lite", "หน้าจอเป็นแบบ IPS แม้อาจจะไม่ถูกใจผู้ที่ชื่นชอบ OLED แต่ในความเป็นจริงเครื่องนี้ไม่ได้ถูกออกแบบมาเพื่อดูภาพยนตร์ Avengers ในระดับ 4K หน้าจอนี้มีความสว่าง สีสันสดใส และตอบสนองได้ดี ซึ่งผู้ที่เคยใช้เครื่อง Evercade รุ่นก่อนหน้าจะเห็นความแตกต่างได้อย่างชัดเจนว่านี่คือหน้าจอที่ดีกว่าเดิมมาก", "ระบบเสียงได้รับการปรับปรุงเช่นกัน ลำโพงสเตอริโอที่หันไปทางด้านหน้าให้เสียงที่ดังกระหึ่มในระดับเสียงสูงสุด นอกจากนี้ยังรองรับหูฟัง 3.5 มม. และมีการเพิ่มการรองรับหูฟัง Bluetooth เป็นครั้งแรกอีกด้วย อย่างไรก็ตาม สิ่งที่หายไปคือพอร์ต HDMI-out ซึ่งเคยมีในรุ่นก่อนหน้า ทำให้การเล่นบนจอทีวีต้องพึ่งพาคอนโซล Evercade VS แทน ซึ่งถือเป็นเรื่องน่าเสียดาย", "สำหรับเกมที่รองรับการควบคุมด้วยอนาล็อกสติ๊ก แม้ปัจจุบันจะมีเพียงประมาณ 15 เกมจาก 750 เกม เช่น Soul Reaver, Tomb Raider 3, Duke Nukem: Time to Kill และ 40 Winks แต่ผู้เล่นก็ยังสามารถเลือกใช้อนาล็อกสติ๊กแทน D-Pad ในเกมอื่นๆ ได้หากต้องการ โดยตัวสติ๊กมีลักษณะเป็นยางและเว้า ซึ่งให้สัมผัสที่ดีแม้จะมีขนาดเล็กและมีความหลวมเล็กน้อย", "จุดเด่นที่แท้จริงของอนาล็อกสติ๊กคือการใช้งานร่วมกับตลับเกมที่แถมมากับเครื่องอย่าง Banjo-Kazooie Double Pack ซึ่งไม่ใช่การรัน ROM บนอีมูเลเตอร์ N64 แต่เป็นการพอร์ตเกมใหม่ที่รองรับจอไวด์สกรีน ความละเอียดสูงขึ้น เฟรมเรต 60fps และรองรับการควบคุมด้วยอนาล็อกคู่ ทำให้การเล่นในโหมดมุมมองบุคคลที่หนึ่งใน Banjo-Tooie ให้ความรู้สึกเหมือนเกม FPS สมัยใหม่", "แม้ว่า Switch 2 จะมีหน้าจอที่ใหญ่กว่า แต่ก็เล่นเกม N64 อย่าง Banjo-Kazooie ในอัตราส่วน 4:3 แบบดั้งเดิม ในขณะที่เวอร์ชัน Evercade เป็นการพอร์ตที่รองรับไวด์สกรีนและรันที่ 60fps ซึ่งแม้จะไม่ใช่ประสบการณ์ดั้งเดิม 100% แต่ก็นับว่าเป็นวิธีเล่นที่ยอดเยี่ยมกว่า เช่นเดียวกับ The Doom Collection ที่มาพร้อมการพอร์ต Doom, Doom 2 และ Mission Packs อีก 6 ชุด ซึ่งการเล่นด้วยอนาล็อกคู่บน Nexus ให้ความรู้สึกที่น่าพึงพอใจอย่างยิ่ง", "โหมด TATE กลับมาอีกครั้งใน Nexus ซึ่งรองรับเกมประมาณ 50 เกมจากทั้งหมด โดยโหมดนี้จะหมุนหน้าจอ 90 องศาเพื่อเล่นเกมอาร์เคดแนวตั้งในอัตราส่วนดั้งเดิม ข้อสังเกตเล็กน้อยคือการควบคุมในโหมดนี้บังคับให้ใช้อนาล็อกสติ๊กแทน D-Pad ซึ่งอาจไม่ถูกใจผู้ที่ชื่นชอบสัมผัสของจอยสติ๊กแบบ 8 ทิศทางแบบดั้งเดิม", "ฟีเจอร์ใหม่อย่าง EverSync ซึ่งคล้ายกับโหมด GameShare ของ Switch 2 ที่ช่วยให้สามารถสตรีมหน้าจอไปยังผู้ใช้ Nexus อีกคนเพื่อเล่นเกมสองคนด้วยตลับเดียว ยังเป็นสิ่งที่ยังไม่ได้ทดสอบอย่างเต็มที่เนื่องจากจำนวนผู้ใช้งานในปัจจุบันยังมีน้อย จึงแนะนำให้รอดูการทดสอบจริงหลังจากวางจำหน่ายไปสักระยะ", "ปัญหาเดียวที่สำคัญของ Evercade Nexus คือเรื่องของประสิทธิภาพการประมวลผล โดยผู้รีวิวระบุว่า 'ปัญหาเดียวที่ผมมีกับ Evercade Nexus คือมันน่าจะต้องการพลังการประมวลผลที่มากกว่านี้อีกสักนิด' ซึ่งเป็นที่เข้าใจได้ว่า Blaze ต้องการให้เครื่องรุ่นเก่าตั้งแต่ปี 2020 ยังคงเล่นตลับเกมใหม่ๆ ได้ ทำให้ Nexus ถูกจำกัดประสิทธิภาพไว้ระดับหนึ่ง ใครที่คาดหวังว่าจะเล่นเกม PS2 บนเครื่องนี้อาจต้องรออุปกรณ์รุ่น 'Next-gen' ที่แท้จริง", "นอกจากนี้ ความเร็วในการบูตเครื่องยังเป็นจุดที่น่ากังวล โดยใช้เวลาถึง 42 วินาทีในการเข้าสู่เมนูหลัก และอีกประมาณ 20 วินาทีในการโหลดเกม Banjo-Kazooie สำหรับอุปกรณ์ที่ออกแบบมาเพื่อเล่นระหว่างเดินทางถือว่าค่อนข้างนาน โดยเฉพาะเมื่อไม่มีโหมด Sleep ทำให้ต้องบูตเครื่องใหม่ทุกครั้งที่เปิดใช้งาน", "อย่างไรก็ตาม เมื่อเครื่องพร้อมใช้งาน Evercade Nexus ถือเป็นเครื่องเล่นเกมพกพาย้อนยุคที่ยอดเยี่ยมและเป็นวิธีที่ดีที่สุดในการเล่นตลับเกมลิขสิทธิ์ของบริษัทในขณะเดินทาง สำหรับผู้ที่เพิ่งเริ่มเข้าสู่โลกของ Evercade เครื่อง Nexus คือตัวเลือกที่ตัดสินใจได้ง่ายมาก และสำหรับผู้ที่มีเครื่องรุ่นเก่าอยู่แล้ว หากคุณสนใจหน้าจอที่ใหญ่และสว่างขึ้น รวมถึงฟีเจอร์มัลติเพลเยอร์ไร้สาย นี่คือการลงทุนที่คุ้มค่าอย่างแน่นอน"], "link": "https://www.videogameschronicle.com/review/evercade-nexus-review-the-best-evercade-handheld-yet-makes-it-a-joy-to-play-retro-games-on-the-move/", "canonical_link": "https://www.videogameschronicle.com/review/evercade-nexus-review-the-best-evercade-handheld-yet-makes-it-a-joy-to-play-retro-games-on-the-move", "cover_image_url": "https://www.videogameschronicle.com/files/2026/09/evercade-nexus.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1791557405, "published_at": "2026-10-09T14:50:05Z", "published_th": "9 ต.ค. 2026 • 21:50 น.", "category_hint": "Review"}, {"id": 1794821821053, "guid": "https://www.eurogamer.net/gears-of-war-eday-review", "original_title": "Gears of War: E-Day review", "thai_title": "รีวิว Gears of War: E-Day – การย้อนเวลากลับไปสู่จุดเริ่มต้นที่ยังคงความมันส์ในแบบฉบับดั้งเดิม", "tag": "Review", "sub_tag": "GEARS OF WAR", "bullet_points": ["Gears of War: E-Day พาผู้เล่นย้อนกลับไปสู่เหตุการณ์วัน Emergence Day ซึ่งเป็นจุดเริ่มต้นของสงครามระหว่างมนุษย์กับ Locust", "โหมด Horde Siege รูปแบบใหม่รองรับผู้เล่นสูงสุด 12 คน แบ่งเป็นหน่วยย่อย 4 คน มอบประสบการณ์การเล่นที่ตื่นเต้นและมีความเป็นทีมเวิร์กสูง", "การเพิ่มปุ่มกระโดดและการปรับปรุงระบบการเคลื่อนไหวทำให้เกมเพลย์มีความคล่องตัวและเป็นธรรมชาติมากขึ้นกว่าภาคก่อนๆ", "ตัวเกมยังคงรักษาเอกลักษณ์ความรุนแรงและระบบ Cover Shooter ไว้ได้อย่างครบถ้วน แม้จะมีปัญหาเรื่องความสมดุลในโหมด Versus และ UI ที่ยังดูซับซ้อนไปบ้าง", "ถือเป็นผลงานที่ผสมผสานความคลาสสิกของซีรีส์เข้ากับเทคโนโลยี Unreal Engine 5 ได้อย่างลงตัวและน่าประทับใจ"], "full_paragraphs": ["แม้ว่า Gears of War: E-Day จะยังคงเต็มไปด้วยการหลบหลังที่กำบัง การยิงปะทะที่ดุเดือด และความดิบเถื่อนแบบลูกผู้ชายตามสไตล์ดั้งเดิม แต่เกมนี้ก็ได้พิสูจน์ให้เห็นว่าการมองย้อนกลับไปในอดีตสามารถช่วยให้เราก้าวไปข้างหน้าได้อย่างแท้จริง", "Gears of War: E-Day อาจกลายเป็นเพียงเกมภาคก่อนหน้า (Prequel) ทั่วไปที่ตั้งคำถามในสิ่งที่ไม่มีใครสนใจ แต่ในความเป็นจริงแล้ว เกมนี้กลับนำเสนอจุดเริ่มต้นของดาว Sera ในปี 2006 ได้อย่างน่าสนใจ โดยคำว่า 'E' ในชื่อเกมย่อมาจาก 'Emergence' ซึ่งหมายถึงวันที่เหล่า Locust เริ่มคลานออกมาจากรูใต้ดินเพื่อทำลายล้างมนุษยชาติเป็นครั้งแรก", "นี่ไม่ใช่คำวิจารณ์ในเชิงลบแต่อย่างใด เพราะผมคิดว่า E-Day ทำหน้าที่ของมันได้อย่างยอดเยี่ยม มันคือเกมยิงที่เน้นการหลบหลังที่กำบัง (Cover Shooter) พร้อมความรุนแรงที่ดูตลกขบขันในสไตล์ Tarantino โดยมีเนื้อเรื่องที่อาจจะดูเปราะบางหากคุณพยายามวิเคราะห์มันนานเกิน 5 นาที แต่สำหรับผมแล้ว มันคือความสนุกที่เพียงพอ ผมไม่ได้คาดหวังเนื้อเรื่องระดับรางวัล Hugo จาก Gears of War แต่ผมต้องการฉากยิงหัวที่สมจริง ระบบการเล่นที่สนุก และปืนเลื่อยไฟฟ้าที่ส่งเสียงคำรามต่างหาก", "ในแง่ของความสนุก เกมนี้ทำออกมาได้ยอดเยี่ยม ผมจะไม่ VR ที่ค่าพลังนักเตะเปลี่ยนไปตามฟอร์มการเล่น และระบบเจรจาซื้อขายที่ลึกซึ้งขึ้น", "แม้ตัวเกมจะมีการปรับปรุงที่ยอดเยี่ยมในสนาม แต่ประเด็นเรื่อง Loot Boxes ใน Ultimate Team ยังคงเป็นที่ถกเถียงในเชิงจริยธรรม"], "full_paragraphs": ["ส่วนเสริมที่น่าประทับใจที่สุดใน EA Sports FC 27 คือโหมดที่เรียกว่า 'The Grounds' ซึ่งเป็นพื้นที่สังคมออนไลน์ที่คุณสามารถนำอวตารที่ปรับแต่งเองมาเดินเล่นและสร้างชื่อเสียงได้ สิ่งที่ทำให้โหมดนี้น่าสนใจไม่ใช่แค่ตัวเกมเพลย์ที่ให้คุณท้าทายผู้เล่นคนอื่นในโหมด Rush (ซึ่งมีกลิ่นอายของ Volta และ Fifa Street) แต่เป็นงานภาพและบรรยากาศ โดยมีพื้นที่ฮับให้สำรวจ 3 แห่ง ได้แก่ สหราชอาณาจักร, ปารีส และอาร์เจนตินา ถนนหนทางดูสะอาดตาและเต็มไปด้วย NPC ที่พลุกพล่าน ราวกับว่านักพัฒนาจาก EA Vancouver และ EA Romania กำลังคารวะให้กับ PlayStation Home ในอดีตที่คุณสามารถเดินเล่นในเมืองจำลอง สวมใส่เสื้อผ้าที่ซื้อมา และเล่นมินิเกมกับผู้เล่นคนอื่นได้", "ยังไม่แน่ชัดว่า The Grounds จะได้รับความนิยมในระยะยาวหรือไม่ แม้จะมีความสนุกชั่วคราวให้สัมผัส โหมด Rush เป็นการเล่นแบบ 5 ต่อ 5 แต่คุณยังสามารถเล่นแบบ 1 ต่อ 1, 2 ต่อ 2 และ 3 ต่อ 3 ได้ (การรอคิวรวดเร็ว แต่อาจมีปัญหาเรื่องแล็กบ้างในบางครั้ง) นอกจากนี้ยังมีกิจกรรมเบาสมองอย่าง Balloon Ball, Bocce Ball และ Bucket Ball ซึ่งเป็นการดัดแปลงเกมอื่นมาใส่ไว้ แม้กิจกรรมเหล่านี้จะไม่ได้มอบความลึกซึ้งมากนัก แต่ถ้า EA ต้องการให้โหมดนี้อยู่ได้นาน การร่วมมือกับ Sega เพื่อนำตัวละครอย่าง AiAi จาก Monkey Ball มาสร้างสีสันอาจเป็นทางเลือกที่น่าสนใจ ส่วนใครที่ชอบความจริงจังก็ยังมี Clubhouse Matches สำหรับการเล่นแบบ 11 ต่อ 11 เต็มรูปแบบ แม้ว่าการเล่นในโหมด Exhibition แบบดั้งเดิมจะรวดเร็วกว่าก็ตาม", "ในส่วนของแอ็กชันในสนามปีนี้ถือว่ามีการปรับจูนให้ช้าลงและมีความสมดุลมากขึ้น แม้ว่าผู้เล่นมักจะบ่นว่าเกมถูกปรับให้ช้าลงทุกปี แต่สุดท้ายผู้เล่นเองก็มักจะหาวิธีเร่งความเร็วหรือหาช่องโหว่เพื่อเอาเปรียบอยู่ดี เช่นใน FC 25 ที่การเลี้ยงบอลแบบ Close-control สร้างความได้เปรียบอย่างมาก และใน FC 27 ก็อาจมีปัญหาคล้ายกันกับ 'Off-balance dribble' ซึ่งเป็นลูกเล่นที่ทำให้กองหน้าบางคนสามารถเลี้ยงบอลผ่านแรงปะทะได้โดยไม่ล้ม ซึ่งดูสมจริงและน่าตื่นเต้น แต่ก็น่าหงุดหงิดหากต้องเผชิญกับมันซ้ำๆ", "เมื่อเริ่มเกม FC 27 คุณสามารถเลือกระหว่าง 'Competitive Gameplay' ที่เน้นความเร็วและการตอบสนอง หรือ 'Authentic Gameplay' ที่เน้นความสมจริงและจังหวะที่ช้าลง ผมเลือกแบบ Authentic และพบว่าการแข่งขันมีน้ำหนักมากขึ้น มีการเน้นการป้องกันแบบ Manual มากขึ้น โดย AI จะช่วยเหลือน้อยลง ฟังก์ชัน Teammate Contain จะทำให้กองหลัง AI คอยประกบห่างๆ เพื่อให้คุณสลับไปควบคุมกองหลังตัวที่ต้องการได้ง่ายขึ้น การสลับตัวผู้เล่นทำได้ลื่นไหล และการตัดบอลด้วยตำแหน่งที่ถูกต้องให้ความรู้สึกที่น่าพอใจมาก ส่วนการจ่ายบอลทะลุช่องทำได้ยากขึ้น และการทำประตูให้ความรู้สึกที่หนักแน่นและเร้าใจกว่าเดิม", "EA ได้ปรับปรุงการเล่นลูกตั้งเตะใหม่ โดยลูกเตะมุมจะช้าลงและต้องใช้ความคิดมากขึ้น กล้องจะซูมเข้าไปในกรอบเขตโทษเพื่อให้คุณเลือกวิ่งหรือบังบอลได้ การเปลี่ยนแปลงที่ใหญ่ที่สุดคือระบบ 'Avoidance' ที่ให้คุณกดปุ่มไหล่เพื่อทำให้ผู้เล่นพริ้วไหวและเบียดเสียดผ่านฝูงชนได้เหมือนนักฆ่าใน Assassin's Creed ซึ่งเพิ่มมิติทางแท็กติกได้ดี ส่วนการเปิดบอลจะมีความอิสระมากขึ้น ทำให้คุณต้องกะระยะและทิศทางให้แม่นยำกว่าเดิม", "อีกหนึ่งฟีเจอร์ใหม่คือ 'Attacking Spatial Awareness' ที่อ้างว่าจะช่วยให้เพื่อนร่วมทีมวิ่งหาช่องได้ฉลาดขึ้น แต่จากการทดลองใช้จริงกลับพบว่าได้ผลบ้างไม่ได้ผลบ้าง บางครั้งผู้เล่นก็วิ่งออกไปในทิศทางที่คาดไม่ถึง แต่ถ้าหากมองว่านักเตะระดับโลกอย่าง Bruno Fernandes อาจจะมีเซนส์ในการหาช่องดีกว่าผม ผมก็ยินดีที่จะยอมรับและปรับตัวตามการตัดสินใจของพวกเขา", "ทีมต่างๆ ในเกมมีความสมจริงตามต้นฉบับ เช่นการแข่งขันระหว่างสเปนกับอาร์เจนตินาที่เต็มไปด้วยความดุเดือดและการปะทะกันอย่างหนักหน่วง อย่างไรก็ตาม งานนำเสนอในบางจุดยังดูเกินจริงไปบ้าง เช่น การเปิดฉากการแข่งขันระหว่าง Middlesbrough กับ Newcastle ด้วยภาพถ่ายดาวเทียมจากอวกาศที่ซูมลงมายังสนาม St. James' Park ราวกับเป็นภารกิจในเกม Call of Duty", "อันที่จริง EA Sports FC และ Call of Duty มีความคล้ายคลึงกันอย่างประหลาด ทั้งคู่เป็นผลิตภัณฑ์จากสำนักพิมพ์ยักษ์ใหญ่ที่ออกวางจำหน่ายเป็นประจำทุกปี และทั้งคู่ต่างก็มีนักเตะชื่อดังอย่าง Lionel Messi, Neymar Jr. และ Paul Pogba มาปรากฏตัว และที่สำคัญคือโหมดหลักที่เคยเป็นหัวใจสำคัญกลับถูกบดบังด้วยโหมดที่เติบโตขึ้นเรื่อยๆ อย่าง Ultim     let currentTag = 'ALL';

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {};

    function getThaiVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      const thaiVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('th'));
      if (thaiVoices.length === 0) return null;
      const preferred = thaiVoices.find(v => {
        const n = (v.name || '').toLowerCase();
        return n.includes('natural') || n.includes('premwadee') || n.includes('niwat') || n.includes('google') || n.includes('kanya');
      });
      return preferred || thaiVoices[0];
    }

    function highlightSpeakingParagraph(paraIdx) {
      const activeClasses = ['bg-zinc-800/60', 'border-l-2', 'border-[#ff3366]', 'pl-3', 'py-1', 'rounded-r', 'text-white'];
      document.querySelectorAll('#modalFullContent p[data-para-idx]').forEach(p => {
        p.classList.remove(...activeClasses);
      });
      if (paraIdx >= 0) {
        const target = document.querySelector(`#modalFullContent p[data-para-idx="${paraIdx}"]`);
        if (target) {
          target.classList.add(...activeClasses);
        }
      }
    }

    function updateTtsButtonUI() {
      const btn = document.getElementById('ttsBtn');
      const icon = document.getElementById('ttsIcon');
      const label = document.getElementById('ttsLabel');
      if (!btn || !icon || !label) return;
      if (isSpeaking) {
        icon.textContent = '⏹';
        label.textContent = 'หยุด';
        btn.className = 'px-2.5 py-1 text-xs font-mono font-bold text-[#ff3366] hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1';
      } else {
        icon.textContent = '🔊';
        label.textContent = 'ฟังข่าว';
        btn.className = 'px-2.5 py-1 text-xs font-mono font-bold text-emerald-400 hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1';
      }
    }

    function stopSpeech() {
      speechSessionId++;
      isSpeaking = false;
      speechQueue = [];
      currentSpeechStep = 0;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      highlightSpeakingParagraph(-1);
      updateTtsButtonUI();
    }

    function speakCurrentStep(sessionId) {
      if (!isSpeaking || sessionId !== speechSessionId || currentSpeechStep >= speechQueue.length) {
        if (sessionId === speechSessionId) stopSpeech();
        return;
      }
      const stepItem = speechQueue[currentSpeechStep];
      highlightSpeakingParagraph(stepItem.paraIdx);

      const u = new SpeechSynthesisUtterance(stepItem.text);
      u.lang = 'th-TH';
      u.rate = SPEECH_RATES[speechRateIdx] || 1.0;
      const thVoice = getThaiVoice();
      if (thVoice) u.voice = thVoice;

      u.onend = () => {
        if (sessionId === speechSessionId && isSpeaking) {
          currentSpeechStep++;
          speakCurrentStep(sessionId);
        }
      };
      u.onerror = (e) => {
        if (e && e.error === 'interrupted') return;
        if (sessionId === speechSessionId && isSpeaking) {
          currentSpeechStep++;
          speakCurrentStep(sessionId);
        }
      };
      window.speechSynthesis.speak(u);
    }

    function startSpeech(resumeStep = 0) {
      if (!('speechSynthesis' in window) || !currentModalItem) return;
      window.speechSynthesis.cancel();
      speechSessionId++;
      const sessionId = speechSessionId;

      speechQueue = [];
      const headline = (currentModalItem.thai_title || currentModalItem.original_title || '').trim();
      if (headline) {
        speechQueue.push({ text: headline, paraIdx: -1 });
      }
      const bodyParas = Array.isArray(currentModalItem.full_paragraphs) ? currentModalItem.full_paragraphs : [];
      bodyParas.forEach((p, idx) => {
        if (p && String(p).trim()) {
          speechQueue.push({ text: String(p).trim(), paraIdx: idx });
        }
      });

      if (speechQueue.length === 0) return;
      currentSpeechStep = Math.max(0, Math.min(resumeStep, speechQueue.length - 1));
      isSpeaking = true;
      updateTtsButtonUI();
      speakCurrentStep(sessionId);
    }

    function toggleSpeech() {
      if (isSpeaking) {
        stopSpeech();
      } else {
        startSpeech(0);
      }
    }

    function cycleSpeechRate() {
      speechRateIdx = (speechRateIdx + 1) % SPEECH_RATES.length;
      const rateBtn = document.getElementById('ttsRateBtn');
      if (rateBtn) rateBtn.textContent = SPEECH_RATES[speechRateIdx] + 'x';
      if (isSpeaking) {
        startSpeech(currentSpeechStep);
      }
    }

    window.addEventListener('beforeunload', () => stopSpeech());

    function applyFontSize() {
      const step = FONT_STEPS[currentFontIdx] || FONT_STEPS[1];
      const fullEl = document.getElementById('modalFullContent');
      const bulletEl = document.getElementById('modalBullets');
      const titleEl = document.getElementById('modalTitle');
      const labelEl = document.getElementById('fontSizeLabel');
      if (fullEl) fullEl.style.fontSize = step.body;
      if (bulletEl) bulletEl.style.fontSize = step.bullet;
      if (titleEl) titleEl.style.fontSize = step.title;
      if (labelEl) labelEl.textContent = step.pct;
    }

    function changeFontSize(delta) {
      const next = Math.max(0, Math.min(FONT_STEPS.length - 1, currentFontIdx + delta));
      if (next !== currentFontIdx) {
        currentFontIdx = next;
        try { localStorage.setItem('pureNewsFontIdx', String(currentFontIdx)); } catch (e) {}
        applyFontSize();
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function handleImgError(img, tag) {
      const step = parseInt(img.getAttribute('data-fb-step') || '0', 10);
      if (step === 0) {
        img.setAttribute('data-fb-step', '1');
        img.src = CATEGORY_FALLBACKS[tag] || CATEGORY_FALLBACKS.Gaming;
      } else {
        img.onerror = null;
        img.src = SVG_FALLBACK_URI;
      }
    }

    function handleGalleryImgError(img) {
      img.onerror = null;
      const wrapper = img.parentElement;
      if (wrapper) wrapper.remove();
      const grid = document.getElementById('modalGalleryGrid');
      const sec = document.getElementById('modalGallerySection');
      if (grid && sec && grid.children.length === 0) {
        sec.classList.add('hidden');
      }
    }

    async function refreshLiveNews(btn) {
      const svg = btn ? btn.querySelector('svg') : null;
      if (svg) svg.classList.add('animate-spin');
      try {
        const r = await fetch('data/news.json?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) {
          const data = await r.json();
          if (Array.isArray(data) && data.length > 0) {
            allNews = data;
            render();
          }
        }
      } catch (err) {
        // Ignore offline/file protocol fetch failures
      } finally {
        if (svg) svg.classList.remove('animate-spin');
      }
    }

    function filterTag(tag) {
      currentTag = tag;
      ['ALL', 'Football', 'Technology', 'Gadgets', 'Gaming', 'Review'].forEach(t => {

            if (t === 'Gaming') textColor = 'text-amber-400';
            if (t === 'Technology') textColor = 'text-cyan-400';
            if (t === 'Gadgets') textColor = 'text-emerald-400';
            if (t === 'Review') textColor = 'text-purple-400';
            btn.className = `px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 ${textColor} font-mono text-xs rounded transition whitespace-nowrap`;
          }
        }
      });
      render();
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      requestAnimationFrame(() => {
        window.scrollTo(0, 0);
      });

    function render() {

      const filtered = allNews
        .filter(item => (currentTag === 'ALL') || (item.tag === currentTag))
        .slice()
        .sort((a, b) => (b.published_ts || 0) - (a.published_ts || 0));

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center py-16 text-zinc-500 font-mono">ไม่มีข่าวในหมวดนี้</div>';
        return;
      }

      filtered.forEach((item, cardIdx) => {
        const originalIndex = allNews.indexOf(item);
        const div = document.createElement('div');
        div.className = 'bg-zinc-900/50 border border-zinc-800 hover:border-zinc-700 transition flex flex-col justify-between overflow-hidden rounded cursor-pointer group';
        div.onclick = () => openModal(originalIndex);
        
        const bulletsHtml = (item.bullet_points || []).slice(0, 3).map(b => 
          `<li class="flex items-start gap-1.5"><span class="text-[#ff3366] font-bold">›</span><span>${escapeHtml(b)}</span></li>`
        ).join('');

        let tagColor = 'text-[#ff3366]';
        if (item.tag === 'Technology') tagColor = 'text-cyan-400';
        else if (item.tag === 'Gadgets') tagColor = 'text-emerald-400';
        else if (item.tag === 'Gaming') tagColor = 'text-amber-400';
        else if (item.tag === 'Review') tagColor = 'text-purple-400';

        const reviewBadge = item.review_score ? `<div class="absolute top-2.5 right-2.5 bg-[#ff3366] text-white font-mono font-extrabold text-xs px-2.5 py-1 rounded shadow-lg border border-white/20">⭐ ${escapeHtml(item.review_score)} / 10</div>` : '';

        const imgSrc = item.cover_image_url || CATEGORY_FALLBACKS[item.tag] || CATEGORY_FALLBACKS.Gaming;
        const loadingAttr = cardIdx < 6 ? 'eager' : 'lazy';
        const safeTag = escapeHtml(item.tag || '');
        const safeSubTag = escapeHtml(item.sub_tag || '');
        const subTagBadge = safeSubTag ? `<span class="px-1.5 py-0.5 rounded bg-zinc-800/90 text-zinc-200 border border-zinc-700/80 text-[10px] font-mono font-semibold tracking-wide uppercase">${safeSubTag}</span>` : '';
        const safeDate = escapeHtml(item.published_th || item.published_at || '');
        const safeTitle = escapeHtml(item.thai_title || item.original_title || '');

        div.innerHTML = `
          <div>
            <div class="w-full aspect-video overflow-hidden bg-zinc-950 relative">
              <img src="${escapeHtml(imgSrc)}" data-tag="${safeTag}" referrerpolicy="no-referrer" loading="${loadingAttr}" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="handleImgError(this, this.dataset.tag)">
              ${reviewBadge}
            </div>
            <div class="p-5">
              <div class="flex items-center flex-wrap gap-1.5 text-[11px] font-mono mb-2.5">
                <span class="${tagColor} font-bold uppercase">${safeTag}</span>
                ${subTagBadge}
                <span class="text-zinc-600">•</span>
                <span class="text-zinc-500">${safeDate}</span>
              </div>
              <h3 class="brand-title text-base font-bold text-white group-hover:text-[#ff3366] transition mb-3 leading-snug line-clamp-2">
                ${safeTitle}
              </h3>
              <ul class="text-xs text-zinc-300 space-y-1.5 font-light">
                ${bulletsHtml}
              </ul>
            </div>
          </div>
          <div class="p-5 pt-0 border-t border-zinc-800/80 text-[11px] font-mono text-zinc-500 flex items-center justify-between">
            <span class="text-zinc-300 group-hover:text-white transition">อ่านรายละเอียดเต็ม →</span>
            <span>${safeSubTag || (safeTag + ' FEED')}</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function openModal(idx) {
      const item = allNews[idx];
      if (!item) return;

      stopSpeech();
      currentModalItem = item;
      const ttsWrap = document.getElementById('ttsControls');
      if (ttsWrap && !('speechSynthesis' in window)) {
        ttsWrap.classList.add('hidden');
      }

      isModalOpen = true;
      history.pushState({ modalOpen: true, newsId: item.id }, '', '#news-' + item.id);

      document.getElementById('modalTag').textContent = item.tag || '';
      const modalSubTag = document.getElementById('modalSubTag');
      if (modalSubTag) {
        if (item.sub_tag) {
          modalSubTag.textContent = item.sub_tag;
          modalSubTag.classList.remove('hidden');
        } else {
          modalSubTag.classList.add('hidden');
          modalSubTag.textContent = '';
        }
      }
      const modalImg = document.getElementById('modalImg');
      modalImg.onerror = null;
      modalImg.src = TRANSPARENT_GIF;
      modalImg.setAttribute('data-fb-step', '0');
      modalImg.onerror = () => handleImgError(modalImg, item.tag);
      modalImg.src = item.cover_image_url || CATEGORY_FALLBACKS[item.tag] || SVG_FALLBACK_URI;

      const scoreBadge = document.getElementById('modalScoreBadge');
      if (scoreBadge) {
        if (item.review_score) {
          scoreBadge.textContent = `⭐ ${item.review_score} / 10`;
          scoreBadge.classList.remove('hidden');
        } else {
          scoreBadge.classList.add('hidden');
          scoreBadge.textContent = '';
        }
      }

      document.getElementById('modalTitle').textContent = item.thai_title || item.original_title || '';
      document.getElementById('modalDate').textContent = item.published_th || item.published_at || '';

      const bulletsList = document.getElementById('modalBullets');
      bulletsList.innerHTML = '';
      (item.bullet_points || []).forEach(b => {
        const li = document.createElement('li');
        li.className = 'flex items-start gap-2';
        li.innerHTML = `<span class="text-[#ff3366] font-bold">›</span><span>${escapeHtml(b)}</span>`;
        bulletsList.appendChild(li);
      });

      // Embedded YouTube Video Section
      const videoSec = document.getElementById('modalVideoSection');
      const videoContainer = document.getElementById('modalVideoContainer');
      videoContainer.innerHTML = '';
      if (Array.isArray(item.videos) && item.videos.length > 0) {
        videoSec.classList.remove('hidden');
        item.videos.forEach(vUrl => {
          const wrap = document.createElement('div');
          wrap.className = 'w-full aspect-video rounded-md overflow-hidden border border-zinc-800 bg-black shadow-lg';
          wrap.innerHTML = `<iframe src="${escapeHtml(vUrl)}?rel=0" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
          videoContainer.appendChild(wrap);
        });
      } else {
        videoSec.classList.add('hidden');
      }

      // Interleave up to 4 inline screenshots cleanly between paragraphs (Magazine layout)
      const fullContentDiv = document.getElementById('modalFullContent');
      fullContentDiv.innerHTML = '';
      const paras = Array.isArray(item.full_paragraphs) && item.full_paragraphs.length > 0 ? item.full_paragraphs : (item.bullet_points || []);
      const images = Array.isArray(item.gallery_images) ? item.gallery_images.slice() : [];
      const maxInline = Math.min(images.length, 4);
      const step = maxInline > 0 ? Math.max(2, Math.floor(paras.length / (maxInline + 1))) : 0;
      let inlineUsedCount = 0;

      paras.forEach((p, pIdx) => {
        const pElem = document.createElement('p');
        pElem.setAttribute('data-para-idx', String(pIdx));
        pElem.className = 'transition-all duration-200';
        pElem.textContent = p;
        fullContentDiv.appendChild(pElem);

        if (step > 0 && inlineUsedCount < maxInline && (pIdx + 1) % step === 0 && (pIdx + 1) < paras.length) {
          const imgUrl = images[inlineUsedCount++];
          const fig = document.createElement('figure');
          fig.className = 'my-5 rounded-md overflow-hidden border border-zinc-800 bg-zinc-950';
          fig.innerHTML = `<a href="${escapeHtml(imgUrl)}" target="_blank" rel="noopener noreferrer" class="block aspect-video overflow-hidden group"><img src="${escapeHtml(imgUrl)}" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="this.closest('figure').remove()" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"></a>`;
          fullContentDiv.appendChild(fig);
        }
      });

      // Remaining Screenshots Gallery (only show images not already displayed inline)
      const gallerySec = document.getElementById('modalGallerySection');
      const galleryGrid = document.getElementById('modalGalleryGrid');
      galleryGrid.innerHTML = '';
      const remainingImages = images.slice(inlineUsedCount);
      if (remainingImages.length > 0) {
        gallerySec.classList.remove('hidden');
        remainingImages.forEach(imgUrl => {
          const a = document.createElement('a');
          a.href = imgUrl;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'block aspect-video overflow-hidden rounded bg-zinc-950 border border-zinc-800 hover:border-[#ff3366] transition group relative';
          a.innerHTML = `<img src="${escapeHtml(imgUrl)}" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="handleGalleryImgError(this)" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`;
          galleryGrid.appendChild(a);
        });
      } else {
        gallerySec.classList.add('hidden');
      }

      document.getElementById('modalSource').href = item.link || '#';
      applyFontSize();
      
      // Open and pin scroll position at the top cover image
      const modalOverlay = document.getElementById('modalOverlay');
      const modalBody = document.getElementById('modalBody');
      modalOverlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      modalOverlay.scrollTop = 0;
      if (modalBody) modalBody.scrollTop = 0;
      requestAnimationFrame(() => {
        modalOverlay.scrollTop = 0;
        if (modalBody) modalBody.scrollTop = 0;
      });
    }

    function closeModal(fromHistory = false) {
      if (!isModalOpen) return;
      isModalOpen = false;
      stopSpeech();
      currentModalItem = null;
      document.getElementById('modalVideoContainer').innerHTML = '';
      document.getElementById('modalOverlay').classList.add('hidden');
      document.body.style.overflow = '';

      if (!fromHistory && history.state && history.state.modalOpen) {
        history.back();
      }
    }

    window.addEventListener('popstate', () => {
      if (isModalOpen) {
        closeModal(true);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isModalOpen) {
        closeModal();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#news-')) {
        const newsId = hash.replace('#news-', '');
        const idx = allNews.findIndex(n => String(n.id) === newsId);
        if (idx !== -1) {
          openModal(idx);
        }
      }
    });

    render();
  </script>
</body>
</html>
