<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure News</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
    .brand-title { font-family: 'Chakra Petch', sans-serif; letter-spacing: -0.02em; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen antialiased selection:bg-[#ff3366] selection:text-white">

  <!-- Clean Minimal Header (Logo + Pure News + Category Tabs) -->
  <header class="border-b border-zinc-800 bg-[#0c0c0e]/95 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Pure News" class="w-10 h-10 rounded-md object-cover border border-zinc-700/80 shadow-sm bg-[#faf7f2]">
        <h1 class="brand-title text-2xl md:text-3xl font-extrabold uppercase text-white tracking-wider leading-none">
          PURE NEWS
        </h1>
      </div>

      <!-- Clean Category Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
        <button onclick="filterTag('ALL')" id="filterALL" class="px-3.5 py-1.5 bg-white text-black font-mono font-bold text-xs rounded transition whitespace-nowrap">ALL</button>
        <button onclick="filterTag('Football')" id="filterFootball" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-mono text-xs rounded transition whitespace-nowrap">PREMIER LEAGUE</button>
        <button onclick="filterTag('Technology')" id="filterTechnology" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-cyan-400 font-mono text-xs rounded transition whitespace-nowrap">THE VERGE</button>
        <button onclick="filterTag('Gadgets')" id="filterGadgets" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-emerald-400 font-mono text-xs rounded transition whitespace-nowrap">GADGETS</button>
        <button onclick="filterTag('Gaming')" id="filterGaming" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-amber-400 font-mono text-xs rounded transition whitespace-nowrap">GAMING</button>
        <button onclick="filterTag('Review')" id="filterReview" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-purple-400 font-mono text-xs rounded transition whitespace-nowrap">GAME REVIEWS</button>
        <button onclick="refreshLiveNews(this)" title="ดึงข้อมูลข่าวล่าสุด" class="p-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 rounded transition ml-1 shrink-0">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards rendered here -->
    </div>
  </main>

  <!-- Top-Pinned Modal Dialog -->
  <div id="modalOverlay" onclick="if(event.target===this) closeModal()" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-start sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="w-full max-w-3xl bg-[#0c0c0e] sm:border sm:border-zinc-800 sm:rounded-lg shadow-2xl overflow-hidden my-0 sm:my-auto max-h-screen sm:max-h-[92vh] flex flex-col">
      
      <!-- Modal Header (Sticky) -->
      <div class="flex items-center justify-between px-3.5 sm:px-6 py-3 border-b border-zinc-800 bg-[#0e0e11] sticky top-0 z-10 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modalTag" class="px-2 py-0.5 rounded text-[11px] sm:text-xs font-mono font-bold uppercase tracking-wider bg-[#ff3366]/15 text-[#ff3366] border border-[#ff3366]/30 truncate"></span>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <div id="ttsControls" class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button id="ttsBtn" onclick="toggleSpeech()" title="ฟังเสียงอ่านข่าว" class="px-2.5 py-1 text-xs font-mono font-bold text-emerald-400 hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1">
              <span id="ttsIcon">🔊</span>
              <span id="ttsLabel" class="hidden sm:inline">ฟังข่าว</span>
            </button>
            <button id="ttsRateBtn" onclick="cycleSpeechRate()" title="ความเร็วเสียงอ่าน" class="px-2 py-1 text-[11px] font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition">1x</button>
          </div>
          <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button onclick="changeFontSize(-1)" title="ลดขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A-</button>
            <span id="fontSizeLabel" class="hidden sm:inline text-[11px] font-mono text-zinc-500 px-1.5 select-none">100%</span>
            <button onclick="changeFontSize(1)" title="เพิ่มขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A+</button>
          </div>
          <button onclick="closeModal()" aria-label="Close" class="w-8 h-8 rounded-full bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center text-xl transition leading-none">&times;</button>
        </div>
      </div>

      <!-- Modal Body (Always resets to scrollTop = 0) -->
      <div id="modalBody" class="p-5 sm:p-6 md:p-8 overflow-y-auto space-y-5 sm:space-y-6">
        <!-- HD Cover Image (16:9 aspect-video so cover never gets awkwardly cropped) -->
        <div class="w-full aspect-video overflow-hidden rounded-md border border-zinc-800 bg-zinc-950 relative">
          <img id="modalImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" referrerpolicy="no-referrer" alt="" class="w-full h-full object-cover">
          <div id="modalScoreBadge" class="hidden absolute top-3 right-3 bg-[#ff3366] text-white font-mono font-extrabold text-sm px-3 py-1.5 rounded shadow-xl border border-white/20"></div>
        </div>

        <!-- Sub-Tag & Publish Date Row -->
        <div class="flex items-center flex-wrap gap-2 text-xs font-mono text-zinc-400">
          <span id="modalSubTag" class="hidden px-2 py-0.5 rounded text-[11px] font-mono font-semibold uppercase tracking-wider bg-zinc-800 text-zinc-200 border border-zinc-700"></span>
          <span id="modalDate" class="text-xs font-mono text-zinc-400"></span>
        </div>

        <!-- Title -->
        <h2 id="modalTitle" class="brand-title text-xl md:text-2xl font-bold text-white leading-snug"></h2>

        <!-- Key Facts Box -->
        <div class="bg-black/60 border-l-2 border-[#ff3366] p-4 rounded-sm">
          <div class="text-xs font-mono text-[#ff3366] uppercase font-bold tracking-wider mb-2">📌 สรุปประเด็นสำคัญ (KEY FACTS):</div>
          <ul id="modalBullets" class="space-y-2 text-sm text-zinc-200"></ul>
        </div>

        <!-- Video Section (Shown when article has YouTube trailers/videos) -->
        <div id="modalVideoSection" class="hidden space-y-3 pt-1">
          <div class="text-xs font-mono text-red-400 uppercase tracking-widest flex items-center gap-1.5 font-bold">
            <span>🎬 วิดีโอตัวอย่าง / TRAILER ในข่าว :</span>
          </div>
          <div id="modalVideoContainer" class="space-y-4"></div>
        </div>

        <!-- Full Multi-Paragraph Translation with Interleaved Magazine Screenshots -->
        <div class="space-y-4 pt-2">
          <div class="text-xs font-mono text-zinc-500 uppercase tracking-widest">// เนื้อหาฉบับเต็ม :</div>
          <div id="modalFullContent" class="space-y-4 text-zinc-300 text-sm md:text-base leading-relaxed font-light"></div>
        </div>

        <!-- Remaining Screenshots Gallery -->
        <div id="modalGallerySection" class="hidden pt-4 border-t border-zinc-800/80">
          <div class="text-xs font-mono text-amber-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
            <span>📸 ภาพประกอบเพิ่มเติม :</span>
          </div>
          <div id="modalGalleryGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t border-zinc-800 bg-[#0e0e11] flex items-center justify-between">
        <a id="modalSource" href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-zinc-900 border border-zinc-700 text-xs font-mono text-white rounded-sm hover:bg-zinc-800 flex items-center gap-1.5 transition">
          <span>อ่านต้นฉบับเต็ม</span>
          <span>→</span>
        </a>
        <button onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-mono text-zinc-300 rounded-sm transition">ปิด</button>
      </div>

    </div>
  </div>

  <script>
    const TRANSPARENT_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    const SVG_FALLBACK_URI = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">' +

as-frank-crystal-palace-appoint-former-spurs-and-brentford-boss-as-pierre-sages-successor-at-selhurst-park", "canonical_link": "https://www.skysports.com/football/news/11095/13610988/thomas-frank-crystal-palace-appoint-former-spurs-and-brentford-boss-as-pierre-sages-successor-at-selhurst-park", "cover_image_url": "https://e0.365dm.com/26/11/1920x1080/skysports-frank-crystal-palace_7401633.jpg?20261108205851", "gallery_images": ["https://e0.365dm.com/26/01/768x432/skysports-premier-league-spurs_7144676.jpg?20260124175127"], "videos": [], "review_score": "", "published_ts": 1794848400, "published_at": "2026-11-16T17:00:00Z", "published_th": "17 พ.ย. 2026 • 00:00 น.", "category_hint": "Football"}, {"id": 1794848467198, "guid": "https://www.skysports.com/football/news/11095/13612908/england-have-golden-opportunity-to-win-euro-2028-says-martin-tyler-as-legendary-commentator-reflects-on-50-year-career", "original_title": "Tyler: England have golden opportunity to win Euro 2028", "thai_title": "มาร์ติน ไทเลอร์ เชื่อมั่น อังกฤษ มีโอกาสทองคว้าแชมป์ยูโร 2028", "tag": "Football", "sub_tag": "ENGLAND", "bullet_points": ["มาร์ติน ไทเลอร์ ตำนานผู้บรรยายฟุตบอลเชื่อมั่นว่าทีมชาติอังกฤษภายใต้การคุมทีมของ โทมัส ทูเคิล มีศักยภาพสูงพอที่จะคว้าแชมป์รายการใหญ่ได้ในอนาคต", "ไทเลอร์ยกย่องฟอร์มการเล่นของอังกฤษในเกมบุกชนะสเปน 3-2 ในศึกยูฟ่า เนชันส์ ลีก ว่าเป็นผลงานที่เกือบสมบูรณ์แบบ โดยเฉพาะในช่วงหนึ่งชั่วโมงแรก", "เจมส์ แทรฟฟอร์ด ได้รับคำชมอย่างมากจากไทเลอร์ โดยมองว่านี่คือจุดเริ่มต้นของการก้าวขึ้นมาเป็นผู้รักษาประตูมือหนึ่งทีมชาติอังกฤษแทนที่ จอร์แดน พิคฟอร์ด", "ไทเลอร์ในวัย 81 ปี ยังคงมีความหวังที่จะได้ทำหน้าที่บรรยายเกมที่ทีมชาติอังกฤษคว้าแชมป์รายการใหญ่เป็นครั้งแรกนับตั้งแต่ปี 1966 ในศึกยูโร 2028"], "full_paragraphs": ["มาร์ติน ไทเลอร์ รู้สึกมั่นใจมากขึ้นกว่าเดิมว่าเขาจะมีโอกาสได้บรรยายเกมที่ทีมชาติอังกฤษคว้าแชมป์รายการใหญ่ระดับนานาชาติ หลังจากได้ชมฟอร์มการเล่นของลูกทีม โทมัส ทูเคิล ในเกมที่บุกไปเอาชนะสเปน 3-2 ในศึกยูฟ่า เนชันส์ ลีก", "ไทเลอร์กล่าวถึงหนังสือเล่มใหม่ของเขาว่า 'มันเป็นประวัติศาสตร์ มันคือสิ่งที่ผมคิดเกี่ยวกับฟุตบอลในช่วงสัปดาห์นั้น มีบทความที่แตกต่างกัน 110 บทความ โดยครึ่งโหลในนั้นเป็นจดหมายจากอเมริกา ผมเขียนบทความละ 500 คำต่อสัปดาห์เป็นเวลาสองปีครึ่ง มันเริ่มต้นในช่วงต้นปี 2004 และสิ้นสุดในเดือนกรกฎาคม 2026'", "อาชีพการงานอันโด่งดังของไทเลอร์เริ่มต้นขึ้นในเดือนธันวาคม 1974 โดยเริ่มบรรยายให้กับสถานีโทรทัศน์ ITV ภูมิภาค Southern Television จากนั้นย้ายไป Yorkshire Television และ Granada ก่อนจะได้รับเลือกให้บรรยายเกมนัดชิงชนะเลิศฟุตบอลโลก 1982 ร่วมกับ เอียน เซนต์ จอห์น และเข้าร่วมงานกับ BSkyB (ซึ่งต่อมากลายเป็น Sky Sports ในปี 1991) ในปี 1990", "ตลอดระยะเวลา 33 ปีที่นั่น เขาได้กลายเป็นเสียงแห่งฟุตบอลสำหรับใครหลายคน โดยได้บรรยายเกมที่น่าจดจำและเต็มไปด้วยดราม่ามากมายในช่วงเวลานั้น 'มันจะครบ 52 ปีในเดือนธันวาคมนี้' ไทเลอร์รำลึกความหลังด้วยความประหลาดใจในความยาวนานของอาชีพตนเอง 'มันพิเศษมากจริงๆ พูดถึงเวลาที่ผ่านไปอย่างรวดเร็วเมื่อคุณกำลังสนุก และผมก็สนุกกับมันมาก เวลาผ่านไปเร็วมาก! จากนั้นพรีเมียร์ลีกก็ถือกำเนิดขึ้น และที่เหลือก็กลายเป็นประวัติศาสตร์'", "ไม่ต้องสงสัยเลยว่า ผลงานการบรรยายพรีเมียร์ลีกที่น่าจดจำที่สุดของไทเลอร์เกิดขึ้นที่สนามเอติฮัด สเตเดียม ในเดือนพฤษภาคม 2012 เมื่อ แมนเชสเตอร์ ซิตี้ ทำสองประตูในช่วงทดเวลาบาดเจ็บเพื่อคว้าแชมป์ลีกเป็นครั้งแรกในรอบ 44 ปี หลังจากเอาชนะ ควีนส์ปาร์ก เรนเจอร์ส และคว้าแชมป์ด้วยผลต่างประตูได้เสียเหนือคู่ปรับตลอดกาลอย่าง แมนเชสเตอร์ ยูไนเต็ด", "ไทเลอร์ตะโกนก้องในจังหวะที่ เซร์คิโอ อเกวโร ยิงประตูชัยว่า 'AGUEROOOOO! ผมสาบานได้เลยว่าคุณจะไม่มีวันเห็นอะไรแบบนี้อีกแล้ว! ดังนั้น จงดูมันไว้ และดื่มด่ำไปกับมัน'", "เมื่อมองย้อนกลับไป ไทเลอร์รู้สึกพอใจกับผลงานการบรรยายที่ถูกเปิดฟังมากที่สุดชิ้นหนึ่งในประเทศนี้ 'ผมคิดว่าคำพูดของผมยังคงใช้ได้ดี และโดยพื้นฐานแล้ว มันคือฟุตบอลที่คุณตอบสนองต่อมัน เราไม่ได้สร้างอะไรขึ้นมาในฐานะผู้บรรยาย เราแค่ตอบสนองต่อสิ่งที่เกิดขึ้น มันเป็นงานเชิงปฏิกิริยา และเราพยายามหาคำพูดที่เหมาะสมในเวลาที่เหมาะสม บางครั้งคุณก็ทำได้ บางครั้งก็ไม่ได้ และเมื่อผมคิดถึงเกมนั้น มันอาจจะเป็นเรื่องราวที่ต่างออกไปหากผมไม่สามารถหาคำพูดเหล่านั้นได้ แต่ผมทำได้ มันเป็นหนึ่งในวันที่ดีของผม'", "เมื่อพูดถึงวันที่ดี นั่นคือสิ่งที่ทีมชาติอังกฤษได้รับในกรุงมาดริดเมื่อคืนวันอาทิตย์ที่ผ่านมา เมื่อทีมเยือนยัดเยียดความพ่ายแพ้ครั้งแรกในรอบ 2 ปีและ 43 นัดให้กับแชมป์โลกและแชมป์ยุโรป ซึ่งไทเลอร์ระบุว่าเป็นผลงานที่เกือบไร้ที่ติ 'นั่นเป็นผลงานที่น่าประทับใจมากของอังกฤษ เป็นเวลาหนึ่งชั่วโมงที่มันเกือบจะสมบูรณ์แบบ และจากนั้นแน่นอนว่ามันกลายเป็นสถานการณ์ที่ 11 ต่อ 10 คน ซึ่งควรจะเป็นแบบนั้นแต่ก็ไม่ได้เป็นเสมอไป ต้องให้เครดิตสเปนที่สร้างคำถามสำคัญที่อังกฤษต้องรับมือ'", "มีผู้เล่นคนหนึ่งที่สะดุดตาไทเลอร์เป็นพิเศษที่สนามว่านต๋า เมโทรโปลิตาโน 'เราพูดถึง โอลด์ แทรฟฟอร์ด กันเยอะ ตอนนี้เราควรพูดถึงหนุ่มน้อย แทรฟฟอร์ด ได้แล้ว ผมคิดว่านั่นจะเป็นวันที่เขาประกาศให้โลกรู้ว่าเขาจะเข้ามาแทนที่ จอร์แดน พิคฟอร์ด ในฐานะผู้รักษาประตูชั้นยอดหรือไม่'", "เขากล่าวเสริมว่า 'ในทันทีทันใดผมก็ไม่รู้ แต่เขาพิสูจน์แล้วว่าเขามีความสามารถที่จะเป็นมือหนึ่งของอังกฤษ แม้อาชีพของจอร์แดนจะไม่จบลงง่ายๆ เพราะเขาจะไม่ยอมให้มันเกิดขึ้น แต่เขาจะตระหนักว่ามีการแข่งขันที่จริงจัง และนั่นคือสิ่งที่เกิดขึ้นในชีวิต คุณมีช่วงเวลาของคุณ แล้วใครบางคนก็เดินเข้ามาและบอกว่า ผมขอมีส่วนร่วมด้วย และไม่ต้องสงสัยเลยว่าอังกฤษคงไม่ชนะเกมนี้หากไม่มีเขา'", "อันที่จริง อังกฤษเล่นได้น่าประทับใจมากตลอดหนึ่งชั่วโมงในมาดริด จนไทเลอร์รู้สึกว่าเขาอยู่ไม่ไกลจากความตื่นเต้นที่จะได้บรรยายเกมที่อังกฤษคว้าถ้วยรางวัลรายการใหญ่เป็นครั้งแรกนับตั้งแต่ปี 1966 'ผมอยากทำแบบนั้นมาก ที่ใกล้เคียงที่สุดคือตอนที่ผมบรรยายชุดยู-18 ที่มี แกรี เนวิลล์ เล่นในปี 1993'", "ไทเลอร์กล่าวต่อว่า 'ผมเห็นอังกฤษตกรอบในฟุตบอลโลกแทบทุกครั้งตั้งแต่ใครๆ ก็จำความได้ ผมเห็นอังกฤษตกรอบแม้กระทั่งปี 1954, 1962 และ 1966 ในฐานะผู้ชมทางโทรทัศน์ และในปี 1970 ผมจำได้ว่าเดินออกไปบนถนนและถามว่า เราแพ้ได้อย่างไร? เราเป็นแชมป์เก่า ซึ่งทำให้มันเจ็บปวดมากขึ้นไปอีก!'", "เขากล่าวทิ้งท้ายว่า 'อังกฤษดูมีความสามารถที่จะชนะ ผมหวังจริงๆ ว่าพวกเขาจะคว้าแชมป์เนชันส์ ลีก ได้ เพราะผมให้ค่ากับรายการนี้มาก ผมไม่สามารถเชื่อได้เลยว่าจะมีทีมชาติใดในโลกที่รับมือกับฟอร์มการเล่นแบบนั้นได้ นั่นคือระดับสูงสุด และในฟุตบอลสมัยใหม่ที่การเพรสซิ่งคือทุกอย่าง พวกเขาบีบจนแชมป์โลกแทบหายใจไม่ออก มันเป็นช่วงเวลาที่น่าตื่นเต้นสำหรับอังกฤษ ผมเชื่อมั่นจริงๆ ว่าทีมนี้จะคว้าแชมป์อะไรสักอย่าง และนั่นคือโอกาสทองที่กำลังจะมาถึงในศึกยูโรครั้งหน้า'", "ไทเลอร์ในวัย 81 ปี ยังคงหวังว่าจะได้บรรยายการแข่งขันฟุตบอลชิงแชมป์แห่งชาติยุโรปในปี 2028 ซึ่งเขาอาจได้รับโอกาสนั้นในการบรรยายภาพ แฮร์รี เคน กัปตันทีมชาติอังกฤษ เดินขึ้นบันไดที่สนามเวมบลีย์เพื่อชูถ้วยรางวัล อองรี เดอโลเนย์ 'เมื่อคุณอายุมากขึ้น ผมอยากบอกทุกคนที่ผ่านช่วงอายุหนึ่งไปแล้วว่า อย่าเกษียณ จงทำสิ่งต่างๆ ในชีวิตของคุณต่อไป!'"], "link": "https://www.skysports.com/football/news/11095/13612908/england-have-golden-opportunity-to-win-euro-2028-says-martin-tyler-as-legendary-commentator-reflects-on-50-year-career", "canonical_link": "https://www.skysports.com/football/news/11095/13612908/england-have-golden-opportunity-to-win-euro-2028-says-martin-tyler-as-legendary-commentator-reflects-on-50-year-career", "cover_image_url": "https://e0.365dm.com/26/11/1920x1080/skysports-martin-tyler_7407904.jpg?20261116160546", "gallery_images": ["https://e0.365dm.com/23/06/768x432/skysports-martin-tyler-sky-sports_6189988.jpg?20230617083738", "https://e0.365dm.com/23/06/768x432/skysports-martin-tyler-wayne-rooney_6190041.jpg?20230617095802", "https://e0.365dm.com/26/11/768x432/skysports-england-konsa-white_7407466.jpg?20261116003749", "https://e0.365dm.com/23/02/768x432/skysports-martin-tyler-sky-sports_6066971.jpg?20230223115152", "https://e0.365dm.com/24/10/768x432/skysports-the-football-museum_6711401.png?20241009124756", "https://e0.365dm.com/26/07/768x432/skysports-kevin-keegan-martin-tyler_7302643.jpg?20260720165830", "https://e0.365dm.com/19/01/768x432/skysports-martin-tyler-fa-cup_4540695.jpg?20190108133947"], "videos": [], "review_score": "", "published_ts": 1794843900, "published_at": "2026-11-16T15:45:00Z", "published_th": "16 พ.ย. 2026 • 22:45 น.", "category_hint": "Football"}, {"id": 1794844906400, "guid": "https://www.skysports.com/football/live-blog/11095/13025492/man-utd-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-a updates-and-latest-on-deals-signings-loans-and-contracts", "cover_image_url": "https://e1.365dm.com/26/11/1920x1080/skysports-premier-league-manchester-united_7403807.jpg?20261111114625", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794843000, "published_at": "2026-11-16T15:30:00Z", "published_th": "16 พ.ย. 2026 • 22:30 น.", "category_hint": "Football"}, {"id": 1794843039513, "guid": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "original_title": "How Frank can restore reputation and save Crystal Palace", "thai_title": "ภารกิจกู้ชีพ! โธมัส แฟรงค์ เตรียมรับงานคุม คริสตัล พาเลซ หวังฟื้นฟูชื่อเสียงในพรีเมียร์ลีก", "tag": "Football", "sub_tag": "CRYSTAL PALACE", "bullet_points": ["โธมัส แฟรงค์ เตรียมเข้ารับตำแหน่งผู้จัดการทีมคนใหม่ของ คริสตัล พาเลซ หลังทีมทำผลงานย่ำแย่รั้งอันดับบ๊วยของตาราง", "ความท้าทายสำคัญของแฟรงค์คือการปรับปรุงเกมรับที่เสียประตูมากที่สุดในลีกถึง 24 ลูก และการสร้างความเชื่อมั่นให้กับทีมที่ขาดคุณภาพหลังจากเสียผู้เล่นตัวหลักไปในช่วงซัมเมอร์", "แม้สถานการณ์จะดูยากลำบาก แต่พาเลซยังมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายในช่วง 10 นัดแรกในรอบ 24 ปี", "แฟรงค์ตั้งเป้าใช้ประสบการณ์จากการคุม เบรนท์ฟอร์ด มาปรับใช้เพื่อสร้างความมั่นคงและยกระดับทีมให้กลับมาแข่งขันได้อีกครั้ง"], "full_paragraphs": ["คริสตัล พาเลซ กำลังจะกลายเป็นสโมสรที่ 3 ในลอนดอนที่ โธมัส แฟรงค์ เข้ามาคุมทีม ต่อจาก เบรนท์ฟอร์ด และ ท็อตแนม ฮอตสเปอร์", "เมื่อเดือนมิถุนายนที่ผ่านมา โธมัส แฟรงค์ ได้กล่าวไว้ว่า \"เมื่อถึงเวลาที่เหมาะสม ผมจะตั้งตารอการกลับมาทำหน้าที่ผู้จัดการทีมอีกครั้ง พร้อมที่จะทุ่มเทให้กับงานด้วยพลังงานและความมุ่งมั่นอย่างเต็มที่\" และเวลานั้นก็มาถึงแล้ว เมื่อกุนซือชาวเดนมาร์กรายนี้กำลังจะได้รับการประกาศให้เป็นนายใหญ่คนใหม่ของ คริสตัล พาเลซ ทีมที่ปัจจุบันรั้งอันดับบ๊วยของตารางพรีเมียร์ลีก โดยมีแต้มห่างจากโซนปลอดภัยอยู่ 2 คะแนน และมีผลต่างประตูได้เสียที่เป็นรอง", "ก่อนหน้านี้ ปิแอร์ เซจ อดีตหัวหน้าผู้ฝึกสอนของพาเลซ เพิ่งถูกปลดออกจากตำแหน่งเมื่อสัปดาห์ที่ผ่านมา หลังจากคุมทีมไปเพียง 16 นัดรวมทุกรายการ ซึ่งการเข้ามารับงานในครั้งนี้ถือเป็นโอกาสสำคัญที่แฟรงค์จะกู้ชื่อเสียงของตนเองกลับคืนมา หลังจากถูก ท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมาหลังคุมทีมได้เพียง 8 เดือน", "ร็อบ กรีน อดีตผู้รักษาประตูทีมชาติอังกฤษและ เวสต์แฮม ยูไนเต็ด กล่าวกับ BBC Sport ว่า \"มันจะเป็นเรื่องที่น่าตกใจสำหรับ โธมัส แฟรงค์ เล็กน้อย เขาเคยประสบความสำเร็จที่ เบรนท์ฟอร์ด ซึ่งเป็นสโมสรที่มีการบริหารจัดการที่ดีเยี่ยม มีการวางแผนและคิดมาอย่างดีในการดึงนักเตะเข้ามาทดแทนคนที่ขายออกไปเพื่อทำกำไร แต่สิ่งนั้นไม่ได้เกิดขึ้นที่ คริสตัล พาเลซ พวกเขาสูญเสียผู้เล่นไปแล้วต้องรีบหาคนมาแทนอย่างฉุกละหุก ทีมชุดนี้ถูกลดทอนคุณภาพลงจากการขายนักเตะออกไปโดยไม่มีใครที่มีคุณภาพเท่าเดิมเข้ามาแทนที่ โธมัส แฟรงค์ จำเป็นต้องค้นหาบางอย่างภายในทีมเพื่อสร้างความเชื่อมั่นว่าพวกเขาสามารถแข่งขันในพรีเมียร์ลีกได้ เพราะในตอนนี้มันดูห่างไกลจากจุดนั้นมาก\"", "นับตั้งแต่ถูกปลดจาก ท็อตแนม ฮอตสเปอร์ หลังคุมทีมในลีกไป 26 นัดเมื่อฤดูกาลที่แล้ว แฟรงค์ว่างเว้นจากการคุมทีมมานานกว่าช่วงเวลาที่เขาคุมทีมสเปอร์สเสียอีก ในช่วงซัมเมอร์เขาเคยออกแถลงการณ์ว่า \"มีการพูดคุยและโอกาสต่างๆ\" เข้ามาให้เขากลับไปทำงาน แต่เขา \"ตัดสินใจที่จะไม่รีบร้อนรับงานถัดไป\"", "พอล โรบินสัน อดีตผู้รักษาประตู ท็อตแนม ฮอตสเปอร์ และทีมชาติอังกฤษ กล่าวว่า \"พาเลซเคยมีหนึ่งในผู้จัดการทีมที่ดีที่สุดเท่าที่พวกเขาเคยมีมา หรืออาจจะดีที่สุดตลอดกาลด้วยซ้ำ ที่พาทีมคว้าถ้วยรางวัลมาครอง ลองดูสิ่งที่พวกเขาทำได้เมื่อฤดูกาลที่แล้วสิ แทนที่จะต่อยอดจากจุดนั้น พวกเขากลับรื้อทีมทิ้ง พวกเขาถอยหลังลงคลอง\"", "แฟรงค์เคยเปรียบเปรยการเป็นผู้จัดการทีมว่าเหมือนการอยู่บน \"วงล้อหนูถีบจักร\" และ \"ละครสัตว์ที่บ้าคลั่ง\" ดังนั้นการที่เขาตัดสินใจกลับมาคุมทีมที่รั้งท้ายตารางในตอนนี้ จึงเป็นเรื่องที่น่าสนใจ โดยแฟรงค์ซึ่งเคยเป็นส่วนหนึ่งของทีมวิเคราะห์ฟุตบอลโลกของ BBC Sport ในช่วงซัมเมอร์ จะกลับมาทำงานด้วยความสดชื่นและพลังงานที่เต็มเปี่ยมหลังจากห่างหายจากวงการไปหลายเดือน", "ระหว่างการรับตำแหน่งที่ เบรนท์ฟอร์ด ในเดือนตุลาคม 2018 จนถึงวันที่ถูกปลดจาก สเปอร์ส เมื่อต้นปีนี้ เขาทำงานโดยไม่มีวันหยุดพักมานานถึง 7 ปีกับอีก 4 เดือน การใช้เวลาช่วงไม่กี่เดือนที่ผ่านมาห่างจากความกดดันของพรีเมียร์ลีก ทำให้แฟรงค์ได้ \"ศึกษา สังเกต และเรียนรู้จากผู้นำคนอื่นๆ ทั้งในและนอกวงการกีฬา\" ตามคำกล่าวของเขาเอง", "แฟรงค์ซึ่งให้ความสำคัญอย่างยิ่งกับการจัดระเบียบลูกตั้งเตะ จะต้องรีบปรับจูนทีมทันทีที่ คริสตัล พาเลซ ซึ่งแพ้ในลีกมา 4 นัดติดต่อกัน โดยทีมเสียประตูไปแล้วถึง 24 ลูก ซึ่งมากที่สุดในพรีเมียร์ลีก และยิงได้เพียง 10 ประตูเท่านั้น", "ทอม อัลนัตต์ นักข่าวฟุตบอลจาก The Times กล่าวกับรายการ Football Daily ของ BBC Radio 5 Live ว่า \"หากคุณต้องการใครสักคนเข้ามาเพื่อสร้างความมั่นคงและความแข็งแกร่งในเกมรับ พร้อมกับปรับปรุงเรื่องลูกตั้งเตะ โธมัส แฟรงค์ คือคนที่สมบูรณ์แบบสำหรับงานนี้\"", "ด้วยการที่พรีเมียร์ลีกเพิ่งผ่านไปเพียง 10 นัด แฟรงค์ยังมีเวลามากพอที่จะพลิกสถานการณ์ และเขาน่าจะมีเป้าหมายในใจสำหรับการเสริมทัพเมื่อตลาดซื้อขายนักเตะเปิดขึ้นในเดือนมกราคม โดยในช่วงซัมเมอร์ที่ผ่านมา พาเลซขาย แม็กซองซ์ ลาครัวซ์ กองหลังชาวฝรั่งเศสให้ เชลซี ในราคา 52 ล้านปอนด์ และ ดาเนียล มูญอซ แบ็กขวาชาวโคลอมเบียให้ นอตทิงแฮม ฟอเรสต์ ในราคา 22 ล้านปอนด์ ซึ่งอัลนัตต์เสริมว่า \"เรารู้ว่าพวกเขาขายนักเตะฝีเท้าดีออกไปเยอะมาก และจนถึงตอนนี้ผมไม่คิดว่าพวกเขาจะหาใครมาแทนที่ได้อย่างเหมาะสม\"", "ความท้าทายอีกประการสำหรับแฟรงค์คือการดึงฟอร์มเก่งของ อดัม วอร์ตัน กองกลางที่ไม่ได้ลงเล่นให้ทีมชาติอังกฤษมาตั้งแต่เดือนมีนาคมให้กลับมาอีกครั้ง ซึ่งสิ่งเหล่านี้คือความท้าทายที่ผู้จัดการทีมคนใหม่พร้อมจะเผชิญ", "พอล โรบินสัน กล่าวทิ้งท้ายว่า \"คริสตัล พาเลซ และ โธมัส แฟรงค์ ดูจะเป็นส่วนผสมที่ลงตัวมาก\" ทั้งนี้ โธมัส แฟรงค์ มีงานหนักรออยู่ เพราะ คริสตัล พาเลซ คือทีมที่แย่ที่สุดในพรีเมียร์ลีกฤดูกาลนี้อย่างไม่ต้องสงสัย โดยรั้งอันดับบ๊วยทั้งในแง่ของคะแนน (7 คะแนน) ผลต่างประตูได้เสีย (-14) และค่าคาดหวังประตูได้เสีย (-8.1)", "ในส่วนของเกมรับคือจุดที่แฟรงค์ต้องให้ความสำคัญมากที่สุด ไม่เพียงแต่เสียประตูมากที่สุด (24 ลูก) แต่ยังปล่อยให้คู่แข่งยิงมากที่สุด (189 ครั้ง) และมีค่าคาดหวังการเสียประตู (xGA) แย่ที่สุดในลีกที่ 21.9", "อย่างไรก็ตาม ในส่วนของเกมรุกถือว่าไม่ได้แย่จนเกินไป แม้จะมีเพียง ฮัลล์ ซิตี้ เท่านั้นที่ยิงน้อยกว่า แต่พาเลซก็สร้างโอกาสได้ดีและอาจโชคร้ายที่ยิงประตูไม่ได้มากกว่านี้จากโอกาสที่มี", "นอกจากนี้ยังม ็นจ่าฝูง โดยมีสถิติเกมรับที่แข็งแกร่งเสียเพียง 0.5 ประตูต่อ 90 นาที", "แมรี เอิร์ปส์ โชว์ฟอร์มหนึบให้ ลอนดอน ซิตี้ ด้วยการเซฟสำคัญหลายครั้ง รวมถึงลูกยิงของ ฟรีดา มานุม ช่วยให้ทีมแบ่งแต้มจากอาร์เซนอลที่เอมิเรตส์สเตเดียม", "ฟอร์มการเล่นของทั้ง บรอนซ์ และ เอิร์ปส์ ตอกย้ำให้เห็นถึงความเป็นมืออาชีพและประสบการณ์ระดับสูงที่ยังคงเป็นประโยชน์ต่อต้นสังกัดในศึกวีเมนส์ซูเปอร์ลีก"], "full_paragraphs": ["ลอรา ฮันเตอร์ นักข่าวสายดิจิทัลกลับมาอีกครั้งในฤดูกาลที่สองกับคอลัมน์พิเศษสำหรับวีเมนส์ซูเปอร์ลีก (WSL) โดยในสัปดาห์นี้เธอได้วิเคราะห์ประเด็นสำคัญจากเกมการแข่งขันช่วงสุดสัปดาห์ที่ผ่านมา ซึ่งโฟกัสไปที่ฟอร์มการเล่นอันยอดเยี่ยมของสองตำนานทีมชาติอังกฤษอย่าง ลูซี บรอนซ์ และ แมรี เอิร์ปส์", "ไม่มีอะไรทำให้ ลูซี บรอนซ์ ภูมิใจไปกว่าการเก็บคลีนชีต เธอชื่นชอบการปะทะและการแย่งชิงบอลในสนามอย่างแท้จริง ในเกมที่พบกับแมนเชสเตอร์ ซิตี้ ความมุ่งมั่นของเธอในการให้ความสำคัญกับหน้าที่เกมรับเหนือสิ่งอื่นใด ช่วยให้เชลซีคว้า 3 คะแนนอันล้ำค่ามาครองได้สำเร็จ", "นับตั้งแต่เดือนพฤศจิกายน 2025 เป็นต้นมา คาดิจา ชอว์ ดาวยิงสูงสุดของ WSL ไม่เคยพลาดการยิงเข้ากรอบในเกมการแข่งขันมาก่อน แต่ บรอนซ์ สามารถหยุดสถิตินั้นได้ โดยเธอได้รับความช่วยเหลือจากเพื่อนร่วมแนวรับคนอื่นๆ อย่าง เวียร์เล บูร์มัน ที่โดดเด่นเช่นกัน แต่กัปตันทีมเชลซีคือผู้นำในการปิดตายเกมรุกของคู่แข่ง", "ชอว์ถูกตัดขาดจากเกม มีเวลาและพื้นที่ในการเล่นจำกัด รวมถึงการเคลื่อนที่ที่ถูกจำกัดอย่างหนัก บรอนซ์กล่าวกับ BBC Sport หลังจบเกมว่า 'เราต้องเล่นเหมือนสุนัขล่าเนื้อในเกมนี้ เรามีสมาธิกับเรื่องนั้นมากจริงๆ' พวกเธอสามารถหยุดชะงักชอว์ในแบบที่น้อยทีมในยุโรปจะทำได้ โดยบรอนซ์ทำหน้าที่เป็นหัวใจสำคัญทั้งในด้านเทคนิคและแท็กติก", "นี่คือชัยชนะครั้งสำคัญที่สุดของเชลซีในฤดูกาลนี้ ซึ่งทำให้พวกเธอแซงหน้าคู่แข่งที่ยิ่งใหญ่ที่สุดในการลุ้นแชมป์ปีนี้ไปได้ โดยทีมของ 'สิงห์บลูส์' สร้างผลงานบนพื้นฐานของความเหนียวแน่นเป็นหลัก ซึ่งจนถึงตอนนี้พวกเธอเสียประตูเฉลี่ยเพียง 0.5 ประตูต่อ 90 นาทีเท่านั้น", "โซเนีย บอมปาสตอร์ กุนซือเชลซีเน้นย้ำถึงความสำคัญของการชนะในการดวลตัวต่อตัวก่อนเริ่มเกม และแนวคิดนั้นก็สะท้อนออกมาผ่านทีมของเธอ เธอได้ชื่นชมความเป็นผู้นำของบรอนซ์ในการรับมือกับภัยคุกคามจากซิตี้หลังจบเกม โดยบรอนซ์ปิดท้ายฟอร์มอันยอดเยี่ยมด้วยสถิติการมีส่วนร่วมในเกมรับสูงสุดถึง 13 ครั้ง", "ในภาพรวม เชลซีชนะการดวล 47 ต่อ 37 ครั้ง และครองบอลได้ดีกว่า โดยมีการกดดันอย่างเป็นระบบและต่อเนื่องในแดนคู่แข่ง บรอนซ์ยังเป็นผู้ชนะในเกมนี้ด้วย โดยไม่มีผู้เล่นเชลซีคนใดสร้างโอกาสได้มากกว่าเธอ (2 ครั้ง) หรือจ่ายบอลในพื้นที่สุดท้ายได้แม่นยำกว่าเธอ (9 ครั้ง) นอกจากนี้เธอยังมีสถิติการสัมผัสบอลมากที่สุดในทีม (87 ครั้ง)", "ในขณะเดียวกัน ชอว์ถูกจำกัดให้สัมผัสบอลในแดนรับของซิตี้ถึง 45 เปอร์เซ็นต์ และได้รับบอลจากผู้รักษาประตู อายากะ ยามาชิตะ (6 ครั้ง) มากกว่าผู้เล่นเอาต์ฟิลด์คนอื่นๆ จังหวะการเล่นปกติของซิตี้ถูกรบกวนอย่างหนัก ส่งผลให้ดาวยิงรายนี้ไม่สามารถทำประตูได้ในเกมลีกเป็นครั้งแรกของฤดูกาล", "แม้ในช่วงครึ่งหลังที่ อันเดร เยเกลอร์ทซ์ ปรับแผนโดยส่ง วิเวียนน์ มิเดมา ลงมาเล่นในพื้นที่ว่างหลังชอว์ แต่เชลซีก็ปรับตัวตามได้ทัน บรอนซ์สัมผัสได้ถึงอันตรายและสั่งการให้เพื่อนร่วมทีมปฏิบัติตามความเป็นผู้นำของเธอ", "สถานการณ์ในนาทีที่ 75 สรุปความมุ่งมั่นของเชลซีได้อย่างสมบูรณ์แบบ เมื่อบอลถูกจ่ายทะลุช่องไปให้ชอว์ ซึ่งปกติจะพักบอลได้ดี แต่ในจังหวะนี้ บูร์มัน เข้ากดดันอย่างดุดันจนแย่งบอลมาได้ ก่อนที่ แอกกี บีเวอร์-โจนส์ และ ไมกะ ฮามาโนะ จะประสานงานกันและจ่ายบอลยาวไปให้ อลิสซา ทอมป์สัน วิ่งทำทางไปที่เสาไกล", "เหตุการณ์ที่ตามมาคือจุดเริ่มต้นของจุดจบสำหรับซิตี้ ยามาชิตะ พยายามออกมาตัดบอลแต่กะจังหวะพลาดจนถูกใบแดงไล่ออกจากสนามจากการทำฟาวล์ทอมป์สันในจังหวะหลุดเดี่ยว หากซิตี้ลำบากอยู่แล้วเมื่อมีผู้เล่น 11 คน การเล่นด้วยผู้เล่น 10 คนยิ่งทำให้ภารกิจเป็นไปไม่ได้", "บอมปาสตอร์วางแท็กติกได้อย่างแม่นยำที่สแตมฟอร์ดบริดจ์ โดยสร้างสมดุลระหว่างความเสี่ยงและความมั่นคง แต่เธอต้องพึ่งพาการปฏิบัติตามแผนของลูกทีม ซึ่งพวกเธอก็ทำได้ดีเยี่ยม โดยเฉพาะ บรอนซ์ ที่ยังคงรักษามาตรฐานไว้ได้อย่างคงเส้นคงวา", "อีกคนที่ยอมรับว่า 'รักการเล่นเกมรับ' ในสุดสัปดาห์นี้คือ แมรี เอิร์ปส์ ความกล้าหาญของเธอในการปกป้องประตูของลอนดอน ซิตี้ ที่เอมิเรตส์สเตเดียม ช่วยให้ทีมเก็บหนึ่งแต้มอันล้ำค่าจากอาร์เซนอล ในขณะที่พวกเธอยังคงรั้งอันดับ 3 และเกาะกลุ่มผู้นำต่อไป 'เกมนี้สรุปได้ว่าทำไมฉันถึงอยากกลับมาเล่นในลีกที่ดีที่สุดในโลก' เธอกล่าวกับ โน สเตเดียม ทำให้เกิดคำถามว่าเขาคือตัวเลือกเบอร์หนึ่งของ โธมัส ทูเคิล แล้วหรือไม่?", "อังกฤษมีมือหนึ่งคนใหม่แล้วหรือยัง? โธมัส ทูเคิล ยืนยันว่ายังไม่ใช่ “ไม่มีมือหนึ่ง” เขากล่าว แต่ จอร์แดน พิคฟอร์ด อาจต้องทำงานหนักเพื่อทวงตำแหน่งคืนจาก เจมส์ แทรฟฟอร์ด หลังจากได้เห็นฟอร์มการเล่นของเขาในเกมที่อังกฤษเอาชนะสเปน 3-2", "การที่แทรฟฟอร์ดได้ออกสตาร์ทเป็นตัวจริงถือเป็นเรื่องที่มีนัยสำคัญ พิคฟอร์ดเป็นมือหนึ่งที่ไร้ข้อกังขาของอังกฤษมานานนับทศวรรษ เขาเป็นผู้เล่นที่รับใช้ชาติอย่างยอดเยี่ยมด้วยสถิติการลงสนาม 94 นัด ซึ่งเป็นรองเพียงแค่ ปีเตอร์ ชิลตัน ในบรรดาผู้รักษาประตูที่ติดทีมชาติมากที่สุด", "อย่างไรก็ตาม นี่คือบททดสอบที่ใหญ่ที่สุดของอังกฤษในแคมเปญเนชันส์ลีก และทูเคิลเลือกใช้แทรฟฟอร์ด โดยได้รับแรงสนับสนุนจากฟอร์มการเล่นของเขาในเกมที่พบกับสเปนในบ้านและเกมเยือนสาธารณรัฐเช็กเมื่อเดือนกันยายน “เขาเล่นได้อย่างยอดเยี่ยม” ทูเคิลกล่าวเสริมหลังจบเกม", "หากนี่คือการผลัดใบ ก็ถือว่าเป็นการจัดการที่ระมัดระวัง “ผมคิดว่ามันเป็นการจัดการที่ฉลาด” รอย คีน กูรูจากสกายสปอร์ตส์กล่าว “นี่เป็นเวลาที่สมบูรณ์แบบสำหรับแทรฟฟอร์ดที่จะก้าวเข้ามาเจอกับผู้เล่นระดับท็อป และแสดงให้เห็นว่าเขาสามารถทำอะไรได้บ้าง”", "แทรฟฟอร์ดแทบไม่มีงานให้ทำเลยจนกระทั่ง เอลเลียต แอนเดอร์สัน ถูกไล่ออกในนาทีที่ 63 ซึ่งในตอนนั้นสเปนยังไม่มีจังหวะยิงตรงกรอบเลยด้วยซ้ำ หน้าที่เดียวของนายทวารวัย 24 ปี คือการเตะเปิดเกมและการผ่านบอลในขณะที่เจ้าบ้านพยายามบุกเข้าใกล้ประตูของเขา", "แต่ทุกอย่างเปลี่ยนไปเมื่อแอนเดอร์สันออกจากสนาม ทันใดนั้นแทรฟฟอร์ดต้องเผชิญกับผู้เล่นสเปนที่ดาหน้าเข้ามาและระดมยิงใส่ไม่ยั้ง", "สมาธิของเขาไม่วอกแวก ผลงานที่โดดเด่นที่สุดคือการเซฟสองจังหวะในช่วงทดเวลาบาดเจ็บ เมื่อเขาพุ่งตัวไปทางขวาเพื่อปฏิเสธลูกยิงของ เฟร์มิน โลเปซ แล้วลุกขึ้นมาปัดลูกซ้ำของ มิเกล โอยาร์ซาบัล ออกหลังไปได้ทันควัน", "“ทุกครั้งที่คุณดูผู้รักษาประตูฝึกซ้อม มันก็คือแบบนั้น การเซฟแล้วต้องมีปฏิกิริยาตอบสนองทันที” รอย คีน กล่าวชื่นชมความเร็วของปฏิกิริยาตอบสนองของเขา โดยหลังจบเกมเพื่อนร่วมทีมต่างวิ่งเข้ามารุมล้อมแทรฟฟอร์ดด้วยความยินดี", "แต่เขาก็ได้ป้องกันลูกอันตรายจากสเปนไว้หลายครั้งก่อนหน้านั้น ในนาทีที่ 74 เขาปฏิเสธลูกยิงของโลเปซจากจังหวะเตะมุม เขาแทบทำอะไรไม่ได้ในประตูที่สองของสเปนที่ยิงโดย นิโก วิลเลียมส์ จากการเปิดบอลที่สมบูรณ์แบบของ ลามีน ยามาล", "แต่แทรฟฟอร์ดก็ยังตื่นตัวและเซฟลูกยิงของ ลามีน ยามาล ได้หลังจากนั้นไม่นาน เขายังลุกขึ้นมาป้องกันลูกยิงมุมแคบของ มาร์ก กูกูเรยา ไม่ให้หลุดเข้าไปได้ในสไตล์เดียวกับการเซฟสองจังหวะในช่วงทดเวลา", "“ดีมาก” ทูเคิลกล่าวเสริมในงานแถลงข่าว “นั่นคืองานของเขา ในการปิดช่องว่าง เราต้องการการแข่งขันในทุกตำแหน่ง”", "“เราจำเป็นต้องเห็นแทรฟฟอร์ดในสถานการณ์ที่กดดันสูง การเซฟที่ชัดเจนที่สุดซึ่งเขาควรได้รับเครดิตเต็มๆ คือการเซฟสองจังหวะในช่วงท้ายเกม มันยอดเยี่ยมจริงๆ”", "นอกจากนี้ กุนซือทีมชาติอังกฤษยังเน้นย้ำถึงความสำคัญของความนิ่งในการครองบอล “เขามีงานต้องทำมากมายในการสร้างเกมจากแดนหลัง ซึ่งเขาทำได้ดีมากร่วมกับทุกคนรอบข้าง”", "“ไม่เคยเสียสมาธิ ไม่เคยเสียโฟกัส ไม่เคยเสียวิสัยทัศน์ในการมองหาผู้เล่นที่ว่างอยู่เพื่อเอาชนะการเพรสซิ่งและพาเกมไปสู่แดนคู่แข่ง เขาเป็นส่วนหนึ่งของผลงานทีมที่ยอดเยี่ยมร่วมกับคนอื่นๆ”", "ความสามารถในการเล่นบอลของแทรฟฟอร์ดถูกหล่อหลอมมาจากอะคาเดมี่ของ แมนเชสเตอร์ ซิตี้ และทีมเยาวชนของอังกฤษ ในขณะที่การเซฟของเขาเป็นการสานต่อฟอร์มการเล่นจากสโมสรในฤดูกาลนี้", "ตามข้อมูลจาก Opta แทรฟฟอร์ดรั้งอันดับหนึ่งในบรรดาผู้รักษาประตูพรีเมียร์ลีกสำหรับสถิติการป้องกันประตู (Goals Prevented) ในฤดูกาลนี้ โดยเสียไปเพียง 8 ประตูจากโอกาสยิงที่คาดว่าจะเสียประตู (xG) ถึง 12.40 ทำให้เขามีคะแนนอยู่ที่ 4.40", "อย่างไรก็ตาม ต้องระบุด้วยว่าพิคฟอร์ดก็มีค่าส่วนต่างที่เป็นบวกเช่นกัน โดยเสียไป 10 ประตูจากโอกาสยิงที่คาดว่าจะเสียประตู 11.05 เขาอายุมากกว่าแทรฟฟอร์ด 8 ปี ในวัย 32 ปี แต่ยังมีดีพอที่จะช่วยทีมได้ “ทั้งคู่ไม่ได้ห่างกันมากนัก” รอย คีน กล่าว", "พิคฟอร์ดมีความได้เปรียบที่ชัดเจนในแง่ของประสบการณ์ นอกเหนือจากการติดทีมชาติชุดใหญ่ 94 นัดเทียบกับแทรฟฟอร์ดที่มี 5 นัด เขายังมีประสบการณ์ลงเล่นในพรีเมียร์ลีกถึง 372 นัด แต่การเปรียบเทียบตัวเลขแสดงให้เห็นว่าเปอร์เซ็นต์การเซฟของทั้งคู่นั้นใกล้เคียงกัน", "สไตล์ของทั้งคู่แตกต่างกันในแง่ของการจ่ายบอล โดยแทรฟฟอร์ดจ่ายบอลยาวในเปอร์เซ็นต์ที่น้อยกว่า แม้ว่าจะอธิบายได้ส่วนหนึ่งจากความแตกต่างของวิธีการเล่นในสโมสรของพวกเขา", "สำหรับทูเคิล ผลกระทบของแทรฟฟอร์ดมีแต่จะเป ลก", "ลูอิส ฮอลล์ และ เบน ไวท์ โชว์ฟอร์มโดดเด่นในตำแหน่งฟูลแบ็ก โดยเฉพาะไวท์ที่สกัดบอลสำคัญช่วยทีมในช่วงท้ายเกม", "เจมส์ แทรฟฟอร์ด นายทวารดาวรุ่งโชว์ฟอร์มเซฟสำคัญและพิสูจน์ตัวเองว่าพร้อมเป็นตัวเลือกเบอร์ 1 แทนที่ จอร์แดน พิคฟอร์ด"], "full_paragraphs": ["ทีมชาติอังกฤษสร้างผลงานระดับมาสเตอร์พีซด้วยการบุกไปเอาชนะสเปน 3-2 ถึงกรุงมาดริด ส่งผลให้ทัพ 'สิงโตคำราม' หยุดสถิติไร้พ่าย 43 นัดของทีมแชมป์โลกได้สำเร็จ พร้อมคว้าแชมป์กลุ่มในศึกเนชันส์ลีกและได้เป็นทีมวางสำหรับการจับสลากรอบก่อนรองชนะเลิศในเดือนมีนาคมปีหน้า", "ดีเอ็นเอฟุตบอลของอังกฤษกลายเป็นประเด็นที่ถูกจับตามองในช่วงฤดูใบไม้ร่วงนี้ และในมาดริดเราได้เห็นสไตล์การเล่นของอังกฤษในเวอร์ชันที่ดีที่สุด พวกเขาเปิดเกมรุกเข้าใส่สเปนตั้งแต่เสียงนกหวีดเริ่มเกมด้วยความเร็ว พละกำลัง และการเล่นที่ดุดัน ทั้งยังเข้าปะทะอย่างหนักหน่วงและไม่ยอมอ่อนข้อให้คู่แข่ง ซึ่งพิสูจน์ให้เห็นว่าอังกฤษไม่ได้พยายามเลียนแบบสไตล์การเล่นของสเปนแต่อย่างใด", "ลูกสูตรจากจังหวะเซตพีซที่นำไปสู่ประตูที่สอง สะท้อนให้เห็นถึงความสำคัญของลูกตั้งเตะในพรีเมียร์ลีก ซึ่งเป็นการประสานงานกันอย่างลงตัวของสองนักเตะจากอาร์เซนอล และแม้จะต้องเหลือผู้เล่นเพียง 10 คนในช่วงท้ายเกม แต่ทีมก็แสดงให้เห็นถึงหัวใจนักสู้และความมุ่งมั่นจนสามารถรักษาสกอร์ไว้ได้", "รอย คีน กล่าวชื่นชมฟอร์มการเล่นของอังกฤษในครึ่งแรกว่าเป็น 'ความสมบูรณ์แบบ' แม้ว่าจะมีข้อผิดพลาดจาก จาเรลล์ ควอนซาห์, เอลเลียต แอนเดอร์สัน และ แอนโธนี กอร์ดอน จนทำให้ไม่สามารถเรียกได้ว่าสมบูรณ์แบบในตอนจบ แต่ทัศนคติและแนวทางการเล่นของอังกฤษนั้นเหนือกว่าความผิดพลาดเหล่านั้น และนี่คือฟุตบอลที่แฟนบอลอังกฤษพร้อมจะสนับสนุน", "โธมัส ทูเคิล ไม่ต้องการพูดถึงการเปรียบเทียบระหว่างชัยชนะนัดนี้กับความพ่ายแพ้ต่ออาร์เจนตินาในรอบรองชนะเลิศฟุตบอลโลกมากนัก โดยเขาย้ำว่าสิ่งที่ควรจดจำคือฟอร์มการเล่นในช่วง 65 นาทีแรกก่อนที่จะโดนใบแดง และเปรียบเทียบเกมรับที่เหนียวแน่นนี้ว่าเหมือนกับชัยชนะเหนือเม็กซิโกในรอบ 16 ทีมสุดท้าย โดยกล่าวว่า 'นี่คือการกลับมาของอาซเตก้าอีกครั้ง'", "อย่างไรก็ตาม ผู้จัดการทีมชาติอังกฤษได้เรียนรู้บทเรียนจากความเจ็บปวดในเกมกับอาร์เจนตินาอย่างชัดเจน ครั้งนี้ไม่มีการใช้กองหลัง 5 คนแม้แต่วินาทีเดียวแม้จะเสียเปรียบเรื่องตัวผู้เล่น ซึ่งต่างจากฟุตบอลโลกที่เขาเปลี่ยนไปใช้หลัง 5 ในนาทีที่ 72 และในเกมกับเม็กซิโกที่ส่ง แดน เบิร์น ลงมาในนาทีที่ 75", "การโดนใบแดงของ เอลเลียต แอนเดอร์สัน ไม่ได้ทำให้ม้านั่งสำรองของอังกฤษตื่นตระหนก โดย จู๊ด เบลลิงแฮม ถูกถอยลงมาเล่นแทนในตำแหน่งที่ว่างลง และการเปลี่ยนตัวคนแรกเกิดขึ้นในช่วง 10 นาทีสุดท้าย ส่วน แดน เบิร์น ถูกส่งลงสนามในนาทีที่ 89 เพื่อเสริมแนวรับเท่านั้น ทูเคิลแสดงความเชื่อมั่นว่าทีมสามารถต้านทานทีมที่ดีที่สุดในโลกได้ด้วยแผงหลัง 4 คน และความมั่นใจนี้ส่งผลให้แฟนบอลเริ่มเชื่อมั่นในตัวทูเคิลมากขึ้น", "แฟนบอลอังกฤษร้องเพลงเชียร์ 'แฮร์รี เคน เขาคือคนที่เก่งที่สุดในโลก' เพื่อเป็นการเย้ยหยันเจ้าถิ่นและ ลามีน ยามาล ที่จบอันดับ 3 ในการประกาศรางวัลบัลลงดอร์ ก่อนเกมนี้ผู้เล่นสเปนหลายคนออกมาให้สัมภาษณ์ว่าเพื่อนร่วมทีมของพวกเขาควรได้รับรางวัลแทนเคน แต่กัปตันทีมชาติอังกฤษได้พิสูจน์ความยอดเยี่ยมบนสนามจริง", "เคนเรียกจุดโทษและสังหารเข้าไปอย่างเยือกเย็นเพื่อทำประตูขึ้นนำ ซึ่งถือเป็นการลบฝันร้ายจากการพลาดจุดโทษในเกมที่พบกับคู่แข่งรายเดียวกันนี้เมื่อเดือนกันยายน นอกจากนี้เขายังมีส่วนร่วมในประตูที่สาม ซึ่งเป็นเพียงหนึ่งในหลายจังหวะที่เขาประสานงานกับ จู๊ด เบลลิงแฮม ได้อย่างยอดเยี่ยม ปัจจุบันดาวยิงสูงสุดและเจ้าของสถิติลงสนามมากที่สุดของอังกฤษรายนี้กำลังอยู่ในช่วงพีคของอาชีพค้าแข้ง", "นี่คือค่ำคืนที่ ลูอิส ฮอลล์ ยกระดับฝีเท้าขึ้นไปอีกขั้น หลังจากเคยได้รับคำชมจากการรับมือ ลามีน ยามาล ที่เซนต์เจมส์พาร์กในศึกแชมเปียนส์ลีกมาแล้ว แม้จะมีข้อกังขาว่าเขาจะทำได้ดีหรือไม่ในเกมนี้ แต่ฮอลล์ก็พิสูจน์ให้เห็นว่าเขาคือตัวเลือกเบอร์หนึ่งในตำแหน่งแบ็กซ้ายของอังกฤษ และทำให้หลายคนตั้งคำถามว่าทำไมเขาถึงไม่มีชื่อติดทีมไปฟุตบอลโลก", "ฮอลล์โชว์ฟอร์มเกมรับได้อย่างยอดเยี่ยม รวมถึงจังหวะเข้าสกัดสำคัญก่อนหมดครึ่งแรกที่หยุดทั้ง ลามีน ยามาล และ มิเกล เมริโน ในกรอบเขตโทษ และในช่วงวินาทีสุดท้ายเขายังเรียกจังหวะเตะจากประตูได้อย่างชาญฉลาดเมื่อ อเล็กซ์ บาเอนา กำลังจะบุกเข้าทำประตู นอกจากนี้เขายังเลี้ยงบอลผ่านคู่แข่งถึง 5 ครั้ง สะท้อนถึงแผนการเล่นที่เน้นเกมรุกของอังกฤษ", "เบน ไวท์ ทำผลงานได้อย่างโดดเด่น โดยเฉพาะในนาทีที่ 84 ที่เขาโชว์จังหวะสไลด์สกัดบอลสำคัญในฐานะกองหลังตัวสุดท้ายเพื่อหยุด นิโก วิลเลียมส์ ไม่ให้หลุดเข้าไปดวลเดี่ยวกับผู้รักษาประตู ซึ่งเป็นจังหวะที่คล้ายกับ ดีเจด สเปนซ์ ในเกมพบอาร์เจนตินา แต่ครั้งนี้อังกฤษสามารถรักษาสกอร์ไว้ได้จนจบเกม", "ไวท์ได้กลับมาพิสูจน์ตัวเองในสีเสื้อทีมชาติอังกฤษอีกครั้ง หลังจากที่หลายคนเคยคิดว่าเขาอาจจะไม่ได้เล่นให้ทีมชาติอีกต่อไป และแม้จะเคยถูกวิจารณ์อย่างหนัก แต่ตอนนี้เขากำลังพิสูจน์ว่าเขาสามารถยึดตำแหน่งแบ็กขวาตัวจริงได้ โดยไวท์ถือเป็นแบ็กขวาคนที่ 6 ที่ได้ออกสตาร์ทตัวจริงในรอบ 11 เกมหลังสุดของอังกฤษ นับตั้งแต่เริ่มรอบน็อกเอาต์ฟุตบอลโลก", "โธมัส ทูเคิล พยายามลดกระแสข่าวที่ว่า เจมส์ แทรฟฟอร์ด จะมาแทนที่ จอร์แดน พิคฟอร์ด ในฐานะมือหนึ่งของทีม แต่ผู้รักษาประตูดาวรุ่งรายนี้ได้แสดงให้เห็นแล้วว่าเขามีความสามารถที่จะเฉิดฉายในเวทีใหญ่ที่มาดริด จังหวะเซฟสองครั้งติดต่อกันในช่วงท้ายเกมถือเป็นจุดเปลี่ยนสำคัญ และทูเคิลยังชื่นชมการออกบอลและความนิ่งในการเล่นจากแดนหลังของเขา", "แม้เขาจะเสียไปถึง 4 ประตูจากการลงเล่น 2 นัดที่พบกับสเปนในรอบแบ่งกลุ่มเนชันส์ลีกนี้ แต่เขาก็สร้างชื่อเสียงให้ตัวเองได้มากขึ้นและกลายเป็นผู้ท้าชิงตำแหน่งมือหนึ่งของพิคฟอร์ดอย่างชัดเจน แม้พิคฟอร์ดจะไม่เคยทำให้ทีมชาติผิดหวัง แต่หากถึงเวลาเปลี่ยนผ่านในอนาคตอันใกล้ แทรฟฟอร์ดก็อยู่ในตำแหน่งที่ดีที่สุดที่จะก้าวขึ้นมาแทนที่", "อังกฤษจะทราบผลการจับสลากรอบก่อนรองชนะเลิศเนชันส์ลีกในวันศุกร์ที่ 20 พฤศจิกายน เวลา 11.00 น. โดยการแข่งขันในรอบนี้จะเป็นระบบเหย้า-เยือน ซึ่งมีกำหนดจัดขึ้นในช่วงพักเบรกทีมชาติเดือนมีนาคม โดยนัดแรกจะแข่งขันระหว่างวันที่ 25-27 มีนาคม และนัดที่สองระหว่างวันที่ 28-30 มีนาคม"], "link": "https://www.skysports.com/football/news/11095/13612611/spain-2-3-england-talking-points-thomas-tuchel-learns-lessons-from-argentina-as-harry-kane-ben-white-and-lewis-hall-shine", "canonical_link": "https://www.skysports.com/football/news/11095/13612611/spain-2-3-england-talking-points-thomas-tuchel-learns-lessons-from-argentina-as-harry-kane-ben-white-and-lewis-hall-shine", "cover_image_url": "https://e0.365dm.com/26/11/1920x1080/skysports-thomas-tuchel-england_7407578.jpg?20261116081535", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-england-konsa-white_7407466.jpg?20261116003749", "https://e0.365dm.com/26/11/768x432/skysports-football-england_7407407.jpg?20261115223319", "https://e0.365dm.com/26/11/768x432/skysports-england-tuchel_7407417.jpg?20261115224240", "https://e0.365dm.com/26/11/768x432/skysports-harry-kane-pen-penalty_7407309.jpg?20261115203842", "https://e0.365dm.com/26/11/768x432/skysports-hall-england_7407411.jpg?20261115223700", "https://e0.365dm.com/26/11/768x432/skysports-white-england_7407408.jpg?20261115223324", "https://e0.365dm.com/26/11/768x432/skysports-white-england_7407410.jpg?20261115223439"], "videos": [], "review_score": "", "published_ts": 1794779520, "published_at": "2026-11-15T21:52:00Z", "published_th": "16 พ.ย. 2026 • 04:52 น.", "category_hint": "Football"}, {"id": 1794821448154, "guid": "https://www.skysports.com/football/spain-vs-england/report/554117", "original_title": "Ten-man England hold on to claim famous win over Spain", "thai_title": "สิบคนก็เอาอยู่! อังกฤษบุกเชือดสเปน 3-2 หยุดสถิติไร้พ่ายแชมป์โลก พร้อมคว้าแชมป์กลุ่มเนชันส์ลีก", "tag": "Football", "sub_tag": "ENGLAND", "bullet_points": ["อังกฤษโชว์ฟอร์มดุบุกชนะสเปน 3-2 หยุดสถิติไร้พ่าย 43 นัดของแชมป์โลกได้สำเร็จ", "ทัพสิงโตคำรามขึ้นนำห่าง 3-0 จาก แฮร์รี เคน, เอซรี คอนซา และ เบน ไวท์ ก่อนจะเหลือผู้เล่น 10 คนจากการโดนใบแดงของ เอลเลียต แอนเดอร์สัน", "เจมส์ แทรฟฟอร์ด โชว์ฟอร์มหนึบเซฟสำคัญหลายครั้งในช่วงท้ายเกม ช่วยให้ทีมรักษาสกอร์คว้าชัยชนะ", "ชัยชนะนัดนี้ทำให้อังกฤษจบอันดับ 1 ของกลุ่ม A3 ในศึกยูฟ่า เนชันส์ลีก และได้เป็นทีมวางในการจับสลากรอบก่อนรองชนะเลิศ"], "full_paragraphs": ["ทีมชาติอังกฤษสามารถต้านทานการบุกหนักของสเปนหลังจากที่ เอลเลียต แอนเดอร์สัน ถูกใบแดงไล่ออกจากสนาม จนสามารถคว้าชัยชนะสุดสำคัญ 3-2 และจบอันดับเหนือแชมป์โลกอย่างสเปนในฐานะจ่าฝูงของกลุ่มเนชันส์ลีกได้สำเร็จ", "ลูกทีมของ โธมัส ทูเคิล โชว์ฟอร์มได้อย่างยอดเยี่ยมตลอดหนึ่งชั่วโมงแรกในกรุงมาดริด โดยขึ้นนำก่อนจากจุดโทษของ แฮร์รี เคน ในช่วงท้ายครึ่งแรก ก่อนจะบวกเพิ่มอีกสองประตูอย่างรวดเร็วจาก เอซรี คอนซา และ เบน ไวท์", "อย่างไรก็ตาม เกมที่ดูเหมือนจะเป็นการเดินหน้าบุกฝ่ายเดียวกลับพลิกผันเมื่อ เอลเลียต แอนเดอร์สัน ถูกใบแดงไล่ออกจากสนามจากจังหวะทำฟาวล์ ลามีน ยามาล ในฐานะผู้เล่นคนสุดท้ายหลังจากความผิดพลาดของ จาเรลล์ ควอนซา ส่งผลให้ มิเกล โอยาร์ซาบัล สังหารจุดโทษตีไข่แตกให้สเปน", "สเปนไล่ตามมาเหลือเพียงประตูเดียวเมื่อ นิโก วิลเลียมส์ ตัวสำรองยิงประตูจากการเปิดของ ลามีน ยามาล หลังจากที่ แอนโทนี กอร์ดอน เสียบอลกลางทาง แต่ทีมชาติอังกฤษยังคงยันสกอร์ไว้ได้ด้วยฟอร์มอันเหนียวหนึบของ เจมส์ แทรฟฟอร์ด", "ผู้รักษาประตูรายนี้ซึ่งได้รับเลือกให้ลงสนามแทน จอร์แดน พิคฟอร์ด โชว์ซูเปอร์เซฟหลายครั้งในขณะที่สเปนระดมยิงใส่ประตูอังกฤษ รวมถึงจังหวะเซฟสองจังหวะซ้อนที่ปฏิเสธลูกยิงของ เฟร์มิน โลเปซ และตามไปปัดลูกซ้ำของ โอยาร์ซาบัล ออกหลังไปได้อย่างเหลือเชื่อ", "วีรกรรมของเขาประกอบกับการเข้าสกัดสำคัญในฐานะผู้เล่นคนสุดท้ายของ เบน ไวท์ ที่มีต่อ วิลเลียมส์ ช่วยให้ทัพสิงโตคำรามยุติสถิติไร้พ่าย 43 นัดของสเปนลงได้ด้วยชัยชนะครั้งประวัติศาสตร์ ซึ่งรับประกันว่าพวกเขาจะเป็นทีมวางในการจับสลากรอบก่อนรองชนะเลิศเนชันส์ลีก", "ชัยชนะดูเหมือนจะขาดลอยยิ่งกว่านี้เมื่อ เบน ไวท์ ยิงประตูที่สามลอดขา อูไน ซิมอน หลังจากที่ คอนซา โหม่งลูกเตะมุมของ เดแคลน ไรซ์ เข้าไปเป็นประตูที่สอง โดยในขณะนั้นสเปนยังไม่มีโอกาสยิงตรงกรอบเลยแม้แต่ครั้งเดียว", "แต่ใบแดงของ แอนเดอร์สัน หลังจากที่ ควอนซา ถูก ลามีน ยามาล ฉกบอลไปได้นั้น ทำให้สเปนกลับมามีความหวังอีกครั้ง และทำให้อังกฤษต้องแสดงคุณภาพที่เคยแสดงให้เห็นในเกมฟุตบอลโลก รอบ 16 ทีมสุดท้ายที่ชนะเม็กซิโกที่สนามเอสตาดิโอ อัซเตกา เมื่อเดือนกรกฎาคมที่ผ่านมา", "ความแข็งแกร่งและการมีส่วนร่วมของผู้รักษาประตูช่วยให้พวกเขาผ่านพ้นวิกฤตไปได้ และแสดงให้เห็นถึงพัฒนาการจากที่เคยตกรอบรองชนะเลิศฟุตบอลโลกต่ออาร์เจนตินา ซึ่งในตอนนั้นพวกเขาเสียการนำในช่วงท้ายเกม", "โธมัส ทูเคิล กุนซือทีมชาติอังกฤษกล่าวว่า: 'เราตระหนักดีถึงผลงานที่เราทำได้ในช่วง 60-65 นาทีแรก การนำ 3-0 และนำอย่างสมศักดิ์ศรี 3-0 แน่นอนว่าใบแดงและจุดโทษเปลี่ยนโมเมนตัมและลักษณะของเกม การเล่น 30 นาทีกับสเปน ในสเปน มันรู้สึกเหมือนยาวนานถึงสามชั่วโมง'", "'นั่นคือคำแถลงและความสำคัญของชัยชนะครั้งนี้ คือมันเป็นชัยชนะที่สมควรได้รับและผลการแข่งขันเป็นไปตามฟอร์มการเล่น มันอยู่ในระดับสูงสุดทั้งในแง่ของความเชื่อมั่น จิตวิญญาณของทีม และความเป็นน้ำหนึ่งใจเดียวกัน มันอยู่ในระดับสูงสุดในแง่ของฟุตบอลในทุกด้านของเกม'", "'นั่นเป็นผลงานที่ยอดเยี่ยม ความรู้สึกที่ยอดเยี่ยมในห้องแต่งตัว ทุกคนเหนื่อยมาก เราผ่านช่วงเวลาที่ยากลำบากมาได้ เราตระหนักดีถึงก้าวที่เราทำได้หลังจากฟุตบอลโลก มันเป็นความรู้สึกที่ดีที่สุด'", "แฮร์รี เคน กัปตันทีมชาติอังกฤษกล่าวถึงการที่สเปนจัดขบวนแห่ถ้วยแชมป์ฟุตบอลโลกก่อนเริ่มเกมว่า: 'ถ้าจะมีอะไร มันทำให้เราหิวกระหายมากขึ้น มันทำให้เรามีความมุ่งมั่นที่จะบอกว่า โอเค นี่คือสี่เดือนต่อมา แต่เราคือทีมที่จะก้าวต่อไปและเป็นแชมป์ยุโรปและแชมป์โลกทีมต่อไป'", "'เรายังต้องพิสูจน์เรื่องนั้นแน่นอน เรายังมีหนทางอีกยาวไกล ค่ำคืนแบบคืนนี้จะช่วยเพิ่มความเชื่อมั่นในทีมเท่านั้น มันแสดงให้เห็นว่าเรากำลังทำอะไร เมื่อเราพูดถึงมัน มันเป็นเรื่องหนึ่ง แต่เมื่อเราแสดงให้เห็นกับทีมที่ดีที่สุดในโลก นั่นคือปัจจัยที่คุ้มค่า'", "'เราไม่ใช่ทีมที่ต้องการถอยหลัง เราต้องการนั่งพักและลุยต่อ แสดงให้เห็นว่าเราเป็นทีมประเภทไหนเมื่อเราอยู่ในฟอร์มที่ดีที่สุด จังหวะเต็มรูปแบบ การเพรสซิ่งสูง การแย่งบอลกลับมา การวิ่งสอดไปข้างหลัง และการโต้กลับ'", "'เราหยุดยากมากในช่วง 60 นาทีแรก จากนั้นในช่วง 30 นาทีสุดท้าย คุณต้องอาศัยประสบการณ์ในอัซเตกาและเกมประเภทนั้น ผมคุยกับ เดค [ไรซ์] ที่นั่นว่าเราเคยผ่านสิ่งที่แย่กว่านี้มาแล้ว และมันแสดงให้เห็นว่าไม่มีโอกาสทองอะไรมากมาย [เจมส์ แทรฟฟอร์ด] เซฟได้อย่างน่าทึ่ง โดยเฉพาะการเซฟสองจังหวะในช่วงท้าย แต่เมื่อคุณสามารถรักษาความได้เปรียบต่อสเปนด้วยผู้เล่น 10 คนในบ้านเขาได้ มันแสดงให้เห็นถึงแง่มุมทางจิตใจ'", "เดแคลน ไรซ์ กองกลางทีมชาติอังกฤษกล่าวกับ ITV ว่า: 'เรารู้ว่าเราสามารถเอาชนะพวกเขาได้ เรารู้ว่าเราจะเอาชนะพวกเขาในวันนี้ ข้อความจากผู้จัดการทีมหลังเกมกับโครเอเชียนั้นเป็นบวกมาก ข้อความจากพวกเราทุกคนผลักดันไปด้วยกัน โดยรู้ว่าเราจะมาที่นี่และไม่ถอยไปตั้งรับแล้วรอโต้กลับ'", "'เรารู้ตั้งแต่ตั้งแต่นาทีแรก 10 นาทีแรกของเราน่าจะเป็นช่วงเวลาที่ดีที่สุดที่เราเคยเล่นมา การกดดัน กดดัน กดดัน เราน่าจะได้สองหรือสามประตูด้วยซ้ำ ใบแดงเปลี่ยนทิศทางของเกม เพราะถ้าพูดตามตรงเราน่าจะยิงได้มากกว่านี้อีก'", "บทวิเคราะห์โดย ปีเตอร์ สมิธ จาก Sky Sports: 'ดีเอ็นเอฟุตบอลของอังกฤษได้รับความสนใจในช่วงฤดูใบไม้ร่วงนี้ ในมาดริด เราได้ chettino team look like?", "thai_title": "เจาะลึกปรัชญา เมาริซิโอ โปเช็ตติโน กับภารกิจกอบกู้ แมนเชสเตอร์ ยูไนเต็ด", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เข้ามารับตำแหน่งกุนซือ แมนเชสเตอร์ ยูไนเต็ด ต่อจาก ไมเคิล คาร์ริค ด้วยประสบการณ์โชกโชนในพรีเมียร์ลีก", "ปรัชญาการทำทีมของโปเช็ตติโนเน้นความเข้มข้นในการเพรสซิ่งและการเล่นเกมรุกที่รวดเร็วแบบแนวตั้ง ซึ่งได้รับอิทธิพลมาจาก มาร์เซโล บิเอลซ่า", "ความท้าทายสำคัญของกุนซือชาวอาร์เจนไตน์คือการปรับจูนสภาพร่างกายและทัศนคติของนักเตะยูไนเต็ดให้เข้ากับระบบที่ต้องใช้พลังงานสูง", "โปเช็ตติโนแสดงให้เห็นถึงการปรับตัวในอดีต ทั้งการปรับแผนที่ ปารีส แซงต์-แชร์กแมง เพื่อรองรับสตาร์ดัง และการใช้ระบบที่ยืดหยุ่นขึ้นกับทีมชาติสหรัฐอเมริกา"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งให้เป็นผู้จัดการทีมคนใหม่ของ แมนเชสเตอร์ ยูไนเต็ด ต่อจาก ไมเคิล คาร์ริค ที่ถูกปลดออกจากตำแหน่ง โดยกุนซือวัย 54 ปีผู้นี้ได้นำประสบการณ์การคุมทีมทั้งในเซาแธมป์ตัน, ท็อตแนม ฮ็อตสเปอร์ และเชลซี เข้ามาสู่ถิ่นโอลด์ แทรฟฟอร์ด แต่คำถามสำคัญคือผลงานในอดีตของเขาบอกอะไรเราได้บ้างเกี่ยวกับทิศทางของทีมภายใต้การคุมทัพของเขา?", "โปเช็ตติโน ซึ่งเพิ่งผ่านงานคุมทีมชาติสหรัฐอเมริกาและพาทีมเข้าสู่รอบ 16 ทีมสุดท้ายในฟุตบอลโลกครั้งล่าสุด กำลังหวนคืนสู่เวทีฟุตบอลอังกฤษอีกครั้ง โดยเราจะย้อนกลับไปดูเส้นทางการคุมทีมของเขาตั้งแต่สมัยอยู่เซาแธมป์ตัน จนถึงช่วงเวลา 18 เดือนที่ปารีส แซงต์-แชร์กแมง เพื่อวิเคราะห์ว่าเขาอาจจะปรับเปลี่ยน แมนเชสเตอร์ ยูไนเต็ด อย่างไรบ้าง", "ระบบ 4-2-3-1 กลายเป็นแผนการเล่นหลักที่โปเช็ตติโนเลือกใช้ตั้งแต่สมัยคุมเซาแธมป์ตัน โดยเขายังคงโครงสร้างทีมเดิมจากยุค ไนเจล แอดกินส์ แต่เปลี่ยนสไตล์การเล่นอย่างสิ้นเชิงด้วยการเน้นการเพรสซิ่งสูง ในด้านตัวผู้เล่น เขาไม่ได้มีการเสริมทัพครั้งใหญ่มากนักนอกจาก เดยัน ลอฟเรน และ วิคเตอร์ วานยาม่า แต่เขากลับแสดงให้เห็นถึงความสามารถในการยกระดับนักเตะที่มีอยู่เดิม เช่น อดัม ลัลลาน่า, มอร์แกน ชไนเดอร์แลง, เจย์ โรดริเกซ, ลุค ชอว์ และ นาธาเนียล ไคลน์", "อดัม ลัลลาน่า ได้สะท้อนถึงช่วงเวลานั้นว่า 'ตอนที่ผมเริ่มเล่นให้เซาแธมป์ตัน ผมเล่นทางฝั่งซ้ายและเป็นหมายเลข 10 ซึ่งเกือบจะเป็นผู้เล่นประเภทที่เล่นแบบไม่ต้องช่วยเกมรับ แต่เมื่อโปเช็ตติโนเข้ามา วันแรกก็ชัดเจนเลยว่าในทีมของเขาจะไม่มีที่ว่างสำหรับผู้เล่นประเภทนั้น'", "โปเช็ตติโนนำแนวทางเดียวกันนี้ไปใช้ที่สเปอร์ส โดยทีมของเขามีเอกลักษณ์ที่ความดุดันและความเข้มข้นในการเล่นโดยไม่มีบอล รวมถึงการจ่ายบอลแนวตั้งที่รวดเร็วเพื่อโจมตีอย่างฉับไวตามสไตล์ของ มาร์เซโล บิเอลซ่า ซึ่งโปเช็ตติโนยกย่องให้เป็นอิทธิพลสำคัญที่สุดในการเป็นโค้ชของเขาเคียงคู่กับ เซอร์ อเล็กซ์ เฟอร์กูสัน", "ที่สเปอร์ส เขาใช้ระบบ 4-2-3-1 เป็นหลักและช่วยให้ดาวรุ่งหลายคนแจ้งเกิด โดยเฉพาะ เดเล่ อัลลี่ และ แฮร์รี่ เคน ที่ประสานงานกันได้อย่างยอดเยี่ยมในฐานะหมายเลข 10 และหมายเลข 9 โดยเขามักใช้ฟูลแบ็กเติมเกมรุกและให้กองกลางตัวรับอย่าง เอริค ดายเออร์ ถอยลงมาเป็นเซ็นเตอร์แบ็กคนที่สาม เพื่อเปิดพื้นที่ให้ อัลลี่, คริสเตียน เอริคเซ่น และ ซน ฮึง-มิน เล่นใกล้กับ เคน มากขึ้น", "โปเช็ตติโนใช้ดาวรุ่งเหล่านั้นเปลี่ยนโฉมสเปอร์สจนเข้าถึงรอบชิงชนะเลิศยูฟ่า แชมเปี้ยนส์ลีก และจบอันดับท็อป 3 ของพรีเมียร์ลีกได้ถึง 3 ฤดูกาลติดต่อกัน อย่างไรก็ตาม เมื่อเวลาผ่านไปอายุเฉลี่ยของทีมมากขึ้น สภาพร่างกายเริ่มถดถอย และการเสริมทัพที่ไม่เพียงพอทำให้ทีมไม่สามารถรักษาความเข้มข้นได้ จนกระทั่งเขาอำลาทีมในปี 2019 ซึ่งถือเป็นการสิ้นสุดวัฏจักรของทีม", "เมื่อย้ายไปคุม ปารีส แซงต์-แชร์กแมง โปเช็ตติโนต้องปรับปรัชญาให้เข้ากับนักเตะ โดยเฉพาะการมี ลิโอเนล เมสซี่, คีลิยัน เอ็มบัปเป้ และ เนย์มาร์ ทำให้เขาต้องลดการเพรสซิ่งสูงที่เคยเป็นจุดเด่นลง เพราะสตาร์ทั้งสามไม่ถนัดในเกมที่ต้องใช้พลังงานสูงเช่นนั้น โดยเขาหันไปใช้ระบบ 4-3-3 เป็นหลัก", "ในสมัยคุมเชลซีเมื่อปี 2023 โปเช็ตติโนเริ่มด้วยระบบ 3-4-2-1 ก่อนจะเปลี่ยนมาใช้ 4-2-3-1 ที่เขาชื่นชอบ โดย โคล พาลเมอร์ กลายเป็นนักเตะที่แจ้งเกิดภายใต้การคุมทีมของเขาด้วยผลงาน 22 ประตูและ 11 แอสซิสต์ แต่โดยรวมแล้วเขายังพบความยากลำบากในการถ่ายทอดไอเดีย", "ในเดือนเมษายนของฤดูกาลนั้น เขาเคยตั้งคำถามถึงทัศนคติของลูกทีมว่า 'เรายังต้องสร้างทัศนคติที่จะช่วยให้เราก้าวไปข้างหน้า คุณต้องเรียกร้องจากตัวเองและเพื่อนร่วมทีมให้มากขึ้น' ซึ่งเห็นได้ชัดจากสถิติระยะทางวิ่งที่ทีมเชลซีของเขาอยู่ในอันดับที่ 3 จากท้ายตารางในฤดูกาล 2023/24 ต่างจากสมัยคุมสเปอร์สที่มักจะติดอันดับต้นๆ ของลีกเสมอ", "ในการคุมทีมชาติสหรัฐอเมริกา โปเช็ตติโนมีความยืดหยุ่นมากขึ้นโดยสลับระหว่างหลังสามและหลังสี่ และเน้นการเคลื่อนที่ที่อิสระของแนวรุก ซึ่งช่วยให้ทีมเอาชนะทั้ง ปารากวัย, ออสเตรเลีย และ บอสเนียและเฮอร์เซโกวีนา ได้สำเร็จ", "สำหรับ แมนเชสเตอร์ ยูไนเต็ด ทีมของโปเช็ตติโนน่าจะมีโครงสร้างคล้ายกับยุคของ คาร์ริค ที่ใช้ 4-2-3-1 แต่เขาอาจต้องปรับจูนนักเตะอย่าง เลนี่ โยโร่ เพื่อรับมือกับไลน์กองหลังที่สูงขึ้น หรือการใช้ความสดของ แพทริค ดอร์กู แทนที่ ลุค ชอว์ รวมถึงการใช้ คาร์ลอส บาเลบา ในแดนกลาง", "อย่างไรก็ตาม โปเช็ตติโนอาจต้องยอมรับความจริงว่าเขาไม่สามารถเรียกร้องความเข้มข้นระดับสูงได้ทันที เนื่องจากขุมกำลังของยูไนเต็ดในปัจจุบันมีอายุเฉลี่ยค่อนข้างสูง และทีมยังมีสถิติระยะทางวิ่งรวมอยู่อันดับที่ 19 ของลีกในฤดูกาลนี้", "โปเช็ตติโนเคยกล่าวไว้เมื่อเร็วๆ นี้ว่า 'ถ้าคุณไม่เปลี่ยนแปลง คุณก็ตาย' ซึ่งทัศนคตินี้จะเป็นสิ่งจำเป็นอย่างยิ่งที่โอลด์ แทรฟฟอร์ด ในการปรับเปลี่ยนทีมที่แตกต่างจากยุคทองของเขาที่สเปอร์สอย่างสิ้นเชิง"], "link": "https://www.skysports.com/football/news/11095/13611443/mauricio-pochettino-to-man-utd-what-does-a-pochettino-team-look-like-and-how-will-he-set-up-struggling-red-devils", "canonical_link": "https://www.skysports.com/football/news/11095/13611443/mauricio-pochettino-to-man-utd-what-does-a-pochettino-team-look-like-and-how-will-he-set-up-struggling-red-devils", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-premier-league-manchester-united_7405659.jpg?20261113093243", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-mauricio-pochettino_7404952.png?20261112122042", "https://e0.365dm.com/26/11/768x432/skysports-football-manchester-united_7405858.jpg?20261113141616", "https://e0.365dm.com/26/11/768x432/skysports-kane-potchettino_7404051.jpg?20261111150710", "https://e0.365dm.com/26/11/768x432/skysports-pochettino-mauricio_7404951.png?20261112122020", "https://e0.365dm.com/26/11/768x432/skysports-psg-pochettinp-maruicio_7404991.png?20261112130141", "https://e0.365dm.com/26/11/768x432/skysports-mauricio-pochettino_7405857.jpg?20261113141506", "https://e0.365dm.com/26/11/768x432/skysports-chelsea-pochettinop_7405632.png?20261113090015"], "videos": [], "review_score": "", "published_ts": 1794639600, "published_at": "2026-11-14T07:00:00Z", "published_th": "14 พ.ย. 2026 • 14:00 น.", "category_hint": "Football"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นควา เตอร์ ยูไนเต็ด เป็นเรื่องยากที่สุดในอาชีพ", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ ตัดสินใจอำลาตำแหน่งกุนซือทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานคุมทีมแมนเชสเตอร์ ยูไนเต็ด โดยเซ็นสัญญาเป็นเวลา 2 ปีครึ่ง", "ปีศาจแดงยอมจ่ายค่าฉีกสัญญาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่และทีมงานสตาฟฟ์โค้ชมาจากสหรัฐฯ", "โปเช็ตติโน่ยอมรับว่านี่เป็นการตัดสินใจที่ยากลำบากที่สุดครั้งหนึ่งในอาชีพ แต่โอกาสในการคุมทีมระดับโอลด์แทรฟฟอร์ดนั้นยากที่จะปฏิเสธ", "กุนซือชาวอาร์เจนไตน์จะประเดิมคุมทีมแมนเชสเตอร์ ยูไนเต็ด นัดแรกในเกมเยือนลิเวอร์พูล วันที่ 22 พฤศจิกายนนี้", "สถานการณ์ของแมนเชสเตอร์ ยูไนเต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะลุช่องโดยตรง ไม่ได้แตกต่างจากสิ่งที่ คาร์ริค พยายามจะทำ และแม้ว่านั่นอาจทำให้แฟนบอล ยูไนเต็ด กังวล แต่ความคล้ายคลึงในหลักการจะส่งผลดีต่อตัวผู้เล่น", "\"ปรัชญาของผมคือการมอบสไตล์ที่อิสระภายใต้การจัดระเบียบที่ดี\" คือคำพูดของ โปเช็ตติโน ในปี 2014 แม้ปรัชญาจะคล้ายกัน แต่ส่วนหลังคือ 'การจัดระเบียบที่ชัดเจน' ซึ่งน่าจะเป็นสิ่งที่ คาร์ริค ยังไม่สามารถมอบให้ผู้เล่นได้อย่างมั่นคง", "สำหรับแฟนบอลทีมใหญ่ ฟุตบอลที่รวดเร็วและเน้นแนวตั้งมักได้รับการยอมรับเมื่อมันมาจากความตั้งใจที่จะเป็นฝ่ายรุกก่อน เช่น ยูไนเต็ด ยุค เฟอร์กูสัน หรือ ลิเวอร์พูล ยุค เจอร์เกน คล็อปป์ แต่ฟุตบอลลักษณะนี้มักถูกมองในแง่ลบหากมันมาจากการยอมสละการครองบอลและเน้นตั้งรับหน้าประตูตัวเองเป็นเวลานาน", "การจ้าง โปเช็ตติโน จะเป็นจุดเริ่มต้นในการเปลี่ยน ยูไนเต็ด ให้กลายเป็นทีมที่มีระเบียบวินัยสูง สามารถกดดันคู่แข่งได้อย่างเข้มข้นและเป็นระบบมากขึ้น"], "link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f043/live/468fa2e0-dddf-11f1-b465-b9821c2582d4.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4aad/live/3387a800-df42-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6ab2/live/cf053980-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/681d/live/dceb6bf0-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c36b/live/e04246d0-de17-11f1-93e1-3b657b665bcf.jpg"], "videos": [], "review_score": "", "published_ts": 1794571788, "published_at": "2026-11-13T12:09:48Z", "published_th": "13 พ.ย. 2026 • 19:09 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794821448177, "guid": "https://www.skysports.com/football/news/11095/13611876/nations-league-2026-27-england-into-quarter-finals-but-who-will-they-play-in-last-eight-in-march", "original_title": "Who could England face in Nations League quarter-finals?", "thai_title": "เปิดโผคู่แข่งทีมชาติอังกฤษในรอบ 8 ทีมสุดท้าย ยูฟ่า เนชันส์ ลีก หลังคว้าแชมป์กลุ่ม", "tag": "Football", "sub_tag": "ENGLAND", "bullet_points": ["ทีมชาติอังกฤษคว้าแชมป์กลุ่มในศึกยูฟ่า เนชันส์ ลีก ได้สำเร็จ หลังบุกไปเอาชนะสเปนถึงกรุงมาดริด", "ในฐานะแชมป์กลุ่ม อังกฤษจะได้เป็นทีมวางในการจับสลากรอบ 8 ทีมสุดท้าย และจะได้ลงเล่นเกมเลกที่สองในบ้าน", "คู่แข่งที่มีโอกาสพบกับอังกฤษ ได้แก่ เบลเยียม, เนเธอร์แลนด์, กรีซ, เยอรมนี, โปรตุเกส, เดนมาร์ก หรือนอร์เวย์", "การจับสลากประกบคู่รอบก่อนรองชนะเลิศจะมีขึ้นในวันศุกร์นี้ โดยการแข่งขันจะมีขึ้นในช่วงพักเบรกทีมชาติเดือนมีนาคม 2027"], "full_paragraphs": ["การแข่งขันยูฟ่า เนชันส์ ลีก รอบก่อนรองชนะเลิศ รอบรองชนะเลิศ และรอบชิงชนะเลิศ ได้มีการอธิบายรูปแบบการแข่งขันไว้อย่างชัดเจน โดยการจับสลากประกบคู่รอบ 8 ทีมสุดท้ายจะมีขึ้นในวันศุกร์นี้ หลังจากที่บทสรุปของรอบแบ่งกลุ่มเสร็จสิ้นลง ซึ่งทีมชาติอังกฤษได้ผ่านเข้าสู่รอบน็อกเอาต์เป็นที่เรียบร้อยแล้ว และสามารถคว้าแชมป์กลุ่มได้สำเร็จจากการเอาชนะสเปนที่กรุงมาดริดเมื่อวันอาทิตย์ที่ผ่านมา", "ชัยชนะของอังกฤษเหนือสเปนในกรุงมาดริดส่งผลให้พวกเขาจบด้วยการเป็นอันดับหนึ่งของกลุ่ม ซึ่งมีความสำคัญอย่างยิ่งเนื่องจากแชมป์กลุ่มในลีก A ของเนชันส์ ลีก จะได้รับสิทธิ์เป็นทีมวางในการจับสลากรอบก่อนรองชนะเลิศ โดยพวกเขาจะต้องพบกับทีมที่จบอันดับสองจากกลุ่มอื่น และจะได้สิทธิ์ลงเล่นเกมเลกที่สองของรอบก่อนรองชนะเลิศในบ้านของตัวเอง", "สำหรับเบลเยียมนั้นจบการแข่งขันในฐานะรองแชมป์กลุ่ม A1 จึงทำให้พวกเขากลายเป็นหนึ่งในคู่แข่งที่มีโอกาสพบกับอังกฤษในรอบ 8 ทีมสุดท้าย อย่างไรก็ตาม 'สิงโตคำราม' จะไม่สามารถจับสลากมาพบกับสเปนในรอบนี้ได้ เนื่องจากกฎระบุว่าทีมที่มาจากกลุ่มเดียวกันจะไม่สามารถพบกันเองในรอบก่อนรองชนะเลิศได้ และจะไม่พบกับฝรั่งเศสเนื่องจากฝรั่งเศสจบการแข่งขันในฐานะแชมป์กลุ่ม A1 เช่นกัน", "ในส่วนของทีมอื่นๆ ที่อยู่ในข่ายลุ้นจบอันดับ 1 หรือ 2 ในกลุ่มลีก A อื่นๆ ได้แก่ กลุ่ม A2 ประกอบด้วย เนเธอร์แลนด์, กรีซ และเยอรมนี ส่วนกลุ่ม A4 ประกอบด้วย โปรตุเกส, เดนมาร์ก และนอร์เวย์", "การจับสลากประกบคู่รอบ 8 ทีมสุดท้ายจะมีขึ้นในวันศุกร์นี้ เวลา 11.00 น. ตามเวลาของสหราชอาณาจักร โดยรอบก่อนรองชนะเลิศจะเป็นการแข่งขันแบบเหย้า-เยือนสองเลก ซึ่งทีมวางที่เป็นแชมป์กลุ่มจะได้ลงเล่นนัดที่สองในบ้านของตนเอง", "โปรแกรมการแข่งขันจะมีขึ้นในช่วงพักเบรกทีมชาติเดือนมีนาคม โดยเลกแรกจะแข่งขันระห แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในวันที่ 22 พฤศจิกายนนี้", "ทางสโมสรหวังว่าการเข้ามาของโปเช็ตติโน่จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป ทั้งนี้ แฟร์นันด์สเคยเกือบจะได้ย้ายไปร่วมทีมท็อตแนม ฮ็อตสเปอร์ ของโปเช็ตติโน่ในปี 2019 แต่การย้ายทีมไม่เกิดขึ้น ก่อนที่เขาจะย้ายมาอยู่กับแมนเชสเตอร์ ยูไนเต็ด ในอีก 6 เดือนต่อมา โดยในฤดูกาลนี้ อดีตมิดฟิลด์สปอร์ติ้ง ลิสบอน รายนี้ทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด", "ในทางทฤษฎีแล้ว สถานการณ์ความขัดแย้งเรื่องสัญญาปัจจุบันระหว่างแมนเชสเตอร์ ยูไนเต็ด และบรูโน่ แฟร์นันด์ส ไม่ใช่เรื่องใหญ่โตนัก เพราะเป็นเรื่องปกติที่ข้อเสนอครั้งแรก ครั้งที่สอง หรือแม้แต่ครั้งต่อๆ ไปจะถูกปฏิเสธ ซึ่งเป็นส่วนหนึ่งของกระบ รแข่งขันที่สร้างแรงสั่นสะเทือนให้กับเก้าอี้กุนซือของเขาในช่วงเวลานั้น", "ตลอดระยะเวลาการคุมทีมชั่วคราว คาร์ริค ต้องเผชิญกับความท้าทายมากมายในการจัดการทีมท่ามกลางความคาดหวังอันสูงลิ่วของแฟนบอลปีศาจแดง ซึ่งแต่ละเกมที่เขาลงคุมทีมข้างสนามนั้นล้วนมีนัยสำคัญต่ออนาคตของสโมสรในพรีเมียร์ลีกอย่างหลีกเลี่ยงไม่ได้", "บทวิเคราะห์นี้ยังได้รวบรวมเอาบริบทเหตุการณ์สำคัญที่เกิดขึ้นในแต่ละนัด เพื่อให้เห็นภาพรวมว่าเหตุใดผลการแข่งขันเหล่านี้จึงถูกยกให้เป็นหมุดหมายสำคัญที่นิยามช่วงเวลาของ ไมเคิล คาร์ริค ในถิ่น โอลด์ แทรฟฟอร์ด ก่อนที่เขาจะก้าวผ่านช่วงเวลาดังกล่าวไป"], "link": "https://www.bbc.co.uk/sport/football/videos/c5ev37egv97mo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/videos/c5ev37egv97mo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f60a/live/0222d570-d167-11f1-b441-2b33b063138f.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794482746, "published_at": "2026-11-12T11:25:46Z", "published_th": "12 พ.ย. 2026 • 18:25 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776987, "guid": "https://www.bbc.co.uk/sport/football/articles/cm0rl4kwn8vqo", "original_title": "The chaos that took Carrick from two-year deal to sacked within 15 games", "thai_title": "จากสัญญา 2 ปีสู่การถูกปลด: เจาะลึกความโกลาหลในยุค ไมเคิล คาร์ริค กับ แมนเชสเตอร์ ยูไนเต็ด", "tag": "Football", "bullet_points": ["ไมเคิล คาร์ริค ถูกปลดจากตำแหน่งกุนซือแมนเชสเตอร์ ยูไนเต็ด หลังคุมทีมได้เพียง 15 เกมในฤดูกาลนี้ ท่ามกลางผลงานที่ย่ำแย่และสถานการณ์ที่ไร้เสถียรภาพ", "ฟอร์มการเล่นของทีมดิ่งลงเหวอย่างต่อเนื่องนับตั้งแต่เปิดฤดูกาล โดยไม่สามารถคว้าชัยชนะในพรีเมียร์ลีกได้เลยนับตั้งแต่เกมถล่มอิปสวิช 5-2", "ปัญหาหลักของทีมคือความผิดพลาดในเกมรับ ความฟิตของนักเตะที่ไม่สมบูรณ์ และการจัดทัพที่ไม่ลงตัว ส่งผลให้เกิดความขัดแย้งภายในและเสียงวิจารณ์จากแฟนบอล", "บอร์ดบริหารนำโดย โอมาร์ เบอร์ราดา และ เจสัน วิลค็อกซ์ ตัดสินใจปลดคาร์ริคหลังจบเกมเสมอ แอสตัน วิลลา 4-4 โดยมองว่าทีมต้องการการเปลี่ยนแปลงเพื่อกอบกู้สถานการณ์"], "full_paragraphs": ["เหตุการณ์เกิดขึ้นหลังเวลา 18.00 น. ของวันอาทิตย์ที่ 8 พฤศจิกายน เมื่อข้อความสำคัญถูกส่งมาถึง ในขณะที่แมนเชสเตอร์ ยูไนเต็ด กำลังตามหลัง แอสตัน วิลลา อยู่ 4-2 และแฟนบอลในโอลด์ แทรฟฟอร์ด ต่างทำใจยอมรับความพ่ายแพ้ไปแล้ว คำขอร้องดังกล่าวมาจากบุคคลที่รู้จัก ไมเคิล คาร์ริค เป็นอย่างดี เคยร่วมงานกับเขา และเข้าใจถึงแรงกดดันของการใช้ชีวิตใน 'ตู้ปลาทอง' อย่างสโมสรแห่งนี้เป็นอย่างดี", "อย่างไรก็ตาม บทสรุปที่หลายคนคาดการณ์ไว้กลับไม่เกิดขึ้น ยูไนเต็ดทำประตูได้สองลูกในช่วงทดเวลาบาดเจ็บจนตีเสมอ 4-4 คาร์ริคฉลองประตูตีเสมอของ แพทริค ดอร์กู ด้วยการชูแขนขึ้นฟ้า หลังจากนั้นเขาเดินรอบสนามซึ่งกลายเป็นการเดินขอบคุณแฟนบอลครั้งสุดท้ายของเขาในฐานะกุนซือ", "ในขณะที่แฟนบอลยูไนเต็ดร้องเพลงเชียร์ชื่อของเขา คาร์ริคได้เข้าไปยืนอยู่ท่ามกลางลูกทีมเพื่อปกป้องไม่ให้แฟนบอลรุมตำหนินักเตะเหมือนที่เคยเกิดขึ้นหลังความพ่ายแพ้ต่อ บอร์นมัธ 3-0 เมื่อสองสัปดาห์ก่อน การตัดสินใจครั้งนี้สะท้อนตัวตนของกุนซือวัย 45 ปีรายนี้ได้เป็นอย่างดี นั่นคือการให้ความสำคัญกับส่วนรวมมากกว่าตัวเอง", "ความปรารถนาอย่างแรงกล้าที่จะทำสิ่งที่ดีที่สุดให้กับสโมสรและนักเตะ รวมถึงอดีตอันรุ่งโรจน์ของเขา อธิบายได้ว่าทำไมเพลงเชียร์ของคาร์ริคยังคงดังกึกก้องจากอัฒจันทร์ ในขณะที่คนอื่นๆ ในยูไนเต็ดต่างตกเป็นเป้าของความโกรธแค้นและเสียงเยาะเย้ย แต่ท้ายที่สุดแล้ว สิ่งเหล่านั้นก็ไม่เพียงพอ", "การที่เขาอยู่มาได้ถึงจุดนี้ถือว่านานกว่าที่หลายคนคาดไว้ ดูเหมือนไม่มีทางที่คาร์ริคจะรอดพ้นจากความล้มเหลวในเกมพบกับบอร์นมัธไปได้ ยูไนเต็ดใช้เวลาถึง 44 ชั่วโมงในการสื่อสารกับโลกภายนอกว่าพวกเขายังคงให้โอกาสเขาคุมทีมต่อ แม้จะเป็นที่เข้าใจกันว่าคาร์ริคได้รับแจ้งเรื่องการตัดสินใจล่วงหน้าตั้งแต่วันก่อนหน้านั้นแล้ว", "นับตั้งแต่นั้นมา สถานการณ์ก็เต็มไปด้วยความโกลาหล ยูไนเต็ดชนะ 1 เสมอ 1 และแพ้ 1 ในช่วงเวลาดังกล่าว พวกเขาโชว์ฟอร์มได้อย่างยอดเยี่ยมใน 45 นาทีแรกที่พบกับเชลซี แต่กลับมาเสียประตูในช่วงต้นครึ่งหลัง ก่อนที่ ลิซานโดร มาร์ติเนซ จะถูกไล่ออกจากการได้รับสองใบเหลืองภายในเวลาเพียง 5 นาที ทำให้ทีมพ่ายไป 2-0", "ในศึกยูฟ่า แชมเปียนส์ลีก ที่พบกับ โรม่า พวกเขาเล่นได้อย่างย่ำแย่และตามหลังสองประตูภายใน 17 นาทีแรก แต่ก็ฮึดสู้กลับมาคว้าชัยชนะ 3-2 ด้วยฟอร์มการเล่นที่น่าตื่นตาตื่นใจ ซึ่งเป็นสิ่งที่คาร์ริคเคยสัมผัสบ่อยครั้งในยุคของ เซอร์ อเล็กซ์ เฟอร์กูสัน จากนั้นจึงเป็นเกมกับวิลลา ที่พวกเขาตามหลังสองประตูภายใน 4 นาทีจากความผิดพลาดของผู้รักษาประตู แต่ก็สามารถตีเสมอได้ก่อนจบครึ่งแรก แม้จะมีการป้องกันที่ย่ำแย่จนต้องเหนื่อยหนัก แต่พวกเขาก็รอดพ้นจากความพ่ายแพ้มาได้ด้วยหนึ่งแต้ม", "หากจะวิเคราะห์เหตุการณ์เหล่านี้ คำถามคือผลงานของคาร์ริคดีขึ้น หรือมันเพียงแค่พิสูจน์ว่าเขาไม่ใช่คนที่ใช่สำหรับงานนี้กันแน่? ยูไนเต็ดตัดสินใจว่าเป็นอย่างหลัง โอมาร์ เบอร์ราดา ประธานเจ้าหน้าที่บริหาร และ เจสัน วิลค็อกซ์ ผู้อำนวยการฟุตบอล ต่างร่วมฉลองประตูตีเสมอของดอร์กูในเกมพบวิลลาจากบนอัฒจันทร์ แต่พวกเขามีมุมมองที่ค่อนข้างแยกส่วนออกไป และภายในไม่กี่วัน พวกเขาก็บินไปโมนาโกเพื่อแจ้งต่อ เซอร์ จิม แรตคลิฟฟ์ เจ้าของร่วมว่าจำเป็นต้องมีการเปลี่ยนแปลง", "เป็นฤดูกาลที่สามติดต่อกันที่ยูไนเต็ดต้องเปลี่ยนตัวผู้จัดการทีมกลางคัน ซึ่งต่างจากกรณีของ เอริก เทน ฮาก และ รูเบน อโมริม การตัดสินใจครั้งนี้ไม่ใช่เรื่องน่าประหลาดใจ ไม่ใช่เพราะสิ่งที่เกิดขึ้นในตอนนี้ แต่เป็นเพราะสิ่งที่เกิดขึ้นในตอนนี้มันขัดแย้งกับสิ่งที่เกิดขึ้นเมื่อฤดูกาลที่แล้วอย่างสิ้นเชิง หลังจากทำผลงานชนะ 12 จาก 17 เกมภายใต้การคุมทีมของคาร์ริคและพาทีมกลับไปเล่นแชมเปียนส์ลีก บรรยากาศในช่วงปรีซีซั่นถือว่าดีเยี่ยมอย่างมาก", "ไม่มีสัญญาณของความแตกแยก นักเตะดาวรุ่งอย่าง เจเจ กาเบรียล เป็นส่วนหนึ่งของทีม และทีมงานระดับสูงต่างพูดถึงศักยภาพของ บรูโน่ แฟร์นันด์ส ที่จะจับคู่กับ ยูริ ตีเลอมันส์ อย่างมีความหวัง แม้การเสริมทัพจะเป็นปัญหาที่ชัดเจนก็ตาม", "เมื่อมองย้อนกลับไป 48 ชั่วโมงก่อนเกมเปิดฤดูกาลที่พบกับ ฮัลล์ ซิตี้ ถือเป็นช่วงเวลาสำคัญ ในขณะที่ เบนจามิน เซสโก้ ยังคงพยายามฟื้นฟูจากอาการบาดเจ็บที่หน้าแข้ง อาหมัด ดิยัลโล่ ก็ได้รับบาดเจ็บที่ข้อเท้าซึ่งทำให้เขาต้องพักยาว 7 สัปดาห์ นั่นหมายความว่าคาร์ริคขาดตัวเลือกในแนวรุกที่เขาต้องการ โดยต้องให้ ไบรอัน เอ็มเบอโม่ ลงเล่นทางฝั่งขวาแทน", "คาร์ริคหันไปใช้ มาเธอุส คุนญ่า ซึ่งมักจะถอยลงต่ำจนไปทับพื้นที่ของกัปตันทีมอย่าง แฟร์นันด์ส ส่งผลให้เกมรุกของยูไนเต็ดไร้ประสิทธิภาพในวันที่พวกเขาดูไม่พร้อมรับมือกับความแข็งแกร่งของคู่แข่งที่กระหายชัยชนะในการกลับมาสู่พรีเมียร์ลีกอีกครั้ง ในบทบาทผู้สัมภาษณ์ของ Viaplay อดีตกองหน้าทีมชาตินอร์เวย์อย่าง แจน อาเก้ ฟยอร์ทอฟต์ อ้างว่ายูไนเต็ดขาดความมุ่งมั่น ซึ่งคาร์ริคปฏิเสธว่าเป็นเรื่อง 'ไร้สาระ' โดยกล่าวกับสื่อว่า 'มันก็แค่เกมเดียว'", "สัปดาห์ต่อมา ยูไนเต็ดแพ้ให้กับ อิปสวิช ซึ่งเป็นทีมที่เพิ่งเลื่อนชั้นขึ้นมา มีเพียงความผิดพลาดของ มาร์เซลิโน่ นูเนซ ในแดนตัวเองที่เปิดโอกาสให้ คุนญ่า จ่ายบอลให้ แฟร์นันด์ส ทำประตูตีเสมอที่ทีมไม่สมควรได้รับ ก่อนที่แฟร์นันด์ส ซึ่งเพิ่งได้รับรางวัลนักเตะยอดเยี่ยมแห่งปีของ PFA ประจำฤดูกาล 2025-26 จะทำแฮตทริกช่วยให้ทีมชนะ 5-2 และนั่นคือชัยชนะนัดสุดท้ายของยูไนเต็ดในพรีเมียร์ลีก", "หลังจากนั้นคือการไปเยือน เอฟเวอร์ตัน ยูไนเต็ดขึ้นนำสองครั้ง ครั้งที่สองคือตอนที่ เซสโก้ ทำประตูได้ในนาทีที่ 88 หลังจากลงมาเป็นตัวสำรอง แต่ในช่วงทดเวลาบาดเจ็บ เอนส์ลีย์ เมตแลนด์-ไนล์ส ยิงไกลเข้าไปทำให้ทีมเยือนพลาดชัยชนะ เมื่อถูกถามว่าเขามั่นใจแค่ไหนในความสามารถของทีมที่จะตอบสนองต่อการเริ่มต้นฤดูกาลที่น่าผิดหวัง คาร์ริคสวนกลับว่า 'มันไม่ได้แย่ขนาดนั้น'", "สิ่งที่เกิดขึ้นหลังจากนั้นกลับแย่ยิ่งกว่า ความพ่ายแพ้ 4-1 ต่อ โคโม่ ของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในผลงานที่เลวร้ายที่สุดในยุโรป ความฟิตของนักเตะยูไนเต็ดถูกตั้งคำถามครั้งแล้วครั้งเล่า พวกเขาเล่นได้อย่างยากลำบากกับ แมนเชสเตอร์ ซิตี้ ที่เหลือผู้เล่น 10 คนตั้งแต่ครึ่งแรก ก่อนที่ซิตี้จะได้ประตูจาก เออร์ลิง ฮาแลนด์ ซึ่ง ฮาวเวิร์ด เว็บบ์ หัวหน้าผู้ตัดสินยอมรับในภายหลังว่าไม่ควรเป็นประตู", "คำบ่นของคาร์ริคหลังจบเกมนั้นมีเหตุผล แต่ก็เป็นการกลบเกลื่อนฟอร์มการเล่นที่ย่ำแย่ของทีม หลังจากขึ้นนำ 2-0 ภายใน 10 นาทีแรกในเกมพบ ไบรท์ตัน ในศึกอีเอฟแอล คัพ ยูไนเต็ดกลับถูกเล่นงานจนพ่ายแพ้จากการเสียสองประตูภายใน 4 นาทีในครึ่งหลัง ทีมงานสต๊าฟฟ์โค้ชของคาร์ริคที่เคยได้รับคำชมเมื่อไม่กี่เดือนก่อน ไม่สามารถหาคำตอบให้กับสถานการณ์นี้ได้", "เฮดโค้ชกล่าวว่าประตูตีเสมอในช่วงทดเวลาบาดเจ็บของคุนญ่าในเกมพบ ฟูแล่ม ซึ่งเป็นทีมบ๊วยของตารางในขณะนั้น เป็นแง่บวกที่สามารถนำไปต่อยอดได้ แต่ทันทีหลังจากช่วงพักเบรกทีมชาติ ยูไนเต็ดก็ทำได้เพียงเสมออีกครั้ง โดยเสียประตูในช่วงทดเวลาบาดเจ็บให้กับ ท็อตแน่ม ฮ็อทสเปอร์ ที่ฟอร์มตกและเหลือผู้เล่น 10 คน", "วงจรขาลงที่คุ้นเคยเริ่มควบคุมไม่ได้ มาร์ติเนซเป็นคนรับผิดชอบต่อประตูตีเสมอของสเปอร์ส ซึ่งทำให้การระเบิดอารมณ์ของเขาหลังความพ่ายแพ้ 2-0 ในแชมเปียนส์ลีกต่อ แอตเลติโก มาดริด ดูน่าประหลาดใจยิ่งกว่าเดิม"], "link": "https://www.bbc.co.uk/sport/football/articles/cm0rl4kwn8vqo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm0rl4kwn8vqo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/e373/live/dbd80f70-de86-11f1-b88b-3f1671ea859d.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/3527/live/49870420-dc22-11f1-a701-fddedf244c16.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/2b84/live/b7bd2450-d124-11f1-9a61-7b8d75492b97.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6236/live/c3d39ea0-d10a-11f1-93e1-3b657b665bcf.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8a69/live/7340d470-d10b-11f1-a701-fddedf244c16.jpg"], "videos": [], "review_score": "", "published_ts": 1794478889, "published_at": "2026-11-12T10:21:29Z", "published_th": "12 พ.ย. 2026 • 17:21 น.", "category_hint": "Football", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794848496047, "guid": "https://www.theverge.com/?p=1034178", "original_title": "Sony’s PlayStation 5 accessories are cheaper ahead of Black Friday", "thai_title": "Sony จัดโปรโมชันลดราคาอุปกรณ์เสริม PlayStation 5 ต้อนรับเทศกาล Black Friday", "tag": "Technology", "sub_tag": "GADGETS", "bullet_points": ["Sony เริ่มแคมเปญลดราคาอุปกรณ์เสริม PS5 ครั้งใหญ่ต้อนรับ Black Friday และ Cyber Monday", "DualSense Wireless Controller ลดราคา 20 ดอลลาร์ ส่วน DualSense Edge ลดราคา 30 ดอลลาร์", "โปรโมชันครอบคลุมถึงหูฟัง Pulse Elite, หูฟังไร้สาย Pulse Explore และฝาครอบคอนโซลรุ่น Slim", "คอนโซล PS5 เครื่องใหม่ยังไม่มีส่วนลดเนื่องจากปัจจัยด้านต้นทุน RAM และการมาถึงของเกม Grand Theft Auto VI", "ผู้ที่ต้องการประหยัดงบสามารถเลือกซื้อคอนโซลแบบ Refurbished ที่มาพร้อมการรับประกัน 1 ปีเท่าเครื่องใหม่"], "full_paragraphs": ["ขณะนี้มีดีลส่วนลดมากมายสำหรับผู้ที่ต้องการอัปเกรดความสวยงามและประสิทธิภ
