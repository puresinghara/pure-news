าวะเศรษฐกิจที่ยากลำบาก", "ในประเด็นเรื่องอิทธิพลของแพลตฟอร์มโซเชียลมีเดีย Sherrill ยอมรับว่าเธอเคยมีความกังวลเกี่ยวกับข้อมูลบิดเบือน (misinformation) และอัลกอริทึมที่ผลักดันให้ผู้คนเข้าสู่แนวคิดสุดโต่ง แต่ในทางกลับกัน เธอกลับมองว่าในยุคปัจจุบัน 'ความลับไม่มีในโลก' การที่นักการเมืองพยายามปกปิดปัญหาหรือซุกปัญหาไว้ใต้พรมนั้นทำได้ยากขึ้น ซึ่งถือเป็นผลดีต่อระบอบประชาธิปไตยที่ต้องการความโปร่งใสและการแสดงความรับผิดชอบต่อประชาชนอย่างตรงไปตรงมา", "เมื่อพูดถึงการเมืองยุค Influencer ที่เน้นการสื่อสารผ่านวิดีโอสั้น Sherrill ชี้ว่านักการเมืองรุ่นใหม่ที่ประสบความสำเร็จอย่าง Zohran Mamdani มีความสามารถในการใช้โซเชียลมีเดียอย่างเป็นธรรมชาติและเข้าถึงอารมณ์ความรู้สึกของผู้คน เธอเปรียบเทียบว่าในขณะที่นักการเมืองบางกลุ่มพยายามเลียนแบบพฤติกรรมก้าวร้าวหรือใช้ถ้อยคำรุนแรงเพื่อเรียกยอด Engagement แต่ความสำเร็จที่แท้จริงกลับอยู่ที่ 'ความจริงใจ' (authenticity) และการเชื่อมโยงนโยบายเข้ากับผลลัพธ์ที่จับต้องได้", "ในช่วงท้ายของการสนทนา Nilay Patel ได้ตั้งข้อสังเกตว่าการเข้าซื้อกิจการ Twitter (ปัจจุบันคือ X) ของ Elon Musk ถือเป็นความล้มเหลวในทุกมิติ ทั้งในแง่จำนวนผู้ใช้งาน รายได้ และอิทธิพลทางการเมือง ซึ่ง Sherrill ดูจะเห็นด้วยในเชิงนัยยะว่าแพลตฟอร์มดังกล่าวได้กลายเป็น 'ฟองสบู่' ที่แยกตัวออกจากความเป็นจริงของสังคมวงกว้าง ทำให้พรรครีพับลิกันที่ยึดติดกับแพลตฟอร์มนี้เกิดความสับสนและสูญเสียความสามารถในการสื่อสารกับประชาชนส่วนใหญ่ของประเทศไปอย่างน่าเสียดาย"], "link": "https://www.theverge.com/podcast/1034141/nj-midterm-sherill-democrats-musk-x-ai", "canonical_link": "https://www.theverge.com/podcast/1034141/nj-midterm-sherill-democrats-musk-x-ai", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DCD_20261116_Sherrill.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/24792604/The_Verge_Decoder_Tileart.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794844800, "published_at": "2026-11-16T16:00:00Z", "published_th": "16 พ.ย. 2026 • 23:00 น.", "category_hint": "Technology"}, {"id": 1794840351652, "guid": "https://www.theverge.com/?p=1034039", "original_title": "America’s air traffic control system couldn’t handle a single bad router", "thai_title": "ระบบควบคุมการจราจรทางอากาศสหรัฐฯ เป็นอัมพาต เหตุเราเตอร์ตัวเดียวทำงานผิดพลาด", "tag": "Technology", "sub_tag": "TRANSPORTATION", "bullet_points": ["ระบบโครงสร้างพื้นฐานโทรคมนาคมของ FAA (FTI) เกิดล่มทั่วประเทศเมื่อวันที่ 13 พฤศจิกายน ส่งผลให้ต้องประกาศหยุดบินทั่วสหรัฐฯ เป็นเวลานานกว่า 4 ชั่วโมง", "สาเหตุเกิดจากการติดตั้งเราเตอร์ไร้สายตัวใหม่แทนที่ระบบโทรศัพท์แบบเดิมที่สถานีวิทยุในรัฐอาร์คันซอ ซึ่งส่งผลให้เกิดการส่งข้อมูลขยะเข้าสู่เครือข่ายจนระบบล่ม", "เหตุการณ์นี้ส่งผลกระทบต่อผู้โดยสารกว่า 1.5 ล้านคน มีการยกเลิกเที่ยวบินกว่า 13,000 เที่ยว และล่าช้าอีกกว่า 25,000 เที่ยวบิน", "การสื่อสารที่สับสนและขัดแย้งกันของเจ้าหน้าที่ระดับสูงในรัฐบาลสร้างความไม่เชื่อมั่นและจุดกระแสข่าวลือเรื่องการโจมตีทางไซเบอร์หรือความผิดพลาดของ AI"], "full_paragraphs": ["เหตุการณ์ความวุ่นวายในวันศุกร์ที่ 13 พฤศจิกายน ซึ่งทำให้ผู้โดยสารกว่า 1.5 ล้านคนต้องติดค้างอยู่ตามสนามบินทั่วสหรัฐฯ มีจุดเริ่มต้นมาจากปัญหาทางเทคนิคที่ดูเหมือนเล็กน้อยแต่กลับส่งผลกระทบเป็นวงกว้าง พร้อมกับการแถลงข่าวที่เต็มไปด้วยความสับสนจนกลายเป็นเชื้อไฟให้เกิดทฤษฎีสมคบคิดแทนที่จะสร้างความเชื่อมั่นให้กับสาธารณชน", "ขณะที่เครื่องบินกำลังจะลงจอดที่แอตแลนตา นักบินได้ประกาศผ่านอินเตอร์คอมว่ามีปัญหาเกิดขึ้น โดยระบุว่าเป็นปัญหาด้านการสื่อสารกับสำนักงานบริหารการบินแห่งชาติ (FAA) ที่กำลังลุกลามไปทั่วประเทศ นักบินไม่ได้ให้รายละเอียดมากนักนอกเหนือจากบอกว่าอาจส่งผลต่อการเข้าเทียบประตูและการต่อเครื่อง", "สำหรับ Amanda Khera ผู้โดยสารที่กำลังเดินทางกลับบ้านพร้อมครอบครัวหลังจากประสบปัญหาลูกชายวัย 22 เดือนป่วยหนักระหว่างพักผ่อนที่เบลีซ สถานการณ์นี้สร้างความหวาดกลัวอย่างมาก เธอตั้งคำถามว่านักบินกำลังบินโดยไม่มีการติดต่อกับหอควบคุมการจราจรหรือไม่ หรือเครื่องบินจะชนกันกลางอากาศหรือเปล่า โดยเฉพาะอย่างยิ่งเมื่อคำนึงถึงเหตุการณ์เครื่องบินชนกันเหนือสนามบิน Reagan National ในปี 2025 ที่มีผู้เสียชีวิตถึง 67 ราย", "แม้เที่ยวบินของเธอจะลงจอดอย่างปลอดภัย แต่เมื่อก้าวออกจากเครื่องเธอกลับพบกับสนามบินที่เป็นอัมพาต เที่ยวบินกว่า 600 เที่ยวจากแอตแลนตาถูกยกเลิก และไม่มีใครทราบว่าการเดินทางจะกลับมาเป็นปกติเมื่อใด เนื่องจาก FAA ได้ประกาศหยุดบินทั่วประเทศ (Ground Stop) เป็นที่เรียบร้อยแล้ว", "วิกฤตเริ่มขึ้นเมื่อเวลาประมาณ 15:15 น. ตามเวลา ET เมื่อนักบินและเจ้าหน้าที่ควบคุมการจราจรทางอากาศในแถบมิดเวสต์เริ่มรายงานปัญหาการสื่อสารผ่านวิทยุ โดยนักบินของสายการบิน Allegiant เที่ยวบิน 547 รายงานว่าไม่สามารถติดต่อหอควบคุมได้เลย ขณะที่เจ้าหน้าที่ในรัฐอิลลินอยส์ระบุว่าปัญหาขยายตัวเกินกว่าที่คาดการณ์ไว้จนระบบ Chicago Approach เข้าสู่สถานะ ATC zero", "FAA ได้ออกคำสั่งหยุดบินทั่วประเทศในเวลา 15:54 น. ET โดยอ้างเหตุผลด้านความปลอดภัย ซึ่งสร้างความประหลาดใจให้กับทั้งนักบินและเจ้าหน้าที่ควบคุมการจราจรทางอากาศทั่วประเทศ เนื่องจากไม่เคยเกิดเหตุการณ์ในลักษณะนี้มาก่อน", "ปัญหาดังกล่าวมีต้นตอมาจากระบบ FAA Telecommunications Infrastructure (FTI) ซึ่งเป็นกระดูกสันหลังของระบบควบคุมการจราจรทางอากาศที่สร้างโดยบริษัท L3Harris ตั้งแต่ช่วงต้นปี 2000 โดยระบบนี้ทำหน้าที่เชื่อมต่อสถานีการบินกว่า 4,400 แห่งเข้าด้วยกัน และกำลังอยู่ในแผนการเปลี่ยนผ่านในปี 2028", "รายงานจาก The Wall Street Journal ระบุว่าความผิดพลาดเกิดจากการที่ผู้รับเหมาของ L3Harris เปลี่ยนสวิตช์โทรศัพท์แบบสายเป็นเราเตอร์ข้อมูลไร้สายตัวใหม่ที่สถานีในเมือง El Dorado รัฐอาร์คันซอ แต่เมื่อเปิดใช้งาน เราเตอร์ดังกล่าวกลับส่งคำขอเชื่อมต่อเข้าสู่เครือข่ายนับร้อยครั้งต่อวินาทีจนทำให้ระบบโอเวอร์โหลด", "I-Hong Hou ศาสตราจารย์ด้านวิศวกรรมไฟฟ้าและคอมพิวเตอร์จาก Texas A&M University อธิบายว่าเครือข่ายโทรคมนาคมจะแบ่งข้อมูลเป็นแพ็กเก็ตเล็กๆ เมื่อเครือข่ายเสื่อมประสิทธิภาพลงและสูญเสียแพ็กเก็ตข้อมูลไปเพียงบางส่วน ก็อาจทำให้ระบบที่ต้องการความแม่นยำสูงอย่างการควบคุมการจราจรทางอากาศหยุดทำงานโดยสิ้นเชิงได้", "เจ้าหน้าที่เทคนิคของ FAA เชื่อว่าการพยายามเชื่อมต่อซ้ำๆ ของเราเตอร์ที่ El Dorado สร้างความไม่เสถียรจนตัดการเชื่อมต่อวิทยุและเรดาร์ของศูนย์ควบคุมการจราจรทางอากาศ 17 แห่งจากทั้งหมด 22 แห่งทั่วประเทศ ซึ่งเป็นปรากฏการณ์ที่เรียกว่า 'Cascading Failure' หรือความล้มเหลวแบบลูกโซ่", "หลังจากที่ผู้รับเหมาของ L3Harris ตัดการเชื่อมต่อเราเตอร์ตัวที่มีปัญหาและเราเตอร์อีกตัวที่สถานีเรดาร์ในรัฐเท็กซัสออกไป เครือข่ายก็เริ่มกลับมาเสถียรอีกครั้ง และ FAA ได้ยกเลิกคำสั่งหยุดบินในเวลา 20:15 น. ET รวมระยะเวลาที่หยุดบินนานที่สุดนับตั้งแต่เหตุการณ์ 9/11", "ความล้มเหลวทางเทคโนโลยีกลายเป็นวิกฤตที่เลวร้ายลงด้วยการสื่อสารที่ผิดพลาดของ FAA โดยหลังจากผ่านไป 6 ชั่วโมง รัฐมนตรีว่าการกระทรวงคมนาคม Sean Duffy และรัฐมนตรีว่าการกระทรวงความมั่นคงแห่งมาตุภูมิ Markwayne Mullin ได้ออกมาแถลงข่าว แต่กลับให้ข้อมูลที่สับสนและขัดแย้งกันเอง โดย Mullin พยายามปฏิเสธว่าไม่ใช่การโจมตีทางไซเบอร์ แต่กลับโทษโครงการปรับปรุงระบบของ FAA", "ในการแถลงข่าววันเสาร์ถัดมา Duffy ได้ตั้งข้อสังเกตถึงความไร้ประสิทธิภาพของผู้รับเหมา และเรียกร้องให้สภาคองเกรสจัดสรรงบประมาณเพิ่มอีกหลายพันล้านดอลลาร์เพื่อดำเนินการปรับปรุงระบบให้เสร็จสิ้น โดยมองว่าเงินงบประมาณเดิม 1.25 หมื่นล้านดอลลาร์นั้นเป็นเพียง 'การจ่ายเงินบางส่วน' เท่านั้น", "การแถลงข่าวที่เต็มไปด้วยความสับสนและปัญหาทางเทคนิคระหว่างการถ่ายทอดสด ยิ่งกระพือข่าวลือบนโลกออนไลน์ว่าเหตุการณ์นี้อาจเกิดจากการโจมตีทางไซเบอร์หรือความผิดพลาดของ AI ที่เกี่ยวข้องกับระบบ SMART ที่เพิ่งเปิดตัวไปเมื่อเดือนกันยายน แม้ว่าจนถึงปัจจุบันจะยังไม่มีหลักฐานยืนยันข้อสันนิษฐานดังกล่าวก็ตาม"], "link": "https://www.theverge.com/transportation/1034039/faa-aviation-glitch-meltdown-ground-stop", "canonical_link": "https://www.theverge.com/transportation/1034039/faa-aviation-glitch-meltdown-ground-stop", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2304497345.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2304529219.jpg?quality=90&strip=all&crop=0.0043546420484191%2C0%2C99.991290715903%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2305020762.jpg?quality=90&strip=all&crop=0%2C0.59288537549407%2C100%2C98.814229249012&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2305012177.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2304502089.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2305027076.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794840228, "published_at": "2026-11-16T14:43:48Z", "published_th": "16 พ.ย. 2026 • 21:43 น.", "category_hint": "Technology"}, {"id": 1794838537096, "guid": "https://www.theverge.com/?p=1034083", "original_title": "Audible is trying to make it easier to find audiobooks you’ll actually like", "thai_title": "Audible เปิดตัวฟีเจอร์ AI ช่วยสรุปเนื้อหาหนังสือเสียง ให้ผู้ใช้ตัดสินใจเลือกฟังได้ง่ายขึ้น", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Audible เปิดตัวฟีเจอร์ 'Audio Discovery' ใช้ AI ช่วยสรุปเนื้อหาและประเด็นสำคัญของหนังสือเสียง เพื่อให้ผู้ใช้ตัดสินใจเลือกฟังได้ง่ายขึ้น", "ฟีเจอร์ใหม่นี้รวบรวมข้อมูลจากตัวอย่างหนังสือ บทวิจารณ์ของผู้ฟัง และบทสัมภาษณ์ของผู้เขียนหรือบรรณาธิการมาสรุปเป็นเสียงให้ฟัง", "มีการนำ AI มาใช้สร้างคอลเลกชันหนังสือเสียงแบบเฉพาะบุคคล (Personalized Collections) เพื่อช่วยให้หนังสือที่ไม่ได้ติดอันดับขายดีถูกค้นพบได้ง่ายขึ้น", "ขยายขอบเขตฟีเจอร์เบต้า 'Ask a Question' และ 'Recaps' ให้ครอบคลุมหนังสือภาษาอังกฤษในสหรัฐฯ มากขึ้น พร้อมแผนเปิดตัวเต็มรูปแบบในเดือนธันวาคม", "ความเคลื่อนไหวนี้เป็นกลยุทธ์สำคัญของ Audible ในการดึงดูดผู้ใช้ใหม่และรับมือกับการแข่งขันที่รุนแรงจากแพลตฟอร์มคู่แข่งอย่าง Spotify"], "full_paragraphs": ["Audible กำลังเปิดตัวฟีเจอร์ใหม่ที่ขับเคลื่อนด้วย AI ซึ่งออกแบบมาเพื่อช่วยให้ผู้ใช้งานสามารถตัดสินใจได้ง่ายขึ้นว่าหนังสือเสียงเล่มไหนที่พวกเขาจะชื่นชอบก่อนที่จะเริ่มกดฟังจริง โดยฟีเจอร์ 'Audio Discovery' นี้จะผสมผสานทั้งตัวอย่างเสียงจากหนังสือ บทสรุปที่สร้างโดย AI และบทวิจารณ์จากผู้เขียน เพื่อให้ข้อมูลที่ครบถ้วนแก่ผู้ใช้ในการเลือกเรื่องราวถัดไป นอกจากนี้ยังมีการแนะนำคอลเลกชันหนังสือเสียงที่ปรับแต่งให้เข้ากับรสนิยมการฟังของแต่ละบุคคลโดยเฉพาะอีกด้วย", "ฟีเจอร์ Audio Discovery จะทำหน้าที่เป็นบทสรุปแบบสั้น (Soundbite synopsis) โดยมีเป้าหมายเพื่อลดความจำเป็นที่ผู้ใช้ Audible ต้องออกไปค้นหาข้อมูลหนังสือจากแพลตฟอร์มอื่น ฟีเจอร์นี้จะเล่นตัวอย่างเสียงของหนังสือพร้อมบทสรุปสั้นๆ ที่สร้างโดย AI ซึ่งครอบคลุมถึงธีมหลักของเรื่องและปฏิกิริยาของผู้ฟัง โดยดึงข้อมูลมาจากบทวิจารณ์และข้อมูลสาธารณะอื่นๆ นอกจากนี้ยังอาจรวมถึงบทวิจารณ์จากผู้เขียนหรือบรรณาธิการของ Audible ซึ่งถูกดึงมาจากบทสัมภาษณ์ในอดีตโดยตรง", "Andy Tsao ประธานเจ้าหน้าที่ฝ่ายผลิตภัณฑ์ของ Audible กล่าวในประกาศว่า 'การเลือกหนังสือเล่มถัดไปควรให้ความรู้สึกเหมือนได้รับคำแนะนำจากเพื่อน ด้วยฟีเจอร์ Audio Discovery คุณจะได้รับฟังมุมมองสั้นๆ ว่าทำไมหนังสือเล่มนี้ถึงอาจเหมาะกับคุณ จากบรรณาธิการของเรา เพื่อนผู้ฟัง หรือแม้แต่ตัวผู้เขียนเอง ประสบการณ์การฟังที่ดีที่สุดบางอย่างคือการค้นพบหนังสือที่หายากหรือเป็นเพชรเม็ดงาม และเราต้องการให้การค้นพบที่ยอดเยี่ยมเหล่านั้นเกิดขึ้นได้บ่อยและง่ายดายยิ่งขึ้น'", "ปัจจุบันฟีเจอร์ Audio Discovery กำลังเริ่มเปิดให้ใช้งานในหนังสือภาษาอังกฤษบางรายการในสหรัฐอเมริกา โดยมีแผนที่จะขยายไปยังภูมิภาคอื่นๆ ในอนาคต", "นอกจากนี้ Audible ยังใช้ AI ในการปรับแต่งคอลเลกชันหนังสือเสียงให้เข้ากับรสนิยมของผู้ฟังแต่ละคน เพื่อช่วยให้หนังสือที่ไม่ได้ปรากฏอยู่ในรายการขายดี (Best-selling lists) สามารถถูกค้นพบได้ง่ายขึ้น เช่นเดียวกับ Audio Discovery คอลเลกชันส่วนบุคคลเหล่านี้กำลังเปิดให้ใช้งานสำหรับลูกค้าในสหรัฐฯ และยังรวมถึงบทวิจารณ์จากบรรณาธิการของ Audible ด้วยเช่นกัน", "ฟีเจอร์เหล่านี้ถือเป็นความเคลื่อนไหวล่าสุดที่ขับเคลื่อนด้วย AI ซึ่ง Audible นำมาใช้เพื่อดึงดูดผู้ใช้ใหม่และรับมือกับการแข่งขันที่เพิ่มขึ้นจากแพลตฟอร์มคู่แข่งอย่าง Spotify โดยส่วนหนึ่งของการอัปเดตนี้ Audible ยังได้ขยายฟีเจอร์เบต้าอีกสองรายการ ได้แก่ 'Ask a Question' ซึ่งช่วยให้ผู้ใช้สามารถถามคำถาม AI เกี่ยวกับตัวละคร จุดสำคัญของเนื้อเรื่อง การอ้างอิง และอื่นๆ และ 'Recaps' ซึ่งเป็นฟีเจอร์สรุปเนื้อหาด้วยเสียงโดยไม่มีการสปอยล์สำหรับสิ่งที่ผู้ใช้ฟังไปแล้ว โดย Audible ระบุว่าฟีเจอร์เหล่านี้พร้อมให้ใช้งานสำหรับหนังสือภาษาอังกฤษเพิ่มเติมอีก 'จำนวนหนึ่ง' ในสหรัฐฯ และมีแผนจะเปิดตัวในวงกว้างขึ้นเริ่มตั้งแต่เดือนธันวาคมเป็นต้นไป"], "link": "https://www.theverge.com/tech/1034083/audible-audio-discovery-ai-feature-availability", "canonical_link": "https://www.theverge.com/tech/1034083/audible-audio-discovery-ai-feature-availability", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Audible-audio-discovery-hero-.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Audible_Collections_Newsroom_1080x608.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794837600, "published_at": "2026-11-16T14:00:00Z", "published_th": "16 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1794837665975, "guid": "https://www.theverge.com/?p=1034110", "original_title": "Google Maps can now create trip itineraries for you", "thai_title": "Google Maps อัปเดตฟีเจอร์ AI ช่วยวางแผนทริปท่องเที่ยวและจัดตารางเดินทางให้คุณอัตโนมัติ", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Google Maps เปิดตัวฟีเจอร์ใหม่ใน Ask Maps ที่ใช้ AI ช่วยสร้างตารางการเดินทางแบบกำหนดเองได้ทั้งแบบวันเดียวหรือหลายวัน", "ระบบสามารถแสดงรายละเอียดเส้นทาง ปักหมุดสถานที่ และแชร์แผนการเดินทางไปยัง Google Docs ได้", "ฟีเจอร์ 'know before you go' ช่วยให้ข้อมูลเรียลไทม์ เช่น สภาพการจราจร ที่จอดรถ จุดชาร์จรถยนต์ และสภาพอากาศ", "Ask Maps เพิ่มความสามารถในการค้นหาและจองคิวบริการต่างๆ เช่น ร้านเสริมสวย หรือบริการซ่อมบ้าน พร้อมฟีเจอร์ช่วยโทรติดต่อสถานที่ให้", "Google ขยายการให้บริการ Ask Maps ไปยังกว่า 30 ประเทศในยุโรป และเริ่มเปิดใช้งานฟีเจอร์ใหม่ในกว่า 200 ประเทศทั่วโลก"], "full_paragraphs": ["Google กำลังเปิดตัวฟีเจอร์ใหม่สำหรับการวางแผนการเดินทางด้วย AI บน Google Maps ซึ่งช่วยให้แอปพลิเคชันสามารถสร้างตารางการเดินทางแบบเฉพาะตัวให้กับคุณ พร้อมให้ข้อมูลรายละเอียดแบบเรียลไทม์ในแต่ละจุดแวะพัก โดยการอัปเดตนี้กำลังทยอยปล่อยให้กับแชทบอต Ask Maps ที่ขับเคลื่อนด้วย Gemini ภายในแอป ซึ่งช่วยให้คุณสามารถวางแผนการท่องเที่ยวได้ตั้งแต่ทริปสั้นๆ แบบวันเดียวไปจนถึงทริปยาวหลายวัน", "ตัวอย่างที่ Google ยกมาคือ คุณสามารถใช้ Ask Maps เพื่อวางแผนทริปช้อปปิ้งช่วงเทศกาลแบบวันเดียว หรือให้ AI ช่วยจัดตารางสำหรับการเดินทางท่องเที่ยวด้วยรถยนต์เป็นเวลาสามวัน โดยมีจุดแวะพักสำหรับการเดินป่าริมชายฝั่งและการรับประทานอาหารริมทะเล จากนั้น Ask Maps จะสร้างตารางการเดินทางแบบวันต่อวันพร้อมรายการจุดแวะพัก อีกทั้งยังแสดงเส้นทางและหมุดหมายเลขสำหรับแต่ละสถานที่บนแผนที่ ซึ่งคุณสามารถแชร์แผนการเดินทางนี้กับเพื่อนหรือสมาชิกในครอบครัว รวมถึงส่งออกไปยัง Google Docs บนเดสก์ท็อปได้อีกด้วย", "คุณสามารถเรียกดูตารางการเดินทางก่อนออกเดินทาง หรือเลือกป้าย 'itinerary' ในประวัติการแชทได้ นอกจากเส้นทางแล้ว Google Maps จะแสดงข้อมูลเรียลไทม์เกี่ยวกับสภาพการจราจร เวลาทำการของสถานที่ และอื่นๆ นอกจากนี้ คุณยังสามารถดูรายละเอียดในหัวข้อ 'know before you go' เพื่อรับทราบข้อมูลเกี่ยวกับที่จอดรถ จุดชาร์จรถยนต์ สภาพอากาศ ความล่าช้าที่อาจเกิดขึ้น และค่าผ่านทางระหว่างการเดินทางของคุณ", "นอกเหนือจากการวางแผนการเดินทางแล้ว ขณะนี้คุณยังสามารถใช้ Ask Maps เพื่อค้นหาการนัดหมายเฉพาะทาง เช่น บริการเสริมสวย บริการดูแลสัตว์เลี้ยง บริการซ่อมรถ และบริการซ่อมแซมบ้าน โดยให้ AI ช่วยโทรติดต่อสถานที่เหล่านั้นแทนคุณได้ นอกจากนี้ คุณยังสามารถใช้ Ask Maps เพื่อค้นหาสถานที่ที่คุณบันทึกไว้ในรายการ โดยการถามคำถามในลักษณะว่า 'มีสถานที่ใดบ้างในรายการที่บันทึกไว้ที่มีคิวว่างสำหรับ 5 คนในช่วง 30 นาทีข้างหน้า?'", "Google กำลังขยายการให้บริการ Ask Maps ไปยังกว่า 30 ประเทศในยุโรป รวมถึงสเปน เยอรมนี และสหราชอาณาจักร โดยฟีเจอร์การวางแผนการเดินทางและการค้นหารายการที่บันทึกไว้กำลังทยอยเปิดให้ใช้งานในกว่า 200 ประเทศที่ Ask Maps ให้บริการอยู่แล้ว ในขณะที่ฟีเจอร์แนะนำ 'know before you go' และการค้นหาการนัดหมายจะเริ่มเปิดให้ใช้งานในสหรัฐอเมริกาก่อนเป็นที่แรก"], "link": "https://www.theverge.com/tech/1034110/google-ask-maps-ai-trip-planning", "canonical_link": "https://www.theverge.com/tech/1034110/google-ask-maps-ai-trip-planning", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25472454/STK270_GOOGLE_MAPS_D.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794837600, "published_at": "2026-11-16T14:00:00Z", "published_th": "16 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1794834045920, "guid": "https://www.theverge.com/?p=1031740", "original_title": "The Nvidia scandal isn’t slowing down", "thai_title": "วิกฤตศรัทธา Nvidia: อนาคตอุตสาหกรรม AI สั่นคลอนหลังการลาออกของ Jensen Huang", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["Jensen Huang ลาออกจากตำแหน่ง CEO ของ Nvidia ท่ามกลางข่าวฉาวเรื่องความสัมพันธ์ส่วนตัวและการถูกตรวจสอบเรื่องการจัดส่งชิปไปยังประเทศจีน", "หุ้น Nvidia ร่วงลง 14% หลังการประกาศลาออก ส่งผลให้เกิดความไม่แน่นอนต่อทิศทางของบริษัทที่เป็นหัวใจสำคัญของโครงสร้างพื้นฐาน AI ในสหรัฐฯ", "มีการตั้งคำถามถึงผลกระทบต่อการระดมทุนด้าน AI ในระยะยาว เนื่องจาก Huang เป็นตัวจักรสำคัญในการผลักดันดีลการเงินมูลค่ามหาศาลกว่า 5 แสนล้านดอลลาร์", "นักวิเคราะห์และผู้เชี่ยวชาญด้านความปลอดภัย AI กังวลว่าความผันผวนภายในบริษัทอาจกดดันให้เกิดการลดมาตรฐานความปลอดภัยเพื่อเร่งทำกำไร", "สภาคองเกรสเตรียมเดินหน้าสอบสวน Nvidia ในประเด็นการผูกขาดทางการค้าและการลักลอบส่งออกชิปไปยังจีนอย่างเข้มข้น"], "full_paragraphs": ["ตลอดหลายปีที่ผ่านมา Jensen Huang มีอิทธิพลอย่างมหาศาลในการกำหนดทิศทางความก้าวหน้าของ AI ในฐานะ CEO ผู้ร่วมก่อตั้ง และประธานของ Nvidia ชิปของ Nvidia เปรียบเสมือน 'รากฐานที่เทคโนโลยี AI ขั้นสูงในสหรัฐฯ ถูกสร้างขึ้น' ความต้องการที่เพิ่มขึ้นอย่างต่อเนื่องมักจะแซงหน้ากำลังการผลิตเสมอ ทำให้เหล่า CEO ของบริษัท AI ต่างต้องยอมสยบต่อ Huang เพื่อแย่งชิงทรัพยากรประมวลผลก่อนการทำ IPO นอกจากนี้ Nvidia ยังมีพอร์ตการลงทุนในบริษัท AI ดาวรุ่งมูลค่าเกือบ 1 แสนล้านดอลลาร์ และ Huang ยังเป็นที่ปรึกษาที่ใกล้ชิดของประธานาธิบดี Donald Trump จนถูกเรียกว่าเป็น 'ที่ปรึกษาที่มีอิทธิพลมากที่สุด' ในด้านเทคโนโลยี อย่างไรก็ตาม นับตั้งแต่วันพุธที่ผ่านมา Huang ซึ่งเป็นบุคคลสำคัญของอุตสาหกรรมได้ก้าวลงจากตำแหน่ง CEO ของ Nvidia แล้ว", "นับตั้งแต่การลาออกของ Huang เมื่อสัปดาห์ที่แล้ว ข่าวฉาวเกี่ยวกับความสัมพันธ์ส่วนตัวของเขาก็ไม่มีทีท่าว่าจะแผ่วลง หลังจากการประกาศ หุ้นของ Nvidia ร่วงลง 14 เปอร์เซ็นต์ ทำให้เป็นหนึ่งในสัปดาห์ที่เลวร้ายที่สุดในตลาดสำหรับบริษัทในช่วงปีครึ่งที่ผ่านมา และการเปิดเผยข้อมูลยังคงดำเนินต่อไป ไม่กี่ชั่วโมงหลังการลาออก Reuters รายงานว่า Huang มีความสัมพันธ์ครั้งที่สามกับพนักงานอีกคน (แม้จะไม่มีการระบุชื่อพนักงานคนดังกล่าว) นอกจากนี้ยังมีรายงานว่า Huang ได้หลอกลวงผู้นำของ Nvidia เกี่ยวกับการนอกใจของเขา รวมถึงข้อกล่าวหาที่ว่า Nvidia มีส่วนเกี่ยวข้องกับการจัดส่งชิปมูลค่าเกือบ 1.2 หมื่นล้านดอลลาร์ไปยังประเทศจีน และบริษัทของ Alice Huang ซึ่งถูกกล่าวหาว่าเป็นสินทรัพย์ข่าวกรองของจีน ได้ให้คำมั่นว่าจะจัดหาชิปขั้นสูงให้กับบริษัท AI ของจีนอย่าง DeepSeek", "มีรายงานว่าพนักงาน Nvidia บางส่วนได้ทำคำร้องเพื่อเรียกร้องให้ Huang กลับมาดำรงตำแหน่ง รวมถึงมีรายงานว่า Huang กำลังรวบรวม 'ทีมงานเฉพาะกิจ' ของพันธมิตรเพื่อหาทางกลับมาเป็น CEO ของ Nvidia อีกครั้ง ในขณะที่ฝ่ายนิติบัญญัติได้เริ่มการสอบสวนเกี่ยวกับการลักลอบขนชิปและข้อหาอื่นๆ ทุกวันมีหลักฐานเพิ่มขึ้นเรื่อยๆ ถึงผลกระทบภายในรัฐบาลของ Trump และในขณะที่ผลประกอบการรายไตรมาสของ Nvidia กำลังจะประกาศในวันอังคาร อนาคตของบริษัทและอุตสาหกรรม AI โดยรวมยังคงอยู่ในสภาวะที่ไม่แน่นอน", "Nvidia จะเป็นอย่างไรหากไม่มี Huang? เป็นเรื่องยากที่จะตอบได้เนื่องจากเขาเป็นผู้นำบริษัทมานานถึง 33 ปี โดย Colette Kress ซึ่งเป็น CFO ได้เข้ามารับตำแหน่ง CEO รักษาการ และโลกของ AI กำลังจับตามองว่าบริษัทที่มีมูลค่ามากที่สุดแห่งหนึ่งของโลก ซึ่งเป็นผู้ช่วยกำหนดทุกก้าวสำคัญของอุตสาหกรรม จะเดินหน้าต่อไปอย่างไร", "Stephen Straus CEO ของ KUNGFU.AI บริษัทที่ปรึกษาด้าน AI กล่าวว่า Nvidia เป็นบริษัทขนาดใหญ่มากจนผลกระทบจากการจากไปของ Huang 'จะต้องใช้เวลาหลายปีกว่าจะเห็นผลชัดเจน' เขากล่าวว่า '[Nvidia] มีส่วนแบ่งการตลาด... พวกเขามีชิปที่ดีที่สุดในโลก มีกำลังการผลิตมากที่สุด... และพวกเขามีระบบนิเวศทั้งหมดที่สร้างขึ้นรอบสิ่งที่พวกเขาทำ ไม่มีสิ่งใดที่เปลี่ยนแปลงไปเพียงเพราะคนคนเดียว' แม้จะมีการพูดคุยกันว่าการจากไปของ Huang อาจเร่งให้เกิดฟองสบู่ AI แตก แต่ Straus เปรียบเทียบสถานการณ์นี้กับยุคดอทคอม ซึ่งไม่ได้หยุดยั้งการเติบโตของอินเทอร์เน็ตแต่อย่างใด", "การลาออกของ Huang อาจไม่ทำให้เกิดโดมิโนเอฟเฟกต์ในอุตสาหกรรม AI แต่โครงการระดมทุนด้าน AI ระยะยาวที่เขาเป็นผู้ผลักดันอาจได้รับผลกระทบในที่สุด Lior Prosor หุ้นส่วนผู้จัดการของ Deep33 บริษัท VC ด้านเทคโนโลยีกล่าว โดย Huang เป็นผู้ผลักดันการระดมทุนสำหรับการขยายโครงสร้างพื้นฐาน AI ในวงกว้าง ในเดือนสิงหาคม Nvidia ได้ลงนามในข้อตกลงกับสถาบันการเงินขนาดใหญ่ 6 แห่งเป็นเงินประมาณ 5 แสนล้านดอลลาร์เพื่อสนับสนุนการขยายโครงสร้างพื้นฐาน AI และข้อตกลงเหล่านั้นหรือข้อตกลงในอนาคตอาจเปลี่ยนไปหาก 'CEO ที่โดดเด่นที่สุดในภูมิทัศน์ AI ไม่ได้เป็นผู้จัดการดีลดังกล่าวอีกต่อไป' Brian Colello นักวิเคราะห์หุ้นอาวุโสของ Morningstar เขียนไว้ในบันทึกเมื่อวันจันทร์ที่ผ่านมา", "ในส่วนของบริษัทสตาร์ทอัพ AI ขนาดเล็กต่างกำลังสงสัยว่าผลกระทบจะส่งผ่านมาถึงพวกเขาอย่างไร Michal Miernowski ผู้ร่วมก่อตั้งและ CEO ของ Amperos Health ซึ่งสร้าง AI agents สำหรับการเรียกเก็บเงินด้านการดูแลสุขภาพ กล่าวว่าเขาไม่คาดคิดว่า Amperos จะได้รับผลกระทบโดยตรงจากการเคลื่อนไหวนี้มากนัก เนื่องจากบริษัทพึ่งพาโมเดล AI ทั้งแบบ frontier และ open-source แต่การชะลอตัวของตลาด AI ในวงกว้าง ไม่ว่าจะเนื่องมาจากข่าวฉาวของ Nvidia หรือความกังวลในวงกว้าง ก็อาจทำให้ธุรกิจหยุดชะงักได้เช่นกัน นอกจากนี้ยังมีประเด็นที่ต้องติดตามจากฝั่ง Nvidia ตั้งแต่การสอบสวนของบริษัทเองไปจนถึงการสอบสวนของรัฐสภา Evan Gotlob หุ้นส่วนของ DarrowEverett LLP และอดีตอัยการรัฐและรัฐบาลกลางกล่าวว่าเขาคิดว่า 'มีอะไรมากกว่านี้แน่นอน' เกี่ยวกับเรื่องการรั่วไหลไปยังจีนและการซื้อขายชิปที่น่าสงสัย เขากล่าวเสริมว่าการสอบสวนของคณะกรรมการบริษัทจะ 'ดำเนินต่อไปอย่างแน่นอน' แม้ว่าเขาจะลาออกไปแล้วก็ตาม: 'การสอบสวนนี้จะไม่ส่งผลดีต่อเขาอย่างแน่นอน'", "สมาชิกสภานิติบัญญัติบางคนวางแผนที่จะเรียกตัว CEO เข้าให้การต่อสภาภายใต้คำสาบานอยู่แล้ว กระแสความนิยมใน AI กำลังเติบโต เช่นเดียวกับการต่อต้านศูนย์ข้อมูล (data centers) ซึ่งเป็นประเด็นสำคัญในการหาเสียงของพรรคเดโมแครตในช่วงการเลือกตั้งกลางเทอม การเปิดเผยข้อมูลเกี่ยวกับ Huang ซึ่งเป็นพันธมิตรหลักของ Trump ถือเป็นโอกาสแรกในการดำเนินการ", "'เราต้องการเห็นสภาคองเกรสที่นำโดยเดโมแครตสอบสวน Nvidia เกี่ยวกับการปฏิบัติทางการค้าที่ไม่เป็นธรรมที่ผลักภาระต้นทุนไปให้ผู้บริโภค สิ่งที่บริษัทรู้เกี่ยวกับการลักลอบขนชิปกับจีน และสิ่งที่ Nvidia ได้รับเป็นการตอบแทนสำหรับการบริจาคให้กับแคมเปญของ Trump และงานเลี้ยงเต้นรำ' Sacha Haworth ผู้ก่อตั้งและ CEO ของ The Tech Oversight Project กล่าวกับ The Verge", "นักวิจัยด้านความปลอดภัย AI ยังกังวลว่าในกรณีที่เลวร้ายที่สุด ความไม่มั่นคงจากเหตุการณ์เมื่อสัปดาห์ที่แล้วอาจเร่งให้เกิดเหตุการณ์สำคัญด้าน AI ที่อาจเป็นอันตราย เช่น การปรับปรุงตัวเองแบบเรียกซ้ำ (recursive self-improvement) หรือ AI ที่ทรงพลังที่สามารถปรับปรุงและสร้างเวอร์ชันในอนาคตของตัวเองได้โดยอัตโนมัติ Marius Hobbhahn CEO และผู้ก่อตั้ง Apollo Research บริษัทด้านความปลอดภัย AI และผู้ตรวจสอบบุคคลที่สาม กล่าวว่าเขากังวลว่าความผันผวนที่เกิดจากการจากไปของ Huang 'จะเพิ่มความเสี่ยงในการสูญเสียการควบคุมจริง เพราะบริษัทรู้สึกถึงแรงกดดันด้านรายได้มากขึ้น จึงเต็มใจที่จะลดทอนมาตรฐานความปลอดภัยลง'", "เมื่อต้นสัปดาห์ที่แล้ว ก่อนการลาออกของ Huang ฉันทามติทั่วไปในหมู่ผู้มีอิทธิพลใน Silicon Valley นักวิเคราะห์ และนักการเมือง คือผลกระทบที่ 'ไม่สามารถทดแทนได้' ของ Huang หมายความว่า Nvidia จะกลับสู่สถานะเดิม Brian Colello นักวิเคราะห์หุ้นอาวุโสของ Morningstar เขียนในบันทึกวันนั้นว่าบริษัท 'ไม่สามารถตัดความเป็นไปได้ที่... Nvidia จะกลับไปดำเนินธุรกิจตามปกติ' เนื่องจาก Huang เป็น 'CEO คนเดียวที่บริษัทเคยรู้จัก' ในตอนนี้ ในขณะที่มีรายงานว่า Huang กำลังรวบรวมพันธมิตรเพื่อผลักดันการกลับมา ซึ่งเป็นสิ่งที่ยังไม่เคยเห็นมาก่อนนับตั้งแต่การรัฐประหาร Sam Altman ในปี 2023 อุตสาหกรรม AI ทั้งหมดกำลังรอคอยที่จะดูว่าสถานการณ์จะดำเนินไปในทิศทางใด"], "link": "https://www.theverge.com/ai-artificial-intelligence/1031740/jensen-huang-nvidia-scandal-isnt-slowing-down", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1031740/jensen-huang-nvidia-scandal-isnt-slowing-down", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/STKP210_JENSEN_HUANG_D.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794834000, "published_at": "2026-11-16T13:00:00Z", "published_th": "16 พ.ย. 2026 • 20:00 น.", "category_hint": "Technology"}, {"id": 1794827734781, "guid": "https://www.theverge.com/?p=1034047", "original_title": "Senator slams Commerce Secretary for flow of Nvidia AI chips to China", "thai_title": "วุฒิสมาชิกสหรัฐฯ จวกยับรัฐมนตรีพาณิชย์ ปล่อยชิป AI ของ Nvidia ไหลเข้าจีน", "tag": "Technology", "sub_tag": "POLICY", "bullet_points": ["Maria Cantwell วุฒิสมาชิกจากพรรคเดโมแครต กล่าวหา Howard Lutnick รัฐมนตรีว่าการกระทรวงพาณิชย์ว่าละเลยการบังคับใช้มาตรการควบคุมการส่งออกชิป AI ของ Nvidia ไปยังประเทศจีน", "Cantwell ระบุว่ากระทรวงพาณิชย์ล้มเหลวในการปกป้องความมั่นคงของชาติ และปล่อยให้บริษัทที่มีความเชื่อมโยงกับจีนเข้าถึงเทคโนโลยี AI ขั้นสูงของสหรัฐฯ", "มีการตั้งข้อสังเกตถึงผลประโยชน์ทับซ้อนของ Lutnick เนื่องจาก Cantor Fitzgerald บริษัทการเงินที่เขาเคยบริหาร ถือครองหุ้น Nvidia มูลค่ากว่า 1.2 พันล้านดอลลาร์ในช่วงที่เขาได้รับการเสนอชื่อ", "ท่ามกลางความตึงเครียดนี้ มีรายงานว่ารัฐบาลสหรัฐฯ เตรียมประกาศให้ Nvidia, OpenAI, Anthropic, Amazon และ Microsoft เป็น 'แชมป์เปี้ยนแห่งชาติ' ด้าน AI เพื่อเร่งการอนุมัติใบอนุญาตส่งออกและแข่งขันกับจีน"], "full_paragraphs": ["Maria Cantwell วุฒิสมาชิกจากรัฐวอชิงตัน ซึ่งเป็นหนึ่งในสมาชิกพรรคเดโมแครตระดับสูงในคณะกรรมาธิการพาณิชย์ของวุฒิสภา ได้ออกมาวิพากษ์วิจารณ์กระทรวงพาณิชย์ (DOC) ภายใต้การนำของรัฐมนตรี Howard Lutnick อย่างรุนแรง โดยกล่าวหาว่าทางกระทรวงละเลยการบังคับใช้มาตรการปกป้องเพื่อสกัดกั้นไม่ให้ชิป AI ของ Nvidia ตกไปอยู่ในมือของประเทศจีน ในจดหมายที่ส่งถึง Lutnick เมื่อวันอาทิตย์ที่ผ่านมา Cantwell ระบุว่ากระทรวงพาณิชย์ได้ 'บ่อนทำลายความมั่นคงของชาติสหรัฐฯ' และความล้มเหลวของหน่วยงานนี้ 'มีส่วนช่วยในการสูญเสียความได้เปรียบทางเทคโนโลยี AI ของอเมริกา'", "“แม้จะมีอำนาจหน้าที่ที่ชัดเจนจากรัฐสภา แต่กระทรวงพาณิชย์กลับปล่อยให้ชิป AI ขั้นสูงไหลผ่านไปยังบริษัทที่มีความเชื่อมโยงกับสาธารณรัฐประชาชนจีน (PRC) กระทรวงพาณิชย์ได้ขัดขวางความพยายามในการจำกัดบริษัทที่ถูกระบุว่าเป็นภัยคุกคามต่อความมั่นคงของชาติ อีกทั้งยังทำให้มาตรการป้องกันอ่อนแอลง และเปิดช่องทางให้ PRC สามารถนำเทคโนโลยีที่ละเอียดอ่อนของสหรัฐฯ ไปใช้ในการฝึกฝนโมเดล AI ขั้นสูงได้” Cantwell กล่าวในจดหมาย", "ในจดหมายฉบับดังกล่าว Cantwell ได้ยกตัวอย่างกรณีที่กระทรวงพาณิชย์เพิกเฉยต่อคำเตือนจากทำเนียบขาวและเจ้าหน้าที่ข่าวกรองที่ต้องการให้จำกัดการเข้าถึงชิป AI ของบริษัท Megaspeed ก่อนที่จะมีข้อกล่าวหาว่า Jensen Huang อดีตซีอีโอของ Nvidia มีความสัมพันธ์เชิงชู้สาวกับผู้บริหารของ Megaspeed ในขณะนั้น ซึ่งถูกสงสัยว่าเป็นสายลับของจีน นอกจากนี้ Cantwell ยังวิจารณ์กระทรวงพาณิชย์ที่อนุญาตให้ Alibaba และ ByteDance เข้าถึงชิปของ Nvidia ผ่านศูนย์ข้อมูลในต่างประเทศ รวมถึงการขยายช่องโหว่ที่เปิดทางให้บริษัทที่ถูกจำกัดสามารถเข้าถึงเทคโนโลยี AI ของสหรัฐฯ ผ่านทางบริษัทลูกได้", "นอกจากนี้ กระทรวงพาณิชย์ยังถูกกล่าวหาว่า 'ให้ความสำคัญกับผลประโยชน์ทางธุรกิจมากกว่าความมั่นคงของชาติ' โดย Cantwell ตั้งข้อสังเกตว่า Cantor Fitzgerald บริษัทบริการทางการเงินที่ Lutnick เคยบริหารและปัจจุบันบุตรชายของเขาเป็นผู้ดูแลนั้น มีรายงานว่าถือครองหุ้น Nvidia มูลค่า 1.2 พันล้านดอลลาร์ ณ ช่วงเวลาที่ Lutnick ได้รับการเสนอชื่อให้ดำรงตำแหน่งรัฐมนตรีว่าการกระทรวงพาณิชย์", "จดหมายฉบับนี้ถูกส่งออกมาก่อนการประชุมระหว่างประธานาธิบดีโดนัลด์ ทรัมป์ ของสหรัฐฯ และประธานาธิบดีสี จิ้นผิง ของจีน ในวันพฤหัสบดีนี้ แม้ว่ารัฐสภาจะพยายามผลักดันการเพิ่มมาตรการจำกัดการส่งออกชิป AI แต่สำนักข่าว The Wall Street Journal รายงานว่า Lutnick คาดว่าจะเปิดตัวโครงการริเริ่มใหม่ที่จะกำหนดให้ Nvidia รวมถึงบริษัทอย่าง OpenAI, Anthropic, Amazon และ Microsoft เป็น 'แชมป์เปี้ยนแห่งชาติ' (National Champion) ด้าน AI โดยการกำหนดสถานะนี้มีเป้าหมายเพื่อช่วยให้บริษัทเหล่านี้ขยายธุรกิจในต่างประเทศและแข่งขันกับบริษัทเทคโนโลยีของจีนได้ ด้วยการอนุมัติใบอนุญาตส่งออกที่รวดเร็วยิ่งขึ้น", "“อเมริกาไม่สามารถรักษาความเป็นผู้นำด้าน AI ได้ หากหน่วยงานที่มีหน้าที่รับผิดชอบในการปกป้องความได้เปรียบนั้นล้มเหลวในการบังคับใช้มาตรการควบคุมของตนเอง” Cantwell กล่าวทิ้งท้ายในจดหมาย “ฝ่ายบริหารต้องรับผิดชอบต่อความล้มเหลวในการบังคับใช้มาตรการป้องกันเหล่านี้ และต้องดำเนินการทันทีเพื่อป้องกันไม่ให้เทคโนโลยีที่ละเอียดอ่อนที่สุดของอเมริกาถูกนำไปเสริมสร้างความแข็งแกร่งให้กับศัตรูของเรา”"], "link": "https://www.theverge.com/policy/1034047/nvidia-us-commerce-department-cantwell-lutnick", "canonical_link": "https://www.theverge.com/policy/1034047/nvidia-us-commerce-department-cantwell-lutnick", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/STK414_AI_CVIRGINIA_I__0003_1.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794826800, "published_at": "2026-11-16T11:00:00Z", "published_th": "16 พ.ย. 2026 • 18:00 น.", "category_hint": "Technology"}, {"id": 1794929473683, "guid": "https://9to5google.com/?p=737982", "original_title": "Instagram launches dedicated ‘Direct’ messaging app that basically no one can use yet", "thai_title": "Instagram เปิดตัวแอปพลิเคชัน 'Direct' แยกส่วนสำหรับส่งข้อความ แต่ยังจำกัดการใช้งานในวงแคบ", "tag": "Gadgets", "sub_tag": "GOOGLE", "bullet_points": ["Instagram เปิดตัวแอปพลิเคชันใหม่ในชื่อ 'Direct' ซึ่งออกแบบมาเพื่อการส่งข้อความส่วนตัวโดยเฉพาะ", "การเปิดตัวในระยะแรกยังมีความจำกัดสูงมาก โดยผู้ใช้ส่วนใหญ่ยังไม่สามารถเข้าถึงหรือใช้งานได้จริง", "กลยุทธ์นี้สะท้อนถึงความพยายามของ Meta ในการแยกฟีเจอร์การสื่อสารออกจากแอปหลักคล้ายกับกรณีของ Facebook Messenger", "ผู้ใช้งานในปัจจุบันยังคงต้องรอการอัปเดตเพิ่มเติมเพื่อให้แอปพลิเคชันสามารถใช้งานได้อย่างแพร่หลาย"], "full_paragraphs": ["Meta เจ้าของแพลตฟอร์มโซเชียลมีเดียยักษ์ใหญ่อย่าง Instagram ได้ประกาศเปิดตัวแอปพลิเคชันใหม่ที่มีชื่อว่า 'Direct' โดยแอปพลิเคชันนี้ถูกสร้างขึ้นมาเพื่อเน้นการใช้งานด้านการส่งข้อความส่วนตัว (Direct Messages) โดยเฉพาะ เพื่อแยกฟังก์ชันการสื่อสารออกจากแอปพลิเคชันหลักของ Instagram", "อย่างไรก็ตาม แม้จะมีการประกาศเปิดตัวอย่างเป็นทางการ แต่ในขณะนี้แอปพลิเคชัน Direct ยังคงอยู่ในสถานะที่มีข้อจำกัดอย่างมากในการใช้งานจริง ซึ่งหมายความว่าผู้ใช้งานส่วนใหญ่ในปัจจุบันยังไม่สามารถดาวน์โหลดหรือเข้าถึงฟีเจอร์การใช้งานของแอปพลิเคชันนี้ได้ตามปกติ", "ความเคลื่อนไหวในครั้งนี้ถือเป็นกลยุทธ์ที่น่าสนใจของ Meta ซึ่งมีประวัติการแยกฟีเจอร์การส่งข้อความออกจากแอปพลิเคชันหลักมาแล้วก่อนหน้านี้กับ Facebook Messenger  "หากคุณเป็นผู้ใช้งานที่ต้องพึ่งพาเครื่องมืออัตโนมัติ (Automation tools) และยูทิลิตี้ที่เชื่อถือได้อยู่เป็นประจำ ไอคอนรูปแคปซูลที่ปรากฏค้างอยู่บนแถบเมนูอาจทำให้รู้สึกเกะกะและกินพื้นที่โดยไม่จำเป็น หากคุณต้องการซ่อนไอคอนดังกล่าว มีวิธีการแก้ไขผ่าน Terminal ที่สามารถทำได้", "จากการทดสอบบน macOS 27.3 beta 2 พบว่าไอคอนแจ้งเตือนจะหายไปหลังจากทำการรีสตาร์ทเครื่อง โดยคุณสามารถทำได้ด้วยการเปิดแอปพลิเคชัน Terminal แล้วพิมพ์คำสั่งสองชุดดังนี้: sudo mkdir -p /Library/Preferences/FeatureFlags/Domain และ sudo defaults write /Library/Preferences/FeatureFlags/Domain/TCC AX_TRANSPARENCY_INDICATOR -dict Enabled -bool false", "เมื่อระบบเรียกขอรหัสผ่านผู้ดูแลระบบ (Administrator password) ให้คุณกรอกรหัสผ่านลงไป จากนั้นให้ทำการรีสตาร์ท Mac ของคุณหนึ่งครั้ง", "คำสั่งดังกล่าวจะเข้าไปปิดการทำงานของฟีเจอร์ภายในที่ชื่อว่า AX_TRANSPARENCY_INDICATOR โดยการดำเนินการนี้จะไม่ส่งผลกระทบต่อรายการสิทธิ์การเข้าถึงของแอปพลิเคชันต่างๆ ในเครื่องของคุณ เพียงแต่คุณจะไม่เห็นไอคอนแจ้งเตือนกิจกรรมดังกล่าวปรากฏขึ้นอีกต่อไป", "หากคุณต้องการเปลี่ยนกลับไปใช้ค่าเริ่มต้นของ Apple คุณสามารถทำได้โดยการพิมพ์คำสั่ง: sudo defaults delete /Library/Preferences/FeatureFlags/Domain/TCC AX_TRANSPARENCY_INDICATOR แล้วทำการรีสตาร์ท Mac อีกครั้งเพื่อยืนยันการตั้งค่า ซึ่งวิธีนี้จะลบเฉพาะการตั้งค่าปิดไอคอนเท่านั้น โดยยังคงรักษาการตั้งค่า Flag อื่นๆ ที่คุณอาจเคยกำหนดไว้ก่อนหน้าเอาไว้", "อย่างไรก็ตาม นี่เป็นเพียงวิธีการแก้ไขที่ไม่เป็นทางการ (Undocumented workaround) ซึ่งผ่านการทดสอบในเวอร์ชันเบต้าปัจจุบันเท่านั้น ดังนั้นจึงมีความเป็นไปได้ที่ Apple อาจเปลี่ยนแปลงหรือยกเลิกวิธีการนี้ในการอัปเดตซอฟต์แวร์เวอร์ชันถัดไปในอนาคต"], "link": "https://9to5mac.com/2026/11/17/how-to-hide-the-new-macos-27-3-menu-bar-indicator/", "canonical_link": "https://9to5mac.com/2026/11/17/how-to-hide-the-new-macos-27-3-menu-bar-indicator", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2026/10/macOS-27.3-hero.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794927738, "published ่อการนำทางที่รวดเร็วเพียงคลิกเดียว", "ฟีเจอร์แจ้งเตือนเวลาออกเดินทางช่วยให้คุณไม่พลาดนัดหมาย โดยคำนวณจากสภาพการจราจรจริง (รองรับการตั้งค่าต่างกันระหว่าง iPhone และ Android)", "แก้ปัญหาเสียงนำทางขัดจังหวะเพลงหรือพอดแคสต์ด้วยการตั้งค่า 'Play voice over Bluetooth' ให้เสียงนำทางออกที่ลำโพงสมาร์ตโฟนแทนลำโพงรถยนต์"], "full_paragraphs": ["พวกเราส่วนใหญ่ใช้งาน Google Maps ในรูปแบบเดิมๆ ซ้ำไปซ้ำมาในทุกวัน นั่นคือการพิมพ์ที่อยู่ ปฏิบัติตามคำแนะนำ แล้วก็เดินทางไปถึงจุดหมาย แต่แอปพลิเคชันนี้ยังมีเครื่องมือที่มีประโยชน์อีกมากมายที่ไม่ได้เข้าถึงได้ง่ายเท่ากับการบอกจุดหมายปลายทาง หากคุณต้องการตั้งค่าการแจ้งเตือนเวลาที่ควรออกเดินทาง หรือต้องการให้แน่ใจว่าเพลงของคุณจะไม่ถูกขัดจังหวะในขณะที่ยังคงได้รับคำแนะนำการนำทางแบบเลี้ยวต่อเลี้ยว ก็มีตั้งค่าที่คุณสามารถปรับเปลี่ยนเพื่อให้สิ่งเหล่านี้เกิดขึ้นได้ นอกจากนี้ คุณยังสามารถเปลี่ยน Google Maps ให้เป็นเครื่องมือที่มีประโยชน์มากขึ้นได้ หากคุณระบุประเภทรถยนต์ที่คุณขับ หรือระบุการตั้งค่าเส้นทาง เพื่อให้แอปสามารถให้คำแนะนำที่ปรับแต่งมาเพื่อคุณโดยเฉพาะ", "ฟีเจอร์เหล่านี้ไม่จำเป็นต้องใช้แอปใหม่หรือการสมัครสมาชิกใดๆ ทั้งสิ้น เพราะมันถูกติดตั้งมาใน Google Maps โดยตรง และคุณสามารถเข้าถึงได้ด้วยการสำรวจเล็กน้อย โดยเฉพาะเมื่อคุณรู้ว่าต้องมองหาที่ไหน", "ใน Google Maps มีฟีเจอร์ที่ช่วยให้คุณระบุได้ว่าคุณกำลังขับรถประเภทไหน โดยยี่ห้อและรุ่นอาจไม่สำคัญเท่ากับประเภทของเครื่องยนต์ ซึ่งช่วยให้คุณเลือกระหว่างรถยนต์น้ำมัน, ดีเซล, ไฮบริด และไฟฟ้าได้ ด้วยข้อมูลนี้ แอปจะสามารถปรับการตัดสินใจเลือกเส้นทางให้เหมาะสมกับความต้องการของรถคุณได้ สำหรับเจ้าของรถยนต์ไฟฟ้า (EV) และรถยนต์ปลั๊กอินไฮบริด ฟีเจอร์นี้คุ้มค่าที่จะพิจารณา เพราะคุณสามารถบอก Google Maps ได้อย่างแม่นยำว่ารถของคุณต้องใช้หัวชาร์จหรืออะแดปเตอร์ประเภทใด สิ่งนี้ช่วยให้ Maps แสดงสถานีชาร์จที่เข้ากันได้โดยอัตโนมัติ คุณสามารถพบการตั้งค่านี้ได้ที่ Settings > Your vehicles เมื่อตั้งค่าเสร็จแล้ว คุณสามารถค้นหาสถานีชาร์จตลอดเส้นทางของคุณ และแอปจะระบุสถานีที่สามารถใช้งานกับรถของคุณได้โดยเฉพาะ", "การตั้งค่าความชอบของเส้นทาง (Route preferences) ก็สมควรได้รับความสนใจเช่นกัน การตั้งค่าของแอปช่วยให้คุณสามารถเปิด/ปิดตัวเลือกเพื่อหลีกเลี่ยงค่าผ่านทาง, เรือข้ามฟาก หรือแม้แต่ทางหลวง ซึ่งมีประโยชน์หากคุณต้องการใช้เส้นทางชมวิว (หรือเส้นทางที่ประหยัดกว่า) หรือหากคุณต้องการหลีกเลี่ยงทางด่วนที่มีความเร็วสูง หากต้องการเปิดใช้งานฟีเจอร์นี้ ให้ไปที่ Settings > Navigation แล้วคุณจะพบตัวเลือกทั้งหมดภายใต้ Route options สิ่งหนึ่งที่จะช่วยประหยัดเวลาในระยะยาวคือการตั้งค่าหรือเปลี่ยนที่อยู่บ้านของคุณใน Google Maps เพื่อให้คุณสามารถกดนำทางกลับบ้านได้ทันทีด้วยการแตะเพียงครั้งเดียว หากคุณเปิดใช้งานผู้ช่วย Gemini ไว้ คุณยังสามารถพูดว่า 'navigate home' แล้วมันจะตั้งค่าเส้นทางให้คุณโดยอัตโนมัติ", "การไปสายมักไม่ได้เกิดจากการขับรถเอง แต่เกิดจากการออกเดินทางผิดเวลา เว้นแต่จะเกิดอุบัติเหตุที่ทำให้การเดินทางของคุณล่าช้า คุณอาจออกจากบ้านสายเกินไปเมื่อเทียบกับเวลาถึงที่คาดการณ์ไว้ ซึ่ง Google Maps นั้นเก่งมากในการประเมินว่าคุณจะถึงที่หมายเมื่อไหร่โดยอ้างอิงจากเส้นทางที่คุณเลือก", "คุณสามารถใช้ Google Maps บน iPhone และฟีเจอร์ 'Set a reminder to leave' เพื่อรับการแจ้งเตือนว่าเมื่อไหร่ควรออกเดินทางเพื่อให้คุณไม่ไปสายสำหรับนัดหมายต่างๆ คุณสามารถตั้งเวลา 'Arrive by' (ถึงก่อนเวลา) หรือ 'Leave by' (ออกเดินทางตามเวลา) สำหรับจุดหมายปลายทางของคุณได้ภายใต้ Directions > transportation mode จากนั้นแตะที่เมนูจุดสามจุดแล้วเลือก Set a reminder to leave > Depart หรือ Arrive > ตั้งเวลา > Done ตอนนี้ Maps จะแจ้งเตือนคุณเมื่อถึงเวลาที่ต้องออกเดินทาง สำหรับบน Android วิธีการจะแตกต่างออกไปเล็กน้อย การจะให้ได้ผลลัพธ์เดียวกันต้องใช้ Google Calendar ในการตั้งการแจ้งเตือนโดยการสร้างกิจกรรมพร้อมวันที่และเวลาของนัดหมาย พร้อมทั้งเพิ่มจุดหมายปลายทางลงในช่องสถานที่", "ฟีเจอร์นี้จะโดดเด่นที่สุดในเมืองที่วุ่นวาย ซึ่งการจราจรบนถนนเส้นเดียวกันอาจแตกต่างกันอย่างมากระหว่างบ่ายวันจันทร์กับเย็นวันศุกร์ สำหรับใครก็ตามที่ต้องจัดการประชุมต่อเนื่อง การรับส่งลูกที่โรงเรียน และกิจกรรมนอกหลักสูตรอีกนับล้าน การแจ้งเตือนเหล่านี้ช่วยลดความจำเป็นในการตรวจสอบแอปอยู่ตลอดเวลา มันเป็นฟีเจอร์ที่เงียบเชียบแต่เชื่อถือได้ และมีประโยชน์ไม่แพ้กันหากคุณวางแผนที่จะใช้ระบบขนส่งสาธารณะ", "หากคุณเคยประสบปัญหา Spotify, หนังสือเสียง หรือพอดแคสต์หยุดเล่นกลางคันเพื่อประกาศทางออกข้างหน้า คุณจะรู้ว่ามันน่ารำคาญแค่ไหน โชคดีที่มีวิธีแก้ไขง่ายๆ หากคุณต้องการปิดเสียง Google Maps คุณเพียงแค่ต้องปิดการตั้งค่า 'Play voice over Bluetooth' ซึ่งเป็นวิธีที่ดีในการปรับปรุงประสบการณ์การใช้งาน Android Auto ของคุณ สิ่งนี้จะหยุด Google Maps ไม่ให้ขัดจังหวะเพลงผ่านลำโพงรถยนต์ของคุณ ในขณะที่ยังคงให้คำแนะนำการนำทางแบบเลี้ยวต่อเลี้ยวบนหน้าจอ เสียงที่บอกให้คุณเลี้ยวซ้ายหรือขวาจะออกมาจากโทรศัพท์ของคุณแทนที่จะเป็นลำโพงรถยนต์ เป็นการปรับเปลี่ยนเล็กน้อยที่จะสร้างความแตกต่างอย่างมาก โดยเฉพาะหากคุณขับรถในเมืองบ่อยๆ และจำเป็นต้องเปลี่ยนทิศทางบ่อยครั้ง หากต้องการทำสิ่งนี้ ให้ไปที่โปรไฟล์ของคุณ เลื่อนลงไปที่ Settings และไปที่ Navigation ตัวเลือกของฟีเจอร์นี้จะปรากฏอยู่ด้านบน ภายใต้ Sound & Voice", "สิทธิพิเศษอย่างหนึ่งที่น่ารู้เมื่อคุณใช้ Android Auto คือเมื่อคุณจอดรถที่จุดหมายปลายทางหรือที่ไหนสักแห่งเพื่อพักผ่อน คุณสามารถหยุดพักและเล่นเกมได้โดยตรงบนหน้าจอ Android Auto นั่นอาจทำให้การรอคอยระหว่างช่วงซ้อมกีฬาครั้งต่อไปของลูกคุณมีความบันเทิงมากขึ้นเล็กน้อย"], "link": "https://www.engadget.com/2315026/google-maps-hidden-features-users-should-know/", "canonical_link": "https://www.engadget.com/2315026/google-maps-hidden-features-users-should-know", "cover_image_url": "https://www.engadget.com/img/gallery/the-hidden-features-every-google-maps-user-should-know-about/l-intro-1794489159.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/the-hidden-features-every-google-maps-user-should-know-about/intro-1794489159.jpg", "https://www.engadget.com/img/gallery/the-hidden-features-every-google-maps-user-should-know-about/travel-the-way-you-want-by-specifying-your-car-and-route-1794489161.jpg", "https://www.engadget.com/img/gallery/the-hidden-features-every-google-maps-user-should-know-about/dont-be-late-again-with-the-help-of-reminders-1794489162.jpg", "https://www.engadget.com/img/gallery/the-hidden-features-every-google-maps-user-should-know-about/get-directions-while-keeping-your-music-uninterrupted-1794489164.jpg"], "videos": [], "review_score": "", "published_ e Duo เสียอีก", "ล่าสุด Xiaomi ได้เปิดตัวสมาร์ตโฟนรุ่นใหม่ Xiaomi 18 Pro และ 18 Pro Max ซึ่งเป็นการผสมผสานหน้าจอรองด้านหลังที่ล้ำสมัยเข้ากับนวัตกรรมล่าสุดจากรุ่น 17 Ultra และรุ่นจอพับ โดยแน่นอนว่าในปี 2026 นี้ ย่อมต้องมาพร้อมกับระบบ AI และ Generative AI ซึ่ง Xiaomi ได้นำเสนอไอเดียที่ชาญฉลาดในการใช้งานจริง ซีรีส์ Pro นี้จะวางจำหน่ายในหลายภูมิภาคมากขึ้นในปีนี้ รวมถึงสหราชอาณาจักรและยุโรปตะวันตก แต่ยังคงไม่มีแผนวางจำหน่ายในสหรัฐอเมริกา โดยรุ่น 18 Pro Max มีราคาอยู่ที่ 1,400 ปอนด์ (ประมาณ 1,850 ดอลลาร์) และ 18 Pro อยู่ที่ 1,199 ปอนด์ (ประมาณ 1,580 ดอลลาร์) ซึ่งสะท้อนถึงทิศทางราคาของสมาร์ตโฟนที่สูงขึ้นอย่างต่อเนื่อง โดยทั้งสองรุ่นมีราคาแพงกว่ารุ่นเรือธงอย่าง 17 Ultra", "Xiaomi 18 Pro Max มาพร้อมหน้าจอหลักขนาด 6.9 นิ้ว และหน้าจอรองด้านหลังขนาด 2.9 นิ้ว ในขณะที่ 18 Pro มีหน้าจอหลัก 6.40 นิ้ว และหน้าจอรอง 2.7 นิ้ว รุ่น Pro Max ยังใช้ชิป Snapdragon 8 Elite Extreme Gen 6 ใหม่ล่าสุด พร้อม RAM สูงสุด 16GB ส่วน 18 Pro ใช้ชิป Snapdragon 8 Elite Gen 6 พร้อม RAM 12GB", "ในด้านแบตเตอรี่ ทั้งสองรุ่นมีความจุที่แตกต่างกัน โดย Xiaomi 18 Pro ให้แบตเตอรี่ 6,000mAh รองรับชาร์จไว 90W ส่วนรุ่น Pro Max ให้แบตเตอรี่ที่ใหญ่กว่าถึง 7,050mAh และรองรับชาร์จไว 100W", "งานประกอบตัวเครื่องให้ความรู้สึกพรีเมียมอย่างชัดเจน มาพร้อมตัวเลือกสีสันสดใส รวมถึงสี Velvet Red ที่สวยงามซึ่งเคยเห็นในรุ่นจอพับของ Xiaomi นอกจากนี้ยังมีสีดำ สีขาว และสี Cosmic Blue ให้เลือก แม้ว่าสีแดงหรือสีน้ำเงินจะดูโดดเด่น แต่สิ่งที่ดึงดูดสายตาที่สุดคือหน้าจอขนาดเล็กที่ด้านหลัง", "หน้าจอรอง (Back Display) ใช้เทคโนโลยีเดียวกับหน้าจอหลัก โดยมีความสว่างสูงสุดถึง 4,000 nits และรีเฟรชเรท 120Hz ทั้งหน้าจอรองและชุดกล้องได้รับการปกป้องด้วยกระจก Corning Gorilla Glass Victus แผ่นเดียว ทำให้ดีไซน์ด้านหลังที่ดูมีรายละเอียดเยอะมีความกลมกลืนกันมากขึ้น", "ฟังก์ชันของหน้าจอรองแบ่งออกเป็นสองประเภทหลัก อย่างแรกคือทำหน้าที่เป็นช่องมองภาพสำหรับกล้องหลัก ซึ่งจะสลับไปใช้โหมดมุมกว้างอัตโนมัติหากตรวจพบคนในเฟรมตั้งแต่ 3 คนขึ้นไป แต่ในโหมดอื่นๆ จะเป็นเวอร์ชันที่ลดทอนฟีเจอร์ลงเพื่อให้เหมาะกับพื้นที่หน้าจอที่จำกัด", "นอกจากฟีดการแจ้งเตือน ข้อมูลสภาพอากาศ แผน จากที่สมาร์ตโฟนทั้งสองรุ่นนี้ได้เปิดตัวครั้งแรกในประเทศจีนไปเมื่อเดือนกันยายนที่ผ่านมา", "สำหรับรุ่นที่วางจำหน่ายทั่วโลกของ Xiaomi 18 Pro และ 18 Pro Max นั้น มีสเปกฮาร์ดแวร์ส่วนใหญ่เหมือนกับรุ่นที่วางจำหน่ายในจีนเกือบทั้งหมด ยกเว้นในส่วนของแบตเตอรี่ที่มีขนาดเล็กลงกว่าเดิม", "โดย Xiaomi 18 Pro เวอร์ชัน Global มาพร้อมกับแบตเตอรี่ขนาด 6,000 mAh ในขณะที่ Xiaomi 18 Pro Max มาพร้อมกับแบตเตอรี่ขนาด 7,050 mAh ซึ่งหากเทียบกับรุ่นที่วางจำหน่ายในจีน Xiaomi 18 Pro จะมีแบตเตอรี่ขนาด 7,000 mAh และ 18 Pro Max จะมีความจุสูงถึง 8,500 mAh", "ในด้านความเร็วการชาร์จ Xiaomi 18 Pro Max เวอร์ชัน Global ยังคงความเร็วเท่ากับรุ่นในจีน คือชาร์จไวแบบมีสาย 100W และชาร์จไร้สาย 50W ส่วน Xiaomi 18 Pro เวอร์ชัน Global รองรับการชาร์จไร้สาย 50W เช่นเดียวกับรุ่นในจีน แต่ความเร็วในการชาร์จแบบมีสายจะช้ากว่าเล็กน้อย โดยอยู่ที่ 90W เมื่อเทียบกับ 100W ในรุ่นจีน", "ในส่วนของขุมพลัง Xiaomi 18 Pro Max ขับเคลื่อนด้วยชิปเซ็ต Snapdragon 8 Elite Extreme Gen 6 SoC ในขณะที่ Xiaomi 18 Pro ใช้ชิปเซ็ต Snapdragon 8 Elite Gen 6 ทั้งสองรุ่นมาพร้อมกับหน้าจอรองที่ด้านหลังตัวเครื่อง และรันบนระบบปฏิบัติการ HyperOS 4 ที่มีพื้นฐานมาจาก Android 17 ตั้งแต่แกะกล่อง นอกจากนี้หน้าจอหลักของสมาร์ตโฟนทั้งสองรุ่นยังมีโหมดความเป็นส่วนตัว (Privacy Mode) ที่ออกแบบมาเพื่อปกป้องข้อมูลที่ละเอียดอ่อนในขณะใช้งานในที่สาธารณะ", "ผู้ที่สนใจสามารถตรวจสอบรายละเอียดการเปรียบเทียบสเปกเชิงลึกของ Xiaomi 18 Pro และ Xiaomi 18 Pro Max ได้ผ่านช่องทางของเว็บไซต์เพื่อศึกษาข้อมูลเพิ่มเติม", "Xiaomi 18 Pro Max มีให้เลือกทั้งหมด 4 สี ได้แก่ สีดำ (Black), สีขาว (White), สีแดงกำมะหยี่ (Velvet Red) และสีน้ำเงินคอสมิก (Cosmic Blue) โดยมีตัวเลือกหน่วยความจำ 3 รูปแบบ คือ 12GB/256GB, 12GB/512GB และ 16GB/1TB", "สำหรับ Xiaomi 18 Pro ก็มีตัวเลือกสีที่เหมือนกัน แต่มีตัวเลือกหน่วยความจำให้เลือก 2 รูปแบบ คือ 12GB/256GB และ 12GB/512GB", "ราคาเปิดตัวของ Xiaomi 18 Pro ในตลาดโลกเริ่มต้นที่ 1,399 ยูโร ส่วนรุ่น 18 Pro Max เริ่มต้นที่ 1,599 ยูโร", "สมาร์ตโฟนทั้งสองรุ่นยังมาพร้อมกับสิทธิพิเศษทดลองใช้งานฟรี ได้แก่ Google AI Pro และ YouTube Premium เป็นเวลา 3 เดือน, Spotify Premium เ ละไม่ได้รับการเหลียวแลเท่าที่ควร อย่างไรก็ตาม ล่าสุดได้มีการปล่อยอัปเดตดีไซน์ใหม่สำหรับแอปพลิเคชันบนระบบปฏิบัติการ Android ออกมาให้ผู้ใช้งานได้สัมผัสกันแล้ว", "การปรับโฉมในครั้งนี้ไม่ได้เป็นเพียงแค่การเปลี่ยนหน้าตาให้ดูสดใหม่เท่านั้น แต่หากพิจารณาจากองค์ประกอบต่างๆ แล้ว มันแทบจะตะโกนบอกผู้ใช้งานทุกคนว่า 'RCS กำลังจะมาถึงแล้ว' ผ่านงานดีไซน์ที่ถอดแบบมาจากแอปพลิเคชันสื่อสารหลักของ Google", "ด้วยรูปลักษณ์ที่เปลี่ยนไปในครั้งนี้ ทำให้ Google Voice มีความใกล้เคียงกับแอป Google Messages มากขึ้นอย่างเห็นได้ชัด ซึ่งเป็นการตอกย้ำข่าวลือที่ว่า Google กำลังเตรียมนำมาตรฐานการส่งข้อความแบบ RCS (Rich Communication Services) มาใช้งานในบริการ Google Voice ในอนาคต", "การเปลี่ยนแปลงนี้ถือเป็นก้าวสำคัญสำหรับผู้ที่ยังคงใช้งาน Google Voice เป็นหลัก เพราะนอกจากจะช่วยให้แอปพลิเคชันดูทันสมัยและสอดคล้องกับแนวทางการออกแบบผลิตภัณฑ์อื่นๆ ของ Google แล้ว ยังเป็นการเตรียมความพร้อมด้านโครงสร้างพื้นฐานเพื่อรองรับฟีเจอร์การสื่อสารที่ล้ำสมัยยิ่งขึ้นต่อไป"], "link": "https://9to5google.com/2026/11/17/google-voice-redesign-rcs-coming/", "canonical_link": "https://9to5google.com/2026/11/17/google-voice-redesign-rcs-coming", "cover_image_url": "https://9to5google.com/wp-content/uploads/sites/4/2026/05/google-voice-1.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794925800, "published_at": "2026-11-17T14:30:00Z", "published_th": "17 พ.ย. 2026 • 21:30 น.", "category_hint": "Gadgets"}, {"id": 1794925853896, "guid": "https://www.engadget.com/2315018/bose-headphone-settings-manually-turn-on", "original_title": "5 important Bose headphone settings that need to be manually turned on", "thai_title": "5 การตั้งค่าสำคัญบนหูฟัง Bose ที่คุณต้องเปิดใช้งานด้วยตัวเองเพื่อประสบการณ์เสียงที่ดีที่สุด", "tag": "Gadgets", "sub_tag": "AUDIO", "bullet_points": ["การปรับแต่ง Equalizer (EQ) ช่วยให้คุณปรับจูนเสียงเบส เสียงกลาง และเสียงแหลมได้ตามความชอบส่วนตัว", "ฟีเจอร์ Bluetooth Multipoint ช่วยให้หูฟังเชื่อมต่อกับอุปกรณ์ได้พร้อมกัน 2 เครื่อง สลับใช้งานได้สะดวกโดยไม่ต้องกดเชื่อมต่อใหม่", "การตั้งค่า Noise Canceling และโหมดเสียงต่างๆ เช่น Immersion หรือ Cinema ช่วยเพิ่มอรรถรสในการฟังเพลงและดูหนัง", "ฟีเจอร์ Shortcut ช่วยให้คุณเข้าถึงคำสั่งด่วนผ่านปุ่มหรือแถบสัมผัสบนหูฟังได้ตามต้องการ", "ฟีเจอร์ Self Voice ช่วยปรับระดับเสียงพูดของตัวเองขณะสนทนาโทรศัพท์ให้มีความเป็นธรรมชาติมากขึ้น"], "full_paragraphs": ["การจับคู่หูฟัง Bose ของคุณเป็นเพียงจุดเริ่มต้นเท่านั้น เพราะการปรับแต่งเล็กๆ น้อยๆ ในแอปพลิเคชันคู่หูจะช่วยให้หูฟังของคุณตอบโจทย์การใช้งานในแบบที่เป็นคุณมากขึ้น แม้ว่า Bose จะเป็นแบรนด์หูฟังยอดนิยมที่หลายคนใช้งานมานาน แต่ผู้ใช้หลายคนอาจยังไม่ทราบว่าหูฟังของพวกเขาสามารถทำอะไรได้มากกว่าที่คิด แม้หูฟังจะให้คุณภาพเสียงที่ดีเยี่ยมตั้งแต่ออกจากกล่อง แต่ฟีเจอร์เด็ดๆ บางอย่างจำเป็นต้องเปิดใช้งานด้วยตัวเอง ไม่ว่าคุณจะต้องการให้หูฟังทำอะไรได้มากขึ้น หรือแค่อยากรีดประสิทธิภาพให้ถึงขีดสุด การสำรวจการตั้งค่าต่างๆ เช่น อีควอไลเซอร์ (EQ), การเชื่อมต่อหลายอุปกรณ์ (Multi-connection), ระบบตัดเสียงรบกวน, ทางลัด (Shortcuts) หรือการตั้งค่าเสียงพูดของตัวเอง (Sidetone) ถือเป็นเรื่องที่คุ้มค่า", "โปรดทราบว่าหูฟัง Bose แต่ละรุ่นอาจเข้าถึงการตั้งค่าเหล่านี้ได้ไม่เท่ากัน โดยรุ่น QuietComfort ใหม่ๆ จะได้รับการอัปเกรดฟีเจอร์ที่ครบครันกว่า ในขณะที่รุ่น QuietComfort Ultra และ QuietComfort รุ่นแรกๆ อาจขาดฟีเจอร์บางอย่างไป นอกจากนี้ คุณจำเป็นต้องดาวน์โหลดแอป Bose เพื่อปรับแต่งค่าต่างๆ นอกเหนือจากการตั้งค่าพื้นฐาน เนื่องจากปุ่มควบคุมบนตัวหูฟังเองมีจำกัดมาก", "ฟีเจอร์ที่มีประโยชน์อย่างหนึ่งบนหูฟัง Bose ที่รองรับคือ อีควอไลเซอร์ (EQ) เช่นเดียวกับอุปกรณ์เครื่องเสียงทั่วไป อีควอไลเซอร์ช่วยให้คุณปรับแต่งย่านความถี่เสียงต่างๆ ได้ตามรสนิยม ไม่ว่าจะเป็นการปรับคุณภาพเสียงใน Apple Music ให้เบสหนักขึ้น หรือปรับเสียงแหลมให้มีความใสเคลียร์มากขึ้น ซึ่งบ่อยครั้งที่รีวิวต่างๆ มักจะติงว่า Bose มักจะบูสต์เสียงเบสมาให้หนักเกินไปตั้งแต่ต้น ดังนั้นการลองลดระดับเบสลงเล็กน้อยก่อนเริ่มปรับแต่งค่าอื่นๆ อาจเป็นไอเดียที่ดี", "อีควอไลเซอร์ของ Bose ช่วยให้คุณปรับระดับเสียงได้ 3 ย่าน ได้แก่ เบส (Bass), เสียงกลาง (Mid) และเสียงแหลม (Treble) ซึ่งเพียงพอสำหรับผู้ใช้ส่วนใหญ่โดยไม่ซับซ้อนจนเกินไป นอกจากนี้ยังมีค่าที่ตั้งไว้ล่วงหน้า (Presets) ให้เลือกหากคุณต้องการใช้คำแนะนำจาก Bose หรือเลือกใช้เป็นจุดเริ่มต้นก่อนปรับแต่งโปรไฟล์เสียงของคุณเอง โดยคุณสามารถเข้าไปที่อีควอไลเซอร์ได้ที่หน้าจอหลักของแอป Bose ในหัวข้อ EQ", "หนึ่งในสิ่งที่น่ารำคาญที่สุดของการใช้หูฟัง Bluetooth คือการต้องยกเลิกการเชื่อมต่อและเชื่อมต่อใหม่ทุกครั้งที่ต้องการสลับอุปกรณ์ ฟีเจอร์ Bluetooth Multipoint ช่วยให้อุปกรณ์ Bluetooth เชื่อมต่อกับแหล่งสัญญาณได้หลายแหล่งพร้อมกัน คุณจึงสามารถสลับไปมาระหว่างอุปกรณ์ได้โดยไม่ต้องกดตัดการเชื่อมต่อ หูฟัง Bose ที่รองรับฟีเจอร์นี้จำเป็นต้องเปิดใช้งานผ่านแอปก่อน", "คุณสามารถพบการตั้งค่า Bluetooth Multipoint ได้ในส่วน Settings ของแอป ภายใต้หัวข้อ Bluetooth Connections เพียงแค่กดเปิดใช้งาน คุณก็จะสามารถเชื่อมต่อหูฟังกับแหล่งเสียงสองแหล่งได้พร้อมกัน หากต้องการสลับอุปกรณ์ เพียงแค่หยุดเล่นเสียงจากเครื่องหนึ่งแล้วกดเล่นอีกเครื่องหนึ่ง หรือสลับผ่านแอปหากการสลับอัตโนมัติไม่ทำงาน แม้ว่าการเชื่อมต่อ Multipoint จะไม่ได้สมบูรณ์แบบเสมอไปในทุกสถานการณ์ แต่ก็ถือว่าสะดวกสบายอย่างยิ่งเมื่อใช้งานได้ราบรื่น", "Bose มีจุดเด่นในเรื่องของหูฟังตัดเสียงรบกวน โดยคุณสามารถเลือกโหมดต่างๆ เพื่อปรับการทำงานของระบบตัดเสียงรบกวนได้ ซึ่งในรุ่นใหม่ๆ จะมีการเพิ่มโหมดเข้ามามากขึ้น หูฟัง QuietComfort Ultra จะเปิดใช้งานในโหมด Quiet เป็นค่าเริ่มต้น แต่หากคุณพบโหมดอื่นที่ชอบมากกว่า คุณสามารถตั้งค่าในแอปให้จดจำโหมดล่าสุดที่ใช้งานได้ผ่านเมนู Settings", "ในเมนู Modes ของแอป คุณจะพบกับค่าที่ตั้งไว้ล่วงหน้าสำหรับการตัดเสียงรบกวนอย่างน้อยสองแบบ ขึ้นอยู่กับรุ่นหูฟังที่คุณใช้ โดยโหมด Quiet (ตัดเสียงรบกวนเต็มรูปแบบ) และ Aware (โหมดรับเสียงภายนอก) จะมีให้ใช้งานในหูฟัง QuietComfort Ultra ส่วนในหูฟังรุ่นใหม่ๆ จะมีโหมด Immersion ที่จำลองประสบการณ์เหมือนฟังดนตรีจากเวทีที่อยู่ตรงหน้า และโหมด Cinema ที่ช่วยเพิ่มความชัดเจนของบทสนทนาขณะชมภาพยนตร์หรือรายการทีวี นอกจากนี้ คุณยังสามารถกำหนดโหมดที่ปรับแต่งเองได้หลายโหมดโดยเลือกฟีเจอร์ตัดเสียงรบกวนที่ต้องการเปิดใช้งาน", "หูฟัง Bose หลายรุ่นช่วยให้คุณปรับแต่งปุ่มควบคุมได้ โดยรายละเอียดจะขึ้นอยู่กับรุ่นที่คุณเป็นเจ้าของ หูฟัง QuietComfort Ultra มีแถบสัมผัส ในขณะที่รุ่นเก่าจะมีป บในอีเมล และล้างข้อมูลในโฟลเดอร์ Recently Deleted"], "full_paragraphs": ["การปรับเปลี่ยนการตั้งค่าเพียงไม่กี่ขั้นตอนสามารถช่วยหยุดปัญหาพื้นที่ iCloud ของคุณเต็มได้ Apple ไม่ได้ให้พื้นที่เก็บข้อมูล iCloud มามากนักเมื่อคุณซื้อผลิตภัณฑ์ของบริษัท และไม่ว่าคุณจะซื้ออุปกรณ์ของ Apple มากี่เครื่องก็ตาม คุณจะได้รับพื้นที่ฟรีเพียง 5GB เท่านั้น เนื่องจากเกือบทุกอย่างที่คุณซิงค์หรือสำรองข้อมูลกับ Apple จะใช้พื้นที่ส่วนนี้ร่วมกัน คำถามคือคุณจะเพิ่มพื้นที่ว่างได้อย่างไรเมื่อ iCloud เต็ม?", "พื้นที่ดังกล่าวถูกครอบครองโดยรูปภาพ, วิดีโอ, ข้อมูลสำรอง, อีเมล, ไฟล์แนบในอีเมล, ข้อมูลจากแอปต่างๆ เช่น Messages และ Notes, เนื้อหาใน iCloud Drive และข้อมูลจากแอปของบุคคลที่สามบางแอป แม้แต่รูปภาพที่เก็บไว้ใน Shared Albums ก็เริ่มถูกนับรวมในพื้นที่จัดเก็บข้อมูลของคุณตั้งแต่ iOS 27 เป็นต้นมา", "คุณสามารถอัปเกรดการสมัครสมาชิก iCloud ได้ในราคาเริ่มต้นเพียง 0.99 ดอลลาร์ต่อเดือนสำหรับพื้นที่ 50GB แต่การลบข้อมูลนั้นไม่มีค่าใช้จ่ายใดๆ คุณสามารถลบข้อมูลที่อยู่ในไฟล์, รูปภาพ, ข้อมูลสำรองของแอป, บันทึกเสียง และทุกอย่างที่เหลือได้ ทั้งบนอุปกรณ์ Apple ของคุณหรือผ่านเว็บไซต์ iCloud อย่างไรก็ตาม สิ่งที่คุณลบไปจะหายไปอย่างถาวรหลังจากผ่านไป 30 วัน โปรดจำไว้ว่าสิ่งใดก็ตามที่คุณลบออกจากแอปใดๆ รวมถึงรูปภาพและวิดีโอ ข้อมูลเหล่านั้นจะหายไปจากทุกอุปกรณ์ของคุณด้วย", "คุณสามารถตรวจสอบได้ว่ามีการใช้พื้นที่จัดเก็บข้อมูลไปเท่าใดและใช้ไปกับอะไรบ้างใน iCloud Settings บนอุปกรณ์ของคุณหรือบนเว็บไซต์ iCloud โดยไปที่ Settings > [ชื่อของคุณ] > iCloud จากนั้นคลิก Manage (บน Mac) หรือแตะ Storage (บน iOS) เพื่อเข้าสู่ส่วนการจัดการพื้นที่จัดเก็บข้อมูล โปรดทราบว่าบน Mac เมนู Settings จะเรียกว่า System Settings", "ในหน้านี้ คุณสามารถตรวจสอบรายการแอปทั้งหมดที่ใช้พื้นที่จัดเก็บข้อมูลโดยเรียงลำดับตามขนาดได้ โดยปกติแล้วคุณจะพบ Photos, Mail, Backups, iCloud Drive และ Messages อยู่ที่ด้านบนของรายการ นอกจากนี้ยังคุ้มค่าที่จะเลื่อนลงไปดูว่ามีแอปใดที่คุณไม่ได้ใช้งานแล้วแต่ยังคงกินพื้นที่อันมีค่าของคุณอยู่หรือไม่", "นี่คือ 5 วิธีที่เร็วที่สุดในการเพิ่มพื้นที่ว่างใน iCloud: เริ่มต้นจาก Photos และ Mail ซึ่งมักจะเป็นส่วนที่กินพื้นที่มากที่สุด สำหร ะความใส่ใจของคุณในขณะทำงานหรือทำสมาธิได้ทุกที่", "บริษัทเรียกผลิตภัณฑ์นี้ว่าเป็น 'ฟิตเนสแทร็กเกอร์สำหรับสมอง' ดังนั้นเมื่อสมาธิของคุณเริ่มวอกแวก หูฟังจะคอยเตือนให้คุณกลับมาจดจ่อกับสิ่งที่ต้องทำ และหากสถานการณ์ยังไม่ดีขึ้น ระบบจะแนะนำให้คุณหยุดพักเพื่อฟื้นฟูพลังงานแทนที่จะฝืนทำงานจนหมดไฟในช่วงกลางวัน ซึ่งในแง่นี้ถือเป็นเรื่องน่าทึ่งที่ได้เห็นว่าระบบวิเคราะห์การทำงานของสมองผมในแต่ละวันอย่างไร", "Neurable One มีราคาถูกกว่ารุ่นก่อนหน้าและคู่แข่งในตลาด อีกทั้ง Neurable ยังได้ปรับปรุงแพลตฟอร์มซอฟต์แวร์ให้ดียิ่งขึ้น หากจะมีข้อเสียอยู่บ้างก็คือ แม้ผมจะชื่นชอบช่วงเวลาที่ได้ใช้งานมัน แต่ก็ยากที่จะจินตนาการว่าจะมีใครนอกจากกลุ่มคนที่คลั่งไคล้เทคโนโลยีแบบผมที่อยากจะใช้งานมันจริงๆ", "Neurable แยกตัวออกมาจากโครงการวิจัยของมหาวิทยาลัยมิชิแกนในปี 2015 โดยมีเป้าหมายเพื่อสร้างส่วนต่อประสานระหว่างสมองกับคอมพิวเตอร์ (BCI) และอัลกอริทึมในการตีความข้อมูลเหล่านั้น โดยมุ่งเน้นไปที่ประสิทธิภาพทางปัญญาซึ่งมีประโยชน์ทั้งในด้านการทหารและพลเรือน แม้ชื่อจะเป็น Neurable One แต่จริงๆ แล้วนี่คือหูฟัง EEG รุ่นที่สามของบริษัท โดยในปี 2024 ได้ร่วมมือกับ Master & Dynamic ในรุ่น MW75 Neuro และปีถัดมาได้ออกรุ่น Neuro LT ที่เบากว่าเพื่อแก้ปัญหาความสบายในการสวมใส่ แต่ครั้งนี้ Neurable ตัดสินใจลุยเดี่ยวโดยไม่มีแบรนด์เครื่องเสียงชื่อดังหนุนหลัง", "หากมองผ่านๆ คุณแทบจะไม่เห็นความแตกต่างระหว่างรุ่นนี้กับรุ่นก่อนหน้า เพราะการเปลี่ยนแปลงส่วนใหญ่เป็นเพียงการปรับแต่งด้านความสวยงาม ตำแหน่งปุ่มกดเหมือนเดิมแต่เปลี่ยนจากทรงกลมเป็นทรงเม็ดยา โลโก้บนหูฟังเปลี่ยนจากไอคอนของ M&D เป็นสัญลักษณ์คลื่นสมองของ Neurable และมีช่องระบายอากาศน้อยลง ที่สำคัญที่สุดคือการตัดแขนยึดแบบ Cantilever ที่เชื่อมระหว่างแถบคาดศีรษะกับหูฟังออกไป แล้วเปลี่ยนมาใช้ฮาร์ดแวร์มาตรฐานแทน", "ภายในตัวเครื่องก็เช่นกัน Neurable One ติดตั้งอุปกรณ์แทบจะเหมือนเดิม คุณจะได้ไดรเวอร์ Beryllium ขนาด 40 มม., Bluetooth 5.2, รองรับ AAC และ aptX แม้จะมีไมโครโฟนลดลงเหลือ 6 ตัวจากเดิม 8 ตัวในรุ่น MW75 Neuro และเช่นเคย ในหูฟังแต่ละข้างจะมีเซนเซอร์ EEG แบบแห้งติดตั้งอยู่ในฟองน้ำหูฟังที่แนบไปกับรอบหูของคุณ", "แนวคิดของ Neurable คือการช่วยให้ผู้คนเข้าใจประสิทธิภาพทางปัญญาของตนเองได้ลึกซึ้งขึ้นตลอดทั้งวัน โดยบริษัทแย้งว่าสมองของเราก็เหมือนร่างกายส่วนอื่นๆ ที่มีพลังงานจำกัด ไม่สามารถทำงานเต็มประสิทธิภาพได้ตลอดเวลา ดังนั้นเมื่อสมาธิเริ่มลดลง การหยุดพักก่อนที่จะเกิดอาการหมดไฟจึงเป็นทางเลือกที่ดีกว่า การใช้เวลา 5 นาทีมองออกไปนอกหน้าต่างย่อมดีกว่าการปล่อยให้ตัวเองปวดหัวจนทำงานไม่ได้ไปเป็นชั่วโมง", "เพียงสวมหูฟังในช่วงเริ่มต้นวัน ระบบจะคอยติดตามว่าคุณเป็นอย่างไรบ้าง หากทำเช่นนี้ต่อเนื่องหลายวันหรือหลายสัปดาห์ คุณจะเริ่มเข้าใจว่าช่วงเวลาใดที่คุณมีสมาธิสูงสุดหรือต่ำสุด เพื่อนำไปปรับรูปแบบการทำงานให้เหมาะสม Neurable One ยังทำงานได้ดีเยี่ยมในขณะที่คุณทำสมาธิหรือพักผ่อน ช่วยให้คุณเข้าใจว่าสมองของคุณพักผ่อนอย่างไรและเมื่อใด", "หนึ่งในสิ่งที่ผมรำคาญใจเกี่ยวกับอุปกรณ์ EEG แบบสวมใส่ส่วนใหญ่ (และเซนเซอร์ผ้าอื่นๆ) คือแผ่นเซนเซอร์มักจะใช้งานยาก มักจะไม่ทำงานเลยหากมันแห้งสนิทและผิวหนังบริเวณที่สัมผัสก็แห้งด้วย ซึ่งทำให้ผมหงุดหงิดบ่อยครั้งที่ต้องคอยแตะน้ำเย็นที่แผ่นเซนเซอร์ก่อนจะเช็ดหน้าผากให้ชื้น แต่ถ้าผิวหนังและแผ่นเซนเซอร์เปียกเกินไป ระบบก็จะเตือนให้เช็ดให้แห้ง ซึ่งยิ่งทำให้เสียเวลามากขึ้น โชคดีที่เซนเซอร์แบบแห้งของ Neurable One ใช้งานได้ทันทีแทบทุกครั้งที่ผมใช้ แม้บางครั้งจะต้องคอยปัดผม (ที่สั้นอยู่แล้ว) ออกจากหูเพื่อเพิ่มการเชื่อมต่อ แต่มันก็ยังดีกว่าผลิตภัณฑ์อื่นๆ ในตลาดที่ผมเคยทดสอบมา", "การตั้งค่าทำได้ง่ายมาก และการเริ่มเซสชันแรกก็ไม่ยุ่งยาก เช่นเดียวกับกิจวัตรประจำวันที่คุณต้องทำ เริ่มต้นด้วยการเช็คอินในช่วงเช้า หลับตาและปล่อยให้ระบบสแกนสมองเป็นเวลา 60 วินาที คุณจะได้รับแดชบอร์ดที่แสดงคะแนนพร้อมเปรียบเทียบกับวันก่อนหน้าเพื่อดูว่าดีขึ้นหรือแย่ลง หากคุณนอนหลับไม่สนิทหรือมีเรื่องให้คิดมาก คุณสามารถจดบันทึกไว้ในหน้าเดียวกันได้", "สิ่งที่น่าสนใจและมีประโยชน์มากกว่าคือส่วน Insights และ Improve ซึ่งจะบอกคุณว่าควรทำอย่างไรเพื่อจัดการกับภาระทางปัญญา (Cognitive Load) ในขณะนั้นและวิธีเพิ่มประสิทธิภาพ ส่วนแรกแนะนำให้คุณชะลอการตัดสินใจเรื่องใหญ่ๆ อย่าเพิ่งเริ่มงานที่ต้องใช้สมาธิสูง และให้รวมงานเล็กๆ ที่ทำซ้ำๆ เข้าด้วยกัน ส่วนหลังแนะนำให้คุณออกไปเดินเล่นรับแสงแดด นั่งในห้องอื่นที่ห่างจากคอมพิวเตอร์สัก 5 นาที หรือจดบันทึกทุกอย่างที่ค้างอยู่ในหัว เมื่อทำเสร็จแล้ว คุณสามารถสแกนอีกครั้งเพื่อดูว่ามีการปรับปรุงขึ้นหรือไม่", "ถ้าจะให้พูดตรงๆ ผมมีวันที่ยุ่งมากในช่วงต้นสัปดาห์และรู้สึกจมอยู่กับงานหลายอย่างบนโต๊ะ (อันที่จริง ปัญหาใหญ่ที่สุดของผมตลอดการทดสอบหูฟังนี้คือ ภาระทางปัญญาของผมสูงเกินไปจนเป็นปัญหา ราวกับว่าการทำงานในสายข่าวและต้องรับมือกับโปรเจกต์นับร้อยพร้อมกันเป็นเรื่องที่ผิดปกติ) แอปบอกว่าพลังงานผมต่ำ แต่แนะนำให้ผมเดินขึ้นลงบันไดสักสองสามนาทีแล้วกลับมาเช็คใหม่ และเชื่อไหมว่ามันช่วยปรับปรุงทั้งคะแนนและความสามารถในการทำงานของผมให้ดีขึ้นตลอดช่วงเช้าที่เหลือ", "ส่วนใหญ่ผมจะเปิดใช้งาน EEG ตอน 9 โมงเช้าและไม่ถอดออกจนถึงเที่ยงหรือบ่ายโมง แอปจะติดตามว่าคุณมีสมาธิแค่ไหนและแสดงเป็นตัวเลขแบบเรียลไทม์บนหน้าจอ หากตรวจพบว่าสมาธิเริ่มวอกแวก มันจะปลุกคุณให้กลับมา แต่ถ้าหลังจากนั้นคุณยังคงมีปัญหาในการจดจ่อ มันจะแนะนำให้คุณพักสั้นๆ สิ่งหนึ่งที่ผมไม่ชอบคือวิธีที่ระบบกระตุ้นให้คุณกลับมาโฟกัส: เมื่อมันคิดว่าสมาธิคุณลดลง จะมีเสียงเตือนดังขึ้นในหูเหมือนเป็นการบอกว่า 'เฮ้ย มีสมาธิหน่อย'", "มันเป็นเสียงที่รุนแรงและมักจะทำให้ผมเสียสมาธิพอๆ กับที่มันช่วยให้ผมกลับมาโฟกัสได้ คุณสามารถปิดคำแนะนำนี้ได้ในแอป แต่ผมก็ยังอดทนใช้มันต่อไปแม้จะรู้สึกเหมือนอยู่ในหนังกำลังภายในยุค 70 ที่ตัวเอกถูกสั่งให้สร้างบ้านไพ่ในขณะที่ถูกปาด้วยผลไม้เน่าใส่ บ่อยครั้งที่ผมกำลังเขียนประโยคในสภาวะที่เรียกว่า Flow State แล้วจู่ๆ ก็มีเสียงเตือนดังขึ้น ทำให้ผมหลุดจากกระแสความคิดไปเลย", "แต่ยิ่งใช้หูฟังนานเท่าไหร่ ผมก็ยิ่งเห็นได้ชัดว่าระบบบอกว่าผมทำได้ดีตอนไหนและอะไรเป็นสาเหตุที่ทำให้สมาธิหลุด มันกลายเป็นวงจรป้อนกลับเชิงบวกที่ผมสามารถเลื่อนดูไทม์ไลน์ช่วงเช้าเพื่อดูว่าผมกำลังทำอะไรอยู่ตอนที่สมาธิอยู่ในระดับสูง", "ในส่วนของคุณภาพเสียง เห็นได้ชัดว่าบริษัทพยายามเข้าใกล้คำมั่นสัญญาของ Master & Dynamic ในเรื่องเสียงเบสที่อบอุ่นและเสียงแหลมที่ชัดเจน มีบรรยากาศที่ยอดเยี่ยมในเสียงที่ทำให้คุณรู้สึกเหมือนอยู่ในห้องที่บันทึกเสียงนั้นจริงๆ หนึ่งในเพลงโปรดที่ผมใช้ทดสอบหูฟังคือ 'Finale' จากซาวด์แทร็ก Tron: Legacy ซึ่งคุณจะได้ยินเสียงลมหายใจของนักเป่าแตร และเมื่อสวมหูฟังนี้ ผมก็รู้สึกยินดีไม่แพ้กันที่ได้สัมผัสถึงเสียงกลองทิมปานีที่สั่นสะเทือนส่งผ่านอากาศมาถึงหูของผมในขณะที่เสียงค่อยๆ ดังขึ้น", "ข use ซึ่งรุ่นล่าสุดคือ Muse S Athena แถบคาดศีรษะ EEG ที่ออกแบบมาเพื่อช่วยปรับปรุงการทำสมาธิของคุณ แต่ยังสามารถตรวจสอบระดับออกซิเจนในสมองได้ด้วย โดยมีราคา 539 ดอลลาร์พร้อมสมาชิก Muse พรีเมียมหนึ่งปี ซึ่งเพิ่มข้อมูลเกี่ยวกับ Alpha Peak และ Brain Recharge รวมถึงเชื่อมต่อกับ Spotify, Calm หรือแอปหนังสือเสียงที่คุณเลือกได้", "หากคุณต้องการเพียงแค่ซื้อหูฟังระดับไฮเอนด์ คุณควรไปดูคำแนะนำของ Engadget สำหรับหูฟังที่ดีที่สุดในตลาด ซึ่งไม่ต้องบอกก็รู้ว่าคุณสามารถหาหูฟังที่ดีกว่าได้ในราคาที่ถูกกว่า รวมถึงรุ่นระดับแนวหน้าอย่าง Sony XM6", "ผมใช้เวลามากมายในการทบทวนคำแนะนำของตัวเอง เพราะในแง่ของตัวผลิตภัณฑ์เอง นี่เป็นผลิตภัณฑ์ที่ยอดเยี่ยม มันทำในสิ่งที่สัญญาไว้ในรูปแบบที่ใช้งานง่าย เข้าถึงได้ และถูกกว่าคู่แข่ง (ที่มีอยู่เพียงไม่กี่ราย) มาก ในบริบทนี้ มันคุ้มค่ากับเงินที่จ่ายไป และผมคิดว่าผมได้รับประโยชน์อย่างมากจากเวลาที่ใช้กับอุปกรณ์นี้ หากคุณมีงบประมาณและมีความมุ่งมั่นที่จะเรียนรู้เพิ่มเติมว่าสมองของคุณทำงานอย่างไร ผมคิดว่ามันคุ้มค่า", "ข้อควรระวังคือ ผู้ใช้จำเป็นต้องมีความมุ่งมั่นที่จะทำสิ่งนี้อย่างสม่ำเสมอ ผมคาดว่าเราอาจต้องรออีกสักหนึ่งหรือสองรุ่นกว่าที่จะได้หูฟังเวอร์ชันที่คนทั่วไปสามารถใช้งานได้อย่างแพร่หลายจริงๆ"], "link": "https://www.engadget.com/2317916/neurable-one-review-brain-scanning-headphones-eeg/", "canonical_link": "https://www.engadget.com/2317916/neurable-one-review-brain-scanning-headphones-eeg", "cover_image_url": "https://www.engadget.com/img/gallery/neurable-one-review-brain-scanning-headphones-keep-an-eye-on-your-focus/l-intro-1794848419.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/neurable-one-review-brain-scanning-headphones-keep-an-eye-on-your-focus/intro-1794848419.jpg", "https://www.engadget.com/img/gallery/neurable-one-review-brain-scanning-headphones-keep-an-eye-on-your-focus/in-use-1794848420.jpg", "https://www.engadget.com/img/gallery/neurable-one-review-brain-scanning-headphones-keep-an-eye-on-your-focus/price-and-the-competition-1794848421.jpg", "https://www.engadget.com/img/gallery/neurable-one-review-brain-scanning-headphones  "Gadgets"}, {"id": 1794918667173, "guid": "https://9to5google.com/?p=737828", "original_title": "Jensen’s exit could be Google’s TPU moment", "thai_title": "การลาออกของ Jensen Huang อาจเป็นจุดเปลี่ยนสำคัญที่ทำให้ Google TPU ผงาดขึ้นมาแทนที่ Nvidia", "tag": "Gadgets", "sub_tag": "GOOGLE", "bullet_points": ["การลาออกของ Jensen Huang จากตำแหน่ง CEO ของ Nvidia สร้างความสั่นสะเทือนและเปิดโอกาสให้คู่แข่งในตลาดเซมิคอนดักเตอร์", "Google กำลังรุกตลาดด้วย TPU รุ่นที่ 8 ที่เน้นความเชี่ยวชาญเฉพาะด้านและประสิทธิภาพการใช้พลังงานที่เหนือกว่า", "การเปิดตัว TorchTPU ช่วยให้ผู้พัฒนาสามารถย้ายเวิร์กโฟลว์จาก CUDA มาใช้ TPU ได้ง่ายขึ้น ลดการพึ่งพา Nvidia", "Google เตรียมขยายการเข้าถึง TPU ไปยัง Oracle Cloud ในปี 2027 เพื่อเพิ่มส่วนแบ่งการตลาดในฐานะทางเลือกใหม่ของอุตสาหกรรม AI"], "full_paragraphs": ["ท่ามกลางกระแสความวุ่นวายหลังการลาออกอย่างกะทันหันของ Jensen Huang จาก Nvidia บรรดานักวิเคราะห์ต่างมุ่งความสนใจไปที่ทิศทางของบริษัทว่าจะเดินหน้าต่อไปอย่างไรโดยปราศจากผู้นำที่เป็นเสมือนสัญลักษณ์ของยุคสมัยและผู้ผลักดัน GPU ให้แพร่หลายไปทั่วโลก อย่างไรก็ตาม ในระยะยาวมีมุมมองที่น่าสนใจว่า Google อาจกลายเป็นผู้ชนะรายใหญ่ที่สุดจากการเปลี่ยนแปลงครั้งนี้ เนื่องจากตลาดกำลังเปิดกว้างสำหรับการแข่งขันที่อยู่นอกเหนือจากกำแพงภาษีหรือระบบนิเวศ CUDA ของ Nvidia", "แม้ว่า Colette Kress ซึ่งรับตำแหน่ง CEO รักษาการ จะไม่น่าจะมีการปรับเปลี่ยนแผนงานของบริษัทอย่างฉับพลัน แต่ความจริงที่ปฏิเสธไม่ได้คือคู่แข่งของ Nvidia ในอุตสาหกรรมเซมิคอนดักเตอร์ต่างพยายามอย่างหนักที่จะโค่นล้มผู้นำตลาดรายนี้ และเมื่อไม่มี Jensen คอยกุมบังเหียน ลูกค้าอาจมีแนวโน้มที่จะหันไปมองหาทางเลือกอื่นมากขึ้น", "เป็นเวลาหลายปีที่ Google นำเสนอ TPU (Tensor Processing Units) เพื่อเป็นโซลูชันสำหรับการฝึกฝนและประมวลผล AI แต่ส่วนใหญ่ยังคงถูกจำกัดอยู่ภายในโครงสร้างพื้นฐาน Google Cloud ของบริษัทเอง ทว่าสถานการณ์กำลังเปลี่ยนไปเมื่อ Google เริ่มเปิดให้บุคคลภายนอกเข้าถึง TPU ได้มากขึ้น และประกาศว่าจะนำขีดความสามารถของ TPU ไปให้บริการบน Oracle Cloud เริ่มต้นในปี 2027", "Google ได้อธิบายถึงกลุ่มผลิตภัณฑ์ TPU รุ่นที่ 8 ล่าสุดไว้ว่า: 'แม้จะมีความยืดหยุ่นในการร งเปิดตัวไปในช่วงสุดสัปดาห์นั้น โดยเซตถัดไปคือ Nauctis: The Sunken Realm ซึ่งมีกำหนดวางจำหน่ายในวันที่ 5 กุมภาพันธ์ 2027 โดย Nauctis จะนำเสนอโลกใต้น้ำแห่งใหม่และผลิตภัณฑ์ที่หลากหลายตามปกติ รวมถึงเด็ค Commander ทั้ง 4 ชุด แต่ผู้เล่นสังเกตเห็นว่าการ์ด Commander แบบไร้ขอบ (Borderless) จะไม่ถูกรวมอยู่ในผลิตภัณฑ์ชุดมาตรฐานที่ยังคงวางจำหน่ายในราคา 49.99 ดอลลาร์", "อย่างไรก็ตาม ผู้เล่นยังมีโอกาสได้รับบัตร Commander แบบไร้ขอบที่สวยงามเหล่านี้ผ่านชุด Premium Edition Commander Decks ซึ่งจะประกอบด้วยการ์ด Commander หลักแบบฟอยล์ไร้ขอบ 1 ใบ และการ์ด Commander รองแบบฟอยล์ไร้ขอบอีก 1 ใบ แถมยังเป็นเด็คฟอยล์ทั้งชุด แต่ราคาขายปลีกของ Premium Edition นั้นสูงถึง 79.99 ดอลลาร์ ซึ่งหมายความว่าผู้เล่นที่ต้องการการ์ด Commander แบบไร้ขอบจะต้องจ่ายเงินเพิ่มขึ้นกว่าปกติ แม้ว่าจะได้รับเด็คที่เป็นฟอยล์ทั้งหมดก็ตาม", "นี่ไม่ใช่การเปลี่ยนแปลงที่ก่อให้เกิดข้อถกเถียงเพียงอย่างเดียวที่ Nauctis นำมาสู่ผลิตภัณฑ์ของ Magic โดยเริ่มจากเซตนี้เป็นต้นไป Collector Boosters จะลดจำนวนการ์ดจาก 15 ใบเหลือ 12 ใบ ในขณะที่ Standard Bundles จะไม่มีการ์ดแลนด์ฟอยล์แบบเต็มภาพ (Full Art) อีกต่อไป และจำนวนการ์ดแลนด์พื้นฐานแบบฟอยล์จะลดลงจาก 15 ใบเหลือ 10 ใบ ทาง Wizards of the Coast ได้อธิบายเหตุผลเบื้องหลังการเปลี่ยนแปลงบางประการว่าเพื่อเปิดพื้นที่สำหรับการทดลองการพิมพ์รูปแบบต่างๆ เช่น God Packs แต่แฟนๆ จำนวนมากก็แสดงความไม่พอใจอย่างเข้าใจได้", "ถึงกระนั้น เด็ค Commander จากเซต Nauctis ก็ดูน่าตื่นเต้นไม่น้อย โดยเด็ค Boros (แดง-ขาว) ที่ชื่อว่า Seal the Deal อาจเป็นชื่อเด็คที่ดีที่สุดในประวัติศาสตร์ของ Magic ส่วนเด็ค Bant (ขาว-ฟ้า-เขียว) อย่าง Merfolk Regiment จะเพิ่มตัวเลือกให้กับหนึ่งในเด็คประเภทเผ่าพันธุ์ที่ได้รับความนิยมมากที่สุดใน Magic ด้านเด็ค Izzet (ฟ้า-แดง) ที่ชื่อ Blood in the Water นั้นมีฉลาม ซึ่งคงไม่ต้องอธิบายอะไรเพิ่มเติม และสุดท้ายเด็ค Sultai (เขียว-ฟ้า-ดำ) อย่าง Terrors of the Abyss ดูเหมือนจะเป็นตัวเลือกที่แข็งแกร่งที่สุด หากดูจาก Commander ทั้งสองใบคือ The Ignoble Serpent และ Zekes, Acid Rock Fan ที่ถูกเปิดเผยข้อมูลโดยไม่ตั้งใจบน Scryfall", "กล่องของเด็ค Terrors of the Abyss มีข้อความระบุว่า 'discard and mill' (ทิ้งการ์ดและนำการ์ดจากกองขึ้นสุสาน) และ 'reanimate sea monsters' (ชุบชีวิตสัตว์ประหลาดทะเล) ซึ่งดูเหมือนจะเป็นกลยุทธ์ที่แข็งแกร่ง โดย The Ignoble Serpent มีค่าร่าย 8 มานา (ไร้สี 5, เขียว 1, ฟ้า 1, ดำ 1) สำหรับการ์ดระดับตำนานประเภท Serpent Noble พลังโจมตี 7/9 โดยมีข้อความระบุว่า: 'เมื่อเริ่มช่วง Upkeep ครั้งแรกของคุณในเกมนี้ หาก The Ignoble Serpent อยู่ใน Command Zone ของคุณ ให้มิลการ์ด 4 ใบ' และ 'เมื่อเริ่มช่วง End Step ของคุณ ให้คืนการ์ดสัตว์ประหลาดทะเลจากสุสานของคุณลงสู่สนาม (Krakens, Leviathans, Octopuses, Serpents และ Whales ถือเป็นสัตว์ประหลาดทะเล)'", "ผู้เล่น Commander ทราบดีว่าความสามารถติดตัวที่ทำงานในขณะที่ Commander อยู่ใน Command Zone นั้นทรงพลังเพียงใด ต้องขอบคุณความสามารถ Eminence ที่โด่งดัง โดยงูตัวนี้เริ่มทำงานตั้งแต่เทิร์นแรก หากคุณสามารถมิลการ์ดสัตว์ประหลาดทะเลที่ทรงพลังได้ในการ์ด 4 ใบแรกของเด็ค ทันทีที่คุณเล่น The Ignoble Serpent ในช่วงท้ายเกม สัตว์ประหลาดตัวนั้นก็สามารถลงสู่สนามได้ฟรี และหากคุณใช้เวลาส่วนใหญ่ในเกมไปกับการเติมสุสานด้วยสัตว์ประหลาดทะเลตัวอื่นๆ ความสามารถที่สองของ Ignoble Serpent จะทำให้การเอาชนะคู่ต่อสู้เป็นเรื่องง่าย", "ตัวเลือกสัตว์ประหลาดทะเลที่น่าสนใจสำหรับเด็คนี้ ได้แก่ Simic Sky Swallower (ที่มีความสามารถป้องกันและหลบหลีก), The Terror of Serpent's Pass, Unagi of Kiyoshi Island (ที่ช่วยจั่วการ์ด) และที่ขาดไม่ได้คือคู่หูสุดแกร่งอย่าง Koma, Cosmos Serpent และ Koma, World-Eater ซึ่งเป็นภัยคุกคามขนาดใหญ่ที่ทนทานต่อการถูกกำจัดและยังสร้างโทเคนจำนวนมาก", "อย่างไรก็ตาม ตัวเลือกที่ผมชอบที่สุดคือ Sin, Spira's Punishment เมื่อ Sin เข้าสู่สนามหรือโจมตี มันจะสร้างสำเนาของ Permanent อื่นในสุสานของคุณ ซึ่งหมายความว่าคุณสามารถมีสัตว์ประหลาดตัวใหญ่สองตัวบนสนามได้ในราคาเดียว นอกจากนี้ Sin ยังสามารถสร้างสำเนาของแลนด์และยังจั่วการ์ดได้อีกด้วย", "ด้วยสัตว์ประหลาดทะเล 40 ตัวในเด็ค คุณมีโอกาส 89% ที่จะมิลการ์ดสัตว์ประหลาดเจอในการ์ด 4 ใบแรก แต่เนื่องจากต้องใช้เวลาสักพักกว่าจะนำ The Ignoble Serpent ลงสู่สนาม คุณจึงมีเวลาในการมิลหรือทิ้งการ์ดสัตว์ประหลาดทะเลด้วยเอฟเฟกต์ราคาประหยัด เช่น Dark Matter Manipulator, Dream Twist หรือ Mental Note เพื่อให้แ 4 มากกว่า GTA 5 หรือ GTA 6", "ตัวเกมเน้นการถ่ายทอดอารมณ์ความรู้สึกของตัวละครที่ต้องใช้ชีวิตสองหน้า ระหว่างการเป็นสายลับและสมาชิกแก๊ง Triad", "ระบบจำลองชีวิตใน Sleeping Dogs มีความเรียบง่าย ไม่ซับซ้อนเหมือนเกมยุคใหม่ แต่เน้นไปที่การสร้างบรรยากาศและน้ำหนักของเนื้อเรื่อง", "การเปรียบเทียบระหว่างเกมยุคเก่ากับเกมยุคใหม่ที่เน้นความสมจริงแบบสุดโต่ง ตั้งคำถามว่าความละเอียดที่มากเกินไปอาจทำให้เสน่ห์ดั้งเดิมของเกมแนวนี้หายไปหรือไม่"], "full_paragraphs": ["ในแง่ของโทนเรื่องและฉากหลัง Sleeping Dogs ให้ความรู้สึกที่ใกล้เคียงกับดราม่าแก๊งสเตอร์ในเมืองใหญ่ที่ดิบเถื่อนของ GTA 4 มากกว่าเกมภาคต่อของ Rockstar เสียอีก ในขณะที่ GTA 5 เป็นภาพยนตร์แนวปล้นที่ดูแปลกตาและเต็มไปด้วยแสงแดด ซึ่งเป็นพิมพ์เขียวที่ดูเหมือนว่าเรื่องราวความรักท่ามกลางการใช้ปืนใน Vice City ของ GTA 6 กำลังจะดำเนินตามรอยนั้น สิ่งนี้ทำให้ Wei Shen ตัวเอกของ Sleeping Dogs ยืนเคียงข้างกับ Niko Bellic แม้คนหนึ่งอาจจะกำลังเตะต่อยผู้คนในฮ่องกง และอีกคนอาจจะกำลังเผชิญกับการดวลปืนในนิวยอร์ก แต่ทั้งคู่ต่างก็เป็นคนแปลกหน้าที่เพิ่งมาถึงในสถานที่ที่ทั้งคุ้นเคยและแปลกแยก พวกเขาพบว่าตัวเองติดอยู่ระหว่างสองชีวิตที่แตกต่างกัน", "สำหรับ Wei มันคือการรักษาสมดุลระหว่างชีวิตประจำวันที่ต้องเอาตัวรอดท่ามกลางกลุ่ม Triad กับการรักษาความบริสุทธิ์ของตัวเองในฐานะสายลับที่ต้องคอยเก็บหลักฐานมัดตัวพวกเขา ส่วนสำหรับ Niko มันคือการรักษาสมดุลระหว่างการพยายามสะสางบัญชีแค้นเก่าและเริ่มต้นชีวิตใหม่ในอเมริกาหลังเหตุการณ์ 9/11 คนหนึ่งสามารถแวะร้านขายของริมทางเพื่อซื้อซาลาเปาไส้หมูมากิน ส่วนอีกคนสามารถแวะร้านขายฮอทดอกริมทางมากินได้เช่นกัน เกมของทั้งคู่ต่างเป็นที่รักเพราะนำเสนอเรื่องราวที่ทำให้ผู้เล่นอินไปกับ Wei และ Niko โดยเฉพาะ ซึ่งโดดเด่นในการพาคุณเข้าไปอยู่ในรองเท้าทางอารมณ์ของตัวละครใต้ดินทั้งสองนี้ ผู้ซึ่งโลกของพวกเขากำลังแตกสลายจากหลายทิศทางในขณะที่พวกเขาพยายามตะเกียกตะกายขึ้นสู่จุดสูงสุดของห่วงโซ่อาหาร", "แม้ว่าผมจะติดตลกในพาดหัวข่าว แต่พวกเขาก็ทำสิ่งเหล่านี้ด้วยรายละเอียดการจำลองชีวิตที่น้อยกว่ามากเมื่อเทียบกับสิ่งที่ถูกใส่ไว้ใน Red Dead Redemption 2 (และ GTA 6 ในระดับหนึ่ง) ซึ่งเป็นจุดขายหลักของเกมเหล่านั้น Wei สามารถซื้อซาลาเปาไส้หมูได้ และคนขายจะบอกเขาอย่างเสียงดังว่าการทำเช่นนั้นจะช่วยให้เขาไม่พลาดโอกาสที่จะกลายเป็น 'ลูกผู้ชายเต็มตัว' แต่ในเกมไม่มีแถบวัดค่า 'ความเป็นลูกผู้ชาย' ที่เรียกร้องให้ต้องกินซาลาเปาเป็นประจำ มิฉะนั้น Wei จะกลายเป็นลูกผู้ชายที่ไม่สมบูรณ์ สิ่งที่มันทำมีเพียงแค่ให้โบนัสฟื้นฟูพลังชีวิตชั่วคราวเท่านั้น เพราะอย่างที่เราทราบกันดีว่า สิ่งแรกที่หมอทำหากคุณถูกส่งตัวเข้าโรงพยาบาลด้วยบาดแผลฉกรรจ์หลังจากการต่อสู้ คือการเสิร์ฟอาหารรสเลิศที่ช่วยปิดบาดแผลของคุณให้หายสนิทได้ในไม่กี่นาที", "Sleeping Dogs อุทิศความพยายามในการจำลองชีวิตทั้งหมดไปกับการทำให้คุณรู้สึกถึงน้ำหนักของความทรมานที่ Wei ต้องเผชิญ ในขณะที่เขาต้องรับมือกับชีวิตสองหน้าที่ไม่ยั่งยืนระหว่างการทำบาปและการทำความดี เช่นเดียวกับ GTA 4 เกมนี้ไม่มีเวลา เทคโนโลยี หรือทุนสร้างมากพอที่จะประดับประดาตัวเองด้วยแอนิเมชันหรือระบบที่จำลองทุกแง่มุมของชีวิตประจำวันของ Wei อย่างละเอียดถี่ถ้วน มันถูกสันนิษฐานไว้เฉยๆ มากกว่าที่จะแสดงให้เห็นว่าตรอกซอกซอยบางแห่งที่เขาเดินผ่านเพื่อจับกุมพ่อค้ายาเสพติดนั้นอาจจะมีกลิ่นที่ไม่พึงประสงค์เล็กน้อย เขาไม่มีนกกว่า 60 สายพันธุ์ให้สะสมในขณะที่เดินทางจาก North Point ไปยังย่าน Central ที่เต็มไปด้วยนักธุรกิจ แล้วต่อไปยัง Aberdeen ที่เต็มไปด้วยเรือบ้าน และหมู่บ้านจัดสรรใน Kennedy Town แม้ว่าเขาจะคอยขโมยรูปปั้นหยกเพื่อโน้มน้าวให้อาจารย์กังฟูสอนวิธีใหม่ๆ ที่สนุกในการเตะศัตรูให้ยอมจำนนก็ตาม", "เขาสามารถร้องเพลงสุดเสียงในเพลง I Fought the Law ที่ตู้คาราโอเกะแห่งหนึ่งในฮ่องกง หรือเสียเงินทั้งหมดไปกับการเล่นไพ่นกกระจอก แต่เขาก็ไม่มีรายการงานอดิเรกเสริมมากมายจนสามารถดึงดูดผู้เล่นที่ไม่พยายามจะวอกแวกให้เสียเวลาไปหลายร้อยชั่วโมงได้", "อย่างไรก็ตาม หากเขาเดินเข้าไปในอพาร์ตเมนต์ในย่าน Central ของเขา Wei สามารถปัสสาวะได้ ตามจริงแล้วผมลืมเรื่องนี้ไปก่อนที่จะกลับมาเล่นใหม่เมื่อเร็วๆ นี้ แต่มันเป็นฟีเจอร์ที่เรียบง่ายอย่างน่าอัศจรรย์ ซึ่งเน้นย้ำให้เห็นว่าสิ่งต่างๆ เปลี่ยนไปอย่างไรสำหรับเกมประเภทนี้ในช่วงหลายปีที่ผ่านมานับตั้งแต่ปี 2012 ผมกดปุ่มเดียวเมื่อข้อความปรากฏขึ้นใกล้โถส้วม และ Wei ก็รูดซิปก่อนจะปล่อยปัสสาวะลงโถเสียงดังพอสมควร จากนั้นเขาก็ทำธุระเสร็จ ผมสามารถให้เขาล้างมือได้หากต้องการ แต่ไม่มีแถบวัดกระเพาะปัสสาวะที่ลดลง และไม่มีแ ming", "sub_tag": "GTA", "bullet_points": ["Rob Nelson ผู้บริหารร่วมของ Rockstar North ยืนยันว่า GTA 6 จะมีระบบสมุดบันทึกสัตว์ป่าสำหรับผู้เล่น", "ภายในเกมจะมีนกให้พบเจอทั้งหมด 62 สายพันธุ์ ซึ่งเป็นส่วนหนึ่งของระบบนิเวศในรัฐ Leonida", "แม้จะมีนกจำนวนมาก แต่ตัวเลขดังกล่าวถือเป็นเพียงเศษเสี้ยวเมื่อเทียบกับนกกว่า 529 สายพันธุ์ที่มีอยู่จริงในรัฐ Florida", "นอกจากนกแล้ว เกมยังมีสัตว์ป่าชนิดอื่นๆ อีกกว่า 170 สายพันธุ์ เช่น พะยูน, จระเข้, อีกัวน่าเขียว และลิงวอก"], "full_paragraphs": ["ดูเหมือนว่าจะมีรายการสิ่งที่ผู้เล่นตั้งตารอจะทำใน Grand Theft Auto 6 มากมายก่ายกองเมื่อเกมวางจำหน่ายในอีกไม่กี่วันข้างหน้า ไม่ว่าคุณจะอยากรู้ว่าความสัมพันธ์ที่อบอุ่นเป็นอย่างไร หรือกังวลว่าจะมีรถประเภทไหนให้ขับขี่บ้าง หรือบางทีสิ่งที่คุณต้องการจริงๆ อาจจะเป็นเพียงแค่การออกไปส่องนกเท่านั้น", "ดูเหมือนว่าท้องฟ้าจะเป็นขีดจำกัดเพียงอย่างเดียวใน GTA 6 เพราะคุณสามารถทำทั้งสามสิ่งที่กล่าวมาได้ทั้งหมด แม้ว่าการสร้างความสัมพันธ์ที่ดีอาจจะต้องใช้ความพยายามเป็นพิเศษก็ตาม ในระหว่างการสัมภาษณ์กับ The Guardian เมื่อเร็วๆ นี้ Rob Nelson ผู้บริหารร่วมของ Rockstar North ได้อธิบายว่าผู้เล่นจะมีสมุดบันทึกสัตว์ป่า ซึ่งรวมถึงนกสายพันธุ์ต่างๆ ถึง 62 ชนิด สำหรับผู้ที่ต้องการสำรวจสัตว์ป่าทั้งหมดที่รัฐ Leonida มีให้", "นอกเหนือจากนกนางนวลที่ถูกกล่าวถึงในการสัมภาษณ์แล้ว ผมยังไม่ทราบแน่ชัดว่ามีนกชนิดใดบ้างที่สามารถพบได้ใน GTA 6 อันที่จริงผมยังไม่รู้ด้วยซ้ำว่านกนางนวลที่เห็นนั้นเป็นชนิดไหน มันอาจจะเป็นนกนางนวลหัวดำ (Laughing Gull), นกนางนวลแฮร์ริง (Herring Gull) หรืออาจจะเป็นนกนางนวลปากวงแหวน (Ring-billed Gull) ขนาดเล็ก ผมอยากจะบอกว่าความเป็นไปได้นั้นไม่มีที่สิ้นสุด แต่มันก็ไม่ได้เป็นเช่นนั้น เพราะอย่างเป็นทางการแล้ว มีนกถึง 529 สายพันธุ์ที่พบได้ในรัฐ Florida ข้อมูล ณ ปี 2019 ดังนั้น 62 สายพันธุ์จึงเป็นเพียงเศษเสี้ยวของจำนวนทั้งหมดเท่านั้น", "คงเป็นเรื่องที่คาดเดาได้ไม่ยากว่าเราน่าจะได้เห็นนกอินทรีหัวขาว (Bald Eagle) และนกฟลามิงโกอเมริกัน (American Flamingo) ใน GTA 6 แต่ส่วนตัวแล้วผมหวังว่าจะได้พบนก Snowy Plover หรืออาจจะเป็นนก Swallow-tailed Kite แม้ว่าจะไม่ได้คาดหวังไว้สูงนักก็ตาม", "นอกเหนือจากนกแล้ว รัฐ Leonida จะเต แนวแข่งรถ กีฬา หรือเกมสำหรับเด็ก แต่เปิดกว้างสำหรับแนว RPG, MMO หรือเกมวางแผนหากมีทีมงานที่เหมาะสม", "สาเหตุที่ออกจาก Amazon เนื่องจากบริษัทให้ความสำคัญกับ AI เป็นหลักมากกว่าการพัฒนาเกม"], "full_paragraphs": ["Ubisoft ได้ว่าจ้าง Christoph Hartmann ผู้คร่ำหวอดในอุตสาหกรรมเกมให้เข้ามารับตำแหน่งผู้จัดการทั่วไปของ Creative House 2 โดยในการสัมภาษณ์ครั้งล่าสุด Hartmann ได้เปิดเผยถึงความคาดหวังที่มีต่อหน่วยงานนี้ว่า ความฝันของเขาคือการทำให้ที่นี่กลายเป็น 'A24 แห่งวงการวิดีโอเกม'", "Hartmann กล่าวกับ Variety ว่าสิ่งที่เขาต้องการสื่อคือ Creative House 2 สามารถดำเนินรอยตาม A24 ในแง่ของการสร้างสรรค์ผลงานที่ประสบความสำเร็จทั้งในด้านคำวิจารณ์และผลประกอบการทางการเงิน โดยยกตัวอย่างความสำเร็จของ A24 อย่างภาพยนตร์เรื่อง Backrooms ที่ทำรายได้ทั่วโลกไปกว่า 400 ล้านดอลลาร์ จากงบประมาณการสร้างเพียง 10 ล้านดอลลาร์ และได้รับเสียงตอบรับที่ดีเยี่ยมจากทั้งแฟนคลับและนักวิจารณ์ นอกจากนี้ยังมีผลงานที่ประสบความสำเร็จอื่นๆ เช่น Marty Supreme (192 ล้านดอลลาร์), Everything Everywhere All at Once (148 ล้านดอลลาร์), The Drama (135 ล้านดอลลาร์) และ Civil War (127 ล้านดอลลาร์)", "การที่ Hartmann ตั้งเป้าหมายให้ Creative House 2 เดินตามแนวทางของ A24 ถือเป็นเป้าหมายที่ทะเยอทะยานอย่างยิ่ง และนี่ไม่ใช่ครั้งแรกที่เขาประกาศเป้าหมายที่กล้าหาญเช่นนี้ สมัยที่ยังทำงานอยู่ที่ Amazon เขาเคยกล่าวว่าเป้าหมายของเขาคือการช่วยให้ Amazon กลายเป็น 'Disney แห่งอนาคต' โดยมีธุรกิจเกมยืนหยัดเคียงคู่ไปกับธุรกิจโทรทัศน์ ภาพยนตร์ ดนตรี และค้าปลีก", "Creative House 2 ดูแลแฟรนไชส์สำคัญอย่าง The Division, Ghost Recon, Splinter Cell และ March of Giants (ซึ่ง Ubisoft ซื้อมาจาก Amazon บริษัทเก่าของ Hartmann) โดย Ubisoft ระบุว่า 'บทบาทของ Hartmann คือการดูแลทิศทางเชิงกลยุทธ์และการพัฒนาสตูดิโอรวมถึงแบรนด์ต่างๆ ภายใต้ Creative House 2'", "Hartmann บอกกับ Variety ว่าเขาต้องการให้ Creative House 2 'ไม่เป็น' สถานที่ที่ผลิตเพียงแค่เกมแนวชูตเตอร์เท่านั้น 'ผมต้องการให้เราเป็นค่ายที่ดูแลกลุ่มผู้เล่นหลัก (Core Gamer) อย่างแท้จริง และสิ่งที่ผมหมายถึงคือ มันง่ายกว่าที่จะอธิบายว่าเราจะไม่ทำอะไร ดังนั้นผมจะไม่ทำเกมแข่งรถ ผมจะไม่ทำเกมกีฬา และผมจะไม่
