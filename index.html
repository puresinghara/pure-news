it’s investigating Megaspeed", "thai_title": "กระทรวงยุติธรรมสหรัฐฯ ยืนยันเดินหน้าสอบสวน Megaspeed หลังเกิดกรณีอื้อฉาวเชื่อมโยงอดีตซีอีโอ Nvidia", "tag": "Technology", "sub_tag": "POLICY", "bullet_points": ["กระทรวงยุติธรรม (DOJ) และกระทรวงพาณิชย์สหรัฐฯ ออกแถลงการณ์ยืนยันการสอบสวนบริษัท Megaspeed ซึ่งเป็นบริษัทดาต้าเซ็นเตอร์ในสิงคโปร์", "การสอบสวนเกิดขึ้นท่ามกลางประเด็นอื้อฉาวเรื่องความสัมพันธ์ส่วนตัวระหว่าง Jensen Huang อดีตซีอีโอ Nvidia กับอดีตผู้บริหาร Megaspeed ที่ถูกกล่าวหาว่าเป็นสายลับจีน", "ทางการสหรัฐฯ ระบุว่าได้เริ่มตรวจสอบ Megaspeed ตั้งแต่ปี 2024 ในประเด็นการละเมิดมาตรการควบคุมการส่งออกชิปเซมิคอนดักเตอร์", "Nvidia ได้สั่งระงับการขายชิปให้กับ Megaspeed ตั้งแต่เดือนมิถุนายน 2025 หลังจากการตรวจสอบของกระทรวงพาณิชย์พบความผิดปกติ", "กระทรวงยุติธรรมสหรัฐฯ เข้ามารับหน้าที่เป็นผู้นำในการสอบสวนคดีอาญาที่เกี่ยวข้องกับ Megaspeed ต่อจากกระทรวงพาณิชย์"], "full_paragraphs": ["กระทรวงยุติธรรมและกระทรวงพาณิชย์ของสหรัฐอเมริกาประกาศยืนยันว่า กำลังดำเนินการสอบสวนบริษัท Megaspeed ซึ่งเป็นบริษัทดาต้าเซ็นเตอร์ที่มีฐานอยู่ในสิงคโปร์ โดยบริษัทแห่งนี้มีความเกี่ยวข้องอย่างใกล้ชิดกับการลาออกของ Jensen Huang ซีอีโอของ Nvidia หลังจากที่มีรายงานข่าวว่าการสอบสวนดังกล่าวอาจถูกระงับไปเมื่อปีที่แล้ว", "“แม้ว่าโดยปกติแล้วเราจะไม่แสดงความคิดเห็นต่อการสอบสวนที่กำลังดำเนินอยู่ แต่การให้ข้อมูลที่เป็นข้อเท็จจริงและแก้ไขข้อมูลที่ไม่ถูกต้องซึ่งกำลังแพร่สะพัดอยู่ในรายงานข่าวสาธารณะนั้น ถือเป็นประโยชน์ต่อสาธารณะ” ทั้งสองกระทรวงระบุในแถลงการณ์ที่ออกเมื่อช่วงเย็นวันจันทร์ พร้อมยอมรับว่า Megaspeed กำลังได้รับความสนใจอย่างมากจากสาธารณชน", "Jensen Huang ได้ลาออกจากตำแหน่งซีอีโอของ Nvidia เมื่อสัปดาห์ที่ผ่านมา หลังจากมีรายงานข่าวเรื่องความสัมพันธ์เชิงชู้สาวกับ Alice Huang อดีตผู้บริหารของ Megaspeed ซึ่งถูกกล่าวหาว่าเป็นสายลับจีน โดยทาง Megaspeed ระบุว่าเธอได้ออกจากบริษัทไปแล้วตั้งแต่เดือนสิงหาคม 2025 กรณีอื้อฉาวนี้ได้สร้างความกังวลในประเด็นความมั่นคงของชาติ และนำไปสู่การตรวจสอบอย่างเข้มงวดเกี่ยวกับการที่ Nvidia ส่งออกชิปไปยังประเทศจีน รวมถึงบทบาทของ Megaspeed ที่อาจมีส่วนเกี่ยวข้องในการช่วยกระจายชิปของ Nvidia", "ก่อนหน้านี้ในช่วงต้นเดือนที่ผ่านมา หนังสือพิมพ์ New York Times รายงานว่าการสอบสวน Megaspeed โดยกระทรวงพาณิชย์ “ต้องหยุดชะงักลงอย่างกะทันหัน” เมื่อปลายปีที่แล้ว หลังจากที่เจ้าหน้าที่สอบสวนได้รับอีเมลจากที่ปรึกษาทั่วไปของ Nvidia ซึ่งอ้างว่า Jeffrey Kessler เจ้าหน้าที่จากกระทรวงพาณิชย์ได้อนุญาตให้ Nvidia ติดต่อประสานงานได้ โดยตามรายงานของ Times ระบุว่าคดีนี้ถูกส่งต่อไปยังกระทรวงยุติธรรมอย่าง “รวดเร็ว” ในเวลาต่อมา", "แถลงการณ์ในวันนี้ระบุว่า กระทรวงยุติธรรมได้เข้ามามี “บทบาทนำ” ในการสอบสวนคดีนี้ตั้งแต่ปีที่แล้ว โดยระบุว่า “หลังจากระบุถึงกิจกรรมที่น่าสงสัยผ่านการเฝ้าระวังเชิงรุกเกี่ยวกับการเบี่ยงเบนเส้นทางของเซมิคอนดักเตอร์ที่มีความละเอียดอ่อน กระทรวงพาณิชย์ได้เริ่มการสอบสวน Megaspeed ในปี 2024 สำหรับการละเมิดมาตรการควบคุมการส่งออกที่อาจเกิดขึ้น”", "ในเดือนพฤษภาคม 2025 เจ้าหน้าที่สอบสวนของกระทรวงพาณิชย์ได้ขอเอกสารจาก Nvidia เกี่ยวกับการขายชิปโดยตรงหรือโดยอ้อมให้กับ Megaspeed ต่อมาในเดือนมิถุนายน 2025 ทาง Nvidia ได้เพิ่มชื่อ Megaspeed เข้าไปในรายการ “ห้ามขาย” (no sell list) และจากผลการสอบสวนของกระทรวงพาณิชย์ เจ้าหน้าที่จากสำนักงานอุตสาหกรรมและความมั่นคง (Bureau of Industry and Security) ร่วมกับเจ้าหน้าที่บังคับใช้กฎหมายของสิงคโปร์ ได้เข้าตรวจสอบการใช้งานปลายทาง (end-use check) ณ สถานที่จริงของ Megaspeed ในเดือนมิถุนายน 2025 พร้อมทั้งสัมภาษณ์ Alice Huang ซีอีโอของบริษัท โดยหลังจากดำเนินการบังคับใช้กฎหมายดังกล่าว กระทรวงยุติธรรมจึงได้รับหน้าที่เป็นผู้นำในการสอบสวนคดีอาญาของ Megaspeed", "แม้แถลงการณ์จะไม่ได้ให้รายละเอียดเกี่ยวกับสถานะปัจจุบันของคดี แต่ระบุว่ากระทรวงยุติธรรมและกระทรวงพาณิชย์ “จะดำเนินการตามกฎหมายอย่างเต็มที่กับ Megaspeed สำหรับความผิดทางอาญาใดๆ ที่อาจเกิดขึ้น”"], "link": "https://www.theverge.com/policy/1035410/doj-megaspeed-nvidia-investigation-update", "canonical_link": "https://www.theverge.com/policy/1035410/doj-megaspeed-nvidia-investigation-update", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25461724/STK432_Government__CVirginia_B.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794932343, "published_at": "2026-11-17T16:19:03Z", "published_th": "17 พ.ย. 2026 • 23:19 น.", "category_hint": "Technology"}, {"id": 1794932206186, "guid": "https://www.theverge.com/?p=1035401", "original_title": "Banning phones really does help kids learn, researchers say", "thai_title": "ผลวิจัยชี้ชัด การแบนมือถือในโรงเรียนช่วยให้นักเรียนเรียนรู้ได้ดีขึ้น พร้อมเล็งใช้ข้อตกลง Meta ศึกษาผลกระทบการใช้งานนอกห้องเรียน", "tag": "Technology", "sub_tag": "POLICY", "bullet_points": ["งานวิจัยจาก Harvard และ Dartmouth พบว่าการแบนมือถือในโรงเรียนช่วยเพิ่มประสิทธิภาพการเรียนรู้ได้เทียบเท่ากับการเพิ่มเวลาเรียน 1-2 สัปดาห์ต่อปี", "การแบนมือถือถือเป็นวิธีที่คุ้มค่าเมื่อเทียบกับต้นทุนการจ้างครูเพิ่มเพื่อชดเชยเวลาเรียนที่สูญเสียไป", "นักวิจัยเตรียมใช้โอกาสจากข้อตกลงมูลค่า 1.71 หมื่นล้านดอลลาร์ของ Meta ที่จำกัดการใช้งานของเยาวชน เพื่อศึกษาผลกระทบของการใช้โซเชียลมีเดียนอกเวลาเรียนต่อผลสัมฤทธิ์ทางการศึกษา", "แม้จะมีข้อจำกัดในการเข้าถึงข้อมูล แต่การศึกษาครั้งนี้ถือเป็นโอกาสสำคัญในการพิสูจน์สมมติฐานว่าการใช้งานสมาร์ทโฟนส่งผลต่อการถดถอยทางการเรียนรู้ของเด็กอย่างไร"], "full_paragraphs": ["งานวิจัยระดับประเทศฉบับใหม่พบว่า การแบนโทรศัพท์มือถือภายในโรงเรียนสามารถนำไปสู่การพัฒนาด้านการเรียนรู้ของนักเรียนได้อย่างชัดเจน ขณะนี้นักวิจัยกำลังมุ่งเป้าไปที่การทำความเข้าใจว่า การใช้งานโทรศัพท์มือถือของเด็กๆ นอกห้องเรียนมีส่วนทำให้เกิดภาวะการเรียนรู้ถดถอย (learning loss) ที่เหลืออยู่หรือไม่ โดยจะใช้เงื่อนไขจากข้อตกลงยุติคดีมูลค่าหลายพันล้านดอลลาร์ของ Meta ที่เกิดขึ้นเมื่อช่วงต้นปีนี้เป็นเครื่องมือในการศึกษา", "การแบนโทรศัพท์มือถือในโรงเรียนมีผลลัพธ์เทียบเท่ากับการเพิ่มเวลาเรียนอีก 1 ถึง 2 สัปดาห์ต่อปีการศึกษา ซึ่งคิดเป็นประมาณครึ่งหนึ่งของภาวะการเรียนรู้ถดถอยที่นักเรียนในสหรัฐฯ ประสบในช่วงระหว่างปี 2013 ถึงช่วงการระบาดของโควิด-19 ในปี 2020 ข้อมูลดังกล่าวมาจากการศึกษาโดยนักวิจัยจากมหาวิทยาลัยฮาร์วาร์ด (Harvard University) และวิทยาลัยดาร์ทมัธ (Dartmouth College) ร่วมกับกลุ่มประเมินผลทางการศึกษา NWEA โดยได้วิเคราะห์ข้อมูลการทดสอบจากนักเรียน 3.3 ล้านคน ในโรงเรียน 4,600 แห่ง ระหว่างปีการศึกษา 2021-22 ถึง 2025-26 ซึ่งรวมถึงโรงเรียนที่มีและไม่มีการแบนโทรศัพท์มือถือ Tom Kane ผู้อำนวยการคณะกรรมการศูนย์วิจัยนโยบายการศึกษาแห่งมหาวิทยาลัยฮาร์วาร์ดกล่าวว่า แม้ผลลัพธ์จะดูไม่หวือหวา แต่ก็เป็นผลกระทบในระดับที่นักวิจัยต้องการค้นหา", "ในขณะที่การศึกษาก่อนหน้านี้เกี่ยวกับการแบนโทรศัพท์ในโรงเรียนพบผลเชิงบวกต่อผลสัมฤทธิ์ทางการเรียน แต่หลายงานวิจัยเป็นการศึกษาโรงเรียนนอกสหรัฐฯ ส่วนงานวิจัยระดับประเทศของสหรัฐฯ ก่อนหน้านี้มุ่งเน้นไปที่ผลลัพธ์ทางการเรียนตามค่าเฉลี่ยภายในโรงเรียน ในขณะที่งานวิจัยล่าสุดนี้ได้เจาะลึกถึงข้อมูลระดับนักเรียนรายบุคคล ซึ่งนักวิจัยระบุว่าช่วยให้พวกเขาสามารถควบคุมปัจจัยต่างๆ ได้มากขึ้น และสังเกตผลกระทบของการแบนในกลุ่มนักเรียนที่ประสบภาวะการเรียนรู้ถดถอยมากที่สุดหรือน้อยที่สุดได้", "นอกเหนือจากการตอบคำถามเกี่ยวกับผลกระทบของเทคโนโลยีใหม่ที่มีต่อการเรียนรู้แล้ว ผลการศึกษายังแสดงให้เห็นว่าการแบนโทรศัพท์มือถือเป็นวิธีที่คุ้มค่าในการปรับปรุงผลลัพธ์ของนักเรียน โดยนักวิจัยพบว่าการซื้อกระเป๋าเก็บมือถือแบบล็อกได้สำหรับนักเรียน 17 คนต่อห้อง จะมีค่าใช้จ่ายประมาณ 425 ดอลลาร์ต่อครูหนึ่งคน ในขณะที่การจ่ายเงินเดือนครูเฉลี่ยสำหรับการสอนเพิ่มอีกหนึ่งสัปดาห์นั้นสูงถึง 2,080 ดอลลาร์", "ผู้ปกครองและครูจำนวนมากต่างมีข้อสันนิษฐานที่แพร่หลายโดยนักวิชาการอย่าง Jonathan Haidt นักจิตวิทยาสังคมว่า โทรศัพท์มือถือและโซเชียลมีเดียส่งผลกระทบต่อการเรียนรู้และสุขภาพจิตของเด็ก แต่ Kane กล่าวว่าสิ่งสำคัญคือการที่นักวิทยาศาสตร์ต้องได้รับโอกาสในการทดสอบสมมติฐานนั้นจริงๆ ก่อนหน้านี้ Kane เคยเชื่อว่าการลดความสำคัญของการวัดผลด้วยการทดสอบในโรงเรียนสหรัฐฯ เป็นสาเหตุหลักของภาวะการเรียนรู้ถดถอย แต่เมื่อเขาศึกษาลึกลงไป เขาก็เปลี่ยนความคิดหลังจากเห็นว่าเด็กนอกสหรัฐฯ ก็ประสบภาวะนี้เช่นกัน ผ่านการศึกษานี้ Kane พบว่าส่วนใหญ่เป็นผลมาจากการใช้โทรศัพท์มือถือในโรงเรียน", "Kane รู้สึกประหลาดใจกับผลการวิจัยบางประการ เช่น การแบนในโรงเรียนให้ผลลัพธ์การเรียนรู้ที่เพิ่มขึ้นในระดับใกล้เคียงกันในกลุ่มนักเรียนทุกช่วงอายุที่มีประสบการณ์การใช้โทรศัพท์ต่างกัน และนักวิจัยไม่พบความแตกต่างอย่างมีนัยสำคัญของผลกระทบจากการแบนระหว่างนักเรียนที่มีระดับผลการเรียนต่างกัน Kane กล่าวว่าความแตกต่างระหว่างนักเรียนที่เรียนเก่งและเรียนอ่อนอาจอธิบายได้ด้วยการใช้โทรศัพท์นอกโรงเรียน และการใช้โทรศัพท์นอกโรงเรียนอาจเป็นสาเหตุของภาวะการเรียนรู้ถดถอยที่เหลืออยู่ทั้งหมด การทดสอบสมมติฐานนั้นทำได้ยากกว่ามากเพราะไม่มีการแบนการใช้โทรศัพท์นอกโรงเรียน แต่ Kane เชื่อว่านี่เป็นโอกาสครั้งหนึ่งในชีวิตที่จะได้ลองทำ", "ในช่วงฤดูร้อนนี้ Meta ได้ตกลงที่จะใช้ข้อจำกัดที่ครอบคลุมสำหรับผู้ใช้อายุต่ำกว่า 18 ปี ซึ่งเป็นส่วนหนึ่งของข้อตกลงมูลค่า 1.71 หมื่นล้านดอลลาร์กับเกือบทุกรัฐในสหรัฐฯ คาดว่าข้อจำกัดหลายประการจะมีผลบังคับใช้ในอีกไม่กี่เดือนข้างหน้า โดยจะจำกัดเวลาที่วัยรุ่นสามารถใช้บนแอปของ Meta เป็นค่าเริ่มต้น Kane เชื่อว่าสิ่งนี้อาจทำให้นักวิจัยสามารถมองเห็นภาพเปรียบเทียบก่อนและหลังผลกระทบของการใช้โซเชียลมีเดียนอกโรงเรียนได้ เช่นเดียวกับที่การแบนโทรศัพท์ในโรงเรียนช่วยให้พวกเขาศึกษาผลกระทบในห้องเรียนได้ หากนักวิจัยสามารถตรวจสอบได้ว่าวัยรุ่นใช้โซเชียลมีเดียน้อยลงจริงนอกโรงเรียน และเชื่อมโยงสิ่งนั้นกับผลสัมฤทธิ์ทางการเรียนในโรงเรียนต่างๆ ได้ ก็จะช่วยให้เข้าใจได้ดีขึ้นว่าการใช้โทรศัพท์และโซเชียลมีเดียนอกโรงเรียนส่งผลต่อภาวะการเรียนรู้ถดถอยของเด็กมากน้อยเพียงใด", "Kane ให้สัมภาษณ์กับ The Verge ว่า 'ตอนนี้เราได้เรียนรู้บางอย่างเกี่ยวกับผลกระทบของการใช้โทรศัพท์ในโรงเรียนแล้ว มันยิ่งทำให้รู้สึกหงุดหงิดที่เรารู้เรื่องผลกระทบของการใช้โทรศัพท์นอกโรงเรียนน้อยมาก เราเผชิญกับภาวะการเรียนรู้ถดถอยอย่างหนักในสหรัฐฯ มา 13 ปีแล้ว และผู้ต้องสงสัยอันดับต้นๆ ที่ผู้ปกครองหลายคนน่าจะชี้ไปที่นั่นก็คือการใช้โทรศัพท์มือถือนอกโรงเรียน'", "อย่างไรก็ตาม มีข้อจำกัดสำคัญสองประการ ข้อตกลงนี้ไม่มีวิธีง่ายๆ ในการบอกว่าวัยรุ่นใช้แพลตฟอร์มของ Meta น้อยลงจริงหรือไม่ หรือหากใช้ลดลง พวกเขาเพียงแค่ย้ายเวลาหน้าจอไปใช้แอปอื่นแทนหรือไม่ เพื่อทำความเข้าใจผลกระทบต่อผลสัมฤทธิ์ทางการเรียน นักวิจัยจำเป็นต้องเชื่อมโยงข้อจำกัดเหล่านี้กับการเปลี่ยนแปลงผลการเรียนของเด็กในโรงเรียน ข้อตกลงนี้มีแรงจูงใจให้อัยการสูงสุดทำข้อตกลงที่คล้ายกันกับ TikTok และ YouTube ซึ่งจนถึงขณะนี้ยังปฏิเสธที่จะใช้ข้อจำกัดดังกล่าว แต่หากพวกเขาทำได้ ก็จะช่วยแก้ปัญหาแรกได้ และ Kane กล่าวว่าแพลตฟอร์มต่างๆ สามารถช่วยแก้ปัญหาที่สองได้ด้วยการแบ่งปันข้อมูลที่ระบุตัวตนไม่ได้และข้อมูลรวมให้กับนักวิจัย โดยจัดกลุ่มตามโรงเรียนหรือกลุ่มย่อยอื่นๆ", "แม้จะเป็นเรื่องที่ท้าทาย แต่ Kane กล่าวว่านี่อาจเป็นโอกาสที่ดีที่สุดในการศึกษาคำถามสำคัญเกี่ยวกับผลกระทบของโซเชียลมีเดีย 'ผมใช้เวลาทั้งฤดูร้อนพยายามระบุแหล่งข้อมูลอื่นสำหรับเรื่องนี้ แต่ก็ไม่พบเลย' Kane กล่าว 'ข้อตกลงของ Meta นี้เป็นเส้นทางที่ชัดเจนที่สุดในการพยายามตอบคำถามสำคัญนั้น'", "และหากงานวิจัยแสดงให้เห็นว่าการใช้โทรศัพท์มือถือนอกโรงเรียนไม่ใช่สาเหตุหลักหรือสาเหตุทั้งหมดของการลดลงของผลสัมฤทธิ์ทางการเรียน ผลการวิจัยจะกระตุ้นให้นักวิจัยมองหาทฤษฎีอื่นๆ 'ผมมั่นใจว่ามีเรื่องเซอร์ไพรส์และคำถามที่เรายังไม่ทันได้นึกถึง' Kane กล่าว 'นั่นเป็นเหตุผลหนึ่งที่อยากรู้ เพราะผู้คนมีข้อสันนิษฐานเหล่านี้ แต่ผมมั่นใจว่าบางข้อสันนิษฐานนั้นผิด แต่เหตุผลที่สองคือเรายังไม่รู้ว่าข้อจำกัดในข้อตกลงของ Meta จะมีประสิทธิภาพจริงหรือไม่' แม้อัยการสูงสุดจะพยายามสร้างสิ่งที่พวกเขาเชื่อว่าจะเป็นเกราะป้องกันที่มีประสิทธิภาพที่สุดสำหรับข้อตกลง แต่ Kane กล่าวว่าเรายังไม่มีข้อมูลที่จะพิสูจน์ว่าการคาดการณ์เหล่านั้นจะเป็นจริงหรือไม่", "Kane กล่าวทิ้งท้ายว่า 'ผมคิดว่าหลายคนหวังว่าข้อจำกัดในการใช้โทรศัพท์มือถือหลังเลิกเรียนจะช่วยเพิ่มการมีส่วนร่วมของนักเรียน แต่เราจะไม่มีทางรู้ได้เลยหากเราไม่รวบรวมข้อมูลเหล่านี้ ข้อตกลงนี้มีกำหนดหมดอายุใน 10 ปี มาใช้เวลานี้สร้างฐานข้อมูลหลักฐานเกี่ยวกับผลกระทบของข้อจำกัดกันเถอะ'"], "link": "https://www.theverge.com/policy/1035401/school-cell-phone-ban-study-meta-settlement", "canonical_link": "https://www.theverge.com/policy/1035401/school-cell-phone-ban-study-meta-settlement", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/09/STK483_EDUCATION_D.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794931998, "published_at": "2026-11-17T16:13:18Z", "published_th": "17 พ.ย. 2026 • 23:13 น.", "category_hint": "Technology"}, {"id": 1794932206188, "guid": "https://www.theverge.com/?p=1035420", "original_title": "Jensen Huang says he’s willing to return as Nvidia CEO", "thai_title": "Jensen Huang เผยพร้อมหวนคืนตำแหน่ง CEO ของ Nvidia หากบอร์ดบริหารเห็นชอบ", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Jensen Huang ประกาศความพร้อมที่จะกลับมารับตำแหน่ง CEO ของ Nvidia อีกครั้ง หากคณะกรรมการบริษัทเห็นว่าเป็นประโยชน์ต่อผู้ถือหุ้นและพนักงาน", "การตัดสินใจดังกล่าวเกิดขึ้นท่ามกลางกระแสเรียกร้องจากพนักงาน นักลงทุน และพันธมิตรทางธุรกิจกว่า 193,000 ราย รวมถึงบุคคลสำคัญอย่าง Elon Musk และ Tim Sweeney", "Huang เพิ่งประกาศลาออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังยอมรับว่าตนไม่ซื่อสัตย์ต่อภรรยาจากกรณีความสัมพันธ์เชิงชู้สาว 3 ครั้ง", "ประธานาธิบดี Trump ได้แสดงท่าทีสนับสนุนการกลับมาของ Huang โดยระบุว่าเป็นแนวคิดที่ไม่เลว ในขณะที่ชื่อของ Tim Cook อดีต CEO ของ Apple ก็ถูกหยิบยกมาเป็นตัวเลือกสำรอง"], "full_paragraphs": ["Jensen Huang ได้ออกมากล่าวถึงสถานการณ์ล่าสุดของเขาว่า “นับตั้งแต่ที่ผมได้ลาออกไป ผมได้รับกระแสเรียกร้องอย่างล้นหลามจากพนักงานของ Nvidia นักลงทุน พันธมิตรทางธุรกิจ และลูกค้า ให้ผมกลับมาดำรงตำแหน่ง CEO อีกครั้ง” โดยเขาระบุผ่านแถลงการณ์ว่า “หากคณะกรรมการบริษัทตัดสินใจว่าการกลับมาของผมจะเป็นประโยชน์สูงสุดต่อผู้ถือหุ้น พนักงาน บริษัท และประเทศอเมริกา ผมก็รู้สึกเป็นเกียรติอย่างยิ่งที่จะตอบรับคำเรียกร้องเหล่านี้และกลับมาเป็น CEO อีกครั้ง”", "ก่อนหน้านี้ Huang ได้ประกาศลาออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากมีรายงานข่าวเกี่ยวกับความสัมพันธ์เชิงชู้สาว 3 ครั้ง ซึ่งรวมถึงความสัมพันธ์กับบุคคลที่ถูกกล่าวหาว่าเป็นสายลับชาวจีนและพนักงานภายใต้การบังคับบัญชาโดยตรงของเขา อย่างไรก็ตาม กระแสสังคมกลับพลิกผันเมื่อมีผู้คนกว่า 193,000 ราย รวมถึงซีอีโอชื่อดังอย่าง Elon Musk และ Tim Sweeney ได้ร่วมลงนามในจดหมายเรียกร้องให้ “นำตัว Jensen กลับมา”", "ในส่วนของท่าทีจากฝั่งการเมือง ประธานาธิบดี Trump ได้แสดงความเห็นสนับสนุนการกลับมาของ Huang โดยกล่าวเมื่อวานนี้ว่าการที่เขากลับมานั้น “ไม่ใช่ความคิดที่แย่อย่างแน่นอน” ทั้งนี้ มีรายงานเพิ่มเติมว่า Trump ได้มีการเสนอชื่อ Tim Cook อดีต CEO ของ Apple ให้เป็นอีกหนึ่งตัวเลือกที่เป็นไปได้สำหรับการเข้ามาบริหารงานแทน", "ย้อนกลับไปเมื่อวันที่ 8 พฤศจิกายนที่ผ่านมา Huang ได้ยอมรับผ่านบันทึกข้อความ 'เครื่องมืออเนกประสงค์แบบ Open Linux ที่สร้างขึ้นเพื่อการประมวลผลประสิทธิภาพสูงและงานด้านเครือข่าย IP' ล่าสุดทางบริษัทได้เริ่มแคมเปญระดมทุนบน Kickstarter เพื่อให้ผู้ที่สนใจสามารถสั่งจองล่วงหน้าได้ในราคา 399 ดอลลาร์ โดยคาดว่าจะเริ่มจัดส่งสินค้าได้ในช่วงเดือนกรกฎาคม 2027", "Flipper One มีราคาสูงกว่า Flipper Zero อุปกรณ์แฮ็กกิ้งไร้สายอเนกประสงค์รุ่นยอดนิยมแต่ก็เป็นที่ถกเถียงของบริษัท ซึ่งปัจจุบันวางจำหน่ายอยู่ที่ 169 ดอลลาร์ อย่างไรก็ตาม Flipper Devices ได้ชี้แจงว่า Flipper One รุ่นใหม่นี้ไม่ใช่รุ่นสืบทอดหรือรุ่นต่อยอดของ Flipper Zero แต่เป็นผลิตภัณฑ์ที่ถูกออกแบบมาให้แตกต่างกันโดยสิ้นเชิง", "ในขณะที่ความสามารถของรุ่น Zero จะเน้นไปที่ NFC, RFID, อินฟราเรด และคลื่นความถี่ไร้สาย Sub-1GHz แต่ Flipper One ที่มีขนาดใหญ่กว่ากลับมอบการเชื่อมต่อที่ขยายขีดความสามารถมากขึ้นด้วยพอร์ต Gigabit Ethernet สองช่อง, อินเทอร์เฟซ PCIe, SATA และ USB 3.0 รวมถึงรองรับ Wi-Fi 6e นอกจากนี้ยังมีช่อง M.2 สำหรับเชื่อมต่อโมดูลเสริมต่างๆ เช่น โมเด็ม 5G และวิทยุ LoRa สำหรับเครือข่าย Mesh ที่สามารถเปลี่ยน Flipper One ให้กลายเป็นวิทยุสื่อสาร (Walkie-talkie) ได้", "แม้จะมีขนาดที่ยังคงพกพาสะดวก แต่ Flipper One ขับเคลื่อนด้วยโปรเซสเซอร์ 8-core RK3576 ARM พร้อมด้วย NPU เฉพาะทาง และ GPU ที่รองรับการเชื่อมต่อกับจอแสดงผลภายนอกผ่านพอร์ต USB-C หรือ HDMI โดย Flipper Devices แนะนำว่าอุปกรณ์รุ่นนี้สามารถใช้งานได้หลากหลาย ตั้งแต่เป็นเครื่องมือวินิจฉัยระบบเครือข่ายไปจนถึงเครื่องเล่นสื่อเมื่อเชื่อมต่อกับทีวี", "อุปกรณ์รุ่นนี้รันบน Flipper OS ซึ่งมีพื้นฐานมาจาก Debian Linux และมาพร้อมกับ Open-source firmware เพื่อให้ผู้ใช้งานสามารถพัฒนาแอปพลิเคชัน เครื่องมือ และรูปแบบการใช้งานเฉพาะตัวสำหรับอุปกรณ์นี้ได้ด้วยตนเอง"], "link": "https://www.theverge.com/tech/1034392/flipper-devices-one-zero-pocket-linux-computer-multi-tool-preorder-kickstarte", "canonical_link": "https://www.theverge.com/tech/1034392/flipper-devices-one-zero-pocket-linux-computer-multi-tool-preorder-kickstarte", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/flipperone1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/flipperone2.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/flipperone3.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794931200, "published_at": "2026-11-17T16:00:00Z", "published_th": "17 พ.ย. 2026 • 23:00 น.", "category_hint": "Technology"}, {"id": 1795019508259, "guid": "https://www.theverge.com/?p=1035159", "original_title": "Windows 11 actually runs better on 8GB of RAM now", "thai_title": "Windows 11 ทำงานได้ลื่นไหลขึ้นบน RAM 8GB แล้ว หลัง Microsoft ปรับจูนระบบครั้งใหญ่", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Microsoft อัปเดต Windows 11 เพื่อเพิ่มประสิทธิภาพการจัดการหน่วยความจำ ช่วยให้เครื่องที่มี RAM 8GB ทำงานได้ดีขึ้นอย่างเห็นได้ชัด", "การปรับปรุงใหม่ช่วยให้ระบบเก็บข้อมูลสำคัญไว้ใน RAM ได้มากขึ้นถึง 2GB ลดการดึงข้อมูลจาก SSD ซึ่งเป็นสาเหตุหลักของอาการเครื่องหน่วง", "ผลการทดสอบจริงบน Surface Laptop พบว่าอาการค้างและปัญหาหน้าเว็บรีเฟรชเองลดลงอย่างมาก แม้จะเปิดใช้งานหลายโปรแกรมพร้อมกัน", "แม้ประสิทธิภาพจะดีขึ้น แต่ผู้เชี่ยวชาญยังคงแนะนำว่า RAM 16GB เป็นตัวเลือกที่เหมาะสมกว่าสำหรับการใช้งานในระยะยาว"], "full_paragraphs": ["เมื่อช่วงต้นปีที่ผ่านมา RAM ขนาด 16GB เคยเป็นมาตรฐานทั่วไปสำหรับแล็ปท็อป Windows ในราคาต่ำกว่า 800 ดอลลาร์ ซึ่งช่วยชดเชยความรู้สึกอืดอาดของ Windows 11 ที่ดูเหมือนจะกินทรัพยากรมากขึ้นเรื่อยๆ แต่ด้วยราคา RAM ที่พุ่งสูงขึ้นในปีนี้ ทำให้ขนาด 8GB กลับมาเป็นสเปกเริ่มต้นที่พบเห็นได้ทั่วไปอีกครั้ง แม้ว่า MacBook รุ่นใหม่จะยังคงจัดการกับ RAM ขนาดนี้ได้ดี แต่แล็ปท็อป Windows รวมถึง Surface Laptop ขนาด 13 นิ้วของ Microsoft เองกลับประสบปัญหาอย่างหนัก อย่างไรก็ตาม ดูเหมือนว่าความพยายามของ Microsoft ในการทำให้ Windows ทำงานได้รวดเร็วและเสถียรขึ้นก่อนที่จะเกิดวิกฤตราคา RAM จะเริ่มเห็นผลลัพธ์ที่ชัดเจนแล้วในขณะนี้", "เมื่อต้นเดือนที่ผ่านมา Pavan Davuluri รองประธานบริหารฝ่าย Windows และอุปกรณ์ของ Microsoft ได้เปิดเผยรายละเอียดผ่านบล็อกโพสต์เกี่ยวกับสิ่งที่บริษัทได้ปรับปรุงใน Windows 11 เพื่อแก้ปัญหาข้อจำกัดของพีซีที่มี RAM 8GB โดย Davuluri ระบุว่า “ปัจจุบัน Windows ตอบสนองได้รวดเร็วขึ้นสูงสุด 20% และการทำงานแบบมัลติทาสก์เร็วขึ้นสูงสุด 40% ในการทดสอบในห้องปฏิบัติการของเรา”", "การเปลี่ยนแปลงที่สำคัญที่สุดคือการจัดการหน่วยความจำ (Memory Management) เมื่อหน่วยความจำไม่เพียงพอต่อการจัดการข้อมูลที่ใช้งานอยู่ ระบบจำเป็นต้องย้ายข้อมูลบางส่วน (หรือที่เรียกว่า “paged out”) ไปยังพื้นที่จัดเก็บข้อมูล ซึ่ง SSD โดยเฉพาะในแล็ปท็อปรุ่นประหยัดนั้นมีความเร็วต่ำกว่า RAM มาก", "เมื่อ Windows จำเป็นต้องเข้าถึงข้อมูลที่ถูกย้ายจาก RAM ไปยัง SSD จะเกิดสิ่งที่เรียกว่า Hard fault (หรือ Page fault) หากเหตุการณ์นี้เกิดขึ้นบ่อยครั้ง เช่น ในแล็ปท็อปที่มี RAM เพียง 8GB จะนำไปสู่อาการหน่วงเล็กๆ น้อยๆ เช่น แท็บเบราว์เซอร์ที่ต้องรีเฟรชใหม่ก่อนที่คุณจะเข้าถึงได้อีกครั้ง Davuluri กล่าวว่า “ตอนนี้ Windows สามารถเก็บข้อมูลที่ใช้งานอยู่ไว้ในหน่วยความจำได้มากขึ้นถึง 2GB แทนที่จะย้ายไปไว้ในพื้นที่จัดเก็บข้อมูลที่ช้ากว่า ดังนั้นแอปหรือแท็บที่คุณเปิดทิ้งไว้จึงมีโอกาสน้อยลงที่จะต้องโหลดใหม่เมื่อคุณกลับมาใช้งาน”", "เพื่อทดสอบเรื่องนี้ ผมได้นำ Surface Laptop ขนาด 13 นิ้วรุ่นเดิมที่มี RAM 8GB ซึ่งผมเคยรีวิวไปเมื่อเดือนกรกฎาคมที่ผ่านมากลับมาทดสอบอีกครั้ง ในตอนนั้นผมเคยประกาศว่า 8GB นั้นไม่เพียงพอสำหรับ Windows แล็ปท็อปเครื่องนี้ถือเป็นหนึ่งในตัวอย่างที่เลวร้ายที่สุดของผลกระทบจากวิกฤต RAM ในปัจจุบัน ด้วย RAM ที่น้อยกว่ารุ่นเริ่มต้นของปีที่แล้วถึงครึ่งหนึ่ง ทำให้มันแทบจะรับมือกับภาระงานปกติของผมไม่ไหว และนี่คือฮาร์ดแวร์ของ Microsoft เอง", "ก่อนที่จะอัปเดต Surface เป็น Windows 11 เวอร์ชันล่าสุด ผมได้ลองใช้งานแล็ปท็อปเครื่องนี้กับ Windows เวอร์ชันเดิมที่ผมเคยใช้ (25H2, build 26200.8875) ซึ่งผลลัพธ์นั้นย่ำแย่มาก การเปิดแท็บประมาณ 20 แท็บ (บน Chrome เวอร์ชันล่าสุด) พร้อมกับสตรีมวิดีโอ YouTube ความละเอียด 4K และใช้งาน Slack กับ Signal ทำให้ทุกอย่างตั้งแต่การคลิกแท็บไปจนถึงการปัดนิ้วผ่านทัชแพดรู้สึกหน่วงไปหมด แท็บ Chrome และแอปต่างๆ จะรีเฟรชตัวเองหลังจากปล่อยทิ้งไว้เบื้องหลังเพียงครู่เดียว เมื่อคุณทำงานหลายอย่างพร้อมกันและสลับไปมาระหว่างหลายแท็บ เช่น ในขณะที่กำลังค้นหาข้อมูล การรีเฟรชเหล่านี้ก็น่าหงุดหงิดอย่างยิ่ง และพัดลมก็ทำงานเสียงดังตลอดเวลา การเปิด Resource Monitor ทิ้งไว้แสดงให้เห็นว่ามี Hard fault เกิดขึ้นตั้งแต่ 700 ครั้งต่อวินาที ไปจนถึง 29,000 ครั้งต่อวินาที ซึ่งเป็นช่วงที่ Windows แทบจะหยุดทำงาน การเห็นตัวเลขนี้พุ่งทะลุชาร์ตแสดงให้เห็นว่า Windows 11 จัดการหน่วยความจำบน RAM 8GB ได้แย่เพียงใดก่อนการอัปเดต", "ปัจจุบัน หลังจากอัปเดต Surface Laptop เป็น Windows 11 เวอร์ชัน 26H2, build 26300.9974 (การปรับปรุงหน่วยความจำเริ่มมีผลตั้งแต่ build 26300.9818 เป็นต้นไป) สถานการณ์ดีขึ้นมาก ผมเปิดแท็บ Chrome มากกว่า 30 แท็บขณะสตรีมวิดีโอ YouTube 4K ตัวเดิมและใช้งานแอปแชทตัวเดิม Windows มีอาการช้าลงบ้าง แต่ไม่ใกล้เคียงกับความย่ำแย่ก่อนหน้านี้ ผมรู้สึกได้ว่าฟีเจอร์อย่าง Task View ตอบสนองช้าลงเล็กน้อยและมีอาการกระตุกบ้างในบางครั้ง แต่นั่นเป็นสิ่งที่คาดหวังได้เมื่อระบบต้องรับภาระหนัก แท็บ Chrome ต้องการการรีเฟรชน้อยลง พัดลมก็ใช้เวลานานขึ้นกว่าจะเริ่มทำงาน และทำงานเงียบลงรวมถึงใช้เวลาสั้นลงเมื่อพัดลมหมุน", "จากการตรวจสอบ Resource Monitor อีกครั้ง พบว่า Hard fault ในการใช้งานปกติลดลงเหลือต่ำกว่า 300 ครั้งต่อวินาที โดยมีการกระโดดขึ้นไปที่ประมาณ 1,000 ครั้งเป็นครั้งคราว ประสิทธิภาพดียิ่งขึ้นไปอีกเมื่อผมเปลี่ยนจาก Chrome มาใช้ Microsoft Edge ซึ่ง Edge ให้ความรู้สึกตอบสนองได้ดีกว่าภายใต้ภาระงานหนัก และมี Hard fault น้อยกว่าเมื่อเปิด 30 แท็บ พร้อมวิดีโอ YouTube 4K และการประชุมผ่าน Google Meet", "ผมรู้สึกยินดีที่เห็นว่า Surface Laptop รุ่น RAM 8GB มีประสิทธิภาพดีขึ้น และผมก็โล่งใจที่ Windows 11 เริ่มดูมีความเป็นไปได้มากขึ้นบน RAM ขนาด 8GB (แม้ว่าจะเป็นเรื่องน่าเสียดายที่ Surface Laptop รุ่น 8GB มีราคาแพงกว่ารุ่น 16GB ของปีที่แล้วก็ตาม) ผมอยากได้ RAM 8GB ในแล็ปท็อปที่ผมจะซื้อเองหรือไม่? คำตอบคือไม่", "อย่างที่ผมเคยกล่าวไว้ตอนรีวิว Dell XPS 13 รุ่นล่าสุด ผมชื่นชมที่ 8GB สามารถใช้งานได้จริง และน่าจะเพียงพอสำหรับความต้องการพื้นฐานในปัจจุบัน แต่ผมยังคงแนะนำให้เลือก 16GB หากทำได้ พื้นที่หน่วยความจำที่เหลือเฟือจะช่วยให้เครื่องทำงานได้รวดเร็วไปอีกนาน โดยเฉพาะหลังจากที่คุณเริ่มใช้งานคอมพิวเตอร์ไปนานๆ จนมีไฟล์ แอป หรือเกมจำนวนมาก และแม้ว่า Surface Laptop รุ่น 8GB จะดีขึ้นมาก แต่ผมก็ยังสามารถทำให้ Chrome ค้างไปได้ทั้งหมดด้วยการเปิดแท็บไม่ถึง 36 แท็บ Microsoft ได้ปรับปรุงแล็ปท็อปรุ่นเริ่มต้นของตนให้ดีขึ้นแล้ว แต่มันก็ไม่ใช่ปาฏิหาริย์", "วิกฤต RAM ที่เรากำลังเผชิญทำให้การใช้ชีวิตด้วยหน่วยความจำที่น้อยลงกลายเป็นความจริงที่โหดร้าย แน่นอนว่า Microsoft มีส่วนต้องรับผิดชอบในเรื่องนี้ และบริษัทก็ไม่ได้ช่วยให้สถานการณ์ดีขึ้นด้วยฟีเจอร์ที่ยัดเยียดเข้ามาใน Windows 11 ยุค Copilot / AI ในขณะที่ OS อื่นๆ เช่น Linux, macOS และ ChromeOS สามารถจัดการกับทรัพยากรที่น้อยกว่าได้ดีกว่า อย่างไรก็ตาม ผมดีใจที่ได้เห็น Microsoft พยายามแก้ไขสถานการณ์ในจุดนี้แม้เพียงเล็กน้อยก็ตาม"], "link": "https://www.theverge.com/tech/1035159/windows-11-8gb-ram-updates-performance-improvements-surface-laptop-testing", "canonical_link": "https://www.theverge.com/tech/1035159/windows-11-8gb-ram-updates-performance-improvements-surface-laptop-testing", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/268655_Microsoft_Surface_Laptop_13-inch_8GB_2026_review_ADiBenedetto_0018.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/268655_Microsoft_Surface_Laptop_13-inch_8GB_2026_review_ADiBenedetto_0015.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Screenshot-2026-11-12-115533.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Screenshot-2026-11-13-134946.png?quality=90&strip=all&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Screenshot-2026-11-16-141502.png?quality=90&strip=all&w=1200"], "videos": [], "review_score": "", "published_ts": 1794924000, "published_at": "2026-11-17T14:00:00Z", "published_th": "17 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1795019508262, "guid": "https://www.theverge.com/?p=1035027", "original_title": "Tech leaders are convinced that Jensen Huang’s exit was a plot against him", "thai_title": "เหล่าผู้นำวงการเทคโนโลยีเชื่อมั่น การลาออกของ Jensen Huang คือแผนการจัดฉาก", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Jensen Huang ลาออกจาก Nvidia หลังดำรงตำแหน่งมานานกว่า 33 ปี ท่ามกลางข้อครหาเรื่องความสัมพันธ์ส่วนตัวและประเด็นสายลับจีน", "บุคคลสำคัญในวงการเทคโนโลยีอย่าง David Sacks และ Tim Sweeney ตั้งข้อสงสัยต่อรายงานข่าวของ The New York Times โดยมองว่าเรื่องราวสายลับอาจถูกกุขึ้นเพื่อบีบให้ Huang ออกจากตำแหน่ง", "มีการตั้งข้อสังเกตว่าการลาออกของ Huang อาจเกี่ยวข้องกับความพยายามผลักดันกฎหมายควบคุมการส่งออกชิป AI (RASA) ที่เขามีจุดยืนคัดค้าน", "กลุ่มผู้บริหารระดับสูงกว่า 185,000 คน รวมถึง Elon Musk และ Travis Kalanick ร่วมลงชื่อในจดหมาย 'Stand with Jensen' เรียกร้องให้มีการตรวจสอบข้อเท็จจริงและคืนตำแหน่งให้เขา"], "full_paragraphs": ["การลาออกอย่างกะทันหันของ Jensen Huang จาก Nvidia หลังจากดำรงตำแหน่งมานานกว่า 33 ปี ได้สร้างแรงสั่นสะเทือนไปทั่วอุตสาหกรรมเทคโนโลยี ขณะนี้บุคคลสำคัญในวงการกำลังเรียกร้องให้มีการคืนตำแหน่งให้กับ Huang และหลายคนเริ่มคล้อยตามทฤษฎีที่กำลังแพร่สะพัดไปทั่ว Silicon Valley ว่าเรื่องอื้อฉาวนี้เป็นผลมาจากแผนการจัดฉากเพื่อกำจัดอดีตซีอีโอรายนี้", "หัวใจสำคัญของทฤษฎีนี้มาจากรายงานของ The New York Times ที่ระบุว่า Alice Huang อดีตผู้บริหารของ Megaspeed ซึ่งเป็นหนึ่งในผู้หญิงหลายคนที่ Jensen Huang ถูกกล่าวหาว่ามีความสัมพันธ์ด้วยนั้น เป็นสายลับของจีน อย่างไรก็ตาม หน่วยงานของสหรัฐฯ ยังไม่ได้ยืนยันข้อเท็จจริงดังกล่าว และประธานาธิบดี Donald Trump ก็อ้างว่าเขาไม่ทราบเรื่องข้อกล่าวหาการเป็นสายลับใดๆ ทั้งสิ้น ความสัมพันธ์ที่ถูกกล่าวหาของ Jensen Huang กับ Alice Huang เป็นชนวนเหตุที่นำไปสู่การลาออกของเขา โดยรายงานในเวลาต่อมายังระบุว่าเขามีความสัมพันธ์กับพนักงานของ Nvidia อีกสองคน ซึ่งรวมถึงผู้ใต้บังคับบัญชาโดยตรงของเขาด้วย การเปิดเผยนี้ก่อให้เกิดคำถามใหม่ว่าลูกค้าของ Nvidia รวมถึง Megaspeed ได้แอบส่งชิปไปยังประเทศจีนเพื่อหลบเลี่ยงข้อจำกัดการส่งออกหรือไม่ โดยเมื่อปีที่แล้ว Bloomberg รายงานว่า Nvidia ได้เข้าไปแทรกแซงการสอบสวนการลักลอบขนชิปที่เกี่ยวข้องกับบริษัทในสิงคโปร์แห่งหนึ่ง", "David Sacks นักลงทุนร่วมลงทุน (Venture Capitalist) และอดีตที่ปรึกษาด้าน AI และ Crypto ของทำเนียบขาว ได้แสดงความชัดเจนว่าเขารู้สึกกังขาต่อรายงานของ The New York Times โดยในโพสต์บน X (Twitter เดิม) Sacks ได้อ้างถึงบทความจาก CNN ซึ่งระบุว่าเจ้าหน้าที่สหรัฐฯ ยังไม่สามารถยืนยันได้ว่า Alice Huang เป็นสายลับจริงหรือไม่ Sacks เขียนว่า “เรื่องราวสายลับกำลังพังทลายลงแล้ว” เขายังคงตั้งคำถามเกี่ยวกับข้อกล่าวหาเรื่องสายลับระหว่างงาน Silicon Valley & The World ของ Semafor เมื่อวันจันทร์ที่ผ่านมา โดยกล่าวว่า “เหตุผลที่ Jensen ต้องเสียงานไปก็เพราะข้อกล่าวหาเรื่องสายลับจีนที่ฟังดูน่าตื่นเต้นนี้ ดังนั้นหากไม่มีใครกล้ายืนยันเรื่องนี้ในตอนนี้ ผมก็ขอตั้งคำถามว่าเหตุการณ์ทั้งหมดนี้เกิดขึ้นได้อย่างไร”", "Tim Sweeney ซีอีโอของ Epic Games ได้แสดงความกังวลในทำนองเดียวกันเกี่ยวกับวิธีการที่การลาออกของ Huang ดำเนินไป โดยในการตอบกลับโพสต์ของ Sacks เกี่ยวกับบทความของ CNN, Sweeney กล่าวว่า “อะไรนะ?! ดังนั้นนักข่าวที่มีแรงจูงใจไม่โปร่งใสจึงนำข่าวลือจากใครก็ไม่รู้ (ล็อบบี้ยิสต์หรือเปล่า?) มานำเสนอเป็นข้อเท็จจริงที่อ้างแหล่งข่าวจากเจ้าหน้าที่ข่าวกรอง และปั่นหัวบอร์ดบริหารของ Nvidia เพื่อบีบให้ผู้ก่อตั้ง ซีอีโอ และวิสัยทัศน์ระดับหนึ่งในรุ่นคนนี้ต้องออกไปอย่างนั้นหรือ?” ในขณะที่ Amjad Masad ซีอีโอของ Replit แพลตฟอร์มสร้างแอปและเว็บไซต์ AI กล่าวว่าช่วงเวลาการลาออกของ Huang นั้น “น่าสงสัย” พร้อมเสริมว่า “หาก Jensen ซึ่งเป็นแชมป์เปี้ยนตัวยงของโมเดลแบบ Open-source ถูกกำจัดออกไป ใครก็ตามที่ต้องการให้ AI ปิดกั้น รวมศูนย์ และอยู่ภายใต้การควบคุม ก็อาจได้รับประโยชน์จากเรื่องนี้”", "SemiAnalysis บริษัทวิจัยและที่ปรึกษาสำหรับอุตสาหกรรมเซมิคอนดักเตอร์และ AI ได้โพสต์ “ทฤษฎีสมคบคิดเกี่ยวกับสถานการณ์นี้” โดยคาดการณ์ว่าการกำจัด Huang ออกไปเป็นวิธีหนึ่งในการ “กำจัดฝ่ายค้านต่อร่างกฎหมายควบคุมการส่งออกไปยังจีนที่เข้มงวดอย่างยิ่ง” ซึ่งหมายถึงกฎหมาย Remote Access Security Act (RASA) โดยร่างกฎหมายดังกล่าวที่ Huang เคยคัดค้าน จะขยายขอบเขตการควบคุมการส่งออก AI ไปยังเซิร์ฟเวอร์คลาวด์ที่อนุญาตให้บริษัทในประเทศที่ถูกจำกัดสามารถเช่าการเข้าถึงชิป AI ของ Nvidia ได้ ทั้งนี้ กระทรวงพาณิชย์สหรัฐฯ ได้ออกกฎระเบียบชั่วคราวฉบับสุดท้ายเมื่อวันจันทร์ที่ผ่านมาเพื่อพยายามอุดช่องโหว่นี้", "ผู้คนกว่า 185,000 คน รวมถึง Sweeney, Masad, Elon Musk, Travis Kalanick ผู้ร่วมก่อตั้ง Uber, Garry Tan ซีอีโอของ Y Combinator และ Tobias Lütke ซีอีโอของ Shopify ได้ร่วมลงนามในจดหมาย “Stand with Jensen” เพื่อเรียกร้องให้เขากลับมาดำรงตำแหน่งซีอีโออีกครั้ง จดหมายฉบับดังกล่าวยังเรียกร้องให้มีการตรวจสอบสถานการณ์รอบการลาออกของ Huang อย่างใกล้ชิดยิ่งขึ้น โดยระบุว่า “เรายังไม่เห็นหลักฐานที่ยืนยันข้อกล่าวหาที่ว่าผู้หญิงที่เป็นศูนย์กลางของความขัดแย้งนี้เป็นสายลับ” และเสริมว่า “ความสงสัยหรือความเกี่ยวข้องเพียงอย่างเดียวไม่ใช่พื้นฐานที่เพียงพอสำหรับการยุติความเป็นผู้นำของ Jensen การสอบสวนต้องสร้างขึ้นจากข้อเท็จจริง ไม่ใช่เพียงเพื่อสร้างความชอบธรรมให้กับผลลัพธ์ที่ถูกกำหนดไว้แล้วเท่านั้น”"], "link": "https://www.theverge.com/tech/1035027/tech-leaders-nvidia-jensen-huang-theories", "canonical_link": "https://www.theverge.com/tech/1035027/tech-leaders-nvidia-jensen-huang-theories", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2299645290.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794871054, "published_at": "2026-11-16T23:17:34Z", "published_th": "17 พ.ย. 2026 • 06:17 น.", "category_hint": "Technology"}, {"id": 1795019587617, "guid": "https://9to5mac.com/?p=1081239", "original_title": "Deals: All MacBook Neo models now on sale from $649, AirTag 2 $17.50 each, Apple Watch $199, Alpine Loop, more", "thai_title": "ดีลเดือดรับ Black Friday! Amazon หั่นราคา MacBook Neo เริ่มต้น $649 พร้อมลดกระหน่ำ Apple Watch Series 12 และ AirPods Pro 3", "tag": "Gadgets", "sub_tag": "AUDIO", "bullet_points": ["Amazon จัดโปรโมชันต้อนรับเทศกาล Black Friday ลดราคา MacBook Neo ทุกสีและทุกความจุ เริ่มต้นเพียง $649", "Apple Watch Series 12 ปรับลดราคาลงสูงสุดถึง $70 ในทุกรุ่น รวมถึงรุ่น Ceramic และรุ่น GPS + Cellular", "AirPods Pro 3 ลดราคาพิเศษเหลือเพียง $179 (ลด $70) ซึ่งถือเป็นราคาที่ต่ำที่สุดเท่ ่ถูกส่งออกจากอุปกรณ์ของคุณ'", "หาก iPhone Duo ไม่ได้ถูกใช้งานเป็นเวลา 45 นาทีขึ้นไป ระบบ Face unlock จะไม่ทำงานและคุณจำเป็นต้องยืนยันตัวตนผ่าน Touch ID หรือรหัสผ่านแทน อย่างไรก็ตาม สำหรับผู้ใช้ส่วนใหญ่ นี่อาจหมายถึงการใช้ Touch ID ในช่วงเช้าหลังจากตื่นนอน แล้วจึงใช้ Face unlock ในการใช้งานตลอดทั้งวันที่เหลือ", "นอกจากนี้ ใน iOS 27.3 ยังสามารถเปิดใช้งานฟีเจอร์ Attention Aware ได้ ซึ่งฟีเจอร์นี้จะใช้งานได้ทั้งในกรณีที่คุณเปิดหรือปิดระบบ Face unlock แต่จะจำกัดอยู่เฉพาะบนหน้าจอด้านนอกเท่านั้น เมื่อเปิดใช้งานแล้ว ระบบจะสามารถลดระดับเสียงของนาฬิกาปลุกและตัวจับเวลาโดยอัตโนมัติ รวมถึงป้องกันไม่ให้หน้าจอดับลง และอื่นๆ อีกมากมาย", "สำหรับฟีเจอร์ Reachability ที่ปกติมีให้ใช้งานใน iPhone รุ่นอื่นๆ เพื่อเลื่อนเนื้อหาบนหน้าจอลงมาด้านล่างเพื่อให้ใกล้นิ้วโป้งมากขึ้นนั้น ใน iPhone Duo บน iOS 27.3 ทาง Apple ได้เพิ่มลูกเล่นใหม่ที่แตกต่างออกไป โดยแทนที่จะช่วยให้เข้าถึงเนื้อหาในแนวตั้ง ระบบ Reachability บน iPhone Duo จะทำงานในแนวนอนแทน", "หากคุณกำลังใช้งานหน้าจอด้านนอกแล้วพบว่าปุ่มหรือองค์ประกอบ UI ต่างๆ อยู่ไกลเกินเอื้อม คุณสามารถปัดจากด้านข้างเพื่อให้เนื้อหาบนหน้าจอเลื่อนเข้ามาใกล้กับนิ้วโป้งของคุณมากขึ้น ทั้งนี้ คุณสามารถปิดการใช้งาน Reachability ได้เสมอหากพบว่ามีการเรียกใช้งานโดยไม่ได้ตั้งใจบ่อยครั้ง แต่สำหรับผู้ที่ประสบปัญหาในการใช้งาน iPhone Duo ด้วยมือเดียว ฟีเจอร์นี้ถือเป็นตัวเลือกใหม่ที่ยอดเยี่ยม", "ในส่วนของพฤติกรรมเมื่อพับหน้าจอ iPhone Duo นั้น Apple พบว่าผู้ใช้มีความต้องการที่แตกต่างกัน บางคนต้องการให้ iPhone ยังคงปลดล็อกอยู่เพื่อใช้งานต่อเนื่อง ในขณะที่บางคนต้องการให้เครื่องล็อกอัตโนมัติเมื่อพับหน้าจอ ใน iOS 27.3 Apple จึงได้เพิ่มการตั้งค่าใหม่เพื่อให้ผู้ใช้สามารถเลือกพฤติกรรมที่ต้องการได้", "โดยค่าเริ่มต้น iPhone Duo จะยังคงทำงานเหมือนเดิมคือยังคงปลดล็อกอยู่หลังจากพับหน้าจอ แต่ในเมนู Settings ⇾ Display & Brightness ของ iOS 27.3 จะมีตัวเลือกให้ตั้งค่าล็อกอัตโนมัติเมื่อพับหน้าจอได้ ซึ่งก่อนหน้านี้ผู้ใช้สามารถทำได้ผ่านแอป Shortcuts แต่ตอนนี้ได้กลายเป็นฟีเจอร์ที่มีมาให้ในระบบโดยตรง", "แม้จะไม่ใช่ 'ฟีเจอร์ใหม่' โดยตรง แต่ผู้ใช้ iPhone Duo จะพบว่าคีย์บอร์ดของระบบมีการเปลี่ยนแปลงใน iOS 27.3 โดย Apple ได้ปรับแต่งคีย์บอร์ดบนหน้าจอด้านนอกให้ปุ่มต่างๆ ขยับเข้าใกล้กันมากขึ้น เพื่อให้การใช้งานด้วยมือเดียวทำได้ง่ายยิ่งขึ้น"], "link": "https://9to5mac.com/2026/11/18/iphone-duo-is-getting-three-new-features-in-ios-27-3/", "canonical_link": "https://9to5mac.com/2026/11/18/iphone-duo-is-getting-three-new-features-in-ios-27-3", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2027/10/iphone-duo-18.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795017333, "published_at": "2026-11-18T15:55:33Z", "published_th": "18 พ.ย. 2026 • 22:55 น.", "category_hint": "Gadgets"}, {"id": 1795018548529, "guid": "https://9to5google.com/?p=738419", "original_title": "Google Wallet may soon be able to store your Social Security card", "thai_title": "Google Wallet เตรียมรองรับการจัดเก็บข้อมูลบัตรประกันสังคม (Social Security Card) ในอนาคต", "tag": "Gadgets", "sub_tag": "SMART HOME", "bullet_points": ["Google Wallet กำลังพัฒนาฟีเจอร์ใหม่เพื่อรองรับการจัดเก็บข้อมูลบัตรประกันสังคม (Social Security Card) ในรูปแบบดิจิทัล", "มีการตรวจพบโค้ดที่อ้างอิงถึง 'Social Security Number' ภายใน Google Play Services เวอร์ชัน 26.46.30", "ฟีเจอร์นี้อาจครอบคลุมถึงการดูข้อมูลสิทธิประโยชน์ต่างๆ เช่น เงินเกษียณอายุ, ประกันทุพพลภาพ, และข้อมูล Medicare", "ปัจจุบัน Google Wallet สามารถจัดเก็บพาสปอร์ตและใบขับขี่ดิจิทัลในบางรัฐของสหรัฐอเมริกาได้แล้ว"], "full_paragraphs": ["Google Wallet กำลังเตรียมยกระดับการเป็นกระเป๋าเงินดิจิทัลไปอีกขั้น ด้วยการเตรียมเพิ่มฟีเจอร์รองรับการจัดเก็บข้อมูลบัตรประกันสังคม (Social Security Card) ของผู้ใช้งาน ซึ่งถือเป็นการขยายขีดความสามารถในการจัดเก็บเอกสารระบุตัวตนดิจิทัลให้ครอบคลุมมากยิ่งขึ้น", "ในปัจจุบัน ผู้ใช้งานในสหรัฐอเมริกาสามารถจัดเก็บข้อมูลพาสปอร์ตหรือใบขับขี่ดิจิทัลของบางรัฐไว้ใน Google Wallet ได้อยู่แล้ว แต่ดูเหมือนว่า Google จะไม่หยุดอยู่เพียงแค่นั้น โดยข้อมูลล่าสุดจากโค้ดในแอปพลิเคชันเวอร์ชันอัปเดตใหม่บ่งชี้ว่า ทางบริษัทกำลังเตรียมการรองรับการจัดเก็บสำเนาดิจิทัลของบัตรประกันสังคมด้วยเช่นกัน", "ทีมงานจาก Android Authority ได้ตรวจพบการอ้างอิงที่ชัดเจนถึงคำว่า “Social Security Number” ภายใน Google Play Services เวอร์ชัน 26.46.30 ซึ่งมีความเชื่อมโยงโดยตรงกับ Google Wallet โดยมีการระบุข้อความในโค้ดว่า <string name=”pay_id_uhura_visible_name”>Social Security Number<\/string>", "แม้ว่าในขณะนี้รายละเอียดการทำงานที่แน่ชัดของฟีเจอร์ดังกล่าวยังไม่ถูกเปิดเผยออกมาทั้งหมด แต่ดูเหมือนว่าฟีเจอร์นี้จะรวมถึงการรองรับการดูข้อมูลสิทธิประโยชน์จากประกันสังคม หรืออย่างน้อยที่สุดคือการบันทึกข้อมูลสิทธิประโยชน์เหล่านั้นในรูปแบบดิจิทัล", "นอกจากนี้ ยังมีการตรวจพบการกล่าวถึงข้อมูลประเภทต่างๆ เช่น เงินเกษียณอายุ (Retirement), เงินสำหรับผู้รอดชีวิต (Survivors), ประกันทุพพลภาพ (Disability Insurance หรือ RSDI), เงินช่วยเหลือเพิ่มเติม (Supplemental Security Income), ข้อมูล Medicare รวมถึงรายละเอียดเกี่ยวกับเงื่อนไขการหักเงินและวันที่ที่มีผลบังคับใช้ ซึ่งบ่งชี้ว่า Google Wallet อาจกลายเป็นศูนย์กลางในการจัดการข้อมูลสวัสดิการรัฐที่สำคัญของผู้ใช้งานในอนาคต"], "link": "https://9to5google.com/2026/11/18/google-wallet-may-soon-be-able-to-store-your-social-security-card/", "canonical_link": "https://9to5google.com/2026/11/18/google-wallet-may-soon-be-able-to-store-your-social-security-card", "cover_image_url": "https://9to5google.com/wp-content/uploads/sites/4/2026/03/google-wallet-1.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795016400, "published_at": "2026-11-18T15:40:00Z", "published_th": "18 พ.ย. 2026 • 22:40 น.", "category_hint": "Gadgets"}, {"id": 1795016803022, "guid": "https://9to5google.com/?p=738329", "original_title": "Could Meta fix its glasses privacy issues with an LED redesign?", "thai_title": "Meta เตรียมปรับดีไซน์ไฟ LED บนแว่นตาอัจฉริยะ หวังแก้ปัญหาภาพลักษณ์ด้านความเป็นส่วนตัว", "tag": "Gadgets", "sub_tag": "WEARABLES", "bullet_points": ["Meta เผชิญกับกระแสวิพากษ์วิจารณ์อย่างหนักเกี่ยวกับแว่นตาอัจฉริยะที่ถูกนำไปใช้ในทางที่ผิด จนได้รับฉายาในโซเชียลมีเดียว่า 'แว่นตาถ้ำมอง'", "ปัญหาหลักเกิดจากการที่ผู้ใช้งานบางรายพยายามปิดการทำงานของไฟ LED แจ้งเตือนการบันทึกภาพ ทำให้ Meta ต้องออกแพตช์ซอฟต์แวร์เพื่อป้องกันการดัดแปลง", "มีการตั้งข้อสังเกตว่าดีไซน์ที่เน้นความสมมาตรและซ่อนกล้องของ Meta ทำให้ดูเหมือนแว่นตาปกติเกินไปจนขาดความโปร่งใส", "คู่แข่งอย่าง Samsung ที่ร่วมมือกับ Gentle Monster และ Warby Parker เลือกใช้ดีไซน์ที่ไฟ LED แตกต่างจากตัวกล้องอย่างชัดเจน ซึ่งอาจเป็นแนวทางที่ช่วยสร้างความเชื่อมั่นด้านความเป็นส่วนตัวได้มากกว่า"], "full_paragraphs": ["การแข่งขันในตลาดแว่นตาอัจฉริยะกำลังทวีความรุนแรงขึ้นเรื่อยๆ เมื่อ Meta และ Samsung กำลังเตรียมตัวเผชิญหน้ากันโดยตรงในสมรภูมินี้ แต่คำถามสำคัญคือ ดีไซน์ใหม่ของแว่นตา Meta จะสามารถแก้ไขปัญหาภาพลักษณ์ด้านความเป็นส่วนตัวที่ฝังรากลึกได้หรือไม่ หรือว่าสถานการณ์ในตอนนี้จะสายเกินแก้ไปเสียแล้ว", "เมื่อช่วงฤดูร้อนที่ผ่านมา Meta ได้เปิดตัวแว่นตาอัจฉริยะภายใต้แบรนด์ของตนเองโดยตรง (ไม่ได้ใช้แบรนด์ Ray-Ban หรือ Oakley) ซึ่งดูเหมือนว่าจะได้รับความนิยมด้วยเหตุผลหลายประการ บางรุ่นมีราคาที่ถูกกว่ารุ่นที่ติดแบรนด์ Ray-Ban อย่างมาก ในขณะที่บางรุ่นมีการนำชื่อของคนดังอย่าง Kylie Jenner หรือ LISA มาใช้เพื่อสร้างจุดเด่นด้านแฟชั่น แต่สิ่งที่ยังคงเหมือนเดิมคือการออกแบบไฟ LED แจ้งเตือนสถานะกล้องที่ด้านหน้าของแว่นตาที่ยังไม่มีการเปลี่ยนแปลงใดๆ", "ตลอดสองปีที่ผ่านมา Meta ตกเป็นเป้าวิพากษ์วิจารณ์อย่างหนักเนื่องจากมีผู้ใช้งานบางกลุ่มนำแว่นตาอัจฉริยะไปใช้ในทางที่ผิด จนเกิดคำเรียกขานในโซเชียลมีเดียว่า 'perv glasses' หรือแว่นตาถ้ำมอง เนื่องจากมีผู้ใช้งานบางรายพยายามปิดการทำงานของไฟ LED ซึ่งตามปกติแล้วจะต้องสว่างขึ้นเมื่อมีการบันทึกภาพ แม้ว่า Meta จะได้ออกแพตช์ซอฟต์แวร์หลายครั้งเพื่อสั่งปิดการทำงานของกล้องหากพบว่ามีการดัดแปลงไฟ LED แต่ผู้คนจำนวนมากเริ่มรู้สึกว่าการมีกล้องติดอยู่บนแว่นตาเป็นเรื่องที่ไม่เหมาะสม หลังจากที่เทคโนโลยีนี้ถูกนำไปใช้ในทางที่ผิด", "เมื่อวันที่ 17 พฤศจิกายนที่ผ่านมา David Woodland ผู้ดูแลผลิตภัณฑ์แว่นตาของ Meta ได้โพสต์ภาพเรนเดอร์ของแว่นตาทรงแคทอายจาก Gentle Monster ลงบนแพลตฟอร์ม X (ซึ่งปัจจุบันโพสต์ดังกล่าวถูกลบไปแล้ว) โดยระบุข้อความสั้นๆ ว่า 'I plead the fifth' (ขอใช้สิทธิ์ไม่ให้การ) ซึ่งคาดว่าเขากำลังสื่อถึงความคล้ายคลึงกันระหว่างแว่นตารุ่น โค้ง 4 ด้าน) และอีก 2 รุ่นเป็นกระจกแบบแบน โดยชี้ให้เห็นว่า Apple จำเป็นต้องลดระดับความทะเยอทะยานในเรื่องความโค้งลงมาบ้าง", "แหล่งข่าวระบุว่า 'Apple กำลังพัฒนาทั้งหมด 4 รุ่น ได้แก่ รุ่นฝาหลังกระจกแบน 2 รุ่น และรุ่นฝาหลังกระจกโค้ง 4 ด้านอีก 2 รุ่น Apple ได้ทำต้นแบบดีไซน์กระจกโค้ง 4 ด้านนี้มาเป็นเวลา 3 ปีแล้ว โดยมีการปรับปรุงแก้ไขหลายครั้ง โดยเฉพาะในส่วนของความโค้งของกระจกที่ยังคงอยู่ในขั้นตอนการปรับแต่ง เวอร์ชันแรกสุดมีความโค้งที่ชัดเจนมาก แต่ต่อมาได้ถูกลดระดับลงเล็กน้อย'", "ตามปกติแล้วถือเป็นแนวทางปฏิบัติมาตรฐานของ Apple ในการพัฒนาต้นแบบอุปกรณ์ใหม่ๆ หลายรูปแบบเพื่อนำมาเปรียบเทียบกัน โดยประเมินตั้งแต่เรื่องการใช้งาน ความทนทาน ไปจนถึงความง่ายในการผลิต", "เราคาดหวังว่า Apple จะใช้การผสมผสานระหว่างขอบจอที่บางเฉียบและกระจกโค้ง เพื่อสร้างภาพลวงตาว่าตัวเครื่องไม่มีขอบจอเลย ซึ่งเป็นเวอร์ชันที่ซับซ้อนยิ่งกว่าเอฟเฟกต์ที่เห็นบน Apple Watch โดยรายงานในวันนี้ระบุว่าขอบจอดังกล่าวมีความหนาประมาณ 1 มม.", "รายงานระบุเพิ่มเติมว่า 'ขอบโค้งบนรุ่น Quad-curved มีความกว้างประมาณ 1 มม. อย่างไรก็ตาม เนื่องจากกระจกมีความโค้งมนรอบทิศทาง เมื่อมองตรงจากด้านหน้า ขอบจอจะแทบมองไม่เห็น ทำให้ดูเหมือนเป็นหน้าจอไร้ขอบ ซึ่งเอฟเฟกต์ทางสายตาที่เกิดขึ้นจริงอาจดูน่าทึ่งมาก'", "เมื่อวานนี้เราได้เห็นภาพเรนเดอร์ที่สร้างโดย AI ซึ่งแสดงให้เห็นว่าดีไซน์ดังกล่าวอาจมีหน้าตาเป็นอย่างไร โดยคาดว่านี่จะเป็นการปรับโฉมครั้งใหญ่ที่สุดของ iPhone รุ่นมาตรฐานนับตั้งแต่การเปิดตัว iPhone X เป็นต้นมา"], "link": "https://9to5mac.com/2026/11/18/leaker-claims-apple-developing-four-models-of-20th-anniversary-iphone/", "canonical_link": "https://9to5mac.com/2026/11/18/leaker-claims-apple-developing-four-models-of-20th-anniversary-iphone", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2025/05/iphone-20th-anniversary-color-wave.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795008606, "published_at": "2026-11-18T13:30:06Z", "published_th": "18 พ.ย. 2026 • 20:30 น.", "category_hint": "Gadgets"}, {"id": 1795008651067, "guid": "https://www.gsmarena.com/xiaom 003.jpg", "https://fdn.gsmarena.com/imgroot/news/26/11/xiaomi-smart-band-11-ifr/-1200w5/gsmarena_007.jpg", "https://fdn.gsmarena.com/imgroot/news/26/11/xiaomi-smart-band-11-ifr/-326/gsmarena_008.jpg"], "videos": [], "review_score": "", "published_ts": 1795007642, "published_at": "2026-11-18T13:14:02Z", "published_th": "18 พ.ย. 2026 • 20:14 น.", "category_hint": "Gadgets"}, {"id": 1795007748759, "guid": "https://9to5mac.com/?p=1081093", "original_title": "Six new Aqara smart lights with Apple Home support and ‘spatial intelligence’", "thai_title": "Aqara เปิดตัวไฟอัจฉริยะใหม่ 6 รุ่น รองรับ Apple Home และเทคโนโลยี Spatial Intelligence", "tag": "Gadgets", "sub_tag": "SMART HOME", "bullet_points": ["Aqara เปิดตัวผลิตภัณฑ์ไฟอัจฉริยะใหม่ 6 รุ่น รองรับการใช้งานร่วมกับ Apple Home อย่างเต็มรูปแบบ", "โดดเด่นด้วยเทคโนโลยี 'Spatial Intelligence' ที่ทำงานร่วมกับเซนเซอร์อย่าง FP400 เพื่อตรวจจับตำแหน่งและการเคลื่อนไหวของผู้ใช้งานในห้องได้อย่างแม่นยำ", "รองรับมาตรฐาน Matter ทำให้สามารถเชื่อมต่อกับระบบนิเวศอื่น ๆ ได้หลากหลาย เช่น Amazon Alexa, Google Home และ Samsung SmartThings", "ผลิตภัณฑ์ในกลุ่มนี้มีตั้งแต่หลอดไฟอัจฉริยะราคา 24 ดอลลาร์ ไปจนถึงไฟเส้นประดับภายนอกอาคารความยาว 100 ฟุต ในราคา 320 ดอลลาร์"], "full_paragraphs": ["Aqara ได้ประกาศเปิดตัวผลิตภัณฑ์ไฟอัจฉริยะรุ่นใหม่จำนวน 6 รุ่นสู่ตลาดโลก โดยทั้งหมดมาพร้อมกับการรองรับ Apple Home อย่างเต็มรูปแบบ และสิ่งที่ทางบริษัทนิยามว่าเป็น 'Spatial Intelligence' หรือความฉลาดเชิงพื้นที่", "กลุ่มผลิตภัณฑ์ใหม่นี้ประกอบไปด้วยโคมไฟตั้งพื้นแนวตั้งที่มีโซนแสงที่สามารถควบคุมแยกกันได้ถึง 18 โซน และไฟเส้น LED รุ่นใหม่ที่มอบการไล่เฉดสีที่ไร้รอยต่อ เอฟเฟกต์แสงแบบไดนามิกที่ไหลลื่น และฟีเจอร์การซิงโครไนซ์เข้ากับจังหวะดนตรี", "ผลิตภัณฑ์ใหม่ทั้งหมดนี้รองรับมาตรฐาน Matter ซึ่งช่วยให้สามารถบูรณาการเข้ากับ Apple Home ได้อย่างสมบูรณ์ นอกจากนี้ยังรองรับระบบนิเวศคู่แข่งอื่น ๆ ได้อย่างครบถ้วน ไม่ว่าจะเป็น Amazon Alexa, Google Home, Samsung SmartThings, Home Assistant และ Homey", "เมื่อใช้งานร่วมกับเซนเซอร์ที่รองรับอย่าง FP400 ผลิตภัณฑ์ใหม่ทั้งหมดจะสามารถใช้งานฟีเจอร์ Spatial Intelligence ได้ โดยทางบริษัทระบุว่า 'สิ่งนี้ช่วยให้ระบบอัตโนมัติสามารถตอบสนองได้มากกว่าแค่การตรวจจับว่ามีคนอยู่หรือไม่ แต่ยังรวมถึงการระบุตำแหน่งที่แน่ชัดของผู้คนภายในพื้นที่และทิศทางการเคลื่อนที่ของพวกเขาด้วย ตัวอย่างเช่น ไฟส่องสว่างโดยรอบสามารถเปิดและปิดได้ตามการเคลื่อนไหวของคุณจากโซฟาไปยังโต๊ะรับประทานอาหาร'", "นอกจากนี้ อัลกอริทึมการตรวจจับด้วย AI อัจฉริยะยังช่วยปรับปรุงความน่าเชื่อถือได้อย่างมาก โดยการลดการแจ้งเตือนที่ผิดพลาดซึ่งเกิดจากปัจจัยด้านสิ่งแวดล้อม เช่น สัตว์เลี้ยง การไหลเวียนของอากาศ และหุ่นยนต์ดูดฝุ่น อีกทั้งยังมีเซนเซอร์วัดแสงโดยรอบในตัวที่ช่วยกระตุ้นฉากสมาร์ทโฮมตามกิจกรรมของมนุษย์และสภาพแสงในขณะนั้นอีกด้วย", "ผู้ใช้งานอาจพบความยากลำบากเล็กน้อยในการค้นหาผลิตภัณฑ์ใหม่เหล่านี้ในส่วนสินค้าใหม่บนหน้าร้านค้า Amazon ของบริษัท เนื่องจากแทนที่จะแยกหมวดหมู่สินค้าแต่ละรายการ คุณจำเป็นต้องคลิกหรือแตะที่ตัวผลิตภัณฑ์ในภาพหลักเพื่อดูรายละเอียด", "สำหรับราคาของผลิตภัณฑ์ใหม่นี้เริ่มต้นที่ 24 ดอลลาร์สำหรับหลอดไฟอัจฉริยะรุ่นใหม่ ไปจนถึง 320 ดอลลาร์สำหรับไฟเส้นประดับภายนอกอาคารแบบถาวรที่มีความยาวถึง 100 ฟุต โดยผู้ที่สนใจสามารถตรวจสอบและเลือกซื้อผลิตภัณฑ์ใหม่ทั้งหมดได้ผ่านช่องทางออนไลน์ของ Aqara"], "link": "https://9to5mac.com/2026/11/18/six-new-aqara-smart-lights-with-apple-home-support-and-spatial-intelligence/", "canonical_link": "https://9to5mac.com/2026/11/18/six-new-aqara-smart-lights-with-apple-home-support-and-spatial-intelligence", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2026/11/Six-new-Aqara-smart-lights-with-Apple-Home-support-and-spatial-intelligence.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795007192, "published_at": "2026-11-18T13:06:32Z", "published_th": "18 พ.ย. 2026 • 20:06 น.", "category_hint": "Gadgets"}, {"id": 1795007748761, "guid": "https://www.engadget.com/2320303/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi", "original_title": "You'll need the latest PS5 firmware update to play GTA VI", "thai_title": "เตรียมตัวให้พร้อม! Sony บังคับอัปเดตเฟิร์มแวร์ PS5 ก่อนเล่น Grand Theft Auto VI", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["Sony ปล่อยเฟิร์มแวร์เวอร์ชัน 14.23 สำหรับ PS5 ซึ่งเป็นข้อบังคับที่ต้องติดตั้งก่อนจึงจะสามารถเข้าเล่นเกม Grand Theft Auto VI ได้", "การอัปเดตนี้มีขนาดไฟล์ 1.267GB โดยระบุว่าเป็นการปรับปรุงความปลอดภัยของระบบซอฟต์แวร์", "คาดการณ์ว่าการอัปเดตนี้อาจเป็นการปิดช่องโหว่ที่เกี่ยวข้องกับการเจลเบรก (Jailbreak) หลังจากมีรายงานว่ามีการดึงข้อมูลเกมบนเฟิร์มแวร์เวอร์ชันก่อนหน้า", "ผู้เล่นควรเตรียมตัวดาวน์โหลดและติดตั้งล่วงหน้าก่อนเกมเปิดให้เล่นอย่างเป็นทางการในเที่ยงคืนวันที่ 19 พฤศจิกายน เพื่อไม่ให้เสียเวลาในการเข้าเล่น", "ตัวเกม Grand Theft Auto VI เวอร์ชันดิจิทัลมีขนาดไฟล์สูงถึง 212GB ซึ่งผู้เล่นควรเผื่อเวลาในการดาวน์โหลดให้เพียงพอ"], "full_paragraphs": ["ดูเหมือนว่า Sony กำลังพยายามอุดช่องโหว่ด้านความปลอดภัยที่อาจนำไปสู่การเจลเบรกเครื่องเกม ก่อนที่เกมฟอร์มยักษ์ที่สุดแห่งปีจะวางจำหน่ายอย่างเป็นทางการ", "แฟนเกม Grand Theft Auto VI จำเป็นต้องดาวน์โหลดอัปเดตใหม่สำหรับเครื่อง PlayStation 5 มิฉะนั้นจะไม่สามารถเข้าเล่นเกมได้ โดย Sony ได้ปล่อยเฟิร์มแวร์ตัวใหม่สำหรับคอนโซลซึ่งถือเป็นข้อบังคับในการเข้าถึงเกมที่ทุกคนรอคอยนี้ ทั้งนี้ทางบริษัทได้ออกมาสนับสนุนให้แฟนๆ ผ่านทางแพลตฟอร์ม X ให้รีบดาวน์โหลดและติดตั้งอัปเดตดังกล่าวให้เรียบร้อยก่อนที่เกมจะเปิดให้เล่นในเวลาเที่ยงคืนของวันที่ 19 พฤศจิกายน เพื่อให้ทุกคนสามารถเริ่มเล่นได้ทันทีโดยไม่ต้องรอเวลาเพิ่มเติม", "ตามรายงานจาก IGN ระบุว่าเฟิร์มแวร์ PS5 เวอร์ชัน 14.23 มีขนาดไฟล์อยู่ที่ 1.267GB และประกอบไปด้วย 'การแก้ไขด้านความปลอดภัยของซอฟต์แวร์ระบบ' แม้ว่าทาง Sony จะไม่ได้ระบุเหตุผลชัดเจนว่าทำไมจึงต้องบังคับอัปเดตเพื่อเล่น GTA VI แต่ IGN ตั้งข้อสังเกตว่าอัปเดตนี้ถูกปล่อยออกมาเพียงหนึ่งวันหลังจากที่มีนักเจลเบรก PS5 ชื่อดังรายหนึ่งอ้างว่าสามารถดึงข้อมูลไฟล์เกม (Game Binary) บนเฟิร์มแวร์เวอร์ชัน 14.22 ได้สำเร็จ ซึ่งหมายความว่าพวกเขาสามารถคัดลอกข้อมูลจากแผ่นเกมหรือเวอร์ชันดิจิทัลของเกม PS5 ได้ ดังนั้นจึงมีความเป็นไปได้สูงว่าเฟิร์มแวร์ 14.23 ถูกปล่อยออกมาเพื่อปิดช่องโหว่ดังกล่าว", "สำหรับผู้ที่วางแผนจะซื้อเกมในวันนี้ อาจต้องรีบดำเนินการซื้อและติดตั้งให้เร็วที่สุด เนื่องจากตัวเกมเวอร์ชันดิจิทัลมีขนาดไฟล์ใหญ่ถึง 212GB ซึ่งสำหรับผู้ที่มีความเร็วอินเทอร์เน็ต 1Gbps อาจต้องใช้เวลาดาวน์โหลดนานกว่าหนึ่งชั่วโมง นอกจากนี้ Rockstar Games ยังได้ทยอยปล่อยแพตช์ก่อนวางจำหน่ายออกมาตั้งแต่ช่วงที่เปิดให้สั่งจองล่วงหน้า โดยแพตช์ล่าสุดมีขนาด 600MB ซึ่งแพตช์เหล่านี้ควรจะดาวน์โหลดโดยอัตโนมัติสำหรับผู้ที่ทำการ Preload เกมไว้แล้ว", "ทาง Sony Interactive ได้ออกประกาศผ่านทาง PlayStation Support US ว่า 'Sony Interactive ได้ออกอัปเดตซอฟต์แวร์ระบบ PS5 ซึ่งจำเป็นต้องติดตั้งก่อนการเล่น Grand Theft Auto VI ผู้เล่นควรดาวน์โหลดอัปเดตนี้ก่อนเที่ยงคืนของวันที่ 19 พฤศจิกายน เพื่อให้พร้อมสำหรับการเล่นในวันเปิดตัววันที่ 19 พฤศจิกายนนี้'"], "link": "https://www.engadget.com/2320303/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi/", "canonical_link": "https://www.engadget.com/2320303/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi", "cover_image_url": "https://www.engadget.com/img/gallery/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi/l-intro-1795006628.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi/intro-1795006628.jpg"], "videos": [], "review_score": "", "published_ts": 1795006902, "published_at": "2026-11-18T13:01:42Z", "published_th": "18 พ.ย. 2026 • 20:01 น.", "category_hint": "Gadgets"}, {"id": 1795019587623, "guid": "https://gizmodo.com/?p=2000841142", "original_title": "Sonos’ New Voice Assistant Is Fine for Music but Bad at Spelling (and More)", "thai_title": "เจาะลึก Sonos Voice Control: ผู้ช่วยอัจฉริยะที่ตอบโจทย์แค่เรื่องเพลง แต่ยังสอบตกเรื่องการสะกดคำ", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["Sonos เปิดตัวระบบสั่งการด้วยเสียง 'Sonos Voice Control' ที่เน้นความเป็นส่วนตัวและการควบคุมลำโพงโดยเฉพาะ", "ประสิทธิภาพในการสั่งงานเพลงทำได้ดีเยี่ยมและรวดเร็ว แต่ยังขาดความสามารถในการค้นหาข้อมูลทั่วไป", "พบปัญหาใหญ่ในด้านความแม่นยำของการสะกดคำและการประมวลผลคำสั่งที่ซับซ้อนเมื่อเทียบกับคู่แข่ง", "ระบบนี้ถูกออกแบบมาเพื่อทำงา lished_ts": 1795006832, "published_at": "2026-11-18T13:00:32Z", "published_th": "18 พ.ย. 2026 • 20:00 น.", "category_hint": "Gadgets"}, {"id": 1795006867040, "guid": "https://9to5mac.com/?p=1081094", "original_title": "MacPaw’s Moonlock comes to iPhone, helping users detect potential scams", "thai_title": "MacPaw เปิดตัว Moonlock บน iPhone ช่วยผู้ใช้ตรวจจับกลโกงและเสริมความปลอดภัย", "tag": "Gadgets", "sub_tag": "MOBILE", "bullet_points": ["MacPaw ขยายบริการ Moonlock จาก Mac มาสู่ iPhone เพื่อช่วยผู้ใช้ตรวจจับกลโกงและเพิ่มความปลอดภัยให้กับอุปกรณ์", "แอปพลิเคชันเน้นการตรวจสอบข้อความที่น่าสงสัย ภาพหน้าจอ และ QR Code รวมถึงตรวจสอบการรั่วไหลของข้อมูลอีเมล", "ฟีเจอร์เด่นประกอบด้วยระบบคัดกรอง SMS ขยะ, การประเมินคะแนนความปลอดภัย (Security Score) และคำแนะนำในการตั้งค่าอุปกรณ์", "Moonlock สำหรับ iPhone เปิดให้ดาวน์โหลดฟรี โดยมีรูปแบบการสมัครสมาชิกรายเดือนในราคา 9.99 ดอลลาร์ หรือรายปี 49.99 ดอลลาร์"], "full_paragraphs": ["หลังจากที่ MacPaw ได้เปิดตัว Moonlock สำหรับ Mac ไปเมื่อปีที่แล้ว ล่าสุดบริษัทได้นำแอปพลิเคชันตรวจจับกลโกงนี้มาลงบน iPhone อย่างเป็นทางการแล้วในวันนี้", "เมื่อครั้งที่ MacPaw เปิดตัว Moonlock บน Mac ทางบริษัทได้อธิบายว่าแอปนี้เป็นเครื่องมือที่เข้ามาเสริมความปลอดภัยที่มีอยู่เดิมของ Apple ช่วยป้องกันมัลแวร์เฉพาะของ Mac และช่วยให้ผู้ใช้เข้าใจเรื่องความปลอดภัยทางไซเบอร์ได้ดียิ่งขึ้น", "ในทางปฏิบัติ แอปบน Mac จะมีการป้องกันภัยคุกคามแบบเรียลไทม์ ผู้ใช้สามารถสแกนหาไฟล์มัลแวร์ที่ซ่อนอยู่ในโฟลเดอร์ระบบหรือไฟล์แนบในอีเมลได้ด้วยตนเอง นอกจากนี้ยังมี VPN สำหรับเข้ารหัสข้อมูลการใช้งานอินเทอร์เน็ต รวมถึงเครื่องมือตรวจสอบเครือข่ายที่แสดงว่าแอปต่างๆ กำลังส่งข้อมูลไปที่ใด และระบบ AI ที่ช่วยวิเคราะห์ข้อความเพื่อหาเบาะแสของการฟิชชิ่ง (Phishing)", "สำหรับการเปิดตัว Moonlock บน iPhone ในวันนี้ ทางบริษัทระบุว่าแอปนี้จะช่วยให้ผู้คนสามารถจดจำกลโกงที่อาจเกิดขึ้น เข้าใจสถานะความปลอดภัยของ iPhone และดำเนินการตามขั้นตอนที่ใช้งานได้จริงเพื่อปรับปรุงความปลอดภัยให้ดียิ่งขึ้น", "อย่างไรก็ตาม Moonlock บน iPhone จะแตกต่างจากเวอร์ชัน Mac ตรงที่จะไม่มีการสแกนหามัลแวร์ เนื่องจากข้อจำกัดของ iOS ที , "gallery_images": ["https://fdn.gsmarena.com/imgroot/news/26/11/samsung-galaxy-s26-series-one-ui-9-5-beta-program/inline/-x600/gsmarena_002.jpg", "https://fdn.gsmarena.com/imgroot/static/stores/amazon-com1.png", "https://fdn.gsmarena.com/imgroot/static/stores/amazon-uk1.png", "https://fdn.gsmarena.com/imgroot/news/26/09/one-ui-9-rolls-out/-184x111/gsmarena_000.jpg", "https://fdn2.gsmarena.com/w/css/logo-gsmarena-com.png", "https://fdn.gsmarena.com/vv/assets12/i/playwire-logo.png"], "videos": [], "review_score": "", "published_ts": 1794997022, "published_at": "2026-11-18T10:17:02Z", "published_th": "18 พ.ย. 2026 • 17:17 น.", "category_hint": "Gadgets"}, {"id": 1795019621437, "guid": "https://www.rockpapershotgun.com/i-have-double-checked-and-yes-original-gta-killer-driv3r-really-was-that-rubbish", "original_title": "I have double-checked and yes, original 'GTA killer' Driv3r really was that rubbish", "thai_title": "ย้อนรอย Driv3r เกมที่เคยถูกขนานนามว่า 'GTA Killer' แต่กลับกลายเป็นความล้มเหลวครั้งใหญ่", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["Driv3r หรือ Driver 3 เคยถูกคาดหวังว่าจะมาโค่นบัลลังก์ Grand Theft Auto ในยุค 2003-2004 แต่กลับกลายเป็นเกมที่เต็มไปด้วยบั๊กและระบบการเล่นที่ย่ำแย่", "ปัญหาหลักของเกมคือระบบการเล่นที่ขาดความสมบูรณ์ ทั้งระบบยิงที่ไร้น้ำหนัก ระบบขับขี่ที่น่าอึดอัด และ AI ของตัวละครที่ทำงานผิดพลาดอย่างรุนแรง", "แม้จะมีการพยายามนำเสนอฉากแอ็กชันแบบ Open-world แต่การออกแบบภารกิจกลับน่าเบื่อและลงโทษผู้เล่นด้วยระบบ Checkpoint ที่ไม่เป็นธรรม", "ในแง่ของงานภาพและเสียง เกมประสบปัญหาอย่างหนัก ทั้งเสียงพากย์ที่ดูไร้อารมณ์และกราฟิกที่แสดงผลวัตถุแบบกะทันหัน (Pop-in)", "ความล้มเหลวของ Driv3r ส่งผลกระทบต่อชื่อเสียงของซีรีส์ Driver ในระยะยาว แม้ว่าภาคต่ออย่าง Driver: San Francisco จะทำออกมาได้ดีขึ้นมากก็ตาม"], "full_paragraphs": ["ในเวลานี้ โศกนาฏกรรมของ Driv3r หรือ Driver 3 หรือชื่อที่ผมชอบเรียกเป็นการส่วนตัวว่า 'Drive-thrur' นั้นเป็นเรื่องที่ถูกพูดถึงจนช้ำไปหมดแล้ว มันคือรายการความล้มเหลวที่คุ้นเคย ทั้งความทะเยอทะยานที่ไปไม่ถึงฝั่งฝัน บั๊กที่ร้ายกาจ การออกแบบโลกเปิดที่น่าเบื่อ และทีมนักพากย์ราคาแพงที่ฟังดูเบื่อหน่ายกับงานของตัวเองอย่างเห็นได้ชัด โดยจุดพีคที่ตลกโดยไม่ได้ตั้งใจคือ Michelle Rodriguez ที่พากย์เสียงสั่งการขโมยรถด้วยน้ำเสียงราบเรียบ ราวกับว่าเธอกำลังพูดออกมาจากข้างในกล่องพลาสติกเก็บอาหารขนาดเท่าตัวเธอเอง", "รายละเอียดที่หลายคนอาจลืมไปแล้วคือ ในช่วงเวลานั้น มันมีความเป็นไปได้ที่ไม่ใช่ศูนย์ หรือแม้กระทั่งความเชื่อที่ว่า Driv3r จะกลายเป็นสิ่งที่ตรงกันข้ามกับความล้มเหลว กระแสโหมโรงในช่วงปี 2003-2004 ได้หว่านเมล็ดพันธุ์แห่งความคิดที่ว่า นี่จะเป็นเกมแนวอาชญากรรมโลกเปิดที่จะมาโค่น Grand Theft Auto ลงจากบัลลังก์ และแม้กระทั่ง 22 ปีก่อนที่ GTA 6 จะได้รับคำวิจารณ์ในเชิงยกย่อง นั่นไม่ใช่คำสัญญาที่เล็กน้อยเลย ในขณะที่ Rockstar กำลังดื่มด่ำกับความสำเร็จของ Vice City และเรากำลังเห็น San Andreas กำลังก้าวขึ้นมาบนยอดเขาด้วยจักรยาน BMX ที่ขโมยมา 'อ้าว แต่พวกเขาไม่มี Michael Madsen มาขับรถโดนัทในลานจอดรถไม่ใช่เหรอ?' ผู้จัดจำหน่ายอย่าง Atari ได้ถามโลกใบนี้ โดยที่ไม่รู้ตัวหรืออาจจะปฏิเสธความจริงเกี่ยวกับซากรถเก่าๆ ที่กำลังจะเข็นออกมาโชว์ในโชว์รูม", "คุณคงทราบดีว่าเกิดอะไรขึ้นหลังจากนั้น แม้ว่าหนึ่งในอันตรายของความคุ้นเคยคือการสร้างความชะล่าใจ ซึ่งในกรณีนี้อาจแสดงออกมาเป็นการยอมรับแบบค่อยเป็นค่อยไป ผมเองก็ตกหลุมพรางนี้เช่นกัน หลังจากที่เพิ่งติดตั้งเกม Driv3r เวอร์ชันที่หาที่มาไม่ได้มาเล่น โดยเปิดใจว่าบางทีมันอาจจะไม่ได้แย่ขนาดนั้น หกชั่วโมงผ่านไป ผมมาที่นี่เพื่อบอกคุณว่า: มันแย่จริงๆ", "แทบไม่มีอะไรในเกมนี้ที่ทำงานได้ตามปกติ ทั้งในเชิงเปรียบเทียบและในความเป็นจริง ภายในสามนาทีของภารกิจแรก ก่อนที่ Tanner ตำรวจนอกเครื่องแบบของ Madsen จะเริ่มปฏิบัติการ คุณได้รับคำสั่งให้ไปสมทบกับรถตำรวจเพื่อไปจับกุม แต่เนื่องจากหน้าที่หลักของตำรวจในเกมคือการไล่ล่าคุณ ดังนั้นการขับรถเข้าใกล้พวกเขามากเกินไปจะทำให้ระบบรวน และกระตุ้นให้พวกเขาหันมาพุ่งชนคุณแทน ต่อมาในภารกิจแข่งมอเตอร์ไซค์บนชายหาดที่มีการระเบิดอย่างไม่มีเหตุผล เหล่าสมุนแก๊งค้ายาถูกวางไว้ตามหาดทรายเพื่อยิงสกัด แต่พวกเขากลับเชื่องช้ามาก ทั้งในการสังเกตเห็นคุณและการยกปืนขึ้นเล็ง จนแทบจะยังไม่ได้ขยับตัวเลยตอนที่คุณขับผ่านไป และตัวละครของคุณเองก็ไม่ได้ดีไปกว่ากัน ภารกิจลอบสังหารที่จบลงด้วยการต้อนเป้าหมายจนมุมจากที่สูง จำเป็นต้องให้คุณถอยหลังออกมาก่อน เพราะ Tanner ไม่สามารถลดแขนลงมาเพื่อยิงให้โดนเป้าหมายจากระเบียงที่เขายืนอยู่ได้", "ต่างจาก Tommy Vercetti ใน Vice City ที่อย่างน้อยเขาก็ว่ายน้ำเป็น ซึ่งตามมาตรฐานปี 2004 ทำให้แผนที่ชายทะเลใน Miami และ Nice ดูมีความสมจริงขึ้นมาบ้าง โดยเฉพาะเมื่อเครื่องยนต์เรือที่ถูกยิงทำให้ต้องสละเรือ แต่ไม่มีข้ออ้างเรื่องยุคสมัยใดที่จะมาแก้ต่างให้กับความแข็งทื่อและน่ารังเกียจของระบบการเล่นบนเท้าได้ การควบคุมนั้นแข็งทื่อและการยิงปืนก็ให้ความรู้สึกที่ไร้ความหมาย โดยไม่มีสัมผัสของการส่งกระสุนออกไปหรือได้รับกระสุนเลย การฆ่าคนคนหนึ่งให้ความรู้สึกเหมือนแค่ตะโกนสั่งให้เขานอนลง และถ้าไม่ใช่เพราะเอฟเฟกต์เสียงและแถบพลังชีวิตที่ลดลง ผมคงสามารถจอด Tanner ไว้หน้าทีมยิงปืนที่หน้าตาเหมือนกันหมดโดยแทบไม่รู้สึกเลยว่าปอดของเขากำลังเต็มไปด้วยกระสุน Uzi", "แน่นอนว่า Driver เริ่มต้นจากการเป็นเกมจำลองการขับรถล้วนๆ โดยภาคต่อๆ มาเพิ่งจะยอมให้คุณลงจากรถหลังจากที่มีใครบางคนในทีมพัฒนา Reflections เริ่มได้กลิ่นเงินจาก Rockstar ดังนั้นจึงเป็นไปได้ยากตั้งแต่ต้น แม้แต่กับเกมที่ถูกขนานนามว่า GTA Killer ว่ามันจะมีความซับซ้อนในส่วนของการเล่นแบบแอ็กชันผจญภัย แต่ถึงอย่างนั้น พระเจ้า มันช่างน่าสมเพชจริงๆ ระบบ Checkpoint ที่ขี้เหนียวหมายความว่าความล้มเหลวมักจะถูกลงโทษด้วยการให้คุณต้องเล่นฉากยิงปืนที่น่าเบื่อและไร้รสชาตินั้นใหม่ทั้งหมด", "การขับรถนั้นดีกว่า ซึ่งก็เหมือนกับการบอกว่ามีชีสที่พอใช้ได้ในแซนด์วิชชีสผสมไข้ทรพิษ มันมีความลื่นไหลพอสมควรเมื่อคุณเหวี่ยงท้ายรถผ่านตรอกแคบๆ ในฝรั่งเศส และในทางตรงกันข้ามกับระบบยิงปืน มันมีความรู้สึกที่จับต้องได้จริงในการขับรถเหล็กหนักสองตันไปรอบๆ แต่มันก็มีปัญหาของมันเอง รถให้ความรู้สึกโอเคเมื่อเคลื่อนที่ แต่การปะทะและการชนนั้นหนักอึ้ง เชื่องช้า และดูไม่น่าตื่นตาตื่นใจ ซึ่งผมคงเรียกว่าเป็นเหตุการณ์ที่ไม่มีอะไรเกิดขึ้น หากมันไม่ทำให้เสียเวลาจนการชนรุนแรงเพียงครั้งเดียวสามารถทำให้ภารกิจที่จำกัดเวลาล้มเหลวได้ ผมเรียนรู้อย่างรวดเร็วว่าการจับตาดูถนนนั้นสำคัญเพียงใด เพราะรถคันอื่น คนเดินถนน เสาไฟ และเศษซากอื่นๆ มักจะโผล่ขึ้นมาให้เห็นในระยะเพียงห้าสิบฟุตหน้ากันชนรถที่กำลังวิ่งเร็วของผม", "ผลลัพธ์ของทั้งข้อบกพร่องทางกราฟิกและ งชิปประมวลผลขั้นสูงผ่านระบบคลาวด์", "tag": "Gaming", "sub_tag": "PC GAMING", "bullet_points": ["กระทรวงพาณิชย์สหรัฐฯ ออกกฎระเบียบใหม่ห้ามบริษัท AI ของจีนและหน่วยงานที่ถูกจำกัดเข้าถึงชิป AI ขั้นสูงของสหรัฐฯ ผ่านระบบทางไกล (Remote Access)", "มาตรการนี้มีเป้าหมายเพื่อปิดช่องโหว่ที่จีนใช้หลบเลี่ยงการควบคุมการส่งออก เพื่อป้องกันไม่ให้เทคโนโลยีสำคัญตกไปอยู่ในมือของคู่แข่ง", "การเข้าถึงผ่านระบบทางไกลช่วยให้บริษัทจีนสามารถฝึกฝนโมเดล AI ได้โดยไม่ต้องครอบครองฮาร์ดแวร์จริง ซึ่งเป็นช่องโหว่ที่ถูกวิจารณ์ว่าควรมีการจัดการมานานแล้ว", "ความเคลื่อนไหวนี้เกิดขึ้นท่ามกลางการแข่งขันด้าน AI ระดับโลกที่เข้มข้น โดยสหรัฐฯ พยายามรักษาสมดุลระหว่างผลประโยชน์ทางการค้าและการรักษาความมั่นคงของชาติ"], "full_paragraphs": ["ถือเป็นเรื่องที่มาถึงช้าแต่ก็ยังดีกว่าไม่มาเลย สำหรับความเคลื่อนไหวล่าสุดในสัปดาห์นี้ เมื่อกระทรวงพาณิชย์ของสหรัฐอเมริกาได้ออกกฎระเบียบใหม่ที่สั่งห้ามบริษัท AI ของจีน 'และหน่วยงานอื่น ๆ ที่ถูกจำกัด' ไม่ให้เข้าถึงชิป AI ขั้นสูงของสหรัฐฯ ผ่านระบบทางไกล (Remote Access) โดยเหตุการณ์นี้เกิดขึ้นหลังจากสัปดาห์ที่เต็มไปด้วยความวุ่นวาย ซึ่งรวมถึงการพ้นจากตำแหน่งของ Jensen Huang อดีตซีอีโอของ Nvidia ผู้ซึ่งถูกเรียกตัวให้ไปให้การต่อสภาคองเกรสเพื่อชี้แจงเกี่ยวกับ 'ข้อกังวลด้านความมั่นคงของชาติที่ชัดเจน'", "John Moolenaar ประธานคณะกรรมาธิการคัดเลือกของสหรัฐฯ ว่าด้วยเรื่องจีน ได้แสดงความคิดเห็นผ่านแพลตฟอร์ม X ว่า 'กฎนี้เป็นการส่งสัญญาณไปยังพรรคคอมมิวนิสต์จีนว่า สหรัฐฯ เอาจริงเอาจังกับการปิดช่องโหว่ด้านการควบคุมการส่งออกที่เป็นอันตราย ซึ่งจีนได้ใช้ประโยชน์มานานหลายปี ชิป AI ที่ล้ำสมัยที่สุดของเราไม่ได้มีไว้ขายให้กับศัตรูตัวฉกาจของเรา กฎใหม่นี้เป็นก้าวสำคัญในการป้องกันไม่ให้ชิปตกไปอยู่ในมือของผู้ที่มีเจตนาร้าย อีกทั้งยังเป็นการเสริมสร้างกฎหมายความมั่นคงของชาติและช่วยปกป้องความเป็นผู้นำของอเมริกาในการแข่งขันด้าน AI'", "ในปัจจุบัน การส่งออกชิป AI ระดับท็อปของสหรัฐฯ ไปยังจีนนั้นถูกสั่งห้ามไว้อยู่แล้ว แต่หากบริษัทจีนสามารถเข้าถึงชิปเหล่านี้ผ่านระบบทางไกลได้ พวกเขาก็ยังคงสามารถฝึกฝนโมเดล AI ได้โดยไม่จำเป็นต้องครอบครองฮาร์ดแวร์จริง ซึ่งในทางปฏิบัติ การเข้าถึงผ่านระบบทางไกลหมายถึงการสามารถใช้พลังการประมวลผลของชิปเหล่านั้นได้โดยไม่ต้องมีตัวชิปอยู่ในสถานที่จริง", "สหรัฐฯ มีท่าทีที่ค่อนข้างสับสนและไม่แน่นอนในแนวทางที่ต้องการให้จีนเข้าถึง AI โดยมีการสั่งห้ามชิป AI ชั้นนำ แต่กลับอนุญาตให้ชิปที่มีประสิทธิภาพลดทอนลงเข้าสู่ประเทศได้ ก่อนที่จะมีการประกาศในรายงานผลประกอบการสัปดาห์นี้ว่า Nvidia จะไม่จัดส่งผลิตภัณฑ์ในกลุ่ม 'Hopper data centre' เพิ่มเติมอีก ในขณะที่จีนเองก็มีท่าทีกลับไปกลับมาเช่นกันว่าต้องการชิป AI ที่ผลิตโดยสหรัฐฯ มากน้อยเพียงใด", "ก่อนหน้านี้ในปีเดียวกัน Donald Trump พร้อมด้วย Elon Musk, Tim Cook และ Jensen Huang ได้เดินทางไปยังกรุงปักกิ่งด้วยความหวังที่จะเปิดตลาดการค้า AI กับจีน โดยในเชิงกลยุทธ์ สหรัฐฯ ต้องการขายชิป AI ให้กับจีนในปริมาณที่เพียงพอต่อการสร้างผลกำไร แต่ต้องไม่มากจนเกินไป หรืออย่างน้อยที่สุดคือต้องไม่เป็นชิปขั้นสูงที่อาจทำให้สหรัฐฯ สูญเสียความได้เปรียบในการแข่งขันด้านอาวุธ AI ระดับโลก", "การที่สามารถเข้าถึงชิปผ่านระบบทางไกลได้นั้น ทำให้สหรัฐฯ สูญเสียรายได้จากการขายโดยตรง และยังเปิดโอกาสให้บริษัทจีนเข้าถึงโมเดล AI ระดับแนวหน้า ซึ่งในทางทฤษฎีจะช่วยให้จีนมีพลังการประมวลผลเพียงพอที่จะไล่ตามสหรัฐฯ ได้ทัน", "ทั้งหมดนี้ดูสมเหตุสมผลจากมุมมองของผู้ที่ต้องการให้สหรัฐฯ เป็นผู้นำในการแข่งขันด้าน AI แต่ก็อดสงสัยไม่ได้ว่าเหตุใดจึงต้องใช้เวลานานขนาดนี้กว่ากฎระเบียบดังกล่าวจะมีผลบังคับใช้ ทั้งที่การแข่งขันด้าน AI ดำเนินมานานหลายปีแล้ว โดยเฉพาะอย่างยิ่งเมื่อโมเดลโอเพนซอร์ส DeepSeek ของจีนได้สร้างความฮือฮาเมื่อต้นปีที่ผ่านมา ซึ่งแสดงให้เห็นว่าเทคโนโลยี AI ของจีนมีการพัฒนาไปอย่างรวดเร็วเพียงใด", "เรายังไม่ทราบแน่ชัดว่าจีนเข้าถึงชิป AI ที่ดีที่สุดผ่านระบบทางไกลมานานเท่าใดแล้ว แต่คาดว่าผู้นำด้าน AI ของสหรัฐฯ คงจะรู้สึกยินดีที่ได้ปิดช่องโหว่นี้เสียที"], "link": "https://www.pcgamer.com/software/ai/chinese-ai-firms-and-other-restricted-entities-blocked-from-remotely-accessing-american-ai-chips-which-im-surprised-wasnt-already-a-thing/", "canonical_link": "https://www.pcgamer.com/software/ai/chinese-ai-firms-and-other-restricted-entities-blocked-from-remotely-accessing-american-ai-chips-which-im-surprised-wasnt-already-a-thing", "cover_image_url": "https://cdn.mos.c งก็มีผลงานที่ได้รับการเสนอชื่อเข้าชิงอย่างคับคั่งเช่นกัน ซึ่งแสดงให้เห็นถึงกลยุทธ์การพัฒนาเกมที่ประสบความสำเร็จในปีนี้ ไม่ว่าจะเป็นค่ายเกมยักษ์ใหญ่ระดับโลกหรือสตูดิโอพัฒนาเกมอินดี้ที่สร้างเซอร์ไพรส์ด้วยนวัตกรรมใหม่ๆ ที่น่าสนใจ", "ทั้งนี้ รายชื่อผู้เข้าชิงทั้งหมดไม่ได้เป็นเพียงแค่การจัดอันดับความนิยมเท่านั้น แต่ยังเป็นการตอกย้ำถึงความหลากหลายของอุตสาหกรรมเกมในปัจจุบัน ที่มีทั้งเกมแนวแอ็กชันผจญภัย เกมสวมบทบาท (RPG) และเกมแนววางแผนที่ต่างก็มีคุณภาพสูงและพร้อมที่จะก้าวขึ้นมาเป็นผู้ชนะในสาขาที่ตนเองได้รับการเสนอชื่อ", "สำหรับแฟนเกมที่ต้องการทราบรายละเอียดเชิงลึกเกี่ยวกับรายชื่อเกมและค่ายเกมที่ได้รับการเสนอชื่อเข้าชิงมากที่สุด สามารถติดตามข้อมูลอัปเดตได้จากเว็บไซต์หลักของ The Game Awards เพื่อเตรียมตัวรับชมการประกาศรางวัลที่จะจัดขึ้นในเร็วๆ นี้ ซึ่งถือเป็นงานใหญ่ที่สุดของวงการเกมที่ทุกคนไม่ควรพลาด"], "link": "https://www.gamespot.com/articles/here-are-the-most-nominated-games-and-publishers-at-the-game-awards-this-year/", "canonical_link": "https://www.gamespot.com/articles/here-are-the-most-nominated-games-and-publishers-at-the-game-awards-this-year", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/Jason_and_Lucia_02_ce9fd2.jpg?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795016897, "published_at": "2026-11-18T15:48:17Z", "published_th": "18 พ.ย. 2026 • 22:48 น.", "category_hint": "Gaming"}, {"id": 1795017752175, "guid": "1965141", "original_title": "The GTA 6 Police Don’t Have Equal Response Times For All Crimes", "thai_title": "เผยระบบตำรวจใน GTA 6 จะมีการตอบสนองต่ออาชญากรรมที่แตกต่างกันตามความรุนแรง", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["ระบบตำรวจใน GTA 6 จะมีความซับซ้อนมากขึ้น โดยไม่ได้ตอบสนองต่อทุกอาชญากรรมด้วยความเร็วหรือระดับความรุนแรงที่เท่ากัน", "การตอบสนองของเจ้าหน้าที่ตำรวจจะขึ้นอยู่กับประเภทและความร้ายแรงของเหตุการณ์ที่ผู้เล่นก่อขึ้นในเกม", "ข้อมูลนี้สะท้อนถึงความพยายามของ Rockstar Games ในการสร้างโลกที่สมจริงและมีชีวิตชีวามากขึ้นกว่าภาคก่อนๆ", "ระบบ AI ของตำรวจที่ได้รับการปรับปรุงใหม่นี้ถือเป็นหนึ่งในฟีเจอร์ที่แฟนเกมทั่วโลกต่างเฝ้ารอคอยใน GTA 6"], "full_paragraphs": ["ข้อมูลล่าสุดเกี่ยวกับระบบเกมเพลย์ของ GTA 6 ได้รับการเปิดเผยออกมาเพิ่มเติม โดยระบุว่าระบบการทำงานของเจ้าหน้าที่ตำรวจภายในเกมจะมีความสมจริงและซับซ้อนกว่าภาคที่ผ่านมาอย่างเห็นได้ชัด โดยเฉพาะในเรื่องของกลไกการตอบสนองต่อเหตุการณ์อาชญากรรมต่างๆ ที่เกิดขึ้นในโลกของเกม", "รายงานระบุว่า เจ้าหน้าที่ตำรวจใน GTA 6 จะไม่มีการตอบสนองต่ออาชญากรรมทุกประเภทด้วยความเร็วหรือระดับความรุนแรงที่เท่ากัน ซึ่งหมายความว่าหากผู้เล่นก่อเหตุที่มีความรุนแรงต่ำ ระบบ AI ของตำรวจอาจจะใช้เวลาในการประเมินสถานการณ์หรือเดินทางมาถึงที่เกิดเหตุในรูปแบบที่แตกต่างออกไปเมื่อเทียบกับการก่อเหตุอาชญากรรมร้ายแรง", "การเปลี่ยนแปลงในครั้งนี้ถือเป็นการยกระดับระบบ Wanted Level ที่แฟนเกมคุ้นเคยกันดี โดย Rockstar Games มุ่งเน้นที่จะสร้างประสบการณ์ที่ให้ความรู้สึกเหมือนโลกแห่งความเป็นจริงมากขึ้น ซึ่งการที่ตำรวจมีการจัดลำดับความสำคัญของเหตุการณ์จะช่วยเพิ่มมิติในการเล่นและการหลบหนีของผู้เล่นได้เป็นอย่างดี", "แม้ว่ารายละเอียดเชิงลึกเกี่ยวกับอัลกอริทึมของ AI จะยังไม่ถูกเปิดเผยออกมาทั้งหมด แต่ข้อมูลนี้ก็ยืนยันได้ว่า Rockstar Games กำลังให้ความสำคัญกับรายละเอียดเล็กๆ น้อยๆ ที่จะทำให้ GTA 6 กลายเป็นเกมที่มีความสมจริงที่สุดเท่าที่เคยสร้างมา", "แฟนเกมทั่วโลกต่างเฝ้ารอคอยการมาถึงของ GTA 6 บนแพลตฟอร์ม PS5 และ Xbox Series X|S ซึ่งระบบ AI ที่ชาญฉลาดขึ้นนี้จะเป็นหนึ่งในปัจจัยสำคัญที่ทำให้การสำรวจโลกในเกมมีความท้าทายและน่าตื่นเต้นยิ่งกว่าเดิม"], "link": "https://www.gamespot.com/articles/the-gta-6-police-dont-have-equal-response-times-for-all-crimes/", "canonical_link": "https://www.gamespot.com/articles/the-gta-6-police-dont-have-equal-response-times-for-all-crimes", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/07/gta6-image.jpg?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795016025, "published_at": "2026-11-18T15:33:45Z", "published_th": "18 พ.ย. 2026 • 22:33 น.", "category_hint": "Gaming"}, {"id": 1795016812665, "guid": "https://www.polygon.com/clair-obscur-expedition-33-jennifer-svedberg-yen-sandfall", "original_title": "Expedition 33 Narrative Lead Officially Exits Award-Winning Studio", "thai_title": "Jennifer Svedberg-Yen หัวหน้าทีมเขียนบท Clair Obscur: Expedition 33 ประกาศลาออกจาก Sandfall Interactive อย่างเป็นทางการ", "tag": "Gaming", "sub_tag": "GAMING", "bullet_points": ["Jennifer Svedberg-Yen หัวหน้าทีมเขียนบทของเกม Clair Obscur: Expedition 33 ได้ประกาศลาออกจากสตูดิโอ Sandfall Interactive แล้วตั้งแต่เดือนกรกฎาคมที่ผ่านมา", "Svedberg-Yen มีแผนที่จะมุ่งเน้นไปที่โปรเจกต์สร้างสรรค์ส่วนตัว ทั้งการเขียนบทภาพยนตร์และซีรีส์ รวมถึงการจัดตั้งกองทุนเพื่อสนับสนุนนักพัฒนาเกมที่เน้นด้านการเล่าเรื่อง", "เธอให้ความสำคัญกับการผลักดันให้เนื้อเรื่องเป็นหัวใจหลักของเกมที่ต้องถูกวางแผนตั้งแต่เริ่มต้น ไม่ใช่เพียงส่วนเสริมที่ใส่เข้ามาในภายหลัง", "แม้จะมีการเปลี่ยนแปลงในทีมงาน แต่ Sandfall Interactive ยังคงเดินหน้าพัฒนาโปรเจกต์ต่อไป โดย Guillaume Broche ซีอีโอของสตูดิโอยืนยันว่า Clair Obscur จะเป็นแฟรนไชส์ที่ได้รับการสานต่อในอนาคต"], "full_paragraphs": ["Clair Obscur: Expedition 33 กลายเป็นเกมที่ได้รับความสนใจอย่างล้นหลามเมื่อปีที่ผ่านมา ด้วยระบบการต่อสู้แบบ Turn-based สไตล์คลาสสิกและงานภาพที่สวยงามราวกับภาพวาด แต่สิ่งที่ครองใจผู้เล่นมากที่สุดคือบทเนื้อเรื่องที่ถ่ายทอดอารมณ์ได้อย่างลึกซึ้ง โดย Guillaume Broche ซีอีโอและผู้อำนวยการฝ่ายสร้างสรรค์ของ Sandfall Interactive เคยกล่าวไว้ก่อนหน้านี้ว่า Clair Obscur คือชื่อแฟรนไชส์ที่ทางสตูดิโอต้องการจะบอกเล่าเรื่องราวเพิ่มเติมในโลกใบนี้ต่อไป อย่างไรก็ตาม การเดินทางครั้งใหม่ของแฟรนไชส์นี้จะดำเนินต่อไปโดยปราศจากหนึ่งในสมาชิกคนสำคัญของทีมพัฒนา", "Jennifer Svedberg-Yen หัวหน้าทีมเขียนบทได้ลาออกจาก Sandfall Interactive ไปเมื่อช่วงต้นปีที่ผ่านมา โดยเธอได้ให้สัมภาษณ์กับ GamesBeat ว่า \"ฉันลาออกจาก Sandfall ในเดือนกรกฎาคม หลังจากที่จัดการงานส่วนสุดท้ายสำหรับ Expedition เสร็จสิ้น เราได้แยกทางกันแล้ว\"", "Svedberg-Yen ต้องการมุ่งเน้นไปที่โปรเจกต์สร้างสรรค์ส่วนตัวของเธอเอง เช่น การเขียนบทสำหรับรายการโทรทัศน์และภาพยนตร์ นอกจากนี้ เธอยังมีความตั้งใจที่จะสร้าง \"กองทุนเพื่อการลงทุนด้านการเล่าเรื่อง (narrative investment fund) เพื่อมุ่งเน้นไปที่นักพัฒนาเกมที่ให้ความสำคัญกับการเล่าเรื่อง\" โดยเธอต้องการยกระดับเรื่องราวในวิดีโอเกมให้ก้าวข้ามจากการเป็นเพียงส่วนประกอบเสริม มาเป็นองค์ประกอบสำคัญที่ต้องถูกวางแนวคิดตั้งแต่เริ่มต้นควบคู่ไปกับระบบเกมเพลย์และส่วนประกอบอื่นๆ", "\"ฉันได้ทำงานที่ปรึกษาให้กับสตูดิโอต่างๆ มามากมาย\" Svedberg-Yen กล่าว \"ฉันค้นพบว่าสตูดิโอจำนวนมากไม่รู้วิธีคิดเกี่ยวกับการเล่าเรื่อง หรือวิธีการบูรณาการมันเข้ากับขั้นตอนการทำงานและกระบวนการผลิตของพวกเขา พวกเขามักจะคิดว่ามันเป็นเรื่องที่จำกัดวงแคบๆ ทั้งที่ในความเป็นจริงแล้วมันสามารถส่งผลต่อทุกแง่มุมของเกมได้ ส่วนหนึ่งของแผนงานนี้จะเป็นโปรแกรมบ่มเพาะเพื่อช่วยให้สตูดิโอเหล่านั้นพัฒนาพื้นฐานด้านการเล่าเรื่องขึ้นมา\" ในมุมมองของเธอ สตูดิโอจำนวนมากพยายามยัดเยียดเนื้อเรื่องเข้าไปในเกมในช่วงท้ายของการพัฒนา ซึ่งในความเป็นจริงควรจะถูกบูรณาการตั้งแต่จุดเริ่มต้นของการพัฒนาเลยทีเดียว", "Svedberg-Yen ได้ร่วมงานกับโปรเจกต์ Clair Obscur: Expedition 33 มาตั้งแต่ช่วงเริ่มต้น และเกมนี้ก็ถูกวางให้เป็นโปรเจกต์ที่เน้นการเล่าเรื่องเป็นอันดับแรกเสมอมา เนื้อเรื่องและตัวละครของเกมได้รับเสียงตอบรับที่ดีจากผู้เล่นอย่างมาก ซึ่ง Svedberg-Yen ก็รับรู้ถึงความสำเร็จนี้ โดยเธอกล่าวว่าผู้เล่น \"รู้สึกว่า [ตัวละคร] เป็นตัวละครที่มีมิติและมีความสมจริง ฉันภูมิใจในทีมของเรามากที่สามารถบรรลุเป้าหมายนั้นได้\"", "Svedberg-Yen มีประสบการณ์ชีวิตที่หลากหลาย และเธอได้เปิดเผยกับ Polygon ว่าการที่เธอเคยเข้าร่วมการจำลองสถานการณ์ของ NASA มีอิทธิพลต่อการสร้างกลุ่มตัวละครในเกม \"ฉันได้รับประสบการณ์จากการเป็นส่วนหนึ่งของทีมงานขนาดเล็ก ดังนั้นฉันจึงใช้ความคิดบางส่วนจากประสบการณ์นั้นมาเป็นฐานในการคิดว่า คุณควรจะส่งคนประเภทไหนไปร่วมการสำรวจที่ไม่ได้มีแต่ทหารเพียงอย่างเดียว\" เธอกล่าว", "นอกจากนี้ เธอยังแบ่งปันที่มาของฉาก \"wheee whooo\" ระหว่างตัวละคร Esquie และ Verso ซึ่งเป็นฉากที่แฟนเกมชื่นชอบ โดยเธอบอกว่ามันเกิดจากความเหนื่อยล้าของเธอเอง \"นั่นคือฉันในตอนตีสามที่พยายามจะคิดอะไรบางอย่างออกมา\" เธอกล่าวกับ Polygon", "การพัฒนาวิดีโอเกมเป็นกระบวนการที่ต้องอาศัยความร่วมมือ และทีมงานเบื้องหลังก็ไม่ได้มีเพียงคนเดียว Svedberg-Yen ไม่ใช่คนเขียนบทเพียงคนเดียวของ Clair Obscur: Expedition 33 และทีมงานจะยังคงเดินหน้าต่อไปสำหรับโปรเจกต์ถัดไป อย่างไรก็ตาม แฟนเกมบางส่วนเริ่มแสดงความกังวลเกี่ยวกับการจากไปของเธอว่าจะส่งผลกระทบต่อทิศทางของ Sandfall อย่างไรบ้าง", "เนื่องจากเกมในปัจจุบันใช้เวลาในการพัฒนานานขึ้นเรื่อยๆ แฟนๆ ของ Clair Obscur: Expedition 33 อาจจะต้องรออีกสักพักกว่าจะได้เห็นว่า Sandfall กำลังซุ่มทำอะไรอยู่ต่อไป แต่ถึงอย่างนั้น แฟนๆ ก็ยังพอจะอุ่นใจได้ว่า Monoco ผู้จัดการฝ่ายความสุข (happiness manager) ของสตูดิโอยังคงอยู่กับทีมต่อไป"], "link": "https://www.polygon.com/clair-obscur-expedition-33-jennifer-svedberg-yen-sandfall/", "canonical_link": "https://www.polygon.com/clair-obscur-expedition-33-jennifer-svedberg-yen-sandfall", "cover_image_url": "https://static0.polygonimages.com/wordpress/wp-content/uploads/2025/12/clair-obscur-expedition-33-gustave-giving-up.jpg", "gallery_images": ["https://static0.polygonimages.com/wordpress/wp-content/uploads/2026/01/clair-obscur-expedition-33-prologue-screen-1.jpeg?q=49&fit=crop&w=825&dpr=2", "https://static0.polygonimages.com/wordpress/wp-content/uploads/2025/12/clair-obscur-expedition-33-esquie.jpg?q=49&fit=crop&w=825&dpr=2", "https://static0.polygonimages.com/wordpress/wp-content/uploads/sharedimages/2024/12/mixcollage-09-dec-2024-02-13-am-5318.jpg?q=50&fit=crop&w=32&h=32&dpr=1.5"], "videos": [], "review_score": "", "published_ts": 1795015931, "published_at": "2026-11-18T15:32:11Z", "published_th": "18 พ.ย. 2026 • 22:32 น.", "category_hint": "Gaming"}, {"id": 1795015934616, "guid": "VX829WXj93cXF32AoAYvgQ", "original_title": "GTA 6 looks gorgeous, and seeing it run at a stable 30 fps on ageing PS5 Pro hardware makes me hopeful for PC performance", "thai_title": "ประสิทธิภาพของ GTA 6 บน PS5 Pro สร้างความหวังให้กับชาว PC ว่าเกมจะรันได้ลื่นไหล", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["GTA 6 แสดงผลกราฟิกที่น่าทึ่งบน PS5 Pro ด้วยเฟรมเรตที่นิ่งสนิทที่ 30 fps", "Digital Foundry ยืนยันว่าเกมมีการจัดการรายละเอียดและแสงเงาแบบ Ray Tracing ได้อย่างยอดเยี่ยมและไร้รอยต่อ", "แม้ PS5 รุ่นปกติจะทำเฟรมเรตได้ไม่นิ่งเท่ารุ่น Pro แต่ถือเป็นเรื่องปกติเนื่องจากข้อจำกัดด้านฮาร์ดแวร์", "ความเสถียรของเกมบนคอนโซลเป็นสัญญาณบวกสำหรับเวอร์ชัน PC ที่คาดว่าจะปรับแต่งได้มากกว่า", "ผู้เล่นที่มีการ์ดจอ PC รุ่นใหม่คาดหวังได้ว่าจะสามารถทำเฟรมเรตได้สูงกว่า 60 fps อย่างแน่นอน"], "full_paragraphs": ["การได้เห็น Grand Theft Auto 6 รันที่ 30 fps อย่างมั่นคงบนฮาร์ดแวร์ระดับคอนโซลด้วยกราฟิกที่สวยงามขนาดนี้ ถือเป็นสัญญาณที่ดีมากสำหรับการวางจำหน่ายบน PC ในอนาคต แม้ว่าตัวเกมบนคอนโซลจะถูกจำกัดไว้ที่ 30 fps แต่ด้วยความเสถียรและคุณภาพกราฟิกที่น่าทึ่งบน PS5 และ PS5 Pro ทำให้ผมมีความหวังสูงมากว่าเกมจะทำงานได้ดีบนเครื่อง PC ของเรา", "Digital Foundry (DF) ได้ทำการทดสอบประสิทธิภาพบนแพลตฟอร์มคอนโซล และหากตัดสินจากภาพหน้าจอ วิดีโอ และการวิเคราะห์เฟรมเรตจนถึงตอนนี้ GTA 6 ดูเป็นเกมยุคถัดไป (Next-gen) อย่างแท้จริง ทั้งในแง่ของขนาด ขอบเขต และความละเอียดของภาพ", "เรากำลังพูดถึงรายละเอียดที่ประณีตในระยะใกล้ ผสมผสานกับทัศนียภาพที่กว้างไกลและมีชีวิตชีวา ซึ่งทั้งหมดนี้ถูกเติมเต็มด้วยแสงเงาแบบ Ray Tracing ที่น่าทึ่ง และรันได้ที่ 30 fps อย่างคงที่บน PS5 Pro มันยากที่จะบรรยายว่า GTA 6 ดูยอดเยี่ยมเพียงใด มันดูเหมือนเป็นยุคใหม่ของเกมแนว Open World อย่างแท้จริง", "สิ่งที่น่าประทับใจเป็นพิเศษจากการวิเคราะห์ของ DF คือการที่รายละเอียดเล็กน้อยผสมผสานเข้ากับระบบแสงที่ยอดเยี่ยมและทอดสายตาไปได้ไกลโดยไม่สูญเสียรายละเอียด นาทีหนึ่งคุณอาจอยู่ในร้านค้าที่พลุกพล่านพร้อมแสงเงาและการสะท้อนที่สมจริงด้วย Ray Tracing (รวมถึงเงาแบบ Ray Tracing บน PS5 Pro) ชื่นชมรายละเอียดเส้นผมของ NPC หรือแม้แต่เครื่องดื่มที่ค่อยๆ ลดระดับลงในขวดที่คุณดื่ม", "ในนาทีถัดมา คุณสามารถมองข้ามเมืองทั้งเมืองได้โดยไม่สูญเสียรายละเอียดที่สังเกตเห็นได้ ความไร้รอยต่อนี้ทำให้โลกในเกมดูสมจริงและมีชีวิตชีวา", "ส่วนสำคัญของความดื่มด่ำนี้ดูเหมือนจะมาจากระบบแสง คุณจะได้รับ Global Illumination แบบ Ray Tracing เต็มรูปแบบ ซึ่งดูเหมือนจะรันที่ความละเอียด 1440p แต่บน PS5 Pro นั้นให้ภาพที่ดูใกล้เคียงกับ 4K มากกว่า ส่วนเวอร์ชัน PS5 (รุ่นปกติ) จะดูเบลอกว่าเล็กน้อยและขาดความคมชัดของเงาไปบ้าง แต่โดยรวมแล้วทั้งสองเวอร์ชันดูดีมากเท่าที่ผมเห็นจากฟุตเทจของ DF", "ทั้งหมดนี้เป็นข่าวดีหากเกมรันได้ดี และโชคดีที่ดูเหมือนว่าจะเป็นเช่นนั้น ใช่ครับ เรากำลังพูดถึงแค่ 30 fps แต่บน PS5 Pro อย่างน้อยมันก็เป็น 30 fps ที่นิ่งมาก DF ระบุว่าไม่มีอาการกระตุกหรือเฟรมตกให้เห็นเลยตลอดการเล่นกว่า 50 ชั่วโมง และจะมีเพียงช่วงที่เกิดการระเบิดของรถบนถนนเท่านั้นที่เฟรมเรตจะตกลงไปต่ำสุดที่ 24 fps", "สำหรับ PS5 (รุ่นปกติ) นั้นแตกต่างออกไป โดยมีปัญหาในการรักษาเฟรมเรต 30 fps ให้คงที่แม้ในขณะขับรถไปรอบเมือง แต่เนื่องจากคอนโซลรุ่นนี้มีฮาร์ดแวร์ที่ด้อยกว่ารุ่น Pro อย่างเห็นได้ชัด (GPU มีเพียง 36 Compute Units เทียบกับ 60 ใน PS5 Pro) จึงเป็นเรื่องที่คาดเดาได้อยู่แล้ว", "ในส่วนของการเล่น GTA 6 บน PC ผมคิดว่านี่เป็นสัญญาณที่ดี GPU ของ AMD ใน PS5 Pro แม้จะมีฟีเจอร์บางอย่างของ RDNA 3/4 แต่ส่วนใหญ่ยังคงเป็นชิป RDNA 2 ซึ่งเทียบเท่ากับการ์ดจอ Radeon RX 6000-series ดังนั้นแม้แต่ PC รุ่นเก่าที่ใช้การ์ดจอรุ่นสองปีที่แล้ว ก็มีความเป็นไปได้ที่คุณจะได้รับกราฟิกที่สวยงามเหมือนบน PS5 Pro ที่ 30 fps", "ส่วนการตั้งค่ากราฟิกจะเป็นอย่างไรนั้นยังคงต้องรอดูกันต่อไป แต่เมื่อพิจารณาว่าเราน่าจะมีตัวเลือกการปรับแต่งที่มากขึ้นบน PC เราก็น่าจะสามารถรีดประสิทธิภาพออกมาได้สูงสุดตามฮาร์ดแวร์ของเรา", "หากคุณมี PC รุ่นใหม่พร้อมการ์ดจอรุ่นใหม่ ผมคาดหวังว่าจะได้เห็นประสิทธิภาพที่ 60 fps ขึ้นไปและมีความเสถียร ตัวอย่างเช่น RX 9070 XT น่าจะมีประสิทธิภาพเหนือกว่า PS5 Pro อย่างมาก แม้จะมี Compute Units เพิ่มขึ้นเพียงเล็กน้อย แต่ด้วยสถาปัตยกรรมที่ใหม่กว่าและขีดจำกัดพลังงานที่สูงกว่า", "สิ่งที่น่าหวังเป็นพิเศษคือความเสถียรของ 30 fps บน PS5 Pro ผู้คนมักมองแค่ค่าเฉลี่ย แต่ไม่ได้คำนึงถึง Frame Pacing และค่า 1% lows ซึ่งในแง่นี้ GTA 6 ดูเหมือนจะได้รับการปรับแต่งมาเป็นอย่างดี", "Chris ทีมงานของเราได้ใช้เวลากว่า 100 ชั่วโมงกับ GTA 6 เวอร์ชัน PlayStation 5 และได้รับความประทับใจในเชิงบวกอย่างมาก หวังว่าการวางจำหน่ายบน PC จะเป็นไปตามความคาดหวัง และพวกเราที่ใช้เครื่องสเปกเก่าจะสามารถเข้าร่วมสนุกได้โดยไม่ต้องอัปเกรดฮาร์ดแวร์ให้เสียเงินมากเกินไป"], "link": "https://www.pcgamer.com/games/grand-theft-auto/gta-6-looks-gorgeous-and-seeing-it-run-at-a-stable-30-fps-on-ageing-ps5-pro-hardware-makes-me-hopeful-for-pc-performance/", "canonical_link": "https://www.pcgamer.com/games/grand-theft-auto/gta-6-looks-gorgeous-and-seeing-it-run-at-a-stable-30-fps-on-ageing-ps5-pro-hardware-makes-me-hopeful-for-pc-performance", "cover_image_url": "https://cdn.mos.cms.futurecdn.net/FosHyZT6p5CgdQx7uFpwYn-1920-80.jpg", "gallery_images": ["https://img.youtube.com/vi/qsBU0bcpONA/maxresdefault.jpg", "https://cdn.mos.cms.futurecdn.net/3EKkBem8irTjZ5LDfHHu77.jpg", "https://cdn.mos.cms.futurecdn.net/wqLqNQUPM24ozFyN6oWW4E.jpg", "https://cdn.mos.cms.futurecdn.net/FDKAFHgU3vr5QTJyKM9K6J.jpg", "https://cdn.mos.cms.futurecdn.net/oUaRp7ZZEWBSwreBe9h2oR.png", "https://cdn.mos.cms.futurecdn.net/Ee8ZL5rzgTjTNkBFJ4jBnD.png", "https://cdn.mos.cms.futurecdn.net/RrUjSNXW6zguGQpcFL2jZj.jpg", "https://cdn.mos.cms.futurecdn.net/rYxAXFKHCxrG3NcDcXa2sj.png"], "videos": ["https://www.youtube.com/embed/qsBU0bcpONA"], "review_score": "", "published_ts": 1795015321, "published_at": "2026-11-18T15:22:01Z", "published_th": "18 พ.ย. 2026 • 22:22 น.", "category_hint": "Gaming"}, {"id": 1795014955146, "guid": "https://www.polygon.com/world-of-warcraft-forever-player-count-record", "original_title": "World of Warcraft Forever Officially Hits Player Peak it Hasn't Seen in 15 Years", "thai_title": "World of Warcraft: Forever สร้างปรากฏการณ์ยอดผู้เล่นสูงสุดในรอบ 15 ปี", "tag": "Gaming", "sub_tag": "GAMING", "bullet_points": ["World of Warcraft: Forever ประสบความสำเร็จอย่างสูงจนมียอดผู้เล่นรายสัปดาห์สูงที่สุดในรอบ 15 ปี", "สถิติใหม่นี้เทียบเท่ากับช่วงเวลาที่ World of Warcraft: Cataclysm เพิ่งวางจำหน่าย ซึ่งเป็นช่วงที่เกมได้รับความนิยมอย่างมากในอดีต", "ข้อมูลจาก Blizzard ระบุว่ามีการสร้างตัวละครใหม่กว่า 15 ล้านตัว และเกิดการตายในเกมรวมกันเกือบ 200 ล้านครั้งในช่วง 2 สัปดาห์แรก", "Archmage Arugal จากดันเจี้ยน Shadowfang Keep ได้รับการบันทึกว่าเป็นบอสที่สังหารผู้เล่นได้มากที่สุดในเกม", "ความสำเร็จนี้เหนือกว่ากระแสตอบรับของ World of Warcraft Classic ที่เปิดตัวในปี 2019 อย่างชัดเจน"], "full_paragraphs": ["เป็นที่ชัดเจนแล้วว่า World of Warcraft: Forever ซึ่งเป็นการตีความใหม่ของ Blizzard ในช่วงยุคเริ่มต้นของเกม MMO ระดับตำนานเกมนี้ ได้กลายเป็นความสำเร็จครั้งยิ่งใหญ่ โดยในช่วงระหว่างการเปิดให้เล่นแบบ Early Access ก่อนการวางจำหน่ายจริง ตัวเกมสามารถดึงดูดผู้เล่นเก่าให้กลับมาสัมผัสประสบการณ์เดิมได้เป็นจำนวนมากและได้รับคำชมอย่างล้นหลาม และในขณะนี้หลังจากผ่านไปสองสัปดาห์นับตั้งแต่เปิดตัวอย่างเป็นทางการ ก็เห็นได้ชัดว่า Forever กำลังนำพา World of Warcraft กลับไปสู่จุดสูงสุดของความนิยมที่ไม่ได้เห็นมานานหลายปี", "เพื่อเป็นการเฉลิมฉลองความสำเร็จอย่างต่อเนื่องของ Forever บัญชี X อย่างเป็นทางการของ World of Warcraft ได้แชร์สถิติที่น่าสนใจมากมาย ตั้งแต่จำนวนตัวละครและกิลด์ที่ถูกสร้างขึ้น ไปจนถึงจำนวนครั้งที่ผู้เล่นเสียชีวิตในเกม แต่สถิติที่ Holly Longdale รองประธานและผู้อำนวยการสร้างบริหารของเกมได้เปิดเผยออกมานั้น คือสิ่งที่ทำให้เห็นภาพรวมของความสำเร็จนี้ได้อย่างชัดเจนที่สุด โดย Longdale ระบุว่า World of Warcraft มียอดผู้เล่นรายสัปดาห์สูงกว่าช่วงเวลาใดๆ ในรอบ 15 ปีที่ผ่านมา ซึ่งเป็นผลมาจากความนิยมของ Forever", "นั่นหมายความว่า ครั้งล่าสุดที่มีผู้เล่น World of Warcraft มากขนาดนี้ คือช่วงเวลาที่ภาคเสริม Cataclysm ยังคงเป็นภาคเสริมล่าสุดของเกม นอกจากนี้ ยอดความนิยมที่พุ่งสูงขึ้นในครั้งนี้ยังถือว่าใกล้เคียงกับช่วงเวลาที่เกม MMO นี้เปิดตัวครั้งแรกในปี 2004 มากกว่าช่วงเวลาที่ Forever เปิดตัวในปีนี้เสียอีก แม้แต่ World of Warcraft Classic ซึ่งเป็นโปรเจกต์ย้อนวันวานที่ Blizzard ตั้งใจทำขึ้น ก็ยังไม่สามารถสร้างกระแสความสนใจได้มากเท่ากับสิ่งที่เกิดขึ้นในครั้งนี้หลังจากเปิดตัวไปเมื่อปี 2019", "แม้การเปิดเผยของ Longdale จะเป็นประเด็นที่น่าจับตามองที่สุด แต่ก็ยังมีเกร็ดเล็กเกร็ดน้อยที่น่าสนใจในสถิติที่ Blizzard โพสต์เกี่ยวกับช่วงสองสัปดาห์แรกของ Forever โดยมีการสร้างตัวละครใหม่มากกว่า 15 ล้านตัว และตัวละครเหล่านั้นเสียชีวิตรวมกันเกือบ 200 ล้านครั้ง ซึ่งเฉลี่ยแล้วเท่ากับว่าตัวละครหนึ่งตัวตายไปมากกว่า 13 ครั้ง โดยเกือบ 30 ล้านครั้งของการตายนั้นมาจากการต่อสู้แบบ PvP อย่างไรก็ตาม บอสที่สังหารผู้เล่นได้มากที่สุดในเกมกลับกลายเป็น Archmage Arugal จากดันเจี้ยน Shadowfang Keep", "อย่างไรก็ตาม Forever ยังคงเป็นเกมที่สดใหม่ และต้องใช้เวลาเป็นเครื่องพิสูจน์ว่า
