<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure News</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
    .brand-title { font-family: 'Chakra Petch', sans-serif; letter-spacing: -0.02em; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen antialiased selection:bg-[#ff3366] selection:text-white">

  <!-- Clean Minimal Header (Logo + Pure News + Category Tabs) -->
  <header class="border-b border-zinc-800 bg-[#0c0c0e]/95 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Pure News" class="w-10 h-10 rounded-md object-cover border border-zinc-700/80 shadow-sm bg-[#faf7f2]">
        <h1 class="brand-title text-2xl md:text-3xl font-extrabold uppercase text-white tracking-wider leading-none">
          PURE NEWS
        </h1>
      </div>

      <!-- Clean Category Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
        <button onclick="filterTag('ALL')" id="filterALL" class="px-3.5 py-1.5 bg-white text-black font-mono font-bold text-xs rounded transition whitespace-nowrap">ALL</button>
        <button onclick="filterTag('Football')" id="filterFootball" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-mono text-xs rounded transition whitespace-nowrap">PREMIER LEAGUE</button>
        <button onclick="filterTag('Technology')" id="filterTechnology" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-cyan-400 font-mono text-xs rounded transition whitespace-nowrap">THE VERGE</button>
        <button onclick="filterTag('Gadgets')" id="filterGadgets" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-emerald-400 font-mono text-xs rounded transition whitespace-nowrap">GADGETS</button>
        <button onclick="filterTag('Gaming')" id="filterGaming" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-amber-400 font-mono text-xs rounded transition whitespace-nowrap">GAMING</button>
        <button onclick="filterTag('Review')" id="filterReview" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-purple-400 font-mono text-xs rounded transition whitespace-nowrap">GAME REVIEWS</button>
        <button onclick="refreshLiveNews(this)" title="ดึงข้อมูลข่าวล่าสุด" class="p-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 rounded transition ml-1 shrink-0">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards rendered here -->
    </div>
  </main>

  <!-- Top-Pinned Modal Dialog -->
  <div id="modalOverlay" onclick="if(event.target===this) closeModal()" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-start sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="w-full max-w-3xl bg-[#0c0c0e] sm:border sm:border-zinc-800 sm:rounded-lg shadow-2xl overflow-hidden my-0 sm:my-auto max-h-screen sm:max-h-[92vh] flex flex-col">
      
      <!-- Modal Header (Sticky) -->
      <div class="flex items-center justify-between px-3.5 sm:px-6 py-3 border-b border-zinc-800 bg-[#0e0e11] sticky top-0 z-10 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modalTag" class="px-2 py-0.5 rounded text-[11px] sm:text-xs font-mono font-bold uppercase tracking-wider bg-[#ff3366]/15 text-[#ff3366] border border-[#ff3366]/30 truncate"></span>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <div id="ttsControls" class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button id="ttsBtn" onclick="toggleSpeech()" title="ฟังเสียงอ่านข่าว" class="px-2.5 py-1 text-xs font-mono font-bold text-emerald-400 hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1">
              <span id="ttsIcon">🔊</span>
              <span id="ttsLabel" class="hidden sm:inline">ฟังข่าว</span>
            </button>
            <button id="ttsRateBtn" onclick="cycleSpeechRate()" title="ความเร็วเสียงอ่าน" class="px-2 py-1 text-[11px] font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition">1x</button>
          </div>
          <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button onclick="changeFontSize(-1)" title="ลดขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A-</button>
            <span id="fontSizeLabel" class="hidden sm:inline text-[11px] font-mono text-zinc-500 px-1.5 select-none">100%</span>
            <button onclick="changeFontSize(1)" title="เพิ่มขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A+</button>
          </div>
          <button onclick="closeModal()" aria-label="Close" class="w-8 h-8 rounded-full bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center text-xl transition leading-none">&times;</button>
        </div>
      </div>

      <!-- Modal Body (Always resets to scrollTop = 0) -->
      <div id="modalBody" class="p-5 sm:p-6 md:p-8 overflow-y-auto space-y-5 sm:space-y-6">
        <!-- HD Cover Image (16:9 aspect-video so cover never gets awkwardly cropped) -->
        <div class="w-full aspect-video overflow-hidden rounded-md border border-zinc-800 bg-zinc-950 relative">
          <img id="modalImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" referrerpolicy="no-referrer" alt="" class="w-full h-full object-cover">
          <div id="modalScoreBadge" class="hidden absolute top-3 right-3 bg-[#ff3366] text-white font-mono font-extrabold text-sm px-3 py-1.5 rounded shadow-xl border border-white/20"></div>
        </div>

        <!-- Sub-Tag & Publish Date Row -->
        <div class="flex items-center flex-wrap gap-2 text-xs font-mono text-zinc-400">
          <span id="modalSubTag" class="hidden px-2 py-0.5 rounded text-[11px] font-mono font-semibold uppercase tracking-wider bg-zinc-800 text-zinc-200 border border-zinc-700"></span>
          <span id="modalDate" class="text-xs font-mono text-zinc-400"></span>
        </div>

        <!-- Title -->
        <h2 id="modalTitle" class="brand-title text-xl md:text-2xl font-bold text-white leading-snug"></h2>

        <!-- Key Facts Box -->
        <div class="bg-black/60 border-l-2 border-[#ff3366] p-4 rounded-sm">
          <div class="text-xs font-mono text-[#ff3366] uppercase font-bold tracking-wider mb-2">📌 สรุปประเด็นสำคัญ (KEY FACTS):</div>
          <ul id="modalBullets" class="space-y-2 text-sm text-zinc-200"></ul>
        </div>

        <!-- Video Section (Shown when article has YouTube trailers/videos) -->
        <div id="modalVideoSection" class="hidden space-y-3 pt-1">
          <div class="text-xs font-mono text-red-400 uppercase tracking-widest flex items-center gap-1.5 font-bold">
            <span>🎬 วิดีโอตัวอย่าง / TRAILER ในข่าว :</span>
          </div>
          <div id="modalVideoContainer" class="space-y-4"></div>
        </div>

        <!-- Full Multi-Paragraph Translation with Interleaved Magazine Screenshots -->
        <div class="space-y-4 pt-2">
          <div class="text-xs font-mono text-zinc-500 uppercase tracking-widest">// เนื้อหาฉบับเต็ม :</div>
          <div id="modalFullContent" class="space-y-4 text-zinc-300 text-sm md:text-base leading-relaxed font-light"></div>
        </div>

        <!-- Remaining Screenshots Gallery -->
        <div id="modalGallerySection" class="hidden pt-4 border-t border-zinc-800/80">
          <div class="text-xs font-mono text-amber-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
            <span>📸 ภาพประกอบเพิ่มเติม :</span>
          </div>
          <div id="modalGalleryGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t border-zinc-800 bg-[#0e0e11] flex items-center justify-between">
        <a id="modalSource" href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-zinc-900 border border-zinc-700 text-xs font-mono text-white rounded-sm hover:bg-zinc-800 flex items-center gap-1.5 transition">
          <span>อ่านต้นฉบับเต็ม</span>
          <span>→</span>
        </a>
        <button onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-mono text-zinc-300 rounded-sm transition">ปิด</button>
      </div>

    </div>
  </div>

  <script>
    const TRANSPARENT_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    const SVG_FALLBACK_URI = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#18181b"/><stop offset="100%" stop-color="#09090b"/>' +
      '</linearGradient></defs>' +
      '<rect width="800" height="450" fill="url(#g)"/>' +
      '<text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" fill="#ff3366" font-family="monospace" font-size="36" font-weight="bold">PURE NEWS</text>' +
      '<text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="16">IMAGE UNAVAILABLE</text>' +
      '</svg>'
    );
    const CATEGORY_FALLBACKS = {
      Football: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&q=80',
      Technology: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80',
      Gadgets: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1200&q=80',
      Gaming: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200&q=80',
      Review: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200&q=80'
    };

    const FONT_STEPS = [
      { pct: '85%', body: '0.875rem', bullet: '0.8125rem', title: '1.25rem' },
      { pct: '100%', body: '1rem', bullet: '0.875rem', title: '1.5rem' },
      { pct: '115%', body: '1.125rem', bullet: '1rem', title: '1.65rem' },
      { pct: '130%', body: '1.25rem', bullet: '1.0625rem', title: '1.8rem' },
      { pct: '150%', body: '1.4rem', bullet: '1.15rem', title: '2rem' }
    ];
    let currentFontIdx = 1;
    try {
      const savedIdx = parseInt(localStorage.getItem('pureNewsFontIdx') || '1', 10);
      if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < FONT_STEPS.length) {
        currentFontIdx = savedIdx;
      }

ารดำเนินการคว้าตัว สกอตต์ ในช่วงตลาดหน้าหนาวเดือนมกราคมหรือช่วงซัมเมอร์หน้ามีความเป็นไปได้มากขึ้น", "ในขณะที่ เดแคลน ไรซ์, บรูโน กิมาไรส์ และ ไมลส์ ลูอิส-สเกลลี กำลังทำผลงานได้อย่างยอดเยี่ยมในฤดูกาลนี้ มิเกล เมริโน กลายเป็นตัวเต็งที่อาจถูกปล่อยตัวออกไปเนื่องจากได้รับโอกาสลงสนามน้อย โดยเขาเพิ่งได้ออกสตาร์ทเป็นตัวจริงในพรีเมียร์ลีกเพียงนัดเดียวเท่านั้น และได้ให้สัมภาษณ์ระหว่างเก็บตัวกับทีมชาติสเปนเมื่อสัปดาห์ก่อนว่าเขาต้องการโอกาสลงเล่นมากกว่านี้", "เมริโน กล่าวถึงสถานการณ์ของตนเองว่า: \"เรารู้ดีว่าบทบาทของเราคืออะไร และเราทั้งคู่ต่างใจเย็นและมุ่งมั่นที่จะฝึกซ้อมอย่างหนักเพื่อแสดงให้เห็นว่าเรายังสามารถมีส่วนร่วมกับทีมได้ต่อไป\" อย่างไรก็ตามเขายอมรับว่า: \"การไม่ได้ลงสนามเป็นส่วนใหญ่ไม่ใช่เรื่องที่น่าพอใจสำหรับนักฟุตบอล อาร์เซนอลในปัจจุบันคือทีมที่ดีที่สุดในโลก และมันเป็นเรื่องยากมากที่จะได้รับโอกาสลงเล่น\"", "สำหรับ อเล็กซ์ สกอตต์ ถือเป็นหนึ่งในนักเตะเนื้อหอมที่สุดในตลาดซื้อขายนักเตะเดือนมกราคมนี้ โดยบอร์นมัธเริ่มมีท่าทีที่อ่อนลงเกี่ยวกับการขายนักเตะ หลังจากไม่สามารถตกลงสัญญาฉบับใหม่กับแข้งวัย 23 ปีรายนี้ได้ แม้ว่าพวกเขาจะยังคงต้องการค่าตัวในระดับสูงใกล้เคียง 100 ล้านปอนด์รวมเงื่อนไขเสริม แต่แหล่งข่าวระบุว่าตัวเลขราว 75-80 ล้านปอนด์บวกโบนัสอาจเพียงพอที่จะทำให้ดีลนี้เกิดขึ้นได้", "ทางด้าน เชลซี ยังคงแสดงความสนใจอย่างต่อเนื่องและเชื่อว่าพวกเขามีความได้เปรียบด้านการเงินเหนือสโมสรอื่น แต่สกอตต์ไม่ใช่เป้าหมายเดียวของพวกเขา โดย ชาบี อลอนโซ กุนซือเชลซี ยังคงเปิดกว้างในการเซ็นสัญญากองกลางเพิ่มหลังจากการจากไปของ เอ็นโซ เฟร์นานเดซ ในช่วงซัมเมอร์ที่ผ่านมา", "ขณะที่ ลิเวอร์พูล ต้องการเสริมความแข็งแกร่งในแดนกลางในระยะยาว โดยมองว่าสกอตต์เป็นตัวเลือกที่สมบูรณ์แบบในการเพิ่มความเฉลียวฉลาดและการผ่านบอลให้กับทีม โดยเฉพาะอย่างยิ่ง อันโดนี อิราโอลา กุนซือลิเวอร์พูล ซึ่งเคยร่วมงานกับสกอตต์ที่บอร์นมัธมาก่อน ยังคงชื่นชมในฝีเท้าของนักเตะรายนี้และเชื่อว่าเขาจะเป็นจิ๊กซอว์สำคัญในแผนการทำทีมในอนาคต", "นอกจากแผนการเสริมแดนกลางแล้ว อาร์เซนอลยังคงติดตามสถานการณ์ของ อันโตนิโอ นูซา จาก แอร์เบ ไลป์ซิก และ เควิน ชาเด จาก เบรนท์ฟอร์ด เพื่อเป็นทางเลือกในการเสริมแนวรุก หลังจากที่พลาดการคว้าตัวเป้าหมายหลัก ะใหม่ที่จะดึงตัวเข้ามาในเดือนมกราคม", "สำหรับเป้าหมายในแนวรับ คาลวิน บาสซีย์ ของฟูแล่ม และ จาร์ราด แบรนธ์เวต ของเอฟเวอร์ตัน คือสองนักเตะที่ยูไนเต็ดกำลังจับตามอง แม้ฟูแล่มจะมีผลงานที่ไม่สู้ดีนักในฤดูกาลนี้ แต่บาสซีย์ถือเป็นนักเตะที่โชว์ฟอร์มได้น่าประทับใจ โดยเหลือสัญญาอีกเพียง 6 เดือน แต่ฟูแล่มมีออปชั่นขยายสัญญาเพิ่มได้อีก 1 ปี", "อัลบาโร่ อาร์เบลัว เฮดโค้ชของฟูแล่ม ได้กล่าวถึงกองหลังวัย 26 ปีรายนี้ว่าเป็นหนึ่งในกองหลังที่ดีที่สุดในโลก และยืนยันว่าเป้าหมายของสโมสรคือการต่อสัญญาฉบับใหม่กับบาสซีย์", "ในขณะที่ แบรนธ์เวต เป็นนักเตะที่ยูไนเต็ดให้ความสนใจมาอย่างยาวนาน โดยในปี 2024 ยูไนเต็ดเคยยื่นข้อเสนอขอซื้อตัวกองหลังรายนี้ถึง 2 ครั้ง แต่ถูกปฏิเสธทั้งหมด ซึ่งข้อเสนอครั้งที่สองมีมูลค่าสูงถึงประมาณ 50 ล้านปอนด์ โดยเอฟเวอร์ตันอยู่ในสถานะที่ได้เปรียบในการเจรจาเนื่องจากนักเตะวัย 24 ปีรายนี้ยังมีสัญญาอยู่จนถึงซัมเมอร์ปี 2030", "ยูไนเต็ดกำลังมองหาตัวเลือกเซ็นเตอร์แบ็กเท้าซ้ายเพื่อพิจารณาหาตัวแทนของ ลิซานโดร มาร์ติเนซ ซึ่งอนาคตในถิ่นโอลด์ แทรฟฟอร์ด ดูมีความไม่แน่นอนเมื่อถึงซัมเมอร์หน้า เนื่องจากสัญญาปัจจุบันกำลังจะหมดลง แม้สโมสรจะมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือน แต่มีแนวโน้มว่าเขาจะไม่ได้รับข้อเสนอสัญญาฉบับใหม่ ตามที่ Sky Sports News ได้รายงานไปเมื่อเดือนที่แล้ว", "สโมสรตัดสินใจไม่เสริมแบ็กซ้ายในช่วงซัมเมอร์ที่ผ่านมาเนื่องจากต้องการโฟกัสไปที่การสร้างแดนกลางใหม่ โดยเชื่อว่าเป้าหมายระยะยาวของพวกเขาจะสามารถคว้าตัวได้ง่ายขึ้นในปีหน้า ซึ่งยังคงต้องติดตามว่าจะเป็นเช่นนั้นจริงหรือไม่เมื่อจบฤดูกาล และจะส่งผลอย่างไรต่อผู้เล่นอย่าง ลูอิส ฮอลล์ ของนิวคาสเซิล ยูไนเต็ด แต่ด้วยการที่ทีมต้องใช้ผู้เล่นถึง 5 คนในตำแหน่งนี้โดยประสบความสำเร็จเพียงเล็กน้อย สโมสรจึงจะพิจารณาหาตัวเลือกแบ็กซ้ายเข้ามาเสริมในเดือนมกราคม", "แอนโทนี โรบินสัน แบ็กซ้ายของฟูแล่ม ยังคงเป็นนักเตะที่ถูกจับตามองตามรายงานครั้งแรกของ Sky Sports News เมื่อเดือนมีนาคมที่ผ่านมา ฟูแล่มรับทราบถึงความสนใจที่มีต่อโรบินสันอย่างกว้างขวาง แต่ยังไม่มีสโมสรใดขยับตัวอย่างจริงจังสำหรับนักเตะวัย 29 ปีรายนี้ ซึ่งเคยร่วมงานกับโปเช็ตติโน่สมัยคุมทีมชาติสหรัฐอเมริกา", "อเลฮานโดร บัลเด้ ของบาร์เซโลน่า เป็นนักเตะที่มีข่าวเชื่อมโยงกับยูไนเต็ดในช่วงซัม . 2026 • 18:00 น.", "category_hint": "Football"}, {"id": 1795010493121, "guid": "https://www.skysports.com/football/live-blog/11095/13353569/leeds-united-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-and-contracts", "original_title": "Leeds latest: KMI panel split on if Bogle should've seen red vs Spurs", "thai_title": "อัปเดตสถานการณ์ ลีดส์: คณะกรรมการ KMI เสียงแตกกรณี โบเกิล ควรโดนใบแดงในเกมพบ สเปอร์ส หรือไม่", "tag": "Football", "sub_tag": "SPURS", "bullet_points": ["คณะกรรมการอิสระด้านเหตุการณ์สำคัญในการแข่งขัน (KMI) มีความเห็นไม่ตรงกันเกี่ยวกับจังหวะการเข้าปะทะของ เจย์เดน โบเกิล ในเกมที่ ลีดส์ ยูไนเต็ด พบกับ ท็อตแนม ฮอตสเปอร์", "ประเด็นถกเถียงสำคัญคือการตัดสินใจว่าจังหวะดังกล่าวสมควรเป็นใบแดงโดยตรงหรือไม่ ซึ่งส่งผลต่อรูปเกมและผลการแข่งขัน", "ความเห็นของคณะกรรมการสะท้อนให้เห็นถึงความซับซ้อนในการตีความกฎกติกาของ VAR และการตัดสินในสนาม", "สถานการณ์นี้กลายเป็นประเด็นร้อนที่แฟนบอลและสื่อมวลชนต่างให้ความสนใจถึงมาตรฐานการตัดสินในพรีเมียร์ลีก"], "full_paragraphs": ["ความเคลื่อนไหวล่าสุดของสโมสร ลีดส์ ยูไนเต็ด กำลังตกเป็นประเด็นที่ถูกวิพากษ์วิจารณ์อย่างหนักในวงการฟุตบอลอังกฤษ โดยเฉพาะกรณีการตัดสินของกรรมการในเกมที่พบกับ ท็อตแนม ฮอตสเปอร์ ซึ่งล่าสุดคณะกรรมการอิสระด้านเหตุการณ์สำคัญในการแข่งขัน (Key Match Incidents - KMI) ได้ออกมาเปิดเผยว่ามีความเห็นไม่ตรงกันเกี่ยวกับจังหวะการเข้าปะทะของ เจย์เดน โบเกิล ว่าสมควรได้รับใบแดงโดยตรงหรือไม่", "เหตุการณ์ดังกล่าวเกิดขึ้นในช่วงเวลาสำคัญของเกม ซึ่งส่งผลกระทบโดยตรงต่อรูปเกมและการครองบอลของทั้งสองฝั่ง โดยคณะกรรมการ KMI ได้ทำการวิเคราะห์ย้อนหลังผ่านภาพช้าหลายมุมมองเพื่อประเมินว่าการเข้าสกัดของ โบเกิล เข้าข่ายการเล่นที่รุนแรงเกินกว่าเหตุ (Serious Foul Play) หรือไม่", "รายงานระบุว่าสมาชิกภายในคณะกรรมการมีความเห็นที่แตกออกเป็นสองฝั่งอย่างชัดเจน ฝ่ายหนึ่งมองว่าจังหวะดังกล่าวมีความรุนแรงและเจตนาที่ชัดเจนซึ่งสมควรแก่การถูกไล่ออกจากสนาม ในขณะที่อีกฝ่ายมองว่าเป็นการเข้าปะทะที่เน้นไปที่บอลและมีความหนักหน่วงตามธรรมชาติของเกมฟุตบอลพรีเมียร์ลีก", "ความเห็นที่แตกต่างกันนี้สะท้อนให้เห็นถึงความท้าทายอย่างต่อเนื่องใ ?", "thai_title": "เมื่อ วิลเลียม ซาลิบา คืนสนาม: ปริศนาการจัดทัพแนวรับของ มิเกล อาร์เตตา กับฟอร์มอันยอดเยี่ยมของ เอซรี คอนซา", "tag": "Football", "sub_tag": "ARSENAL", "bullet_points": ["เอซรี คอนซา โชว์ฟอร์มได้อย่างโดดเด่นในตำแหน่งเซ็นเตอร์แบ็กแทนที่ วิลเลียม ซาลิบา ที่บาดเจ็บ โดยมีสถิติการผ่านบอลและการดวลตัวต่อตัวที่ยอดเยี่ยม", "การกลับมาของ ซาลิบา สร้างความหนักใจให้ มิเกล อาร์เตตา ในการเลือกผู้เล่นลงสนามในช่วงโปรแกรมการแข่งขันที่หนักหน่วงก่อนถึงช่วงคริสต์มาส", "สถิติชี้ให้เห็นว่าการขาด ซาลิบา ส่งผลต่อความสูงของไลน์กองหลังอาร์เซนอล ซึ่งส่งผลกระทบต่อการกดดันคู่แข่งตามสไตล์ของทีม", "อาร์เตตา อาจพิจารณาปรับตำแหน่ง คอนซา ไปเล่นแบ็กขวาหรือสลับตำแหน่งกับ กาเบรียล เพื่อรักษาความสมดุลของทีมในระยะยาว"], "full_paragraphs": ["เอซรี คอนซา กลายเป็นดาวเด่นในแนวรับของอาร์เซนอลนับตั้งแต่ย้ายมาจาก แอสตัน วิลลา ด้วยค่าตัว 55 ล้านปอนด์ในช่วงซัมเมอร์ที่ผ่านมา อย่างไรก็ตาม วิลเลียม ซาลิบา ได้กลับมาฟิตสมบูรณ์พร้อมทวงตำแหน่งตัวจริงคืนแล้ว ซึ่งถือเป็นช่วงเวลาสำคัญเนื่องจากทัพ 'ปืนใหญ่' มีโปรแกรมหนักรออยู่ในช่วงหลังพักเบรกทีมชาติ ทั้งการพบกับ แมนเชสเตอร์ ซิตี้, เรอัล มาดริด และ ท็อตแนม ฮอตสเปอร์", "การกลับมาของ ซาลิบา ถือเป็นข่าวดีสำหรับแชมป์พรีเมียร์ลีก แต่การจะบอกว่าอาร์เซนอลคิดถึงเขามากในช่วงที่ผ่านมาอาจจะดูน้อยไป เพราะ คอนซา ได้ก้าวขึ้นมาทำหน้าที่แทนได้อย่างยอดเยี่ยม ไม่เพียงแต่เขาจะทดแทนกองหลังชาวฝรั่งเศสได้อย่างไร้รอยต่อ แต่เขายังพิสูจน์ให้เห็นว่ามีมาตรฐานการเล่นที่เทียบเท่ากับช่วงที่ ซาลิบา พาทีมคว้าแชมป์ลีก โดยข้อมูลบางส่วนยังระบุว่า คอนซา ทำผลงานได้ในระดับที่สูงกว่าด้วยซ้ำ", "ด้วยการที่ ซาลิบา กลับมาซ้อมและเรียกความฟิตอย่างต่อเนื่อง อาร์เตตา จึงมีภารกิจในการจัดการเรื่องการส่งผู้เล่นคนสำคัญกลับสู่ทีม ในขณะเดียวกันก็ต้องรักษาความมั่นใจของนักเตะที่กำลังอยู่ในฟอร์มที่ดีที่สุดอย่าง คอนซา เอาไว้ด้วย ซึ่งการตัดสินใจนี้มีความสำคัญอย่างยิ่งเมื่อพิจารณาจากโปรแกรมการแข่งขันที่จะต้องพบกับทีมอย่าง โบรุสเซีย ดอร์ทมุนด์, แมนเชสเตอร์ ซิตี้, ท็อตแนม, เรอัล มาดริด และ แมนเชสเตอร์ ยูไนเต็ด ก่อนถึงช่วงคริสต์มาส", "คอนซา ย้ายมาอาร์เซนอลด้วยชื่อเสียงในด้านการผ่านบอลที่แม่นยำและความสามารถในการดวลตัวต่อตัว ซึ่งเขายังคงรักษามาตรฐานนั้นไว้ได้เป็นอย่างดี โดยในฤดูกาลนี้เขาอยู่อันดับที่สองของพรีเมียร์ลีกทั้งในด้านความแม่นยำในการผ่านบอลและเปอร์เซ็นต์การชนะในการดวลบนพื้นสนาม ซึ่งตัวเลขเหล่านี้ทำให้เขาเป็นหนึ่งในกองหลังที่ดีที่สุดของลีกในแง่ของภาพรวมการเล่น", "ตามปกติแล้วฟอร์มการเล่นระดับนี้ควรทำให้ คอนซา เป็นผู้เล่นที่ขาดไม่ได้ แต่ปัญหาคือหนึ่งในเซ็นเตอร์แบ็กที่ดีที่สุดในโลกกำลังจะกลับมา ซึ่ง ซาลิบา ถือเป็นหัวใจสำคัญของแนวรับที่ อาร์เตตา สร้างขึ้นมาที่สโมสรแห่งนี้", "จุดที่แสดงให้เห็นถึงความสำคัญของ ซาลิบา คือความสูงเฉลี่ยของไลน์กองหลังอาร์เซนอล ในฤดูกาลนี้เมื่อไม่มี ซาลิบา แนวรับของปืนใหญ่ถอยต่ำลงอย่างน้อยหนึ่งเมตร ไม่ว่าจะเป็นจังหวะรุกหรือรับ แม้จะเป็นการเปลี่ยนแปลงเพียงเล็กน้อย แต่ในระดับนี้รายละเอียดเพียงเล็กน้อยก็สร้างความแตกต่างได้มหาศาล", "เมื่อ ซาลิบา ก้าวขึ้นมาเป็นตัวหลักในฤดูกาล 2022/23 แนวรับของอาร์เซนอลก็เปลี่ยนไปอย่างสิ้นเชิง ไลน์กองหลังขยับสูงขึ้นสองเมตรเมื่อเทียบกับฤดูกาลก่อนหน้า ส่วนหนึ่งเป็นเพราะความเร็วของกองหลังชาวฝรั่งเศส ซึ่งมักถูกเปรียบเปรยว่าเป็น 'สูตรโกง' (cheat code) ในการหยุดจังหวะสวนกลับของคู่แข่งได้อย่างง่ายดาย", "การยืนไลน์สูงช่วยให้คู่แข่งอยู่ห่างจากประตูของอาร์เซนอลมากขึ้น นำไปสู่การกดดันที่ดุดันและการครองบอลที่เหนือกว่า ซึ่ง อาร์เตตา มักกล่าวเสมอว่าเป้าหมายสำคัญของทีมคือ 'การไม่เปิดโอกาสให้คู่แข่งได้หายใจ'", "คอนซา ได้ทำหน้าที่กวาดล้างในไลน์กองหลังสูงของอาร์เซนอลในฤดูกาลนี้ได้ดีพอสมควร โดยเขาทำสถิติเข้าสกัดในฐานะคนสุดท้าย (last-man tackle) ได้สำเร็จถึง 3 ครั้ง ซึ่งรวมถึงจังหวะสำคัญที่ช่วยป้องกันประตูจาก มอร์แกน โรเจอร์ส ของเชลซี และ เลียม ดีแลป ของน็อตติงแฮม ฟอเรสต์ ช่วยให้ทีมรักษาชัยชนะได้สำเร็จ", "อย่างไรก็ตาม คู่เซ็นเตอร์แบ็กอย่าง คอนซา และ กาเบรียล ทำสถิติเข้าสกัดในฐานะคนสุดท้ายรวมกันในฤดูกาลนี้ไปแล้ว 7 ครั้ง ซึ่งมากกว่าที่ ซาลิบา และ กาเบรียล ทำไว้ตลอดทั้งฤดูกาลที่แล้ว (5 ครั้ง) ซึ่งสะท้อนว่าคู่แข่งเริ่มมีพื้นที่ในการเล่นและสร้างความกดดันได้มากขึ้นกว่าเดิม", "ในระบบที่อาร์เซนอลภาคภูมิใจกับการไม่เปิดโอกาสให้คู่แข่งได้ลุ้นทำประตู การนำ 'สูตรโกง' อย่าง ซาลิบา กลับมาจึงเป็นเรื่องที่มีมูลค่ามหาศาล", "สถานการณ์หนึ่งที่ คอนซา และ ซาลิบา อาจได้ลงเล่นร่วมกันคือการขยับกองหลังทีมชาติอังกฤษไปเล่นแบ็กขวา ซึ่งเป็นตำแหน่งที่เขาเคยเล่นมาก่อนในอาชีพค้าแข้ง ซึ่งจะสอดคล้องกับแผนการใช้แบ็กขวาของ อาร์เตตา ที่มักจะใช้ผู้เล่นที่ถนัดตำแหน่งนี้โดยธรรมชาติในช่วงหลัง เช่น เยอร์เรียน ทิมเบอร์, เบน ไวท์, ริคคาร์โด คาลาฟิออรี และ ปิเอโร ฮินกาปี ซึ่งล้วนเป็นเซ็นเตอร์แบ็กที่ถูกปรับมาเล่นริมเส้น", "อย่างไรก็ตาม ในช่วงสองปีที่ผ่านมา คอนซา เชี่ยวชาญในตำแหน่งเซ็นเตอร์แบ็กเป็นหลัก จนไม่ได้ลงเล่นในพรีเมียร์ลีกในตำแหน่งแบ็กขวามาเกือบสองปีแล้ว โดยการออกสตาร์ทในลีกครั้งล่าสุดในฐานะแบ็กขวาต้องย้อนไปถึงเดือนธันวาคม 2024 สมัยอยู่กับ แอสตัน วิลลา และตลอด 5,813 นาทีในลีกที่ผ่านมา หรือเทียบเท่ากับเกือบ 65 นัด เขาเล่นในตำแหน่งเซ็นเตอร์แบ็กมาโดยตลอด โดย อาร์เตตา กล่าวเมื่อต้นเดือนนี้ว่า 'เอซรี เขาเล่นเป็นแบ็กได้ แต่ผมคิดว่าตำแหน่งหลักของเขาคือเซ็นเตอร์แบ็ก'", "แน่นอนว่า คอนซา และ ซาลิบา สามารถเล่นเซ็นเตอร์แบ็กคู่กันได้ โดยให้ กาเบรียล ได้พักบ้างในยามจำเป็น ซึ่งอาจหมายถึงการขยับคนใดคนหนึ่งไปเล่นฝั่งซ้ายและถอดเซ็นเตอร์แบ็กเท้าซ้ายออกจากทีม แต่ผู้จัดการทีมอาร์เซนอลก็มั่นใจในเรื่องนี้ โดย อาร์เตตา กล่าวถึง คอนซา ว่า 'เขาสามารถเล่นได้ทั้งขวาและซ้าย วิลลี ก็เคยทำแบบเดียวกันกับทีมชาติและที่อาร์เซนอล นั่นจะเป็นสิ่งที่ส่งผลบวกต่อทีมอย่างมาก'", "แม้ว่านี่อาจเป็นเรื่องปวดหัวสำหรับ อาร์เตตา แต่มันก็เป็นปัญหาในเชิงบวก อาร์เซนอลเคยได้รับผลกระทบจากการบาดเจ็บของ ซาลิบา และ กาเบรียล ในอดีต ซึ่งบางครั้งทำให้พวกเขาพลาดแชมป์พรีเมียร์ลีกและแชมเปียนส์ลีกในช่วงหลายปีที่ผ่านมา", "ตอนนี้ทีมอยู่ในสถานการณ์ที่ดีขึ้น แต่ อาร์เตตา ยังคงต้องตัดสินใจในเรื่องสำคัญให้ถูกต้อง ซึ่งในฤดูกาลนี้ผู้จัดการทีมอาร์เซนอลบางครั้งก็มีการจัดตัวที่น่าตั้งคำถามในแง่ของโปรไฟล์ผู้เล่นที่เลือกใช้", "ในเกมที่แพ้ ไบรท์ตัน 3-0 เขาให้ บรูโน กิมาไรส์ ออกสตาร์ทในแดนกลางเป็นครั้งแรก ในขณะที่ ไมลส์ ลูอิส-สเกลลี ผู้เล่นที่รับมือกับการกดดันได้ดีกว่าอาจเป็นตัวเลือกที่เหมาะสมกว่าในการเจอกับทีมที่เล่นเพรสซิงหนักอย่าง 'นกนางนวล' และในเกมล่าสุดที่ชนะ ฮัลล์ ซิตี้ อาร์เตตา เลือกใช้ ไค ฮาแวร์ตซ์ ในแดนหน้า ทั้งที่เกมต้องการความดุดันของ วิคเตอร์ โยเคเรส ในการปะทะกับสามเซ็นเตอร์แบ็กของทีมเยือน", "ตอนนี้ อาร์เตตา ็กซ้ายทั่วไป", "แม้จะเคยถูกมองข้ามในการติดทีมชาติชุดลุยฟุตบอลโลกช่วงซัมเมอร์ที่ผ่านมา แต่ปัจจุบันฮอลล์กำลังก้าวขึ้นมาเป็นตัวเลือกอันดับหนึ่งในตำแหน่งแบ็กซ้ายของทีมชาติอังกฤษอย่างเต็มตัว"], "full_paragraphs": ["ลูอิส ฮอลล์ โชว์ฟอร์มได้อย่างยอดเยี่ยมให้กับทีมชาติอังกฤษในเกมที่บุกไปเอาชนะสเปนถึงกรุงมาดริด และกำลังก้าวขึ้นมาเป็นตัวเลือกอันดับหนึ่งในตำแหน่งแบ็กซ้ายอย่างเต็มตัว โดยได้รับข้อมูลเชิงลึกจากผู้ที่เคยใช้งานเขาในฐานะกองกลางสมัยเป็นเยาวชนที่เชลซี อดัม เบต ได้วิเคราะห์ถึงเหตุผลสำคัญที่ทำให้ดาวเตะรายนี้พัฒนาขึ้นอย่างก้าวกระโดด", "ช่วงเวลาที่น่าตื่นตาตื่นใจที่สุดเกิดขึ้นในนาทีที่ 18 เมื่อต้องใช้ผู้เล่นสเปนถึง 5 คนเพื่อหยุดยั้งการลากเลื้อยผ่านแนวรับของเขา แต่จังหวะที่แสดงให้เห็นถึงความมั่นใจและชั้นเชิงของ ลูอิส ฮอลล์ ได้ดีที่สุดคือการพลิกบอลหนี ฟาเบียน รูอิซ และ มิเกล เมริโน ในนาทีที่ 7 ของการแข่งขัน", "สถานการณ์ในจังหวะดังกล่าวดูเหมือนจะเป็นอันตรายสำหรับอังกฤษ แต่ฮอลล์กลับดูนิ่งและสบายมากในบทบาทตรงกลางสนาม ผลงานของเขาในชัยชนะ 3-2 ที่มาดริดเน้นย้ำให้เห็นถึงคุณภาพทั้งในยามที่มีบอลและไม่มีบอล โดยในครึ่งแรกเขาสามารถเลี้ยงบอลผ่านคู่แข่งได้ถึง 5 ครั้ง ซึ่งมากกว่า ลามีน ยามาล ถึง 5 ครั้ง", "เขาควรจะมีชื่อติดทีมชาติไปลุยฟุตบอลโลกในช่วงซัมเมอร์ที่ผ่านมา คนส่วนใหญ่อาจจะเลือกผู้เล่นจากนิวคาสเซิลรายนี้ แต่โชคร้ายสำหรับฮอลล์ที่กุนซือทีมชาติอังกฤษอย่าง โทมัส ทูเคิล ไม่ได้คิดเช่นนั้น ทำให้ทีมต้องเข้าสู่ทัวร์นาเมนต์โดยมีแบ็กซ้ายอาชีพเพียงคนเดียวเท่านั้น", "อย่างไรก็ตาม สิ่งที่น่าขันคือคนที่รู้จักฮอลล์ดีที่สุดอาจจะไม่จัดเขาอยู่ในหมวดหมู่แบ็กซ้ายเสียทีเดียว อันที่จริงท่าหมุนตัวที่ทำให้เหล่าผู้ชนะฟุตบอลโลกของสเปนต้องงุนงงนั้น เป็นจุดเด่นในเกมของเขาตั้งแต่สมัยเป็นเยาวชนที่เชลซี ซึ่งในตอนนั้นเขาไม่ใช่แบ็กซ้ายเลย", "เอ็ด แบรนด์ กล่าวกับ สกาย สปอร์ตส์ ว่า 'บ่อยครั้งที่ผมเล่นแผน 3-4-2-1 โดยใช้หมายเลข 10 ผมมักจะส่งเขาลงเล่นเป็นหมายเลข 10 บ่อยครั้งเพราะเขาเป็นกองกลางตัวกลางมาโดยตลอด หากผมเล่นแผน 4-2-3-1 ผมก็จะให้เขาเล่นเป็นหมายเลข 6 หรือ 8 แทน'", "แบรนด์เคยร่วมงานกับฮอลล์ในฐานะหัวหน้าโค้ชทีมเชลซีชุดอายุต่ำกว่า 18 ปี ในช่วงที่ฮอลล์เป็นหนึ่งในผู้เล่นที่อายุน้อยที่สุดในทีมเพียง 16 ปี 'เขาเป็นเด็กที่นิสัยดีมาก' แบรนด์ประทับใจในตัวเขามากจนการขยับเขาไปเล่นริมเส้นฝั่งซ้ายเป็นเพียงวิธีเดียวที่จะทำให้เขายังคงอยู่ในทีมได้", "เขากล่าวอธิบายว่า 'มีผู้เล่นที่อายุมากกว่าเขาและเป็นผู้เล่นที่ดี ในบางเกมที่ผมต้องการเก็บเขาไว้ในทีม เขาอาจจะต้องเล่นเป็นวิงแบ็กซ้าย แม้ว่าผมจะรู้ดีในตอนนั้นว่ามันไม่ใช่ตำแหน่งที่เขาชอบที่สุดก็ตาม เขาคือกองกลาง'", "เขาย้อนความหลังถึงเกมหนึ่งที่ไปเยือนท็อตแนม ซึ่งเขาให้ฮอลล์เล่นเป็นฟูลแบ็กเต็มตัว 'ผมบอกเขาว่า ดูนะ นี่คือวิธีที่ฉันจะส่งคุณลงสนาม ผมแค่ต้องการนักฟุตบอล 11 คนในทุกตำแหน่ง เพราะเราต้องการให้แน่ใจว่าเราจะได้ครองบอล' และที่เหลือก็กลายเป็นประวัติศาสตร์", "'เขาเริ่มเล่นตรงนั้นมากขึ้นเรื่อยๆ และมันก็ดำเนินไปจากจุดนั้น ปัจจุบันในสายตาของแฟนบอลส่วนใหญ่เขาถูกมองว่าเป็นแบ็กซ้าย ในขณะที่ผมรู้ดีว่าในตอนที่เขาเติบโตขึ้นมา เขาเป็นผู้เล่นเกมรุกที่มีความสามารถในการทำประตูและวิ่งสอดขึ้นไปข้างหน้าเสมอ'", "แบรนด์ชี้ให้เห็นถึงบทบาทสำคัญของ แอนดี ไมเยอร์ส ในการพัฒนาฮอลล์ให้เป็นแบ็กซ้ายในระดับอายุต่ำกว่า 21 ปี ซึ่งทำให้เกมของเขาพัฒนาขึ้น 'เขาทำได้ยอดเยี่ยมตอนที่เป็นหมายเลข 10 แต่ผู้คนปรับตัวและมองเห็นฟุตบอลของคุณในมุมที่ต่างออกไป' และการฝึกฝนในแดนกลางของฮอลล์ยังคงช่วยเขาได้จนถึงทุกวันนี้", "'เขารู้สึกสบายมากในตำแหน่งแบ็กซ้ายเพราะตำแหน่งที่เขาเคยเล่น เมื่อคุณเป็นผู้เล่นที่มีความสามารถแบบเขา ซึ่งคุ้นเคยกับการเล่นตรงกลางสนาม มองเห็นเกมแบบ 360 องศา เมื่อคุณถูกย้ายมาเป็นฟูลแบ็ก คุณจะมองมันและคิดว่ามันง่าย เขาสามารถมองเห็นทุกอย่าง'", "แบรนด์กล่าวถึงผู้เล่นที่ 'แสดงคุณสมบัติทั้งหมดออกมา' และอย่างที่เห็นในเกมกับสเปน เขาไม่ได้ถูกจำกัดอยู่แค่ริมเส้น 'ฟูลแบ็กในเกมสมัยใหม่มีความสำคัญมากในการหุบเข้าใน พวกเขาทำหน้าที่หลายอย่างในแดนกลางอยู่แล้ว ด้วยพรสวรรค์ของเขา เขาจึงทำได้ดีเยี่ยมในจุดนั้น'", "แน่นอนว่าบททดสอบในการเจอกับ ลามีน ยามาล นั้นมีทั้งตอนที่ไม่มีบอลและมีบอล ฮอลล์มีประสบการณ์ที่หลากหลายในการเจอกับดาวรุ่งมหัศจรรย์ของบาร์เซโลนาเมื่อต้นปีนี้ เขาทำผลงานได้ยอดเยี่ยมในเกมเหย้าของนิวคาสเซิลในศึกแชมเปียนส์ลีก แต่เขาก็เป็นส่วนหนึ่งของทีมที่เสียไปถึง 7 ประตูในเกมเยือน", "ในวัย 22 ปี ฮอลล์ยังคงเรียนรู้ด้วยตัวเอง แต่เขาแสดงให้เห็นในมาดริดแล้วว่าเขามีความสามารถมากกว่าที่ ำแหน่งมิดฟิลด์คนอื่นๆ", "ตำแหน่งแบ็กซ้ายยังคงเปิดกว้างเนื่องจาก นีฟ ชาร์ลส์ และ อเล็กซ์ กรีนวูด มีอาการบาดเจ็บ ทำให้ ป๊อปปี้ แพตทินสัน และ เทย์เลอร์ ไฮนด์ส มีโอกาสลุ้นแย่งตัวจริง"], "full_paragraphs": ["ซารินา วีกแมน กุนซือทีมชาติอังกฤษได้ประกาศรายชื่อผู้เล่นชุดทำศึกฟุตบอลโลก รอบเพลย์ออฟ พบกับทีมชาติยูเครน โดยมีการเรียกตัว อิซซี่ กู๊ดวิน กองหน้าดาวรุ่งเข้าสู่ทีมเป็นครั้งแรก ท่ามกลางกลุ่มผู้เล่นแนวรุกที่มีทั้ง แอ็กกี้ บีเวอร์-โจนส์ และ มิเชลล์ อะเยมาง นอกจากนี้ เอลล่า ทูน ยังกลับมามีชื่อติดทีมอีกครั้ง ซึ่งสร้างคำถามตามมาว่านี่อาจส่งผลกระทบต่อโอกาสของ เกรซ คลินตัน หรือไม่", "แม้ว่าทีมชาติอังกฤษจะยังไม่ได้ผ่านเข้าไปเล่นในฟุตบอลโลกอย่างเป็นทางการ แต่ ซารินา วีกแมน ก็ได้ส่งสัญญาณเตือนไปยังทุกคนที่ต้องการมีชื่อติดทีมชุดสุดท้าย 26 คนที่จะไปลุยศึกในฤดูร้อนหน้า โดยกุนซือทีมสิงโตสาวได้เรียกตัวผู้เล่นดาวรุ่งขึ้นมาเสริมทัพอย่างต่อเนื่องในรอบนี้ เช่นเดียวกับที่เคยเรียก เล็กซี่ พอตเตอร์, เอริกา เม็ก พาร์กินสัน และ เฟรยา ก็อดฟรีย์ มาประเดิมสนามในรอบที่พบกับกรีซก่อนหน้านี้", "อิซซี่ กู๊ดวิน กองหน้าจาก ลอนดอน ซิตี้ ไลโอเนสส์ เพิ่งโชว์ฟอร์มสร้างปัญหาให้กับแนวรับของ อาร์เซนอล ที่เต็มไปด้วยสตาร์ดังอย่าง ลีอาห์ วิลเลียมสัน เมื่อวันอาทิตย์ที่ผ่านมา โดยกัปตันทีมชาติอังกฤษรายนี้ถูกกู๊ดวินเล่นงานจนเสียประตูตีเสมอ ซึ่งวีกแมนยอมรับว่าฟอร์มการเล่นดังกล่าวมีส่วนช่วยให้เธอตัดสินใจเรียกตัวกู๊ดวินเข้ามา", "ตำแหน่งผู้เล่นสำรองของ อเลสเซีย รุสโซ จะกลายเป็นหนึ่งในประเด็นที่ถูกพูดถึงมากที่สุด หากอังกฤษสามารถคว้าตั๋วไปลุยศึกที่บราซิลได้สำเร็จ โดยในขณะนี้ แอ็กกี้ บีเวอร์-โจนส์ ได้ถูกเรียกตัวกลับมาติดทีมอีกครั้ง ในขณะที่ มิเชลล์ อะเยมาง ผู้เล่นที่โดดเด่นจากศึกยูโร กำลังอยู่ในช่วงเรียกความฟิตกลับมาให้เต็มร้อย", "อย่างไรก็ตาม ผู้เล่นที่สามารถผ่านบททดสอบการคัดเลือกกลับมาได้คือ เอลล่า ทูน โดยวีกแมนรู้สึกประทับใจอย่างมากกับปฏิกิริยาของมิดฟิลด์จาก แมนเชสเตอร์ ยูไนเต็ด รายนี้ หลังจากที่ถูกตัดชื่อออกจากทีมเมื่อเดือนที่แล้ว ทูนได้ตัดสินใจเดินทางไปเข้าแคมป์ฝึกซ้อมส่วนตัวที่ประเทศสเปน เพื่อให้มั่นใจว่าเธอจะมีสภาพร่างกายที่สมบูรณ์ที่สุดหากวีกแมนต้องการเรียกตัวเธอไปเป็นตัวสำรองในกรณีที่มีผู้เล่นบาดเจ็บ", "เจ้าของแชมป์ยูโรสองสมัยติดต่อกันรายนี้ได้ยกระดับฟอร์มการเล่นกับสโมสรของเธอขึ้นมา และมีแนวโน้มว่าจะได้ลงสนามเพิ่มจากสถิติเดิมที่ติดทีมชาติไปแล้ว 69 นัดในอีกไม่กี่สัปดาห์ข้างหน้า การกลับมาของทูนอาจหมายความว่าผู้เล่นชื่อดังอีกรายอาจหลุดโผไป โดย เกรซ คลินตัน แม้จะมีชื่อกลับมาติดทีมในรอบนี้ แต่ดูเหมือนว่าเธอจะยังเป็นรองทั้ง ทูน, พอตเตอร์, คีร่า วอลช์ และ จอร์เจีย สแตนเวย์ ในลำดับการเลือกผู้เล่น", "นอกจากนี้ ลอร่า บลินด์คิลด์ บราวน์ และ ลูเซีย เคนดัลล์ ต่างก็ได้รับโอกาสลงสนามเป็นตัวจริงให้กับสโมสรในช่วงที่ผ่านมา ซึ่งหมายความว่าคลินตันจำเป็นต้องโชว์ฟอร์มให้ประทับใจอย่างหนักทั้งในระดับสโมสรและทีมชาติก่อนถึงเดือนมิถุนายน", "ในส่วนของตำแหน่งแบ็กซ้ายก็ยังคงเปิดกว้างสำหรับการแย่งชิง โดยเฉพาะอย่างยิ่งเมื่อ นีฟ ชาร์ลส์ และ อเล็กซ์ กรีนวูด ต่างมีอาการบาดเจ็บรบกวน ทำให้ต้องจับตาดูกันว่า ป๊อปปี้ แพตทินสัน หรือ เทย์เลอร์ ไฮนด์ส ที่ถูกเรียกตัวกลับมาติดทีมทั้งคู่ จะสามารถโชว์ฟอร์มได้โดดเด่นพอที่จะเบียดแย่งตำแหน่งจากผู้เล่นรุ่นพี่ได้หรือไม่ โดยวีกแมนหวังว่าเกมที่จะพบกับยูเครนนี้ จะช่วยให้เธอได้เห็นภาพที่ชัดเจนขึ้นสำหรับการตัดสินใจ พร้อมกับเป้าหมายสำคัญในการพาทีมชาติอังกฤษผ่านเข้าไปเล่นฟุตบอลโลกในปีหน้าให้ได้"], "link": "https://www.skysports.com/football/news/11095/13613373/sarina-wiegman-lays-down-gauntlet-to-england-players-looking-to-make-world-cup-squad-but-whose-spot-is-under-threat", "canonical_link": "https://www.skysports.com/football/news/11095/13613373/sarina-wiegman-lays-down-gauntlet-to-england-players-looking-to-make-world-cup-squad-but-whose-spot-is-under-threat", "cover_image_url": "https://e1.365dm.com/26/06/1920x1080/skysports-sarina-wiegman_7268264.jpg?20260608120928", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-lionesses-football_7409002.jpg?20261117184231", "https://e0.365dm.com/26/11/768x432/skysports-england-lionesses_7408915.jpg?20261117160552", "https://e0.365dm.com/26/11/768x432/skysports-lcl-arsenal_7407161.jpg?20261115165417", "https://e0.365dm.com/26/10/768x432/skysports-m-ed_7379810.jpg?20261018143002", "https://e0.365dm.com/26/11/768x432/skysports ุดแสบที่กลายเป็นตำนาน เช่น การจุดพลุในห้องน้ำจนเกิดไฟไหม้ และการฉลองประตูด้วยเสื้อ 'Why always me?' ในเกมแมนเชสเตอร์ดาร์บี้", "บทบาทสำคัญในการแอสซิสต์ให้ เซร์คิโอ อเกวโร่ ทำประตูชัยคว้าแชมป์พรีเมียร์ลีกครั้งแรกในประวัติศาสตร์ของ แมนเชสเตอร์ ซิตี้", "ปัจจุบันในวัย 36 ปี บาโลเตลลี่ยังคงค้าแข้งอยู่ในลีกสูงสุดของสหรัฐอาหรับเอมิเรตส์กับสโมสร อัล-อิตติฟาค"], "full_paragraphs": ["คำนิยามอย่าง 'จอมนอกคอก', 'ตัวปัญหา' หรือ 'ควบคุมไม่ได้' คือสิ่งที่ มาริโอ บาโลเตลลี่ ต้องเผชิญมาตลอดชีวิตการค้าแข้ง เขาอาจเป็นที่รู้จักจากวีรกรรมนอกสนามมากกว่าพรสวรรค์ที่ปฏิเสธไม่ได้ แต่กลับถูกมองว่าเสียของไปอย่างน่าเสียดาย ซึ่งดาวยิงชาวอิตาลีรายนี้มักจะตกเป็นพาดหัวข่าวอยู่เสมอ", "เวลาผ่านไป 15 ปีแล้วนับตั้งแต่การฉลองประตูอันโด่งดังด้วยเสื้อ 'Why always me?' (ทำไมต้องเป็นฉันเสมอ?) ในเกมแมนเชสเตอร์ดาร์บี้ ซึ่งเกิดขึ้นเพียงไม่กี่วันหลังจากที่เขาจุดพลุในห้องน้ำจนเกิดไฟไหม้บ้านพัก ปัจจุบันในวัย 36 ปี เขายังคงลงเล่นฟุตบอลอาชีพในลีกสูงสุดของสหรัฐอาหรับเอมิเรตส์กับสโมสร อัล-อิตติฟาค เคียงข้างกับ เอ็นอ็อค บาร์วูอาห์ พี่ชายแท้ๆ ของเขา", "BBC Sport จะพาไปย้อนดูเส้นทางอาชีพที่ผ่านสโมสรมาแล้วถึง 13 แห่ง ใน 6 ประเทศ รวมถึงการเป็นผู้จ่ายบอลให้เกิดประตูที่โด่งดังที่สุดในประวัติศาสตร์พรีเมียร์ลีก โดยเส้นทางของบาโลเตลลี่ไม่ได้เริ่มต้นจากอะคาเดมี่ของสโมสรยักษ์ใหญ่ แต่เขาเริ่มต้นจากการเล่นให้ ลูเมซซาเน่ ทีมในระดับดิวิชั่น 3 ของอิตาลี ใกล้บ้านเกิดในคอนเชซิโอ ก่อนจะไปทดสอบฝีเท้ากับ บาร์เซโลน่า แต่ไม่สำเร็จ และย้ายไปร่วมทีม อินเตอร์ มิลาน ในปี 2006", "ที่อินเตอร์ มิลาน บาโลเตลลี่ได้พบกับ โรแบร์โต้ มันชินี่ ผู้เป็นดั่งอาจารย์ใหญ่ ความสัมพันธ์ของทั้งคู่เปรียบเสมือนพ่อกับลูก ภายใต้การดูแลของกุนซือชาวอิตาลี บาโลเตลลี่ฉายแววโดดเด่นตั้งแต่อายุ 17 ปี โดยช่วยให้ทีมคว้าแชมป์กัลโช่ เซเรีย อา ฤดูกาล 2007-08 และเข้าถึงรอบชิงชนะเลิศโคปปา อิตาเลีย รวมถึงการทำ 2 ประตูใส่ ยูเวนตุส ในรอบก่อนรองชนะเลิศ", "ชีวิตของเขาเปลี่ยนไปเมื่อ โชเซ่ มูรินโญ่ เข้ามารับตำแหน่งต่อจากนั้น ไม่นานก็เกิดความขัดแย้งและการลงโทษทางวินัย โดยมูรินโญ่กล่าวว่าบาโลเตลลี่เป็นนักเตะที่ 'ควบคุมไม่ได้' และเคยวิจารณ์ฟอร์มการเล่นของเขาว่า 'ใกล้เคียงกับศูนย์' ความสัมพันธ์กับมูรินโญ่เต็มไปด้วยความตึงเครียด ซึ่งถือเป็นเรื่องยากที่กุนซือระดับ 'เดอะ สเปเชียล วัน' จะรับมือกับนักเตะคนหนึ่งไม่ได้ แม้บาโลเตลลี่จะคว้าแชมป์เซเรีย อา 3 สมัย และยูฟ่า แชมเปี้ยนส์ลีก กับอินเตอร์ แต่ชื่อเสียงในฐานะตัวปัญหาก็เริ่มบดบังผลงานในสนามของเขา", "ในเดือนสิงหาคม 2010 บาโลเตลลี่ย้ายไปร่วมทีม แมนเชสเตอร์ ซิตี้ เพื่อกลับมาร่วมงานกับมันชินี่อีกครั้ง กุนซือชาวอิตาลีพยายามพิสูจน์ว่าเขาสามารถควบคุมความคาดเดาไม่ได้ของบาโลเตลลี่ให้เป็นประโยชน์ต่อทีมได้ แต่ถึงกระนั้น บาโลเตลลี่ก็ยังคงสร้างประเด็นไม่หยุดหย่อน ทั้งการถูกใบแดง การขับรถชน และวีรกรรมปาปาเป้าใส่ผู้เล่นทีมเยาวชน ซึ่งแสดงให้เห็นถึงความไม่เป็นผู้ใหญ่", "หลังจากช่วยให้ แมนเชสเตอร์ ซิตี้ คว้าแชมป์เอฟเอ คัพ ในปี 2011 ซึ่งเป็นการสิ้นสุดการรอคอยถ้วยรางวัลใหญ่ในรอบ 35 ปี บาโลเตลลี่ก็ถูกวิจารณ์อย่างหนักจากการพยายามยิงท่าตอกส้นในเกมอุ่นเครื่องกับ แอลเอ กาแล็กซี่ จนมันชินี่ต้องเปลี่ยนตัวออกและตั้งคำถามถึงทัศนคติของเขาว่า 'ถ้าคุณจริงจัง คุณก็เล่นได้ 90 นาที แต่ถ้าไม่ คุณก็มานั่งข้างผมที่ม้านั่งสำรองได้เลย'", "บางครั้งความกล้าบ้าบิ่นของเขาก็ได้ผล เช่น ประตูที่ใช้หัวไหล่กระแทกเข้าประตูในเกมกับ นอริช ซิตี้ แต่ในเดือนตุลาคม 2011 เขาก็ตกเป็นข่าวใหญ่เมื่อหน่วยดับเพลิงต้องเข้าไประงับเหตุไฟไหม้ในห้องน้ำที่บ้านพักของเขา โดยบาโลเตลลี่อ้างว่าเป็นฝีมือของเพื่อน แต่ไม่กี่วันต่อมาเขาก็กลายเป็นฮีโร่ด้วยการทำประตูแรกในเกมที่ถล่ม แมนเชสเตอร์ ยูไนเต็ด 6-1 พร้อมโชว์เสื้อ 'Why always me?'", "มีเรื่องเล่ามากมายเกี่ยวกับเขา ทั้งการให้เงินคนไร้บ้าน 1,000 ปอนด์, การบุกไปที่โรงเรียนเพื่อจัดการกับเด็กที่รังแกนักเรียนคนอื่น หรือการขับรถแต่งตัวเป็นซานตาคลอสแจกของขวัญ ซึ่งแม้เจ้าตัวจะปฏิเสธหลายเรื่อง แต่ด้วยชื่อเสียงในตอนนั้นทำให้คนเชื่อว่าเป็นเรื่องจริง แฟนบอลซิตี้ถึงกับแต่งเพลงเชียร์ล้อเลียนอาการแพ้หญ้าของเขา และพฤติกรรมที่ชอบพกเงินสดเต็มกระเป๋าขับรถไปทั่วเมือง", "ในเดือนเมษายน 2012 บาโลเตลลี่ถูกใบแดงในเกมกับ อาร์เซน่อล ซึ่งดูเหมือนจะเป็นจุดจบของความหวังในการคว้าแชมป์ แต่หนึ่งเดือนต่อมา เขากลับเป็นคนแอสซิสต์ให้ เซร์คิโอ อเกวโร่ ทำประตูชัยในนาทีสุดท้ายในเกมกับ ควีนส์ปาร์ค เรนเจอร์ส ซึ่งทำให้ซิตี้คว้าแชมป์พรีเมียร์ลีกสมัยแรกได้สำเร็จ", "มิคาห์ ริชาร์ดส์ อดีตเพื่อนร่วมทีมกล่าวว่า 'เขาบ้าในทางที่ดี เขาเป็นสีสันของทีม เป็นฮีโร่ของแฟนบอลไม่ใช่แค่เรื่องนอกสนาม แต่ในสนามด้วย สิ่งที่ดีที่สุดคือเขาเป็นคนน่ารัก ไม่ได้หยิ่งผยองอย่างที่สื่อพยายามนำเสนอ เขาแค่บ้าๆ บอๆ นิดหน่อยเท่านั้น'", "อย่างไรก็ตาม ในเดือนมกราคม 2013 ความอดทนของมันชินี่ก็สิ้นสุดลงหลังจากมีปากเสียงกันในสนามซ้อม บาโลเตลลี่ถูกขายไปให้ เอซี มิลาน โดยมันชินี่กล่าวว่า 'เขาไม่ใช่คนเลวและเป็นนักเตะที่ยอดเยี่ยม แต่ผมเสียใจแทนเขาที่เขายังคงทำลายพรสวรรค์และคุณภาพของตัวเอง ผมไม่มีคำพูดใดๆ สำหรับพฤติกรรมของเขา ผมหวังว่าเขาจะเข้าใจว่าเขากำลังทำลายอนาคตของตัวเอง'", "เนดุม โอนูโอฮา อดีตเพื่อนร่วมทีมอีกคนกล่าวทิ้งท้ายว่า 'ครั้งหนึ่ง มาริโอเชื่อจริงๆ ว่าเขาเป็นหนึ่งในนักเตะที่ดีที่สุดในโลก มีเรื่องเล่าเกี่ยวกับเขามากมายที่ซิตี้ แต่ที่ผมจำได้แม่นคือตอนที่ใครสักคนพูดถึง ลิโอเนล เมสซี่ และ คริสเตียโน่ โรนัลโด้ แล้วมาริโอก็บอกว่าเขาเก่งเท่ากับคนเหล่านั้น และเขาพูดด้วยความจริงจังอย่างที่สุด'"], "link": "https://www.bbc.co.uk/sport/football/articles/cvgxvg4v981o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cvgxvg4v981o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/033a/live/effd2720-ddf4-11f1-8445-15eb55286f71.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9053/live/0a8541a0-ddf4-11f1-bb8c-51310f5678ed.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8ed9/live/d8473500-e14e-11f1-b11b-dd14e59ca2da.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f890/live/21593d20-a08f-11f1-84af-1fbec28b23b2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/cf03/live/de6139f0-a08e-11f1-84af-1fbec28b23b2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4783/live/9e740110-e14d-11f1-b11b-dd14e59ca2da.jpg"], "videos": [], "review_score": "", "published_ts": 1794896143, "published_at": "2026-11-17T06:15:43Z", "published_th": "17 พ.ย. 2026 • 13:15 น.", "category_hint": "Football"}, {"id": 1794843039513, "guid": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "original_title": "How Frank can restore reputation and save Crystal Palace", "thai_title": "ภารกิจกู้ชีพ! โธมัส แฟรงค์ เตรียมรับงานคุม คริสตัล พาเลซ หวังฟื้นฟูชื่อเสียงในพรีเมียร์ลีก", "tag": "Football", "sub_tag": "CRYSTAL PALACE", "bullet_points": ["โธมัส แฟรงค์ เตรียมเข้ารับตำแหน่งผู้จัดการทีมคนใหม่ของ คริสตัล พาเลซ หลังทีมทำผลงานย่ำแย่รั้งอันดับบ๊วยของตาราง", "ความท้าทายสำคัญของแฟรงค์คือการปรับปรุงเกมรับที่เสียประตูมากที่สุดในลีกถึง 24 ลูก และการสร้างความเชื่อมั่นให้กับทีมที่ขาดคุณภาพหลังจากเสียผู้เล่นตัวหลักไปในช่วงซัมเมอร์", "แม้สถานการณ์จะดูยากลำบาก แต่พาเลซยังมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายในช่วง 10 นัดแรกในรอบ 24 ปี", "แฟรงค์ตั้งเป้าใช้ประสบการณ์จากการคุม เบรนท์ฟอร์ด มาปรับใช้เพื่อสร้างความมั่นคงและยกระดับทีมให้กลับมาแข่งขันได้อีกครั้ง"], "full_paragraphs": ["คริสตัล พาเลซ กำลังจะกลายเป็นสโมสรที่ 3 ในลอนดอนที่ โธมัส แฟรงค์ เข้ามาคุมทีม ต่อจาก เบรนท์ฟอร์ด และ ท็อตแนม ฮอตสเปอร์", "เมื่อเดือนมิถุนายนที่ผ่านมา โธมัส แฟรงค์ ได้กล่าวไว้ว่า \"เมื่อถึงเวลาที่เหมาะสม ผมจะตั้งตารอการกลับมาทำหน้าที่ผู้จัดการทีมอีกครั้ง พร้อมที่จะทุ่มเทให้กับงานด้วยพลังงานและความมุ่งมั่นอย่างเต็มที่\" และเวลานั้นก็มาถึงแล้ว เมื่อกุนซือชาวเดนมาร์กรายนี้กำลังจะได้รับการประกาศให้เป็นนายใหญ่คนใหม่ของ คริสตัล พาเลซ ทีมที่ปัจจุบันรั้งอันดับบ๊วยของตารางพรีเมียร์ลีก โดยมีแต้มห่างจากโซนปลอดภัยอยู่ 2 คะแนน และมีผลต่างประตูได้เสียที่เป็นรอง", "ก่อนหน้านี้ ปิแอร์ เซจ อดีตหัวหน้าผู้ฝึกสอนของพาเลซ เพิ่งถูกปลดออกจากตำแหน่งเมื่อสัปดาห์ที่ผ่านมา หลังจากคุมทีมไปเพียง 16 นัดรวมทุกรายการ ซึ่งการเข้ามารับงานในครั้งนี้ถือเป็นโอกาสสำคัญที่แฟรงค์จะกู้ชื่อเสียงของตนเองกลับคืนมา หลังจากถูก ท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมาหลังคุมทีมได้เพียง 8 เดือน", "ร็อบ กรีน อดีตผู้รักษาประตูทีมชาติอังกฤษและ เวสต์แฮม ยูไนเต็ด กล่าวกับ BBC Sport ว่า \"มันจะเป็นเรื่องที่น่าตกใจสำหรับ โธมัส แฟรงค์ เล็กน้อย เขาเคยประสบความสำเร็จที่ เบรนท์ฟอร์ด ซึ่งเป็นสโมสรที่มีการบริหารจัดการที่ดีเยี่ยม มีการวางแผนและคิดมาอย่างดีในการดึงนักเตะเข้ามาทดแทนคนที่ขายออกไปเพื่อทำกำไร แต่สิ่งนั้นไม่ได้เกิดขึ้นที่ คริสตัล พาเลซ พวกเขาสูญเสียผู้เล่นไปแล้วต้องรีบหาคนมาแทนอย่างฉุกละหุก ทีมชุดนี้ถูกลดทอนคุณภาพลงจากการขายนักเตะออกไปโดยไม่มีใครที่มีคุณภาพเท่าเดิมเข้ามาแทนที่ โธมัส แฟรงค์ จำเป็นต้องค้นหาบางอย่างภายในทีมเพื่อสร้างความเชื่อมั่นว่าพวกเขาสามารถแข่งขันในพรีเมียร์ลีกได้ เพราะในตอนนี้มันดูห่างไกลจากจุดนั้นมาก\"", "นับตั้งแต่ถูกปลดจาก ท็อตแนม ฮอตสเปอร์ หลังคุมทีมในลีกไป 26 นัดเมื่อฤดูกาลที่แล้ว แฟรงค์ว่างเว้นจากการคุมทีมมานานกว่าช่วงเวลาที่เขาคุมทีมสเปอร์สเสียอีก ในช่วงซัมเมอร์เขาเคยออกแถลงการณ์ว่า \"มีการพูดคุยและโอกาสต่างๆ\" เข้ามาให้เขากลับไปทำงาน แต่เขา \"ตัดสินใจที่จะไม่รีบร้อนรับงานถัดไป\"", "พอล โรบินสัน อดีตผู้รักษาประตู ท็อตแนม ฮอตสเปอร์ และทีมชาติอังกฤษ กล่าวว่า \"พาเลซเคยมีหนึ่งในผู้จัดการทีมที่ดีที่สุดเท่าที่พวกเขาเคยมีมา หรืออาจจะดีที่สุดตลอดกาลด้วยซ้ำ ที่พาทีมคว้าถ้วยรางวัลมาครอง ลองดูสิ่งที่พวกเขาทำได้เมื่อฤดูกาลที่แล้วสิ แทนที่จะต่อยอดจากจุดนั้น พวกเขากลับรื้อทีมทิ้ง พวกเขาถอยหลังลงคลอง\"", "แฟรงค์เคยเปรียบเปรยการเป็นผู้จัดการทีมว่าเหมือนการอยู่บน \"วงล้อหนูถีบจักร\" และ \"ละครสัตว์ที่บ้าคลั่ง\" ดังนั้นการที่เขาตัดสินใจกลับมาคุมทีมที่รั้งท้ายตารางในตอนนี้ จึงเป็นเรื่องที่น่าสนใจ โดยแฟรงค์ซึ่งเคยเป็นส่วนหนึ่งของทีมวิเคราะห์ฟุตบอลโลกของ BBC Sport ในช่วงซัมเมอร์ จะกลับมาทำงานด้วยความสดชื่นและพลังงานที่เต็มเปี่ยมหลังจากห่างหายจากวงการไปหลายเดือน", "ระหว่างการรับตำแหน่งที่ เบรนท์ฟอร์ด ในเดือนตุลาคม 2018 จนถึงวันที่ถูกปลดจาก สเปอร์ส เมื่อต้นปีนี้ เขาทำงานโดยไม่มีวันหยุดพักมานานถึง 7 ปีกับอีก 4 เดือน การใช้เวลาช่วงไม่กี่เดือนที่ผ่านมาห่างจากความกดดันของพรีเมียร์ลีก ทำให้แฟรงค์ได้ \"ศึกษา สังเกต และเรียนรู้จากผู้นำคนอื่นๆ ทั้งในและนอกวงการกีฬา\" ตามคำกล่าวของเขาเอง", "แฟรงค์ซึ่งให้ความสำคัญอย่างยิ่งกับการจัดระเบียบลูกตั้งเตะ จะต้องรีบปรับจูนทีมทันทีที่ คริสตัล พาเลซ ซึ่งแพ้ในลีกมา 4 นัดติดต่อกัน โดยทีมเสียประตูไปแล้วถึง 24 ลูก ซึ่งมากที่สุดในพรีเมียร์ลีก และยิงได้เพียง 10 ประตูเท่านั้น", "ทอม อัลนัตต์ นักข่าวฟุตบอลจาก The Times กล่าวกับรายการ Football Daily ของ BBC Radio 5 Live ว่า \"หากคุณต้องการใครสักคนเข้ามาเพื่อสร้างความมั่นคงและความแข็งแกร่งในเกมรับ พร้อมกับปรับปรุงเรื่องลูกตั้งเตะ โธมัส แฟรงค์ คือคนที่สมบูรณ์แบบสำหรับงานนี้\"", "ด้วยการที่พรีเมียร์ลีกเพิ่งผ่านไปเพียง 10 นัด แฟรงค์ยังมีเวลามากพอที่จะพลิกสถานการณ์ และเขาน่าจะมีเป้าหมายในใจสำหรับการเสริมทัพเมื่อตลาดซื้อขายนักเตะเปิดขึ้นในเดือนมกราคม โดยในช่วงซัมเมอร์ที่ผ่านมา พาเลซขาย แม็กซองซ์ ลาครัวซ์ กองหลังชาวฝรั่งเศสให้ เชลซี ในราคา 52 ล้านปอนด์ และ ดาเนียล มูญอซ แบ็กขวาชาวโคลอมเบียให้ นอตทิงแฮม ฟอเรสต์ ในราคา 22 ล้านปอนด์ ซึ่งอัลนัตต์เสริมว่า \"เรารู้ว่าพวกเขาขายนักเตะฝีเท้าดีออกไปเยอะมาก และจนถึงตอนนี้ผมไม่คิดว่าพวกเขาจะหาใครมาแทนที่ได้อย่างเหมาะสม\"", "ความท้าทายอีกประการสำหรับแฟรงค์คือการดึงฟอร์มเก่งของ อดัม วอร์ตัน กองกลางที่ไม่ได้ลงเล่นให้ทีมชาติอังกฤษมาตั้งแต่เดือนมีนาคมให้กลับมาอีกครั้ง ซึ่งสิ่งเหล่านี้คือความท้าทายที่ผู้จัดการทีมคนใหม่พร้อมจะเผชิญ", "พอล โรบินสัน กล่าวทิ้งท้ายว่า \"คริสตัล พาเลซ และ โธมัส แฟรงค์ ดูจะเป็นส่วนผสมที่ลงตัวมาก\" ทั้งนี้ โธมัส แฟรงค์ มีงานหนักรออยู่ เพราะ คริสตัล พาเลซ คือทีมที่แย่ที่สุดในพรีเมียร์ลีกฤดูกาลนี้อย่างไม่ต้องสงสัย โดยรั้งอันดับบ๊วยทั้งในแง่ของคะแนน (7 คะแนน) ผลต่างประตูได้เสีย (-14) และค่าคาดหวังประตูได้เสีย (-8.1)", "ในส่วนของเกมรับคือจุดที่แฟรงค์ต้องให้ความสำคัญมากที่สุด ไม่เพียงแต่เสียประตูมากที่สุด (24 ลูก) แต่ยังปล่อยให้คู่แข่งยิงมากที่สุด (189 ครั้ง) และมีค่าคาดหวังการเสียประตู (xGA) แย่ที่สุดในลีกที่ 21.9", "อย่างไรก็ตาม ในส่วนของเกมรุกถือว่าไม่ได้แย่จนเกินไป แม้จะมีเพียง ฮัลล์ ซิตี้ เท่านั้นที่ยิงน้อยกว่า แต่พาเลซก็สร้างโอกาสได้ดีและอาจโชคร้ายที่ยิงประตูไม่ได้มากกว่านี้จากโอกาสที่มี", "นอกจากนี้ยังมีปัจจัยสำคัญที่เข้าทางแฟรงค์ แม้พาเลซจะรั้งอันดับบ๊วย แต่พวกเขายังไม่ถูกทิ้งห่าง เพราะมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน โดยทีมที่รั้งอันดับสุดท้ายในช่วงเวลานี้ของ 10 ฤดูกาลหลังสุดมีค่าเฉลี่ยเพียง 3 คะแนน แต่สำหรับพาเลซ แม้ผลงานจะแย่เพียงใด พวกเขาก็ยังมีถึง 7 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายหลังผ่านไป 10 นัดในรอบ 24 ปี"], "link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/a30c/live/69f709f0-df63-11f1-a8af-15d7a25dc0d1.png", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794851176, "published_at": "2026-11-16T17:46:16Z", "published_th": "17 พ.ย. 2026 • 00:46 น.", "category_hint": "Football"}, {"id": 1794703574646, "original_title": "White has 'exciting future' despite boos - Rice", "thai_title": "ไรซ์ปกป้อง ไวท์ หลังถูกแฟนบอลโห่ใส่ที่เวมบลีย์ พร้อมชี้อนาคตกับทีมชาติยังสดใส", "tag": "Football", "bullet_points": ["เดแคลน ไรซ์ ออกโรงปกป้อง เบน ไวท์ เพื่อนร่วมทีมอาร์เซนอล หลังถูกแฟนบอลโห่ใส่ในเกมที่อังกฤษชนะโครเอเชีย 2-1", "ไรซ์ชื่นชมความแข็งแกร่งทางจิตใจของไวท์ที่ยังคงทำผลงานได้ดีแม้จะเผชิญกับสถานการณ์ที่ยากลำบาก", "ไวท์เคยถอนตัวจากแคมป์ทีมชาติในฟุตบอลโลก 2022 และไม่ได้ถูกเรียกตัวติดทีมชาติในช่วงที่แกเร็ธ เซาธ์เกต คุมทีม", "เดแคลน ไรซ์ ยืนยันว่าเขากำลังอยู่ในระหว่างการเจรจาสัญญาฉบับใหม่กับอาร์เซนอล ซึ่งคาดว่าจะทำให้เขากลายเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของสโมสร", "ไรซ์เชื่อมั่นว่าความต่อเนื่องในการเล่นฟุตบอลในระดับสูงช่วยให้เขาพัฒนาฝีเท้าได้อย่างมั่นคง"], "full_paragraphs": ["เดแคลน ไรซ์ ได้ออกมาปกป้อง เบน ไวท์ เพื่อนร่วมทีมอาร์เซนอล หลังจากที่กองหลังรายนี้ถูกแฟนบอลโห่ใส่ที่สนามเวมบลีย์ ในระหว่างเกมที่ทีมชาติอังกฤษเอาชนะโครเอเชียไปได้ 2-1 เมื่อวันพฤหัสบดีที่ผ่านมา", "สำหรับ เบน ไวท์ ซึ่งถูกส่งลงสนามในฐานะตัวสำรองในเกมเนชันส์ลีกนัดนี้ เคยตัดสินใจถอนตัวจากแคมป์ทีมชาติอังกฤษในศึกฟุตบอลโลก 2022 ที่กาตาร์ เพื่อเดินทางกลับบ้านด้วยเหตุผลส่วนตัว", "หลังจากเหตุการณ์ดังกล่าว ไวท์ไม่ได้ถูกเรียกตัวติดทีมชาติอีกเลยตลอดช่วงเวลาที่ แกเร็ธ เซาธ์เกต ดำรงตำแหน่งผู้จัดการทีมชาติอังกฤษ นอกจากนี้ เขายังเคยถูกแฟนบอลบางส่วนโห่ใส่ในเกมที่เสมอกับยูเครน 1-1 เมื่อเดือนมีนาคมที่ผ่านมา หลังจากที่เขากลับมาติดทีมชาติอีกครั้งภายใต้การคุมทีมของ โทมัส ทูเคิล", "\"เหตุการณ์ที่เกิดขึ้นกับเบนมันผ่านไปกว่า 5 ปีแล้ว ผมไม่รู้จริงๆ ว่าทำไมเรื่องนี้ถึงยังคงเป็นประเด็นที่ถูกหยิบยกมาพูดถึงอยู่\" ไรซ์กล่าวกับ BBC Radio 5 Live", "\"เมื่อรู้จักเบน และรู้จักตัวตนของเขา ผมบอกได้เลยว่าเขาได้ก้าวข้ามเรื่องราวทั้งหมดนั้นไปเรียบร้อยแล้ว เขาภูมิใจเสมอที่ได้สวมเสื้อทีมชาติ และทุกครั้งที่เขาลงสนาม เขาจะทุ่มเทเต็มร้อยเปอร์เซ็นต์เสมอ\"", "\"มันแสดงให้เห็นถึงตัวตนของเขา การถูกโห่ใส่ตอนลงสนามที่เวมบลีย์ไม่ใช่เรื่องง่ายเลย แต่การที่เขาสามารถแสดงความแข็งแกร่งทางจิตใจเพื่อลงเล่นและทำผลงานได้ดี เหมือนกับที่เขาทำได้ในช่วงหลายเดือนที่ผ่านมานั้น ถือเป็นเครื่องพิสูจน์ตัวเขาได้อย่างแท้จริง\"", "ไรซ์ยังกล่าวเสริมว่า บรรดาผู้เล่นในทีมไม่ได้มีการพูดคุยถึงสถานการณ์นี้เลย และทุกคนต่างก้าวข้ามเรื่องดังกล่าวไปแล้ว พร้อมระบุว่า ไวท์ยังมี \"อนาคตที่น่าตื่นเต้นรออยู่กับทีมชาติอังกฤษชุดนี้\"", "ก่อนหน้านี้ ไวท์เคยกล่าวว่า ผู้คนยังไม่ทราบ \"เรื่องราวทั้งหมด\" เบื้องหลังการตัดสินใจถอนตัวจากแคมป์กาตาร์ แต่เขาก็ยังคงยืนหยัดในการตัดสินใจของตนเอง", "ในประเด็นอื่น ไรซ์ยังยืนยันว่าเขากำลังใกล้ที่จะเซ็นสัญญาฉบับใหม่กับอาร์เซนอล โดย BBC Sport ได้รายงานครั้งแรกเมื่อวันที่ 7 ตุลาคมว่า กองกลางรายนี้เตรียมเซ็นสัญญาฉบับใหม่ระยะยาวที่เอมิเรตส์ สเตเดียม ซึ่งนักเตะวัย 27 ปีได้กล่าวถึงเรื่องนี้ก่อนเกมที่อังกฤษจะพบกับสเปนในวันอาทิตย์ว่า \"สัญญาฉบับใหม่น่าจะเกิดขึ้นในเร็วๆ นี้ และผมโชคดีมากที่ได้อยู่กับสโมสรอย่างอาร์เซนอล ที่ซึ่งผู้จัดการทีมแสดงความเชื่อมั่นในตัวผมอย่างมาก รวมถึงเพื่อนร่วมทีมที่ทุ่มเทพลังให้กับผมอย่างเต็มที่\"", "สัญญาปัจจุบันของไรซ์จะหมดลงในปี 2028 แต่คาดว่าอดีตดาวเตะเวสต์แฮมรายนี้จะขยายระยะเวลาการค้าแข้งในลอนดอนเหนือออกไป หลังจากย้ายมาจากลอนดอน สเตเดียม ในปี 2023 ด้วยค่าตัว 105 ล้านปอนด์ โดยสัญญาฉบับใหม่นี้จะทำให้เขากลายเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของอาร์เซนอลเทียบเท่ากับ บูกาโย ซากา", "ไรซ์สามารถหลีกเลี่ยงความวุ่นวายตลอดอาชีพการค้าแข้งของเขา และเขาเชื่อว่าความต่อเนื่องนี้เองที่ช่วยให้เขาเติบโตขึ้น \"ผมโชคดีมากที่สามารถเล่นในระดับที่สม่ำเสมอได้ตลอดอาชีพการค้าแข้ง ผมตั้งเป้าหมายให้ตัวเองเสมอและผลักดันตัวเองให้มากขึ้น\"", "\"ผมโชคดีมากที่ไม่ต้องกังวลกับเรื่องเหล่านั้น เพราะมันทำให้การเล่นฟุตบอลเป็นเรื่องที่ง่ายขึ้นมาก\""], "link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5f63/live/321873e0-ef8b-11ee-975b-efffd9777018.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6615/live/ce8996a0-7ab8-11f0-83cc-c5da98c419b8.png"], "published_th": "15 พ.ย. 2026 • 05:26 น.", "category_hint": "Football", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "guid": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "published_ts": 1794695216, "published_at": "2026-11-14T22:26:56Z", "videos": [], "review_score": "", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นความคล่องตัวสูง คุณจำเป็นต้องวิ่ง คุณต้องสามารถวิ่งและทำความเร็วสูงได้ พื้นฐานที่สุดคือต้องฟิต\"", "\"ผู้จัดการทีมทุกคนต้องการช่วงปรีซีซั่นที่ดีและเวลาในการถ่ายทอดไอเดียรวมถึงสร้างความฟิต แต่นักเตะจะรู้สึกได้ทันทีว่ามันเป็นคนละระดับกัน นี่คือสิ่งที่ต้องทำทุกวันที่สนามซ้อม ต้องเต็มที่ 100% นั่นคือสิ่งที่เขาขอและต้องการ มันจะเป็นความแตกต่างครั้งใหญ่สำหรับนักเตะและพวกเขาจะเห็นผลลัพธ์ทันที\"", "\"ในเกมแชมเปียนส์ลีก รอบรองชนะเลิศ เราตามหลัง 3-0 (ในเกมพบกับ อาแจ็กซ์) เขาไม่ได้พูดเรื่องแท็กติกในช่วงพักครึ่งเลย เขาแค่บอกว่า 'พวกคุณต้องใช้ร่างกายเข้าสู้ ต้องสู้ คุณต้องการแค่ประตูเดียวเพื่อกลับมาสู่เกม จงเชื่อว่าทุกอย่างเป็นไปได้' นั่นเป็นช่วงเวลาที่สำคัญมาก เพราะตอนนั้นเราสู้ อาแจ็กซ์ ไม่ได้เลย แต่เราเปลี่ยนทุกอย่างด้วยความเข้มข้นและการเข้าปะทะ ผมจำได้ว่ามีการวางบอลยาวให้ เฟร์นานโด ยอเรนเต และเราก็แค่สู้และถามกันว่า 'พวกคุณต้องการมันมากแค่ไหน?' ทุกอย่างเปลี่ยนไปตั้งแต่นาทีนั้น\""], "link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8125/live/1aaff900-dfb9-11f1-b154-657b8bcda5ea.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/1da8/live/872e4dc0-ddd4-11f1-9053-236ccb99630c.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794610397, "published_at": "2026-11-13T22:53:17Z", "published_th": "14 พ.ย. 2026 • 05:53 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776975, "guid": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "original_title": "Tearful Pochettino on 'difficult' decision to leave USA for Man Utd", "thai_title": "โปเช็ตติโน่หลั่งน้ำตา ยอมรับการตัดสินใจอำลาทีมชาติสหรัฐฯ เพื่อคุมทัพแมนเชสเตอร์ ยูไนเต็ด เป็นเรื่องยากที่สุดในอาชีพ", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ ตัดสินใจอำลาตำแหน่งกุนซือทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานคุมทีมแมนเชสเตอร์ ยูไนเต็ด โดยเซ็นสัญญาเป็นเวลา 2 ปีครึ่ง", "ปีศาจแดงยอมจ่ายค่าฉีกสัญญาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่และทีมงานสตาฟฟ์โค้ชมาจากสหรัฐฯ", "โปเช็ตติโน่ยอมรับว่านี่เป็นการตัดสินใจที่ยากลำบากที่สุดครั้งหนึ่งในอาชีพ แต่โอกาสในการคุมทีมระดับโอลด์แทรฟฟอร์ดนั้นยากที่จะปฏิเสธ", "กุนซือชาวอาร์เจนไตน์จะประเดิมคุมทีมแมนเชสเตอร์ ยูไนเต็ด นัดแรกในเกมเยือนลิเวอร์พูล วันที่ 22 พฤศจิกายนนี้", "สถานการณ์ของแมนเชสเตอร์ ยูไนเต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะลุช่องโดยตรง ไม่ได้แตกต่างจากสิ่งที่ คาร์ริค พยายามจะทำ และแม้ว่านั่นอาจทำให้แฟนบอล ยูไนเต็ด กังวล แต่ความคล้ายคลึงในหลักการจะส่งผลดีต่อตัวผู้เล่น", "\"ปรัชญาของผมคือการมอบสไตล์ที่อิสระภายใต้การจัดระเบียบที่ดี\" คือคำพูดของ โปเช็ตติโน ในปี 2014 แม้ปรัชญาจะคล้ายกัน แต่ส่วนหลังคือ 'การจัดระเบียบที่ชัดเจน' ซึ่งน่าจะเป็นสิ่งที่ คาร์ริค ยังไม่สามารถมอบให้ผู้เล่นได้อย่างมั่นคง", "สำหรับแฟนบอลทีมใหญ่ ฟุตบอลที่รวดเร็วและเน้นแนวตั้งมักได้รับการยอมรับเมื่อมันมาจากความตั้งใจที่จะเป็นฝ่ายรุกก่อน เช่น ยูไนเต็ด ยุค เฟอร์กูสัน หรือ ลิเวอร์พูล ยุค เจอร์เกน คล็อปป์ แต่ฟุตบอลลักษณะนี้มักถูกมองในแง่ลบหากมันมาจากการยอมสละการครองบอลและเน้นตั้งรับหน้าประตูตัวเองเป็นเวลานาน", "การจ้าง โปเช็ตติโน จะเป็นจุดเริ่มต้นในการเปลี่ยน ยูไนเต็ด ให้กลายเป็นทีมที่มีระเบียบวินัยสูง สามารถกดดันคู่แข่งได้อย่างเข้มข้นและเป็นระบบมากขึ้น"], "link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f043/live/468fa2e0-dddf-11f1-b465-b9821c2582d4.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4aad/live/3387a800-df42-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6ab2/live/cf053980-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/681d/live/dceb6bf0-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c36b/live/e04246d0-de17-11f1-93e1-3b657b665bcf.jpg"], "videos": [], "review_score": "", "published_ts": 1794571788, "published_at": "2026-11-13T12:09:48Z", "published_th": "13 พ.ย. 2026 • 19:09 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776979, "guid": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo", "original_title": "Fernandes rejects second Man Utd contract offer", "thai_title": "บรูโน่ แฟร์นันด์ส ปฏิเสธข้อเสนอสัญญาฉบับใหม่จาก แมนเชสเตอร์ ยูไนเต็ด เป็นครั้งที่สอง", "tag": "Football", "bullet_points": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สอง", "สัญญาปัจจุบันของดาวเตะวัย 32 ปีจะหมดลงหลังจบฤดูกาลนี้ แต่สโมสรมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028", "แมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการเจรจาสัญญาใหม่ แต่การเจรจายังคงไม่มีความคืบหน้า", "สโมสรหวังว่าการเข้ามาคุมทีมของ เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่ จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป", "ฟอร์มการเล่นของแฟร์นันด์สในฤดูกาลนี้ตกลงไปจากเดิมอย่างเห็นได้ชัด โดยทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด"], "full_paragraphs": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในวันที่ 22 พฤศจิกายนนี้", "ทางสโมสรหวังว่าการเข้ามาของโปเช็ตติโน่จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป ทั้งนี้ แฟร์นันด์สเคยเกือบจะได้ย้ายไปร่วมทีมท็อตแนม ฮ็อตสเปอร์ ของโปเช็ตติโน่ในปี 2019 แต่การย้ายทีมไม่เกิดขึ้น ก่อนที่เขาจะย้ายมาอยู่กับแมนเชสเตอร์ ยูไนเต็ด ในอีก 6 เดือนต่อมา โดยในฤดูกาลนี้ อดีตมิดฟิลด์สปอร์ติ้ง ลิสบอน รายนี้ทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด", "ในทางทฤษฎีแล้ว สถานการณ์ความขัดแย้งเรื่องสัญญาปัจจุบันระหว่างแมนเชสเตอร์ ยูไนเต็ด และบรูโน่ แฟร์นันด์ส ไม่ใช่เรื่องใหญ่โตนัก เพราะเป็นเรื่องปกติที่ข้อเสนอครั้งแรก ครั้งที่สอง หรือแม้แต่ครั้งต่อๆ ไปจะถูกปฏิเสธ ซึ่งเป็นส่วนหนึ่งของกระบวนการเจรจาต่อรอง", "แม้แมนเชสเตอร์ ยูไนเต็ด จะมีออปชั่นในการขยายสัญญาเพิ่มอีกหนึ่งปี แต่ก็มีเหตุผลที่ทั้งสองฝ่ายอาจจะยังไม่ต้องการผูกมัดกันเกินกว่านั้นในขณะนี้ ในฝั่งของแฟร์นันด์ส เขามีความปรารถนาอย่างแรงกล้าที่จะคว้าแชมป์รายการใหญ่ที่สุด และเขากำลังเห็นช่วงเวลาที่ดีที่สุดในอาชีพค้าแข้งค่อยๆ ผ่านไป โดยยูไนเต็ดล้มเหลวในการต่อยอดจากฤดูกาลที่ดูมีอนาคตอีกครั้ง และเขาต้องการรอดูว่าเมาริซิโอ โปเช็ตติโน่ จะสร้างผลกระทบอย่างไรเมื่อเขาย้ายมาจากสหรัฐอเมริกา", "แฟร์นันด์สเคยเป็นที่หมายปองของสโมสรในซาอุดี โปรลีก เมื่อ 18 เดือนก่อน แม้จะมีความรู้สึกว่าเขาต้องการค้าแข้งในยุโรปต่อไปมากกว่าก็ตาม ในขณะที่ฝั่งของแมนเชสเตอร์ ยูไนเต็ด ก็ตระหนักดีถึงฟอร์มการเล่นที่ตกลงไปอย่างน่าตกใจของแฟร์นันด์ส เมื่อเทียบกับมาตรฐานที่เขาเคยทำได้ในฤดูกาลที่แล้ว ซึ่งเขาทำลายสถิติการแอสซิสต์ในพรีเมียร์ลีกและกวาดรางวัลผู้เล่นยอดเยี่ยมทุกรายการ", "ลิเวอร์พูลเคยทุ่มเงินมหาศาลให้กับสัญญาฉบับล่าสุดของ โมฮาเหม็ด ซาลาห์ ซึ่งกลายเป็นภาระทางการเงินที่หนักอึ้ง ดังนั้นแมนเชสเตอร์ ยูไนเต็ด จึ
