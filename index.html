เหนือสเปน 3-2 ในศึกเนชันส์ลีก โดยผู้รักษาประตูจากลีดส์ ยูไนเต็ด รายนี้ได้รับเลือกให้ลงสนามก่อน จอร์แดน พิคฟอร์ด ที่สนามเมโทรโปลิตาโน สเตเดียม ทำให้เกิดคำถามว่าเขาคือตัวเลือกเบอร์หนึ่งของ โธมัส ทูเคิล แล้วหรือไม่?", "อังกฤษมีมือหนึ่งคนใหม่แล้วหรือยัง? โธมัส ทูเคิล ยืนยันว่ายังไม่ใช่ “ไม่มีมือหนึ่ง” เขากล่าว แต่ จอร์แดน พิคฟอร์ด อาจต้องทำงานหนักเพื่อทวงตำแหน่งคืนจาก เจมส์ แทรฟฟอร์ด หลังจากได้เห็นฟอร์มการเล่นของเขาในเกมที่อังกฤษเอาชนะสเปน 3-2", "การที่แทรฟฟอร์ดได้ออกสตาร์ทเป็นตัวจริงถือเป็นเรื่องที่มีนัยสำคัญ พิคฟอร์ดเป็นมือหนึ่งที่ไร้ข้อกังขาของอังกฤษมานานนับทศวรรษ เขาเป็นผู้เล่นที่รับใช้ชาติอย่างยอดเยี่ยมด้วยสถิติการลงสนาม 94 นัด ซึ่งเป็นรองเพียงแค่ ปีเตอร์ ชิลตัน ในบรรดาผู้รักษาประตูที่ติดทีมชาติมากที่สุด", "อย่างไรก็ตาม นี่คือบททดสอบที่ใหญ่ที่สุดของอังกฤษในแคมเปญเนชันส์ลีก และทูเคิลเลือกใช้แทรฟฟอร์ด โดยได้รับแรงสนับสนุนจากฟอร์มการเล่นของเขาในเกมที่พบกับสเปนในบ้านและเกมเยือนสาธารณรัฐเช็กเมื่อเดือนกันยายน “เขาเล่นได้อย่างยอดเยี่ยม” ทูเคิลกล่าวเสริมหลังจบเกม", "หากนี่คือการผลัดใบ ก็ถือว่าเป็นการจัดการที่ระมัดระวัง “ผมคิดว่ามันเป็นการจัดการที่ฉลาด” รอย คีน กูรูจากสกายสปอร์ตส์กล่าว “นี่เป็นเวลาที่สมบูรณ์แบบสำหรับแทรฟฟอร์ดที่จะก้าวเข้ามาเจอกับผู้เล่นระดับท็อป และแสดงให้เห็นว่าเขาสามารถทำอะไรได้บ้าง”", "แทรฟฟอร์ดแทบไม่มีงานให้ทำเลยจนกระทั่ง เอลเลียต แอนเดอร์สัน ถูกไล่ออกในนาทีที่ 63 ซึ่งในตอนนั้นสเปนยังไม่มีจังหวะยิงตรงกรอบเลยด้วยซ้ำ หน้าที่เดียวของนายทวารวัย 24 ปี คือการเตะเปิดเกมและการผ่านบอลในขณะที่เจ้าบ้านพยายามบุกเข้าใกล้ประตูของเขา", "แต่ทุกอย่างเปลี่ยนไปเมื่อแอนเดอร์สันออกจากสนาม ทันใดนั้นแทรฟฟอร์ดต้องเผชิญกับผู้เล่นสเปนที่ดาหน้าเข้ามาและระดมยิงใส่ไม่ยั้ง", "สมาธิของเขาไม่วอกแวก ผลงานที่โดดเด่นที่สุดคือการเซฟสองจังหวะในช่วงทดเวลาบาดเจ็บ เมื่อเขาพุ่งตัวไปทางขวาเพื่อปฏิเสธลูกยิงของ เฟร์มิน โลเปซ แล้วลุกขึ้นมาปัดลูกซ้ำของ มิเกล โอยาร์ซาบัล ออกหลังไปได้ทันควัน", "“ทุกครั้งที่คุณดูผู้รักษาประตูฝึกซ้อม มันก็คือแบบนั้น การเซฟแล้วต้องมีปฏิกิริยาตอบสนองทันที” รอย คีน กล่าวชื่นชมความเร็วของปฏิกิริยาตอบสนองของเขา โดยหลังจบเกมเพื่อนร่วมทีมต่างวิ่งเข้ามารุมล้อมแทรฟฟอร์ดด้วยความยินดี", "แต่เขาก็ได้ป้องกันลูกอันตรายจากสเปนไว้หลายครั้งก่อนหน้านั้น ในนาทีที่ 74 เขาปฏิเสธลูกยิงของโลเปซจากจังหวะเตะมุม เขาแทบทำอะไรไม่ได้ในประตูที่สองของสเปนที่ยิงโดย นิโก วิลเลียมส์ จากการเปิดบอลที่สมบูรณ์แบบของ ลามีน ยามาล", "แต่แทรฟฟอร์ดก็ยังตื่นตัวและเซฟลูกยิงของ ลามีน ยามาล ได้หลังจากนั้นไม่นาน เขายังลุกขึ้นมาป้องกันลูกยิงมุมแคบของ มาร์ก กูกูเรยา ไม่ให้หลุดเข้าไปได้ในสไตล์เดียวกับการเซฟสองจังหวะในช่วงทดเวลา", "“ดีมาก” ทูเคิลกล่าวเสริมในงานแถลงข่าว “นั่นคืองานของเขา ในการปิดช่องว่าง เราต้องการการแข่งขันในทุกตำแหน่ง”", "“เราจำเป็นต้องเห็นแทรฟฟอร์ดในสถานการณ์ที่กดดันสูง การเซฟที่ชัดเจนที่สุดซึ่งเขาควรได้รับเครดิตเต็มๆ คือการเซฟสองจังหวะในช่วงท้ายเกม มันยอดเยี่ยมจริงๆ”", "นอกจากนี้ กุนซือทีมชาติอังกฤษยังเน้นย้ำถึงความสำคัญของความนิ่งในการครองบอล “เขามีงานต้องทำมากมายในการสร้างเกมจากแดนหลัง ซึ่งเขาทำได้ดีมากร่วมกับทุกคนรอบข้าง”", "“ไม่เคยเสียสมาธิ ไม่เคยเสียโฟกัส ไม่เคยเสียวิสัยทัศน์ในการมองหาผู้เล่นที่ว่างอยู่เพื่อเอาชนะการเพรสซิ่งและพาเกมไปสู่แดนคู่แข่ง เขาเป็นส่วนหนึ่งของผลงานทีมที่ยอดเยี่ยมร่วมกับคนอื่นๆ”", "ความสามารถในการเล่นบอลของแทรฟฟอร์ดถูกหล่อหลอมมาจากอะคาเดมี่ของ แมนเชสเตอร์ ซิตี้ และทีมเยาวชนของอังกฤษ ในขณะที่การเซฟของเขาเป็นการสานต่อฟอร์มการเล่นจากสโมสรในฤดูกาลนี้", "ตามข้อมูลจาก Opta แทรฟฟอร์ดรั้งอันดับหนึ่งในบรรดาผู้รักษาประตูพรีเมียร์ลีกสำหรับสถิติการป้องกันประตู (Goals Prevented) ในฤดูกาลนี้ โดยเสียไปเพียง 8 ประตูจากโอกาสยิงที่คาดว่าจะเสียประตู (xG) ถึง 12.40 ทำให้เขามีคะแนนอยู่ที่ 4.40", "อย่างไรก็ตาม ต้องระบุด้วยว่าพิคฟอร์ดก็มีค่าส่วนต่างที่เป็นบวกเช่นกัน โดยเสียไป 10 ประตูจากโอกาสยิงที่คาดว่าจะเสียประตู 11.05 เขาอายุมากกว่าแทรฟฟอร์ด 8 ปี ในวัย 32 ปี แต่ยังมีดีพอที่จะช่วยทีมได้ “ทั้งคู่ไม่ได้ห่างกันมากนัก” รอย คีน กล่าว", "พิคฟอร์ดมีความได้เปรียบที่ชัดเจนในแง่ของประสบการณ์ นอกเหนือจากการติดทีมชาติชุดใหญ่ 94 นัดเทียบกับแทรฟฟอร์ดที่มี 5 นัด เขายังมีประสบการณ์ลงเล่นในพรีเมียร์ลีกถึง 372 นัด แต่การเปรียบเทียบตัวเลขแสดงให้เห็นว่าเปอร์เซ็นต์การเซฟของทั้งคู่นั้นใกล้เคียงกัน", "สไตล์ของทั้งคู่แตกต่างกันในแง่ของการจ่ายบอล โดยแทรฟฟอร์ดจ่ายบอลยาวในเปอร์เซ็ .com/26/08/768x432/skysports-football-premier-league_7314479.jpg?20260805121355", "https://e0.365dm.com/26/10/768x432/skysports-now-new-football_7376568.jpg?20261014084654"], "videos": [], "review_score": "", "published_ts": 1794780240, "published_at": "2026-11-15T22:04:00Z", "published_th": "16 พ.ย. 2026 • 05:04 น.", "category_hint": "Football"}, {"id": 1794821448152, "guid": "https://www.skysports.com/football/news/11095/13612611/spain-2-3-england-talking-points-thomas-tuchel-learns-lessons-from-argentina-as-harry-kane-ben-white-and-lewis-hall-shine", "original_title": "England talking points: Tuchel learns Argentina lesson as full-backs shine", "thai_title": "ทูเคิลเรียนรู้บทเรียนจากอาร์เจนตินา! อังกฤษบุกโค่นสเปนคาถิ่น 3-2 ทะลุเข้ารอบเนชันส์ลีก", "tag": "Football", "sub_tag": "ENGLAND", "bullet_points": ["อังกฤษโชว์ฟอร์มแกร่งบุกชนะสเปน 3-2 หยุดสถิติไร้พ่าย 43 นัดของแชมป์โลก พร้อมคว้าสิทธิ์ทีมวางในรอบก่อนรองชนะเลิศเนชันส์ลีก", "โธมัส ทูเคิล ปรับแท็กติกไม่เน้นตั้งรับลึกเหมือนเกมแพ้อาร์เจนตินาในฟุตบอลโลก โดยเลือกใช้แผงหลัง 4 คนแม้เหลือผู้เล่น 10 คน", "แฮร์รี เคน พิสูจน์ความเหนือชั้นด้วยการยิงจุดโทษและมีส่วนร่วมกับเกมรุกอย่างโดดเด่น ตอกย้ำสถานะกองหน้าระดับโลก", "ลูอิส ฮอลล์ และ เบน ไวท์ โชว์ฟอร์มโดดเด่นในตำแหน่งฟูลแบ็ก โดยเฉพาะไวท์ที่สกัดบอลสำคัญช่วยทีมในช่วงท้ายเกม", "เจมส์ แทรฟฟอร์ด นายทวารดาวรุ่งโชว์ฟอร์มเซฟสำคัญและพิสูจน์ตัวเองว่าพร้อมเป็นตัวเลือกเบอร์ 1 แทนที่ จอร์แดน พิคฟอร์ด"], "full_paragraphs": ["ทีมชาติอังกฤษสร้างผลงานระดับมาสเตอร์พีซด้วยการบุกไปเอาชนะสเปน 3-2 ถึงกรุงมาดริด ส่งผลให้ทัพ 'สิงโตคำราม' หยุดสถิติไร้พ่าย 43 นัดของทีมแชมป์โลกได้สำเร็จ พร้อมคว้าแชมป์กลุ่มในศึกเนชันส์ลีกและได้เป็นทีมวางสำหรับการจับสลากรอบก่อนรองชนะเลิศในเดือนมีนาคมปีหน้า", "ดีเอ็นเอฟุตบอลของอังกฤษกลายเป็นประเด็นที่ถูกจับตามองในช่วงฤดูใบไม้ร่วงนี้ และในมาดริดเราได้เห็นสไตล์การเล่นของอังกฤษในเวอร์ชันที่ดีที่สุด พวกเขาเปิดเกมรุกเข้าใส่สเปนตั้งแต่เสียงนกหวีดเริ่มเกมด้วยความเร็ว พละกำลัง และการเล่นที่ดุดัน ทั้งยังเข้าปะทะอย่างหนักหน่วงและไม่ยอมอ่อนข้อให้คู่แข่ง ซึ่งพิสูจน์ให้เห็นว่าอังกฤษไม่ได้พยายามเลียนแบบสไตล์การเล่นของสเปนแต่อย่างใด", "ลูกสูตรจากจังหวะเซตพีซที่นำไปสู่ประตูที่สอง สะท้อนให้เห็นถึงความสำคัญของลูกตั้งเตะในพรีเมียร์ลีก ซึ่งเป็นการประสานงานกันอย่างลงตัวของสองนักเตะจากอาร์เซนอล และแม้จะต้องเหลือผู้เล่นเพียง 10 คนในช่วงท้ายเกม แต่ทีมก็แสดงให้เห็นถึงหัวใจนักสู้และความมุ่งมั่นจนสามารถรักษาสกอร์ไว้ได้", "รอย คีน กล่าวชื่นชมฟอร์มการเล่นของอังกฤษในครึ่งแรกว่าเป็น 'ความสมบูรณ์แบบ' แม้ว่าจะมีข้อผิดพลาดจาก จาเรลล์ ควอนซาห์, เอลเลียต แอนเดอร์สัน และ แอนโธนี กอร์ดอน จนทำให้ไม่สามารถเรียกได้ว่าสมบูรณ์แบบในตอนจบ แต่ทัศนคติและแนวทางการเล่นของอังกฤษนั้นเหนือกว่าความผิดพลาดเหล่านั้น และนี่คือฟุตบอลที่แฟนบอลอังกฤษพร้อมจะสนับสนุน", "โธมัส ทูเคิล ไม่ต้องการพูดถึงการเปรียบเทียบระหว่างชัยชนะนัดนี้กับความพ่ายแพ้ต่ออาร์เจนตินาในรอบรองชนะเลิศฟุตบอลโลกมากนัก โดยเขาย้ำว่าสิ่งที่ควรจดจำคือฟอร์มการเล่นในช่วง 65 นาทีแรกก่อนที่จะโดนใบแดง และเปรียบเทียบเกมรับที่เหนียวแน่นนี้ว่าเหมือนกับชัยชนะเหนือเม็กซิโกในรอบ 16 ทีมสุดท้าย โดยกล่าวว่า 'นี่คือการกลับมาของอาซเตก้าอีกครั้ง'", "อย่างไรก็ตาม ผู้จัดการทีมชาติอังกฤษได้เรียนรู้บทเรียนจากความเจ็บปวดในเกมกับอาร์เจนตินาอย่างชัดเจน ครั้งนี้ไม่มีการใช้กองหลัง 5 คนแม้แต่วินาทีเดียวแม้จะเสียเปรียบเรื่องตัวผู้เล่น ซึ่งต่างจากฟุตบอลโลกที่เขาเปลี่ยนไปใช้หลัง 5 ในนาทีที่ 72 และในเกมกับเม็กซิโกที่ส่ง แดน เบิร์น ลงมาในนาทีที่ 75", "การโดนใบแดงของ เอลเลียต แอนเดอร์สัน ไม่ได้ทำให้ม้านั่งสำรองของอังกฤษตื่นตระหนก โดย จู๊ด เบลลิงแฮม ถูกถอยลงมาเล่นแทนในตำแหน่งที่ว่างลง และการเปลี่ยนตัวคนแรกเกิดขึ้นในช่วง 10 นาทีสุดท้าย ส่วน แดน เบิร์น ถูกส่งลงสนามในนาทีที่ 89 เพื่อเสริมแนวรับเท่านั้น ทูเคิลแสดงความเชื่อมั่นว่าทีมสามารถต้านทานทีมที่ดีที่สุดในโลกได้ด้วยแผงหลัง 4 คน และความมั่นใจนี้ส่งผลให้แฟนบอลเริ่มเชื่อมั่นในตัวทูเคิลมากขึ้น", "แฟนบอลอังกฤษร้องเพลงเชียร์ 'แฮร์รี เคน เขาคือคนที่เก่งที่สุดในโลก' เพื่อเป็นการเย้ยหยันเจ้าถิ่นและ ลามีน ยามาล ที่จบอันดับ 3 ในการประกาศรางวัลบัลลงดอร์ ก่อนเกมนี้ผู้เล่นสเปนหลายคนออกมาให้สัมภาษณ์ว่าเพื่อนร่วมทีมของพวกเขาควรได้รับรางวัลแทนเคน แต่กัปตันทีมชาติอังกฤษได้พิสูจน์ความยอดเยี่ยมบนสนามจริง", "เคนเรียกจุดโทษและสังหารเข้าไปอย่างเยือกเย็นเพื่อทำประตูขึ้นนำ ซึ่งถือเป็นการลบฝันร้ายจากการพลาดจุดโทษในเกมที่พบกับคู่แข่งรายเดียวกันนี้เมื่อเดือนกันยายน นอกจากนี้เขายังมีส่วนร่วมในประตูที่สาม ซึ่งเป็นเพียงหนึ่งในหลายจังหวะที่เขาประสานงานกับ จู๊ด เบลลิงแฮม ได้อย่างยอดเยี่ยม ปัจจุบันดาวยิงสูงสุดและเจ้าของสถิติลงสนามมากที่สุดของอังกฤษรายนี้กำลังอยู่ในช่วงพีคของอาชีพค้าแข้ง", "นี่คือค่ำคืนที่ ลูอิส ฮอลล์ ยกระดับฝีเท้าขึ้นไปอีกขั้น หลังจากเคยได้รับคำชมจากการรับมือ ลามีน ยามาล ที่เซนต์เจมส์พาร์กในศึกแชมเปียนส์ลีกมาแล้ว แม้จะมีข้อกังขาว่าเขาจะทำได้ดีหรือไม่ในเกมนี้ แต่ฮอลล์ก็พิสูจน์ให้เห็นว่าเขาคือตัวเลือกเบอร์หนึ่งในตำแหน่งแบ็กซ้ายของอังกฤษ และทำให้หลายคนตั้งคำถามว่าทำไมเขาถึงไม่มีชื่อติดทีมไปฟุตบอลโลก", "ฮอลล์โชว์ฟอร์มเกมรับได้อย่างยอดเยี่ยม รวมถึงจังหวะเข้าสกัดสำคัญก่อนหมดครึ่งแรกที่หยุดทั้ง ลามีน ยามาล และ มิเกล เมริโน ในกรอบเขตโทษ และในช่วงวินาทีสุดท้ายเขายังเรียกจังหวะเตะจากประตูได้อย่างชาญฉลาดเมื่อ อเล็กซ์ บาเอนา กำลังจะบุกเข้าทำประตู นอกจากนี้เขายังเลี้ยงบอลผ่านคู่แข่งถึง 5 ครั้ง สะท้อนถึงแผนการเล่นที่เน้นเกมรุกของอังกฤษ", "เบน ไวท์ ทำผลงานได้อย่างโดดเด่น โดยเฉพาะในนาทีที่ 84 ที่เขาโชว์จังหวะสไลด์สกัดบอลสำคัญในฐานะกองหลังตัวสุดท้ายเพื่อหยุด นิโก วิลเลียมส์ ไม่ให้หลุดเข้าไปดวลเดี่ยวกับผู้รักษาประตู ซึ่งเป็นจังหวะที่คล้ายกับ ดีเจด สเปนซ์ ในเกมพบอาร์เจนตินา แต่ครั้งนี้อังกฤษสามารถรักษาสกอร์ไว้ได้จนจบเกม", "ไวท์ได้กลับมาพิสูจน์ตัวเองในสีเสื้อทีมชาติอังกฤษอีกครั้ง หลังจากที่หลายคนเคยคิดว่าเขาอาจจะไม่ได้เล่นให้ทีมชาติอีกต่อไป และแม้จะเคยถูกวิจารณ์อย่างหนัก แต่ตอนนี้เขากำลังพิสูจน์ว่าเขาสามารถยึดตำแหน่งแบ็กขวาตัวจริงได้ โดยไวท์ถือเป็นแบ็กขวาคนที่ 6 ที่ได้ออกสตาร์ทตัวจริงในรอบ 11 เกมหลังสุดของอังกฤษ นับตั้งแต่เริ่มรอบน็อกเอาต์ฟุตบอลโลก", "โธมัส ทูเคิล พยายามลดกระแสข่าวที่ว่า เจมส์ แทรฟฟอร์ด จะมาแทนที่ จอร์แดน พิคฟอร์ด ในฐานะมือหนึ่งของทีม แต่ผู้รักษาประตูดาวรุ่งรายนี้ได้แสดงให้เห็นแล้วว่าเขามีความสามารถที่จะเฉิดฉายในเวทีใหญ่ที่มาดริด จังหวะเซฟสองครั้งติดต่อกันในช่วงท้ายเกมถือเป็นจุดเปลี่ยนสำคัญ และทูเคิลยังชื่นชมการออกบอลและความนิ่งในการเล่นจากแดนหลังของเขา", "แม้เขาจะเสียไปถึง 4 ประตูจากการลงเล่น 2 นัดที่พบกับสเปนในรอบแบ่งกลุ่มเนชันส์ลีกนี้ แต่เขาก็สร้างชื่อเสียงให้ตัวเองได้มากขึ้นและกลายเป็นผู้ท้าชิงตำแหน่งมือหนึ่งของพิคฟอร์ดอย่างชัดเจน แม้พิคฟอร์ดจะไม่เคยทำให้ทีมชาติผิดหวัง แต่หากถึงเวลาเปลี่ยนผ่านในอนาคตอันใกล้ แทรฟฟอร์ดก็อยู่ในตำแหน่งที่ดีที่สุดที่จะก้าวขึ้นมาแทนที่", "อังกฤษจะทราบผลการจับสลากรอบก่อนรองชนะเลิศเนชันส์ลีกในวันศุกร์ที่ 20 พฤศจิกายน เวลา 11.00 น. โดยการแข่งขันในรอบนี้จะเป็นระบบเหย้า-เยือน ซึ่งมีกำหนดจัดขึ้นในช่วงพักเบรกทีมชาติเดือนมีนาคม โดยนัดแรกจะแข่งขันระหว่างวันที่ 25-27 มีนาคม และนัดที่สองระหว่างวันที่ 28-30 มีนาคม"], "link": "https://www.skysports.com/football/news/11095/13612611/spain-2-3-england-talking-points-thomas-tuchel-learns-lessons-from-argentina-as-harry-kane-ben-white-and-lewis-hall-shine", "canonical_link": "https://www.skysports.com/football/news/11095/13612611/spain-2-3-england-talking-points-thomas-tuchel-learns-lessons-from-argentina-as-harry-kane-ben-white-and-lewis-hall-shine", "cover_image_url": "https://e0.365dm.com/26/11/1920x1080/skysports-thomas-tuchel-england_7407578.jpg?20261116081535", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-england-konsa-white_7407466.jpg?20261116003749", "https://e0.365dm.com/26/11/768x432/skysports-football-england_7407407.jpg?20261115223319", "https://e0.365dm.com/26/11/768x432/skysports-england-tuchel_7407417.jpg?20261115224240", "https://e0.365dm.com/26/11/768x432/skysports-harry-kane-pen-penalty_7407309.jpg?20261115203842", "https://e0.365dm.com/26/11/768x432/skysports-hall-england_7407411.jpg?20261115223700", "https://e0.365dm.com/26/11/768x432/skysports-white-england_7407408.jpg?20261115223324", "https://e0.365dm.com/26/11/768x432/skysports-white-england_7407410.jpg?20261115223439", "https://e0.365dm.com/26/08/512x512/skysports-super-6-sky-bet_7320401.jpg"], "videos": [], "review_score": "", "published_ts": 1794779520, "published_at": "2026-11-15T21:52:00Z", "published_th": "16 พ.ย. 2026 • 04:52 น.", "category_hint": "Football"}, {"id": 1794821448154, "guid": "https://www.skysports.com/football/spain-vs-england/report/554117", "original_title": "Ten-man England hold on to claim famous win over Spain", "thai_title": "สิบคนก็เอาอยู่! อังกฤษบุกเชือดสเปน 3-2 หยุดสถิติไร้พ่ายแชมป์โลก พร้อมคว้าแชมป์กลุ่มเนชันส์ลีก", "tag": "Football", "sub_tag": "ENGLAND", "bullet_points": ["อังกฤษโชว์ฟอร์มดุบุกชนะสเปน 3-2 หยุดสถิติไร้พ่าย 43 นัดของแชมป์โลกได้สำเร็จ", "ทัพสิงโตคำรามขึ้นนำห่าง 3-0 จาก แฮร์รี เคน, เอซรี คอนซา และ เบน ไวท์ ก่อนจะเหลือผู้เล่น 10 คนจากการโดนใบแดงของ เอลเลียต แอนเดอร์สัน", "เจมส์ แทรฟฟอร์ด โชว์ฟอร์มหนึบเซฟสำคัญหลายครั้งในช่วงท้ายเกม ช่วยให้ทีมรักษาสกอร์คว้าชัยชนะ", "ชัยชนะนัดนี้ทำให้อังกฤษจบอันดับ 1 ของกลุ่ม A3 ในศึกยูฟ่า เนชันส์ลีก และได้เป็นทีมวางในการจับสลากรอบก่อนรองชนะเลิศ"], "full_paragraphs": ["ทีมชาติอังกฤษสามารถต้านทานการบุกหนักของสเปนหลังจากที่ เอลเลียต แอนเดอร์สัน ถูกใบแดงไล่ออกจากสนาม จนสามารถคว้าชัยชนะสุดสำคัญ 3-2 และจบอันดับเหนือแชมป์โลกอย่างสเปนในฐานะจ่าฝูงของกลุ่มเนชันส์ลีกได้สำเร็จ", "ลูกทีมของ โธมัส ทูเคิล โชว์ฟอร์มได้อย่างยอดเยี่ยมตลอดหนึ่งชั่วโมงแรกในกรุงมาดริด โดยขึ้นนำก่อนจากจุดโทษของ แฮร์รี เคน ในช่วงท้ายครึ่งแรก ก่อนจะบวกเพิ่มอีกสองประตูอย่างรวดเร็วจาก เอซรี คอนซา และ เบน ไวท์", "อย่างไรก็ตาม เกมที่ดูเหมือนจะเป็นการเดินหน้าบุกฝ่ายเดียวกลับพลิกผันเมื่อ เอลเลียต แอนเดอร์สัน ถูกใบแดงไล่ออกจากสนามจากจังหวะทำฟาวล์ ลามีน ยามาล ในฐานะผู้เล่นคนสุดท้ายหลังจากความผิดพลาดของ จาเรลล์ ควอนซา ส่งผลให้ มิเกล โอยาร์ซาบัล สังหารจุดโทษตีไข่แตกให้สเปน", "สเปนไล่ตามมาเหลือเพียงประตูเดียวเมื่อ นิโก วิลเลียมส์ ตัวสำรองยิงประตูจากการเปิดของ ลามีน ยามาล หลังจากที่ แอนโทนี กอร์ดอน เสียบอลกลางทาง แต่ทีมชาติอังกฤษยังคงยันสกอร์ไว้ได้ด้วยฟอร์มอันเหนียวหนึบของ เจมส์ แทรฟฟอร์ด", "ผู้รักษาประตูรายนี้ซึ่งได้รับเลือกให้ลงสนามแทน จอร์แดน พิคฟอร์ด โชว์ซูเปอร์เซฟหลายครั้งในขณะที่สเปนระดมยิงใส่ประตูอังกฤษ รวมถึงจังหวะเซฟสองจังหวะซ้อนที่ปฏิเสธลูกยิงของ เฟร์มิน โลเปซ และตามไปปัดลูกซ้ำของ โอยาร์ซาบัล ออกหลังไปได้อย่างเหลือเชื่อ", "วีรกรรมของเขาประกอบกับการเข้าสกัดสำคัญในฐานะผู้เล่นคนสุดท้ายของ เบน ไวท์ ที่มีต่อ วิลเลียมส์ ช่วยให้ทัพสิงโตคำรามยุติสถิติไร้พ่าย 43 นัดของสเปนลงได้ด้วยชัยชนะครั้งประวัติศาสตร์ ซึ่งรับประกันว่าพวกเขาจะเป็นทีมวางในการจับสลากรอบก่อนรองชนะเลิศเนชันส์ลีก", "ชัยชนะดูเหมือนจะขาดลอยยิ่งกว่านี้เมื่อ เบน ไวท์ ยิงประตูที่สามลอดขา อูไน ซิมอน หลังจากที่ คอนซา โหม่งลูกเตะมุมของ เดแคลน ไรซ์ เข้าไปเป็นประตูที่สอง โดยในขณะนั้นสเปนยังไม่มีโอกาสยิงตรงกรอบเลยแม้แต่ครั้งเดียว", "แต่ใบแดงของ แอนเดอร์สัน หลังจากที่ ควอนซา ถูก ลามีน ยามาล ฉกบอลไปได้นั้น ทำให้สเปนกลับมามีความหวังอีกครั้ง และทำให้อังกฤษต้องแสดงคุณภาพที่เคยแสดงให้เห็นในเกมฟุตบอลโลก รอบ 16 ทีมสุดท้ายที่ชนะเม็กซิโกที่สนามเอสตาดิโอ อัซเตกา เมื่อเดือนกรกฎาคมที่ผ่านมา", "ความแข็งแกร่งและการมีส่วนร่วมของผู้รักษาประตูช่วยให้พวกเขาผ่านพ้นวิกฤตไปได้ และแสดงให้เห็นถึงพัฒนาการจากที่เคยตกรอบรองชนะเลิศฟุตบอลโลกต่ออาร์เจนตินา ซึ่งในตอนนั้นพวกเขาเสียการนำในช่วงท้ายเกม", "โธมัส ทูเคิล กุนซือทีมชาติอังกฤษกล่าวว่า: 'เราตระหนักดีถึงผลงานที่เราทำได้ในช่วง 60-65 นาทีแรก การนำ 3-0 และนำอย่างสมศักดิ์ศรี 3-0 แน่นอนว่าใบแดงและจุดโทษเปลี่ยนโมเมนตัมและลักษณะของเกม การเล่น 30 นาทีกับสเปน ในสเปน มันรู้สึกเหมือนยาวนานถึงสามชั่วโมง'", "'นั่นคือคำแถลงและความสำคัญของชัยชนะครั้งนี้ คือมันเป็นชัยชนะที่สมควรได้รับและผลการแข่งขันเป็นไปตามฟอร์มการเล่น มันอยู่ในระดับสูงสุดทั้งในแง่ของความเชื่อมั่น จิตวิญญาณของทีม และความเป็นน้ำหนึ่งใจเดียวกัน มันอยู่ในระดับสูงสุดในแง่ของฟุตบอลในทุกด้านของเกม'", "'นั่นเป็นผลงานที่ยอดเยี่ยม ความรู้สึกที่ยอดเยี่ยมในห้องแต่งตัว ทุกคนเหนื่อยมาก เราผ่านช่วงเวลาที่ยากลำบากมาได้ เราตระหนักดีถึงก้าวที่เราทำได้หลังจากฟุตบอลโลก มันเป็นความรู้สึกที่ดีที่สุด'", "แฮร์รี เคน กัปตันทีมชาติอังกฤษกล่าวถึงการที่สเปนจัดขบวนแห่ถ้วยแชมป์ฟุตบอลโลกก่อนเริ่มเกมว่า: 'ถ้าจะมีอะไร มันทำให้เราหิวกระหายมากขึ้น มันทำให้เรามีความมุ่งมั่นที่จะบอกว่า โอเค นี่คือสี่เดือนต่อมา แต่เราคือทีมที่จะก้าวต่อไปและเป็นแชมป์ยุโรปและแชมป์โลกทีมต่อไป'", "'เรายังต้องพิสูจน์เรื่องนั้นแน่นอน เรายังมีหนทางอีกยาวไกล ค่ำคืนแบบคืนนี้จะช่วยเพิ่มความเชื่อมั่นในทีมเท่านั้น มันแสดงให้เห็นว่าเรากำลังทำอะไร เมื่อเราพูดถึงมัน มันเป็นเรื่องหนึ่ง แต่เมื่อเราแสดงให้เห็นกับทีมที่ดีที่สุ ้รับอิทธิพลมาจาก มาร์เซโล บิเอลซ่า", "ความท้าทายสำคัญของกุนซือชาวอาร์เจนไตน์คือการปรับจูนสภาพร่างกายและทัศนคติของนักเตะยูไนเต็ดให้เข้ากับระบบที่ต้องใช้พลังงานสูง", "โปเช็ตติโนแสดงให้เห็นถึงการปรับตัวในอดีต ทั้งการปรับแผนที่ ปารีส แซงต์-แชร์กแมง เพื่อรองรับสตาร์ดัง และการใช้ระบบที่ยืดหยุ่นขึ้นกับทีมชาติสหรัฐอเมริกา"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งให้เป็นผู้จัดการทีมคนใหม่ของ แมนเชสเตอร์ ยูไนเต็ด ต่อจาก ไมเคิล คาร์ริค ที่ถูกปลดออกจากตำแหน่ง โดยกุนซือวัย 54 ปีผู้นี้ได้นำประสบการณ์การคุมทีมทั้งในเซาแธมป์ตัน, ท็อตแนม ฮ็อตสเปอร์ และเชลซี เข้ามาสู่ถิ่นโอลด์ แทรฟฟอร์ด แต่คำถามสำคัญคือผลงานในอดีตของเขาบอกอะไรเราได้บ้างเกี่ยวกับทิศทางของทีมภายใต้การคุมทัพของเขา?", "โปเช็ตติโน ซึ่งเพิ่งผ่านงานคุมทีมชาติสหรัฐอเมริกาและพาทีมเข้าสู่รอบ 16 ทีมสุดท้ายในฟุตบอลโลกครั้งล่าสุด กำลังหวนคืนสู่เวทีฟุตบอลอังกฤษอีกครั้ง โดยเราจะย้อนกลับไปดูเส้นทางการคุมทีมของเขาตั้งแต่สมัยอยู่เซาแธมป์ตัน จนถึงช่วงเวลา 18 เดือนที่ปารีส แซงต์-แชร์กแมง เพื่อวิเคราะห์ว่าเขาอาจจะปรับเปลี่ยน แมนเชสเตอร์ ยูไนเต็ด อย่างไรบ้าง", "ระบบ 4-2-3-1 กลายเป็นแผนการเล่นหลักที่โปเช็ตติโนเลือกใช้ตั้งแต่สมัยคุมเซาแธมป์ตัน โดยเขายังคงโครงสร้างทีมเดิมจากยุค ไนเจล แอดกินส์ แต่เปลี่ยนสไตล์การเล่นอย่างสิ้นเชิงด้วยการเน้นการเพรสซิ่งสูง ในด้านตัวผู้เล่น เขาไม่ได้มีการเสริมทัพครั้งใหญ่มากนักนอกจาก เดยัน ลอฟเรน และ วิคเตอร์ วานยาม่า แต่เขากลับแสดงให้เห็นถึงความสามารถในการยกระดับนักเตะที่มีอยู่เดิม เช่น อดัม ลัลลาน่า, มอร์แกน ชไนเดอร์แลง, เจย์ โรดริเกซ, ลุค ชอว์ และ นาธาเนียล ไคลน์", "อดัม ลัลลาน่า ได้สะท้อนถึงช่วงเวลานั้นว่า 'ตอนที่ผมเริ่มเล่นให้เซาแธมป์ตัน ผมเล่นทางฝั่งซ้ายและเป็นหมายเลข 10 ซึ่งเกือบจะเป็นผู้เล่นประเภทที่เล่นแบบไม่ต้องช่วยเกมรับ แต่เมื่อโปเช็ตติโนเข้ามา วันแรกก็ชัดเจนเลยว่าในทีมของเขาจะไม่มีที่ว่างสำหรับผู้เล่นประเภทนั้น'", "โปเช็ตติโนนำแนวทางเดียวกันนี้ไปใช้ที่สเปอร์ส โดยทีมของเขามีเอกลักษณ์ที่ความดุดันและความเข้มข้นในการเล่นโดยไม่มีบอล รวมถึงการจ่ายบอลแนวตั้งที่รวดเร็วเพื่อโจมตีอย่างฉับไวตามสไตล์ของ มาร์เซโล บิเอลซ่า ซึ่งโปเช็ตติโนยกย่องให้เป็นอิทธิพลสำคัญที่สุดในการเป็นโค้ชของเขาเคียงคู่กับ เซอร์ อเล็กซ์ เฟอร์กูสัน", "ที่สเปอร์ส เขาใช้ระบบ 4-2-3-1 เป็นหลักและช่วยให้ดาวรุ่งหลายคนแจ้งเกิด โดยเฉพาะ เดเล่ อัลลี่ และ แฮร์รี่ เคน ที่ประสานงานกันได้อย่างยอดเยี่ยมในฐานะหมายเลข 10 และหมายเลข 9 โดยเขามักใช้ฟูลแบ็กเติมเกมรุกและให้กองกลางตัวรับอย่าง เอริค ดายเออร์ ถอยลงมาเป็นเซ็นเตอร์แบ็กคนที่สาม เพื่อเปิดพื้นที่ให้ อัลลี่, คริสเตียน เอริคเซ่น และ ซน ฮึง-มิน เล่นใกล้กับ เคน มากขึ้น", "โปเช็ตติโนใช้ดาวรุ่งเหล่านั้นเปลี่ยนโฉมสเปอร์สจนเข้าถึงรอบชิงชนะเลิศยูฟ่า แชมเปี้ยนส์ลีก และจบอันดับท็อป 3 ของพรีเมียร์ลีกได้ถึง 3 ฤดูกาลติดต่อกัน อย่างไรก็ตาม เมื่อเวลาผ่านไปอายุเฉลี่ยของทีมมากขึ้น สภาพร่างกายเริ่มถดถอย และการเสริมทัพที่ไม่เพียงพอทำให้ทีมไม่สามารถรักษาความเข้มข้นได้ จนกระทั่งเขาอำลาทีมในปี 2019 ซึ่งถือเป็นการสิ้นสุดวัฏจักรของทีม", "เมื่อย้ายไปคุม ปารีส แซงต์-แชร์กแมง โปเช็ตติโนต้องปรับปรัชญาให้เข้ากับนักเตะ โดยเฉพาะการมี ลิโอเนล เมสซี่, คีลิยัน เอ็มบัปเป้ และ เนย์มาร์ ทำให้เขาต้องลดการเพรสซิ่งสูงที่เคยเป็นจุดเด่นลง เพราะสตาร์ทั้งสามไม่ถนัดในเกมที่ต้องใช้พลังงานสูงเช่นนั้น โดยเขาหันไปใช้ระบบ 4-3-3 เป็นหลัก", "ในสมัยคุมเชลซีเมื่อปี 2023 โปเช็ตติโนเริ่มด้วยระบบ 3-4-2-1 ก่อนจะเปลี่ยนมาใช้ 4-2-3-1 ที่เขาชื่นชอบ โดย โคล พาลเมอร์ กลายเป็นนักเตะที่แจ้งเกิดภายใต้การคุมทีมของเขาด้วยผลงาน 22 ประตูและ 11 แอสซิสต์ แต่โดยรวมแล้วเขายังพบความยากลำบากในการถ่ายทอดไอเดีย", "ในเดือนเมษายนของฤดูกาลนั้น เขาเคยตั้งคำถามถึงทัศนคติของลูกทีมว่า 'เรายังต้องสร้างทัศนคติที่จะช่วยให้เราก้าวไปข้างหน้า คุณต้องเรียกร้องจากตัวเองและเพื่อนร่วมทีมให้มากขึ้น' ซึ่งเห็นได้ชัดจากสถิติระยะทางวิ่งที่ทีมเชลซีของเขาอยู่ในอันดับที่ 3 จากท้ายตารางในฤดูกาล 2023/24 ต่างจากสมัยคุมสเปอร์สที่มักจะติดอันดับต้นๆ ของลีกเสมอ", "ในการคุมทีมชาติสหรัฐอเมริกา โปเช็ตติโนมีความยืดหยุ่นมากขึ้นโดยสลับระหว่างหลังสามและหลังสี่ และเน้นการเคลื่อนที่ที่อิสระของแนวรุก ซึ่งช่วยให้ทีมเอาชนะทั้ง ปารากวัย, ออสเตรเลีย และ บอสเนียและเฮอร์เซโกวีนา ได้สำเร็จ", "สำหรับ แมนเชสเตอร์ ยูไนเต็ด ทีมของโปเช็ตติโนน่าจะมีโครงสร้างคล้ายกับยุคของ คาร์ริค ที่ใช้ 4-2-3-1 แต่เขาอาจต้องปรับจูนนักเตะอย่าง เลนี่ โยโร่ เพื่อรับมือกับไลน์กองหลังที่สูงขึ้น หรือการใช้ความสดของ แพทริค ดอร์กู แทนที่ ลุค ชอว์ รวมถึงการใช้ คาร์ลอส บาเลบา ในแดนกลาง", "อย่างไรก็ตาม โปเช็ตติโนอาจต้องยอมรับความจริงว่าเขาไม่สามารถเรียกร้องความเข้มข้นระดับสูงได้ทันที เนื่องจากขุมกำลังของยูไนเต็ดในปัจจุบันมีอายุเฉลี่ยค่อนข้างสูง และทีมยังมีสถิติระยะทางวิ่งรวมอยู่อันดับที่ 19 ของลีกในฤดูกาลนี้", "โปเช็ตติโนเคยกล่าวไว้เมื่อเร็วๆ นี้ว่า 'ถ้าคุณไม่เปลี่ยนแปลง คุณก็ตาย' ซึ่งทัศนคตินี้จะเป็นสิ่งจำเป็นอย่างยิ่งที่โอลด์ แทรฟฟอร์ด ในการปรับเปลี่ยนทีมที่แตกต่างจากยุคทองของเขาที่สเปอร์สอย่างสิ้นเชิง"], "link": "https://www.skysports.com/football/news/11095/13611443/mauricio-pochettino-to-man-utd-what-does-a-pochettino-team-look-like-and-how-will-he-set-up-struggling-red-devils", "canonical_link": "https://www.skysports.com/football/news/11095/13611443/mauricio-pochettino-to-man-utd-what-does-a-pochettino-team-look-like-and-how-will-he-set-up-struggling-red-devils", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-premier-league-manchester-united_7405659.jpg?20261113093243", "gallery_images": ["https://e0.365dm.com/19/07/75x75/skysports-nick-wright-football_4713429.jpg?20190709112251", "https://e0.365dm.com/26/11/768x432/skysports-mauricio-pochettino_7404952.png?20261112122042", "https://e0.365dm.com/26/11/768x432/skysports-football-manchester-united_7405858.jpg?20261113141616", "https://e0.365dm.com/26/11/768x432/skysports-kane-potchettino_7404051.jpg?20261111150710", "https://e0.365dm.com/26/11/768x432/skysports-pochettino-mauricio_7404951.png?20261112122020", "https://e0.365dm.com/26/11/768x432/skysports-psg-pochettinp-maruicio_7404991.png?20261112130141", "https://e0.365dm.com/26/11/768x432/skysports-mauricio-pochettino_7405857.jpg?20261113141506", "https://e0.365dm.com/26/11/768x432/skysports-chelsea-pochettinop_7405632.png?20261113090015"], "videos": [], "review_score": "", "published_ts": 1794639600, "published_at": "2026-11-14T07:00:00Z", "published_th": "14 พ.ย. 2026 • 14:00 น.", "category_hint": "Football"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นความคล่องตัวสูง คุณจำเป็นต้องวิ่ง คุณต้องสามารถวิ่งและทำความเร็วสูงได้ พื้นฐานที่สุดคือต้องฟิต\"", "\"ผู้จัดการทีมทุกคนต้องการช่วงปรีซีซั่นที่ดีและเวลาในการถ่ายทอดไอเดียรวมถึงสร้างความฟิต แต่นักเตะจะรู้สึกได้ทันทีว่ามันเป็นคนละระดับกัน นี่คือสิ่งที่ต้องทำทุกวันที่สนามซ้อม ต้องเต็มที่ 100% นั่นคือสิ่งที่เขาขอและต้อ ค้ชมาจากสหรัฐฯ", "โปเช็ตติโน่ยอมรับว่านี่เป็นการตัดสินใจที่ยากลำบากที่สุดครั้งหนึ่งในอาชีพ แต่โอกาสในการคุมทีมระดับโอลด์แทรฟฟอร์ดนั้นยากที่จะปฏิเสธ", "กุนซือชาวอาร์เจนไตน์จะประเดิมคุมทีมแมนเชสเตอร์ ยูไนเต็ด นัดแรกในเกมเยือนลิเวอร์พูล วันที่ 22 พฤศจิกายนนี้", "สถานการณ์ของแมนเชสเตอร์ ยูไนเต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะลุช่องโดยตรง ไม่ได้แตกต่างจากสิ่งที่ คาร์ริค พยายามจะทำ และแม้ว่านั่นอาจทำให้แฟนบอล ยูไนเต็ด กังวล แต่ความคล้ายคลึงในหลักการจะส่งผลดีต่อตัวผู้เล่น", "\"ปรัชญาของผมคือการมอบสไตล์ที่อิสระภายใต้การจัดระเบียบที่ดี\" คือคำพูดของ โปเช็ตติโน ในปี 2014 แม้ปรัชญาจะคล้ายกัน แต่ส่วนหลังคือ 'การจัดระเบียบที่ชัดเจน' ซึ่งน่าจะเป็นสิ่งที่ คาร์ริค ยังไม่สามารถมอบให้ผู้เล่นได้อย่างมั่นคง", "สำหรับแฟนบอลทีมใหญ่ ฟุตบอลที่รวดเร็วและเน้นแนวตั้งมักได้รับการยอมรับเมื่อมันมาจากความตั้งใจที่จะเป็นฝ่ายรุกก่อน ย์", "การจับสลากประกบคู่รอบก่อนรองชนะเลิศจะมีขึ้นในวันศุกร์นี้ โดยการแข่งขันจะมีขึ้นในช่วงพักเบรกทีมชาติเดือนมีนาคม 2027"], "full_paragraphs": ["การแข่งขันยูฟ่า เนชันส์ ลีก รอบก่อนรองชนะเลิศ รอบรองชนะเลิศ และรอบชิงชนะเลิศ ได้มีการอธิบายรูปแบบการแข่งขันไว้อย่างชัดเจน โดยการจับสลากประกบคู่รอบ 8 ทีมสุดท้ายจะมีขึ้นในวันศุกร์นี้ หลังจากที่บทสรุปของรอบแบ่งกลุ่มเสร็จสิ้นลง ซึ่งทีมชาติอังกฤษได้ผ่านเข้าสู่รอบน็อกเอาต์เป็นที่เรียบร้อยแล้ว และสามารถคว้าแชมป์กลุ่มได้สำเร็จจากการเอาชนะสเปนที่กรุงมาดริดเมื่อวันอาทิตย์ที่ผ่านมา", "ชัยชนะของอังกฤษเหนือสเปนในกรุงมาดริดส่งผลให้พวกเขาจบด้วยการเป็นอันดับหนึ่งของกลุ่ม ซึ่งมีความสำคัญอย่างยิ่งเนื่องจากแชมป์กลุ่มในลีก A ของเนชันส์ ลีก จะได้รับสิทธิ์เป็นทีมวางในการจับสลากรอบก่อนรองชนะเลิศ โดยพวกเขาจะต้องพบกับทีมที่จบอันดับสองจากกลุ่มอื่น และจะได้สิทธิ์ลงเล่นเกมเลกที่สองของรอบก่อนรองชนะเลิศในบ้านของตัวเอง", "สำหรับเบลเยียมนั้นจบการแข่งขันในฐานะรองแชมป์กลุ่ม A1 จึงทำให้พวกเขากลายเป็นหนึ่งในคู่แข่งที่มีโอกาสพบกับอังกฤษในรอบ 8 ทีมสุดท้าย อย่างไรก็ตาม 'สิงโตคำราม' จะไม่สามารถจับสลากมาพบกับสเปนในรอบนี้ได้ เนื่องจากกฎระบุว่าทีมที่มาจากกลุ่มเดียวกันจะไม่สามารถพบกันเองในรอบก่อนรองชนะเลิศได้ และจะไม่พบกับฝรั่งเศสเนื่องจากฝรั่งเศสจบการแข่งขันในฐานะแชมป์กลุ่ม A1 เช่นกัน", "ในส่วนของทีมอื่นๆ ที่อยู่ในข่ายลุ้นจบอันดับ 1 หรือ 2 ในกลุ่มลีก A อื่นๆ ได้แก่ กลุ่ม A2 ประกอบด้วย เนเธอร์แลนด์, กรีซ และเยอรมนี ส่วนกลุ่ม A4 ประกอบด้วย โปรตุเกส, เดนมาร์ก และนอร์เวย์", "การจับสลากประกบคู่รอบ 8 ทีมสุดท้ายจะมีขึ้นในวันศุกร์นี้ เวลา 11.00 น. ตามเวลาของสหราชอาณาจักร โดยรอบก่อนรองชนะเลิศจะเป็นการแข่งขันแบบเหย้า-เยือนสองเลก ซึ่งทีมวางที่เป็นแชมป์กลุ่มจะได้ลงเล่นนัดที่สองในบ้านของตนเอง", "โปรแกรมการแข่งขันจะมีขึ้นในช่วงพักเบรกทีมชาติเดือนมีนาคม โดยเลกแรกจะแข่งขันระหว่างวันที่ 25-27 มีนาคม และเลกที่สองจะแข่งขันระหว่างวันที่ 28-30 มีนาคม", "จากนั้นการแข่งขันเนชันส์ ลีก ไฟนอลส์ จะจัดขึ้นระหว่างวันที่ 9 ถึง 13 มิถุนายน 2027 โดยทัวร์นาเมนต์นี้จะประกอบด้วยรอบรองชนะเลิศสองคู่, การแข่งขันชิงอันดับที่สาม และรอบชิงชนะเลิศ ซึ่งจะมี 4 ชาติที่ผ่านเข้ามาแข่งขันเพื่อชิงตำแหน่งแชมป์แห่งย เสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในวันที่ 22 พฤศจิกายนนี้", "ทางสโมสรหวังว่าการเข้ามาของโปเช็ตติโน่จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป ทั้งนี้ แฟร์นันด์สเคยเกือบจะได้ย้ายไปร่วมทีมท็อตแนม ฮ็อตสเปอร์ ของโปเช็ตติโน่ในปี 2019 แต่การย้ายทีมไม่เกิดขึ้น ก่อนที่เขาจะย้ายมาอยู่กับแมนเชสเตอร์ ยูไนเต็ด ในอีก 6 เดือนต่อมา โดยในฤดูกาลนี้ อดีตมิดฟิลด์สปอร์ติ้ง ลิสบอน รายนี้ทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด", "ในทางทฤษฎีแล้ว สถานการณ์ความขัดแย้งเรื่องสัญญาปัจจุบันระหว่างแมนเชสเตอร์ ยูไนเต็ด และบรูโน่ แฟร์นันด์ส ไม่ใช่เรื่องใหญ่โตนัก เพราะเป็นเรื่องปกติที่ข้อเสนอครั้งแรก ครั้งที่สอง หรือแม้แต่ครั้งต่อๆ ไปจะถูกปฏิเสธ ซึ่งเป็นส่วนหนึ่งของกระบวนการเจรจาต่อรอง", "แม้แมนเชสเตอร์ ยูไนเต็ด จะม 8.00 น. ของวันอาทิตย์ที่ 8 พฤศจิกายน เมื่อข้อความสำคัญถูกส่งมาถึง ในขณะที่แมนเชสเตอร์ ยูไนเต็ด กำลังตามหลัง แอสตัน วิลลา อยู่ 4-2 และแฟนบอลในโอลด์ แทรฟฟอร์ด ต่างทำใจยอมรับความพ่ายแพ้ไปแล้ว คำขอร้องดังกล่าวมาจากบุคคลที่รู้จัก ไมเคิล คาร์ริค เป็นอย่างดี เคยร่วมงานกับเขา และเข้าใจถึงแรงกดดันของการใช้ชีวิตใน 'ตู้ปลาทอง' อย่างสโมสรแห่งนี้เป็นอย่างดี", "อย่างไรก็ตาม บทสรุปที่หลายคนคาดการณ์ไว้กลับไม่เกิดขึ้น ยูไนเต็ดทำประตูได้สองลูกในช่วงทดเวลาบาดเจ็บจนตีเสมอ 4-4 คาร์ริคฉลองประตูตีเสมอของ แพทริค ดอร์กู ด้วยการชูแขนขึ้นฟ้า หลังจากนั้นเขาเดินรอบสนามซึ่งกลายเป็นการเดินขอบคุณแฟนบอลครั้งสุดท้ายของเขาในฐานะกุนซือ", "ในขณะที่แฟนบอลยูไนเต็ดร้องเพลงเชียร์ชื่อของเขา คาร์ริคได้เข้าไปยืนอยู่ท่ามกลางลูกทีมเพื่อปกป้องไม่ให้แฟนบอลรุมตำหนินักเตะเหมือนที่เคยเกิดขึ้นหลังความพ่ายแพ้ต่อ บอร์นมัธ 3-0 เมื่อสองสัปดาห์ก่อน การตัดสินใจครั้งนี้สะท้อนตัวตนของกุนซือวัย 45 ปีรายนี้ได้เป็นอย่างดี นั่นคือการให้ความสำคัญกับส่วนรวมมากกว่าตัวเอง", "ความปรารถนาอย่างแรงกล้าที่จะทำสิ่งที่ดีที่สุดให้กับสโมสรและนักเตะ รวมถึงอดีตอันรุ่งโรจน์ของเขา อธิบายได้ว่าทำไมเพลงเชียร์ของคาร์ริคยังคงดังกึกก้องจากอัฒจันทร์ ในขณะที่คนอื่นๆ ในยูไนเต็ดต่างตกเป็นเป้าของความโกรธแค้นและเสียงเยาะเย้ย แต่ท้ายที่สุดแล้ว สิ่งเหล่านั้นก็ไม่เพียงพอ", "การที่เขาอยู่มาได้ถึงจุดนี้ถือว่านานกว่าที่หลายคนคาดไว้ ดูเหมือนไม่มีทางที่คาร์ริคจะรอดพ้นจากความล้มเหลวในเกมพบกับบอร์นมัธไปได้ ยูไนเต็ดใช้เวลาถึง 44 ชั่วโมงในการสื่อสารกับโลกภายนอกว่าพวกเขายังคงให้โอกาสเขาคุมทีมต่อ แม้จะเป็นที่เข้าใจกันว่าคาร์ริคได้รับแจ้งเรื่องการตัดสินใจล่วงหน้าตั้งแต่วันก่อนหน้านั้นแล้ว", "นับตั้งแต่นั้นมา สถานการณ์ก็เต็มไปด้วยความโกลาหล ยูไนเต็ดชนะ 1 เสมอ 1 และแพ้ 1 ในช่วงเวลาดังกล่าว พวกเขาโชว์ฟอร์มได้อย่างยอดเยี่ยมใน 45 นาทีแรกที่พบกับเชลซี แต่กลับมาเสียประตูในช่วงต้นครึ่งหลัง ก่อนที่ ลิซานโดร มาร์ติเนซ จะถูกไล่ออกจากการได้รับสองใบเหลืองภายในเวลาเพียง 5 นาที ทำให้ทีมพ่ายไป 2-0", "ในศึกยูฟ่า แชมเปียนส์ลีก ที่พบกับ โรม่า พวกเขาเล่นได้อย่างย่ำแย่และตามหลังสองประตูภายใน 17 นาทีแรก แต่ก็ฮึดสู้กลับมาคว้าชัยชนะ 3-2 ด้วยฟอร์มการเล่นที่น่าตื่นตาตื่นใจ ซึ่งเป็นสิ่งที่คาร์ริคเคยสัมผัสบ่อยครั้งในยุคของ เซอร์ อเล็กซ์ เฟอร์กูสัน จากนั้นจึงเป็นเกมกับวิลลา ที่พวกเขาตามหลังสองประตูภายใน 4 นาทีจากความผิดพลาดของผู้รักษาประตู แต่ก็สามารถตีเสมอได้ก่อนจบครึ่งแรก แม้จะมีการป้องกันที่ย่ำแย่จนต้องเหนื่อยหนัก แต่พวกเขาก็รอดพ้นจากความพ่ายแพ้มาได้ด้วยหนึ่งแต้ม", "หากจะวิเคราะห์เหตุการณ์เหล่านี้ คำถามคือผลงานของคาร์ริคดีขึ้น หรือมันเพียงแค่พิสูจน์ว่าเขาไม่ใช่คนที่ใช่สำหรับงานนี้กันแน่? ยูไนเต็ดตัดสินใจว่าเป็นอย่างหลัง โอมาร์ เบอร์ราดา ประธานเจ้าหน้าที่บริหาร และ เจสัน วิลค็อกซ์ ผู้อำนวยการฟุตบอล ต่างร่วมฉลองประตูตีเสมอของดอร์กูในเกมพบวิลลาจากบนอัฒจันทร์ แต่พวกเขามีมุมมองที่ค่อนข้างแยกส่วนออกไป และภายในไม่กี่วัน พวกเขาก็บินไปโมนาโกเพื่อแจ้งต่อ เซอร์ จิม แรตคลิฟฟ์ เจ้าของร่วมว่าจำเป็นต้องมีการเปลี่ยนแปลง", "เป็นฤดูกาลที่สามติดต่อกันที่ยูไนเต็ดต้องเปลี่ยนตัวผู้จัดการทีมกลางคัน ซึ่งต่างจากกรณีของ เอริก เทน ฮาก และ รูเบน อโมริม การตัดสินใจครั้งนี้ไม่ใช่เรื่องน่าประหลาดใจ ไม่ใช่เพราะสิ่งที่เกิดขึ้นในตอนนี้ แต่เป็นเพราะสิ่งที่เกิดขึ้นในตอนนี้มันขัดแย้งกับสิ่งที่เกิดขึ้นเมื่อฤดูกาลที่แล้วอย่างสิ้นเชิง หลังจากทำผลงานชนะ 12 จาก 17 เกมภายใต้การคุมทีมของคาร์ริคและพาทีมกลับไปเล่นแชมเปียนส์ลีก บรรยากาศในช่วงปรีซีซั่นถือว่าดีเยี่ยมอย่างมาก", "ไม่มีสัญญาณของความแตกแยก นักเตะดาวรุ่งอย่าง เจเจ กาเบรียล เป็นส่วนหนึ่งของทีม และทีมงานระดับสูงต่างพูดถึงศักยภาพของ บรูโน่ แฟร์นันด์ส ที่จะจับคู่กับ ยูริ ตีเลอมันส์ อย่างมีความหวัง แม้การเสริมทัพจะเป็นปัญหาที่ชัดเจนก็ตาม", "เมื่อมองย้อนกลับไป 48 ชั่วโมงก่อนเกมเปิดฤดูกาลที่พบกับ ฮัลล์ ซิตี้ ถือเป็นช่วงเวลาสำคัญ ในขณะที่ เบนจามิน เซสโก้ ยังคงพยายามฟื้นฟูจากอาการบาดเจ็บที่หน้าแข้ง อาหมัด ดิยัลโล่ ก็ได้รับบาดเจ็บที่ข้อเท้าซึ่งทำให้เขาต้องพักยาว 7 สัปดาห์ นั่นหมายความว่าคาร์ริคขาดตัวเลือกในแนวรุกที่เขาต้องการ โดยต้องให้ ไบรอัน เอ็มเบอโม่ ลงเล่นทางฝั่งขวาแทน", "คาร์ริคหันไปใช้ มาเธอุส คุนญ่า ซึ่งมักจะถอยลงต่ำจนไปทับพื้นที่ของกัปตันทีมอย่าง แฟร์นันด์ส ส่งผลให้เกมรุกของยูไนเต็ดไร้ประสิทธิภาพในวันที่พวกเขาดูไม่พร้อมรับมือกับความแข็งแกร่งของคู่แข่งที่กระหายชัยชนะในการกลับมาสู่พรีเมียร์ลีกอีกครั้ง ในบทบาทผู้สัมภาษณ์ของ Viaplay อดีตกองหน้าทีมชาตินอร์เวย์อย่าง แจน อาเก้ ฟยอร์ทอฟต์ อ้างว่ายูไนเต็ดขาดความมุ่งมั่น ซึ่งคาร์ริคปฏิเสธว่าเป็นเรื่อง 'ไร้สาระ' โดยกล่าวกับสื่อว่า 'มันก็แค่เกมเดียว'", "สัปดาห์ต่อมา ยูไนเต็ดแพ้ให้กับ อิปสวิช ซึ่งเป็นทีมที่เพิ่งเลื่อนชั้นขึ้นมา มีเพียงความผิดพลาดของ มาร์เซลิโน่ นูเนซ ในแดนตัวเองที่เปิดโอกาสให้ คุนญ่า จ่ายบอลให้ แฟร์นันด์ส ทำประตูตีเสมอที่ทีมไม่สมควรได้รับ ก่อนที่แฟร์นันด์ส ซึ่งเพิ่งได้รับรางวัลนักเตะยอดเยี่ยมแห่งปีของ PFA ประจำฤดูกาล 2025-26 จะทำแฮตทริกช่วยให้ทีมชนะ 5-2 และนั่นคือชัยชนะนัดสุดท้ายของยูไนเต็ดในพรีเมียร์ลีก", "หลังจากนั้นคือการไปเยือน เอฟเวอร์ตัน ยูไนเต็ดขึ้นนำสองครั้ง ครั้งที่สองคือตอนที่ เซสโก้ ทำประตูได้ในนาทีที่ 88 หลังจากลงมาเป็นตัวสำรอง แต่ในช่วงทดเวลาบาดเจ็บ เอนส์ลีย์ เมตแลนด์-ไนล์ส ยิงไกลเข้าไปทำให้ทีมเยือนพลาดชัยชนะ เมื่อถูกถามว่าเขามั่นใจแค่ไหนในความสามารถของทีมที่จะตอบสนองต่อการเริ่มต้นฤดูกาลที่น่าผิดหวัง คาร์ริคสวนกลับว่า 'มันไม่ได้แย่ขนาดนั้น'", "สิ่งที่เกิดขึ้นหลังจากนั้นกลับแย่ยิ่งกว่า ความพ่ายแพ้ 4-1 ต่อ โคโม่ ของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในผลงานที่เลวร้ายที่สุดในยุโรป ความฟิตของนักเตะยูไนเต็ดถูกตั้งคำถามครั้งแล้วครั้งเล่า พวกเขาเล่นได้อย่างยากลำบากกับ แมนเชสเตอร์ ซิตี้ ที่เหลือผู้เล่น 10 คนตั้งแต่ครึ่งแรก ก่อนที่ซิตี้จะได้ประตูจาก เออร์ลิง ฮาแลนด์ ซึ่ง ฮาวเวิร์ด เว็บบ์ หัวหน้าผู้ตัดสินยอมรับในภายหลังว่าไม่ควรเป็นประตู", "คำบ่นของคาร์ริคหลังจบเกมนั้นมีเหตุผล แต่ก็เป็นการกลบเกลื่อนฟอร์มการเล่นที่ย่ำแย่ของทีม หลังจากขึ้นนำ 2-0 ภายใน 10 นาทีแรกในเกมพบ ไบรท์ตัน ในศึกอีเอฟแอล คัพ ยูไนเต็ดกลับถูกเล่นงานจนพ่ายแพ้จากการเสียสองประตูภายใน 4 นาทีในครึ่งหลัง ทีมงานสต๊าฟฟ์โค้ชของคาร์ริคที่เคยได้รับคำชมเมื่อไม่กี่เดือนก่อน ไม่สามารถหาคำตอบให้กับสถานการณ์นี้ได้", "เฮดโค้ชกล่าวว่าประตูตีเสมอในช่วงทดเวลาบาดเจ็บของคุนญ่าในเกมพบ ฟูแล่ม ซึ่งเป็นทีมบ๊วยของตารางในขณะนั้น เป็นแง่บวกที่สามารถนำไปต่อยอดได้ แต่ทันทีหลังจากช่วงพักเบรกทีมชาติ ยูไนเต็ดก็ทำได้เพียงเสมออีกครั้ง โดยเสียประตูในช่วงทดเวลาบาดเจ็บให้กับ ท็อตแน่ม ฮ็อทสเปอร์ ที่ฟอร์มตกและเหลือผู้เล่น 10 คน", "วงจรขาลงที่คุ้นเคยเริ่มควบคุมไม่ได้ มาร์ติเนซเป็นคนรับผิดชอบต่อประตูตีเสมอของสเปอร์ส ซึ่งทำให้การระเบิดอารมณ์ของเขาหลังความพ่ายแพ้ 2-0 ในแชมเปียนส์ลีกต่อ แอตเลติโก มาดริด ดูน่าประหลาดใจยิ่งกว่าเดิม"], "link": "https://www.bbc.co.uk/sport/football/articles/cm0rl4kwn8vqo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm0rl4kwn8vqo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/e373/live/dbd80f70-de86-11f1-b88b-3f1671ea859d.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/3527/live/49870420-dc22-11f1-a701-fddedf244c16.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/2b84/live/b7bd2450-d124-11f1-9a61-7b8d75492b97.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6236/live/c3d39ea0-d10a-11f1-93e1-3b657b665bcf.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8a69/live/7340d470-d10b-11f1-a701-fddedf244c16.jpg"], "videos": [], "review_score": "", "published_ts": 1794478889, "published_at": "2026-11-12T10:21:29Z", "published_th": "12 พ.ย. 2026 • 17:21 น.", "category_hint": "Football", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794821448181, "guid": "https://www.skysports.com/football/story-telling/11095/13610897/why-have-man-utd-only-had-two-successful-managers", "original_title": "Why have Man Utd only had two 'successful' managers?", "thai_title": "ทำไม แมนเชสเตอร์ ยูไนเต็ด ถึงมีผู้จัดการทีมที่ 'ประสบความสำเร็จ' เพียงแค่สองคน?", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["แมนเชสเตอร์ ยูไนเต็ด คว้าแชมป์ลีกสูงสุด 20 สมัย โดยมาจากฝีมือของผู้จัดการทีมเพียง 3 คนเท่านั้น คือ เออร์เนสต์ แมงนอลล์, เซอร์ แมตต์ บัสบี้ และเซอร์ อเล็กซ์ เฟอร์กูสัน", "เซอร์ แมตต์ บัสบี้ และเซอร์ อเล็กซ์ เฟอร์กูสัน คือสองกุนซือผู้ทรงอิทธิพลที่ไม่ได้เพียงแค่คว้าถ้วยรางวัล แต่ยังสร้างอัตลักษณ์และมาตรฐานให้กับสโมสร", "ความสำเร็จของสโมสรผูกติดอยู่กับตัวบุคคลที่โดดเด่น ทำให้ยูไนเต็ดเผชิญกับความยากลำบากในการสร้างความสำเร็จภายใต้ผู้นำคนใหม่หลังจากยุคของทั้งสองสิ้นสุดลง", "การสร้างทีมของทั้งบัสบี้และเฟอร์กูสันมีรากฐานมาจากความเชื่อมั่นในนักเตะเยาวชนและการเล่นฟุตบอลเชิงรุก ซึ่งกลายเป็นดีเอ็นเอของสโมสรมาจนถึงปัจจุบัน"], "full_paragraphs": ["“ใครนะ!?” “ไม่เคยได้ยินชื่อเขามาก่อนเลย” นิคกี้ บัตต์ กล่าว ขณะที่ พอล สโคลส์ ก็รู้สึกงุนงงไม่แพ้กัน เออร์เนสต์ แมงนอลล์ คือผู้พาทีมคว้าแชมป์ลีกสูงสุดสองสมัยแรกในประวัติศาสตร์สโมสรฤดูกาล 1907-08 และ 1910-11 ก่อนที่ เซอร์ แมตต์ บัสบี้ จะเข้ามาเพิ่มอีก 5 สมัย และ เซอร์ อเล็กซ์ เฟอร์กูสัน อีก 13 สมัย “ให้ตายเถอะ” สโคลส์ ตอบกลับ", "ปฏิกิริยาดังกล่าวเป็นเรื่องที่เข้าใจได้ แม้เวลาจะผ่านไปกว่าศตวรรษ แต่ความสำเร็จของแมงนอลล์กลับเลือนหายไปจากการสนทนาเกี่ยวกับผู้จัดการทีมที่ยิ่งใหญ่ที่สุดของยูไนเต็ด แชมป์สองสมัยของเขาถูกมองข้ามไปเมื่อเทียบกับ 5 สมัยของบัสบี้ และ 13 สมัยของเฟอร์กูสัน แต่ตัวเลขเหล่านี้บอกเล่าเรื่องราวที่แปลกประหลาด ยูไนเต็ดคว้าแชมป์ลีก 20 สมัยภายใต้ผู้จัดการทีมเพียง 3 คน ในขณะที่ลิเวอร์พูลคว้าแชมป์ 20 สมัยเช่นกัน แต่กระจายไปถึง 10 กุนซือ ได้แก่ ทอม วัตสัน, เดวิด แอชเวิร์ธ, แมตต์ แม็คควีน, จอร์จ เคย์, บิล แชงคลีย์, บ็อบ เพสลีย์, โจ เฟแกน, เคนนี่ ดัลกลิช, เจอร์เก้น คล็อปป์ และ อาร์เน่ สล็อต", "บัสบี้และเฟอร์กูสันรวมกันคว้าแชมป์ไปถึง 18 จาก 20 สมัยของยูไนเต็ด อิทธิพลของพวกเขามีมากกว่าแค่ถ้วยรางวัล พวกเขาหล่อหลอมทีม กำหนดมาตรฐาน และช่วยนิยามตัวตนของสโมสร นั่นนำไปสู่คำถามที่มากกว่าแค่การตามหาทายาทของเฟอร์กูสันว่า ยูไนเต็ดคุ้นชินกับการนำของบุคคลพิเศษสองคนนี้มากเกินไปจนยากที่จะจินตนาการถึงความสำเร็จหากไม่มีพวกเขาหรือไม่?", "เมื่อ เซอร์ แมตต์ บัสบี้ มาถึงแมนเชสเตอร์ ยูไนเต็ด ในปี 1945 สโมสรยังห่างไกลจากสถาบันฟุตบอลที่เราเห็นในปัจจุบัน สนามโอลด์ แทรฟฟอร์ด ได้รับความเสียหายอย่างหนักในช่วงสงครามโลกครั้งที่สองจนไม่สามารถใช้งานได้ ยูไนเต็ดต้องไปเล่นเกมเหย้าที่สนามเมน โร้ด โดยใช้สนามร่วมกับแมนเชสเตอร์ ซิตี้ ในขณะที่พยายามฟื้นตัวจากผลกระทบทางการเงินและทางกายภาพจากสงคราม", "บัสบี้เคยเล่นให้กับแมนเชสเตอร์ ซิตี้ และลิเวอร์พูล และเคยได้รับข้อเสนอให้คุมทีมลิเวอร์พูลก่อนจะมารับงานที่ยูไนเต็ด ไม่มีอะไรในภูมิหลังของเขาที่บ่งบอกว่าเขาจะกลายเป็นบุคคลสำคัญที่สุดในประวัติศาสตร์ของสโมสรใดสโมสรหนึ่ง ยิ่งไปกว่านั้นคือการเป็นผู้ที่วางรากฐานให้กับแมนเชสเตอร์ ยูไนเต็ด ยุคใหม่", "เขามาพร้อมกับแนวคิดที่ชัดเจนว่าต้องการสร้างสิ่งที่ยั่งยืน นักเตะเยาวชนต้องการเส้นทางสู่ทีมชุดใหญ่ ยูไนเต็ดต้องเล่นด้วยความทะเยอทะยาน และสโมสรควรแข่งขันกับทีมที่ดีที่สุดในยุโรป ความสัมพันธ์ของเขากับนักเตะเยาวชนมีความสำคัญอย่างยิ่ง ทีม 'บัสบี้ เบ็บส์' (Busby Babes) กลายเป็นมากกว่าแค่ทีมฟุตบอล พวกเขาเป็นตัวแทนของแนวคิดที่ว่า ยูไนเต็ดสามารถผลิตนักเตะของตัวเอง พัฒนาพวกเขา และไว้วางใจให้พวกเขานำพาสโมสรไปข้างหน้า", "โศกนาฏกรรมที่มิวนิกเกือบทำลายทุกอย่าง นักเตะยูไนเต็ด 8 คนเสียชีวิตในเหตุการณ์เครื่องบินตกเมื่อปี 1958 พร้อมกับทีมงานคนอื่นๆ บัสบี้ได้รับบาดเจ็บสาหัส โศกนาฏกรรมนี้อาจยุติความทะเยอทะยานของสโมสร แต่กลับกลายเป็นส่วนหนึ่งของเรื่องราวการฟื้นคืนชีพในเวลาต่อมา เขาเริ่มสร้างทีมใหม่โดยมี จอร์จ เบสต์, เดนิส ลอว์ และ บ็อบบี้ ชาร์ลตัน ช่วยพายูไนเต็ดกลับสู่จุดสูงสุด ในปี 1968 พวกเขาเอาชนะเบนฟิก้า 4-1 ที่เวมบลีย์ คว้าแชมป์ยูโรเปี้ยน คัพ กลายเป็นสโมสรแรกของอังกฤษที่ชูถ้วยนี้ 10 ปีหลังจากโศกนาฏกรรม", "สำหรับ แอรอน เบิร์นส์ อดีตนักเตะเยาวชนของยูไนเต็ด ซึ่งปัจจุบันเป็นผู้นำสมาคมอดีตนักเตะแมนเชสเตอร์ ยูไนเต็ด ความสำคัญของประวัติศาสตร์นั้นยังคงสัมผัสได้ภายในสโมสร “แมนเชสเตอร์ ยูไนเต็ด คือแรงบันดาลใจและความมุ่งมั่น” เขากล่าวกับผม “คุณเดินเข้าไปในอาคาร คุณเห็นตำนาน แต่คุณก็เห็นความเจ็บปวดด้วย คุณเห็นโศกนาฏกรรมมิวนิก ซึ่งถูกจดจำและพูดถึงอยู่ตลอดเวลา”", "เบิร์นส์จำได้ว่าตอนเป็นเด็กที่แคร์ริงตัน เขาพบว่าตัวเองอยู่ท่ามกลางนักเตะที่เขาเคยเห็นแต่ในโทรทัศน์ รอย คีน และ รุด ฟาน นิสเตลรอย อยู่ที่สนามซ้อม เฟอร์กูสันก็อยู่ที่นั่นด้วย “คุณอาจจะเดินสวนกับเซอร์ อเล็กซ์ แล้วเขาก็จะหยุดคุณแล้วถามว่า 'แอรอน คุณยายเป็นยังไงบ้าง?'” การพบกันเหล่านั้นทิ้งความประทับใจไว้ ประวัติศาสตร์ไม่ได้อยู่แค่ในรูปภาพบนผนัง แต่มันมีชีวิตและลมหายใจ ผ่านคำบอกเล่าของผู้คนที่ทำงานที่นั่น ซึ่งหลายคนได้เห็นยุคสมัยที่แตกต่างกันของสโมสร", "เบิร์นส์เห็นความเชื่อมโยงโดยตรงระหว่างยุคสมัยของผู้จัดการทีมผู้ยิ่งใหญ่ทั้งสอง “เฟอร์กูสันสร้างค่านิยมหลักขึ้นมา แต่เขาสร้างมันบนรากฐานของหลักการของเซอร์ แมตต์ บัสบี้” เขากล่าว “คุณต้องสร้างต่อยอดขึ้นไป ไม่ใช่สร้างข้างๆ กัน” เฟอร์กูสันได้รับสโมสรที่มีอัตลักษณ์ชัดเจน แต่เขาไม่ได้ใช้เวลาไปกับการพยายามสร้างทีมแบบบัสบี้ขึ้นมาใหม่ เขาใช้รากฐานนั้นและทำให้มันเป็นของเขาเอง", "อย่างไรก็ตาม การจากไปของบัสบี้ไม่ได้นำไปสู่ความสำเร็จที่ต่อเนื่องในทันที วิลฟ์ แม็คกินเนสส์, แฟรงค์ โอฟาร์เรลล์, ทอมมี่ ดอเชอร์ตี้, เดฟ เซ็กซ์ตัน และ รอน แอตกินสัน ต่างเข้ามาคุมทีมก่อนที่เฟอร์กูสันจะมาถึง พวกเขาคว้าแชมป์ฟุตบอลถ้วยในประเทศได้ 4 รายการ แต่ไม่มีแชมป์ลีก ยูไนเต็ดไม่ได้เป็นแชมป์อีกเลยจนกระทั่งปี 1993", "อเล็กซ์ เฟอร์กูสัน เกิดที่โกแวน กลาสโกว์ ห่างจากสถานที่เกิดของบัสบี้ในออร์บิสตัน เบลล์ชิลล์ ไม่ถึง 20 ไมล์ มีความคล้ายคลึงกันอย่างชัดเจนระหว่างทั้งคู่ ทั้งสองมาจากภูมิหลังชนชั้นแรงงานในสกอตแลนด์ ให้ความสำคัญกับการพัฒนานักเตะเยาวชนและฟุตบอลเกมรุก และมองว่าการจัดการทีมเป็นมากกว่าแค่การเลือกผู้เล่นลงสนามในบ่ายวันเสาร์", "เส้นทางสู่โอลด์ แทรฟฟอร์ด ของเฟอร์กูสันแตกต่างออกไป เมื่อเขามาถึงในเดือนพฤศจิกายน 1986 ความสำเร็จของเขากับอเบอร์ดีนทำให้เขาเป็นหนึ่งในผู้จัดการทีมที่ได้รับการยอมรับมากที่สุดในอังกฤษ การเอาชนะเรอัล มาดริด ในนัดชิงชนะเลิศยูโรเปี้ยน คัพ วินเนอร์ส คัพ ปี 1983 ทำให้เขาเป็นที่รู้จักในเวทีระดับยุโรป เขาไม่ได้เดินเข้าสู่สโมสรที่พร้อมจะครองความยิ่งใหญ่ ยูไนเต็ดไม่ได้แชมป์ลีกตั้งแต่ปี 1967 และยังคงอยู่ภายใต้เงาความสำเร็จของลิเวอร์พูล", "เฟอร์กูสันต้องเปลี่ยนนิสัยของสโมสรก่อนที่จะเปลี่ยนโชคชะตาของทีม ไม่มีการเปลี่ยนแปลงในทันที แชมป์เอฟเอ คัพ มาถึงในปี 1990 ตามด้วยยูโรเปี้ยน คัพ วินเนอร์ส คัพ ในปี 1991 และแชมป์ลีกในที่สุดปี 1993 สิ้นสุดการรอคอย 26 ปี ในตอนนั้นเฟอร์กูสันเริ่มสร้างสิ่งที่ครองฟุตบอลอังกฤษไปอีกสองทศวรรษ", "ทีม 'คลาส ออฟ 92' กลายเป็นสัญลักษณ์ที่ชัดเจนที่สุดของงานนั้น เดวิด เบ็คแฮม, พอล สโคลส์, นิคกี้ บัตต์, แกรี่ เนวิลล์, ฟิล เนวิลล์ และ ไรอัน กิ๊กส์ เป็นตัวแทนของระบบที่มอบเส้นทางให้นักเตะเยาวชนสู่ทีมชุดใหญ่และคาดหวังให้พวกเขารับผิดชอบเมื่อได้รับโอกาส เฟอร์กูสันยังเข้าใจว่าทีมที่ประสบความสำเร็จไม่สามารถหยุดนิ่งได้ เขาปรับเปลี่ยนทีมซ้ำแล้วซ้ำเล่า ปล่อยนักเตะที่อิ่มตัวและนำนักเตะใหม่เข้ามาโดยไม่ให้มาตรฐานตกลงไป ทริปเปิ้ลแชมป์ปี 1999 คือจุดสูงสุดของคนรุ่นหนึ่ง ทีมชุดแชมป์ลีกกลางยุค 2000 และทีมที่คว้าแชมป์แชมเปี้ยนส์ลีกปี 2008 ถูกสร้างขึ้นรอบๆ อีกกลุ่มหนึ่ง", "อัตชีวประวัติของ แกรี่ เนวิลล์ เรื่อง 'Red' ให้ภาพว่าวัฒนธรรมนั้นทำงานอย่างไรจากภายในห้องแต่งตัว เมื่อนึกถึงการคัมแบ็กของยูไนเต็ดที่นิวคาสเซิลในเดือนมีนาคม 1996 เนวิลล์บรรยายว่ายูไนเต็ดชนะนิวคาสเซิล 1-0 โดย เอริก คันโตน่า เป็นผู้ทำประตูชัย “ครึ่งหลังนั้นเป็นช่วงเวลาที่ผมรู้สึกถึงจิตวิญญาณของแมนเชสเตอร์ ยูไนเต็ด ที่ไหลเวียนผ่านทีม” เขาเขียน “มันอาศัยความเป็นเลิศจากปัจเจกบุคคล ทั้งจาก ชไมเคิ่ล และ บรูซ ที่ยอดเยี่ยมมากในเย็นวันนั้น และจาก เอริก ที่โผล่มาทำประตูชัย แต่มันยังมีบางอย่างที่เป็นเรื่องของส่วนรวม มันไม่ได้พูดออกมาแต่ชัดเจนมาก: มาคว้าชัยชนะในนัดนี้กันเถอะ มันเป็นเวลาของเรา”", "คำที่โดดเด่นคือ 'ส่วนรวม' ยูไนเต็ดของเฟอร์กูสันเต็มไปด้วยนักเตะที่โดดเด่น แต่ทุกคนถูกคาดหวังให้มีส่วนร่วมกับเป้าหมายของทีม หนังสือ 'The Second Half' ของ รอย คีน ให้มุมมองอีกด้านของห้องแต่งตัว คีนบรรยายถึงกลุ่มที่นักเตะรุ่นพี่ช่วยเหลือซึ่งกันและกัน โดยเฉพาะเมื่อนักเตะใหม่กำลังดิ้นรนเพื่อปรับตัว เขาจำได้ถึงการสนับสนุนที่มอบให้กับ ดิเอโก้ ฟอร์ลัน ซึ่งย้ายมาจากอินดิเพนเดียนเต้ในปี 2002 และยิงได้เพียง 17 ประตูจากการลงเล่น 98 นัดในช่วงที่อยู่กับยูไนเต็ด “ถ้านักเตะพยายาม ซึ่งดิเอโก้ทำ เราก็จะดึงเขาไปกับเรา เราจะพยายามช่วยเขา” คีนเขียน"], "link": "https://www.skysports.com/football/story-telling/11095/13610897/why-have-man-utd-only-had-two-successful-managers", "canonical_link": "https://www.skysports.com/football/story-telling/11095/13610897/why-have-man-utd-only-had-two-successful-managers", "cover_image_url": "https://e1.365dm.com/26/05/1920x1080/skysports-premier-league-manchester-united_7236055.jpg?20261102093921", "gallery_images": [], "videos": ["https://www.youtube.com/embed/beyDlnZXCCY", "https://www.youtube.com/embed/yKRGzdWlXWM", "https://www.youtube.com/embed/EmN6AGWhcO8"], "review_score": "", "published_ts": 1794470400, "published_at": "2026-11-12T08:00:00Z", "published_th": "12 พ.ย. 2026 • 15:00 น.", "category_hint": "Football"}, {"id": 1794801329656, "guid": "https://www.theverge.com/?p=1033355", "original_title": "Apple’s new study looks to improve the effectiveness of AI health tools", "thai_title": "Apple เปิดตัวโครงการวิจัยใหม่ มุ่งยกระดับประสิทธิภาพเครื่องมือ AI ด้านสุขภาพ", "tag": "Technology", "bullet_points": ["Apple ร่วมมือกับ OpenEvidence เปิดตัว 'Apple Health AI Usage Study' เพื่อศึกษาการใช้งาน AI ในการตอบคำถามด้านสุขภาพ", "ผู้เข้าร่วมโครงการจะได้รับแอปพลิเคชันใหม่เพื่อสอบถามข้อมูลทางการแพทย์และประเมินความแม่นยำของคำตอบ", "โครงการนี้เปิดรับอาสาสมัครในสหรัฐฯ สูงสุด 200,000 คน โดยต้องมีอายุ 21 ปีขึ้นไปและใช้ iPhone 15 Pro ขึ้นไป", "Apple ยืนยันว่าข้อมูลที่รวบรวมได้จะไม่ถูกนำไปใช้ในการฝึกฝนโมเดล AI และให้ความสำคัญกับความเป็นส่วนตัวเป็นอันดับแรก", "เป้าหมายหลักคือการพัฒนาเครื่องมือ AI ให้สามารถส่งมอบข้อมูลสุขภาพที่เข้าใจง่ายและนำไปใช้ประโยชน์ได้จริง"], "full_paragraphs": ["Apple ได้ประกาศเปิดตัวโครงการวิจัยใหม่ในวันนี้ โดยมีเป้าหมายเพื่อทำความเข้าใจให้ลึกซึ้งยิ่งขึ้นว่า ผู้คนมีปฏิสัมพันธ์กับเครื่องมือ AI สนทนาด้านสุขภาพอย่างไร และคำตอบที่ได้รับนั้นมีประโยชน์จริงเพียงใด บริษัทกำลังดำเนินโครงการ 'Apple Health AI Usage Study' ร่วมกับ OpenEvidence ซึ่งเป็นแพลตฟอร์ม AI ทางคลินิกที่บุคลากรทางการแพทย์ใช้งานอยู่ โดยแพลตฟอร์มนี้จะสร้างคำตอบโดยอ้างอิงจากข้อมูลทางการแพทย์จากแหล่งที่น่าเชื่อถือ เช่น วารสาร The New England Journal of Medicine โดยผู้เข้าร่วมโครงการจะต้องใช้แอปพลิเคชัน iOS ตัวใหม่เพื่อสอบถามคำถามทางการแพทย์ และให้คะแนนคำตอบตามเกณฑ์ต่างๆ ได้แก่ ความถูกต้อง ความละเอียด และความเกี่ยวข้องของข้อมูล", "ขณะนี้แอปพลิเคชันดังกล่าวเปิดให้ดาวน์โหลดแล้ว และเริ่มเปิดรับสมัครผู้เข้าร่วมโครงการตั้งแต่วันนี้เป็นต้นไป โดย Apple ตั้งเป้าหมายที่จะรับอาสาสมัครเข้าร่วมโครงการสูงสุดถึง 200,000 คน ผู้เข้าร่วมจะต้องมีอายุ 21 ปีขึ้นไปและพำนักอยู่ในสหรัฐอเมริกา แม้ว่าแอปพลิเคชันนี้จะไม่ได้ใช้เทคโนโลยี Apple Intelligence แต่จำเป็นต้องใช้งานบน iPhone 15 Pro ที่รันระบบปฏิบัติการ iOS 26 หรือใหม่กว่าเท่านั้น", "ผู้เข้าร่วมโครงการสามารถใช้แอปพลิเคชันเพื่อสอบถามคำถามที่เกี่ยวข้องกับสุขภาพและรับคำตอบที่เข้าใจง่าย พร้อมลิงก์อ้างอิงไปยังแหล่งข้อมูลทางคลินิกที่ผ่านการตรวจสอบโดยผู้เชี่ยวชาญ (peer-reviewed) แอปพลิเคชันนี้อาศัยการป้อนคำสั่งผ่านข้อความ (text-based prompts) และแม้ว่าจะสามารถใช้ฟีเจอร์การพิมพ์ด้วยเสียงผ่านคีย์บอร์ดของ iOS ได้ แต่ตัวแอปพลิเคชันเองไม่ได้มีการเชื่อมต่อหรือบูรณาการเข้ากับ Siri หรือ Apple Intelligence แต่อย่างใด", "ในระหว่างขั้นตอนการลงทะเบียน ผู้เข้าร่วมสามารถเลือกที่จะแชร์ข้อมูลจาก Apple HealthKit เช่น ข้อมูลกิจกรรม การนอนหลับ หรือผลตรวจทางห้องปฏิบัติการ เพื่อให้คำตอบที่ได้รับมีบริบทที่เกี่ยวข้องกับสุขภาพส่วนบุคคลมากขึ้น อย่างไรก็ตาม Apple ให้ความสำคัญกับความเป็นส่วนตัวเป็นอันดับแรก โดยระบุว่าได้ดำเนินมาตรการต่างๆ เพื่อให้มั่นใจว่าข้อมูลของผู้ใช้จะถูกเก็บเป็นความลับ และข้อมูลที่รวบรวมได้จะไม่ถูกนำไปใช้ในการฝึกฝนโมเดล AI โดยเป้าหมายสูงสุดคือการปรับปรุงการออกแบบและฟังก์ชันการทำงานของเครื่องมือ AI ด้านสุขภาพ เพื่อให้สามารถส่งมอบข้อมูลสุขภาพที่เกี่ยวข้องและช่วยให้ผู้ใช้เข้าใจและนำไปปฏิบัติตามได้ง่ายขึ้น", "Sumbul Desai แพทย์และรองประธานฝ่ายสุขภาพและการออกกำลังกายของ Apple กล่าวว่า 'ที่ Apple เราเชื่อว่านวัตกรรมที่รับผิดชอบต้องเริ่มต้นจากความเข้มงวดทางวิทยาศาสตร์และพื้นฐานทางคลินิก สุขภาพเป็นเรื่องส่วนตัวอย่างลึกซึ้ง และการดำเนินการวิจัยเฉพาะทางเป็นวิธีที่รอบคอบที่สุดในการทำความเข้าใจว่าผู้คนมีส่วนร่วม รับรู้ และประเมิน AI ด้านสุขภาพในชีวิตประจำวันอย่างไร ข้อมูลเชิงลึกจากการศึกษานี้จะช่วยส่งเสริมการสนทนาทางวิทยาศาสตร์ในวงกว้าง และรับประกันว่าในขณะที่เทคโนโลยีก้าวหน้าไป เราจะยังคงสร้างเครื่องมือที่เชื่อถือได้ซึ่งสนับสนุนผู้คนได้อย่างแท้จริง ไม่ว่าพวกเขาจะอยู่ในขั้นตอนใดของการเดินทางด้านสุขภาพก็ตาม'"], "link": "https://www.theverge.com/tech/1033355/apples-new-study-looks-to-improve-the-effectiveness-of-ai-health-tools", "canonical_link": "https://www.theverge.com/tech/1033355/apples-new-study-looks-to-improve-the-effectiveness-of-ai-health-tools", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/applestudy1b.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/01/ANDREW_LISZEWSKI_BLURPLE.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/applestudy2.jpg?quality= //www.theverge.com/entertainment/1034013/armand-hammers-snakes-ladders-review", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/a0664469113_10.jpg?quality=90&amp;strip=all&amp;crop=0,23.821989528796,100,52.356020942408&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/02/TERRENCE_BLURPLE.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "16 พ.ย. 2026 • 04:49 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/entertainment/1034013/armand-hammers-snakes-ladders-review", "guid": "https://www.theverge.com/?p=1034013", "published_ts": 1794779362, "published_at": "2026-11-15T21:49:22Z", "videos": [], "review_score": "", "sub_tag": "ENTERTAINMENT"}, {"id": 1794789938070, "original_title": "Vulcan rocket fails, destroying 40 Amazon Leo satellites", "thai_title": "จรวดวัลแคนของ ULA ประสบความล้มเหลว ส่งดาวเทียม Amazon Leo 40 ดวงสู่วงโคจรไม่สำเร็จ", "tag": "Technology", "bullet_points": ["United Launch Alliance (ULA) ประสบความล้มเหลวในภารกิจการปล่อยจรวดเป็นครั้งแรกในรอบ 20 ปี", "จรวดวัลแคน (Vulcan) ไม่สามารถนำดาวเทียม Leo ของ Amazon จำนวน 40 ดวงขึ้นสู่วงโคจรได้ตามเป้าหมาย", "โครงการ Leo เป็นคู่แข่งสำคัญของ Starlink จาก SpaceX แต่ปัจจุบันยังคงประสบปัญหาในการส่งดาวเทียมขึ้นสู่วงโคจรให้ได้ตามจำนวนที่วางแผนไว้", "ULA ระบุว่าเกิด 'ความผิดปกติ' (Anomaly) ขึ้นในช่วงนาทีที่ 10 ของการบิน และกำลังอยู่ในระหว่างการสอบสวนหาสาเหตุที่แน่ชัด", "Amazon ยังคงแสดงความเชื่อมั่นในตัว ULA โดยระบุว่าเป็นพันธมิตรที่เชื่อถือได้และพร้อมสนับสนุนภารกิจในอนาคตต่อไป"], "full_paragraphs": ["บริษัท United Launch Alliance หรือ ULA ได้ออกมาเปิดเผยว่า เกิดเหตุ 'ความผิดปกติ' ขึ้นกับจรวดวัลแคน (Vulcan) ของบริษัท ส่งผลให้ภารกิจการนำส่งดาวเทียมขึ้นสู่วงโคจรประสบความล้มเหลว", "เหตุการณ์ครั้งนี้ถือเป็นความล้มเหลวในภารกิจการปล่อยจรวดครั้งแรกในประวัติศาสตร์ตลอด 20 ปีของ ULA โดยจรวดไม่สามารถนำส่งดาวเทียม Leo ของ Amazon จำนวน 40 ดวงขึ้นสู่วงโคจรได้สำเร็จ", "สำหรับโครงการ Leo นั้น ถือเป็นโครงการดาวเทียมของ Amazon ที่ถูกวางตัวให้เป็นคู่แข่งโดยตรงกับเครือข่าย Starlink ของ SpaceX อย่างไรก็ตาม โครงการนี้ยังคงเผชิญกับความยากลำบากในการเริ่มต้นดำเนินงาน โดยปัจจุบันสามารถส่งดาวเทียมขึ้นสู่วงโคจรได้เพียงจำนวนน้อยนิดเท่านั้นเมื่อเทียบกับจำนวนที่จำเป็นต้องใช้ในการแข่งขันกับ Starlink", "การปล่อยจรวดในครั้งนี้ถือเป็นเที่ยวบินแรกจากทั้งหมด 38 เที่ยวบินที่ทาง Amazon ได้ทำสัญญาว่าจ้างกับ ULA เอาไว้", "ในแถลงการณ์ที่เผยแพร่ผ่านแพลตฟอร์ม X ทาง ULA ระบุว่า 'จากข้อมูลที่ได้รับโดยผู้อำนวยการฝ่ายปล่อยจรวดของเรา เราขอยืนยันว่ายานพาหนะวัลแคนซึ่งถูกปล่อยจากฐานปล่อย Space Launch Complex 41 ได้ประสบกับความผิดปกติในช่วงนาทีที่ 10 ของการบิน และไม่สามารถนำส่งภารกิจของ Amazon ขึ้นสู่วงโคจรได้สำเร็จ'", "ทางบริษัทระบุว่า ในขณะนี้ยังไม่สามารถสรุปได้แน่ชัดว่าอะไรคือสาเหตุที่ทำให้เกิดความล้มเหลวในครั้งนี้ แต่ได้ให้คำมั่นว่าจะดำเนินการสอบสวนด้วยความโปร่งใสและจะรายงานความคืบหน้าให้ทราบต่อไป", "แม้จะเกิดความล้มเหลวขึ้น แต่ทาง Amazon ยังคงแสดงความเชื่อมั่นในตัวพันธมิตรด้านการปล่อยจรวดของตน โดยได้โพสต์ข้อความผ่าน X ว่า 'มีความเสี่ยงเกิดขึ้นได้เสมอในการปล่อยจรวดทุกครั้ง และนั่นเป็นเรื่องจริงโดยเฉพาะอย่างยิ่งสำหรับภารกิจเริ่มต้นอย่าง LV-01'", "นอกจากนี้ Amazon ยังระบุทิ้งท้ายในแถลงการณ์ว่า 'ULA เป็นพันธมิตรที่ได้รับความไว้วางใจจาก Amazon มาโดยตลอด และเราเชื่อมั่นว่าพวกเขาจะเรียนรู้จากภารกิจในครั้งนี้ เพื่อนำไปสู่ความสำเร็จตามแผนระยะยาวที่วางไว้สำหรับจรวดวัลแคนต่อไป'"], "link": "https://www.theverge.com/science/1034006/vulcan-rocket-fails-destroying-40-amazon-leo-satellites", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2304790934.jpg?quality=90&amp;strip=all&amp;crop=0%2C12.589380284132%2C100%2C74.821239431736&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/02/TERRENCE_BLURPLE.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "16 พ.ย. 2026 • 04:05 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/science/1034006/vulcan-rocket-fails-destroying-40-amazon-leo-satellites", "guid": "https://www.theverge.com/?p=1034006", "published_ts": 1794776702, "published_at": "2026-11-15T21:05:02Z", "videos": [], "review_score": "", "sub_tag": "SCIENCE"}, {"id": 1794789938071, "original_title": "Jensen Huang might be plotting a return and more of the latest Nvidia drama", "thai_title": "เจนเซน หวง อาจวางแผนหวนคืนตำแหน่งและประเด็นดราม่าล่าสุดของ Nvidia", "tag": "Technology", "bullet_points": ["บริษัท Megaspeed ออกมาปฏิเสธความเกี่ยวข้องกับ อลิซ หวง โดยระบุว่าเธอไม่ได้ทำงานที่นั่นมาตั้งแต่เดือนสิงหาคม 2025", "รายงานระบุถึงความเคลื่อนไหวที่น่าจับตามองเกี่ยวกับ เจนเซน หวง ซีอีโอของ Nvidia", "สถานการณ์ภายใน Nvidia กำลังเป็นที่จับตามองจากกระแสข่าวลือและดราม่าที่เกิดขึ้นในช่วงที่ผ่านมา", "ข้อมูลดังกล่าวถูกนำเสนอผ่านช่องทางติดตามข่าวสารรายวันเพื่ออัปเดตสถานการณ์สำคัญในแวดวงเทคโนโลยี", "ประเด็นเรื่องการเปลี่ยนแปลงภายในองค์กรและสถานะของบุคคลสำคัญยังคงเป็นหัวข้อที่ได้รับความสนใจอย่างต่อเนื่อง"], "full_paragraphs": ["บริษัท Megaspeed ได้ออกมาแถลงการณ์อย่างเป็นทางการเพื่อชี้แจงสถานะของ อลิซ หวง โดยยืนยันว่าเธอไม่ได้ปฏิบัติงานหรือมีความเกี่ยวข้องกับบริษัทมาตั้งแต่เดือนสิงหาคม ปี 2025 เป็นต้นมา", "การออกมาปฏิเสธของ Megaspeed ในครั้งนี้ถือเป็นส่วนหนึ่งของความพยายามในการจัดการกับกระแสข่าวลือที่แพร่สะพัดเกี่ยวกับความเชื่อมโยงระหว่างบุคคลและองค์กรในช่วงเวลาที่ผ่านมา", "ในขณะเดียวกัน มีรายงานที่น่าสนใจเกี่ยวกับ เจนเซน หวง ซีอีโอคนปัจจุบันของ Nvidia ซึ่งกำลังเป็นที่จับตามองว่าเขากำลังวางแผนการเคลื่อนไหวครั้งสำคัญบางอย่างภายในบริษัท", "กระแสข่าวลือดังกล่าวได้สร้างแรงสั่นสะเทือนและกลายเป็นประเด็นดราม่าล่าสุดที่ถูกพูดถึงอย่างกว้างขวางในแวดวงอุตสาหกรรมเทคโนโลยีและนักลงทุน", "ข้อมูลที่ปรากฏออกมานี้เป็นส่วนหนึ่งของการติดตามสถานการณ์ความเคลื่อนไหวของบริษัท Nvidia ซึ่งถือเป็นผู้เล่นหลักในตลาดชิปประมวลผลระดับโลก", "นอกจากประเด็นเรื่องการบริหารงานแล้ว ยังมีการตั้งข้อสังเกตถึงทิศทางในอนาคตของ Nvidia ภายใต้การนำของ เจนเซน หวง ว่าจะมีการเปลี่ยนแปลงเชิงกลยุทธ์อย่างไรหลังจากเกิดเหตุการณ์ความไม่แน่นอนต่างๆ", "รายงานข่าวนี้ถูกจัดทำขึ้นเพื่อเป็นสรุปประเด็นสำคัญรายวันสำหรับผู้ที่ต้องการติดตามข่าวสารที่ส่งผลกระทบต่ออุตสาหกรรมเทคโนโลยีอย่างใกล้ชิด", "ทั้งนี้ ประเด็นดราม่าที่เกิดขึ้นกับ Nvidia ยังคงต้องติดตามต่อไปว่าจะมีแถลงการณ์เพิ่มเติมจากทางบริษัทหรือบุคคลที่เกี่ยวข้องเพื่อสร้างความชัดเจนให้กับสาธารณชนและผู้ถือหุ้นในอนาคตอันใกล้นี้"], "link": "https://www.theverge.com/tech/1033999/jensen-huang-return-nvidia-megaspeed", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Nvidia_Jensen_huang_03.jpg?quality=90&amp;strip=all&amp;crop=0%2C12.339110464558%2C100%2C75.321779070884&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/02/TERRENCE_BLURPLE.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "16 พ.ย. 2026 • 03:43 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/tech/1033999/jensen-huang-return-nvidia-megaspeed", "guid": "https://www.theverge.com/?p=1033999", "published_ts": 1794775429, "published_at": "2026-11-15T20:43:49Z", "videos": [], "review_score": "", "sub_tag": "TECH"}, {"id": 1794789938072, "original_title": "Congress wants to tighten export rules on AI chips after Nvidia spy scandal", "thai_title": "รัฐสภาสหรัฐฯ เตรียมคุมเข้มการส่งออกชิป AI หลังเกิดกรณีอื้อฉาวสายลับจีนพัวพัน Nvidia", "tag": "Technology", "bullet_points": ["รัฐสภาสหรัฐฯ เดินหน้าผลักดันมาตรการจำกัดการส่งออกชิป AI ให้เข้มงวดขึ้น หลังเกิดกรณีอื้อฉาวเกี่ยวกับความสัมพันธ์ระหว่าง เจนเซน หวง ซีอีโอ Nvidia และผู้ต้องสงสัยว่าเป็นสายลับจีน", "สมาชิกสภานิติบัญญัติจากทั้งพรรคเดโมแครตและรีพับลิกันต่างแสดงจุดยืนสนับสนุนการออกกฎหมายใหม่เพื่อควบคุมการเข้าถึงเทคโนโลยีชิปขั้นสูงของจีน", "ชัค ชูเมอร์ ผู้นำเสียงข้างน้อยในวุฒิสภา เรียกร้องให้ เจนเซน หวง และฝ่ายบริหารของทรัมป์เข้าชี้แจงต่อรัฐสภาเกี่ยวกับประเด็นดังกล่าว", "ทิม สกอตต์ ประธานคณะกรรมาธิการการธนาคารวุฒิสภา ได้ส่งหนังสือเรียกตัว เจนเซน หวง และ ฮาวเวิร์ด ลัตนิค รัฐมนตรีว่าการกระทรวงพาณิชย์ ให้เข้าให้การต่อคณะกรรมาธิการอย่างเปิดเผย", "ไมค์ จอห์นสัน ั้งหมดของฉันอยู่ในนั้น! ความสัมพันธ์ของฉันกับแอป Notes เปลี่ยนไปตามสิ่งที่เกิดขึ้นในชีวิต บางครั้งฉันใช้แค่จดรายการซื้อของ แต่ก็มีช่วงเวลาที่ฉันใช้มันเก็บรายการสิ่งที่ต้องทำประจำสัปดาห์ ซึ่งมันเป็นสิ่งเดียวที่กั้นระหว่างฉันกับความหายนะ ฉันเริ่มร่างบล็อกในแอป Notes และใช้มันเขียนข้อความที่ค่อนข้างละเอียดอ่อน มีทั้งสูตรอาหารที่ฉันพัฒนาขึ้น รหัสผ่าน และคำถามสำหรับหมอของฉัน โน้ตแรกในโทรศัพท์ของฉันมาจากปี 2018 ดังนั้นมันจึงทำหน้าที่เป็นบันทึกประจำวันเกือบสิบปี แม้ว่าจะมีโน้ตบางอันที่ฉันอ่านไม่รู้เรื่อง เช่น ทำไมฉันถึงมีโน้ตจากเดือนกรกฎาคม 2020 ที่เขียนแค่ว่า 'ชั้น 4' ก็ตาม'", "สำหรับแอปที่ถูกมองข้าม แฮมป์ตันยอมรับว่าเธอเกลียดการส่งข้อความมาก แต่ในฐานะคนที่ปฏิเสธการลบข้อความทิ้ง เธอจึงต้องยอมรับว่าคลังข้อมูลส่วนตัวที่สำคัญที่สุดของเธอน่าจะอยู่ในกล่องข้อความ (Messages) ของเธอนั่นเอง ส่วนแอปแรกที่เธอติดตั้งบนอุปกรณ์ใหม่คือ Spotify และเกมมือถือที่เธอติดงอมแงมในช่วงสองปีที่ผ่านมาอย่าง Township ซึ่งเธอเปรียบเทียบว่าคล้ายกับเกม Sims หรือ Animal Crossing", "ในด้านการจัดการข้อมูลดิจิทัล แฮมป์ตันเผยว่าเธอรักษามาตรฐาน 'Inbox Zero' ไว้เสมอ โดยจะปิดแท็บทั้งหมดทันทีที่ทำงานเสร็จ ปัจจุบันเธอใช้ Reddit และ YouTube เป็นหลักเพราะรู้สึกว่าสามารถควบคุมสิ่งที่เห็นได้มากกว่าแพลตฟอร์มอื่น โดยเธอกล่าวว่า 'การจัดพอดแคสต์เกี่ยวกับอินเทอร์เน็ตสัปดาห์ละสองครั้งเป็นเวลาสามปี ทำให้ฉันมีอาการ PTSD หรือไม่ก็รักษาฉันจากการเสพติดโซเชียลมีเดีย ขึ้นอยู่กับว่าคุณมองอย่างไร ฉันไม่สามารถใช้เวลาเกิน 20 นาทีบน IG, X หรือ Bluesky ได้โดยไม่รู้สึกอึดอัด'", "เมื่อพูดถึงเทรนด์เทคโนโลยีที่เธออยากให้หายไป แฮมป์ตันแสดงจุดยืนที่แข็งกร้าวต่อ Generative AI โดยระบุว่า 'หนึ่งในจุดยืนที่ฉันภูมิใจที่สุดคือฉันไม่เคย (ตั้งใจ) ใช้ ChatGPT หรือ Midjourney หรือเครื่องมือ AI อื่นๆ เลย มันเริ่มยากขึ้นเรื่อยๆ ที่จะหลีกเลี่ยงในตอนนี้ที่ Gemini ถูกรวมเข้ากับ Google และผลิตภัณฑ์ต่างๆ หยุดพยายามเขียนอีเมลให้ฉันนะ Gemini!! ฉันไม่เคยเปลี่ยนความเชื่อที่ว่าบริษัท AI ทุกแห่งติดหนี้มหาศาลต่อเหล่านักเขียนและศิลปินที่ผลงานของพวกเขาถูกนำมาสร้างผลิตภัณฑ์เหล่านี้ จนกว่าหนี้นั้นจะได้รับการชำระ ไม่มีอะไรที่ดึงดูดใจฉันเกี่ยวกับการคุยกับแชทบอทหรือการสร
