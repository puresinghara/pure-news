, "bullet_points": ["Mikie Sherrill ผู้ว่าการรัฐนิวเจอร์ซีย์ ชี้ว่าชัยชนะของพรรคเดโมแครตในการเลือกตั้งกลางเทอมมาจากนโยบายที่เน้นเรื่องค่าครองชีพและความรับผิดชอบ", "การเมืองยุคใหม่เปลี่ยนผ่านสู่ 'Influencer Politics' ที่เน้นการสื่อสารผ่านวิดีโอสั้นอย่างจริงใจ มากกว่าการใช้ถ้อยคำรุนแรงแบบเดิม", "Sherrill มองว่าการที่นักการเมืองรีพับลิกันยึดติดกับแพลตฟอร์ม X ทำให้พวกเขาหลงอยู่ในฟองสบู่ข้อมูลที่บิดเบือนและขาดการเชื่อมต่อกับประชาชนในวงกว้าง", "การเข้าซื้อกิจการ X ของ Elon Musk ถูกมองว่าล้มเหลวทั้งในเชิงธุรกิจและอิทธิพลทางการเมือง เนื่องจากแพลตฟอร์มสูญเสียความสามารถในการกำหนดวาระทางสังคมไปแล้ว"], "full_paragraphs": ["ในบทสัมภาษณ์พิเศษกับ Nilay Patel บรรณาธิการบริหารของ The Verge ผู้ว่าการรัฐนิวเจอร์ซีย์ Mikie Sherrill ได้สะท้อนมุมมองต่อสถานการณ์การเมืองสหรัฐฯ หลังการเลือกตั้งกลางเทอม โดยเธอย้ำว่าชัยชนะของพรรคเดโมแครตในครั้งนี้เป็นผลมาจากกลยุทธ์การหาเสียงที่เน้นเรื่อง 'ค่าครองชีพ' (affordability) และ 'ความรับผิดชอบ' (accountability) ซึ่งเป็นสิ่งที่ประชาชนให้ความสำคัญสูงสุดในยุคที่เทคโนโลยีและมหาเศรษฐีมีอิทธิพลต่อสื่อและนโยบายรัฐมากขึ้น", "Sherrill กล่าวถึงความกังวลเรื่องคอร์รัปชันที่กลายเป็นประเด็นหลักในการเลือกตั้ง โดยเธอมองว่าประชาชนเริ่มตระหนักถึงความเชื่อมโยงระหว่างมหาเศรษฐีสายเทคโนโลยีที่ใกล้ชิดกับทำเนียบขาว กับผลประโยชน์ทับซ้อนที่ส่งผลกระทบโดยตรงต่อกระเป๋าเงินของประชาชน เธอวิจารณ์ว่านักการเมืองบางกลุ่มเลือกที่จะเปลี่ยนจุดยืนไปมาเพื่อผลประโยชน์ทางธุรกิจ ซึ่งสร้างความไม่พอใจให้กับผู้มีสิทธิเลือกตั้งที่ต้องเผชิญกับภาวะเศรษฐกิจที่ยากลำบาก", "ในประเด็นเรื่องอิทธิพลของแพลตฟอร์มโซเชียลมีเดีย Sherrill ยอมรับว่าเธอเคยมีความกังวลเกี่ยวกับข้อมูลบิดเบือน (misinformation) และอัลกอริทึมที่ผลักดันให้ผู้คนเข้าสู่แนวคิดสุดโต่ง แต่ในทางกลับกัน เธอกลับมองว่าในยุคปัจจุบัน 'ความลับไม่มีในโลก' การที่นักการเมืองพยายามปกปิดปัญหาหรือซุกปัญหาไว้ใต้พรมนั้นทำได้ยากขึ้น ซึ่งถือเป็นผลดีต่อระบอบประชาธิปไตยที่ต้องการความโปร่งใสและการแสดงความรับผิดชอบต่อประชาชนอย่างตรงไปตรงมา", "เมื่อพูดถึงการเมืองยุค Influencer ที่เน้นการสื่อสารผ่านวิดีโอสั้น Sherrill ชี้ว่านักการเมืองรุ่นใหม่ที่ประสบความสำเร็จอย่าง Zohran Mamdani มีความสามารถในการใช้โซเชียลมีเดียอย่างเป็นธรรมชาติและเข้าถึงอารมณ์ความรู้สึกของผู้คน เธอเปรียบเทียบว่าในขณะที่นักการเมืองบางกลุ่มพยายามเลียนแบบพฤติกรรมก้าวร้าวหรือใช้ถ้อยคำรุนแรงเพื่อเรียกยอด Engagement แต่ความสำเร็จที่แท้จริงกลับอยู่ที่ 'ความจริงใจ' (authenticity) และการเชื่อมโยงนโยบายเข้ากับผลลัพธ์ที่จับต้องได้", "ในช่วงท้ายของการสนทนา Nilay Patel ได้ตั้งข้อสังเกตว่าการเข้าซื้อกิจการ Twitter (ปัจจุบันคือ X) ของ Elon Musk ถือเป็นความล้มเหลวในทุกมิติ ทั้งในแง่จำนวนผู้ใช้งาน รายได้ และอิทธิพลทางการเมือง ซึ่ง Sherrill ดูจะเห็นด้วยในเชิงนัยยะว่าแพลตฟอร์มดังกล่าวได้กลายเป็น 'ฟองสบู่' ที่แยกตัวออกจากความเป็นจริงของสังคมวงกว้าง ทำให้พรรครีพับลิกันที่ยึดติดกับแพลตฟอร์มนี้เกิดความสับสนและสูญเสียความสามารถในการสื่อสารกับประชาชนส่วนใหญ่ของประเทศไปอย่างน่าเสียดาย"], "link": "https://www.theverge.com/podcast/1034141/nj-midterm-sherill-democrats-musk-x-ai", "canonical_link": "https://www.theverge.com/podcast/1034141/nj-midterm-sherill-democrats-musk-x-ai", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DCD_20261116_Sherrill.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/24792604/The_Verge_Decoder_Tileart.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794844800, "published_at": "2026-11-16T16:00:00Z", "published_th": "16 พ.ย. 2026 • 23:00 น.", "category_hint": "Technology"}, {"id": 1794843043287, "guid": "https://www.theverge.com/?p=1034192", "original_title": "Robert Pattinson is Amazon’s first James Bond", "thai_title": "Amazon เปิดตัว Robert Pattinson รับบท James Bond คนใหม่ ประเดิมโปรเจกต์แรกหลังเข้าซื้อ MGM", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Robert Pattinson ได้รับเลือกให้รับบท James Bond คนใหม่ในภาพยนตร์เรื่องแรกของแฟรนไชส์ภายใต้การดูแลของ Amazon MGM", "ภาพยนตร์เรื่องนี้จะได้ Denis Villeneuve มารับหน้าที่ผู้กำกับ โดยมี Steven Knight เป็นผู้เขียนบท", "Amazon ได้รับสิทธิ์ในการควบคุมทิศทางสร้างสรรค์ของแฟรนไชส์สายลับ 007 อย่างเต็มตัวในปี 2025 หลังจากการเข้าซื้อกิจการ MGM Studios ในปี 2021", "Pattinson เผยความรู้สึกว่าเป็นเกียรติสูงสุดในชีวิตที่ได้รับบทบาทระดับตำนานนี้ และตื่นเต้นที่จะได้ร่วมงานกับทีมงานคุณภาพ"], "full_paragraphs": ["Robert Pattinson เตรียมก้าวเข้าสู่บทบาท James Bond ในภาพยนตร์เรื่องแรกของแฟรนไชส์ 007 ภายใต้การผลิตของ Amazon MGM โดยโปรเจกต์ถัดไปของสายลับระดับตำนานนี้จะอยู่ภายใต้การกำกับของ Denis Villeneuve พร้อมด้วยบทภาพยนตร์จากฝีมือของ Steven Knight ในขณะที่ Amy Pascal และ David Heyman จะรับหน้าที่เป็นโปรดิวเซอร์", "ภาพยนตร์ James Bond เรื่องที่จะถึงนี้ถือเป็นผลงานชิ้นแรกนับตั้งแต่ Amazon ได้เข้าถือครองสิทธิ์ในแฟรนไชส์ดังกล่าวผ่านการเข้าซื้อกิจการ MGM Studios ในปี 2021 โดย Amazon ได้รับสิทธิ์ในการควบคุมทิศทางสร้างสรรค์ (Creative control) ของซีรีส์สายลับเรื่องนี้อย่างเป็นทางการในปี 2025 ที่ผ่านมา", "สำหรับ Pattinson นั้น เพิ่งจะมีผลงานการแสดงในบทบาท Chris Hansen พิธีกรรายการ To Catch a Predator ในภาพยนตร์ระทึกขวัญเชิงจิตวิทยาเรื่อง Primetime และกำลังจะมีผลงานในภาพยนตร์เรื่อง Dune: Part Three ของผู้กำกับ Villeneuve ที่จะเข้าฉายในช่วงปลายปีนี้ นอกจากนี้เขายังเคยรับบทเป็น Antinous ในเรื่อง The Odyssey อีกด้วย", "“James Bond เป็นหนึ่งในตัวละครที่เป็นตำนานที่สุดในโลกภาพยนตร์ และการได้รับความไว้วางใจให้รับบท 007 ถือเป็นเกียรติสูงสุดในชีวิตของผม” Pattinson กล่าวในเอกสารข่าวประชาสัมพันธ์ “การจะบอกว่าบทบาทนี้คือความฝันที่เป็นจริงคงยังน้อยเกินไป ผมตื่นเต้นอย่างที่สุดกับความร่วมมือครั้งนี้และงานที่รออยู่ข้างหน้ากับทีมงานที่ยอดเยี่ยมกลุ่มนี้”"], "link": "https://www.theverge.com/tech/1034192/robert-pattinson-james-bond", "canonical_link": "https://www.theverge.com/tech/1034192/robert-pattinson-james-bond", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/bond.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794842374, "published_at": "2026-11-16T15:19:34Z", "published_th": "16 พ.ย. 2026 • 22:19 น.", "category_hint": "Technology"}, {"id": 1794841242533, "guid": "https://www.theverge.com/?p=1034168", "original_title": "Apple TV is getting video podcasts you can watch for free", "thai_title": "Apple TV เตรียมเปิดตัวหมวดวิดีโอพอดแคสต์ รับชมฟรีได้โดยไม่ต้องสมัครสมาชิก", "tag": "Technology", "sub_tag": "ENTERTAINMENT", "bullet_points": ["Apple เตรียมเพิ่มหมวดวิดีโอพอดแคสต์ลงใน Apple TV โดยผู้ใช้งานสามารถรับชมได้ฟรีโดยไม่ต้องติดเงื่อนไขการสมัครสมาชิก", "ฟีเจอร์นี้จะเริ่มทดสอบในกลุ่มนักพัฒนาผ่านการอัปเดต iOS 27.3 เวอร์ชันเบต้าในเร็วๆ นี้", "การขยายบริการครั้งนี้ถือเป็นการเดินตามรอยคู่แข่งอย่าง Netflix, Hulu, Disney Plus และ Spotify ที่รุกตลาดวิดีโอพอดแคสต์บนหน้าจอทีวีมาอย่างต่อเนื่อง", "Apple มีแผนเพิ่มเนื้อหาวิดีโอพอดแคสต์ลงในแอปพลิเคชัน Podcasts หลัก เพื่อสร้างประสบการณ์การรับชมที่ไร้รอยต่อระหว่างรูปแบบเสียงและวิดีโอ"], "full_paragraphs": ["รายงานจาก New York Times ระบุว่า Apple กำลังเตรียมเปิดตัวหมวดวิดีโอพอดแคสต์ใหม่บนบริการสตรีมมิ่ง Apple TV โดยฟีเจอร์นี้จะไม่มีการจำกัดสิทธิ์ไว้หลังกำแพงการสมัครสมาชิก (Paywall) ซึ่งหมายความว่าผู้ใช้งานทั่วไปจะสามารถเข้าถึงเนื้อหาได้ฟรี", "การทดสอบฟีเจอร์ดังกล่าวจะเริ่มต้นขึ้นในกลุ่มนักพัฒนาผ่านการอัปเดตซอฟต์แวร์เวอร์ชันเบต้า โดยคาดว่าผู้ใช้งานที่ลงทะเบียนทดสอบ iOS 27.3 จะได้รับอัปเดตในอีกไม่กี่ชั่วโมงข้างหน้า และเมื่อเปิดตัวอย่างเป็นทางการ หมวดวิดีโอพอดแคสต์นี้จะพร้อมใช้งานสำหรับทุกคนที่ใช้ Apple TV หรือแอปพลิเคชันบนแพลตฟอร์มที่รองรับทั้งหมด", "ความเคลื่อนไหวครั้งนี้ถือเป็นการขยายตัวตามเทรนด์ของบริการสตรีมมิ่งเจ้าอื่นๆ ที่หันมาให้ความสำคัญกับพอดแคสต์มากขึ้น โดย Netflix ได้ประกาศเพิ่มวิดีโอพอดแคสต์ลงในแพลตฟอร์มเมื่อปีที่แล้วและเปิดตัวซีรีส์วิดีโอพอดแคสต์ออริจินัลชุดแรกไปเมื่อเดือนมกราคมที่ผ่านมา ในขณะที่ Hulu และ Disney Plus ก็มีบริการพอดแคสต์เช่นกัน ทั้งในรูปแบบเนื้อหาเสริมสำหรับรายการของตนเองและพอดแคสต์ที่มีลิขสิทธิ์ เช่น รายการ 'We’re Here to Help' ที่ดำเนินรายการโดย Jake Johnson และ Gareth Reynolds", "ในส่วนของคู่แข่งรายอื่น Spotify ได้รองรับวิดีโอพอดแคสต์มาเป็นเวลาหลายปีแล้ว และเมื่อปีที่ผ่านมาก็ได้ข graphs": ["เหตุการณ์ความวุ่นวายในวันศุกร์ที่ 13 พฤศจิกายน ซึ่งทำให้ผู้โดยสารกว่า 1.5 ล้านคนต้องติดค้างอยู่ตามสนามบินทั่วสหรัฐฯ มีจุดเริ่มต้นมาจากปัญหาทางเทคนิคที่ดูเหมือนเล็กน้อยแต่กลับส่งผลกระทบเป็นวงกว้าง พร้อมกับการแถลงข่าวที่เต็มไปด้วยความสับสนจนกลายเป็นเชื้อไฟให้เกิดทฤษฎีสมคบคิดแทนที่จะสร้างความเชื่อมั่นให้กับสาธารณชน", "ขณะที่เครื่องบินกำลังจะลงจอดที่แอตแลนตา นักบินได้ประกาศผ่านอินเตอร์คอมว่ามีปัญหาเกิดขึ้น โดยระบุว่าเป็นปัญหาด้านการสื่อสารกับสำนักงานบริหารการบินแห่งชาติ (FAA) ที่กำลังลุกลามไปทั่วประเทศ นักบินไม่ได้ให้รายละเอียดมากนักนอกเหนือจากบอกว่าอาจส่งผลต่อการเข้าเทียบประตูและการต่อเครื่อง", "สำหรับ Amanda Khera ผู้โดยสารที่กำลังเดินทางกลับบ้านพร้อมครอบครัวหลังจากประสบปัญหาลูกชายวัย 22 เดือนป่วยหนักระหว่างพักผ่อนที่เบลีซ สถานการณ์นี้สร้างความหวาดกลัวอย่างมาก เธอตั้งคำถามว่านักบินกำลังบินโดยไม่มีการติดต่อกับหอควบคุมการจราจรหรือไม่ หรือเครื่องบินจะชนกันกลางอากาศหรือเปล่า โดยเฉพาะอย่างยิ่งเมื่อคำนึงถึงเหตุการณ์เครื่องบินชนกันเหนือสนามบิน Reagan National ในปี 2025 ที่มีผู้เสียชีวิตถึง 67 ราย", "แม้เที่ยวบินของเธอจะลงจอดอย่างปลอดภัย แต่เมื่อก้าวออกจากเครื่องเธอกลับพบกับสนามบินที่เป็นอัมพาต เที่ยวบินกว่า 600 เที่ยวจากแอตแลนตาถูกยกเลิก และไม่มีใครทราบว่าการเดินทางจะกลับมาเป็นปกติเมื่อใด เนื่องจาก FAA ได้ประกาศหยุดบินทั่วประเทศ (Ground Stop) เป็นที่เรียบร้อยแล้ว", "วิกฤตเริ่มขึ้นเมื่อเวลาประมาณ 15:15 น. ตามเวลา ET เมื่อนักบินและเจ้าหน้าที่ควบคุมการจราจรทางอากาศในแถบมิดเวสต์เริ่มรายงานปัญหาการสื่อสารผ่านวิทยุ โดยนักบินของสายการบิน Allegiant เที่ยวบิน 547 รายงานว่าไม่สามารถติดต่อหอควบคุมได้เลย ขณะที่เจ้าหน้าที่ในรัฐอิลลินอยส์ระบุว่าปัญหาขยายตัวเกินกว่าที่คาดการณ์ไว้จนระบบ Chicago Approach เข้าสู่สถานะ ATC zero", "FAA ได้ออกคำสั่งหยุดบินทั่วประเทศในเวลา 15:54 น. ET โดยอ้างเหตุผลด้านความปลอดภัย ซึ่งสร้างความประหลาดใจให้กับทั้งนักบินและเจ้าหน้าที่ควบคุมการจราจรทางอากาศทั่วประเทศ เนื่องจากไม่เคยเกิดเหตุการณ์ในลักษณะนี้มาก่อน", "ปัญหาดังกล่าวมีต้นตอมาจากระบบ FAA Telecommunications Infrastructure (FTI) ซึ่งเป็นกระดูกสันหลังของระบบควบคุมการจราจรทางอากาศที่สร้างโดยบริษัท L3Harris ตั้งแต่ช่วงต้นปี 2000 โดยระบบนี้ทำหน้าที่เชื่อมต่อสถานีการบินกว่า 4,400 แห่งเข้าด้วยกัน และกำลังอยู่ในแผนการเปลี่ยนผ่านในปี 2028", "รายงานจาก The Wall Street Journal ระบุว่าความผิดพลาดเกิดจากการที่ผู้รับเหมาของ L3Harris เปลี่ยนสวิตช์โทรศัพท์แบบสายเป็นเราเตอร์ข้อมูลไร้สายตัวใหม่ที่สถานีในเมือง El Dorado รัฐอาร์คันซอ แต่เมื่อเปิดใช้งาน เราเตอร์ดังกล่าวกลับส่งคำขอเชื่อมต่อเข้าสู่เครือข่ายนับร้อยครั้งต่อวินาทีจนทำให้ระบบโอเวอร์โหลด", "I-Hong Hou ศาสตราจารย์ด้านวิศวกรรมไฟฟ้าและคอมพิวเตอร์จาก Texas A&M University อธิบายว่าเครือข่ายโทรคมนาคมจะแบ่งข้อมูลเป็นแพ็กเก็ตเล็กๆ เมื่อเครือข่ายเสื่อมประสิทธิภาพลงและสูญเสียแพ็กเก็ตข้อมูลไปเพียงบางส่วน ก็อาจทำให้ระบบที่ต้องการความแม่นยำสูงอย่างการควบคุมการจราจรทางอากาศหยุดทำงานโดยสิ้นเชิงได้", "เจ้าหน้าที่เทคนิคของ FAA เชื่อว่าการพยายามเชื่อมต่อซ้ำๆ ของเราเตอร์ที่ El Dorado สร้างความไม่เสถียรจนตัดการเชื่อมต่อวิทยุและเรดาร์ของศูนย์ควบคุมการจราจรทางอากาศ 17 แห่งจากทั้งหมด 22 แห่งทั่วประเทศ ซึ่งเป็นปรากฏการณ์ที่เรียกว่า 'Cascading Failure' หรือความล้มเหลวแบบลูกโซ่", "หลังจากที่ผู้รับเหมาของ L3Harris ตัดการเชื่อมต่อเราเตอร์ตัวที่มีปัญหาและเราเตอร์อีกตัวที่สถานีเรดาร์ในรัฐเท็กซัสออกไป เครือข่ายก็เริ่มกลับมาเสถียรอีกครั้ง และ FAA ได้ยกเลิกคำสั่งหยุดบินในเวลา 20:15 น. ET รวมระยะเวลาที่หยุดบินนานที่สุดนับตั้งแต่เหตุการณ์ 9/11", "ความล้มเหลวทางเทคโนโลยีกลายเป็นวิกฤตที่เลวร้ายลงด้วยการสื่อสารที่ผิดพลาดของ FAA โดยหลังจากผ่านไป 6 ชั่วโมง รัฐมนตรีว่าการกระทรวงคมนาคม Sean Duffy และรัฐมนตรีว่าการกระทรวงความมั่นคงแห่งมาตุภูมิ Markwayne Mullin ได้ออกมาแถลงข่าว แต่กลับให้ข้อมูลที่สับสนและขัดแย้งกันเอง โดย Mullin พยายามปฏิเสธว่าไม่ใช่การโจมตีทางไซเบอร์ แต่กลับโทษโครงการปรับปรุงระบบของ FAA", "ในการแถลงข่าววันเสาร์ถัดมา Duffy ได้ตั้งข้อสังเกตถึงความไร้ประสิทธิภาพของผู้รับเหมา และเรียกร้องให้สภาคองเกรสจัดสรรงบประมาณเพิ่มอีกหลายพันล้านดอลลาร์เพื่อดำเนินการปรับปรุงระบบให้เสร็จสิ้น โดยมองว่าเงินงบประมาณเดิม 1.25 หมื่นล้านดอลลาร์นั้นเป็นเพียง 'การจ่ายเงินบางส่วน' เท่านั้น", "การแถลงข่าวที่เต็มไปด้วยความสับสนและปัญหาทางเทคนิคระหว่างการถ่ายทอดสด ยิ่งกระพ ื่อให้ผู้ใช้ตัดสินใจเลือกฟังได้ง่ายขึ้น", "ฟีเจอร์ใหม่นี้รวบรวมข้อมูลจากตัวอย่างหนังสือ บทวิจารณ์ของผู้ฟัง และบทสัมภาษณ์ของผู้เขียนหรือบรรณาธิการมาสรุปเป็นเสียงให้ฟัง", "มีการนำ AI มาใช้สร้างคอลเลกชันหนังสือเสียงแบบเฉพาะบุคคล (Personalized Collections) เพื่อช่วยให้หนังสือที่ไม่ได้ติดอันดับขายดีถูกค้นพบได้ง่ายขึ้น", "ขยายขอบเขตฟีเจอร์เบต้า 'Ask a Question' และ 'Recaps' ให้ครอบคลุมหนังสือภาษาอังกฤษในสหรัฐฯ มากขึ้น พร้อมแผนเปิดตัวเต็มรูปแบบในเดือนธันวาคม", "ความเคลื่อนไหวนี้เป็นกลยุทธ์สำคัญของ Audible ในการดึงดูดผู้ใช้ใหม่และรับมือกับการแข่งขันที่รุนแรงจากแพลตฟอร์มคู่แข่งอย่าง Spotify"], "full_paragraphs": ["Audible กำลังเปิดตัวฟีเจอร์ใหม่ที่ขับเคลื่อนด้วย AI ซึ่งออกแบบมาเพื่อช่วยให้ผู้ใช้งานสามารถตัดสินใจได้ง่ายขึ้นว่าหนังสือเสียงเล่มไหนที่พวกเขาจะชื่นชอบก่อนที่จะเริ่มกดฟังจริง โดยฟีเจอร์ 'Audio Discovery' นี้จะผสมผสานทั้งตัวอย่างเสียงจากหนังสือ บทสรุปที่สร้างโดย AI และบทวิจารณ์จากผู้เขียน เพื่อให้ข้อมูลที่ครบถ้วนแก่ผู้ใช้ในการเลือกเรื่องราวถัดไป นอกจากนี้ยังมีการแนะนำคอลเลกชันหนังสือเสียงที่ปรับแต่งให้เข้ากับรสนิยมการฟังของแต่ละบุคคลโดยเฉพาะอีกด้วย", "ฟีเจอร์ Audio Discovery จะทำหน้าที่เป็นบทสรุปแบบสั้น (Soundbite synopsis) โดยมีเป้าหมายเพื่อลดความจำเป็นที่ผู้ใช้ Audible ต้องออกไปค้นหาข้อมูลหนังสือจากแพลตฟอร์มอื่น ฟีเจอร์นี้จะเล่นตัวอย่างเสียงของหนังสือพร้อมบทสรุปสั้นๆ ที่สร้างโดย AI ซึ่งครอบคลุมถึงธีมหลักของเรื่องและปฏิกิริยาของผู้ฟัง โดยดึงข้อมูลมาจากบทวิจารณ์และข้อมูลสาธารณะอื่นๆ นอกจากนี้ยังอาจรวมถึงบทวิจารณ์จากผู้เขียนหรือบรรณาธิการของ Audible ซึ่งถูกดึงมาจากบทสัมภาษณ์ในอดีตโดยตรง", "Andy Tsao ประธานเจ้าหน้าที่ฝ่ายผลิตภัณฑ์ของ Audible กล่าวในประกาศว่า 'การเลือกหนังสือเล่มถัดไปควรให้ความรู้สึกเหมือนได้รับคำแนะนำจากเพื่อน ด้วยฟีเจอร์ Audio Discovery คุณจะได้รับฟังมุมมองสั้นๆ ว่าทำไมหนังสือเล่มนี้ถึงอาจเหมาะกับคุณ จากบรรณาธิการของเรา เพื่อนผู้ฟัง หรือแม้แต่ตัวผู้เขียนเอง ประสบการณ์การฟังที่ดีที่สุดบางอย่างคือการค้นพบหนังสือที่หายากหรือเป็นเพชรเม็ดงาม และเราต้องการให้การค้นพบที่ยอดเยี่ยมเหล่านั้นเกิดขึ้นได้บ่อยและง่ายดายยิ่งขึ้น'", "ปัจจุบันฟีเจอร์ Audio Discovery กำลังเริ่มเปิดให้ใช้งานในหนังสือภาษาอังกฤษบางรายการในสหรัฐอเมริกา โดยมีแผนที่จะขยายไปยังภูมิภาคอื่นๆ ในอนาคต", "นอกจากนี้ Audible ยังใช้ AI ในการปรับแต่งคอลเลกชันหนังสือเสียงให้เข้ากับรสนิยมของผู้ฟังแต่ละคน เพื่อช่วยให้หนังสือที่ไม่ได้ปรากฏอยู่ในรายการขายดี (Best-selling lists) สามารถถูกค้นพบได้ง่ายขึ้น เช่นเดียวกับ Audio Discovery คอลเลกชันส่วนบุคคลเหล่านี้กำลังเปิดให้ใช้งานสำหรับลูกค้าในสหรัฐฯ และยังรวมถึงบทวิจารณ์จากบรรณาธิการของ Audible ด้วยเช่นกัน", "ฟีเจอร์เหล่านี้ถือเป็นความเคลื่อนไหวล่าสุดที่ขับเคลื่อนด้วย AI ซึ่ง Audible นำมาใช้เพื่อดึงดูดผู้ใช้ใหม่และรับมือกับการแข่งขันที่เพิ่มขึ้นจากแพลตฟอร์มคู่แข่งอย่าง Spotify โดยส่วนหนึ่งของการอัปเดตนี้ Audible ยังได้ขยายฟีเจอร์เบต้าอีกสองรายการ ได้แก่ 'Ask a Question' ซึ่งช่วยให้ผู้ใช้สามารถถามคำถาม AI เกี่ยวกับตัวละคร จุดสำคัญของเนื้อเรื่อง การอ้างอิง และอื่นๆ และ 'Recaps' ซึ่งเป็นฟีเจอร์สรุปเนื้อหาด้วยเสียงโดยไม่มีการสปอยล์สำหรับสิ่งที่ผู้ใช้ฟังไปแล้ว โดย Audible ระบุว่าฟีเจอร์เหล่านี้พร้อมให้ใช้งานสำหรับหนังสือภาษาอังกฤษเพิ่มเติมอีก 'จำนวนหนึ่ง' ในสหรัฐฯ และมีแผนจะเปิดตัวในวงกว้างขึ้นเริ่มตั้งแต่เดือนธันวาคมเป็นต้นไป"], "link": "https://www.theverge.com/tech/1034083/audible-audio-discovery-ai-feature-availability", "canonical_link": "https://www.theverge.com/tech/1034083/audible-audio-discovery-ai-feature-availability", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Audible-audio-discovery-hero-.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Audible_Collections_Newsroom_1080x608.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794837600, "published_at": "2026-11-16T14:00:00Z", "published_th": "16 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1794837665975, "guid": "https://www.theverge.com/?p=1034110", "original_title": "Google Maps can now create trip itineraries for you", "thai_title": "Google Maps อัปเดตฟีเจอร์ AI ช่วยวางแผนทริปท่องเที่ยวและจัดตารางเดินทางให้คุณอัตโนมัติ", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Google Maps เปิดตัวฟีเจอร์ใหม่ใน Ask Maps ที่ใช้ AI ช่วยสร้างตารางการเดินทางแบบกำหนดเองได้ทั้งแบบวันเดียวหรือหลายวัน", "ระบบสามารถแสดงรายละเอียดเส้นทาง ปักหมุดสถานที่ และแชร์แผนการเดินทางไปยัง Google Docs ได้", "ฟีเจอร์ 'know before you go' ช่วยให้ข้อมูลเรียลไทม์ เช่น สภาพการจราจร ที่จอดรถ จุดชาร์จรถยนต์ และสภาพอากาศ", "Ask Maps เพิ่มความสามารถในการค้นหาและจองคิวบริการต่างๆ เช่น ร้านเสริมสวย หรือบริการซ่อมบ้าน พร้อมฟีเจอร์ช่วยโทรติดต่อสถานที่ให้", "Google ขยายการให้บริการ Ask Maps ไปยังกว่า 30 ประเทศในยุโรป และเริ่มเปิดใช้งานฟีเจอร์ใหม่ในกว่า 200 ประเทศทั่วโลก"], "full_paragraphs": ["Google กำลังเปิดตัวฟีเจอร์ใหม่สำหรับการวางแผนการเดินทางด้วย AI บน Google Maps ซึ่งช่วยให้แอปพลิเคชันสามารถสร้างตารางการเดินทางแบบเฉพาะตัวให้กับคุณ พร้อมให้ข้อมูลรายละเอียดแบบเรียลไทม์ในแต่ละจุดแวะพัก โดยการอัปเดตนี้กำลังทยอยปล่อยให้กับแชทบอต Ask Maps ที่ขับเคลื่อนด้วย Gemini ภายในแอป ซึ่งช่วยให้คุณสามารถวางแผนการท่องเที่ยวได้ตั้งแต่ทริปสั้นๆ แบบวันเดียวไปจนถึงทริปยาวหลายวัน", "ตัวอย่างที่ Google ยกมาคือ คุณสามารถใช้ Ask Maps เพื่อวางแผนทริปช้อปปิ้งช่วงเทศกาลแบบวันเดียว หรือให้ AI ช่วยจัดตารางสำหรับการเดินทางท่องเที่ยวด้วยรถยนต์เป็นเวลาสามวัน โดยมีจุดแวะพักสำหรับการเดินป่าริมชายฝั่งและการรับประทานอาหารริมทะเล จากนั้น Ask Maps จะสร้างตารางการเดินทางแบบวันต่อวันพร้อมรายการจุดแวะพัก อีกทั้งยังแสดงเส้นทางและหมุดหมายเลขสำหรับแต่ละสถานที่บนแผนที่ ซึ่งคุณสามารถแชร์แผนการเดินทางนี้กับเพื่อนหรือสมาชิกในครอบครัว รวมถึงส่งออกไปยัง Google Docs บนเดสก์ท็อปได้อีกด้วย", "คุณสามารถเรียกดูตารางการเดินทางก่อนออกเดินทาง หรือเลือกป้าย 'itinerary' ในประวัติการแชทได้ นอกจากเส้นทางแล้ว Google Maps จะแสดงข้อมูลเรียลไทม์เกี่ยวกับสภาพการจราจร เวลาทำการของสถานที่ และอื่นๆ นอกจากนี้ คุณยังสามารถดูรายละเอียดในหัวข้อ 'know before you go' เพื่อรับทราบข้อมูลเกี่ยวกับที่จอดรถ จุดชาร์จรถยนต์ สภาพอากาศ ความล่าช้าที่อาจเกิดขึ้น และค่าผ่านทางระหว่างการเดินทางของคุณ", "นอกเหนือจากการวางแผนการเดินทางแล้ว ขณะนี้คุณยังสามารถใช้ Ask Maps เพื่อค้นหาการนัดหมายเฉพาะทาง เช่น บริการเสริมสวย บริการดูแลสัตว์เลี้ยง บริการซ่อมรถ และบริการซ่อมแซมบ้าน โดยให้ AI ช่วยโทรติดต่อสถานที่เหล่านั้นแทนคุณได้ นอกจากนี้ คุณยังสามารถใช้ Ask Maps เพื่อค้นหาสถานที่ที่คุณบันทึกไว้ในรายการ โดยการถามคำถามในลักษณะว่า 'มีสถานที่ใดบ้างในรายการที่บันทึกไว้ที่มีคิวว่างสำหรับ 5 คนในช่วง 30 นาทีข้างหน้า?'", "Google กำลังขยายการให้บริการ Ask Maps ไปยังกว่า 30 ประเทศในยุโรป รวมถึงสเปน เยอรมนี และสหราชอาณาจักร โดยฟีเจอร์การวางแผนการเดินทางและการค้นหารายการที่บันทึกไว้กำลังทยอยเปิดให้ใช้งานในกว่า 200 ประเทศที่ Ask Maps ให้บริการอยู่แล้ว ในขณะที่ฟีเจอร์แนะนำ 'know before you go' และการค้นหาการนัดหมายจะเริ่มเปิดให้ใช้งานในสหรัฐอเมริกาก่อนเป็นที่แรก"], "link": "https://www.theverge.com/tech/1034110/google-ask-maps-ai-trip-planning", "canonical_link": "https://www.theverge.com/tech/1034110/google-ask-maps-ai-trip-planning", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25472454/STK270_GOOGLE_MAPS_D.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794837600, "published_at": "2026-11-16T14:00:00Z", "published_th": "16 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1794834045920, "guid": "https://www.theverge.com/?p=1031740", "original_title": "The Nvidia scandal isn’t slowing down", "thai_title": "วิกฤตศรัทธา Nvidia: อนาคตอุตสาหกรรม AI สั่นคลอนหลังการลาออกของ Jensen Huang", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["Jensen Huang ลาออกจากตำแหน่ง CEO ของ Nvidia ท่ามกลางข่าวฉาวเรื่องความสัมพันธ์ส่วนตัวและการถูกตรวจสอบเรื่องการจัดส่งชิปไปยังประเทศจีน", "หุ้น Nvidia ร่วงลง 14% หลังการประกาศลาออก ส่งผลให้เกิดความไม่แน่นอนต่อทิศทางของบริษัทที่เป็นหัวใจสำคัญของโครงสร้างพื้นฐาน AI ในสหรัฐฯ", "มีการตั้งคำถามถึงผลกระทบต่อการระดมทุนด้าน AI ในระยะยาว เนื่องจาก Huang เป็นตัวจักรสำคัญในการผลักดันดีลการเงินมูลค่ามหาศาลกว่า 5 แสนล้านดอลลาร์", "นักวิเคราะห์และผู้เชี่ยวชาญด้านความปลอดภัย AI กังวลว่าความผันผวนภายในบริษัทอาจกดดันให้เกิดการลดมาตรฐานความปลอดภัยเพื่อเร่งทำกำไร", "สภาคองเกรสเตรียมเดินหน้าสอบสวน Nvidia ในประเด็นการผูกขาดทางการค้าและการลักลอบส่งออกชิปไปยังจีนอย่างเข้มข้น"], "full_paragraphs": ["ตลอดหลายปีที่ผ่านมา Jensen Huang มีอิทธิพลอย่างมหาศาลในการกำหนดทิศทางความก้าวหน้าของ AI ในฐานะ CEO ผู้ร่วมก่อตั้ง และประธานของ Nvidia ชิปของ Nvidia เปรียบเสมือน 'รากฐานที่เทคโนโลยี AI ขั้นสูงในสหรัฐฯ ถูกสร้างขึ้น' ความต้องการที่เพิ่มขึ้นอย่างต่อเนื่องมักจะแซงหน้ากำลังการผลิตเสมอ ทำให้เหล่า CEO ของบริษัท AI ต่างต้องยอมสยบต่อ Huang เพื่อแย่งชิงทรัพยากรประมวลผลก่อนการทำ IPO นอกจากนี้ Nvidia ยังมีพอร์ตการลงทุนในบริษัท AI ดาวรุ่งมูลค่าเกือบ 1 แสนล้านดอลลาร์ และ Huang ยังเป็นที่ปรึกษาที่ใกล้ชิดของประธานาธิบดี Donald Trump จนถูกเรียกว่าเป็น 'ที่ปรึกษาที่มีอิทธิพลมากที่สุด' ในด้านเทคโนโลยี อย่างไรก็ตาม นับตั้งแต่วันพุธที่ผ่านมา Huang ซึ่งเป็นบุคคลสำคัญของอุตสาหกรรมได้ก้าวลงจากตำแหน่ง CEO ของ Nvidia แล้ว", "นับตั้งแต่การลาออกของ Huang เมื่อสัปดาห์ที่แล้ว ข่าวฉาวเกี่ยวกับความสัมพันธ์ส่วนตัวของเขาก็ไม่มีทีท่าว่าจะแผ่วลง หลังจากการประกาศ หุ้นของ Nvidia ร่วงลง 14 เปอร์เซ็นต์ ทำให้เป็นหนึ่งในสัปดาห์ที่เลวร้ายที่สุดในตลาดสำหรับบริษัทในช่วงปีครึ่งที่ผ่านมา และการเปิดเผยข้อมูลยังคงดำเนินต่อไป ไม่กี่ชั่วโมงหลังการลาออก Reuters รายงานว่า Huang มีความสัมพันธ์ครั้งที่สามกับพนักงานอีกคน (แม้จะไม่มีการระบุชื่อพนักงานคนดังกล่าว) นอกจากนี้ยังมีรายงานว่า Huang ได้หลอกลวงผู้นำของ Nvidia เกี่ยวกับการนอกใจของเขา รวมถึงข้อกล่าวหาที่ว่า Nvidia มีส่วนเกี่ยวข้องกับการจัดส่งชิปมูลค่าเกือบ 1.2 หมื่นล้านดอลลาร์ไปยังประเทศจีน และบริษัทของ Alice Huang ซึ่งถูกกล่าวหาว่าเป็นสินทรัพย์ข่าวกรองของจีน ได้ให้คำมั่นว่าจะจัดหาชิปขั้นสูงให้กับบริษัท AI ของจีนอย่าง DeepSeek", "มีรายงานว่าพนักงาน Nvidia บางส่วนได้ทำคำร้องเพื่อเรียกร้องให้ Huang กลับมาดำรงตำแหน่ง รวมถึงมีรายงานว่า Huang กำลังรวบรวม 'ทีมงานเฉพาะกิจ' ของพันธมิตรเพื่อหาทางกลับมาเป็น CEO ของ Nvidia อีกครั้ง ในขณะที่ฝ่ายนิติบัญญัติได้เริ่มการสอบสวนเกี่ยวกับการลักลอบขนชิปและข้อหาอื่นๆ ทุกวันมีหลักฐานเพิ่มขึ้นเรื่อยๆ ถึงผลกระทบภายในรัฐบาลของ Trump และในขณะที่ผลประกอบการรายไตรมาสของ Nvidia กำลังจะประกาศในวันอังคาร อนาคตของบริษัทและอุตสาหกรรม AI โดยรวมยังคงอยู่ในสภาวะที่ไม่แน่นอน", "Nvidia จะเป็นอย่างไรหากไม่มี Huang? เป็นเรื่องยากที่จะตอบได้เนื่องจากเขาเป็นผู้นำบริษัทมานานถึง 33 ปี โดย Colette Kress ซึ่งเป็น CFO ได้เข้ามารับตำแหน่ง CEO รักษาการ และโลกของ AI กำลังจับตามองว่าบริษัทที่มีมูลค่ามากที่สุดแห่งหนึ่งของโลก ซึ่งเป็นผู้ช่วยกำหนดทุกก้าวสำคัญของอุตสาหกรรม จะเดินหน้าต่อไปอย่างไร", "Stephen Straus CEO ของ KUNGFU.AI บริษัทที่ปรึกษาด้าน AI กล่าวว่า Nvidia เป็นบริษัทขนาดใหญ่มากจนผลกระทบจากการจากไปของ Huang 'จะต้องใช้เวลาหลายปีกว่าจะเห็นผลชัดเจน' เขากล่าวว่า '[Nvidia] มีส่วนแบ่งการตลาด... พวกเขามีชิปที่ดีที่สุดในโลก มีกำลังการผลิตมากที่สุด... และพวกเขามีระบบนิเวศทั้งหมดที่สร้างขึ้นรอบสิ่งที่พวกเขาทำ ไม่มีสิ่งใดที่เปลี่ยนแปลงไปเพียงเพราะคนคนเดียว' แม้จะมีการพูดคุยกันว่าการจากไปของ Huang อาจเร่งให้เกิดฟองสบู่ AI แตก แต่ Straus เปรียบเทียบสถานการณ์นี้กับยุคดอทคอม ซึ่งไม่ได้หยุดยั้งการเติบโตของอินเทอร์เน็ตแต่อย่างใด", "การลาออกของ Huang อาจไม่ทำให้เกิดโดมิโนเอฟเฟกต์ในอุตสาหกรรม AI แต่โครงการระดมทุนด้าน AI ระยะยาวที่เขาเป็นผู้ผลักดันอาจได้รับผลกระทบในที่สุด Lior Prosor หุ้นส่วนผู้จัดการของ Deep33 บริษัท VC ด้านเทคโนโลยีกล่าว โดย Huang เป็นผู้ผลักดันการระดมทุนสำหรับการขยายโครงสร้างพื้นฐาน AI ในวงกว้าง ในเดือนสิงหาคม Nvidia ได้ลงนามในข้อตกลงกับสถาบันการเงินขนาดใหญ่ 6 แห่งเป็นเงินประมาณ 5 แสนล้านดอลลาร์เพื่อสนับสนุนการขยายโครงสร้างพื้นฐาน AI และข้อตกลงเหล่านั้นหรือข้อตกลงในอนาคตอาจเปลี่ยนไปหาก 'CEO ที่โดดเด่นที่สุดในภูมิทัศน์ AI ไม่ได้เป็นผู้จัดการดีลดังกล่าวอีกต่อไป' Brian Colello นักวิเคราะห์หุ้นอาวุโสของ Morningstar เขียนไว้ในบันทึกเมื่อวันจันทร์ที่ผ่านมา", "ในส่วนของบริษัทสตาร์ทอัพ AI ขนาดเล็กต่างกำลังสงสัยว่าผลกระทบจะส่งผ่านมาถึงพวกเขาอย่างไร Michal Miernowski ผู้ร่วมก่อตั้งและ CEO ของ Amperos Health ซึ่งสร้าง AI agents สำหรับการเรียกเก็บเงินด้านการดูแลสุขภาพ กล่าวว่าเขาไม่คาดคิดว่า Amperos จะได้รับผลกระทบโดยตรงจากการเคลื่อนไหวนี้มากนัก เนื่องจากบริษัทพึ่งพาโมเดล AI ทั้งแบบ frontier และ open-source แต่การชะลอตัวของตลาด AI ในวงกว้าง ไม่ว่าจะเนื่องมาจากข่าวฉาวของ Nvidia หรือความกังวลในวงกว้าง ก็อาจทำให้ธุรกิจหยุดชะงักได้เช่นกัน นอกจากนี้ยังมีประเด็นที่ต้องติดตามจากฝั่ง Nvidia ตั้งแต่การสอบสวนของบริษัทเองไปจนถึงการสอบสวนของรัฐสภา Evan Gotlob หุ้นส่วนของ DarrowEverett LLP และอดีตอัยการรัฐและรัฐบาลกลางกล่าวว่าเขาคิดว่า 'มีอะไรมากกว่านี้แน่นอน' เกี่ยวกับเรื่องการรั่วไหลไปยังจีนและการซื้อขายชิปที่น่าสงสัย เขากล่าวเสริมว่าการสอบสวนของคณะกรรมการบริษัทจะ 'ดำเนินต่อไปอย่างแน่นอน' แม้ว่าเขาจะลาออกไปแล้วก็ตาม: 'การสอบสวนนี้จะไม่ส่งผลดีต่อเขาอย่างแน่นอน'", "สมาชิกสภานิติบัญญัติบางคนวางแผนที่จะเรียกตัว CEO เข้าให้การต่อสภาภายใต้คำสาบานอยู่แล้ว กระแสความนิยมใน AI กำลังเติบโต เช่นเดียวกับการต่อต้านศูนย์ข้อมูล (data centers) ซึ่งเป็นประเด็นสำคัญในการหาเสียงของพรรคเดโมแครตในช่วงการเลือกตั้งกลางเทอม การเปิดเผยข้อมูลเกี่ยวกับ Huang ซึ่งเป็นพันธมิตรหลักของ Trump ถือเป็นโอกาสแรกในการดำเนินการ", "'เราต้องการเห็นสภาคองเกรสที่นำโดยเดโมแครตสอบสวน Nvidia เกี่ยวกับการปฏิบัติทางการค้าที่ไม่เป็นธรรมที่ผลักภาระต้นทุนไปให้ผู้บริโภค สิ่งที่บริษัทรู้เกี่ยวกับการลักลอบขนชิปกับจีน และสิ่งที่ Nvidia ได้รับเป็นการตอบแทนสำหรับการบริจาคให้กับแคมเปญของ Trump และงานเลี้ยงเต้นรำ' Sacha Haworth ผู้ก่อตั้งและ CEO ของ The Tech Oversight Project กล่าวกับ The Verge", "นักวิจัยด้านความปลอดภัย AI ยังกังวลว่าในกรณีที่เลวร้ายที่สุด ความไม่มั่นคงจากเหตุการณ์เมื่อสัปดาห์ที่แล้วอาจเร่งให้เกิดเหตุการณ์สำคัญด้าน AI ที่อาจเป็นอันตราย เช่น การปรับปรุงตัวเองแบบเรียกซ้ำ (recursive self-improvement) หรือ AI ที่ทรงพลังที่สามารถปรับปรุงและสร้างเวอร์ชันในอนาคตของตัวเองได้โดยอัตโนมัติ Marius Hobbhahn CEO และผู้ก่อตั้ง Apollo Research บริษัทด้านความปลอดภัย AI และผู้ตรวจสอบบุคคลที่สาม กล่าวว่าเขากังวลว่าความผันผวนที่เกิดจากการจากไปของ Huang 'จะเพิ่มความเสี่ยงในการสูญเสียการควบคุมจริง เพราะบริษัทรู้สึกถึงแรงกดดันด้านรายได้มากขึ้น จึงเต็มใจที่จะลดทอนมาตรฐานความปลอดภัยลง'", "เมื่อต้นสัปดาห์ที่แล้ว ก่อนการลาออกของ Huang ฉันทามติทั่วไปในหมู่ผู้มีอิทธิพลใน Silicon Valley นักวิเคราะห์ และนักการเมือง คือผลกระทบที่ 'ไม่สามารถทดแทนได้' ของ Huang หมายความว่า Nvidia จะกลับสู่สถานะเดิม Brian Colello นักวิเคราะห์หุ้นอาวุโสของ Morningstar เขียนในบันทึกวันนั้นว่าบริษัท 'ไม่สามารถตัดความเป็นไปได้ที่... Nvidia จะกลับไปดำเนินธุรกิจตามปกติ' เนื่องจาก Huang เป็น 'CEO คนเดียวที่บริษัทเคยรู้จัก' ในตอนนี้ ในขณะที่มีรายงานว่า Huang กำลังรวบรวมพันธมิตรเพื่อผลักดันการกลับมา ซึ่งเป็นสิ่งที่ยังไม่เคยเห็นมาก่อนนับตั้งแต่การรัฐประหาร Sam Altman ในปี 2023 อุตสาหกรรม AI ทั้งหมดกำลังรอคอยที่จะดูว่าสถานการณ์จะดำเนินไปในทิศทางใด"], "link": "https://www.theverge.com/ai-artificial-intelligence/1031740/jensen-huang-nvidia-scandal-isnt-slowing-down", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1031740/jensen-huang-nvidia-scandal-isnt-slowing-down", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/STKP210_JENSEN_HUANG_D.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794834000, "published_at": "2026-11-16T13:00:00Z", "published_th": "16 พ.ย. 2026 • 20:00 น.", "category_hint": "Technology"}, {"id": 1794830458298, "guid": "https://www.theverge.com/?p=1032984", "original_title": "Amazon’s Zoox robotaxis are now available via Uber", "thai_title": "Uber จับมือ Amazon นำหุ่นยนต์แท็กซี่ไร้พวงมาลัย Zoox ให้บริการผ่านแอปแล้ว", "tag": "Technology", "sub_tag": "TRANSPORTATION", "bullet_points": ["ผู้ใช้งาน Uber ในลาสเวกัสสามารถเรียกใช้บริการหุ่นยนต์แท็กซี่ไร้พวงมาลัยของ Zoox ได้แล้วตั้งแต่วันนี้", "เป็นการร่วมมือครั้งแรกที่ Uber นำรถยนต์ไร้คนขับแบบเฉพาะทาง (Purpose-built) มาให้บริการ และเป็นครั้งแรกที่ Zoox เปิดให้แอปภายนอกเข้าถึงกองยานพาหนะของตน", "มีการจับมือกับ MGM Resorts เพื่อปรับปรุงโครงสร้างพื้นฐานและจุดรับ-ส่งให้รองรับรถยนต์ไร้คนขับได้อย่างราบรื่น", "Zoox วางแผนขยายการให้บริการไปยังลอสแอนเจลิสภายในปี 2027 ผ่านแพลตฟอร์มของ Uber", "Uber เดินหน้ากลยุทธ์การเป็นแพลตฟอร์มกลางสำหรับผู้ให้บริการรถยนต์ไร้คนขับหลายราย เช่น Motional, WeRide และ Avride"], "full_paragraphs": ["ผู้ใช้งานในลาสเวกัสสามารถเรียกใช้บริการหุ่นยนต์แท็กซี่ (Robotaxi) ที่ไม่มีพวงมาลัยของ Zoox ซึ่งเป็นบริษัทในเครือ Amazon ผ่านแอปพลิเคชัน Uber ได้แล้ววันนี้ โดยมาพร้อมกับการจับมือเป็นพันธมิตรกับ MGM Resorts และมีแผนจะขยายการให้บริการไปยังลอสแอนเจลิสในปี 2027", "แม้ว่า Uber อาจกำลังอยู่ในช่วงปรับความสัมพันธ์กับ Waymo แต่บริษัทก็ได้พันธมิตรรายใหม่ในกลุ่มหุ่นยนต์แท็กซี่อย่าง Amazon เข้ามาเสริมทัพ โดยผู้ใช้งาน Uber ในลาสเวกัสจะถูกจับคู่กับรถยนต์ไร้คนขับแบบ Bidirectional (วิ่งได้สองทิศทาง) ที่ออกแบบมาโดยเฉพาะของ Zoox", "ความร่วมมือครั้งนี้ถือเป็นก้าวสำคัญของทั้งสองบริษัท โดยเป็นครั้งแรกที่ Uber นำรถยนต์ไร้คนขับแบบเฉพาะทางที่ไม่มีพวงมาลัยเข้ามาอยู่ในเครือข่าย และเป็นครั้งแรกที่ Zoox เปิดให้แอปพลิเคชันภายนอกสามารถเข้าถึงกองยานพาหนะของตนได้ โดย Uber ระบุว่าผู้ที่เรียกใช้บริการ UberX, Uber Comfort, Uber Electric, Uber Comfort Electric หรือ Wait & Save ในลาสเวกัส อาจถูกจับคู่กับรถของ Zoox ได้โดยไม่มีค่าใช้จ่ายเพิ่มเติม เช่นเดียวกับพันธมิตร AV รายอื่นของ Uber ผู้ใช้งานสามารถตั้งค่าความต้องการในแอปเพื่อเพิ่มโอกาสในการได้รับบริการจากรถยนต์ไร้คนขับได้", "อย่างไรก็ตาม Zoox ยังคงมีข้อจำกัดด้านพื้นที่ให้บริการ โดยหุ่นยนต์แท็กซี่ของบริษัทจะครอบคลุมเฉพาะโซนท่องเที่ยวหลัก เช่น ย่านเดอะสตริป (The Strip), ดาวน์ทาวน์ลาสเวกัส และย่านอาร์ตดิสทริกต์ (Arts District) นอกจากนี้ Zoox จะยังคงเปิดให้บริการผ่านแอปพลิเคชันของตนเองควบคู่ไปกับการเชื่อมต่อผ่าน Uber ต่อไป", "นอกเหนือจากการเปิดตัวแล้ว Uber และ Zoox ยังประกาศข้อตกลงระยะยาวในการเป็นพันธมิตรด้านบริการเรียกรถและหุ่นยนต์แท็กซี่อย่างเป็นทางการให้กับ MGM Resorts International ในลาสเวกัส ซึ่งเป็นที่ทราบกันดีว่าจุดรับ-ส่งผู้โดยสารตามรีสอร์ตอย่าง Bellagio หรือ MGM Grand นั้นมีความวุ่นวายสูง และสำหรับรถยนต์ไร้คนขับ การนำทางเข้าสู่จุดรับ-ส่งที่ซับซ้อนของคาสิโน ซึ่งเต็มไปด้วยพนักงานนำรถไปจอด รถบัสท่องเที่ยว และนักท่องเที่ยวที่สับสน ถือเป็นความท้าทายทางเทคนิคอย่างยิ่ง", "เพื่อป้องกันไม่ให้รถของ Zoox ต้องติดอยู่ในวงจรการจราจรที่วุ่นวายภายในรีสอร์ต ความร่วมมือนี้จึงครอบคลุมไปถึงการปรับปรุงโครงสร้างพื้นฐานทางกายภาพ เช่น การทำป้ายบอกทางที่ชัดเจนขึ้นภายในพื้นที่ และการใช้ระบบนำ ่ากระทรวงพาณิชย์ล้มเหลวในการปกป้องความมั่นคงของชาติ และปล่อยให้บริษัทที่มีความเชื่อมโยงกับจีนเข้าถึงเทคโนโลยี AI ขั้นสูงของสหรัฐฯ", "มีการตั้งข้อสังเกตถึงผลประโยชน์ทับซ้อนของ Lutnick เนื่องจาก Cantor Fitzgerald บริษัทการเงินที่เขาเคยบริหาร ถือครองหุ้น Nvidia มูลค่ากว่า 1.2 พันล้านดอลลาร์ในช่วงที่เขาได้รับการเสนอชื่อ", "ท่ามกลางความตึงเครียดนี้ มีรายงานว่ารัฐบาลสหรัฐฯ เตรียมประกาศให้ Nvidia, OpenAI, Anthropic, Amazon และ Microsoft เป็น 'แชมป์เปี้ยนแห่งชาติ' ด้าน AI เพื่อเร่งการอนุมัติใบอนุญาตส่งออกและแข่งขันกับจีน"], "full_paragraphs": ["Maria Cantwell วุฒิสมาชิกจากรัฐวอชิงตัน ซึ่งเป็นหนึ่งในสมาชิกพรรคเดโมแครตระดับสูงในคณะกรรมาธิการพาณิชย์ของวุฒิสภา ได้ออกมาวิพากษ์วิจารณ์กระทรวงพาณิชย์ (DOC) ภายใต้การนำของรัฐมนตรี Howard Lutnick อย่างรุนแรง โดยกล่าวหาว่าทางกระทรวงละเลยการบังคับใช้มาตรการปกป้องเพื่อสกัดกั้นไม่ให้ชิป AI ของ Nvidia ตกไปอยู่ในมือของประเทศจีน ในจดหมายที่ส่งถึง Lutnick เมื่อวันอาทิตย์ที่ผ่านมา Cantwell ระบุว่ากระทรวงพาณิชย์ได้ 'บ่อนทำลายความมั่นคงของชาติสหรัฐฯ' และความล้มเหลวของหน่วยงานนี้ 'มีส่วนช่วยในการสูญเสียความได้เปรียบทางเทคโนโลยี AI ของอเมริกา'", "“แม้จะมีอำนาจหน้าที่ที่ชัดเจนจากรัฐสภา แต่กระทรวงพาณิชย์กลับปล่อยให้ชิป AI ขั้นสูงไหลผ่านไปยังบริษัทที่มีความเชื่อมโยงกับสาธารณรัฐประชาชนจีน (PRC) กระทรวงพาณิชย์ได้ขัดขวางความพยายามในการจำกัดบริษัทที่ถูกระบุว่าเป็นภัยคุกคามต่อความมั่นคงของชาติ อีกทั้งยังทำให้มาตรการป้องกันอ่อนแอลง และเปิดช่องทางให้ PRC สามารถนำเทคโนโลยีที่ละเอียดอ่อนของสหรัฐฯ ไปใช้ในการฝึกฝนโมเดล AI ขั้นสูงได้” Cantwell กล่าวในจดหมาย", "ในจดหมายฉบับดังกล่าว Cantwell ได้ยกตัวอย่างกรณีที่กระทรวงพาณิชย์เพิกเฉยต่อคำเตือนจากทำเนียบขาวและเจ้าหน้าที่ข่าวกรองที่ต้องการให้จำกัดการเข้าถึงชิป AI ของบริษัท Megaspeed ก่อนที่จะมีข้อกล่าวหาว่า Jensen Huang อดีตซีอีโอของ Nvidia มีความสัมพันธ์เชิงชู้สาวกับผู้บริหารของ Megaspeed ในขณะนั้น ซึ่งถูกสงสัยว่าเป็นสายลับของจีน นอกจากนี้ Cantwell ยังวิจารณ์กระทรวงพาณิชย์ที่อนุญาตให้ Alibaba และ ByteDance เข้าถึงชิปของ Nvidia ผ่านศูนย์ข้อมูลในต่างประเทศ รวมถึงการขยายช่องโหว่ที่เปิดทางให้บริษัทที่ถูกจำกัดสามารถเข้าถึงเทคโนโลยี AI ของสหรัฐฯ ผ่านทางบริษัทลูกได้", "นอกจากนี้ กระทรวงพาณิชย์ยังถูกกล่าวหาว่า 'ให้ความสำคัญกับผลประโยชน์ทางธุรกิจมากกว่าความมั่นคงของชาติ' โดย Cantwell ตั้งข้อสังเกตว่า Cantor Fitzgerald บริษัทบริการทางการเงินที่ Lutnick เคยบริหารและปัจจุบันบุตรชายของเขาเป็นผู้ดูแลนั้น มีรายงานว่าถือครองหุ้น Nvidia มูลค่า 1.2 พันล้านดอลลาร์ ณ ช่วงเวลาที่ Lutnick ได้รับการเสนอชื่อให้ดำรงตำแหน่งรัฐมนตรีว่าการกระทรวงพาณิชย์", "จดหมายฉบับนี้ถูกส่งออกมาก่อนการประชุมระหว่างประธานาธิบดีโดนัลด์ ทรัมป์ ของสหรัฐฯ และประธานาธิบดีสี จิ้นผิง ของจีน ในวันพฤหัสบดีนี้ แม้ว่ารัฐสภาจะพยายามผลักดันการเพิ่มมาตรการจำกัดการส่งออกชิป AI แต่สำนักข่าว The Wall Street Journal รายงานว่า Lutnick คาดว่าจะเปิดตัวโครงการริเริ่มใหม่ที่จะกำหนดให้ Nvidia รวมถึงบริษัทอย่าง OpenAI, Anthropic, Amazon และ Microsoft เป็น 'แชมป์เปี้ยนแห่งชาติ' (National Champion) ด้าน AI โดยการกำหนดสถานะนี้มีเป้าหมายเพื่อช่วยให้บริษัทเหล่านี้ขยายธุรกิจในต่างประเทศและแข่งขันกับบริษัทเทคโนโลยีของจีนได้ ด้วยการอนุมัติใบอนุญาตส่งออกที่รวดเร็วยิ่งขึ้น", "“อเมริกาไม่สามารถรักษาความเป็นผู้นำด้าน AI ได้ หากหน่วยงานที่มีหน้าที่รับผิดชอบในการปกป้องความได้เปรียบนั้นล้มเหลวในการบังคับใช้มาตรการควบคุมของตนเอง” Cantwell กล่าวทิ้งท้ายในจดหมาย “ฝ่ายบริหารต้องรับผิดชอบต่อความล้มเหลวในการบังคับใช้มาตรการป้องกันเหล่านี้ และต้องดำเนินการทันทีเพื่อป้องกันไม่ให้เทคโนโลยีที่ละเอียดอ่อนที่สุดของอเมริกาถูกนำไปเสริมสร้างความแข็งแกร่งให้กับศัตรูของเรา”"], "link": "https://www.theverge.com/policy/1034047/nvidia-us-commerce-department-cantwell-lutnick", "canonical_link": "https://www.theverge.com/policy/1034047/nvidia-us-commerce-department-cantwell-lutnick", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/STK414_AI_CVIRGINIA_I__0003_1.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794826800, "published_at": "2026-11-16T11:00:00Z", "published_th": "16 พ.ย. 2026 • 18:00 น.", "category_hint": "Technology"}, {"id": 1794801329656, "guid": "https://www.theverge.com/?p=1033355", "original_title": "Apple’s new study looks to improve the effectiveness of AI health tools", "thai_title": "Apple เปิดตัวโครงการวิจัยใหม่ มุ่งยกระดับประสิทธิภาพเครื่องมือ AI ด้านสุขภาพ", "tag": "Technology", "bullet_points": ["Apple ร่วมมือกับ OpenEvidence เปิดตัว 'Apple Health AI Usage Study' เพื่อศึกษาการใช้งาน AI ในการตอบคำถามด้านสุขภาพ", "ผู้เข้าร่วมโครงการจะได้รับแอปพลิเคชันใหม่เพื่อสอบถามข้อมูลทางการแพทย์และประเมินความแม่นยำของคำตอบ", "โครงการนี้เปิดรับอาสาสมัครในสหรัฐฯ สูงสุด 200,000 คน โดยต้องมีอายุ 21 ปีขึ้นไปและใช้ iPhone 15 Pro ขึ้นไป", "Apple ยืนยันว่าข้อมูลที่รวบรวมได้จะไม่ถูกนำไปใช้ในการฝึกฝนโมเดล AI และให้ความสำคัญกับความเป็นส่วนตัวเป็นอันดับแรก", "เป้าหมายหลักคือการพัฒนาเครื่องมือ AI ให้สามารถส่งมอบข้อมูลสุขภาพที่เข้าใจง่ายและนำไปใช้ประโยชน์ได้จริง"], "full_paragraphs": ["Apple ได้ประกาศเปิดตัวโครงการวิจัยใหม่ในวันนี้ โดยมีเป้าหมายเพื่อทำความเข้าใจให้ลึกซึ้งยิ่งขึ้นว่า ผู้คนมีปฏิสัมพันธ์กับเครื่องมือ AI สนทนาด้านสุขภาพอย่างไร และคำตอบที่ได้รับนั้นมีประโยชน์จริงเพียงใด บริษัทกำลังดำเนินโครงการ 'Apple Health AI Usage Study' ร่วมกับ OpenEvidence ซึ่งเป็นแพลตฟอร์ม AI ทางคลินิกที่บุคลากรทางการแพทย์ใช้งานอยู่ โดยแพลตฟอร์มนี้จะสร้างคำตอบโดยอ้างอิงจากข้อมูลทางการแพทย์จากแหล่งที่น่าเชื่อถือ เช่น วารสาร The New England Journal of Medicine โดยผู้เข้าร่วมโครงการจะต้องใช้แอปพลิเคชัน iOS ตัวใหม่เพื่อสอบถามคำถามทางการแพทย์ และให้คะแนนคำตอบตามเกณฑ์ต่างๆ ได้แก่ ความถูกต้อง ความละเอียด และความเกี่ยวข้องของข้อมูล", "ขณะนี้แอปพลิเคชันดังกล่าวเปิดให้ดาวน์โหลดแล้ว และเริ่มเปิดรับสมัครผู้เข้าร่วมโครงการตั้งแต่วันนี้เป็นต้นไป โดย Apple ตั้งเป้าหมายที่จะรับอาสาสมัครเข้าร่วมโครงการสูงสุดถึง 200,000 คน ผู้เข้าร่วมจะต้องมีอายุ 21 ปีขึ้นไปและพำนักอยู่ในสหรัฐอเมริกา แม้ว่าแอปพลิเคชันนี้จะไม่ได้ใช้เทคโนโลยี Apple Intelligence แต่จำเป็นต้องใช้งานบน iPhone 15 Pro ที่รันระบบปฏิบัติการ iOS 26 หรือใหม่กว่าเท่านั้น", "ผู้เข้าร่วมโครงการสามารถใช้แอปพลิเคชันเพื่อสอบถามคำถามที่เกี่ยวข้องกับสุขภาพและรับคำตอบที่เข้าใจง่าย พร้อมลิงก์อ้างอิงไปยังแหล่งข้อมูลทางคลินิกที่ผ่านการตรวจสอบโดยผู้เชี่ยวชาญ (peer-reviewed) แอปพลิเคชันนี้อาศัยการป้อนคำสั่งผ่านข้อความ (text-based prompts) และแม้ว่าจะสามารถใช้ฟีเจอร์การพิมพ์ด้วยเสียงผ่านคีย์บอร์ดของ iOS ได้ แต่ตัวแอปพลิเคชันเองไม่ได้มีการเชื่อมต่อหรือบูรณาการเข้ากับ Siri หรือ Apple Intelligence แต่อย่างใด", "ในระหว่างขั้นตอนการลงทะเบียน ผู้เข้าร่วมสามารถเลือกที่จะแชร์ข้อมูลจาก Apple HealthKit เช่น ข้อมูลกิจกรรม การนอนหลับ หรือผลตรวจทางห้องปฏิบัติการ เพื่อให้คำตอบที่ได้รับมีบริบทที่เกี่ยวข้องกับสุขภาพส่วนบุคคลมากขึ้น อย่างไรก็ตาม Apple ให้ความสำคัญกับความเป็นส่วนตัวเป็นอันดับแรก โดยระบุว่าได้ดำเนินมาตรการต่างๆ เพื่อให้มั่นใจว่าข้อมูลของผู้ใช้จะถูกเก็บเป็นความลับ และข้อมูลที่รวบรวมได้จะไม่ถูกนำไปใช้ในการฝึกฝนโมเดล AI โดยเป้าหมายสูงสุดคือการปรับปรุงการออกแบบและฟังก์ชันการทำงานของเครื่องมือ AI ด้านสุขภาพ เพื่อให้สามารถส่งมอบข้อมูลสุขภาพที่เกี่ยวข้องและช่วยให้ผู้ใช้เข้าใจและนำไปปฏิบัติตามได้ง่ายขึ้น", "Sumbul Desai แพทย์และรองประธานฝ่ายสุขภาพและการออกกำลังกายของ Apple กล่าวว่า 'ที่ Apple เราเชื่อว่านวัตกรรมที่รับผิดชอบต้องเริ่มต้นจากความเข้มงวดทางวิทยาศาสตร์และพื้นฐานทางคลินิก สุขภาพเป็นเรื่องส่วนตัวอย่างลึกซึ้ง และการดำเนินการวิจัยเฉพาะทางเป็นวิธีที่รอบคอบที่สุดในการทำความเข้าใจว่าผู้คนมีส่วนร่วม รับรู้ และประเมิน AI ด้านสุขภาพในชีวิตประจำวันอย่างไร ข้อมูลเชิงลึกจากการศึกษานี้จะช่วยส่งเสริมการสนทนาทางวิทยาศาสตร์ในวงกว้าง และรับประกันว่าในขณะที่เทคโนโลยีก้าวหน้าไป เราจะยังคงสร้างเครื่องมือที่เชื่อถือได้ซึ่งสนับสนุนผู้คนได้อย่างแท้จริง ไม่ว่าพวกเขาจะอยู่ในขั้นตอนใดของการเดินทางด้านสุขภาพก็ตาม'"], "link": "https://www.theverge.com/tech/1033355/apples-new-study-looks-to-improve-the-effectiveness-of-ai-health-tools", "canonical_link": "https://www.theverge.com/tech/1033355/apples-new-study-looks-to-improve-the-effectiveness-of-ai-health-tools", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/applestudy1b.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/applestudy2.jpg?qualit ิ"], "full_paragraphs": ["ภายหลังการเปิดเผยข้อมูลเกี่ยวกับความสัมพันธ์ระหว่าง เจนเซน หวง ซีอีโอของ Nvidia (ในขณะนั้น) กับบุคคลที่ถูกสงสัยว่าเป็นสายลับของจีน ส่งผลให้รัฐสภาสหรัฐฯ กำลังพิจารณามาตรการขั้นเด็ดขาดเพื่อควบคุมการส่งออกชิปปัญญาประดิษฐ์ (AI) ให้เข้มงวดมากยิ่งขึ้น", "ทั้งสมาชิกสภาจากพรรคเดโมแครตและพรรครีพับลิกันต่างแสดงการสนับสนุนมาตรการและร่างกฎหมายหลายฉบับที่มีเป้าหมายเพื่อกระชับกฎระเบียบการส่งออก พร้อมทั้งเรียกร้องให้ เจนเซน หวง และผู้นำระดับสูงคนอื่นๆ ของ Nvidia เข้าให้การต่อรัฐสภาเพื่อชี้แจงข้อเท็จจริงที่เกิดขึ้น", "ชัค ชูเมอร์ ผู้นำเสียงข้างน้อยในวุฒิสภา ได้ออกมากล่าวอย่างชัดเจนว่า เจนเซน หวง และฝ่ายบริหารของทรัมป์ จำเป็นต้องออกมาตอบคำถามต่อรัฐสภาเกี่ยวกับประเด็นความสัมพันธ์ที่น่ากังวลนี้", "ในขณะเดียวกัน ทิม สกอตต์ ประธานคณะกรรมาธิการการธนาคารวุฒิสภา ได้ดำเนินการส่งหนังสืออย่างเป็นทางการถึง เจนเซน หวง และ ฮาวเวิร์ด ลัตนิค รัฐมนตรีว่าการกระทรวงพาณิชย์ โดยเรียกร้องให้ทั้งสองฝ่ายเข้าให้การต่อคณะกรรมาธิการอย่างเปิดเผยต่อสาธารณะ", "ร่างกฎหมายหลายฉบับ เช่น 'Remote Access Security Act' ซึ่งถูกเสนอครั้งแรกในสภาผู้แทนราษฎรเมื่อเดือนเมษายน 2025 แต่ต้องหยุดชะงักไปในวุฒิสภา กำลังได้รับความสนใจและถูกหยิบยกขึ้นมาพิจารณาใหม่อีกครั้ง", "แม้ว่าร่างกฎหมายฉบับดังกล่าวอาจไม่ได้รับการอนุมัติให้มีผลบังคับใช้เป็นกฎหมายในทันที แต่ ไมค์ จอห์นสัน ประธานสภาผู้แทนราษฎร ได้กล่าวกับสำนักข่าวรอยเตอร์ว่า ขณะนี้มีความเห็นพ้องต้องกันมากขึ้นในรัฐสภาเกี่ยวกับการจำกัดการส่งออกชิปไปยังประเทศจีน", "นอกจากนี้ ไมค์ จอห์นสัน ยังได้แสดงจุดยืนส่วนตัวว่า เขาสนับสนุนความพยายามทุกวิถีทางในการจำกัดการเข้าถึงชิป AI ประสิทธิภาพสูงของจีน ซึ่งรวมถึงชิปที่ผลิตโดยบริษัทเทคโนโลยีชั้นนำอย่าง Nvidia ด้วยเช่นกัน"], "link": "https://www.theverge.com/ai-artificial-intelligence/1033984/congress-export-rules-ai-chips-china", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25545717/STK481_STK432_CONGRESS_GOVERNMENT_CIVRGINIA_D.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200", "gallery_images": [], "published_ ะกรรมการบริษัทได้แต่งตั้ง โคเล็ตต์ เครสส์ เป็นซีอีโอรักษาการ และ ฮาร์วีย์ โจนส์ เป็นประธานบอร์ดคนแรกในประวัติศาสตร์เพื่อเร่งปฏิรูปโครงสร้างองค์กร"], "full_paragraphs": ["สถานการณ์ของอดีตซีอีโอ Nvidia เปลี่ยนแปลงไปอย่างรวดเร็ว โดยเมื่อวันที่ 29 ตุลาคม The New York Times รายงานว่า เจสัน หวง ผู้ร่วมก่อตั้งและซีอีโอผู้เปรียบเสมือนสัญลักษณ์ของ Nvidia ตกเป็นเป้าหมายของแผนการจารกรรมข้อมูลจากจีน ซึ่งถือเป็นเรื่องน่ากังวลอย่างยิ่งสำหรับซีอีโอเทคโนโลยีระดับสูง ไคล์ ชาน นักวิชาการด้านนโยบายต่างประเทศจาก Brookings Institution กล่าวกับ The Verge ว่า \"หากคุณวาดแผนผังเครือข่ายระบบนิเวศ AI ของสหรัฐฯ ทั้งหมด Nvidia จะอยู่ตรงกลาง และหากคุณวาดแผนผังระบบนิเวศของ Nvidia ชายเพียงคนเดียวคือผู้ที่ยืนอยู่ใจกลางของทั้งหมดนั้น\"", "รายงานระบุว่า เจสัน หวง ได้พัฒนาความสัมพันธ์ที่ใกล้ชิดกับ อลิซ หวง (ไม่มีความเกี่ยวข้องทางสายเลือด) ผู้บริหารบริษัท Megaspeed ในสิงคโปร์ ซึ่งตกเป็นเป้าสายตาของรัฐบาลสหรัฐฯ มาตั้งแต่ปี 2024 เนื่องจากบริษัทของเธอถูกกระทรวงพาณิชย์สหรัฐฯ ตรวจสอบว่าลักลอบนำชิป AI ของ Nvidia เข้าสู่ประเทศจีนโดยละเมิดมาตรการคว่ำบาตรทางการค้า ทั้งนี้ ทางการสิงคโปร์ได้ยึดหนังสือเดินทางของเธอในเดือนมิถุนายน 2025 และสั่งห้ามเข้าประเทศหลังจากที่เธอให้ข้อมูลอันเป็นเท็จแก่เจ้าหน้าที่ ยิ่งไปกว่านั้น เจ้าหน้าที่สหรัฐฯ บางส่วนเชื่อว่าเธออาจส่งข้อมูลเกี่ยวกับการออกแบบชิปของ Nvidia หรือการหารือเรื่องมาตรการทางการค้าของทำเนียบขาวตรงไปยังปักกิ่ง", "ความสัมพันธ์นี้สร้างความกังวลในหลายมิติ เนื่องจากชิปของ Nvidia ถือเป็นหัวใจสำคัญของความเหนือกว่าด้าน AI ของสหรัฐฯ และเป็นประเด็นความมั่นคงของชาติ โดยรัฐบาลสหรัฐฯ ได้จำกัดการขายชิปขั้นสูงให้กับจีนมาตั้งแต่สมัยรัฐบาลไบเดน แต่เจสัน หวง มักจะผลักดันให้มีการผ่อนปรนมาตรการเหล่านี้อยู่เสมอ ในขณะเดียวกันเขาก็มีความสัมพันธ์ที่ใกล้ชิดกับประธานาธิบดีทรัมป์ ถึงขั้นเคยเปิดลำโพงโทรศัพท์คุยกับทรัมป์บนเวทีงาน All-In Summit มาแล้ว", "สถานการณ์ทวีความรุนแรงขึ้นในวันศุกร์ที่ 6 พฤศจิกายน เมื่อ The New York Times รายงานว่า อลิซ หวง ถูกกระทรวงความมั่นคงแห่งรัฐของจีนว่าจ้างให้มาจารกรรมข้อมูลจากซีอีโอของ Nvidia แม้จะมีความเห็นที่แตกต่างกันในหมู่เจ้าหน้าที่ข่าวกรองสหรัฐฯ เกี่ยวกับน้ำหนักของหลักฐานที่เชื่อมโยงเธอกับปักกิ่ง แต่มีข่าวลือหนาหูว่าความสัมพันธ์ระหว่างเจสัน หวง และอลิซ หวง นั้นเป็นเรื่องชู้สาว", "ในวันอาทิตย์ที่ 8 พฤศจิกายน เจสัน หวง ยอมรับว่าเขามีความสัมพันธ์นอกสมรสจริง แต่ไม่ได้ระบุชื่อผู้บริหารบริษัท Megaspeed หรือผู้ที่ถูกกล่าวหาว่าเป็นสายลับจีนโดยตรง ส่งผลให้คณะกรรมการบริษัท Nvidia ประกาศเริ่มการสอบสวนซีอีโอของตนเองในเวลาต่อมา หลายฝ่ายเชื่อว่าเจสัน หวง จะรอดพ้นจากเรื่องนี้ได้เนื่องจากความสำคัญของบริษัทต่ออุตสาหกรรม AI ของสหรัฐฯ และบทบาทที่ไม่มีใครแทนที่ได้ของเขา โดยเฉพาะการที่เขาเป็นซีอีโอเพียงคนเดียวที่บริษัทเคยมีและไม่มีแผนการสืบทอดตำแหน่งที่ชัดเจน รวมถึงการมีโครงสร้างองค์กรที่เขารับรายงานตรงจากพนักงานถึง 60 คน", "อย่างไรก็ตาม ในวันพุธที่ 11 พฤศจิกายน The New York Times รายงานว่า เจสัน หวง มีความสัมพันธ์นอกสมรสครั้งที่สองกับ คิมเบอร์ลี พาวเวลล์ รองประธานฝ่ายดูแลสุขภาพของ Nvidia ซึ่งเป็นหนึ่งในผู้ที่รายงานตรงต่อเขา ข้อมูลนี้อาจเป็นฟางเส้นสุดท้ายที่ทำให้คณะกรรมการตัดสินใจปลดเขาออกจากตำแหน่ง ตามรายงานจาก Bloomberg ระบุว่าเขาดู \"แตกสลาย\" และกล่าวกับผู้คนว่า \"ผมมันเป็นคนเลว\"", "ในวันพฤหัสบดีที่ 12 พฤศจิกายน Nvidia ประกาศว่า เจสัน หวง ได้ลาออกจากตำแหน่งซีอีโอ โดยมีการแต่งตั้ง โคเล็ตต์ เครสส์ ประธานเจ้าหน้าที่ฝ่ายการเงิน (CFO) ขึ้นเป็นซีอีโอรักษาการ และมีการแต่งตั้ง ฮาร์วีย์ โจนส์ เป็นประธานบอร์ดคนแรกในประวัติศาสตร์ของบริษัท เพื่อส่งสัญญาณถึงการเปลี่ยนแปลงโครงสร้างองค์กร โดยโจนส์ระบุในบันทึกถึงพนักงานว่าจะมีการสรรหาผู้สืบทอดตำแหน่งถาวรทั้งจากภายในและภายนอกองค์กร", "ผลกระทบต่อเสถียรภาพของบริษัทเกิดขึ้นทันที โดยราคาหุ้น Nvidia ที่เคยปิดที่ระดับสูงสุดตลอดกาล 239.24 ดอลลาร์เมื่อวันที่ 6 ตุลาคม ร่วงลงมาอยู่ที่ 162.85 ดอลลาร์ในวันที่ 13 พฤศจิกายน ความสำคัญของ Nvidia ต่อการแข่งขันด้าน AI กับจีนนั้นมหาศาล เนื่องจากบริษัทได้ลงทุนกว่า 99,000 ล้านดอลลาร์ในห้องปฏิบัติการ AI และสตาร์ทอัพต่างๆ รวมถึงมีแผนระดมทุนกว่า 500,000 ล้านดอลลาร์เพื่อสร้างศูนย์ข้อมูล AI และโครงสร้างพื้นฐานที่เกี่ยวข้อง", "ก่อนการลาออก Nvidia เผชิญกับการฟ้องร้องจากผู้ถือหุ้นที่อ้างว่าบริษัทหลอกลวงนักลงทุน โดยเจสัน หวง และโฆษกของบริษัทเคยยืนยันว่าความสัมพันธ์กับอลิซ หวง เป : "Technology", "bullet_points": ["เฮเลน โทเนอร์ อดีตบอร์ดบริหาร OpenAI ชี้ว่าการพึ่งพาความไว้วางใจในตัวบุคคลเพียงคนเดียวเพื่อควบคุมความปลอดภัยของ AI เป็นแนวทางที่อันตรายและล้มเหลว", "บทบาทของบอร์ดบริหารในองค์กรไม่แสวงผลกำไรอย่าง OpenAI คือการถ่วงดุลไม่ให้บริษัทมุ่งเน้นแต่ผลกำไรจนละเลยความปลอดภัย แต่กลไกนี้กลับพังทลายลงเมื่อเกิดเหตุการณ์ปลดซีอีโอ", "ปัจจุบันหน่วยงานกำกับดูแลและรัฐบาลยังคงเผชิญกับช่องว่างทางความรู้เกี่ยวกับเทคโนโลยี AI ในขณะที่บริษัทเทคโนโลยีพยายามล็อบบี้และทุ่มเงินมหาศาลเพื่ออิทธิพลทางการเมือง", "โทเนอร์เน้นย้ำว่าความพยายามในการกำกับดูแล AI ต้องอาศัยการวิเคราะห์ที่เข้มงวดและเป็นกลาง มากกว่าการเชื่อมั่นในคำสัญญาของผู้นำบริษัทเพียงอย่างเดียว", "การสร้างความเข้าใจที่ถูกต้องเกี่ยวกับขีดความสามารถของโมเดล AI ระดับแนวหน้า (Frontier Models) เป็นสิ่งจำเป็นสำหรับผู้กำหนดนโยบาย เพื่อปิดช่องว่างระหว่างความเข้าใจของรัฐบาลและนวัตกรรมที่ก้าวกระโดด"], "full_paragraphs": ["เฮเลน โทเนอร์ ผู้อำนวยการบริหารของศูนย์ความมั่นคงและเทคโนโลยีอุบัติใหม่ (CSET) แห่งมหาวิทยาลัยจอร์จทาวน์ กล่าวว่า 'เรากำลังตกอยู่ในสถานการณ์ที่เลวร้าย' หากแผนความปลอดภัยด้าน AI ของเรายังคงฝากความหวังไว้กับการที่ต้องเชื่อใจบุคคลใดบุคคลหนึ่งให้ทำสิ่งที่ถูกต้อง", "เฮเลนเป็นบุคคลที่มีชื่อเสียงในแวดวงความปลอดภัยและนโยบาย AI แต่เธอเป็นที่รู้จักมากที่สุดจากการดำรงตำแหน่งในคณะกรรมการบริหารของ OpenAI ในฐานะหนึ่งในสี่กรรมการที่ลงมติปลด แซม อัลต์แมน ออกจากตำแหน่งซีอีโอ เหตุการณ์ดังกล่าวซึ่งปัจจุบันถูกเรียกว่า 'the blip' จบลงด้วยการที่อัลต์แมนกลับมาดำรงตำแหน่งซีอีโออีกครั้ง เฮเลนลาออก และมีการแต่งตั้งคณะกรรมการชุดใหม่ ซึ่ง OpenAI ได้ปรับโครงสร้างองค์กรใหม่ทั้งหมดตั้งแต่นั้นเป็นต้นมา", "อย่างไรก็ตาม สิ่งที่ควรจดจำคือหน้าที่เดิมของเฮเลนและคณะกรรมการชุดนั้น คือการที่บอร์ดบริหารในรูปแบบองค์กรไม่แสวงผลกำไรของ OpenAI มีไว้เพื่อรับประกันว่าบริษัทจะไม่ทรยศต่อพันธกิจในการสร้าง AI ที่ปลอดภัย โดยการให้ความสำคัญกับผลกำไรและการเติบโตเหนือความปลอดภัย เมื่อคณะกรรมการพยายามใช้กลไกการตรวจสอบนี้ กลไกความรับผิดชอบดังกล่าวกลับพังทลายลง และนั่นคือจุดที่ทำให้เรามาถึงจุดนี้", "ปัจจุบัน คำถามเรื่องความปลอดภัยของ AI กลายเป็นประเด็นที่อยู่ทุกหนทุกแห่ง ในช่วงฤดูร้อนที่ผ่านมา โมเดล AI จาก OpenAI และ Anthropic ได้หลุดออกจากสภาพแวดล้อมการทดสอบและทำการแฮ็กบริษัทจริง ซีอีโอของห้องปฏิบัติการชั้นนำเหล่านี้ได้เรียกร้องให้มีการชะลอตัวและขอความช่วยเหลือจากรัฐบาลวอชิงตัน แต่คำตอบจากทำเนียบขาวกลับเป็นเพียงข้อตกลงแบบสมัครใจ ซึ่งส่วนหนึ่งยังคงพึ่งพาความรับผิดชอบของคณะกรรมการในรูปแบบที่เคยล้มเหลวที่ OpenAI มาแล้ว นอกจากนี้ Anthropic กำลังจะเข้าสู่ตลาดหุ้น ซึ่งจะสร้างแรงกดดันทางการตลาดรูปแบบใหม่ให้กับคู่แข่งรายใหญ่ที่สุดของ OpenAI", "เฮเลนได้เห็นอย่างใกล้ชิดว่าเกิดอะไรขึ้นเมื่อความมุ่งมั่นด้านความปลอดภัยต้องเผชิญกับแรงจูงใจเชิงพาณิชย์ และเธอกล่าวกับผู้สัมภาษณ์ว่า หากความหวังในอนาคตของเราขึ้นอยู่กับการที่ใครคนใดคนหนึ่งเป็นคนที่ไว้ใจได้ เรากำลังประสบปัญหาใหญ่", "ในการสนทนาเกี่ยวกับสิ่งที่ควรทำแทน เฮเลนได้พูดถึงสิ่งที่ห้องปฏิบัติการต่างๆ กำลังพยายามสร้างขึ้นจริง ว่าปัญหาเรื่องการปรับจูน AI (AI alignment) เป็นปัญหาที่แก้ไขได้หรือไม่ และแนวทางที่ชาญฉลาดกว่าในการกำกับดูแล AI ควรเป็นอย่างไร ซึ่งรวมถึงวิธีการมองประเด็นเรื่องประเทศจีน ซึ่งเป็นประเด็นสำคัญในทุกการสนทนานโยบายเกี่ยวกับ AI ในขณะนี้", "เมื่อกล่าวถึงบทบาทของ CSET เฮเลนอธิบายว่า 'CSET เป็นทีมภายในจอร์จทาวน์ แต่เราไม่ใช่กลุ่มนักวิชาการ เรามีทีมงานประมาณ 50 คนและดำเนินงานมาตั้งแต่ปี 2019 โดยพื้นฐานแล้วในปี 2019 กลุ่มของเราตัดสินใจว่ามีเทคโนโลยีอุบัติใหม่จำนวนมากที่กำลังกลายเป็นประเด็นสำคัญในด้านความมั่นคงของชาติ และผู้กำหนดนโยบายบางคนที่มีงานสำคัญมากไม่มีเวลาหรือความเชี่ยวชาญที่จะเข้าใจสิ่งที่เกิดขึ้นกับเทคโนโลยีเหล่านั้น โดย AI เป็นหัวข้ออันดับต้นๆ ในรายการของเราตั้งแต่ปี 2019'", "เฮเลนกล่าวเสริมถึงภารกิจขององค์กรว่า 'ภารกิจของเราคือการวิเคราะห์ที่เข้มงวดและนำไปใช้ได้จริงสำหรับผู้กำหนดนโยบาย โดยเป็นการวิเคราะห์ที่ตั้งอยู่บนพื้นฐานของเทคโนโลยีและความเข้าใจในประเด็นความมั่นคงของชาติอย่างแท้จริง เราผลิตรายงานฉบับยาวและสรุปย่อให้กับผู้กำหนดนโยบายที่มีงานยุ่ง เรามีทีมข้อมูลขนาดใหญ่ที่ช่วยในการวิจัยและทำสิ่งต่างๆ มากมาย'", "เมื่อถูกถามถึงอิทธิพลของเงินในอุตสาหกรรม AI ที่อาจบดบังงานวิจัยที่จริงใจ เฮเลนยอมรับว่าเป็นข้อกังวลที่สมเหตุสมผล แต่เธอมองว่า 'AI เป็นตัวอย่างที่ดี ในการเลือกตั้งครั้งนี้มีการทุ่มเงินมหาศาลให้กับผู้สมัครและข้อความต่างๆ แต่ปรากฏว่ามันไม่ได้ผลดีนัก เหตุผลที่มันไม่ได้ผลคือ ประการแรก นี่เป็นประเด็นที่ผู้มีสิทธิเลือกตั้งให้ความสำคัญมากขึ้นเรื่อยๆ และประการที่สอง มันเป็นประเด็นที่ค่อนข้างมีความเห็นพ้องต้องกันทั้งสองพรรค (bipartisan) สิ่งที่เราเห็นในงานของเราคือมีความกระหายข้อมูลคุณภาพสูงในหมู่ผู้กำหนดนโยบายอย่างแท้จริง'", "สุดท้าย เฮเลนกล่าวถึงช่องว่างระหว่างรัฐบาลกับอุตสาหกรรมเทคโนโลยีว่า 'แน่นอนว่ามีช่องว่างและเป็นช่องว่างที่ใหญ่ แต่ก็เป็นไปได้ที่จะประเมินช่องว่างนั้นสูงเกินไปจากมุมมองภายนอก เมื่อผู้คนจากอุตสาหกรรมเทคโนโลยีเริ่มพูดคุยกับเจ้าหน้าที่รัฐบาล พวกเขามักจะประหลาดใจว่าเจ้าหน้าที่เหล่านั้นฉลาดและมีความรู้จริงเพียงใด แม้ว่าผู้กำหนดนโยบายระดับสูงจะมีภารกิจรัดตัว แต่พวกเขาก็เริ่มให้ความสำคัญกับการทำความเข้าใจ AI มากขึ้นเรื่อยๆ ในช่วงปี 2023 และปีนี้เราก็เห็นความสนใจที่เพิ่มขึ้นอย่างต่อเนื่อง'"], "link": "https://www.theverge.com/podcast/1032907/helen-toner-openai-cset-ai-safety-policy-interview", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DCD-Helen-Toner.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.711631919237%2C100%2C78.576736161526&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/24792604/The_Verge_Decoder_Tileart.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "14 พ.ย. 2026 • 22:00 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/podcast/1032907/helen-toner-openai-cset-ai-safety-policy-interview", "guid": "https://www.theverge.com/?p=1032907", "published_ts": 1794668400, "published_at": "2026-11-14T15:00:00Z", "videos": [], "review_score": "", "sub_tag": "PODCAST"}, {"id": 1794826850353, "guid": "https://www.theverge.com/?p=1032500", "original_title": "Here are our favorite deals from REI’s giant Holiday Sale", "thai_title": "รวมดีลเด็ดน่าช้อปจากมหกรรมลดราคาครั้งใหญ่ Holiday Sale ของ REI", "tag": "Technology", "sub_tag": crop=18.709073900842%2C0%2C62.581852198316%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794668400, "published_at": "2026-11-14T15:00:00Z", "published_th": "14 พ.ย. 2026 • 22:00 น.", "category_hint": "Technology"}, {"id": 1794670625166, "original_title": "This tiny gamepad with dual analog thumbsticks pushes the limits of portable controllers", "thai_title": "รีวิว Atom Plus จอยเกมขนาดจิ๋วที่มาพร้อมอนาล็อกสติ๊กคู่ ท้าทายขีดจำกัดของคอนโทรลเลอร์พกพา", "tag": "Technology", "bullet_points": ["Atom Plus เป็นคอนโทรลเลอร์ขนาดจิ๋วเพียง 3.5 นิ้ว ที่อัดแน่นด้วยฟีเจอร์ครบครัน รวมถึงอนาล็อกสติ๊กคู่แบบป้องกันอาการจอยดริฟต์", "รองรับการใช้งานหลากหลายแพลตฟอร์ม ทั้ง Nintendo Switch, PC, Android, iOS และสมาร์ททีวี", "จุดเด่นอยู่ที่ความสามารถในการปรับแต่งผ่านแอปพลิเคชันมือถือและการเชื่อมต่อผ่าน NFC เพื่อตรวจสอบข้อมูลผลิตภัณฑ์", "ข้อจำกัดหลักคือขนาดที่เล็กเกินไปสำหรับผู้ที่มีมือใหญ่ ทำให้การกดปุ่มบางครั้งอาจเกิดการเบียดกันหรือกดพลาดได้", "ปุ่มทริกเกอร์เป็นแบบดิจิทัลไมโครสวิตช์ ไม่รองรับการเร่งความเร็วแบบอนาล็อกในเกมแข่งรถ"], "full_paragraphs": ["แม้ว่าการออกแบบอันชาญฉลาดของ Joy-Con บน Nintendo Switch จะเป็นที่น่าชื่นชม แต่สำหรับผู้เขียนและครอบครัวแล้ว การใช้งาน Joy-Con เป็นจอยเกมแยกต่างหากนั้นเป็นเรื่องที่น่าอึดอัดใจ ดังนั้นเมื่อต้องเดินทางพร้อมกับเครื่อง Switch 2 พวกเขาจึงมักพกจอยเกมขนาดมาตรฐานไปด้วยอย่างน้อยหนึ่งตัว พร้อมกับจอย 8BitDo Zero 2 อีกสองสามตัวสำหรับเกมที่ไม่จำเป็นต้องใช้อนาล็อกสติ๊ก ผู้เขียนใช้เวลาหลายปีในการตามหาจอยเกมทางเลือกที่มีขนาดเล็กเท่ากับ Zero 2 แต่มีฟังก์ชันการทำงานใกล้เคียงกับจอยขนาดใหญ่ และ CRKD Atom Plus รุ่นใหม่นี้ก็เกือบจะเป็นคำตอบที่สมบูรณ์แบบ แต่หากคุณเป็นคนที่มีมือขนาดใหญ่เหมือนผู้เขียน คุณอาจพบว่าการเน้นความสะดวกในการพกพาของจอยรุ่นนี้เป็นเรื่องที่ท้าทายไม่น้อย", "Atom Plus มีความกว้างประมาณ 3.5 นิ้ว และวางจำหน่ายในราคา 29.99 ดอลลาร์สหรัฐ ซึ่งมีขนาดเล็กกว่า 8BitDo Zero 2 ประมาณครึ่งนิ้ว แต่กลับอัดแน่นด้วยฟีเจอร์และฟังก์ชันการทำงานที่มากกว่าอย่างเห็นได้ชัด สิ่งที่โดดเด่นที่สุดคือการมีอนาล็อกสติ๊กแบบสมมาตรคู่หนึ่งที่ใช้เทคโนโลยี tunneling magnetoresistance เพื่อป้องกันอาการจอยดริฟต์ นอกจากนี้ยังมีปุ่ม Shoulder และปุ่ม Trigger, ระบบสั่น, ปุ่ม Home โดยเฉพาะ, ระบบตรวจจับการเคลื่อนไหว (Motion controls) และความสามารถในการปรับแต่งผ่านแอปพลิเคชันบนมือถือ", "เช่นเดียวกับคอนโทรลเลอร์จากผู้ผลิตรายอื่น Atom Plus สามารถใช้งานได้กับหลายแพลตฟอร์ม รวมถึง Switch และ Switch 2, พีซี, Android, iOS และสมาร์ททีวีต่างๆ การจับคู่กับอุปกรณ์ต่างๆ ต้องอาศัยการตั้งค่าโหมด Bluetooth โดยการกดปุ่มผสมกันในขณะเปิดเครื่อง ซึ่งในกรณีนี้คือการกดปุ่ม Home ร่วมกับทิศทางเฉพาะบน D-pad แม้จะทำได้ง่าย แต่ก็เป็นเรื่องที่จำยาก ผู้เขียนมักจะต้องเปิดคู่มือหรือค้นหาใน Google ว่าต้องกดทิศทางใดเมื่อต้องการสลับอุปกรณ์ ซึ่ง Atom Plus ได้มีการสลักข้อมูลทางเทคนิคไว้ที่ด้านหลังของจอยอยู่แล้ว ดังนั้นผู้เขียนจึงอยากเห็นคำแนะนำในการจับคู่ที่สำคัญเหล่านี้รวมอยู่ด้วยเช่นกัน (ซึ่งควรเป็นมาตรฐานสำหรับจอยเกมทุกรุ่นที่รองรับหลายแพลตฟอร์ม)", "ผู้เขียนทดสอบ Atom Plus กับ Nintendo Switch 2 เป็นหลัก เนื่องจากวางแผนที่จะใช้เป็นอุปกรณ์เสริมสำหรับการเดินทาง อนาล็อกสติ๊กมีขนาดใกล้เคียงกับ Joy-Con ของ Switch รุ่นดั้งเดิม ซึ่งหมายความว่ามันเล็กกว่าของ Switch 2 และแม้ว่าผู้เขียนจะชอบการจัดวางแบบไม่สมมาตรมากกว่า แต่อนาล็อกสติ๊กของ Atom Plus ก็ถือว่าทำได้ดีมาก โดยมีความตึงมากกว่าของ Nintendo เล็กน้อย ซึ่งช่วยให้การเคลื่อนที่แม่นยำขึ้นเมื่อพิจารณาจากระยะการเคลื่อนที่ที่จำกัดของมัน", "แม้คุณภาพการประกอบโดยรวมจะรู้สึกยอดเยี่ยม แต่ขนาดที่เล็กกะทัดรัดของ Atom Plus ก็สร้างข้อจำกัดและความท้าทายบางประการ ปุ่มกดด้านหน้าและ D-pad ให้สัมผัสที่นุ่มนวลดี แต่การจัดวางปุ่มต่างๆ ค่อนข้างเบียดเสียด เมื่อกดปุ่มลงหรือขวาบน D-pad นิ้วหัวแม่มือของผู้เขียนมักจะไปโดนกับอนาล็อกสติ๊กด้านซ้ายโดยไม่ตั้งใจ แม้จะไม่ขัดขวางการเล่นเกม แต่ก็ถือเป็นสิ่งที่น่ารำคาญใจไม่น้อย", "ปุ่ม Shoulder และปุ่ม Trigger ใช้ไมโครสวิตช์แบบดิจิทัล ซึ่งหมายความว่าปุ่ม Trigger ไม่สามารถใช้สำหรับการเร่งความเร็วแบบอนาล็อกในเกมแข่งรถได้ ผู้เขียนชอบที่ปุ่มทั้งสองชุดที่ขอบด้านบนมีความสูงต่างกันเล็กน้อย แต่ก็อยากให้มีความแตกต่างมากกว่านี้อีกนิด เพราะบางครั้งผู้เขียนเผลอกดปุ่ม Trigger ทั้งที่ตั้งใจจะกดปุ่ม Shoulder", "อย่างไรก็ตาม ผู้เขียนรู้สึกประทับใจกับความสามารถในการปรับแต่งของ Atom Plus เมื่อจับคู่กับแอปพลิเคชันบนมือถือ คุณสามารถตรวจสอบระดับแบตเตอรี่ที่เหลืออยู่, ปิดระบบสั่น, ดูหมายเลขผลิตภัณฑ์เฉพาะ (โดยการแตะโทรศัพท์กับชิป NFC ภายในจอย) และตั้งค่าปุ่มใหม่ได้ทั้งหมด ซึ่งรวมถึงคันโยกทางลัดแบบสองฟังก์ชันที่ทำหน้าที่แทนปุ่ม Plus และ Minus ของ Switch รวมถึงทางลัดสำหรับจับภาพหน้าจอ", "คันโยกเหล่านั้นสามารถเลื่อนขึ้นลงได้และช่วยลดจำนวนปุ่มที่เบียดเสียดอยู่ด้านหน้าของ Atom Plus ได้อย่างชาญฉลาด แต่พวกมันกลับให้ความรู้สึกเล็กเกินไป ซึ่งถือเป็นธีมหลักของจอยรุ่นนี้ มันเป็นจอยเกมขนาดจิ๋วที่ยอดเยี่ยมสำหรับการเดินทางหรือพกพาในชีวิตประจำวัน แต่ก็ไม่น่าแปลกใจที่มันอาจจะไม่ใช่จอยหลักที่คุณเลือกใช้ในการเล่นเกมทั่วไป โดยคาดหวังว่าผู้เล่นจะยอมรับการประนีประนอมด้วยการบิดนิ้วในรูปแบบใหม่ๆ เพื่อแลกกับหนึ่งในคอนโทรลเลอร์ที่มีฟีเจอร์ครบครันที่สุดในขนาดที่เล็กที่สุดในตลาด", "ผู้เขียนไม่คิดว่าจอยเกมแบบอนาล็อกคู่จะสามารถทำขนาดให้เล็กไปกว่า Atom Plus ได้อีกโดยไม่สูญเสียหลักสรีรศาสตร์มากเกินไป ดังนั้นแม้จะชื่นชม CRKD สำหรับการสร้างสมดุลในการออกแบบ Atom Plus และแนะนำสำหรับผู้ที่ต้องการคอนโทรลเลอร์ที่มีประสิทธิภาพในราคาประหยัดและพกพาสะดวก แต่ตอนนี้ผู้เขียนก็เริ่มสนใจว่ามันจะเปรียบเทียบกับ Xbox Nano controller ที่ Microsoft เพิ่งประกาศเปิดตัวได้อย่างไร ซึ่ง Tom Warren จาก The Verge ระบุว่ามัน 'สะดวกสบายอย่างน่าประหลาดใจ' แม้จะมีราคาสูงกว่าของ CRKD ถึง 20 ดอลลาร์และมีขนาดใหญ่กว่าอย่างเห็นได้ชัด แต่ก็มาพร้อมกับปุ่ม Trigger แบบอนาล็อก การออกแบบที่กว้างขวางกว่า และกริปที่จับถนัดมือมากขึ้นสำหรับผู้ที่มีมือขนาดใหญ่"], "link": "https://www.theverge.com/tech/1013985/crkd-atom-plus-tmr-analog-thumbstick-controller-gamepad-switch-ios-android-hands-on", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/10/crkd1_d836b8.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.723165084465%2C100%2C78.55366983107&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/10/crkd2_e38fff.jpg?quality=90&amp;strip=all&amp;crop=16.675%2C0%2C66.65%2C100&amp;w=1200", "https://platfo  "full_paragraphs": ["สวัสดีเพื่อนๆ ทุกคน ยินดีต้อนรับสู่ Installer ฉบับที่ 152 คู่มือแนะนำสิ่งที่ดีที่สุดและมีความเป็น Verge ที่สุดในโลก สำหรับสัปดาห์นี้ผมได้อ่านเรื่องราวเกี่ยวกับแอปพลิเคชันในโรงเรียน, การทดสอบ AI, การพนันกีฬา และ Megaspeed รวมถึงได้ชมสารคดี Dane Cook ที่น่าประทับใจเกินคาด ได้เรียนรู้เรื่องเสียง Dial-up มากกว่าที่เคยคิดไว้ และได้ขุดเอา Xbox One เครื่องเก่าออกมาปัดฝุ่นเพราะดูเหมือนจะเป็นทางเลือกที่ดีที่สุดในการเล่น GTA VI ในตอนนี้ นอกจากนี้ผมยังได้ลองใช้ Claude Duet และทดสอบคีย์บอร์ดบุคคลที่สามบน iPhone หลายตัวด้วยความหวังว่าจะสามารถพิมพ์ด้วยเสียงได้ตลอดไป", "นอกจากนี้ ผมยังมีเรื่องราวเกี่ยวกับประวัติศาสตร์อวกาศ, แอปใหม่สำหรับนักเขียนและผู้ฟังพอดแคสต์ รวมถึงพอดแคสต์สนุกๆ เกี่ยวกับ Wikipedia มาฝากกันด้วย ในช่วงไม่กี่สัปดาห์ที่ผ่านมา ผู้ใช้ในชุมชน Installer หลายคนได้กลายเป็นผู้ใช้งาน iPhone Duo กันมากขึ้น ผมได้รับฟังความคิดเห็นมากมายเกี่ยวกับวิธีการใช้งานสมาร์ทโฟนพับได้รุ่นใหม่ของ Apple นี้ โดยรวมแล้วกระแสตอบรับในกล่องข้อความของผมเป็นบวกประมาณ 80 เปอร์เซ็นต์, ลบ 5 เปอร์เซ็นต์ และอีก 15 เปอร์เซ็นต์รู้สึกสับสนอย่างมากกับการเลือกอินเทอร์เฟซ", "เนื่องจากผมไม่มีเครื่อง Duo ผมจึงหันไปหา Allison Johnson จาก The Verge ซึ่งเป็นผู้ร่วมเขียนรีวิวอุปกรณ์ตัวนี้และใช้งานมันอย่างหนักหน่วงที่สุดคนหนึ่ง ผมขอให้เธอแชร์วิธีการใช้งาน Duo ของเธอ ซึ่งเธอก็ได้ส่งชุดสีที่ดูแปลกตาและไอเดียดีๆ กลับมามากมาย โดยเธอใช้ iPhone Duo พร้อมวอลเปเปอร์แบบไล่เฉดสีที่เลือกได้ใน iOS เพื่อเน้นความมินิมอล ส่วนแอปที่เธอใช้ได้แก่ NYT Games, Kindle, Headspace, Spotify, Google Maps, Safari, Messages และ Mail", "Allison เล่าว่า 'ฉันพยายามลองแต่งหน้าจอโฮมแบบมินิมอลอยู่สองสามวันโดยมีแค่แอปอย่าง Headspace และ NYT Games แต่มันล้มเหลวไม่เป็นท่า มันทำให้ฉันหงุดหงิดทุกครั้งที่ต้องค้นหาแอป Messages ดังนั้นฉันจึงเพิ่มแถวแอปที่จำเป็นไว้ที่ด้านล่างของหน้าจอและเพิ่มวิดเจ็ตปฏิทินขนาดใหญ่ ซึ่งทำให้ทุกอย่างดีขึ้นมาก' นอกจากนี้เธอยังมีวิดเจ็ต/ทางลัดสำหรับ TypeDraw ซึ่งเป็นแอปที่ยอดเยี่ยมบน Duo ที่ทำให้โทรศัพท์ทำงานเหมือนสมุดโน้ตจริงและใช้คู่กับ Apple Pencil ได้ดีเยี่ยม รวมถึงการเพิ่มวิดเจ็ตสภาพอากาศไว้ที่แผงด้านซ้ายของหน้าจอโฮม", "เธอยังแนะนำทางลัดสำหรับเพลย์ลิสต์ Lo-fi ใน iOS ซึ่งมีประโยชน์มากหากต้องการใส่หูฟังและฟังเพลงบรรเลงเพื่อจดจ่อกับงาน 'ขอแนะนำอย่างยิ่งสำหรับใครที่ยังไม่เคยลองใช้และรู้สึกถูกกระตุ้นมากเกินไป (overstimulated) เพลงเหล่านี้มีอยู่ในโทรศัพท์ของคุณอยู่แล้ว!' เธอยังกล่าวเสริมว่าเธอได้ลบ Dock ออกไปทั้งหมดในการทดลองความมินิมอลนี้ และพบว่ามันใช้งานได้ดีจนอาจจะไม่กลับไปใช้ Dock อีกเลย", "ในส่วนของคำแนะนำจากชุมชน Installer สัปดาห์นี้ Elliot แนะนำเบราว์เซอร์ 'Search' ที่พัฒนาโดยสตูดิโอออกแบบในปารีส ซึ่งเปรียบเสมือนลูกพี่ลูกน้องสายยุโรปของ Arc ที่มีความเบาและตอบสนองไวบน Mac ขณะที่ Bruce กำลังลองใช้ Monarch เพื่อเปลี่ยนจาก Quicken ที่ใช้มานานหลายปี ส่วน William แนะนำหนังสือเสียง 'Dungeon Crawler Carl' ที่เขาระบุว่ามันได้กลืนกินชีวิตของเขาไปแล้วด้วยเนื้อหาเกือบ 200 ชั่วโมง", "นอกจากนี้ยังมีคำแนะนำที่น่าสนใจอื่นๆ เช่น โปรเจกต์ 'I built an Apple Vision Pro for $5' ของ Brenpoly บน YouTube ที่แสดงให้เห็นศักยภาพของ VR ราคาประหยัด, ส่วน Marcus แนะนำส่วนขยาย Safari ที่ชื่อ 'Widen' สำหรับผู้ใช้ iPhone Duo เพื่อขยายพื้นที่หน้าเว็บให้กว้างขึ้น, และ Stephen ที่ชื่นชมภาพยนตร์เรื่อง 'Wildwood' ของค่าย Laika ว่าเป็นผลงานที่ยอดเยี่ยมระดับเดียวกับ Studio Ghibli", "Kait แนะนำเบราว์เซอร์ 'Brave Origin' ที่แม้จะมีราคาซื้อขาดที่ 59 ดอลลาร์ แต่เป็นเบราว์เซอร์ที่รวดเร็วและมินิมอลบนพื้นฐาน Chromium ส่วน Kyle แนะนำเกม 'Queen’s Domain' ที่ให้ความรู้สึกเหมือนเกมตระกูล King’s Field และ Utkarsh แนะนำซีรีส์ท่องเที่ยว 'Japanorama' จาก Jet Lag: The Game ที่ถ่ายทอดความงดงามของญี่ปุ่นผ่านการแข่งขันล่าสมบัติได้อย่างยอดเยี่ยม", "สุดท้ายนี้ ผมกำลังทำเรื่องราวเกี่ยวกับยุคใหม่ของ Hardware Hacking ที่ผู้คนค้นพบว่าพวกเขาสามารถปรับแต่งทีวี, เครื่องอ่าน E-reader หรืออุปกรณ์อื่นๆ ได้ด้วยตัวเอง โดยมีสิ่งหนึ่งที่ถูกพูดถึงบ่อยที่สุดคือชุดพัฒนา M5Stack ซึ่งเป็นอุปกรณ์ที่ใช้ชิป ESP32 ที่คุณสามารถนำไปแฮ็กหรือปรับแต่งได้ตามใจชอบ ไม่ว่าจะเป็นรุ่นที่มีจอ E Ink หรือจอสัมผัสทรงกลม ผมกำลังจะใช้เงินจำนวนมากไปกับอุปกรณ์เหล่านี้และใช้เวลาไปกับการให้ Claude Code ช่วยทำสิ่งแปลกๆ กับมัน หากคุณได้ทำอะไรสนุกๆ เกี่ยวกับ Hardware Hacking ในสุดสัปดาห์นี้ อย่าลืมมาเล่าให้ผมฟังด้วยนะครับ"], "link": "https://www.theverge.com/tech/1033761/home-assistant-tk-tripod-tabletop-installer", "canonical_link": "https://www.theverge.com/tech/1033761/home-assistant-tk-tripod-tabletop-installer", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Installer-152.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Allison-Johnson-Duo-homescreen.jpeg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": ["https://www.youtube.com/embed/raik_i8VFvo", "https://www.youtube.com/embed/XtNmiTohUcs"], "review_score": "", "published_ts": 1794661200, "published_at": "2026-11-14T13:00:00Z", "published_th": "14 พ.ย. 2026 • 20:00 น.", "category_hint": "Technology"}, {"id": 1794670625168, "original_title": "Jensen Huang and the decline of the visionary showman founder CEO", "thai_title": "ปิดฉากยุคสมัย เจนเซน หวง กับการก้าวลงจากตำแหน่งท่ามกลางมรสุมข่าวฉาว", "tag": "Technology", "bullet_points": ["เจนเซน หวง ซีอีโอผู้ร่วมก่อตั้ง Nvidia ได้ออกจากบริษัทแล้ว ท่ามกลางข่าวอื้อฉาวเรื่องการลักลอบส่งออกชิปและความสัมพันธ์ส่วนตัว", "การจากไปของหวงสร้างความกังวลต่อเสถียรภาพของอุตสาหกรรม AI และตลาดหุ้นสหรัฐฯ เนื่องจาก Nvidia เป็นบริษัทที่มีมูลค่าสูงถึง 5 ล้านล้านดอลลาร์", "นักวิเคราะห์มองว่าหวงเป็นผู้นำที่มีวิสัยทัศน์และเป็นศูนย์กลางของบริษัทอย่างแท้จริง ทำให้การหาผู้สืบทอดตำแหน่งเป็นเรื่องยากลำบาก", "แม้จะไม่มีแผนการสืบทอดตำแหน่งที่ชัดเจน แต่ผู้เชี่ยวชาญเชื่อว่า Nvidia ยังคงมีความแข็งแกร่งด้านเทคโนโลยีและแผนงานผลิตภัณฑ์ที่วางไว้จนถึงปี 2027", "การจากไปของหวงถือเป็นการสิ้นสุดยุคสมัยของ 'ผู้ก่อตั้งที่เป็นนักแสดงโชว์' (Showman Founder) ในวงการเทคโนโลยีระดับโลก"], "full_paragraphs": ["เมื่อวันที่ 6 มกราคม 2025 เจนเซน หวง ซีอีโอของ Nvidia ได้รับช่วงเวลาแห่งการเป็นร็อกสตาร์อย่างแท้จริง เขาเดินขึ้นเวทีอย่างผู้ชนะด้วยการชูมือขึ้นท่ามกลางเสียงปรบมือและเสียงเชียร์จากผู้คนกว่า 14,000 คนในอารีน่าที่เต็มไปด้วยเหล่าอินฟลูเอนเซอร์และแฟนคลับ ใบหน้าของพวกเขาอาบไปด้วยแสงสีฟ้าขณะที่เขาก้าวเข้ามาในชุดแจ็กเก็ตหนังสีดำที่สะท้อนแสงไฟในสนาม", "แต่ในปัจจุบัน แทบไม่มีใครส่งเสียงเชียร์เจนเซน หวง อีกต่อไป เขาได้ออกจาก Nvidia แล้วหลังจากดูเหมือนว่าจะมีส่วนเกี่ยวข้องกับเรื่องอื้อฉาวในการลักลอบส่งออกชิปถึงสองครั้ง และมีข่าวลือเรื่องการนอกใจภรรยาถึงสามครั้ง รวมถึงความสัมพันธ์กับบุคคลที่ถูกกล่าวหาว่าเป็นสายลับจีน ในช่วงเวลาเดียวกับที่เขากำลังคลุกคลีอยู่กับประธานาธิบดี โดนัลด์ ทรัมป์", "ทั่วโลกกำลังจับตามองว่าเรื่องอื้อฉาวนี้จะส่งผลกระทบต่ออุตสาหกรรม AI ของสหรัฐฯ ทั้งระบบและอาจทำให้ตลาดหุ้นสั่นคลอนตามไปด้วยหรือไม่ นั่นเป็นเพราะหวงไม่ได้เพียงแค่บริหารบริษัทที่มีมูลค่า 5 ล้านล้านดอลลาร์แห่งแรกเท่านั้น แต่เขายังเป็นผู้นำที่มีวิสัยทัศน์ในการควบคุม GPU ที่จำเป็นอย่างยิ่งต่อการขับเคลื่อนการเติบโตของ AI ทั่วโลก ซึ่งเป็นส่วนหนึ่งของบริษัทที่มีสัดส่วนถึงประมาณ 6 เปอร์เซ็นต์ของดัชนีตลาดหุ้น S&P 500 ทั้งหมด และเขาก็ไม่ได้วางแผนการสืบทอดตำแหน่งไว้เลยหากเขาต้องก้าวลงจากตำแหน่ง", "ชายวัย 63 ปีผู้นี้เคยกล่าวว่าเขาอยากจะตายในหน้าที่ เขาเคยเสนอว่าเขาจะทำงานจนถึงอายุ 90 หรือ 100 ปี แล้วค่อยดำเนินกิจการบริษัทต่อไปในฐานะหุ่นยนต์", "การหาคนมาแทนที่หวงไม่ใช่เรื่องง่าย ส่วนหนึ่งเป็นเพราะเขาไม่มีรองประธานหรือผู้ช่วยที่ชัดเจน มีพนักงานประมาณ 60 คนที่รายงานตรงต่อซีอีโอ ทอม เมนเนลลี นักวิเคราะห์จาก IDC และอดีตนักข่าวสายคอมพิวเตอร์กล่าวว่า 'เขาสร้างบริษัทขึ้นมาโดยมีตัวเขาเป็นศูนย์กลาง และทุกสิ่งที่เกิดขึ้นในนั้นล้วนผ่านตัวเขา'", "จอน เพดดี นักวิเคราะห์อุตสาหกรรมคอมพิวเตอร์ที่ติดตาม Nvidia มาตั้งแต่ก่อตั้งกล่าวกับผมว่า 'เจนเซนคือ Nvidia และ Nvidia คือเจนเซน'", "แต่ Nvidia ไม่ใช่เจนเซนอีกต่อไปแล้ว เขาได้ทิ้งบริษัทที่เขาร่วมก่อตั้งมาเมื่อ 33 ปีก่อน นี่คือการสิ้นสุดของยุคสมัย และไม่ใช่แค่สำหรับ Nvidia เท่านั้น เพราะเจนเซน หวง คือตัวอย่างสุดท้ายที่แท้จริงของซีอีโอผู้ก่อตั้งที่เป็นนักแสดงโชว์ (Showman) ในวงการเทคโนโลยีขนาดใหญ่", "แพท มัวร์เฮด หัวหน้านักวิเคราะห์จาก Moor Insights & Strategy กล่าวกับผมว่า 'เขาเป็นทั้งผู้มีวิสัยทัศน์และผู้นำเชิงยุทธศาสตร์ ซึ่งใกล้เคียงที่สุดกับสิ่งที่วงการเทคโนโลยีเคยมีอย่าง สตีฟ จอบส์'", "ในขณะที่ อีลอน มัสก์ ไม่ได้เป็นผู้ก่อตั้ง Tesla โดยตรงและมีประวัติการผิดสัญญามากมาย ส่วน มาร์ก ซักเคอร์เบิร์ก แห่ง Meta ก็ยังไม่ได้พิสูจน์ว่าเป็นทั้งผู้มีวิสัยทัศน์หรือนักแสดงโชว์ ส่วน แลร์รี เพจ และ เซอร์เกย์ บริน แห่ง Google ก็ก้าวลงจากตำแหน่งในปี 2019 ทิ้งให้บริษัทอยู่ในมือของ ซุนดาร์ พิชัย และทั้ง Microsoft และ Apple ต่างก็เปลี่ยนผ่านผู้นำมาแล้วสองครั้งนับตั้งแต่ยุคของ บิล เกตส์ และ สตีฟ จอบส์", "แม้บางคนจะบอกว่า สตีฟ จอบส์ แห่ง Apple ได้ทำลายแม่พิมพ์ของซีอีโอแบบเดิมๆ แต่เขาก็สร้างแม่พิมพ์ของตัวเองขึ้นมา หวงเป็นหนึ่งในผู้นำเทคโนโลยีจำนวนนับไม่ถ้วนที่เดินตามรอยเขาด้วยการเปิดตัวผลิตภัณฑ์ในงานคีย์โน้ต การสวมใส่เสื้อผ้าที่เป็นเอกลักษณ์เพียงชิ้นเดียวเหมือนเสื้อคอเต่าสีดำของจอบส์ และบางครั้งก็แกล้งพูดว่า 'มีอีกหนึ่งเรื่อง' (one more thing) เพื่อสร้างความประหลาดใจในตอนท้ายของการนำเสนอ ในห้องข่าว เรามักจะล้อเลียนพวกที่พยายามเลียนแบบจอบส์ ซึ่งหลายคนเป็นเพียงนักธุรกิจในชุดสูทที่ไม่มีความน่าเชื่อถือพอที่จะทำแบบนั้นได้", "ผมเคยคิดว่าหวงอาจเป็นพวกเลียนแบบจอบส์เช่นกัน ในครั้งแรกที่ผมเห็นว่าเขาใช้แจ็กเก็ตสีดำเป็นเครื่องแบบ (ซึ่งไม่ใช่แจ็กเก็ตหนังเสมอไป รุ่นก่อนหน้านี้เป็นเสื้อซอฟต์เชลล์ที่มีโลโก้ Nvidia) ต่อมาหวงยืนกรานที่จะสวมแจ็กเก็ตแม้ในวันที่อากาศร้อน ผมเคยเห็นเขาเหงื่อออกท่วมตัวมากกว่าหนึ่งครั้งแทนที่จะถอดมันออก ไม่เหมือนกับจอบส์ เขายังจัดงานคีย์โน้ตหลายครั้งโดยไม่มีข่าวสารอะไรใหม่ๆ มานำเสนอ เขาชอบที่จะย้ำถึงความสำเร็จเดิมๆ ของบริษัทราวกับว่าเป็นเรื่องใหม่เอี่ยม", "แต่ถึงแม้หวงจะไม่มีความสง่างามเท่าจอบส์ เขาก็มีเทคโนโลยีที่น่าตื่นเต้นซ่อนอยู่และชอบที่จะสาธิตบนเวที เขารู้วิธีทำให้ผู้คนตื่นเต้นกับอนาคตของการประมวลผลเชิงภาพด้วยกราฟิกเกมที่น่าทึ่ง การสาธิตฟิสิกส์และแสงสี และในที่สุดก็รวมถึงการจดจำภาพ การจำลองสภาพอากาศด้วย AI แบบจำลองดิจิทัลของโรงงานในโลกแห่งความเป็นจริง และหุ่นยนต์ที่สามารถฝึกฝนในโลกเสมือนจริงเหล่านั้นได้", "Nvidia ของเขาพยายามให้ความรู้แก่ผู้คนเกี่ยวกับวิธีการและเหตุผลของ GPU ด้วย ผมยังจำได้ในปี 2008 เมื่อ Nvidia เชิญทีม Mythbusters มาสาธิตความแตกต่างระหว่างการประมวลผลแบบอนุกรมและการประมวลผลแบบขนาน โดยใช้ปืนเพนท์บอล 1,100 หัวฉีดเพื่อ 'วาด' ภาพโมนาลิซ่าในการยิงเพียงครั้งเดียว", "สิ่งที่ผมไม่รู้ในตอนนั้นคือ หวงเป็นผู้ก่อตั้งที่มีวิสัยทัศน์ เขาพา Nvidia ไปสู่ชื่อเสียงและความมั่งคั่งผ่านการเดิมพันครั้งใหญ่หลายครั้ง ในปี 1996 สามปีหลังจากที่เขาร่วมก่อตั้งบริษัทที่ร้านอาหาร Denny's Nvidia เกือบจะล้มละลายขณะทำงานกับชิปกราฟิกที่ล้มเหลวสำหรับเครื่องเกม Sega Dreamcast แต่ถึงแม้เขาจะส่งมอบชิปนั้นไม่ได้ หวงก็โน้มน้าวให้ Sega ลงทุน 5 ล้านดอลลาร์หลังจากนั้น ตามรายงานของ The Wall Street Journal ในปี 2024", "จากนั้นเขาก็หันกลับมาเดิมพันบริษัทอีกครั้งกับ Riva 128 ซึ่งเป็นตัวเร่งกราฟิกสำหรับ PC ซึ่งเป็นความพยายามที่ทะเยอทะยานมากจนเขาต้องเลิกจ้างพนักงานกว่าครึ่งหนึ่งจากทั้งหมดประมาณ 100 คน ข้ามขั้นตอนการทำต้นแบบ และเร่งผลิตทันที และเขายังเหลือเงินจ่ายเงินเดือนเพียงหนึ่งเดือนเท่านั้นในตอนที่มันวางจำหน่าย ตามที่ The New Yorker เขียนไว้ในปี 2023 โชคดีที่มันประสบความสำเร็จ โดยขายได้หนึ่งล้านเครื่องในเวลาเพียงสี่เดือน และปูทางไปสู่ GeForce GPU และความสัมพันธ์ระยะยาวกับผู้ผลิตชิปอย่าง TSMC", "ประมาณแปดปีต่อมา หวงตัดสินใจว่าการเป็นผู้นำด้านกราฟิกเกม PC เพียงอย่างเดียวไม่เพียงพอ เขาเดิมพันผลกำไรขั้นต้นทั้งหมดของบริษัท ตามที่เขาบอกกับพอดแคสเตอร์ เล็กซ์ ฟรีดแมน ในการส่งมอบฟีเจอร์ใหม่ภายในกราฟิกการ์ดเหล่านั้นที่ไม่มีใครต้องการ นั่นคือ CUDA มันคือความสามารถในการใช้ GPU สำหรับงานประมวลผลประเภทอื่นนอกเหนือจากกราฟิก และหวงกล่าวว่ามันเพิ่มต้นทุนของกราฟิกการ์ด GeForce ทุกตัวขึ้น 50 เปอร์เซ็นต์", "'เดิมทีไม่มีตลาดหรือความต้องการของตลาดสำหรับมัน ราวกับว่าพวกเขาทำมันขึ้นมาเพราะพวกเขาสามารถทำได้' เพดดีกล่าว 'เจนเซนมีวิสัยทัศน์ว่ามันจะเป็นอะไรได้บ้าง และมีความกล้าหาญที่จะไล่ตามมันแม้จะมีความเห็นต่างจากคนอื่น'", "'NVIDIA กำลังลงทุนในแพลตฟอร์มการประมวลผลที่ขยายไปไกลกว่ากราฟิก โดยไม่มีการรับประกันผลตอบแทนในระยะสั้น' เดฟ อัลทาวิลลา นักวิเคราะห์จาก HotTech กล่าว", "'หวงมองเห็นว่า GPU แท้จริงแล้วคือคอมพิวเตอร์แบบขนานที่บังเอิญแสดงผลกราฟิกได้ CUDA เปลี่ยนข้อมูลเชิงลึกนั้นให้กลายเป็นแพลตฟอร์ม และนั่นคือเหตุผลที่ NVIDIA พร้อมเมื่อ AI มาถึง' เมนเนลลีบอกกับผม", "มันเป็นช่วงเวลาที่เลวร้ายสำหรับกราฟิกการ์ดที่จะมีราคาแพงขึ้นกะทันหัน เมื่อเกิดภาวะเศรษฐกิจถดถอยครั้งใหญ่ในปี 2007–2009 และชิปกราฟิกแล็ปท็อปของ Nvidia เริ่มล้มเหลวเนื่องจากข้อบกพร่องในการออกแบบ บริษัทสูญเสียมูลค่าตลาดไปถึง 80 เปอร์เซ็นต์", "แต่หวงเชื่อมั่นใน CUDA มากพอที่จะลงทุนเพิ่มขึ้น 'เขาแจก GPU ระดับไฮเอนด์ของ NVIDIA ให้กับนักวิจัยตามงานประชุมอุตสาหกรรม ในขณะที่บริษัทสนับสนุนฮาร์ดแวร์ให้กับมหาวิทยาลัยอย่าง Stanford เพื่อส่งเสริมการพัฒนาบนแพลตฟอร์มของตน' อัลทาวิลลากล่าว และภายในปี 2012 ศักยภาพของ Nvidia สำหรับ AI ก็เริ่มปรากฏชัด", "นั่นคือตอนที่นักวิจัยจากมหาวิทยาลัยโตรอนโตใช้ GPU ของ Nvidia เพื่อฝึกโครงข่ายประสาทเทียมสำหรับการจดจำภาพที่ได้รับรางวัลชื่อ AlexNet ซึ่งได้รับการยกย่องอย่างกว้างขวางว่าเป็นจุดเริ่มต้นของการปฏิวัติ AI", "วิสัยทัศน์ของหวงไม่ได้เป็นไปตามที่เขาคาดหวังต่อสาธารณะเสมอไป การสาธิต AlexNet นั้นนำไปสู่การเดิมพันของหวงในเรื่องชิปสำหรับรถยนต์ไร้คนขับโดยตรง เขากล่าว แต่เขาไม่ได้ทำนายเรื่อง AI อย่างแม่นยำนัก CUDA ถูกมองว่าเป็นซูเปอร์คอมพิวเตอร์ที่ดีกว่าและราคาไม่แพงสำหรับนักวิจัยและนักวิทยาศาสตร์ ในปี 2013 ผมยังเขียนเกี่ยวกับแผนการใหญ่ของเขาสำหรับอนาคตของบริษัทที่พึ่งพาการใส่ชิป Nvidia ลงในโทรศัพท์ของคุณ ซึ่งมันไม่ประสบความสำเร็จ", "แต่การเดิมพันในชิปโทรศัพท์ที่ใช้ ARM นั้นทำให้ Nvidia เข้าไปอยู่ใน Nintendo Switch ทุกเครื่อง และอาจช่วยให้เกิด 'AI ซูเปอร์ชิป' ในอนาคตได้ ชิปเซิร์ฟเวอร์ AI รุ่นล่าสุดของ Nvidia มีคอร์ CPU แบบ ARM และในปี 2022 ผู้นำของการปฏิวัติ AI ได้เปิดตัวเทคโนโลยี AI ที่ล้ำสมัยที่สุดบนฮาร์ดแวร์ของ Nvidia นั่นคือ ChatGPT หกปีก่อนหน้านั้น หวงได้ส่งมอบเวิร์กสเตชัน AI ที่สร้างขึ้นโดยเฉพาะเครื่องแรกของ Nvidia ให้กับ OpenAI ด้วยมือของเขาเอง และภายในปี 2022 Microsoft ได้เชื่อมต่อ GPU A100 ของ Nvidia หลายหมื่นตัวเพื่อรองรับภาระงาน", "'ทุกครั้งที่คู่แข่งเข้าใกล้ เขาจะยกระดับการต่อสู้ขึ้นไปอีกขั้น: ชิป, จากนั้นเซิร์ฟเวอร์, จากนั้นระบบเครือข่ายด้วยข้อตกลง Mellanox มูลค่า 6.9 พันล้านดอลลาร์, จากนั้นคือแร็คเต็มรูปแบบ ทั้งหมดเชื่อมโยงกันด้วย CUDA' มัวร์เฮดกล่าว 'ความเร็วมาจากวิธีการที่เขาบริหารบริษัท' เขากล่าวเสริม 'การตัดสินใจที่บริษัทอื่นใช้เวลาสี่สัปดาห์ Nvidia ใช้เวลาเพียงสี่วัน'", "ในขณะที่โชคชะตาและผลกำไรของ Nvidia พุ่งสูงขึ้น — กำไรสุทธิหลายพันดอลลาร์ในทุกๆ วินาที! — และเมื่อชัดเจนขึ้นว่า AI จะเปลี่ยนโฉมโลกในทางใดทางหนึ่ง สิ่งแปลกประหลาดก็เกิดขึ้น หวงกลายเป็นคนดัง ในช่วงฤดูร้อนปี 2024 The Wall Street Journal และโซเชียลมีเดียรายงานว่าเขาได้รับการต้อนรับอย่างวีรบุรุษในไต้หวันบ้านเกิดของเขา เขาหยุดแจกลายเซ็นครั้งแล้วครั้งเล่า รวมถึงบนหน้าอกของผู้หญิงคนหนึ่ง", "ในงานนำเสนอและช่วงถาม-ตอบของนักลงทุนของบริษัท ผมเห็นโทนเสียงเปลี่ยนไป ผู้คนเริ่มปฏิบัติต่อชายในชุดแจ็กเก็ตหนังเหมือนร็อกสตาร์จริงๆ แทนที่จะเป็นร็อกสตาร์เลียนแบบ โดยขอถ่ายรูปและขอลายเซ็นและกล่าวชมเชยเขาแทนที่จะถามคำถามที่ยากๆ", "รู้สึกเหมือนว่าเขาได้บรรลุ 'สนามบิดเบือนความเป็นจริง' (reality distortion field) อันโด่งดังของ สตีฟ จอบส์ ในที่สุด — จนกระทั่งเขาทำให้ฟองสบู่แตกด้วยการนอกใจของเขาเอง", "แต่การมีสนามบิดเบือนความเป็นจริงน้อยลงในโลกนี้ก็ไม่ใช่เรื่องเลวร้ายเสมอไป และอย่างที่ Apple แสดงให้เห็น บริษัทไม่ได้ล้มละลายเพียงเพราะผู้ก่อตั้งที่มีเสน่ห์จากไป ทิม คุก ทำให้ Apple เป็นบริษัทที่ทำกำไรได้มากที่สุดในโลก คำถามตอนนี้คือ: ใครจะมาแทนที่ Nvidia?", "'เขาคือราชา' เพดดีกล่าว 'อย่าเข้าใจผิด มันคือบริษัทของ เจนเซน หวง เขาเป็นคนตัดสินใจทุกอย่าง รับความรุ่งโรจน์ทั้งหมด และแบกรับความผิดทั้งหมดไว้คนเดียว'", "แม้จะไม่มีผู้สืบทอดตำแหน่งที่ระบุชื่อไว้ แต่นักวิเคราะห์ไม่คิดว่า Nvidia กำลังประสบปัญหาใหญ่ในขณะนี้", "'นี่คือความตกใจของหุ้น ไม่ใช่ความตกใจของธุรกิจ ในปีหน้า แผนงานและการผลิตถูกล็อกไว้จนถึงปี 2027' แพท มัวร์เฮด จาก Moor Insights & Strategy กล่าว 'คำถามคือ Nvidia จะยังคงสร้างสรรค์นวัตกรรมในจังหวะของเจนเซนได้หรือไม่เมื่อแผนเหล่านั้นหมดลง ความเสี่ยงที่ใหญ่กว่าชิปคู่แข่งใดๆ คือลูกค้าที่ลังเลในช่วงสุญญากาศ นั่นคือเหตุผลที่ซีอีโอคนต่อไปต้องการความน่าเชื่อถือทางเทคนิค รูปแบบการดำเนินงานที่ไม่ขึ้นอยู่กับคนคนเดียว และแผนในการปกป้อง CUDA'", "'การสูญเสียผู้ก่อตั้งที่มีวิสัยทัศน์ ผู้กำหนดวัฒนธรรม ผู้นำ โฆษกอุตสาหกรรม AI ฯลฯ คือการสูญเสียที่แท้จริง เราไม่คิดว่าจะมีอะไรเปลี่ยนแปลงในเชิงกลยุทธ์' เบน บาจาริน นักวิเคราะห์จาก Creative Strategies กล่าว 'แผนงานผลิตภัณฑ์ถูกกำหนดไว้และยังคงแข็งแกร่ง และหลายรุ่นถัดไปอยู่ระหว่างการออกแบบ การผลิต หรือการสั่งซื้อแล้ว NVIDIA ยังคงเป็นบริษัทที่มีตำแหน่งดีที่สุดในการส่งมอบแผนงานในระดับสเกล เพราะใช้เวลาหลายปีในการล็อกห่วงโซ่อุปทานไว้เบื้องหลัง ตั้งแต่เวเฟอร์ระดับแนวหน้าและบรรจุภัณฑ์ระดับ CoWoS ไปจนถึง HBM และพันธมิตรระดับแร็ค ตำแหน่งอุปทานนั้นไม่ได้เดินออกจากประตูไปพร้อมกับคนคนเดียว'", "'เขาเป็นนักแสดงโชว์ นักขาย และผู้มีวิสัยทัศน์ที่สมบูรณ์แบบสำหรับ NVIDIA ดังนั้นเขาจึงยากที่จะหาใครมาแทนที่' ทอม เมนเนลลี นักวิเคราะห์จาก IDC กล่าว 'แต่แผนงานเทคโนโลยีของบริษัทนั้นมั่นคง และทีมงานที่อยู่เบื้องหลังเขายังคงอยู่ที่นั่น การเลือกคนที่เหมาะสมมาแทนที่เขาจะเป็นกุญแจสำคัญ และจะมีอุปสรรคระหว่างทางอย่างไม่ต้องสงสัย แต่บริษัทจะอยู่รอด'", "'เจนเซนสร้างองค์กรที่มีความสามารถเป็นพิเศษด้วยทีมวิศวกรที่ลึกซึ้ง ระบบนิเวศซอฟต์แวร์ที่เติบโตเต็มที่และมีทรัพยากรมาก และความสัมพันธ์กับลูกค้าที่แข็งแกร่ง' เดฟ อัลทาวิลลา จาก HotTech Vision and Analysis กล่าว 'การจากไปของเขาทิ้งช่องว่างด้านความเป็นผู้นำและวิสัยทัศน์เชิงกลยุทธ์ไว้อย่างไม่ต้องสงสัย แต่เทคโนโลยี ความสามารถ และความสามารถในการดำเนินการที่เขาช่วยสร้างขึ้นนั้นไม่ได้หายไปไหน คำถามที่แท้จริงคือผู้สืบทอดของเขาสามารถรักษาความมุ่งมั่นในวิสัยทัศน์ระยะยาวและความเต็มใจที่จะลงทุนก่อนตลาดได้หรือไม่'", "'ไม่มีใครในบริษัทอยากจะก้าวเข้ามาแทนที่เขาจริงๆ ดังนั้นจะต้องหาคนนอกเข้ามา' จอน เพดดี จาก Jon Peddie Research กล่าว 'ใครก็ตามที่เป็นคนนั้นจะไม่ใช่เจนเซน จะไม่มีความทะเยอทะยานแบบเดียวกัน ไม่มีการติดต่อและความสัมพันธ์แบบเดียวกัน ไม่มีวิสัยทัศน์แบบเดียวกัน หรือความกล้าหาญที่จะเดิมพันครั้งใหญ่ในระยะยาว เราเคยเห็นสิ่งนี้ใน Apple, AMD, Intel และบริษัทอื่นๆ ดังนั้นหุ้นอาจจะถูกทุบลงบ้างจนกว่านักลงทุนจะเห็นเสถียรภาพและคำถามประเภท 'จะเกิดอะไรขึ้นถ้า' น้อยลง'"], "link": "https://www.theverge.com/tech/1033781/nvidia-jensen-huang-last-visionary-showman-founder-ceo", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2194622930.jpg?quality=90&amp;strip=all&amp;crop=0%2C13.348952787954%2C100%2C73.302094424093&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/IMG_4354.1419979390.webp?quality=90&amp;strip=all&amp;crop=0.48828125%2C0%2C99.0234375%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/2013-03-19_00-37-32verge.webp?quality=90&amp;strip=all&amp;crop=0.044642857142854%2C0%2C99.910714285714%2C100&amp;w=1200"], "published_th": "14 พ.ย. 2026 • 19:00 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/tech/1033781/nvidia-jensen-huang-last-visionary-showman-founder-ceo", "guid": "https://www.theverge.com/?p=1033781", "published_ts": 1794657600, "published_at": "2026-11-14T12:00:00Z", "videos": [], "review_score": "", "sub_tag": "TECH"}, {"id": 1794621511458, "original_title": "Amazon has a plan to index the world’s online shopping data", "thai_title": "Amazon ซุ่มวางแผนสร้างฐานข้อมูลสินค้าทั่วโลก หวังครองใจนักช้อปและ AI", "tag": "Technology", "bullet_points": ["Amazon กำลังพัฒนาโครงการ 'World Product Graph' เพื่อรวบรวมข้อมูลสินค้าทุกชนิดบนอินเทอร์เน็ต แม้จะเป็นสินค้าที่ไม่ได้วางขายบนแพลตฟอร์มของตนเองก็ตาม", "เป้าหมายหลักคือการดึงดูดผู้ใช้งานไม่ให้เปลี่ยนไปค้นหาข้อมูลสินค้าบน Reddit หรือ Google และทำให้ Amazon กลายเป็นจุดหมายปลายทางหลักสำหรับการช้อปปิ้ง", "โครงการนี้จะช่วยป้อนข้อมูลให้กับ AI Shopping Assistant อย่าง Rufus เพื่อแก้ปัญหาความไม่ถูกต้องของข้อมูลและลดต้นทุนในการประมวลผล", "Amazon อาจใช้วิธีการ Crawl ข้อมูลจากเว็บไซต์ของผู้ค้าปลีกรายอื่นเพื่อสร้างดัชนีสินค้าที่ครอบคลุมที่สุด", "บริษัทชี้แจงว่าเอกสารดังกล่าวเป็นเพียงแนวคิดเบื้องต้นและอาจไม่สะท้อนถึงแผนการดำเนินงานจริงในปัจจุบัน"], "full_paragraphs": ["การรวบรวมรายละเอียดของสินค้าทุกชิ้นที่วางจำหน่ายในทุกที่ มีจุดมุ่งหมายเพื่อทำให้ Amazon กลายเป็นเครื่องมือที่มีประโยชน์มากกว่า Reddit สำหรับผู้ใช้งานทั่วไปและตัวแทนปัญญาประดิษฐ์ (AI agents)", "รายงานจากสำนักข่าวรอยเตอร์ระบุว่า Amazon มีแผนที่จะสร้างคลังข้อมูลขนาดใหญ่ที่รวบรวมรายละเอียดของสินค้าทุกชนิดที่วางจำหน่ายบนอินเทอร์เน็ต แม้กระทั่งสินค้าที่ Amazon ไม่ได้วางจำหน่ายเอง โดยจะนำข้อมูลเหล่านี้มาแสดงผลผ่านเว็บไซต์ของตนเอง", "โครงการดังกล่าวมีชื่อว่า 'World Product Graph' ซึ่งถูกออกแบบมาเพื่อลดโอกาสที่นักช้อปจะออกจากแพลตฟอร์ม Amazon ไปค้นหาข้อมูลสินค้าบน Reddit หรือ Google และเพิ่มโอกาสที่ผู้ใช้งานจะจบการซื้อขายที่ Amazon แม้ว่าพวกเขาจะกำลังค้นหาสินค้าที่วางจำหน่ายในที่อื่นก็ตาม", "ในทำนองเดียวกัน สำหรับตัวแทน AI หาก Amazon มีคลังข้อมูลการช้อปปิ้งที่ใหญ่ที่สุด ตัวแทน AI เหล่านั้นอาจเลือกใช้ดัชนีสินค้าของ Amazon มากกว่าแหล่งข้อมูลอื่น ส่งผลให้ผู้ที่ช้อปปิ้งผ่านบอทก็จะเข้ามาใช้งานบนหน้าเว็บไซต์ของ Amazon ในที่สุด", "ปัจจุบัน ลิงก์ที่เชื่อมต่อไปยังสินค้าของผู้ค้าปลีกภายนอกเริ่มปรากฏบน Amazon แล้วผ่านฟีเจอร์ 'shop direct' ที่เปิดตัวไปเมื่อปีที่ผ่านมา นอกจากนี้ บริษัทยังมีผู้ช่วยช้อปปิ้ง AI ของตนเองที่ชื่อว่า Alexa for Shopping หรือที่รู้จักกันก่อนหน้านี้ในชื่อ Rufus", "โครงการ World Product Graph ยังมีเป้าหมายเพื่อแก้ไขปัญหาที่เกิดขึ้นกับระบบ AI โดยการจัดหาข้อมูลที่มากขึ้นให้กับระบบ ตามรายงานของรอยเตอร์ เอกสารภายในของ Amazon เกี่ยวกับโครงการนี้ระบุว่า 'คำตอบหลายอย่างของ Rufus นั้นผิดพลาดในเชิงข้อเท็จจริงหรือไม่สมบูรณ์' อีกทั้งการประมวลผลการค้นหาของลูกค้าบน Amazon ด้วย AI ยังมีค่าใช้จ่ายที่สูง", "การเพิ่มข้อมูลเข้าไปในระบบคาดว่าจะช่วยให้ระบบมีความแม่นยำมากขึ้น และสามารถใช้งานโมเดลที่มีต้นทุนต่ำลงได้", "อย่างไรก็ตาม ความเป็นไปได้ที่โครงการนี้จะเกิดขึ้นจริงยังคงมีความไม่แน่นอน เอกสารภายในระบุว่าโครงการนี้ 'ขึ้นอยู่กับการค้นพบวิธีการที่แบรนด์ต่างๆ จัดระเบียบสินค้าบนเว็บไซต์ของตนเอง' ซึ่งอาจเกี่ยวข้องกับการที่ Amazon ต้องเข้าไป Crawl ข้อมูลจากเว็บไซต์ของผู้ค้าปลีกรายอื่น", "รอยเตอร์กล่าวว่ายังไม่มีความชัดเจนว่า 'แผนนี้จะถูกนำมาใช้เมื่อใดหรืออย่างไร' แต่ในเอกสารดังกล่าวได้ระบุวันเปิดตัวโครงการไว้ในวันที่ 1 ตุลาคม 2027", "ทางด้าน Amazon ได้ออกแถลงการณ์ต่อรอยเตอร์ว่า 'เอกสารร่างที่ล้าสมัยมักจะให้ภาพที่ไม่สมบูรณ์ และการมีอยู่ของเอกสารระดมความคิดเช่นนี้ ไม่ได้สะท้อนถึงแผนการดำเนินงานในปัจจุบันของเราเสมอไป'"], "link": "https://www.theverge.com/tech/1033697/amazon-world-product-graph-ai-search", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/09/acastro_STK103__03.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200", "gallery_images": [], "published_th": "14 พ.ย. 2026 • 06:49 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/tech/1033697/amazon-world-product-graph-ai-search", "guid": "https://www.theverge.com/?p=1033697", "published_ts": 1794613751, "published_at": "2026-11-13T23:49:11Z", "videos": [], "review_score": "", "sub_tag": "TECH"}, {"id": 1794606565580, "original_title": "CMF’s milk carton-shaped Bluetooth speaker is down to a new low price", "thai_title": "ลำโพงบลูทูธทรงกล่องนมจาก CMF ปรับราคาลงสู่ระดับต่ำสุดใหม่ต้อนรับเทศกาล Black Friday", "tag": "Technology", "bullet_points": ["ลำโพงบลูทูธ CMF Speaker S ดีไซน์แปลกตาคล้ายกล่องนม ปรับลดราคาเหลือเพียง 39 ดอลลาร์สหรัฐ", "เป็นการลดราคาครั้งใหญ่ถึง 20 ดอลลาร์สหรัฐ ซึ่งถือเป็นราคาที่ต่ำที่สุดนับตั้งแต่เปิดตัวเมื่อเดือนที่แล้ว", "CMF Speaker M รุ่นพี่ขนาดใหญ่กว่า ก็มีการปรับลดราคาลงเช่นกันเหลือ 79 ดอลลาร์สหรัฐ (ลดไป 30 ดอลลาร์สหรัฐ)", "ตัวลำโพงโดดเด่นด้วยมาตรฐานกันน้ำกันฝุ่น IP68 และแบตเตอรี่ที่ใช้งานได้ยาวนานสูงสุดถึง 18 ชั่วโมง", "รองรับการปรับแต่งรูปลักษณ์ด้วยการเปลี่ยนหน้ากากลำโพง และเตรียมเปิดให้ผู้ใช้พิมพ์ชิ้นส่วนเสริมเองผ่านเครื่องพิมพ์ 3 มิติ"], "full_paragraphs": ["ลำโพงบลูทูธขนาดกะทัดรัดที่มีดีไซน์โดดเด่นไม่เหมือนใครจากแบรนด์ Nothing ซึ่งเพิ่งเปิดตัวไปเมื่อเดือนตุลาคมที่ผ่านมา ได้เริ่มวางจำหน่ายในราคาพิเศษแล้วก่อนที่จะถึงเทศกาล Black Friday", "โดยปกติแล้วลำโพงบลูทูธในท้องตลาดมักจะเป็นเพียงกล่องสี่เหลี่ยมสีพื้นธรรมดา แต่ไม่ใช่กับรุ่นนี้ ซึ่งเป็นส่วนหนึ่งของโปรโมชันต้อนรับเทศกาล Black Friday ของ Nothing โดยคุณสามารถเป็นเจ้าของ CMF Speaker S ลำโพงไร้สายดีไซน์แปลกใหม่รูปทรงกล่องนมได้ผ่านทาง Amazon และเว็บไซต์ของ Nothing ในราคาเพียง 39 ดอลลาร์สหรัฐเท่านั้น", "ราคาดังกล่าวถือเป็นการลดราคาลงถึง 20 ดอลลาร์สหรัฐ และเป็นราคาที่ต่ำที่สุดเท่าที่เคยมีการบันทึกไว้สำหรับลำโพงไร้สายรุ่นใหม่ล่าสุดของ Nothing ซึ่งเพิ่งออกวางจำหน่ายสู่ตลาดได้เพียงประมาณหนึ่งเดือนเท่านั้น", "สำหรับ CMF Speaker S นั้นเป็นรุ่นที่มีขนาดเล็กกว่าในบรรดาลำโพงสองรุ่นที่เพิ่งเปิดตัวไป โดยในรุ่นพี่ที่มีขนาดใหญ่กว่าอย่าง Series M
