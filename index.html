s": ["Koei Tecmo และ Omega Force ปล่อยวิดีโอเกมเพลย์ความยาว 11 นาทีของเกม Attack on Titan 3", "เนื้อหาในคลิปเน้นการโชว์ระบบปฏิสัมพันธ์ระหว่างตัวละคร (Character Interactions) และภารกิจการสำรวจพื้นที่นอกกำแพง (Expeditions Beyond the Walls)", "เกมยังคงพัฒนาโดยทีมงาน Omega Force ซึ่งเป็นผู้เชี่ยวชาญด้านเกมแนวแอ็กชันสไตล์ Musou"], "full_paragraphs": ["Koei Tecmo ผู้จัดจำหน่ายเกมชื่อดัง ร่วมกับทีมพัฒนา Omega Force ได้ทำการปล่อยวิดีโอเกมเพลย์ชุดใหม่ล่าสุดของเกม Attack on Titan 3 โดยมีความยาวรวมกว่า 11 นาที เพื่อให้แฟนเกมได้เห็นภาพรวมของระบบการเล่นที่ได้รับการพัฒนาขึ้นใหม่", "ในวิดีโอดังกล่าวได้เผยให้เห็นรายละเอียดของระบบปฏิสัมพันธ์ระหว่างตัวละคร (Character Interactions) ที่ลึกซึ้งยิ่งขึ้น ซึ่งจะส่งผลต่อความสัมพันธ์และเนื้อเรื่องภายในเกม นอกจากนี้ยังมีการโชว์ระบบการสำรวจพื้นที่นอกกำแพง (Expeditions Beyond the Walls) ซึ่งเป็นหัวใจสำคัญของเกมภาคนี้ โดยผู้เล่นจะได้เผชิญหน้ากับเหล่าไททันในสภาพแวดล้อมที่กว้างขวางและท้าทายกว่าเดิม", "สำหรับเกม Attack on Titan 3 นี้ ยังคงได้รับการพัฒนาโดย Omega Force ทีมงานที่ฝากผลงานไว้กับเกมแนวแอ็กชันชื่อดังมากมาย โดยตัวเกมมุ่งเน้นการถ่ายทอดประสบการณ์การต่อสู้ที่รวดเร็วและตื่นเต้นตามแบบฉบับของอนิเมะต้นฉบับ ทั้งนี้แฟนเกมสามารถติดตามรายละเอียดเพิ่มเติมเกี่ยวกับกำหนดการวางจำหน่ายและแพลตฟอร์มที่จะรองรับได้ในเร็วๆ นี้"], "link": "https://www.gematsu.com/2026/11/attack-on-titan-3-character-interactions-and-expeditions-beyond-the-walls-gameplay", "cover_image_url": "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200&q=80", "published_th": "13 พ.ย. 2026 • 01:15 น.", "category_hint": "Gaming"}, {"id": 1794553890352, "original_title": "Wolfenstein 3 announced", "thai_title": "Bethesda และ MachineGames ยืนยันการพัฒนา Wolfenstein 3 อย่างเป็นทางการ", "tag": "Gaming", "bullet_points": ["Bethesda Softworks และทีมพัฒนา MachineGames ประกาศยืนยันว่า Wolfenstein 3 กำลังอยู่ในขั้นตอนการผลิต", "การประกาศดังกล่าวเป็นการยืนยันถึงการสานต่อแฟรนไชส์เกมยิงมุมมองบุคคลที่หนึ่งระดับตำนาน", "ยังไม่มีการเปิดเผยรายละเอียดด้านเนื้อเรื่อง วันวางจำหน่าย หรือแพลตฟอ itle": "Cook, Serve, Delicious: Re-Mustard! เตรียมวางจำหน่ายบน PC 18 มกราคม 2027 ก่อนลงคอนโซลภายหลังในปีเดียวกัน", "tag": "Gaming", "bullet_points": ["Cook, Serve, Delicious: Re-Mustard! เป็นเวอร์ชันรีเมคที่ปรับปรุงใหม่จากเกมต้นฉบับ Cook, Serve, Delicious!", "กำหนดการวางจำหน่ายบนแพลตฟอร์ม PC คือวันที่ 18 มกราคม 2027", "สำหรับเวอร์ชันคอนโซลมีแผนจะวางจำหน่ายตามมาในช่วงปลายปี 2027"], "full_paragraphs": ["Vertigo Gaming ได้ประกาศเปิดตัว Cook, Serve, Delicious: Re-Mustard! ซึ่งเป็นการนำเกมทำอาหารสุดคลาสสิกที่เคยสร้างชื่อเสียงมาปรับปรุงใหม่ทั้งหมด โดยตัวเกมจะยังคงความสนุกในรูปแบบการบริหารจัดการร้านอาหารที่รวดเร็วและท้าทาย แต่จะมีการยกระดับกราฟิกและระบบการเล่นให้ทันสมัยยิ่งขึ้นเพื่อตอบโจทย์ผู้เล่นในยุคปัจจุบัน", "สำหรับกำหนดการวางจำหน่ายอย่างเป็นทางการนั้น ผู้เล่นบนแพลตฟอร์ม PC จะได้สัมผัสตัวเกมก่อนในวันที่ 18 มกราคม 2027 ผ่านช่องทางดิจิทัลสโตร์หลัก ซึ่งถือเป็นการกลับมาอีกครั้งของเกมที่แฟนๆ แนวจำลองสถานการณ์ (Simulation) ต่างเฝ้ารอคอยหลังจากที่เกมภาคแรกได้รับความนิยมอย่างสูงในอดีต", "ในส่วนของเวอร์ชันคอนโซล ทางผู้พัฒนายืนยันว่าจะมีการพอร์ตลงสู่เครื่องเกมต่างๆ ตามมาภายหลังภายในปี 2027 เช่นกัน โดยรายละเอียดเพิ่มเติมเกี่ยวกับฟีเจอร์ใหม่ๆ และรายชื่อแพลตฟอร์มคอนโซลที่จะรองรับนั้น จะมีการเปิดเผยข้อมูลให้ทราบเพิ่มเติมในระยะเวลาใกล้เคียงกับวันวางจำหน่ายอีกครั้ง"], "link": "https://www.gematsu.com/2026/11/cook-serve-delicious-re-mustard-launches-january-18-2027-for-pc-later-in-2027-for-consoles", "cover_image_url": "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200&q=80", "published_th": "12 พ.ย. 2026 • 18:17 น.", "category_hint": "Gaming"}, {"id": 1794553890364, "original_title": "Halo: Campaign Evolved ‘Firefight’ update announced", "thai_title": "Halo Studios ประกาศอัปเดตโหมด Firefight ครั้งใหญ่ใน Halo: Combat Evolved", "tag": "Gaming", "bullet_points": ["Halo Studios เปิดตัวอัปเดตใหม่สำหรับ Halo: Combat Evolved เพิ่มโหมด Firefight ที่แฟนเกมรอคอย", "การอัปเดตนี้เป็นเนื้อหาฟรีสำหรับผู้เล่นทุกคน โดยมุ่งเน้นการนำประสบการณ์การต่อสู้แบบ Co-op มาสู่ภาคต้นฉบับ", "โหมด ่องจากสัญญาฉบับปัจจุบันกำลังจะสิ้นสุดลงในช่วงซัมเมอร์หน้า แม้ว่าเขาจะได้รับการยกย่องให้เป็นหนึ่งในเซ็นเตอร์ฮาล์ฟที่ดีที่สุดในประวัติศาสตร์ของสโมสรเคียงคู่กับ อลัน แฮนเซน แต่คำถามสำคัญในขณะนี้คือเขาจะเลือกปิดฉากอาชีพการค้าแข้งที่แอนฟิลด์เหมือนกับตำนานรุ่นพี่หรือไม่", "ในฤดูกาลนี้ ฟาน ไดจ์ค ยังคงรักษามาตรฐานการเล่นได้อย่างยอดเยี่ยม โดยมีสถิติลงเล่นครบทุกนาทีในพรีเมียร์ลีกนับตั้งแต่เริ่มต้นฤดูกาลที่แล้ว และกำลังสร้างความร่วมมือในแนวรับกับ เจเรมี จาเกต์ กองหลังรายใหม่ที่ย้ายเข้ามาในช่วงซัมเมอร์ แม้จะมีอาการบาดเจ็บรบกวนเล็กน้อยจนต้องถอนตัวจากทีมชาติเนเธอร์แลนด์ในช่วงเบรกทีมชาติล่าสุด แต่สถานการณ์ดังกล่าวไม่ได้เป็นที่น่ากังวลแต่อย่างใด", "ฟาน ไดจ์ค ได้ให้สัมภาษณ์กับผู้สื่อข่าวที่สนามเซลเฮิร์สต์พาร์กเกี่ยวกับสถานการณ์สัญญาของเขาว่า 'เราต้องรอดูกันว่าฤดูกาลนี้จะนำพาอะไรมาให้ ผมมีช่วงเวลาที่ยอดเยี่ยมมาโดยตลอด หากมีการขยายสัญญาออกไปก็เป็นเรื่องที่ดี แต่หากไม่เป็นเช่นนั้น ผมก็จะย้ายไปที่อื่น' ซึ่งสะท้อนให้เห็นถึงความใจเย็นของนักเตะเช่นเดียวกับเหตุการณ์ที่เคยเกิดขึ้นเมื่อสองปีก่อน ก่อนที่เขาจะตัดสินใจเซ็นสัญญาฉบับใหม่ในเวลาต่อมา", "นอกเหนือจากบทบาทในสนามแล้ว ฟาน ไดจ์ค ยังคงเป็นผู้นำคนสำคัญของทีมลิเวอร์พูล โดยเขามีส่วนสำคัญในการสร้างวัฒนธรรมองค์กร เช่น การเสนอให้เพื่อนร่วมทีมไปเยี่ยมชมพิพิธภัณฑ์ของสโมสรเพื่อเรียนรู้ประวัติศาสตร์ของลิเวอร์พูล ทั้งนี้ ทั้งตัวนักเตะและสโมสรต่างมีหน้าที่ต้องตัดสินใจครั้งสำคัญร่วมกันในอนาคตอันใกล้นี้ เพื่อกำหนดทิศทางของทั้งสองฝ่ายต่อไป"], "link": "https://www.bbc.co.uk/sport/football/articles/ck4gnd2pgd06o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/87f4/live/e4ed5c50-ddeb-11f1-9204-cdcddf7d901c.jpg", "published_at": "2026-11-12 23:57 UTC", "category_hint": "Football", "published_th": "2026-11-12 23:57 เวลาไทย"}, {"id": 1794553392985, "original_title": "Leader, role model, extraordinary - how Kane's 'fairytale' came true", "thai_title": "แฮร์รี เคน สร้างประวัติศาสตร์ลงเล่นให้ทีมชาติอังกฤษสูงสุดตลอดกาล", "tag": "Football", "bullet_points": ["แฮร์รี เคน ทำสถิติลงเล่นให้ทีมชาติอังกฤษสูงสุดตลอดกาลที่ 126 นัด แซงหน้าสถิติเดิมของ ปีเตอร์ ชิลตัน", "เคนทำประตูที่ 92 ในนามทีมชาติจากลูกจุดโทษในเกมที่เอาชนะโครเอเชีย 2-1 ในศึกเนชันส์ลีก", "เส้นทางในทีมชาติของเคนเริ่มต้นขึ้นในปี 2015 โดยทำประตูได้ตั้งแต่นาทีแรกที่ลงประเดิมสนาม"], "full_paragraphs": ["แฮร์รี เคน กองหน้าวัย 33 ปี สร้างประวัติศาสตร์หน้าใหม่ให้กับทีมชาติอังกฤษด้วยการลงสนามเป็นนัดที่ 126 ในเกมเนชันส์ลีกที่พบกับโครเอเชีย ณ สนามเวมบลีย์ เมื่อวันพฤหัสบดีที่ผ่านมา ส่งผลให้เขากลายเป็นนักเตะชายที่ลงเล่นให้ทัพ 'สิงโตคำราม' มากที่สุดตลอดกาล ทำลายสถิติเดิมของ ปีเตอร์ ชิลตัน อดีตผู้รักษาประตูระดับตำนานที่เคยทำไว้ 125 นัด ในช่วงปี 1970 ถึง 1990", "ก่อนเริ่มการแข่งขัน ปีเตอร์ ชิลตัน ได้เข้าร่วมพิธีมอบเสื้อทีมชาติอังกฤษแบบพิเศษเพื่อเป็นเกียรติแก่เคน โดยในเกมดังกล่าว เคนยังคงรักษามาตรฐานการทำประตูด้วยการยิงจุดโทษช่วยให้ทีมเอาชนะโครเอเชียไปได้ 2-1 ซึ่งนับเป็นประตูที่ 92 ของเขาในนามทีมชาติ โดยย้อนกลับไปเมื่อปี 2015 รอย ฮอดจ์สัน อดีตผู้จัดการทีมชาติอังกฤษเคยกล่าวชื่นชมเคนตั้งแต่นัดประเดิมสนามที่เจ้าตัวใช้เวลาเพียง 79 วินาทีในการทำประตูแรกในฐานะนักเตะทีมชาติชุดใหญ่", "เคนได้กล่าวถึงความสำเร็จครั้งนี้ว่า ตนเองให้ความสำคัญกับผลงานของทีมมากกว่าสถิติส่วนตัว และมีความมุ่งมั่นเสมอในการเข้าแคมป์เก็บตัวรวมถึงการลงเล่นทุกนัดเพื่อเป็นตัวแทนของประเทศให้ดีที่สุด ตลอดระยะเวลาที่ผ่านมา เคนผ่านประสบการณ์ทั้งสุขและเศร้ากับทีมชาติ ทั้งความผิดหวังจากการพลาดจุดโทษในฟุตบอลโลก 2022 รอบก่อนรองชนะเลิศที่พ่ายต่อฝรั่งเศส ไปจนถึงช่วงเวลาที่น่าจดจำอย่างการร่วมฉลองชัยชนะกับแฟนบอลในฟุตบอลโลกช่วงฤดูร้อนที่ผ่านมา", "จากเด็กหนุ่มที่เติบโตในย่านชิงฟอร์ดสู่การเป็นกัปตันทีมชาติและเจ้าของสถิติดาวซัลโวสูงสุดตลอดกาลของอังกฤษ เส้นทางของเคนถือเป็นบทพิสูจน์ถึงความเป็นมืออาชีพและความทุ่มเทที่มีต่อทีมชาติมาอย่างยาวนานกว่า 11 ปี โดยสถิติการลงเล่นและจำนวนประตูที่เพิ่มขึ้นอย่างต่อเนื่องนี้ ตอกย้ำถึงสถานะของเขาในฐานะผู้นำและแบบอย่างของนักฟุตบอลในยุคปัจจุบัน"], "link": "https://www.bbc.co.uk/sport/football/articles/c60qkdj4lp34o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/f61b/live/a5f54890-ded2-11f1-86d5-71a9f29d1c99.jpg", "published_at": "2026-11-12 12:53 UTC", "category_hint": "Football", "published_th": "2026-11-12 12:53 เวลาไทย"}, {"id": 1794553392986, "original_title": "Goodwillie prosecutors 'wrong' not to put footballer on trial for rape, court hears", "thai_title": "ทนายความผู้เสียหายยื่นฟ้องต่อศาลอุทธรณ์คดีอาญา กรณีอัยการไม่สั่งฟ้อง David Goodwillie คดีข่มขืน", "tag": "Football", "bullet_points": ["ทนายความของ Denise Clair ยื่นคำร้องต่อศาลอุทธรณ์คดีอาญาในเอดินบะระ เพื่อขออนุญาตดำเนินคดีแบบส่วนตัว (Private Prosecution) ต่อ David Goodwillie", "คดีนี้สืบเนื่องจากเหตุการณ์ในปี 2011 ซึ่งศาลแพ่งเคยตัดสินในปี 2017 ว่า Goodwillie และ David Robertson ได้ทำการข่มขืนผู้เสียหายจริง", "ฝ่ายโจทก์โต้แย้งว่าอัยการตัดสินใจผิดพลาดที่สั่งไม่ฟ้องคดีอาญา โดยอ้างว่ามีหลักฐานเพียงพอที่จะนำไปสู่การตัดสินลงโทษได้"], "full_paragraphs": ["ทนายความของ Denise Clair ผู้เสียหายจากเหตุการณ์ที่เกี่ยวข้องกับ David Goodwillie อดีตนักฟุตบอลทีมชาติสกอตแลนด์ ได้ยื่นคำร้องต่อศาลอุทธรณ์คดีอาญาในเมืองเอดินบะระ เพื่อขออนุญาตดำเนินคดีแบบส่วนตัว (Private Prosecution) หลังจากที่สำนักงานอัยการ (Crown Office) ตัดสินใจไม่สั่งฟ้องคดีอาญาในอดีตโดยอ้างว่ามีหลักฐานไม่เพียงพอ", "เหตุการณ์ดังกล่าวเกิดขึ้นในเดือนมกราคม ปี 2011 ที่อพาร์ตเมนต์แห่งหนึ่งใน Armadale เขต West Lothian โดยมี David Goodwillie และ David Robertson เพื่อนร่วมทีม Dundee United ในขณะนั้นเป็นผู้ถูกกล่าวหา ต่อมาในปี 2017 ศาลแพ่งได้มีคำตัดสินว่าทั้งสองคนได้ทำการข่มขืนผู้เสียหายจริง อย่างไรก็ตาม ฝ่ายอัยการยังคงยืนยันว่าการตัดสินใจไม่สั่งฟ้องในขณะนั้นมีความถูกต้องตามกระบวนการพิจารณาหลักฐานที่มีอยู่ทั้งหมด", "Thomas Ross KC ทนายความของผู้เสียหายกล่าวต่อหน้าคณะผู้พิพากษาว่า การตัดสินใจของอัยการถือเป็นเรื่องที่ไม่มีเหตุผลรองรับ (Irrational) โดยระบุว่ามีหลักฐานเพียงพอที่จะดำเนินคดีและมีโอกาสสูงที่จะได้รับคำตัดสินว่ามีความผิด นอกจากนี้ Ross ยังตั้งข้อสังเกตว่าสำนักงานอัยการต้องพิจารณารายงานคดีอาญาจำนวน 150,000 ถึง 200,000 คดีต่อปี ซึ่งอาจนำไปสู่ความผิดพลาดในการคัดเลือกคดีเพื่อดำเนินคดีอาญาได้", "ในขณะที่ Alan Cameron KC ตัวแทนจากฝั่งอัยการได้โต้แย้งต่อศาลว่า การตัดสินใจของอัยการในขณะนั้นมีความเหมาะสมและถูกต้องตามหลักการแล้ว โดยยืนยันว่าเมื่อพิจารณาจากพยานหลักฐานทั้งหมดที่มีในขณะนั้น อัยการมีสิทธิ์โดยชอบธรรมที่จะไม่นำคดีนี้เข้าสู่กระบวนการพิจารณาในศาลอาญา ซึ่งในขณะนี้ศาลกำลังพิจารณาคำร้องเพื่อตัดสินว่าจะอนุญาตให้มีการดำเนินคดีแบบส่วนตัวต่อไปหรือไม่"], "link": "https://www.bbc.co.uk/news/articles/c6z9dppxxyxpo?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_news/1200/cpsprodpb/624c/live/20082b60-deb1-11f1-8fb5-a771a656a227.jpg", "published_at": "2026-11-12 10:31 UTC", "category_hint": "Football", "published_th": "2026-11-12 10:31 เวลาไทย"}, {"id": 1794553392987, "original_title": "Crystal Palace sack boss Sage after 16 games", "thai_title": "คริสตัล พาเลซ ประกาศปลด ปิแอร์ เซจ พ้นตำแหน่งผู้จัดการทีมหลังคุมทัพได้เพียง 16 นัด", "tag": "Football", "bullet_points": ["คริสตัล พาเลซ ปลด ปิแอร์ เซจ ออกจากตำแหน่งผู้จัดการทีม หลังทำผลงานได้เพียง 16 นัดในระยะเวลา 5 เดือน", "สโมสรปัจจุบันรั้งอันดับสุดท้ายของตารางคะแนนพรีเมียร์ลีก โดยแพ้ติดต่อกันมา 4 นัดและเสียประตูไปแล้ว 24 ลูก", "โธมัส แฟรงค์ อดีตผู้จัดการทีมเบรนท์ฟอร์ดและท็อตแนม ฮอตสเปอร์ กำลังอยู่ในขั้นตอนการเจรจาเพื่อเข้ามารับตำแหน่งแทน", "ปิแอร์ เซจ เป็นผู้จัดการทีมรายที่สองในพรีเมียร์ลีกที่ถูกปลดในฤดูกาลนี้ ต่อจาก ไมเคิล คาร์ริค ของแมนเชสเตอร์ ยูไนเต็ด"], "full_paragraphs": ["สโมสรคริสตัล พาเลซ ตัดสินใจแยกทางกับ ปิแอร์ เซจ ผู้จัดการทีมชาวฝรั่งเศสอย่างเป็นทางการ หลังเข้ามารับตำแหน่งได้เพียง 5 เดือน โดยผลงานล่าสุดคือการพ่ายแพ้ต่อลิเวอร์พูล 3-1 เมื่อวันอาทิตย์ที่ผ่านมา ซึ่งถือเป็นความพ่ายแพ้ในพรีเมียร์ลีกนัดที่ 4 ติดต่อกัน ส่งผลให้ทีมหล่นไปอยู่อันดับสุดท้ายของตารางคะแนน", "สถิติของทีมภายใต้การคุมทัพของ เซจ ในฤดูกาลนี้ถือว่าน่ากังวล โดยทีมชนะเพียง 2 นัดจากการลงเล่น 10 นัดแรกในลีก นอกจากนี้ยังมีสถิติเกมรับที่แย่ที่สุดในลีกด้วยการเสียไปถึง 24 ประตู ส่วนในรายการยูโรปาลีก คริสตัล พาเลซ รั้งอันดับที่ 21 จากทั้งหมด 36 ทีม โดยเก็บชัยชนะได้เพียงนัดเดียวจากการลงสนาม 4 นัด", "นอกจากการปลด ปิแอร์ เซจ แล้ว สโมสรยังได้ประกาศแยกทางกับทีมงานสตาฟฟ์โค้ชอีก 3 ราย ได้แก่ จามาล อาลีอุย, เดเมียน เดลลา ซานตา และ แซนดี้ กีชาร์ด โดยทางสโมสรได้ออกแถลงการณ์ขอบคุณทีมงานทุกคนสำหรับความทุ่มเทในช่วงเวลาที่ผ่านมา และขอให้ทุกคนโชคดีกับเส้นทางในอนาคต", "สำหรับกระบวนการสรรหาผู้จัดการทีมคนใหม่ สโมสรระบุว่าจะมีการแจ้งความคืบหน้าให้ทราบในลำดับถัดไป โดยในขณะนี้ โธมัส แฟรงค์ อดีตผู้จัดการทีมเบรนท์ฟอร์ดและท็อตแนม ฮอตสเปอร์ ตกเป็นข่าวว่ากำลังอยู่ในขั้นตอนการเจรจาขั้นสูงเพื่อเข้ามารับงานต่อ ทั้งนี้ ปิแอร์ เซจ วัย 47 ปี ได้รับการแต่งตั้งเข้ามาคุมทีมด้วยสัญญา 3 ปีเมื่อเดือนมิถุนายนที่ผ่านมา แทนที่ โอลิเวอร์ กลาสเนอร์ ที่อำลาทีมไปหลังจบฤดูกาลก่อน"], "link": "https://www.bbc.co.uk/sport/football/articles/cv5y18lkk87do?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/73af/live/be720480-de96-11f1-9afe-1f03bfe02283.jpg", "published_at": "2026-11-12 10:15 UTC", "category_hint": "Football", "published_th": "2026-11-12 10:15 เวลาไทย"}, {"id": 1794553392988, "original_title": "Owono undecided over future following De Miguel death", "thai_title": "โอโวโน ผู้รักษาประตู FC Andorra ยังไม่ตัดสินใจเรื่องอนาคตหลังการเสียชีวิตของ เฆซุส เด มิเกล", "tag": "Football", "bullet_points": ["เฆซุส โอโวโน ผู้รักษาประตูวัย 25 ปี ยังไม่ได้ตัดสินใจว่าจะกลับมาลงเล่นฟุตบอลอีกครั้งหรือไม่ หลังเกิดเหตุปะทะกับ เฆซุส เด มิเกล ในการแข่งขันฟุตบอลลีกรองของสเปน", "เฆซุส เด มิเกล กองหน้าของ Tenerife เสียชีวิตที่โรงพยาบาลในวันถัดจากเหตุการณ์ปะทะเมื่อวันที่ 2 พฤศจิกายน", "ครอบครัวของ เด มิเกล ได้รับเงินบริจาคผ่านแคมเปญระดมทุนที่จัดตั้งโดย ฟราน โซล ซึ่งมียอดรวมเกินกว่า 170,000 ปอนด์แล้ว"], "full_paragraphs": ["คาร์เลส มานโซ ผู้จัดการทีม FC Andorra เปิดเผยว่า เฆซุส โอโวโน ผู้รักษาประตูของทีมยังคงอยู่ในช่วงตัดสินใจเกี่ยวกับอนาคตในอาชีพนักฟุตบอล หลังจากเหตุการณ์การเสียชีวิตของ เฆซุส เด มิเกล กองหน้าจากสโมสร Tenerife โดยในขณะนี้โอโวโนกำลังใช้เวลาอยู่กับครอบครัวและทางสโมสรยืนยันว่าจะให้พื้นที่ส่วนตัวแก่เขาอย่างเต็มที่ในการตัดสินใจว่าจะกลับมาลงสนามอีกครั้งเมื่อใดหรือจะตัดสินใจอย่างไร", "เหตุการณ์ดังกล่าวเกิดขึ้นระหว่างการแข่งขันฟุตบอลลีกรองของสเปนเมื่อวันที่ 2 พฤศจิกายน โดยโอโวโนได้รับใบแดงจากการปะทะกับ เด มิเกล ก่อนที่กองหน้าผู้นี้จะเสียชีวิตที่โรงพยาบาลในวันถัดมา ทั้งนี้ โอโวโน ซึ่งเป็นผู้รักษาประตูทีมชาติอิเควทอเรียลกินีที่มีสถิติลงเล่น 47 นัด ได้ออกแถลงการณ์ผ่านสโมสรเมื่อวันที่ 4 พฤศจิกายน โดยระบุว่าเป็นช่วงเวลาที่ยากลำบากที่สุดในชีวิตและแสดงความเสียใจอย่างสุดซึ้งต่อการจากไปของ เด มิเกล", "คาร์เลส มานโซ กล่าวถึงแนวทางของสโมสรว่า สิ่งที่สำคัญที่สุดในขณะนี้คือการสนับสนุนโอโวโนในทุกด้านและอยู่เคียงข้างเขา โดยสโมสรจะไม่กดดันและจะรอให้เจ้าตัวรู้สึกพร้อมอย่างแท้จริงในการตัดสินใจเรื่องอนาคตของตนเอง ซึ่งถือเป็นสิทธิส่วนบุคคลที่ทางสโมสรให้ความเคารพอย่างเต็มที่", "ในส่วนของครอบครัว เฆซุส เด มิเกล ได้ออกแถลงการณ์ผ่านสมาคมนักฟุตบอลอาชีพของสเปนเพื่อขอบคุณผู้ที่ร่วมบริจาคเงินผ่านแคมเปญระดมทุนที่จัดตั้งโดย ฟราน โซล กองหน้าจากสโมสร Hercules ในลีกระดับสามของสเปน โดยยอดเงินบริจาคในขณะนี้มีมูลค่าเกินกว่า 170,000 ปอนด์ ซึ่งเงินทั้งหมดจะถูกส่งมอบให้กับญาติของ เด มิเกล เพื่อเป็นการช่วยเหลือและแสดงความเสียใจต่อเหตุการณ์ที่เกิดขึ้น"], "link": "https://www.bbc.co.uk/sport/football/articles/ckedq01zve04o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/3166/live/efcf2c80-dea8-11f1-98eb-79ee6ea9ba56.jpg", "published_at": "2026-11-12 09:41 UTC", "category_hint": "Football", "published_th": "2026-11-12 09:41 เวลาไทย"}, {"id": 1794553392989, "original_title": "Wilson and Miller score as Scotland U21s thump Ukraine", "thai_title": "ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี เอาชนะยูเครน 4-0 ในเกมกระชับมิตร", "tag": "Football", "bullet_points": ["ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี เอาชนะทีมชาติยูเครน 4-0 ในการแข่งขันกระชับมิตรที่สนาม Pinatar Arena ประเทศสเปน", "James Wilson ทำคนเดียว 2 ประตู ขณะที่ Lennon Miller และ Alfie Stewart ทำได้คนละ 1 ประตู", "ผู้เล่นอย่าง Wilson และ Miller ซึ่งเคยถูกเรียกตัวติดทีมชาติชุดใหญ่ กลับมาลงสนามให้ทีมชุด U21 ในนัดนี้", "ทีมของกุนซือ Tony Docherty มีโปรแกรมการแข่งขันนัดถัดไปกับทีมชาติสหรัฐอเมริกาในวันอาทิตย์นี้"], "full_paragraphs": ["ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี ประสบความสำเร็จในการแข่งขันฟุตบอลกระชับมิตรที่สนาม Pinatar Arena ในประเทศสเปน โดยสามารถเอาชนะทีมชาติยูเครนไปได้ด้วยสกอร์ 4-0 ซึ่งในเกมนี้มีผู้เล่นที่เคยผ่านการติดทีมชาติชุดใหญ่มาแล้วอย่าง James Wilson และ Lennon Miller ลงสนามช่วยทีมด้วย", "ประตูแรกของเกมเกิดขึ้นในนาทีที่ 23 จากความผิดพลาดในแนวรับของยูเครน ทำให้ Lennon Miller กองกลางจากสโมสร Udinese ฉวยโอกาสยิงประตูขึ้นนำให้สกอตแลนด์ จากนั้นก่อนหมดเวลาครึ่งแรก James Wilson กองหน้าจากสโมสร Heart of Midlothian ได้โหม่งทำประตูที่สองจากการเปิดลูกฟรีคิกของ Tyler Fletcher", "ในครึ่งหลัง สกอตแลนด์ยังคงทำผลงานได้ดีต่อเนื่อง โดยในนาทีที่ 58 Miller เป็นผู้จ่ายบอลให้ Wilson ทำประตูที่สองของตัวเองในเกมนี้ ก่อนที่ Alfie Stewart กองกลางจากสโมสร Aberdeen ซึ่งปัจจุบันถูกปล่อยยืมตัวไปอยู่กับ Inverness Caledonian Thistle จะมายิงประตูปิดท้ายในนาทีที่ 70 ทำให้สกอตแลนด์เอาชนะไปได้ด้วยผลต่าง 4 ประตู", "การแข่งขันนัดนี้ถือเป็นการเตรียมความพร้อมของทีมภายใต้การคุมทัพของ Tony Docherty เพื่อปรับจูนผู้เล่นชุดใหม่สำหรับการแข่งขันรอบคัดเลือก โดยหลังจากจบเกมนี้ ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี มีกำหนดการลงสนามพบกับทีมชาติสหรัฐอเมริกาที่สนามแห่งเดิมในวันอาทิตย์นี้"], "link": "https://www.bbc.co.uk/sport/football/articles/cmregjjnr1wno?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/43c4/live/a33cf770-deb3-11f1-8fb5-a771a656a227.jpg", "published_at": "2026-11-12 09:29 UTC", "category_hint": "Football", "published_th": "2026-11-12 09:29 เวลาไทย"}, {"id": 1794553392990, "original_title": "How Pochettino came on Man Utd's radar - and what Carrick was told when", "thai_title": "เบื้องหลังการปลด Michael Carrick และความสนใจของ Manchester United ที่มีต่อ Mauricio Pochettino", "tag": "Football", "bullet_points": ["Manchester United ตัดสินใจปลด Michael Carrick ออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังผลงานของทีมตกต่ำลงอย่างต่อเนื่อง", "สโมสรรับทราบเงื่อนไขค่าฉีกสัญญาของ Mauricio Pochettino กับทีมชาติสหรัฐอเมริกาที่มีมูลค่า 10 ล้านดอลลาร์สหรัฐ (ประมาณ 7 ล้านปอนด์)", "ผู้บริหารของสโมสรได้มีการแจ้งเตือนตัวแทนของ Carrick ล่วงหน้าก่อนการตัดสินใจปลดอย่างเป็นทางการ"], "full_paragraphs": ["สถานการณ์ภายในสโมสร Manchester United ทวีความตึงเครียดขึ้นเมื่อ Michael Carrick ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน โดยก่อนหน้านี้มีกระแสข่าวการเปลี่ยนแปลงตัวกุนซืออย่างหนาหู ซึ่งตัวของ Carrick และตัวแทนได้รับสัญญาณที่ชัดเจนจากสโมสรถึงอนาคตที่ไม่แน่นอนของเขา", "เมื่อวันจันทร์ที่ผ่านมา Omar Berrada ประธานเจ้าหน้าที่บริหารของสโมสร ได้ติดต่อตัวแทนของ Carrick เพื่อแจ้งว่าเขาและ Jason Wilcox ผู้อำนวยการฟุตบอล จะเดินทางไปพบกับ Sir Jim Ratcliffe เจ้าของร่วมที่โมนาโก เพื่อหารือเกี่ยวกับอนาคตของหัวหน้าผู้ฝึกสอน ก่อนที่ในวันถัดมา Wilcox จะมีการสนทนาในลักษณะเดียวกันกับ Carrick โดยเป็นการสื่อสารว่าสโมสรจะมีการตัดสินใจเกี่ยวกับสถานะการทำงานของเขาในที่สุด", "ในระหว่างช่วงเวลาดังกล่าว Manchester United ได้รับทราบข้อมูลเกี่ยวกับเงื่อนไขค่าฉีกสัญญา (Release Clause) ของ Mauricio Pochettino ซึ่งปัจจุบันดำรงตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา โดยมีมูลค่าอยู่ที่ 10 ล้านดอลลาร์สหรัฐ หรือประมาณ 7 ล้านปอนด์ ซึ่งแหล่งข่าวระบุว่าตัวแทนของ Pochettino เป็นผู้ให้ข้อมูลดังกล่าวแก่สโมสรในพรีเมียร์ลีกเอง", "แม้จะมีความรู้สึกเสียดายจากภายในสโมสรที่กระบวนการปลด Carrick กลายเป็นประเด็นสาธารณะ แต่ผู้บริหารมองว่าการรักษาความลับในสโมสรระดับนี้เป็นเรื่องยาก และยืนยันว่าได้ดำเนินการอย่างโปร่งใสที่สุดเท่าที่จะทำได้กับ Carrick แล้ว โดยความกดดันของสโมสรทวีคูณขึ้นหลังจากความพ่ายแพ้ต่อ Como และ Bournemouth ทำให้เกมที่พบกับ Chelsea, Roma และ Aston Villa กลายเป็นนัดที่มีความสำคัญอย่างยิ่งต่อการตัดสินใจในอนาคต"], "link": "https://www.bbc.co.uk/sport/football/articles/cqdr1jlr1707o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/b6bd/live/ff1daf40-dead-11f1-8253-3f203a001288.jpg", "published_at": "2026-11-12 09:12 UTC", "category_hint": "Football", "published_th": "2026-11-12 09:12 เวลาไทย"}, {"id": 1794553392991, "original_title": "Largs get floodlights consent in time for cup tie with Ayr – watch on BBC", "thai_title": "Largs Thistle ได้รับอนุญาตเปิดไฟสนามสำหรับการแข่งขัน Scottish Cup พบกับ Ayr United", "tag": "Football", "bullet_points": ["Largs Thistle ได้รับอนุมัติจากสภาท้องถิ่นให้เปิดไฟสนาม Barrfields Park ได้ถึงเวลา 22:00 น. เพื่อรองรับการแข่งขัน Scottish Cup", "การแข่งขันรอบที่ 3 ระหว่าง Largs Thistle และ Ayr United จะถ่ายทอดสดผ่านช่อง BBC Scotland ในวันที่ 27 พฤศจิกายน เวลา 19:30 น.", "ก่อนหน้านี้สโมสรมีข้อจำกัดด้านเวลาการใช้ไฟสนาม ทำให้ต้องย้ายสนามแข่งขันในเกมกลางสัปดาห์ไปที่ Ardrossan"], "full_paragraphs": ["การแข่งขันฟุตบอล Scottish Cup รอบที่ 3 ระหว่างทีม Largs Thistle และ Ayr United จะมีการถ่ายทอดสดผ่านทางช่อง BBC Scotland, เว็บไซต์ และ iPlayer ในวันศุกร์ที่ 27 พฤศจิกายน โดยจะเริ่มคิกออฟในเวลา 19:30 น. ตามเวลาท้องถิ่น", "ความคืบหน้าดังกล่าวเกิดขึ้นหลังจากที่สโมสร Largs Thistle ซึ่งเป็นทีมในระดับ Lowland League West ได้รับอนุญาตจากสภา North Ayrshire ให้สามารถเปิดไฟสนามที่ Barrfields Park ได้จนถึงเวลา 22:00 น. ตามเวลา GMT โดยก่อนหน้านี้สโมสรมีข้อจำกัดในการใช้ไฟสนามเกินเวลา 21:00 น. ได้ไม่เกิน 2 ครั้งต่อเดือนเท่านั้น", "ข้อจำกัดเดิมส่งผลกระทบต่อสโมสรอย่างมากหลังจากเลื่อนชั้นจาก West of Scotland League Premier Division ขึ้นสู่ลีกระดับที่ 5 ของสกอตแลนด์ ซึ่งกำหนดให้การแข่งขันกลางสัปดาห์ต้องเริ่มในเวลา 19:45 น. ทำให้สโมสรจำเป็นต้องย้ายสนามเหย้าไปแข่งขันที่เมือง Ardrossan ซึ่งห่างออกไป 11 ไมล์ เพื่อให้เป็นไปตามกฎระเบียบ", "สำหรับสถานการณ์ของทั้งสองทีม Largs Thistle ภายใต้การคุมทีมของ Stuart Davidson ปัจจุบันรั้งอันดับ 2 ของตาราง Lowland League และผ่านเข้าสู่รอบที่ 3 ของ Scottish Cup ได้สำเร็จหลังจากเอาชนะ Gala Fairydean Rovers และ Dunipace ในรอบก่อนหน้า ส่วนทีมเยือน Ayr United ภายใต้การคุมทีมของ Gary Naysmith ปัจจุบันอยู่ในอันดับที่ 7 ของลีก Championship ซึ่งเป็นลีกระดับที่ 2 ของประเทศ"], "link": "https://www.bbc.co.uk/sport/football/articles/cmqlq3llg19go?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/5250/live/03144960-dea4-11f1-82bd-ab0398e9e082.jpg", "published_at": "2026-11-12 08:00 UTC", "category_hint": "Football", "published_th": "2026-11-12 08:00 เวลาไทย"}, {"id": 1794553392992, "original_title": "Police investigation into Vigar's death ongoing", "thai_title": "การสอบสวนกรณีการเสียชีวิตของ บิลลี่ วิกเกอร์ อดีตนักเตะเยาวชนอาร์เซนอลยังคงดำเนินอยู่", "tag": "Football", "bullet_points": ["บิลลี่ วิกเกอร์ เสียชีวิตจากอาการบาดเจ็บทางสมองอย่างรุนแรงในปี 2025 หลังปะทะกับกำแพงคอนกรีตข้างสนาม", "ครอบครัววิกเกอร์ตั้งคำถามถึงมาตรการความปลอดภัยของสมาคมฟุตบอลอังกฤษ (FA) ที่ล่าช้าแม้จะเคยมีเหตุการณ์เตือนมาก่อน", "เจ้าหน้าที่ตำรวจนครบาลระบุว่าการสอบสวนยังต้องใช้เวลาอีก 2-3 เดือนจึงจะเสร็จสิ้น", "มีการเปิดเผยข้อมูลว่ามีสโมสรฟุตบอลกว่า 160 แห่งที่ถูกระบุว่ามีความเสี่ยงสูงจากโครงสร้างสนามที่ไม่ปลอดภัย"], "full_paragraphs": ["การสอบสวนกรณีการเสียชีวิตของ บิลลี่ วิกเกอร์ อดีตนักเตะเยาวชนของสโมสรฟุตบอลอาร์เซนอล ยังคงอยู่ในระหว่างการดำเนินการตามรายงานจากศาลชันสูตรพลิกศพ โดยวิกเกอร์เสียชีวิตจากอาการบาดเจ็บทางสมองอย่างรุนแรงในเดือนกันยายน ปี 2025 หลังจากประสบอุบัติเหตุปะทะกับกำแพงคอนกรีตที่ล้อมรอบสนามแข่งขัน ในระหว่างการลงเล่นให้กับสโมสรชิเชสเตอร์ ซิตี้ ที่สนามของสโมสรวิงเกต แอนด์ ฟินช์ลีย์", "ในการไต่สวนเบื้องต้นที่ศาลชันสูตรพลิกศพในบาร์เน็ต เจ้าหน้าที่ตำรวจนครบาลระบุว่าจำเป็นต้องใช้เวลาในการสืบสวนเพิ่มเติมอีกประมาณ 2 ถึง 3 เดือน โดยยังไม่มีการเปิดเผยรายละเอียดเชิงลึกเกี่ยวกับแนวทางการสอบสวนในขณะนี้ ทั้งนี้ ตัวแทนจากสมาคมฟุตบอลอังกฤษ (FA) และสภาเมืองบาร์เน็ตได้เข้าร่วมรับฟังการไต่สวนดังกล่าวด้วย", "คีธ และ คามิลลา วิกเกอร์ บิดามารดาของผู้เสียชีวิตได้แสดงความไม่พอใจต่อการทำงานของ FA โดยระบุว่าเหตุการณ์นี้สามารถป้องกันได้หากมีการดำเนินการตามคำเตือนที่มีมาก่อนหน้านี้ คามิลลา วิกเกอร์ ตั้งคำถามว่าเหตุใด FA จึงรอให้เกิดการสูญเสียก่อนจึงจะเริ่มดำเนินการ ทั้งที่เคยมีกรณีของ เบน ฮิสค็อกซ์ ในปี 2015 และ อเล็กซ์ เฟลตเชอร์ ที่ได้รับบาดเจ็บกะโหลกศีรษะร้าวจากการปะทะกับกำแพงคอนกรีตในปี 2022 ซึ่งการสอบสวนในครั้งนั้นระบุว่ามีสโมสรฟุตบอลถึง 160 แห่งที่เข้าข่ายมีความเสี่ยงสูง รวมถึงสนามของสโมสรวิงเกตด้วย", "ในระหว่างการไต่สวน คีธ วิกเกอร์ ได้หยิบยกประเด็นเรื่องสถานะของสภาเมืองบาร์เน็ตในคดีนี้ขึ้นมาหารือ นอกจากนี้ อเล็กซ์ เฟลตเชอร์ อดีตนักเตะของบาธ ซิตี้ ซึ่งเป็นผู้ประสบเหตุในลักษณะเดียวกันเมื่อปี 2022 ได้เข้าร่วมรับฟังการไต่สวนพร้อมกับตัวแทนจากสมาคมนักฟุตบอลอาชีพ (PFA) เพื่อติดตามความคืบหน้าของกระบวนการยุติธรรมในครั้งนี้"], "link": "https://www.bbc.co.uk/sport/football/articles/ckm2mn2lvld9o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/4800/live/690b1270-de96-11f1-9afe-1f03bfe02283.jpg", "published_at": "2026-11-12 06:11 UTC", "category_hint": "Football", "published_th": "2026-11-12 06:11 เวลาไทย"}, {"id": 1794553392993, "original_title": "Spain boss denies Lamine Yamal gets 'special privileges'", "thai_title": "หลุยส์ เด ลา ฟูเอนเต้ ปฏิเสธข้อกล่าวหา ลามีน ยามาล ได้รับสิทธิพิเศษจากทีมชาติสเปน", "tag": "Football", "bullet_points": ["หลุยส์ เด ลา ฟูเอนเต้ เฮดโค้ชทีมชาติสเปน ยืนยันว่า ลามีน ยามาล ไม่ได้รับสิทธิพิเศษใดๆ หลังได้รับอนุญาตให้รายงานตัวเข้าแคมป์ทีมชาติล่าช้า", "ยามาล มีอาการบาดเจ็บและอักเสบที่หัวเข่าขวาจากเกมลาลีกาที่บาร์เซโลนาพบกับแอตเลติโก มาดริด จึงต้องอยู่รักษาตัวกับทีมแพทย์ของสโมสร", "กุนซือทีมชาติสเปนแสดงความไม่พอใจต่อกระแสข่าวลือที่บิดเบือนความจริง พร้อมระบุว่าการตัดสินใจดังกล่าวเป็นไปตามมาตรฐานการดูแลนักเตะทุกคน"], "full_paragraphs": ["หลุยส์ เด ลา ฟูเอนเต้ เฮดโค้ชทีมชาติสเปน ออกมาปฏิเสธข้อกล่าวหาที่ระบุว่า ลามีน ยามาล แนวรุกดาวรุ่งได้รับสิทธิพิเศษเหนือผู้เล่นคนอื่น หลังจากที่นักเตะได้รับอนุญาตให้รายงานตัวเข้าแคมป์ทีมชาติล่าช้ากว่ากำหนด โดยยามาลไม่ได้เดินทางไปพร้อมกับทีมสำหรับโปรแกรมเนชันส์ลีกที่จะพบกับสาธารณรัฐเช็ก เนื่องจากมีอาการบาดเจ็บและอักเสบที่หัวเข่าขวา ซึ่งเกิดขึ้นหลังจบเกมลาลีกาที่บาร์เซโลนาเอาชนะแอตเลติโก มาดริด", "เด ลา ฟูเอนเต้ อธิบายว่าการตัดสินใจให้ยามาลพักรักษาตัวที่บาร์เซโลนาภายใต้การดูแลของทีมแพทย์สโมสรนั้น เป็นการป้องกันไม่ให้เกิดความเสี่ยงจากการเดินทาง โดยยืนยันว่าหากเป็นผู้เล่นคนอื่นที่มีอาการบาดเจ็บในลักษณะเดียวกัน ทางทีมชาติก็จะดำเนินการในรูปแบบเดียวกันนี้ นอกจากนี้ มิเกล โอยาร์ซาบัล กัปตันทีมเรอัล โซเซียดาด ก็ได้รับอนุญาตให้รายงานตัวล่าช้าเช่นกัน เนื่องจากอาการป่วยไข้หวัดและการดูแลบุตรที่เพิ่งคลอด", "กุนซือทีมชาติสเปนกล่าวแสดงความไม่พอใจต่อสื่อมวลชนที่นำเสนอข่าวในเชิงบิดเบือน โดยระบุว่าตนไม่สามารถยอมรับการโกหกหรือการสร้างเรื่องราวที่ขาดความถูกต้องได้ และยืนยันว่าไม่มีการปฏิบัติที่แตกต่างระหว่างนักเตะในทีมแต่อย่างใด", "สำหรับสถิติในฤดูกาลนี้ ลามีน ยามาล ลงเล่นให้บาร์เซโลนาไปแล้ว 16 นัด ทำได้ 13 ประตู กับอีก 12 แอสซิสต์ ขณะที่ในนามทีมชาติสเปน เขาลงเล่นไปแล้ว 14 นัดในปี 2026 โดยคาดการณ์ว่ายามาลจะกลับมาร่วมฝึกซ้อมกับทีมชาติสเปนอีกครั้งก่อนการแข่งขันนัดที่จะพบกับทีมชาติอังกฤษในวันอาทิตย์นี้"], "link": "https://www.bbc.co.uk/sport/football/articles/cm0qjekqzwp0o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/7137/live/e8eba510-de85-11f1-b88b-3f1671ea859d.jpg", "published_at": "2026-11-12 04:31 UTC", "category_hint": "Football", "published_th": "2026-11-12 04:31 เวลาไทย"}, {"id": 1794553392994, "original_title": "Six matches that defined Carrick's Man Utd tenure", "thai_title": "ย้อนรอย 6 แมตช์สำคัญที่นิยามช่วงเวลาการคุมทีมแมนเชสเตอร์ ยูไนเต็ด ของ ไมเคิล คาร์ริค", "tag": "Football", "bullet_points": ["BBC Sport รวบรวม 6 เกมพรีเมียร์ลีกที่สะท้อนถึงช่วงเวลาทั้งขาขึ้นและขาลงตลอด 10 เดือนของ ไมเคิล คาร์ริค ในฐานะผู้จัดการทีมแมนเชสเตอร์ ยูไนเต็ด", "สถานการณ์ของคาร์ริคทวีความตึงเครียดมากขึ้นหลังจากทีมพ่ายแพ้ให้กับบอร์นมัธ ส่งผลให้เกิดคำถามเกี่ยวกับอนาคตของเขาในถิ่นโอลด์ แทรฟฟอร์ด", "เกิดประเด็นวิพากษ์วิจารณ์ภายในทีม โดยเฉพาะกรณีที่ บรูโน่ แฟร์นันด์ส ถูกวิจารณ์เรื่องการแสดงออกต่อคาร์ริค ซึ่งได้รับเสียงตอบโต้จากทั้ง แคสเปอร์ ชไมเคิล และ เควิน โนแลน"], "full_paragraphs": ["BBC Sport ได้ทำการสรุปเหตุการณ์สำคัญผ่าน 6 แมตช์การแข่งขันในพรีเมียร์ลีก ซึ่งเป็นตัวบ่งชี้ถึงผลงานและทิศทางของสโมสรแมนเชสเตอร์ ยูไนเต็ด ภายใต้การคุมทีมของ ไมเคิล คาร์ริค ตลอดระยะเวลา 10 เดือนที่ผ่านมา โดยเนื้อหาครอบคลุมทั้งช่วงเวลาที่ทีมทำผลงานได้ดีและช่วงที่ประสบปัญหาฟอร์มตกต่ำ", "ความกดดันที่มีต่อคาร์ริคเพิ่มสูงขึ้นอย่างเห็นได้ชัดหลังจากผลการแข่งขันล่าสุดที่แมนเชสเตอร์ ยูไนเต็ด พ่ายแพ้ให้กับบอร์นมัธ     let currentTag = 'ALL';
    let searchQuery = '';

    // Cache-busting: fetch newest json in background if served via http
    if (window.location.protocol.startsWith('http')) {
      fetch('data/news.json?t=' + Date.now())
        .then(r => r.json())
        .then(data => {
          if (data && data.length > 0) {
            allNews = data;
            render();
          }
        }).catch(() => {});
    }

    function filterTag(tag) {
      currentTag = tag;
      ['ALL', 'Football', 'Technology', 'Gaming'].forEach(t => {
        const btn = document.getElementById('filter' + t);
        if (btn) {
          if (t === tag) {
            btn.className = "px-3.5 py-1.5 bg-white text-black font-mono font-bold text-xs rounded-sm transition";
          } else {
            const textColor = t === 'Gaming' ? 'text-amber-400' : 'text-zinc-300';
            btn.className = `px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 ${textColor} font-mono text-xs rounded-sm transition`;
          }
        }
      });
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase();
      render();
    }

    function render() {
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = '';

      const filtered = allNews.filter(item => {
        const matchTag = (currentTag === 'ALL') || (item.tag === currentTag);
        const matchQuery = !searchQuery || 
          (item.thai_title || '').toLowerCase().includes(searchQuery) ||
          (item.tag || '').toLowerCase().includes(searchQuery);
        return matchTag && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center py-16 text-zinc-500 font-mono">ไม่มีข่าวในหมวดนี้</div>';
        return;

      filtered.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'bg-zinc-900/50 border border-zinc-800 hover:border-zinc-700 transition flex flex-col justify-between overflow-hidden rounded-sm cursor-pointer group';
        div.onclick = () => openModal(allNews.indexOf(item));
        
        const bulletsHtml = (item.bullet_points || []).slice(0, 3).map(b => 
          `<li class="flex items-start gap-1.5"><span class="text-[#ff3366] font-bold">›</span><span>${b}</span></li>`
        ).join('');

        let tagColor = 'text-[#ff3366]';
        if (item.tag === 'Technology') tagColor = 'text-cyan-400';
        else if (item.tag === 'Gaming') tagColor = 'text-amber-400';

        div.innerHTML = `

              </div>
              <h3 class="verge-title text-base font-bold text-white group-hover:text-[#ff3366] transition mb-3 leading-snug line-clamp-2">
                ${item.thai_title}
              </h3>
              <ul class="text-xs text-zinc-300 space-y-1.5 font-light">
                ${bulletsHtml}
              </ul>
            </div>
          </div>
          <div class="p-5 pt-0 border-t border-zinc-800/80 text-[11px] font-mono text-zinc-500 flex items-center justify-between">
            <span class="text-zinc-300 group-hover:text-white transition">อ่านรายละเอียดเต็ม →</span>
            <span>${item.tag} FEED</span>
          </div>
        `;
        grid.appendChild(div);

    function openModal(idx) {
      const item = allNews[idx];
      if (!item) return;

      document.getElementById('modalTag').textContent = `// ${item.tag}`;
      document.getElementById('modalImg').src = item.cover_image_url;
      document.getElementById('modalTitle').textContent = item.thai_title;
      document.getElementById('modalDate').textContent = item.published_th || item.published_at;

      const bulletsList = document.getElementById('modalBullets');
      bulletsList.innerHTML = '';
      (item.bullet_points || []).forEach(b => {
        const li = document.createElement('li');
        li.className = 'flex items-start gap-2';
        li.innerHTML = `<span class="text-[#ff3366] font-bold">›</span><span>${b}</span>`;
        bulletsList.appendChild(li);
      });

      const fullContentDiv = document.getElementById('modalFullContent');
      fullContentDiv.innerHTML = '';
      const paras = Array.isArray(item.full_paragraphs) && item.full_paragraphs.length > 0 ? item.full_paragraphs : item.bullet_points;
      (paras || []).forEach(p => {
        const pElem = document.createElement('p');

        fullContentDiv.appendChild(pElem);
      });

      document.getElementById('modalSource').href = item.link;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    render();
  </script>
