วามได้ทันทีขณะที่คุณกำลังพูด", "รองรับการใช้งานทั่วโลกแล้วบนทุกแพลตฟอร์ม ทั้งเว็บ, แอปเดสก์ท็อป, iOS และ Android สำหรับผู้ใช้ทุกระดับ", "ยกเลิกข้อจำกัดเดิมที่เคยจำกัดการบันทึกเสียงไว้เพียง 10 นาที ทำให้สามารถบันทึกได้ยาวนานขึ้น", "ผู้ใช้สามารถแตะหรือคลิกที่รูปคลื่นเสียง (Audio Waveform) เพื่อดูข้อความที่ AI กำลังถอดความแบบสดๆ และแก้ไขได้ทันทีในช่องพิมพ์"], "full_paragraphs": ["ChatGPT ได้ยกระดับความสามารถในการรับคำสั่งด้วยเสียง (Audio Prompts) ให้รวดเร็วยิ่งขึ้นด้วยฟีเจอร์ใหม่ 'Live Dictation' ซึ่งจะทำการถอดความเสียงเป็นข้อความให้โดยอัตโนมัติในขณะที่คุณกำลังพูด แทนที่จะต้องรอให้บันทึกเสียงจนจบก่อนเหมือนในอดีต โดยฟีเจอร์นี้กำลังทยอยเปิดให้ใช้งานทั่วโลกแล้วสำหรับผู้ใช้ ChatGPT ทุกระดับ ทั้งบนเวอร์ชันเว็บไซต์, แอปพลิเคชันเดสก์ท็อป รวมถึงแอปบนระบบปฏิบัติการ iOS และ Android", "ในระหว่างการใช้งานฟีเจอร์ Dictation บน ChatGPT ผู้ใช้สามารถแตะหรือคลิกที่รูปคลื่นเสียง (Audio Waveform) เพื่อแสดงข้อความที่ AI กำลังถอดความแบบสดๆ (Live Text Transcript) ได้ทันที และเมื่อพูดจบแล้ว ผู้ใช้ยังสามารถแก้ไขข้อความเหล่านั้นในช่องใส่คำสั่ง (Prompt Box) ได้อย่างสะดวกสบาย", "นอกเหนือจากการเพิ่มความเร็วในการถอดความแล้ว OpenAI ยังประกาศยกเลิกข้อจำกัดเดิมที่เคยจำกัดการบันทึกเสียงไว้เพียง 10 นาทีต่อครั้ง พร้อมระบุว่าฟีเจอร์นี้จะมีความ 'น่าเชื่อถือมากขึ้น' (More reliable) ในการใช้งานจริง", "การอัปเดตในครั้งนี้ถือเป็นความต่อเนื่องจากการยกเครื่องโหมดสนทนาด้วยเสียงแบบสองทาง (Two-way Conversational Voice Mode) ของ ChatGPT ที่เกิดขึ้นเมื่อช่วงต้นปีที่ผ่านมา", "ทั้งนี้ เมื่อปีที่แล้ว OpenAI ได้เคยประกาศเปิดตัว 'Record Mode' สำหรับการถอดความบันทึกเสียงและบันทึกการประชุม ซึ่งปัจจุบันฟีเจอร์ดังกล่าวยังคงอยู่ในสถานะเบต้าและจำกัดการใช้งานเฉพาะกลุ่มผู้ใช้ระดับ Plus, Enterprise, Edu, Business และ Pro เท่านั้น อย่างไรก็ตาม ผู้ใช้ทั่วไปยังคงสามารถใช้ฟีเจอร์ Dictation ในช่อง Prompt Box เพื่อสั่งให้ ChatGPT ช่วยถอดความข้อความเสียงหรือสรุปเนื้อหาออกมาเป็นหัวข้อ (Bullet points) ได้เช่นกัน"], "link": "https://www.theverge.com/ai-artificial-intelligence/1037634/openai-chatgpt-live-dictation", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1037634/openai-chatgpt-live-dictation", "cover_image_url": "https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80&sig=technology-0", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795101405, "published_at": "2026-11-19T15:16:45Z", "published_th": "19 พ.ย. 2026 • 22:16 น.", "category_hint": "Technology"}, {"id": 1795100493827, "guid": "https://www.theverge.com/?p=1036484", "original_title": "How Silicon Valley lost the public, with Crooked Media’s Jon Favreau", "thai_title": "เจาะลึกมุมมอง Jon Favreau แห่ง Crooked Media: ทำไม Silicon Valley ถึงสูญเสียความเชื่อมั่นจากสาธารณชน", "tag": "Technology", "sub_tag": "PODCAST", "bullet_points": ["Jon Favreau ชี้ว่าชัยชนะของพรรคเดโมแครตในการเลือกตั้งกลางเทอมสะท้อนถึงความล้มเหลวของนโยบายเศรษฐกิจที่จับต้องไม่ได้ มากกว่าอิทธิพลจากสื่อของเหล่ามหาเศรษฐีเทคโนโลยี", "การที่มหาเศรษฐีเข้าครอบครองแพลตฟอร์มสื่อรายใหญ่ไม่สามารถบิดเบือนความรู้สึกของประชาชนที่เผชิญกับปัญหาค่าครองชีพและเงินเฟ้อในชีวิตจริงได้", "ประเด็นเรื่องความเป็นส่วนตัวและการต่อต้านอำนาจรัฐที่เกินขอบเขตกลายเป็นจุดร่วมที่ทำให้ผู้คนเริ่มตื่นตัวและปฏิเสธการสอดส่องผ่านเทคโนโลยี AI", "กระแสการต่อต้านศูนย์ข้อมูล (Data Centers) ในระดับท้องถิ่นสะท้อนถึงความรู้สึกสูญเสียการควบคุมในชุมชน ซึ่งเป็นผลพวงจากการที่บริษัทเทคโนโลยีผลักดันโครงการโดยขาดความโปร่งใส"], "full_paragraphs": ["Nilay Patel บรรณาธิการบริหารของ The Verge ได้สนทนากับ Jon Favreau ผู้ร่วมก่อตั้ง Crooked Media และพิธีกรรายการพอดแคสต์ชื่อดังอย่าง Pod Save America เกี่ยวกับสถานการณ์สื่อในยุคปัจจุบัน โดยเฉพาะในบริบทที่มหาเศรษฐีสายเทคโนโลยีต่างพากันเข้าซื้อกิจการสื่อรายใหญ่และแพลตฟอร์มโซเชียลมีเดียเพื่อหวังอิทธิพลทางการเมือง", "Favreau วิเคราะห์ถึงผลการเลือกตั้งกลางเทอมที่ผ่านมาว่า เป็นการปฏิเสธรัฐบาลที่ล้มเหลวในการทำตามสัญญาเรื่องการลดเงินเฟ้อและทำให้ชีวิตความเป็นอยู่ดีขึ้น เขาชี้ว่า 'เมื่อผู้คนต้องเผชิญกับราคาน้ำมันที่แพงและปัญหาค่าครองชีพ การโฆษณาชวนเชื่อจากสื่อฝ่ายขวาหรืออิทธิพลจากมหาเศรษฐีเทคโนโลยีก็ไม่มีความหมาย เพราะประสบการณ์ชีวิตจริงมีความสำคัญมากกว่าข้อความทางการเมืองที่ได้รับ'", "ในประเด็นเรื่องการครอบงำสื่อ Favreau มองว่าแม้สื่อฝ่ายขวาจะพยายามสร้างเครือข่ายส่งตรงถึงผู้บริโภคมานาน แต่ในที่สุดแล้ว 'เงื่อนไขทางวัตถุ' (Material conditions) ก็ยังคงเป็นปัจจัยตัดสินที่สำคัญที่สุด เขายกตัวอย่างสมัยรัฐบาล Obama ว่าแม้จะผ่านกฎหมายสำคัญมากมาย แต่หากประชาชนยังรู้สึกว่าเศรษฐกิจไม่ดีขึ้น พวกเขาก็พร้อมจะเปลี่ยนใจไปเลือกฝ่ายตรงข้ามอยู่ดี", "การสนทนาขยายไปถึงเรื่องเทคโนโลยีการสอดส่อง (Surveillance) โดย Patel ตั้งข้อสังเกตว่าสาธารณชนเริ่มต่อต้านการใช้กล้อง AI และการเชื่อมโยงฐานข้อมูลเพื่อเฝ้าระวังอาชญากรรม ซึ่ง Favreau เห็นด้วยว่าความเป็นส่วนตัวเป็นประเด็นที่กระทบต่อความรู้สึกส่วนบุคคลอย่างรุนแรง และเป็นจุดที่ผู้คนเริ่มขีดเส้นแบ่งระหว่างความปลอดภัยกับการถูกละเมิดสิทธิ", "Favreau ยังกล่าวถึงความกังวลเรื่องการใช้อำนาจรัฐเกินขอบเขต โดยเฉพาะในยุคของ Donald Trump ที่ประชาชนเริ่มตระหนักถึงความเสี่ยงจากการที่รัฐบาลอาจใช้เครื่องมือทางเทคโนโลยีเข้าแทรกแซงชีวิตประจำวัน หรือการคุกคามผู้ที่เห็นต่าง ซึ่งเป็นสัญญาณของการตื่นตัวต่ออำนาจรัฐที่เข้มข้นขึ้น", "ในประเด็นเรื่อง AI และศูนย์ข้อมูล (Data Centers) ที่กำลังถูกต่อต้านในหลายพื้นที่ Favreau มองว่าเป็นปรากฏการณ์ NIMBYism (Not In My Backyard) แบบคลาสสิก แต่แฝงไปด้วยความรู้สึกว่า 'เรากำลังสูญเสียการควบคุมเหนือแรงขับเคลื่อนที่กำหนดชีวิตของเรา' โดยเฉพาะเมื่อบริษัทเทคโนโลยีขนาดใหญ่พยายามผลักดันโครงการโดยไม่ฟังเสียงคัดค้านจากชุมชนท้องถิ่น", "ท้ายที่สุด Favreau ย้ำว่าการที่พรรคการเมืองหรือบริษัทเทคโนโลยีพยายามบิดเบือนความจริงหรือเพิกเฉยต่อความเดือดร้อนของประชาชนนั้นเป็นกลยุทธ์ที่ผิดพลาด เพราะในยุคที่ข้อมูลข่าวสารเข้าถึงได้ง่าย ประชาชนจะตัดสินจากสิ่งที่พวกเขาเผชิญในชีวิตจริงมากกว่าคำพูดสวยหรูจากผู้มีอำนาจ"], "link": "https://www.theverge.com/podcast/1036484/jon-favreau-pod-save-america-offline-crooked-media-trump-big-tech-ai-2028-election", "canonical_link": "https://www.theverge.com/podcast/1036484/jon-favreau-pod-save-america-offline-crooked-media-trump-big-tech-ai-2028-election", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DCD-Jon-Favreau.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/24792604/The_Verge_Decoder_Tileart.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": ["https://www.youtube.com/embed/Ca6XflqGbt8", "https://www.youtube.com/embed/oqBz5QCCcN0"], "review_score": "", "published_ts": 1795100400, "published_at": "2026-11-19T15:00:00Z", "published_th": "19 พ.ย. 2026 • 22:00 น.", "category_hint": "Technology"}, {"id": 1795099689818, "guid": "https://www.theverge.com/?p=1037552", "original_title": "The Analogue 3D can now update itself over Wi-Fi", "thai_title": "Analogue 3D อัปเดตเฟิร์มแวร์ใหม่ เปิดใช้งาน Wi-Fi อย่างเป็นทางการแล้ว", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Analogue 3D ปล่อยเฟิร์มแวร์เวอร์ชัน 1.6.0 เปิดใช้งานฮาร์ดแวร์ Wi-Fi ที่ติดตั้งมากับเครื่องตั้งแต่วันแรก", "รองรับการเชื่อมต่อเครือข่าย Wi-Fi ทั้งย่าน 2.4GHz, 5GHz, เครือข่ายแบบผสม และเครือข่ายที่ซ่อน SSID", "ผู้ใช้สามารถอัปเดตเฟิร์มแวร์ผ่านระบบไร้สาย (OTA) ได้โดยตรงในอนาคต ไม่ต้องพึ่งพาการย้ายไฟล์ผ่านเมมโมรี่การ์ดอีกต่อไป", "เพิ่มฟีเจอร์ตั้งค่าวันที่และเวลาอัตโนมัติตามโซนเวลา และตัวเลือกการแชร์ข้อมูลการใช้งานแบบไม่ระบุตัวตนเพื่อการพัฒนาผลิตภัณฑ์"], "full_paragraphs": ["ที่ผ่านมา Analogue มีชื่อเสียงในด้านการขยายขีดความสามารถและฟังก์ชันการทำงานของเครื่องเกมคอนโซลผ่านการอัปเดตเฟิร์มแวร์อย่างสม่ำเสมอ แต่กระบวนการติดตั้งอัปเดตเหล่านั้นมักจะเป็นเรื่องยุ่งยากที่ต้องอาศัยการย้ายไฟล์ผ่านเมมโมรี่การ์ดเสมอมา อย่างไรก็ตาม ข้อจำกัดดังกล่าวได้ถูกยกเลิกไปแล้วสำหรับ Analogue 3D ซึ่งเป็นเครื่องเกมคอนโซลรุ่นปรับปรุงใหม่ของ Nintendo 64 จากทางบริษัท แม้ว่าตัวเครื่องจะมีฮาร์ดแวร์ Wi-Fi ติดตั้งมาให้ตั้งแต่วันแรกที่วางจำหน่าย แต่ฟีเจอร์นี้เพิ่งจะถูกเปิดใช้งานอย่างเป็นทางการผ่านการอัปเดตล่าสุด ซึ่งถือเป็นครั้งสุดท้ายที่ผู้ใช้จำเป็นต้องติดตั้งผ่านเมมโมรี่การ์ดด้วยตนเอง", "เมื่อวานนี้ Analogue ได้ปล่อยเฟิร์มแวร์เวอร์ชัน 1.6.0 สำหรับ Analogue 3D ซึ่งเพิ่มการรองรับเครือข่าย Wi-Fi ทั้งย่านความถี่ 2.4GHz และ 5GHz รวมถึงรองรับเครือข่ายแบบผสม (Mixed) และเครือข่ายที่ซ่อนชื่อ (Hidden Wi-Fi networks) โดยหลังจากติดตั้งอัปเดตนี้แล้ว กระบวนการตั้งค่า Wi-Fi จะเริ่มต้นขึ้นโดยอัตโนมัติเมื่อเปิดเครื่องคอนโซล นอกจากนี้ยังมีการเพิ่มเมนู Wi-Fi เข้าไปในส่วนการตั้งค่าของ Analogue 3D เพื่อให้ผู้ใช้สามารถจัดการรหัสผ่านหรือแก้ไขรายละเอียดการเชื่อมต่อต่างๆ ได้ในภายหลัง", "ความสามารถด้าน Wi-Fi ใหม่ของคอนโซลรุ่นนี้ได้เพิ่มฟีเจอร์ที่มีประโยชน์หลายประการนับตั้งแต่เปิดตัว โดยในอนาคต Analogue 3D จะสามารถดาวน์โหลดและติดตั้งอัปเดตเฟิร์มแวร์ได้โดยตรง ทำให้ตัวเครื่องสามารถอัปเดตตัวเองให้เป็นเวอร์ชันล่าสุดอยู่เสมอโดยอัตโนมัติ", "นอกจากนี้ ความสามารถในการเชื่อมต่อไร้สายยังช่วยให้เครื่องสามารถตั้งค่าวันที่และเวลาให้ตรงกับโซนเวลาของผู้ใช้ได้โดยอัตโนมัติอีกด้วย และในส่วนของเมนูการตั้งค่าความเป็นส่วนตัว (Privacy) ผู้ใช้จะพบกับตัวเลือกใหม่สำหรับการแชร์ “ข้อมูลการใช้งานและสถิติแบบไม่ระบุตัวตน” (anonymous usage and analytics data) ให้กับทาง Analogue เพื่อนำไปใช้ในการปรับปรุงประสิทธิภาพของฮาร์ดแวร์ให้ดียิ่งขึ้นต่อไป"], "link": "https://www.theverge.com/tech/1037552/analogue-3d-nintendo-64-console-wi-fi-activated-automatic-updates", "canonical_link": "https://www.theverge.com/tech/1037552/analogue-3d-nintendo-64-console-wi-fi-activated-automatic-updates", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/08/257891_Analogue_3D_AKrales_0002.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795098753, "published_at": "2026-11-19T14:32:33Z", "published_th": "19 พ.ย. 2026 • 21:32 น.", "category_hint": "Technology"}, {"id": 1795098715351, "guid": "https://www.theverge.com/?p=1037459", "original_title": "With the biggest IPO of all time, Anthropic’s ‘good guy’ reputation is on the line", "thai_title": "Anthropic กับการ IPO ครั้งประวัติศาสตร์: เมื่อชื่อเสียงด้าน 'ความปลอดภัย' ของ AI กำลังถูกท้าทาย", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["Anthropic สร้างประวัติศาสตร์ด้วยการ IPO ที่มีมูลค่าสูงที่สุดเท่าที่เคยมีมา ด้วยยอดระดมทุน 8.13 หมื่นล้านดอลลาร์สหรัฐ", "บริษัทใช้โครงสร้างองค์กรแบบ Public Benefit Corporation และมี Long-Term Benefit Trust (LTBT) เพื่อควบคุมทิศทางบริษัท แต่ถูกตั้งคำถามถึงประสิทธิภาพในการตรวจสอบจริง", "ผู้เชี่ยวชาญและอดีตพนักงานกังวลว่าการเร่งพัฒนา AI เพื่อชิงความเป็นหนึ่งอาจขัดแย้งกับหลักการด้านความปลอดภัยที่บริษัทเคยยึดถือ", "ความกดดันจากตลาดทุนหลังการเป็นบริษัทมหาชนอาจบีบให้ Anthropic ต้องลดความสำคัญด้านการวิจัยความปลอดภัย เพื่อเน้นการทำกำไรและเร่งการเติบโตของผลิตภัณฑ์", "มีการวิพากษ์วิจารณ์จากกลุ่มผู้เชี่ยวชาญด้านความปลอดภัย AI ว่า Anthropic กำลังใช้ภาพลักษณ์ 'บริษัทที่ปลอดภัย' เพื่อดึงดูดนักลงทุน ในขณะที่ยังคงเร่งพัฒนาเทคโนโลยีที่มีความเสี่ยงสูง"], "full_paragraphs": ["วันนี้ถือเป็นจุดเริ่มต้นครั้งใหม่ของ Anthropic ด้วยการ IPO ที่เตรียมการมานานหลายปี ซึ่งสามารถเอาชนะ SpaceX ในฐานะบริษัทที่มีมูลค่าสูงสุดเท่าที่เคยมีมา ด้วยยอดระดมทุนถึง 8.13 หมื่นล้านดอลลาร์สหรัฐ และสร้างบรรทัดฐานสำคัญให้กับห้องปฏิบัติการ AI อื่นๆ ที่เตรียมจะเข้าสู่ตลาดหลักทรัพย์ อย่างไรก็ตาม นี่ไม่ใช่เพียงแค่ความสำเร็จทางการเงินเท่านั้น", "Anthropic ก่อตั้งขึ้นบนแนวคิดที่ให้ความสำคัญกับความปลอดภัยเหนือกว่าห้องปฏิบัติการอื่นๆ โดยผู้ก่อตั้งได้ลาออกจากตำแหน่งบริหารด้านการวิจัยที่ OpenAI แต่ในขณะที่การแข่งขันด้าน AI ทวีความรุนแรงขึ้น ผู้บริหารของ Anthropic ได้เน้นย้ำว่าบริษัทจะทำตามพันธกิจนี้ได้ก็ต่อเมื่อต้องเป็นที่หนึ่งเท่านั้น ซึ่งจำเป็นต้องใช้เงินทุนและพลังประมวลผล (compute) จำนวนมหาศาล ไม่น่าแปลกใจที่การพัฒนา AI อย่างรอบคอบและปลอดภัยอาจขัดแย้งกับความเร็วที่จำเป็นในการชนะการแข่งขันนี้ การเข้าสู่ตลาดหลักทรัพย์ยิ่งทำให้สถานการณ์ซับซ้อนขึ้น โดยผู้นำของ Anthropic สามารถดำเนินนโยบายได้เกือบจะเป็นเอกเทศ ซึ่งเป็นผลมาจากโครงสร้างองค์กรที่ออกแบบมาเพื่อป้องกันแรงกดดันจากผู้ถือหุ้นที่ต้องการผลกำไร แต่ในขณะเดียวกันก็เป็นการลดทอนกลไกการตรวจสอบอำนาจตามปกติลง", "อดีตพนักงานรายหนึ่งที่ลาออกก่อนการ IPO กล่าวว่า เขาและคนอื่นๆ ใน Anthropic เริ่มรู้สึกมากขึ้นเรื่อยๆ ว่าอัตราเร่งของการพัฒนา AI ในปัจจุบันนั้น 'ไม่สามารถรักษาไว้ได้ภายใต้โครงสร้างตลาดปกติ' โดยเฉพาะอย่างยิ่งเมื่อมีแรงจูงใจที่ไม่สอดคล้องกันในอุตสาหกรรมที่ทรงพลังแต่แทบไม่มีการกำกับดูแล", "Anthropic ใช้เวลาหลายปีในการสร้างภาพลักษณ์ว่าตนแตกต่างและระมัดระวังมากกว่าบริษัท AI อื่นๆ ในทางทฤษฎี สิ่งนี้ครอบคลุมถึงแผนการเข้าสู่ตลาดหลักทรัพย์ โดยบริษัทจดทะเบียนในฐานะ Public Benefit Corporation ซึ่งหมายความว่าคณะกรรมการของ Anthropic มีความรับผิดชอบในการสร้างสมดุลระหว่างพันธกิจของบริษัทกับการเพิ่มความมั่งคั่งให้ผู้ถือหุ้น นอกจากนี้ บริษัทยังได้พัฒนาโครงสร้างอำนาจที่ผิดปกติอย่างยิ่ง", "Long-Term Benefit Trust (LTBT) ของ Anthropic ซึ่งเปิดตัวในปี 2023 และกลุ่มผู้ก่อตั้งมีสิทธิออกเสียงควบคุมบริษัท หมายความว่าพวกเขาจะไม่สามารถถูกผู้ถือหุ้นโหวตออกได้แม้จะเป็นบริษัทมหาชน หุ้นประเภทพิเศษที่เรียกว่า Class T ช่วยให้กลุ่มผู้ดูแลผลประโยชน์ (trustees) ซึ่งเป็นสมาชิกของ LTBT มี 'อำนาจในการเลือกและถอดถอนคณะกรรมการบางส่วน' ของ Anthropic พวกเขาอยู่นอกเหนือแรงกดดันของผู้ถือหุ้นทั่วไป และในทางทฤษฎีคือกลไกตรวจสอบผู้ก่อตั้ง โดยมีภารกิจในการ 'สร้างสมดุลระหว่างผลประโยชน์ทางการเงินของผู้ถือหุ้นกับวัตถุประสงค์เพื่อสาธารณประโยชน์ ในช่วงเวลาสำคัญที่เราคาดว่าผลลัพธ์ของการตัดสินใจจะส่งผลกระทบไกลเกินกว่าตัวบริษัท Anthropic เอง'", "ความเป็นจริงนั้นซับซ้อนกว่ามาก ตัวอย่างเช่น LTBT มีอำนาจเลือกสมาชิกคณะกรรมการ 4 คนจากทั้งหมด 7 คน แต่สมาชิกคนหนึ่งใน 4 คนนั้นจำเป็นต้องได้รับการอนุมัติจากผู้ก่อตั้ง Anthropic ทำให้ทรัสต์ไม่มีอำนาจควบคุมเสียงข้างมากอย่างเบ็ดเสร็จ นอกจากนี้ยังมีข้อกำหนดเกี่ยวกับการเสนอชื่อหรือถอดถอนกรรมการ โดย LTBT ต้องแจ้งการตัดสินใจล่วงหน้า 30 วันต่อ 'คณะกรรมการสรรหาและกำกับดูแลกิจการ' ซึ่งประกอบด้วย 3 คน ได้แก่ Daniela Amodei ผู้ร่วมก่อตั้ง (ประธานคณะกรรมการ), Reed Hastings ผู้ร่วมก่อตั้ง Netflix และ Yasmin Razavi นักลงทุนของ Anthropic", "แม้สมาชิก LTBT จะ 'ไม่มีส่วนได้ส่วนเสียทางการเงิน' ในบริษัท แต่ก็ไม่มีอะไรขัดขวางไม่ให้ Anthropic ว่าจ้างผู้ดูแลผลประโยชน์ไปทำงานให้บริษัทด้วยค่าตอบแทนที่สูงลิ่ว Mariano-Florentino Cuéllar (อดีตผู้ดูแลผลประโยชน์) ได้เข้าร่วมงานกับ Anthropic ในเดือนสิงหาคมในตำแหน่งประธานเจ้าหน้าที่ฝ่ายกิจการระดับโลก และ OpenAI ก็เคยว่าจ้างอดีตกรรมการบริษัทอย่าง Fidji Simo มาดำรงตำแหน่งผู้บริหารภายในบริษัทเช่นกัน Tyler Johnston ผู้ก่อตั้ง The Midas Project องค์กรไม่แสวงผลกำไรที่เฝ้าระวังอุตสาหกรรม AI กล่าวว่า 'เราสามารถจินตนาการถึงสถานการณ์ที่หากผู้ดูแลผลประโยชน์ดูมีความเคลื่อนไหวมากเกินไป พวกเขาก็แค่ยื่นข้อเสนอด้วยค่าตอบแทนหลายล้านดอลลาร์เพื่อให้คนนั้นลาออกจากทรัสต์ ซึ่งนั่นเป็นวิธีหนึ่งที่พวกเขาจะสามารถควบคุมการตรวจสอบนี้ได้'", "แม้ LTBT จะถูกนำเสนอว่าเป็นวิธีตรวจสอบความเป็นผู้นำของ Anthropic แต่สำหรับผู้สังเกตการณ์ภายนอก รายละเอียดในสัญญาดูไม่มั่นคงนัก Ann Lipton ศาสตราจารย์ด้านกฎหมายจาก University of Colorado Law School และผู้เชี่ยวชาญด้านการกำกับดูแลกิจการกล่าวว่า 'เนื่องจากทรัสต์ไม่มีผลประโยชน์ทางการเงินใน Anthropic ในทางทฤษฎีพวกเขาอาจใช้อำนาจที่มีกรรมการ 3 ใน 4 คนเพื่อรักษาพันธกิจของบริษัทไว้ แต่เราอาจตั้งคำถามว่าเหตุการณ์เช่นนั้นจะเกิดขึ้นได้จริงเพียงใด'", "ยิ่งไปกว่านั้น Lipton ตั้งคำถามว่าทรัสต์จะมีความรู้เพียงพอที่จะประเมินว่าเมื่อใดควรเบรกแผนงานหรือผลิตภัณฑ์ของบริษัทหรือไม่ แม้ว่าพวกเขาจะมีอำนาจดังกล่าวก็ตาม สมาชิก LTBT ทั้ง 4 คนไม่ได้เป็นที่รู้จักในฐานะผู้เชี่ยวชาญด้าน AI โดยประกอบด้วย Ben Bernanke อดีตประธานธนาคารกลางสหรัฐฯ, Richard Fontaine นักวิเคราะห์นโยบายต่างประเทศ, Christopher Stubbs นักฟิสิกส์ทดลอง และ Neil Buddy Shah อดีตผู้บริหาร GiveWell ซึ่งเป็นประธาน LTBT โดย Lipton กล่าวว่า 'ฉันไม่มั่นใจว่าผู้ดูแลผลประโยชน์หรือกรรมการที่พวกเขาแต่งตั้งจะมีข้อมูลเชิงลึกด้าน AI และการพัฒนา AI เพื่อตัดสินใจเรื่องเหล่านี้ได้ พวกเขาเป็นบุคคลที่มีชื่อเสียงมาก แต่ Ben Bernanke รู้อะไรเกี่ยวกับ AI?'", "ผู้เชี่ยวชาญหลายคนเปรียบเทียบ LTBT ของ Anthropic กับคณะกรรมการที่ไม่แสวงผลกำไรของ OpenAI ก่อนการปลด Sam Altman โดย Johnston จาก The Midas Project กล่าวว่า 'อำนาจ หรือการขาดอำนาจของ LTBT นั้น คล้ายคลึงกับอำนาจที่คณะกรรมการที่ไม่แสวงผลกำไรของ OpenAI มีในบางแง่มุม' แน่นอนว่าการตัดสินใจของคณะกรรมการนั้นในการปลด CEO ของ OpenAI นำไปสู่การกลับมาของ Altman ในอีกไม่กี่วันต่อมา และการลาออกของคณะกรรมการส่วนใหญ่", "แต่มีความแตกต่างที่สำคัญระหว่างสิ่งนั้นกับ LTBT ก่อนการปรับโครงสร้างของ OpenAI คณะกรรมการที่ไม่แสวงผลกำไรมีอำนาจในการเข้ามาชี้นำการตัดสินใจในแต่ละวันเมื่อจำเป็น และแม้หลังจากการปรับโครงสร้าง พวกเขายังคงรักษาอำนาจนั้นไว้สำหรับเรื่องความปลอดภัยและความมั่นคง เช่น การชะลอหรือหยุดการปล่อยโมเดล แต่เอกสาร Form S-1 ของ Anthropic ชี้ให้เห็นว่า LTBT ซึ่งมีหน้าที่หลักในการแต่งตั้ง (และอาจถอดถอน) กรรมการบางคนนั้น ไม่มีอำนาจในระดับดังกล่าวเลย", "ในทางกลับกัน โครงสร้างของ Anthropic ดูเหมือนรูปแบบที่เน้นผู้ก่อตั้งเป็นศูนย์กลางซึ่งเป็นที่นิยมใน Silicon Valley เช่นเดียวกับ Mark Zuckerberg ที่ Meta และ Elon Musk ที่ SpaceX โดย Anthropic ไม่ได้ตอบกลับคำขอแสดงความคิดเห็น", "Hamza Chaudhry ผู้นำด้าน AI และความมั่นคงแห่งชาติที่ Future of Life Institute กล่าวว่า 'ทั้งทรัสต์และผู้ดูแลผลประโยชน์ไม่มีอำนาจตัดสินใจใดๆ เกี่ยวกับการตัดสินใจในแต่ละวัน ดังนั้นฉันจึงไม่มีความหวังมากนักว่า LTBT จะเป็นกลไกสำคัญสำหรับการกำกับดูแลหลังจากที่พวกเขาเข้าสู่ตลาดมหาชน'", "อดีตพนักงาน Anthropic กล่าวว่าผู้ก่อตั้งของ Anthropic เป็นเพียงคนเดียวที่มีอำนาจตัดสินใจที่แท้จริง โดยกล่าวว่า 'ผมคงจะแปลกใจถ้าคุณพบใครที่รู้จักผู้ก่อตั้ง รู้จัก LTBT เข้าใจว่าการตัดสินใจเกิดขึ้นได้อย่างไร และคิดว่า LTBT มีอำนาจที่มีความหมายใดๆ' เขากล่าวเสริมว่าผู้ดูแลผลประโยชน์นั้น 'ไม่พร้อมที่จะให้การตรวจสอบที่มีความหมาย' ต่อผู้ก่อตั้ง และถูกเลือกมาโดยตั้งใจเพื่อไม่ให้เกิดปัญหา", "ในฐานะบริษัทมหาชน Anthropic จะเผชิญกับแรงกดดันมากกว่าที่เคยในการหาเงินทุน ไม่ว่าจะผ่านการสร้างรายได้เพิ่มหรือการระดมทุน นั่นหมายความว่าเช่นเดียวกับแนวโน้มในอุตสาหกรรมตลอดหลายปีที่ผ่านมา มันจะยากขึ้นที่จะให้เหตุผลสนับสนุนโครงการความปลอดภัย AI ที่มีราคาแพง และจะมีความกดดันอย่างหลีกเลี่ยงไม่ได้ในการเร่งการปล่อยผลิตภัณฑ์และการพาณิชย์ Lipton กล่าวว่า 'ทรัสต์และผู้ก่อตั้งร่วมกันคือผู้ที่มีอำนาจในการกำกับดูแล ดังนั้นคุณต้องเชื่อว่าพวกเขาจะสร้างสมดุลผลประโยชน์ของสังคมได้อย่างเหมาะสม หรือไม่ก็ไม่เชื่อเลย ไม่ว่าจะทางไหน ข้อจำกัดที่แท้จริงต่อแรงกระตุ้นทางสังคมใดๆ ที่พวกเขามี ก็คือความจริงที่ว่า Anthropic ต้องการเงิน'", "Anthropic เปิดเผยอย่างชัดเจนว่าบริษัทมีความต้องการเงินสดอย่างมาก โดยเฉพาะเพื่อซื้อพลังประมวลผลเพิ่มและเร่งความก้าวหน้าด้าน AI Amodei กล่าวในการสนทนาผ่านไลฟ์สตรีมกับ Jamie Dimon CEO ของ JPMorgan Chase เมื่อวันศุกร์ที่ผ่านมาว่า 'พลังประมวลผลคือภาวะกลืนไม่เข้าคายไม่ออกทางธุรกิจที่ลึกซึ้งที่สุดที่บริษัทเผชิญ หากคุณซื้อมากเกินไป คุณอาจขยายตัวทางการเงินเกินตัว หากคุณซื้อน้อยเกินไป คุณก็ไม่สามารถสนับสนุนการอนุมาน (inference) สำหรับลูกค้า และที่สำคัญกว่านั้นคือ คุณไม่สามารถทำ R&D ได้'", "เว็บไซต์ของ Anthropic สรุปเหตุผลการดำรงอยู่ของบริษัทไว้สิ่งเดียวคือ 'การวิจัยและผลิตภัณฑ์ AI ที่วางความปลอดภัยไว้ที่แนวหน้า' แต่ก็ชัดเจนเช่นกันว่าเพื่อให้คำมั่นสัญญาด้านความปลอดภัยนั้นมีความหมาย Anthropic จำเป็นต้องมีทรัพยากรจำนวนมหาศาลเพื่อเป็นธุรกิจที่อยู่รอดได้ เช่นเดียวกับห้องปฏิบัติการอื่นๆ บริษัทได้ดำเนินการพัฒนาตนเองแบบเรียกซ้ำ (recursive self-improvement - RSI) ซึ่งเป็นเหตุการณ์สำคัญในอุตสาหกรรมที่ถกเถียงกันและอาจเป็นอันตราย ซึ่งหมายถึงระบบ AI ที่สามารถปรับปรุงและสร้างเวอร์ชันขั้นสูงของตัวเองได้โดยอัตโนมัติ Sarah Heck หัวหน้าฝ่ายนโยบายของ Anthropic กล่าวในเดือนกันยายนว่า 'คุณไม่สามารถทำความปลอดภัยได้หากอยู่ในอันดับที่สอง'", "คำอธิบายนี้ไม่ได้ทำให้ทุกคนพอใจ รวมถึงพนักงานบางคนของ Anthropic หัวหน้าฝ่ายวิจัยความปลอดภัยของ Anthropic ลาออกในเดือนกุมภาพันธ์โดยอ้างว่า 'โลกกำลังตกอยู่ในอันตราย' หนึ่งในนักวิจัย Jacob Coxon เป็นข่าวในเดือนกันยายนโดยอ้างว่าทั้ง Anthropic และ OpenAI กำลัง 'แข่งกันไปสู่ซูเปอร์อินเทลลิเจนซ์ที่ปรับปรุงตัวเองได้ และกำลังเดิมพันกับชีวิตของเรา' และในเดือนเดียวกันนั้น นักวิจัยด้านความปลอดภัยของ Anthropic ก็ลาออกไปทำงานที่ METR ซึ่งเป็นผู้ตรวจสอบ AI ภายนอกที่ไม่แสวงผลกำไร โดยเขียนว่า 'บริษัท AI กำลังอยู่ในเส้นทางที่จะสร้างความเสี่ยงในระดับที่ไม่เคยมีมาก่อนให้กับสังคม' และ 'ในขณะที่ Anthropic ยังไม่มีเหตุการณ์รุนแรงเท่ากับการโจมตี HuggingFace [โดยเอเจนต์ของ OpenAI] ผมคิดว่านั่นเป็นเรื่องของโชคส่วนหนึ่ง'", "เมื่อวันพุธที่ผ่านมา มีแถลงการณ์ใหม่จาก Center for AI Safety พร้อมด้วยผู้ลงนามที่มีชื่อเสียงจากอุตสาหกรรม เช่น Hugging Face, Harvard University และอื่นๆ กล่าวหาว่า Anthropic 'ไม่ใช่บริษัท AI ที่ปลอดภัย' และพยายาม 'สะสมอำนาจในนามของประโยชน์ส่วนรวม' โดยระบุว่า 'Anthropic เตือนว่า AI ที่ปรับปรุงตัวเองแบบเรียกซ้ำอาจรวมศูนย์อำนาจและหลุดจากการควบคุมของมนุษย์ แต่กลับเร่งสร้างมันขึ้นมาก่อน บริษัทใช้การสร้างแบรนด์ด้านความปลอดภัยเพื่อดึงดูดนักลงทุน พนักงาน และสาธารณชน แม้ว่าจะค่อยๆ ลดทอนคำมั่นสัญญาด้านความปลอดภัยของตนเองและล็อบบี้เพื่อกฎระเบียบที่เอื้อประโยชน์ต่อตนเองก็ตาม'", "อดีตพนักงาน Anthropic กล่าวว่าเขารู้สึกว่าตอนแรกเขา 'หลงเชื่อ' ว่า Anthropic จำเป็นต้องเป็นที่หนึ่งในการแข่งขัน AI เพื่อผลลัพธ์ที่ปลอดภัย แต่ต่อมาก็เริ่มตาสว่าง โดยตระหนักว่าการแข่งขันไปสู่จุดสูงสุดนั้นไม่ 'คุ้มค่ากับต้นทุนที่ต้องจ่าย' กล่าวคือ บริษัทเดียวไม่ควรสามารถตัดสินใจ 'โดยลำพัง' ที่จะดำเนินการ RSI (Amodei เคยกล่าวต่อสาธารณะว่า 'หากไม่ได้รับการตรวจสอบ [RSI] อาจวิ่งแซงความสามารถของเราในการเข้าใจและควบคุมระบบเหล่านี้ ดังนั้นจึงต้องดำเนินการอย่างระมัดระวังที่สุด หากจะทำ')", "'มันค่อนข้างไร้สาระที่บริษัทเอกชนกำลังสร้างรูปแบบใหม่ของสติปัญญาที่กำลังจะทรงพลังและมีอิทธิพลต่อโลกมากกว่ามนุษย์ และกำลังทำสิ่งนั้นด้วยการกำกับดูแลที่น้อยกว่ารถขายทาโก้ในปัจจุบัน' อดีตพนักงานกล่าว", "เว็บไซต์ของ Anthropic ระบุว่า 'ท้ายที่สุดแล้ว พันธกิจคือสิ่งที่เราทุกคนอยู่ที่นี่เพื่อมัน มันให้จุดมุ่งหมายร่วมกันและช่วยให้เราดำเนินการได้อย่างรวดเร็ว แทนที่จะถูกดึงไปในหลายทิศทางด้วยเป้าหมายที่ขัดแย้งกัน มันสร้างความไว้วางใจและความร่วมมือ และเป็นผู้ตัดสินสุดท้ายในการตัดสินใจของเรา' คำถามคือการตีความพันธกิจของ Anthropic จะเปลี่ยนไปอย่างไร เมื่อต้องเผชิญกับแรงกดดันมากกว่าที่เคยในการสร้างมูลค่าตลาดที่เจือจางเต็มที่ประมาณ 1.5 ล้านล้านดอลลาร์"], "link": "https://www.theverge.com/ai-artificial-intelligence/1037459/anthropic-ipo-safe-ai-reputation-power-structure", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1037459/anthropic-ipo-safe-ai-reputation-power-structure", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/03/STK202_DARIO_AMODEI_CVIRGINIA_D.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795098337, "published_at": "2026-11-19T14:25:37Z", "published_th": "19 พ.ย. 2026 • 21:25 น.", "category_hint": "Technology"}, {"id": 1795093335967, "guid": "https://www.theverge.com/?p=1037100", "original_title": "I let Apple’s always-listening AI summarize my life for two weeks", "thai_title": "ทดลองใช้ Siri Recap บน Apple Watch Ultra 4: เมื่อ AI คอยฟังบทสนทนาตลอดเวลาเพื่อสรุปชีวิตประจำวัน", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Siri Recap เป็นฟีเจอร์ใหม่บน Apple Watch Ultra 4 ที่ใช้ AI ช่วยสรุปบทสนทนาในชีวิตประจำวัน โดยเน้นความเป็นส่วนตัวเป็นหลัก", "Apple ออกแบบระบบให้ประมวลผลภายในเครื่อง (On-device) และใช้ Private Cloud Compute โดยไม่มีการบันทึกไฟล์เสียงดิบไว้", "ข้อจำกัดของระบบคือความแม่นยำในการแยกแยะบทสนทนาจริงออกจากเสียงรอบข้าง เช่น เสียงจากวิดีโอในโซเชียลมีเดีย ทำให้สรุปผลคลาดเคลื่อน", "การใช้งานจริงยังมีความท้าทายด้านจริยธรรมและบรรทัดฐานทางสังคม เนื่องจากผู้ใช้งานต้องคอยชี้แจงและขอความยินยอมจากบุคคลรอบข้างอยู่เสมอ", "ผู้ทดสอบสรุปว่าฟีเจอร์นี้ยังไม่ตอบโจทย์การใช้งานจริงในชีวิตประจำวัน และการไม่มีฟีเจอร์นี้อาจช่วยให้ชีวิตเรียบง่ายกว่าการต้องคอยกังวลเรื่องความเป็นส่วนตัว"], "full_paragraphs": ["ตลอดระยะเวลากว่าหนึ่งเดือนที่ผ่านมา ผมได้ทดสอบใช้งานทั้ง Amazon Bee Frontier และ Siri Recap บน Apple Watch Ultra 4 ซึ่งอุปกรณ์สวมใส่ทั้งสองรุ่นนี้มีความสามารถในการฟังบทสนทนาโดยรอบและใช้ AI สรุปเนื้อหาให้เราฟัง คำถามสำคัญคือทำไปเพื่ออะไร? คำตอบคือเพื่อให้เราจดจำเรื่องราวได้ดีขึ้นและมีสมาธิอยู่กับปัจจุบันมากขึ้น", "ความแตกต่างหลักคือ Amazon Bee เลือกใช้วิธีการแบบสุดโต่ง (ซึ่งในความเป็นจริงอาจดูเกินจริงไปบ้าง) ในขณะที่ Apple เลือกแนวทางแบบมินิมอลที่ให้ความสำคัญกับความเป็นส่วนตัวเป็นอันดับแรก อย่างไรก็ตาม ทั้งสองระบบจำเป็นต้องมีการเปิดเผยข้อมูลอย่างชัดเจนต่อคนรอบข้างว่ามีการบันทึกเสียง และอาจต้องมีการอธิบายเพิ่มเติมว่าระบบทำงานอย่างไร ในสัปดาห์ที่ผ่านมา ผมได้ทดสอบ Siri Recap เวอร์ชันเบต้าเพื่อดูว่าประสบการณ์การใช้งานของ Apple นั้นดูไม่เป็นดิสโทเปียจนเกินไปหรือไม่", "Apple นำเสนอ Siri Recap ในฐานะเครื่องมือช่วยจดบันทึกสำรอง สำหรับนักศึกษา คุณอาจไม่ต้องกังวลกับการจดตามสิ่งที่อาจารย์พูดและสามารถโฟกัสกับการฟังบรรยายได้เต็มที่ หรือหากคุณไปประชุมผู้ปกครองเพียงลำพัง คุณก็สามารถโฟกัสกับบทสนทนาแล้วค่อยมาเปิดดูสรุปในโทรศัพท์ภายหลังเพื่อนำไปเล่าต่อให้คู่สมรสฟังได้", "แม้จะเป็นสถานการณ์ที่ดูไม่มีพิษมีภัย แต่เมื่อพิจารณาจากกระแสวิพากษ์วิจารณ์เรื่องความเป็นส่วนตัวและอุปกรณ์สอดแนมในปีนี้ ก็ง่ายที่จะจินตนาการว่าอุปกรณ์ที่คอยฟังตลอดเวลาอาจถูกนำไปใช้ในทางที่ผิด Apple จึงระมัดระวังอย่างมากในการสร้างฟีเจอร์นี้ โดยคำนึงถึงความรู้สึกของบุคคลรอบข้างที่อาจไม่สบายใจหากรู้ว่า Apple Watch ของคนอื่นกำลังจดบันทึกสิ่งที่พวกเขาพูด", "ฟีเจอร์นี้ไม่ได้เปิดใช้งานเป็นค่าเริ่มต้น คุณต้องเลือกเปิดใช้งานเอง (Opt-in) และสามารถตั้งค่าช่วงเวลาที่ต้องการให้ทำงานได้ เช่น เฉพาะเวลาทำงานช่วง 13.00-14.00 น. ในวันธรรมดา นอกจากนี้ สรุปทั้งหมดจะถูกลบโดยอัตโนมัติหลังจากผ่านไป 1, 3 หรือ 7 วัน ตามที่คุณเลือก ภายในสรุปจะไม่มีการถอดความแบบละเอียดว่าใครพูดอะไรตอนไหน ซึ่งทำให้ยากต่อการนำไปใช้เป็นหลักฐานในการโต้เถียง คดีความ หรือการแบล็กเมล์ และไม่มีการบันทึกไฟล์เสียงดิบไว้เลย โดยเสียงจะถูกประมวลผลและลบทันทีผ่าน Secure Enclave ในชิป S11 ของ Apple Watch รุ่นปี 2026 ซึ่งแม้แต่ Apple หรือบุคคลที่สามก็ไม่สามารถเข้าถึงได้ การประมวลผลส่วนใหญ่ทำในเครื่อง และหากมีการส่งข้อมูลไปยังคลาวด์ก็จะทำผ่าน Private Cloud Compute ของ Apple เท่านั้น ซึ่งหมายความว่าฟีเจอร์นี้ไม่สามารถใช้กับ Apple Watch รุ่นเก่าได้", "อย่างไรก็ตาม ระบบนี้ยังไม่สมบูรณ์ ต่างจากฟีเจอร์ Live Rewind ที่ไม่มีสัญญาณไฟหรือเสียงแจ้งเตือนเมื่อมีการบันทึก ดังนั้นหากคุณตัดสินใจที่จะเปิดเผยการใช้งานอย่างมีจริยธรรม คุณต้องเตรียมตัวอธิบายทุกอย่างที่ผมกล่าวมาข้างต้นหากมีคนถาม", "ความเป็นจริงคือ ความเป็นส่วนตัวที่มากขึ้นมักแลกมาด้วยผลิตภัณฑ์ AI ที่มีประโยชน์น้อยลง ยิ่ง AI รู้เรื่องของคุณมากเท่าไหร่ สรุปที่ได้ก็มักจะดีขึ้นเท่านั้น แต่เพื่อรักษาความเป็นส่วนตัว Apple จึงป้องกันไม่ให้ Siri เรียนรู้ทุกอย่างเกี่ยวกับคุณและคนรอบข้าง ตัวอย่างเช่น Siri Recap ไม่ได้ฝึกฝนจากเสียงของคุณ ซึ่งดีต่อความเป็นส่วนตัวมาก! แต่นั่นก็ทำให้ Siri แยกแยะได้ยากขึ้นว่าเมื่อไหร่ที่คุณกำลังสนทนาอยู่จริงๆ ซึ่งนำไปสู่สรุปที่ตลกแต่ไม่ค่อยมีประโยชน์เท่าไหร่", "ตัวอย่างเช่น ผมกำลังดู TikTok ที่ครีเอเตอร์คนหนึ่งอัปเดตอาการป่วยให้ผู้ติดตามฟังว่าถูกส่งตัวเข้าห้องฉุกเฉินเพราะภาวะติดเชื้อในกระแสเลือด แต่ Siri กลับสรุปวิดีโอนั้นราวกับว่าผมหรือคนที่ผมรู้จักถูกส่งตัวเข้าห้องฉุกเฉิน หรืออีกกรณีคือ TikTok ที่วิจารณ์กระทู้ Reddit เรื่อง AITA ซึ่งถูกสรุปราวกับว่าผมกำลังพูดคุยเรื่องผู้หญิงคนหนึ่งที่พยายามแย่งสามีเพื่อนสนิทด้วยการใส่บิกินี่สีฟ้าแวววาวไปงานคอนเสิร์ต เนื่องจากไม่มีการระบุตัวตน สรุปจึงอ่านดูเหมือนว่าผมเป็นคู่สมรสที่กลับบ้านตอนตี 2-3 ในสภาพที่มีกากเพชรของ Dana ติดตัวมาด้วย ทั้งสองกรณีนี้ทำให้สรุปที่ได้ทั้งตลกและสับสน", "นอกจากนี้ วิดีโอทั้งสองรายการไม่ใช่สิ่งที่ผมต้องการหรือจำเป็นต้องจำ ผมสงสัยว่า Siri สรุปเพราะผมเปิดเสียงจากโทรศัพท์ที่วางอยู่ใกล้ Apple Watch มากเกินไป มีวิธีแก้ปัญหาง่ายๆ คือ Siri Recap จะปิดอัตโนมัติหากคุณใช้หูฟัง ซึ่งหมายความว่าผมสามารถตัดสรุปจากพอดแคสต์ หนังสือเสียง หรือรายการทีวีได้โดยการใส่ AirPods ตลอดเวลา แต่นั่นคือการที่ผมต้องปรับพฤติกรรมเพื่อรองรับความไม่สามารถของ Siri ในการแยกแยะว่าเมื่อไหร่ที่ผมกำลังพูดอยู่", "อีกหนึ่งความแปลกคือ Siri ไม่รู้ว่าผมต้องการจำอะไรหรืออะไรที่น่าจดจำจากบทสนทนา ผมเปิด Siri Recap ระหว่างการบรรยายสรุปและเดโมแว่นตาอัจฉริยะจาก Google, Samsung, Gentle Monster และ Warby Parker เมื่อผมมานั่งเขียนงาน สรุปที่ได้ช่วยให้ผมจำหัวข้อหลักที่คุยกันได้ และผมพบว่ามันมีประโยชน์ที่สรุปการสัมภาษณ์บางส่วนเชื่อมโยงกับไฟล์ Voice Memos ที่เกี่ยวข้อง แต่ปัญหาคือ Siri Recap ให้ความสำคัญกับการระบุข้อเท็จจริงเป็นหลัก ทำให้สรุปมักเน้นไปที่สถิติ ข้อมูลย่อย และวันที่ ซึ่งมีประโยชน์ในการประชุมวางแผน แต่ไม่ค่อยมีประโยชน์สำหรับสิ่งที่ผมมองว่าเป็นประเด็นสำคัญส่วนตัว เช่น ในการสัมภาษณ์แหล่งข่าว สิ่งที่ผมสนใจที่สุดคือเกร็ดเล็กเกร็ดน้อยส่วนตัวและความเห็นที่รุนแรงเกี่ยวกับ RFK Jr. แต่ Siri Recap กลับละทิ้งสิ่งเหล่านั้นไปเพื่อเน้นรายละเอียดที่เป็นรูปธรรมมากกว่า", "ในขณะเดียวกัน บทสนทนาส่วนตัวมักไม่ตรงไปตรงมา การประชุมงานมักมีวาระการประชุม แต่การคุยกับเพื่อนและครอบครัวสามารถกระโดดไปมาได้นับล้านเรื่องภายใน 10 นาที และบทสนทนาส่วนใหญ่ของผมก็ควรถูกลบออกจากสมองเพื่อเว้นที่ว่างให้กับเรื่องที่สำคัญจริงๆ ผมไม่จำเป็นต้องเห็นสรุปโดยละเอียดว่าผมและคู่สมรสคิดอย่างไรกับตอนล่าสุดของ The Curse (มันบ้ามาก) และผมอยากจะลืมการโต้เถียง 20 นาทีกับลูกพี่ลูกน้องเรื่องเครื่องตรวจจับควันแบบเดินสายไฟกับแบบใช้แบตเตอรี่ไปเลย (น่าเสียดายที่สรุปดันระบุประเด็นหลักไว้ครบ) สรุปการถกเถียงเรื่องแนะนำภาพยนตร์อาจมีประโยชน์ แต่มันกลับเขียนแค่ว่า “กำลังหาสื่อที่ไม่ทำให้วิตกกังวล” และ “ปฏิเสธที่จะดู Star Wars ตลอดไป”", "สรุปของผมยังเป็นบทเรียนว่าทำไมบริบทของบทสนทนาถึงสำคัญ บางครั้ง Siri ก็เดาถูกว่าเรื่องซุบซิบไม่เกี่ยวข้องกับบทสนทนาหลักและตัดออกไปทั้งหมด แต่บางครั้งสรุปที่ตรงไปตรงมาของมุกตลกหรือการระบายความในใจของเพื่อนก็อ่านดูเหมือน Regina George จาก Mean Girls ที่กำลังสร้าง Burn Book ด้วย AI", "ความไม่สม่ำเสมอนั้นคือเหตุผลว่าทำไมการพึ่งพา AI ให้ตัดสินใจแทนเราถึงรู้สึกไม่น่าไว้วางใจ ผมยังคงติดอยู่กับคำถามที่ว่าฟีเจอร์เหล่านี้มีไว้เพื่อแก้ปัญหาอะไร บริษัทเทคโนโลยีมักบอกว่าการฟังโดยรอบมีไว้เพื่อช่วยเตือนความจำหรือช่วยให้เราอยู่กับปัจจุบันมากขึ้น ซึ่งนำผมกลับมาที่คำถามแรก: มันคุ้มค่าหรือไม่? ความพยายามของ Apple ในการปกป้องความเป็นส่วนตัวพิสูจน์ได้หรือไม่ว่าเราสามารถมี AI ช่วยจดบันทึกโดยที่ยังรักษาความเป็นส่วนตัวไว้ได้?", "นอกเหนือจากสถานการณ์ที่เกี่ยวข้องกับงานไม่กี่อย่าง ผมไม่พบว่า Siri Recap มีประโยชน์ แม้แต่ตอนเขียนบทความนี้ ผมยังต้องใช้เวลาเลื่อนหาตัวอย่างเพียงไม่กี่อย่างที่ผมอยากจะพูดถึง ข้อดีคือผมไม่กังวลมากนักว่าจะมีใครมาแอบดูสรุปของผม จากสรุปกว่า 50 รายการ ผมมั่นใจว่า 90 เปอร์เซ็นต์คงเป็นเรื่องไร้สาระสำหรับคนอื่นที่ไม่ใช่ผม ในทางกลับกัน ผมพบว่าสิ่งที่ Amazon Bee สร้างขึ้นนั้น “มีประโยชน์” มากกว่า แต่หลังจากเห็นไฟล์ถอดความดิบและสรุปทุกช่วงเวลาที่พูดในชีวิต ผมเชื่อว่าเราไม่ได้ถูกสร้างมาให้ใช้ชีวิตแบบนั้น ผมจึงลบข้อมูล Bee ทั้งหมดทิ้งไปแล้ว", "แต่ถึงแม้ผมจะชอบแนวทางของ Apple ด้วยเหตุผลด้านความเป็นส่วนตัว แต่สัญชาตญาณบอกผมว่าเทคโนโลยีนี้ไม่ใช่คำตอบสำหรับการเตือนความจำหรือการอยู่กับปัจจุบัน เมื่อไหร่ก็ตามที่ผมลืมเรื่องต่างๆ ผลกระทบเชิงลบมักไม่เคยนำไปสู่การเปลี่ยนแปลงชีวิตในทางที่แย่ลงอย่างถาวร โดยปกติแล้วมันเป็นบทเรียนที่ขมขื่นที่บังคับให้ผมต้องเติบโตและปรับตัว และทุกครั้งที่ผมไม่ได้อยู่กับปัจจุบัน มักเป็นเพราะผมมัวแต่เล่นโทรศัพท์", "อุปกรณ์สวมใส่ที่คอยฟังโดยรอบอาจมีประโยชน์เมื่อใช้ในสถานการณ์ที่มีความเสี่ยงต่ำและตรงไปตรงมา โดยที่ทุกคนยินยอม แต่สำหรับผม มันมักจะเป็นเรื่องเล็กน้อยที่มีทางเลือกอื่นที่รุกล้ำน้อยกว่า ผมหมายถึงการที่ต้องคอยอธิบายให้คนรอบข้างที่ไม่ค่อยเชี่ยวชาญเทคโนโลยีฟังว่า Apple Watch ของผมมีฟีเจอร์นี้ที่คอยสรุปบทสนทนา ต้องคอยดูสีหน้าของพวกเขาที่กำลังครุ่นคิด ต้องรวบรวมความกล้าเพื่อตอบคำถามว่า Apple จัดการความเป็นส่วนตัวอย่างไรเมื่อเทียบกับอุปกรณ์อื่นที่ผมเคยทดสอบ ต้องยิ้มเมื่อคู่สมรสล้อเล่นว่าจะเซ็นเซอร์มุกตลกเพราะงานของผม ต้องเขียนบอกใน Slack ของที่ทำงานว่าเมื่อเพื่อนร่วมงานเห็นผมในออฟฟิศ ผมกำลังทดสอบอุปกรณ์ AI ที่อาจบันทึกบทสนทนาอยู่ และผมยินดีที่จะปิดมันหากทำให้พวกเขาไม่สบายใจ ต้องชั่งน้ำหนักว่าผมมีเวลาหรือพลังงานพอไหมก่อนเริ่มบทสนทนากับคนแปลกหน้าเพื่อให้เป็นคนรอบคอบและมีจริยธรรม", "ในตอนนี้ ยังไม่มีบรรทัดฐานทางวัฒนธรรมที่ชัดเจนบอกผมว่าต้องจ่ายต้นทุนเหล่านี้อย่างไร สิ่งเดียวที่ผมรู้คือถ้าผมปิดฟีเจอร์นี้ไป ผมก็ไม่ต้องคิดถึงมันอีกเลย"], "link": "https://www.theverge.com/tech/1037100/apple-siri-recap-audio-intelligence-hands-on", "canonical_link": "https://www.theverge.com/tech/1037100/apple-siri-recap-audio-intelligence-hands-on", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/268874_siri_recaps_AKrales_0070.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/268874_siri_recaps_AKrales_0077.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/268874_siri_recaps_AKrales_0033.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/268874_siri_recaps_AKrales_0041.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/268874_siri_recaps_AKrales_0003.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795093200, "published_at": "2026-11-19T13:00:00Z", "published_th": "19 พ.ย. 2026 • 20:00 น.", "category_hint": "Technology"}, {"id": 1795091577584, "guid": "https://www.theverge.com/?p=1037126", "original_title": "Canva adds an AI ‘off’ button", "thai_title": "Canva เพิ่มปุ่มปิดการใช้งานฟีเจอร์ AI ให้ผู้ใช้เลือกควบคุมได้เอง", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["Canva เปิดตัวตัวเลือกใหม่ให้ผู้ใช้สามารถปิดการใช้งานฟีเจอร์ Generative AI ได้แล้ว", "ฟีเจอร์พื้นฐานอย่างการลบพื้นหลัง (Background Remover) และ Magic Grab จะยังคงใช้งานได้ปกติแม้ปิดระบบ AI หลัก", "ผู้ใช้สามารถตั้งค่าให้ระบบแสดงผลเนื้อหาที่สร้างโดยมนุษย์เป็นอันดับแรกในคลังข้อมูลของ Canva ได้", "การเปลี่ยนแปลงนี้มีผลกับทั้งผู้ใช้บัญชีฟรีและบัญชีแบบเสียค่าบริการ (Paid users)"], "full_paragraphs": ["Canva ได้ประกาศอัปเดตใหม่ที่เปิดโอกาสให้ผู้ใช้งานสามารถปิดการทำงานของฟีเจอร์ Generative AI ได้แล้ว โดยการเปลี่ยนแปลงนี้ช่วยให้ผู้ใช้สามารถเลือกปิดชุดเครื่องมือ AI ต่างๆ ของแพลตฟอร์มออกแบบกราฟิกนี้ได้ เช่น ฟีเจอร์ Magic Expand สำหรับขยายภาพด้วย AI รวมถึงการปิดความสามารถในการสร้างรูปภาพผ่าน Canva chatbot", "อย่างไรก็ตาม ปุ่มสวิตช์นี้ไม่ได้ปิดการทำงานของฟีเจอร์ที่ขับเคลื่อนด้วย AI ทั้งหมดบน Canva โดยฟีเจอร์อย่างการลบพื้นหลัง (Background remover) และเครื่องมือ Magic Grab ที่ช่วยให้ผู้ใช้สามารถเลือกวัตถุในภาพแล้วย้ายตำแหน่งได้นั้น จะยังคงใช้งานได้ตามปกติ โดยทาง Canva ระบุว่า “ทั้งสองฟีเจอร์นี้จะยังคงใช้งานได้แม้ในขณะที่สวิตช์ Generative AI ถูกปิดอยู่ เนื่องจากฟีเจอร์เหล่านี้ทำงานกับสิ่งที่อยู่ในงานออกแบบอยู่แล้วเท่านั้น”", "ในขณะเดียวกัน สวิตช์ดังกล่าวจะทำการปิดฟีเจอร์ AI อื่นๆ ของ Canva อีกหลายรายการ ได้แก่ Magic Write, Magic Design, Magic Layers, Magic Edit, Dream Lab, Canva Code, AI Shapes และอื่นๆ อีกมากมาย", "นับตั้งแต่ Canva เริ่มรุกตลาด AI อย่างเต็มตัวในปี 2023 ผู้ใช้งานจำนวนหนึ่งได้แสดงความไม่พอใจต่อการเพิ่มเข้ามาของฟีเจอร์ AI จำนวนมาก และได้เรียกร้องให้มีช่องทางในการปิดการใช้งานฟีเจอร์เหล่านี้ ซึ่งที่ผ่านมา Canva ได้ขยายชุดเครื่องมือแก้ไขภาพด้วย AI อย่างต่อเนื่อง ไม่ว่าจะเป็นการอัปเดตฟีเจอร์แก้ไขภาพด้วยคำสั่ง Prompt ในเดือนเมษายน และการเปิดตัวโมเดล AI ของบริษัทเองที่ชื่อว่า Canva Craft เมื่อเดือนที่แล้ว", "นอกจากนี้ ผู้ใช้ยังสามารถเลือกเปิดสวิตช์เพื่อลดการแสดงผลเนื้อหาที่สร้างโดย AI ในคลังข้อมูลของ Canva ได้อีกด้วย หากเปิดตัวเลือกนี้ ระบบจะแสดงเนื้อหาที่สร้างโดยมนุษย์เป็นอันดับแรกเมื่อมีการค้นหาเทมเพลต กราฟิก และองค์ประกอบการออกแบบอื่นๆ โดย Canva ระบุว่าเนื้อหาที่สร้างโดย AI นั้นมีสัดส่วนเพียง “ส่วนน้อย” ของคลังข้อมูลทั้งหมด และงานออกแบบใดก็ตามที่ใช้เนื้อหาเหล่านี้จะมีป้ายกำกับ AI ระบุไว้ในข้อมูล Metadata", "สำหรับผู้ที่ต้องการปิดฟีเจอร์ AI ของ Canva สามารถเข้าไปที่ Profile > Settings > Permission แล้วทำการปิดสวิตช์ Enable generative AI features ส่วนการตั้งค่าให้แสดงเนื้อหาที่สร้างโดย AI น้อยลง สามารถทำได้โดยไปที่ Profile > Your account > AI personalization แล้วเปิดตัวเลือกเพื่อแสดงเนื้อหา AI น้อยลง ซึ่งการตั้งค่าเหล่านี้เปิดให้ใช้งานได้ทั้งผู้ใช้บัญชีฟรีและบัญชีแบบเสียค่าบริการ"], "link": "https://www.theverge.com/ai-artificial-intelligence/1037126/canva-ai-features-off-button", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1037126/canva-ai-features-off-button", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25355957/STK263_CANVA_D.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795091400, "published_at": "2026-11-19T12:30:00Z", "published_th": "19 พ.ย. 2026 • 19:30 น.", "category_hint": "Technology"}, {"id": 1795052730021, "guid": "https://www.theverge.com/?p=1037448", "original_title": "Elon Musk tries to explain what&#8217;s going on with Ukraine and Starlink", "thai_title": "Elon Musk โต้กลับ Zelenskyy ปม Starlink ยันไม่ได้มีไว้เพื่อการทหาร", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Elon Musk ออกมาปฏิเสธข้อกล่าวหาของ Volodymyr Zelenskyy ประธานาธิบดียูเครน เกี่ยวกับปัญหาการใช้งาน Starshield ในยูเครน", "Musk ยืนยันว่า Starlink เป็นบริการสำหรับผู้บริโภคทั่วไป ไม่ได้ถูกออกแบบมาเพื่อใช้ในภารกิจทางทหารเชิงรุก", "การออกมาให้สัมภาษณ์ครั้งนี้เกิดขึ้นที่งาน DealBook Summit ของ The New York Times เพื่อชี้แจงความขัดแย้งที่ยืดเยื้อมานานหลายสัปดาห์", "Musk ระบุว่าความพยายามของยูเครนในการนำ Starlink ไปใช้ในปฏิบัติการทางทหารนั้นเป็นการใช้งานที่ผิดวัตถุประสงค์ของบริษัท SpaceX"], "full_paragraphs": ["Elon Musk ได้ออกมากล่าวหาว่า Volodymyr Zelenskyy ประธานาธิบดียูเครน กำลังให้ข้อมูลเท็จเกี่ยวกับปัญหาการหยุดชะงักของบริการ Starshield ในยูเครน โดยเขายืนยันว่าทางรัฐบาลยูเครนกำลังพยายามนำ Starlink ซึ่งเป็นบริการอินเทอร์เน็ตผ่านดาวเทียมสำหรับผู้บริโภคของ SpaceX ไปใช้ในภารกิจทางทหารอย่างผิดวัตถุประสงค์", "คำกล่าวของ Musk เกิดขึ้นระหว่างการให้สัมภาษณ์บนเวทีงาน DealBook Summit ของ The New York Times เมื่อวันพุธที่ผ่านมา โดยเขาพยายามอธิบายถึงความขัดแย้งที่เกิดขึ้น หลังจากที่มีการโต้ตอบกันไปมาตลอดหลายสัปดาห์เกี่ยวกับบทบาทของเทคโนโลยีจาก SpaceX ในสมรภูมิยูเครน", "Musk ได้ชี้แจงถึงความแตกต่างระหว่าง Starlink ซึ่งเป็นบริการเชิงพาณิชย์ที่มุ่งเน้นการเชื่อมต่อสำหรับประชาชนทั่วไป กับ Starshield ซึ่งเป็นแพลตฟอร์มที่ออกแบบมาเพื่อรองรับภารกิจด้านความมั่นคงและรัฐบาลโดยเฉพาะ โดยเขาระบุว่าการที่ยูเครนพยายามนำ Starlink ไปใช้ในปฏิบัติการทางทหารนั้นถือเป็นการใช้งานที่อยู่นอกเหนือขอบเขตการให้บริการที่บริษัทตั้งไว้", "การออกมาให้สัมภาษณ์ในครั้งนี้ถือเป็นความพยายามล่าสุดของ Musk ในการจัดการกับกระแสวิพากษ์วิจารณ์เกี่ยวกับอิทธิพลของเขาทั้งในฐานะผู้บริหาร SpaceX และในฐานะบุคคลที่มีบทบาทสำคัญต่อโครงสร้างพื้นฐานด้านการสื่อสารในพื้นที่ความขัดแย้งระดับโลก ซึ่งประเด็นนี้ยังคงเป็นที่จับตามองอย่างใกล้ชิดจากทั้งภาคส่วนเทคโนโลยีและการเมืองระหว่างประเทศ"], "link": "https://www.theverge.com/tech/1037448/elon-musk-ukraine-starlink-starshield-nyt-dealbook", "canonical_link": "https://www.theverge.com/tech/1037448/elon-musk-ukraine-starlink-starshield-nyt-dealbook", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/04/STK022_ELON_MUSK_CVIRGINIA_C.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795052385, "published_at": "2026-11-19T01:39:45Z", "published_th": "19 พ.ย. 2026 • 08:39 น.", "category_hint": "Technology"}, {"id": 1795044643705, "guid": "https://www.theverge.com/?p=1037151", "original_title": "The nation’s largest school districts consider ditching Google Search", "thai_title": "เขตการศึกษาใหญ่ที่สุดในสหรัฐฯ จ่อเลิกใช้ Google Search หลังถูกบังคับให้เปิดใช้งานฟีเจอร์ AI", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["เขตการศึกษาในนิวยอร์ก ลอสแอนเจลิส และชิคาโก กำลังพิจารณาหาทางเลือกอื่นแทน Google Search", "Google ประกาศนโยบายใหม่ที่จะปิดการใช้งาน Search สำหรับโรงเรียนที่เลือกปิดฟีเจอร์ AI ของ Gemini", "นักการเมืองและผู้บริหารการศึกษาหลายฝ่ายวิจารณ์นโยบายนี้อย่างรุนแรง โดยมองว่าเป็นการบีบบังคับ (Extortion)", "Google ชี้แจงว่า Search และ AI มีความเชื่อมโยงกันอย่างลึกซึ้ง แต่ยืนยันว่าจะปรับปรุงการควบคุมให้โรงเรียนเลือกเปิด-ปิดบริการได้ตามความเหมาะสมในอนาคต", "ความกังวลหลักของโรงเรียนคือผลกระทบของ AI ต่อทักษะการคิดวิเคราะห์ของนักเรียนและสุขภาพจิตของเด็ก"], "full_paragraphs": ["Google กำลังพยายามผลักดันให้ Gemini เข้าไปเป็นส่วนหนึ่งในสถานศึกษา แต่ดูเหมือนว่าทางโรงเรียนจะไม่ค่อยปลื้มกับแนวทางนี้เท่าไรนัก", "รายงานจาก The New York Times ระบุว่า เขตการศึกษาในนิวยอร์ก ลอสแอนเจลิส และชิคาโก กำลังพิจารณาหาทางเลือกอื่นแทน Google หลังจากที่บริษัทประกาศว่าจะปิดการใช้งาน Search สำหรับโรงเรียนที่เลือกปิดฟีเจอร์ AI ของตน โดยเริ่มตั้งแต่ปีหน้าเป็นต้นไป โรงเรียนจะไม่มีสิทธิ์เลือกปิดฟีเจอร์ที่ขับเคลื่อนด้วย Gemini โดยไม่ปิดการใช้งาน Search ไปด้วย Chris Phillips รองประธานฝ่ายการศึกษาของ Google กล่าวกับ Times ว่า “Search และ AI มีความเชื่อมโยงกันอย่างลึกซึ้ง” และโรงเรียนที่เลือกปิดฟีเจอร์ AI ของ Google “จะไม่มีสิทธิ์เข้าถึง Search”", "นักการเมืองหลายท่าน รวมถึง Zohran Mamdani นายกเทศมนตรีนครนิวยอร์ก และวุฒิสมาชิก Bernie Sanders ได้ออกมาตอบโต้เรื่องนี้อย่างรุนแรง โดยเรียกพฤติกรรมของ Google ว่าเป็นการ “บีบบังคับ” (Extortion) ทั้งนี้ Mamdani เพิ่งประกาศนโยบายห้ามไม่ให้นักเรียนระดับชั้น 2-K-8 ใช้ AI ในห้องเรียนไปเมื่อไม่นานมานี้ ในแถลงการณ์ต่อ Times ทาง Kamar H. Samuels อธิการบดีโรงเรียนนครนิวยอร์กกล่าวว่า “หาก Google ไม่พิจารณาท่าทีของตนใหม่ เราจะสำรวจทางเลือกการค้นหาอื่น ๆ” เช่นเดียวกับเขตการศึกษาของชิคาโกที่มีรายงานว่าได้แจ้งกับ Google ว่าหากบริษัทไม่สามารถจัดหาเวอร์ชันของ Search ที่ไม่มี AI ได้ “ทางเขตจะมองหาโซลูชันการค้นหาอื่นแทน”", "ในแถลงการณ์ต่อ The Verge โฆษกของ Google อย่าง Laura Breen ระบุว่า “เราได้รับฟังความกังวลจากผู้ปกครองและครูเกี่ยวกับการที่นักเรียนใช้ AI เพื่อทางลัดในการเรียนรู้ และเรามีเป้าหมายเดียวกันคือการช่วยให้นักเรียนได้เรียนรู้ เพื่อปรับปรุง Search สำหรับห้องเรียน เรากำลังเริ่มทดสอบความสามารถ Guided Learning ใน Search เดือนนี้ เพื่อนำทางนักเรียนทีละขั้นตอนในการแก้ปัญหาที่ซับซ้อน แทนที่จะให้คำตอบสำเร็จรูปเพียงอย่างเดียว นอกจากนี้ ในปีหน้าเราจะปรับปรุงแนวทางการควบคุมสำหรับโรงเรียนเพื่อตอบสนองต่อข้อเสนอแนะจากนักการศึกษา โดยแอป Gemini, Gemini Notebook และ Search จะถูกปิดเป็นค่าเริ่มต้นจนกว่าโรงเรียนจะตัดสินใจว่าจะเปิดใช้บริการใดบ้าง เรากำลังสร้างประสบการณ์เหล่านี้ร่วมกับนักการศึกษาอย่างจริงจัง และรับฟังอย่างใกล้ชิดเพื่อให้มั่นใจว่าผลิตภัณฑ์ของเราจะสนับสนุนทั้งนักเรียนและครู”", "นักการศึกษายังคงมีความกังวลเกี่ยวกับผลกระทบของ AI ต่อทักษะการคิดวิเคราะห์ของนักเรียน โดยงานวิจัยบางชิ้นแสดงให้เห็นว่านักเรียนที่ใช้ AI มักจะมีผลการทดสอบที่แย่ลง นอกจากนี้ยังมีข้อกังวลเกี่ยวกับผลกระทบต่อสุขภาพจิตของเด็กที่สร้างความสัมพันธ์กับแชทบอตตั้งแต่อายุยังน้อย อย่างไรก็ตาม Google ได้ฝังตัวอยู่ในห้องเรียนทั่วสหรัฐฯ อย่างลึกซึ้งผ่านบริการอย่าง Google Classroom, Chromebooks และบริการอื่น ๆ ซึ่งการจะถอนตัวจากการใช้บริการของ Google อย่างเต็มรูปแบบอาจเป็นเรื่องที่ทำได้ยาก"], "link": "https://www.theverge.com/ai-artificial-intelligence/1037151/school-districts-ditching-google", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1037151/school-districts-ditching-google", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/01/STK255_Google_Gemini_D.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795043915, "published_at": "2026-11-18T23:18:35Z", "published_th": "19 พ.ย. 2026 • 06:18 น.", "category_hint": "Technology"}, {"id": 1795040145398, "guid": "https://www.theverge.com/?p=1037134", "original_title": "Democrats skip a vote on adding Brendan Carr’s adviser to the FCC", "thai_title": "เดโมแครตบอยคอตการโหวตรับรองที่ปรึกษาของ Brendan Carr เข้าสู่ FCC", "tag": "Technology", "sub_tag": "POLICY", "bullet_points": ["สมาชิกวุฒิสภาฝั่งเดโมแครตทั้งหมดในคณะกรรมาธิการพาณิชย์ร่วมกันบอยคอตการประชุมเพื่อโหวตรับรองผู้ได้รับการเสนอชื่อจากประธานาธิบดี Donald Trump เข้าสู่ FCC", "ฝั่งเดโมแครตเรียกร้องให้มีการเสนอชื่อตัวแทนจากพรรคตนเองควบคู่ไปกับการเสนอชื่อฝั่งรีพับลิกัน เพื่อรักษาความสมดุลของคณะกรรมาธิการ", "มีข้อกังขาเรื่องความซื่อสัตย์ของ Thumann ผู้ได้รับการเสนอชื่อ หลังพบหลักฐานว่าเธออาจให้ข้อมูลเท็จต่อคณะกรรมาธิการเกี่ยวกับบทบาทของเธอในประเด็นสื่อ", "Sen. Ben Ray Luján ตั้งคำถามถึงความโปร่งใสของ Thumann และเรียกร้องให้เธอรวมถึง Brendan Carr เข้าชี้แจงต่อคณะกรรมาธิการก่อนสิ้นปีนี้", "แม้จะมีการบอยคอต แต่ฝั่งรีพับลิกันยังคงเดินหน้าโหวตผ่านการเสนอชื่อ Thumann ด้วยคะแนนเสียง 15 ต่อ 0 เพื่อส่งเรื่องเข้าสู่การพิจารณาในที่ประชุมวุฒิสภาต่อไป"], "full_paragraphs": ["Ted Cruz ประธานคณะกรรมาธิการพาณิชย์แห่งวุฒิสภา (รีพับลิกันจากรัฐเท็กซัส) ได้เปิดการประชุมเมื่อวันพุธที่ผ่านมา โดยมีจุดประสงค์เพื่อยืนยันการแต่งตั้งผู้ได้รับการเสนอชื่อจากประธานาธิบดี Donald Trump เข้าสู่คณะกรรมการกลางกำกับดูแลกิจการสื่อสาร (FCC) ทว่าบรรยากาศในที่ประชุมกลับดูไม่สมดุลอย่างเห็นได้ชัด โดยทางฝั่งขวาของ Cruz มีสมาชิกพรรครีพับลิกันทั้ง 14 คนนั่งอยู่ รวมถึง John Thune ผู้นำเสียงข้างมากในวุฒิสภา (รีพับลิกันจากรัฐเซาท์ดาโคตา) ในขณะที่ทางฝั่งซ้ายของเขากลับมีเก้าอี้ว่างเปล่ากว่าหนึ่งโหล เนื่องจากสมาชิกพรรคเดโมแครตทุกคนในคณะกรรมาธิการไม่ได้เข้าร่วมการประชุมในครั้งนี้", "Cruz กล่าวว่าเขาเพิ่งทราบเมื่อคืนก่อนหน้าว่าทางฝั่งเดโมแครตมีแผนที่จะบอยคอตการโหวตครั้งนี้ แม้ว่าทางฝั่งเดโมแครตจะยืนยันว่าพวกเขาได้แสดงความกังวลซ้ำแล้วซ้ำเล่าเกี่ยวกับการผลักดันผู้ได้รับการเสนอชื่อเข้าสู่ FCC ในโควตาของรีพับลิกันโดยไม่มีการเสนอชื่อฝั่งเดโมแครตควบคู่กันมาด้วยก็ตาม “ฝ่ายบริหารได้แสดงให้เห็นแล้วว่ามีความเต็มใจที่จะขยับตัวในส่วนของเดโมแครต” Cruz กล่าว พร้อมชี้ให้เห็นถึงการโหวตในวุฒิสภาที่มีการกำหนดไว้สำหรับคู่การเสนอชื่อแบบสองพรรค (Bipartisan) ทั้งในคณะกรรมาธิการการซื้อขายสัญญาล่วงหน้าสินค้าโภคภัณฑ์ (CFTC) และคณะกรรมการกำกับหลักทรัพย์และตลาดหลักทรัพย์ (SEC) นอกจากนี้ Cruz ยังระบุว่า แม้ศาลสูงสุดจะยืนยันอำนาจของประธานาธิบดีในการดำเนินการดังกล่าว แต่ Trump ก็ยังไม่ได้ดำเนินการปลดสมาชิกฝั่งเดโมแครตออกจาก FCC เหมือนที่เคยทำกับคณะกรรมาธิการการค้าแห่งสหพันธรัฐ (FTC) โดย Cruz ย้ำว่า “นี่เป็นการเสนอชื่อตามปกติเพื่อเติมเต็มตำแหน่งว่างที่เคยถูกถือครองโดยบุคคลจากพรรคเดียวกัน”", "ทางฝั่งเดโมแครตได้เรียกร้องให้มีการระงับการโหวตรับรอง Thumann จนกว่าการเสนอชื่อของเธอจะถูกจับคู่กับการเสนอชื่อจากฝั่งเดโมแครต ซึ่งวิธีหนึ่งในการทำเช่นนั้นคือการเสนอชื่อ Gomez อีกครั้ง แต่จนถึงขณะนี้ ประธานาธิบดียังไม่ได้เสนอชื่อตัวแทนจากฝั่งเดโมแครตสำหรับคณะกรรมาธิการชุดนี้เลย สมาชิกเดโมแครตกล่าวว่าพวกเขาได้แสดงความกังวลต่อ Cruz อย่างชัดเจนแล้ว และเสริมว่า “นี่ไม่ใช่ปัญหาที่เราสร้างขึ้น แต่เป็นปัญหาที่ทำเนียบขาวสามารถแก้ไขได้” ทั้งนี้ ทำเนียบขาวไม่ได้ตอบกลับคำขอความคิดเห็นในทันที", "นอกเหนือจากข้อกังวลด้านกระบวนการแล้ว ฝั่งเดโมแครตยังกังวลเกี่ยวกับการทำงานของ Thumann ในฐานะที่ปรึกษาของ Carr และตั้งคำถามว่าเธอได้ให้ข้อมูลที่เป็นความจริงเกี่ยวกับประเด็นที่เธอเคยรับผิดชอบหรือไม่ โดยในจดหมายที่ส่งถึง Cruz เพื่อขอให้เลื่อนการโหวตรับรองออกไป Sen. Ben Ray Luján (เดโมแครตจากรัฐนิวเม็กซิโก) ได้ระบุรายละเอียดถึงข้อกังวลของเขา ในการไต่สวนเมื่อวันที่ 10 พฤศจิกายน ซึ่ง Thumann ได้ตอบคำถามของสมาชิกคณะกรรมาธิการ เธอให้การว่าเธอ “ไม่ได้ทำงานร่วมกับประธานในประเด็นที่เกี่ยวข้องกับสื่อใดๆ เลย” Luján ระบุในจดหมาย อย่างไรก็ตาม เอกสารที่ได้รับผ่านคำร้องขอตามกฎหมายเสรีภาพข้อมูลข่าวสาร (FOIA) แสดงให้เห็นว่า Thumann ได้รับการ “ดึงเข้ามามีส่วนร่วม” ในประเด็นสื่อต่างๆ และ “ช่วยร่างข้อผูกพันของ Skydance ซึ่งอำนวยความสะดวกให้ FCC อนุมัติการควบรวมกิจการระหว่าง Skydance และ Paramount” Luján เขียนไว้ นอกจากนี้เขายังระบุว่า “เธอยังมีบทบาทในการจัดการข้อร้องเรียนที่ไม่เป็นทางการที่เกี่ยวข้องกับข้อกล่าวหาเรื่องการบิดเบือนข่าวของรายการ CBS 60 Minutes และดูเหมือนว่าเธอจะเป็นผู้ประสานงานในการตอบกลับของคณะกรรมาธิการต่อผู้บริโภคเกี่ยวกับประเด็นความขัดแย้งของ Jimmy Kimmel อีกด้วย” ทั้งนี้ FCC ไม่ได้ตอบกลับคำขอความคิดเห็นในเรื่องนี้ทันที", "ในการให้สัมภาษณ์กับผู้สื่อข่าวนอกห้องประชุมก่อนเริ่มการประชุม Luján ได้กล่าวหาว่า Thumann โกหกต่อคณะกรรมาธิการ “คำถามที่ผมมีคือ หากเธอโกหกเกี่ยวกับเรื่องนี้ แล้วยังมีเรื่องอะไรที่เธอโกหกอีก และยังมีอะไรที่เธอปกปิดไว้อีกบ้าง?” เขากล่าว Luján ระบุว่าเขาต้องการให้ทั้ง Thumann และ Carr มาปรากฏตัวต่อหน้าคณะกรรมาธิการก่อนสิ้นปีนี้เพื่อตอบคำถามของฝ่ายนิติบัญญัติ เมื่อถูกถามว่าเขาจะสนับสนุนการใช้อำนาจออกหมายเรียกของคณะกรรมาธิการ หรือแม้แต่การดำเนินการถอดถอน Carr เมื่อเดโมแครตกลับมามีอำนาจในปีหน้าหรือไม่ Luján กล่าวว่าการโหวตรับรอง Carr เป็นกรรมาธิการภายใต้ประธานาธิบดี Joe Biden คือหนึ่งในสิ่งที่เขาเสียใจที่สุด และแม้ว่าเขาจะหวังว่า Carr จะมาให้การด้วยความสมัครใจ แต่ “ทุกอย่างควรถูกนำมาพิจารณาบนโต๊ะ เพื่อให้สามารถหาคำตอบให้กับประชาชนชาวอเมริกันได้”", "เมื่อถึงเวลาโหวตว่าจะผลักดันการเสนอชื่อของ Thumann ไปสู่ขั้นตอนสุดท้ายของการโหวตในที่ประชุมวุฒิสภาหรือไม่ สมาชิกพรรครีพับลิกันทั้ง 15 คนต่างลงมติ “เห็นชอบ” (Aye) ซึ่งทำให้ Thumann ได้รับคะแนนเสียงเพียงพอที่จะส่งเรื่องเข้าสู่ที่ประชุมวุฒิสภา ซึ่งคาดว่าจะผ่านการรับรองตามแนวทางของพรรคเมื่อมีการกำหนดวันโหวต อย่างไรก็ตาม เสมียนได้อ่านรายชื่อสมาชิกคณะกรรมาธิการฝั่งเดโมแครตทั้ง 13 คนที่มีที่นั่งว่างเปล่าอยู่ แต่ไม่มีการตอบรับใดๆ กลับมา"], "link": "https://www.theverge.com/policy/1037134/democrats-boycott-fcc-nomination-vote-danielle-thumann-severs", "canonical_link": "https://www.theverge.com/policy/1037134/democrats-boycott-fcc-nomination-vote-danielle-thumann-severs", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25840497/STKP211_BRENDAN_CARR_B.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795039548, "published_at": "2026-11-18T22:05:48Z", "published_th": "19 พ.ย. 2026 • 05:05 น.", "category_hint": "Technology"}, {"id": 1795031157804, "guid": "https://www.theverge.com/?p=1036749", "orig ยุค Jensen Huang: เดินหน้าโกยกำไรมหาศาลโดยไม่หันหลังกลับ", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Nvidia ทำกำไรสุทธิเฉลี่ยสูงถึง 8,300 ดอลลาร์ต่อวินาที หรือประมาณ 700 ล้านดอลลาร์ต่อวัน แม้จะเผชิญกับข่าวอื้อฉาวและการลาออกของ Jensen Huang", "รายได้จากศูนย์ข้อมูล (Data Center) กลายเป็นเครื่องจักรผลิตเงินหลัก โดยทำกำไรพุ่งสูงถึง 65,000 ล้านดอลลาร์ต่อไตรมาส ทิ้งห่างยุคบูมของคริปโตและปัญหาขาดแคลน GPU ในอดีตอย่างสิ้นเชิง", "Colette Kress รักษาการ CEO ยืนยันว่าบริษัทจะดำเนินธุรกิจตามแนวทางเดิม โดยมุ่งเน้นการคืนกำไรให้ผู้ถือหุ้นทั้งหมดที่เหลือจากกระแสเงินสดอิสระ", "Nvidia คาดการณ์รายได้ไตรมาสถัดไปไว้ที่ 130,000 ล้านดอลลาร์ โดยยังคงได้รับความร่วมมืออย่างเหนียวแน่นจากพันธมิตรสำคัญอย่าง TSMC"], "full_paragraphs": ["หากมีใครยื่นเงินให้คุณ 8,300 ดอลลาร์ในทุกๆ วินาที คุณจะทำอย่างไร? นั่นคือจำนวนกำไรสุทธิที่ Nvidia ทำได้ในขณะนี้ และในเวลาที่คุณอ่านย่อหน้านี้จบ Nvidia ก็น่าจะกวาดกำไรไปแล้วกว่า 45,000 ดอลลาร์", "เป็นเรื่องง่ายที่จะมองไปยัง Nvidia บริษัทที่เพิ่งสูญเสีย CEO ผู้ก่อตั้งที่มีวิสัยทัศน์กว้างไกลไปจากเหตุการณ์อื้อฉาวหลายระลอก แล้วคิดว่าบริษัทหรืออาจจะรวมถึงอุตสาหกรรม AI ทั้งหมดกำลังตกอยู่ในปัญหาใหญ่ แต่นั่นอาจจะเป็นเพียงมุมมองหนึ่งเท่านั้น", "แต่ผมอยากให้คุณเข้าใจว่า Nvidia ไม่ใช่บริษัทที่ประสบความสำเร็จระดับปานกลางที่อาจต้องการ CEO คนใหม่มาแก้ไขสิ่งที่พังทลาย แต่นี่คือบริษัทที่ประสบความสำเร็จอย่างมหาศาลจนน่าเหลือเชื่อ ซึ่งจะทำทุกวิถีทางเพื่อไม่ให้เรือลำนี้โคลงเคลง เพราะมีเม็ดเงินเดิมพันที่สูงมาก", "มันเป็นจำนวนเงินที่มหาศาลมากจนเมื่อผมได้ยินข่าวการลาออกของ Jensen Huang ความคิดแรกของผมคือ ผมต้องหาวิธีทำให้คุณเห็นภาพจำนวนเงินที่น่าตกใจนี้ ผมต้องการแสดงให้เห็นว่า Nvidia เติบโตขึ้นอย่างรวดเร็วและไกลเกินกว่าที่คู่แข่งอย่าง AMD, Intel และ Qualcomm จะเทียบชั้นได้อีกต่อไป", "หากคุณใช้งานบน Desktop OS คุณสามารถเลื่อนเมาส์ไปบนจุดต่างๆ ในกราฟของเราเพื่อดูตัวเลขที่น่าตกใจเหล่านี้ได้ แต่เราได้สร้างวิธีแสดงภาพการเติบโตของ Nvidia ในรูปแบบอื่นที่ผมชอบมากกว่า นั่นคือกราฟแท่งแนวนอนที่ไม่เพียงแต่แสดงให้เห็นถึงการเติบโตของรายได้ของ Nvidia เท่านั้น แต่ยังแสดงให้เห็นถึงกำไรมหาศาลควบคู่ไปกับเหตุการณ์โลกที่ทำให้ Nvidia กลายเป็นดาวเด่น", "สรุปสั้นๆ คือ ยุคบูมของคริปโตและการขาดแคลน GPU ครั้งใหญ่เทียบไม่ได้เลยกับยุค AI บูม ในช่วงเวลาก่อนหน้านี้ Nvidia มีกำไรสูงสุดเพียง 1,240 ล้านดอลลาร์ และ 3,000 ล้านดอลลาร์ต่อไตรมาสตามลำดับ ในขณะที่การเติบโตของศูนย์ข้อมูลได้ผลักดันให้กำไรพุ่งสูงถึง 65,000 ล้านดอลลาร์ต่อไตรมาสโดยไม่มีทีท่าว่าจะหยุดลง", "ใช่ Jensen อาจจะเผามูลค่าตลาดของ Nvidia ไปกว่าล้านล้านดอลลาร์ จากประมาณ 5 ล้านล้านดอลลาร์ในช่วงต้นเดือนพฤศจิกายน เหลือเพียง 3.6 ล้านล้านดอลลาร์ในปัจจุบัน แต่บริษัทที่กำลังคุกรุ่นนี้ยังคงกวาดกำไรเฉลี่ยวันละ 700 ล้านดอลลาร์", "พูดอีกอย่างคือ Nvidia สามารถมอบโบนัส 1 ล้านดอลลาร์ให้กับพนักงานทุกคนที่มีอยู่ 42,000 คนได้ทุกๆ 3 เดือนโดยที่เงินสดไม่หมด หรือ Nvidia อาจจะยุติความหิวโหยของโลกหรือจัดหาน้ำสะอาดให้กับทุกคนได้เลยในตอนนี้ เพราะบริษัททำกำไรสุทธิได้มากกว่า 200,000 ล้านดอลลาร์ต่อปี", "บางทีนั่นอาจจะทำให้ผู้คนรู้สึกแตกต่างออกไปเกี่ยวกับศูนย์ข้อมูล?", "แต่ถึงแม้เราจะยึดติดกับทุนนิยมที่เน้นผลประโยชน์ส่วนตน คุณก็น่าจะเป็นนักลงทุนที่มีความสุขหากคุณซื้อหุ้น Nvidia เมื่อทศวรรษที่แล้ว การลงทุน 1,000 ดอลลาร์เมื่อ 10 ปีก่อน ตอนนี้มีมูลค่ามากกว่า 67,000 ดอลลาร์ และคุณจะมีเงินมากกว่า 1 ล้านดอลลาร์หากคุณลงทุน 15,000 ดอลลาร์ในตอนนั้น", "และอย่าเข้าใจผิด Nvidia ยังคงยึดมั่นในทุนนิยม Colette Kress รักษาการ CEO ของ Nvidia เพิ่งให้คำมั่นว่าจะคืนเงินให้ผู้ถือหุ้นให้มากที่สุดเท่าที่จะเป็นไปได้ในการประชุมผลประกอบการเมื่อวันที่ 17 พฤศจิกายน โดยประกาศว่า 'ในอนาคต เราตั้งใจที่จะคืนกระแสเงินสดอิสระส่วนเกินทั้งหมดหลังจากหักการใช้เชิงกลยุทธ์ให้กับผู้ถือหุ้น' คำว่า 'ทั้งหมด' นั้นมากกว่าเกณฑ์พื้นฐาน 50 เปอร์เซ็นต์ที่ Jensen เคยสัญญาไว้เมื่อ 5 เดือนก่อนมาก", "Nvidia ไม่ใช่บริษัทเดียวที่โชคชะตาพุ่งสูงขึ้นอย่างรวดเร็วเช่นนี้ ปรากฏการณ์ 'RAMageddon' เผยให้เห็นว่ามีเพียง 3 บริษัท ได้แก่ Samsung, SK Hynix และ Micron ที่ควบคุมตลาด DRAM ทั่วโลกเกือบ 90 เปอร์เซ็นต์ และทั้งสามบริษัทได้ส่งสัญญาณซ้ำแล้วซ้ำเล่าว่าพวกเขาต้องการเฉลิมฉลองผลกำไรที่ทำลายสถิติมากกว่าที่จะเร่งการผลิตให้เร็วเกินไป", "แต่ในขณะที่รายได้และกำไรของพวกเขาพุ่งสูงขึ้นอย่างรวดเร็วในช่วงปีที่ผ่านมา แม้แต่ยักษ์ใหญ่ด้าน RAM ก็ยังไม่ได้กระโดดขึ้นคลื่น AI ได้เหมือนกับ Nvidia แน่นอนว่า Samsung ไม่ได้ผลิตแค่หน่วยความจำ ตัวเลขรายได้ของพวกเขารวมถึงโทรศัพท์ แท็บเล็ต ทีวี เครื่องใช้ไฟฟ้าในบ้าน ชิป จอแสดงผล เซ็นเซอร์กล้อง อุปกรณ์เครื่องเสียง อุปกรณ์เครือข่าย อุปกรณ์ทางการแพทย์ และอื่นๆ", "ในไตรมาสล่าสุด Micron ทำกำไรได้ 37,700 ล้านดอลลาร์, SK Hynix ทำได้ 29,800 ล้านดอลลาร์ และ Samsung อยู่ที่ประมาณ 55,300 ล้านดอลลาร์ แต่ทั้งหมดนี้ยังน้อยกว่ากำไร 65,300 ล้านดอลลาร์ของ Nvidia ในอดีต RAM มักจะเป็นวัฏจักรมากกว่า โดยทั้ง Micron และ SK Hynix ขาดทุนในปี 2023 เพราะผลิตหน่วยความจำมากเกินไป", "ในการประชุมผลประกอบการล่าสุด ซึ่งเป็นครั้งแรกนับตั้งแต่การลาออกของ Jensen Huang ผู้ร่วมก่อตั้ง Colette Kress รักษาการ CEO และ CFO ได้ตอกย้ำแนวคิดที่ว่า Nvidia คาดหวังว่าช่วงเวลาที่ดีจะดำเนินต่อไป", "เมื่อถูกถามว่าสิ่งต่างๆ อาจเปลี่ยนแปลงไปอย่างไรภายใต้การบริหารใหม่ เธอแนะนำว่าจะไม่มีอะไรเปลี่ยน โดยกล่าวว่า 'ในมุมมองทางธุรกิจ มันก็คือธุรกิจตามปกติ' เธอกล่าวเสริมว่าบริษัทได้รับการสนับสนุนจากลูกค้าและซัพพลายเออร์ รวมถึง TSMC ซึ่งเป็นบริษัทที่สำคัญที่สุดในการผลิตชิปของ Nvidia", "'โมเมนตัมของเราเป็นเรื่องจริง ความต้องการของเรากำลังเร่งตัวขึ้น อุปทานของเรากำลังเติบโต ลูกค้าและพันธมิตรของเราอยู่กับเรา และพนักงานของเรามีความมุ่งมั่น' เธอกล่าว 'เราจัดการได้'", "Nvidia อ้างว่าจะกวาดเงินได้มากขึ้นในไตรมาสหน้า โดยคาดการณ์รายได้ไว้ที่ 130,000 ล้านดอลลาร์ กำไรอาจจะน้อยลงตามสัดส่วนเนื่องจากอัตรากำไรขั้นต้นคาดว่าจะลดลงเหลือ 71-72 เปอร์เซ็นต์ (เทียบกับเกือบ 75 เปอร์เซ็นต์) แต่ Kress กล่าวว่า Nvidia ตั้งใจที่จะผลักดันให้สูงถึง 73 เปอร์เซ็นต์ในปีหน้า", "กล่าวอีกนัยหนึ่งคือ รถไฟสายทำเงินที่น่าทึ่งนี้จะไม่มีวันหยุดวิ่ง อย่างน้อยนั่นก็คือแผนที่วางไว้"], "link": "https://www.theverge.com/tech/1035924/nvidia-visualized-revenue-profit-earnings-after-huang", "canonical_link": "https://www.theverge.com/tech/1035924/nvidia-visualized-revenue-profit-earnings-after-huang", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/acastro_STK083_01.jpg?quality=90&strip=all&crop=0,0, C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/258010_Black_friday_cyber_monday_CVirginia_PRICE2.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/03/268387_Apple_MacBook_Neo_AKrales_0543.jpg?quality=90&strip=all&crop=5.9486979166667%2C0%2C66.666666666667%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795030200, "published_at": "2026-11-18T19:30:00Z", "published_th": "19 พ.ย. 2026 • 02:30 น.", "category_hint": "Technology"}, {"id": 1795030257171, "guid": "https://www.theverge.com/?p=1036941", "original_title": "Instagram now lets you edit your stories after you post them", "thai_title": "Instagram อัปเดตใหม่! ให้ผู้ใช้แก้ไข Stories ได้หลังโพสต์แล้วภายใน 15 นาที", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Instagram เปิดตัวฟีเจอร์ใหม่ให้ผู้ใช้สามารถแก้ไขเนื้อหาใน Stories ได้หลังจากโพสต์ไปแล้วภายในระยะเวลา 15 นาที", "การแก้ไขสามารถทำได้ทั้งข้อความ เพลง สติกเกอร์ และภาพวาด โดยไม่ส่งผลกระทบต่อยอดวิว ยอดไลก์ หรือข้อความตอบกลับเดิม", "ผู้ใช้สามารถเข้าถึงฟีเจอร์นี้ได้ผ่านเมนูจุดสามจุดที่มุมขวาล่างของ Story แล้วเลือก 'Edit Story'", "นอกจากฟีเจอร์แก้ไขแล้ว Instagram ยังเพิ่มฟอนต์ สี และรูปทรงสติกเกอร์ใหม่ พร้อมปรับปรุงหน้าตาเมนูสติกเกอร์ให้ใช้งานง่ายขึ้น", "มีการอัปเดตเครื่องมือการเลือกรูปภาพหลายรูปพร้อมกัน รวมถึงเพิ่มตัวเลือกเอฟเฟกต์เบลอ สีพื้นหลัง และการไล่เฉดสีใหม่"], "full_paragraphs": ["Instagram ได้ประกาศอัปเดตฟีเจอร์ใหม่ล่าสุดที่ช่วยให้ผู้ใช้งานสามารถแก้ไขเนื้อหาใน Stories ได้โดยไม่ต้องลบโพสต์เดิมทิ้ง ซึ่งหมายความว่ายอดวิว (Views) ยอดไลก์ (Likes) และข้อความตอบกลับ (Replies) ที่ได้รับมาแล้วจะยังคงอยู่ครบถ้วน", "Adam Mosseri หัวหน้าทีม Instagram ได้ออกมาประกาศอย่างเป็นทางการว่า ผู้ใช้งานสามารถแก้ไขข้อความ (Text) เพลง (Music) สติกเกอร์ (Stickers) และภาพวาด (Drawings) ใน Stories ได้ภายในระยะเวลาสูงสุด 15 นาทีหลังจากที่ได้ทำการแชร์โพสต์ไปแล้ว", "ก่อนหน้านี้ หากผู้ใช้งานพบข้อผิดพลาดจากการพิมพ์ (Typo) หรือลืมใส่เพลงประกอบที่ต้องการ จะไม่มีทางเลือกอื่นนอกจากต้องลบ Story นั้นทิ้งแล้วโพสต์ใหม่ทั้งหมด ซึ่งฟีเจอร์นี้เคยถูกพบโดย Alessandro Paluzzi นักวิจัยผู้เชี่ยวชาญด้านการแกะรอยแอปพลิเคชัน (Reverse engineer) มาตั้งแต่เดือนเมษายนที่ผ่านมา จนกระทั่งมีการเปิดตัวอย่างเป็นทางการในวันนี้", "สำหรับวิธีการใช้งาน ผู้ใช้สามารถเข้าไปแก้ไขโพสต์ได้โดยการเปิด Story ของตนเองขึ้นมา จากนั้นเลือกเมนูจุดสามจุดที่มุมขวาล่างของหน้าจอ แล้วแตะไปที่ตัวเลือก 'Edit Story' เพื่อเริ่มทำการปรับเปลี่ยนเนื้อหาตามต้องการ", "นอกเหนือจากฟีเจอร์การแก้ไข Stories แล้ว Instagram ยังได้ประกาศเปิดตัวฟอนต์ใหม่ สีใหม่ และรูปทรงของสติกเกอร์แบบใหม่ โดยมีการจัดระเบียบสติกเกอร์ให้อยู่ในรูปแบบ 'Sticker Sheets' ซึ่งถูกออกแบบมาให้ผู้ใช้งานสามารถเลือกดูและค้นหาได้ง่ายยิ่งขึ้นกว่าเดิม", "นอกจากนี้ แพลตฟอร์มยังได้ปรับปรุงวิธีการเลือกรูปภาพหลายรูปพร้อมกัน (Multiple photos) ให้มีความสะดวกมากขึ้น พร้อมทั้งเพิ่มตัวเลือกเอฟเฟกต์เบลอ (Blur) รวมถึงตัวเลือกสีพื้นหลังและการไล่เฉดสี (Gradient background) ใหม่ๆ เข้ามา เพื่อเพิ่มอิสระในการสร้างสรรค์คอนเทนต์ให้กับผู้ใช้งานอีกด้วย"], "link": "https://www.theverge.com/tech/1036941/instagram-now-lets-you-edit-your-stories-after-you-post-them", "canonical_link": "https://www.theverge.com/tech/1036941/instagram-now-lets-you-edit-your-stories-after-you-post-them", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/insta-story-edit.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795030150, "published_at": "2026-11-18T19:29:10Z", "published_th": "19 พ.ย. 2026 • 02:29 น.", "category_hint": "Technology"}, {"id": 1795029343388, "guid": "https://www.theverge.com/?p=1036935", "original_title": "Tech lawsuits defined 2026 — and lawmakers want more", "thai_title": "ปี 2026 แห่งการฟ้องร้องบริษัทเทคโนโลยี: สภาคองเกรสเร่งผลักดันกฎหมายจัดการ Deepfake และการล่วงละเมิดออนไลน์", "tag": "Technology", "sub_tag": "POLICY", "bullet_points": ["สภาคองเกรสสหรัฐฯ เร่งผลักดันกฎหมายในช่วงโค้งสุดท้ายของปี 2026 เพื่อคุ้มครองเหยื่อจากการถูกล่วงละเมิดออนไลน์และ Deepfake", "คณะอนุกรรมการตุลาการวุฒิสภาเปิดการไต่สวน Roblox กรณีใช้ข้อสัญญาบังคับอนุญาโตตุลาการ (Forced Arbitration) เพื่อหลีกเลี่ยงการถูกฟ้องร้องในคดีล่วงละเมิดเด็ก", "มีการผลักดัน 'Defiance Act' เพื่อเปิดช่องให้เหยื่อที่ถูกสร้างภาพ Deepfake ลามกอนาจารโดยไม่ได้รับความยินยอม สามารถฟ้องร้องผู้สร้างได้โดยตรง", "นักกฎหมายและผู้เชี่ยวชาญชี้ว่า การเปิดช่องให้ฟ้องร้องในศาลเปิด (Public Court) จะเป็นเครื่องมือสำคัญในการบีบให้บริษัทเทคโนโลยีปรับเปลี่ยนพฤติกรรมความปลอดภัยอย่างรวดเร็ว", "Paris Hilton ร่วมผลักดันกฎหมาย โดยเปิดเผยว่าเธอตกเป็นเหยื่อของภาพและวิดีโอ AI ลามกอนาจารกว่า 100,000 รายการ"], "full_paragraphs": ["ในช่วงเวลาเพียงไม่กี่สัปดาห์ก่อนสิ้นปี 2026 สมาชิกสภานิติบัญญัติสหรัฐฯ กำลังเร่งผลักดันมาตรการคุ้มครองใหม่สำหรับเหยื่อที่ได้รับผลกระทบจากการกระทำผิดบนโลกออนไลน์ โดยมุ่งเป้าไปที่ผู้สร้างเนื้อหา Deepfake และแพลตฟอร์มออนไลน์ที่ปิดกั้นไม่ให้ผู้ใช้งานเข้าถึงกระบวนการยุติธรรมผ่านการฟ้องร้อง", "เมื่อวันอังคารที่ผ่านมา คณะอนุกรรมการตุลาการวุฒิสภาได้จัดให้มีการไต่สวนเพื่อเรียกร้องให้ยุติการใช้ 'ข้อสัญญาบังคับอนุญาโตตุลาการ' (Forced Arbitration) ในคดีที่เกี่ยวข้องกับอันตรายบนโลกออนไลน์ โดยเป้าหมายหลักคือ Roblox ซึ่งถูกกล่าวหาว่าหลีกเลี่ยงการรับผิดชอบต่อข้อร้องเรียนทางกฎหมาย กรณีเด็กถูกล่วงละเมิดบนแพลตฟอร์ม ด้วยการบังคับใช้ข้อสัญญาอนุญาโตตุลาการกับผู้ใช้งานที่ยอมรับเงื่อนไขตั้งแต่อายุยังน้อย บางรายมีอายุต่ำกว่า 10 ปีด้วยซ้ำ ในขณะเดียวกัน ห่างออกไปไม่กี่ช่วงตึก สมาชิกสภาผู้แทนราษฎร Alexandria Ocasio-Cortez (พรรคเดโมแครตจากนิวยอร์ก) และ Laurel Lee (พรรครีพับลิกันจากฟลอริดา) ได้เชิญ Paris Hilton ทายาทเครือโรงแรมชื่อดังมายังอาคารรัฐสภา เพื่อสนับสนุน 'Defiance Act' ซึ่งจะอนุญาตให้เหยื่อที่ถูกสร้างภาพ Deepfake ลามกอนาจารโดยไม่ได้รับความยินยอม สามารถฟ้องร้องผู้สร้างได้", "“สิ่งที่ดีที่สุดที่เราสามารถทำได้ในแง่ของการบังคับใช้กฎหมาย คือการเปิดประตูศาลให้กว้างขึ้น” วุฒิสมาชิก Josh Hawley (พรรครีพับลิกันจากมิสซูรี) ประธานคณะอนุกรรมการตุลาการ กล่าวกับผู้สื่อข่าวหลังการไต่สวน Roblox “ยิ่งผมเห็นบริษัทเหล่านี้หลบเลี่ยงกฎระเบียบมากเท่าไหร่ ผมก็ยิ่งเชื่อว่าไม่มีอะไรทรงพลังไปกว่าคณะลูกขุนอีกแล้ว” ทั้งนี้ Hawley ได้เสนอร่างกฎหมายฉบับใหม่ร่วมกับ Dick Durbin (พรรคเดโมแครตจากอิลลินอยส์) เพื่อทำให้ข้อตกลงอนุญาโตตุลาการไม่มีผลบังคับใช้ในข้อพิพาทที่เกี่ยวข้องกับการแสวงหาประโยชน์ทางเพศจากเด็ก หรือ 'การทำร้ายเด็กทางไซเบอร์' ซึ่งอาจรวมถึงความเสียหายต่อชื่อเสียง ความทุกข์ทรมานทางจิตใจ หรือการเสียชีวิต", "Roblox พยายามบังคับใช้ข้อสัญญาอนุญาโตตุลาการในคดีฟ้องร้องที่บริษัทกำลังเผชิญอยู่ จากข้อกล่าวหาว่าผู้ใช้งานถูกล่วงละเมิดบนแพลตฟอร์มเกมในขณะที่เป็นผู้เยาว์ แม้บริษัทจะอ้างว่ามีมาตรการคุ้มครองก็ตาม ปัจจุบัน Roblox กำลังเผชิญกับคดีความรวมประมาณ 180 คดี จากบทบาทที่ถูกกล่าวหาว่าล้มเหลวในการปกป้องเด็ก ภายใต้กระบวนการอนุญาโตตุลาการ สาธารณชนจะไม่สามารถเข้าถึงข้อมูลการสืบพยาน (Legal Discovery) เหมือนที่ปรากฏในคดีของ Meta ที่ผ่านมา โดย Hawley ได้เรียกกระบวนการลูกขุนว่าเป็นระบบที่ 'ป้องกันการทุจริต' และเป็น 'ค้อนขนาดใหญ่ที่ทรงพลังอย่างยิ่ง'", "ทางด้าน Roblox ได้ปฏิเสธข้อกล่าวหาว่าบริษัทพยายามหลีกเลี่ยงความรับผิดชอบ โดย Nicky Jackson Colaço หัวหน้าฝ่ายนโยบายสาธารณะระดับโลกของ Roblox ระบุในแถลงการณ์ว่า “ความปลอดภัยเป็นหัวใจสำคัญของ Roblox ตั้งแต่เราเปิดตัว เรากำหนดให้มีการตรวจสอบอายุสำหรับการแชท จัดกลุ่มผู้ใช้งานอายุต่ำกว่า 16 ปีให้อยู่ในบัญชีที่จำกัดตามอายุพร้อมค่าเริ่มต้นที่เน้นความปลอดภัย และบล็อกรูปภาพและวิดีโอในการแชท” เธอกล่าวเสริมว่า “จุดยืนทางกฎหมายเกี่ยวกับอนุญาโตตุลาการไม่ใช่มาตรวัดบันทึกความปลอดภัยของบริษัท และการไต่สวนที่สร้างขึ้นบนประเด็นนี้ไม่ได้ช่วยยกระดับความปลอดภัยให้ก้าวหน้าขึ้นแต่อย่างใด”", "สภาคองเกรสเหลือเวลาอีกเพียง 3 สัปดาห์ก่อนสิ้นปี และจะมีเสียงข้างมากชุดใหม่จากพรรคเดโมแครตเข้าสาบานตนในเดือนมกราคมนี้ คาดว่าพรรครีพับลิกันจะพยายามผลักดันการแต่งตั้งผู้พิพากษาและตำแหน่งในฝ่ายบริหาร เช่น กรรมาธิการ FCC ของประธานาธิบดี Donald Trump ให้ผ่านในช่วงสมัยประชุมสภาชุดเดิม (Lame-duck session) รวมถึงพยายามผ่านร่างกฎหมายสำคัญอย่าง National Defense Authorization Act อย่างไรก็ตาม สมาชิกสภาบางส่วนยังคงมีความหวังว่าจะสามารถเปิดช่องทางศาลสำหรับการฟ้องร้องคดีการละเมิดผ่าน Deepfake และการล่าเหยื่อเด็กได้", "การฟ้องร้องทางกฎหมายกลายเป็นหนึ่งในวิธีที่ประสบความสำเร็จมากที่สุดสำหรับผู้รอดชีวิตจากการถูกทำร้ายบนโลกออนไลน์ในการเรียกร้องให้เกิดการเปลี่ยนแปลง แม้สภาคองเกรสจะล้มเหลวในการผ่านร่างกฎหมายความปลอดภัยของเด็ก ความเป็นส่วนตัว และการคุ้มครองผู้บริโภคที่สำคัญหลายฉบับ แต่ก็ได้เริ่มจัดการกับปัญหา Deepfake ผ่านกฎหมาย 'Take It Down Act' ในขณะเดียวกัน อัยการสูงสุดและโจทก์รายบุคคลก็สามารถบรรลุข้อตกลงยอมความและชนะคดีได้ แม้จะมีเกราะคุ้มกันทางกฎหมายที่กว้างขวางของบริษัทเทคโนโลยีอย่างมาตรา 230 (Section 230) ก็ตาม หากร่างกฎหมายอย่าง Defiance Act หรือร่างกฎหมายที่มุ่งยุติการบังคับใช้อนุญาโตตุลาการผ่านไปได้ บริษัทเทคโนโลยีและผู้กระทำผิดออนไลน์อาจต้องเผชิญกับความเสี่ยงจากคลื่นลูกใหม่ของการฟ้องร้อง", "นอกจากร่างกฎหมายของ Hawley และ Durbin แล้ว วุฒิสมาชิก Richard Blumenthal (พรรคเดโมแครตจากคอนเนตทิคัต), Katie Britt (พรรครีพับลิกันจากอลาบามา) และ Cory Booker (พรรคเดโมแครตจากนิวเจอร์ซีย์) ได้เสนอร่างกฎหมายที่คล้ายคลึงกันด้วยแนวทางที่แตกต่างออกไปเล็กน้อย โดยครอบคลุมถึงการละเมิดความเป็นส่วนตัวของข้อมูลอย่างชัดเจน ในการไต่สวนของ Roblox ศาสตราจารย์ด้านกฎหมาย Myriam Gilles จากมหาวิทยาลัย Northwestern ผู้เชี่ยวชาญด้านอนุญาโตตุลาการ กล่าวว่าเธอเคยให้การต่อสภาคองเกรสหลายครั้งในหัวข้อนี้ แต่ “ไม่เคยคาดคิดว่าจะต้องมาพูดต่อหน้าสภานี้เกี่ยวกับการใช้ข้อสัญญาดังกล่าวกับเด็กวัย 9 ขวบ” เธอกล่าวว่าการผ่านข้อเสนอดังกล่าวจะมีผลกระทบอย่างลึกซึ้งว่า “คุณจะประหลาดใจว่าบริษัทจะเปลี่ยนพฤติกรรมเร็วแค่ไหนเมื่อถูกฟ้องร้องในศาลเปิด”", "สำหรับ Defiance Act จะอนุญาตให้เหยื่อที่ถูกสร้างภาพ Deepfake ลามกอนาจารโดยไม่ได้รับความยินยอมสามารถฟ้องร้องเรียกค่าเสียหายจากผู้สร้างได้ เพื่อเป็นการเพิ่มต้นทุนในการสร้างภาพเหล่านี้ Hilton ได้เดินทางมายังวอชิงตันเมื่อต้นปีเพื่อแบ่งปันประสบการณ์ว่าวิดีโอส่วนตัวของเธอในวัย 19 ปีที่ถูกเผยแพร่โดยไม่ได้รับความยินยอมส่งผลกระทบต่อชีวิตเธออย่างไร และเธอใช้เรื่องราวของเธอเพื่อสนับสนุนกฎหมายฉบับนี้ ในงานแถลงข่าวเมื่อวันอังคาร เธอกล่าวว่าเธอจะกลับมาที่สภาคองเกรสกี่ครั้งก็ได้ตามความจำเป็นเพื่อให้กฎหมายนี้ผ่าน “บางคนอาจคิดว่านั่นคือจุดจบของการต่อสู้ของฉัน” Hilton กล่าว “แต่เมื่อฉันให้สัญญากับผู้รอดชีวิต ฉันจะรักษาสัญญานั้น”", "Hilton กล่าวว่ามีผู้คนกว่า 50 ล้านคนตกเป็นเหยื่อของภาพ Deepfake ลามกอนาจาร “สำหรับตัวฉันเอง คนแปลกหน้าได้สร้างภาพและวิดีโอที่สร้างโดย AI กว่า 100,000 รายการที่แสดงภาพฉันในรูปแบบที่กราฟิกและน่ารังเกียจที่สุดเท่าที่จะจินตนาการได้” Hilton กล่าว “หากสิ่งนี้สามารถเกิดขึ้นกับคนที่มีทรัพยากรและแพลตฟอร์มอย่างฉันได้ ลองจินตนาการดูว่าเด็กสาวคนหนึ่งจะรู้สึกไร้อำนาจเพียงใดเมื่อต้องเผชิญกับเรื่องนี้เพียงลำพัง”"], "link": "https://www.theverge.com/policy/1036935/congress-forced-arbitration-deepfakes-defiance-act", "canonical_link": "https://www.theverge.com/policy/1036935/congress-forced-arbitration-deepfakes-defiance-act", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/02/STK470_AI_LAW_CVIRGINIA_C.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795028849, "published_at": "2026-11-18T19:07:29Z", "published_th": "19 พ.ย. 2026 • 02:07 น.", "category_hint": "Technology"}, {"id": 1795099689822, "guid": "https://www.theverge.com/?p=1028991", "original_title": "The best early Black Friday deals you can already shop", "thai_title": "รวมดีลเด็ดช่วง Early Black Friday ที่คุณเริ่มช้อปได้ตั้งแต่วันนี้", "tag": "Technology", "sub_tag": "GADGETS", "bullet_points": ["เทศกาล Black Friday อย่างเป็นทางการจะเริ่มในวันที่ 27 พฤศจิกายน แต่ร้านค้าปลีกหลายแห่งเริ่มปล่อยโปรโมชั่นลดราคาอุปกรณ์ไอทีล่วงหน้าแล้ว", "สินค้าที่น่าสนใจมีครอบคลุมตั้งแต่ผลิตภัณฑ์ Apple, อุปกรณ์สมาร์ทโฮม, หูฟังตัดเสียงรบกวน ไปจนถึงหุ่นยนต์ดูดฝุ่นและเครื่องพิมพ์ 3 มิติ", "แม้จะเป็นช่วงลดราคา แต่ผู้บริโภคควรตรวจสอบราคาให้ดี เนื่องจากราคาอาจมีการเปลี่ยนแปลงหรือลดลงอีกเมื่อเข้าใกล้ช่วงวันจริง", "บทความนี้จะมีการอัปเดตรายการสินค้าลดราคาอย่างต่อเนื่อง เพื่อให้คุณไม่พลาดดีลที่ดีที่สุดก่อนถึงช่วงเทศกาลช้อปปิ้งหลัก"], "full_paragraphs": ["แม้ว่าเทศกาล Black Friday จะยังเหลือเวลาอีกกว่าหนึ่งสัปดาห์ แต่คุณสามารถเริ่มประหยัดเงินไปกับอุปกรณ์จาก Apple, อุปกรณ์ชาร์จไฟ, หุ่นยนต์ดูดฝุ่น และสินค้าอื่นๆ ได้แล้วตั้งแต่วันนี้ โดยเทศกาลช้อปปิ้งนี้จะจัดขึ้นอย่างเป็นทางการในวันที่ 27 พฤศจิกายน อย่างไรก็ตาม ร้านค้าปลีกหลายแห่งได้เริ่มปล่อยดีลลดราคาสินค้าไอทีที่เราชื่นชอบออกมาล่วงหน้าแล้ว แน่นอนว่าในสภาวะที่ราคาสินค้าปรับตัวสูงขึ้นทั่วกระดาน การได้รับส่วนลดไม่ได้หมายความว่าคุณจะได้ราคาที่ต่ำที่สุดในประวัติศาสตร์เสมอไป แต่เรายังคงเห็นส่วนลดที่คุ้มค่าสำหรับอุปกรณ์ที่ผ่านการทดสอบมาแล้วมากมาย และคาดว่าจะมีดีลใหม่ๆ เพิ่มเติมในสัปดาห์หน้า", "ด้านล่างนี้คือการรวบรวมดีล Early Black Friday ที่ดีที่สุดที่เราพบจนถึงตอนนี้ ราคาอาจลดลงได้อีกเมื่อใกล้ถึงวัน Black Friday ตามธรรมเนียมปฏิบัติ แต่ดีลเหล่านี้ก็นับว่าน่าสนใจหากคุณต้องการช้อปก่อนเพื่อหลีกเลี่ยงความวุ่นวายในช่วงเทศกาล เราจะคอยอัปเดตคู่มือนี้อย่างต่อเนื่องเมื่อร้านค้าต่างๆ เริ่มเปิดตัวโปรโมชั่นวันหยุด ดังนั้นอย่าลืมกลับมาตรวจสอบเป็นระยะเมื่อใกล้ถึงวันงานหลัก", "สำหรับผลิตภัณฑ์ที่น่าสนใจ ได้แก่ Apple AirPods Pro 3 ที่มอบระบบตัดเสียงรบกวนและคุณภาพเสียงที่ดีที่สุดเท่าที่เคยมีมาในตระกูล AirPods พร้อมความกระชับที่สบายขึ้นและการกันน้ำที่ดีขึ้น นอกจากนี้ยังมีฟีเจอร์ติดตามอัตราการเต้นของหัวใจสำหรับการออกกำลังกายและรองรับการแปลภาษาแบบเรียลไทม์ ในส่วนของเกมเมอร์ Sony DualSense Wireless Controller สำหรับ PlayStation 5 โดดเด่นด้วยระบบ Haptic Feedback ที่สมจริงและปุ่ม Trigger ที่ปรับแรงต้านได้ รวมถึงรองรับการใช้งานกับ PC, macOS และอุปกรณ์มือถือผ่าน Bluetooth หรือ USB-C", "ในฝั่งของความบันเทิงและซอฟต์แวร์ เกม '007 First Light' เกมแนว Stealth Action มุมมองบุคคลที่สามจากสตูดิโอผู้สร้าง Hitman ถือเป็นหนึ่งในเกมแอ็กชันที่ดีที่สุดในปีนี้ ด้วยภารกิจที่หลากหลายและการไล่ล่าที่ตื่นเต้น ส่วน Amazon Fire TV Stick 4K Plus รุ่นก่อนหน้ายังคงเป็นตัวเลือกที่คุ้มค่าด้วยการสตรีมระดับ 4K และรองรับ Dolby Atmos, Dolby Vision รวมถึงการใช้งานร่วมกับ Alexa Plus และยังคงอนุญาตให้ติดตั้งแอป Android TV เพิ่มเติมได้", "สำหรับอุปกรณ์สวมใส่ Apple Watch Series 12 มาพร้อมฟีเจอร์ Audio Intelligence ที่ขับเคลื่อนด้วย AI เช่น การแจ้งเตือนการจดจำเสียง, Live Rewind และ Siri Recap รวมถึงการติดตามอัตราการเต้นของหัวใจทุก 5 วินาที และการชาร์จที่รวดเร็วกว่ารุ่นก่อน ส่วนหูฟัง Nothing Ear 3A โดดเ /2025/09/257943_Airpods_Pro3_AKrales_0145.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/22015299/vpavic_4278_20201030_0150.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/05/007FirstLight_Screenshots_02.png?quality=90&strip=all&crop=21.875%2C0%2C56.25%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/06/Amazon-Fire-TV-Stick-4K-Lifestyle-Press-Image.jpg?quality=90&strip=all&crop=16.689189189189%2C0%2C66.621621621622%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/09/268738_Apple_Watch_Series_12_AKrales_0280.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/10/hueessential.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/04/Fanttik-S1-Pro-Cordless-Electric-Screwdriver-Lifestyle-Image.jpg?quality=90&strip=all&crop=16.695278969957%2C0%2C66.609442060086%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/268654_Nothing_Ear_3A_JHiggins_0012.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795027467, "published_at": "2026-11-18T18:44:27Z", "published_th": "19 พ.ย. 2026 • 01:44 น.", "category_hint": "Technology"}, {"id": 1795027542541, "guid": "https://www.theverge.com/?p=1036776", "original_title": "What is Nvidia without AI’s sugar daddy in charge?", "thai_title": "Nvidia ในยุคไร้ Jensen Huang: เมื่อ 'Sugar Daddy' แห่งวงการ AI ก้าวลงจากตำแหน่ง", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["Colette Kress ซีอีโอคนใหม่ของ Nvidia เริ่มต้นการบริหารด้วยความท้าทายท่ามกลางกระแสเรียกร้องให้ดึงตัว Jensen Huang กลับมา", "Nvidia ยืนยันว่าข้อตกลงกับซัพพลายเออร์ยังคงดำเนินต่อไปจนถึงสิ้นทศวรรษ สยบข่าวลือเรื่องการทำสัญญาแบบปากเปล่าของอดีตซีอีโอ", "บริษัทปรับเปลี่ยนนโยบายการค้ำประกันทางการเงินให้กับกลุ่ม Neocloud โดยระบุเงื่อนไขที่เข้มงวดขึ้นเพื่อลดความเสี่ยงของบริษัท", "ประเด็นอื้อฉาวเรื่องการส่งออกชิปไปยังจีนและการจ้างงานเครือญาติในบริษัท ยังคงเป็นปัจจัยกดดันสำคัญที่บอร์ดบริหารต้องเร่งจัดการ", "Kress มุ่งเน้นการบริหารแบบ 'Business as usual' และยืนยันว่าพนักงานยังคงมุ่งมั่นทำงานตามปกติ ไม่มีการสมองไหลตามการลาออกของ Huang"], "full_paragraphs": ["หากการปฏิวัติ AI อันยิ่งใหญ่ต้องฝากความหวังไว้กับชายเพียงคนเดียว ก็อาจกล่าวได้ว่า AI ไม่ใช่เทคโนโลยีที่แข็งแกร่งอย่างที่หลายคนเชื่อ อย่างไรก็ตาม คนใน Silicon Valley บางกลุ่มยังคงยืนกรานว่า Jensen Huang อดีตซีอีโอของ Nvidia ซึ่งเป็นบริษัทที่มีมูลค่าตลาดราว 3 ล้านล้านดอลลาร์นั้นเป็นบุคคลที่ขาดไม่ได้ โดย Elon Musk เคยกล่าวอ้างว่า Huang มักทำข้อตกลงกับซัพพลายเออร์ด้วยการ 'จับมือสัญญา' แทนที่จะเป็นสัญญาที่เป็นลายลักษณ์อักษร", "หลังจากได้ฟังการแถลงผลประกอบการครั้งแรกของ Nvidia ภายใต้การนำของ Colette Kress ซีอีโอคนใหม่ ผมคิดว่ามีบางอย่างเปลี่ยนไป ในอดีตขณะที่ Kress ดำรงตำแหน่ง CFO เธอทำหน้าที่คอยเตือน Huang ให้หยุดใช้เงินมหาศาลไปกับการสนับสนุนทางการเงินแก่ลูกค้า ซึ่งเป็นหน้าที่ปกติของ CFO แม้จะมีรายงานว่า Huang เคยดูแคลนเธอในเรื่องนี้ แต่ตอนนี้เธอกลายเป็นหัวเรือใหญ่ชั่วคราว และเป็นที่คาดการณ์ได้ว่า Nvidia ซึ่งเคยเป็น 'Sugar Daddy' ของอุตสาหกรรม AI มานาน อาจจะมีความระมัดระวังในการใช้เงินมากขึ้นเมื่อไร้เงาของ Huang", "งานของ Kress ไม่ใช่เรื่องง่าย แม้จะไม่มีการกดดันจากบุคคลอย่าง Tim Sweeney ซีอีโอของ Epic Games หรือ Musk แต่การต้องนำพาบริษัทหลังเหตุการณ์ความวุ่นวายของ Huang ถือเป็นงานที่หนักหนาสาหัส ยิ่งไปกว่านั้นเธอยังต้องรับมือกับกลุ่มคนที่พยายามยืนยันว่า Huang คือเหตุผลเดียวที่ทำให้ Nvidia ประสบความสำเร็จ ในระหว่างการประชุม Harvey C. Jones ประธานบอร์ดบริหารของ Nvidia ได้ออกมาจัดการกับกระแสเหล่านี้อย่างชัดเจนว่า บอร์ดไม่มีแผนที่จะดึงตัว Huang กลับมา และบริษัทจะไม่ตอบคำถามใดๆ เกี่ยวกับเขาอีก", "ในระหว่างการประชุม Kress ชี้ให้เห็นว่าข้อตกลงของ Nvidia กับซัพพลายเออร์มีผลครอบคลุมไปจนถึงสิ้นทศวรรษ ซึ่งเป็นการหักล้างคำกล่าวอ้างของ Musk เรื่องสัญญาปากเปล่า ทั้งนี้ SemiAnalysis เคยตั้งข้อสังเกตว่าความสำเร็จของ Nvidia มาจากการที่บริษัทสามารถควบคุมห่วงโซ่อุปทานได้อย่างเบ็ดเสร็จ", "Kress ยังปฏิเสธแนวคิดที่ว่าการจากไปของ Huang จะนำไปสู่ภาวะสมองไหลหรือการก่อกบฏภายในเหมือนที่เคยเกิดขึ้นกับ OpenAI ในปี 2023 โดยเธอกล่าวกับนักลงทุนว่า 'เราเชื่อว่าพนักงานของเรามีความมุ่งมั่น พวกเขาตั้งใจที่จะทำงานในชีวิตของพวกเขาที่ Nvidia' และเสริมว่าพนักงานกำลังทำงานอย่างต่อเนื่องตามเป้าหมาย และในมุมมองทางธุรกิจ ทุกอย่างยังคงดำเนินไปตามปกติ", "แม้จะมีกระแสเรียกร้องจากกลุ่มแฟนคลับของ Huang แต่บอร์ดบริหารดูเหมือนจะไม่มีทางเลือกอื่น นอกจากนี้ยังมีประเด็นเรื่องประกันภัยกรรมการและผู้บริหาร (D&O insurance) ที่ Nvidia ไม่ได้ซื้อไว้ครอบคลุมทั้งหมด ทำให้บริษัทอาจต้องรับผิดชอบเองหากมีการฟ้องร้องที่เกี่ยวข้องกับพฤติกรรมส่วนตัวของ Huang ซึ่งส่งผลกระทบต่อราคาหุ้น", "เรื่องอื้อฉาวนี้ไม่ได้มีแค่เรื่องส่วนตัว แต่รวมถึงการที่ลูกค้าของ Nvidia ถูกกล่าวหาว่าหลบเลี่ยงมาตรการห้ามขายชิปให้จีน ซึ่งส่งผลให้รัฐบาลสหรัฐฯ ต้องปรับนโยบายใหม่ โดยเมื่อวันที่ 16 พฤศจิกายน กระทรวงพาณิชย์สหรัฐฯ ได้ประกาศข้อจำกัดใหม่ในการขายชิปไปยังประเทศต่างๆ เช่น อินโดนีเซีย มาเลเซีย สิงคโปร์ ไทย และบราซิล รวมถึงการที่ศูนย์ข้อมูลทั่วโลกต้องขอใบอนุญาตจากสหรัฐฯ หากต้องการให้เช่าพลังประมวลผลแก่บริษัทที่มีสำนักงานใหญ่ในจีน", "ในแง่ของรายได้ Nvidia คาดการณ์ว่ารายได้จะเติบโต 75 เปอร์เซ็นต์ในปีหน้า แม้ว่าสิงคโปร์จะเป็นตลาดที่สร้างรายได้มหาศาลถึง 1.04 แสนล้านดอลลาร์ในปี 2025 แต่บริษัทได้เปลี่ยนวิธีการรายงานผลประกอบการหลังจากเริ่มมีการตรวจสอบเรื่องการส่งออกชิปไปยังจีนผ่านบริษัทอย่าง Megaspeed ซึ่งมีที่อยู่ในสิงคโปร์", "ประเด็นเรื่องการจ้างงานเครือญาติของ Huang ก็เป็นที่วิพากษ์วิจารณ์ โดยลูกสาวของเขา Madison Huang ถูกระบุว่าเป็น 'หัวหน้าคณะทำงาน' และมีส่วนร่วมในการตอบคำถามเรื่อง Megaspeed ส่วน Nico Caprez ลูกเขยของเขาก็ได้รับการเลื่อนตำแหน่งให้ดูแลข้อตกลงระหว่างประเทศกับลูกค้ากลุ่มคลาวด์ในเอเชีย แหล่งข่าวระบุว่า 'พวกเขาได้รับอำนาจและอิทธิพลอย่างมากและไม่มีใครกล้าปฏิเสธหรือจัดการพวกเขาได้'", "แม้ Huang จะโพสต์ข้อความว่าเขายินดีกลับมาเป็นซีอีโอหากบอร์ดบริหารเห็นว่าเหมาะสม แต่ดูเหมือนว่าบอร์ดจะยังคงยืนกรานในจุดยืนเดิม ในขณะที่ Kress กำลังพยายามควบคุมการใช้จ่ายของบริษัท โดยเฉพาะการลดภาระทางการเงินในโครงการต่างๆ เช่น การสนับสนุน OpenAI เพื่อให้บริษัทมีความมั่นคงทางการเงินมากขึ้น", "ในการประชุมผลประกอบการ Nvidia ได้ระบุเงื่อนไขใหม่ในเอกสารเกี่ยวกับกลุ่ม Neocloud ว่าการค้ำประกันของบริษัทจะมีผลก็ต่อเมื่อลูกค้าสามารถจัดหาเงินทุนเพื่อซื้อโครงสร้างพื้นฐานศูนย์ข้อมูลได้สำเร็จเท่านั้น ซึ่ง Kress ยืนยันว่านี่ไม่ใช่เรื่องใหม่ แต่เป็นการตอกย้ำว่า Nvidia จะไม่แบกรับความเสี่ยงแทนลูกค้าตลอดไป โดยเฉพาะในสภาวะที่อัตราดอกเบี้ยอาจปรับตัวสูงขึ้นและทำให้การจัดหาเงินทุนสำหรับศูนย์ข้อมูลทำได้ยากขึ้น", "ท้ายที่สุด แม้จะมีการเปลี่ยนแปลงในระดับบริหาร แต่ Kress ก็ยังคงให้ความสำคัญกับพนักงาน โดยยืนยันว่าพนักงานของ Nvidia จะยังคงได้รับเงินเดือนขึ้นและสิทธิประโยชน์ในรูปแบบหุ้นในเดือนธันวาคมนี้"], "link": "https://www.theverge.com/ai-artificial-intelligence/1036776/nvidia-earnings-kress-jensen-huang-petition", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1036776/nvidia-earnings-kress-jensen-huang-petition", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Nvidia_Jensen_huang_01.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Vera-Rubin-NVL72.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/06/STK083_NVIDIA_2.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Nvidia_Jensen_huang_02.jpg?quality=90&strip=all&crop=15.245098039216%2C0%2C69.509803921569%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795026855, "published_at": "2026-11-18T18:34:15Z", "published_th": "19 พ.ย. 2026 • 01:34 น.", "category_hint": "Technology"}, {"id": 1795099689824, "guid": "https://www.theverge.com/?p=1033262", "original_title": "Our favorite accessories to level up your gaming setup ahead of GTA VI", "thai_title": "อัปเกรดอุปกรณ์เกมมิ่งให้พร้อมลุย Vice City: รวมไอเทมเด็ดรับกระแส GTA VI", "tag": "Technology", "sub_tag": "GADGETS", "bullet_points": ["แนะนำอุปกรณ์เสริมระดับโปรสำหรับ Xbox และ PlayStation 5 เพื่อเตรียมความพร้อมก่อนการวางจำหน่าย GTA VI", "คัดสรรคอนโทรลเลอร์ประสิทธิภาพสูงอย่าง 8BitDo Ultimate 3E และ DualSense Edge ที่เน้นการปรับแต่งได้ตามความต้องการ", "ยกระดับประสบการณ์ภาพด้วยจอ OLED จาก Roku Pro Series และ Sony Bravia 8 II ที่รองรับรีเฟรชเรท 120Hz", "แนะนำอุปกรณ์เสริมด้านเสียงและพลังงาน ทั้งหูฟังไร้สายรุ่นใหม่ล่าสุดจาก Sony และ SteelSeries รวมถึงแท่นชาร์จคอนโทรลเลอร์จาก PowerA"], "full_paragraphs": ["ในที่สุดการรอคอยก็สิ้นสุดลง เมื่อ Grand Theft Auto VI มีกำหนดการวางจำหน่ายในวันพรุ่งนี้ที่ 19 พฤศจิกายน ซึ่งหมายความว่าการหวนคืนสู่ Vice City กำลังจะเกิดขึ้นในไม่ช้า แต่หลังจากเวลาผ่านไปนานหลายปี อุปกรณ์ที่คุณเคยใช้ใน San Andreas อาจดูไม่เข้ากับบรรยากาศอันหรูหราของ Leonidas County อีกต่อไป โชคดีที่เราได้รวบรวมอุปกรณ์เสริมสำหรับ Xbox และ PlayStation 5 ที่เราชื่นชอบ เพื่อช่วยให้การเล่นเกมของคุณในระยะยาวเป็นไปอย่างราบรื่นที่สุด", "8BitDo Ultimate 3E ซึ่งเป็นตัวเลือกที่ได้รับการอัปเกรดสำหรับคอนโซล Xbox Series X และ Series S เป็นคอนโทรลเลอร์ที่มีความสามารถสูงและสะดวกสบาย พร้อมฟีเจอร์ระดับอีลีท รวมถึงอัตรา Polling Rate ที่สูงและทริกเกอร์ที่ปรับแต่งได้ แม้จะมีราคาสูงอยู่ที่ 149.99 ดอลลาร์ แต่การปรับแต่งที่ทำได้ละเอียดและการออกแบบที่ประณีตก็คุ้มค่ากับราคา", "สำหรับผู้ใช้ PlayStation 5 ที่กำลังมองหาการอัปเกรดคอนโทรลเลอร์ อาจพิจารณา DualSense Edge ซึ่งเป็นคอนโทรลเลอร์ระดับโปรตัวแรกจาก Sony นอกจากจะมีปุ่มฟังก์ชันพิเศษและปุ่ม Paddle เพิ่มเติมแล้ว เกมแพดไร้สายรุ่นนี้ยังมาพร้อมกับทริกเกอร์ที่ปรับระดับความสูงได้และจอยสติ๊กที่ถอดเปลี่ยนได้ (ในกรณีที่เกิดปัญหาจอยดริฟท์) แม้จะมีน้ำหนักมากกว่า DualSense รุ่นปกติเล็กน้อยและอายุการใช้งานแบตเตอรี่ที่ไม่ดีเท่า แต่ก็มอบการปรับแต่งที่คุณไม่สามารถหาได้จากคอนโทรลเลอร์ รเชื่อมต่อ Wi-Fi และ Bluetooth รวมถึงการใช้งานร่วมกับระบบ Smart Home อื่นๆ ผ่าน Webhooks, MQTT หรือการเขียนสคริปต์สำหรับผู้ใช้ระดับสูง", "วางจำหน่ายแล้วผ่านช่องทางออนไลน์ของบริษัทในราคา 499.99 ดอลลาร์สหรัฐฯ"], "full_paragraphs": ["หลังจากที่ Shelly ได้เปิดตัวเซนเซอร์ตรวจจับการรั่วไหลราคา 28 ดอลลาร์สหรัฐฯ ไปเมื่อช่วงต้นปีที่ผ่านมา ซึ่งโดดเด่นด้วยอายุการใช้งานแบตเตอรี่ที่ยาวนานถึงสองปี ล่าสุดบริษัทได้ประกาศเปิดตัวอุปกรณ์เสริมใหม่คือวาล์วน้ำอัจฉริยะ (Smart Valve) ที่สามารถติดตั้งเข้ากับท่อเมนหลักของบ้าน เพื่อทำหน้าที่ตัดการไหลของน้ำโดยอัตโนมัติเมื่อเซนเซอร์ตรวจพบปัญหา โดย Shelly Neo Smart Water Valve รุ่นนี้วางจำหน่ายแล้วผ่านทางร้านค้าออนไลน์ของบริษัทในราคา 499.99 ดอลลาร์สหรัฐฯ ซึ่งยังไม่รวมค่าติดตั้งหากผู้ใช้งานไม่มั่นใจในทักษะงานประปาของตนเอง แม้จะเป็นโซลูชันที่มีราคาสูง แต่ก็นับว่าคุ้มค่าเมื่อเทียบกับความเสียหายมหาศาลหากปล่อยให้การรั่วไหลเล็กน้อยกลายเป็นหายนะน้ำท่วมบ้าน", "Neo Smart Water Valve ถูกออกแบบมาให้ติดตั้งเข้ากับท่อมาตรฐานขนาด 1 นิ้วของสหรัฐฯ (โดยบริษัทมีแผนจะเปิดตัวตัวเลือกขนาดอื่นๆ เพิ่มเติมในปีหน้า) ตัววาล์วผลิตจากทองเหลืองซึ่งมีความปลอดภัยสำหรับการใช้งานกับระบบประปาน้ำดื่ม นอกจากนี้ยังมีมาตรฐานกันน้ำระดับ IPX7 ทำให้วาล์วยังคงทำงานได้ตามปกติแม้ในกรณีที่เกิดน้ำท่วมจนตัวอุปกรณ์จมอยู่ใต้น้ำ อย่างไรก็ตาม ตัววาล์วไม่มีแบตเตอรี่ในตัวและจำเป็นต้องเชื่อมต่อกับแหล่งจ่ายไฟผ่านสายอะแดปเตอร์ USB ที่ให้มาในชุด ซึ่งการเชื่อมต่อเข้ากับพาวเวอร์แบงค์ที่กันน้ำได้แทนการเสียบปลั๊กไฟบ้าน อาจเป็นแนวทางที่ดีที่สุดเพื่อให้มั่นใจว่าระบบจะยังคงทำงานได้แม้ในขณะที่ไฟฟ้าดับ", "ในด้านการเชื่อมต่อ วาล์วอัจฉริยะรุ่นนี้สามารถสื่อสารกับอุปกรณ์อื่นๆ ผ่าน Wi-Fi หรือ Bluetooth และถูกออกแบบมาให้รองรับการรวมเข้ากับระบบ Smart Home ที่มีอยู่เดิมผ่านการใช้งาน Webhooks, MQTT หรือการเขียนสคริปต์สำหรับผู้ใช้งานระดับสูง นอกเหนือจากความสามารถในการตัดการไหลของน้ำเข้าสู่บ้านภายในเวลาประมาณ 12 วินาทีแล้ว วาล์วยังมาพร้อมกับระบบวัดผลด้วยคลื่นอัลตราโซนิก (Ultrasonic measurement system) ที่คอยติดตามแรงดัน อัตราการไหล ปริมาณการใช้น้ำในบ้าน และแม้กระทั่งอุณหภูมิของน้ำ", "ผู้ใช้งานสามารถตรวจสอบข้อมูลทั้งหมดนี
