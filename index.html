ู่ยุค 32-bit โพลีกอนเป็นพิเศษ โดยมีเกมอย่าง Mouthwashing, Signalis, Crow Country และ Warhammer 40,000: Boltgun 2 เป็นเกมโปรดในช่วงที่ผ่านมา และล่าสุดผมได้มาติดใจกับ Queen's Domain เกม RPG แฟนตาซีที่ให้ความรู้สึกราวกับว่าเกม Elder Scrolls ถูกสร้างขึ้นมาสำหรับเครื่อง PlayStation 1 จริงๆ แล้วเกมนี้ได้รับแรงบันดาลใจมาจากซีรีส์ King's Field ของ FromSoftware ในยุคก่อนที่จะมี Dark Souls ซึ่งเน้นการต่อสู้ในมุมมองบุคคลที่หนึ่งที่เชื่องช้าและต้องใช้ความคิด รวมถึงความยากระดับลงโทษผู้เล่น (ซึ่งกลายเป็นเอกลักษณ์ของ FromSoft ในเวลาต่อมา) แต่ถึงแม้ Queen's Domain จะได้รับแรงบันดาลใจมาอย่างชัดเจน แต่มันก็เป็นประสบการณ์ที่โดดเด่นในปี 2026 ที่ถ่ายทอดความรู้สึกฝืดเคืองแบบเกมยุคเก่าออกมาได้อย่างยอดเยี่ยม", "คุณเริ่มต้นเกมด้วยการถูกซัดมาเกยตื้นบนเกาะป่าดิบชื้นหลังจากเรือของคุณถูกราชินีปีศาจดูดลงสู่ทะเล คุณต้องเผชิญกับความโดดเดี่ยวและอันตราย มีทั้งแมลงเต่าทองและจิ้งหรีดขนาดเท่ามนุษย์ที่คอยพุ่งเข้าใส่และติดตามคุณ สิ่งเดียวที่คุณมีไว้ป้องกันตัวในช่วงแรกคือดาบสนิมเขรอะที่ได้รับมาจากผู้รอดชีวิตคนอื่นๆ การต่อสู้ในช่วงแรกนั้นค่อนข้างน่าเบื่อ คุณต้องคอยถอยหลังเพื่อหลบจิ้งหรีดเมื่อเห็นท่าทางมันเริ่มโจมตี หรือเดินวนรอบแมลงเต่าทองตอนที่ปีกมันกระพือ และต้องกระโดดหลบเลเซอร์ที่ยิงมาจากพืชดวงตาที่ติดอยู่ตามผนัง (ซึ่งสามารถยิงคุณได้จากระยะไกล) มันไม่ใช่จุดเริ่มต้นที่น่าดึงดูดใจนัก แต่ผมก็มีความเชื่อมั่นว่าหากขุดลึกลงไปอีกหน่อย ผมจะต้องพบกับอัญมณีล้ำค่าอย่างแน่นอน", "ในเกมนี้ไม่มีตัวบอกเควสต์ ไม่มีจุดนำทาง หรือเส้นทางที่ไฮไลต์ไว้ให้ มีเพียงเข็มทิศทรงกลมที่ถอดแบบมาจาก King's Field โดยตรง ในฐานะคนที่ชอบเกมที่ไม่จูงมือผู้เล่นมากเกินไป ผมรู้สึกว่าต้องพิสูจน์ว่า Queen's Domain ทำปรัชญาการออกแบบนี้ออกมาได้ดีแค่ไหน ดังนั้นผมจึงค่อยๆ เดินหน้าเผชิญหน้ากับศัตรูแต่ละตัวและสำรวจซากปรักหักพังในเขตร้อนอย่างระมัดระวัง โดยรอคอยความก้าวหน้าในขณะที่ทุกอย่างตั้งแต่โครงกระดูกที่ฟื้นคืนชีพไปจนถึงแมลงปอต่างจ้องจะเอาชีวิตผม", "ด้วยแสงแวววาวจางๆ บนเนินดินนอกชายฝั่ง ผมพบเข็มขัดใส่มีดขว้างเพื่อเพิ่มคลังอาวุธที่น่าสงสารของผม ไอเทมสำคัญนั้นระบุตัวตนได้ยากมากในโลกของเกมเพราะมันกลมกลืนไปกับงานศิลปะแบบพิกเซล ดังนั้นผมจึงใช้เวลานานกว่าที่อยากจะยอมรับในการตามหามีดพวกนี้ แต่มันก็คุ้มค่าเพราะในที่สุดผมก็สามารถจัดการกับพืชดวงตาที่น่ารำคาญเหล่านั้นได้ และยังสามารถกดสวิตช์ที่ซ่อนอยู่ข้างประตูหินบานใหญ่ได้อีกด้วย ซึ่งหนึ่งในนั้นเป็นทางลัดกลับไปยังจุดเซฟและอีกทางหนึ่งนำไปสู่ห้องเก็บศพใต้ดิน เกมไม่ได้บอกให้คุณทำสิ่งเหล่านี้ แต่ด้วยการสำรวจและลองผิดลองถูกกับโลกของเกม คุณจะค้นพบสิ่งเหล่านี้ได้โดยธรรมชาติ", "ระหว่างทาง ผมเก็บหอกที่สร้างความเสียหายแบบเจาะเกราะและกระบองไม้ที่สร้างความเสียหายแบบทุบ ซึ่งทั้งสองอย่างช่วยเสริมความเสียหายแบบฟันจากดาบสนิมของผม ซึ่งผมได้อัปเลเวลความชำนาญจากการใช้งานมันมาตลอด ตอนนี้ระบบแพ้ทางอาวุธเริ่มชัดเจนขึ้น ศัตรูแต่ละตัวจะแพ้ทาง เป็นกลาง หรือต้านทานความเสียหายประเภทต่างๆ ดังนั้นการสลับอาวุธจึงกลายเป็นส่วนหนึ่งของการเต้นรำในการต่อสู้ที่เชื่องช้า ผมควรกล่าวด้วยว่าค่า Stamina เป็นปัจจัยที่สำคัญที่สุดในการสร้างความเสียหาย การโจมตีแต่ละครั้งจะลดแถบ Stamina ลง และยิ่งคุณมี Stamina เหลือมากเท่าไหร่ คุณก็จะสร้างความเสียหายได้มากขึ้นเท่านั้น มันฟื้นฟูได้อย่างรวดเร็ว แต่คุณไม่สามารถกดโจมตีรัวๆ เพื่อผ่านศัตรูไปได้ ซึ่งยิ่งเน้นย้ำถึงวิธีการต่อสู้ที่ต้องมีการคำนวณอย่างรอบคอบ", "ในห้องเก็บศพใต้ดินที่ผมกล่าวถึง สิ่งต่างๆ เริ่มไหลลื่นขึ้นเมื่อผมเข้าใจกลไกนี้และเริ่มตอบสนองต่อรูปแบบการโจมตีได้ดีขึ้น ศัตรูถูกออกแบบมาให้มีความดิบตามจิตวิญญาณของเกมเก่า ด้วยท่าโจมตีแบบเดียวและพฤติกรรมที่คาดเดาได้ และเมื่อคุณต้องรับมือกับศัตรูหลายตัวพร้อมกัน นั่นคือจุดที่ความท้าทายที่น่าสนใจยิ่งขึ้นปรากฏขึ้น ด้วยท่าโจมตีสำรองของกระบอง ผมสามารถพุ่งเข้าใส่โครงกระดูกและหลบออกมาได้ก่อนที่พวกมันจะแทงสวนกลับมา และการชาร์จการโจมตีหลักหมายความว่าผมสามารถจัดการกับจิ้งหรีดได้ด้วยการฟันเพียงไม่กี่ครั้ง", "เนื่องจากไม่มีระบบบันทึกอัตโนมัติและความตายหมายถึงการสูญเสียความคืบหน้าอันมีค่า (จุดเซฟมีอยู่อย่างจำกัด) การพบกุญแจประตูที่ปลายห้องเก็บศพจึงเพิ่มความตึงเครียดขึ้นไปอีก ตอนนี้ผมแค่ต้องเอาชีวิตรอดเพื่อกลับไปยังจุดเซฟเพียงจุดเดียวของผม นี่คือการตัดสินใจออกแบบสไตล์เก่าอีกอย่างหนึ่งที่แม้จะน่าหงุดหงิด แต่มันก็ช่วยเสริมการออกแบบโลกของ Queen's Domain และแนวทางในการรับมือกับความท้าทายโดยรวมของเกม", "กุญแจเปิดประตูที่ท่าเรือริมฝั่ง ซึ่งนำไปสู่ลานประลองปิดตายสำหรับการต่อสู้กับบอสตัวแรก ผมเห็นแถบเลือดที่กว้างเต็มหน้าจอโผล่ขึ้นมา และให้ตายเถอะ Shrine Guardian ที่เป็นโครงกระดูกนั้นใหญ่และดุดันกว่าทุกสิ่งที่ผ่านมา และทำให้ผมล้มลงด้วยการฟันดาบที่ชาร์จพลังมา การหลบออกจากระยะโจมตีของมันเป็นส่วนที่ยากที่สุดและผมก็โดนอัดยับในการลองครั้งแรก แต่แล้ว... อ๋อ! ท่าสำรองของหอกคือการถอยหลังอย่างรวดเร็ว ดังนั้นถ้าผมล่อบอสแล้วใช้ท่าถอยหลังโจมตีสวนกลับล่ะ? แล้วค่อยขว้างมีดใส่ในขณะที่ล่อหลอกมันเพื่อรอให้ Stamina ฟื้นฟู? งานง่ายเลย", "สิ่งนี้เน้นย้ำถึงความสำคัญของท่าโจมตีสำรอง และการเอาชนะมันทำให้ผมได้รับรางวัลเป็นดาบศักดิ์สิทธิ์เล่มใหม่ที่คมกริบพร้อมท่าสำรองที่ช่วยให้คุณร่อนกลางอากาศได้ชั่วครู่ ยอดเยี่ยมมาก ทั้งดาเมจที่สูงขึ้น รูปลักษณ์ที่เท่ขึ้น และวิธีใหม่ในการสำรวจ... เดี๋ยวนะ นี่มันเปิดเส้นทางมากมายที่ผมเคยคิดว่าเข้าไม่ได้! สะพานที่พังทลายนำไปสู่การค้นพบที่สำคัญสำหรับเควสต์หลัก รวมถึงอาวุธคบเพลิงเวทมนตร์ กิ่งไม้ที่ทำหน้าที่เป็นแพลตฟอร์มนำไปสู่พื้นที่ที่ผมต้องต่อสู้กับฝูงโครงกระดูกและแมลง จากนั้นใช้คบเพลิงเวทมนตร์จุดไฟที่หอคอยเพื่อดำเนินเนื้อเรื่องต่อไป คัมภีร์ลึกลับจะกระตุ้นความอยากรู้อยากเห็นของผมเกี่ยวกับโลกและนำทางผมไปข้างหน้าโดยไม่บอกตรงๆ และรอยแตกข้างอาคารที่พังทลายก็มีรางวัลจริงและไอเทมสำคัญอย่างการอัปเกรดพุ่งกลางอากาศ", "ถ้าผมต้องชี้ให้เห็นถึงสิ่งหนึ่งที่ผมคิดว่าอัจฉริยะเกี่ยวกับ Queen's Domain มันคือวิธีที่การออกแบบฉากนำทางคุณในการสำรวจอย่างเป็นธรรมชาติ ในการที่ไม่มีแผนที่ คุณต้องพึ่งพาการสังเกตโลกเพื่อหาเบาะแสทางสายตาและจดจำผังของมัน คุณจะต้องจดจำพื้นที่ที่คุณยังสำรวจไม่ครบและเส้นทางไหนที่คุณควรกลับมาหลังจากปลดล็อกสิ่งใหม่ๆ สิ่งที่คุณถูกขอให้ทำนั้นไม่ใช่เรื่องแปลกใหม่ แต่การที่เกมโยนภาระให้คุณเป็นคนคิดหาคำตอบเองทำให้ประสบการณ์นี้น่าสนใจยิ่งขึ้นมาก", "ไอเทมฟื้นฟูพลังชีวิตมีจำกัดในช่วงแรก และการพักที่จุดเซฟจะทำให้ศัตรูเกิดใหม่ มันเป็นโลกที่อันตราย และการออกไปผจญภัยเพื่อหวังจะก้าวหน้าต่อไปนั้นเป็นเรื่องที่น่าหวั่นใจ ปัญหาอย่างการติดขัดกับฉากระหว่างการโจมตีอาจทำให้หงุดหงิดเมื่อชีวิตเป็นเดิมพัน และศัตรูบางประเภทก็จัดการได้น่ารำคาญ ความหงุดหงิดเล็กน้อยอาจบั่นทอนความกระตือรือร้นของผมไปบ้าง แต่ผมก็เต็มใจที่จะลุยผ่านน้ำที่ขุ่นมัวเหล่านั้น เพราะภายในหลักการออกแบบที่ดูโบราณเหล่านี้คือเกม RPG ที่สดใหม่และน่าพึงพอใจอย่างประหลาด", "จังหวะการเล่นเปลี่ยนไปพอสมควรตลอดพื้นที่ Water Temple ซึ่งผมเคลียร์ได้ตอนเล่นไปประมาณหกชั่วโมง การตะลุยดันเจี้ยนนั้นมีจังหวะที่ดีมาก ผมไม่เคยรู้สึกหลงทางและผังของมันมีความสมดุลระหว่างความเข้าใจง่ายกับการกระตุ้นความอยากรู้อยากเห็น มันทำให้ผมตระหนักว่าเกมนี้มีกลิ่นอายของ Metroidvania ที่มีความสามารถที่ขยายขอบเขตในการเปิดเส้นทางใหม่ๆ ซึ่งชัดเจนมากเมื่อผมได้รับการอัปเกรดพุ่งกลางอากาศครั้งที่สองที่นี่เพื่อข้ามช่องว่างขนาดใหญ่ไปยังส่วนสุดท้ายของดันเจี้ยน ผมเริ่มคุ้นเคยกับการต่อสู้มากขึ้น รู้สึกผ่อนคลายขึ้นด้วยคลังอาวุธที่เพิ่มขึ้น รวมถึงกระบองหนามที่สร้างความเสียหายสองประเภทและลูกไฟจากคบเพลิงเวทมนตร์ ถึงอย่างนั้น มันก็ยังมีการต่อสู้ที่ยากลำบากกับสัตว์ทะเลมีพิษและแมลงก้ามปูตลอดดันเจี้ยนที่ยาวนานนี้ ซึ่งยังคงต้องใช้วิธีการที่รอบคอบโดยใช้ความสามารถที่มีอยู่อย่างจำกัดอย่างชาญฉลาด ซึ่งจะถูกทดสอบเพิ่มเติมในการต่อสู้กับบอสของดันเจี้ยนที่เป็นราชาปลาวาฬที่ถูกกัดกิน ซึ่งคอยเรียกสมุนและปล่อยคลื่นน้ำพิษออกมา", "หลังจากออกมาจากท่อระบายน้ำและจุดไฟที่หอคอยอีกแห่ง ผมพบเครื่องเทเลพอร์ตที่ระบุว่าผมยังมีพื้นที่อีกอย่างน้อยแปดแห่งรออยู่ข้างหน้า ตอนนี้ผมเข้าใจขอบเขตของ Queen's Domain อย่างชัดเจนแล้ว และเมื่อผมเข้าใกล้พื้นที่ถัดไป ซึ่งเป็นห้องสมุดที่สาปแช่งและวนเวียนอยู่ใน Tower of Knowledge ผมรู้สึกว่าการผจญภัยนี้กำลังจะลึกซึ้งยิ่งขึ้น แต่มันเป็นเกมที่ผมจะเติบโตไปพร้อมกับมัน เห็นได้ชัดจากวิธีที่ผมจัดการกับบอสเฝ้าประตูอย่าง Skeletal Executioner โดยแทบไม่มีรอยขีดข่วนด้วยการหลบกระสุนขวานของมัน ร่ายเวทคบเพลิง และชาร์จดาบศักดิ์สิทธิ์ ผมได้เข้าสู่สภาวะลื่นไหลแล้ว", "ส่วนหนึ่งในใจผมกำลังคิดว่าเกมจะรักษาโมเมนตัมนี้ไว้ได้อย่างไร จะจัดการกับการเพิ่มระดับพลังอย่างไร และจะพัฒนาในรูปแบบที่จะทำให้ประหลาดใจต่อไปได้อย่างไร ตั้งแต่การเก็บเหรียญโบราณเพื่อแลกอาวุธที่เฉียบคมขึ้นและเครื่องรางเพื่อเพิ่มสเตตัส รางวัลเล็กๆ น้อยๆ เหล่านั้นเป็นสิ่งที่น่าลิ้มลอง การเดินเข้าไปในภูมิภาคใหม่กระตุ้นความอยากรู้อยากเห็นของผมพอๆ กับที่มันสร้างบรรยากาศที่น่าขนลุก ทั้งรู้สึกทึ่งและกลัวว่าจะมีศัตรูใหม่ๆ อะไรอยู่ข้า ขลังของเกมดั้งเดิมเอาไว้ได้อย่างครบถ้วน พร้อมทั้งปรับปรุงองค์ประกอบเกมเพลย์บางส่วนให้ทันสมัยด้วยความสง่างามจนรู้สึกราวกับว่าสิ่งเหล่านี้ควรมีอยู่ตั้งแต่แรก นอกจากนี้ยังให้เกียรติแนวคิดการออกแบบดั้งเดิมด้วยการเชื่อมั่นว่าการสำรวจและการผจญภัยในรูปแบบเดิมนั้นยังคงยอดเยี่ยมอยู่เสมอ สำหรับแฟนเกม การได้เล่นฉบับรีเมคนี้คือการย้ำเตือนซ้ำแล้วซ้ำเล่าว่าทำไมคุณถึงตกหลุมรัก Ocarina of Time ตั้งแต่แรก และเป็นการได้เห็นความยอดเยี่ยมของเกมผ่านมุมมองใหม่ สำหรับผู้เล่นหน้าใหม่ นี่คือวิธีที่ดีที่สุดในการสัมผัสกับเกมคลาสสิกตลอดกาล และเป็นเกมเอ็กซ์คลูซีฟบน Switch 2 ที่ทุกคนไม่ควรพลาด", "หากคุณเพิ่งเคยสัมผัสเกมนี้เป็นครั้งแรก Ocarina of Time คือเกม Zelda 3D ภาคแรก ซึ่งเป็นเกมที่วางรากฐานสำคัญให้กับซีรีส์ เช่น Epona, ระบบ Z-targeting รวมถึงเผ่า Goron และ Gerudo ซีรีส์ Zelda คงไม่เป็นอย่างทุกวันนี้หากไม่มี Ocarina of Time ดังนั้นเกมนี้จึงมีที่พิเศษในใจของแฟนๆ และในประวัติศาสตร์ของ Nintendo เช่นเดียวกับ Super Mario 64 เกมนี้ได้วางแม่แบบให้กับการพัฒนาเกมของบริษัทมานานหลายทศวรรษ และเนื่องจาก Nintendo มักจะเป็นผู้บุกเบิกเส้นทางที่ผู้อื่นเดินตาม เกมนี้จึงมีอิทธิพลอย่างมากต่ออุตสาหกรรมเกมโดยรวม", "การเปลี่ยนแปลงที่เห็นได้ชัดที่สุดใน Ocarina 2026 คือการนำเสนอ ซึ่งถือว่าเป็นการอัปเกรดที่ยอดเยี่ยม พูดง่ายๆ คือนี่เป็นหนึ่งในเกมที่ดูดีที่สุดบน Switch 2 และเป็นหน้าเป็นตาให้กับเครื่องเกมนี้ ชุดของ Link และเด็กๆ ชาว Kokiri ได้รับการออกแบบให้มีรายละเอียดของเส้นใยผ้าที่ชัดเจน ตอกย้ำความเป็นภูตแห่งป่าที่เชื่อมโยงกับธรรมชาติ แสงที่สะท้อนบน Ocarina of Time ดูเหมือนเซรามิกเคลือบของจริง พื้นผิวอิฐในดันเจี้ยนดูเก่าแก่และสมจริง และยิ่งดูน่าขนลุกเมื่อได้รับแสงสลัวจาก Navi เพื่อนภูตของคุณ บอสแต่ละตัวจะแตกสลายกลายเป็นเถ้าถ่านสีม่วงเมื่อถูกกำจัด ทุกส่วนของโลกใบนี้ถูกสร้างขึ้นด้วยความใส่ใจ และในฐานะแฟนเกมที่กลับมาเล่นอีกครั้ง ผมรู้สึกทึ่งกับความสวยงามของมันอย่างต่อเนื่อง", "การปรับปรุงการนำเสนอยังครอบคลุมไปถึงรายละเอียดของแอนิเมชันและการออกแบบเสียง คุณสามารถเห็นแก้มของ Link พองขึ้นเมื่อเขาเป่า Ocarina และการเคลื่อนไหวของนิ้วมือที่ดูสอดคล้องกับตัวโน้ต เมื่อคุณไปถึง Lost Woods การติดตามเสียงตามทิศทางจะมอบประสบการณ์เชิงพื้นที่ที่สมบูรณ์แบบ ดนตรีที่นำมาเรียบเรียงใหม่ยังคงความเร้าใจและยิ่งใหญ่เช่นเดียวกับปี 1998 และผสมผสานเข้ากับความทรงจำของผมได้อย่างไร้รอยต่อ ตัวละครหลายตัวได้รับการพากย์เสียงเต็มรูปแบบในคัทซีนและบทสนทนา ซึ่งทำออกมาได้ดีเยี่ยมทุกตัวละคร ช่วยเพิ่มบุคลิกและหัวใจให้กับตัวละครเหล่านั้น นักพากย์ Ganondorf ถ่ายทอดความร้ายกาจออกมาได้อย่างเต็มที่, King Darunia ดูอบอุ่นและร่าเริง, Saria เพื่อนสนิทในวัยเด็กของ Link ฟังดูอ่อนหวานและจริงใจ, Impa ดูเป็นนักรบหญิงที่เด็ดขาด ส่วนเจ้าหญิง Ruto ในวัยเด็กเป็นตัวละครที่ผมชื่นชอบเป็นพิเศษด้วยนิสัยที่เอาแต่ใจแต่น่ารัก ส่วน Navi มีเสียงที่ดูโตขึ้นเล็กน้อยแต่ยังคงความเป็นเด็ก และมักทำหน้าที่เป็นเสียงแทน Link เนื่องจากเขายังคงเป็นตัวละครที่เงียบขรึม ยกเว้นเสียงตะโกนในการต่อสู้และปฏิกิริยาตกใจ", "ข้อเสียเพียงอย่างเดียวของการเพิ่มเสียงพากย์คือตัวละคร Sheik ซึ่งไม่ใช่ความผิดของนักพากย์ ผมเคยสงสัยว่าฉบับรีเมคจะจัดการกับจุดหักมุมนี้อย่างไร คำตอบคือมันพยายามแต่สุดท้ายก็ล้มเหลวในการสร้างสมดุลที่น่าพอใจ บทสนทนาแสดงให้เห็นว่าเกมต้องการรักษาเจตจำนงเดิมไว้ แต่ทั้งโมเดลตัวละครที่ปรับปรุงใหม่และเสียงพากย์ทำให้ความน่าเชื่อถือน้อยลง แม้นักพากย์จะทำหน้าที่ได้ดีเยี่ยม แต่การรักษาความลับของเนื้อเรื่องที่เคยพึ่งพาข้อจำกัดของเครื่อง N64 นั้นทำได้ยากในปัจจุบัน จนถึงจุดหนึ่งมันดูไม่สมเหตุสมผลที่ Link และ Navi จะไม่สังเกตเห็นความจริง อย่างไรก็ตาม นอกเหนือจากจุดเล็กน้อยนั้น คัทซีนใหม่ๆ ก็ช่วยเพิ่มความดราม่าให้กับเนื้อเรื่องที่ผมชื่นชอบอยู่แล้วได้เป็นอย่างดี", "มีการเน้นไปที่การแสดงออกทางสีหน้าและแอนิเมชันที่ละเอียดอ่อนเพื่อแสดงท่าทาง ทำให้ช่วงเวลาสำคัญมีน้ำหนักมากขึ้น ตัวอย่างที่สมบูรณ์แบบคือฉากบอกลาที่เต็มไปด้วยน้ำตาของ Saria ที่ขอบป่า Kokiri Saria เป็นคนพูดทั้งหมดในขณะที่ Link ยังคงเงียบ ซึ่งอาจจะดูอึดอัด แต่การที่ Link ลังเลเล็กน้อยก่อนจะหันไปเผชิญโชคชะตา แสดงให้เห็นว่าเขารู้สึกผูกพันกับเธอมากเพียงใดแต่ไม่รู้จะพูดอย่างไร เป็นช่วงเวลาที่น่ารักและสร้างสายสัมพันธ์ที่ลึกซึ้ง ในบางครั้งคัทซีนก็ทำให้จุดสำคัญของเนื้อเรื่องชัดเจนขึ้นกว่าเดิม เช่นตอนที่ Link หยิบ Master Sword และ Ganondorf ฉวยโอกาสนั้น เราจะเห็นภาพเหตุการณ์ที่ชัดเจนขึ้น ซึ่งเป็นการตอกย้ำสิ่งที่ผู้สร้างตั้งใจไว้แต่แรก", "แม้ว่าฉบับรีเมคจะยึดตามการออกแบบเดิมอย่างใกล้ชิด แต่ก็ได้เพิ่มฟีเจอร์อำนวยความสะดวก (Quality-of-Life) ที่ช่วยให้ประสบการณ์ราบรื่นและทันสมัยขึ้น สิ่งที่เห็นผลชัดที่สุดคือการเพิ่มปุ่มกระโดด ซึ่งยอดเยี่ยมมาก เกมต้นฉบับขาดปุ่มกระโดดเนื่องจากข้อจำกัดของคอนโทรลเลอร์ในยุคนั้น แต่ในเกมปี 2026 ปุ่มกระโดดให้ความรู้สึกที่เป็นธรรมชาติและเข้ากับการออกแบบฉากและดันเจี้ยนราวกับว่ามันควรมีอยู่ตั้งแต่แรก Ocarina ไม่เคยเป็นเกมที่มีการกระโดดที่ยากลำบาก แต่การสามารถกำหนดจังหวะการกระโดดเองได้ หรือการกระโดดขึ้นเถาวัลย์และบันไดเพื่อความรวดเร็วในการเดินทางนั้นให้ความรู้สึกที่ดีมาก แม้แฟนๆ บางส่วนจะกังขาเรื่องการเพิ่มปุ่มกระโดด แต่เมื่อได้ลองเล่นแล้ว ผมก็นึกภาพไม่ออกเลยว่าจะกลับไปเล่นแบบเดิมได้อย่างไร", "การเพิ่มอื่นๆ แม้จะส่งผลน้อยกว่าแต่ก็น่าชื่นชม แถบอุปกรณ์ (Equipment bar) ที่นำกลับมาจาก Breath of the Wild และ Tears of the Kingdom ช่วยให้คุณเรียกใช้อุปกรณ์ที่ต้องการได้ง่ายขึ้น เช่นเดียวกับรองเท้าและ Lenses of Truth (ที่ตอนนี้ดูเหมือนแว่นตากันลม) ที่ถูกกำหนดไว้ที่ปุ่มทิศทางเพื่อการสลับใช้งานอย่างรวดเร็ว หนึ่งในฟีเจอร์ QOL ที่ผมชอบที่สุดคือ Business Scrub คุณสามารถซื้อหรือหาเมล็ดพันธุ์เพื่อเรียกพ่อค้า Deku ได้ทุกที่ในโลก รวมถึงในดันเจี้ยน ซึ่งเขาจะขายไอเทมจำเป็น เช่น ยา, ระเบิด และลูกธนู ทำให้ไม่ต้องเดินย้อนกลับออกจากดันเจี้ยนเพื่อเติมของก่อนสู้กับบอส แต่ในขณะเดียวกัน คุณก็ต้องใช้อย่างประหยัดเพราะเมล็ดพันธุ์มีจำกัด ทำให้เกมยังคงความท้าทายเอาไว้ได้", "นอกจากนี้ยังมีส่วนเสริมที่กว้างขึ้นอย่าง Threads of Time ซึ่งเป็นระบบติดตามเควสต์ที่คอยบอกทิศทางสำหรับภารกิจหลักและเควสต์ย่อยที่คุณเริ่มทำ ปริศนาบางอย่างใน Ocarina อาจมีความซับซ้อน ซึ่งระบบนี้ไม่ได้ทำหน้าที่เป็นระบบบอกใบ้ แต่เป็นเครื่องเตือนความจำว่าคุณค้างไว้ที่ไหน นอกจากนี้ยังมี Hall of Fallen Foes ซึ่งเป็นห้องจัดแสดงรูปปั้นของสัตว์ประหลาดและบอสที่คุณเคยเอาชนะมาได้ทั่ว Hyrule แม้จะไม่ใช่สิ่งที่ปฏิวัติวงการ แต่การได้ชื่นชมรายละเอียดของดีไซน์เหล่านี้โดยไม่ต้องต่อสู้ด้วยนั้นเป็นเรื่องที่ดี และสำหรับบอสบางตัว คุณยังสามารถท้าทายเพื่อฝึกฝนทักษะได้อีกด้วย", "ทั้งหมดนี้เป็นส่วนเสริมที่เข้ามาเติมเต็มเกมคลาสสิกที่ยังคงความยอดเยี่ยมได้อย่างน่าทึ่ง การออกแบบดันเจี้ยนยังคงเป็นหนึ่งในส่วนที่ดีที่สุดของซีรีส์ แม้จะเป็นความพยายามในรูปแบบ 3D ครั้งแรกก็ตาม ดินแดน Hyrule เต็มไปด้วยสิ่งที่ต้องทำ ความลับที่ต้องค้นหา และผู้คนที่ต้องช่วยเหลือ เกมยังคงย่อยง่ายในแง่ของภารกิจหลัก ซึ่งเป็นเหตุผลว่าทำไมมันถึงถูกนำกลับมาเล่นซ้ำหลายปี แต่ก็ยังอัดแน่นไปด้วยกิจกรรมและเควสต์ย่อยให้สำรวจ และที่น่ายินดีคือมันยังคงความแปลกประหลาดอันน่าทึ่งของ Ocarina of Time ต้นฉบับเอาไว้ เกม Zelda มักจะมีเสน่ห์ที่ตลกขบขันเสมอ แต่ Ocarina นั้นแปลกกว่าภาคอื่นด้วยการออกแบบ NPC ที่พิลึกพิลั่นและช่วงเวลาตลกๆ เช่น การปลุกเจ้าของฟาร์ม Talon หลังจากเขาหลับในเขตปราสาท Hyrule หรือการที่คุณยังต้องแบกเจ้าหญิง Ruto ไว้บนหัวเหมือนกำลังขี่หลังปลาโลมา สิ่งเหล่านี้ยังคงสร้างความแตกต่างที่สนุกสนานให้กับโลกของเกม", "ในขณะเดียวกัน องค์ประกอบที่มืดหม่นก็ยังคงอยู่และได้รับการปรับปรุงให้ดียิ่งขึ้น ครั้งแรกที่ Link ในวัยผู้ใหญ่ก้าวออกจาก Temple of Time เพื่อเห็น Hyrule ที่ล่มสลายนั้นให้ความรู้สึกที่โศกเศร้าและถ่ายทอดออกมาได้อย่างเหมาะสม บอสบางตัวมีความน่ากลัวและสยดสยอง โดยเฉพาะ Dead Hand หรือ Cursed Rich Man ที่ทำออกมาได้น่าตกใจ แม้แต่ ReDead ก็ยังดูน่ากลัว แต่มีการปรับปรุงด้วยตัวบ่งชี้ทางภาพที่ชัดเจนขึ้นทำให้การเผชิญหน้าไม่น่าหงุดหงิดจนเกินไป", "เนื่องจากเกมนี้มีความเคารพต่อต้นฉบับสูง จุดอ่อนของ Ocarina of Time ดั้งเดิมจึงยังคงเป็นจุดอ่อนในฉบับรีเมค เช่น Water Temple ที่แม้จะอ่านแผนที่ได้ง่ายขึ้น แต่การปรับระดับน้ำก็ยังคงน่ารำคาญเล็กน้อย Shadow Temple ยังคงเป็นดันเจี้ยนที่เส้นตรงและอ่อนที่สุดเมื่อเทียบกับดันเจี้ยนอื่น การมีกล้องที่อิสระและปุ่มกระโดดทำให้ช่วงการลอบเร้นในปราสาท Hyrule และป้อมปราการ Gerudo จัดการได้ง่ายขึ้น แต่โดยเฉพาะป้อม Gerudo ก็ยังคงเป็นงานที่น่าเบื่อหน่าย สำหรับผม สิ่งเหล่านี้ถือเป็นการยอมรับเล็กๆ น้อยๆ เพื่อรักษาและให้เกียรติการออกแบบดั้งเดิม มันคงไม่รู้สึกว่าเป็น Ocarina of Time หากตัดช่วงเวลาเหล่านี้ออกไป", "เมื่อ Nintendo รีเมค Ocarina of Time สำหรับ 3DS ในปี 2011 มันยังอยู่ในยุคของเกม Zelda รูปแบบเดิม แต่ในปัจจุบัน ท่ามกลางบริบทของ Breath of the Wild และ Tears of the Kingdom การรีเมค Ocarina of Time จึงมีความรับผิดชอบที่ต่างออกไป นี่ไม่ใช่แค่การกลับมาเยี่ยมชมเกม Zelda เก่าในรูปแบบที่คุ้นเคย แต่เป็นการกลับมาเยี่ยมชมยุคสมัยที่แตกต่างไปจากเดิมอย่างสิ้นเชิง ซึ่งทำให้เกิดคำถามว่าเกม Zelda ในรูปแบบนี้ยังคงรู้สึกทันสมัยอยู่หรือไม่ คำตอบคือใช่ Ocarina of Time ยังคงเป็นความมหัศจรรย์ของการออกแบบเกมและการผจญภัยที่น่าตื่นเต้น ฉบับรีเมคนี้ช่วยขัดเกลาจุดที่ขรุขระ ทิ้งบางส่วนไว้ตามเดิม และปล่อยให้สิ่งที่พิเศษของต้นฉบับเปล่งประกายออกมา การเข้าถึงการรีเมคนี้ด้วยความเคารพต่อแหล่งที่มา ทำให้ Nintendo พิสูจน์ให้เห็นว่าผลงานระดับมาสเตอร์พีซที่แท้จริงนั้นสามารถยืนหยัดผ่านการทดสอบของกาลเวลาได้เสมอ"], "link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless/", "canonical_link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/LOZ-Deku-Tree.jpg?w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1793790000, "published_at": "2026-11-04T11:00:00Z", "published_th": "4 พ.ย. 2026 • 18:00 น.", "category_hint": "Review"}, {"id": 1794821821022, "guid": "https://www.eurogamer.net/the-legend-of-zelda-ocarina-of-time-remake-review", "original_title": "The Legend of Zelda: Ocarina of Time (2026) review", "thai_title": "รีวิว The Legend of Zelda: Ocarina of Time (2026): การกลับมาของผลงานระดับมาสเตอร์พีซที่เหนือกาลเวลา", "tag": "Review", "sub_tag": "ZELDA", "bullet_points": ["The Legend of Zelda: Ocarina of Time (2026) เป็นการนำเกมระดับตำนานปี 1998 มาปรับปรุงใหม่ด้วยกราฟิกสมัยใหม่และการควบคุมที่ลื่นไหลขึ้น", "มีการปรับปรุงระบบ UI และการจัดการไอเทมที่ช่วยลดความยุ่งยาก โดยเฉพาะในดันเจี้ยนที่ซับซ้อนอย่าง Water Temple ทำให้เกมมีจังหวะการเล่นที่ต่อเนื่องและสนุกกว่าเดิม", "ตัวเกมยังคงรักษาหัวใจสำคัญของต้นฉบับไว้ได้อย่างครบถ้วน ทั้งเนื้อเรื่อง การออกแบบดันเจี้ยน และความรู้สึกของการผจญภัยที่น่าประทับใจ", "การกลับมาเล่นเกมนี้ในวัยที่โตขึ้นมอบประสบการณ์ที่ลึกซึ้งกว่าเดิม โดยเฉพาะการสะท้อนถึงเรื่องราวของ 'เวลา' ที่สอดคล้องกับชีวิตจริงของผู้เล่น", "แม้จะมีบางจุดที่กราฟิกดูมีความเป็นเกมยุคใหม่จนอาจสูญเสียเอกลักษณ์ดั้งเดิมไปบ้าง แต่โดยรวมถือเป็นผลงานที่ทั้งผู้เล่นหน้าใหม่และแฟนเก่าไม่ควรพลาด"], "full_paragraphs": ["ผมมีเพื่อนคนหนึ่งที่ได้สัมผัส The Legend of Zelda: Ocarina of Time ครั้งแรกในช่วงที่เกมเพิ่งวางจำหน่ายใหม่ๆ ซึ่งเป็นช่วงที่เขาเพิ่งกลับจากมหาวิทยาลัยมาฉลองคริสต์มาสที่บ้าน สำหรับผม นี่คือช่วงเวลาที่ดีที่สุดในการเล่นวิดีโอเกม ไม่ใช่เพราะเทศกาลคริสต์มาสโดยเฉพาะ แต่เพราะมันเป็นช่วงเวลาที่คุณได้หลุดออกจากโลกแห่งความเป็นจริงและมีเวลาว่างหลายสัปดาห์โดยไม่มีภาระใดๆ มาคอยรบกวน หลายปีต่อมา เพื่อนคนนี้บอกผมว่าความมหัศจรรย์ของเกมนี้ไม่ได้อยู่ที่การเล่นเพียงอย่างเดียว แต่อยู่ที่ 'วิธีการ' ที่การเล่นนั้นดำเนินไป", "สิ่งที่เขาหมายถึงคือ เขาจะเล่นเกมทั้งวันโดยปิดม่านหน้าต่าง ไม่สนใจครอบครัว มุ่งมั่นฝ่าฟันดันเจี้ยนและควบม้า Epona วิ่งไปทั่วทุ่ง Hyrule Field จากนั้นในตอนเย็น เขาจะโทรหาแฟนสาวที่กลับไปฉลองคริสต์มาสกับครอบครัวของเธอ เธออยากรู้เสมอว่าวันนี้เขาทำอะไรมาบ้าง และไม่ใช่เรื่องราวใน East Sussex ที่เธออยากฟัง แต่เธออยากรู้ว่าเขาได้ไปผจญภัยอะไรมาบ้างใน Hyrule", "ดังนั้น ในขณะที่เขาเล่นเกม เขาจะหยุดพักเป็นระยะเพื่อเล่าให้ใครสักคนฟังว่าเขาได้พบเจออะไร ได้ค้นพบอะไร และยังมีอะไรที่ต้องเอาชนะอีกบ้าง วันนี้ผมมีความยินดีอย่างยิ่งที่จะบอกคุณว่า ประมาณ 30 ปีให้หลัง หลังจากที่ผมได้กลับมาสัมผัสเกมนี้อีกครั้งในเวอร์ชันรีเมคใหม่ของ Nintendo ผมขอยืนยันว่า Ocarina of Time ยังคงเป็นเกมที่คุ้มค่าแก่การบอกต่อ มันยังคงเป็นการผจญภัยที่น่าประหลาดใจ น่าพึงพอใจ และซาบซึ้งใจจนผมอดไม่ได้ที่จะต้องพูดถึงมัน", "อย่างไรก็ตาม แม้ว่าเกมนี้จะเป็นผลงานระดับมาสเตอร์พีซที่ไร้ที่ติ แต่ปฏิกิริยาของผมที่มีต่อการกลับมาเล่นครั้งนี้กลับเป็นเรื่องน่าประหลาดใจ หรือจะพูดให้ถูกคือ มันน่าประหลาดใจเพราะเกมนี้เป็นมาสเตอร์พีซนั่นเอง ความจริงคือเมื่อสองสัปดาห์ก่อน ผมไม่ได้รู้สึกโหยหาที่จะกลับไปเล่น Ocarina of Time เลยแม้แต่น้อย ผมรู้สึกกังวลใจด้วยซ้ำว่าจะต้องมานั่งลุยเกมที่เคยยิ่งใหญ่ในอดีตและต้องมาเขียนบทความนับพันคำด้วยความเคารพแบบจำยอม", "โชคดีที่ผมลืมไปสองอย่าง อย่างแรกคือผมมันงี่เง่าที่ลืมไปว่าทุกโอกาสที่จะได้เล่น Zelda อีกครั้งคือสิ่งที่ไม่ควรพลาด และอย่างที่สองคือ ผมลืมไปว่า Ocarina of Time เป็นมาสเตอร์พีซในรูปแบบไหนกันแน่ และนอกจากประเด็นหลังนี้ ซึ่งเราจะมาเจาะลึกกันในภายหลัง ผมยังไม่รู้ด้วยซ้ำว่ามี 'ส่วนผสมลับ' ในเวอร์ชันรีเมคนี้ที่พิสูจน์แล้วว่าสำคัญอย่างยิ่งต่อความยิ่งใหญ่ของมัน ซึ่งไม่ได้เกี่ยวข้องอะไรเลยกับโค้ดที่รันบนเครื่อง Switch 2", "มาพูดถึงหน้าที่ของเวอร์ชันรีเมคกันก่อน นี่คือเกมที่แทบจะเหมือนกับที่ผู้คนเคยเล่นในปี 1998 จังหวะของการผจญภัยที่ Link ต้องเดินทางข้ามยุคสมัยใน Hyrule เพื่อเอาชนะ Ganon ยังคงเหมือนเดิม คุณยังคงเริ่มต้นใน Kokiri Forest และยังคงควบม้า Epona กระโดดข้ามรั้วที่ Lon Lon Ranch ซึ่งเป็นหนึ่งในฉากที่น่าตื่นเต้นและขนลุกที่สุดในประวัติศาสตร์ศิลปะ หากคุณติดอยู่ในดันเจี้ยน คุณแทบจะสามารถใช้บทสรุปเดิมจากเกม N64 เพื่อผ่านมันไปได้ โลกของเกมยังคงถูกแบ่งเป็นส่วนๆ ที่ค่อยๆ โหลดเข้าและออกเมื่อคุณเคลื่อนที่ผ่าน และเกมยังคงเริ่มต้นด้วยฉากเปิดที่ตราตรึงใจ ซึ่ง Link และ Epona ควบม้าผ่านเนินเขาที่มีหมอกและแสงจันทร์เบื้องหลัง เหมือนหลุดออกมาจากผลงานของ Zelda ที่ผสมผสานกับ Susan Cooper", "แต่มีการเปลี่ยนแปลงอะไรบ้าง? อย่างแรกคือทั้งเกมได้รับการอัปเดตด้วยกราฟิกสมัยใหม่ และตัดระบบกล้องแบบคงที่ออกไปทั้งหมด เพื่อเปลี่ยนมาใช้ระบบการเคลื่อนไหวแบบยุคใหม่ที่ใช้จอยสติ๊กหนึ่งข้างควบคุมตัวละครและอีกข้างควบคุมกล้อง ตัวอย่างเช่น Hyrule Castle Town ในความทรงจำของผมมักจะมีกล้องอยู่ตรงกลาง และคุณจะต้องหมุนตัวไปตามถนนราวกับม้าบนม้าหมุนในสวนสนุก", "ตอนนี้มันกลายเป็นพื้นที่ที่อิสระเหมือนใน Frozen ถนนหินทอดยาวไปทุกทิศทางและคุณสามารถสำรวจได้โดยมีกล้องวิ่งตามหลังคุณ พื้นที่ในเกมรู้สึกเหมือนเป็นพื้นที่วิดีโอเกมจริงๆ มากกว่าที่จะเป็นเครื่องจักรซับซ้อนที่คุณเป็นเพียงฟันเฟืองตัวหนึ่ง ใช่ครับ จากวิธีที่ผมพูด ผมเห็นแล้วว่ามีการแลกเปลี่ยนบางอย่างเกิดขึ้น ผมเคยชอบความรู้สึกในเกม 3D ยุคแรกที่ทุกอย่างดูเหมือนเป็นกลไกที่ชาญฉลาดและพร้อมจะพังทลายลงได้ทุกเมื่อ แต่ก็นั่นแหละ! Ocarina เวอร์ชันใหม่นี้เป็นเกมที่คุณสามารถให้เด็กๆ ที่ไม่ได้เกิดในปี 1998 เล่นได้ และพวกเขาจะรู้สึกคุ้นเคยกับมันได้เร็วกว่า", "บางครั้งการอัปเดตทางกราฟิกก็ยอดเยี่ยมจริงๆ เส้นทางไปสู่ Zora's Domain ซึ่งผมแทบจำไม่ได้ในต้นฉบับ ตอนนี้กลายเป็นการปีนป่ายผ่านหน้าผาและโขดหินที่สวยงาม ในขณะที่สีสันสไตล์ Nickelodeon ยุค 90 และพื้นผิวที่มันวาว ทำให้ท้องของ Jabu Jabu กลายเป็นส่วนผสมระหว่างงานปาร์ตี้ก่อนยุคมิลเลนเนียมกับสนามเด็กเล่นในร่มยุคใหม่", "อย่างไรก็ตาม สถานที่ที่ผมชอบที่สุดคือดันเจี้ยนช่วงกลางเกมสองแห่ง Water Temple ตอนนี้กลายเป็นพระราชวังใต้น้ำสไตล์ Art Nouveau ที่คุณสามารถจินตนาการได้ว่ากัปตัน Nemo จะมาเดินเล่นที่นี่ และ Forest Temple ซึ่งเป็นดันเจี้ยน Zelda ที่ผมชอบที่สุดตลอดกาล กลายเป็นคฤหาสน์สังหารที่มีพื้นไม้ปาร์เกต์ซึ่งถูกต้นไม้เข้ายึดครอง ทางเดินที่บุด้วยไม้สีเข้มและชิ้นส่วนแปลกๆ ของโบสถ์ที่โผล่ออกมาจากพุ่มไม้ มันเป็นสถานที่ที่คุณอาจได้ยินในพอดแคสต์คดีฆาตกรรมแปลกๆ", "แต่ก็มีการแลกเปลี่ยนเกิดขึ้น ภรรยาของผมซึ่งเป็นแฟนตัวยงของเกมต้นฉบับมักจะเดินเข้ามาดูในขณะที่ผมเล่น และมักจะรู้สึกว่าเกมที่เธอจำได้นั้นมีเอกลักษณ์ทางภาพที่มากกว่าเล็กน้อย ตัวอย่างเช่น ฉากที่คุณสู้กับ Dark Link ได้สูญเสียความรู้สึกหลอนๆ แบบกึ่งจริงกึ่งฝันไปบ้าง แม้ว่าการจัดวางฉากที่มีต้นไม้เก่าแก่กลางห้องที่เต็มไปด้วยควันจะยังคงดูแปลกตาอย่างน่าประหลาดก็ตาม ในช่วงท้ายของเกมเมื่อเข้าสู่ดินแดน Gerudo คุณอาจจะสงสัยว่าคุณหลุดเข้าไปในเกม Unreal Engine มุมมองบุคคลที่สามที่กำลังพัฒนาอยู่ในปัจจุบันหรือไม่ มันดูสวยงาม แต่บางครั้งมันก็ดูไม่เหมือน Zelda เท่าไหร่นัก", "ทั้งหมดนั้น รวมถึงโมเดลตัวละครที่ดูแปลกตาซึ่งผมก็เรียนรู้ที่จะรักมันในที่สุด ไม่ได้มีความสำคัญมากนัก ไม่ใช่เพราะเหตุผลอื่นใดนอกจากมีการปรับแต่งเล็กๆ น้อยๆ ที่ชาญฉลาดในส่วนอื่น ทำให้ Ocarina ตอนนี้ดำเนินไปอย่างรวดเร็วอย่างน่าทึ่ง และทั้งหมดนี้มาพร้อมกับการลดบทบาทของ Navi ภูติน้อยและนกฮูกที่คอยขัดจังหวะ ซึ่งในต้นฉบับมีไว้เพื่อช่วยนำทางคุณในช่วงแรกอยู่แล้ว", "การปรับแต่งเหล่านี้ยอดเยี่ยมมาก ตอนนี้ Link มีปุ่มกระโดด ซึ่งช่วยตัดการกระโดดตามบริบทของเกมต้นฉบับออกไป และทำให้ท่าโจมตีแบบกระโดดดูน่าประทับใจยิ่งขึ้น ยิ่งไปกว่านั้น การยืมระบบจากเวอร์ชัน 3DS มาใช้ ทำให้คุณสามารถสลับไอเทมที่ใช้งานได้ผ่านเมนูย่อยที่ปุ่ม Trigger และสามารถเปลี่ยนรองเท้าหรืออุปกรณ์สวมหัวได้ด้วยปุ่มทิศทาง", "ฟังดูอาจจะไม่ใช่เรื่องใหญ่ แต่มันเป็นการเปลี่ยนแปลงที่เงียบเชียบแต่ทรงพลังในแบบที่การอัปเดตที่ดีที่สุดควรจะเป็น ลองดูที่ Water Temple สิครับ นี่คือดันเจี้ยนที่เป็นตำนานในเรื่องความยากและความอดทนที่ต้องใช้ในการนำทางผ่านสภาพแวดล้อมที่สามารถปรับระดับน้ำได้ถึงสามระดับ แต่ตอนนี้ เช่นเดียวกับบน 3DS คุณสามารถสนุกกับมันได้โดยไม่ต้องกดเข้าเมนูทุกๆ สองสามก้าวเพื่อใส่หรือถอดรองเท้าเหล็ก", "และนั่นหมายความว่าดันเจี้ยนที่ผมเคยหวาดกลัวกลับกลายเป็นดันเจี้ยนที่เผยความลับออกมาผ่านการทดลอง ผมสามารถปรับระดับน้ำและดูว่ามีตัวเลือกอะไรบ้าง คิดถึงความสัมพันธ์ระหว่างพื้นที่ที่ไปถึงได้กับพื้นที่ที่ไปไม่ถึง โดยไม่ต้องวุ่นวายกับเมนูและขัดจังหวะความต่อเนื่อง 'ความลื่นไหล' คือคำที่ถูกต้องครับ การปรับ UI และการจัดการไอเทมง่ายๆ ได้มอบจังหวะที่สมบูรณ์แบบและความรู้สึกของการค้นพบให้กับดันเจี้ยน Zelda ระดับตำนานแห่งนี้", "นอกเหนือจากการปรับแต่งที่ผมสังเกตเห็น เช่น การติดตั้ง Hookshot ที่ง่ายขึ้น ผมมั่นใจว่ายังมีรายละเอียดเล็กๆ น้อยๆ อีกนับร้อยที่ผมไม่ได้สังเกต ผมสงสัยว่ามีการเพิ่มคำแนะนำที่นุ่มนวลขึ้นในสถานที่อย่าง Water Temple ในขณะที่ที่อื่น เช่น Forest Temple ผมสงสัยว่าการเดินย้อนไปมาบางส่วนถูกตัดออกไป การวางตำแหน่งไอเทมอาจถูกเปลี่ยน และมีการปรับแต่งที่ใจกว้างอย่างกระเป๋าเงินที่จุรูปีได้มากขึ้นตั้งแต่ต้น สำหรับผมแล้ว การปรับแต่งทั้งหมดนี้มีจุดร่วมกันคือ มันทำให้เกมดีขึ้นโดยไม่ลบหรือเปลี่ยนแปลงสิ่งที่สำคัญของต้นฉบับไป และผมก็แทบจะหาจุดที่เปลี่ยนไปไม่เจอเลย", "ผมพยายามหาจุดที่เปลี่ยนไปอยู่พักหนึ่ง และเปรียบเทียบสิ่งที่ผมกำลังเล่นกับความทรงจำ ซึ่งมักจะคลาดเคลื่อนอยู่เสมอ ทุ่ง Hyrule Field รู้สึกเล็กลงในตอนนี้ แต่ก็ยังคงน่าตื่นเต้นที่จะควบม้าผ่านไป ผมจำได้ว่า Epona เข้ามาในเกมเร็วกว่านี้ หรือบางทีผมแค่จำได้ว่าแนวคิดเรื่องม้าในเกม Zelda เป็นเรื่องใหญ่ที่ดึงดูดความสนใจมาก ผมเคยคิดว่าบอสตัวโปรดที่เกี่ยวข้องกับภาพวาดสีน้ำมันจะมาในช่วงท้ายเกม แต่ก็นั่นแหละ ผมอาจจะย้ายมันไปไว้ในองก์ที่สามเพราะผลกระทบที่มันมีต่อผมในตอนนั้น", "แต่เมื่อเวลาผ่านไป สิ่งนี้ก็นำไปสู่สิ่งที่สำคัญที่สุดเกี่ยวกับ Ocarina of Time และเหตุผลที่เวอร์ชันรีเมคนี้มีผลกระทบทางอารมณ์ต่อคนอย่างผม นี่ไม่ใช่แค่เกม Zelda อีกเกมที่มีโลกกว้างที่ชาญฉลาด แต่มันเป็นเกม Zelda ที่หมกมุ่นอยู่กับ 'เวลา' มากกว่าที่เคยเป็นมา และนั่นเป็นเพราะเวลาในเกมดำเนินไปผ่านกลไกหลักที่พา Hyrule ไปสู่ ght=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-12.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-9.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-8.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-7.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp"], "videos": ["https://www.youtube.com/embed/8BYDYTh4G9s"], "review_score": "10", "published_ts": 1793790000, "published_at": "2026-11-04T11:00:00Z", "published_th": "4 พ.ย. 2026 • 18:00 น.", "category_hint": "Review"}, {"id": 1794822849534, "guid": "1943764", "original_title": "Godzilla: Destroy All Monsters Melee Remastered Is A Faithful, If Flawed, Remaster", "thai_title": "รีวิว Godzilla: Destroy All Monsters Melee Remastered – ความสนุกฉบับคลาสสิกที่ถูกบั่นทอนด้วยระบบ Grind", "tag": "Review", "sub_tag": "GAME REVIEW", "bullet_points": ["Godzilla: Destroy All Monsters Melee Remastered ยังคงมอบประสบการณ์ความสนุกแบบดั้งเดิมในการต่อสู้ของเหล่าไคจูที่เล่นง่ายและเฮฮา", "ระบบการเล่นแบบ 3D Brawler ที่ให้ผู้เล่นหยิบจับสิ่งของหรือตึกรามบ้านช่องมาฟาดฟันกันยังคงเป็นจุดเด่นที่สร้างความบันเทิงได้ดีเยี่ยม", "ตัวเกมมีปัญหาเรื่องระบบ Progression ใหม่ที่บังคับให้ผู้เล่นต้อง 'Grind' หรือเล่นซ้ำเพื่อปลดล็อกตัวละครและโหมดต่างๆ ซึ่งขัดกับธรรมชาติของเกมที่ควรจะเป็นความสนุกแบบหยิบมาเล่นได้ทันที", "แม้จะมีโหมด Tournament ที่ช่วยให้เข้าถึงตัวละครได้โดยไม่ต้องปลดล็อก แต่กลับถูกซ่อนไว้อย่างไม่น่าเชื่อและไม่รองรับการเล่นออนไลน์", "โดยรวมถือเป็นเกมที่แฟน Godzilla ควรค่าแก่การเล่นเพื่อความบันเทิง แต่ระบบปลดล็อกที่ยืดเยื้อทำให้เสน่ห์ของเกมลดน้อยลงกว่าต้นฉบับ"], "full_paragraphs": ["Godzilla: Destroy All Monsters Melee Remastered คือเกมแนว 3D Brawler ที่คุณสามารถสวมบทบาทเป็น Godzilla ปี 1990 จับ Godzilla ปี 2000 ทุ่มใส่ตึก หรือดู Anguirus กระโดดถีบศัตรูจนทะลุอาคาร ซึ่งมันเป็นอะไรที่ตลกและสนุกมาก เพียงแค่คำนิยามนี้ก็เพียงพอแล้วที่จะทำให้ผมและแฟนๆ Godzilla คนอื่นๆ พูดว่า 'ได้โปรด เอาเงินผมไปเลย' และตัวเกมก็ทำได้ตามคำสัญญาจริงๆ ซึ่งไม่ใช่เรื่องน่าแปลกใจนักเพราะระบบการเล่นนั้นถอดแบบมาจากเกมต้นฉบับปี 2002 มาแบบหนึ่งต่อหนึ่ง", "ความสนุกของการได้อาละวาดเป็นสัตว์ประหลาดขนาดยักษ์ท่ามกลางเมืองที่พังทลายนั้นเพิ่มขึ้นเป็นทวีคูณเมื่อเล่นกับเพื่อน 3 คนในโหมด Local โดยเฉพาะบน Nintendo Switch ที่คุณสามารถถอด Joy-Con ส่งให้คนข้างๆ แล้วหัวเราะร่าตอนที่คุณเหวี่ยงพวกเขาลงไปในบ่อลาวาบนเกาะ Monster Island แต่น่าเสียดายที่ความสนุกแบบอาร์เคดที่เรียบง่ายและตรงไปตรงมาของเกม กลับถูกขัดขวางด้วยการต้องใช้เวลาหลายชั่วโมงในการ 'Grind' เพื่อปลดล็อกตัวละคร ด่าน และโหมดต่างๆ ของเกม", "ระบบการเล่นที่ต้องใช้ความพยายามอย่างหนักนี้ไม่ได้ช่วยส่งเสริมดีไซน์ของเกมที่เน้นความสนุกแบบ 'หยิบมาเล่นได้ทันที' เลยแม้แต่น้อย มันเปลี่ยนเกมที่เต็มไปด้วยเสียงหัวเราะให้กลายเป็นงานที่น่าเบื่อหน่ายเมื่อสิ่งที่คุณต้องการจริงๆ คือการได้เล่นเป็น Rodan ตั้งแต่เริ่มเกม คุณจะสามารถเข้าถึงตัวละครได้เพียง 4 จาก 12 ตัวเท่านั้น ได้แก่ Godzilla 1990, Gigan, Megalon และ Anguirus ซึ่งตัวละครเริ่มต้นเหล่านี้แสดงให้เห็นถึงความหลากหลายของประเภทสัตว์ประหลาด ยกเว้นพวกที่บินได้อย่าง King Ghidorah และ Rodan", "โดยทั่วไปแล้วสัตว์ประหลาดจะมีชุดท่าโจมตีที่คล้ายคลึงกัน โดยบางตัวจะมีลูกเล่นพิเศษเพิ่มเข้ามา เช่น ความสามารถในการวาร์ปของ Gigan หรือการมุดดินของ Megalon เพื่อโผล่ขึ้นมาจับศัตรู ในช่วงแรกท่าโจมตีอาจดูซ้ำซากจำเจด้วยคอมโบที่เหมือนกัน หรือเอฟเฟกต์การกระทืบเท้าที่คล้ายกัน แต่ก็ยังมีรายละเอียดเล็กๆ น้อยๆ ที่ทำให้แต่ละตัวมีเอกลักษณ์เฉพาะตัว เช่น ท่าป้องกันของ Anguirus ที่จะหันหลังเอาหนามแหลมคมรับการโจมตี ก่อนจะทำให้ศัตรูมึนงงในขณะที่มันสะบัดมือไปมาด้วยท่าทางตลกขบขัน", "แม้จะไม่ใช่เกมต่อสู้ที่มีความลึกซึ้งมากนัก แต่ก็มีความหลากหลายเพียงพอที่จะทำให้การต่อสู้สนุกสนาน เช่น ความสามารถในการหยิบตึกมาทุ่ม หรือการเก็บไอเทมเพิ่มพลังเพื่อเรียก Mothra มาโจมตีทางอากาศ ความหลากหลายนี้ช่วยให้การต่อสู้แต่ละครั้งไม่รู้สึกซ้ำซาก การได้เห็นสัตว์ประหลาด 4 ตัววิ่งวุ่นไปทั่วฉาก พ่นลำแสงออกจากปาก ทุ่มตึกใส่กัน หรือกลิ้งไปมาเพื่อหลบหลีกนั้นเป็นความสนุกที่แท้จริง ประสบการณ์การเล่นคนเดียวอาจจะดูเบาบางไปบ้าง แต่เมื่อเล่นกับเพื่อนมันคือความบันเทิงชั้นยอด ซึ่งเป็นผลมาจากความที่เป็นเกมต่อสู้ที่เข้าถึงง่าย และแม้แต่ในช่วงเวลาที่ผมเล่นคนเดียว เกมก็ยังทำให้ผมหัวเราะได้เป็นระยะจากความรุนแรงแบบการ์ตูนของเหล่าไคจู", "น่าเสียดายที่การปลดล็อกสัตว์ประหลาดตัวอื่นๆ ไม่ได้ตรงไปตรงมาเหมือนในเกมต้นฉบับ ในเกมปี 2002 การปลดล็อกตัวละครทำได้เพียงแค่เล่นโหมด Adventure ให้จบ ซึ่งเป็นโหมดสั้นๆ สไตล์อาร์เคดที่คุณต้องเอาชนะสัตว์ประหลาดไปเรื่อยๆ จนถึง Mechagodzilla ในตอนท้าย แต่ในเวอร์ชัน Remaster นี้กลับมีระบบความก้าวหน้า 3 รูปแบบเข้ามาแทนที่ ได้แก่ ค่า XP ของตัวละครแต่ละตัว, Research Points สำหรับทำโปรเจกต์เพื่อปลดล็อกตัวละครและด่าน, และ Rumors ซึ่งเป็นภารกิจที่ต้องทำเพื่อให้บรรลุโปรเจกต์", "ระบบเหล่านี้ถูกนำมารวมกันเพื่อพยายามยืดเวลาการเล่นและปลดล็อกตัวละครที่คุณชื่นชอบ (อย่าง Rodan!) ซึ่งมันส่งผลเสียมากกว่าผลดี ในช่วง 11 ชั่วโมงที่ผมเล่นมา ส่วนใหญ่ผมใช้เวลาไปกับการเล่นคนเดียวเพื่อพยายามปลดล็อกตัวละคร ซึ่งผมยังทำไม่สำเร็จ โดยเหลืออีก 3 ตัวคือ Destroyah, Mechagodzilla และ Rodan การปลดล็อกแต่ละตัวต้องทำตามรายการเงื่อนไข เช่น ชนะการต่อสู้ 12 ครั้งด้วย Megalon หรือ Gigan ซึ่งจะปลดล็อก Research Project ต่อไป ซึ่งต้องเล่นโหมด Adventure หรือ Multiplayer (ทั้งออนไลน์และ Local) เพื่อเก็บความคืบหน้า", "การทำภารกิจ Rumors และ Research ให้สำเร็จนั้นใช้เวลาแตกต่างกันไป และบางครั้งการทำสำเร็จก็เผยให้เห็นภารกิจใหม่ที่ต้องทำเพิ่มขึ้นอีก ผมเคยเข้าใจผิดอยู่สองสามครั้งว่าแค่ทำ Research เดียวก็จะปลดล็อก Mecha-King Ghidorah ได้แล้ว แต่กลับกลายเป็นว่าต้องไปปลดล็อกโปรเจกต์อื่นก่อน ความเหนื่อยหน่ายนี้ยังลามไปถึงโหมด Adventure ใหม่ๆ ที่ถูกล็อกไว้ตามเลเวลของตัวละครแต่ละตัว ซึ่งมันน่าเบื่อมาก", "โหมด Adventure ใหม่ 2 โหมดที่เพิ่มเข้ามาอย่าง Adventure Gauntlet และ Adventure Challenge ถือเป็นการเปลี่ยนแปลงที่น่ายินดี โดย Gauntlet จะให้คุณสู้กับ CPU 2 ตัวที่เก่งขึ้นเรื่อยๆ ในแต่ละรอบ ส่วน Challenge คือเวอร์ชันที่ยากกว่าเดิมที่ CPU จะเริ่มเกมพร้อมไอเทมเพิ่มพลัง แต่น่าเสียดายที่การปลดล็อกโหมดเหล่านี้ต้องอาศัยการเก็บเลเวลตัวละครทีละตัว ซึ่งใช้เวลานานมาก", "อย่างไรก็ตาม ยังมีวิธีเล่นตัวละครและด่านทั้งหมดโดยไม่ต้อง Grind นั่นคือโหมด Tournament ซึ่งโหมดนี้ถูกซ่อนไว้อย่างแปลกประหลาดในการตั้งค่า แทนที่จะอยู่ในเมนูหลัก การเปิดโหมดนี้จะปิดการใช้งานโหมดอื่นๆ ทั้งหมด ยกเว้น Custom Battle และหยุดการเก็บค่า Research และเลเวล ที่นี่คุณสามารถเล่นเป็นสัตว์ประหลาดตัวไหนก็ได้ในการต่อสู้ 1v1 กับ CPU หรือเล่นกับเพื่อน 3 คนในเครื่องเดียวกัน แต่โหมด Tournament ไม่สามารถเล่นออนไลน์ได้ หมายความว่าคุณยังคงต้องติดอยู่กับการปลดล็อกตัวละครด้วยวิธีที่น่าเบื่อตามที่เกมกำหนดไว้", "ถึงอย่างนั้น โหมดนี้ก็ถือเป็นทางรอดที่ทำให้ผมได้เล่นเป็น Rodan และไล่ทุบ Destroyah กับเพื่อนๆ ได้เสียที มันเป็นวิธีแก้ปัญหาที่แปลกและไม่มีการบอกกล่าวให้ชัดเจนจนกระทั่งผมต้องติดต่อไปยังผู้พัฒนาเพื่อสอบถามว่าเกมมีสูตรโกงหรือไม่ (ซึ่งสูตรของเกมต้นฉบับใช้ไม่ได้) การ Grind ในเกมนี้ให้ความรู้สึกเหมือนเกม Live-service สมัยใหม่ และแม้ผมจะขอบคุณที่ไม่มีระบบ Microtransactions แต่การนำระบบเหล่านี้มาใส่กลับขัดแย้งกับตัวเกมที่ควรจะเน้นความสนุกแบบไร้สาระและบริสุทธิ์", "Destroy All Monsters คือความสนุกที่แท้จริง ไม่ว่าคุณจะเล่นกับเพื่อนต่อหน้าหรือออนไลน์ คุณจะได้พบกับเสียงหัวเราะมากมายจากภาพการต่อสู้ของเหล่าไคจูที่บินว่อนไปทั่วท้องฟ้า ดังนั้นแม้จะต้องฝ่าฟันการ Grind ในโหมดเล่นคนเดียว แต่ความสุขในการเล่นก็ไม่ได้จางหายไป Godzilla: Destroy All Monsters Melee Remastered จะดีที่สุดเมื่อมันจำลองความรู้สึกของการเอาของเล่นไคจูมาฟาดกันในวัยเด็กกับเพื่อนๆ และจะแย่ที่สุดเมื่อมันพยายามยืดเวลาเกมที่ไม่ได้มีความลึกซึ้งอะไรมากมายตั้งแต่แรก", "ผลลัพธ์ที่ได้คือเกม Remaster ที่ผมดีใจที่มันมีอยู่จริงเมื่อพิจารณาจากความขาดแคลนของเกมแนวต่อสู้ไคจู แต่ก็มาพร้อมกับข้อควรระวังหลายประการ ไม่นับรวมความรู้สึกขัดใจที่เกมต้นฉบับบน GameCube และ Xbox ไม่เคยมีการบังคับ Grind แบบไร้เหตุผลเช่นนี้ ได้โปรดเถอะ แค่ปล่อยให้ผมได้เอาของเล่นมาฟาดกันก็พอแล้ว"], "link": "https://www.gamespot.com/reviews/godzilla-destroy-all-monsters-melee-remastered-is-a-faithful-if-flawed-remaster/", "canonical_link": "https://www.gamespot.com/reviews/godzilla-destroy-all-monsters-melee-remastered-is-a-faithful-if-flawed- ตกต่างจากเดิม", "โครงสร้างที่นำเสนอจุดจบก่อนแล้วย้อนกลับไปในอดีตถือว่ากล้าหาญ สิ่งที่ผู้เล่นจะได้สัมผัสไม่ใช่แค่ตำนานของวีรบุรุษทั้งสี่ แต่เป็นเรื่องราวที่สร้างขึ้นใหม่ว่าทำไมพวกเขาถึงถูกเรียกว่าวีรบุรุษ และผ่านโศกนาฏกรรมหรือการตัดสินใจแบบใดจนถูกดึงเข้าสู่สงครามใหญ่ในภายหลัง", "ผู้เล่นสามารถเลือกเริ่มเรื่องราวของตัวเอกคนใดก็ได้ก่อน ผู้เขียนเลือก Dietrich (ฉายาคนแปลกหน้าแห่ง Dagza) เป็นคนแรก แต่หลังจากปลดล็อกการเคลื่อนไหวอิสระแล้ว ก็สามารถสลับไปเล่นเนื้อเรื่องของตัวเอกคนอื่นได้", "อย่างไรก็ตาม การเล่นเนื้อเรื่องตัวเอกหลายคนขนานกันมีข้อเสีย คือทุกครั้งที่เริ่มตัวเอกใหม่ ผู้เล่นต้องทำกิจกรรมช่วงต้นที่คล้ายคลึงกันซ้ำๆ ซึ่งอาจรู้สึกน่าเบื่อเล็กน้อย แม้ว่ากิจกรรมในแผนที่โลกของตัวเอกแต่ละคนจะแตกต่างกันจนไม่ถึงกับซ้ำซากโดยสิ้นเชิงก็ตาม", "การมองทวีปผ่านชีวิต วัฒนธรรม และวิธีการต่อสู้ของตัวเอกทั้งสี่คน ช่วยให้เข้าใจการตั้งค่าโลกอันมหาศาลของเกมนี้ได้อย่างมีประสิทธิภาพ", "ในส่วนแรก วีรบุรุษทั้งสี่มุ่งหน้าสู่เทศกาลสำคัญที่เรียกว่า 'เทศกาลประลองดาบใหญ่' ผู้เล่นต้องเพิ่มชื่อเสียง สเกาท์เพื่อนร่วมทีม และพัฒนายูนิตภายในกำหนดเวลา โดยในหนึ่งวันสามารถทำกิจกรรมได้พื้นฐาน 4 เทิร์น การเคลื่อนที่และสำรวจแผนที่โลกจะทำให้เวลาเดินไป ในขณะที่กิจกรรมในฐานทัพ 'Dagsion' จะไม่ทำให้เวลาผ่านไป ซึ่งเป็นการนำกลยุทธ์ระดับมหภาคมาใช้ในการตัดสินใจว่าควรไปที่ไหนและทำอะไรภายในเวลาที่จำกัด", "เป้าหมายนั้นชัดเจนคือการพัฒนาตัวละครและสเกาท์เพื่อนร่วมทีม แต่ทรัพยากรที่ต้องใช้มีมากเกินไป กิจกรรมใน Dagsion ต้องใช้ค่าความมุ่งมั่น การสเกาท์ต้องใช้ค่าความสัมพันธ์และชื่อเสียง การเพิ่มค่าความสัมพันธ์ต้องใช้เงินซื้อของขวัญหรืออาหาร แต่ในช่วงต้นเกมทั้งชื่อเสียงและเงินหาได้ยาก ทำให้เกิดวงจรที่ต้องทำกิจกรรมอื่นเพื่อหาทรัพยากร ซึ่งก็ต้องใช้เวลาและทรัพยากรเพิ่มขึ้นไปอีก", "ในช่วงแรก การตัดสินใจว่ากิจกรรมใดเหมาะสมที่สุดนั้นเข้าใจยากมาก ด้วยตัวเลขที่ต้องจัดการจำนวนมาก ผู้เล่นอาจรู้สึกท่วมท้นทันทีที่ปลดล็อกการเคลื่อนไหวอิสระ", "ผู้เขียนเลิกพยายามหาคำตอบที่สมบูรณ์แบบสำหรับเควสต์หลักตั้งแต่เนิ่นๆ ในความเป็นจริง หากสำรวจและสู้รบในแผนที่โลกบ้าง ก็สามารถพัฒนาตัวละครให้เพียงพอต่อการผ่านเควสต์หลักได้ แต่หากมองไปถึงบทสงครามและบทกอบกู้ การสเกาท์เพื่อนร่วมทีมให้มากที่สุดและใช้ทรัพยากรอย่างคุ้มค่าถือเป็นกุญแจสำคัญ การพัฒนากองทัพในระยะยาวคือหัวใจหลักของการเคลียร์เกมนี้", "ใน Dagsion มีตัวละครที่สเกาท์ได้มากมาย การสร้างความสัมพันธ์และทำตามเงื่อนไขเพื่อดึงพวกเขาเข้าพวกถือเป็นความสนุกที่สุดอย่างหนึ่งของเกม", "ระบบความสัมพันธ์ในเกมนี้ไม่ได้เริ่มหลังจากเข้าพวก แต่มีค่าความสัมพันธ์ตั้งแต่ยังเป็นตัวละครที่สเกาท์ได้ ผู้เล่นต้องเพิ่มระดับชื่อเสียง ให้ของขวัญ กินข้าว ชมละคร หรือแช่น้ำพุร้อนเพื่อกระชับความสัมพันธ์ แต่ทั้งหมดนี้ต้องใช้เงินและเวลา ซึ่งเงินมักจะขาดแคลนเสมอเพราะต้องใช้ทั้งซื้ออุปกรณ์และเพิ่มค่าความสัมพันธ์", "ระบบบทสนทนาสนับสนุนมีแนวคิดใหม่ที่น่าสนใจ คือการปลดล็อกบทสนทนาใหม่ผ่านการดูบทสนทนาของตัวละครอื่น ทำให้บทสนทนาไม่ได้เป็นเรื่องสั้นแยกส่วน แต่เชื่อมโยงกันข้ามตัวละคร สร้างความลึกซึ้งให้กับชุมชนในเกม", "ในทางกลับกัน เมื่อถึงบทกอบกู้ จำนวนเพื่อนร่วมทีมอาจสูงถึง 30 คน การจะเพิ่มค่าความสัมพันธ์ให้ครบทุกคนเป็นเรื่องที่ต้องใช้ความพยายามอย่างมหาศาล แม้การจัดยูนิตให้อยู่ติดกันในการต่อสู้จะช่วยเพิ่มค่าความสัมพันธ์ได้ แต่ยูนิตที่เหลือในฐานทัพต้องอาศัยกิจกรรมในฐานทัพเพื่อกระชับความสัมพันธ์เท่านั้น", "บทสนทนาสนับสนุนจำนวนมหาศาลคือเสน่ห์ของเกม แต่การจัดการเพื่อเก็บให้ครบก็เป็นภาระที่มหาศาลเช่นกัน", "เมื่อส่วนแรกดำเนินไป กิจกรรมใหม่ๆ ใน Dagsion จะถูกปลดล็อกเรื่อยๆ เช่น การฝึกฝน, การรับใช้ในวิหาร, การกินอาหาร, การให้ของขวัญ, บ่อน้ำพุร้อน, การชมละคร, การแสดงละคร, การดูและฝึกฝนในลานประลอง และการให้อาหารนก ซึ่งมีหลากหลายมาก การบริหารจัดการกิจกรรมเหล่านี้ให้ทันก่อนถึงวันที่เควสต์หลักจะเกิดขึ้นคือส่วนสำคัญของส่วนแรก", "แต่ละกิจกรรมมีข้อดี เช่น การเพิ่มค่าความสัมพันธ์หรือค่าสถานะ แม้เกมย่อยในโรงละครจะเรียบง่าย แต่รายละเอียดเล็กๆ น้อยๆ เช่น เนื้อหาละครที่สะท้อนประวัติศาสตร์และวัฒนธรรมของโลกในเกมก็น่าประทับใจ", "ปัญหาคือ กิจกรรมเหล่านี้ส่วนใหญ่ทำได้สัปดาห์ละครั้ง แต่การทำใน Dagsion ไม่ทำให้เวลาผ่านไป ดังนั้นทางเลือกที่เหมาะสมที่สุดในเชิงเกมคือการทำทุกกิจกรรมที่มีให้ครบในสัปดาห์นั้นๆ การฝึกฝน, รับใช้, แช่น้ำพุร้อน, ให้ของขวัญ, กินข้าว, ชมละคร และให้อาหารนก ทำซ้ำไปเรื่อยๆ จนถึงวันเควสต์หลัก", "แทบไม่มีการตัดสินใจเชิงกลยุทธ์ว่า 'จะเน้นอะไรและยอมทิ้งอะไร' เพราะเวลาไม่เดิน การทำกิจกรรมจึงเป็นเพียงการไล่เช็คลิสต์จากบนลงล่าง นี่คือสาเหตุหลักของความรู้สึกเหมือนการทำงาน (作業感) ในเกมนี้ แม้จะมีฟังก์ชันข้ามวันไปจนถึงวันเควสต์หลัก แต่เพื่อเพิ่มค่าความสัมพันธ์และเลเวล ผู้เล่นก็ยังต้องทำกิจกรรมเหล่านี้อยู่ดี", "ในส่วนแรกยังมีเควสต์เสริมและเควสต์ภายนอก (Gaiden) ที่ต้องรับและทำภายในกำหนดเวลา การดำเนินเนื้อเรื่องจะปลดล็อกเควสต์ภายนอกจากตัวเอกคนอื่น ซึ่งสามารถท้าทายแผนที่ที่มีกลไกพิเศษได้", "แผนที่เควสต์ภายนอกบางแห่งมีความยากสูง แต่ก็เป็นที่ที่ปลดล็อกยูนิตที่สเกาท์ได้ จึงเป็นส่วนสำคัญในการจัดกองทัพ แม้จะเรียกว่าเควสต์ภายนอก แต่บางแผนที่อย่าง 'Anatolia Gaiden' ก็มีกลไกที่สมบูรณ์แบบอย่างโดดเด่น", "ในทางกลับกัน ต่างจากเควสต์หลักที่ดำเนินไปโดยอัตโนมัติ เควสต์เสริมเหล่านี้หากเลยกำหนดเวลาไปแล้วจะพลาดไปเลย ขึ้นอยู่กับจังหวะการบันทึกอัตโนมัติ การจะย้อนกลับมาทำใหม่อาจเป็นเรื่องยาก", "ฟังก์ชันปฏิทินมี 'ตัวเตือน' (Reminder) ที่มีประโยชน์ แต่บทสอนเล่นไม่ได้อธิบายไว้อย่างชัดเจน ทำให้ผู้เขียนไม่รู้ว่ามีอยู่พักหนึ่ง แม้จะช่วยลดการพลาดเควสต์ได้ แต่ในเกมที่มีเนื้อหาจำกัดเวลาเยอะเช่นนี้ ควรมีการแนะนำที่ชัดเจนกว่านี้", "บอร์ดประกาศสำหรับรับเควสต์เสริมก็ไม่ได้ทำหน้าที่จัดระเบียบข้อมูลได้ดีพอ บางครั้งต้องตรวจสอบจุดต่างๆ บนแผนที่โลกทีละจุดเพื่อหาว่าวัตถุดิบที่ต้องการหาได้จากที่ไหน", "ปัญหาไม่ใช่ความซับซ้อนของเกม แต่คือการออกแบบข้อมูลที่รองรับความซับซ้อนนั้นไม่เพียงพอ", "ในเกมนี้ นอกจากจะมีการต่อสู้บนแผนที่แบบดั้งเดิมแล้ว ยังสามารถสำรวจดันเจี้ยนบนแผนที่โลกได้ ภายในดันเจี้ยนจะมีศัตรูวางอยู่ หากสัมผัสจะเข้าสู่ 'Quick Battle' เหมือน RPG ทั่วไป และสามารถหาไอเทมจากหีบสมบัติได้", "Quick Battle อาจเป็นองค์ประกอบใหม่เพื่อขยายความเป็น RPG แต่ผู้เขียนไม่พบความหมายสำคัญของมัน การวางตำแหน่งหรือการล่อศัตรูซึ่งเป็นยุทธวิธีดั้งเดิมของ FE นั้นขาดหายไป ทำให้เมื่อทำซ้ำๆ ความรู้สึกเหมือนการทำงานจึงรุนแรงขึ้น", "หากเลเวลของเราสูงกว่าศัตรู ก็สามารถโจมตีจากสนามเพื่อกำจัดได้ทันที แม้จะสะดวก แต่กลับทำให้เกิดคำถามว่า 'การต่อสู้นี้จำเป็นจริงๆ หรือ?'", "หากมองในแง่ประสิทธิภาพการเก็บเลเวล การสำรวจดันเจี้ยนมีประโยชน์ เพราะ Quick Battle สามารถข้ามไ ดชูสงครามและตอกย้ำเส้นแบ่งระหว่าง 'พวกเขา' กับ 'เรา'", "แต่ Modern Warfare 4 พยายามหลีกเลี่ยงสิ่งเหล่านั้น แม้จะเป็นเพียงก้าวเล็กๆ แต่เกมปีนี้มีความเป็นมนุษยธรรมมากขึ้น โดยล้อไปกับภารกิจ 'No Russian' ในปี 2009 มีภารกิจไม่กี่อย่างที่ให้คุณสวมบทบาทเป็น 'ศัตรู' และบังคับให้คุณตัดสินใจเชิงศีลธรรม ซึ่งผมต้องยอมรับว่ารู้สึกตกใจที่ได้เห็นสิ่งนี้ในเกม CoD ในปี 2019 ทีมพัฒนา Infinity Ward ตั้งคำถามว่าจะเป็นอย่างไรหากเกิดการโจมตีของผู้ก่อการร้ายบนถนนในลอนดอน ในปี 2022 สตูดิโอตั้งคำถามถึงเหตุการณ์เมื่อปฏิบัติการทางทหารระหว่างประเทศผิดพลาดบนแท่นขุดเจาะน้ำมันในเม็กซิโก และในปี 2023 เราได้ไปที่ Lower Manhattan ขณะที่กองทัพรัสเซียบุกโจมตีตลาดหลักทรัพย์นิวยอร์ก ดังนั้นเมื่อเปลี่ยนมุมมองให้เราเล่นเป็นทหารกองกำลังเกาหลีเหนือ ผมประหลาดใจจริงๆ ที่ได้รู้ว่าหากคุณปฏิเสธคำสั่ง คุณจะถูกยิงทิ้งทันที และปล่อยให้ภารกิจดำเนินต่อไปต่อหน้าศพของคุณ โดยไม่มีสถานะ 'Game Over' สำหรับการไม่ปฏิบัติตามคำสั่ง ความโหดร้ายของระบอบเผด็จการยังคงดำเนินต่อไปแม้คุณจะละทิ้งหน้าที่ นี่อาจเป็นการสื่อสารที่เรียบง่ายในเชิงวรรณกรรม แต่ผมคิดว่า Call of Duty กำลังพยายามสื่อสารบางอย่าง", "และมันก็ได้รับความสนใจจริงๆ เพียงสัปดาห์นี้ นักการเมืองเกาหลีใต้คนหนึ่งได้เรียกร้องให้ประธานาธิบดีของประเทศเล่น Modern Warfare 4 เนื่องจากภาพการจำลองการโจมตีเกาหลีเหนือต่อประเทศนั้นมีความโดดเด่นมาก (ซึ่งทำให้การที่ผู้พัฒนาใส่ฟุตเทจภัยพิบัติจริงเข้าไปกลายเป็นความผิดพลาดที่น่าเสียดาย) แม้ว่าจะเป็นเรื่องสำคัญที่ต้องจำไว้ว่าประชากรของประเทศไม่ใช่ผู้นำของประเทศ แต่ข่าวคราวเกี่ยวกับภัยคุกคามจากเกาหลีเหนือก็มีมานานหลายปีแล้ว และใน Modern Warfare 4 ทีม Infinity Ward ต้องการบอกเล่าเรื่องราวที่ 'ถอดมาจากพาดหัวข่าว' ผลลัพธ์ที่ได้คือรูปแบบที่ 'ตอบสนอง' มากขึ้น โดยที่ประเทศที่ติดอาวุธตอบโต้การรุกรานแทนที่จะเป็นผู้เริ่ม ซึ่งให้ความรู้สึกเร่งด่วนและการคาดเดาที่น่าสนใจกว่าการสู้รบในตะวันออกกลาง หรือการแทรกซึมในรัฐตัวแทนที่รัสเซียควบคุมอยู่เบื้องหลัง", "เมื่อเราสลับไปมาระหว่าง John Price อดีตหน่วย SAS สุดแกร่ง (ที่เราติดตามมาตั้งแต่ปี 2007) กับกลุ่มทหารเกณฑ์เกาหลีใต้และพันธมิตรนาวิกโยธินสหรัฐฯ ที่พบว่าตัวเองอยู่ท่ามกลางการรุกรานของเกาหลีเหนือที่โหดร้ายและมีการสูญเสียสูง เราจะได้เห็นการออกแบบแคมเปญของ Call of Duty ในระดับที่ดีที่สุด มีฉากยิงปืนในคลับที่ได้รับแรงบันดาลใจจาก John Wick ซึ่งพัฒนาไปสู่การวิ่งปาร์กูร์ข้ามหลังคาในแมนฮัตตัน มีฉากยิงปืนในลานรถไฟที่น่าประทับใจและชวนให้นึกถึงการออกแบบเกมตู้คลาสสิก มีพื้นที่โลกเปิดกว้างที่เน้นการลอบเร้นและการซุ่มยิง มีการไล่ล่าด้วยรถยนต์ผ่านถนนในปารีส และมีการจู่โจมชายหาดที่เชื่อมโยงทุกอย่างเข้าด้วยกันได้อย่างลงตัว", "นอกจากนั้น ภารกิจที่โดดเด่นที่สุดคือ 'Stranded' ซึ่งทีมเกาหลีใต้อยู่ลึกเข้าไปในดินแดนศัตรูและต้องต่อสู้เพื่อเอาชีวิตรอด ภารกิจนี้แนะนำระบบคราฟต์ไอเทม ซึ่งอาจดูเหมือนสิ่งที่ใส่เข้ามาให้ครบๆ แต่จริงๆ แล้ว Infinity Ward ใช้มันเป็นเครื่องมือสำคัญในการเปิดเผยว่าเครื่องมือแต่ละอย่างที่คุณมีนั้นสำคัญเพียงใด คุณต้องการกล้องเล็งความร้อนหรือไม่? ถ้าใช่ คุณต้องให้ความสำคัญกับมันมากกว่ากระสุน คุณต้องการระเบิดหรือไม่? อาวุธพื้นฐานของคุณก็จะด้อยลง มันช่วยเน้นย้ำว่าทุกแง่มุมของเครื่องมือใน Modern Warfare เสริมซึ่งกันและกันอย่างไร ส่งผลให้เกิดความลึกซึ้งและซับซ้อนที่ทำให้เกม Call of Duty ภาคเก่าๆ ดูธรรมดาไปเลย", "สิ่งนี้ได้รับการเติมเต็มด้วยฉากอย่าง 'Traffic' ที่คุณต้องไล่ล่าด้วยความเร็วสูงผ่านถนนในปารีส ซึ่งแน่นอนว่าสร้างความเสียหายมหาศาล ที่นี่คุณจะได้เห็นความกว้างขวางและความลึกของ AI ศัตรูที่ Infinity Ward สร้างขึ้น ซึ่งไม่ต้องสงสัยเลยว่าทำควบคู่ไปกับโหมด DMZ ใหม่ เราได้เห็นว่าเอนจิ้นของสตูดิโอนี้ซับซ้อนเพียงใด ทั้งการทำลายล้าง กลไกการเข้าที่กำบัง และเอฟเฟกต์ภาพมากมายที่ถาโถมเข้ามาบนหน้าจอพร้อมกัน มันท่วมท้น น่าเกรงขาม และเร้าใจ นี่คือจุดสูงสุดของ Call of Duty", "ระหว่างภารกิจที่โดดเด่นเหล่านี้ มีช่วงเวลาที่คุณถูกขอให้พิจารณาว่ามันเป็นอย่างไรสำหรับเบี้ยบนกระดาน ทหารคนอื่นๆ ผู้ที่ไม่มีชื่อเสียง ผู้ที่ถูกชักใยโดยกองกำลังที่พวกเขาไม่เข้าใจ มันอาจจะดูเรียบง่ายไปบ้างเหมือนเข็มกลัด 'สงครามเป็นเรื่องเลวร้าย' ที่ติดอยู่บนแจ็คเก็ตจากร้านขายของทหาร แต่ก็นะ ผมชอบแบบนี้มากกว่าเรื่องราว 'ooh-rah!' ที่กองทัพสหรัฐฯ เข้ามาช่วยเหลืออีกครั้ง", "ข้อเสียของแคมเปญมาจากรูปแบบและการดำเนินเรื่องมากกว่าเนื้อหา เรื่องราวของ Price จบลงโดยไม่มีเสียงปรบมือ ผมจะไม่เปิดเผยรายละเอียดที่นี่ แต่การกระทำของเขาและสิ่งที่เขาทำเพื่อหยุดยั้งแผนการของ Mads Mikkelsen ที่ถูกนำเสนออย่างแปลกประหลาดนั้นถูกทิ้งไว้ในความมืด ในขณะที่การต่อต้านอย่างสิ้นหวังของทหารเกณฑ์เกาหลีใต้ได้รับความสนใจ ผมคิดว่า Call of Duty อาจพยายามสื่อสารว่า การกระทำที่คลุมเครือทางศีลธรรมและสร้างความเสียหายข้างเคียงของเจ้าหน้าที่ที่สิ้นหวังคนหนึ่งที่ช่วยโลกไว้ได้นั้น ไม่ได้รับแสงสว่าง แต่การป้องกันที่ 'กล้าหาญ' ของทหารชั้นผู้น้อยในแนวหน้าควรได้รับการยกย่อง สงครามเป็นเรื่องยุ่งเหยิง ไม่มีใครถูก ทุกคนแพ้ ยกเว้นบริษัทข้ามชาติที่ส่งอาวุธไปอยู่ในมือมนุษย์ นั่นคือสิ่งที่ผมควรคิดหลังจากเล่นจบใช่ไหม?", "ไม่ว่าผลกระทบทางอารมณ์จะเป็นอย่างไร คุณไม่สามารถโต้แย้งผลกระทบทางกายภาพได้ นี่คือแคมเปญ 8 ชั่วโมงที่กระชับและมีช่วงเวลาที่เทียบเท่ากับสิ่งที่ดีที่สุดของ Modern Warfare มันจบลงก่อนที่จะยืดเยื้อ มีไอเดียใหม่ๆ มากมาย และหากเล่นในโหมดที่ยากที่สุด มันคือปริศนาที่ออกแบบมาอย่างดีซึ่งหมกมุ่นอยู่กับรายละเอียดพอๆ กับฉากอลังการสไตล์ Michael Bay มันห่างไกลจากสิ่งที่เกิดขึ้นใน Black Ops 7 ปีที่แล้วมาก", "หลังจากรู้สึกเกือบจะอินกับแคมเปญ Call of Duty ผมก็ต้องเปิดโหมด Multiplayer ซึ่งได้รับการขัดเกลาจนเกือบสมบูรณ์แบบ เป็นสนามรบที่รวดเร็วและดุเดือดของการเล็งเร็ว การสไลด์ และทางเดินสังหาร การออกแบบแผนที่นั้นยอดเยี่ยมตามสไตล์ Infinity Ward และการยิงปืนก็ดีเหมือนที่เคยเป็นในเกม Modern Warfare ตั้งแต่ปี 2019 ที่ Infinity Ward ลงทุนมหาศาลในการสร้างเอนจิ้นใหม่ ประสบการณ์ Call of Duty ก็หรูหราขึ้น การออกแบบเสียงเพียงอย่างเดียวก็ควรค่าแก่การปรบมือ ทุกเสียงของกลไกปืน ทุกปลอกกระสุนที่ตกลงพื้น ทุกเสียงของเทอร์ไมต์ที่เจาะผ่านที่กำบัง... มันระบุได้ทันทีและสำคัญมาก การเล่น Modern Warfare 4 โดยไม่มีหูฟังดีๆ หรือระบบเสียงรอบทิศทางถือเป็นการเสียเปรียบอย่างตั้งใจ", "มีข้อกังวลเล็กน้อยตามปกติ กลไกการเกิดใหม่บางอย่างน่ารำคาญ (โดยเฉพาะในแผนที่ที่รวดเร็วและโหดร้าย เช่น Shipment ที่เพิ่มเข้ามาสัปดาห์นี้เป็นตัวอย่างที่แย่มาก) และการปรับสมดุลอาวุธบางอย่างยังไม่นิ่งพอ ส่วนหนึ่งมาจากการเปลี่ยนแปลงความเสียหายของอาวุธในนาทีสุดท้ายที่ขยายเวลาการสังหาร (Time-to-kill) ให้ยาวนานกว่าปกติของ Infinity Ward แม้ว่าจะมีความโกลาหลสำหรับผู้เล่นยุคแรกอย่างผม แต่มันแสดงให้เห็นถึงระดับความละเอียดที่ Infinity Ward ต้องจัดการ ผมอยากเห็นเบื้องหลังของ Modern Warfare 4 ว่าสตูดิโอปรับแต่งปืนอย่างไรเพื่อให้ทันกับสิ่งที่ผู้เล่นทำ เวลาในการสังหารที่ต่ำลงเล็กน้อยเป็นการทดลองที่น่าสนใจในการค้นหาว่า Modern Warfare คืออะไรนอกเหนือจากการเลือกปืน และผมยินดีที่จะยอมรับการปรับสมดุลที่แปลกประหลาดเพื่อแลกกับระบบความเสียหายที่ลึกซึ้งและซับซ้อนกว่า", "ระบบการปรับแต่งก็ทำงานได้ดีที่นี่ ด้วยอุปกรณ์เสริมที่เหมาะสม ปืนบางกระบอกจะถูกยกระดับจาก 'มีประโยชน์' เป็น 'จำเป็น' SMG รุ่น ISO Nightshade ดูเหมือนจะโกงไปหน่อยในตอนนี้ และผมโดน LMG รุ่น Type 73 จัดการบ่อยครั้ง ผมเป็นนักแม่นปืนโดยกำเนิด และ Oris 8.6 เป็นปืนโปรดตัวแรกสำหรับการยิงหัวข้ามแผนที่ โดยเฉพาะเมื่อใส่กล้อง 2.1x พร้อมระบบตรวจจับความร้อน เศรษฐกิจโดยรวมของปืนและระยะเทียบกับพลังดูเหมือนจะยังไม่สมดุลนัก ซึ่งกำลังได้รับการแก้ไขในขณะที่ผมพิมพ์อยู่นี้ แต่ผมกำลังเล่น Multiplayer ในสัปดาห์เปิดตัว ดังนั้นย่อมมีความขัดแย้งเกิดขึ้นเสมอ", "จากนั้นก็มี Kill Block แนวคิดแผนที่และโหมด Multiplayer แบบไดนามิกที่หมุนเวียนไปเรื่อยๆ มันดูไร้สาระในตอนแรก แต่ด้วยการใช้ 'แผ่น' ต่างๆ มันสามารถสร้างแผนที่ได้มากกว่า 500 รูปแบบ ทำให้ไม่มีแมตช์ไหนที่เล่นเหมือนเดิม แผนที่ใน Call of Duty มักถูกกำหนดโดยแนวสายตา ถ้าคุณยืนตรงนี้ คุณสามารถยิงใครบางคนตรงนั้นได้ ถ้าคุณดักมุมนี้ คุณจะได้คิล ถ้าคุณซุ่มยิงในเลนนี้ คุณจะได้จัดการมือใหม่มากมาย Kill Block พลิกทุกอย่างกลับหัวกลับหาง บังคับให้ผู้เล่นต้องตอบสนองมากขึ้น และมีส่วนร่วมกับระบบใน Modern Warfare 4 มากกว่าพึ่งพาสัญชาตญาณที่สั่งสมมานานกว่าสองทศวรรษ ด้วยสัญญาว่าจะมีองค์ประกอบแบบโมดูลาร์เพิ่มเติมในอนาคต เช่น แผนที่ยอดนิยมอย่าง Crash ผมมองว่าโหมดนี้จะกลายเป็นอีกหนึ่งเสาหลักในจักรวาล Call of Duty ที่ขยายตัวไม่หยุด นี่คือวิธีสร้างชีวิตชีวาให้กับโหมดการแข่งขันที่มักจะล้มเหลวเมื่อเทียบกับโหมด Team Deathmatch", "ผมต้องยกย่องความซับซ้อนและความมหัศจรรย์ที่ Infinity Ward แสดงให้เห็นในการจัดการปืน อุปกรณ์เสริมแต่ละชิ้นมีความหมาย ปืนส่วนใหญ่ให้ความรู้สึกที่เป็นเอกลักษณ์ และผลตอบรับที่คุณได้รับจากการยิงอาวุธใดๆ นั้นยอดเยี่ยมมาก มันมีมูลค่าการผลิตทั้งหมดของเกมจำลองการทหาร แต่ในการใช้งานจริง มันอ่านง่ายและเรียบง่ายเหมือนเกมอาร์เคด ไม่มีใครทำได้เหมือน Infinity Ward และแม้ว่านี่จะให้ความรู้สึกเหมือนเป็นการทำซ้ำจากเกม Modern Warfare สามภาคที่ผ่านมา แต่ผมจะไม่ตำหนินักพัฒนาที่ยังคงอยู่ในแนวทางของตนและพัฒนาสูตรที่ได้ผล", "และนั่นนำเราไปสู่ DMZ ในตอนแรกผมรู้สึกสงสัย 'นี่คือ Call of Duty ที่วิ่งตามกระแส' ผมคิด 'นี่คือการตามเทรนด์ที่ผิดพลาด' แต่ Infinity Ward ไม่กลัวการเปลี่ยนแปลง และผมก็ไม่ควรเช่นกัน เทรนด์เกม Extraction Shooter ไม่มีทีท่าว่าจะแผ่วลง และด้วยการที่ Call of Duty สามารถทำให้มันทำงานได้ภายในระบบอาร์เคดผสมจำลองของเอนจิ้น ผมต้องยอมรับมัน ผมไม่คิดว่าจะเป็นการกล่าวเกินจริงที่จะบอกว่า DMZ สามารถเป็นเกมแยกต่างหากได้ ซึ่งอัดแน่นไปด้วยเนื้อหาที่สามารถท้าชนกับเกมอย่าง Marathon หรือ Arc Raiders ได้เลย", "เกมมีการตั้งค่าการเข้าถึงที่หลากหลาย ทั้งการควบคุมแบบง่าย ฟังก์ชันเซ็นเซอร์ตรวจจับการเคลื่อนไหว การปรับแต่ง Deadzone/Trigger เอฟเฟกต์การสั่น/ไกปืน การลดเสียงรบกวนในหู การโฟกัสเสียง (PS5 เท่านั้น) ตัวเลือกเสียงโมโน การปรับแต่ง HUD การปรับแต่ง Motion Blur/DoF ฟิลเตอร์สี ตัวเลือกการลดการเคลื่อนไหวของกล้อง ระบบช่วยเล็ง ความไวในการเล็ง ระบบช่วยเคลื่อนที่/วิ่ง และแถบเลื่อน FoV", "แผนที่เมือง Hajin ซึ่งถูกนำกลับมาใช้ใหม่อย่างชาญฉลาดจากแคมเปญนั้นกว้างขวางและเต็มไปด้วยรายละเอียด และงานที่คุณได้รับภายในขอบเขตของเมืองนั้นรวดเร็วและไม่ยุ่งยาก ซึ่งมากกว่าที่ผมจะพูดถึง Marathon ได้ คุณสามารถรับเงินที่คงอยู่แม้ว่าคุณจะตาย คุณสามารถเสียสละพลังชีวิตสูงสุดเพื่อ 'ฟื้นคืนชีพ' จากสถานะล้มลงแต่ยังไม่ตาย และคุณจะได้รับ XP จากการทำเกือบทุกอย่าง ผลลัพธ์ที่ได้คือประสบการณ์ Extraction Shooter ที่ให้ความรู้สึกสบายๆ และเข้าถึงง่ายสำหรับผู้เล่น FPS ทั่วไป นี่ไม่ใช่ 'เกมไลฟ์สไตล์' เหมือนเกม Extraction Shooter อื่นๆ แม้ว่ามันจะมีระบบลอบเร้นแบบกึ่งๆ อยู่ก็ตาม", "ในหลายๆ ด้าน DMZ เลียนแบบสิ่งที่ Activision ทำกับ Warzone คือการจัดการสูตรที่ซับซ้อนให้สมเหตุสมผลภายในระบบนิเวศของ Call of Duty มันเป็นการตีความที่ยอดเยี่ยมของสูตร PvPvE ที่ค่อยๆ พัฒนามาตลอดทศวรรษที่ผ่านมา และผมคิดว่านี่คือจุดที่ DMZ พบช่องว่างของตัวเอง Arc Raiders กลายเป็นเรื่องของ PvE มากขึ้น (จากประสบการณ์ของผม) และ Marathon กับ Tarkov เน้นหนักไปที่ PvP แต่ DMZ กลับเดินอยู่บนเส้นแบ่งระหว่างทั้งสอง และเมื่อเวลาผ่านไปและ Infinity Ward คอยตรวจสอบโหมดนี้และวิธีที่ผู้คนมีส่วนร่วมกับมัน ผมจินตนาการว่าช่องว่างของมันจะชัดเจนยิ่งขึ้นเมื่อเทียบกับเกมในประเภทเดียวกัน เราเริ่มเห็นการเปลี่ยนแปลงบางอย่างแทรกซึมเข้ามาในเกมแล้ว และมันยังเปิดตัวไม่ถึงสัปดาห์ด้วยซ้ำ ซึ่งเป็นสัญญาณที่ดีสำหรับอนาคต", "Modern Warfare 4 แสดงถึงกระแสที่สูงที่สุดของ Call of Duty ในรอบ 7 ปี Infinity Ward จำเป็นต้องสร้างสมดุลที่ผมไม่ขออิจฉา การใส่ความโหยหาอดีตลงในซีรีส์ที่เต็มไปด้วยธรรมเนียมและความคาดหวังจนแทบไม่มีที่ว่างสำหรับสิ่งใหม่ ควบคู่ไปกับนวัตกรรมและความน่าสนใจที่เพียงพอที่จะทำให้ผู้คนสนใจ นอกจากนั้น หลังจากหลายปีที่อ่อนแอ โดยเฉพาะ Black Ops 7 ที่สร้างความเสียหายต่อชื่อเสียงจนแม้แต่แฟนพันธุ์แท้ CoD ที่ภักดีที่สุดก็เริ่มมองเห็นความเสื่อมโทรมของซีรีส์ ดังนั้นแม้ว่าแคมเปญจะดิ้นรนภายใต้น้ำหนักของมรดกตกทอด และ Multiplayer จะยินดีที่จะหมุนไปบนล้อเดิมที่ Modern Warfare ใช้มาสี่ภาคแล้ว แต่ Infinity Ward ก็ทำสำเร็จ หลังจากห่างหายจากการคุมบังเหียนไปสี่ปี ในการกอบกู้ Call of Duty Modern Warfare 4 คือการแก้ไขเส้นทางที่จำเป็นอย่างยิ่งและถูกนำมาใช้อย่างชาญฉลาด"], "link": "https://www.eurogamer.net/call-of-duty-modern-warfare-4-review", "canonical_link": "https://www.eurogamer.net/call-of-duty-modern-warfare-4-review", "cover_image_url": "https://assetsio.gnwcdn.com/CoD-MW4_i33XbuE.jpg?width=1200&quality=85&format=jpg&auto=webp", "gallery_images": ["https://assetsio.gnwcdn.com/pxl_20220402_110941365.portrait_V04meYj.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://i.ytimg.com/vi/JJBvUbqQSuc/hqdefault.jpg", "https://assetsio.gnwcdn.com/paris_chase.webp?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/Call-of-Duty-Modern-Warfare-4-(1).jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/Call-of-Duty-Modern-Warfare-4-(2).jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/Call-of-Du ที่แน่นหนา การได้ใช้เวลาหลายชั่วโมงไปกับการขโมยรถ แฮ็กระบบ SAM และกำจัดเป้าหมาย ทำให้ผมกล้ายืนยันว่า DMZ โฉมใหม่ที่ใหญ่และประณีตกว่าเดิมนี้ คือดาวดวงใหม่ที่น่าหลงใหลในแนวเกมนี้", "หัวใจสำคัญของเกมแนว PvPvE คือการออกแบบภารกิจและเลเวลที่กระตุ้นให้ผู้เล่นอยากสำรวจ มอบรางวัลเมื่อผ่านความยากลำบาก และผลักดันให้เกิดปฏิสัมพันธ์กับผู้เล่นอื่นเพื่อรักษาของที่หามาได้ ในแง่นี้ พื้นที่ 'ฮาจิน' (Hajin) ในเกาหลีที่เป็นฉากหลังของเกมทำหน้าที่ได้ดีเยี่ยม มีทั้งหมู่บ้านทางตอนเหนือ ใจกลางเมืองที่อันตรายทางตะวันออก และเรือนจำที่โดดเดี่ยวทางตะวันตก ซึ่งถูกคั่นด้วยป่าเขาที่เต็มไปด้วยจุดยุทธศาสตร์และของรางวัลล้ำค่าที่รอให้ผู้เล่นไปเก็บ", "แม้ว่าเมื่อเทียบกับเกมแนวไซไฟที่มีกราฟิกตระการตา DMZ อาจดูเหมือนเมืองทั่วไปที่พบเห็นได้ในปัจจุบัน แต่ด้วยความกว้างใหญ่ของแผนที่ ทำให้การเล่นหนึ่งรอบ (Run) ประมาณ 30 นาที อาจใช้เวลาไปกับการสำรวจเพียงแค่ส่วนเล็กๆ ของแผนที่เท่านั้น นอกจากนี้ ในขณะที่โหมด Battle Royale อย่าง Warzone จะบีบให้ผู้เล่นมารวมตัวกันด้วยวงที่แคบลง แต่ DMZ กลับใช้ระบบ 'Dynamic Operation' เพื่อสร้างแรงจูงใจในการผจญภัยให้กับทีมแทน", "Dynamic Operation คือภารกิจที่เกิดขึ้นแบบสุ่มระหว่างการเดินทาง ตั้งแต่การเก็บพัสดุ การระเบิดเป้าหมาย ไปจนถึงการคุ้มกัน VIP ภารกิจเหล่านี้มักมีหลายขั้นตอนและต้องเผชิญกับศัตรู NPC ที่วางแนวป้องกันอย่างเป็นระบบ การทำภารกิจสำเร็จจะนำไปสู่การส่งเสบียง (Supply Drop) และเพิ่มมูลค่าของรางวัลตามจำนวนภารกิจที่ทำได้ รูปแบบนี้ให้ความรู้สึกที่สดใหม่และคาดเดาไม่ได้มากกว่ารายการภารกิจแบบเดิมๆ เพราะเราไม่มีทางรู้เลยว่าหลังออกตัวไปแล้วจะมีปฏิบัติการอะไรมารออยู่", "แม้จะมีเหตุการณ์ที่ออกแบบมาเพื่อดึงดูดผู้เล่นอื่นให้เข้ามามีส่วนร่วม แต่ผู้เล่นส่วนใหญ่กลับเลือกที่จะหลีกเลี่ยงการปะทะ ทำให้การต่อสู้กับผู้เล่นอื่นในพื้นที่เปิดค่อนข้างจำกัด อย่างไรก็ตาม การประมาทเพียงนิดเดียวอาจทำให้ความพยายามทั้งหมดพังทลายลงได้ด้วยฝีมือของผู้เล่นคนอื่น และอย่าเข้าใจผิดว่าความเงียบคือความสงบ เพราะผู้เล่นในเกมนี้พร้อมที่จะเปิดฉากยิงทันทีที่เห็นหน้ากัน แม้จะมีระบบ 'พินเพื่อประนีประนอม' (Reconciliation Pin) แต่ช่วงเวลาที่ตึงเครียดที่สุดมักเกิดขึ้นตอนรอเฮลิคอปเตอร์มารับ เมื่อผู้เล่นอื่นตัดสินใจว่า 'เฮลิคอปเตอร์ลำนี้ไม่มีที่ว่างสำหรับคนอื่นนอกจากพวกเรา'", "พื้นที่ฮาจินเต็มไปด้วยชีวิตชีวา มีทั้งกองลาดตระเวนของศัตรูที่ขับรถผ่านไปมา ทั้งรถจี๊ปเดี่ยวหรือขบวนรถขนาดใหญ่ บนฟ้ามีเฮลิคอปเตอร์และโดรนคอยตรวจตรา บางครั้ง NPC ฝ่ายตรงข้ามยังสู้กันเองอีกด้วย การได้ขึ้นรถไฟที่วิ่งตามตารางเวลาเพื่อเดินทางข้ามพื้นที่เป็นสิ่งที่ทำได้จริง ความตึงเครียดมีอยู่ทุกย่างก้าว เพราะศัตรูอาจซุ่มอยู่ทุกที่ รวมถึงหุ่นยนต์สุนัขระเบิดพลีชีพที่คอยดมกลิ่นผู้เล่นตามอาคารต่างๆ", "การต่อสู้กับ NPC จะเริ่มจากระดับง่าย แต่จะทวีความรุนแรงขึ้นเมื่อชื่อเสียงของทีมสูงขึ้น ศัตรูจะเริ่มสวมเกราะ ใช้รถที่แข็งแกร่งขึ้น และใช้อาวุธเกรดสูงขึ้น ทำให้การยิงปะทะมีความกดดันอย่างมาก ผู้เล่นที่เล่นคนเดียวมักจะพยายามเก็บของรางวัลไว้คนเดียว ซึ่งมักจะจบลงด้วยความล้มเหลว เพราะศัตรูมีอยู่ทุกหนทุกแห่งและพร้อมจะจู่โจมจากจุดที่คาดไม่ถึงเสมอ", "ในส่วนของ 'ลูเทแนนท์' (Lieutenant) ซึ่งเป็นบอสระดับสูง ถือเป็นความท้าทายที่ยากที่สุด บางตัวจะซุ่มโจมตีในป่า บางตัวสวมเกราะหนักพร้อมมินิกันเดินตรวจตราในเมือง หากไม่มีอุปกรณ์ระดับสูง การหลีกเลี่ยงการเผชิญหน้ากับพวกเขานับเป็นทางเลือกที่ปลอดภัยกว่า", "สิ่งที่ทำให้เกมแนวนี้มีเสน่ห์คืออิสระในการเล่น (Agency) ผู้เล่นสามารถเลือกได้ว่าจะบุกแบบดุดัน หรือจะค่อยๆ ย่องผ่านไปอย่างอดทน DMZ สร้าง Sandbox ที่รองรับทุกสไตล์การเล่นได้อย่างยอดเยี่ยม แม้แต่ผู้เล่นที่อายุมากขึ้นและมีการตอบสนองไม่ไวเท่าวัยรุ่น ก็ยังสามารถสนุกกับเกมนี้ได้ผ่านการวางแผนและการเตรียมตัวที่ดี", "ระบบการเล่นของ Call of Duty ยังคงเป็นระดับแนวหน้า ทั้งความสมจริงของอาวุธและความคล่องตัวที่ลงตัว การปรับปรุงระบบการปีนป่าย (Mantle) ที่สามารถยกเลิกได้กลางคันถือเป็นการปรับปรุงคุณภาพชีวิต (QoL) ที่ยอดเยี่ยม อย่างไรก็ตาม อาวุธปืนส่วนใหญ่ยังคงอยู่ในกรอบเดิมๆ (ลูกซอง, ไรเฟิลจู่โจม, สไนเปอร์) ซึ่งขาดเอกลักษณ์เฉพาะตัวไปบ้าง", "นอกจากนี้ยังมีภารกิจเนื้อเรื่อง (Story Missions) ที่เป็นเควสต์ต่อเนื่องคล้ายแคมเปญแต่ไม่มีฉากคัตซีน เช่น การเข็นรถเข็นผู้ป่วยที่มีนายพลบาดเจ็บหนีจากศัตรู แม้ภารกิจเหล่านี้จะมีจำนวนจำกัดและรางวัลไม่มากนัก แต่ก็เป็นบทเรียนที่ดีในการทำความเข้าใจจังหวะของเกมและสถานที่ต่างๆ ในแผนที่", "ระหว่างภารกิจ ผู้เล่นจะจัดการอุปกรณ์ที่ฐานทั g": "CALL OF DUTY"}, {"id": 1794801668383, "guid": "https://jp.ign.com/phantom-blade-zero/84479/phantom-blade-zero", "original_title": "『Phantom Blade Zero』レビュー 記憶に残るボス戦、魅力的な戦闘、そしてあふれんばかりの外連味を備えた、驚くほど滑らかなアクションゲーム", "thai_title": "รีวิว Phantom Blade Zero: เกมแอ็กชันสุดลื่นไหลที่มาพร้อมการต่อสู้กับบอสอันน่าจดจำและสไตล์ที่โดดเด่น", "tag": "Review", "bullet_points": ["Phantom Blade Zero นำเสนอระบบการต่อสู้ที่ลื่นไหลและออกแบบมาอย่างประณีต มอบความพึงพอใจสูงสุดในการเล่นตลอด 50 ชั่วโมง", "จุดเด่นอยู่ที่การออกแบบบอสที่สร้างสรรค์และหลากหลาย พร้อมระบบการสลับอาวุธที่ส่งผลต่อกลยุทธ์การเล่นอย่างมีนัยสำคัญ", "แม้จะมีปัญหาเรื่องเนื้อเรื่องที่ซับซ้อนเกินจำเป็นและบั๊กด้านสภาพแวดล้อม แต่ประสบการณ์การต่อสู้โดยรวมถือว่ายอดเยี่ยม", "ระบบการเล่นมีความสมดุลสูง ไม่ยากจนเกินไปและมีระบบเช็คพอยต์บอสที่ช่วยลดความหงุดหงิดจากการตายซ้ำซาก", "ได้รับคะแนนรีวิว 9/10 (Amazing) จาก IGN โดยยกย่องว่าเป็นหนึ่งในเกมแอ็กชันที่ดีที่สุดในรอบหลายปี"], "full_paragraphs": ["Phantom Blade Zero เป็นเกมที่ดูดีเกินจริงมาตลอดหลายปีที่ผ่านมา โดยเฉพาะเมื่อพิจารณาว่ามาจากสตูดิโอที่เคยทำเกมมือถือมาก่อน ดังนั้นการที่ผมสามารถพูดได้เต็มปากว่ามันเป็นเกมที่เล่นสนุกสมกับรูปลักษณ์ภายนอกหลังจากใช้เวลากว่า 50 ชั่วโมงไปกับการโชว์ลีลากังฟูนั้น ถือเป็นคำชมสูงสุดที่ผมจะมอบให้ได้ นี่คือเกมแอ็กชันที่ลื่นไหลอย่างน่าเหลือเชื่อและมอบความพึงพอใจได้ดีที่สุดเกมหนึ่งที่ผมเคยเล่นในช่วงไม่กี่ปีมานี้ ด้วยระบบการต่อสู้ที่ถูกปรับแต่งมาอย่างยอดเยี่ยม ในแต่ละฉากที่สวยงามนั้นเต็มไปด้วยความลับให้ค้นหาและเควสต์ให้ทำมากมาย ควบคู่ไปกับการต่อสู้ที่ออกแบบมาอย่างชาญฉลาด แม้จะมีจุดอ่อนเรื่องเนื้อเรื่องที่ซับซ้อนเข้าใจยากและปัญหาด้านประสิทธิภาพที่เกิดขึ้นเป็นครั้งคราว แต่ด้วยแอ็กชันที่น่าทึ่งและองค์ประกอบเกือบทุกอย่างที่ทำออกมาได้อย่างยอดเยี่ยม ทำให้แทบไม่มีช่วงเวลาไหนเลยที่ผมจะไม่รู้สึกตื่นเต้นไปกับการฟาดฟันเหล่าจอมยุทธ์ในโลกแห่งนี้", "ความรู้สึกในการเล่น Phantom Blade Zero เหมือนกับการกระโดดเข้าสู่โลกของภาพยนตร์กำลังภายในฟอร์มยักษ์ ผู้เล่นจะได้รับบทเป็นจอมยุทธ์ผู้ลึกลับที่มีเวลาเหลือเพียง 66 วันก่อนจะสิ้นใจ เพื่อออกเดินทางในโลก 'Shadow World' ที่เสื่อมโทรม โดยต้องเผชิญหน้ากับสัตว์ประหลาดและยอดฝีมือมากมาย อย่างไรก็ตาม เนื้อเรื่องไม่ใช่จุดแข็งของเกมนี้ เพราะมีการยัดเยียดรายละเอียดมากเกินไป ทั้งศัพท์เฉพาะทางที่เข้าใจยาก ตัวละครจำนวนมาก และไทม์ไลน์ที่ซับซ้อนเกินความจำเป็น ซึ่งส่วนใหญ่ไม่ได้ส่งผลต่อเนื้อเรื่องหลักเลย ในช่วง 2 ชั่วโมงแรก ผมรู้สึกเหนื่อยล้ากับการอธิบายสถานการณ์ที่สลับไปมาระหว่างอดีตและปัจจุบันจนแทบไม่ได้เริ่มสู้กับบอสตัวแรก แต่โชคดีที่ตัวเอกอย่าง 'Soul' มีบุคลิกที่นิ่งสงบ ทำให้ผมพอจะมองข้ามความยืดเยื้อของเนื้อเรื่องไปได้บ้าง", "ส่วนใหญ่ของเกมคือการสำรวจโลกและการต่อสู้ ซึ่งเป็นส่วนที่เกมให้ความสำคัญและทำออกมาได้ดีเยี่ยม การควบคุมการปัดป้อง (Parry) และการหลบหลีกนั้นให้ความรู้สึกที่เป็นธรรมชาติภายในเวลาไม่กี่นาที ระบบอาวุธ คอมโบ และความสามารถพิเศษถูกนำเสนออย่างเป็นลำดับขั้นตอน ไม่ซับซ้อนจนเกินไปแต่มีความลึกซึ้ง ผมค่อนข้างพิถีพิถันกับจังหวะการต่อสู้ แต่เกมนี้กลับทำให้ผมรู้สึกคุ้นเคยเหมือนได้พบเพื่อนเก่าและติดใจในทันที ซึ่งเป็นสิ่งที่ทำได้ยากมากในเกมแนวนี้", "สิ่งที่น่าประทับใจยิ่งกว่าคืออาวุธหลายสิบชนิดที่มีทักษะเฉพาะตัว ซึ่งเกมกระตุ้นให้เราเปลี่ยนสไตล์การเล่นอยู่เสมอ การสลับอาวุธระหว่างต่อสู้เป็นสิ่งจำเป็นเพราะช่วยฟื้นฟูเกจ 'Killing Intent' ซึ่งศัตรูและบอสส่วนใหญ่จะคอยลดเกจนี้ของเราอยู่ตลอด โชคดีที่เกมนี้อนุญาตให้รีเซ็ตแต้มอัปเกรดอาวุธได้ง่ายมาก ทำให้เราไม่ต้องยึดติดกับอาวุธเดียว และเกมมักจะมอบอาวุธที่เหมาะสมให้เราก่อนจะถึงพื้นที่ที่มีบอสแพ้ทางเสมอ เช่น การพบอาวุธธาตุน้ำก่อนจะถึงพื้นที่บอสธาตุไฟ ซึ่งถือว่าใส่ใจรายละเอียดได้ดีมาก", "นอกจากนี้ยังมีอุปกรณ์เสริมอย่างตะขอเกี่ยวและธนูที่ช่วยในการสำรวจและต่อสู้ รวมถึงเครื่องประดับที่มอบบัฟต่างๆ เช่น การเพิ่มพลังโจมตีเมื่อเลือดเต็ม และผังทักษะที่ช่วยให้เราปรับแต่งสไตล์การต่อสู้ได้อย่างละเอียด ผมใช้เวลาไปกับการลองผิดลองถูกกับอุปกรณ์ต่างๆ มากกว่าเกมอื่น เพราะแม้แต่ท่าปิดฉากศัตรูธรรมดาก็ยังทำออกมาได้สวยงามและคุ้มค่าที่จะลอง", "ในแผนที่ทั้ง 8 แห่ง ผู้เล่นจะมีเวลาเหลือเฟือในการทดลองอุปกรณ์ต่างๆ ทุกแผนที่เต็มไปด้วยศัตรู เควสต์รอง และความลับที่ซ่อนอยู่มากมาย ซึ่งหลายอย่างอาจถูกมองข้ามได้ง่ายๆ เช่น เควสต์ฝึกวิชาจาก Donnie Yen ที่ปรากฏตัวในฐานะชายสวมหน้ากากทองคำ ซึ่งเป็นหนึ่งใ
