ต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะลุช่องโดยตรง ไม่ได้แตกต่างจากสิ่งที่ คาร์ริค พยายามจะทำ และแม้ว่านั่นอาจทำให้แฟนบอล ยูไนเต็ด กังวล แต่ความคล้ายคลึงในหลักการจะส่งผลดีต่อตัวผู้เล่น", "\"ปรัชญาของผมคือการมอบสไตล์ที่อิสระภายใต้การจัดระเบียบที่ดี\" คือคำพูดของ โปเช็ตติโน ในปี 2014 แม้ปรัชญาจะคล้ายกัน แต่ส่วนหลังคือ 'การจัดระเบียบที่ชัดเจน' ซึ่งน่าจะเป็นสิ่งที่ คาร์ริค ยังไม่สามารถมอบให้ผู้เล่นได้อย่างมั่นคง", "สำหรับแฟนบอลทีมใหญ่ ฟุตบอลที่รวดเร็วและเน้นแนวตั้งมักได้รับการยอมรับเมื่อมันมาจากความตั้งใจที่จะเป็นฝ่ายรุกก่อน เช่น ยูไนเต็ด ยุค เฟอร์กูสัน หรือ ลิเวอร์พูล ยุค เจอร์เกน คล็อปป์ แต่ฟุตบอลลักษณะนี้มักถูกมองในแง่ลบหากมันมาจากการยอมสละการครองบอลและเน้นตั้งรับหน้าประตูตัวเองเป็นเวลานาน", "การจ้าง โปเช็ตติโน จะเป็นจุดเริ่มต้นในการเปลี่ยน ยูไนเต็ด ให้กลายเป็นทีมที่มีระเบียบวินัยสูง สามารถกดดันคู่แข่งได้อย่างเข้มข้นและเป็นระบบมากขึ้น"], "link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f043/live/468fa2e0-dddf-11f1-b465-b9821c2582d4.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4aad/live/3387a800-df42-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6ab2/live/cf053980-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/681d/live/dceb6bf0-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c36b/live/e04246d0-de17-11f1-93e1-3b657b665bcf.jpg"], "videos": [], "review_score": "", "published_ts": 1794571788, "published_at": "2026-11-13T12:09:48Z", "published_th": "13 พ.ย. 2026 • 19:09 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776979, "guid": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo", "original_title": "Fernandes rejects second Man Utd contract offer", "thai_title": "บรูโน่ แฟร์นันด์ส ปฏิเสธข้อเสนอสัญญาฉบับใหม่จาก แมนเชสเตอร์ ยูไนเต็ด เป็นครั้งที่สอง", "tag": "Football", "bullet_points": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สอง", "สัญญาปัจจุบันของดาวเตะวัย 32 ปีจะหมดลงหลังจบฤดูกาลนี้ แต่สโมสรมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028", "แมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการเจรจาสัญญาใหม่ แต่การเจรจายังคงไม่มีความคืบหน้า", "สโมสรหวังว่าการเข้ามาคุมทีมของ เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่ จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป", "ฟอร์มการเล่นของแฟร์นันด์สในฤดูกาลนี้ตกลงไปจากเดิมอย่างเห็นได้ชัด โดยทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด"], "full_paragraphs": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในวันที่ 22 พฤศจิกายนนี้", "ทางสโมสรหวังว่าการเข้ามาของโปเช็ตติโน่จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป ทั้งนี้ แฟร์นันด์สเคยเกือบจะได้ย้ายไปร่วมทีมท็อตแนม ฮ็อตสเปอร์ ของโปเช็ตติโน่ในปี 2019 แต่การย้ายทีมไม่เกิดขึ้น ก่อนที่เขาจะย้ายมาอยู่กับแมนเชสเตอร์ ยูไนเต็ด ในอีก 6 เดือนต่อมา โดยในฤดูกาลนี้ อดีตมิดฟิลด์สปอร์ติ้ง ลิสบอน รายนี้ทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด", "ในทางทฤษฎีแล้ว สถานการณ์ความขัดแย้งเรื่องสัญญาปัจจุบันระหว่างแมนเชสเตอร์ ยูไนเต็ด และบรูโน่ แฟร์นันด์ส ไม่ใช่เรื่องใหญ่โตนัก เพราะเป็นเรื่องปกติที่ข้อเสนอครั้งแรก ครั้งที่สอง หรือแม้แต่ครั้งต่อๆ ไปจะถูกปฏิเสธ ซึ่งเป็นส่วนหนึ่งของกระบวนการเจรจาต่อรอง", "แม้แมนเชสเตอร์ ยูไนเต็ด จะมีออปชั่นในการขยายสัญญาเพิ่มอีกหนึ่งปี แต่ก็มีเหตุผลที่ทั้งสองฝ่ายอาจจะยังไม่ต้องการผูกมัดกันเกินกว่านั้นในขณะนี้ ในฝั่งของแฟร์นันด์ส เขามีความปรารถนาอย่างแรงกล้าที่จะคว้าแชมป์รายการใหญ่ที่สุด และเขากำลังเห็นช่วงเวลาที่ดีที่สุดในอาชีพค้าแข้งค่อยๆ ผ่านไป โดยยูไนเต็ดล้มเหลวในการต่อยอดจากฤดูกาลที่ดูมีอนาคตอีกครั้ง และเขาต้องการรอดูว่าเมาริซิโอ โปเช็ตติโน่ จะสร้างผลกระทบอย่างไรเมื่อเขาย้ายมาจากสหรัฐอเมริกา", "แฟร์นันด์สเคยเป็นที่หมายปองของสโมสรในซาอุดี โปรลีก เมื่อ 18 เดือนก่อน แม้จะมีความรู้สึกว่าเขาต้องการค้าแข้งในยุโรปต่อไปมากกว่าก็ตาม ในขณะที่ฝั่งของแมนเชสเตอร์ ยูไนเต็ด ก็ตระหนักดีถึงฟอร์มการเล่นที่ตกลงไปอย่างน่าตกใจของแฟร์นันด์ส เมื่อเทียบกับมาตรฐานที่เขาเคยทำได้ในฤดูกาลที่แล้ว ซึ่งเขาทำลายสถิติการแอสซิสต์ในพรีเมียร์ลีกและกวาดรางวัลผู้เล่นยอดเยี่ยมทุกรายการ", "ลิเวอร์พูลเคยทุ่มเงินมหาศาลให้กับสัญญาฉบับล่าสุดของ โมฮาเหม็ด ซาลาห์ ซึ่งกลายเป็นภาระทางการเงินที่หนักอึ้ง ดังนั้นแมนเชสเตอร์ ยูไนเต็ด จึงไม่ต้องการแบกรับภาระสัญญาฉบับใหญ่ในระยะยาวให้กับผู้เล่นที่ฟอร์มการเล่นตกลงไปเช่นนี้"], "link": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794563701, "published_at": "2026-11-13T09:55:01Z", "published_th": "13 พ.ย. 2026 • 16:55 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1795010512403, "guid": "https://www.theverge.com/?p=1034715", "original_title": "How The Verge is picking which Black Friday deals to share", "thai_title": "เบื้องหลังการคัดเลือกดีล Black Friday ของ The Verge: เราตัดสินใจอย่างไรว่าโปรโมชันไหนคุ้มค่าจริง?", "tag": "Technology", "sub_tag": "GADGETS", "bullet_points": ["The Verge ใช้เกณฑ์การคัดเลือกที่เข้มงวดในการเลือกดีล โดยเน้นที่คุณภาพของผลิตภัณฑ์ที่ผ่านการทดสอบจริงมากกว่าแค่ตัวเลขส่วนลด", "ปัญหาเรื่อง 'ราคาหลอก' หรือการตั้งราคา List Price ให้สูงเกินจริงเพื่อสร้างภาพลักษณ์ว่าลดเยอะเป็นสิ่งที่ทีมงานเฝ้าระวังและตรวจสอบอยู่เสมอ", "มีการใช้เครื่องมือติดตามราคาภายนอกอย่าง CamelCamelCamel และ Keepa เพื่อตรวจสอบประวัติราคาจริง แทนที่จะเชื่อถือราคาอ้างอิงจากร้านค้าเพียงอย่างเดียว", "ปัจจัยภายนอก เช่น ภาวะเงินเฟ้อและภาษีนำเข้า ส่งผลกระทบต่อโครงสร้างราคา ทำให้ดีลในปัจจุบันอาจมีราคาสูงกว่าในอดีต แต่ทีมงานยังคงพยายามหาทางเลือกที่คุ้มค่าที่สุดให้ผู้อ่าน", "ดีลที่นำเสนอผ่านเว็บไซต์เป็นเพียงส่วนน้อยจากนับพันรายการที่ได้รับแจ้งเข้ามา โดยคัดกรองเฉพาะสินค้าที่ทีมงานไว้วางใจและใช้งานจริงเท่านั้น"], "full_paragraphs": ["ในช่วงเดือนที่ผ่านมา เราถูกถาโถมด้วยดีล Black Friday จำนวนมหาศาล ซึ่งเป็นสัญญาณเตือนถึงสิ่งที่กำลังจะเกิดขึ้นในวันช้อปปิ้งที่ใหญ่ที่สุดของปีในสหรัฐอเมริกา เราได้รับข่าวประชาสัมพันธ์หลายสิบฉบับต่อวันจากแบรนด์ทั้งขนาดเล็กและใหญ่ที่หวังให้เราช่วยเผยแพร่ข้อเสนอเหล่านี้ แน่นอนว่าบริษัทต่างๆ คงอยากให้เราไม่ต้องเสียเวลาตรวจสอบว่าดีลเหล่านั้นคุ้มค่าจริงหรือไม่ และส่วนใหญ่ก็ไม่ได้ให้ข้อมูลบริบทที่จำเป็นสำหรับการคัดกรองดีลที่เราต้องการเลย", "สิ่งที่เราพบเห็นบ่อยครั้งบน Amazon และพยายามแก้ไขในการนำเสนอข่าวของเรา คือดีลที่ดูดีแต่มีการอ้างส่วนลดที่เกินจริง กล่าวคือ ราคาขายปลีกดั้งเดิม (List Price) บางครั้งถูกตั้งไว้สูงกว่าราคาปกติที่ขายในแต่ละวัน เพื่อทำให้ส่วนลดดูน่าดึงดูดมากขึ้น บางครั้งมีการแสดงราคาแนะนำจากผู้ผลิต (MSRP) แต่ก็ไม่ใช่ทุกกรณีที่จะเป็นเช่นนั้น", "ในแถลงการณ์ล่าสุดที่ส่งถึงนักข่าวสืบสวนสอบสวน Ronan Farrow โฆษกของ Amazon ที่ไม่เปิดเผยชื่อระบุว่า 'List Price' ของบริษัทอาจถูกรวบรวมมาจากราคาในช่วง 90 ถึง 180 วันที่ผ่านมา ไม่ใช่แค่ 30 วันตามที่งานวิจัยของ Groundwork Collaborative ระบุไว้ และยังอ้างอิงจากราคาของ Amazon เองรวมถึงร้านค้าคู่แข่งรายอื่น อย่างไรก็ตาม จากประสบการณ์ของเรา วิธีการสื่อสารเรื่องราคาและส่วนลดที่ชวนสับสนไม่ได้จำกัดอยู่แค่บน Amazon เท่านั้น", "ผลการศึกษาของกลุ่มดังกล่าวแสดงให้เห็นว่าการไม่ไว้วางใจราคาที่คุณเห็นนั้นเป็นเรื่องง่าย โดยเฉพาะบนโลกออนไลน์ที่บางครั้งมีการใช้ระบบ Dynamic Pricing เข้ามาเกี่ยวข้อง ไม่ว่าร้านค้าจะมีแนวทางปฏิบัติอย่างไร เราเข้าใจถึงความสำคัญของการคัดสรรสิ่งที่คุณเห็นบน The Verge ด้วยความระมัดระวัง", "การตรวจสอบดีลเพื่อพิจารณานำเสนอเป็นส่วนสำคัญที่มองไม่เห็นในงานของเรา แม้จะอยู่นอกเหนือช่วงเทศกาลช้อปปิ้งใหญ่ก็ตาม ข้อเสนอส่วนใหญ่ที่เราได้รับในแต่ละวันหรือที่เห็นในฟีดข่าว ไม่เคยถูกนำมาลงเว็บไซต์เพราะไม่ผ่านเกณฑ์มาตรฐานของเรา แม้ว่าดีลนั้นจะเป็นผลิตภัณฑ์ที่เราเคยทดสอบและชื่นชอบ ซึ่งเป็นหัวใจหลักในการคัดเลือกดีลของเรา แต่นั่นก็ไม่ใช่การรับประกันว่าจะได้ลงเว็บไซต์เสมอไป เรามักจะข้ามดีลที่ไม่ดีจริงอย่างที่แบรนด์พยายามนำเสนอ หรือบางครั้งดีลอาจจะดูดีแต่กลับมาลดราคาซ้ำๆ ทุกสัปดาห์ มีระยะเวลาจำกัดเพียงไม่กี่ชั่วโมง หรือจำกัดเฉพาะสมาชิกแบบพรีเมียมเท่านั้น หรือบางทีดีลนั้นอาจมาจากร้านค้าที่เราไม่เคยได้ยินชื่อมาก่อน แน่นอนว่าเราพิจารณาปัจจัยหลายอย่างประกอบกัน", "ด้วยเทศกาล Black Friday ที่กำลังจะมาถึง คุณสมควรได้รับความโปร่งใสจากเรา เพื่อให้คุณมั่นใจได้ว่า ไม่ว่าจะเป็นเดือนนี้หรือวันธรรมดาในเดือนกุมภาพันธ์ คุณกำลังดูดีลที่คุ้มค่าจริงเมื่อเข้ามาที่เว็บไซต์ของเรา เกณฑ์พื้นฐานที่สุดที่เราใช้ตัดสินว่าดีลนั้นดีหรือไม่ คือเราชอบผลิตภัณฑ์นั้นมากพอที่จะเขียนถึงหรือไม่ และราคาของมันลดลงจริงหรือเปล่า จากนั้นเราจะประเมินว่าส่วนลดนั้นคุ้มค่ากับความสนใจของคุณหรือไม่ ซึ่งประเด็นนี้เริ่มมีความซับซ้อนมากขึ้นในปีที่ผ่านมา ทั้งปัญหา RAMageddon และผลกระทบจากภาษีนำเข้าที่สูงขึ้น ซึ่งในบางกรณีส่งผลกระทบอย่างมากต่อราคาและส่งผลต่อเนื่องมาถึงดีลที่เรานำเสนอ", "เราติดตามดีลอย่างใกล้ชิดจนรู้ว่าเมื่อไหร่ควรคว้าโอกาสหรือเมื่อไหร่ควรปล่อยผ่าน สำหรับผลิตภัณฑ์ที่ได้รับผลกระทบจากการปรับขึ้นราคาเมื่อเร็วๆ นี้ ราคาดีลใหม่บางครั้งอาจเท่ากับราคาป้ายเดิมหรือใกล้เคียงกัน พวกเราหลายคนคงพยักหน้าเห็นด้วยกับคุณหากคุณคิดว่า 'เฮ้ย นั่นไม่ใช่ดีลแล้ว นั่นมันราคาปกติชัดๆ ฉันไม่หลงกลหรอก!' แต่มันก็ถือเป็นดีลในทางเทคนิคสำหรับพวกเราหลายคนที่พยายามประหยัดเงินในทุกทางที่เป็นไปได้ ในทำนองเดียวกัน บางครั้งเราจะเน้นวิธีประหยัดเงินสำหรับสินค้าดิจิทัลหรือสินค้าทั่วไปด้วยการซื้อบัตรของขวัญ (Gift Cards) ที่ลดราคา ซึ่งสามารถนำไปใช้ซื้อผลิตภัณฑ์ที่เป็นที่ต้องการได้ วิธีการเหล่านี้เป็นวิธีเดียวที่จะได้ดีลสำหรับเกม Grand Theft Auto VI ก่อนวันวางจำหน่าย เป็นต้น", "เพื่อช่วยให้เราทราบถึงการลดราคา เรายังใช้เครื่องมือติดตามราคาฟรีอย่าง CamelCamelCamel และ Keepa ซึ่งให้ข้อมูลประวัติราคาบน Amazon ที่เป็นกลาง (คุณเองก็สามารถใช้ได้เช่นกัน!) เครื่องมือเหล่านี้จะแจ้งเตือนเราเมื่อผลิตภัณฑ์ที่เราชอบและคิดว่าคุณน่าจะชอบด้วยมีการลดราคา นอกจากนี้ Amazon ยังมีเครื่องมือ Alexa for Shopping ของตัวเอง ซึ่งสามารถแสดงข้อมูลราคาย้อนหลังได้ถึงหนึ่งปีและทำหน้าที่คล้าย AI แชทบอท รวมถึงสามารถซื้อสินค้าแทนคุณได้โดยอัตโนมัติ จากประสบการณ์ของผม ข้อมูลราคาย้อนหลังของ Amazon มักจะสอดคล้องกับบริษัทที่ไม่เกี่ยวข้องกับ Amazon อย่างไรก็ตาม ไม่มีเครื่องมือใดที่สมบูรณ์แบบ แม้แต่เครื่องมือจากภายนอกที่เราใช้ก็ไม่ได้แสดงราคาต่ำสุดที่เคยบันทึกไว้ที่เราเคยนำเสนอเสมอไป ทั้งหมดนี้จะบอกว่ามีรายละเอียดปลีกย่อยมากมาย แต่เราติดตามดีลอย่างใกล้ชิดจนรู้ว่าเมื่อไหร่ควรคว้าโอกาสหรือเมื่อไหร่ควรปล่อยผ่าน", "เราครอบคลุมผลิตภัณฑ์หลากหลายหมวดหมู่ก่อนช่วงเทศกาลวันหยุด รวมถึงสินค้าบางประเภทที่ไม่ค่อยได้รับความสนใจบน The Verge มากนัก อย่างไรก็ตาม จากดีลนับพันรายการที่เราเห็นก่อน Black Friday สิ่งที่คุณเห็นคือเพียงไม่กี่สิบรายการที่โดดเด่น ซึ่งเราได้ทดสอบหรือใช้งานจริงในชีวิตประจำวันในแต่ละหมวดหมู่ ไม่ว่าจะเป็นหูฟัง, ทีวี, อุปกรณ์เกมมิ่ง, อุปกรณ์สมาร์ทโฮม ฯลฯ ซึ่งผ่านเกณฑ์ของเราในการเป็นผลิตภัณฑ์ที่ดีในราคาที่น่าสนใจ"], "link": "https://www.theverge.com/gadgets/1034715/how-the-verge-finds-deals", "canonical_link": "https://www.theverge.com/gadgets/1034715/how-the-verge-finds-deals", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/258010_Black_friday_cyber_monday_CVirginia_PRICE2.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/03/268387_Apple_MacBook_Neo_AKrales_0543.jpg?quality=90&strip=all&crop=5.9486979166667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25819374/jbl2.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/04/rev-1-GRC-14350_High_Res_JPEG.jpeg?quality=90&strip=all&crop=20.785055568692%2C0%2C58.429888862615%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795010400, "published_at": "2026-11-18T14:00:00Z", "published_th": "18 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1795010512405, "guid": "https://www.theverge.com/?p=1036140", "original_title": "Will Wright’s next game uses AI to map your memories", "thai_title": "Will Wright ผู้สร้าง The Sims เปิดตัว MyMems เกมแนวโซเชียลซิมูเลชันที่ใช้ AI สร้างโลกจากความทรงจำของคุณ", "tag": "Technology", "sub_tag": "GAMING", "bullet_points": ["Will Wright ผู้ให้กำเนิด SimCity และ The Sims กำลังพัฒนาเกมใหม่ชื่อ MyMems ซึ่งเป็นเกมแนวโซเชียลซิมูเลชันที่ขับเคลื่อนด้วย AI", "ตัวเกมเปิดโอกาสให้ผู้เล่นนำความทรงจำส่วนตัวมาเปลี่ยนเป็นโลกจำลอง โดยสามารถสร้างอวตาร AI ของบุคคลสำคัญในชีวิตและวางตำแหน่งความทรงจำลงบนแผนที่เสมือนจริง", "ทีมพัฒนาจาก Gallium Studios ยืนยันว่าเกมนี้เน้นความสนุกและการสร้างสรรค์ ไม่ใช่การทำหน้าที่เป็นไดอารี่บันทึกชีวิตแบบจริงจัง", "แม้กระแสต่อต้าน AI ในวงการเกมจะรุนแรง แต่ทีมงานเชื่อว่าหากผู้เล่นเป็นผู้ควบคุมการสร้างสรรค์ด้วยตนเอง (Authoring) จะทำให้ประสบการณ์ที่ได้ไม่รู้สึกเหมือนเป็นการโกงหรือการผลิตเนื้อหาที่ไร้คุณภาพ", "MyMems มีกำหนดการเปิดตัวในปี 2027 โดยมุ่งหวังที่จะต่อยอดแนวคิดการจำลองชีวิตจริงที่เคยประสบความสำเร็จใน The Sims ให้ลึกซึ้งยิ่งขึ้น"], "full_paragraphs": ["Will Wright ผู้สร้างแฟรนไชส์ระดับตำนานอย่าง SimCity และ The Sims กำลังซุ่มพัฒนาเกมใหม่ที่สร้างขึ้นโดยมี AI เป็นแกนหลัก โดยเกมนี้มีชื่อว่า MyMems ซึ่งมุ่งเน้นไปที่การนำความทรงจำของผู้เล่นมาเป็นหัวใจสำคัญ เช่นเดียวกับผลงานชิ้นก่อนๆ ของ Wright เกมนี้ดูมีความทะเยอทะยานสูงมาก โดยมอบวิธีการใหม่ให้ผู้เล่นได้สำรวจโลกที่พวกเขาสร้างขึ้นด้วยตัวเอง 'เราต้องการนำอัตชีวประวัติของคุณมาเปลี่ยนให้กลายเป็นโลกของเล่น' เขากล่าวกับ The Verge", "เว็บไซต์ของ MyMems อธิบายว่าเกมมือถือนี้เป็น 'โซเชียลซิมูเลชัน' ที่มีโลกซึ่ง 'สร้างขึ้นจากความทรงจำของคุณและผู้คนที่หล่อหลอมตัวตนของคุณ' ผู้เล่นสามารถเพิ่ม 'ความทรงจำ' เข้าไปในเกมได้ เช่น การบอกเล่าเรื่องราวสั้นๆ ผ่านโทรศัพท์ แล้วความทรงจำเหล่านั้นจะถูกเจนเนอเรตออกมาเป็นชิ้นส่วนที่คุณสามารถนำไปวางบนแผนที่ของเกมได้ นอกจากนี้ โลกของคุณยังสามารถมีอวตารที่ขับเคลื่อนด้วย AI ซึ่งเป็นตัวแทนของบุคคลที่คุณรู้จักในชีวิตจริงได้อีกด้วย Wright กล่าวว่า ในอุดมคติแล้ว เมื่อคุณเล่นไปเรื่อยๆ โลกใบนี้จะเริ่มกลายเป็น 'แผนที่ของจิตใจคุณ' คล้ายกับภาพยนตร์เรื่อง Inside Out โดยโลกเหล่านี้สามารถตั้งค่าเป็นส่วนตัวหรือแชร์ให้ผู้อื่นเข้าชมได้", "Virginia McArthur โปรดิวเซอร์บริหารและผู้จัดการทั่วไปของ Gallium Studios ซึ่งเป็นสตูดิโอผู้พัฒนา MyMems ได้ให้มุมมองเพิ่มเติมว่า 'มันคือเกมสร้างโลกที่ให้ความรู้สึกอบอุ่น (Cozy world builder) โดยมีระบบโซเชียลซิมูเลชันที่ลึกซึ้งอยู่เบื้องหลัง'", "แม้แนวคิดนี้จะดูเข้าใจยากหากไม่ได้สัมผัสด้วยตัวเอง แต่ทีมงานของ Wright ก็ยังต้องการให้มันเป็นเกมที่สนุกสนาน Anthony Maitz ผู้จัดการผลิตภัณฑ์ของ Gallium Studios กล่าวว่า 'นี่ไม่ได้ตั้งใจให้เป็นไดอารี่บันทึกมรดกชีวิตของคุณแต่อย่างใด แต่มันตั้งใจให้เป็นเพียงสิ่งที่คุณสามารถเล่นสนุกไปกับมันได้' อย่างไรก็ตาม Maitz ตั้งข้อสังเกตว่า สิ่งที่คุณกำลังทำอยู่นั้นคือการสร้าง 'ตัวแทน' (Proxy) ของตัวคุณเอง ซึ่งดูเหมือนจะเป็นแรงบันดาลใจของชื่อเกมในยุคแรกเริ่มที่ชื่อว่า Proxi: Yesterday’s You Tomorrow", "เช่นเดียวกับอุตสาหกรรมอื่นๆ วงการเกมกำลังเผชิญหน้ากับการปรับตัวเข้าหา Generative AI ในช่วงที่ผ่านมา โลกเสมือนจริงที่สร้างด้วย AI จากสตาร์ทอัพที่ได้รับการสนับสนุนจากผู้ร่วมก่อตั้ง Pixar และ Project Genie ของ Google ยังไม่สามารถสร้างประสบการณ์ที่ผู้เล่นอยากใช้เวลาด้วยจริงๆ ได้ และนักพัฒนาอินดี้หลายรายที่ผมได้พูดคุยด้วยเมื่อเดือนมีนาคมก็คัดค้านเทคโนโลยีนี้อย่างหนัก แต่เทคโนโลยี AI ได้ก้าวกระโดดครั้งใหญ่ในปีนี้ โดยบริษัทอย่าง Google, Meta และ Roblox ต่างเปิดให้ผู้ใช้สร้างเกมด้วย AI ผ่านสมาร์ทโฟนได้โดยตรง รวมถึงเกมย้อนยุคที่กำลังถูกรุกรานด้วยพอร์ตเกมคลาสสิกที่ขับเคลื่อนด้วย AI", "Strauss Zelnick ซีอีโอของ Take-Two Interactive กล่าวเมื่อต้นปีนี้ว่า Generative AI 'ไม่มีส่วนเกี่ยวข้องใดๆ กับสิ่งที่ Rockstar Games กำลังสร้าง' ใน GTA VI แม้ว่าผลสำรวจล่าสุดในอุตสาหกรรมจะบ่งชี้ว่านักพัฒนาเกมจำนวนมากขึ้นเริ่มใช้ Generative AI ในการทำงาน แต่เหล่าคนทำงานก็กำลังต่อต้านการใช้เทคโนโลยีนี้ และมันได้กลายเป็นประเด็นถกเถียงที่ดุเดือดในงานประกาศรางวัลเกมอินดี้หลายแห่ง", "ผู้เล่นจำนวนมากปฏิเสธการใช้ AI อย่างสิ้นเชิง ผมจึงสงสัยว่าทีมงาน Gallium Studios กังวลเกี่ยวกับการต่อต้านการใช้ AI ใน MyMems หรือไม่ Wright กล่าวว่าเขามีลูกชายสามคนอยู่ที่บ้านและพวกเขาทั้งหมด 'ค่อนข้างเป็นลบ' ต่อ AI เขามองว่าความรู้สึกเชิงลบต่อ AI นั้นมุ่งไปที่ประเด็นเรื่องความหมายของศิลปะ ความเป็นผู้สร้าง และการให้เครดิต ซึ่งเป็นข้อกังวลที่เขาเรียกว่า 'มีมูลความจริง' แต่เขาก็เรียก AI ว่าเป็น 'เครื่องมือที่น่าทึ่ง' เช่นกัน", "'เราไม่ได้กำลังสร้างขยะ (slop)' McArthur กล่าว แต่ Maitz ตั้งข้อสังเกตว่า แม้ทีมงานจะ 'มีความกังวล' เกี่ยวกับกระแสตอบรับเชิงลบต่อการใช้ Generative AI แต่พวกเขาก็ได้เรียนรู้ว่าผู้คนไม่ได้รังเกียจเมื่อมีการใช้ AI ใน 'สไตล์แบบ Scribblenauts' สำหรับสิ่งต่างๆ เช่น การให้เกมสร้างโรงเรียนมัธยมขึ้นมา ทีมงานยังพบว่าผู้คนรู้สึก 'เสพติด' แอปทดสอบที่มีระบบสร้างตัวละคร รวมถึงลูกสาวของ Maitz เองที่เขากล่าวว่า 'เกลียด' AI แต่เขากล่าวว่า 'ด้วยการทำให้ผู้เล่นเป็นคนสร้างมันขึ้นมาทีละนิดๆ มันจึงไม่รู้สึกเหมือนว่าคุณกำลังโกง'", "MyMems ซึ่งมีกำหนดเปิดตัวในปี 2027 จะเข้าร่วมสมรภูมิโซเชียลซิมูเลชันที่มีการแข่งขันสูงขึ้นเรื่อยๆ เช่น Inzoi ของ Krafton และ Tomodachi Life: Living the Dream เกมฮิตของ Nintendo แต่ไม่มีเกมใดที่มีแรงดึงดูดเท่ากับ The Sims ซึ่งยังคงเป็นหนึ่งในแฟรนไชส์ที่สำคัญที่สุดของ EA สำหรับ The Sims นั้น Wright กล่าวว่าผู้คนจำนวนมากพยายามสร้างครอบครัวจริงๆ ของพวกเขาลงไปในเกม", "'มันน่าสนใจมากที่ผู้คนพยายามนำเกมนี้ ซึ่งเปรียบเสมือนของเล่นชิ้นเล็กๆ มาจำลองเข้ากับชีวิตจริงของพวกเขาโดยธรรมชาติ' เขากล่าว สำหรับ MyMems นั่นคือสิ่งที่ทีมงานพยายามจะทำ 'ขั้นตอนต่อไป' ให้สมบูรณ์ นั่นคือจะเกิดอะไรขึ้นหากพวกเขาสร้างเกมทั้งเกมโดยเน้นไปที่ตัวคุณเอง?", "Wright อธิบายว่า ลองจินตนาการถึงการเปิดสมุดภาพครอบครัว แล้วเห็นผู้คนและสิ่งของต่างๆ กระโดดออกมาจากหน้ากระดาษ 'เมื่อคุณเปิดไปเรื่อยๆ ในไม่ช้าคุณก็จะมีคณะละครสัตว์เล็กๆ ที่เต็มไปด้วยผู้คน เหตุการณ์ และสิ่งต่างๆ จากชีวิตของคุณ' เขากล่าวว่ามันคือความโกลาหล 'ผมต้องการบางสิ่งที่ให้ความรู้สึกแบบนั้น'"], "link": "https://www.theverge.com/games/1036140/will-wright-mymems-ai-game-interview", "canonical_link": "https://www.theverge.com/games/1036140/will-wright-mymems-ai-game-interview", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Grand-Canyon-Family-Portrait.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Moonlit-walk.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/remember-chat-2.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795010400, "published_at": "2026-11-18T14:00:00Z", "published_th": "18 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1795007740862, "guid": "https://www.theverge.com/?p=1036445", "original_title": "Nvidia isn’t selling any more AI chips to China", "thai_title": "Nvidia ยุติการส่งออกชิป AI ขั้นสูงไปยังประเทศจีนอย่างเป็นทางการ", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Nvidia ประกาศหยุดการจัดส่งชิปประมวลผล AI ตระกูล Hopper ที่ได้รับใบอนุญาตไปยังประเทศจีนแล้ว", "การตัดสินใจครั้งนี้เกิดขึ้นหลังจากการเปลี่ยนผ่านตำแหน่ง CEO ของบริษัทเมื่อสัปดาห์ที่ผ่านมา", "ก่อนหน้านี้ Nvidia เคยได้รับอนุมัติจากทำเนียบขาวให้ส่งออกชิป H200 ไปยังจีนได้เมื่อเดือนธันวาคมปีที่แล้ว", "ปัญหาการส่งออกมีความซับซ้อนขึ้นจากกรณีอื้อฉาวของอดีต CEO และความพยายามของจีนในการลดการพึ่งพาเทคโนโลยีจากสหรัฐฯ", "มีรายงานว่าชิป H200 จำนวนกว่า 600,000 ตัวยังคงค้างอยู่ที่ฮ่องกง เนื่องจากทางการจีนชะลอการอนุมัติการนำเข้าในระดับมหภาค"], "full_paragraphs": ["Nvidia ได้ยุติการจัดส่งชิป AI ขั้นสูงไปยังประเทศจีนเป็นที่เรียบร้อยแล้ว แม้ว่าจะเคยได้รับอนุมัติจากทำเนียบขาวให้สามารถดำเนินการได้เมื่อเดือนธันวาคมปีที่ผ่านมา โดยการประกาศดังกล่าวมาจาก Colette Kress ซึ่งดำรงตำแหน่งรักษาการ CEO ของ Nvidia ในระหว่างการแถลงผลประกอบการเมื่อวันอังคารที่ผ่านมา ซึ่งถือเป็นการเปลี่ยนแปลงครั้งสำคัญของบริษัท หลังจากที่ภายใต้การนำของอดีต CEO อย่าง Jensen Huang ทางบริษัทเคยพยายามอย่างหนักในการต่อสู้เพื่อให้ได้สิทธิ์ในการส่งออกชิปสถาปัตยกรรม Hopper รุ่น H200 ไปยังประเทศจีน", "“แนวทางการดำเนินงานของเราไม่มีผลิตภัณฑ์ในกลุ่ม Hopper data center ที่ได้รับใบอนุญาตเข้ามาเกี่ยวข้องอีกต่อไป และเราไม่ได้จัดส่งผลิตภัณฑ์ Hopper data center ที่ได้รับใบอนุญาตไปยังประเทศจีนแล้ว” Kress กล่าว ทั้งนี้เธอไม่ได้ให้คำอธิบายเพิ่มเติมว่าเหตุใด Nvidia จึงตัดสินใจยุติการจัดส่งโปรเซสเซอร์รุ่น H200 หรือชี้แจงว่า Nvidia จะยังคงดำเนินธุรกิจอื่น ๆ กับประเทศจีนในอนาคตต่อไปหรือไม่", "การปรับเปลี่ยนทิศทางธุรกิจครั้งนี้เกิดขึ้นหลังจากที่ Jensen Huang ได้ก้าวลงจากตำแหน่ง CEO ของ Nvidia เมื่อสัปดาห์ที่ผ่านมา ตามหลังรายงานข่าวเกี่ยวกับความสัมพันธ์นอกสมรสหลายครั้ง ซึ่งหนึ่งในนั้นเป็นหญิงสาวที่หน่วยข่าวกรองของสหรัฐฯ สงสัยว่าอาจเป็นสายลับของจีน อย่างไรก็ตาม Nvidia ต้องเผชิญกับความยากลำบากในการระบายชิป AI เหล่านี้มาก่อนที่จะเกิดเรื่องอื้อฉาวดังกล่าว โดยมีความกังวลเกิดขึ้นเกี่ยวกับการตรวจสอบบริษัทจีนที่ได้รับอนุมัติให้จัดการกับชิป AI รุ่น H200 อย่างไม่เหมาะสม", "นอกจากนี้ สำนักข่าว Reuters ยังรายงานเมื่อช่วงต้นเดือนที่ผ่านมาว่า มีชิป H200 จำนวนประมาณ 600,000 ตัวที่ยังคงติดค้างอยู่ในฮ่องกง หลังจากที่รัฐบาลปักกิ่งระงับการอนุมัติสำหรับการนำเข้าในปริมาณมาก เนื่องจากจีนมีความต้องการที่จะลดการพึ่งพาเทคโนโลยีจากสหรัฐอเมริกาลง"], "link": "https://www.theverge.com/tech/1036445/nvidia-h200-ai-chips-china-stop-selling", "canonical_link": "https://www.theverge.com/tech/1036445/nvidia-h200-ai-chips-china-stop-selling", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/04/STK083_NVIDIA_C.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795006865, "published_at": "2026-11-18T13:01:05Z", "published_th": "18 พ.ย. 2026 • 20:01 น.", "category_hint": "Technology"}, {"id": 1795004269474, "guid": "https://www.theverge.com/?p=1036431", "original_title": "NASA’s Voyager 1 probe is now one light-day away", "thai_title": "ยาน Voyager 1 ของ NASA เดินทางไกลถึงระยะ 1 วันแสงจากโลกแล้ว", "tag": "Technology", "sub_tag": "SCIENCE", "bullet_points": ["ยานอวกาศ Voyager 1 สร้างประวัติศาสตร์ด้วยการเดินทางห่างจากโลกเป็นระยะทาง 1 วันแสง หรือประมาณ 16,094 ล้านไมล์", "ยานยังคงปฏิบัติภารกิจส่งข้อมูลทางวิทยาศาสตร์กลับมายังโลกได้ แม้จะต้องใช้เวลาในการสื่อสารด้วยสัญญาณวิทยุนานถึง 24 ชั่วโมง", "Voyager 1 กำลังมุ่งหน้าสู่ดาวฤกษ์ Gliese 445 ในกลุ่มดาวหมีเล็ก โดยคาดว่าจะใช้เวลาเดินทางอีกประมาณ 40,000 ปี", "ความสำเร็จนี้ถือเป็นหมุดหมายสำคัญของวัตถุที่มนุษย์สร้างขึ้น ซึ่งเดินทางได้ไกลที่สุดในประวัติศาสตร์อวกาศ", "ยาน Voyager 2 ซึ่งเป็นยานคู่แฝด คาดว่าจะเดินทางถึงระยะ 1 วันแสงจากโลกในปี 2035"], "full_paragraphs": ["หลังจากออกเดินทางผ่านความว่างเปล่าของอวกาศมานานถึง 49 ปี ในที่สุดยาน Voyager 1 ก็ได้บรรลุหมุดหมายสำคัญครั้งประวัติศาสตร์ โดยขณะนี้ยานอวกาศลำดังกล่าวอยู่ห่างจากโลกเป็นระยะทาง 1 วันแสงอย่างเป็นทางการ ซึ่งทาง NASA ได้นิยามความไกลนี้ไว้ว่า “ไกลมาก ๆ” (very, very far) โดยยานได้ข้ามผ่านจุดสำคัญนี้เมื่อวันพุธที่ผ่านมา เวลา 05:16 น. ตามเวลาฝั่งตะวันออก (ET) ซึ่งคิดเป็นระยะทาง 16,094 ล้านไมล์จากโลกของเรา หรือเทียบเท่ากับระยะทางที่แสงเดินทางได้ในเวลา 24 ชั่วโมง", "นี่ถือเป็นระยะทางที่ไกลที่สุดเท่าที่วัตถุที่มนุษย์สร้างขึ้นเคยเดินทางไปถึง และการเดินทางของ Voyager 1 ก็ยังไม่สิ้นสุดลงเพียงเท่านี้ ยานลำนี้ยังคงมุ่งหน้าต่อไปยังดาวฤกษ์ที่ชื่อว่า Gliese 445 ในกลุ่มดาวหมีเล็ก (Ursa Minor) นับตั้งแต่เสร็จสิ้นภารกิจหลักในการบินผ่านดาวพฤหัสบดีและดาวเสาร์ในปี 1980", "ดาวฤกษ์เป้าหมายดังกล่าวอยู่ห่างออกไปถึง 17 ปีแสง ซึ่งหมายความว่า Voyager 1 จะยังไม่เดินทางผ่านดาวดวงนั้นไปจนกว่าจะถึงอีกประมาณ 40,000 ปีข้างหน้า แม้ว่าตัวยานจะเคลื่อนที่ด้วยความเร็วเกือบ 38,000 ไมล์ต่อชั่วโมงก็ตาม", "หมุดหมายระยะทาง 1 วันแสงนี้ถือเป็นความสำเร็จที่น่าทึ่งในตัวของมันเอง แต่สิ่งที่น่าประทับใจยิ่งกว่าคือการที่ Voyager 1 ยังคงปฏิบัติการได้อยู่จนถึงปัจจุบัน NASA ประสบความสำเร็จอย่างมากในการรักษาให้ระบบต่าง ๆ ของยานยังคงทำงานได้ และสามารถส่งข้อมูลการอ่านค่าเกี่ยวกับคลื่นพลาสมา สนามแม่เหล็ก และอนุภาคในอวกาศกลับมายังโลกได้ แม้ว่าในปัจจุบันสัญญาณวิทยุจะต้องใช้เวลาเดินทางไป-กลับระหว่างโลกและยานนานถึงหนึ่งวันเต็มก็ตาม", "สำหรับยาน Voyager 2 ซึ่งถูกส่งขึ้นสู่อวกาศก่อนหน้ายานคู่แฝดลำนี้ 16 วัน คาดว่าจะเดินทางถึงระยะ 1 วันแสงจากโลกเช่นกัน แต่คาดว่าจะต้องรอจนถึงปี 2035 กว่าจะถึงหมุดหมายดังกล่าว"], "link": "https://www.theverge.com/science/1036431/nasa-voyager-1-light-day-milestone", "canonical_link": "https://www.theverge.com/science/1036431/nasa-voyager-1-light-day-milestone", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-164430702.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795003416, "published_at": "2026-11-18T12:03:36Z", "published_th": "18 พ.ย. 2026 • 19:03 น.", "category_hint": "Technology"}, {"id": 1795001451830, "guid": "https://www.theverge.com/?p=1036415", "original_title": "Suno now lets you make AI videos for your AI music", "thai_title": "Suno เปิดตัวฟีเจอร์ Visuals เปลี่ยนเพลงจาก AI ให้เป็นวิดีโอและภาพประกอบอัตโนมัติ", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["Suno เปิดตัวฟีเจอร์ 'Visuals' ช่วยให้ผู้ใช้สร้างวิดีโอความยาว 15 วินาทีที่ซิงค์กับเนื้อเพลงและภาพประกอบสำหรับเพลง AI ได้", "รองรับการใช้งานผ่านเว็บ, iOS และ Android โดยมีเครื่องมือปรับแต่งทั้งการเลือกภาพอ้างอิง, อัตราส่วนภาพ และการทำ Lipsync อัตโนมัติ", "ขับเคลื่อนด้วยโมเดล H3 จาก MiniMax พร้อมระบบป้องกันการละเมิดลิขสิทธิ์และป้องกันการสร้างภาพบุคคลสาธารณะหรือศิลปิน", "มีการแยกเครดิตการใช้งาน (Visuals credits) ออกจากเครดิตการสร้างเพลง ทำให้ผู้ใช้ต้องมีค่าใช้จ่ายเพิ่มเติมหากต้องการใช้งานฟีเจอร์นี้", "การขยายตัวสู่ฟีเจอร์วิดีโอเกิดขึ้นท่ามกลางกระแสวิพากษ์วิจารณ์จากผู้ใช้บางส่วนที่ต้องการให้บริษัทมุ่งเน้นการปรับปรุงคุณภาพเสียงมากกว่า"], "full_paragraphs": ["Suno ได้เปิดตัวฟีเจอร์ใหม่ล่าสุดในชื่อ 'Visuals' ซึ่งถือเป็นก้าวสำคัญในการขยายขีดความสามารถของแพลตฟอร์มจากการเป็นเพียงเครื่องมือสร้างเพลงด้วย AI ไปสู่การเป็นแพลตฟอร์มมัลติมีเดียเต็มรูปแบบ ฟีเจอร์นี้ช่วยให้ผู้ใช้สามารถเปลี่ยนเพลงที่สร้างจาก Suno ให้กลายเป็นคลิปวิดีโอ AI ที่สามารถขยับปากตามเนื้อเพลง (Lipsync) ได้โดยอัตโนมัติ รวมถึงการสร้างภาพประกอบเพื่อใช้เป็นภาพปกอัลบั้มหรือภาพขนาดย่อ (Thumbnail) ผ่านการพิมพ์คำสั่ง (Prompt)", "ฟีเจอร์ Visuals พร้อมให้ใช้งานแล้วทั้งบนหน้าเว็บไซต์, iOS และ Android โดยผู้ใช้สามารถเข้าถึงได้ผ่านแท็บ 'Visuals' ในโหมด Create ของแต่ละเวอร์ชัน สำหรับผู้ใช้งานบนเว็บยังสามารถเข้าถึงได้ผ่านเมนูจุดสามจุดบนเพลงในคลังส่วนตัว โดยผู้ใช้สามารถเลือกช่วงของเพลงที่ต้องการนำมาประกอบวิดีโอได้สูงสุด 15 วินาที พร้อมทั้งเลือกภาพอ้างอิงเพื่อใช้เป็นจุดเริ่มต้นในการสร้างคลิปวิดีโอ", "ในส่วนของการเลือกภาพอ้างอิง ผู้ใช้มีตัวเลือก 3 รูปแบบ ได้แก่ การเลือกใช้ตัวละครสำเร็จรูปที่ Suno จัดเตรียมไว้ให้, การอัปโหลดรูปภาพหรือผลงานศิลปะของตนเอง หรือการสร้างภาพขึ้นใหม่โดยตรงบน Suno ผ่านการพิมพ์คำสั่งบรรยาย นอกจากนี้ยังสามารถเลือกอัตราส่วนภาพ (Aspect Ratio) ให้เหมาะสมกับการแสดงผลทั้งในแนวตั้งและแนวนอน เพื่อให้สอดคล้องกับแพลตฟอร์มออนไลน์ต่างๆ", "สำหรับการสร้างวิดีโอ ผู้ใช้สามารถกำหนดได้ว่าภาพอ้างอิงจะถูกใช้เป็นเฟรมเริ่มต้นหรือเฟรมสุดท้าย เพื่อความสะดวกในการตัดต่อคลิปความยาว 15 วินาทีเข้าด้วยกัน นอกจากนี้ยังมีปุ่มเปิด-ปิดฟังก์ชัน Lipsync เพื่อให้ตัวละครในวิดีโอขยับปากตามเนื้อร้อง รวมถึงเครื่องมือปรับแต่งอัตราส่วนภาพและความยาวของคลิป โดย Visuals ยังมาพร้อมกับไทม์ไลน์การตัดต่อวิดีโอโดยเฉพาะ เพื่อให้ผู้ใช้สามารถนำคลิปต่างๆ มาเรียงต่อกันเป็นวิดีโอที่ยาวขึ้น พร้อมทั้งเพิ่มข้อความเนื้อเพลงที่ปรับแต่งได้", "เบื้องหลังการทำงานของ Visuals ขับเคลื่อนด้วยโมเดล AI รุ่น H3 จาก MiniMax โดย Suno ระบุว่าโมเดลนี้ได้รับการปรับแต่งให้เหมาะสมกับชุมชนผู้ใช้งานของบริษัท รวมถึงมีการเพิ่มมาตรการป้องกันและระบบความปลอดภัยต่างๆ เช่น ชุดตัวกรองข้อความและภาพแบบใหม่ที่ออกแบบมาเพื่อป้องกันไม่ให้ผู้ใช้สร้างหรือใช้ภาพลักษณ์ของศิลปินเฉพาะกลุ่ม, บุคคลสาธารณะ, ผลงานที่มีลิขสิทธิ์ และทรัพย์สินทางปัญญา (IP) ต่างๆ", "อย่างไรก็ตาม การใช้งานฟีเจอร์นี้จะมีค่าใช้จ่ายเพิ่มเติม เนื่องจาก Suno ได้กำหนดให้ใช้ 'Visuals credits' แยกต่างหา สัมพันธ์ของตัวละครหลักสองคนท่ามกลางโลกอาชญากรรมแบบ Open-world", "Rockstar Games เผชิญกับความท้าทายจากเหตุการณ์ข้อมูลรั่วไหลครั้งใหญ่ในปี 2022 โดยผู้กระทำผิดจากกลุ่ม Lapsus$ ได้รับโทษตามกฎหมายแล้ว"], "full_paragraphs": ["หลังจากผ่านไปนานกว่าหนึ่งทศวรรษนับตั้งแต่การเปิดตัว Grand Theft Auto V ในที่สุดภาคต่อที่ทุกคนรอคอยก็ได้ฤกษ์วางจำหน่าย โดยในวันที่ 19 พฤศจิกายนนี้ GTA VI จะพร้อมให้เล่นบนเครื่อง PlayStation 5 และ Xbox Series X / S ซึ่งถือได้ว่าเป็นหนึ่งในการเปิดตัววิดีโอเกมที่ได้รับความสนใจและถูกคาดหวังมากที่สุดเท่าที่เคยมีมา", "ส่วนหนึ่งของความคาดหวังนี้มาจากความสำเร็จอันมหาศาลของภาคก่อนหน้าอย่าง GTA V ซึ่งทำยอดขายไปได้มากกว่า 230 ล้านชุดตลอดระยะเวลา 13 ปีที่ผ่านมา นอกจากนี้ ช่วงเวลาที่ทิ้งห่างระหว่างการเปิดตัวแต่ละภาคยังยาวนานจนน่าเหลือเชื่อ ประกอบกับปัญหาข้อมูลรั่วไหลและการเลื่อนวางจำหน่ายหลายครั้ง ยิ่งทำให้แฟนเกมรู้สึกว่าการรอคอยครั้งนี้ยาวนานและยากลำบากยิ่งขึ้น", "อย่างไรก็ตาม ในขณะนี้ GTA VI ได้กลายเป็นเกมที่คุณสามารถสัมผัสได้จริงแล้ว และคุณสามารถติดตามข้อมูลสำคัญทั้งหมดหลังการเปิดตัวได้ที่นี่ ซึ่งรวมถึงบทวิจารณ์จากทีมงานของเรา บทสัมภาษณ์ทีมพัฒนา ตลอดจนข่าวสารว่าตัวเกมสร้างผลกระทบต่อผู้เล่นอย่างไรบ้าง", "Grand Theft Auto VI ไม่ได้เป็นเพียงเกม GTA ที่ยิ่งใหญ่ที่สุดเท่าที่เคยสร้างมาเท่านั้น แต่ยังเป็นภาคที่มีความเป็น 'โรแมนติก' มากที่สุดอีกด้วย แม้ว่าซีรีส์นี้จะเป็นที่รู้จักดีในเรื่องตัวละครหลักสายอาชญากร แต่ GTA VI ได้ปรับเปลี่ยนแนวทางด้วยการนำเสนอเรื่องราวของคู่หูหัวขโมยที่ตกหลุมรักกันหลังจากพบกันระหว่างการขโมยรถ แม้ตัวเกมจะยังคงเป็นเกมแนว Open-world ที่เต็มไปด้วยความโกลาหลและการก่ออาชญากรรม แต่ผู้เล่นหลายคนก็จะได้พยายามประคับประคองความสัมพันธ์ที่กำลังเบ่งบานระหว่างการทำภารกิจปล้น ซึ่งตัวเกมที่กว้างใหญ่นี้ถูกออกแบบมาเพื่อรองรับทั้งสองกลุ่มเป้าหมาย", "“มันคือความเสี่ยงครับ” Rob Nelson โปรดิวเซอร์ของ GTA VI และหัวหน้าสตูดิโอร่วมที่ Rockstar North อธิบาย “มันเป็นการเปลี่ยนแปลงครั้งใหญ่สำหรับ Grand Theft Auto คุณยังสามารถเล่นในรูปแบบเดิมๆ ได้ คุณสามารถปฏิเสธสิ่งเหล่านี้ได้ทั้งหมด แต่สำหรับคนที่เลือกจะดื่มด่ำไปกับมัน มันมีความหมายมาก คุณต้องพยายามและทุ่มเทให้กับมัน เหมือนกับความสัมพันธ์ในชีวิตจริงทั่วไป”", "คำถามคือ คุณจะสานต่อความสำเร็จจากเกมอย่าง Grand Theft Auto V ได้อย่างไร? เมื่อ 13 ปีก่อน มหากาพย์อาชญากรรมของ Rockstar ได้นิยามใหม่ว่าเกมแนว Open-world ควรเป็นอย่างไร และกลายเป็นความสำเร็จครั้งใหญ่ด้วยยอดขายกว่า 230 ล้านชุดบนคอนโซลถึง 3 เจเนอเรชัน โดยรั้งอันดับรองจาก Tetris และ Minecraft ในฐานะเกมที่ขายดีที่สุดตลอดกาล และโหมดออนไลน์ที่ทำกำไรมหาศาลก็ช่วยให้เกมยังคงได้รับความนิยมมานานกว่าทศวรรษ", "ความสำเร็จระดับนั้นทำให้ Rockstar มีเวลาในการพัฒนาภาคต่ออย่างเต็มที่ ซึ่งยิ่งเพิ่มกระแสความตื่นเต้นให้กับ GTA ภาคถัดไป เหตุการณ์ข้อมูลรั่วไหลครั้งใหญ่และการเลื่อนวางจำหน่ายหลายครั้งยิ่งตอกย้ำกระแสนี้ให้รุนแรงขึ้น ในช่วงเวลาที่อุตสาหกรรมวิดีโอเกมส่วนใหญ่กำลังเผชิญกับความยากลำบาก GTA ภาคใหม่นี้กลับยืนหยัดอย่างโดดเด่น เป็นปรากฏการณ์ทางวัฒนธรรมที่ยิ่งใหญ่จนแทบทุกคนต้องหลีกทางให้ การเตรียมตัวสู่การเปิดตัว Grand Theft Auto VI นั้นไม่เหมือนกับสิ่งที่อุตสาหกรรมเกมเคยพบเห็นมาก่อน", "Sony ได้ยืนยันว่าการดาวน์โหลดแพตช์ขนาด 1.267GB เป็นสิ่งที่จำเป็นต้องทำเพื่อเล่นเกม Grand Theft Auto ภาคใหม่นี้เมื่อเปิดตัวในเที่ยงคืนวันนี้ เช่นเดียวกับแพตช์ Firmware ส่วนใหญ่ของ PlayStation เรายังไม่ทราบแน่ชัดว่ามันทำหน้าที่อะไรบ้าง นอกเหนือไปจาก “การแก้ไขความปลอดภัยบางประการสำหรับซอฟต์แวร์ระบบ”", "แม้ Rockstar จะยังไม่ได้ประกาศอย่างเป็นทางการว่าใครเป็นผู้ให้เสียงตัวละครหลักทั้งสองใน GTA VI แต่ในวิดีโอรายชื่อผู้เข้าชิงรางวัลจากงาน The Game Awards ระบุว่า Manni L. Perez ได้รับการเสนอชื่อเข้าชิงรางวัล Best Performance จากผลงานการแสดงในเกมนี้", "ทั้งนี้ GTA VI ได้รับการเสนอชื่อเข้าชิงรางวัลถึง 8 สาขา ซึ่งมากที่สุดในบรรดาเกมทั้งหมด รวมถึงสาขาเกมยอดเยี่ยมแห่งปี (Game of the Year) อีกด้วย", "ในอีกด้านหนึ่ง Arion Kurtaj สมาชิกกลุ่มอาชญากรรมไซเบอร์ Lapsus$ ผู้ที่ปล่อยวิดีโอเกมเพลย์ของ Grand Theft Auto VI จำนวน 90 คลิปในปี 2022 และแฮ็กบริษัทใหญ่หลายแห่ง ได้ให้การรับสารภาพแล้วเมื่อวันจันทร์ที่ผ่านมา ตามรายงานของสำนักงานอัยการสูงสุด (CPS) แห่งสหราชอาณาจักร", "Kurtaj ซึ่งปัจจุบันอายุ 21 ปี ได้แฮ็กระบบของ BT/EE ในช่วงระหว่างเดือนสิงหาคมถึงพฤศจิกายน 2021 และเริ่มตั้งแต่ต้นเดือ
