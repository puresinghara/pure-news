jpg", "https://sm.ign.com/ign_jp/screenshot/default/205365-0_h41z.jpg"], "videos": ["https://www.youtube.com/embed/EP1jKrxbuBU"], "review_score": "10", "published_ts": 1794560862, "published_at": "2026-11-13T09:07:42Z", "published_th": "13 พ.ย. 2026 • 16:07 น.", "category_hint": "Review", "sub_tag": "ZELDA"}, {"id": 1794801668377, "guid": "https://jp.ign.com/monster-hunter-outlanders/84598", "original_title": "『モンスターハンターアウトランダーズ』レビュー モバイル向け「モンハン」の新たな狩猟体験は、シリーズの真髄を受け継いでいるものの、ガチャの影からは逃れられない", "thai_title": "รีวิว Monster Hunter Outlanders: การล่าบนมือถือที่ถอดแบบความสนุกมาเต็มสูบ แต่ยังติดหล่มระบบกาชาและเมนูที่ซับซ้อน", "tag": "Review", "bullet_points": ["Monster Hunter Outlanders นำเสนอประสบการณ์การล่าที่ถอดแบบมาจาก Monster Hunter: World ได้อย่างน่าประทับใจบนอุปกรณ์พกพา", "ระบบการต่อสู้ถูกปรับให้เรียบง่ายและเข้าถึงได้ง่ายขึ้น แต่ยังคงความตื่นเต้นและจังหวะการเล่นที่เป็นเอกลักษณ์ของซีรีส์ไว้ได้", "ตัวเกมมีเนื้อหาที่กว้างขวางและกราฟิกที่สวยงามระดับสูง แต่ต้องแลกมาด้วยระบบการจัดการที่ซับซ้อนเกินจำเป็น", "ระบบกาชาและข้อจำกัดด้านเวลา (Time-gated) รวมถึงการบริหารจัดการเมนูที่ยุ่งยาก กลายเป็นอุปสรรคสำคัญที่บั่นทอนความสนุกของเกม", "สรุปคะแนนรีวิวจาก IGN อยู่ที่ 7/10 (Good) โดยมองว่าเป็นเกมที่สนุกแต่ยังไม่ถึงระดับมาตรฐานของภาคคอนโซล"], "full_paragraphs": ["หากจะมีสิ่งใดที่นิยามความเป็น 'Monster Hunter' ได้ดีที่สุด สิ่งนั้นก็คือการ 'Grind' หรือการวนเวียนทำภารกิจซ้ำๆ นับตั้งแต่ถือกำเนิดขึ้น ซีรีส์ยอดฮิตนี้ได้ยอมรับแนวคิดเรื่องการฟาร์มและยกระดับมันให้กลายเป็นวงจรการเล่นที่สนุกจนน่าเสพติด การเล่นซ้ำและการสร้างนิสัยในการล่าจึงเป็นองค์ประกอบที่ขาดไม่ได้ เมื่อมองในมุมนี้ การที่เกมมือถือในรูปแบบกาชาซึ่งผสมผสานทั้งสกุลเงินต่างๆ และเกจเวลาเข้ามาในประสบการณ์การสะสมและการฟาร์มนั้น จึงดูเป็นเรื่องที่สมเหตุสมผล อย่างไรก็ตาม สิ่งที่ทำให้ผมประหลาดใจที่สุดใน 'Monster Hunter Outlanders' คือการที่ตัวเกมสามารถอัดแน่นประสบการณ์ Monster Hunter ที่เต็มรูปแบบและจริงจังลงไปในสมาร์ทโฟนและแท็บเล็ตได้ แม้ในท้ายที่สุดตัวเกมจะถูกกลบไปด้วยสกุลเงินจำนวนมหาศาลที่ต้องจัดการและอุปสรรคจากระบบกาชา แต่มันก็มีเนื้อหาเพียงพอที่จะสร้างความพึงพอใจให้กับผู้ที่โหยหาประสบการณ์ Monster Hunter เพิ่มเติม หรือผู้ที่ต้องการเกมแนว Action RPG คุณภาพสูงบนมือถือ", "เช่นเดียวกับเกม Monster Hunter ภาคอื่นๆ เรื่องราวในภาคนี้จะเน้นไปที่กลุ่มนักสำรวจผู้กล้าหาญที่สังกัดกิลด์นักผจญภัย พวกเขาถูกส่งไปยัง 'เกาะไอโซเลเซีย' (Isolesia) เกาะที่ยังไม่เคยถูกสำรวจ เพื่อตรวจสอบแร่ที่เรียกว่า '融石' (Melting Stone) และผลกระทบของมันที่มีต่อมอนสเตอร์สายพันธุ์ต่างๆ หลังจากจบช่วงแนะนำที่เต็มไปด้วยฉากแอ็กชันสั้นๆ ผู้เล่นจะถูกปล่อยลงสู่เกาะและสามารถเลือกได้ว่าจะสำรวจพื้นที่แรกอย่างอิสระหรือดำเนินเนื้อเรื่องตามใจชอบ แต่เช่นเดียวกับภาคหลัก ช่วง 20 ชั่วโมงแรกของ Outlanders จะมีการแนะนำที่ค่อนข้างละเอียดและเต็มไปด้วยบทสอนเล่น (Tutorial) ที่ดูเหมือนจะไม่มีวันสิ้นสุด ซึ่งธรรมชาติของการเป็นเกมมือถือยิ่งทำให้แนวโน้มนี้ชัดเจนขึ้น เนื่องจากจำเป็นต้องแนะนำระบบต่างๆ ให้ผู้เล่นเข้าใจ ทั้งโหมดเกมกว่า 10 โหมด ระบบกาชาที่หลากหลาย และสกุลเงินต่างๆ ที่ใช้ในการเสริมความแข็งแกร่งให้กับนักผจญภัย", "หากจะนิยามเกมนี้ให้สั้นที่สุด มันคือการนำระบบการต่อสู้ของ 'Monster Hunter: World' มาลดทอนความซับซ้อนและยัดทุกอย่างลงในเกมมือถือ ผมคงเน้นย้ำไม่พอว่า Outlanders มีความคล้ายคลึงกับ 'World' มากเพียงใดในทุกด้าน ตั้งแต่โครงสร้างโดยรวมไปจนถึงเนื้อเรื่อง นอกจากนี้ตัวเกมยังมีแนวทางที่น่าสนใจ คือในขณะที่มีตัวละครเอกที่ผู้เล่นสร้างเอง แต่ตัวละครที่ปรากฏในเนื้อเรื่องก็ทำหน้าที่เป็นตัวละครในตู้กาชาด้วย แม้เนื้อเรื่องโดยรวมจะดูเป็นสูตรสำเร็จไปบ้าง แต่โลกของ Outlanders ก็มีสิ่งที่ต้องทำมากมาย แม้จะไม่ใช่เกม Open World แบบดั้งเดิม แต่โครงสร้างของมันเหมือนกับ Monster Hunter: World หรือ Monster Hunter Wilds อย่างไม่มีผิดเพี้ยน คือมีโซนกว้างใหญ่ให้สำรวจ ในแต่ละโซนผู้เล่นสามารถล่ามอนสเตอร์ได้ตามธรรมชาติโดยไม่ต้องเริ่มเควสต์ รวมถึงการเก็บทรัพยากร มินิเกมต่างๆ เช่น การขโมยมินิเกมจากมอนสเตอร์บินได้ และเควสต์รองอีกนับไม่ถ้วน", "สิ่งที่ทำให้ผมประหลาดใจที่สุดคือสเกลของโลกที่ไม่มีการลดทอนคุณภาพลงเลย มันมีขนาดที่ไม่แพ้เกมระดับ AAA ของซีรีส์หลัก กราฟิกสวยงามจนน่าทึ่งและทำงานได้อย่างลื่นไหล บน iPhone 14 Plus ผมสามารถรักษาเฟรมเรตที่ 45fps ได้อย่างเสถียรในการตั้งค่าระดับสูง และแทบไม่มีอาการกระตุกแม้ในการต่อสู้ที่ดุเดือด การสำรวจโลกก็น่าดึงดูดไม่แพ้ภาคหลัก มีตัวเลือกมากมายในการตั้งแคมป์และสิ่งอำนวยความสะดวก ทำให้การเดินทางและการเก็บไอเทมง่ายขึ้น การตั้งแคมป์จะปลดล็อกจุด Fast Travel และจุดพักผ่อน การใช้เครื่องดีดตัว (Catapult) ช่วยให้นักผจญภัยใช้เครื่องร่อนบินไปในอากาศได้อย่างรวดเร็ว และสิ่งอำนวยความสะดวกในการเก็บรวบรวมวัสดุก็จะคอยเก็บไอเทมหายากให้เราอย่างต่อเนื่อง", "พื้นฐานของการต่อสู้ยังคงเดิม คือการชิงจังหวะ การตัดสินใจว่าจะสลับระหว่างการโจมตีและการป้องกันเมื่อใดคือหัวใจสำคัญ จังหวะเหล่านี้และน้ำหนักของการโจมตีแต่ละครั้งคือสิ่งที่ทำให้ Monster Hunter แตกต่างจากเกมแอ็กชันอื่น ซึ่งในภาคนี้ก็ยังคงอยู่ครบถ้วน อย่างไรก็ตาม ข้อจำกัดของเกมมือถือปรากฏชัดในรายละเอียดของการควบคุมและการจัดการสถานะของนักผจญภัยที่มีระบบมากมาย โดยเนื้อแท้แล้ว Outlanders เป็นเกม Monster Hunter แบบจัดทีม (Squad-based) ที่ผู้เล่นต้องจัดปาร์ตี้ระหว่างตัวละครหลักกับตัวละครที่สุ่มได้จากกาชา (สามารถเล่นแบบมัลติเพลเยอร์กับผู้เล่นอื่นได้จริง) นอกจากนี้ยังสามารถสลับมาเล่นตัวละครกาชาแต่ละตัวได้ ซึ่งแต่ละตัวจะมีชุดท่าไม้ตายและสกิลเฉพาะตัว เช่น 'เครส' (Cress) ที่ใช้ดาบคู่ที่เป็นกรงเล็บและมีท่าโจมตีแบบสว่าน หรือ 'บริกส์' (Briggs) ที่ใช้ดาบใหญ่ยิงดอกไม้ไฟออกมาเหมือนการแสดงโชว์ ตัวละครที่หลากหลายเหล่านี้เป็นหนึ่งในสิ่งที่ผมชอบที่สุด เพราะดีไซน์มีความฉูดฉาดแบบโทคุซัทสึ (Tokusatsu) ซึ่งเข้ากับบรรยากาศตลกขบขันของ Monster Hunter ได้เป็นอย่างดี", "การที่ตัวละครแต่ละตัวมีชุดท่าที่แตกต่างกันช่วยลดความน่าเบื่อของการล่าซ้ำๆ ได้ดี แต่ในทางกลับกัน จำนวนอาวุธใน Outlanders ก็มีเพียง 8 ประเภทเท่านั้น ซึ่งน้อยกว่าภาคหลังๆ อย่างเห็นได้ชัด โดยเฉพาะการที่ไม่มี 'Hunting Horn' หรือ 'Insect Glaive' ถือเป็นจุดที่น่าสังเกต นอกจากนี้ความรู้สึกในการเล่นโดยรวมยังใกล้เคียงกับเวอร์ชันย่อส่วนของ Monster Hunter: World ที่ลดทอนความซับซ้อนลง เช่น การใช้แมลงแสง (Flashfly) เพื่อทำให้มอนสเตอร์ชะงัก ซึ่งหลายอย่างถูกปรับให้แสดงไอคอนง่ายๆ บนหน้าจอเมื่อเข้าใกล้", "การเปลี่ยนแปลงที่สำคัญอีกอย่างคือการมีโหมดควบคุม 2 แบบ คือ 'Starting' และ 'Hunting' ในโหมด 'Starting' การควบคุมจะถูกรวมเหลือเพียง 3 ปุ่มคือ 'โจมตี' 'หลบหลีก' และ 'ท่าไม้ตาย' ซึ่งจะเปลี่ยนฟังก์ชันอัตโนมัติและเป็นธรรมชาติ เช่น หน้าไม้จะเปลี่ยนกระสุนที่เหมาะสมที่สุดให้เอง หรือปุ่มหลบหลีกอาจเปลี่ยนเป็นปุ่มป้องกันในบางสถานการณ์ ส่วนโหมด 'Classic' จะใกล้เคียงกับ Monster Hunter ทั่วไป ซึ่งแม้จะเล่นบนหน้าจอสัมผัสได้ดีกว่าที่คิด แต่ผมขอแนะนำให้ใช้โหมด 'Starting' มากกว่าหากไม่มีจอยคอนโทรลเลอร์ เพราะโหมด 'Classic' มีปุ่มที่ต้องกดเยอะเกินไปจนควบคุมลำบาก", "ข่าวดีอีกประการคือ Outlanders ยังคงทำผลงานได้ดีเยี่ยมในด้านการออกแบบมอนสเตอร์และความหลากหลาย ซึ่งเป็นสิ่งที่ละเลยไม่ได้ มีมอนสเตอร์จากซีรีส์เก่าๆ ปรากฏตัวมากมาย และแต่ละตัวยังมีร่างที่สองที่แข็งแกร่งขึ้นเรียกว่า '融光種' (Melting Light Species) ซึ่งมีท่าโจมตีและพฤติกรรมใหม่ๆ นอกจากนี้ความสนุกที่เกิดจากเหตุการณ์ไม่คาดฝันแบบใน World หรือ Wilds ก็ยังคงอยู่ เช่น การที่มอนสเตอร์นักล่าที่แข็งแกร่งกว่าบุกเข้ามากลางคัน ทำให้ผู้เล่นต้องปรับตัวตามสถานการณ์", "การลดทอนระบบการต่อสู้ทำให้วิธีการสู้กับมอนสเตอร์เปลี่ยนไป แม้จะยังปีนกำแพงได้เหมือนเดิม แต่เนื่องจากไม่มีท่ากระโดดเฉพาะ ทำให้การต่อสู้ส่วนใหญ่เกิดขึ้นบนพื้นดิน แม้ท่าไม้ตายของตัวละครจะช่วยเพิ่มกลยุทธ์ใหม่ๆ แต่บางครั้งผมก็ยังโหยหาความตื่นเต้นแบบเดิมๆ อย่างการกระโดดเกาะหางของ 'ราทาลอส' (Rathalos) อย่างไรก็ตาม โดยรวมแล้วระบบที่ถูกลดทอนนี้ก็เหมาะสมกับทิศทางของเกม คือการมอบประสบการณ์ที่สนุกสนานในเวลาสั้นๆ เหมาะสำหรับการเล่นระหว่างเดินทางหรือรอคิว", "ระบบหลักของเกมทำงานได้ดี แต่ปัญหาใหญ่คือเรื่องการเติมเงินและระบบกาชา อย่างที่กล่าวไปว่า Monster Hunter เน้นการฟาร์ม แต่ Outlanders ยังไม่ประสบความสำเร็จนักในการทำให้การฟาร์มนั้นสนุก ระบบสกุลเงินและระบบโดยรวมของเกมนั้นเข้าใจยากมาก แม้ผมจะคุ้นเคยกับเกมกาชามา 20 ปี แต่ผมก็ยังลำบากในการทำความเข้าใจองค์ประกอบต่างๆ ที่ต้องจัดการ ไม่ว่าจะเป็นการอัปเกรด 'Souvenir' การปลดล็อกขีดจำกัด การเพิ่มระดับนิเวศวิทยา ระบบเลเวลของพาลีโกะ ระบบทักษะ (Skill) และระบบ 'Drawing' ที่ได้รับไอเทมเป็นรูปการ์ดมอนสเตอร์", "นอกจากนี้ยังมี 'อันดับนักผจญภัย' 'หลักฐานแห่งการฝึกฝน' และ 'สมุดบันทึกการสำรวจ' ซึ่งทั้งหมดเป็นระบบการเติบโตที่แยกจากกัน รวมถึงระบบรางวัลตามฤดูกาลและโหมดเกมอีกมากมาย เช่น 'การล่าในรัง' 'ภารกิจล่า' ที่ใช้พลังงาน รวมถึงโหมด 'การทดสอบการเดินทาง' 150 ด่าน และ 'อารีน่ากิลด์' ซึ่งต้องยอมรับว่าเกมมีสิ่งที่ต้องทำเยอะมากจนแม้เล่นไป 30 ชั่วโมงก็ยังมีโหมดใหม่ๆ ปลดล็อกออกมาเรื่อยๆ ระบบเหล่านี้มักจะกลายเป็นอุปสรรคต่อการเล่นแอ็กชัน เพราะต้องคอยกดเมนูไปมาจนเสียจังหวะการเล่น", "ในแง่ของความใจดีของระบบกาชา Outlanders ถือว่าอยู่ในระดับที่ยอมรับได้ในช่วง 30 ชั่วโมงแรก แต่หลังจากนั้นจะเริ่มเจอกำแพงความยาก โดยเฉพาะเมื่อต้องปลดล็อกและอัปเกรดตัวละครกาชา แม้จะเล่นต่อได้โดยไม่เติมเงิน แต่การเติมเงินจะช่วย 'ปรับแต่ง' ประสบการณ์การเล่นให้ดีขึ้นอย่างเห็นได้ชัด การต้องวนลูปทำภารกิจเพื่อปลดล็อกชุดหรือตัวละครพิเศษในอีเวนต์ทำให้เห็นจุดนี้ชัดเจนขึ้น", "โดยสรุป Monster Hunter Outlanders เป็นเกมที่ยัดเยียดองค์ประกอบมากเกินไป มีระบบจุกจิกของเกมมือถือที่ขัดขวางความสนุกของเกมเพลย์หลัก แต่ในขณะเดียวกันก็น่าชื่นชมในความทะเยอทะยานที่สามารถย่อส่วนความยอดเยี่ยมของ Monster Hunter: World มาไว้ในรูปแบบที่กะทัดรัดได้ ระบบการต่อสู้ถูกปรับให้เข้าถึงง่ายแต่ยังคงความตึงเครียดไว้ได้ แม้จะไม่ถึงระดับมาตรฐานของภาคคอนโซล แต่หากปรับความคาดหวังให้เหมาะสม คุณจะพบว่าจิตวิญญาณของ Monster Hunter ยังคงมีชีวิตอยู่ในเกมนี้"], "link": "https://jp.ign.com/monster-hunter-outlanders/84598/", "canonical_link": "https://jp.ign.com/monster-hunter-outlanders/84598", "cover_image_url": "https://sm.ign.com/t/ign_jp/review/m/monster-hu/monster-hunter-outlanders-review_frd2.1200.jpg", "gallery_images": [], "videos": ["https://www.youtube.com/embed/wjFrf1zCDA8", "https://www.youtube.com/embed/HRWBk_cOrTc", "https://www.youtube.com/embed/JdmgFLHUsjs"], "review_score": "7", "published_ts": 1794548994, "published_at": "2026-11-13T05:49:54Z", "published_th": "13 พ.ย. 2026 • 12:49 น.", "category_hint": "Review", "sub_tag": "MONSTER HUNTER"}, {"id": 1794822849510, "guid": "837991a7-5fee-4ff3-8d8a-36055edd9d48", "original_title": "Monster Hunter Outlanders Review", "thai_title": "รีวิว Monster Hunter Outlanders: การผจญภัยบนมือถือที่ถอดแบบความสนุกจากคอนโซล แต่ติดหล่มระบบกาชาและเมนูที่ซับซ้อน", "tag": "Review", "sub_tag": "MONSTER HUNTER", "bullet_points": ["Monster Hunter Outlanders นำเสนอประสบการณ์การล่ามอนสเตอร์ที่ครบเครื่องและสมบูรณ์แบบบนมือถือ โดยถอดแบบโครงสร้างมาจาก Monster Hunter World", "ระบบการเล่นถูกปรับให้เข้ากับมือถือด้วยโหมดควบคุมแบบ Adventure ที่เรียบง่าย และ Classic สำหรับผู้ที่ต้องการความแม่นยำ", "ตัวเกมมีกราฟิกที่สวยงามและลื่นไหล โดยสามารถรันบน iPhone 14 Plus ได้ที่ 45fps ในการตั้งค่าระดับสูง", "จุดอ่อนสำคัญคือระบบการจัดการที่ซับซ้อนเกินไป ทั้งระบบกาชา ระบบอัปเกรดตัวละคร และสกุลเงินจำนวนมหาศาลที่ทำให้ผู้เล่นต้องเสียเวลากับเมนูมากกว่าการล่า", "แม้จะเป็นเกมที่เล่นได้ฟรีและมีความใจกว้างในช่วงแรก แต่เมื่อถึงจุดหนึ่งผู้เล่นจะพบกับกำแพงที่ต้องใช้การฟาร์มอย่างหนักหรือการใช้เงินจริงเพื่อเร่งความคืบหน้า"], "full_paragraphs": ["หากมีแนวคิดเดียวที่นิยามความเป็น Monster Hunter ได้ดีที่สุด นั่นคือ 'การฟาร์ม' (Grind) แฟรนไชส์ระดับเมกะฮิตของ Capcom ตั้งแต่ยุค PSP เติบโตมาได้เพราะการโอบรับแนวคิดเรื่องการฟาร์มและเปลี่ยนมันให้กลายเป็นวงจรการเล่นที่สนุกจนน่าติดใจ ความซ้ำซากและนิสัยที่คุ้นเคยเป็นส่วนสำคัญของซีรีส์ ดังนั้นจึงไม่แปลกที่รูปแบบเกมกาชาบนมือถือจะถูกนำมาปรับใช้กับ Monster Hunter ในที่สุด โดยการนำสกุลเงินและเกจเวลาต่างๆ เข้ามาใส่ในประสบการณ์การสะสมและการฟาร์ม แต่สิ่งที่น่าประหลาดใจที่สุดสำหรับผมเกี่ยวกับ Monster Hunter Outlanders คือการที่มันเป็นเกม Monster Hunter ที่สมบูรณ์แบบและครบถ้วนในรูปแบบที่ย่อส่วนลงมาบนโทรศัพท์และแท็บเล็ต แม้ว่าในท้ายที่สุดมันจะถูกฝังอยู่ภายใต้กองทัพของสกุลเงินที่ต้องคอยติดตามและอุปสรรคจากระบบกาชา แต่มันก็ยังมีเนื้อหาที่เพียงพอสำหรับผู้ที่โหยหา Monster Hunter หรือเกมแนว Action RPG คุณภาพดีบนมือถือ", "เช่นเดียวกับเกม Monster Hunter ส่วนใหญ่ Outlanders ติดตามกลุ่มนักสำรวจจากกิลด์นักผจญภัย (Adventurer's Guild) ซึ่งในครั้งนี้ถูกส่งไปยังเกาะลึกลับที่ชื่อว่า Aesolan เพื่อตรวจสอบแร่ที่เรียกว่า Radiantate และอิทธิพลของมันที่มีต่อมอนสเตอร์สายพันธุ์ต่างๆ หลังจากบทนำที่เต็มไปด้วยแอ็กชัน คุณจะถูกปล่อยตัวลงบนเกาะอย่างอิสระเพื่อสำรวจสภาพแวดล้อมแรกหรือทำภารกิจเนื้อเรื่องตามที่คุณต้องการ แต่ก็เช่นเดียวกับเกม Monster Hunter ส่วนใหญ่ ช่วง 20 ชั่วโมงแรกของ Outlanders จะถูกชี้นำอย่างมากและเต็มไปด้วยบทสอนเล่นที่ดูเหมือนไม่มีวันสิ้นสุด ซึ่งถูกซ้ำเติมด้วยธรรมชาติของการเป็นเกมมือถือที่ต้องแนะนำโหมดการเล่นนับครึ่งโหล ระบบสุ่มตัวละคร สกุลเงินสำหรับการเพิ่มพลังให้นักผจญภัยของคุณ และอื่นๆ อีกมากมาย", "วิธีที่กระชับที่สุดในการอธิบาย Outlanders คือการนำ Monster Hunter World มาปรับระบบการต่อสู้ให้คล่องตัวขึ้นแล้วยัดทุกอย่างลงในเกมมือถือ ผมแทบไม่อยากเชื่อเลยว่า Outlanders จะมีความคล้ายคลึงกับ World ในทุกด้านมากขนาดนี้ แม้กระทั่งโครงสร้างทั่วไปและเนื้อเรื่อง มันใช้วิธีการที่น่าสนใจโดยการเติมเต็มเนื้อเรื่องด้วยตัวละครกลุ่มหนึ่งที่ทำหน้าที่เป็นตัวละครกาชา แม้ว่าคุณจะมีตัวละครหลักที่คุณสร้างขึ้นเองก็ตาม แม้ว่าเนื้อเรื่องโดยรวมจะรู้สึกซ้ำซากและทั่วไป แต่โลกของ Outlanders ก็ยังเต็มไปด้วยสิ่งที่น่าทำ แม้จะไม่ใช่เกม Open World แบบดั้งเดิม แต่มันใช้กรอบเดียวกับ Monster Hunter World และ Wilds ซึ่งมอบโซนขนาดใหญ่ให้คุณสำรวจ ในโซนเหล่านี้ คุณสามารถล่ามอนสเตอร์ได้ตามธรรมชาติ (โดยไม่ต้องเริ่มภารกิจ) รวบรวมทรัพยากร มีส่วนร่วมในมินิเกมเล็กๆ เช่น เกมจังหวะที่คุณต้องขโมยสมบัติของมอนสเตอร์บินได้ และทำภารกิจย่อยต่างๆ", "สิ่งที่น่าประหลาดใจที่สุดของผมเกี่ยวกับ Outlanders คือขอบเขตของโลกที่ดูไม่มีการประนีประนอม ซึ่งสอดคล้องกับเกม Monster Hunter ภาคหลัก โดยได้รับการสนับสนุนจากข้อเท็จจริงที่ว่าเกมนี้ดูสวยงามน่าทึ่งและทำงานได้อย่างราบรื่น บน iPhone 14 Plus ผมสามารถรันเกมในการตั้งค่า High ด้วยเฟรมเรตที่เสถียรที่ 45fps และแทบไม่มีอาการกระตุกเลยแม้แต่ในระหว่างการต่อสู้ที่ดุเดือด", "การสำรวจโลกให้ความรู้สึกที่น่าหลงใหลไม่ต่างจากเกม Monster Hunter ภาคหลัก ตัวเลือกต่างๆ สำหรับการสร้างแคมป์และอุปกรณ์ในขณะที่คุณสำรวจโลกทำให้ทั้งการเดินทางและการรวบรวมไอเทมง่ายขึ้น แคมป์จะปลดล็อกจุด Fast Travel และสถานที่พักผ่อน เครื่องยิงจะส่งนักผจญภัยของคุณบินไปบนเครื่องร่อนด้วยความเร็วสูง และตัวเก็บทรัพยากรจะคอยดูดซับไอเทมล้ำค่าที่คุณต้องการอยู่ตลอดเวลา", "การต่อสู้ยังคงเน้นไปที่จังหวะการรุกและรับ การรู้ว่าเมื่อใดควรเปลี่ยนจากการโจมตีเป็นการป้องกัน และการชาร์จโจมตีในเวลาที่เหมาะสม จังหวะและน้ำหนักของการต่อสู้เป็นสิ่งที่ทำให้ Monster Hunter แตกต่างจากเกมแอ็กชันอื่นๆ มาโดยตลอด และมันยังคงมีอยู่ในเกมนี้ แต่จุดที่คุณจะเห็นข้อจำกัดของมือถือคือรายละเอียดของการควบคุมการต่อสู้และระบบต่างๆ มากมายที่ใช้เพื่อปรับปรุงค่าสถานะของนักผจญภัยของคุณ", "โดยพื้นฐานแล้ว Outlanders เป็นเกม Monster Hunter แบบทีมที่คุณสร้างปาร์ตี้ประกอบด้วยตัวละครหลักของคุณและตัวละครที่คุณสุ่มได้ (สามารถเล่นมัลติเพลเยอร์กับผู้เล่นจริงคนอื่นได้เช่นกัน) แต่คุณยังสามารถเล่นเป็นตัวละครกาชาแต่ละตัวที่มีชุดท่าไม้ตาย อัลติเมท และความสามารถเฉพาะตัวได้ ตัวอย่างเช่น Keres ใช้ดาบคู่ที่เป็นกรงเล็บ ทำให้เธอมีชุดทักษะที่แยกออกมาต่างหาก รวมถึงท่าโจมตีแบบสว่านคล้าย Wolverine ในขณะที่ Luxheart มีดาบสองมือที่เขาสามารถเร่งเครื่องเพื่อยิงดอกไม้ไฟออกมา ทำให้การโจมตีแต่ละครั้งของเขาเหมือนการแสดงเล็กๆ ตัวละครที่หลากหลายเหล่านี้เป็นหนึ่งในส่วนที่ผมชอบที่สุดของ Outlanders เนื่องจากการออกแบบของพวกเขามีความโดดเด่นแบบโทคุซัทสึ (Tokusatsu) ซึ่งเข้ากับความตลกขบขันโดยรวมของ Monster Hunter ได้เป็นอย่างดี", "การมีชุดท่าที่แตกต่างกันช่วยลดความน่าเบื่อของการล่าซ้ำๆ และการฟาร์มได้มาก อย่างไรก็ตาม Outlanders มีประเภทอาวุธน้อยกว่าเกมภาคหลังๆ โดยรวมแล้วมีทั้งหมด 8 ประเภท ซึ่งอาวุธที่หายไปอย่างเห็นได้ชัดคือ Hunting Horn และ Insect Glaive และโดยรวมแล้ว Outlanders เล่นเหมือนเวอร์ชันที่ลดทอนความซับซ้อนของ World ลงเล็กน้อยในแง่ของการปรับปรุงเกมเพลย์ให้คล่องตัวขึ้น ตัวอย่างเช่น องค์ประกอบของโลกที่เกิดขึ้นเอง เช่น การใช้ Flashfly เพื่อทำให้มอนสเตอร์มึนงง จะเป็นเพียงไอคอนง่ายๆ ที่ปรากฏบนหน้าจอหากคุณอยู่ใกล้", "การเปลี่ยนแปลงที่ใหญ่กว่าคือระบบการควบคุมสองแบบของ Outlanders ได้แก่ Adventure และ Classic ระบบ Adventure จะย่อทุกอย่างลงเหลือเพียงสามปุ่ม คือ Attack, React และ Burst โดยจะเปลี่ยนปุ่มเหล่านี้โดยอัตโนมัติและตามสัญชาตญาณขึ้นอยู่กับสถานการณ์ ตัวอย่างเช่น Bowgun จะเปลี่ยนกระสุนตามสิ่งที่ได้ผลที่สุดในขณะนั้น หรือปุ่ม React อาจกลายเป็นปุ่มป้องกันแทนที่จะเป็นการหลบ", "Tom Marks ได้กล่าวไว้เมื่อวันที่ 24 กุมภาพันธ์ 2025 ว่า: 'Monster Hunter Wilds ยังคงขัดเกลาจุดที่ขรุขระของซีรีส์อย่างชาญฉลาด ลดแรงเสียดทานให้เหลือน้อยที่สุดเท่าที่จะเป็นไปได้ เพื่อไม่ให้ขวางกั้นคุณจากการหยิบอาวุธที่สนุกสนานและปักมันลงบนตัวมอนสเตอร์ แต่ในภารกิจที่จะทำให้ Monster Hunter เข้าถึงได้ง่ายขึ้น Wilds ได้ลดทอนความท้าทายลงมากจนผมแทบไม่ต้องเจาะลึกระบบอุปกรณ์ที่ซับซ้อนเลยในครั้งนี้เพื่อที่จะกลายเป็นนักล่าระดับสุดยอด การต่อสู้ที่ยืดหยุ่นมากขึ้นของมันเป็นหนึ่งในสิ่งที่สนุกที่สุดที่ผมเคยสัมผัสกับซีรีส์นี้ แต่เหมือนกับพายุสายฟ้าที่โหมกระหน่ำในทะเลทรายที่สวยงาม มันจะเผาไหม้อย่างสว่างไสวแต่เพียงชั่วครู่ จนกว่า Capcom จะปล่อยสัตว์ร้ายระดับเอนด์เกมออกมาท้าทายเราจริงๆ'", "โหมดควบคุมแบบ Classic ให้คุณควบคุมได้อย่างละเอียดมากขึ้นด้วยปุ่มเฉพาะในแบบฉบับของ Monster Hunter ทั่วไป มันทำงานได้ดีบนหน้าจอสัมผัส อาจจะดีกว่าที่ผมคาดไว้ด้วยซ้ำ แต่ถ้าคุณเลือกใช้การควบคุมแบบสัมผัส ผมขอแนะนำอย่างยิ่งให้ใช้ระบบควบคุมแบบ Adventure เพียงเพราะ Classic นั้นจัดการได้ยากหากไม่มีอุปกรณ์เสริมแบบจอยเกม ผมพบว่าวิธีที่ดีที่สุดในการเล่น Outlanders คือการใช้ Classic ร่วมกับคอนโทรลเลอร์ แต่แน่นอนว่านั่นอาจไม่ใช่ทางเลือกสำหรับทุกคนตลอดเวลา", "ข่าวดีอีกประการหนึ่งคือ Outlanders ยังคงโดดเด่นในแง่ของการออกแบบมอนสเตอร์และความหลากหลาย ซึ่งเป็นสิ่งที่จำเป็นต้องทำให้ถูกต้อง มีสิ่งมีชีวิตจำนวนมากจากทั่วทั้งซีรีส์ และมอนสเตอร์แต่ละตัวจะมีร่างที่สองที่ทรงพลังกว่าเรียกว่า 'Radiant' ซึ่งเพิ่มการโจมตีและพฤติกรรมใหม่ๆ ที่คุณต้องรับมือ Outlanders ยังคงมีองค์ประกอบที่ยอดเยี่ยมของ World และ Wilds ที่นักล่าที่ใหญ่กว่าอาจเดินเข้ามากลางการต่อสู้ของคุณ บังคับให้คุณต้องปรับตัวในทันที", "ระบบการควบคุมและการต่อสู้ที่เรียบง่ายหมายถึงการเปลี่ยนแปลงครั้งใหญ่ในวิธีการที่คุณเข้าหามอนสเตอร์ แม้ว่าคุณจะยังสามารถปีนกำแพงได้โดยการวิ่งเข้าหา แต่ไม่มีปุ่มกระโดดโดยเฉพาะ ดังนั้นคุณจึงถูกจำกัดอยู่บนพื้นในการต่อสู้เป็นส่วนใหญ่ ท่าอัลติเมทและทักษะจากตัวละครคู่หู เช่น ปืนใหญ่ที่ยิงตาข่าย ช่วยเพิ่มลูกเล่นในการต่อสู้บนพื้นดิน แต่บางครั้งผมก็แค่อยากกระโดดขึ้นไปบนหางของ Rathalos เพื่อสัมผัสช่วงเวลาที่น่าตื่นเต้นที่ผมชอบจากซีรีส์นี้ โดยรวมแล้ว ประสบการณ์การต่อสู้ที่คล่องตัวนั้นเหมาะกับสิ่งที่ Outlanders ต้องการนำเสนอ นั่นคือการเล่นสั้นๆ ที่น่าพึงพอใจ อาจจะเป็นภารกิจเดียวบนรถไฟ หรือในขณะที่คุณกำลังรอคิวที่ไหนสักแห่ง", "ระบบหลักหลายอย่างของ Outlanders ทำงานร่วมกันได้ดี แต่คำถามที่ใหญ่กว่าคือระบบการสร้างรายได้และกาชาทำงานอย่างไร อย่างที่ผมกล่าวไปก่อนหน้านี้ Monster Hunter เกี่ยวกับการฟาร์มมาโดยตลอด แต่การหาวิธีที่ไม่เหมือนใครในการทำให้การฟาร์มนั้นสนุกเป็นเรื่องสำคัญ น่าเสียดายที่ Outlanders ไม่ประสบความสำเร็จในส่วนที่สองเสมอไป เมื่อผมบอกว่าสกุลเงินและระบบโดยรวมของเกมนี้อาจสร้างความสับสนได้ ผมหมายความตามนั้นจริงๆ ผมไม่ใช่คนแปลกหน้าสำหรับเกมกาชา ผมเห็นวิวัฒนาการของพวกมันตลอดสองทศวรรษที่ผมเล่นมา แต่แม้แต่ผมก็ยังพบว่ามันยากที่จะติดตามทุกอย่างที่ต้องจัดการใน Outlanders", "นอกเหนือจากอุปกรณ์และคู่หู (เช่น Palicos) สำหรับนักผจญภัยแต่ละคนแล้ว คุณยังต้องอัปเกรดเครื่องราง (Charms) และเลื่อนระดับเครื่องรางเหล่านั้นเมื่อถึงเลเวลสูงสุด แต่เพื่อที่จะเพิ่มเลเวลสูงสุด คุณต้องเพิ่ม Ecological Rank ซึ่งมีข้อกำหนดที่แตกต่างกันหลายประการ ไม่ต้องพูดถึงว่าคู่หูมีระบบเลเวลของตัวเอง จากนั้นยังมีระบบ Insight ที่เพิ่มทักษะให้กับนักผจญภัยแต่ละคนตามแต้มทักษะที่พวกเขาได้รับจากอาวุธ จากนั้นยังมีระบบ Visage ที่คุณต้อง 'วาด' การ์ดของมอนสเตอร์ที่คุณกำจัดในโลกเมื่อคุณเอาชนะพวกมันได้ Visage หลายใบสามารถติดตั้งให้กับตัวละครแต่ละตัวได้ และ Visage ทุกใบสามารถเพิ่มระดับแยกกันได้", "ใช่แล้ว ยังมี Adventurer Rank, เลเวล Proof of Mastery และ Investigation Notes ซึ่งทั้งหมดเป็นระบบเลเวลและความรู้ที่ค่อนข้างเป็นอิสระต่อกัน นอกจากนี้ยังมีรางวัลสำหรับฤดูกาลเฉพาะที่เกมกำลังดำเนินอยู่ และกิจกรรมเปิดตัวต่างๆ ที่มีสกุลเงินของตัวเองให้ได้รับ (และหลายอย่างมีพาสเสริมที่คุณสามารถซื้อด้วยเงินจริงเพื่อรับรางวัลมากขึ้น) มีโหมดการเล่นอีกสองสามโหมดนอกเหนือจากนี้ แน่นอนว่าคุณสามารถติดตามเนื้อเรื่องหลักและสำรวจโลกได้ แต่ภายนอกนั้น คุณสามารถทำ Free Hunts สำหรับมอนสเตอร์เฉพาะ ใช้ Stamina ที่ชาร์จใหม่ได้สำหรับ Hunt Requests เพื่อรับไอเทมเพิ่มเลเวล โหมด Trial Expedition ที่ยาวนานซึ่งคุณต้องต่อสู้ 150 ครั้งที่มีความยากเพิ่มขึ้น และโหมด Guild Clash และ Guild Carnival ที่กิลด์ต่างๆ เล่นร่วมกัน", "ไม่ต้องบอกก็รู้ว่ามีสิ่งที่ต้องทำมากมายใน Outlanders และแม้จะเล่นเกมนี้ไป 30 ชั่วโมง คุณก็จะยังคงปลดล็อกโหมดใหม่ บทสอนเล่น และตัวเลือกใหม่ๆ หากระบบเหล่านี้เป็นส่วนเสริมของประสบการณ์การล่าหลักก็คงเป็นเรื่องหนึ่ง แต่บ่อยครั้งที่ระบบจำนวนมหาศาลของ Outlanders กลับขวางทางแอ็กชัน ทำให้ทุกอย่างหยุดชะงักในขณะที่คุณต้องเดินผ่านเมนูต่างๆ", "ต้องให้เครดิต Outlanders ว่าผมไม่เคยรู้สึกกดดันให้ต้องใช้เงินเลยในช่วง 30 ชั่วโมงแรก และมีวัสดุมากกว่าที่ต้องการ อย่างไรก็ตาม ณ จุดหนึ่ง อุปสรรคต่างๆ ก็เริ่มปรากฏขึ้น โดยเฉพาะอย่างยิ่งเมื่อคุณปลดล็อกตัวละครกาชามากขึ้น และจำเป็นต้องเพิ่มพลังให้พวกมัน แม้ว่าคุณจะสามารถเล่น Outlanders ต่อไปได้เมื่อเจออุปสรรคเหล่านั้น แต่ก็เห็นได้ชัดว่าเงินจริงสามารถ 'ปรับปรุง' ประสบการณ์ได้ นั่นยิ่งเป็นจริงเมื่อคุณเห็นการฟาร์มที่จำเป็นสำหรับการปลดล็อกชุดพิเศษหรือตัวละครในกิจกรรมต่างๆ", "แม้ผมจะคิดว่า Outlanders เป็นหนึ่งในเกมกาชาที่ใจกว้างที่สุดที่ผมเคยเล่นมา แต่ก็ยังมีจุดที่คุณจำเป็นต้องฟาร์มกิจกรรมต่างๆ เพื่อดำเนินเนื้อเรื่องต่อ หรือแม้แต่รอหนึ่งวันเพื่อให้ได้รับรางวัลรายวันมากขึ้น คุณจำเป็นต้องปรับปรุง Adventurer Rank, Ecological Level และอื่นๆ อย่างต่อเนื่องเพื่อไปยังภารกิจเนื้อเรื่องหลักถัดไป ในขณะที่เกม Monster Hunter หลายเกมเริ่มเปิดกว้างหลังจากผ่านไปหลายสิบชั่วโมง แต่ Outlanders กลับให้ความรู้สึกตรงกันข้าม คือการเริ่มต้นที่แข็งแกร่งซึ่งจะช้าลงอย่างหลีกเลี่ยงไม่ได้ในความซ้ำซาก ผมยังบอกได้ว่าผมไม่ชอบที่ต้องใช้เวลาเกือบ 20 เปอร์เซ็นต์ไปกับการคัดกรองเมนู และกดข้ามหน้าจอเพื่อเก็บสกุลเงินตลอดเวลา อีกครั้ง นั่นเป็นธรรมชาติที่น่าเสียดายของเกมกาชาหลายเกม แต่ Monster Hunter ก็มีการท่องเมนูของตัวเองอยู่แล้ว ดังนั้นคุณจึงได้รับผลกระทบสองเท่าที่นี่", "Monster Hunter Outlanders เป็นเพียงเกมที่มีของเยอะเกินไป มันเต็มไปด้วยความฟุ่มเฟือยสไตล์มือถือที่ต้องคอยติดตาม ซึ่งส่วนใหญ่ขัดขวางการเพลิดเพลินกับสูตรเกมเพลย์ที่แข็งแกร่งที่มันมีอย่างชัดเจน ในหลายๆ ด้าน มันน่าทึ่งจริงๆ ที่ Outlanders มีความทะเยอทะยาน และสามารถปรับเปลี่ยนความยอดเยี่ยมของ Monster Hunter World ให้มาอยู่ในแพ็กเกจที่เล็กลงได้อย่างคล่องแคล่ว การปรับปรุงการต่อสู้ให้คล่องตัวยังคงรักษาความเข้มข้นของการล่าเอาไว้ ในขณะที่สามารถเล่นได้ในช่วงเวลาสั้นๆ และในขณะที่มีสิ่งดีๆ มากพอที่จะทำให้คุณมีส่วนร่วม แต่มันก็มาพร้อมกับความหงุดหงิดไม่น้อยในเรื่องการสร้างรายได้ อุปสรรค และอาการปวดหัวจากการจัดการเมนูที่ไม่มีที่สิ้นสุด นั่นหมายความว่าในท้ายที่สุด Outlanders ไม่ได้ไปถึงจุดสูงสุดของเกมเวอร์ชันคอนโซล แต่ ซมศาลเจ้าก่อนถึงงานเทศกาลใหญ่ Pon จึงต้องหางานทำเพื่อหาเงินมาเป็นค่าใช้จ่าย และด้วยทักษะที่มีจำกัดบวกกับจักรยาน BMX คู่ใจ เขาจึงกลายเป็นบุรุษไปรษณีย์ประจำเกาะ โดยผู้เล่นจะได้ใช้ชีวิตตลอดหนึ่งเดือนของฤดูร้อนไปกับการส่งจดหมายและทำภารกิจต่างๆ ตามปฏิทินที่กำหนดไว้", "ตัวเกาะมีขนาดไม่ใหญ่มากแต่มีความหนาแน่นของพื้นที่และจุดที่น่าสนใจหลายแห่ง Pon ต้องเรียนรู้ที่จะเดินทางอย่างมีประสิทธิภาพด้วยจักรยาน (แม้จะเดินได้ แต่ Pon ไม่สามารถกระโดดขณะเดินได้ ทำให้การใช้จักรยานเป็นวิธีที่เหมาะสมที่สุด) ซึ่งเกาะแห่งนี้ก็เอื้อต่อการปั่นจักรยานเป็นอย่างมาก โดยเฉพาะการมีพื้นที่ที่คล้ายกับลานสเก็ตพาร์ค ทำให้การส่งจดหมายไม่ใช่แค่ภารกิจที่ต้องทำ แต่เป็นหัวใจหลักของความสนุกในเกม", "ในแต่ละวัน Pon จะต้องรับจดหมายจากที่ทำการไปรษณีย์และจัดเรียงลงในตะกร้าผ่านมินิเกมสไตล์ Tetris ซึ่งเป็นเหมือนพิธีกรรมเริ่มต้นวันใหม่ที่น่าประทับใจ จากนั้นจึงออกเดินทางส่งของ แม้ตัวเกมจะเป็น Open-world ที่ให้คุณเลือกส่งของตามลำดับใดก็ได้ แต่เส้นเรื่องหลักยังคงเป็นเส้นตรง โดยมีทั้งการส่งของธรรมดาไปจนถึงภารกิจที่มีเนื้อเรื่องเกี่ยวข้องกับชาวเมืองที่มีเอกลักษณ์เฉพาะตัว เช่น เชฟซูชิและเชฟยากิโทริที่เป็นคู่แข่งกัน ช่างภาพที่ขาดแรงบันดาลใจ หรือชายหนุ่มมาดเข้มที่มีมุมอ่อนโยน", "ตัวละครเหล่านี้มีความแปลกประหลาดอย่างน่ารักและมีเรื่องราวที่น่าติดตาม เช่น คู่แข่งเชฟที่เคยมีความบาดหมางกันและไม่ค่อยเป็นมิตรกับ Pon ในตอนแรก แต่ทัศนคติของพวกเขาก็เริ่มเปลี่ยนไปเมื่อเห็นความพยายามของ Pon ในฐานะบุรุษไปรษณีย์ นอกจากนี้การผจญภัยของ Pon ยังช่วยประสานรอยร้าวระหว่างพ่อลูกที่เป็นช่างฝีมืออีกด้วย แม้ชื่อเกมจะเป็นชื่อของ Pon แต่เนื้อหาหลักกลับมุ่งเน้นไปที่ความสัมพันธ์ของผู้คนในชุมชนบนเกาะแห่งนี้มากกว่า", "หัวใจสำคัญของเกมคือมินิเกมที่หลากหลายซึ่งชาวเมืองต้องการความช่วยเหลือ เช่น การเสียบไม้ยากิโทริ การจัดเรียงซูชิ การขัดไม้ การเสิร์ฟน้ำแข็งไสและเบียร์ การคิดเงินในร้านสะดวกซื้อ การตีกลอง หรือการตีโฮมรันในสนามเบสบอล มินิเกมเหล่านี้จำลองความสนุกในวัยเด็กที่ทุกอย่างดูเป็นไปได้ และเป็นเหมือนการผจญภัยเล็กๆ ที่ช่วยคั่นเวลาในวันฤดูร้อนอันแสนยาวนาน", "อย่างไรก็ตาม ไม่ใช่มินิเกมทุกอย่างจะสนุกสนานเสมอไป บางเกมให้ความรู้สึกซ้ำซากและน่าเบื่อ เช่น การขัดไม้ที่เชื่องช้าเกินไป หรือการตัดต้นไผ่จำนวนมากเกินความจำเป็น ซึ่งบางครั้งก็ทำให้รู้สึกขัดใจที่ต้องละทิ้งความสนุกจากการปั่นจักรยานไปทำภารกิจเหล่านั้น", "คุณอาจเรียกเกมนี้ว่าเป็นเกมจำลองการส่งจดหมาย เกม BMX หรือเกมทำอาหาร ซึ่งความหลากหลายนี้สร้างความแปลกใหม่ได้ดีในหลายช่วงเวลา แต่ก็มีหลายครั้งที่ผมอยากให้เกมปล่อยให้ผมกลับไปทำสิ่งที่ชอบที่สุด นั่นคือการปั่นจักรยานของ Pon ไปรอบๆ เมือง", "หัวใจหลักของ Tanuki: Pon's Summer คือการเดินทางด้วยจักรยานที่เปลี่ยนให้เป็นกีฬาเอ็กซ์ตรีม Pon สามารถกระโดดข้ามหน้าผาเล็กๆ ไถราวเหล็ก หรือทำท่าผาดโฉนกลางอากาศได้ การควบคุมทำได้ง่ายผ่านอนาล็อกสติ๊กและปุ่มกด แต่การทำคอมโบต่อเนื่องนั้นท้าทายกว่า แม้เกมจะไม่ได้บังคับให้ผู้เล่นต้องโชว์ฝีมือมากนัก ยกเว้นภารกิจที่กำหนดเงื่อนไขคะแนนหรือเวลา แต่การได้ปั่นจักรยานทำท่าทางต่างๆ ก็เป็นสิ่งที่สนุกมากในตัวเอง ผมมักจะมองหาทางลาดเพื่อหาเส้นทางใหม่ๆ หรือกระโดดข้ามหลังคาบ้านเพียงเพื่อความสนุกส่วนตัว", "มินิเกมที่แย่ที่สุดในเกมคือเกมที่ยืดเยื้อหรือน่าเบื่อเมื่อเทียบกับการปั่นจักรยาน แม้จะเป็นมินิเกมที่ค่อนข้างสั้น แต่ก็ทำลายจังหวะการเล่นที่กำลังสนุกไปได้พอสมควร โชคดีที่ส่วนใหญ่จะไม่ซ้ำเดิม เมื่อทำเสร็จแล้ว Pon ก็จะก้าวไปสู่ภารกิจถัดไปและไม่ต้องกลับมาทำภารกิจเดิมอีก", "ส่วนสุดท้ายคือการตกแต่งศาลเจ้าซึ่งเป็นทางเลือกเสริม สำหรับผู้ที่ชอบเกมอย่าง Animal Crossing: New Horizons อาจจะถูกใจสิ่งนี้ โดยพื้นที่ศาลเจ้าจะค่อยๆ เปิดออกให้คุณตกแต่งได้ตามใจชอบ Pon สามารถเก็บของตกแต่งจากภารกิจหรือซื้อจากตัวละครคิตสึเนะได้ แม้เป้าหมายหลักคือการเตรียมศาลเจ้าสำหรับงานเทศกาล แต่สำหรับผมแล้วระบบนี้ดูเป็นส่วนเกินที่ไม่ได้มีผลกระทบต่อเกมอย่างมีนัยสำคัญ", "การเล่น Tanuki: Pon's Summer จนจบใช้เวลาประมาณ 10 ชั่วโมง ซึ่งรวมถึงการตามเนื้อเรื่อง การทำชาเลนจ์ และการเล่นจักรยาน แต่ก็มีบางช่วงที่ต้องเสียเวลาเล่นซ้ำเนื่องจากบั๊กก่อนวางจำหน่าย ระบบบันทึกอัตโนมัติของเกมยังไม่ค่อยเอื้ออำนวยนัก ดังนั้นการบันทึกด้วยตนเองบ่อยๆ จึงเป็นเรื่องที่ควรทำ", "Denkiworks ได้ปล่อยเกมนี้ออกมาในช่วงเวลาที่เหมาะสมที่สุด แม้เราจะกำลังเข้าสู่ช่วงที่หนาวที่สุดของปี แต่เกมนี้เป็นเครื่องเตือนใจถึงฤดูร้อนในวัยเด็กที่เต็มไปด้วยความสุขและความเป็นไปได้ Tanuki: Pon's Summer คือการผสมผสานระหว่างกีฬาเอ็กซ์ตรีมและการส่งของที่คั่นด้วยมินิเกม แม้จะมีบางช่วงที่น่าเบื่อไปบ้าง แต่ด้วยระยะเวลาเล่น 10 ชั่วโมง เกมนี้ก็เต็มไปด้วยความอบอุ่นทั้งในด้านสภาพแวดล้อมและเนื้อเรื่อง พร้อมด้วยความสนุกจากการปั่นจักรยาน BMX ที่ทำให้ผมยังคงนึกถึงบรรยากาศฤดูร้อนในยามที่นิ้วเท้าของผมเริ่มเย็นเฉียบ"], "link": "https://www.ign.com/articles/tanuki-pons-summer-review", "canonical_link": "https://www.ign.com/articles/tanuki-pons-summer-review", "cover_image_url": "https://assets-prd.ignimgs.com/2026/11/11/tanuki-pons-summer-blogroll-02-1794428582840.jpg", "gallery_images": ["https://assets-prd.ignimgs.com/2026/11/11/tanuki-pons-summer-yt-1794426356826.jpg"], "videos": [], "review_score": "7", "published_ts": 1794429395, "published_at": "2026-11-11T20:36:35Z", "published_th": "12 พ.ย. 2026 • 03:36 น.", "category_hint": "Review"}, {"id": 1794822849528, "guid": "8aba4e2e-fe0a-4d4c-aa1b-1675e11bf914", "original_title": "Want a New Elder Scrolls? Play Queen's Domain | IGN Quick Review", "thai_title": "รีวิว Queen's Domain: เกม RPG แฟนตาซีกลิ่นอายคลาสสิกที่แฟน Elder Scrolls และ King's Field ต้องลอง", "tag": "Review", "sub_tag": "ELDER SCROLLS", "bullet_points": ["Queen's Domain เป็นเกม RPG มุมมองบุคคลที่หนึ่งที่ได้รับแรงบันดาลใจจากซีรีส์ King's Field ของ FromSoftware ผสมผสานความยากและการสำรวจที่ท้าทาย", "ระบบการเล่นเน้นความสมจริงและการวางแผน โดยมีระบบอาวุธที่แพ้ทางกันและค่า Stamina ที่ส่งผลต่อความรุนแรงในการโจมตี", "การออกแบบฉากมีความโดดเด่นด้วยสไตล์ Metroidvania ที่ต้องใช้ความสามารถใหม่ๆ ในการเปิดเส้นทางลับและการสำรวจโดยไม่มีตัวช่วยนำทาง", "แม้จะมีอุปสรรคเรื่องความยากและการควบคุมที่อาจดูเก่า แต่ตัวเกมมอบประสบการณ์ที่สดใหม่และน่าติดตามด้วยงานภาพสไตล์ 32-bit ที่มีเสน่ห์", "เกมวางจำหน่ายแล้วบน PC, PlayStation, Xbox และ Switch 2 ในราคา 20 ดอลลาร์"], "full_paragraphs": ["ผมเป็นคนที่ชื่นชอบเกมที่ย้อนยุคไปสู่ยุค 32-bit โพลีกอนเป็นพิเศษ โดยมีเกมอย่าง Mouthwashing, Signalis, Crow Country และ Warhammer 40,000: Boltgun 2 เป็นเกมโปรดในช่วงที่ผ่านมา และล่าสุดผมได้มาติดใจกับ Queen's Domain เกม RPG แฟนตาซีที่ให้ความรู้สึกราวกับว่าเกม Elder Scrolls ถูกสร้างขึ้นมาสำหรับเครื่อง PlayStation 1 จริงๆ แล้วเกมนี้ได้รับแรงบันดาลใจมาจากซีรีส์ King's Field ของ FromSoftware ในยุคก่อนที่จะมี Dark Souls ซึ่งเน้นการต่อสู้ในมุมมองบุคคลที่หนึ่งที่เชื่องช้าและต้องใช้ความคิด รวมถึงความยากระดับลงโทษผู้เล่น (ซึ่งกลายเป็นเอกลักษณ์ของ FromSoft ในเวลาต่อมา) แต่ถึงแม้ Queen's Domain จะได้รับแรงบันดาลใจมาอย่างชัดเจน แต่มันก็เป็นประสบการณ์ที่โดดเด่นในปี 2026 ที่ถ่ายทอดความรู้สึกฝืดเคืองแบบเกมยุคเก่าออกมาได้อย่างยอดเยี่ยม", "คุณเริ่มต้นเกมด้วยการถูกซัดมาเกยตื้นบนเกาะป่าดิบชื้นหลังจากเรือของคุณถูกราชินีปีศาจดูดลงสู่ทะเล คุณต้องเผชิญกับความโดดเดี่ยวและอันตราย มีทั้งแมลงเต่าทองและจิ้งหรีดขนาดเท่ามนุษย์ที่คอยพุ่งเข้าใส่และติดตามคุณ สิ่งเดียวที่คุณมีไว้ป้องกันตัวในช่วงแรกคือดาบสนิมเขรอะที่ได้รับมาจากผู้รอดชีวิตคนอื่นๆ การต่อสู้ในช่วงแรกนั้นค่อนข้างน่าเบื่อ คุณต้องคอยถอยหลังเพื่อหลบจิ้งหรีดเมื่อเห็นท่าทางมันเริ่มโจมตี หรือเดินวนรอบแมลงเต่าทองตอนที่ปีกมันกระพือ และต้องกระโดดหลบเลเซอร์ที่ยิงมาจากพืชดวงตาที่ติดอยู่ตามผนัง (ซึ่งสามารถยิงคุณได้จากระยะไกล) มันไม่ใช่จุดเริ่มต้นที่น่าดึงดูดใจนัก แต่ผมก็มีความเชื่อมั่นว่าหากขุดลึกลงไปอีกหน่อย ผมจะต้องพบกับอัญมณีล้ำค่าอย่างแน่นอน", "ในเกมนี้ไม่มีตัวบอกเควสต์ ไม่มีจุดนำทาง หรือเส้นทางที่ไฮไลต์ไว้ให้ มีเพียงเข็มทิศทรงกลมที่ถอดแบบมาจาก King's Field โดยตรง ในฐานะคนที่ชอบเกมที่ไม่จูงมือผู้เล่นมากเกินไป ผมรู้สึกว่าต้องพิสูจน์ว่า Queen's Domain ทำปรัชญาการออกแบบนี้ออกมาได้ดีแค่ไหน ดังนั้นผมจึงค่อยๆ เดินหน้าเผชิญหน้ากับศัตรูแต่ละตัวและสำรวจซากปรักหักพังในเขตร้อนอย่างระมัดระวัง โดยรอคอยความก้าวหน้าในขณะที่ทุกอย่างตั้งแต่โครงกระดูกที่ฟื้นคืนชีพไปจนถึงแมลงปอต่างจ้องจะเอาชีวิตผม", "ด้วยแสงแวววาวจางๆ บนเนินดินนอกชายฝั่ง ผมพบเข็มขัดใส่มีดขว้างเพื่อเพิ่มคลังอาวุธที่น่าสงสารของผม ไอเทมสำคัญนั้นระบุตัวตนได้ยากมากในโลกของเกมเพราะมันกลมกลืนไปกับงานศิลปะแบบพิกเซล ดังนั้นผมจึงใช้เวลานานกว่าที่อยากจะยอมรับในการตามหามีดพวกนี้ แต่มันก็คุ้มค่าเพราะในที่สุดผมก็สามารถจัดการกับพืชดวงตาที่น่ารำคาญเหล่านั้นได้ และยังสามารถกดสวิตช์ที่ซ่อนอยู่ข้างประตูหินบานใหญ่ได้อีกด้วย ซึ่งหนึ่งในนั้นเป็นทางลัดกลับไปยังจุดเซฟและอีกทางหนึ่งนำไปสู่ห้องเก็บศพใต้ดิน เกมไม่ได้บอกให้คุณทำสิ่งเหล่านี้ แต่ด้วยการสำรวจและลองผิดลองถูกกับโลกของเกม คุณจะค้นพบสิ่งเหล่านี้ได้โดยธรรมชาติ", "ระหว่างทาง ผมเก็บหอกที่สร้างความเสียหายแบบเจาะเกราะและกระบองไม้ที่สร้างความเสียหายแบบทุบ ซึ่งทั้งสองอย่างช่วยเสริมความเสียหายแบบฟันจากดาบสนิมของผม ซึ่งผมได้อัปเลเวลความชำนาญจากการใช้งานมันมาตลอด ตอนนี้ระบบแพ้ทางอาวุธเริ่มชัดเจนขึ้น ศัตรูแต่ละตัวจะแพ้ทาง เป็นกลาง หรือต้านทานความเสียหายประเภทต่างๆ ดังนั้นการสลับอาวุธจึงกลายเป็นส่วนหนึ่งของการเต้นรำในการต่อสู้ที่เชื่องช้า ผมควรกล่าวด้วยว่าค่า Stamina เป็นปัจจัยที่สำคัญที่สุดในการสร้างความเสียหาย การโจมตีแต่ละครั้งจะลดแถบ Stamina ลง และยิ่งคุณมี Stamina เหลือมากเท่าไหร่ คุณก็จะสร้างความเสียหายได้มากขึ้นเท่านั้น มันฟื้นฟูได้อย่างรวดเร็ว แต่คุณไม่สามารถกดโจมตีรัวๆ เพื่อผ่านศัตรูไปได้ ซึ่งยิ่งเน้นย้ำถึงวิธีการต่อสู้ที่ต้องมีการคำนวณอย่างรอบคอบ", "ในห้องเก็บศพใต้ดินที่ผมกล่าวถึง สิ่งต่างๆ เริ่มไหลลื่นขึ้นเมื่อผมเข้าใจกลไกนี้และเริ่มตอบสนองต่อรูปแบบการโจมตีได้ดีขึ้น ศัตรูถูกออกแบบมาให้มีความดิบตามจิตวิญญาณของเกมเก่า ด้วยท่าโจมตีแบบเดียวและพฤติกรรมที่คาดเดาได้ และเมื่อคุณต้องรับมือกับศัตรูหลายตัวพร้อมกัน นั่นคือจุดที่ความท้าทายที่น่าสนใจยิ่งขึ้นปรากฏขึ้น ด้วยท่าโจมตีสำรองของกระบอง ผมสามารถพุ่งเข้าใส่โครงกระดูกและหลบออกมาได้ก่อนที่พวกมันจะแทงสวนกลับมา และการชาร์จการโจมตีหลักหมายความว่าผมสามารถจัดการกับจิ้งหรีดได้ด้วยการฟันเพียงไม่กี่ครั้ง", "เนื่องจากไม่มีระบบบันทึกอัตโนมัติและความตายหมายถึงการสูญเสียความคืบหน้าอันมีค่า (จุดเซฟมีอยู่อย่างจำกัด) การพบกุญแจประตูที่ปลายห้องเก็บศพจึงเพิ่มความตึงเครียดขึ้นไปอีก ตอนนี้ผมแค่ต้องเอาชีวิตรอดเพื่อกลับไปยังจุดเซฟเพียงจุดเดียวของผม นี่คือการตัดสินใจออกแบบสไตล์เก่าอีกอย่างหนึ่งที่แม้จะน่าหงุดหงิด แต่มันก็ช่วยเสริมการออกแบบโลกของ Queen's Domain และแนวทางในการรับมือกับความท้าทายโดยรวมของเกม", "กุญแจเปิดประตูที่ท่าเรือริมฝั่ง ซึ่งนำไปสู่ลานประลองปิดตายสำหรับการต่อสู้กับบอสตัวแรก ผมเห็นแถบเลือดที่กว้างเต็มหน้าจอโผล่ขึ้นมา และให้ตายเถอะ Shrine Guardian ที่เป็นโครงกระดูกนั้นใหญ่และดุดันกว่าทุกสิ่งที่ผ่านมา และทำให้ผมล้มลงด้วยการฟันดาบที่ชาร์จพลังมา การหลบออกจากระยะโจมตีของมันเป็นส่วนที่ยากที่สุดและผมก็โดนอัดยับในการลองครั้งแรก แต่แล้ว... อ๋อ! ท่าสำรองของหอกคือการถอยหลังอย่างรวดเร็ว ดังนั้นถ้าผมล่อบอสแล้วใช้ท่าถอยหลังโจมตีสวนกลับล่ะ? แล้วค่อยขว้างมีดใส่ในขณะที่ล่อหลอกมันเพื่อรอให้ Stamina ฟื้นฟู? งานง่ายเลย", "สิ่งนี้เน้นย้ำถึงความสำคัญของท่าโจมตีสำรอง และการเอาชนะมันทำให้ผมได้รับรางวัลเป็นดาบศักดิ์สิทธิ์เล่มใหม่ที่คมกริบพร้อมท่าสำรองที่ช่วยให้คุณร่อนกลางอากาศได้ชั่วครู่ ยอดเยี่ยมมาก ทั้งดาเมจที่สูงขึ้น รูปลักษณ์ที่เท่ขึ้น และวิธีใหม่ในการสำรวจ... เดี๋ยวนะ นี่มันเปิดเส้นทางมากมายที่ผมเคยคิดว่าเข้าไม่ได้! สะพานที่พังทลายนำไปสู่การค้นพบที่สำคัญสำหรับเควสต์หลัก รวมถึงอาวุธคบเพลิงเวทมนตร์ กิ่งไม้ที่ทำหน้าที่เป็นแพลตฟอร์มนำไปสู่พื้นที่ที่ผมต้องต่อสู้กับฝูงโครงกระดูกและแมลง จากนั้นใช้คบเพลิงเวทมนตร์จุดไฟที่หอคอยเพื่อดำเนินเนื้อเรื่องต่อไป คัมภีร์ลึกลับจะกระตุ้นความอยากรู้อยากเห็นของผมเกี่ยวกับโลกและนำทางผมไปข้างหน้าโดยไม่บอกตรงๆ และรอยแตกข้างอาคารที่พังทลายก็มีรางวัลจริงและไอเทมสำคัญอย่างการอัปเกรดพุ่งกลางอากาศ", "ถ้าผมต้องชี้ให้เห็นถึงสิ่งหนึ่งที่ผมคิดว่าอัจฉริยะเกี่ยวกับ Queen's Domain มันคือวิธีที่การออกแบบฉากนำทางคุณในการสำรวจอย่างเป็นธรรมชาติ ในการที่ไม่มีแผนที่ คุณต้องพึ่งพาการสังเกตโลกเพื่อหาเบาะแสทางสายตาและจดจำผังของมัน คุณจะต้องจดจำพื้นที่ที่คุณยังสำรวจไม่ครบและเส้นทางไหนที่คุณควรกลับมาหลังจากปลดล็อกสิ่งใหม่ๆ สิ่งที่คุณถูกขอให้ทำนั้นไม่ใช่เรื่องแปลกใหม่ แต่การที่เกมโยนภาระให้คุณเป็นคนคิดหาคำตอบเองทำให้ประสบการณ์นี้น่าสนใจยิ่งขึ้นมาก", "ไอเทมฟื้นฟูพลังชีวิตมีจำกัดในช่วงแรก และการพักที่จุดเซฟจะทำให้ศัตรูเกิดใหม่ มันเป็นโลกที่อันตราย และการออกไปผจญภัยเพื่อหวังจะก้าวหน้าต่อไปนั้นเป็นเรื่องที่น่าหวั่นใจ ปัญหาอย่างการติดขัดกับฉากระหว่างการโจมตีอาจทำให้หงุดหงิดเมื่อชีวิตเป็นเดิมพัน และศัตรูบางประเภทก็จัดการได้น่ารำคาญ ความหงุดหงิดเล็กน้อยอาจบั่นทอนความกระตือรือร้นของผมไปบ้าง แต่ผมก็เต็มใจที่จะลุยผ่านน้ำที่ขุ่นมัวเหล่านั้น เพราะภายในหลักการออกแบบที่ดูโบราณเหล่านี้คือเกม RPG ที่สดใหม่และน่าพึงพอใจอย่างประหลาด", "จังหวะการเล่นเปลี่ยนไปพอสมควรตลอดพื้นที่ Water Temple ซึ่งผมเคลียร์ได้ตอนเล่นไปประมาณหกชั่วโมง การตะลุยดันเจี้ยนนั้นมีจังหวะที่ดีมาก ผมไม่เคยรู้สึกหลงทางและผังของมันมีความสมดุลระหว่างความเข้าใจง่ายกับการกระตุ้นความอยากรู้อยากเห็น มันทำให้ผมตระหนักว่าเกมนี้มีกลิ่นอายของ Metroidvania ที่มีความสามารถที่ขยายขอบเขตในการเปิดเส้นทางใหม่ๆ ซึ่งชัดเจนมากเมื่อผมได้รับการอัปเกรดพุ่งกลางอากาศครั้งที่สองที่นี่เพื่อข้ามช่องว่างขนาดใหญ่ไปยังส่วนสุดท้ายของดันเจี้ยน ผมเริ่มคุ้นเคยกับการต่อสู้มากขึ้น รู้สึกผ่อนคลายขึ้นด้วยคลังอาวุธที่เพิ่มขึ้น รวมถึงกระบองหนามที่สร้างความเสียหายสองประเภทและลูกไฟจากคบเพลิงเวทมนตร์ ถึงอย่างนั้น มันก็ยังมีการต่อสู้ที่ยากลำบากกับสัตว์ทะเลมีพิษและแมลงก้ามปูตลอดดันเจี้ยนที่ยาวนานนี้ ซึ่งยังคงต้องใช้วิธีการที่รอบคอบโดยใช้ความสามารถที่มีอยู่อย่างจำกัดอย่างชาญฉลาด ซึ่งจะถูกทดสอบเพิ่มเติมในการต่อสู้กับบอสของดันเจี้ยนที่เป็นราชาปลาวาฬที่ถูกกัดกิน ซึ่งคอยเรียกสมุนและปล่อยคลื่นน้ำพิษออกมา", "หลังจากออกมาจากท่อระบายน้ำและจุดไฟที่หอคอยอีกแห่ง ผมพบเครื่องเทเลพอร์ตที่ระบุว่าผมยังมีพื้นที่อีกอย่างน้อยแปดแห่งรออยู่ข้างหน้า ตอนนี้ผมเข้าใจขอบเขตของ Queen's Domain อย่างชัดเจนแล้ว และเมื่อผมเข้าใกล้พื้นที่ถัดไป ซึ่งเป็นห้องสมุดที่สาปแช่งและวนเวียนอยู่ใน Tower of Knowledge ผมรู้สึกว่าการผจญภัยนี้กำลังจะลึกซึ้งยิ่งขึ้น แต่มันเป็นเกมที่ผมจะเติบโตไปพร้อมกับมัน เห็นได้ชัดจากวิธีที่ผมจัดการกับบอสเฝ้าประตูอย่าง Skeletal Executioner โดยแทบไม่มีรอยขีดข่วนด้วยการหลบกระสุนขวานของมัน ร่ายเวทคบเพลิง และชาร์จดาบศักดิ์สิทธิ์ ผมได้เข้าสู่สภาวะลื่นไหลแล้ว", "ส่วนหนึ่งในใจผมกำลังคิดว่าเกมจะรักษาโมเมนตัมนี้ไว้ได้อย่างไร จะจัดการกับการเพิ่มระดับพลังอย่างไร และจะพัฒนาในรูปแบบที่จะทำให้ประหลาดใจต่อไปได้อย่างไร ตั้งแต่การเก็บเหรียญโบราณเพื่อแลกอาวุธที่เฉียบคมขึ้นและเครื่องรางเพื่อเพิ่มสเตตัส รางวัลเล็กๆ น้อยๆ เหล่านั้นเป็นสิ่งที่น่าลิ้มลอง การเดินเข้าไปในภูมิภาคใหม่กระตุ้นความอยากรู้อยากเห็นของผมพอๆ กับที่มันสร้างบรรยากาศที่น่าขนลุก ทั้งรู้สึกทึ่งและกลัวว่าจะมีศัตรูใหม่ๆ อะไรอยู่ข้างหน้า ความก้าวหน้าแต่ละอย่างแสดงให้ผมเห็นสิ่งใหม่และสร้างตัวผมในฐานะผู้เล่นในรูปแบบที่ไม่ใช่แค่การเพิ่มเลเวลและแผ่นสเตตัส", "สิ่งที่ผมคิดว่าเป็นเพียงการคารวะต่อยุคสมัยที่ผ่านไปนั้น ได้กลายเป็นการบิดมุมมองที่ชาญฉลาดของประสบการณ์ RPG แบบยุคเก่า Queen's Domain ถูกทำให้ทันสมัยในแบบที่ไม่ลดทอนความมุ่งมั่นที่จะเป็นเกมที่ยากและบางครั้งก็เข้าใจยากตามสไตล์ย้อนยุค", "การออกแบบเสียงเป็นกุญแจสำคัญในการสร้างบรรยากาศและเสริมความสวยงามแบบจำลอง PS1 เสียงฟืนที่แตกเปรี๊ยะนั้นมีรายละเอียดพอๆ กับเสียงร้องในการต่อสู้แบบย้อนยุคของศัตรู เสียงฝีเท้าทำให้ผมต้องคอยเช็คตามมุมและหันกลับมาดูเผื่อไว้ และเพลงประกอบแบบโลไฟที่ไม่ใช่แฟนตาซีจ๋าแต่เข้ากับเกมได้ดีก็มีท่วงทำนองที่ติดหูจนผมฮัมตามในขณะที่เขียนบทความนี้ ทั้งหมดนี้อาจดูเหมือนเป็นลูกเล่นบนพื้นผิว แต่มีการออกแบบที่ตั้งใจซึ่งทำให้มันโดดเด่นจากเกมที่ได้รับแรงบันดาลใจจากยุคเก่ามากมาย (คุณสามารถปรับภาพพิกเซลให้เรียบเนียนขึ้นได้หากต้องการ แต่ผมขอเถียงว่ามันจำเป็นต้องเป็นแบบนี้แหละ)", "ใช่ ผมรู้ว่ามันไม่ใช่โลกเปิดกว้างที่มี NPC ที่ตอบสนอง เควสต์แยกย่อย และตัวเลือกบทสนทนา แต่ Queen's Domain กำลังตอบโจทย์ความต้องการเกม RPG แฟนตาซีมุมมองบุคคลที่หนึ่งที่คุณจะได้รับจาก Elder Scrolls มันมีการตะลุยดันเจี้ยนที่ยอดเยี่ยมและยังเป็นวิธีที่น่าสนใจในการมองย้อนกลับไปและเข้าใจว่า King's Field พยายามทำอะไรเมื่อหลายปีก่อนผ่านสิ่งที่เข้าถึงได้ในยุคปัจจุบัน และชั่วโมงแรกๆ เหล่านี้เป็นตัวอย่างที่แสดงให้เห็นว่าการออกแบบฉากที่ชาญฉลาดและความฝืดเคืองเล็กน้อยสามารถสร้างประสบการณ์ที่ไม่เหมือนใครซึ่งยังมีอะไรซ่อนอยู่ใต้พื้นผิวอีกมาก", "มันเป็นหกชั่วโมงที่แลกมาด้วยความยากลำบาก และยังมีอะไรให้ดูอีกมาก หากดูจากสมุดภาพสัตว์ประหลาด ผมเพิ่งเจอศัตรูไปประมาณ 40 จาก 188 ตัวใน Queen's Domain นี่จะเป็นการเดินทางที่ยาวนาน แต่เป็นเส้นทางที่ผมจะอยู่ต่อไปจนกว่าจะถึงจุดจบ สิ่งที่ผมคำนึงถึงคือจะมีเกมที่ลึกซึ้งกว่านี้อยู่ข้างใต้เมื่อความแปลกใหม่จางหายไปหรือไม่ และมันจะสามารถรักษาความรู้สึกมหัศจรรย์ที่มอบให้จนถึงตอนนี้ได้หรือไม่", "แน่นอนว่านี่ไม่ใช่การรีวิวฉบับเต็มเนื่องจากดูเหมือนจะเป็นเกมที่ใหญ่มาก แต่ Queen’s Domain มีองค์ประกอบที่จะเป็นเกมม้ามืด หากคุณสนใจ เกมนี้วางจำหน่ายแล้วบน PC, PlayStation, Xbox และ Switch 2 ในราคาเพียง 20 ดอลลาร์", "Michael เป็นบรรณาธิการรีวิวที่ IGN และมีส่วนร่วมเป็นประจำในการเขียนพรีวิว สัมภาษณ์ ครอบคลุมงานอีเวนต์สด และข่าวสารทั้งใน สียงเต็มรูปแบบในคัทซีนและบทสนทนา ซึ่งทำออกมาได้ดีเยี่ยมทุกตัวละคร ช่วยเพิ่มบุคลิกและหัวใจให้กับตัวละครเหล่านั้น นักพากย์ Ganondorf ถ่ายทอดความร้ายกาจออกมาได้อย่างเต็มที่, King Darunia ดูอบอุ่นและร่าเริง, Saria เพื่อนสนิทในวัยเด็กของ Link ฟังดูอ่อนหวานและจริงใจ, Impa ดูเป็นนักรบหญิงที่เด็ดขาด ส่วนเจ้าหญิง Ruto ในวัยเด็กเป็นตัวละครที่ผมชื่นชอบเป็นพิเศษด้วยนิสัยที่เอาแต่ใจแต่น่ารัก ส่วน Navi มีเสียงที่ดูโตขึ้นเล็กน้อยแต่ยังคงความเป็นเด็ก และมักทำหน้าที่เป็นเสียงแทน Link เนื่องจากเขายังคงเป็นตัวละครที่เงียบขรึม ยกเว้นเสียงตะโกนในการต่อสู้และปฏิกิริยาตกใจ", "ข้อเสียเพียงอย่างเดียวของการเพิ่มเสียงพากย์คือตัวละคร Sheik ซึ่งไม่ใช่ความผิดของนักพากย์ ผมเคยสงสัยว่าฉบับรีเมคจะจัดการกับจุดหักมุมนี้อย่างไร คำตอบคือมันพยายามแต่สุดท้ายก็ล้มเหลวในการสร้างสมดุลที่น่าพอใจ บทสนทนาแสดงให้เห็นว่าเกมต้องการรักษาเจตจำนงเดิมไว้ แต่ทั้งโมเดลตัวละครที่ปรับปรุงใหม่และเสียงพากย์ทำให้ความน่าเชื่อถือน้อยลง แม้นักพากย์จะทำหน้าที่ได้ดีเยี่ยม แต่การรักษาความลับของเนื้อเรื่องที่เคยพึ่งพาข้อจำกัดของเครื่อง N64 นั้นทำได้ยากในปัจจุบัน จนถึงจุดหนึ่งมันดูไม่สมเหตุสมผลที่ Link และ Navi จะไม่สังเกตเห็นความจริง อย่างไรก็ตาม นอกเหนือจากจุดเล็กน้อยนั้น คัทซีนใหม่ๆ ก็ช่วยเพิ่มความดราม่าให้กับเนื้อเรื่องที่ผมชื่นชอบอยู่แล้วได้เป็นอย่างดี", "มีการเน้นไปที่การแสดงออกทางสีหน้าและแอนิเมชันที่ละเอียดอ่อนเพื่อแสดงท่าทาง ทำให้ช่วงเวลาสำคัญมีน้ำหนักมากขึ้น ตัวอย่างที่สมบูรณ์แบบคือฉากบอกลาที่เต็มไปด้วยน้ำตาของ Saria ที่ขอบป่า Kokiri Saria เป็นคนพูดทั้งหมดในขณะที่ Link ยังคงเงียบ ซึ่งอาจจะดูอึดอัด แต่การที่ Link ลังเลเล็กน้อยก่อนจะหันไปเผชิญโชคชะตา แสดงให้เห็นว่าเขารู้สึกผูกพันกับเธอมากเพียงใดแต่ไม่รู้จะพูดอย่างไร เป็นช่วงเวลาที่น่ารักและสร้างสายสัมพันธ์ที่ลึกซึ้ง ในบางครั้งคัทซีนก็ทำให้จุดสำคัญของเนื้อเรื่องชัดเจนขึ้นกว่าเดิม เช่นตอนที่ Link หยิบ Master Sword และ Ganondorf ฉวยโอกาสนั้น เราจะเห็นภาพเหตุการณ์ที่ชัดเจนขึ้น ซึ่งเป็นการตอกย้ำสิ่งที่ผู้สร้างตั้งใจไว้แต่แรก", "แม้ว่าฉบับรีเมคจะยึดตามการออกแบบเดิมอย่างใกล้ชิด แต่ก็ได้เพิ่มฟีเจอร์อำนวยความสะดวก (Quality-of-Life) ที่ช่วยให้ประสบการณ์ราบรื่นและทันสมัยขึ้น สิ่งที่เห็นผลชัดที่สุดคือการเพิ่มปุ่มกระโดด ซึ่งยอดเยี่ยมมาก เกมต้นฉบับขาดปุ่มกระโดดเนื่องจากข้อจำกัดของคอนโทรลเลอร์ในยุคนั้น แต่ในเกมปี 2026 ปุ่มกระโดดให้ความรู้สึกที่เป็นธรรมชาติและเข้ากับการออกแบบฉากและดันเจี้ยนราวกับว่ามันควรมีอยู่ตั้งแต่แรก Ocarina ไม่เคยเป็นเกมที่มีการกระโดดที่ยากลำบาก แต่การสามารถกำหนดจังหวะการกระโดดเองได้ หรือการกระโดดขึ้นเถาวัลย์และบันไดเพื่อความรวดเร็วในการเดินทางนั้นให้ความรู้สึกที่ดีมาก แม้แฟนๆ บางส่วนจะกังขาเรื่องการเพิ่มปุ่มกระโดด แต่เมื่อได้ลองเล่นแล้ว ผมก็นึกภาพไม่ออกเลยว่าจะกลับไปเล่นแบบเดิมได้อย่างไร", "การเพิ่มอื่นๆ แม้จะส่งผลน้อยกว่าแต่ก็น่าชื่นชม แถบอุปกรณ์ (Equipment bar) ที่นำกลับมาจาก Breath of the Wild และ Tears of the Kingdom ช่วยให้คุณเรียกใช้อุปกรณ์ที่ต้องการได้ง่ายขึ้น เช่นเดียวกับรองเท้าและ Lenses of Truth (ที่ตอนนี้ดูเหมือนแว่นตากันลม) ที่ถูกกำหนดไว้ที่ปุ่มทิศทางเพื่อการสลับใช้งานอย่างรวดเร็ว หนึ่งในฟีเจอร์ QOL ที่ผมชอบที่สุดคือ Business Scrub คุณสามารถซื้อหรือหาเมล็ดพันธุ์เพื่อเรียกพ่อค้า Deku ได้ทุกที่ในโลก รวมถึงในดันเจี้ยน ซึ่งเขาจะขายไอเทมจำเป็น เช่น ยา, ระเบิด และลูกธนู ทำให้ไม่ต้องเดินย้อนกลับออกจากดันเจี้ยนเพื่อเติมของก่อนสู้กับบอส แต่ในขณะเดียวกัน คุณก็ต้องใช้อย่างประหยัดเพราะเมล็ดพันธุ์มีจำกัด ทำให้เกมยังคงความท้าทายเอาไว้ได้", "นอกจากนี้ยังมีส่วนเสริมที่กว้างขึ้นอย่าง Threads of Time ซึ่งเป็นระบบติดตามเควสต์ที่คอยบอกทิศทางสำหรับภารกิจหลักและเควสต์ย่อยที่คุณเริ่มทำ ปริศนาบางอย่างใน Ocarina อาจมีความซับซ้อน ซึ่งระบบนี้ไม่ได้ทำหน้าที่เป็นระบบบอกใบ้ แต่เป็นเครื่องเตือนความจำว่าคุณค้างไว้ที่ไหน นอกจากนี้ยังมี Hall of Fallen Foes ซึ่งเป็นห้องจัดแสดงรูปปั้นของสัตว์ประหลาดและบอสที่คุณเคยเอาชนะมาได้ทั่ว Hyrule แม้จะไม่ใช่สิ่งที่ปฏิวัติวงการ แต่การได้ชื่นชมรายละเอียดของดีไซน์เหล่านี้โดยไม่ต้องต่อสู้ด้วยนั้นเป็นเรื่องที่ดี และสำหรับบอสบางตัว คุณยังสามารถท้าทายเพื่อฝึกฝนทักษะได้อีกด้วย", "ทั้งหมดนี้เป็นส่วนเสริมที่เข้ามาเติมเต็มเกมคลาสสิกที่ยังคงความยอดเยี่ยมได้อย่างน่าทึ่ง การออกแบบดันเจี้ยนยังคงเป็นหนึ่งในส่วนที่ดีที่สุดของซีรีส์ แม้จะเป็นความพยายามในรูปแบบ 3D ครั้งแรกก็ตาม ดินแดน Hyrule เต็มไปด้วยสิ่งที่ต้องทำ ความลับที่ต้องค้นหา และผู้คนที่ต้องช่วยเหลือ เกมยังคงย่อยง่ายในแง่ของภารกิจหลัก ซึ่งเป็นเหตุผลว่าทำไมมันถึงถูกนำกลับมาเล่นซ้ำหลายปี แต่ก็ยังอัดแน่นไปด้วยกิจกรรมและเควสต์ย่อยให้สำรวจ และที่น่ายินดีคือมันยังคงความแปลกประหลาดอันน่าทึ่งของ Ocarina of Time ต้นฉบับเอาไว้ เกม Zelda มักจะมีเสน่ห์ที่ตลกขบขันเสมอ แต่ Ocarina นั้นแปลกกว่าภาคอื่นด้วยการออกแบบ NPC ที่พิลึกพิลั่นและช่วงเวลาตลกๆ เช่น การปลุกเจ้าของฟาร์ม Talon หลังจากเขาหลับในเขตปราสาท Hyrule หรือการที่คุณยังต้องแบกเจ้าหญิง Ruto ไว้บนหัวเหมือนกำลังขี่หลังปลาโลมา สิ่งเหล่านี้ยังคงสร้างความแตกต่างที่สนุกสนานให้กับโลกของเกม", "ในขณะเดียวกัน องค์ประกอบที่มืดหม่นก็ยังคงอยู่และได้รับการปรับปรุงให้ดียิ่งขึ้น ครั้งแรกที่ Link ในวัยผู้ใหญ่ก้าวออกจาก Temple of Time เพื่อเห็น Hyrule ที่ล่มสลายนั้นให้ความรู้สึกที่โศกเศร้าและถ่ายทอดออกมาได้อย่างเหมาะสม บอสบางตัวมีความน่ากลัวและสยดสยอง โดยเฉพาะ Dead Hand หรือ Cursed Rich Man ที่ทำออกมาได้น่าตกใจ แม้แต่ ReDead ก็ยังดูน่ากลัว แต่มีการปรับปรุงด้วยตัวบ่งชี้ทางภาพที่ชัดเจนขึ้นทำให้การเผชิญหน้าไม่น่าหงุดหงิดจนเกินไป", "เนื่องจากเกมนี้มีความเคารพต่อต้นฉบับสูง จุดอ่อนของ Ocarina of Time ดั้งเดิมจึงยังคงเป็นจุดอ่อนในฉบับรีเมค เช่น Water Temple ที่แม้จะอ่านแผนที่ได้ง่ายขึ้น แต่การปรับระดับน้ำก็ยังคงน่ารำคาญเล็กน้อย Shadow Temple ยังคงเป็นดันเจี้ยนที่เส้นตรงและอ่อนที่สุดเมื่อเทียบกับดันเจี้ยนอื่น การมีกล้องที่อิสระและปุ่มกระโดดทำให้ช่วงการลอบเร้นในปราสาท Hyrule และป้อมปราการ Gerudo จัดการได้ง่ายขึ้น แต่โดยเฉพาะป้อม Gerudo ก็ยังคงเป็นงานที่น่าเบื่อหน่าย สำหรับผม สิ่งเหล่านี้ถือเป็นการยอมรับเล็กๆ น้อยๆ เพื่อรักษาและให้เกียรติการออกแบบดั้งเดิม มันคงไม่รู้สึกว่าเป็น Ocarina of Time หากตัดช่วงเวลาเหล่านี้ออกไป", "เมื่อ Nintendo รีเมค Ocarina of Time สำหรับ 3DS ในปี 2011 มันยังอยู่ในยุคของเกม Zelda รูปแบบเดิม แต่ในปัจจุบัน ท่ามกลางบริบทของ Breath of the Wild และ Tears of the Kingdom การรีเมค Ocarina of Time จึงมีความรับผิดชอบที่ต่างออกไป นี่ไม่ใช่แค่การกลับมาเยี่ยมชมเกม Zelda เก่าในรูปแบบที่คุ้นเคย แต่เป็นการกลับมาเยี่ยมชมยุคสมัยที่แตกต่างไปจากเดิมอย่างสิ้นเชิง ซึ่งทำให้เกิดคำถามว่าเกม Zelda ในรูปแบบนี้ยังคงรู้สึกทันสมัยอยู่หรือไม่ คำตอบคือใช่ Ocarina of Time ยังคงเป็นความมหัศจรรย์ของการออกแบบเกมและการผจญภัยที่น่าตื่นเต้น ฉบับรีเมคนี้ช่วยขัดเกลาจุดที่ขรุขระ ทิ้งบางส่วนไว้ตามเดิม และปล่อยให้สิ่งที่พิเศษของต้นฉบับเปล่งประกายออกมา การเข้าถึงการรีเมคนี้ด้วยความเคารพต่อแหล่งที่มา ทำให้ Nintendo พิสูจน์ให้เห็นว่าผลงานระดับมาสเตอร์พีซที่แท้จริงนั้นสามารถยืนหยัดผ่านการทดสอบของกาลเวลาได้เสมอ"], "link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless/", "canonical_link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/LOZ-Deku-Tree.jpg?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1793790000, "published_at": "2026-11-04T11:00:00Z", "published_th": "4 พ.ย. 2026 • 18:00 น.", "category_hint": "Review"}, {"id": 1794821821022, "guid": "https://www.eurogamer.net/the-legend-of-zelda-ocarina-of-time-remake-review", "original_title": "The Legend of Zelda: Ocarina of Time (2026) review", "thai_title": "รีวิว The Legend of Zelda: Ocarina of Time (2026): การกลับมาของผลงานระดับมาสเตอร์พีซที่เหนือกาลเวลา", "tag": "Review", "sub_tag": "ZELDA", "bullet_points": ["The Legend of Zelda: Ocarina of Time (2026) เป็นการนำเกมระดับตำนานปี 1998 มาปรับปรุงใหม่ด้วยกราฟิกสมัยใหม่และการควบคุมที่ลื่นไหลขึ้น", "มีการปรับปรุงระบบ UI และการจัดการไอเทมที่ช่วยลดความยุ่งยาก โดยเฉพาะในดันเจี้ยนที่ซับซ้อนอย่าง Water Temple ทำให้เกมมีจังหวะการเล่นที่ต่อเนื่องและสนุกกว่าเดิม", "ตัวเกมยังคงรักษาหัวใจสำคัญของต้นฉบับไว้ได้อย่างครบถ้วน ทั้งเนื้อเรื่อง การออกแบบดันเจี้ยน และความรู้สึกของการผจญภัยที่น่าประทับใจ", "การกลับมาเล่นเกมนี้ในวัยที่โตขึ้นมอบประสบการณ์ที่ลึกซึ้งกว่าเดิม โดยเฉพาะการสะท้อนถึงเรื่องราวของ 'เวลา' ที่สอดคล้องกับชีวิตจริงของผู้เล่น", "แม้จะมีบางจุดที่กราฟิกดูมีความเป็นเกมยุคใหม่จนอาจสูญเสียเอกลักษณ์ดั้งเดิมไปบ้าง แต่โดยรวมถือเป็นผลงานที่ทั้งผู้เล่นหน้าใหม่และแฟนเก่าไม่ควรพลาด"], "full_paragraphs": ["ผมมีเพื่อนคนหนึ่งที่ได้สัมผัส The Legend of Zelda: Ocarina of Time ครั้งแรกในช่วงที่เกมเพิ่งวางจำหน่ายใหม่ๆ ซึ่งเป็นช่วงที่เขาเพิ่งกลับจากมหาวิทยาลัยมาฉลองคริสต์มาสที่บ้าน สำหรับผม นี่คือช่วงเวลาที่ดีที่สุดในการเล่นวิดีโอเกม ไม่ใช่เพราะเทศกาลคริสต์มาสโดยเฉพาะ แต่เพราะมันเป็นช่วงเวลาที่คุณได้หลุดออกจากโลกแห่งความเป็นจริงและมีเวลาว่างหลายสัปดาห์โดยไม่มีภาระใดๆ มาคอยรบกวน หลายปีต่อมา เพื่อนคนนี้บอกผมว่าความมหัศจรรย์ของเกมนี้ไม่ได้อยู่ที่การเล่นเพียงอย่างเดียว แต่อยู่ที่ 'วิธีการ' ที่การเล่นนั้นดำเนินไป", "สิ่งที่เขาหมายถึงคือ เขาจะเล่นเกมทั้งวันโดยปิดม่านหน้าต่าง ไม่สนใจครอบครัว มุ่งมั่นฝ่าฟันดันเจี้ยนและควบม้า Epona วิ่งไปทั่วทุ่ง Hyrule Field จากนั้นในตอนเย็น เขาจะโทรหาแฟนสาวที่กลับไปฉลองคริสต์มาสกับครอบครัวของเธอ เธออยากรู้เสมอว่าวันนี้เขาทำอะไรมาบ้าง และไม่ใช่เรื่องราวใน East Sussex ที่เธออยากฟัง แต่เธออยากรู้ว่าเขาได้ไปผจญภัยอะไรมาบ้างใน Hyrule", "ดังนั้น ในขณะที่เขาเล่นเกม เขาจะหยุดพักเป็นระยะเพื่อเล่าให้ใครสักคนฟังว่าเขาได้พบเจออะไร ได้ค้นพบอะไร และยังมีอะไรที่ต้องเอาชนะอีกบ้าง วันนี้ผมมีความยินดีอย่างยิ่งที่จะบอกคุณว่า ประมาณ 30 ปีให้หลัง หลังจากที่ผมได้กลับมาสัมผัสเกมนี้อีกครั้งในเวอร์ชันรีเมคใหม่ของ Nintendo ผมขอยืนยันว่า Ocarina of Time ยังคงเป็นเกมที่คุ้มค่าแก่การบอกต่อ มันยังคงเป็นการผจญภัยที่น่าประหลาดใจ น่าพึงพอใจ และซาบซึ้งใจจนผมอดไม่ได้ที่จะต้องพูดถึงมัน", "อย่างไรก็ตาม แม้ว่าเกมนี้จะเป็นผลงานระดับมาสเตอร์พีซที่ไร้ที่ติ แต่ปฏิกิริยาของผมที่มีต่อการกลับมาเล่นครั้งนี้กลับเป็นเรื่องน่าประหลาดใจ หรือจะพูดให้ถูกคือ มันน่าประหลาดใจเพราะเกมนี้เป็นมาสเตอร์พีซนั่นเอง ความจริงคือเมื่อสองสัปดาห์ก่อน ผมไม่ได้รู้สึกโหยหาที่จะกลับไปเล่น Ocarina of Time เลยแม้แต่น้อย ผมรู้สึกกังวลใจด้วยซ้ำว่าจะต้องมานั่งลุยเกมที่เคยยิ่งใหญ่ในอดีตและต้องมาเขียนบทความนับพันคำด้วยความเคารพแบบจำยอม", "โชคดีที่ผมลืมไปสองอย่าง อย่างแรกคือผมมันงี่เง่าที่ลืมไปว่าทุกโอกาสที่จะได้เล่น Zelda อีกครั้งคือสิ่งที่ไม่ควรพลาด และอย่างที่สองคือ ผมลืมไปว่า Ocarina of Time เป็นมาสเตอร์พีซในรูปแบบไหนกันแน่ และนอกจากประเด็นหลังนี้ ซึ่งเราจะมาเจาะลึกกันในภายหลัง ผมยังไม่รู้ด้วยซ้ำว่ามี 'ส่วนผสมลับ' ในเวอร์ชันรีเมคนี้ที่พิสูจน์แล้วว่าสำคัญอย่างยิ่งต่อความยิ่งใหญ่ของมัน ซึ่งไม่ได้เกี่ยวข้องอะไรเลยกับโค้ดที่รันบนเครื่อง Switch 2", "มาพูดถึงหน้าที่ของเวอร์ชันรีเมคกันก่อน นี่คือเกมที่แทบจะเหมือนกับที่ผู้คนเคยเล่นในปี 1998 จังหวะของการผจญภัยที่ Link ต้องเดินทางข้ามยุคสมัยใน Hyrule เพื่อเอาชนะ Ganon ยังคงเหมือนเดิม คุณยังคงเริ่มต้นใน Kokiri Forest และยังคงควบม้า Epona กระโดดข้ามรั้วที่ Lon Lon Ranch ซึ่งเป็นหนึ่งในฉากที่น่าตื่นเต้นและขนลุกที่สุดในประวัติศาสตร์ศิลปะ หากคุณติดอยู่ในดันเจี้ยน คุณแทบจะสามารถใช้บทสรุปเดิมจากเกม N64 เพื่อผ่านมันไปได้ โลกของเกมยังคงถูกแบ่งเป็นส่วนๆ ที่ค่อยๆ โหลดเข้าและออกเมื่อคุณเคลื่อนที่ผ่าน และเกมยังคงเริ่มต้นด้วยฉากเปิดที่ตราตรึงใจ ซึ่ง Link และ Epona ควบม้าผ่านเนินเขาที่มีหมอกและแสงจันทร์เบื้องหลัง เหมือนหลุดออกมาจากผลงานของ Zelda ที่ผสมผสานกับ Susan Cooper", "แต่มีการเปลี่ยนแปลงอะไรบ้าง? อย่างแรกคือทั้งเกมได้รับการอัปเดตด้วยกราฟิกสมัยใหม่ และตัดระบบกล้องแบบคงที่ออกไปทั้งหมด เพื่อเปลี่ยนมาใช้ระบบการเคลื่อนไหวแบบยุคใหม่ที่ใช้จอยสติ๊กหนึ่งข้างควบคุมตัวละครและอีกข้างควบคุมกล้อง ตัวอย่างเช่น Hyrule Castle Town ในความทรงจำของผมมักจะมีกล้องอยู่ตรงกลาง และคุณจะต้องหมุนตัวไปตามถนนราวกับม้าบนม้าหมุนในสวนสนุก", "ตอนนี้มันกลายเป็นพื้นที่ที่อิสระเหมือนใน Frozen ถนนหินทอดยาวไปทุกทิศทางและคุณสามารถสำรวจได้โดยมีกล้องวิ่งตามหลังคุณ พื้นที่ในเกมรู้สึกเหมือนเป็นพื้นที่วิดีโอเกมจริงๆ มากกว่าที่จะเป็นเครื่องจักรซับซ้อนที่คุณเป็นเพียงฟันเฟืองตัวหนึ่ง ใช่ครับ จากวิธีที่ผมพูด ผมเห็นแล้วว่ามีการแลกเปลี่ยนบางอย่างเกิดขึ้น ผมเคยชอบความรู้สึกในเกม 3D ยุคแรกที่ทุกอย่างดูเหมือนเป็นกลไกที่ชาญฉลาดและพร้อมจะพังทลายลงได้ทุกเมื่อ แต่ก็นั่นแหละ! Ocarina เวอร์ชันใหม่นี้เป็นเกมที่คุณสามารถให้เด็กๆ ที่ไม่ได้เกิดในปี 1998 เล่นได้ และพวกเขาจะรู้สึกคุ้นเคยกับมันได้เร็วกว่า", "บางครั้งการอัปเดตทางกราฟิกก็ยอดเยี่ยมจริงๆ เส้นทางไปสู่ Zora's Domain ซึ่งผมแทบจำไม่ได้ในต้นฉบับ ตอนนี้กลายเป็นการปีนป่ายผ่านหน้าผาและโขดหินที่สวยงาม ในขณะที่สีสันสไตล์ Nickelodeon ยุค 90 และพื้นผิวที่มันวาว ทำให้ท้องของ Jabu Jabu กลายเป็นส่วนผสมระหว่างงานปาร์ตี้ก่อนยุคมิลเลนเนียมกับสนามเด็กเล่นในร่มยุคใหม่", "อย่างไรก็ตาม สถานที่ที่ผมชอบที่สุดคือดันเจี้ยนช่วงกลางเกมสองแห่ง Water Temple ตอนนี้กลายเป็นพระราชวังใต้น้ำสไตล์ Art Nouveau ที่คุณสามารถจินตนาการได้ว่ากัปตัน Nemo จะมาเดินเล่นที่นี่ และ Forest Temple ซึ่งเป็นดันเจี้ยน Zelda ที่ผมชอบที่สุดตลอดกาล กลายเป็นคฤหาสน์สังหารที่มีพื้นไม้ปาร์เกต์ซึ่งถูกต้นไม้เข้ายึดครอง ทางเดินที่บุด้วยไม้สีเข้มและชิ้นส่วนแปลกๆ ของโบสถ์ที่โผล่ออกมาจากพุ่มไม้ มันเป็นสถานที่ที่คุณอาจได้ยินในพอดแคสต์คดีฆาตกรรมแปลกๆ", "แต่ก็มีการแลกเปลี่ยนเกิดขึ้น ภรรยาของผมซึ่งเป็นแฟนตัวยงของเกมต้นฉบับมักจะเดินเข้ามาดูในขณะที่ผมเล่น และมักจะรู้สึกว่าเกมที่เธอจำได้นั้นมีเอกลักษณ์ทางภาพที่มากกว่าเล็กน้อย ตัวอย่างเช่น ฉากที่คุณสู้กับ Dark Link ได้สูญเสียความรู้สึกหลอนๆ แบบกึ่งจริงกึ่งฝันไปบ้าง แม้ว่าการจัดวางฉากที่มีต้นไม้เก่าแก่กลางห้องที่เต็มไปด้วยควันจะยังคงดูแปลกตาอย่างน่าประหลาดก็ตาม ในช่วงท้ายของเกมเมื่อเข้าสู่ดินแดน Gerudo คุณอาจจะสงสัยว่าคุณหลุดเข้าไปในเกม Unreal Engine มุมมองบุคคลที่สามที่กำลังพัฒนาอยู่ในปัจจุบันหรือไม่ มันดูสวยงาม แต่บางครั้งมันก็ดูไม่เหมือน Zelda เท่าไหร่นัก", "ทั้งหมดนั้น รวมถึงโมเดลตัวละครที่ดูแปลกตาซึ่งผมก็เรียนรู้ที่จะรักมันในที่สุด ไม่ได้มีความสำคัญมากนัก ไม่ใช่เพราะเหตุผลอื่นใดนอกจากมีการปรับแต่งเล็กๆ น้อยๆ ที่ชาญฉลาดในส่วนอื่น ทำให้ Ocarina ตอนนี้ดำเนินไปอย่างรวดเร็วอย่างน่าทึ่ง และทั้งหมดนี้มาพร้อมกับการลดบทบาทของ Navi ภูติน้อยและนกฮูกที่คอยขัดจังหวะ ซึ่งในต้นฉบับมีไว้เพื่อช่วยนำทางคุณในช่วงแรกอยู่แล้ว", "การปรับแต่งเหล่านี้ยอดเยี่ยมมาก ตอนนี้ Link มีปุ่มกระโดด ซึ่งช่วยตัดการกระโดดตามบริบทของเกมต้นฉบับออกไป และทำให้ท่าโจมตีแบบกระโดดดูน่าประทับใจยิ่งขึ้น ยิ่งไปกว่านั้น การยืมระบบจากเวอร์ชัน 3DS มาใช้ ทำให้คุณสามารถสลับไอเทมที่ใช้งานได้ผ่านเมนูย่อยที่ปุ่ม Trigger และสามารถเปลี่ยนรองเท้าหรืออุปกรณ์สวมหัวได้ด้วยปุ่มทิศทาง", "ฟังดูอาจจะไม่ใช่เรื่องใหญ่ แต่มันเป็นการเปลี่ยนแปลงที่เงียบเชียบแต่ทรงพลังในแบบที่การอัปเดตที่ดีที่สุดควรจะเป็น ลองดูที่ Water Temple สิครับ นี่คือดันเจี้ยนที่เป็นตำนานในเรื่องความยากและความอดทนที่ต้องใช้ในการนำทางผ่านสภาพแวดล้อมที่สามารถปรับระดับน้ำได้ถึงสามระดับ แต่ตอนนี้ เช่นเดียวกับบน 3DS คุณสามารถสนุกกับมันได้โดยไม่ต้องกดเข้าเมนูทุกๆ สองสามก้าวเพื่อใส่หรือถอดรองเท้าเหล็ก", "และนั่นหมายความว่าดันเจี้ยนที่ผมเคยหวาดกลัวกลับกลายเป็นดันเจี้ยนที่เผยความลับออกมาผ่านการทดลอง ผมสามารถปรับระดับน้ำและดูว่ามีตัวเลือกอะไรบ้าง คิดถึงความสัมพันธ์ระหว่างพื้นที่ที่ไปถึงได้กับพื้นที่ที่ไปไม่ถึง โดยไม่ต้องวุ่นวายกับเมนูและขัดจังหวะความต่อเนื่อง 'ความลื่นไหล' คือคำที่ถูกต้องครับ การปรับ UI และการจัดการไอเทมง่ายๆ ได้มอบจังหวะที่สมบูรณ์แบบและความรู้สึกของการค้นพบให้กับดันเจี้ยน Zelda ระดับตำนานแห่งนี้", "นอกเหนือจากการปรับแต่งที่ผมสังเกตเห็น เช่น การติดตั้ง Hookshot ที่ง่ายขึ้น ผมมั่นใจว่ายังมีรายละเอียดเล็กๆ น้อยๆ อีกนับร้อยที่ผมไม่ได้สังเกต ผมสงสัยว่ามีการเพิ่มคำแนะนำที่นุ่มนวลขึ้นในสถานที่อย่าง Water Temple ในขณะที่ที่อื่น เช่น Forest Temple ผมสงสัยว่าการเดินย้อนไปมาบางส่วนถูกตัดออกไป การวางตำแหน่งไอเทมอาจถูกเปลี่ยน และมีการปรับแต่งที่ใจกว้างอย่างกระเป๋าเงินที่จุรูปีได้มากขึ้นตั้งแต่ต้น สำหรับผมแล้ว การปรับแต่งทั้งหมดนี้มีจุดร่วมกันคือ มันทำให้เกมดีขึ้นโดยไม่ลบหรือเปลี่ยนแปลงสิ่งที่สำคัญของต้นฉบับไป และผมก็แทบจะหาจุดที่เปลี่ยนไปไม่เจอเลย", "ผมพยายามหาจุดที่เปลี่ยนไปอยู่พักหนึ่ง และเปรียบเทียบสิ่งที่ผมกำลังเล่นกับความทรงจำ ซึ่งมักจะคลาดเคลื่อนอยู่เสมอ ทุ่ง Hyrule Field รู้สึกเล็กลงในตอนนี้ แต่ก็ยังคงน่าตื่นเต้นที่จะควบม้าผ่านไป ผมจำได้ว่า Epona เข้ามาในเกมเร็วกว่านี้ หรือบางทีผมแค่จำได้ว่าแนวคิดเรื่องม้าในเกม Zelda เป็นเรื่องใหญ่ที่ดึงดูดความสนใจมาก ผมเคยคิดว่าบอสตัวโปรดที่เกี่ยวข้องกับภาพวาดสีน้ำมันจะมาในช่วงท้ายเกม แต่ก็นั่นแหละ ผมอาจจะย้ายมันไปไว้ในองก์ที่สามเพราะผลกระทบที่มันมีต่อผมในตอนนั้น", "แต่เมื่อเวลาผ่านไป สิ่งนี้ก็นำไปสู่สิ่งที่สำคัญที่สุดเกี่ยวกับ Ocarina of Time และเหตุผลที่เวอร์ชันรีเมคนี้มีผลกระทบทางอารมณ์ต่อคนอย่างผม นี่ไม่ใช่แค่เกม Zelda อีกเกมที่มีโลกกว้างที่ชาญฉลาด แต่มันเป็นเกม Zelda ที่หมกมุ่นอยู่กับ 'เวลา' มากกว่าที่เคยเป็นมา และนั่นเป็นเพราะเวลาในเกมดำเนินไปผ่านกลไกหลักที่พา Hyrule ไปสู่อนาคตอีก 7 ปีข้างหน้า เปลี่ยน Link จากเด็กเป็นผู้ใหญ่ และจากนั้นก็อนุญาตให้คุณย้อนกลับไปได้อีกครั้ง", "การได้เล่นเกมแบบนี้ เกมที่เกี่ยวกับเรื่องเหล่านี้ หลังจากผ่านไปเกือบ 30 ปี ทำให้จินตนาการและความทรงจำของคุณได้รับการยกระดับแบบ IMAX ผมตระหนักได้ว่านี่ไม่ใช่แค่เกมเกี่ยวกับการผ่านไปของเวลาและวิธีที่โลกดูแตกต่างออกไปเมื่อคุณยังเด็กเมื่อเทียบกับตอนที่คุณโตขึ้น (ผมไม่เคยตระหนักเลยว่า Link ผู้ใหญ่ต้องผ่านดันเจี้ยนเดิมที่ Link เด็กเคยผ่าน แต่ตอนนี้มันยากขึ้นและมีความหมายมากขึ้น) แต่มันยังเป็นเกมที่ผู้เล่นหลายคนได้ใช้วัดช่วงเวลาต่างๆ ในชีวิตของพวกเขาโดยรู้ตัวหรือไม่ก็ตาม", "ครั้งนี้ เมื่อผมไปถึง Fairy Fountain แห่งแรก ผมจำได้ว่าภรรยาของผมเดินเข้าพิธีแต่งงานด้วยเพลงนี้ (ซึ่งคนในสำนักงานทะเบียนเกือบครึ่งจำทำนองได้พร้อมกับเสียงหัวเราะเบาๆ) จากนั้นก็มี Water Temple ซึ่งกลายเป็นคำศัพท์ในวัฒนธรรมป๊อปสำหรับความท้าทายที่เอาจริงเอาจัง ผมต้องเผชิญกับเรื่องแย่ๆ ในชีวิตมากแค่ไหนโดยการเรียกจิตวิญญาณของ Link ที่กำลังจะเข้าสู่สถานที่แห่งนี้", "ผู้เล่นสามารถเปลี่ยนความเร็วในการหมุนกล้องและเปิด/ปิดการเล็งด้วยการเคลื่อนไหว (Motion Control) การเล็งสามารถควบคุมได้โดยการกดปุ่มค้างไว้หรือสลับปุ่ม Ocarina สามารถควบคุมได้ด้วยไมโครโฟนหรือปุ่มกด และสามารถเปิดหรือปิดการสั่นของคอนโทรลเลอร์ได้", "มีการมาถึงครั้งแรกที่ Hyrule Field ซึ่งเป็นทั้งคำมั่นสัญญาของทุกสิ่งที่เกมกำลังจะกลายเป็นในปี 1998 และเป็นช่วงเวลาสั้นๆ ในวัยเด็กที่ขอบเขตของโลกเปลี่ยนไปอย่างกะทันหัน เกมนี้ไม่ได้แค่ส่งผมกลับไปสู่ความทรงจำเท่านั้น แต่มันทำให้ผมกลับไปสนทนากับทุกคนที่ผมรู้จักที่เคยรักเกมนี้ ผมเล่นมันตอนนี้และคิดว่าผมกำลังคุยกับเพื่อนที่เล่นมันที่มหาวิทยาลัย หรือภรรยาของผมที่รักมันก่อนที่เราจะพบกันเสียอีก", "มันดีขนาดนี้มาตลอดเลยหรือเปล่า? ดันเจี้ยนซับซ้อนและท้าทายขนาดนี้มาตลอดเลยไหม? บอสต่างๆ ถูกขับเคลื่อนด้วยแนวคิดที่น่าสนใจ ดราม่า และอารมณ์ขัน มากกว่าความยากใช่หรือไม่? โลกนี้เต็มไปด้วยตัวละครรองที่ติดอยู่ในความทรงจำมาตลอดเลยหรือเปล่า ทั้งนักเล่นหีบเพลงในกังหันลม คนขุดหลุมศพที่มีทัวร์ส่วนตัวที่เขาอยากให้คุณลอง? เป็นไปไม่ได้ที่ผมจะตอบได้ในตอนนี้ นี่คือ Ocarina ในแบบที่มันเป็นมาตลอด เป็นอมตะและซับซ้อน แต่ในขณะเดียวกันมันก็มีความสดใสและความชัดเจนที่ทำให้รู้สึกเหมือนเพิ่งถูกสร้างขึ้นเมื่อวันพุธที่ผ่านมา หากคุณเป็นมือใหม่สำหรับ Zelda และเพิ่งมาเล่นเกมนี้ คุณจะหลงรักมันแน่นอน ใครสักคน ที่ไหนสักแห่ง กำ
