ว่า 'เล่น Roblox ได้ไหม?' นี่คือส่วนผสมที่แปลกประหลาดระหว่างความรู้สึกโหยหาอดีต (Nostalgia) กับเกมจำลองการตกแต่งภายใน ซึ่งเป็นที่รวมของเกมบาร์บี้แนวเรโทรถึง 17 เกม และบ้านในฝัน (Dreamhouse) ให้คุณได้จัดวางเฟอร์นิเจอร์ที่เหมาะสมกับบาร์บี้ เนื่องจากเป็นเวลากว่าสามทศวรรษแล้วที่ผมไม่ได้นำตุ๊กตาบาร์บี้มาเล่นกับ G.I. Joe ผมจึงเรียกผู้เชี่ยวชาญด้านเกมสองคนคือ Kora (วัย 9 ขวบ) และ Paloma (วัย 5 ขวบ) มาช่วยในการรีวิวครั้งนี้ แต่น่าเสียดายที่กาลเวลาไม่ได้ปรานีต่อมรดกทางวิดีโอเกมของบาร์บี้เหมือนกับรูปลักษณ์ของเธอเลย", "\"นั่นมันไม่สมเหตุสมผลเลย ทำไมเธอถึงมีหน้ากากดำน้ำแต่ไม่มีห้องน้ำล่ะ?\" นี่คือคำถามสำคัญจาก Kora ในขณะที่เด็กๆ กำลังจดจ่ออยู่กับส่วนเดียวของ Barbie Rewind ที่พวกเธอสนใจจริงๆ นั่นคือการตกแต่งบ้าน เกมนี้อาจจะนำเสนอตัวเองว่าเป็นคอลเลกชันเกมบาร์บี้ตั้งแต่เกม Barbie บนเครื่อง NES ในปี 1991 ไปจนถึง Barbie as the Island Princess ในปี 2007 แต่โหมด Dreamhouse ที่สร้างขึ้นใหม่กลับเป็นผู้ชนะที่แท้จริงในเกมนี้ โดยมีเฟอร์นิเจอร์ให้เลือกมากกว่า 250 ชิ้น และบางชิ้นจะปลดล็อกได้จากการเล่นเกมบาร์บี้แนวเรโทรเหล่านั้น ตัวละครหลักอย่างบาร์บี้และเพื่อนๆ เช่น Ken และ Christie จะคอยมอบภารกิจให้คุณ แต่ภารกิจเหล่านั้นก็เป็นเพียงแค่การตกแต่งบ้าน ซึ่งให้ความรู้สึกเหมือนมีคนมาบอกว่า \"ระวังนะ\" ในขณะที่คุณกำลังตกลงมาจากบันไดอยู่แล้ว", "สำหรับตัวเกมบาร์บี้เองนั้น ผมเรียกสิ่งที่เกิดขึ้นว่าเป็นการปรับแต่งเพียงเล็กน้อยเท่านั้น ผมได้เล่นเกมทั้งหมดก่อนที่จะเรียกผู้ช่วยผู้เชี่ยวชาญมา และพบว่า Rewind เน้นหนักไปที่มินิเกมแนวแพลตฟอร์มเมอร์และแนว \"จับมะพร้าวที่ตกลงมา\" เกมเหล่านี้ไม่ได้รับการรีบูตในสไตล์ Monkey Island แต่ถูกนำเสนอในรูปแบบเดิมทั้งหมด โดยมีกรอบหน้าจอที่ปรับให้เข้ากับคอนโซลแต่ละเครื่องเพื่อช่วยลดปัญหาเรื่องอัตราส่วนภาพ", "มันยอดเยี่ยมในฐานะของสะสมในพิพิธภัณฑ์ แต่ถ้าคุณนำไปให้ใครก็ตามที่เกิดหลังปี 2010 ดู พวกเขาจะมองมันเหมือนภาพวาดในถ้ำ \"นั่นคือบาร์บี้เหรอ?\" Kora ถามด้วยความไม่เชื่อพลางหรี่ตามองเกม Barbie Pet Rescue ส่วน Paloma หยิบจอยคอนโทรลเลอร์ขึ้นมาเล่นมินิเกมหนึ่ง ซึ่งเป็นเกมคล้าย Pong ของแมวที่ใช้เท้าสองข้างซึ่งดูเหมือนจะเป็นสิ่งจำเป็นสำหรับการดูแลสัตว์เลี้ยง และเธอก็นั่งดูไหมพรมกระดอนออกจากหน้าจออย่างเก้ๆ กังๆ เธอคุ้นเคยกับคอนโทรลเลอร์เพราะเธอเล่น Lego Batman แต่สำหรับมินิเกมนี้มันไม่มีความหมายอะไรเลย ลูกบอลเคลื่อนที่ช้า มุมองศาผิดเพี้ยน และ Paloma มองมาที่ผมด้วยความหงุดหงิดราวกับว่าผมไปทำอะไรให้เธอไม่พอใจเป็นการส่วนตัว", "ปัญหาเรื่องการควบคุมเกิดขึ้นตลอดทั้งเกม โดยมีการเปลี่ยนรูปแบบการควบคุมระหว่างเกมไปมาจนทำให้ต้องคอยเปิดดูผังปุ่มกดสำหรับทุกเกมที่พวกเธออยากลองเล่น สิ่งหนึ่งที่เพิ่มเข้ามาอย่างชาญฉลาดคือตัวเลือกในการปรับแต่งค่าต่างๆ เช่น พลังชีวิตรวมในบางเกม ซึ่งช่วยให้ประสบการณ์การเล่นมีความเครียดน้อยลง เด็กๆ ชอบแนวคิดของหลายเกม เช่น งานสัตวแพทย์ การแข่งม้า และการแต่งตัวตุ๊กตาแฟชั่น แต่เด็กเหล่านี้เกิดมาในยุคที่ห่างไกลจากช่วงเวลาที่คุณรู้ว่าสิ่งที่เห็นบนหน้าปกเกมนั้นแตกต่างจากภาพในเกมอย่างสิ้นเชิง ผมอาจจะสนุกไปกับการกระโดดบนพิกเซลและบทสนทนาที่แข็งทื่อได้ด้วยความโหยหาอดีตเพียงอย่างเดียว แต่ Kora และ Paloma กำลังเล่น Hogwarts Legacy พวกเธอมีเกมบน iPad และดวงตาของพวกเธอไม่เคยผ่านความเจ็บปวดจากการจ้องหน้าจอ Gameboy Color ในเบาะหลังของรถที่กำลังเคลื่อนที่", "หากคุณเป็นแฟนพันธุ์แท้ของบาร์บี้ Barbie Rewind คือการเดินทางย้อนความทรงจำที่ดีและเป็นเครื่องเตือนใจว่าเรามาไกลแค่ไหนจากยุคที่บาร์บี้ถูกนำเสนอเป็นฮอทดอกในวิกผมสีเหลือง แต่สำหรับใครก็ตามที่มีอายุต่ำกว่า 12 ปี มันเป็นเพียงเกมตกแต่งบ้านสั้นๆ ที่ไม่มีห้องน้ำ เรามีช่วงเวลาที่ดีระหว่างการทดสอบอย่างเข้มงวดกับผู้ช่วยตัวน้อยของผม และแน่นอนว่ามีเวลาไม่กี่ชั่วโมงที่สามารถสนุกไปกับการย้ายเก้าอี้ลมสีชมพูและโซฟาสีฉูดฉาดไปรอบๆ Dreamhouse ได้ แต่มีเกมเรโทรเหล่านี้เพียงไม่กี่เกมที่ยังคงสนุกเมื่อเล่นในปัจจุบัน โดยเฉพาะสำหรับใครก็ตามที่เกิดมาในยุคที่ทันสมัยกว่านี้ อย่างไรก็ตาม ผมต้องคัดค้านคะแนนที่ผู้ช่วยของผมเสนอมา ซึ่งทั้งคู่พยายามจะให้คะแนน 9.5 แต่ผมมีความกังวลทางจริยธรรมเกี่ยวกับอิทธิพลของมาร์ชเมลโลว์และสุนัขเฟรนช์บูลด็อกที่มีต่อการตัดสินใจของพวกเธอ"], "link": "https://www.ign.com/articles/barbie-rewind-review", "canonical_link": "https://www.ign.com/articles/barbie-rewind-review", "cover_image_url": "https://assets-prd.ignimgs.com/2026/11/13/untitled-november-13-2026-at-15-23-38-1794605074548.png", "gallery_images": ["https://assets-prd.ignimgs.com/2026/11/13/untitled-november-13-2026-at-15-26-38-1794605250165.png"], "videos": [], "review_score": "6", "published_ts": 1794608778, "published_at": "2026-11-13T22:26:18Z", "published_th": "14 พ.ย. 2026 • 05:26 น.", "category_hint": "Review"}, {"id": 1794801668375, "guid": "https://jp.ign.com/the-legend-of-zelda-ocarina-of-time/84604", "original_title": "『ゼルダの伝説 時のオカリナ』レビュー 僕はこのゲームをクリアしたくなかった", "thai_title": "รีวิว The Legend of Zelda: Ocarina of Time - การเดินทางในไฮรัลที่ผมไม่อยากให้จบลง", "tag": "Review", "bullet_points": ["การรีเมคครั้งนี้มอบประสบการณ์ที่ดื่มด่ำจนผู้เล่นรู้สึกไม่อยากจบเกม แม้จะเป็นเกมที่เคยเล่นมาแล้วหลายครั้ง", "งานภาพได้รับการยกระดับอย่างมหาศาลด้วยสไตล์กึ่งสมจริงที่คงเสน่ห์แบบนิทาน พร้อมประสิทธิภาพที่ลื่นไหลระดับ 60fps", "การปรับปรุงรายละเอียดของ NPC และการดำเนินชีวิตในโลกของเกม ทำให้ไฮรัลดูมีชีวิตชีวาและสมจริงกว่าที่เคยเป็นมา", "มีการปรับจูนปริศนาและระบบนำทางให้มีความสมเหตุสมผลและเข้าถึงง่ายขึ้น โดยไม่สูญเสียจิตวิญญาณดั้งเดิมของเกมต้นฉบับ"], "full_paragraphs": ["โดยปกติแล้ว วิดีโอเกมส่วนใหญ่ที่มีแนวคิดเรื่องการ 'เคลียร์เกม' มักถูกออกแบบมาให้ผู้เล่นได้รับความรู้สึกถึงความสำเร็จจากการเอาชนะอุปสรรค การเคลียร์เกมหรือการจบเกมจึงเปรียบเสมือนรางวัลที่ทำให้เราสนุกไปกับมัน แต่ในบางครั้ง ก็มีเกมที่แม้จะถูกออกแบบมาในลักษณะเดียวกัน แต่กลับทำให้เราหลงใหลจนไม่อยากให้มันจบลง สำหรับผมแล้ว การรีเมคของ The Legend of Zelda: Ocarina of Time คือผลงานชิ้นนั้นอย่างแท้จริง แม้จะรู้ว่าต้องรีบเขียนรีวิวส่งให้ผู้อ่าน แต่ผมกลับพยายามยื้อเวลาให้นานที่สุดเท่าที่จะทำได้เพื่อที่จะได้อาศัยอยู่ในโลกไฮรัลแห่งนี้ต่อไป หลังจากใช้เวลากว่า 40 ชั่วโมงในการเอาชนะกานอนดอร์ฟ (Ganondorf) ในตอนนี้ ผมกลับรู้สึกถึงความสูญเสียมากกว่าความสำเร็จที่การผจญภัยได้สิ้นสุดลงแล้ว", "การกำจัดศัตรู ไขปริศนา และพิชิตดันเจี้ยนมากมายใน Ocarina of Time ไม่ใช่ว่าไม่มีความสำเร็จในการเคลียร์เกม แต่สิ่งที่เหนือกว่านั้นคือความรู้สึกที่ได้ดื่มด่ำไปกับโลกใบนี้ ซึ่งมันช่างน่ารื่นรมย์เหลือเกิน เกมต้นฉบับที่วางจำหน่ายในปี 1998 ถือเป็นผลงานชิ้นเอกทางประวัติศาสตร์ที่ได้รับการยกย่องสูงสุดในวงการเกม สมัยที่ยังเป็นเด็กประถม ผมไม่สามารถเคลียร์เกมได้ แต่ก็เล่นไปจนถึงช่วงท้ายและหลงใหลในโลกของมันอย่างมาก เมื่อโตขึ้นผมได้กลับมาท้าทายอีกครั้งจนเอาชนะกานอนดอร์ฟได้สำเร็จ รวมถึงเวอร์ชัน 3DS (2011) ที่ผมก็เคลียร์ไปแล้ว และในปีนี้ผมก็ได้กลับมาเล่นจนจบอีกครั้งเพื่อเตรียมตัวสำหรับการรีวิวนี้ รวมแล้วผมเคลียร์เกมนี้มา 3 ครั้ง ดังนั้นผมจึงไม่มีข้อโต้แย้งใดๆ ต่อเสียงวิจารณ์ของคนทั่วโลก และผมเองก็รักเกมนี้มากเช่นกัน", "อย่างไรก็ตาม ในการเล่นเวอร์ชัน N64 และ 3DS แม้จะหลงใหลในโลกของเกม แต่ปฏิเสธไม่ได้ว่า 'การเคลียร์เกมเพื่อรับความสำเร็จ' ยังคงเป็นแรงจูงใจหลัก แต่สำหรับการรีเมคครั้งนี้ ความรู้สึกที่ว่า 'ไม่อยากเคลียร์' กลับคงอยู่จนถึงวินาทีสุดท้าย นี่เป็นครั้งแรกในรอบ 20 ปีนับตั้งแต่ The Legend of Zelda: Twilight Princess ในปี 2006 ที่ซีรีส์ Zelda 3D หันมาใช้ภาพที่ค่อนไปทางสมจริง ซึ่งต้องขอย้ำว่านี่คือ 'ความสมจริง' ไม่ใช่ 'ความสมจริงแบบภาพถ่าย' (Photorealistic)", "การออกแบบตัวละครที่ชวนให้นึกถึงละครหุ่นเชิดเป็นการถ่ายทอดบรรยากาศของต้นฉบับออกมาในรูปแบบที่ทันสมัย แสงอาทิตย์และท้องฟ้าที่สว่างไสว ภูเขาไฟและน้ำตกขนาดใหญ่ รวมถึงปราสาทสีสันสดใสที่มองเห็นได้จากระยะไกล การใช้เทคนิคเกินจริงที่ทำให้สิ่งต่างๆ ดูใหญ่โตและมีสีสันมากกว่าความเป็นจริง ทำให้เรารู้สึกเหมือนกำลังอยู่ในโลกของนิทาน ในขณะเดียวกัน ความใส่ใจในรายละเอียดก็ทำได้อย่างไร้ที่ติ หมอกในป่าที่ตอบสนองต่อการเคลื่อนไหวของลิงก์ (Link) หรือใบหญ้าที่ถูกฟันแล้วไหลไปตามกระแสน้ำ ทำให้โลกแฟนตาซีของไฮรัลดูสมจริงอย่างที่ไม่เคยเป็นมาก่อน", "ไม่ต้องสงสัยเลยว่านี่คือเกมที่สวยงามที่สุดเท่าที่นินเทนโดเคยสร้างมา นอกจากทิศทางศิลปะที่ยอดเยี่ยมแล้ว ผมยังไม่เคยเห็นกราฟิกที่ดึงศักยภาพของ Nintendo Switch 2 ออกมาได้ถึงขนาดนี้มาก่อน และประสิทธิภาพการทำงานยังคงความเสถียรที่ 60fps ได้อย่างต่อเนื่อง นี่คือโลกที่สวยงามจนแทบลืมหายใจ เคลื่อนไหวได้อย่างลื่นไหล และตอบสนองต่อการกระทำของผู้เล่นอย่างแท้จริง", "หลายคนอาจมองว่า Ocarina of Time เป็นการรีเมคที่อนุรักษ์นิยม ซึ่งอาจจะจริงในแง่ของแอ็กชัน การไขปริศนา และการดำเนินเรื่อง แต่ในแง่ของการถ่ายทอดโลกของเกม แม้จะซื่อตรงต่อต้นฉบับอย่างถึงที่สุด แต่กลับให้ความรู้สึกสดใหม่ราวกับเป็นเกมใหม่ ลิงก์ถูกปลุกโดยภูตินาวี (Navi) ในป่าที่เผ่าโคคิริ (Kokiri) อาศัยอยู่ เมื่อออกไปข้างนอก เราจะพบกับหมู่บ้านที่ถูกสร้างขึ้นอย่างละเอียดลออ หากทิวทัศน์ในเวอร์ชัน N64 หรือ 3DS คือหนังสือนิทาน ป่าโคคิริในเวอร์ชันรีเมคนี้ก็คือความเป็นจริง", "คุณอาจคิดว่า 'มันก็แค่ภาพสวยขึ้นไม่ใช่เหรอ?' แต่การปรับปรุงภาพลักษณ์ส่งผลอย่างมากต่อวิธีที่ผู้เล่นปฏิสัมพันธ์กับพื้นที่นั้นๆ สำหรับผู้เล่นที่ต้องการสำรวจโลกอย่างละเอียด Ocarina of Time คือเกมที่ตอบโจทย์ได้ทุกอย่าง ตัวอย่างเช่น ในเวอร์ชันเก่า 'พุ่มหญ้า' ถูกวางไว้เป็นวัตถุที่โต้ตอบได้ชัดเจน แต่ในเวอร์ชันรีเมค คุณสามารถฟันหญ้าทุกต้นที่เห็นได้", "ซาเรีย (Saria) เพื่อนสมัยเด็กที่นั่งเป่าโอคาริน่า เมื่อเราเดินผ่านเธอจะยิ้มให้อย่างอ่อนโยน เธอจะชมเมื่อเราได้ 'ดาบ' หรือ 'โล่' และจะแสดงความสนใจเมื่อเรากลับมาจาก 'ต้นเดกุ' (Great Deku Tree) ว่า 'เป็นยังไงบ้าง?' สิ่งเหล่านี้ทำให้ผมรู้สึกใกล้ชิดกับซาเรียมากขึ้นกว่าเดิม เนื้อเรื่องเองก็ถูกถ่ายทอดผ่านคัตซีนและบทสนทนาเพิ่มเติมที่ทำให้เราเข้าถึงอารมณ์ได้ง่ายขึ้น ความเศร้าของเผ่าโคคิริเมื่อต้นเดกุเหี่ยวเฉา ความโดดเดี่ยวของลิงก์ในการออกเดินทาง และความเหงาของซาเรีย ทั้งหมดนี้มีอยู่ในต้นฉบับ แต่เวอร์ชันรีเมคกลับเข้าถึงหัวใจได้ลึกซึ้งยิ่งกว่า", "ในต้นฉบับ เวลาจะหยุดนิ่งเมื่ออยู่ในหมู่บ้านหรือเมือง แต่ในรีเมค เวลาจะเดินไปเรื่อยๆ ไม่ว่าคุณจะอยู่ที่ไหน เพลงที่เป็นเอกลักษณ์จะเริ่มบรรเลงอย่างช้าๆ ในตอนเช้า และไหลลื่นอย่างเงียบเชียบในตอนกลางคืน บางครั้งดนตรีจะหยุดลงหลังจากเหตุการณ์ที่น่าตกใจ ผู้คนที่ซื้อของในตลาดปราสาทไฮรัลจะเดินกลับบ้านเมื่อถึงเวลาเย็น ในฐานะคนที่ชอบเกม Shenmue ผมมีความสุขมากที่ได้สังเกตว่า NPC แต่ละคนอาศัยอยู่ที่ไหน ช่างไม้ในหมู่บ้านคาคาริโกะ (Kakariko Village) ที่วิ่งวุ่นตลอดวันจะมารวมตัวกันตอนเย็นเพื่อฟังคำบ่นจากหัวหน้างาน การได้เห็นพวกเขาเดินเข้าบ้านด้วยท่าทางเหนื่อยล้าทำให้ผมอดรู้สึกเห็นใจไม่ได้", "นี่คือการถ่ายทอดชีวิตของผู้คนที่ไม่มีในต้นฉบับ แม้จะเป็นเพียงการจำลองที่จำกัด แต่ก็ทำออกมาได้อย่างประณีตและเปิดโอกาสให้ผู้เล่นได้มีส่วนร่วม หากคุณเดินข้างๆ NPC ที่กำลังเดินทาง พวกเขาก็จะมองลิงก์ขณะที่ยังคงมุ่งหน้าไปยังจุดหมายต่อไป สิ่งเหล่านี้อาจดูเป็นเรื่องเล็กน้อย แต่ผ่านการตอบสนองเล็กๆ น้อยๆ เหล่านี้ ความสัมพันธ์ระหว่างผู้เล่นและ NPC ก็ถูกสร้างขึ้นมา", "ข้อมูลในเกมไม่ได้มากมายมหาศาล แต่ท่าทางและบทสนทนาเล็กๆ น้อยๆ กลับถ่ายทอด 'ความเป็นตัวตน' ของตัวละครออกมาได้ชัดเจน จนผมสร้างเรื่องราวของลิงก์และพวกเขาขึ้นมาในหัวเอง ผมเคยพยายามขยับหลุมศพในสุสานหมู่บ้านคาคาริโกะเพื่อหาเงิน แต่เด็กชายที่อยู่ที่นั่นโกรธและบอกว่า 'ไม่ได้นะ' แม้ผมจะขยับต่อ เขาก็เริ่มจับตาดูลิงก์อย่างใกล้ชิด แต่พอถึงตอนเย็นเขากลับพูดอย่างดีใจว่า 'ได้เวลากินข้าวแล้ว!' แล้ววิ่งกลับบ้าน ท่าทีที่ดูเป็นเด็กๆ แบบนั้นช่างน่าเอ็นดู", "ปฏิกิริยาของ NPC ต่อการกระทำของผมและการเปลี่ยนแปลงตามช่วงเวลา ทำให้เกิด 'ท่าทีที่ดูเป็นธรรมชาติ' ขึ้นมาโดยบังเอิญ ในต้นฉบับ NPC มักจะยืนอยู่กับที่และพูดประโยคเดิมๆ เหมือนเกม JRPG ยุคเก่า แต่การขยายรายละเอียดให้ทันสมัยทำให้ NPC ทุกตัวมีเอกลักษณ์เฉพาะตัว แทบไม่มีตัวละครประกอบที่ไร้ความหมาย ส่วนใหญ่มีภูมิหลังที่ไม่เหมือนใคร ในยุคที่เกมส่วนใหญ่เน้นโลกเปิดที่มีข้อมูลมหาศาล เกมขนาดเล็กที่มีเอกลักษณ์เฉพาะตัวเช่นนี้ถือเป็นเรื่องหายาก ยิ่งเป็นรีเมคของเกมที่ผมผูกพันด้วยแล้ว มันจึงเป็นอะไรที่ยอดเยี่ยมมาก", "ที่ฟาร์มลอนลอน (Lon Lon Ranch) มาลอน (Malon) ยังคงร้องเพลงเหมือนเดิม แต่ตอนนี้เมื่อถึงเวลาค่ำเธอก็จะกลับเข้าบ้านและเข้านอน เธอจะขยับตัวบนเตียงและนอนหลับอย่างสมจริง เมื่อหลับตาลง เราจะได้ยินเสียงลมหายใจของเธอด้วย ผมประทับใจในรายละเอียดเล็กๆ น้อยๆ เหล่านี้ขณะมองไปรอบๆ ห้องของมาลอน บนผนังมีภาพวาดม้าและครอบครัวที่ดูเป็นฝีมือเด็กๆ ประดับอยู่", "อย่างไรก็ตาม กาลเวลาเป็นสิ่งที่ไม่อาจต้านทานได้ ไม่ว่าสิ่งที่สวยงามแค่ไหน มันก็ผ่านไปเหมือนชั่วพริบตา Ocarina of Time เป็นผลงานที่เปราะบางเช่นนั้น ลิงก์ในฐานะ 'ผู้กล้าแห่งกาลเวลา' ต้องเดินทางข้ามเวลาไป 7 ปีในกลางเรื่อง และต้องเผชิญหน้ากับโลกในฐานะผู้ใหญ่ โล่ที่เคยใหญ่เกินไปสำหรับลิงก์วัยเด็กจนทำได้แค่ป้องกันตัวจากของตก ตอนนี้เขาสามารถถือมันได้อย่างมั่นคง เกมนี้ถ่ายทอดการเปลี่ยนแปลงตามกาลเวลาผ่านระบบเกมเพลย์ได้อย่างยอดเยี่ยม และเวอร์ชันรีเมคก็สืบทอดเสน่ห์นั้นพร้อมเพิ่มรายละเอียดการเปลี่ยนแปลงเล็กๆ น้อยๆ เข้าไปอีกมากมาย", "ตัวอย่างเช่น เมื่อกลับไปที่ฟาร์มลอนลอน อินโก้ (Ingo) พนักงานที่เคยทำงานที่นั่นได้กลายเป็นเจ้าของฟาร์มและย้ายเข้ามาอยู่ในห้องของมาลอน บนผนังมีภาพวาดของอินโก้ที่ดูภูมิใจในตัวเองประดับอยู่ แต่หากผู้เล่นพยายามแก้ไขปัญหา ก็สามารถเปลี่ยนให้มาลอนกลับมาใช้ห้องเดิมได้ และเราจะได้เห็นมาลอนในวัยผู้ใหญ่ที่ไม่ได้เป็นเด็กหญิงที่ชอบวาดรูปอีกต่อไป เพียงแค่ห้องเดียวในฟาร์มก็มีรูปแบบที่แตกต่างกันถึง 3 แบบ การรีเมคครั้งนี้ไม่เพียงแต่สวยงาม แต่ยังตอบสนองต่อการไหลไปของเวลาอย่างแท้จริง", "ในหมู่บ้านคาคาริโกะหลังจากผ่านไป 7 ปี งานของช่างไม้เสร็จสิ้นและมีอาคารใหม่เกิดขึ้น หากเกิดไฟไหม้หลังจากนั้น เราจะยังเห็นร่องรอยของความเสียหายหลงเหลืออยู่ น้ำพุโซรา (Zora's Fountain) ที่เคยกลายเป็นน้ำแข็ง เมื่อน้ำแข็งละลายเราก็ยังเห็นร่องรอยของมันได้ การที่ฟิลด์ของเกมมีขนาดกะทัดรัดกว่าโลกเปิดกว้างใหญ่ ทำให้สามารถใส่รายละเอียดการเปลี่ยนแปลงเล็กๆ น้อยๆ เหล่านี้ลงไปได้", "ตัวละครเองก็มีการเปลี่ยนแปลงคำพูดและการกระทำตามสถานการณ์ มีบทสนทนามากมายที่ได้ยินเฉพาะช่วงเวลาที่กำหนดเท่านั้น ช่างไม้ที่เคยบ่นเรื่องหัวหน้างาน เมื่อดำเนินเรื่องไปถึงจุดหนึ่ง พวกเขาก็จะมารวมตัวกันและพูดคุยว่า 'ไปที่ป้อมปราการเกรูโด (Gerudo Fortress) กันเถอะ' ผมเริ่มเข้าใจถึงโครงสร้างครอบครัวของตัวละครบางตัว ข้อมูลเหล่านี้มีมาตั้งแต่ต้นฉบับ แต่ด้วยการถ่ายทอดชีวิตที่ละเอียดอ่อนของรีเมค ทำให้เราสามารถรับรู้สิ่งเหล่านี้ได้ด้วยตัวเองมากขึ้น", "การรีเมคเลือกที่จะไม่เพิ่มเควสย่อยหรือกิจกรรมมากมาย แต่เลือกที่จะใส่รายละเอียดลงไปในตัวโลกของเกมเอง แทนที่จะมีบันทึกเควสยาวเหยียด กลับมี 'สิ่งที่รู้หรือไม่รู้ก็ได้' มากมายที่ทำให้โลกนี้น่าหลงใหล ไม่ว่าจะเป็นการได้ยินบทสนทนาที่หายาก หรือการสังเกตเห็นการเปลี่ยนแปลงเล็กๆ ในห้อง แม้จะไม่ได้เปลี่ยนผลลัพธ์ของเกม แต่มันทำให้โลกนี้รุ่มรวยขึ้นมาก", "ผลกระทบจากการที่ลิงก์โตเป็นผู้ใหญ่หลังจากผ่านไป 7 ปีก็ชัดเจนขึ้น ความแตกต่างของส่วนสูงกับเผ่าโคคิริที่ไม่ยอมโตเป็นสิ่งที่น่าเชื่อถือในภาพลักษณ์ใหม่ ปฏิกิริยาของ NPC ต่อลิงก์วัยผู้ใหญ่ก็ดูละเอียดขึ้น ตั้งแต่ต้นฉบับแล้วที่ตัวละครจะตอบสนองต่อชุดของลิงก์ แต่ในรีเมค แม้แต่การใช้ไอเทม 'เลนส์แห่งความจริง' (Lens of Truth) ก็ทำให้ NPC สังเกตเห็นได้ นอกจากนี้ 'หน้ากากแห่งความจริง' (Mask of Truth) ที่ได้จากการทำเควสร้านหน้ากากยังช่วยให้คุณอ่านใจ NPC ทุกตัวได้ สำหรับคนที่คุ้นเคยกับต้นฉบับ การได้รู้มุมมองที่ค ": 1794822849510, "guid": "837991a7-5fee-4ff3-8d8a-36055edd9d48", "original_title": "Monster Hunter Outlanders Review", "thai_title": "รีวิว Monster Hunter Outlanders: การผจญภัยบนมือถือที่ถอดแบบความสนุกจากคอนโซล แต่ติดหล่มระบบกาชาและเมนูที่ซับซ้อน", "tag": "Review", "sub_tag": "MONSTER HUNTER", "bullet_points": ["Monster Hunter Outlanders นำเสนอประสบการณ์การล่ามอนสเตอร์ที่ครบเครื่องและสมบูรณ์แบบบนมือถือ โดยถอดแบบโครงสร้างมาจาก Monster Hunter World", "ระบบการเล่นถูกปรับให้เข้ากับมือถือด้วยโหมดควบคุมแบบ Adventure ที่เรียบง่าย และ Classic สำหรับผู้ที่ต้องการความแม่นยำ", "ตัวเกมมีกราฟิกที่สวยงามและลื่นไหล โดยสามารถรันบน iPhone 14 Plus ได้ที่ 45fps ในการตั้งค่าระดับสูง", "จุดอ่อนสำคัญคือระบบการจัดการที่ซับซ้อนเกินไป ทั้งระบบกาชา ระบบอัปเกรดตัวละคร และสกุลเงินจำนวนมหาศาลที่ทำให้ผู้เล่นต้องเสียเวลากับเมนูมากกว่าการล่า", "แม้จะเป็นเกมที่เล่นได้ฟรีและมีความใจกว้างในช่วงแรก แต่เมื่อถึงจุดหนึ่งผู้เล่นจะพบกับกำแพงที่ต้องใช้การฟาร์มอย่างหนักหรือการใช้เงินจริงเพื่อเร่งความคืบหน้า"], "full_paragraphs": ["หากมีแนวคิดเดียวที่นิยามความเป็น Monster Hunter ได้ดีที่สุด นั่นคือ 'การฟาร์ม' (Grind) แฟรนไชส์ระดับเมกะฮิตของ Capcom ตั้งแต่ยุค PSP เติบโตมาได้เพราะการโอบรับแนวคิดเรื่องการฟาร์มและเปลี่ยนมันให้กลายเป็นวงจรการเล่นที่สนุกจนน่าติดใจ ความซ้ำซากและนิสัยที่คุ้นเคยเป็นส่วนสำคัญของซีรีส์ ดังนั้นจึงไม่แปลกที่รูปแบบเกมกาชาบนมือถือจะถูกนำมาปรับใช้กับ Monster Hunter ในที่สุด โดยการนำสกุลเงินและเกจเวลาต่างๆ เข้ามาใส่ในประสบการณ์การสะสมและการฟาร์ม แต่สิ่งที่น่าประหลาดใจที่สุดสำหรับผมเกี่ยวกับ Monster Hunter Outlanders คือการที่มันเป็นเกม Monster Hunter ที่สมบูรณ์แบบและครบถ้วนในรูปแบบที่ย่อส่วนลงมาบนโทรศัพท์และแท็บเล็ต แม้ว่าในท้ายที่สุดมันจะถูกฝังอยู่ภายใต้กองทัพของสกุลเงินที่ต้องคอยติดตามและอุปสรรคจากระบบกาชา แต่มันก็ยังมีเนื้อหาที่เพียงพอสำหรับผู้ที่โหยหา Monster Hunter หรือเกมแนว Action RPG คุณภาพดีบนมือถือ", "เช่นเดียวกับเกม Monster Hunter ส่วนใหญ่ Outlanders ติดตามกลุ่มนักสำรวจจากกิลด์นักผจญภัย (Adventurer's Guild) ซึ่งในครั้งนี้ถูกส่งไปยังเกาะลึกลับที่ชื่อว่า Aesolan เพื่อตรวจสอบแร่ที่เรียกว่า Radiantate และอิทธิพลของมันที่มีต่อมอนสเตอร์สายพันธุ์ต่างๆ หลังจากบทนำที่เต็มไปด้วยแอ็กชัน คุณจะถูกปล่อยตัวลงบนเกาะอย่างอิสระเพื่อสำรวจสภาพแวดล้อมแรกหรือทำภารกิจเนื้อเรื่องตามที่คุณต้องการ แต่ก็เช่นเดียวกับเกม Monster Hunter ส่วนใหญ่ ช่วง 20 ชั่วโมงแรกของ Outlanders จะถูกชี้นำอย่างมากและเต็มไปด้วยบทสอนเล่นที่ดูเหมือนไม่มีวันสิ้นสุด ซึ่งถูกซ้ำเติมด้วยธรรมชาติของการเป็นเกมมือถือที่ต้องแนะนำโหมดการเล่นนับครึ่งโหล ระบบสุ่มตัวละคร สกุลเงินสำหรับการเพิ่มพลังให้นักผจญภัยของคุณ และอื่นๆ อีกมากมาย", "วิธีที่กระชับที่สุดในการอธิบาย Outlanders คือการนำ Monster Hunter World มาปรับระบบการต่อสู้ให้คล่องตัวขึ้นแล้วยัดทุกอย่างลงในเกมมือถือ ผมแทบไม่อยากเชื่อเลยว่า Outlanders จะมีความคล้ายคลึงกับ World ในทุกด้านมากขนาดนี้ แม้กระทั่งโครงสร้างทั่วไปและเนื้อเรื่อง มันใช้วิธีการที่น่าสนใจโดยการเติมเต็มเนื้อเรื่องด้วยตัวละครกลุ่มหนึ่งที่ทำหน้าที่เป็นตัวละครกาชา แม้ว่าคุณจะมีตัวละครหลักที่คุณสร้างขึ้นเองก็ตาม แม้ว่าเนื้อเรื่องโดยรวมจะรู้สึกซ้ำซากและทั่วไป แต่โลกของ Outlanders ก็ยังเต็มไปด้วยสิ่งที่น่าทำ แม้จะไม่ใช่เกม Open World แบบดั้งเดิม แต่มันใช้กรอบเดียวกับ Monster Hunter World และ Wilds ซึ่งมอบโซนขนาดใหญ่ให้คุณสำรวจ ในโซนเหล่านี้ คุณสามารถล่ามอนสเตอร์ได้ตามธรรมชาติ (โดยไม่ต้องเริ่มภารกิจ) รวบรวมทรัพยากร มีส่วนร่วมในมินิเกมเล็กๆ เช่น เกมจังหวะที่คุณต้องขโมยสมบัติของมอนสเตอร์บินได้ และทำภารกิจย่อยต่างๆ", "สิ่งที่น่าประหลาดใจที่สุดของผมเกี่ยวกับ Outlanders คือขอบเขตของโลกที่ดูไม่มีการประนีประนอม ซึ่งสอดคล้องกับเกม Monster Hunter ภาคหลัก โดยได้รับการสนับสนุนจากข้อเท็จจริงที่ว่าเกมนี้ดูสวยงามน่าทึ่งและทำงานได้อย่างราบรื่น บน iPhone 14 Plus ผมสามารถรันเกมในการตั้งค่า High ด้วยเฟรมเรตที่เสถียรที่ 45fps และแทบไม่มีอาการกระตุกเลยแม้แต่ในระหว่างการต่อสู้ที่ดุเดือด", "การสำรวจโลกให้ความรู้สึกที่น่าหลงใหลไม่ต่างจากเกม Monster Hunter ภาคหลัก ตัวเลือกต่างๆ สำหรับการสร้างแคมป์และอุปกรณ์ในขณะที่คุณสำรวจโลกทำให้ทั้งการเดินทางและการรวบรวมไอเทมง่ายขึ้น แคมป์จะปลดล็อกจุด Fast Travel และสถานที่พักผ่อน เครื่องยิงจะส่งนักผจญภัยของคุณบินไปบนเครื่องร่อนด้วยความเร็วสูง และตัวเก็บทรัพยากรจะคอยดูดซับไอเทมล้ำค่าที่คุณต้องการอยู่ตลอดเวลา", "การต่อสู้ยังคงเน้นไปที่จังหวะการรุกและรับ การรู้ว่าเมื่อใดควรเปลี่ยนจากการโจมตีเป็นการป้องกัน และการชาร์จโจมตีในเวลาที่เหมาะสม จังหวะและน้ำหนักของการต่อสู้เป็นสิ่งที่ทำให้ Monster Hunter แตกต่างจากเกมแอ็กชันอื่นๆ มาโดยตลอด และมันยังคงมีอยู่ในเกมนี้ แต่จุดที่คุณจะเห็นข้อจำกัดของมือถือคือรายละเอียดของการควบคุมการต่อสู้และระบบต่างๆ มากมายที่ใช้เพื่อปรับปรุงค่าสถานะของนักผจญภัยของคุณ", "โดยพื้นฐานแล้ว Outlanders เป็นเกม Monster Hunter แบบทีมที่คุณสร้างปาร์ตี้ประกอบด้วยตัวละครหลักของคุณและตัวละครที่คุณสุ่มได้ (สามารถเล่นมัลติเพลเยอร์กับผู้เล่นจริงคนอื่นได้เช่นกัน) แต่คุณยังสามารถเล่นเป็นตัวละครกาชาแต่ละตัวที่มีชุดท่าไม้ตาย อัลติเมท และความสามารถเฉพาะตัวได้ ตัวอย่างเช่น Keres ใช้ดาบคู่ที่เป็นกรงเล็บ ทำให้เธอมีชุดทักษะที่แยกออกมาต่างหาก รวมถึงท่าโจมตีแบบสว่านคล้าย Wolverine ในขณะที่ Luxheart มีดาบสองมือที่เขาสามารถเร่งเครื่องเพื่อยิงดอกไม้ไฟออกมา ทำให้การโจมตีแต่ละครั้งของเขาเหมือนการแสดงเล็กๆ ตัวละครที่หลากหลายเหล่านี้เป็นหนึ่งในส่วนที่ผมชอบที่สุดของ Outlanders เนื่องจากการออกแบบของพวกเขามีความโดดเด่นแบบโทคุซัทสึ (Tokusatsu) ซึ่งเข้ากับความตลกขบขันโดยรวมของ Monster Hunter ได้เป็นอย่างดี", "การมีชุดท่าที่แตกต่างกันช่วยลดความน่าเบื่อของการล่าซ้ำๆ และการฟาร์มได้มาก อย่างไรก็ตาม Outlanders มีประเภทอาวุธน้อยกว่าเกมภาคหลังๆ โดยรวมแล้วมีทั้งหมด 8 ประเภท ซึ่งอาวุธที่หายไปอย่างเห็นได้ชัดคือ Hunting Horn และ Insect Glaive และโดยรวมแล้ว Outlanders เล่นเหมือนเวอร์ชันที่ลดทอนความซับซ้อนของ World ลงเล็กน้อยในแง่ของการปรับปรุงเกมเพลย์ให้คล่องตัวขึ้น ตัวอย่างเช่น องค์ประกอบของโลกที่เกิดขึ้นเอง เช่น การใช้ Flashfly เพื่อทำให้มอนสเตอร์มึนงง จะเป็นเพียงไอคอนง่ายๆ ที่ปรากฏบนหน้าจอหากคุณอยู่ใกล้", "การเปลี่ยนแปลงที่ใหญ่กว่าคือระบบการควบคุมสองแบบของ Outlanders ได้แก่ Adventure และ Classic ระบบ Adventure จะย่อทุกอย่างลงเหลือเพียงสามปุ่ม คือ Attack, React และ Burst โดยจะเปลี่ยนปุ่มเหล่านี้โดยอัตโนมัติและตามสัญชาตญาณขึ้นอยู่กับสถานการณ์ ตัวอย่างเช่น Bowgun จะเปลี่ยนกระสุนตามสิ่งที่ได้ผลที่สุดในขณะนั้น หรือปุ่ม React อาจกลายเป็นปุ่มป้องกันแทนที่จะเป็นการหลบ", "Tom Marks ได้กล่าวไว้เมื่อวันที่ 24 กุมภาพันธ์ 2025 ว่า: 'Monster Hunter Wilds ยังคงขัดเกลาจุดที่ขรุขระของซีรีส์อย่างชาญฉลาด ลดแรงเสียดทานให้เหลือน้อยที่สุดเท่าที่จะเป็นไปได้ เพื่อไม่ให้ขวางกั้นคุณจากการหยิบอาวุธที่สนุกสนานและปักมันลงบนตัวมอนสเตอร์ แต่ในภารกิจที่จะทำให้ Monster Hunter เข้าถึงได้ง่ายขึ้น Wilds ได้ลดทอนความท้าทายลงมากจนผมแทบไม่ต้องเจาะลึกระบบอุปกรณ์ที่ซับซ้อนเลยในครั้งนี้เพื่อที่จะกลายเป็นนักล่าระดับสุดยอด การต่อสู้ที่ยืดหยุ่นมากขึ้นของมันเป็นหนึ่งในสิ่งที่สนุกที่สุดที่ผมเคยสัมผัสกับซีรีส์นี้ แต่เหมือนกับพายุสายฟ้าที่โหมกระหน่ำในทะเลทรายที่สวยงาม มันจะเผาไหม้อย่างสว่างไสวแต่เพียงชั่วครู่ จนกว่า Capcom จะปล่อยสัตว์ร้ายระดับเอนด์เกมออกมาท้าทายเราจริงๆ'", "โหมดควบคุมแบบ Classic ให้คุณควบคุมได้อย่างละเอียดมากขึ้นด้วยปุ่มเฉพาะในแบบฉบับของ Monster Hunter ทั่วไป มันทำงานได้ดีบนหน้าจอสัมผัส อาจจะดีกว่าที่ผมคาดไว้ด้วยซ้ำ แต่ถ้าคุณเลือกใช้การควบคุมแบบสัมผัส ผมขอแนะนำอย่างยิ่งให้ใช้ระบบควบคุมแบบ Adventure เพียงเพราะ Classic นั้นจัดการได้ยากหากไม่มีอุปกรณ์เสริมแบบจอยเกม ผมพบว่าวิธีที่ดีที่สุดในการเล่น Outlanders คือการใช้ Classic ร่วมกับคอนโทรลเลอร์ แต่แน่นอนว่านั่นอาจไม่ใช่ทางเลือกสำหรับทุกคนตลอดเวลา", "ข่าวดีอีกประการหนึ่งคือ Outlanders ยังคงโดดเด่นในแง่ของการออกแบบมอนสเตอร์และความหลากหลาย ซึ่งเป็นสิ่งที่จำเป็นต้องทำให้ถูกต้อง มีสิ่งมีชีวิตจำนวนมากจากทั่วทั้งซีรีส์ และมอนสเตอร์แต่ละตัวจะมีร่างที่สองที่ทรงพลังกว่าเรียกว่า 'Radiant' ซึ่งเพิ่มการโจมตีและพฤติกรรมใหม่ๆ ที่คุณต้องรับมือ Outlanders ยังคงมีองค์ประกอบที่ยอดเยี่ยมของ World และ Wilds ที่นักล่าที่ใหญ่กว่าอาจเดินเข้ามากลางการต่อสู้ของคุณ บังคับให้คุณต้องปรับตัวในทันที", "ระบบการควบคุมและการต่อสู้ที่เรียบง่ายหมายถึงการเปลี่ยนแปลงครั้งใหญ่ในวิธีการที่คุณเข้าหามอนสเตอร์ แม้ว่าคุณจะยังสามารถปีนกำแพงได้โดยการวิ่งเข้าหา แต่ไม่มีปุ่มกระโดดโดยเฉพาะ ดังนั้นคุณจึงถูกจำกัดอยู่บนพื้นในการต่อสู้เป็นส่วนใหญ่ ท่าอัลติเมทและทักษะจากตัวละครคู่หู เช่น ปืนใหญ่ที่ยิงตาข่าย ช่วยเพิ่มลูกเล่นในการต่อสู้บนพื้นดิน แต่บางครั้งผมก็แค่อยากกระโดดขึ้นไปบนหางของ Rathalos เพื่อสัมผัสช่วงเวลาที่น่าตื่นเต้นที่ผมชอบจากซีรีส์นี้ โดยรวมแล้ว ประสบการณ์การต่อสู้ที่คล่องตัวนั้นเหมาะกับสิ่งที่ Outlanders ต้องการนำเสนอ นั่นคือการเล่นสั้นๆ ที่น่าพึงพอใจ อาจจะเป็นภารกิจเดียวบนรถไฟ หรือในขณะที่คุณกำลังรอคิวที่ไหนสักแห่ง", "ระบบหลักหลายอย่างของ Outlanders ทำงานร่วมกันได้ดี แต่คำถามที่ใหญ่กว่าคือระบบการสร้างรายได้และกาชาทำงานอย่างไร อย่างที่ผมกล่าวไปก่อนหน้านี้ Monster Hunter เกี่ยวกับการฟาร์มมาโดยตลอด แต่การหาวิธีที่ไม่เหมือนใครในการทำให้การฟาร์มนั้นสนุกเป็นเรื่องสำคัญ น่าเสียดายที่ Outlanders ไม่ประสบความสำเร็จในส่วนที่สองเสมอไป เมื่อผมบอกว่าสกุลเงินและระบบโดยรวมของเกมนี้อาจสร้างความสับสนได้ ผมหมายความตามนั้นจริงๆ ผมไม่ใช่คนแปลกหน้าสำหรับเกมกาชา ผมเห็นวิวัฒนาการของพวกมันตลอดสองทศวรรษที่ผมเล่นมา แต่แม้แต่ผมก็ยังพบว่ามันยากที่จะติดตามทุกอย่างที่ต้องจัดการใน Outlanders", "นอกเหนือจากอุปกรณ์และคู่หู (เช่น Palicos) สำหรับนักผจญภัยแต่ละคนแล้ว คุณยังต้องอัปเกรดเครื่องราง (Charms) และเลื่อนระดับเครื่องรางเหล่านั้นเมื่อถึงเลเวลสูงสุด แต่เพื่อที่จะเพิ่มเลเวลสูงสุด คุณต้องเพิ่ม Ecological Rank ซึ่งมีข้อกำหนดที่แตกต่างกันหลายประการ ไม่ต้องพูดถึงว่าคู่หูมีระบบเลเวลของตัวเอง จากนั้นยังมีระบบ Insight ที่เพิ่มทักษะให้กับนักผจญภัยแต่ละคนตามแต้มทักษะที่พวกเขาได้รับจากอาวุธ จากนั้นยังมีระบบ Visage ที่คุณต้อง 'วาด' การ์ดของมอนสเตอร์ที่คุณกำจัดในโลกเมื่อคุณเอาชนะพวกมันได้ Visage หลายใบสามารถติดตั้งให้กับตัวละครแต่ละตัวได้ และ Visage ทุกใบสามารถเพิ่มระดับแยกกันได้", "ใช่แล้ว ยังมี Adventurer Rank, เลเวล Proof of Mastery และ Investigation Notes ซึ่งทั้งหมดเป็นระบบเลเวลและความรู้ที่ค่อนข้างเป็นอิสระต่อกัน นอกจากนี้ยังมีรางวัลสำหรับฤดูกาลเฉพาะที่เกมกำลังดำเนินอยู่ และกิจกรรมเปิดตัวต่างๆ ที่มีสกุลเงินของตัวเองให้ได้รับ (และหลายอย่างมีพาสเสริมที่คุณสามารถซื้อด้วยเงินจริงเพื่อรับรางวัลมากขึ้น) มีโหมดการเล่นอีกสองสามโหมดนอกเหนือจากนี้ แน่นอนว่าคุณสามารถติดตามเนื้อเรื่องหลักและสำรวจโลกได้ แต่ภายนอกนั้น คุณสามารถทำ Free Hunts สำหรับมอนสเตอร์เฉพาะ ใช้ Stamina ที่ชาร์จใหม่ได้สำหรับ Hunt Requests เพื่อรับไอเทมเพิ่มเลเวล โหมด Trial Expedition ที่ยาวนานซึ่งคุณต้องต่อสู้ 150 ครั้งที่มีความยากเพิ่มขึ้น และโหมด Guild Clash และ Guild Carnival ที่กิลด์ต่างๆ เล่นร่วมกัน", "ไม่ต้องบอกก็รู้ว่ามีสิ่งที่ต้องทำมากมายใน Outlanders และแม้จะเล่นเกมนี้ไป 30 ชั่วโมง คุณก็จะยังคงปลดล็อกโหมดใหม่ บทสอนเล่น และตัวเลือกใหม่ๆ หากระบบเหล่านี้เป็นส่วนเสริมของประสบการณ์การล่าหลักก็คงเป็นเรื่องหนึ่ง แต่บ่อยครั้งที่ระบบจำนวนมหาศาลของ Outlanders กลับขวางทางแอ็กชัน ทำให้ทุกอย่างหยุดชะงักในขณะที่คุณต้องเดินผ่านเมนูต่างๆ", "ต้องให้เครดิต Outlanders ว่าผมไม่เคยรู้สึกกดดันให้ต้องใช้เงินเลยในช่วง 30 ชั่วโมงแรก และมีวัสดุมากกว่าที่ต้องการ อย่างไรก็ตาม ณ จุดหนึ่ง อุปสรรคต่างๆ ก็เริ่มปรากฏขึ้น โดยเฉพาะอย่างยิ่งเมื่อคุณปลดล็อกตัวละครกาชามากขึ้น และจำเป็นต้องเพิ่มพลังให้พวกมัน แม้ว่าคุณจะสามารถเล่น Outlanders ต่อไปได้เมื่อเจออุปสรรคเหล่านั้น แต่ก็เห็นได้ชัดว่าเงินจริงสามารถ 'ปรับปรุง' ประสบการณ์ได้ นั่นยิ่งเป็นจริงเมื่อคุณเห็นการฟาร์มที่จำเป็นสำหรับการปลดล็อกชุดพิเศษหรือตัวละครในกิจกรรมต่างๆ", "แม้ผมจะคิดว่า Outlanders เป็นหนึ่งในเกมกาชาที่ใจกว้างที่สุดที่ผมเคยเล่นมา แต่ก็ยังมีจุดที่คุณจำเป็นต้องฟาร์มกิจกรรมต่างๆ เพื่อดำเนินเนื้อเรื่องต่อ หรือแม้แต่รอหนึ่งวันเพื่อให้ได้รับรางวัลรายวันมากขึ้น คุณจำเป็นต้องปรับปรุง Adventurer Rank, Ecological Level และอื่นๆ อย่างต่อเนื่องเพื่อไปยังภารกิจเนื้อเรื่องหลักถัดไป ในขณะที่เกม Monster Hunter หลายเกมเริ่มเปิดกว้างหลังจากผ่านไปหลายสิบชั่วโมง แต่ Outlanders กลับให้ความรู้สึกตรงกันข้าม คือการเริ่มต้นที่แข็งแกร่งซึ่งจะช้าลงอย่างหลีกเลี่ยงไม่ได้ในความซ้ำซาก ผมยังบอกได้ว่าผมไม่ชอบที่ต้องใช้เวลาเกือบ 20 เปอร์เซ็นต์ไปกับการคัดกรองเมนู และกดข้ามหน้าจอเพื่อเก็บสกุลเงินตลอดเวลา อีกครั้ง นั่นเป็นธรรมชาติที่น่าเสียดายของเกมกาชาหลายเกม แต่ Monster Hunter ก็มีการท่องเมนูของตัวเองอยู่แล้ว ดังนั้นคุณจึงได้รับผลกระทบสองเท่าที่นี่", "Monster Hunter Outlanders เป็นเพียงเกมที่มีของเยอะเกินไป มันเต็มไปด้วยความฟุ่มเฟือยสไตล์มือถือที่ต้องคอยติดตาม ซึ่งส่วนใหญ่ขัดขวางการเพลิดเพลินกับสูตรเกมเพลย์ที่แข็งแกร่งที่มันมีอย่างชัดเจน ในหลายๆ ด้าน มันน่าทึ่งจริงๆ ที่ Outlanders มีความทะเยอทะยาน และสามารถปรับเปลี่ยนความยอดเยี่ยมของ Monster Hunter World ให้มาอยู่ในแพ็กเกจที่เล็กลงได้อย่างคล่องแคล่ว การปรับปรุงการต่อสู้ให้คล่องตัวยังคงรักษาความ งเลือกที่ดีในการหลีกหนีจากความหนาวเย็นที่กำลังคืบคลานเข้ามา", "เนื้อเรื่องของ Tanuki: Pon's Summer เริ่มต้นขึ้นในชนบทอันเงียบสงบที่มีศาลเจ้าเก่าแก่เป็นศูนย์กลาง Pon เจ้าทานุกิผู้มีหน้าที่ดูแลศาลเจ้ากลับปล่อยให้สถานที่ทรุดโทรมลงเพราะมัวแต่กินขนมและเล่นวิดีโอเกม จนกระทั่งเหล่าเทพทานุกิมากดดันให้เขาต้องเร่งซ่อมแซมศาลเจ้าก่อนถึงงานเทศกาลใหญ่ Pon จึงต้องหางานทำเพื่อหาเงินมาเป็นค่าใช้จ่าย และด้วยทักษะที่มีจำกัดบวกกับจักรยาน BMX คู่ใจ เขาจึงกลายเป็นบุรุษไปรษณีย์ประจำเกาะ โดยผู้เล่นจะได้ใช้ชีวิตตลอดหนึ่งเดือนของฤดูร้อนไปกับการส่งจดหมายและทำภารกิจต่างๆ ตามปฏิทินที่กำหนดไว้", "ตัวเกาะมีขนาดไม่ใหญ่มากแต่มีความหนาแน่นของพื้นที่และจุดที่น่าสนใจหลายแห่ง Pon ต้องเรียนรู้ที่จะเดินทางอย่างมีประสิทธิภาพด้วยจักรยาน (แม้จะเดินได้ แต่ Pon ไม่สามารถกระโดดขณะเดินได้ ทำให้การใช้จักรยานเป็นวิธีที่เหมาะสมที่สุด) ซึ่งเกาะแห่งนี้ก็เอื้อต่อการปั่นจักรยานเป็นอย่างมาก โดยเฉพาะการมีพื้นที่ที่คล้ายกับลานสเก็ตพาร์ค ทำให้การส่งจดหมายไม่ใช่แค่ภารกิจที่ต้องทำ แต่เป็นหัวใจหลักของความสนุกในเกม", "ในแต่ละวัน Pon จะต้องรับจดหมายจากที่ทำการไปรษณีย์และจัดเรียงลงในตะกร้าผ่านมินิเกมสไตล์ Tetris ซึ่งเป็นเหมือนพิธีกรรมเริ่มต้นวันใหม่ที่น่าประทับใจ จากนั้นจึงออกเดินทางส่งของ แม้ตัวเกมจะเป็น Open-world ที่ให้คุณเลือกส่งของตามลำดับใดก็ได้ แต่เส้นเรื่องหลักยังคงเป็นเส้นตรง โดยมีทั้งการส่งของธรรมดาไปจนถึงภารกิจที่มีเนื้อเรื่องเกี่ยวข้องกับชาวเมืองที่มีเอกลักษณ์เฉพาะตัว เช่น เชฟซูชิและเชฟยากิโทริที่เป็นคู่แข่งกัน ช่างภาพที่ขาดแรงบันดาลใจ หรือชายหนุ่มมาดเข้มที่มีมุมอ่อนโยน", "ตัวละครเหล่านี้มีความแปลกประหลาดอย่างน่ารักและมีเรื่องราวที่น่าติดตาม เช่น คู่แข่งเชฟที่เคยมีความบาดหมางกันและไม่ค่อยเป็นมิตรกับ Pon ในตอนแรก แต่ทัศนคติของพวกเขาก็เริ่มเปลี่ยนไปเมื่อเห็นความพยายามของ Pon ในฐานะบุรุษไปรษณีย์ นอกจากนี้การผจญภัยของ Pon ยังช่วยประสานรอยร้าวระหว่างพ่อลูกที่เป็นช่างฝีมืออีกด้วย แม้ชื่อเกมจะเป็นชื่อของ Pon แต่เนื้อหาหลักกลับมุ่งเน้นไปที่ความสัมพันธ์ของผู้คนในชุมชนบนเกาะแห่งนี้มากกว่า", "หัวใจสำคัญของเกมคือมินิเกมที่หลากหลายซึ่งชาวเมืองต้องการความช่วยเหลือ เช่น การเสียบไม้ยากิโทริ การจัดเรียงซูชิ การขัดไม้ การเสิร์ฟน้ำแข็งไสและเบียร์ การคิดเงินในร้านสะดวกซื้อ การตีกลอง หรือการตีโฮมรันในสนามเบสบอล มินิเกมเหล่านี้จำลองความสนุกในวัยเด็กที่ทุกอย่างดูเป็นไปได้ และเป็นเหมือนการผจญภัยเล็กๆ ที่ช่วยคั่นเวลาในวันฤดูร้อนอันแสนยาวนาน", "อย่างไรก็ตาม ไม่ใช่มินิเกมทุกอย่างจะสนุกสนานเสมอไป บางเกมให้ความรู้สึกซ้ำซากและน่าเบื่อ เช่น การขัดไม้ที่เชื่องช้าเกินไป หรือการตัดต้นไผ่จำนวนมากเกินความจำเป็น ซึ่งบางครั้งก็ทำให้รู้สึกขัดใจที่ต้องละทิ้งความสนุกจากการปั่นจักรยานไปทำภารกิจเหล่านั้น", "คุณอาจเรียกเกมนี้ว่าเป็นเกมจำลองการส่งจดหมาย เกม BMX หรือเกมทำอาหาร ซึ่งความหลากหลายนี้สร้างความแปลกใหม่ได้ดีในหลายช่วงเวลา แต่ก็มีหลายครั้งที่ผมอยากให้เกมปล่อยให้ผมกลับไปทำสิ่งที่ชอบที่สุด นั่นคือการปั่นจักรยานของ Pon ไปรอบๆ เมือง", "หัวใจหลักของ Tanuki: Pon's Summer คือการเดินทางด้วยจักรยานที่เปลี่ยนให้เป็นกีฬาเอ็กซ์ตรีม Pon สามารถกระโดดข้ามหน้าผาเล็กๆ ไถราวเหล็ก หรือทำท่าผาดโฉนกลางอากาศได้ การควบคุมทำได้ง่ายผ่านอนาล็อกสติ๊กและปุ่มกด แต่การทำคอมโบต่อเนื่องนั้นท้าทายกว่า แม้เกมจะไม่ได้บังคับให้ผู้เล่นต้องโชว์ฝีมือมากนัก ยกเว้นภารกิจที่กำหนดเงื่อนไขคะแนนหรือเวลา แต่การได้ปั่นจักรยานทำท่าทางต่างๆ ก็เป็นสิ่งที่สนุกมากในตัวเอง ผมมักจะมองหาทางลาดเพื่อหาเส้นทางใหม่ๆ หรือกระโดดข้ามหลังคาบ้านเพียงเพื่อความสนุกส่วนตัว", "มินิเกมที่แย่ที่สุดในเกมคือเกมที่ยืดเยื้อหรือน่าเบื่อเมื่อเทียบกับการปั่นจักรยาน แม้จะเป็นมินิเกมที่ค่อนข้างสั้น แต่ก็ทำลายจังหวะการเล่นที่กำลังสนุกไปได้พอสมควร โชคดีที่ส่วนใหญ่จะไม่ซ้ำเดิม เมื่อทำเสร็จแล้ว Pon ก็จะก้าวไปสู่ภารกิจถัดไปและไม่ต้องกลับมาทำภารกิจเดิมอีก", "ส่วนสุดท้ายคือการตกแต่งศาลเจ้าซึ่งเป็นทางเลือกเสริม สำหรับผู้ที่ชอบเกมอย่าง Animal Crossing: New Horizons อาจจะถูกใจสิ่งนี้ โดยพื้นที่ศาลเจ้าจะค่อยๆ เปิดออกให้คุณตกแต่งได้ตามใจชอบ Pon สามารถเก็บของตกแต่งจากภารกิจหรือซื้อจากตัวละครคิตสึเนะได้ แม้เป้าหมายหลักคือการเตรียมศาลเจ้าสำหรับงานเทศกาล แต่สำหรับผมแล้วระบบนี้ดูเป็นส่วนเกินที่ไม่ได้มีผลกระทบต่อเกมอย่างมีนัยสำคัญ", "การเล่น Tanuki: Pon's Summer จนจบใช้เวลาประมาณ 10 ชั่วโมง ซึ่งรวมถึงการตามเนื้อเรื่อง การทำชาเลนจ์ และการเล่นจักรยาน แต่ก็มีบางช่วงที่ต้องเสียเวลาเล่นซ้ำเนื่องจากบั๊กก่อนวางจำหน่าย ระบบบันทึกอัตโนมัติของเกมยังไม่ค่อยเอื้ออำนวยนัก ดังนั้นการบันทึกด้วยตนเองบ่อยๆ จึงเป็นเรื่องที่ควรทำ", "Denkiworks ได้ปล่อยเกมนี้ออกมาในช่วงเวลาที่เหมาะสมที่สุด แม้เราจะกำลังเข้าสู่ช่วงที่หนาวที่สุดของปี แต่เกมนี้เป็นเครื่องเตือนใจถึงฤดูร้อนในวัยเด็กที่เต็มไปด้วยความสุขและความเป็นไปได้ Tanuki: Pon's Summer คือการผสมผสานระหว่างกีฬาเอ็กซ์ตรีมและการส่งของที่คั่นด้วยมินิเกม แม้จะมีบางช่วงที่น่าเบื่อไปบ้าง แต่ด้วยระยะเวลาเล่น 10 ชั่วโมง เกมนี้ก็เต็มไปด้วยความอบอุ่นทั้งในด้านสภาพแวดล้อมและเนื้อเรื่อง พร้อมด้วยความสนุกจากการปั่นจักรยาน BMX ที่ทำให้ผมยังคงนึกถึงบรรยากาศฤดูร้อนในยามที่นิ้วเท้าของผมเริ่มเย็นเฉียบ"], "link": "https://www.ign.com/articles/tanuki-pons-summer-review", "canonical_link": "https://www.ign.com/articles/tanuki-pons-summer-review", "cover_image_url": "https://assets-prd.ignimgs.com/2026/11/11/tanuki-pons-summer-blogroll-02-1794428582840.jpg", "gallery_images": ["https://assets-prd.ignimgs.com/2026/11/11/tanuki-pons-summer-yt-1794426356826.jpg"], "videos": [], "review_score": "7", "published_ts": 1794429395, "published_at": "2026-11-11T20:36:35Z", "published_th": "12 พ.ย. 2026 • 03:36 น.", "category_hint": "Review"}, {"id": 1794822849528, "guid": "8aba4e2e-fe0a-4d4c-aa1b-1675e11bf914", "original_title": "Want a New Elder Scrolls? Play Queen's Domain | IGN Quick Review", "thai_title": "รีวิว Queen's Domain: เกม RPG แฟนตาซีกลิ่นอายคลาสสิกที่แฟน Elder Scrolls และ King's Field ต้องลอง", "tag": "Review", "sub_tag": "ELDER SCROLLS", "bullet_points": ["Queen's Domain เป็นเกม RPG มุมมองบุคคลที่หนึ่งที่ได้รับแรงบันดาลใจจากซีรีส์ King's Field ของ FromSoftware ผสมผสานความยากและการสำรวจที่ท้าทาย", "ระบบการเล่นเน้นความสมจริงและการวางแผน โดยมีระบบอาวุธที่แพ้ทางกันและค่า Stamina ที่ส่งผลต่อความรุนแรงในการโจมตี", "การออกแบบฉากมีความโดดเด่นด้วยสไตล์ Metroidvania ที่ต้องใช้ความสามารถใหม่ๆ ในการเปิดเส้นทางลับและการสำรวจโดยไม่มีตัวช่วยนำทาง", "แม้จะมีอุปสรรคเรื่องความยากและการควบคุมที่อาจดูเก่า แต่ตัวเกมมอบประสบการณ์ที่สดใหม่และน่าติดตามด้วยงานภาพสไตล์ 32-bit ที่มีเสน่ห์", "เกมวางจำหน่ายแล้วบน PC, PlayStation, Xbox และ Switch 2 ในราคา 20 ดอลลาร์"], "full_paragraphs": ["ผมเป็นคนที่ชื่นชอบเกมที่ย้อนยุคไปสู่ยุค 32-bit โพลีกอนเป็นพิเศษ โดยมีเกมอย่าง Mouthwashing, Signalis, Crow Country และ Warhammer 40,000: Boltgun 2 เป็นเกมโปรดในช่วงที่ผ่านมา และล่าสุดผมได้มาติดใจกับ Queen's Domain เกม RPG แฟนตาซีที่ให้ความรู้สึกราวกับว่าเกม Elder Scrolls ถูกสร้างขึ้นมาสำหรับเครื่อง PlayStation 1 จริงๆ แล้วเกมนี้ได้รับแรงบันดาลใจมาจากซีรีส์ King's Field ของ FromSoftware ในยุคก่อนที่จะมี Dark Souls ซึ่งเน้นการต่อสู้ในมุมมองบุคคลที่หนึ่งที่เชื่องช้าและต้องใช้ความคิด รวมถึงความยากระดับลงโทษผู้เล่น (ซึ่งกลายเป็นเอกลักษณ์ของ FromSoft ในเวลาต่อมา) แต่ถึงแม้ Queen's Domain จะได้รับแรงบันดาลใจมาอย่างชัดเจน แต่มันก็เป็นประสบการณ์ที่โดดเด่นในปี 2026 ที่ถ่ายทอดความรู้สึกฝืดเคืองแบบเกมยุคเก่าออกมาได้อย่างยอดเยี่ยม", "คุณเริ่มต้นเกมด้วยการถูกซัดมาเกยตื้นบนเกาะป่าดิบชื้นหลังจากเรือของคุณถูกราชินีปีศาจดูดลงสู่ทะเล คุณต้องเผชิญกับความโดดเดี่ยวและอันตราย มีทั้งแมลงเต่าทองและจิ้งหรีดขนาดเท่ามนุษย์ที่คอยพุ่งเข้าใส่และติดตามคุณ สิ่งเดียวที่คุณมีไว้ป้องกันตัวในช่วงแรกคือดาบสนิมเขรอะที่ได้รับมาจากผู้รอดชีวิตคนอื่นๆ การต่อสู้ในช่วงแรกนั้นค่อนข้างน่าเบื่อ คุณต้องคอยถอยหลังเพื่อหลบจิ้งหรีดเมื่อเห็นท่าทางมันเริ่มโจมตี หรือเดินวนรอบแมลงเต่าทองตอนที่ปีกมันกระพือ และต้องกระโดดหลบเลเซอร์ที่ยิงมาจากพืชดวงตาที่ติดอยู่ตามผนัง (ซึ่งสามารถยิงคุณได้จากระยะไกล) มันไม่ใช่จุดเริ่มต้นที่น่าดึงดูดใจนัก แต่ผมก็มีความเชื่อมั่นว่าหากขุดลึกลงไปอีกหน่อย ผมจะต้องพบกับอัญมณีล้ำค่าอย่างแน่นอน", "ในเกมนี้ไม่มีตัวบอกเควสต์ ไม่มีจุดนำทาง หรือเส้นทางที่ไฮไลต์ไว้ให้ มีเพียงเข็มทิศทรงกลมที่ถอดแบบมาจาก King's Field โดยตรง ในฐานะคนที่ชอบเกมที่ไม่จูงมือผู้เล่นมากเกินไป ผมรู้สึกว่าต้องพิสูจน์ว่า Queen's Domain ทำปรัชญาการออกแบบนี้ออกมาได้ดีแค่ไหน ดังนั้นผมจึงค่อยๆ เดินหน้าเผชิญหน้ากับศัตรูแต่ละตัวและสำรวจซากปรักหักพังในเขตร้อนอย่างระมัดระวัง โดยรอคอยความก้าวหน้าในขณะที่ทุกอย่างตั้งแต่โครงกระดูกที่ฟื้นคืนชีพไปจนถึงแมลงปอต่างจ้องจะเอาชีวิตผม", "ด้วยแสงแวววาวจางๆ บนเนินดินนอกชายฝั่ง ผมพบเข็มขัดใส่มีดขว้างเพื่อเพิ่มคลังอาวุธที่น่าสงสารของผม ไอเทมสำคัญนั้นระบุตัวตนได้ยากมากในโลกของเกมเพราะมันกลมกลืนไปกับงานศิลปะแบบพิกเซล ดังนั้นผมจึงใช้เวลานานกว่าที่อยากจะยอมรับในการตามหามีดพวกนี้ แต่มันก็คุ้มค่าเพราะในที่สุดผมก็สามารถจัดการกับพืชดวงตาที่น่ารำคาญเหล่านั้นได้ และยังสามารถกดสวิตช์ที่ซ่อนอยู่ข้างประตูหินบานใหญ่ได้อีกด้วย ซึ่งหนึ่งในนั้นเป็นทางลัดกลับไปยังจุดเซฟและอีกทางหนึ่งนำไปสู่ห้องเก็บศพใต้ดิน เกมไม่ได้บอกให้คุณทำสิ่งเหล่านี้ แต่ด้วยการสำรวจและลองผิดลองถูกกับโลกของเกม คุณจะค้นพบสิ่งเหล่านี้ได้โดยธรรมชาติ", "ระหว่างทาง ผมเก็บหอกที่สร้างความเสียหายแบบเจาะเกราะและกระบองไม้ที่สร้างความเสียหายแบบทุบ ซึ่งทั้งสองอย่างช่วยเสริมความเสียหายแบบฟันจากดาบสนิมของผม ซึ่งผมได้อัปเลเวลความชำนาญจากการใช้งานมันมาตลอด ตอนนี้ระบบแพ้ทางอาวุธเริ่มชัดเจนขึ้น ศัตรูแต่ละตัวจะแพ้ทาง เป็นกลาง หรือต้านทานความเสียหายประเภทต่างๆ ดังนั้นการสลับอาวุธจึงกลายเป็นส่วนหนึ่งของการเต้นรำในการต่อสู้ที่เชื่องช้า ผมควรกล่าวด้วยว่าค่า Stamina เป็นปัจจัยที่สำคัญที่สุดในการสร้างความเสียหาย การโจมตีแต่ละครั้งจะลดแถบ Stamina ลง และยิ่งคุณมี Stamina เหลือมากเท่าไหร่ คุณก็จะสร้างความเสียหายได้มากขึ้นเท่านั้น มันฟื้นฟูได้อย่างรวดเร็ว แต่คุณไม่สามารถกดโจมตีรัวๆ เพื่อผ่านศัตรูไปได้ ซึ่งยิ่งเน้นย้ำถึงวิธีการต่อสู้ที่ต้องมีการคำนวณอย่างรอบคอบ", "ในห้องเก็บศพใต้ดินที่ผมกล่าวถึง สิ่งต่างๆ เริ่มไหลลื่นขึ้นเมื่อผมเข้าใจกลไกนี้และเริ่มตอบสนองต่อรูปแบบการโจมตีได้ดีขึ้น ศัตรูถูกออกแบบมาให้มีความดิบตามจิตวิญญาณของเกมเก่า ด้วยท่าโจมตีแบบเดียวและพฤติกรรมที่คาดเดาได้ และเมื่อคุณต้องรับมือกับศัตรูหลายตัวพร้อมกัน นั่นคือจุดที่ความท้าทายที่น่าสนใจยิ่งขึ้นปรากฏขึ้น ด้วยท่าโจมตีสำรองของกระบอง ผมสามารถพุ่งเข้าใส่โครงกระดูกและหลบออกมาได้ก่อนที่พวกมันจะแทงสวนกลับมา และการชาร์จการโจมตีหลักหมายความว่าผมสามารถจัดการกับจิ้งหรีดได้ด้วยการฟันเพียงไม่กี่ครั้ง", "เนื่องจากไม่มีระบบบันทึกอัตโนมัติและความตายหมายถึงการสูญเสียความคืบหน้าอันมีค่า (จุดเซฟมีอยู่อย่างจำกัด) การพบกุญแจประตูที่ปลายห้องเก็บศพจึงเพิ่มความตึงเครียดขึ้นไปอีก ตอนนี้ผมแค่ต้องเอาชีวิตรอดเพื่อกลับไปยังจุดเซฟเพียงจุดเดียวของผม นี่คือการตัดสินใจออกแบบสไตล์เก่าอีกอย่างหนึ่งที่แม้จะน่าหงุดหงิด แต่มันก็ช่วยเสริมการออกแบบโลกของ Queen's Domain และแนวทางในการรับมือกับความท้าทายโดยรวมของเกม", "กุญแจเปิดประตูที่ท่าเรือริมฝั่ง ซึ่งนำไปสู่ลานประลองปิดตายสำหรับการต่อสู้กับบอสตัวแรก ผมเห็นแถบเลือดที่กว้างเต็มหน้าจอโผล่ขึ้นมา และให้ตายเถอะ Shrine Guardian ที่เป็นโครงกระดูกนั้นใหญ่และดุดันกว่าทุกสิ่งที่ผ่านมา และทำให้ผมล้มลงด้วยการฟันดาบที่ชาร์จพลังมา การหลบออกจากระยะโจมตีของมันเป็นส่วนที่ยากที่สุดและผมก็โดนอัดยับในการลองครั้งแรก แต่แล้ว... อ๋อ! ท่าสำรองของหอกคือการถอยหลังอย่างรวดเร็ว ดังนั้นถ้าผมล่อบอสแล้วใช้ท่าถอยหลังโจมตีสวนกลับล่ะ? แล้วค่อยขว้างมีดใส่ในขณะที่ล่อหลอกมันเพื่อรอให้ Stamina ฟื้นฟู? งานง่ายเลย", "สิ่งนี้เน้นย้ำถึงความสำคัญของท่าโจมตีสำรอง และการเอาชนะมันทำให้ผมได้รับรางวัลเป็นดาบศักดิ์สิทธิ์เล่มใหม่ที่คมกริบพร้อมท่าสำรองที่ช่วยให้คุณร่อนกลางอากาศได้ชั่วครู่ ยอดเยี่ยมมาก ทั้งดาเมจที่สูงขึ้น รูปลักษณ์ที่เท่ขึ้น และวิธีใหม่ในการสำรวจ... เดี๋ยวนะ นี่มันเปิดเส้นทางมากมายที่ผมเคยคิดว่าเข้าไม่ได้! สะพานที่พังทลายนำไปสู่การค้นพบที่สำคัญสำหรับเควสต์หลัก รวมถึงอาวุธคบเพลิงเวทมนตร์ กิ่งไม้ที่ทำหน้าที่เป็นแพลตฟอร์มนำไปสู่พื้นที่ที่ผมต้องต่อสู้กับฝูงโครงกระดูกและแมลง จากนั้นใช้คบเพลิงเวทมนตร์จุดไฟที่หอคอยเพื่อดำเนินเนื้อเรื่องต่อไป คัมภีร์ลึกลับจะกระตุ้นความอยากรู้อยากเห็นของผมเกี่ยวกับโลกและนำทางผมไปข้างหน้าโดยไม่บอกตรงๆ และรอยแตกข้างอาคารที่พังทลายก็มีรางวัลจริงและไอเทมสำคัญอย่างการอัปเกรดพุ่งกลางอากาศ", "ถ้าผมต้องชี้ให้เห็นถึงสิ่งหนึ่งที่ผมคิดว่าอัจฉริยะเกี่ยวกับ Queen's Domain มันคือวิธีที่การออกแบบฉากนำทางคุณในการสำรวจอย่างเป็นธรรมชาติ ในการที่ไม่มีแผนที่ คุณต้องพึ่งพาการสังเกตโลกเพื่อหาเบาะแสทางสายตาและจดจำผังของมัน คุณจะต้องจดจำพื้นที่ที่คุณยังสำรวจไม่ครบและเส้นทางไหนที่คุณควรกลับมาหลังจากปลดล็อกสิ่งใหม่ๆ สิ่งที่คุณถูกขอให้ทำนั้นไม่ใช่เรื่องแปลกใหม่ แต่การที่เกมโยนภาระให้คุณเป็นคนคิดหาคำตอบเองทำให้ประสบการณ์นี้น่าสนใจยิ่งขึ้นมาก", "ไอเทมฟื้นฟูพลังชีวิตมีจำกัดในช่วงแรก และการพักที่จุดเซฟจะทำให้ศัตรูเกิดใหม่ มันเป็นโลกที่อันตราย และการออกไปผจญภัยเพื่อหวังจะก้าวหน้าต่อไปนั้นเป็นเรื่องที่น่าหวั่นใจ ปัญหาอย่างการติดขัดกับฉากระหว่างการโจมตีอาจทำให้หงุดหงิดเมื่อชีวิตเป็นเดิมพัน และศัตรูบางประเภทก็จัดการได้น่ารำคาญ ความหงุดหงิดเล็กน้อยอาจบั่นทอนความกระตือรือร้นของผมไปบ้าง แต่ผมก็เต็มใจที่จะลุยผ่านน้ำที่ขุ่นมัวเหล่านั้น เพราะภายในหลักการออกแบบที่ดูโบราณเหล่านี้คือเกม RPG ที่สดใหม่และน่าพึงพอใจอย่างประหลาด", "จังหวะการเล่นเปลี่ยนไปพอสมควรตลอดพื้นที่ Water Temple ซึ่งผมเคลียร์ได้ตอนเล่นไปประมาณหกชั่วโมง การตะลุยดันเจี้ยนนั้นมีจังหวะที่ดีมาก ผมไม่เคยรู้สึกหลงทางและผังของมันมีความสมดุลระหว่างความเข้าใจง่ายกับการกระตุ้นความอยากรู้อยากเห็น มันทำให้ผมตระหนักว่าเกมนี้มีกลิ่นอายของ Metroidvania ที่มีความสามารถที่ขยายขอบเขตในการเปิดเส้นทางใหม่ๆ ซึ่งชัดเจนมากเมื่อผมได้รับการอัปเกรดพุ่งกลางอากาศครั้งที่สองที่นี่เพื่อข้ามช่องว่างขนาดใหญ่ไปยังส่วนสุดท้ายของดันเจี้ยน ผมเริ่มคุ้นเคยกับการต่อสู้มากขึ้น รู้สึกผ่อนคลายขึ้นด้วยคลังอาวุธที่เพิ่มขึ้น รวมถึงกระบองหนามที่สร้างความเสียหายสองประเภทและลูกไฟจากคบเพลิงเวทมนตร์ ถึงอย่างนั้น มันก็ยังมีการต่อสู้ที่ยากลำบากกับสัตว์ทะเลมีพิษและแมลงก้ามปูตลอดดันเจี้ยนที่ยาวนานนี้ ซึ่งยังคงต้องใช้วิธีการที่รอบคอบโดยใช้ความสามารถที่มีอยู่อย่างจำกัดอย่างชาญฉลาด ซึ่งจะถูกทดสอบเพิ่มเติมในการต่อสู้กับบอสของดันเจี้ยนที่เป็นราชาปลาวาฬที่ถูกกัดกิน ซึ่งคอยเรียกสมุนและปล่อยคลื่นน้ำพิษออกมา", "หลังจากออกมาจากท่อระบายน้ำและจุดไฟที่หอคอยอีกแห่ง ผมพบเครื่องเทเลพอร์ตที่ระบุว่าผมยังมีพื้นที่อีกอย่างน้อยแปดแห่งรออยู่ข้างหน้า ตอนนี้ผมเข้าใจขอบเขตของ Queen's Domain อย่างชัดเจนแล้ว และเมื่อผมเข้าใกล้พื้นที่ถัดไป ซึ่งเป็นห้องสมุดที่สาปแช่งและวนเวียนอยู่ใน Tower of Knowledge ผมรู้สึกว่าการผจญภัยนี้กำลังจะลึกซึ้งยิ่งขึ้น แต่มันเป็นเกมที่ผมจะเติบโตไปพร้อมกับมัน เห็นได้ชัดจากวิธีที่ผมจัดการกับบอสเฝ้าประตูอย่าง Skeletal Executioner โดยแทบไม่มีรอยขีดข่วนด้วยการหลบกระสุนขวานของมัน ร่ายเวทคบเพลิง และชาร์จดาบศักดิ์สิทธิ์ ผมได้เข้าสู่สภาวะลื่นไหลแล้ว", "ส่วนหนึ่งในใจผมกำลังคิดว่าเกมจะรักษาโมเมนตัมนี้ไว้ได้อย่างไร จะจัดการกับการเพิ่มระดับพลังอย่างไร และจะพัฒนาในรูปแบบที่จะทำให้ประหลาดใจต่อไปได้อย่างไร ตั้งแต่การเก็บเหรียญโบราณเพื่อแลกอาวุธที่เฉียบคมขึ้นและเครื่องรางเพื่อเพิ่มสเตตัส รางวัลเล็กๆ น้อยๆ เหล่านั้นเป็นสิ่งที่น่าลิ้มลอง การเดิน อเป็นผลงานที่ทั้งผู้เล่นหน้าใหม่และแฟนเก่าไม่ควรพลาด"], "full_paragraphs": ["ผมมีเพื่อนคนหนึ่งที่ได้สัมผัส The Legend of Zelda: Ocarina of Time ครั้งแรกในช่วงที่เกมเพิ่งวางจำหน่ายใหม่ๆ ซึ่งเป็นช่วงที่เขาเพิ่งกลับจากมหาวิทยาลัยมาฉลองคริสต์มาสที่บ้าน สำหรับผม นี่คือช่วงเวลาที่ดีที่สุดในการเล่นวิดีโอเกม ไม่ใช่เพราะเทศกาลคริสต์มาสโดยเฉพาะ แต่เพราะมันเป็นช่วงเวลาที่คุณได้หลุดออกจากโลกแห่งความเป็นจริงและมีเวลาว่างหลายสัปดาห์โดยไม่มีภาระใดๆ มาคอยรบกวน หลายปีต่อมา เพื่อนคนนี้บอกผมว่าความมหัศจรรย์ของเกมนี้ไม่ได้อยู่ที่การเล่นเพียงอย่างเดียว แต่อยู่ที่ 'วิธีการ' ที่การเล่นนั้นดำเนินไป", "สิ่งที่เขาหมายถึงคือ เขาจะเล่นเกมทั้งวันโดยปิดม่านหน้าต่าง ไม่สนใจครอบครัว มุ่งมั่นฝ่าฟันดันเจี้ยนและควบม้า Epona วิ่งไปทั่วทุ่ง Hyrule Field จากนั้นในตอนเย็น เขาจะโทรหาแฟนสาวที่กลับไปฉลองคริสต์มาสกับครอบครัวของเธอ เธออยากรู้เสมอว่าวันนี้เขาทำอะไรมาบ้าง และไม่ใช่เรื่องราวใน East Sussex ที่เธออยากฟัง แต่เธออยากรู้ว่าเขาได้ไปผจญภัยอะไรมาบ้างใน Hyrule", "ดังนั้น ในขณะที่เขาเล่นเกม เขาจะหยุดพักเป็นระยะเพื่อเล่าให้ใครสักคนฟังว่าเขาได้พบเจออะไร ได้ค้นพบอะไร และยังมีอะไรที่ต้องเอาชนะอีกบ้าง วันนี้ผมมีความยินดีอย่างยิ่งที่จะบอกคุณว่า ประมาณ 30 ปีให้หลัง หลังจากที่ผมได้กลับมาสัมผัสเกมนี้อีกครั้งในเวอร์ชันรีเมคใหม่ของ Nintendo ผมขอยืนยันว่า Ocarina of Time ยังคงเป็นเกมที่คุ้มค่าแก่การบอกต่อ มันยังคงเป็นการผจญภัยที่น่าประหลาดใจ น่าพึงพอใจ และซาบซึ้งใจจนผมอดไม่ได้ที่จะต้องพูดถึงมัน", "อย่างไรก็ตาม แม้ว่าเกมนี้จะเป็นผลงานระดับมาสเตอร์พีซที่ไร้ที่ติ แต่ปฏิกิริยาของผมที่มีต่อการกลับมาเล่นครั้งนี้กลับเป็นเรื่องน่าประหลาดใจ หรือจะพูดให้ถูกคือ มันน่าประหลาดใจเพราะเกมนี้เป็นมาสเตอร์พีซนั่นเอง ความจริงคือเมื่อสองสัปดาห์ก่อน ผมไม่ได้รู้สึกโหยหาที่จะกลับไปเล่น Ocarina of Time เลยแม้แต่น้อย ผมรู้สึกกังวลใจด้วยซ้ำว่าจะต้องมานั่งลุยเกมที่เคยยิ่งใหญ่ในอดีตและต้องมาเขียนบทความนับพันคำด้วยความเคารพแบบจำยอม", "โชคดีที่ผมลืมไปสองอย่าง อย่างแรกคือผมมันงี่เง่าที่ลืมไปว่าทุกโอกาสที่จะได้เล่น Zelda อีกครั้งคือสิ่งที่ไม่ควรพลาด และอย่างที่สองคือ ผมลืมไปว่า Ocarina of Time เป็นมาสเตอร์พีซในรูปแบบไหนกันแน่ และนอกจากประเด็นหลังนี้ ซึ่งเราจะมาเจาะลึกกันในภายหลัง ผมยังไม่รู้ด้วยซ้ำว่ามี 'ส่วนผสมลับ' ในเวอร์ชันรีเมคนี้ที่พิสูจน์แล้วว่าสำคัญอย่างยิ่งต่อความยิ่งใหญ่ของมัน ซึ่งไม่ได้เกี่ยวข้องอะไรเลยกับโค้ดที่รันบนเครื่อง Switch 2", "มาพูดถึงหน้าที่ของเวอร์ชันรีเมคกันก่อน นี่คือเกมที่แทบจะเหมือนกับที่ผู้คนเคยเล่นในปี 1998 จังหวะของการผจญภัยที่ Link ต้องเดินทางข้ามยุคสมัยใน Hyrule เพื่อเอาชนะ Ganon ยังคงเหมือนเดิม คุณยังคงเริ่มต้นใน Kokiri Forest และยังคงควบม้า Epona กระโดดข้ามรั้วที่ Lon Lon Ranch ซึ่งเป็นหนึ่งในฉากที่น่าตื่นเต้นและขนลุกที่สุดในประวัติศาสตร์ศิลปะ หากคุณติดอยู่ในดันเจี้ยน คุณแทบจะสามารถใช้บทสรุปเดิมจากเกม N64 เพื่อผ่านมันไปได้ โลกของเกมยังคงถูกแบ่งเป็นส่วนๆ ที่ค่อยๆ โหลดเข้าและออกเมื่อคุณเคลื่อนที่ผ่าน และเกมยังคงเริ่มต้นด้วยฉากเปิดที่ตราตรึงใจ ซึ่ง Link และ Epona ควบม้าผ่านเนินเขาที่มีหมอกและแสงจันทร์เบื้องหลัง เหมือนหลุดออกมาจากผลงานของ Zelda ที่ผสมผสานกับ Susan Cooper", "แต่มีการเปลี่ยนแปลงอะไรบ้าง? อย่างแรกคือทั้งเกมได้รับการอัปเดตด้วยกราฟิกสมัยใหม่ และตัดระบบกล้องแบบคงที่ออกไปทั้งหมด เพื่อเปลี่ยนมาใช้ระบบการเคลื่อนไหวแบบยุคใหม่ที่ใช้จอยสติ๊กหนึ่งข้างควบคุมตัวละครและอีกข้างควบคุมกล้อง ตัวอย่างเช่น Hyrule Castle Town ในความทรงจำของผมมักจะมีกล้องอยู่ตรงกลาง และคุณจะต้องหมุนตัวไปตามถนนราวกับม้าบนม้าหมุนในสวนสนุก", "ตอนนี้มันกลายเป็นพื้นที่ที่อิสระเหมือนใน Frozen ถนนหินทอดยาวไปทุกทิศทางและคุณสามารถสำรวจได้โดยมีกล้องวิ่งตามหลังคุณ พื้นที่ในเกมรู้สึกเหมือนเป็นพื้นที่วิดีโอเกมจริงๆ มากกว่าที่จะเป็นเครื่องจักรซับซ้อนที่คุณเป็นเพียงฟันเฟืองตัวหนึ่ง ใช่ครับ จากวิธีที่ผมพูด ผมเห็นแล้วว่ามีการแลกเปลี่ยนบางอย่างเกิดขึ้น ผมเคยชอบความรู้สึกในเกม 3D ยุคแรกที่ทุกอย่างดูเหมือนเป็นกลไกที่ชาญฉลาดและพร้อมจะพังทลายลงได้ทุกเมื่อ แต่ก็นั่นแหละ! Ocarina เวอร์ชันใหม่นี้เป็นเกมที่คุณสามารถให้เด็กๆ ที่ไม่ได้เกิดในปี 1998 เล่นได้ และพวกเขาจะรู้สึกคุ้นเคยกับมันได้เร็วกว่า", "บางครั้งการอัปเดตทางกราฟิกก็ยอดเยี่ยมจริงๆ เส้นทางไปสู่ Zora's Domain ซึ่งผมแทบจำไม่ได้ในต้นฉบับ ตอนนี้กลายเป็นการปีนป่ายผ่านหน้าผาและโขดหินที่สวยงาม ในขณะที่สีสันสไตล์ Nickelodeon ยุค 90 และพื้นผิวที่มันวาว ทำให้ท้องของ Jabu Jabu กลายเป็นส่วนผสมระหว่างงานปาร์ตี้ก่อนยุคมิลเลนเนียมกับสนามเด็กเล่นในร่มยุคใหม่", "อย่างไรก็ตาม สถานที่ที่ผมชอบที่สุดคือดันเจี้ยนช่วงกลางเกมสองแห่ง Water Temple ตอนนี้กลายเป็นพระราชวังใต้น้ำสไตล์ Art Nouveau ที่คุณสามารถจินตนาการได้ว่ากัปตัน Nemo จะมาเดินเล่นที่นี่ และ Forest Temple ซึ่งเป็นดันเจี้ยน Zelda ที่ผมชอบที่สุดตลอดกาล กลายเป็นคฤหาสน์สังหารที่มีพื้นไม้ปาร์เกต์ซึ่งถูกต้นไม้เข้ายึดครอง ทางเดินที่บุด้วยไม้สีเข้มและชิ้นส่วนแปลกๆ ของโบสถ์ที่โผล่ออกมาจากพุ่มไม้ มันเป็นสถานที่ที่คุณอาจได้ยินในพอดแคสต์คดีฆาตกรรมแปลกๆ", "แต่ก็มีการแลกเปลี่ยนเกิดขึ้น ภรรยาของผมซึ่งเป็นแฟนตัวยงของเกมต้นฉบับมักจะเดินเข้ามาดูในขณะที่ผมเล่น และมักจะรู้สึกว่าเกมที่เธอจำได้นั้นมีเอกลักษณ์ทางภาพที่มากกว่าเล็กน้อย ตัวอย่างเช่น ฉากที่คุณสู้กับ Dark Link ได้สูญเสียความรู้สึกหลอนๆ แบบกึ่งจริงกึ่งฝันไปบ้าง แม้ว่าการจัดวางฉากที่มีต้นไม้เก่าแก่กลางห้องที่เต็มไปด้วยควันจะยังคงดูแปลกตาอย่างน่าประหลาดก็ตาม ในช่วงท้ายของเกมเมื่อเข้าสู่ดินแดน Gerudo คุณอาจจะสงสัยว่าคุณหลุดเข้าไปในเกม Unreal Engine มุมมองบุคคลที่สามที่กำลังพัฒนาอยู่ในปัจจุบันหรือไม่ มันดูสวยงาม แต่บางครั้งมันก็ดูไม่เหมือน Zelda เท่าไหร่นัก", "ทั้งหมดนั้น รวมถึงโมเดลตัวละครที่ดูแปลกตาซึ่งผมก็เรียนรู้ที่จะรักมันในที่สุด ไม่ได้มีความสำคัญมากนัก ไม่ใช่เพราะเหตุผลอื่นใดนอกจากมีการปรับแต่งเล็กๆ น้อยๆ ที่ชาญฉลาดในส่วนอื่น ทำให้ Ocarina ตอนนี้ดำเนินไปอย่างรวดเร็วอย่างน่าทึ่ง และทั้งหมดนี้มาพร้อมกับการลดบทบาทของ Navi ภูติน้อยและนกฮูกที่คอยขัดจังหวะ ซึ่งในต้นฉบับมีไว้เพื่อช่วยนำทางคุณในช่วงแรกอยู่แล้ว", "การปรับแต่งเหล่านี้ยอดเยี่ยมมาก ตอนนี้ Link มีปุ่มกระโดด ซึ่งช่วยตัดการกระโดดตามบริบทของเกมต้นฉบับออกไป และทำให้ท่าโจมตีแบบกระโดดดูน่าประทับใจยิ่งขึ้น ยิ่งไปกว่านั้น การยืมระบบจากเวอร์ชัน 3DS มาใช้ ทำให้คุณสามารถสลับไอเทมที่ใช้งานได้ผ่านเมนูย่อยที่ปุ่ม Trigger และสามารถเปลี่ยนรองเท้าหรืออุปกรณ์สวมหัวได้ด้วยปุ่มทิศทาง", "ฟังดูอาจจะไม่ใช่เรื่องใหญ่ แต่มันเป็นการเปลี่ยนแปลงที่เงียบเชียบแต่ทรงพลังในแบบที่การอัปเดตที่ดีที่สุดควรจะเป็น ลองดูที่ Water Temple สิครับ นี่คือดันเจี้ยนที่เป็นตำนานในเรื่องความยากและความอดทนที่ต้องใช้ในการนำทางผ่านสภาพแวดล้อมที่สามา การได้เล่นเกมแบบนี้ เกมที่เกี่ยวกับเรื่องเหล่านี้ หลังจากผ่านไปเกือบ 30 ปี ทำให้จินตนาการและความทรงจำของคุณได้รับการยกระดับแบบ IMAX ผมตระหนักได้ว่านี่ไม่ใช่แค่เกมเกี่ยวกับการผ่านไปของเวลาและวิธีที่โลกดูแตกต่างออกไปเมื่อคุณยังเด็กเมื่อเทียบกับตอนที่คุณโตขึ้น (ผมไม่เคยตระหนักเลยว่า Link ผู้ใหญ่ต้องผ่านดันเจี้ยนเดิมที่ Link เด็กเคยผ่าน แต่ตอนนี้มันยากขึ้นและมีความหมายมากขึ้น) แต่มันยังเป็นเกมที่ผู้เล่นหลายคนได้ใช้วัดช่วงเวลาต่างๆ ในชีวิตของพวกเขาโดยรู้ตัวหรือไม่ก็ตาม", "ครั้งนี้ เมื่อผมไปถึง Fairy Fountain แห่งแรก ผมจำได้ว่าภรรยาของผมเดินเข้าพิธีแต่งงานด้วยเพลงนี้ (ซึ่งคนในสำนักงานทะเบียนเกือบครึ่งจำทำนองได้พร้อมกับเสียงหัวเราะเบาๆ) จากนั้นก็มี Water Temple ซึ่งกลายเป็นคำศัพท์ในวัฒนธรรมป๊อปสำหรับความท้าทายที่เอาจริงเอาจัง ผมต้องเผชิญกับเรื่องแย่ๆ ในชีวิตมากแค่ไหนโดยการเรียกจิตวิญญาณของ Link ที่กำลังจะเข้าสู่สถานที่แห่งนี้", "ผู้เล่นสามารถเปลี่ยนความเร็วในการหมุนกล้องและเปิด/ปิดการเล็งด้วยการเคลื่อนไหว (Motion Control) การเล็งสามารถควบคุมได้โดยการกดปุ่มค้างไว้หรือสลับปุ่ม Ocarina สามารถควบคุมได้ด้วยไมโครโฟนหรือปุ่มกด และสามารถเปิดหรือปิดการสั่นของคอนโทรลเลอร์ได้", "มีการมาถึงครั้งแรกที่ Hyrule Field ซึ่งเป็นทั้งคำมั่นสัญญาของทุกสิ่งที่เกมกำลังจะกลายเป็นในปี 1998 และเป็นช่วงเวลาสั้นๆ ในวัยเด็กที่ขอบเขตของโลกเปลี่ยนไปอย่างกะทันหัน เกมนี้ไม่ได้แค่ส่งผมกลับไปสู่ความทรงจำเท่านั้น แต่มันทำให้ผมกลับไปสนทนากับทุกคนที่ผมรู้จักที่เคยรักเกมนี้ ผมเล่นมันตอนนี้และคิดว่าผมกำลังคุยกับเพื่อนที่เล่นมันที่มหาวิทยาลัย หรือภรรยาของผมที่รักมันก่อนที่เราจะพบกันเสียอีก", "มันดีขนาดนี้มาตลอดเลยหรือเปล่า? ดันเจี้ยนซับซ้อนและท้าทายขนาดนี้มาตลอดเลยไหม? บอสต่างๆ ถูกขับเคลื่อนด้วยแนวคิดที่น่าสนใจ ดราม่า และอารมณ์ขัน มากกว่าความยากใช่หรือไม่? โลกนี้เต็มไปด้วยตัวละครรองที่ติดอยู่ในความทรงจำมาตลอดเลยหรือเปล่า ทั้งนักเล่นหีบเพลงในกังหันลม คนขุดหลุมศพที่มีทัวร์ส่วนตัวที่เขาอยากให้คุณลอง? เป็นไปไม่ได้ที่ผมจะตอบได้ในตอนนี้ นี่คือ Ocarina ในแบบที่มันเป็นมาตลอด เป็นอมตะและซับซ้อน แต่ในขณะเดียวกันมันก็มีความสดใสและความชัดเจนที่ทำให้รู้สึกเหมือนเพิ่งถูกสร้างขึ้นเมื่อวันพุธที่ผ่านมา หากคุณเป็นมือใหม่สำหรับ Zelda และเพิ่งมาเล่นเกมนี้ คุณจะหลงรักมันแน่นอน ใครสักคน ที่ไหนสักแห่ง กำลังจะได้เล่นเกมที่พิเศษขนาดนี้เป็นครั้งแรกจนพวกเขาต้องโทรหาเพื่อนเพื่อเล่าให้ฟัง แต่ถ้าคุณเป็นคนที่กลับมาเล่นเกมนี้ล่ะ? คุณจะพบว่าคุณยังคงได้รับประสบการณ์ที่สดใหม่เหมือนครั้งแรกที่ได้สัมผัส", "พ่อของผมเคยบอกว่าคุณควรอ่าน Don Quixote สามครั้งในชีวิต และผมเพิ่งตระหนักได้เมื่อไม่นานมานี้ว่าเขาหมายความว่าหนังสือเล่มเดิมจะเปลี่ยนไปเพราะตัวคุณเปลี่ยนไป ดังนั้น เมื่อผมไปถึง Deku Tree ในช่วงเริ่มต้นของ Ocarina เมื่อไม่กี่สัปดาห์ก่อน และผมทำดันเจี้ยนสำเร็จพร้อมกับดูภาพนิมิตที่เป็นไปไม่ได้ของ Deku Tree ที่กำลังตายด้วยความเหนื่อยล้า? ผมจำได้ว่าครั้งแรกที่ผมมาที่นี่เมื่อเกือบ 30 ปีที่แล้ว ผมอดไม่ได้ที่จะระบุตัวตนว่าเป็น Link ที่เพิ่งได้รับดาบและโล่ ผ่านไปหนึ่งดันเจี้ยน และพร้อมสำหรับสิ่งที่กำลังจะเกิดขึ้น ครั้งนี้ ผมคิดว่าผมใกล้เคียงกับการระบุตัวตนว่าเป็น Deku Tree มากกว่า", "และนี่คือส่วนที่สำคัญที่สุด: นี่ไม่ใช่ความคิดที่น่าหดหู่ แต่มันหมายความว่าผมได้เดินทางไกลเพื่อมาถึงจุดนี้ และเกมที่น่าทึ่งนี้ก็ได้เดินทางไกลเช่นกัน แต่เราก็มาถึงจุดนี้ด้วยกัน และเราต่างก็ถูกเปลี่ยนแปลงไป และนั่นคือเหตุผลจริงๆ ว่าทำไมวิดีโอเกมเหล่านี้ถึงมีความหมาย", "สำเนาของ The Legend of Zelda: Ocarina of Time ได้รับการสนับสนุนสำหรับการรีวิวนี้โดย Nintendo"], "link": "https://www.eurogamer.net/the-legend-of-zelda-ocarina-of-time-remake-review", "canonical_link": "https://www.eurogamer.net/the-legend-of-zelda-ocarina-of-time-remake-review", "cover_image_url": "https://assetsio.gnwcdn.com/zelda-ocarina-remake-10.jpg?width=1200&quality=85&format=jpg&auto=webp", "gallery_images": ["https://assetsio.gnwcdn.com/christian-donlan.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://i.ytimg.com/vi/8BYDYTh4G9s/hqdefault.jpg", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-24.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-6.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-12.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-9.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-8.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-7.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp"], "videos": ["https://www.youtube.com/embed/8BYDYTh4G9s"], "review_score": "10", "published_ts": 1793790000, "published_at": "2026-11-04T11:00:00Z", "published_th": "4 พ.ย. 2026 • 18:00 น.", "category_hint": "Review"}, {"id": 1794822849532, "guid": "1943734", "original_title": "The Zelda: Ocarina Of Time Remake Shows That A Masterpiece Is Ageless", "thai_title": "รีวิว The Legend of Zelda: Ocarina of Time (2026) – การกลับมาของผลงานระดับมาสเตอร์พีซที่เหนือกาลเวลา", "tag": "Review", "sub_tag": "ZELDA", "bullet_points": ["The Legend of Zelda: Ocarina of Time ฉบับรีเมคปี 2026 คือการนำเกมระดับตำนานมาปรับปรุงใหม่ด้วยความเคารพต้นฉบับอย่างสูงสุด แต่เพิ่มความทันสมัยที่ลงตัว", "งานภาพและเสียงได้รับการยกระดับอย่างมหาศาล กลายเป็นหนึ่งในเกมที่สวยงามที่สุดบนเครื่อง Switch 2 พร้อมการพากย์เสียงตัวละครที่เติมเต็มมิติของเนื้อเรื่อง", "มีการเพิ่มระบบอำนวยความสะดวกที่สำคัญ เช่น ปุ่มกระโดด (Jump Button) และระบบจัดการอุปกรณ์ที่ได้รับแรงบันดาลใจจากภาค Breath of the Wild", "แม้จะมีการปรับปรุง แต่ตัวเกมยังคงรักษาเอกลักษณ์ความแปลกประหลาดและความท้าทายของดันเจี้ยนแบบดั้งเดิมเอาไว้ได้อย่างครบถ้วน", "ถือเป็นเกมที่แฟนซีรีส์ไม่ควรพลาด และเป็นจุดเริ่มต้นที่ดีที่สุดสำหรับผู้เล่นหน้าใหม่ที่ต้องการสัมผัสประสบการณ์ Zelda 3D ภาคแรก"], "full_paragraphs": ["The Legend of Zelda: Ocarina of Time ฉบับปี 2026 เป็นการรีเมคที่เปี่ยมไปด้วยความเคารพต่อต้นฉบับ โดยยังคงรักษาทั้งความสนุกสนานและความขรึมขลังของเกมดั้งเดิมเอาไว้ได้อย่างครบถ้วน พร้อมทั้งปรับปรุงองค์ประกอบเกมเพลย์บางส่วนให้ทันสมัยด้วยความสง่างามจนรู้สึกราวกับว่าสิ่งเหล่านี้ควรมีอยู่ตั้งแต่แรก นอกจากนี้ยังให้เกียรติแนวคิดการออกแบบดั้งเดิมด้วยการเชื่อมั่นว่าการสำรวจและการผจญภัยในรูปแบบเดิมนั้นยังคงยอดเยี่ยมอยู่เสมอ สำหรับแฟนเกม การได้เล่นฉบับรีเมคนี้คือการย้ำเตือนซ้ำแล้วซ้ำเล่าว่าทำไมคุณถึงตกหลุมรัก Ocarina of Time ตั้งแต่แรก และเป็นการได้เห็นความยอดเยี่ยมของเกมผ่านมุมมองใหม่ สำหรับผู้เล่นหน้าใหม่ นี่คือวิธีที่ดีที่สุดในการสัมผัสกับเกมคลาสสิกตลอดกาล และเป็นเกมเอ็กซ์คลูซีฟบน Switch 2 ที่ทุกคนไม่ควรพลาด", "หากคุณเพิ่งเคยสัมผัสเกมนี้เป็นครั้งแรก Ocarina of Time คือเกม Zelda 3D ภาคแรก ซึ่งเป็นเกมที่วางรากฐานสำคัญให้กับซีรีส์ เช่น Epona, ระบบ Z-targeting รวมถึงเผ่า Goron และ Gerudo ซีรีส์ Zelda คงไม่เป็นอย่างทุกวันนี้หากไม่มี Ocarina of Time ดังนั้นเกมนี้จึงมีที่พิเศษในใจของแฟนๆ และในประวัติศาสตร์ของ Nintendo เช่นเดียวกับ Super Mario 64 เกมนี้ได้วางแม่แบบให้กับการพัฒนาเกมของบริษัทมานานหลายทศวรรษ และเนื่องจาก Nintendo มักจะเป็นผู้บุกเบิกเส้นทางที่ผู้อื่นเดินตาม เกมนี้จึงมีอิทธิพลอย่างมากต่ออุตสาหกรรมเกมโดยรวม", "การเปลี่ยนแปลงที่เห็นได้ชัดที่สุดใน Ocarina 2026 คือการนำเสนอ ซึ่งถือว่าเป็นการอัปเกรดที่ยอดเยี่ยม พูดง่ายๆ คือนี่เป็นหนึ่งในเกมที่ดูดีที่สุดบน Switch 2 และเป็นหน้าเป็นตาให้กับเครื่องเกมนี้ ชุดของ Link และเด็กๆ ชาว Kokiri ได้รับการออกแบบให้มีรายละเอียดของเส้นใยผ้าที่ชัดเจน ตอกย้ำความเป็นภูตแห่งป่าที่เชื่อมโยงกับธรรมชาติ แสงที่สะท้อนบน Ocarina of Time ดูเหมือนเซรามิกเคลือบของจริง พื้นผิวอิฐในดันเจี้ยนดูเก่าแก่และสมจริง และยิ่งดูน่าขนลุกเมื่อได้รับแสงสลัวจาก Navi เพื่อนภูตของคุณ บอสแต่ละตัวจะแตกสลายกลายเป็นเถ้าถ่านสีม่วงเมื่อถูกกำจัด ทุกส่วนของโลกใบนี้ถูกสร้างขึ้นด้วยความใส่ใจ และในฐานะแฟนเกมที่กลับมาเล่นอีกครั้ง ผมรู้สึกทึ่งกับความสวยงามของมันอย่างต่อเนื่อง", "การปรับปรุงการนำเสนอยังครอบคลุมไปถึงรายละเอียดของแอนิเมชันและการออกแบบเสียง คุณสามารถเห็นแก้มของ Link พองขึ้นเมื่อเขาเป่า Ocarina และการเคลื่อนไหวของนิ้วมือที่ดูสอดคล้องกับตัวโน้ต เมื่อคุณไปถึง Lost Woods การติดตามเสียงตามทิศทางจะมอบประสบการณ์เชิงพื้นที่ที่สมบูรณ์แบบ ดนตรีที่นำมาเรียบเรียงใหม่ยังคงความเร้าใจและยิ่งใหญ่เช่นเดียวกับปี 1998 และผสมผสานเข้ากับความทรงจำของผมได้อย่างไร้รอยต่อ ตัวละครหลายตัวได้รับการพากย์เสียงเต็มรูปแบบในคัทซีนและบทสนทนา ซึ่งทำออกมาได้ดีเยี่ยมทุกตัวละคร ช่วยเพิ่มบุคลิกและหัวใจให้กับตัวละครเหล่านั้น นักพากย์ Ganondorf ถ่ายทอดความร้ายกาจออกมาได้อย่างเต็มที่, King Darunia ดูอบอุ่นและร่าเริง, Saria เพื่อนสนิทในวัยเด็กของ Link ฟังดูอ่อนหวานและจริงใจ, Impa ดูเป็นนักรบหญิงที่เด็ดขาด ส่วนเจ้าหญิง Ruto ในวัยเด็กเป็นตัวละครที่ผมชื่นชอบเป็นพิเศษด้วยนิสัยที่เอาแต่ใจแต่น่ารัก ส่วน Navi มีเสียงที่ดูโตขึ้นเล็กน้อยแต่ยังคงความเป็นเด็ก และมักทำหน้าที่เป็นเสียงแทน Link เนื่องจากเขายังคงเป็นตัวละครที่เงียบขรึม ยกเว้นเสียงตะโกนในการต่อสู้และปฏิกิริยาตกใจ", "ข้อเสียเพียงอย่างเดียวของการเพิ่มเสียงพากย์คือตัวละคร Sheik ซึ่งไม่ใช่ความผิดของนักพากย์ ผมเคยสงสัยว่าฉบับรีเมคจะจัดการกับจุดหักมุมนี้อย่างไร คำตอบคือมันพยายามแต่สุดท้ายก็ล้มเหลวในการสร้างสมดุลที่น่าพอใจ บทสนทนาแสดงให้เห็นว่าเกมต้องการรักษาเจตจำนงเดิมไว้ แต่ทั้งโมเดลตัวละครที่ปรับปรุงใหม่และเสียงพากย์ทำให้ความน่าเชื่อถือน้อยลง แม้นักพากย์จะทำหน้าที่ได้ดีเยี่ยม แต่การรักษาความลับของเนื้อเรื่องที่เคยพึ่งพาข้อจำกัดของเครื่อง N64 นั้นทำได้ยากในปัจจุบัน จนถึงจุดหนึ่งมันดูไม่สมเหตุสมผลที่ Link และ Navi จะไม่สังเกตเห็นความจริง อย่างไรก็ตาม นอกเหนือจากจุดเล็กน้อยนั้น คัทซีนใหม่ๆ ก็ช่วยเพิ่มความดราม่าให้กับเนื้อเรื่องที่ผมชื่นชอบอยู่แล้วได้เป็นอย่างดี", "มีการเน้นไปที่การแสดงออกทางสีหน้าและแอนิเมชันที่ละเอียดอ่อนเพื่อแสดงท่าทาง ทำให้ช่วงเวลาสำคัญมีน้ำหนักมากขึ้น ตัวอย่างที่สมบูรณ์แบบคือฉากบอกลาที่เต็มไปด้วยน้ำตาของ Saria ที่ขอบป่า Kokiri Saria เป็นคนพูดทั้งหมดในขณะที่ Link ยังคงเงียบ ซึ่งอาจจะดูอึดอัด แต่การที่ Link ลังเลเล็กน้อยก่อนจะหันไปเผชิญโชคชะตา แสดงให้เห็นว่าเขารู้สึกผูกพันกับเธอมากเพียงใดแต่ไม่รู้จะพูดอย่างไร เป็นช่วงเวลาที่น่ารักและสร้างสายสัมพันธ์ที่ลึกซึ้ง ในบางครั้งคัทซีนก็ทำให้จุดสำคัญของเนื้อเรื่องชัดเจนขึ้นกว่าเดิม เช่นตอนที่ Link หยิบ Master Sword และ Ganondorf ฉวยโอกาสนั้น เราจะเห็นภาพเหตุการณ์ที่ชัดเจนขึ้น ซึ่งเป็นการตอกย้ำสิ่งที่ผู้สร้างตั้งใจไว้แต่แรก", "แม้ว่าฉบับรีเมคจะยึดตามการออกแบบเดิมอย่างใกล้ชิด แต่ก็ได้เพิ่มฟีเจอร์อำนวยความสะดวก (Quality-of-Life) ที่ช่วยให้ประสบการณ์ราบรื่นและทันสมัยขึ้น สิ่งที่เห็นผลชัดที่สุดคือการเพิ่มปุ่มกระโดด ซึ่งยอดเยี่ยมมาก เกมต้นฉบับขาดปุ่มกระโดดเนื่องจากข้อจำกัดของคอนโทรลเลอร์ในยุคนั้น แต่ในเกมปี 2026 ปุ่มกระโดดให้ความรู้สึกที่เป็นธรรมชาติและเข้ากับการออกแบบฉากและดันเจี้ยนราวกับว่ามันควรมีอยู่ตั้งแต่แรก Ocarina ไม่เคยเป็นเกมที่มีการกระโดดที่ยากลำบาก แต่การสามารถกำหนดจังหวะการกระโดดเองได้ หรือการกระโดดขึ้นเถาวัลย์และบันไดเพื่อความรวดเร็วในการเดินทางนั้นให้ความรู้สึกที่ดีมาก แม้แฟนๆ บางส่วนจะกังขาเรื่องการเพิ่มปุ่มกระโดด แต่เมื่อได้ลองเล่นแล้ว ผมก็นึกภาพไม่ออกเลยว่าจะกลับไปเล่นแบบเดิมได้อย่างไร", "การเพิ่มอื่นๆ แม้จะส่งผลน้อยกว่าแต่ก็น่าชื่นชม แถบอุปกรณ์ (Equipment bar) ที่นำกลับมาจาก Breath of the Wild และ Tears of the Kingdom ช่วยให้คุณเรียกใช้อุปกรณ์ที่ต้องการได้ง่ายขึ้น เช่นเดียวกับรองเท้าและ Lenses of Truth (ที่ตอนนี้ดูเหมือนแว่นตากันลม) ที่ถูกกำหนดไว้ที่ปุ่มทิศทางเพื่อการสลับใช้งานอย่างรวดเร็ว หนึ่งในฟีเจอร์ QOL ที่ผมชอบที่สุดคือ Business Scrub คุณสามารถซื้อหรือหาเมล็ดพันธุ์เพื่อเรียกพ่อค้า Deku ได้ทุกที่ในโลก รวมถึงในดันเจี้ยน ซึ่งเขาจะขายไอเทมจำเป็น เช่น ยา, ระเบิด และลูกธนู ทำให้ไม่ต้องเดินย้อนกลับออกจากดันเจี้ยนเพื่อเติมของก่อนสู้กับบอส แต่ในขณะเดียวกัน คุณก็ต้องใช้อย่างประหยัดเพราะเมล็ดพันธุ์มีจำกัด ทำให้เกมยังคงความท้าทายเอาไว้ได้", "นอกจากนี้ยังมีส่วนเสริมที่กว้างขึ้นอย่าง Threads of Time ซึ่งเป็นระบบติดตามเควสต์ที่คอยบอกทิศทางสำหรับภารกิจหลักและเควสต์ย่อยที่คุณเริ่มทำ ปริศนาบางอย่างใน Ocarina อาจมีความซับซ้อน ซึ่งระบบนี้ไม่ได้ทำหน้าที่เป็นระบบบอกใบ้ แต่เป็นเครื่องเตือนความจำว่าคุณค้างไว้ที่ไหน นอกจากนี้ยังมี Hall of Fallen Foes ซึ่งเป็นห้องจัดแสดงรูปปั้นของสัตว์ประหลาดและบอสที่คุณเคยเอาชนะมาได้ทั่ว Hyrule แม้จะไม่ใช่สิ่งที่ปฏิวัติวงการ แต่การได้ชื่นชมรายละเอียดของดีไซน์เหล่านี้โดยไม่ต้องต่อสู้ด้วยนั้นเป็นเรื่องที่ดี และสำหรับบอสบางตัว คุณยังสามารถท้าทายเพื่อฝึกฝนทักษะได้อีกด้วย", "ทั้งหมดนี้เป็นส่วนเสริมที่เข้ามาเติมเต็มเกมคลาสสิกที่ยังคงความยอดเยี่ยมได้อย่างน่าทึ่ง การออกแบบดันเจี้ยนยังคงเป็นหนึ่งในส่วนที่ดีที่สุดของซีรีส์ แม้จะเป็นความพยายามในรูปแบบ 3D ครั้งแรกก็ตาม ดินแดน Hyrule เต็มไปด้วยสิ่งที่ต้องทำ ความลับที่ต้องค้นหา และผู้คนที่ต้องช่วยเหลือ เกมยังคงย่อยง่ายในแง่ของภารกิจหลัก ซึ่งเป็นเหตุผลว่าทำไมมันถึงถูกนำกลับมาเล่นซ้ำหลายปี แต่ก็ยังอัดแน่นไปด้วยกิจกรรมและเควสต์ย่อยให้สำรวจ และที่น่ายินดีคือมันยังคงความแปลกประหลาดอันน่าทึ่งของ Ocarina of Time ต้นฉบับเอาไว้ เกม Zelda มักจะมีเสน่ห์ที่ตลกขบขันเสมอ แต่ Ocarina นั้นแปลกกว่าภาคอื่นด้วยการออกแบบ NPC ที่พิลึกพิลั่นและช่วงเวลาตลกๆ เช่น การปลุกเจ้าของฟาร์ม Talon หลังจากเขาหลับในเขตปราสาท Hyrule หรือการที่คุณยังต้องแบกเจ้าหญิง Ruto ไว้บนหัวเหมือนกำลังขี่หลังปลาโลมา สิ่งเหล่านี้ยังคงสร้างความแตกต่างที่สนุกสนานให้กับโลกของเกม", "ในขณะเดียวกัน องค์ประกอบที่มืดหม่นก็ยังคงอยู่และได้รับการปรับปรุงให้ดียิ่งขึ้น ครั้งแรกที่ Link ในวัยผู้ใหญ่ก้าวออกจาก Temple of Time เพื่อเห็น Hyrule ที่ล่มสลายนั้นให้ความรู้สึกที่โศกเศร้าและถ่ายทอดออกมาได้อย่างเหมาะสม บอสบางตัวมีความน่ากลัวและสยดสยอง โดยเฉพาะ Dead Hand หรือ Cursed Rich Man ที่ทำออกมาได้น่าตกใจ แม้แต่ ReDead ก็ยังดูน่ากลัว แต่มีการปรับปรุงด้วยตัวบ่งชี้ทางภาพที่ชัดเจนขึ้นทำให้การเผชิญหน้าไม่น่าหงุดหงิดจนเกินไป", "เนื่องจากเกมนี้มีความเคารพต่อต้นฉบับสูง จุดอ่อนของ Ocarina of Time ดั้งเดิมจึงยังคงเป็นจุดอ่อนในฉบับรีเมค เช่น Water Temple ที่แม้จะอ่านแผนที่ได้ง่ายขึ้น แต่การปรับระดับน้ำก็ยังคงน่ารำคาญเล็กน้อย Shadow Temple ยังคงเป็นดันเจี้ยนที่เส้นตรงและอ่อนที่สุดเมื่อเทียบกับดันเจี้ยนอื่น การมีกล้องที่อิสระและปุ่มกระโดดทำให้ช่วงการลอบเร้นในปราสาท Hyrule และป้อมปราการ Gerudo จัดการได้ง่ายขึ้น แต่โดยเฉพาะป้อม Gerudo ก็ยังคงเป็นงานที่น่าเบื่อหน่าย สำหรับผม สิ่งเหล่านี้ถือเป็นการยอมรับเล็กๆ น้อยๆ เพื่อรักษาและให้เกียรติการออกแบบดั้งเดิม มันคงไม่รู้สึกว่าเป็น Ocarina of Time หากตัดช่วงเวลาเหล่านี้ออกไป", "เมื่อ Nintendo รีเมค Ocarina of Time สำหรับ 3DS ในปี 2011 มันยังอยู่ในยุคของเกม Zelda รูปแบบเดิม แต่ในปัจจุบัน ท่ามกลางบริบทของ Breath of the Wild และ Tears of the Kingdom การรีเมค Ocarina of Time จึงมีความรับผิดชอบที่ต่างออกไป นี่ไม่ใช่แค่การกลับมาเยี่ยมชมเกม Zelda เก่าในรูปแบบที่คุ้นเคย แต่เป็นการกลับมาเยี่ยมชมยุคสมัยที่แตกต่างไปจากเดิมอย่างสิ้นเชิง ซึ่งทำให้เกิดคำถามว่าเกม Zelda ในรูปแบบนี้ยังคงรู้สึกทันสมัยอยู่หรือไม่ คำตอบคือใช่ Ocarina of Time ยังคงเป็นความมหัศจรรย์ของการออกแบบเกมและการผจญภัยที่น่าตื่นเต้น ฉบับรีเมคนี้ช่วยขัดเกลาจุดที่ขรุขระ ทิ้งบางส่วนไว้ตามเดิม และปล่อยให้สิ่งที่พิเศษของต้นฉบับเปล่งประกายออกมา การเข้าถึงการรีเมคนี้ด้วยความเคารพต่อแหล่งที่มา ทำให้ Nintendo พิสูจน์ให้เห็นว่าผลงานระดับมาสเตอร์พีซที่แท้จริงนั้นสามารถยืนหยัดผ่านการทดสอบของกาลเวลาได้เสมอ"], "link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless/", "canonical_link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/LOZ-Deku-Tree.jpg?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1793790000, "published_at": "2026-11-04T11:00:00Z", "published_th": "4 พ.ย. 2026 • 18:00 น.", "category_hint": "Review"}, {"id": 1794822849534, "guid": "1943764", "original_title": "Godzilla: Destroy All Monsters Melee Remastered Is A Faithful, If Flawed, Remaster", "thai_title": "รีวิว Godzilla: Destroy All Monsters Melee Remastered – ความสนุกฉบับคลาสสิกที่ถูกบั่นทอนด้วยระบบ Grind", "tag": "Review", "sub_tag": "GAME REVIEW", "bullet_points": ["Godzilla: Destroy All Monsters Melee Remastered ยังคงมอบประสบการณ์ความสนุกแบบดั้งเดิมในการต่อสู้ของเหล่าไคจูที่เล่นง่ายและเฮฮา", "ระบบการเล่นแบบ 3D Brawler ที่ให้ผู้เล่นหยิบจับสิ่งของหรือตึกรามบ้านช่องมาฟาดฟันกันยังคงเป็นจุดเด่นที่สร้างความบันเทิงได้ดีเยี่ยม", "ตัวเกมมีปัญหาเรื่องระบบ Progression ใหม่ที่บังคับให้ผู้เล่นต้อง 'Grind' หรือเล่นซ้ำเพื่อปลดล็อกตัวละครและโหมดต่างๆ ซึ่งขัดกับธรรมชาติของเกมที่ควรจะเป็นความสนุกแบบหยิบมาเล่นได้ทันที", "แม้จะมีโหมด Tournament ที่ช่วยให้เข้าถึงตัวละครได้โดยไม่ต้องปลดล็อก แต่กลับถูกซ่อนไว้อย่างไม่น่าเชื่อและไม่รองรับการเล่นออนไลน์", "โดยรวมถือเป็นเกมที่แฟน Godzilla ควรค่าแก่การเล่นเพื่อความบันเทิง แต่ระบบปลดล็อกที่ยืดเยื้อทำให้เสน่ห์ของเกมลดน้อยลงกว่าต้นฉบับ"], "full_paragraphs": ["Godzilla: Destroy All Monsters Melee Remastered คือเกมแนว 3D Brawler ที่คุณสามารถสวมบทบาทเป็น Godzilla ปี 1990 จับ Godzilla ปี 2000 ทุ่มใส่ตึก หรือดู Anguirus กระโดดถีบศัตรูจนทะลุอาคาร ซึ่งมันเป็นอะไรที่ตลกและสนุกมาก เพียงแค่คำนิยามนี้ก็เพียงพอแล้วที่จะทำให้ผมและแฟนๆ Godzilla คนอื่นๆ พูดว่า 'ได้โปรด เอาเงินผมไปเลย' และตัวเกมก็ทำได้ตามคำสัญญาจริงๆ ซึ่งไม่ใช่เรื่องน่าแปลกใจนักเพราะระบบการเล่นนั้นถอดแบบมาจากเกมต้นฉบับปี 2002 มาแบบหนึ่งต่อหนึ่ง", "ความสนุกของการได้อาละวาดเป็นสัตว์ประหลาดขนาดยักษ์ท่ามกลางเมืองที่พังทลายนั้นเพิ่มขึ้นเป็นทวีคูณเมื่อเล่นกับเพื่อน 3 คนในโหมด Local โดยเฉพาะบน Nintendo Switch ที่คุณสามารถถอด Joy-Con ส่งให้คนข้างๆ แล้วหัวเราะร่าตอนที่คุณเหวี่ยงพวกเขาลงไปในบ่อลาวาบนเกาะ Monster Island แต่น่าเสียดายที่ความสนุกแบบอาร์เคดที่เรียบง่ายและตรงไปตรงมาของเกม กลับถูกขัดขวางด้วยการต้องใช้เวลาหลายชั่วโมงในการ 'Grind' เพื่อปลดล็อกตัวละคร ด่าน และโหมดต่างๆ ของเกม", "ระบบการเล่นที่ต้องใช้ความพยายามอย่างหนักนี้ไม่ได้ช่วยส่งเสริมดีไซน์ของเกมที่เน้นความสนุกแบบ 'หยิบมาเล่นได้ทันที' เลยแม้แต่น้อย มันเปลี่ยนเกมที่เต็มไปด้วยเสียงหัวเราะให้กลายเป็นงานที่น่าเบื่อหน่ายเมื่อสิ่งที่คุณต้องการจริงๆ คือการได้เล่นเป็น Rodan ตั้งแต่เริ่มเกม คุณจะสามารถเข้าถึงตัวละครได้เพียง 4 จาก 12 ตัวเท่านั้น ได้แก่ Godzilla 1990, Gigan, Megalon และ Anguirus ซึ่งตัวละครเริ่มต้นเหล่านี้แสดงให้เห็นถึงความหลากหลายของประเภทสัตว์ประหลาด ยกเว้นพวกที่บินได้อย่าง King Ghidorah และ Rodan", "โดยทั่วไปแล้วสัตว์ประหลาดจะมีชุดท่าโจมตีที่คล้ายคลึงกัน โดยบางตัวจะมีลูกเล่นพิเศษเพิ่มเข้ามา เช่น ความสามารถในการวาร์ปของ Gigan หรือการมุดดินของ Megalon เพื่อโผล่ขึ้นมาจับศัตรู ในช่วงแรกท่าโจมตีอาจดูซ้ำซากจำเจด้วยคอมโบที่เหมือนกัน หรือเอฟเฟกต์การกระทืบเท้าที่คล้ายกัน แต่ก็ยังมีรายละเอียดเล็กๆ น้อยๆ ที่ทำให้แต่ละตัวมีเอกลักษณ์เฉพาะตัว เช่น ท่าป้องกันของ Anguirus ที่จะหันหลังเอาหนามแหลมคมรับการโจมตี ก่อนจะทำให้ศัตรูมึนงงในขณะที่มันสะบัดมือไปมาด้วยท่าทางตลกขบขัน", "แม้จะไม่ใช่เกมต่อสู้ที่มีความลึกซึ้งมากนัก แต่ก็มีความหลากหลายเพียงพอที่จะทำให้การต่อสู้สนุกสนาน เช่น ความสามารถในการหยิบตึกมาทุ่ม หรือการเก็บไอเทมเพิ่มพลังเพื่อเรียก Mothra มาโจมตีทางอากาศ ความหลากหลายนี้ช่วยให้การต่อสู้แต่ละครั้งไม่รู้สึกซ้ำซาก การได้เห็นสัตว์ประหลาด 4 ตัววิ่งวุ่นไปทั่วฉาก พ่นลำแสงออกจากปาก ทุ่มตึกใส่กัน หรือกลิ้งไปมาเพื่อหลบหลีกนั้นเป็นความสนุกที่แท้จริง ประสบการณ์การเล่นคนเดียวอาจจะดูเบาบางไปบ้าง แต่เมื่อเล่นกับเพื่อนมันคือความบันเทิงชั้นยอด ซึ่งเป็นผลมาจากความที่เป็นเกมต่อสู้ที่เข้าถึงง่าย และแม้แต่ในช่วงเวลาที่ผมเล่นคนเดียว เกมก็ยังทำให้ผมหัวเราะได้เป็นระยะจากความรุนแรงแบบการ์ตูนของเหล่าไคจู", "น่าเสียดายที่การปลดล็อกสัตว์ประหลาดตัวอื่นๆ ไม่ได้ตรงไปตรงมาเหมือนในเกมต้นฉบับ ในเกมปี 2002 การปลดล็อกตัวละครทำได้เพียงแค่เล่นโหมด Adventure ให้จบ ซึ่งเป็นโหมดสั้นๆ สไตล์อาร์เคดที่คุณต้องเอาชนะสัตว์ประหลาดไปเรื่อยๆ จนถึง Mechagodzilla ในตอนท้าย แต่ในเวอร์ชัน Remaster นี้กลับมีระบบความก้าวหน้า 3 รูปแบบเข้ามาแทนที่ ได้แก่ ค่า XP ของตัวละครแต่ละตัว, Research Points สำหรับทำโปรเจกต์เพื่อปลดล็อกตัวละครและด่าน, และ Rumors ซึ่งเป็นภารกิจที่ต้องทำเพื่อให้บรรลุโปรเจกต์", "ระบบเหล่านี้ถูกนำมารวมกันเพื่อพยายามยืดเวลาการเล่นและปลดล็อกตัวละครที่คุณชื่นชอบ (อย่าง Rodan!) ซึ่งมันส่งผลเสียมากกว่าผลดี ในช่วง 11 ชั่วโมงที่ผมเล่นมา ส่วนใหญ่ผมใช้เวลาไปกับการเล่นคนเดียวเพื่อพยายามปลดล็อกตัวละคร ซึ่งผมยังทำไม่สำเร็จ โดยเหลืออีก 3 ตัวคือ Destroyah, Mechagodzilla และ Rodan การปลดล็อกแต่ละตัวต้องทำตามรายการเงื่อนไข เช่น ชนะการต่อสู้ 12 ครั้งด้วย Megalon หรือ Gigan ซึ่งจะปลดล็อก Research Project ต่อไป ซึ่งต้องเล่นโหมด Adventure หรือ Multiplayer (ทั้งออนไลน์และ Local) เพื่อเก็บความคืบหน้า", "การทำภารกิจ Rumors และ Research ให้สำเร็จนั้นใช้เวลาแตกต่างกันไป และบางครั้งการทำสำเร็จก็เผยให้เห็นภารกิจใหม่ที่ต้องทำเพิ่มขึ้นอีก ผมเคยเข้าใจผิดอยู่สองสามครั้งว่าแค่ทำ Research เดียวก็จะปลดล็อก Mecha-King Ghidorah ได้แล้ว แต่กลับกลายเป็นว่าต้องไปปลดล็อกโปรเจกต์อื่นก่อน ความเหนื่อยหน่ายนี้ยังลามไปถึงโหมด Adventure ใหม่ๆ ที่ถูกล็อกไว้ตามเลเวลของตัวละครแต่ละตัว ซึ่งมันน่าเบื่อมาก", "โหมด Adventure ใหม่ 2 โหมดที่เพิ่มเข้ามาอย่าง Adventure Gauntlet และ Adventure Challenge ถือเป็นการเปลี่ยนแปลงที่น่ายินดี โดย Gauntlet จะให้คุณสู้กับ CPU 2 ตัวที่เก่งขึ้นเรื่อยๆ ในแต่ละรอบ ส่วน Challenge
