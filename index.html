<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure News</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
    .brand-title { font-family: 'Chakra Petch', sans-serif; letter-spacing: -0.02em; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen antialiased selection:bg-[#ff3366] selection:text-white">

  <!-- Clean Minimal Header (Logo + Pure News + Category Tabs) -->
  <header class="border-b border-zinc-800 bg-[#0c0c0e]/95 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Pure News" class="w-10 h-10 rounded-md object-cover border border-zinc-700/80 shadow-sm bg-[#faf7f2]">
        <h1 class="brand-title text-2xl md:text-3xl font-extrabold uppercase text-white tracking-wider leading-none">
          PURE NEWS
        </h1>
      </div>

      <!-- Clean Category Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
        <button onclick="filterTag('ALL')" id="filterALL" class="px-3.5 py-1.5 bg-white text-black font-mono font-bold text-xs rounded transition whitespace-nowrap">ALL</button>
        <button onclick="filterTag('Football')" id="filterFootball" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-mono text-xs rounded transition whitespace-nowrap">PREMIER LEAGUE</button>
        <button onclick="filterTag('Technology')" id="filterTechnology" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-cyan-400 font-mono text-xs rounded transition whitespace-nowrap">THE VERGE</button>
        <button onclick="filterTag('Gadgets')" id="filterGadgets" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-emerald-400 font-mono text-xs rounded transition whitespace-nowrap">GADGETS</button>
        <button onclick="filterTag('Gaming')" id="filterGaming" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-amber-400 font-mono text-xs rounded transition whitespace-nowrap">IGN GAMES</button>
        <button onclick="filterTag('Review')" id="filterReview" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-purple-400 font-mono text-xs rounded transition whitespace-nowrap">GAME REVIEWS</button>
        <button onclick="refreshLiveNews(this)" title="ดึงข้อมูลข่าวล่าสุด" class="p-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 rounded transition ml-1 shrink-0">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards rendered here -->
    </div>
  </main>

  <!-- Top-Pinned Modal Dialog -->
  <div id="modalOverlay" onclick="if(event.target===this) closeModal()" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-start sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="w-full max-w-3xl bg-[#0c0c0e] sm:border sm:border-zinc-800 sm:rounded-lg shadow-2xl overflow-hidden my-0 sm:my-auto max-h-screen sm:max-h-[92vh] flex flex-col">
      
      <!-- Modal Header (Sticky) -->
      <div class="flex items-center justify-between px-3.5 sm:px-6 py-3 border-b border-zinc-800 bg-[#0e0e11] sticky top-0 z-10 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modalTag" class="px-2 py-0.5 rounded text-[11px] sm:text-xs font-mono font-bold uppercase tracking-wider bg-[#ff3366]/15 text-[#ff3366] border border-[#ff3366]/30 truncate"></span>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <div id="ttsControls" class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button id="ttsBtn" onclick="toggleSpeech()" title="ฟังเสียงอ่านข่าว" class="px-2.5 py-1 text-xs font-mono font-bold text-emerald-400 hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1">
              <span id="ttsIcon">🔊</span>
              <span id="ttsLabel" class="hidden sm:inline">ฟังข่าว</span>
            </button>
            <button id="ttsRateBtn" onclick="cycleSpeechRate()" title="ความเร็วเสียงอ่าน" class="px-2 py-1 text-[11px] font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition">1x</button>
          </div>
          <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button onclick="changeFontSize(-1)" title="ลดขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A-</button>
            <span id="fontSizeLabel" class="hidden sm:inline text-[11px] font-mono text-zinc-500 px-1.5 select-none">100%</span>
            <button onclick="changeFontSize(1)" title="เพิ่มขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A+</button>
          </div>
          <button onclick="closeModal()" aria-label="Close" class="w-8 h-8 rounded-full bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center text-xl transition leading-none">&times;</button>
        </div>
      </div>

      <!-- Modal Body (Always resets to scrollTop = 0) -->
      <div id="modalBody" class="p-5 sm:p-6 md:p-8 overflow-y-auto space-y-5 sm:space-y-6">
        <!-- HD Cover Image (16:9 aspect-video so cover never gets awkwardly cropped) -->
        <div class="w-full aspect-video overflow-hidden rounded-md border border-zinc-800 bg-zinc-950 relative">
          <img id="modalImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" referrerpolicy="no-referrer" alt="" class="w-full h-full object-cover">
          <div id="modalScoreBadge" class="hidden absolute top-3 right-3 bg-[#ff3366] text-white font-mono font-extrabold text-sm px-3 py-1.5 rounded shadow-xl border border-white/20"></div>
        </div>

        <!-- Sub-Tag & Publish Date Row -->
        <div class="flex items-center flex-wrap gap-2 text-xs font-mono text-zinc-400">
          <span id="modalSubTag" class="hidden px-2 py-0.5 rounded text-[11px] font-mono font-semibold uppercase tracking-wider bg-zinc-800 text-zinc-200 border border-zinc-700"></span>
          <span id="modalDate" class="text-xs font-mono text-zinc-400"></span>
        </div>

        <!-- Title -->
        <h2 id="modalTitle" class="brand-title text-xl md:text-2xl font-bold text-white leading-snug"></h2>

        <!-- Key Facts Box -->
        <div class="bg-black/60 border-l-2 border-[#ff3366] p-4 rounded-sm">
          <div class="text-xs font-mono text-[#ff3366] uppercase font-bold tracking-wider mb-2">📌 สรุปประเด็นสำคัญ (KEY FACTS):</div>
          <ul id="modalBullets" class="space-y-2 text-sm text-zinc-200"></ul>
        </div>

        <!-- Video Section (Shown when article has YouTube trailers/videos) -->
        <div id="modalVideoSection" class="hidden space-y-3 pt-1">
          <div class="text-xs font-mono text-red-400 uppercase tracking-widest flex items-center gap-1.5 font-bold">
            <span>🎬 วิดีโอตัวอย่าง / TRAILER ในข่าว :</span>
          </div>
          <div id="modalVideoContainer" class="space-y-4"></div>
        </div>

        <!-- Full Multi-Paragraph Translation with Interleaved Magazine Screenshots -->
        <div class="space-y-4 pt-2">
          <div class="text-xs font-mono text-zinc-500 uppercase tracking-widest">// เนื้อหาฉบับเต็ม :</div>
          <div id="modalFullContent" class="space-y-4 text-zinc-300 text-sm md:text-base leading-relaxed font-light"></div>
        </div>

        <!-- Remaining Screenshots Gallery -->
        <div id="modalGallerySection" class="hidden pt-4 border-t border-zinc-800/80">
          <div class="text-xs font-mono text-amber-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
            <span>📸 ภาพประกอบเพิ่มเติม :</span>
          </div>
          <div id="modalGalleryGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t border-zinc-800 bg-[#0e0e11] flex items-center justify-between">
        <a id="modalSource" href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-zinc-900 border border-zinc-700 text-xs font-mono text-white rounded-sm hover:bg-zinc-800 flex items-center gap-1.5 transition">
          <span>อ่านต้นฉบับเต็ม</span>
          <span>→</span>
        </a>
        <button onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-mono text-zinc-300 rounded-sm transition">ปิด</button>
      </div>

    </div>
  </div>

  <script>
    const TRANSPARENT_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    const SVG_FALLBACK_URI = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#18181b"/><stop offset="100%" stop-color="#09090b"/>' +
      '</linearGradient></defs>' +
      '<rect width="800" height="450" fill="url(#g)"/>' +
      '<text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" fill="#ff3366" font-family="monospace" font-size="36" font-weight="bold">PURE NEWS</text>' +
      '<text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="16">IMAGE UNAVAILABLE</text>' +
      '</svg>'
    );
    const CATEGORY_FALLBACKS = {
      Football: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&q=80',
      Technology: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80',
      Gadgets: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1200&q=80',
      Gaming: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200&q=80',
      Review: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200&q=80'
    };

    const FONT_STEPS = [
      { pct: '85%', body: '0.875rem', bullet: '0.8125rem', title: '1.25rem' },
      { pct: '100%', body: '1rem', bullet: '0.875rem', title: '1.5rem' },
      { pct: '115%', body: '1.125rem', bullet: '1rem', title: '1.65rem' },
      { pct: '130%', body: '1.25rem', bullet: '1.0625rem', title: '1.8rem' },
      { pct: '150%', body: '1.4rem', bullet: '1.15rem', title: '2rem' }
    ];
    let currentFontIdx = 1;
    try {
      const savedIdx = parseInt(localStorage.getItem('pureNewsFontIdx') || '1', 10);
      if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < FONT_STEPS.length) {
        currentFontIdx = savedIdx;
      }

", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6615/live/ce8996a0-7ab8-11f0-83cc-c5da98c419b8.png"], "published_th": "15 พ.ย. 2026 • 05:26 น.", "category_hint": "Football", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "guid": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "published_ts": 1794695216, "published_at": "2026-11-14T22:26:56Z", "videos": [], "review_score": "", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นความคล่องตัวสูง คุณจำเป็นต้องวิ่ง คุณต้องสามารถวิ่งและทำความเร็วสูงได้ พื้นฐานที่สุดคือต้องฟิต\"", "\"ผู้จัดการทีมทุกคนต้องการช่วงปรีซีซั่นที่ดีและเวลาในการถ่ายทอดไอเดียรวมถึงสร้างความฟิต แต่นักเตะจะรู้สึกได้ทันทีว่ามันเป็นคนละระดับกัน นี่คือสิ่งที่ต้องทำทุกวันที่สนามซ้อม ต้องเต็มที่ 100% นั่นคือสิ่งที่เขาขอและต้องการ มันจะเป็นความแตกต่างครั้งใหญ่สำหรับนักเตะและพวกเขาจะเห็นผลลัพธ์ทันที\"", "\"ในเกมแชมเปียนส์ลีก รอบรองชนะเลิศ เราตามหลัง 3-0 (ในเกมพบกับ อาแจ็กซ์) เขาไม่ได้พูดเรื่องแท็กติกในช่วงพักครึ่งเลย เขาแค่บอกว่า 'พวกคุณต้องใช้ร่างกายเข้าสู้ ต้องสู้ คุณต้องการแค่ประตูเดียวเพื่อกลับมาสู่เกม จงเชื่อว่าทุกอย่างเป็นไปได้' นั่นเป็นช่วงเวลาที่สำคัญมาก เพราะตอนนั้นเราสู้ อาแจ็กซ์ ไม่ได้เลย แต่เราเปลี่ยนทุกอย่างด้วยความเข้มข้นและการเข้าปะทะ ผมจำได้ว่ามีการวางบอลยาวให้ เฟร์นานโด ยอเรนเต และเราก็แค่สู้และถามกันว่า 'พวกคุณต้องการมันมากแค่ไหน?' ทุกอย่างเปลี่ยนไปตั้งแต่นาทีนั้น\""], "link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8125/live/1aaff900-dfb9-11f1-b154-657b8bcda5ea.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/1da8/live/872e4dc0-ddd4-11f1-9053-236ccb99630c.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794610397, "published_at": "2026-11-13T22:53:17Z", "published_th": "14 พ.ย. 2026 • 05:53 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776975, "guid": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "original_title": "Tearful Pochettino on 'difficult' decision to leave USA for Man Utd", "thai_title": "โปเช็ตติโน่หลั่งน้ำตา ยอมรับการตัดสินใจอำลาทีมชาติสหรัฐฯ เพื่อคุมทัพแมนเชสเตอร์ ยูไนเต็ด เป็นเรื่องยากที่สุดในอาชีพ", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ ตัดสินใจอำลาตำแหน่งกุนซือทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานคุมทีมแมนเชสเตอร์ ยูไนเต็ด โดยเซ็นสัญญาเป็นเวลา 2 ปีครึ่ง", "ปีศาจแดงยอมจ่ายค่าฉีกสัญญาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่และทีมงานสตาฟฟ์โค้ชมาจากสหรัฐฯ", "โปเช็ตติโน่ยอมรับว่านี่เป็นการตัดสินใจที่ยากลำบากที่สุดครั้งหนึ่งในอาชีพ แต่โอกาสในการคุมทีมระดับโอลด์แทรฟฟอร์ดนั้นยากที่จะปฏิเสธ", "กุนซือชาวอาร์เจนไตน์จะประเดิมคุมทีมแมนเชสเตอร์ ยูไนเต็ด นัดแรกในเกมเยือนลิเวอร์พูล วันที่ 22 พฤศจิกายนนี้", "สถานการณ์ของแมนเชสเตอร์ ยูไนเต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะ  ยูไนเต็ด เป็นครั้งที่สอง", "tag": "Football", "bullet_points": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สอง", "สัญญาปัจจุบันของดาวเตะวัย 32 ปีจะหมดลงหลังจบฤดูกาลนี้ แต่สโมสรมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028", "แมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการเจรจาสัญญาใหม่ แต่การเจรจายังคงไม่มีความคืบหน้า", "สโมสรหวังว่าการเข้ามาคุมทีมของ เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่ จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป", "ฟอร์มการเล่นของแฟร์นันด์สในฤดูกาลนี้ตกลงไปจากเดิมอย่างเห็นได้ชัด โดยทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด"], "full_paragraphs": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อ นี้ ต่อจาก ไมเคิล คาร์ริค ที่ถูกแมนเชสเตอร์ ยูไนเต็ด ปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา กุนซือชาวฝรั่งเศสวัย 47 ปีรายนี้ เข้ามารับงานด้วยสัญญา 3 ปีเมื่อเดือนมิถุนายนที่ผ่านมา หลังจาก โอลิเวอร์ กลาสเนอร์ อำลาทีมไปเมื่อสิ้นสุดฤดูกาลก่อน โดยก่อนหน้านี้เซจเคยพา ล็องส์ จบอันดับที่ 2 ในลีกเอิง และคว้าแชมป์เฟรนช์คัพได้เป็นครั้งแรกในประวัติศาสตร์ 120 ปีของสโมสร", "อย่างไรก็ตาม เซจไม่สามารถสร้างผลงานได้เทียบเท่ากับกลาสเนอร์ ซึ่งปัจจุบันคุมทีม น็อตติงแฮม ฟอเรสต์ โดยกลาสเนอร์เคยพาพาเลซคว้าแชมป์เอฟเอ คัพ และแชมป์ยูโรปา คอนเฟอเรนซ์ ลีก มาครองได้สำเร็จ", "พาเลซไม่ชนะใครในลีกมาตั้งแต่วันที่ 11 ตุลาคม โดยช่วงที่ฟอร์มตกต่ำเริ่มขึ้นจากความพ่ายแพ้ต่อคู่ปรับสำคัญอย่าง ไบรท์ตัน 5-0 ซึ่งหลังจบเกมนั้น เซจกล่าวว่าเขารู้สึก 'ละอายใจ' กับผลการแข่งขัน และยอมรับว่าไม่มั่นใจว่าจะได้รับโอกาสให้คุมทีมต่อไปเพื่อกอบกู้สถานการณ์หรือไม่", "แม้จะมีกระแสความเห็นใจจากคนภายในสโมสรบางส่วนหลังความพ่ายแพ้นัดดังกล่าว แต่ปัญหาอาการบาดเจ็บของผู้เล่น รวมถึงการขาดหายไปของกองหน้าอย่าง ฌอง-ฟิลิปป์ มาเตต้า และ อิสไมล่า ซาร์ ซึ่งมีปัญหาทั้งเรื่องความฟิตและประเด็นส่วนตัวเกี่ยวกับความต้องการย้ายออกจากสโมสร ก็ส่งผลกระทบต่อแผนการทำทีมของเขาอย่างหลีกเลี่ยงไม่ได้", "หลังจากนั้น พาเลซก็พ่ายแพ้ติดต่อกันอีก 3 นัด โดยในเกมที่แพ้ลิเวอร์พูลที่เซลเฮิร์สท์ พาร์ค พวกเขาโชคร้ายที่ยิงไปชนคานและมีลูกที่ถูกริบประตูคืนด้วย โดยสรุปแล้ว เซจพาทีมชนะไปเพียง 5 นัดจาก 16 นัดในทุกรายการ สำหรับโปรแกรมพรีเมียร์ลีกนัดถัดไปของพาเลซคือการไปเยือน โคเวนทรี ในวันที่ 21 พฤศจิกายน หลังจบช่วงพักเบรกทีมชาติ", "สำหรับ โธมัส แฟรงค์ เคยถูกท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมา หลังจากคุมทีมได้ไม่ถึง 8 เดือน โดยทิ้งทีมไว้ในอันดับที่ 16 ของตารางพรีเมียร์ลีก ห่างจากโซนตกชั้นเพียง 5 คะแนน หลังจากไม่ชนะใครในลีกติดต่อกัน 8 นัด", "ทางสโมสรคริสตัล พาเลซ เชื่อมั่นว่าแฟรงค์คือคนที่เหมาะสมที่สุดในการพานำทีมหนีจากโซนตกชั้น โดยคาดว่าการเจรจาอยู่ในขั้นตอนสุดท้ายและมีความหวังว่าจะสามารถบรรลุข้อตกลงได้ก่อนเริ่มสัปดาห์หน้า ซึ่งเป็นช่วงที่นักเตะจะทยอยกลับจากการรับใช้ทีมชาติ", "นอกจากนี้ สโมสรยังได้พิจารณาทางเลือกอื่นไว้ด้วย เช่น ฌอน ไดช์ อดีตก  "bullet_points": ["ไมเคิล คาร์ริค ถูกปลดจากตำแหน่งกุนซือแมนเชสเตอร์ ยูไนเต็ด หลังคุมทีมได้เพียง 15 เกมในฤดูกาลนี้ ท่ามกลางผลงานที่ย่ำแย่และสถานการณ์ที่ไร้เสถียรภาพ", "ฟอร์มการเล่นของทีมดิ่งลงเหวอย่างต่อเนื่องนับตั้งแต่เปิดฤดูกาล โดยไม่สามารถคว้าชัยชนะในพรีเมียร์ลีกได้เลยนับตั้งแต่เกมถล่มอิปสวิช 5-2", "ปัญหาหลักของทีมคือความผิดพลาดในเกมรับ ความฟิตของนักเตะที่ไม่สมบูรณ์ และการจัดทัพที่ไม่ลงตัว ส่งผลให้เกิดความขัดแย้งภายในและเสียงวิจารณ์จากแฟนบอล", "บอร์ดบริหารนำโดย โอมาร์ เบอร์ราดา และ เจสัน วิลค็อกซ์ ตัดสินใจปลดคาร์ริคหลังจบเกมเสมอ แอสตัน วิลลา 4-4 โดยมองว่าทีมต้องการการเปลี่ยนแปลงเพื่อกอบกู้สถานการณ์"], "full_paragraphs": ["เหตุการณ์เกิดขึ้นหลังเวลา 18.00 น. ของวันอาทิตย์ที่ 8 พฤศจิกายน เมื่อข้อความสำคัญถูกส่งมาถึง ในขณะที่แมนเชสเตอร์ ยูไนเต็ด กำลังตามหลัง แอสตัน วิลลา อยู่ 4-2 และแฟนบอลในโอลด์ แทรฟฟอร์ด ต่างทำใจยอมรับความพ่ายแพ้ไปแล้ว คำขอร้องดังกล่าวมาจากบุคคลที่รู้จัก ไมเคิล คาร์ริค เป็นอย่างดี เคยร่วมงานกับเขา และเข้าใจถึงแรงกดดันของการใช้ชีวิตใน 'ตู้ปลาทอง' อย่างสโมสรแห่งนี้เป็นอย่างดี", "อย่างไรก็ตาม บทสรุปที่หลายคนคาดการณ์ไว้กลับไม่เกิดขึ้น ยูไนเต็ดทำประตูได้สองลูกในช่วงทดเวลาบาดเจ็บจนตีเสมอ 4-4 คาร์ริคฉลองประตูตีเสมอของ แพทริค ดอร์กู ด้วยการชูแขนขึ้นฟ้า หลังจากนั้นเขาเดินรอบสนามซึ่งกลายเป็นการเดินขอบคุณแฟนบอลครั้งสุดท้ายของเขาในฐานะกุนซือ", "ในขณะที่แฟนบอลยูไนเต็ดร้องเพลงเชียร์ชื่อของเขา คาร์ริคได้เข้าไปยืนอยู่ท่ามกลางลูกทีมเพื่อปกป้องไม่ให้แฟนบอลรุมตำหนินักเตะเหมือนที่เคยเกิดขึ้นหลังความพ่ายแพ้ต่อ บอร์นมัธ 3-0 เมื่อสองสัปดาห์ก่อน การตัดสินใจครั้งนี้สะท้อนตัวตนของกุนซือวัย 45 ปีรายนี้ได้เป็นอย่างดี นั่นคือการให้ความสำคัญกับส่วนรวมมากกว่าตัวเอง", "ความปรารถนาอย่างแรงกล้าที่จะทำสิ่งที่ดีที่สุดให้กับสโมสรและนักเตะ รวมถึงอดีตอันรุ่งโรจน์ของเขา อธิบายได้ว่าทำไมเพลงเชียร์ของคาร์ริคยังคงดังกึกก้องจากอัฒจันทร์ ในขณะที่คนอื่นๆ ในยูไนเต็ดต่างตกเป็นเป้าของความโกรธแค้นและเสียงเยาะเย้ย แต่ท้ายที่สุดแล้ว สิ่งเหล่านั้นก็ไม่เพียงพอ", "การที่เขาอยู่มาได้ถึงจุดนี้ถือว่านานกว่าที่หลายคนคาดไว้ ดูเหมือนไม่มีทางที่คาร์ริคจะรอดพ้นจากความล้มเหลวในเกมพบกับบอร์นมัธไปได้ ยูไนเต็ดใช้เวลาถึง 44 ชั่วโมงในการสื่อสารกับโลกภายนอกว่าพวกเขายังคงให้โอกาสเขาคุมทีมต่อ แม้จะเป็นที่เข้าใจกันว่าคาร์ริคได้รับแจ้งเรื่องการตัดสินใจล่วงหน้าตั้งแต่วันก่อนหน้านั้นแล้ว", "นับตั้งแต่นั้นมา สถานการณ์ก็เต็มไปด้วยความโกลาหล ยูไนเต็ดชนะ 1 เสมอ 1 และแพ้ 1 ในช่วงเวลาดังกล่าว พวกเขาโชว์ฟอร์มได้อย่างยอดเยี่ยมใน 45 นาทีแรกที่พบกับเชลซี แต่กลับมาเสียประตูในช่วงต้นครึ่งหลัง ก่อนที่ ลิซานโดร มาร์ติเนซ จะถูกไล่ออกจากการได้รับสองใบเหลืองภายในเวลาเพียง 5 นาที ทำให้ทีมพ่ายไป 2-0", "ในศึกยูฟ่า แชมเปียนส์ลีก ที่พบกับ โรม่า พวกเขาเล่นได้อย่างย่ำแย่และตามหลังสองประตูภายใน 17 นาทีแรก แต่ก็ฮึดสู้กลับมาคว้าชัยชนะ 3-2 ด้วยฟอร์มการเล่นที่น่าตื่นตาตื่นใจ ซึ่งเป็นสิ่งที่คาร์ริคเคยสัมผัสบ่อยครั้งในยุคของ เซอร์ อเล็กซ์ เฟอร์กูสัน จากนั้นจึงเป็นเกมกับวิลลา ที่พวกเขาตามหลังสองประตูภายใน 4 นาทีจากความผิดพลาดของผู้รักษาประตู แต่ก็สามารถตีเสมอได้ก่อนจบครึ่งแรก แม้จะมีการป้องกันที่ย่ำแย่จนต้องเหนื่อยหนัก แต่พวกเขาก็รอดพ้นจากความพ่ายแพ้มาได้ด้วยหนึ่งแต้ม", "หากจะวิเคราะห์เหตุการณ์เหล่านี้ คำถามคือผลงานของคาร์ริคดีขึ้น หรือมันเพียงแค่พิสูจน์ว่าเขาไม่ใช่คนที่ใช่สำหรับงานนี้กันแน่? ยูไนเต็ดตัดสินใจว่าเป็นอย่างหลัง โอมาร์ เบอร์ราดา ประธานเจ้าหน้าที่บริหาร และ เจสัน วิลค็อกซ์ ผู้อำนวยการฟุตบอล ต่างร่วมฉลองประตูตีเสมอของดอร์กูในเกมพบวิลลาจากบนอัฒจันทร์ แต่พวกเขามีมุมมองที่ค่อนข้างแยกส่วนออกไป และภายในไม่กี่วัน พวกเขาก็บินไปโมนาโกเพื่อแจ้งต่อ เซอร์ จิม แรตคลิฟฟ์ เจ้าของร่วมว่าจำเป็นต้องมีการเปลี่ยนแปลง", "เป็นฤดูกาลที่สามติดต่อกันที่ยูไนเต็ดต้องเปลี่ยนตัวผู้จัดการทีมกลางคัน ซึ่งต่างจากกรณีของ เอริก เทน ฮาก และ รูเบน อโมริม การตัดสินใจครั้งนี้ไม่ใช่เรื่องน่าประหลาดใจ ไม่ใช่เพราะสิ่งที่เกิดขึ้นในตอนนี้ แต่เป็นเพราะสิ่งที่เกิดขึ้นในตอนนี้มันขัดแย้งกับสิ่งที่เกิดขึ้นเมื่อฤดูกาลที่แล้วอย่างสิ้นเชิง หลังจากทำผลงานชนะ 12 จาก 17 เกมภายใต้การคุมทีมของคาร์ริคและพาทีมกลับไปเล่นแชมเปียนส์ลีก บรรยากาศในช่วงปรีซีซั่นถือว่าดีเยี่ยมอย่างมาก", "ไม่มีสัญญาณของความแตกแยก นักเตะดาวรุ่งอย่าง เจเจ กาเบรียล เป็นส่วนหนึ่งของทีม และทีมงานระดับสูงต่างพูดถึงศักยภาพของ บรูโน่ แฟร์นันด์ส ที่จะจับคู่กับ ยูริ ตีเลอมันส์ อย่างมีความหวัง แม้การเสริมทัพจะเป็นปัญหาที่ชัดเจนก็ตาม", "เมื่อมองย้อนกลับไป 48 ชั่วโมงก่อนเกมเปิดฤดูกาลที่พบกับ ฮัลล์ ซิตี้ ถือเป็นช่วงเวลาสำคัญ ในขณะที่ เบนจามิน เซสโก้ ยังคงพยายามฟื้นฟูจากอาการบาดเจ็บที่หน้าแข้ง อาหมัด ดิยัลโล่ ก็ได้รับบาดเจ็บที่ข้อเท้าซึ่งทำให้เขาต้องพักยาว 7 สัปดาห์ นั่นหมายความว่าคาร์ริคขาดตัวเลือกในแนวรุกที่เขาต้องการ โดยต้องให้ ไบรอัน เอ็มเบอโม่ ลงเล่นทางฝั่งขวาแทน", "คาร์ริคหันไปใช้ มาเธอุส คุนญ่า ซึ่งมักจะถอยลงต่ำจนไปทับพื้นที่ของกัปตันทีมอย่าง แฟร์นันด์ส ส่งผลให้เกมรุกของยูไนเต็ดไร้ประสิทธิภาพในวันที่พวกเขาดูไม่พร้อมรับมือกับความแข็งแกร่งของคู่แข่งที่กระหายชัยชนะในการกลับมาสู่พรีเมียร์ลีกอีกครั้ง ในบทบาทผู้สัมภาษณ์ของ Viaplay อดีตกองหน้าทีมชาตินอร์เวย์อย่าง แจน อาเก้ ฟยอร์ทอฟต์ อ้างว่ายูไนเต็ดขาดความมุ่งมั่น ซึ่งคาร์ริคปฏิเสธว่าเป็นเรื่อง 'ไร้สาระ' โดยกล่าวกับสื่อว่า 'มันก็แค่เกมเดียว'", "สัปดาห์ต่อมา ยูไนเต็ดแพ้ให้กับ อิปสวิช ซึ่งเป็นทีมที่เพิ่งเลื่อนชั้นขึ้นมา มีเพียงความผิดพลาดของ มาร์เซลิโน่ นูเนซ ในแดนตัวเองที่เปิดโอกาสให้ คุนญ่า จ่ายบอลให้ แฟร์นันด์ส ทำประตูตีเสมอที่ทีมไม่สมควรได้รับ ก่อนที่แฟร์นันด์ส ซึ่งเพิ่งได้รับรางวัลนักเตะยอดเยี่ยมแห่งปีของ PFA ประจำฤดูกาล 2025-26 จะทำแฮตทริกช่วยให้ทีมชนะ 5-2 และนั่นคือชัยชนะนัดสุดท้ายของยูไนเต็ดในพรีเมียร์ลีก", "หลังจากนั้นคือการไปเยือน เอฟเวอร์ตัน ยูไนเต็ดขึ้นนำสองครั้ง ครั้งที่สองคือตอนที่ เซสโก้ ทำประตูได้ในนาทีที่ 88 หลังจากลงมาเป็นตัวสำรอง แต่ในช่วงทดเวลาบาดเจ็บ เอนส์ลีย์ เมตแลนด์-ไนล์ส ยิงไกลเข้าไปทำให้ทีมเยือนพลาดชัยชนะ เมื่อถูกถามว่าเขามั่นใจแค่ไหนในความสามารถของทีมที่จะตอบสนองต่อการเริ่มต้นฤดูกาลที่น่าผิดหวัง คาร์ริคสวนกลับว่า 'มันไม่ได้แย่ขนาดนั้น'", "สิ่งที่เกิดขึ้นหลังจากนั้นกลับแย่ยิ่งกว่า ความพ่ายแพ้ 4-1 ต่อ โคโม่ ของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในผลงานที่เลวร้ายที่สุดในยุโรป ความฟิตของนักเตะยูไนเต็ดถูกตั้งคำถามครั้งแล้วครั้งเล่า พวกเขาเล่นได้อย่างยากลำบากกับ แมนเชสเตอร์ ซิตี้ ที่เหลือผู้เล่น 10 คนตั้งแต่ครึ่งแรก ก่อนที่ซิตี้จะได้ประตูจาก เออร์ลิง ฮาแลนด์ ซึ่ง ฮาวเวิร์ด เว็บบ์ หัวหน้าผู้ตัดสินยอมรับในภายหลังว่าไม่ควรเป็นประตู", "คำบ่นของคาร์ริคหลังจบเกมนั้นมีเหตุผล แต่ก็เป็นการกลบเกลื่อนฟอร์มการเล่นที่ย่ำแย่ของทีม หลังจากขึ้นนำ 2-0 ภายใน 10 นาทีแรกในเกมพบ ไบรท์ตัน ในศึกอีเอฟแอล คัพ ยูไนเต็ดกลับถูกเล่นงานจนพ่ายแพ้จากการเสียสองประตูภายใน 4 นาทีในครึ่งหลัง ทีมงานสต๊าฟฟ์โค้ชของคาร์ริคที่เคยได้รับคำชมเมื่อไม่กี่เดือนก่อน ไม่สามารถหาคำตอบให้กับสถานการณ์นี้ได้", "เฮดโค้ชกล่าวว่าประตูตีเสมอในช่วงทดเวลาบาดเจ็บของคุนญ่าในเกมพบ ฟูแล่ม ซึ่งเป็นทีมบ๊วยของตารางในขณะนั้น เป็นแง่บวกที่สามารถนำไปต่อยอดได้ แต่ทันทีหลังจากช่วงพักเบรกทีมชาติ ยูไนเต็ดก็ทำได้เพียงเสมออีกครั้ง โดยเสียประตูในช่วงทดเวลาบาดเจ็บให้กับ ท็อตแน่ม ฮ็อทสเปอร์ ที่ฟอร์มตกและเหลือผู้เล่น 10 คน", "วงจรขาลงที่คุ้นเคยเริ่มควบคุมไม่ได้ มาร์ติเนซเป็นคนรับผิดชอบต่อประตูตีเสมอของสเปอร์ส ซึ่งทำให้การระเบิดอารมณ์ของเขาหลังความพ่ายแพ้ 2-0 ในแชมเปียนส์ลีกต่อ แอตเลติโก มาดริด ดูน่าประหลาดใจยิ่งกว่าเดิม"], "link": "https://www.bbc.co.uk/sport/football/articles/cm0rl4kwn8vqo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm0rl4kwn8vqo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/e373/live/dbd80f70-de86-11f1-b88b-3f1671ea859d.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/3527/live/49870420-dc22-11f1-a701-fddedf244c16.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/2b84/live/b7bd2450-d124-11f1-9a61-7b8d75492b97.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6236/live/c3d39ea0-d10a-11f1-93e1-3b657b665bcf.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8a69/live/7340d470-d10b-11f1-a701-fddedf244c16.jpg"], "videos": [], "review_score": "", "published_ts": 1794478889, "published_at": "2026-11-12T10:21:29Z", "published_th": "12 พ.ย. 2026 • 17:21 น.", "category_hint": "Football", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794802776989, "guid": "https://www.bbc.co.uk/sport/football/articles/cw30e0yz0p04o", "original_title": "Assessing the reasons for Man City's decline in form under Maresca", "thai_title": "วิเคราะห์สาเหตุฟอร์มรูดของ แมนเชสเตอร์ ซิตี้ ยุค เอ็นโซ มาเรสกา", "tag": "Football", "bullet_points": ["แมนเชสเตอร์ ซิตี้ ภายใต้การคุมทีมของ เอ็นโซ มาเรสกา ประสบปัญหาฟอร์มตกอย่างหนักหลังแพ้ 3 นัดติดต่อกันในพรีเมียร์ลีก", "ปัจจัยด้านจิตวิทยาจากคดีความเรื่องการละเมิดกฎการเงินของสโมสร ถูกมองว่าเป็นหนึ่งในสาเหตุที่ส่งผลกระทบต่อความมั่นใจของนักเตะ", "ปัญหาเชิงแท็กติกในการปรับตำแหน่ง เอลเลียต แอนเดอร์สัน ให้มาเล่นเป็นมิดฟิลด์ตัวรับแทนที่ โรดรี ทำให้แดนกลางของทีมดูเปราะบางและเสียสมดุล", "สถิติชี้ให้เห็นว่า ซิตี้ เสียประตูจากความผิดพลาดส่วนบุคคลเพิ่มขึ้นอย่างมาก โดยเสียไปแล้ว 13 ประตูจากการลงเล่น 10 นัดแรก ซึ่งเป็นสถิติที่แย่ที่สุดนับตั้งแต่ฤดูกาล 2008-09"], "full_paragraphs": ["ช่วงพักเบรกทีมชาติในขณะนี้ถือเป็นโอกาสสำคัญที่ เอ็นโซ มาเรสกา ผู้จัดการทีมแมนเชสเตอร์ ซิตี้ จะได้ใช้เวลาแก้ไขปัญหาที่กำลังก่อตัวขึ้นภายในทีมของเขา", "กุนซือชาวอิตาเลียนเริ่มต้นงานได้อย่างสวยหรูหลังจากเข้ามารับช่วงต่อจาก เป๊ป กวาร์ดิโอลา ในช่วงซัมเมอร์ โดยพาทีมสร้างสถิติชนะรวด 7 นัดแรกในพรีเมียร์ลีก", "อย่างไรก็ตาม ทีมกลับต้องพบกับความพ่ายแพ้ 3 นัดติดต่อกัน จนปัจจุบันมีคะแนนตามหลังจ่าฝูงอย่าง อาร์เซนอล ถึง 6 แต้ม ซึ่งทางฝั่ง 'ปืนใหญ่' กำลังโชว์ฟอร์มได้อย่างแข็งแกร่งในเส้นทางป้องกันแชมป์", "เมื่อเดือนกันยายนที่ผ่านมา มีการประกาศว่าแมนเชสเตอร์ ซิตี้ มีความผิดจริงในข้อหาละเมิดกฎทางการเงินของพรีเมียร์ลีก และการแข่งขันยังคงดำเนินต่อไปในระหว่างที่สโมสรรอผลการอุทธรณ์", "ท่ามกลางบทลงโทษที่อาจเกิดขึ้น คำถามสำคัญคือฟอร์มการเล่นที่ตกลงไปนั้นเกิดจากปัญหาทางจิตวิทยา หรือเป็นปัญหาเชิงแท็กติกที่มาเรสกาจำเป็นต้องเร่งแก้ไขกันแน่", "ดร. พอล แม็กคาร์ธี นักจิตวิทยาการกีฬาชื่อดังที่มีประสบการณ์กว่า 25 ปีในการทำงานร่วมกับสโมสรชั้นนำในอังกฤษ สกอตแลนด์ เยอรมนี และฝรั่งเศส กล่าวว่าชีวิตส่วนตัวและอาชีพการงานของนักเตะต่างส่งผลต่อฟอร์มในสนาม โดยเปรียบเทียบว่าเมื่อสถานการณ์ไม่แน่นอน ทุกคนต้องพยายาม 'ต่อจิ๊กซอว์' ให้เข้าที่", "แม็กคาร์ธีกล่าวกับ BBC Sport ว่า 'นักเตะก็เหมือนกับคนทั่วไป พวกเขาพูดคุยถึงสิ่งที่เกิดขึ้นในชีวิตและประเด็นที่กำลังเป็นกระแส โดยเฉพาะเหตุการณ์ที่ไม่มีความแน่นอน มันก่อให้เกิดการสื่อสารที่มีทั้งเรื่องเล่าและข่าวลือ และเมื่อเวลาผ่านไปหากมีการแพ้บ่อยครั้ง มักจะนำไปสู่ประสิทธิภาพโดยรวมของทีมที่ลดลง'", "เขายังอธิบายเพิ่มเติมว่า 'ประสิทธิภาพโดยรวมคือความเชื่อมั่นของทีมในความสามารถที่จะทำสิ่งที่จำเป็นเพื่อคว้าชัยชนะ และด้วยความสำเร็จในอดีต ความเชื่อมั่นนี้มักจะสั่นคลอนเล็กน้อยเมื่อต้องพบกับความพ่ายแพ้ติดต่อกัน'", "แมนเชสเตอร์ ซิตี้ เคยรั้งตำแหน่งจ่าฝูงด้วยผลงานไร้ที่ติ แต่ปัจจุบันร่วงลงมาอยู่อันดับ 3 ตามหลังอาร์เซนอลและไบรท์ตัน หลังจากมีการประกาศคำตัดสินว่ามีความผิดในช่วงพักเบรกทีมชาติครั้งก่อน ลูกทีมของมาเรสกาชนะนัดแรกที่พบกับลิเวอร์พูลที่เหลือ 10 คนที่แอนฟิลด์ และเฉือนชนะอิปสวิชที่เอติฮัด สเตเดียม แต่หลังจากนั้นพวกเขากลับแพ้ให้กับ แอสตัน วิลลา, ไบรท์ตัน และ นอตทิงแฮม ฟอเรสต์ โดยปัญหาในแนวรับถูกเปิดโปงและความผิดพลาดส่วนบุคคลกลายเป็นสิ่งที่ต้องจ่ายราคาแพง", "ในช่วง 7 นัดแรกของฤดูกาล ซิตี้ไม่เสียประตูจากความผิดพลาดส่วนบุคคลเลย แต่สถานการณ์เปลี่ยนไปอย่างสิ้นเชิงใน 3 นัดหลังสุด ซึ่งมีความผิดพลาดจากนักเตะถึง 4 ครั้งที่นำไปสู่การเสียประตู", "ซิตี้เสียไปแล้ว 13 ประตูจากการลงเล่น 10 นัดในลีก ซึ่งเป็นตัวเลขที่สูงที่สุดในรอบ 10 นัดแรกนับตั้งแต่ฤดูกาล 2008-09 ที่พวกเขาเสียไป 16 ประตู ซึ่งสิ่งนี้ทำให้เกิดคำถามเกี่ยวกับความแข็งแกร่งในแนวรับ", "เมื่อถามว่าความไม่แน่นอนจากกระบวนการอุทธรณ์อาจส่งผลต่อสมาธิของนักเตะหรือไม่ แม็กคาร์ธีกล่าวว่า 'ใช่ นั่นเป็นการตอบสนองของมนุษย์ที่สมเหตุสมผลมาก เมื่อผู้คนไม่มั่นใจในอนาคต ความไม่แน่นอนนั้นนำไปสู่การขาดความรู้สึกควบคุมได้ ดังนั้นความไม่แน่นอนมักจะสร้างความเครียดมากกว่าข่าวร้าย และงานวิจัยก็แสดงให้เห็นเช่นนั้น ดังนั้นในขณะที่คุณกำลังรอและไม่รู้ผลลัพธ์ คุณจะรู้สึกไม่มั่นคงและขาดการควบคุม ซึ่งเป็นสิ่งที่อยู่นอกเหนือความรับผิดชอบของพวกเขาในการฝึกซ้อมหรือลงเล่น'", "ในแง่ของแท็กติก มาเรสกาได้ปรับเปลี่ยนรูปแบบการเล่นมาใช้ระบบ 3-1-6 อย่างถาวรในฤดูกาลนี้ โดยยอมแลกมิดฟิลด์ตัวรับคนที่สองเพื่อเพิ่มมิดฟิลด์ตัวรุกเข้ามาแทนที่", "คำถามสำคัญอยู่ที่ เอลเลียต แอนเดอร์สัน และคู่หูในแดนกลาง แอนเดอร์สันซึ่งโดยธรรมชาติเป็นมิดฟิลด์ที่ชอบเคลื่อนที่อิสระและใช้ความแข็งแกร่งทางร่างกาย แต่ในฤดูกาลนี้มาเรสกาพยายามปรับให้เขามาเล่นเป็นมิดฟิลด์ตัวต่ำแทนที่ โรดรี ซึ่งการเรียนรู้บทบาทนี้ต้องใช้เวลา เช่นเดียวกับที่โรดรีเคยเผชิญเมื่อย้ายมาใหม่ๆ", "ปัญหาคือแอนเดอร์สันมักจะหลุดจากตำแหน่งมิดฟิลด์ตัวรับเพื่อไปไล่บอลหรือตามประกบคู่แข่ง ทำให้พื้นที่ตรงกลางสนามเปิดกว้างและถูกคู่แข่งใช้ประโยชน์ นอกจากนี้เมื่อซิตี้บุกด้วยระบบ 3-1-6 หากเสียบอลกลางทาง ทีมจะมีผู้เล่นเหลืออยู่หลังบอลเพียง 2-3 คนเท่านั้น ทำให้เสี่ยงต่อการถูกสวนกลับ", "มาเรสกากล่าวถึงประเด็นนี้หลังเกมแพ้นอตทิงแฮม ฟอเรสต์ว่า 'คุณจะเสียประตูจากจังหวะเปลี่ยนรับเป็นรุกเมื่อคุณเสียบอล และเมื่อคุณไม่สามารถเอาชนะในการดวลได้'", "นอกจากนี้ยังมีข้อกังวลเกี่ยวกับทักษะของผู้เล่นในแนวรับ รวมถึง จานลุยจิ ดอนนารุมมา ที่ไม่ใช่ผู้รักษาประตูที่โดดเด่นเรื่องการเล่นบอลด้วยเท้า ทำให้การขึ้นเกมจากแดนหลังภายใต้ความกดดันมักเกิดความผิดพลาดที่ส่งผลเสียหายต่อทีม"], "link": "https://www.bbc.co.uk/sport/football/articles/cw30e0yz0p04o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cw30e0yz0p04o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4c72/live/a41350a0-dcfa-11f1-9ef0-4b5930e2f80e.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/072a/live/5f7b8e70-dd6e-11f1-93e1-3b657b665bcf.png", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/7c5b/live/c36b6620-dd6f-11f1-a701-fddedf244c16.png", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/99b9/live/c8a37560-dd6f-11f1-a701-fddedf244c16.png", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/7b77/live/807fdeb0-dd72-11f1-b441-2b33b063138f.png", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/e65f/live/b58780d0-dd73-11f1-93e1-3b657b665bcf.png"], "videos": [], "review_score": "", "published_ts": 1794397629, "published_at": "2026-11-11T11:47:09Z", "published_th": "11 พ.ย. 2026 • 18:47 น.", "category_hint": "Football", "sub_tag": "MAN CITY"}, {"id": 1794802776991, "guid": "https://www.bbc.co.uk/sport/football/articles/c6n8d8kl125vo", "original_title": "Shirt pull on Isak should have been penalty - panel", "thai_title": "คณะกรรมการผู้ตัดสินชี้ ลิเวอร์พูลควรได้จุดโทษจังหวะดึงเสื้อ อิซัค ในเกมพบ อาร์เซนอล", "tag": "Football", "bullet_points": ["คณะกรรมการเหตุการณ์สำคัญในการแข่งขัน (KMI Panel) ของพรีเมียร์ลีก ลงความเห็นว่า ลิเวอร์พูลควรได้รับจุดโทษในจังหวะที่ อเล็กซานเดอร์ อิซัค ถูก เยอร์เรียน ทิมเบอร์ ดึงเสื้อ", "ผลโหวตจากคณะกรรมการระบุด้วยคะแนน 4:1 ว่าควรมีการเป่าจุดโทษในสนาม และ 3:2 ว่า VAR ควรแทรกแซงให้ผู้ตัดสินไปดูจอข้างสนาม", "อันโดนี อิราโอลา กุนซือลิเวอร์พูลวิจารณ์ว่านักเตะถูกดึงเสื้อชัดเจน แต่เพราะไม่ล้มลงไปจึงไม่ได้จุดโทษ พร้อมตั้งคำถามถึงมาตรฐานการตัดสิน", "นอกจากนี้ คณะกรรมการยังระบุว่ามีความผิดพลาดของ VAR อีกหนึ่งกรณีในเกมที่ อิปสวิช พบกับ ฮัลล์ ซิตี้ ซึ่งควรมีการให้จุดโทษแก่ อิปสวิช เช่นกัน"], "full_paragraphs": ["คณะกรรมการเหตุการณ์สำคัญในการแข่งขัน (Key Match Incidents Panel) ของพรีเมียร์ลีก ได้มีมติชี้ขาดว่า ลิเวอร์พูลควรได้รับลูกจุดโทษในเกมที่พบกับ อาร์เซนอล หลังจากที่ อเล็กซานเดอร์ อิซัค ถูก เยอร์เรียน ทิมเบอร์ กองหลังทีมปืนใหญ่ดึงเสื้อในเขตโทษ", "เหตุการณ์ดังกล่าวเกิดขึ้นในนาทีที่ 21 ของการแข่งขันที่สนามแอนฟิลด์ เมื่อวันที่ 1 พฤศจิกายน โดย อเล็กซานเดอร์ อิซัค พยายามจะโหม่งลูกเปิดของ แบรดลีย์ บาร์โกลา แต่ไม่สามารถเข้าถึงบอลได้", "แอนดี แมดลีย์ ผู้ตัดสินในสนามไม่ได้เป่าให้เป็นจุดโทษ และเมื่อมีการตรวจสอบผ่านระบบวิดีโอช่วยตัดสิน (VAR) โดย สจวร์ต แอตต์เวลล์ ก็ได้ข้อสรุปว่าไม่มีการกระทำผิดเกิดขึ้น ทั้งที่ภาพรีเพลย์แสดงให้เห็นอย่างชัดเจนว่า ทิมเบอร์ ได้ใช้มือดึงเสื้อของ อิซัค", "คณะกรรมการ KMI Panel ได้ลงมติด้วยคะแนนเสียง 4:1 ว่าจังหวะนี้ควรเป็นการเป่าจุดโทษในสนาม และมีคะแนนเสียง 3:2 ที่เห็นว่า VAR ควรเข้ามาแทรกแซงและส่งสัญญาณให้ผู้ตัดสินไปตรวจสอบเหตุการณ์ที่จอข้างสนาม", "ในขณะที่เกิดเหตุการณ์ดังกล่าว อาร์เซนอล เป็นฝ่ายขึ้นนำอยู่ 1-0 จากประตูของ ไค ฮาแวร์ตซ์ ซึ่งกลายเป็นประตูชัยเพียงประตูเดียวที่ตัดสินผลการแข่งขันในนัดนี้", "แม้จะมีคณะกรรมการสองท่านที่เน้นย้ำถึง 'ความเป็นอัตวิสัยในการประเมินผลกระทบ' ว่าเป็นเหตุผลที่ไม่ควรแทรกแซง แต่ความเห็นส่วนใหญ่ของคณะกรรมการมองว่านี่คือ 'ความผิดพลาดที่ชัดเจนและเห็นได้ชัด' (clear and obvious error) ของ VAR", "อย่างไรก็ตาม คณะกรรมการ KMI Panel มีมติเป็นเอกฉันท์ว่า การเข้าปะทะของ ทิมเบอร์ ไม่ถึงขั้นต้องได้รับใบแดงในข้อหาขัดขวางโอกาสในการทำประตูที่ชัดเจน", "ในจังหวะดังกล่าว อเล็กซานเดอร์ อิซัค ยังคงพยายามประคองตัวไม่ให้ล้มลงไปกับพื้น", "หลังจบเกม อันโดนี อิราโอลา ผู้จัดการทีมลิเวอร์พูล ได้ให้สัมภาษณ์กับรายการ BBC Match of the Day ว่า: 'มีการดึงเสื้อที่ชัดเจนมาก อเล็กซ์ อยู่ข้างหน้าเขาพอดี เขาจะโหม่งทำประตูอยู่แล้ว แต่ทำไม่ได้เพราะถูกดึงเสื้อ'", "อิราโอลา กล่าวเสริมว่า: 'ถ้าเขาล้มลงไป พวกเขาจะเป่าจุดโทษให้ 100% มันควรจะเป็นแบบนั้น แต่มันก็เป็นไปแล้ว ครั้งหน้าผู้จัดการทีมคงต้องบอกให้ อเล็กซ์ ล้มลงไป ไม่อย่างนั้นพวกเขาจะไม่เป่าให้ คำตอบคือคุณต้องพุ่งล้ม ถ้าคุณไม่พุ่งล้ม พวกเขาก็จะไม่เป่าให้คุณ'", "นอกจากนี้ คณะกรรมการ KMI Panel ยังระบุว่ามีความผิดพลาดของ VAR เกิดขึ้นอีกหนึ่งกรณีเมื่อวันที่ 31 ตุลาคม โดยระบุว่า อิปสวิช ควรได้รับจุดโทษในเกมที่พบกับ ฮัลล์ ซิตี้ จากจังหวะที่ โนเบล เมนดี้ เหนี่ยวรั้ง ดารา โอเช ในจังหวะเตะมุม", "ปีเตอร์ แบงค์ส ผู้ตัดสินในเกมนั้นมองไม่เห็นเหตุการณ์ดังกล่าว และ นีล เดวีส์ ผู้ทำหน้าที่ VAR ก็ไม่ได้ดำเนินการใดๆ", "ในขณะนั้นสกอร์ยังคงเสมอกันอยู่ที่ 0-0 ก่อนที่ อิปสวิช จะมาได้ประตูขึ้นนำในเวลาต่อมา และจบเกมด้วยผลเสมอ 2-2"], "link": "https://www.bbc.co.uk/sport/football/articles/c6n8d8kl125vo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c6n8d8kl125vo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/92ad/live/0f801aa0-d6be-11f1-aacc-5b5f23abff4b.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/de64/live/33dca940-dc36-11f1-95cf-a38331e6cb4b.jpg"], "videos": [], "review_score": "", "published_ts": 1794392617, "published_at": "2026-11-11T10:23:37Z", "published_th": "11 พ.ย. 2026 • 17:23 น.", "category_hint": "Football", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794802776993, "guid": "https://www.bbc.co.uk/sport/football/articles/c6n9r93dnr9do", "original_title": "Incident-by-incident: Was it a bad weekend for VAR?", "thai_title": "เจาะลึกทุกประเด็นร้อน: สุดสัปดาห์ที่ผ่านมาถือเป็นช่วงเวลาที่เลวร้ายของ VAR ในพรีเมียร์ลีกหรือไม่?", "tag": "Football", "bullet_points": ["สถิติระบุว่าการตัดสินของ VAR ในพรีเมียร์ลีกฤดูกาลนี้ทำได้ดีขึ้น โดยมีข้อผิดพลาดเพียง 2 ครั้งจากการแข่งขัน 8 นัดแรก เทียบกับ 6 ครั้งในช่วงเวลาเดียวกันของฤดูกาลที่แล้ว", "สุดสัปดาห์ที่ผ่านมาเกิดเหตุการณ์ถกเถียงเรื่องการตัดสินในเกือบทุกคู่ ทำให้คณะกรรมการ KMI ต้องเข้ามาตรวจสอบความถูกต้องอีกครั้ง", "BBC Sport ประเมินว่ามี 2 เหตุการณ์ที่คณะกรรมการ KMI มีแนวโน้มจะระบุว่าเป็นความผิดพลาดของ VAR ได้แก่ กรณีจุดโทษของ อาร์เซนอล และ โคเวนทรี", "การตัดสินในจังหวะสำคัญต่างๆ เช่น การทำฟาวล์ในเขตโทษ, การทำแฮนด์บอล และใบแดง ถูกนำมาวิเคราะห์เพื่อหาความชัดเจนตามกฎกติกาฟุตบอล"], "full_paragraphs": ["แม้จะมีการพูดถึงกันอย่างเบาๆ แต่สถิติระบุว่าการตัดสินของผู้ตัดสินวิดีโอช่วยตัดสิน (VAR) ในพรีเมียร์ลีกฤดูกาลนี้ทำผลงานได้ค่อนข้างดี โดยคณะกรรมการ Key Match Incidents (KMI) ซึ่งทำหน้าที่ตรวจสอบทุกการตัดสินที่น่ากังขาและลงมติว่าถูกต้องหรือผิดพลาด ได้รายงานว่ามีข้อผิดพลาดจาก VAR เพียงสองครั้งเท่านั้นหลังจากผ่านการแข่งขันไปแล้ว 8 นัด ซึ่งถือว่าดีขึ้นมากเมื่อเทียบกับช่วงเวลาเดียวกันของฤดูกาลที่แล้วที่มีข้อผิดพลาดเกิดขึ้นถึง 6 ครั้ง", "อย่างไรก็ตาม สถานการณ์กลับเปลี่ยนไปในช่วงสุดสัปดาห์ที่ผ่านมา ซึ่งแทบทุกเกมในลีกสูงสุดต่างมีเหตุการณ์การตัดสินที่กลายเป็นประเด็นถกเถียง BBC Sport ได้รวบรวมเหตุการณ์ส่วนใหญ่ที่เกิดขึ้น (ซึ่งมีจำนวนมากเกินกว่าจะสรุปได้ทั้งหมด) เพื่อประเมินความเป็นไปได้ที่คณะกรรมการ KMI จะเพิ่มรายชื่อเหตุการณ์เหล่านั้นเข้าไปในรายการความผิดพลาด", "เหตุการณ์ที่ 1: การให้จุดโทษแก่ แมนเชสเตอร์ ยูไนเต็ด จากจังหวะที่ บูบาการ์ กามารา ทำฟาวล์ มาเธอุส คุนญา ในนาทีที่ 16 คำตัดสินคือจุดโทษถูกมอบให้เนื่องจากกองหลังวิลล่าเข้าสกัดโดนตัวคุนญาก่อนจะถึงบอล ภาพรีเพลย์แสดงให้เห็นชัดเจนว่าการปะทะครั้งแรกเกิดขึ้นที่เท้าของนักเตะชาวบราซิลรายนี้ ซึ่งคณะกรรมการ KMI น่าจะมองว่าเป็นการตัดสินที่ถูกต้อง", "เหตุการณ์ที่ 2: ความเป็นไปได้ในการทำฟาวล์ของ เซนน์ ลัมเมนส์ ต่อ ซิออน ซูซูกิ ผู้รักษาประตู แอสตัน วิลลา ก่อนที่ แพทริค ดอร์กู จะทำประตูตีเสมอในนาทีที่ 96 เหตุการณ์นี้มีความคล้ายคลึงกับประตูที่ อาร์เซนอล เคยทำได้ที่ โอลด์ แทรฟฟอร์ด เมื่อฤดูกาลที่แล้ว โดยลัมเมนส์ไม่ได้มองบอล ซึ่งเพิ่มโอกาสในการที่ VAR จะเข้ามาแทรกแซง อย่างไรก็ตาม ด้วยมาตรฐานการแทรกแซงที่สูงขึ้นในพรีเมียร์ลีกและการปะทะที่น้อยมาก จึงไม่น่าจะเป็นความผิดพลาดของ VAR ที่ไม่ปฏิเสธประตูนี้", "เหตุการณ์ ไค ฮาแวร์ตซ์ ถูก โนเบล เมนดี้ ดึงล้มในเขตโทษ ไมเคิล โอลิเวอร์ ผู้ตัดสิน VAR ได้ส่ง ฟาราย ฮัลลัม ผู้ตัดสินในสนามไปดูจอข้างสนามเพื่อพิจารณาจุดโทษ แต่สุดท้ายไม่ได้มีการให้จุดโทษเนื่องจากมีการล้ำหน้าของกองหน้าทีมชาติเยอรมนีเกิดขึ้นก่อน ทั้งนี้ BBC Sport มองว่าเนื่องจากการทำฟาวล์เกิดขึ้นก่อนจังหวะล้ำหน้า ดังนั้นควรจะมีการให้จุดโทษ ซึ่งคณะกรรมการ KMI อาจมองว่าเป็นความผิดพลาด แม้จะรู้สึกไม่ยุติธรรมที่จะให้รางวัลแก่ผู้เล่นที่อยู่ในตำแหน่งล้ำหน้าก็ตาม", "เหตุการณ์ เจย์เดน โบเกิล ทำฟาวล์ มาธีส์ เทล โดย จอห์น บรูคส์ ผู้ตัดสินในสนามให้เพียงลูกฟรีคิกแต่ไม่มีการลงโทษทางวินัยแก่ผู้เล่น ลีดส์ และ โทนี่ แฮร์ริงตัน ผู้ตัดสิน VAR เลือกที่จะไม่ส่งบรูคส์ไปดูจอเพื่อพิจารณาใบแดง นี่เป็นการตัดสินที่ยากสำหรับ VAR เพราะโบเกิลใช้เท้าข้างที่ใช้ประคองตัวในการเข้าปะทะ ไม่ใช่เท้าที่ใช้เล่นบอล แต่ถึงกระนั้นก็เป็นการเข้าปะทะที่รุนแรงและหลายคนเชื่อว่าควรเป็นใบแดง ซึ่งคณะกรรมการ KMI จะต้องพิจารณาว่านี่เป็นอุบัติเหตุหรือเป็นการเข้าปะทะที่อันตรายต่อคู่แข่ง", "เหตุการณ์ที่เกี่ยวข้องกับ เอฟเวอร์ตัน พบ โคเวนทรี มี 3 ประเด็นหลัก ประเด็นแรกคือการที่ คาเล็บ ยิเรนกี้ ของโคเวนทรีถูก เจมส์ ทาร์คอฟสกี้ ดึงผมในเขตโทษแต่ไม่มีการให้จุดโทษ แม้กฎการดึงผมจะผ่อนปรนลงในฤดูกาลนี้ แต่ดูเหมือนมีการกระชากผมจริง ซึ่ง KMI อาจมองว่าเป็นการตัดสินที่ผิดพลาดและควรเป็นจุดโทษ ประเด็นที่สองคือจังหวะที่ วิตาลี มิโคเลนโก้ ปะทะกับ ไทโว อโวนิยี่ บริเวณขอบเขตโทษ ซึ่งภาพรีเพลย์แสดงให้เห็นว่าการปะทะเกิดขึ้นก่อนเส้นเขตโทษ จึงน่าจะเป็นการตัดสินที่ถูกต้องแล้วที่ไม่ให้จุดโทษ ประเด็นที่สามคือประตูของ เธียร์โน แบร์รี่ ในนาทีที่ 61 ซึ่งมีการเช็ก VAR เรื่องแฮนด์บอล โดย VAR ตัดสินว่าไม่มีหลักฐานชัดเจน แต่ดูเหมือนบอลจะเปลี่ยนทิศทาง ซึ่งอาจเป็นประเด็นที่คณะกรรมการมีความเห็นแตกแยก", "เหตุการณ์ อิกอร์ ติอาโก้ ถูกไล่ออกหลังจาก VAR ตรวจสอบจังหวะที่เขาใช้ท่อนแขนปะทะเข้าที่ศีรษะของ เชม่า อันเดรส กองหน้า เบรนท์ฟอร์ด อาจมองว่าโชคร้ายเพราะดูเหมือนไม่มีเจตนา แต่คณะกรรมการ KMI น่าจะสนับสนุนการตัดสินนี้ เนื่องจากกฎระบุว่าการตีเข้าที่ศีรษะควรเป็นใบแดง เว้นแต่แรงปะทะจะน้อยมาก", "เหตุการณ์ คริสตัล พาเลซ ได้จุดโทษในช่วงทดเวลาบาดเจ็บนาทีที่ 3 จากจังหวะที่ มิโลส เคอร์เคซ ทำฟาวล์ ดาริโอ โอโซริโอ เหตุการณ์นี้คล้ายกับจังหวะ วิลเลียม ซาลิบา ปะทะ เจา เปโดร ในฤดูกาล 2024-25 ซึ่งเคยถูกตัดสินว่าถูกต้อง แต่ในกรณีนี้อาจถูกมองว่าเป็นจังหวะ 50-50 และอาจไม่ถึงเกณฑ์ที่ VAR ต้องเข้ามาแทรกแซง", "เหตุการณ์ โคล พาลเมอร์ ล้มลงบริเวณขอบเขตโทษจากการเข้าปะทะของ ลุค โอไนน์ และ จูลส์ อาโฮก้า โดยผู้ตัดสิน จาร์เร็ด กิลเล็ตต์ ไม่ให้ฟาวล์ เนื่องจากไม่มีหลักฐานชัดเจนว่าการปะทะครั้งแรกเกิดขึ้นภายในเขตโทษ จึงไม่น่ามีการให้จุดโทษ ส่วนเหตุการณ์ที่ นิวคาสเซิล พลาดประตูขึ้นนำที่ คราเวน คอทเทจ เนื่องจากถูกจับฟาวล์จังหวะ โยอัน วิสซ่า ปะทะ ทิโมธี คาสตาญ นั้น คาดว่าคณะกรรมการ KMI จะลงมติว่าเป็นการตัดสินที่ถูกต้องแล้ว", "โดยสรุป BBC Sport ประเมินว่ามี 2 เหตุการณ์ที่คณะกรรมการ KMI มีแนวโน้มจะบันทึกว่าเป็นความผิดพลาดของ VAR อย่างชัดเจน ได้แก่ การไม่ให้จุดโทษแก่ อาร์เซนอล และ โคเวนทรี"], "link": "https://www.bbc.co.uk/sport/football/articles/c6n9r93dnr9do?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c6n9r93dnr9do", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/de64/live/33dca940-dc36-11f1-95cf-a38331e6cb4b.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/7622/live/d9934430-dc44-11f1-95cf-a38331e6cb4b.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/e2dd/live/fb15a380-db97-11f1-a42b-dbe60e973664.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/910b/live/15fd4900-da13-11f0-a8dc-93c15fe68710.jpg"], "videos": [], "review_score": "", "published_ts": 1794234859, "published_at": "2026-11-09T14:34:19Z", "published_th": "9 พ.ย. 2026 • 21:34 น.", "category_hint": "Football", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794802776995, "guid": "https://www.bbc.co.uk/sport/football/articles/c98rzr51rlvpo", "original_title": "Chelsea staff warned over Fantasy Premier League use", "thai_title": "เชลซีออกโรงเตือนทีมงาน หลังข้อมูลนักเตะเจ็บรั่วไหลผ่านเกม Fantasy Premier League", "tag": "Football", "bullet_points": ["เชลซีส่งอีเมลเตือนพนักงานและทีมงานให้ระมัดระวังการเปิดเผยข้อมูลภายในผ่านเกม Fantasy Premier League (FPL)", "ปัญหาเกิดขึ้นหลังจากมีการสังเกตเห็นว่าทีมงานเชลซีถอดชื่อ เจา เปโดร ออกจากทีม FPL ก่อนเกมพบ ท็อตแนม ฮอตสเปอร์ ทั้งที่สโมสรยังไม่มีการประกาศอาการบาดเจ็บ", "กุนซือ ชาบี อลอนโซ ยืนยันว่าตนไม่ทราบเรื่องดังกล่าวและไม่ได้เล่นเกม FPL", "เหตุการณ์ข้อมูลรั่วไหลไม่ใช่เรื่องใหม่สำหรับเชลซี โดยเคยมีกรณีในยุคของ เลียม โรซีเนียร์ และกรณีช่างตัดผมของ มาร์ก กูกูเรยา ที่เคยหลุดข้อมูลนักเตะก่อนเกม", "ปัจจุบันพรีเมียร์ลีกยังไม่มีกฎระเบียบควบคุมการเล่น FPL ของบุคลากรในสโมสรอย่างเป็นทางการ โดยปล่อยให้เป็นหน้าที่ของแต่ละสโมสรในการจัดการกันเอง"], "full_paragraphs": ["เชลซีได้ออกคำเตือนไปยังทีมงานภายในสโมสรให้มีความระมัดระวังเกี่ยวกับการเปิดเผยข้อมูลทีมโดยไม่ตั้งใจผ่านทางเกม Fantasy Premier League หลังจากมีกรณีที่อาการบาดเจ็บของ เจา เปโดร ดูเหมือนจะถูกเปิดเผยผ่านการจัดทีมของผู้เล่นในเกมดังกล่าว", "ทางสโมสรได้ส่งอีเมลถึงพนักงานทุกคนเพื่อย้ำเตือนถึงผลกระทบที่อาจเกิดขึ้นจากการใช้ข้อมูลภายในในการเล่นเกม Fantasy Premier League หรือแพลตฟอร์มเกมสาธารณะอื่นๆ ซึ่งการเลือกผู้เล่นลงทีมอาจเป็นการเปิดเผยโดยนัยว่านักเตะคนใดไม่พร้อมลงสนามหรือใกล้จะกลับมาฟิตสมบูรณ์อีกครั้ง", "เหตุการณ์นี้เกิดขึ้นหลังจากมีข้อมูลรั่วไหลก่อนเกมที่เชลซีพ่ายคาบ้านให้กับ ท็อตแนม ฮอตสเปอร์ 0-2 โดยในเกมนั้น เจา เปโดร ไม่มีชื่อในทีมอย่างน่าประหลาดใจ ซึ่งต่อมามีการเปิดเผยว่าเป็นเพราะอาการบาดเจ็บที่กล้ามเนื้อต้นขา", "บรรดาคอนเทนต์ครีเอเตอร์ชื่อดังในแวดวง Fantasy Premier League หลายรายอ้างว่าได้เห็นหลักฐานว่า มอร์แกน โรเจอร์ส กองหน้าของทีม รวมถึงทีมงานเชลซีอีกหลายคน ได้ถอดชื่อของ เจา เปโดร ออกจากทีม Fantasy ของพวกเขา ก่อนที่เกมที่สแตมฟอร์ด บริดจ์ จะเริ่มขึ้น ทั้งที่สโมสรยังไม่มีการประกาศข่าวอาการบาดเจ็บของนักเตะออกมาแต่อย่างใด", "เมื่อถูกถามถึงประเด็นนี้โดย BBC Sport หลังจบเกม ชาบี อลอนโซ กุนซือของทีมกล่าวว่าเขาไม่ทราบเรื่องดังกล่าว โดยเขาตอบว่า: \"ผมไม่ได้สนใจเรื่องเกมแฟนตาซีพวกนี้ ดังนั้นผมจึงไม่รู้เรื่องเลย\"", "นับตั้งแต่ย้ายมาคุมเชลซีในช่วงซัมเมอร์ อลอนโซในวัย 44 ปี มักจะระมัดระวังตัวเสมอเมื่อต้องพูดถึงประเด็นอาการบาดเจ็บของนักเตะในการแถลงข่าวต่อสื่อมวลชน", "เชลซีเคยประสบปัญหาเรื่องข้อมูลรั่วไหลมาก่อนหน้านี้ ในช่วงที่ เลียม โรซีเนียร์ อดีตผู้จัดการทีมคุมทัพเป็นเวลา 4 เดือนเมื่อฤดูกาลที่แล้ว รายชื่อผู้เล่นตัวจริงเคยถูกปล่อยออกมาก่อนการแข่งขันทั้งสองนัดในศึกยูฟ่า แชมเปียนส์ลีก ที่พบกับ ปารีส แซงต์-แชร์กแมง", "นอกจากนี้ ยังเคยมีกรณีที่ช่างตัดผมของ มาร์ก กูกูเรยา อดีตกองหลังของทีม ได้เปิดเผยผ่านโซเชียลมีเดียว่า เจา เปโดร และ โคล พาลเมอร์ จะพลาดการเดินทางไปเยือน ไบรท์ตัน ในฤดูกาลที่แล้ว หลังจากได้พูดคุยเรื่องนี้กับลูกค้าของเขา", "ในส่วนของเกม Fantasy Premier League ทางสโมสรคาดว่าจะไม่มีการออกข้อห้ามเพิ่มเติม เนื่องจากเชลซีมองว่าเหตุการณ์นี้เป็นกรณีเฉพาะที่สามารถจัดการได้ด้วยการสร้างความตระหนักรู้ให้มากขึ้นในหมู่ผู้เล่นและทีมงาน", "ที่ผ่านมามีตัวอย่างมากมายที่บ่งชี้ว่านักเตะจากสโมสรต่างๆ เช่น อาร์เซนอล, ลิเวอร์พูล, เลสเตอร์ ซิตี้ และ นิวคาสเซิล ยูไนเต็ด ได้มีการปรับเปลี่ยนทีมที่ส่อเค้าถึงข้อมูลภายใน ขณะที่ BBC Sport ได้ระบุบัญชีผู้ใช้งานที่บรรดานักแกะรอย Fantasy Premier League เชื่อว่ามีความเชื่อมโยงกับนักเตะชื่อดังและบุคคลสำคัญในสโมสรต่างๆ ทั่วทั้งลีก", "ตัวอย่างที่โด่งดังที่สุดอาจเป็นการเปิดเผยว่า แจ็ค กรีลิช กองหน้าของ แอสตัน วิลลา ในขณะนั้น ไม่มีชื่ออยู่ในทีมก่อนเกมพบกับ เลสเตอร์ ซิตี้ ในเดือนกุมภาพันธ์ 2021", "เบรนแดน รอดเจอร์ส ผู้จัดการทีมเลสเตอร์ในขณะนั้น กล่าวในภายหลังว่าเขารับรู้ถึงข่าวลือเรื่องอาการบาดเจ็บของ กรีลิช ก่อนการแข่งขัน ซึ่งในเกมนั้นทีมของเขาเป็นฝ่ายคว้าชัยชนะไปได้", "ปัจจุบันมีผู้เล่น Fantasy Premier League มากกว่า 11 ล้านคน ซึ่งเกมนี้ได้กลายเป็นส่วนสำคัญที่โดดเด่นมากขึ้นเรื่อยๆ ในระบบนิเวศของฟุตบอลโดยรวม", "แม้จะมีกฎระเบียบที่เข้มงวดเกี่ยวกับการห้ามเล่นการพนัน แต่พรีเมียร์ลีกยังไม่มีแนวทางปฏิบัติที่ชัดเจนสำหรับสโมสรว่าผู้ที่มีส่วนเกี่ยวข้องกับทีมควรมีส่วนร่วมในเกม Fantasy Premier League อย่างไร หรือควรเล่นหรือไม่", "โดยทั่วไปแล้ว เรื่องนี้จึงถูกมองว่าเป็นประเด็นที่แต่ละสโมสรต้องจัดการกันเองเป็นการภายใน"], "link": "https://www.bbc.co.uk/sport/football/articles/c98rzr51rlvpo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c98rzr51rlvpo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/824c/live/4f7c8740-dc33-11f1-958b-3f65a8ba2dc3.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/93e3/live/fe294b10-fd89-11ee-a9f7-4d961743aa47.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4ac0/live/8e6db7b0-7ac0-11f0-ab3e-bd52082cd0ae.png"], "videos": [], "review_score": "", "published_ts": 1794228083, "published_at": "2026-11-09T12:41:23Z", "published_th": "9 พ.ย. 2026 • 19:41 น.", "category_hint": "Football", "sub_tag": "CHELSEA"}, {"id": 1794802776997, "guid": "https://www.bbc.co.uk/sport/football/articles/cw62ypepq2m7o", "original_title": "Alisson wants to sign new Liverpool contract", "thai_title": "อลิสซอน เบ็คเกอร์ ยืนยันชัดเจนต้องการต่อสัญญาใหม่กับ ลิเวอร์พูล", "tag": "Football", "bullet_points": ["อลิสซอน เบ็คเกอร์ นายทวารมือหนึ่งของลิเวอร์พูล แสดงความต้องการชัดเจนว่าต้องการอยู่กับสโมสรต่อไปแม้สัญญาปัจจุบันจะสิ้นสุดลงหลังจบฤดูกาลนี้", "เจ้าตัวยืนยันว่ามีความสุขดีกับชีวิตในถิ่นแอนฟิลด์ และยังคงมีความกระหายที่จะคว้าแชมป์และลงเล่นในระดับสูงสุดต่อไป", "ในขณะนี้ตัวแทนของอลิสซอนกำลังอยู่ในระหว่างการพูดคุยกับสโมสรเกี่ยวกับอนาคตของเขา", "ลิเวอร์พูลมีแผนรองรับในตำแหน่งผู้รักษาประตูด้วยการมี จอร์จี้ มามาร์ดาชวิลลี่ และดาวรุ่งอย่าง ลุคก้า บรู๊กแมนส์ ที่จะย้ายมาร่วมทีมในอนาคต", "อลิสซอนเน้นย้ำว่าทีมจำเป็นต้องสร้างความสม่ำเสมอเพื่อก้าวขึ้นไปลุ้นแชมป์อย่างเต็มตัวภายใต้การคุมทีมของ อันโดนี่ อิราโอล่า"], "full_paragraphs": ["อลิสซอน เบ็คเกอร์ ผู้รักษาประตูของลิเวอร์พูล แสดงความต้องการที่จะอยู่กับสโมสรต่อไปหลังจากสิ้นสุดฤดูกาลนี้ ซึ่งเป็นช่วงเวลาที่สัญญาปัจจุบันของเขาจะหมดลง โดยนายทวารวัย 34 ปีรายนี้ ย้ายจาก โรม่า มาร่วมทีมด้วยค่าตัว 66.8 ล้านปอนด์ในปี 2018 และลงสนามรับใช้ 'หงส์แดง' ไปแล้วถึง 347 นัด", "\"ใช่ครับ (ผมต้องการอยู่ต่อ) ในความคิดของผม ผมโฟกัสไปที่การลงเล่นในทุกเกม แต่ในใจผมมีความสุขที่จะได้อยู่ที่นี่ต่อไป\" อลิสซอน กล่าว \"มันขึ้นอยู่กับหลายแง่มุมและสถานการณ์ที่แตกต่างกัน แต่ความตั้งใจของผมคือการอยู่ต่อ ผมมีความสุขที่นี่และครอบครัวของผมก็มีความสุขที่นี่เช่นกัน\"", "เขากล่าวเสริมว่า \"ผมยังคงกระหายในถ้วยรางวัลและต้องการโชว์ฟอร์มการเล่นที่ดี ผมยังอยากลงเล่นในระดับสูงสุดให้นานที่สุดเท่าที่จะทำได้ นั่นคือสิ่งที่ผมคิด\" เมื่อถูกถามว่ามีการพูดคุยเรื่องสัญญาฉบับใหม่แล้วหรือยัง อลิสซอนตอบว่า \"ยังครับ แต่เอเยนต์ของผมกำลังพูดคุยกับทางสโมสรอยู่\"", "ก่อนหน้านี้มีรายงานว่านายทวารทีมชาติบราซิลรายนี้เคยพิจารณาเรื่องการย้ายไป ยูเวนตุส เมื่อช่วงต้นปีที่ผ่านมา แต่สุดท้ายก็เลือกที่จะอยู่กับ ลิเวอร์พูล ต่อไปที่แอนฟิลด์ โดยเมื่อสัปดาห์ที่ผ่านมา อันโดนี่ อิราโอล่า เฮดโค้ชของลิเวอร์พูล กล่าวว่าเขาไม่แน่ใจว่านี่จะเป็นฤดูกาลสุดท้ายของอลิสซอนกับสโมสรหรือไม่ แต่ก็หวังว่าผู้รักษาประตูรายนี้จะสามารถอยู่กับทีมต่อไปได้อีกนาน", "หลังจากผ่านสัปดาห์ที่ยากลำบากจากการพ่ายแพ้ต่อ อาร์เซนอล และ เฟเนร์บาห์เช่ อลิสซอนสามารถโชว์ฟอร์มเซฟสำคัญหลายครั้งในเกมที่บุกไปชนะ คริสตัล พาเลซ เมื่อวันอาทิตย์ที่ผ่านมา โดยเจ้าตัวมองว่าลิเวอร์พูลจำเป็นต้องสร้างความสม่ำเสมอหากต้องการก้าวขึ้นไปลุ้นแชมป์รายการต่างๆ", "\"ความจริงคือเรายังทำได้ไม่ดีเท่าที่ควร ไม่ได้หมายความว่าเราเล่นแย่ เราทำได้ดีในหลายเกม แต่ความสม่ำเสมอยังไม่เกิดขึ้น\" เขากล่าว \"เรามีผู้จัดการทีมระดับท็อป มีนักเตะระดับท็อป เรามีความสามารถที่จะทำสิ่งที่ยิ่งใหญ่ได้ แต่ในฐานะทีม เราต้องไปถึงจุดที่เรารู้สึกว่า 'ตอนนี้เราโอเคแล้ว เรามีความมั่นใจ เรามีทุกอย่างที่จำเป็นสำหรับการคว้าชัยชนะ' เรากำลังสร้างสิ่งนั้นอยู่ ผมหวังว่าเราจะไปถึงจุดนั้นได้เร็วๆ นี้ แต่มันต้องใช้เวลา เราต้องอดทน แต่ในฐานะนักเตะ เราไม่มีเวลาให้เสียเปล่า\"", "นี่เป็นครั้งแรกที่อลิสซอนออกมาพูดถึงสถานการณ์สัญญาของเขาในฤดูกาลนี้ และจากท่าทีของเขาหลังจบเกมที่เซลเฮิร์สต์ พาร์ค เห็นได้ชัดว่าเขามีความปรารถนาอย่างแรงกล้าที่จะอยู่กับลิเวอร์พูลต่อไป แม้ว่าสโมสรจะมี จอร์จี้ มามาร์ดาชวิลลี่ วัย 26 ปี รอโอกาสอยู่ และยังมีดาวรุ่งพรสวรรค์สูงวัย 18 ปีอย่าง ลุคก้า บรู๊กแมนส์ ที่จะย้ายมาจาก เกงค์ ในช่วงซัมเมอร์นี้ ซึ่งทำให้ทีมของอิราโอล่ามีตัวเลือกในตำแหน่งผู้รักษาประตูมากมาย แต่การปล่อยให้อลิสซอนย้ายทีมแบบไม่มีค่าตัวคงเป็นการตัดสินใจที่ใหญ่หลวงสำหรับสโมสร", "แม้ในช่ มตช์คลาสสิกพรีเมียร์ลีก?", "tag": "Football", "bullet_points": ["แมนเชสเตอร์ ยูไนเต็ด สร้างสถิติถูกนำ 2-0 เร็วที่สุดในประวัติศาสตร์พรีเมียร์ลีกด้วยเวลาเพียง 3 นาที 40 วินาทีในเกมที่เสมอกับ แอสตัน วิลลา 4-4", "เกมดังกล่าวถือเป็นครั้งที่ 29 ในประวัติศาสตร์พรีเมียร์ลีกที่ทั้งสองทีมทำประตูรวมกันได้ถึง 8 ลูกในนัดเดียว", "บทความนี้รวบรวมแมตช์ระดับตำนานที่เต็มไปด้วยความดราม่าและการพลิกสถานการณ์ในอดีต เพื่อเปรียบเทียบกับเกมล่าสุดที่โอลด์แทรฟฟอร์ด", "การทำประตูตีเสมอในช่วงทดเวลาบาดเจ็บของ โจชัว เซิร์กซี และ แพทริค ดอร์กู อาจเป็นจุดเปลี่ยนสำคัญที่ช่วยรักษาเก้าอี้กุนซือของ ไมเคิล คาร์ริค เอาไว้ได้"], "full_paragraphs": ["แมนเชสเตอร์ ยูไนเต็ด ตกเป็นฝ่ายตามหลัง แอสตัน วิลลา ถึงสองประตูหลังจากเริ่มเกมไปได้เพียง 3 นาที 40 วินาที ซึ่งถือเป็นสถิติการถูกนำ 2-0 ที่เร็วที่สุดของพวกเขาในพรีเมียร์ลีก", "เมื่อ แมนเชสเตอร์ ยูไนเต็ด และ แอสตัน วิลลา ร่วมกันสร้างเกมสุดระทึกที่มีการทำประตูรวมกันถึง 8 ลูกที่โอลด์แทรฟฟอร์ดเมื่อวันอาทิตย์ที่ผ่านมา มันกลายเป็นแมตช์คลาสสิกของพรีเมียร์ลีกในทันที แม้ว่าผลการแข่งขันนัดนี้อาจไม่ได้เป็นตัวตัดสินฤดูกาลของทั้งสองทีม แต่จะเป็นที่จดจำไปอีกนานแสนนาน", "ในความเป็นจริง นี่เป็นเพียงครั้งที่ 29 ในประวัติศาสตร์พรีเมียร์ลีกที่ทั้งสองทีมทำประตูได้ฝ่ายละ 4 ลูกในแมตช์เดียวกัน และนี่ไม่ใช่ครั้งแรกที่ แมนเชสเตอร์ ยูไนเต็ด มีส่วนร่วมในเกมที่มีสกอร์สูงเช่นนี้ เมื่อเดือนธันวาคมปีที่แล้ว 'ปีศาจแดง' ต้องแบ่งแต้มกับ บอร์นมัธ ในเกมที่จบลงด้วยการทำประตูรวม 8 ลูกเช่นกัน และในนัดสุดท้ายที่ เซอร์ อเล็กซ์ เฟอร์กูสัน คุมทีมในเดือนพฤษภาคม 2013 พวกเขาก็เสมอกับ เวสต์บรอมวิช อัลเบียน 5-5 ที่สนาม เดอะ ฮอว์ธอร์นส์", "คำถามสำคัญคือ แล้วเกมเมื่อวันอาทิตย์ที่ผ่านมาอยู่ในลำดับไหนเมื่อเทียบกับแมตช์ที่น่าจดจำอื่นๆ ที่เราเคยเห็นมาตลอดหลายปีที่ผ่านมา?", "ย้อนกลับไปในอดีต มีหลายเกมที่ส่งผลต่อการลุ้นแชมป์ เช่น เกมที่ ลิเวอร์พูล พบกับ นิวคาสเซิล ซึ่ง นิวคาสเซิล ที่เคยนำจ่าฝูงถึง 10 แต้มต้องเสียโอกาสลุ้นแชมป์ครั้งใหญ่หลังจากแพ้ในเกมสุดคลาสสิกช่วงทดเวลาบาดเจ็บที่แอนฟิลด์ ทั้งที่เคยนำถึงสองครั้ง หรือเหตุการณ์ 'Collymore closing in...'", "นอกจากนี้ยังมีเกมที่ เซร์คิโอ อเกวโร ทำประตูชัยในช่วงท้ายเกม สร เกมเยือนนัดสำคัญ แต่กลับปล่อยให้คู่แข่งกลับมาสู่เกมได้ซ้ำแล้วซ้ำเล่าจนจบลงด้วยผลเสมอในที่สุด", "สำหรับรายละเอียดเพิ่มเติมของเกมการแข่งขันนัดนี้ สามารถติดตามอ่านรายงานการแข่งขันฉบับเต็มได้ในหัวข้อ 'MATCH REPORT: Premier League - Manchester United 4-4 Aston Villa' ซึ่งได้สรุปเหตุการณ์สำคัญและจังหวะการทำประตูทั้งหมดที่เกิดขึ้นในสนามโอลด์ แทรฟฟอร์ดเอาไว้แล้ว"], "link": "https://www.bbc.co.uk/sport/football/videos/c9dr812v01lzo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/videos/c9dr812v01lzo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/d367/live/1f25a4c0-dbaa-11f1-a701-fddedf244c16.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794166764, "published_at": "2026-11-08T19:39:24Z", "published_th": "9 พ.ย. 2026 • 02:39 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802777019, "guid": "https://www.bbc.co.uk/sport/football/articles/cjx23rwxdn64o", "original_title": "Are 'outstanding' Brighton now Arsenal's main title challengers?", "thai_title": "ฟอร์มแรงเกินต้าน! ไบรท์ตันก้าวขึ้นรองจ่าฝูงพรีเมียร์ลีก กลายเป็นผู้ท้าชิงแชมป์ตัวจริงของ อาร์เซนอล หรือไม่?", "tag": "Football", "bullet_points": ["ไบรท์ตันโชว์ฟอร์มยอดเยี่ยมด้วยการชนะ 6 จาก 7 นัดหลังสุดในพรีเมียร์ลีก จนขยับขึ้นมารั้งอันดับ 2 ของตาราง", "ปาสคาล กรอสส์ กองกลางตัวเก่งปฏิเสธกระแสข่าวลือเรื่องการลุ้นแชมป์ โดยมองว่ายังเร็วเกินไปและทีมต้องโฟกัสไปทีละนัด", "สถิติชี้ชัดไบรท์ตันเป็นทีมที่มีเกมรุกดุดันที่สุดด้วยการทำประตูไปแล้ว 26 ลูก และมีเกมรับที่เหนียวแน่นด้วยการเก็บคลีนชีตได้ถึง 7 นัด", "ท่ามกลางความไม่แน่นอนของ แมนเชสเตอร์ ซิตี้ จากคดีละเมิดกฎการเงิน ไบรท์ตันถูกมองว่าเป็นทีมที่มีโอกาสก้าวขึ้นมาเป็นผู้ท้าชิงแชมป์ที่สมน้ำสมเนื้อที่สุดกับ อาร์เซนอล"], "full_paragraphs": ["น้อยคนนักในหมู่แฟนบอลไบรท์ตันที่จะคาดคิดว่าทีมรักของพวกเขาจะโชว์ฟอร์มได้อย่างน่าประทับใจขนาดนี้ในช่วง 10 นัดแรกของฤดูกาลพรีเมียร์ลีก", "ชัยชนะ 2-0 เหนือ เบรนท์ฟอร์ด ที่สนาม เอเม็กซ์ สเตเดียม เมื่อช่วงบ่ายวันอาทิตย์ที่ผ่านมา ส่งผลให้ 'นกนางนวล' ทะยานขึ้นสู่อันดับที่ 2 ของตาราง ทำให้พวกเขามุ่งหน้าเข้าสู่ช่วงพักเบรกทีมชาติเดือนพฤศจิกายนด้วยความหวังถึงสิ่งที่อาจเกิดขึ้นในช่วงที่เหลือของฤดูกาล", "ชัยชนะนัดที่ 6 จากการลงเล่น 7 นัดหลังสุดในพรีเมียร์ลีกเพียงพอที่จะทำให้พวกเขาแซงหน้า แมนเชสเตอร์ ซิตี้ ซึ่งเพิ่งพ่ายแพ้อย่างช็อกต่อ นอตทิงแฮม ฟอเรสต์ 3-1 เมื่อไม่ถึง 24 ชั่วโมงก่อนหน้านั้น และเป็นการตอกย้ำสถานะของพวกเขาในฐานะผู้ท้าชิงที่ใกล้เคียงที่สุดของจ่าฝูงอย่าง อาร์เซนอล", "ด้วยช่องว่าง 5 คะแนนที่ตามหลัง 'ปืนใหญ่' ทำให้สถานการณ์ในตอนนี้เป็นเช่นนั้นจริง แม้ว่า ปาสคาล กรอสส์ กองกลางคนสำคัญของไบรท์ตันจะยังไม่อยากพูดถึงเรื่องนี้ในช่วงเวลานี้ก็ตาม", "\"ไม่ เราไม่ได้อยู่ในเส้นทางการลุ้นแชมป์\" นักเตะวัย 35 ปีกล่าวกับ สกาย สปอร์ตส์ หลังจบเกมเมื่อวันอาทิตย์ \"แต่เราเริ่มต้นฤดูกาลได้ดีจริงๆ นี่เป็นเพียงช่วงต้นฤดูกาลเท่านั้น คุณเห็นพรีเมียร์ลีกแล้ว ช่องว่างคะแนนและผลการแข่งขันต่างๆ เรายังไม่หลงระเริงไปกับมัน ทุกเกมเราต้องเหนื่อยอย่างหนัก บางครั้งมันเป็นเรื่องของโมเมนตัม แต่เราดีใจมากที่ได้เข้าสู่ช่วงพักเบรกทีมชาติด้วยผลงานแบบนี้\"", "อย่างไรก็ตาม 10 ปีให้หลังจากที่ เลสเตอร์ ซิตี้ สร้างปาฏิหาริย์คว้าแชมป์ลีกได้สำเร็จ พวกเขาจะสามารถทำในสิ่งที่ดูเหมือนเป็นไปไม่ได้ให้เป็นจริงได้หรือไม่?", "ในทุกสัปดาห์ที่ผ่านไป การจะมองข้ามศักยภาพของไบรท์ตันนั้นเริ่มทำได้ยากขึ้นเรื่อยๆ ด้วยการชนะ 7 จาก 10 นัดแรกในพรีเมียร์ลีก รวมถึงการเอาชนะทั้ง อาร์เซนอล และ แมนเชสเตอร์ ซิตี้ มาแล้ว ทำให้ 'นกนางนวล' แสดงให้เห็นถึงทั้งคุณภาพและคาแรกเตอร์ของทีม", "ไม่ใช่แค่ตำแหน่งในตารางคะแนนเท่านั้นที่น่าประทับใจ แต่ตัวเลขสถิติเชิงลึกเกือบทั้งหมดชี้ให้เห็นว่านี่คือทีมที่มีศักยภาพเพียงพอที่จะรักษาฟอร์มการเล่นในช่วงต้นฤดูกาลนี้เอาไว้ได้ ไบรท์ตันสร้างโอกาสทอง (Big chances) ได้มากที่สุดเป็นอันดับ 2 ของลีก (37 ครั้ง) และทำประตูได้มากที่สุด (26 ประตู) มากกว่าทุกทีมในฤดูกาลนี้", "เกมรุกส่วนใหญ่ขับเคลื่อนโดย กรอสส์ ผู้ซึ่งย้ายกลับมาร่วมทีมจาก โบรุสเซีย ดอร์ทมุนด์ ในเดือนมกราคม หลังจากเคยอำลาทีมไปในปี 2024 กองกลางชาวเยอรมันรายนี้ใช้เวลา 7 ปีครึ่งที่ เอเม็กซ์ สเตเดียม ตลอดการร่วมทีมสองช่วง และได้สถาปนาตัวเองเป็นหัวใจสำคัญในการสร้างสรรค์เกมของไบรท์ตันในฤดูกาลนี้อีกครั้ง", "กรอสส์ สร้างโอกาสทองในพรีเมียร์ลีกไปแล้ว 8 ครั้ง ซึ่งมากกว่าผู้เล่นคนอื่นๆ นอกจากจะทำประตูได้ในเกมกับ เบรนท์ฟอร์ด แล้ว เขายังสร้างโอกาสให้เพื่อนร่วมทีมได้อีกอย่างน้อย 5 ครั้งในเกมดังกล่าว ซึ่งนับเป็นครั้งที่ 27 แล้วนับตั้งแต่เริ่มต้นฤดูกาล 2017-18 ที่กรอสส์สร้างโอกาสได้ 5 ครั้งขึ้นไปในเกมเดียว โดยมีเพียง เควิน เดอ บรอยน์ (48 ครั้ง) และ บรูโน แฟร์นันด์ส (47 ครั้ง) เท่านั้นที่ทำได้มากกว่าเขา", "เขาเคยยอมรับเมื่อต้นสัปดาห์นี้ว่า: \"ผมแค่ทำหน้าที่ของผมต่อไป ผมคิดว่าผมฟิต ผมพยายามเตรียมตัวให้ดีที่สุดเท่าที่จะทำได้ และพยายามช่วยให้ทีมชนะในแต่ละเกม\"", "ในส่วนของเกมรับ มีเพียง อาร์เซนอล จ่าฝูงและแชมป์เก่าเท่านั้นที่ทำผลงานได้ดีกว่าไบรท์ตัน โดยไบรท์ตันสามารถเก็บคลีนชีตได้มากที่สุด (7 นัด) และเสียประตูน้อยที่สุดเป็นอันดับ 2 ของลีก (5 ประตู)", "\"จากวิธีการเล่นของพวกเขาในตอนนี้ การผ่านเข้าไปเล่น ยูฟ่า แชมเปียนส์ลีก น่าจะเป็นเป้าหมายขั้นต่ำที่คุณคาดหวังให้ไบรท์ตันทำได้\" ลีออน ออสแมน อดีตกองกลาง เอฟเวอร์ตัน กล่าวกับ บีบีซี สปอร์ต \"พวกเขาดูเหมือนทีมที่พัฒนาขึ้นอย่างก้าวกระโดดในช่วง 18 เดือนที่ผ่านมา ฟุตบอลที่พวกเขาเล่นนั้นยอดเยี่ยมมากและเป็นทีมที่น่าดูชมจริงๆ พวกเขาจะคว้าแชมป์ลีกได้ไหม? ผมคิดว่ามันคงเป็นเรื่องที่เหนือความคาดหมาย แต่ผมคาดหวังว่าพวกเขาจะคว้าแชมป์รายการใดรายการหนึ่งในปีนี้ ไม่ว่าจะเป็นถ้วยในประเทศอย่าง เอฟเอ คัพ หรือ คอนเฟอเรนซ์ ลีก\"", "ไบรท์ตันยังได้รับข่าวดีอีกประการเมื่อ ยันคูบา มินเทห์ ได้ลงประเดิมสนามในพรีเมียร์ลีกฤดูกาลนี้ในเกมพบกับ เบรนท์ฟอร์ด กองหน้าชาวแกมเบียรายนี้ ซึ่งเคยตกเป็นเป้าหมายการยื่นข้อเสนอที่ไม่สำเร็จจาก ลิเวอร์พูล ในช่วงซัมเมอร์ กลายเป็นหนึ่งในผู้เล่นเกมรุกที่อันตรายที่สุดนับตั้งแต่ย้ายมาจาก นิวคาสเซิล ยูไนเต็ด ในปี 2024 และคาดว่าการกลับมาฟิตสมบูรณ์ของ มินเทห์ จะตามมาด้วยการกลับมาของ คาโอรุ มิโตมะ ที่ต้องพักรักษาตัวจากอาการบาดเจ็บเอ็นหลังหัวเข่ามาตั้งแต่เดือนพฤษภาคม", "มีความรู้สึกว่านี่อาจเป็นโอกาสที่ทีมจะคว้าไว้ได้ในการลุ้นแชมป์ฤดูกาลนี้ แม้ว่า อาร์เซนอล จะชนะ 9 จาก 10 นัดแรก แต่พวกเขาก็อาจไม่ได้ดูน่าเกรงขามเท่ากับฤดูกาลที่ผ่านมา และเคยพ่ายแพ้ให้กับไบรท์ตัน 3-0 ในเดือนกันยายน", "ในขณะเดียวกัน แมนเชสเตอร์ ซิตี้ ก็ร่วงหล่นลงไปอีกหลังจากพ่ายแพ้ในลีก 3 นัดติดต่อกันเมื่อเย็นวันเสาร์ที่ผ่านมา แต่ถึงแม้ทีมของ เอ็นโซ มาเรสกา จะกลับมาคืนฟอร์มได้หลังช่วงพักเบรกทีมชาติ และมีคิวไปเยือน อาร์เซนอล ในวันที่ 29 พฤศจิกายน ก็ยังคงมีความไม่แน่นอนอย่างมากว่าฤดูกาลของพวกเขาจะเป็นอย่างไรต่อไปหลังจากเผชิญกับข้อหาละเมิดกฎการเงิน", "ซิตี้ถูกคณะกรรมการอิสระตัดสินว่ามีความผิดจริงในการละเมิดกฎการเงินของพรีเมียร์ลีก 114 กระทงเมื่อต้นปีที่ผ่านมา หลังจากถูกตั้งข้อหาโดยลีกเป็นเวลา 3 ปีครึ่ง สโมสรได้ใช้สิทธิ์ในการอุทธรณ์คำตัดสินและปฏิเสธข้อกล่าวหาทั้งหมดอย่างหนักแน่น อย่างไรก็ตาม หากการอุทธรณ์ไม่เป็นผล ซิตี้อาจเผชิญกับการถูกตัดคะแนนอย่างหนัก หรือในกรณีที่เลวร้ายที่สุดคือการถูกขับออกจากพรีเมียร์ลีก", "หากเหตุการณ์นั้นเกิดขึ้น ไบรท์ตันจะกลายเป็นผู้ท้าชิงแชมป์ที่สมจริงที่สุดของ อาร์เซนอล ตามอันดับคะแนนในปัจจุบัน ส่วนอันดับ 4 และ 5 อย่าง ลิเวอร์พูล และ เชลซี ซึ่งเป็นเพียงสองทีมที่เอาชนะไบรท์ตันได้ในลีกฤดูกาลนี้ ดูเหมือนจะยังอยู่ในช่วงเปลี่ยนผ่านและยังห่างไกลจากฟอร์มที่จำเป็นในการก้าวขึ้นมาลุ้นแชมป์", "ออสแมน เชื่อว่านี่เป็นโอกาสที่สมบูรณ์แบบสำหรับไบรท์ตันในการฉกฉวยความได้เปรียบ โดยกล่าวเสริมว่า: \"พวกเขาใช้เวลาในการสร้างทีมนี้ขึ้นมา ยอมปล่อยให้นักเตะที่ดีที่สุดบางคนย้ายออกไปและสร้างทีมขึ้นมาใหม่ทั้งหมด ตอนนี้พวกเขาดูเหมือนจะมาถึงจุดที่สามารถรักษานักเตะที่ดีที่สุดเอาไว้ได้แล้ว พวกเขาอยู่ในตำแหน่งที่ยอดเยี่ยม ซึ่งถึงเวลาแล้วที่จะต้องรีดศักยภาพทั้งหมดนี้ออกมาเพื่อความสำเร็จของตัวเอง เพื่อประโยชน์ของสโมสรและแฟนบอล แทนที่จะเป็นเพียงผลกำไรทางการเงินจากการขายนักเตะออกไปในราคาแพง\""], "link": "https://www.bbc.co.uk/sport/football/articles/cjx23rwxdn64o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cjx23rwxdn64o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8de0/live/2f31e2f0-db93-11f1-9029-d35c55297624.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c313/live/d6c3a350-db9d-11f1-81e8-61c133a2b43c.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f197/live/2b2162c0-db9e-11f1-81e8-61c133a2b43c.jpg", "https://ichef.b นเพื่อหาตัวตนของทีมให้เจอ หลังจากบุกไปพ่ายให้กับ ซันเดอร์แลนด์ 1-0", "เริ่มมีความรู้สึกว่ากุนซือชาวสเปนรายนี้กำลังกลายเป็น 'ทิงเกอร์แมน' (จอมปรับเปลี่ยน) คนล่าสุดในถิ่นสแตมฟอร์ด บริดจ์ ซึ่งเป็นฉายาที่เคยถูกใช้เรียก เคลาดิโอ รานิเอรี อดีตผู้จัดการทีม 'สิงห์บลูส์' มาแล้วในช่วงฤดูกาล 2002-03", "ในเกมนี้ เชลซีจัดทัพด้วยกองกลาง 3 คนเป็นครั้งแรกในฤดูกาลนี้ แต่พวกเขาก็ยังไม่มีกองหน้าอาชีพลงสนามเป็นนัดที่สองติดต่อกัน โดย เปโดร เนโต้ ยังคงต้องรับหน้าที่ยืนเป็นหัวหอกในเกมที่พ่ายแพ้ที่สเตเดียม ออฟ ไลท์", "ในทางกลับกัน ซันเดอร์แลนด์ที่กำลังดิ้นรนหนีตายได้ ไบรอัน บร็อบบีย์ กองหน้าตัวเป้าเป็นผู้นำทัพ ซึ่งเขาสามารถเรียกจุดโทษได้ในนาทีที่ 36 หลังจากถูก เลวี่ โคลวิลล์ ทำฟาวล์ ก่อนที่ เอ็นโซ เลอ ฟี จะสังหารจุดโทษเข้าไปเป็นประตูชัยเพียงประตูเดียวในเกมนี้", "จังหวะดังกล่าวเกิดขึ้นเพียงไม่กี่อึดใจหลังจากที่เชลซีพลาดโอกาสได้จุดโทษ เมื่อ โคล พาลเมอร์ ล้มลงจากการเข้าปะทะของ ลุค โอเนียน แต่ผู้ตัดสินวีเออาร์ (VAR) ตัดสินว่าการปะทะเริ่มต้นขึ้นนอกกรอบเขตโทษ", "เหตุการณ์ทั้งสองครั้งที่เกิดขึ้นต่อเนื่องกันทำให้ อลอนโซ และทีมงานสต๊าฟฟ์โค้ชแสดงอาการไม่พอใจอย่างมากที่ข้างสนามหลังจากที่ซันเดอร์แลนด์ได้ประตู อย่างไรก็ตาม กุนซือเชลซีปฏิเสธที่จะวิจารณ์การตัดสินของกรรมการหลังจบเกม โดยเขาเลือกที่จะตอบคำถามสั้นๆ และเบี่ยงเบนประเด็นไปที่การตำหนิลูกทีมของเขาที่ไม่สามารถปฏิบัติตามแผนการเล่นที่วางไว้ได้อย่างถูกต้อง", "เมื่อถูกถามว่า บร็อบบีย์ เป็นนักเตะที่หยุดไม่อยู่ใช่หรือไม่ อลอนโซในวัย 44 ปี ตอบว่า: \"ไม่ เขาหยุดได้ เขาหยุดได้ แต่เราต้องทำได้ดีกว่าที่เราทำในวันนี้\"", "\"จากจังหวะที่เกือบจะไม่มีอะไร เขากลับสร้างโอกาสได้สองสามครั้ง และเขาก็เรียกจุดโทษได้ด้วย ผมไม่มีความสุขกับวิธีที่เราป้องกันในสถานการณ์นั้น มันเป็นสิ่งที่เราสามารถหลีกเลี่ยงได้ เป็นสิ่งที่เราได้ฝึกซ้อมกันมาตลอดทั้งสัปดาห์ การเสียจุดโทษไม่ใช่เรื่องดีสำหรับเราเลย\"", "ความพ่ายแพ้นี้ทำให้ เลวี่ โคลวิลล์ ไม่มีที่ให้หลบซ่อน โดยเขาถูกเปลี่ยนตัวออกในช่วงพักครึ่ง และเป็น มอยเซส ไกเซโด้ ที่ต้องลงมาเล่นในตำแหน่งเซ็นเตอร์แบ็กแทน แม้ว่าเขาจะแทบไม่ได้ซ้อมเต็มรูปแบบตลอดทั้งสัปดาห์และต้องการการดูแลเรื่องสภาพร่างกายอย่างใกล้ชิดก็ตาม", "เชลซีสร้างโอกาสทำประตูได้น้อยมาก นอกเหนือจากจังหวะโหม่งของ มอร์แกน โรเจอร์ส นักเตะค่าตัว 117 ล้านปอนด์ที่พลาดไป ส่วน โคล พาลเมอร์ ก็โชว์ฟอร์มไม่ออกเช่นกัน หลังจากเพิ่งถูกตัดชื่อออกจากทีมชาติอังกฤษเมื่อไม่กี่วันก่อน", "ก่อนเริ่มฤดูกาล อลอนโซเคยกล่าวว่าเขาต้องการให้เชลซีเป็นทีมที่ 'คาดเดาไม่ได้' แม้ว่าปัจจัยอย่างอาการบาดเจ็บจะเป็นสิ่งที่เขาควบคุมไม่ได้ แต่ทีมของเขาก็ทำได้ตามนั้นจริง ทว่ามันกลับส่งผลเสียต่อตัวพวกเขาเอง", "เชลซีเก็บชัยชนะได้ 5 นัด เสมอ 1 และแพ้ 4 จากการลงสนาม 10 นัดในพรีเมียร์ลีกภายใต้การคุมทีมของ ชาบี อลอนโซ โดยมีเพียง ท็อตแนม ฮ็อตสเปอร์ (28 ครั้ง) เท่านั้นที่มีการปรับเปลี่ยนไลน์อัพมากกว่าเชลซี (24 ครั้ง) ในฤดูกาลนี้", "ในช่วงต้นฤดูกาล พวกเขายังพอมีแนวรุกที่ลงตัวและน่าตื่นเต้นอย่าง เจา เปโดร, โรเจอร์ส และ พาลเมอร์ ซึ่งเป็นเหตุผลหลักที่ทำให้ทีมเริ่มต้นฤดูกาลได้อย่างยอดเยี่ยม แม้ว่าจะไม่สามารถเก็บคลีนชีตได้เลยจนกระทั่งถึงเกมที่ 8 ของอลอนโซ", "ด้วยอาการบาดเจ็บของ ไกเซโด้ ทำให้ทีมมีปัญหาในแดนกลางและต้องปรับเปลี่ยนผู้เล่นไปเรื่อยๆ ในแต่ละนัด รวมถึงการทดลองใช้ผู้เล่นในตำแหน่งต่างๆ เพื่อแก้ปัญหาในแนวรับ อย่างไรก็ตาม พวกเขาดูเหมือนจะพยายามปรับใช้ระบบหลังสามที่ อลอนโซ เคยประสบความสำเร็จอย่างสูงกับ ไบเออร์ เลเวอร์คูเซ่น ในฤดูกาล 2023-24", "เมื่อ ไกเซโด้ กลับมาหลังช่วงพักเบรกทีมชาติ กัปตันทีมอย่าง รีซ เจมส์ กลับได้รับบาดเจ็บ เจา เปโดร ที่ทำผลงานได้ดีในเกมชนะ บอร์นมัธ และ เอฟเวอร์ตัน ก็มาได้รับบาดเจ็บที่ต้นขาหลังจากพลาดการรับใช้ทีมชาติบราซิลไปก่อนหน้านี้", "เอมิเลียโน มาร์ติเนซ ผู้รักษาประตูมือหนึ่งกระดูกกรามแตกจากการปะทะในเกมกับ เอฟเวอร์ตัน ในขณะที่ มักซองซ์ ลาครัวซ์ ซึ่งเป็นตัวหลักมาโดยตลอดนับตั้งแต่ย้ายมาจาก คริสตัล พาเลซ ในช่วงซัมเมอร์ คาดว่าจะต้องพักยาวจนถึงเดือนมกราคมด้วยอาการบาดเจ็บที่เอ็นหลังหัวเข่า นอกจากนี้ จอร์เรล ฮาโต้ กองหลังของทีมก็ได้รับบาดเจ็บในช่วงไม่กี่สัปดาห์ที่ผ่านมาเช่นกัน", "สถานการณ์เหล่านี้ทำให้ อลอนโซ ต้องแก้ปัญหาเฉพาะหน้าในการจัดทัพ โดยกุนซือชาวสเปนกล่าวว่า: \"มันมีสถานการณ์ต่างๆ เกิดขึ้น เมื่อวานนี้ จอช [อาเชียมปง] บอกว่าเขาไม่พร้อมลงเล่น ดังนั้นเราจึงมีตัวเลือกจำกัดและเราต้องก้าวผ่านจุดนี้ไปให้ได้\"", "\"ไม่ว่าเราจะชนะหรือแพ้ เราก็ยังขาดผู้เล่นบางคนที่บาดเจ
