  <script>
    let allNews = [{"id": 1794553392984, "original_title": "Liverpool and Van Dijk have a decision to make", "thai_title": "อนาคตของ เวอร์จิล ฟาน ไดจ์ค กับ ลิเวอร์พูล: การตัดสินใจครั้งสำคัญที่กำลังจะมาถึง", "tag": "Football", "bullet_points": ["สัญญาฉบับปัจจุบันของ เวอร์จิล ฟาน ไดจ์ค กัปตันทีมลิเวอร์พูล กำลังจะหมดลงในช่วงซัมเมอร์หน้า", "ฟาน ไดจ์ค ยืนยันว่ายังไม่รีบร้อนเรื่องการต่อสัญญาและพร้อมพิจารณาทุกความเป็นไปได้เมื่อจบฤดูกาล", "ผลงานในสนามของ ฟาน ไดจ์ค ยังคงอยู่ในระดับสูง โดยลงเล่นทุกนาทีในพรีเมียร์ลีกนับตั้งแต่เริ่มต้นฤดูกาลที่แล้ว"], "full_paragraphs": ["เวอร์จิล ฟาน ไดจ์ค กองหลังกัปตันทีมลิเวอร์พูล กำลังเผชิญกับช่วงเวลาสำคัญในการตัดสินใจเกี่ยวกับอนาคตของตนเองกับสโมสร เนื่องจากสัญญาฉบับปัจจุบันกำลังจะสิ้นสุดลงในช่วงซัมเมอร์หน้า แม้ว่าเขาจะได้รับการยกย่องให้เป็นหนึ่งในเซ็นเตอร์ฮาล์ฟที่ดีที่สุดในประวัติศาสตร์ของสโมสรเคียงคู่กับ อลัน แฮนเซน แต่คำถามสำคัญในขณะนี้คือเขาจะเลือกปิดฉากอาชีพการค้าแข้งที่แอนฟิลด์เหมือนกับตำนานรุ่นพี่หรือไม่", "ในฤดูกาลนี้ ฟาน ไดจ์ค ยังคงรักษามาตรฐานการเล่นได้อย่างยอดเยี่ยม โดยมีสถิติลงเล่นครบทุกนาทีในพรีเมียร์ลีกนับตั้งแต่เริ่มต้นฤดูกาลที่แล้ว และกำลังสร้างความร่วมมือในแนวรับกับ เจเรมี จาเกต์ กองหลังรายใหม่ที่ย้ายเข้ามาในช่วงซัมเมอร์ แม้จะมีอาการบาดเจ็บรบกวนเล็กน้อยจนต้องถอนตัวจากทีมชาติเนเธอร์แลนด์ในช่วงเบรกทีมชาติล่าสุด แต่สถานการณ์ดังกล่าวไม่ได้เป็นที่น่ากังวลแต่อย่างใด", "ฟาน ไดจ์ค ได้ให้สัมภาษณ์กับผู้สื่อข่าวที่สนามเซลเฮิร์สต์พาร์กเกี่ยวกับสถานการณ์สัญญาของเขาว่า 'เราต้องรอดูกันว่าฤดูกาลนี้จะนำพาอะไรมาให้ ผมมีช่วงเวลาที่ยอดเยี่ยมมาโดยตลอด หากมีการขยายสัญญาออกไปก็เป็นเรื่องที่ดี แต่หากไม่เป็นเช่นนั้น ผมก็จะย้ายไปที่อื่น' ซึ่งสะท้อนให้เห็นถึงความใจเย็นของนักเตะเช่นเดียวกับเหตุการณ์ที่เคยเกิดขึ้นเมื่อสองปีก่อน ก่อนที่เขาจะตัดสินใจเซ็นสัญญาฉบับใหม่ในเวลาต่อมา", "นอกเหนือจากบทบาทในสนามแล้ว ฟาน ไดจ์ค ยังคงเป็นผู้นำคนสำคัญของทีมลิเวอร์พูล โดยเขามีส่วนสำคัญในการสร้างวัฒนธรรมองค์กร เช่น การเสนอให้เพื่อนร่วมทีมไปเยี่ยมชมพิพิธภัณฑ์ของสโมสรเพื่อเรียนรู้ประวัติศาสตร์ของลิเวอร์พูล ทั้งนี้ ทั้งตัวนักเตะและสโมสรต่างมีหน้าที่ต้องตัดสินใจครั้งสำคัญร่วมกันในอนาคตอันใกล้นี้ เพื่อกำหนดทิศทางของทั้งสองฝ่ายต่อไป"], "link": "https://www.bbc.co.uk/sport/football/articles/ck4gnd2pgd06o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/87f4/live/e4ed5c50-ddeb-11f1-9204-cdcddf7d901c.jpg", "published_at": "2026-11-12 23:57 UTC", "category_hint": "Football"}, {"id": 1794553392985, "original_title": "Leader, role model, extraordinary - how Kane's 'fairytale' came true", "thai_title": "แฮร์รี เคน สร้างประวัติศาสตร์ลงเล่นให้ทีมชาติอังกฤษสูงสุดตลอดกาล", "tag": "Football", "bullet_points": ["แฮร์รี เคน ทำสถิติลงเล่นให้ทีมชาติอังกฤษสูงสุดตลอดกาลที่ 126 นัด แซงหน้าสถิติเดิมของ ปีเตอร์ ชิลตัน", "เคนทำประตูที่ 92 ในนามทีมชาติจากลูกจุดโทษในเกมที่เอาชนะโครเอเชีย 2-1 ในศึกเนชันส์ลีก", "เส้นทางในทีมชาติของเคนเริ่มต้นขึ้นในปี 2015 โดยทำประตูได้ตั้งแต่นาทีแรกที่ลงประเดิมสนาม"], "full_paragraphs": ["แฮร์รี เคน กองหน้าวัย 33 ปี สร้างประวัติศาสตร์หน้าใหม่ให้กับทีมชาติอังกฤษด้วยการลงสนามเป็นนัดที่ 126 ในเกมเนชันส์ลีกที่พบกับโครเอเชีย ณ สนามเวมบลีย์ เมื่อวันพฤหัสบดีที่ผ่านมา ส่งผลให้เขากลายเป็นนักเตะชายที่ลงเล่นให้ทัพ 'สิงโตคำราม' มากที่สุดตลอดกาล ทำลายสถิติเดิมของ ปีเตอร์ ชิลตัน อดีตผู้รักษาประตูระดับตำนานที่เคยทำไว้ 125 นัด ในช่วงปี 1970 ถึง 1990", "ก่อนเริ่มการแข่งขัน ปีเตอร์ ชิลตัน ได้เข้าร่วมพิธีมอบเสื้อทีมชาติอังกฤษแบบพิเศษเพื่อเป็นเกียรติแก่เคน โดยในเกมดังกล่าว เคนยังคงรักษามาตรฐานการทำประตูด้วยการยิงจุดโทษช่วยให้ทีมเอาชนะโครเอเชียไปได้ 2-1 ซึ่งนับเป็นประตูที่ 92 ของเขาในนามทีมชาติ โดยย้อนกลับไปเมื่อปี 2015 รอย ฮอดจ์สัน อดีตผู้จัดการทีมชาติอังกฤษเคยกล่าวชื่นชมเคนตั้งแต่นัดประเดิมสนามที่เจ้าตัวใช้เวลาเพียง 79 วินาทีในการทำประตูแรกในฐานะนักเตะทีมชาติชุดใหญ่", "เคนได้กล่าวถึงความสำเร็จครั้งนี้ว่า ตนเองให้ความสำคัญกับผลงานของทีมมากกว่าสถิติส่วนตัว และมีความมุ่งมั่นเสมอในการเข้าแคมป์เก็บตัวรวมถึงการลงเล่นทุกนัดเพื่อเป็นตัวแทนของประเทศให้ดีที่สุด ตลอดระยะเวลาที่ผ่านมา เคนผ่านประสบการณ์ทั้งสุขและเศร้ากับทีมชาติ ทั้งความผิดหวังจากการพลาดจุดโทษในฟุตบอลโลก 2022 รอบก่อนรองชนะเลิศที่พ่ายต่อฝรั่งเศส ไปจนถึงช่วงเวลาที่น่าจดจำอย่างการร่วมฉลองชัยชนะกับแฟนบอลในฟุตบอลโลกช่วงฤดูร้อนที่ผ่านมา", "จากเด็กหนุ่มที่เติบโตในย่านชิงฟอร์ดสู่การเป็นกัปตันทีมชาติและเจ้าของสถิติดาวซัลโวสูงสุดตลอดกาลของอังกฤษ เส้นทางของเคนถือเป็นบทพิสูจน์ถึงความเป็นมืออาชีพและความทุ่มเทที่มีต่อทีมชาติมาอย่างยาวนานกว่า 11 ปี โดยสถิติการลงเล่นและจำนวนประตูที่เพิ่มขึ้นอย่างต่อเนื่องนี้ ตอกย้ำถึงสถานะของเขาในฐานะผู้นำและแบบอย่างของนักฟุตบอลในยุคปัจจุบัน"], "link": "https://www.bbc.co.uk/sport/football/articles/c60qkdj4lp34o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/f61b/live/a5f54890-ded2-11f1-86d5-71a9f29d1c99.jpg", "published_at": "2026-11-12 12:53 UTC", "category_hint": "Football"}, {"id": 1794553392986, "original_title": "Goodwillie prosecutors 'wrong' not to put footballer on trial for rape, court hears", "thai_title": "ทนายความผู้เสียหายยื่นฟ้องต่อศาลอุทธรณ์คดีอาญา กรณีอัยการไม่สั่งฟ้อง David Goodwillie คดีข่มขืน", "tag": "Football", "bullet_points": ["ทนายความของ Denise Clair ยื่นคำร้องต่อศาลอุทธรณ์คดีอาญาในเอดินบะระ เพื่อขออนุญาตดำเนินคดีแบบส่วนตัว (Private Prosecution) ต่อ David Goodwillie", "คดีนี้สืบเนื่องจากเหตุการณ์ในปี 2011 ซึ่งศาลแพ่งเคยตัดสินในปี 2017 ว่า Goodwillie และ David Robertson ได้ทำการข่มขืนผู้เสียหายจริง", "ฝ่ายโจทก์โต้แย้งว่าอัยการตัดสินใจผิดพลาดที่สั่งไม่ฟ้องคดีอาญา โดยอ้างว่ามีหลักฐานเพียงพอที่จะนำไปสู่การตัดสินลงโทษได้"], "full_paragraphs": ["ทนายความของ Denise Clair ผู้เสียหายจากเหตุการณ์ที่เกี่ยวข้องกับ David Goodwillie อดีตนักฟุตบอลทีมชาติสกอตแลนด์ ได้ยื่นคำร้องต่อศาลอุทธรณ์คดีอาญาในเมืองเอดินบะระ เพื่อขออนุญาตดำเนินคดีแบบส่วนตัว (Private Prosecution) หลังจากที่สำนักงานอัยการ (Crown Office) ตัดสินใจไม่สั่งฟ้องคดีอาญาในอดีตโดยอ้างว่ามีหลักฐานไม่เพียงพอ", "เหตุการณ์ดังกล่าวเกิดขึ้นในเดือนมกราคม ปี 2011 ที่อพาร์ตเมนต์แห่งหนึ่งใน Armadale เขต West Lothian โดยมี David Goodwillie และ David Robertson เพื่อนร่วมทีม Dundee United ในขณะนั้นเป็นผู้ถูกกล่าวหา ต่อมาในปี 2017 ศาลแพ่งได้มีคำตัดสินว่าทั้งสองคนได้ทำการข่มขืนผู้เสียหายจริง อย่างไรก็ตาม ฝ่ายอัยการยังคงยืนยันว่าการตัดสินใจไม่สั่งฟ้องในขณะนั้นมีความถูกต้องตามกระบวนการพิจารณาหลักฐานที่มีอยู่ทั้งหมด", "Thomas Ross KC ทนายความของผู้เสียหายกล่าวต่อหน้าคณะผู้พิพากษาว่า การตัดสินใจของอัยการถือเป็นเรื่องที่ไม่มีเหตุผลรองรับ (Irrational) โดยระบุว่ามีหลักฐานเพียงพอที่จะดำเนินคดีและมีโอกาสสูงที่จะได้รับคำตัดสินว่ามีความผิด นอกจากนี้ Ross ยังตั้งข้อสังเกตว่าสำนักงานอัยการต้องพิจารณารายงานคดีอาญาจำนวน 150,000 ถึง 200,000 คดีต่อปี ซึ่งอาจนำไปสู่ความผิดพลาดในการคัดเลือกคดีเพื่อดำเนินคดีอาญาได้", "ในขณะที่ Alan Cameron KC ตัวแทนจากฝั่งอัยการได้โต้แย้งต่อศาลว่า การตัดสินใจของอัยการในขณะนั้นมีความเหมาะสมและถูกต้องตามหลักการแล้ว โดยยืนยันว่าเมื่อพิจารณาจากพยานหลักฐานทั้งหมดที่มีในขณะนั้น อัยการมีสิทธิ์โดยชอบธรรมที่จะไม่นำคดีนี้เข้าสู่กระบวนการพิจารณาในศาลอาญา ซึ่งในขณะนี้ศาลกำลังพิจารณาคำร้องเพื่อตัดสินว่าจะอนุญาตให้มีการดำเนินคดีแบบส่วนตัวต่อไปหรือไม่"], "link": "https://www.bbc.co.uk/news/articles/c6z9dppxxyxpo?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_news/1200/cpsprodpb/624c/live/20082b60-deb1-11f1-8fb5-a771a656a227.jpg", "published_at": "2026-11-12 10:31 UTC", "category_hint": "Football"}, {"id": 1794553392987, "original_title": "Crystal Palace sack boss Sage after 16 games", "thai_title": "คริสตัล พาเลซ ประกาศปลด ปิแอร์ เซจ พ้นตำแหน่งผู้จัดการทีมหลังคุมทัพได้เพียง 16 นัด", "tag": "Football", "bullet_points": ["คริสตัล พาเลซ ปลด ปิแอร์ เซจ ออกจากตำแหน่งผู้จัดการทีม หลังทำผลงานได้เพียง 16 นัดในระยะเวลา 5 เดือน", "สโมสรปัจจุบันรั้งอันดับสุดท้ายของตารางคะแนนพรีเมียร์ลีก โดยแพ้ติดต่อกันมา 4 นัดและเสียประตูไปแล้ว 24 ลูก", "โธมัส แฟรงค์ อดีตผู้จัดการทีมเบรนท์ฟอร์ดและท็อตแนม ฮอตสเปอร์ กำลังอยู่ในขั้นตอนการเจรจาเพื่อเข้ามารับตำแหน่งแทน", "ปิแอร์ เซจ เป็นผู้จัดการทีมรายที่สองในพรีเมียร์ลีกที่ถูกปลดในฤดูกาลนี้ ต่อจาก ไมเคิล คาร์ริค ของแมนเชสเตอร์ ยูไนเต็ด"], "full_paragraphs": ["สโมสรคริสตัล พาเลซ ตัดสินใจแยกทางกับ ปิแอร์ เซจ ผู้จัดการทีมชาวฝรั่งเศสอย่างเป็นทางการ หลังเข้ามารับตำแหน่งได้เพียง 5 เดือน โดยผลงานล่าสุดคือการพ่ายแพ้ต่อลิเวอร์พูล 3-1 เมื่อวันอาทิตย์ที่ผ่านมา ซึ่งถือเป็นความพ่ายแพ้ในพรีเมียร์ลีกนัดที่ 4 ติดต่อกัน ส่งผลให้ทีมหล่นไปอยู่อันดับสุดท้ายของตารางคะแนน", "สถิติของทีมภายใต้การคุมทัพของ เซจ ในฤดูกาลนี้ถือว่าน่ากังวล โดยทีมชนะเพียง 2 นัดจากการลงเล่น 10 นัดแรกในลีก นอกจากนี้ยังมีสถิติเกมรับที่แย่ที่สุดในลีกด้วยการเสียไปถึง 24 ประตู ส่วนในรายการยูโรปาลีก คริสตัล พาเลซ รั้งอันดับที่ 21 จากทั้งหมด 36 ทีม โดยเก็บชัยชนะได้เพียงนัดเดียวจากการลงสนาม 4 นัด", "นอกจากการปลด ปิแอร์ เซจ แล้ว สโมสรยังได้ประกาศแยกทางกับทีมงานสตาฟฟ์โค้ชอีก 3 ราย ได้แก่ จามาล อาลีอุย, เดเมียน เดลลา ซานตา และ แซนดี้ กีชาร์ด โดยทางสโมสรได้ออกแถลงการณ์ขอบคุณทีมงานทุกคนสำหรับความทุ่มเทในช่วงเวลาที่ผ่านมา และขอให้ทุกคนโชคดีกับเส้นทางในอนาคต", "สำหรับกระบวนการสรรหาผู้จัดการทีมคนใหม่ สโมสรระบุว่าจะมีการแจ้งความคืบหน้าให้ทราบในลำดับถัดไป โดยในขณะนี้ โธมัส แฟรงค์ อดีตผู้จัดการทีมเบรนท์ฟอร์ดและท็อตแนม ฮอตสเปอร์ ตกเป็นข่าวว่ากำลังอยู่ในขั้นตอนการเจรจาขั้นสูงเพื่อเข้ามารับงานต่อ ทั้งนี้ ปิแอร์ เซจ วัย 47 ปี ได้รับการแต่งตั้งเข้ามาคุมทีมด้วยสัญญา 3 ปีเมื่อเดือนมิถุนายนที่ผ่านมา แทนที่ โอลิเวอร์ กลาสเนอร์ ที่อำลาทีมไปหลังจบฤดูกาลก่อน"], "link": "https://www.bbc.co.uk/sport/football/articles/cv5y18lkk87do?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/73af/live/be720480-de96-11f1-9afe-1f03bfe02283.jpg", "published_at": "2026-11-12 10:15 UTC", "category_hint": "Football"}, {"id": 1794553392988, "original_title": "Owono undecided over future following De Miguel death", "thai_title": "โอโวโน ผู้รักษาประตู FC Andorra ยังไม่ตัดสินใจเรื่องอนาคตหลังการเสียชีวิตของ เฆซุส เด มิเกล", "tag": "Football", "bullet_points": ["เฆซุส โอโวโน ผู้รักษาประตูวัย 25 ปี ยังไม่ได้ตัดสินใจว่าจะกลับมาลงเล่นฟุตบอลอีกครั้งหรือไม่ หลังเกิดเหตุปะทะกับ เฆซุส เด มิเกล ในการแข่งขันฟุตบอลลีกรองของสเปน", "เฆซุส เด มิเกล กองหน้าของ Tenerife เสียชีวิตที่โรงพยาบาลในวันถัดจากเหตุการณ์ปะทะเมื่อวันที่ 2 พฤศจิกายน", "ครอบครัวของ เด มิเกล ได้รับเงินบริจาคผ่านแคมเปญระดมทุนที่จัดตั้งโดย ฟราน โซล ซึ่งมียอดรวมเกินกว่า 170,000 ปอนด์แล้ว"], "full_paragraphs": ["คาร์เลส มานโซ ผู้จัดการทีม FC Andorra เปิดเผยว่า เฆซุส โอโวโน ผู้รักษาประตูของทีมยังคงอยู่ในช่วงตัดสินใจเกี่ยวกับอนาคตในอาชีพนักฟุตบอล หลังจากเหตุการณ์การเสียชีวิตของ เฆซุส เด มิเกล กองหน้าจากสโมสร Tenerife โดยในขณะนี้โอโวโนกำลังใช้เวลาอยู่กับครอบครัวและทางสโมสรยืนยันว่าจะให้พื้นที่ส่วนตัวแก่เขาอย่างเต็มที่ในการตัดสินใจว่าจะกลับมาลงสนามอีกครั้งเมื่อใดหรือจะตัดสินใจอย่างไร", "เหตุการณ์ดังกล่าวเกิดขึ้นระหว่างการแข่งขันฟุตบอลลีกรองของสเปนเมื่อวันที่ 2 พฤศจิกายน โดยโอโวโนได้รับใบแดงจากการปะทะกับ เด มิเกล ก่อนที่กองหน้าผู้นี้จะเสียชีวิตที่โรงพยาบาลในวันถัดมา ทั้งนี้ โอโวโน ซึ่งเป็นผู้รักษาประตูทีมชาติอิเควทอเรียลกินีที่มีสถิติลงเล่น 47 นัด ได้ออกแถลงการณ์ผ่านสโมสรเมื่อวันที่ 4 พฤศจิกายน โดยระบุว่าเป็นช่วงเวลาที่ยากลำบากที่สุดในชีวิตและแสดงความเสียใจอย่างสุดซึ้งต่อการจากไปของ เด มิเกล", "คาร์เลส มานโซ กล่าวถึงแนวทางของสโมสรว่า สิ่งที่สำคัญที่สุดในขณะนี้คือการสนับสนุนโอโวโนในทุกด้านและอยู่เคียงข้างเขา โดยสโมสรจะไม่กดดันและจะรอให้เจ้าตัวรู้สึกพร้อมอย่างแท้จริงในการตัดสินใจเรื่องอนาคตของตนเอง ซึ่งถือเป็นสิทธิส่วนบุคคลที่ทางสโมสรให้ความเคารพอย่างเต็มที่", "ในส่วนของครอบครัว เฆซุส เด มิเกล ได้ออกแถลงการณ์ผ่านสมาคมนักฟุตบอลอาชีพของสเปนเพื่อขอบคุณผู้ที่ร่วมบริจาคเงินผ่านแคมเปญระดมทุนที่จัดตั้งโดย ฟราน โซล กองหน้าจากสโมสร Hercules ในลีกระดับสามของสเปน โดยยอดเงินบริจาคในขณะนี้มีมูลค่าเกินกว่า 170,000 ปอนด์ ซึ่งเงินทั้งหมดจะถูกส่งมอบให้กับญาติของ เด มิเกล เพื่อเป็นการช่วยเหลือและแสดงความเสียใจต่อเหตุการณ์ที่เกิดขึ้น"], "link": "https://www.bbc.co.uk/sport/football/articles/ckedq01zve04o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/3166/live/efcf2c80-dea8-11f1-98eb-79ee6ea9ba56.jpg", "published_at": "2026-11-12 09:41 UTC", "category_hint": "Football"}, {"id": 1794553392989, "original_title": "Wilson and Miller score as Scotland U21s thump Ukraine", "thai_title": "ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี เอาชนะยูเครน 4-0 ในเกมกระชับมิตร", "tag": "Football", "bullet_points": ["ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี เอาชนะทีมชาติยูเครน 4-0 ในการแข่งขันกระชับมิตรที่สนาม Pinatar Arena ประเทศสเปน", "James Wilson ทำคนเดียว 2 ประตู ขณะที่ Lennon Miller และ Alfie Stewart ทำได้คนละ 1 ประตู", "ผู้เล่นอย่าง Wilson และ Miller ซึ่งเคยถูกเรียกตัวติดทีมชาติชุดใหญ่ กลับมาลงสนามให้ทีมชุด U21 ในนัดนี้", "ทีมของกุนซือ Tony Docherty มีโปรแกรมการแข่งขันนัดถัดไปกับทีมชาติสหรัฐอเมริกาในวันอาทิตย์นี้"], "full_paragraphs": ["ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี ประสบความสำเร็จในการแข่งขันฟุตบอลกระชับมิตรที่สนาม Pinatar Arena ในประเทศสเปน โดยสามารถเอาชนะทีมชาติยูเครนไปได้ด้วยสกอร์ 4-0 ซึ่งในเกมนี้มีผู้เล่นที่เคยผ่านการติดทีมชาติชุดใหญ่มาแล้วอย่าง James Wilson และ Lennon Miller ลงสนามช่วยทีมด้วย", "ประตูแรกของเกมเกิดขึ้นในนาทีที่ 23 จากความผิดพลาดในแนวรับของยูเครน ทำให้ Lennon Miller กองกลางจากสโมสร Udinese ฉวยโอกาสยิงประตูขึ้นนำให้สกอตแลนด์ จากนั้นก่อนหมดเวลาครึ่งแรก James Wilson กองหน้าจากสโมสร Heart of Midlothian ได้โหม่งทำประตูที่สองจากการเปิดลูกฟรีคิกของ Tyler Fletcher", "ในครึ่งหลัง สกอตแลนด์ยังคงทำผลงานได้ดีต่อเนื่อง โดยในนาทีที่ 58 Miller เป็นผู้จ่ายบอลให้ Wilson ทำประตูที่สองของตัวเองในเกมนี้ ก่อนที่ Alfie Stewart กองกลางจากสโมสร Aberdeen ซึ่งปัจจุบันถูกปล่อยยืมตัวไปอยู่กับ Inverness Caledonian Thistle จะมายิงประตูปิดท้ายในนาทีที่ 70 ทำให้สกอตแลนด์เอาชนะไปได้ด้วยผลต่าง 4 ประตู", "การแข่งขันนัดนี้ถือเป็นการเตรียมความพร้อมของทีมภายใต้การคุมทัพของ Tony Docherty เพื่อปรับจูนผู้เล่นชุดใหม่สำหรับการแข่งขันรอบคัดเลือก โดยหลังจากจบเกมนี้ ทีมชาติสกอตแลนด์รุ่นอายุไม่เกิน 21 ปี มีกำหนดการลงสนามพบกับทีมชาติสหรัฐอเมริกาที่สนามแห่งเดิมในวันอาทิตย์นี้"], "link": "https://www.bbc.co.uk/sport/football/articles/cmregjjnr1wno?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/43c4/live/a33cf770-deb3-11f1-8fb5-a771a656a227.jpg", "published_at": "2026-11-12 09:29 UTC", "category_hint": "Football"}, {"id": 1794553392990, "original_title": "How Pochettino came on Man Utd's radar - and what Carrick was told when", "thai_title": "เบื้องหลังการปลด Michael Carrick และความสนใจของ Manchester United ที่มีต่อ Mauricio Pochettino", "tag": "Football", "bullet_points": ["Manchester United ตัดสินใจปลด Michael Carrick ออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังผลงานของทีมตกต่ำลงอย่างต่อเนื่อง", "สโมสรรับทราบเงื่อนไขค่าฉีกสัญญาของ Mauricio Pochettino กับทีมชาติสหรัฐอเมริกาที่มีมูลค่า 10 ล้านดอลลาร์สหรัฐ (ประมาณ 7 ล้านปอนด์)", "ผู้บริหารของสโมสรได้มีการแจ้งเตือนตัวแทนของ Carrick ล่วงหน้าก่อนการตัดสินใจปลดอย่างเป็นทางการ"], "full_paragraphs": ["สถานการณ์ภายในสโมสร Manchester United ทวีความตึงเครียดขึ้นเมื่อ Michael Carrick ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน โดยก่อนหน้านี้มีกระแสข่าวการเปลี่ยนแปลงตัวกุนซืออย่างหนาหู ซึ่งตัวของ Carrick และตัวแทนได้รับสัญญาณที่ชัดเจนจากสโมสรถึงอนาคตที่ไม่แน่นอนของเขา", "เมื่อวันจันทร์ที่ผ่านมา Omar Berrada ประธานเจ้าหน้าที่บริหารของสโมสร ได้ติดต่อตัวแทนของ Carrick เพื่อแจ้งว่าเขาและ Jason Wilcox ผู้อำนวยการฟุตบอล จะเดินทางไปพบกับ Sir Jim Ratcliffe เจ้าของร่วมที่โมนาโก เพื่อหารือเกี่ยวกับอนาคตของหัวหน้าผู้ฝึกสอน ก่อนที่ในวันถัดมา Wilcox จะมีการสนทนาในลักษณะเดียวกันกับ Carrick โดยเป็นการสื่อสารว่าสโมสรจะมีการตัดสินใจเกี่ยวกับสถานะการทำงานของเขาในที่สุด", "ในระหว่างช่วงเวลาดังกล่าว Manchester United ได้รับทราบข้อมูลเกี่ยวกับเงื่อนไขค่าฉีกสัญญา (Release Clause) ของ Mauricio Pochettino ซึ่งปัจจุบันดำรงตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา โดยมีมูลค่าอยู่ที่ 10 ล้านดอลลาร์สหรัฐ หรือประมาณ 7 ล้านปอนด์ ซึ่งแหล่งข่าวระบุว่าตัวแทนของ Pochettino เป็นผู้ให้ข้อมูลดังกล่าวแก่สโมสรในพรีเมียร์ลีกเอง", "แม้จะมีความรู้สึกเสียดายจากภายในสโมสรที่กระบวนการปลด Carrick กลายเป็นประเด็นสาธารณะ แต่ผู้บริหารมองว่าการรักษาความลับในสโมสรระดับนี้เป็นเรื่องยาก และยืนยันว่าได้ดำเนินการอย่างโปร่งใสที่สุดเท่าที่จะทำได้กับ Carrick แล้ว โดยความกดดันของสโมสรทวีคูณขึ้นหลังจากความพ่ายแพ้ต่อ Como และ Bournemouth ทำให้เกมที่พบกับ Chelsea, Roma และ Aston Villa กลายเป็นนัดที่มีความสำคัญอย่างยิ่งต่อการตัดสินใจในอนาคต"], "link": "https://www.bbc.co.uk/sport/football/articles/cqdr1jlr1707o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/b6bd/live/ff1daf40-dead-11f1-8253-3f203a001288.jpg", "published_at": "2026-11-12 09:12 UTC", "category_hint": "Football"}, {"id": 1794553392991, "original_title": "Largs get floodlights consent in time for cup tie with Ayr – watch on BBC", "thai_title": "Largs Thistle ได้รับอนุญาตเปิดไฟสนามสำหรับการแข่งขัน Scottish Cup พบกับ Ayr United", "tag": "Football", "bullet_points": ["Largs Thistle ได้รับอนุมัติจากสภาท้องถิ่นให้เปิดไฟสนาม Barrfields Park ได้ถึงเวลา 22:00 น. เพื่อรองรับการแข่งขัน Scottish Cup", "การแข่งขันรอบที่ 3 ระหว่าง Largs Thistle และ Ayr United จะถ่ายทอดสดผ่านช่อง BBC Scotland ในวันที่ 27 พฤศจิกายน เวลา 19:30 น.", "ก่อนหน้านี้สโมสรมีข้อจำกัดด้านเวลาการใช้ไฟสนาม ทำให้ต้องย้ายสนามแข่งขันในเกมกลางสัปดาห์ไปที่ Ardrossan"], "full_paragraphs": ["การแข่งขันฟุตบอล Scottish Cup รอบที่ 3 ระหว่างทีม Largs Thistle และ Ayr United จะมีการถ่ายทอดสดผ่านทางช่อง BBC Scotland, เว็บไซต์ และ iPlayer ในวันศุกร์ที่ 27 พฤศจิกายน โดยจะเริ่มคิกออฟในเวลา 19:30 น. ตามเวลาท้องถิ่น", "ความคืบหน้าดังกล่าวเกิดขึ้นหลังจากที่สโมสร Largs Thistle ซึ่งเป็นทีมในระดับ Lowland League West ได้รับอนุญาตจากสภา North Ayrshire ให้สามารถเปิดไฟสนามที่ Barrfields Park ได้จนถึงเวลา 22:00 น. ตามเวลา GMT โดยก่อนหน้านี้สโมสรมีข้อจำกัดในการใช้ไฟสนามเกินเวลา 21:00 น. ได้ไม่เกิน 2 ครั้งต่อเดือนเท่านั้น", "ข้อจำกัดเดิมส่งผลกระทบต่อสโมสรอย่างมากหลังจากเลื่อนชั้นจาก West of Scotland League Premier Division ขึ้นสู่ลีกระดับที่ 5 ของสกอตแลนด์ ซึ่งกำหนดให้การแข่งขันกลางสัปดาห์ต้องเริ่มในเวลา 19:45 น. ทำให้สโมสรจำเป็นต้องย้ายสนามเหย้าไปแข่งขันที่เมือง Ardrossan ซึ่งห่างออกไป 11 ไมล์ เพื่อให้เป็นไปตามกฎระเบียบ", "สำหรับสถานการณ์ของทั้งสองทีม Largs Thistle ภายใต้การคุมทีมของ Stuart Davidson ปัจจุบันรั้งอันดับ 2 ของตาราง Lowland League และผ่านเข้าสู่รอบที่ 3 ของ Scottish Cup ได้สำเร็จหลังจากเอาชนะ Gala Fairydean Rovers และ Dunipace ในรอบก่อนหน้า ส่วนทีมเยือน Ayr United ภายใต้การคุมทีมของ Gary Naysmith ปัจจุบันอยู่ในอันดับที่ 7 ของลีก Championship ซึ่งเป็นลีกระดับที่ 2 ของประเทศ"], "link": "https://www.bbc.co.uk/sport/football/articles/cmqlq3llg19go?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/5250/live/03144960-dea4-11f1-82bd-ab0398e9e082.jpg", "published_at": "2026-11-12 08:00 UTC", "category_hint": "Football"}, {"id": 1794553392992, "original_title": "Police investigation into Vigar's death ongoing", "thai_title": "การสอบสวนกรณีการเสียชีวิตของ บิลลี่ วิกเกอร์ อดีตนักเตะเยาวชนอาร์เซนอลยังคงดำเนินอยู่", "tag": "Football", "bullet_points": ["บิลลี่ วิกเกอร์ เสียชีวิตจากอาการบาดเจ็บทางสมองอย่างรุนแรงในปี 2025 หลังปะทะกับกำแพงคอนกรีตข้างสนาม", "ครอบครัววิกเกอร์ตั้งคำถามถึงมาตรการความปลอดภัยของสมาคมฟุตบอลอังกฤษ (FA) ที่ล่าช้าแม้จะเคยมีเหตุการณ์เตือนมาก่อน", "เจ้าหน้าที่ตำรวจนครบาลระบุว่าการสอบสวนยังต้องใช้เวลาอีก 2-3 เดือนจึงจะเสร็จสิ้น", "มีการเปิดเผยข้อมูลว่ามีสโมสรฟุตบอลกว่า 160 แห่งที่ถูกระบุว่ามีความเสี่ยงสูงจากโครงสร้างสนามที่ไม่ปลอดภัย"], "full_paragraphs": ["การสอบสวนกรณีการเสียชีวิตของ บิลลี่ วิกเกอร์ อดีตนักเตะเยาวชนของสโมสรฟุตบอลอาร์เซนอล ยังคงอยู่ในระหว่างการดำเนินการตามรายงานจากศาลชันสูตรพลิกศพ โดยวิกเกอร์เสียชีวิตจากอาการบาดเจ็บทางสมองอย่างรุนแรงในเดือนกันยายน ปี 2025 หลังจากประสบอุบัติเหตุปะทะกับกำแพงคอนกรีตที่ล้อมรอบสนามแข่งขัน ในระหว่างการลงเล่นให้กับสโมสรชิเชสเตอร์ ซิตี้ ที่สนามของสโมสรวิงเกต แอนด์ ฟินช์ลีย์", "ในการไต่สวนเบื้องต้นที่ศาลชันสูตรพลิกศพในบาร์เน็ต เจ้าหน้าที่ตำรวจนครบาลระบุว่าจำเป็นต้องใช้เวลาในการสืบสวนเพิ่มเติมอีกประมาณ 2 ถึง 3 เดือน โดยยังไม่มีการเปิดเผยรายละเอียดเชิงลึกเกี่ยวกับแนวทางการสอบสวนในขณะนี้ ทั้งนี้ ตัวแทนจากสมาคมฟุตบอลอังกฤษ (FA) และสภาเมืองบาร์เน็ตได้เข้าร่วมรับฟังการไต่สวนดังกล่าวด้วย", "คีธ และ คามิลลา วิกเกอร์ บิดามารดาของผู้เสียชีวิตได้แสดงความไม่พอใจต่อการทำงานของ FA โดยระบุว่าเหตุการณ์นี้สามารถป้องกันได้หากมีการดำเนินการตามคำเตือนที่มีมาก่อนหน้านี้ คามิลลา วิกเกอร์ ตั้งคำถามว่าเหตุใด FA จึงรอให้เกิดการสูญเสียก่อนจึงจะเริ่มดำเนินการ ทั้ง ยใต้การดูแลของทีมแพทย์สโมสรนั้น เป็นการป้องกันไม่ให้เกิดความเสี่ยงจากการเดินทาง โดยยืนยันว่าหากเป็นผู้เล่นคนอื่นที่มีอาการบาดเจ็บในลักษณะเดียวกัน ทางทีมชาติก็จะดำเนินการในรูปแบบเดียวกันนี้ นอกจากนี้ มิเกล โอยาร์ซาบัล กัปตันทีมเรอัล โซเซียดาด ก็ได้รับอนุญาตให้รายงานตัวล่าช้าเช่นกัน เนื่องจากอาการป่วยไข้หวัดและการดูแลบุตรที่เพิ่งคลอด", "กุนซือทีมชาติสเปนกล่าวแสดงความไม่พอใจต่อสื่อมวลชนที่นำเสนอข่าวในเชิงบิดเบือน โดยระบุว่าตนไม่สามารถยอมรับการโกหกหรือการสร้างเรื่องราวที่ขาดความถูกต้องได้ และยืนยันว่าไม่มีการปฏิบัติที่แตกต่างระหว่างนักเตะในทีมแต่อย่างใด", "สำหรับสถิติในฤดูกาลนี้ ลามีน ยามาล ลงเล่นให้บาร์เซโลนาไปแล้ว 16 นัด ทำได้ 13 ประตู กับอีก 12 แอสซิสต์ ขณะที่ในนามทีมชาติสเปน เขาลงเล่นไปแล้ว 14 นัดในปี 2026 โดยคาดการณ์ว่ายามาลจะกลับมาร่วมฝึกซ้อมกับทีมชาติสเปนอีกครั้งก่อนการแข่งขันนัดที่จะพบกับทีมชาติอังกฤษในวันอาทิตย์นี้"], "link": "https://www.bbc.co.uk/sport/football/articles/cm0qjekqzwp0o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/7137/live/e8eba510-de85-11f1-b88b-3f1671ea859d.jpg", "published_at": "2026-11-12 04:31 UTC", "category_hint": "Football"}, {"id": 1794553392994, "original_title": "Six matches that defined Carrick's Man Utd tenure", "thai_title": "ย้อนรอย 6 แมตช์สำคัญที่นิยามช่วงเวลาการคุมทีมแมนเชสเตอร์ ยูไนเต็ด ของ ไมเคิล คาร์ริค", "tag": "Football", "bullet_points": ["BBC Sport รวบรวม 6 เกมพรีเมียร์ลีกที่สะท้อนถึงช่วงเวลาทั้งขาขึ้นและขาลงตลอด 10 เดือนของ ไมเคิล คาร์ริค ในฐานะผู้จัดการทีมแมนเชสเตอร์ ยูไนเต็ด", "สถานการณ์ของคาร์ริคทวีความตึงเครียดมากขึ้นหลังจากทีมพ่ายแพ้ให้กับบอร์นมัธ ส่งผลให้เกิดคำถามเกี่ยวกับอนาคตของเขาในถิ่นโอลด์ แทรฟฟอร์ด", "เกิดประเด็นวิพากษ์วิจารณ์ภายในทีม โดยเฉพาะกรณีที่ บรูโน่ แฟร์นันด์ส ถูกวิจารณ์เรื่องการแสดงออกต่อคาร์ริค ซึ่งได้รับเสียงตอบโต้จากทั้ง แคสเปอร์ ชไมเคิล และ เควิน โนแลน"], "full_paragraphs": ["BBC Sport ได้ทำการสรุปเหตุการณ์สำคัญผ่าน 6 แมตช์การแข่งขันในพรีเมียร์ลีก ซึ่งเป็นตัวบ่งชี้ถึงผลงานและทิศทางของสโมสรแมนเชสเตอร์ ยูไนเต็ด ภายใต้การคุมทีมของ ไมเ ยในยุคแรกเขาเคยมีผู้เล่นอย่าง จอนนี อีแวนส์, แอรอน ฮิวส์, แกเร็ธ แมคออลีย์ และ เคร็ก แคทคาร์ต เป็นแกนหลักสำคัญ อย่างไรก็ตาม ในช่วง 4 ปีที่ผ่านมา โอนีลได้ปรับเปลี่ยนมาใช้ระบบกองหลัง 3 คน โดยมี ไทร ฮูม และ แดน บัลลาร์ด จากซันเดอร์แลนด์เป็นกำลังสำคัญที่นำคุณภาพระดับพรีเมียร์ลีกเข้ามาสู่ทีม", "ในแคมเปญเนชันส์ลีกครั้งนี้ โอนีลจำเป็นต้องปรับทัพแนวรับเนื่องจาก แดน บัลลาร์ด มีอาการบาดเจ็บที่แฮมสตริง ส่วน ไทร ฮูม ถูกขยับไปเล่นในตำแหน่งวิงแบ็กขวาแทนที่ คอเนอร์ แบรดลีย์ ที่บาดเจ็บ รวมถึงเคยถูกขยับไปเล่นกองกลางในเกมพบกับยูเครนเมื่อเดือนที่ผ่านมา ส่งผลให้โอกาสตกเป็นของ รูไอรี แมคคอนวิลล์ และ ทอม แอทเชสัน สองกองหลังดาวรุ่งที่โอนีลระบุว่ามีศักยภาพไร้ขีดจำกัด", "แม้จะมีการปรับเปลี่ยนผู้เล่นในแนวรับ แต่ทีมชาติไอร์แลนด์เหนือยังคงทำผลงานได้อย่างยอดเยี่ยม โดยรั้งตำแหน่งจ่าฝูงของกลุ่ม B2 และเป็นทีมเดียวในรายการนี้ที่ยังไม่เสียประตูเลยแม้แต่ลูกเดียว ซึ่งถือเป็นสถิติการไม่เสียประตูที่ยาวนานที่สุดของทีมชาตินับตั้งแต่ปี 2017 เป็นต้นมา โดย รูไอรี แมคคอนวิลล์ ได้กลายเป็นผู้เล่นที่มีสถิติการเคลียร์บอลสูงสุดในกลุ่มนี้ ทั้งการใช้ศีรษะและเท้า", "แมคคอนวิลล์กล่าวถึงสถิติดังกล่าวว่า เป็นผลลัพธ์จากการทำงานหนักร่วมกันของทั้งทีม ไม่ใช่เพียงแค่ผู้เล่นในแนวรับ 3 คนเท่านั้น โดยทีมชาติไอร์แลนด์เหนือมีโปรแกรมการแข่งขันนัดสุดท้ายของรอบแบ่งกลุ่ม โดยจะพบกับยูเครนในวันเสาร์ที่เบลฟาสต์ ก่อนจะเดินทางไปเยือนฮังการีในวันอังคาร เพื่อรักษาผลงานและสถิติไม่เสียประตูให้คงอยู่จนจบแคมเปญ"], "link": "https://www.bbc.co.uk/sport/articles/cw24epvmq96lo?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/e1cf/live/ea41ecb0-ddc9-11f1-93e1-3b657b665bcf.png", "published_at": "2026-11-12 01:17 UTC", "category_hint": "Football"}, {"id": 1794553392997, "original_title": "Podcast: What kind of boss do Aberdeen need & have Hibs turned a corner?", "thai_title": "วิเคราะห์สถานการณ์ทีมชาติสกอตแลนด์ อนาคตผู้จัดการทีม Aberdeen และฟอร์มการเล่นของ Hibernian", "tag": "Football", "bullet_points": ["ทีมชาติสกอตแลนด์ภายใต้การคุมทีมของ Sebastian Pocognoli กำลังเผชิญความกดดันก่อนพบกับ North Macedonia โดยมีการตั้งคำถามถึงการปรับเปลี่ยนแผนการเล่นและการเลือกผู้รักษาประตู", "สโมสร Aberdeen กำลังมองหาผู้จัดการทีมคนใหม่หลังจากความล้มเหลวในการแต่งตั้งกุนซือในช่วงที่ผ่านมา พร้อมตั้งคำถามว่าปัญหาของสโมสรเกิดจากตัวผู้จัดการทีมเพียงอย่างเดียวหรือไม่", "สโมสร Hibernian เริ่มมีสัญญาณฟื้นตัวหลังจากเก็บชัยชนะได้สองนัดติดต่อกัน ก่อนที่จะเข้าสู่โปรแกรมการแข่งขันรอบชิงชนะเลิศฟุตบอลถ้วยกับ Rangers"], "full_paragraphs": ["รายการพอดแคสต์จาก BBC Radio Scotland ดำเนินรายการโดย Martin Dowden ร่วมด้วยผู้เชี่ยวชาญอย่าง Stephen McGowan และ Rory Loy ได้ร่วมกันวิเคราะห์สถานการณ์ของทีมชาติสกอตแลนด์ภายใต้การคุมทีมของ Sebastian Pocognoli ซึ่งกำลังเผชิญกับความกดดันอย่างหนักก่อนการแข่งขันกับทีมชาติ North Macedonia โดยประเด็นหลักที่ถูกหยิบยกมาหารือคือความจำเป็นในการปรับเปลี่ยนแผนการเล่น (Shape) และการเพิ่มบทบาทของผู้เล่นตำแหน่งปีก รวมถึงการพิจารณาให้โอกาส Scott Bain ลงทำหน้าที่ในตำแหน่งผู้รักษาประตู", "ในส่วนของสโมสร Aberdeen รายการได้ตั้งคำถามถึงทิศทางของสโมสรหลังจากมีการเปลี่ยนแปลงตำแหน่งผู้จัดการทีมอีกครั้ง โดยวิเคราะห์ถึงสาเหตุที่การแต่งตั้งกุนซือในช่วงที่ผ่านมาไม่ประสบความสำเร็จตามเป้าหมายที่วางไว้ นอกจากนี้ยังมีการถกเถียงว่าปัญหาที่เกิดขึ้นภายในสโมสรนั้นมีรากเหง้าที่ลึกซึ้งกว่าเพียงแค่เรื่องของตัวผู้จัดการทีมหรือไม่", "สำหรับสโมสร Hibernian รายการได้ประเมินสถานการณ์หลังจากทีมสามารถเก็บชัยชนะได้สองนัดติดต่อกัน ซึ่งถือเป็นสัญญาณบวกว่าทีมอาจผ่านพ้นช่วงวิกฤตไปได้แล้ว โดยสถานการณ์นี้มีความสำคัญอย่างยิ่งเนื่องจากทีมกำลังจะมีโปรแกรมการแข่งขันรอบชิงชนะเลิศฟุตบอลถ้วยกับสโมสร Rangers ในอนาคตอันใกล้", "บทวิเคราะห์ในพอดแคสต์ความยาว 24 นาทีนี้ ครอบคลุมประเด็นสำคัญตั้งแต่ความกดดันของทีมชาติสกอตแลนด์ การปรับเปลี่ยนแท็กติกในสนาม ไปจนถึงการประเมินโครงสร้างการบริหารจัดการของสโมสรในลีกสกอตแลนด์ เพื่อหาคำตอบว่าแต่ละทีมควรปรับตัวอย่างไรในสถานการณ์ที่ท้าทายเช่นนี้"], "link": "https://www.bbc.co.uk/sounds/play/p0pmk9cf?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/images/ic/1024x576/p0pmk9d2.jpg", "published_at": "2026-11-12 01:00 UTC", "category_hint": "Football"}, {"id": 1794553392998, "original_title": "USA withdraw from U17 World Cup", "thai_title": "สหรัฐอเมริกาถอนทีมจากการแข่งขันฟุตบอล U17 World Cup ที่กาตาร์", "tag": "Football", "bullet_points": ["สมาคมฟุตบอลสหรัฐฯ (US Soccer) ประกาศถอนทีมจากการแข่งขันฟุตบอล U17 World Cup ที่ประเทศกาตาร์", "สาเหตุหลักมาจากการประเมินความเสี่ยงด้านความปลอดภัยจากความขัดแย้งทางอาวุธในภูมิภาค", "กระทรวงการต่างประเทศสหรัฐฯ ได้ยกระดับคำเตือนการเดินทางสู่ระดับที่ 3 ซึ่งแนะนำให้พลเมืองพิจารณาการเดินทางใหม่", "การแข่งขันรายการนี้มีกำหนดจัดขึ้นระหว่างวันที่ 19 พฤศจิกายน ถึง 13 ธันวาคม โดยมีทีมเข้าร่วมทั้งหมด 48 ทีม"], "full_paragraphs": ["สมาคมฟุตบอลสหรัฐฯ (US Soccer) ได้ตัดสินใจถอนทีมฟุตบอลรุ่นอายุไม่เกิน 17 ปี ออกจากการแข่งขัน U17 World Cup ซึ่งมีกำหนดจัดขึ้นที่ประเทศกาตาร์ โดยให้เหตุผลถึงความกังวลด้านความปลอดภัยจากความเสี่ยงของความขัดแย้งทางอาวุธในพื้นที่ใกล้เคียง", "การตัดสินใจดังกล่าวเกิดขึ้นหลังจากกระทรวงการต่างประเทศสหรัฐฯ ได้ออกประกาศคำเตือนการเดินทางสู่ระดับที่ 3 สำหรับประเทศกาตาร์เมื่อเดือนที่ผ่านมา โดยอ้างถึงเหตุการณ์การโจมตีสนามบินในประเทศซาอุดีอาระเบียโดยกลุ่มฮูตีจากเยเมน รวมถึงสถานการณ์ความไม่สงบและการโจมตีทางอากาศที่ยังคงดำเนินอยู่ในภูมิภาค ซึ่งอาจส่งผลกระทบต่อความปลอดภัยในวงกว้าง", "ในจดหมายที่ส่งถึงผู้เล่น สมาคมฟุตบอลสหรัฐฯ ระบุว่าสวัสดิภาพของผู้เล่นและทีมงานถือเป็นลำดับความสำคัญสูงสุด โดยทีมมีกำหนดการเดิมที่จะต้องลงแข่งขันในรอบแบ่งกลุ่มร่วมกับทีมชาติมอนเตเนโกร ชิลี และแอลจีเรีย ในทัวร์นาเมนต์ที่มีทีมเข้าร่วมทั้งหมด 48 ทีม ระหว่างวันที่ 19 พฤศจิกายน ถึง 13 ธันวาคม", "สถานการณ์ความขัดแย้งในภูมิภาคนี้ยังส่งผลกระทบต่อวงการฟุตบอลในวงกว้าง โดยก่อนหน้านี้การแข่งขันฟุตบอลเอเชียนคัพ 2027 ที่มีกำหนดจัดขึ้นในซาอุดีอาระเบีย ได้ถูกเลื่อนออกไปเกือบหนึ่งปี นอกจากนี้ยังมีรายงานว่าครอบครัวของนักฟุตบอลที่ค้าแข้งในซาอุดีโปรลีกบางส่วนได้ตัดสินใจเดินทางกลับประเทศเพื่อความปลอดภัยจนกว่าสถานการณ์จะคลี่คลาย"], "link": "https://www.bbc.co.uk/sport/football/articles/c6y49yz77pppo?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/79aa/live/f81c7430-de6     let currentTag = 'ALL';

    if (window.location.protocol.startsWith('http')) {
      fetch('data/news.json?t=' + Date.now())
        .then(r => r.json())
        .then(data => {
          if (data && data.length > 0) {
            allNews = data;
            render();
          }
        }).catch(() => {});
    }

    function filterTag(tag) {
      currentTag = tag;
      ['ALL', 'Football', 'Technology', 'Chelsea'].forEach(t => {
        const btn = document.getElementById('filter' + t);

          if ((t === 'Chelsea' && tag === 'Chelsea FC') || t === tag) {
            btn.className = "px-3 py-1.5 bg-white text-black font-mono font-bold text-xs rounded-sm transition";
          } else {
            btn.className = "px-3 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-mono text-xs rounded-sm transition";
          }
        }
      });
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase();
      render();
    }

    function render() {
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = '';

      const filtered = allNews.filter(item => {
        const matchTag = (currentTag === 'ALL') || (item.tag === currentTag);
        const matchQuery = !searchQuery || 
          (item.thai_title || '').toLowerCase().includes(searchQuery) ||
          (item.tag || '').toLowerCase().includes(searchQuery);
        return matchTag && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center py-16 text-zinc-500 font-mono">ไม่มีข่าวที่ตรงกับเงื่อนไข</div>';

          </div>
          <div class="p-5 pt-0 border-t border-zinc-800/80 text-[11px] font-mono text-zinc-500 flex items-center justify-between">
            <span class="text-zinc-300 group-hover:text-white transition">อ่านรายละเอียดเต็ม →</span>
            <span>VERGE FEED</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function openModal(idx) {
      const item = allNews[idx];
      if (!item) return;

      document.getElementById('modalTag').textContent = `// ${item.tag}`;
      document.getElementById('modalImg').src = item.cover_image_url;
      document.getElementById('modalTitle').textContent = item.thai_title;
      document.getElementById('modalDate').textContent = item.published_at;

      const bulletsList = document.getElementById('modalBullets');
      bulletsList.innerHTML = '';
      (item.bullet_points || []).forEach(b => {
        const li = document.createElement('li');
        li.className = 'flex items-start gap-2';
        li.innerHTML = `<span class="text-[#ff3366] font-bold">›</span><span>${b}</span>`;
        bulletsList.appendChild(li);
      });

      const fullContentDiv = document.getElementById('modalFullContent');
      fullContentDiv.innerHTML = '';
      const paras = Array.isArray(item.full_paragraphs) && item.full_paragraphs.length > 0 ? item.full_paragraphs : item.bullet_points;
      (paras || []).forEach(p => {
        const pElem = document.createElement('p');
        pElem.textContent = p;
        fullContentDiv.appendChild(pElem);
      });

      document.getElementById('modalSource').href = item.link;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    render();
  </script>
</body>
</html>
