original_title": "Premier League clubs vote to increase legal protection for executives", "thai_title": "สโมสรพรีเมียร์ลีกโหวตผ่านกฎเพิ่มความคุ้มครองทางกฎหมายให้ผู้บริหาร", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["สโมสรในพรีเมียร์ลีกมีมติ 18-2 เสียง เห็นชอบให้ขยายขอบเขตการคุ้มครองทางกฎหมายแก่ผู้บริหารระดับสูง", "การเปลี่ยนแปลงกฎครั้งนี้มีขึ้นท่ามกลางกระแสข่าวว่าผู้สนับสนุนของ แมนเชสเตอร์ ซิตี้ อาจดำเนินคดีกับผู้บริหารพรีเมียร์ลีก", "แมนเชสเตอร์ ซิตี้ และ นอตทิงแฮม ฟอเรสต์ เป็นสองสโมสรที่โหวตคัดค้านมติดังกล่าว", "ฮาวเวิร์ด เว็บบ์ หัวหน้าผู้ตัดสินของ PGMOL เข้าชี้แจงต่อที่ประชุมเกี่ยวกับความผิดพลาดของ VAR ในช่วงที่ผ่านมา", "พรีเมียร์ลีกยืนยันตารางการแข่งขันฤดูกาลหน้า โดยจะเริ่มในวันที่ 13 สิงหาคม และสิ้นสุดในวันที่ 21 พฤษภาคม"], "full_paragraphs": ["บรรดาสโมสรในพรีเมียร์ลีกต่างรวมตัวกันสนับสนุนการทำงานของฝ่ายบริหารพรีเมียร์ลีกในการประชุมครั้งสำคัญเมื่อวันพฤหัสบดีที่ผ่านมา โดยเสียงส่วนใหญ่ได้ลงมติเห็นชอบกฎใหม่ที่จะช่วยปกป้อง ริชาร์ด มาสเตอร์ส ประธานเจ้าหน้าที่บริหารจากการถูกฟ้องร้องดำเนินคดีที่อาจส่งผลกระทบต่อตัวเขา", "การลงมติเพื่อขยายความคุ้มครองทางกฎหมาย (Indemnity) ให้แก่กรรมการของพรีเมียร์ลีกนั้นได้รับชัยชนะด้วยคะแนนเสียง 18 ต่อ 2 ในการประชุมผู้ถือหุ้นที่ใจกลางกรุงลอนดอน ซึ่งการตัดสินใจครั้งนี้จะช่วยให้ มาสเตอร์ส และบุคคลสำคัญอื่นๆ ในองค์กรได้รับความคุ้มครองที่มากขึ้นในกรณีที่พวกเขาถูกฟ้องร้องจากการปฏิบัติหน้าที่ตามปกติ", "เป็นที่เข้าใจกันว่า แมนเชสเตอร์ ซิตี้ คือหนึ่งในสองสโมสรที่โหวตคัดค้านการขยายความคุ้มครองดังกล่าว โดยมีสโมสรนิรนามอีกแห่งหนึ่งที่ได้แสดงความเห็นคัดค้านมาตรการนี้อย่างละเอียดในระหว่างการประชุม ส่วนอีกหนึ่งเสียงที่คัดค้านคือ นอตทิงแฮม ฟอเรสต์ ซึ่งมองว่าระยะเวลาในการพิจารณาข้อเสนอดังกล่าวนั้นสั้นเกินไป การเปลี่ยนแปลงกฎครั้งนี้เกิดขึ้นตามหลังรายงานข่าวที่ระบุว่า ฝ่ายบริหารของพรีเมียร์ลีกอาจถูกระบุชื่อในคดีความที่อาจเกิดขึ้นโดยกลุ่มผู้สนับสนุนจากอาบูดาบีของ แมนเชสเตอร์ ซิตี้ ซึ่งอ้างว่าชื่อเสียงของพวกเขาได้รับความเสียหายจากบทสรุปอันรุนแรงของคณะกรรมการอิสระเกี่ยวกับกรณีที่ แมนเชสเตอร์ ซิตี้ ละเมิดกฎทางการเงินของลีก โดยปัจจุบั llet_points": ["แมนเชสเตอร์ ยูไนเต็ด แต่งตั้ง เมาริซิโอ โปเช็ตติโน เข้ามารับตำแหน่งเฮดโค้ชคนใหม่ด้วยสัญญา 2 ปีครึ่ง แทนที่ ไมเคิล คาร์ริค", "โปเช็ตติโนต้องเผชิญกับความท้าทายหนัก ทั้งสถิติเกมรับที่ย่ำแย่ที่สุดใน 5 ลีกใหญ่ของยุโรป และปัญหาความขัดแย้งเรื่องสัญญาของ บรูโน แฟร์นันด์ส", "วิลล์ อันวิน นักข่าวสายปีศาจแดงจาก The Guardian ชี้ว่ากุนซือคนใหม่ต้องเร่งแก้ปัญหาในสนามควบคู่ไปกับการกดดันผู้บริหารให้รับผิดชอบ", "บททดสอบแรกของโปเช็ตติโนคือการบุกไปเยือน ลิเวอร์พูล ในวันอาทิตย์นี้ ตามด้วยเกมเยือน สปอร์ติ้ง ในศึกยูฟ่า แชมเปี้ยนส์ลีก", "วิลล์ อันวิน เตรียมเปิดพื้นที่ให้แฟนบอลร่วมถาม-ตอบสดในวันพฤหัสบดีที่ 19 พฤศจิกายนนี้ เวลา 14.00 น. ตามเวลา GMT"], "full_paragraphs": ["แมนเชสเตอร์ ยูไนเต็ด ได้เฮดโค้ชคนใหม่เป็นที่เรียบร้อย โดย เมาริซิโอ โปเช็ตติโน ได้เซ็นสัญญาคุมทีมเป็นเวลา 2 ปีครึ่ง เพื่อเข้ามารับไม้ต่อจาก ไมเคิล คาร์ริค ซึ่งถูกปลดออกจากตำแหน่งหลังจากพาทีมทำผลงานออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 4 ทศวรรษ", "ในการกล่าวอำลาทีมชาติสหรัฐอเมริกาด้วยความตื้นตันใจ โปเช็ตติโนยอมรับว่าการตัดสินใจครั้งนี้ถือเป็น “หนึ่งในการตัดสินใจที่ยากลำบากที่สุด” ในอาชีพการทำงานของเขา อย่างไรก็ตาม งานที่เขากำลังจะได้รับช่วงต่อนั้นอาจมีความยากลำบากยิ่งกว่าเดิม เนื่องจากในเวลานี้ไม่มีทีมใดใน 5 ลีกใหญ่ของยุโรปที่เสียประตูรวมทุกรายการมากเท่ากับพวกเขาในฤดูกาลนี้ นอกจากนี้ บรูโน แฟร์นันด์ส ยังได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่เป็นครั้งที่สอง ขณะที่แฟนบอลต่างพุ่งเป้าความโกรธแค้นไปยังกลุ่มผู้บริหารระดับสูงของสโมสร", "ในบทวิเคราะห์ถึงสิ่งที่เฮดโค้ชคนใหม่ต้องเร่งดำเนินการ วิลล์ อันวิน ได้เขียนไว้ว่า ไม่ว่าใครจะเข้ามารับงานนี้ ก็จำเป็นต้องหาทางแก้ปัญหาในสนามให้ได้ พร้อมกับต้องกดดันไปยังผู้ที่มีอำนาจเหนือกว่าเขา โดยระบุว่า “แฟนบอลยูไนเต็ดต่างรู้ดีว่าคนที่ยืนอยู่ข้างสนามไม่สามารถรับผิดชอบความล้มเหลวทั้งหมดได้เพียงลำพัง และจำเป็นต้องมีใครสักคนออกมาแสดงความรับผิดชอบต่อสาธารณะอย่างชัดเจน”", "โปรแกรมการคุมทีมเกมแรกของ โปเช็ตติโน คือการพาทีมบุกไปเยือน ลิเวอร์พูล ในวันอาทิตย์นี้ ต่อด้วยการออกไปเยือน สปอร์ติ้ง ในศึกยูฟ่า แชมเปี้ยนส์ลีก คำถามสำคัญคือ เขาคือคนที่ใช่สำหรับงานนี้หรือไม่? เขาสามารถรีดศักยภาพของขุมกำลังชุดนี้ออกมาได้หรือไม่ และใครบ้างที่จะแจ้งเกิดได้ภายใต้สไตล์การทำทีมที่เน้นความเข้มข้นสูงของเขา? รวมถึงเจ้าของสโมสรจะให้เวลาและเครื่องมือที่จำเป็นแก่เขามากน้อยเพียงใด?", "วิลล์ อันวิน ผู้สื่อข่าวที่ติดตามทำข่าว แมนเชสเตอร์ ยูไนเต็ด ให้กับ The Guardian จะมาตอบคำถามของแฟนบอลแบบสดๆ ในวันพฤหัสบดีที่ 19 พฤศจิกายนนี้ เวลา 14.00 น. ตามเวลา GMT"], "link": "https://www.theguardian.com/football/live/2026/nov/19/will-pochettino-fix-manchester-united-put-your-questions-to-will-unwin", "canonical_link": "https://www.theguardian.com/football/live/2026/nov/19/will-pochettino-fix-manchester-united-put-your-questions-to-will-unwin", "cover_image_url": "https://i.guim.co.uk/img/media/5ff2e4183fc2f7c96f968659a6beba6d04d3a894/0_0_2000_1600/master/2000.jpg?width=1200&dpr=1&s=none&crop=none", "gallery_images": ["https://i.guim.co.uk/img/media/a170e5e0e9fab96d72844ca1356a629700d7f164/0_50_2095_1675/master/2095.jpg?width=1200&dpr=1&s=none&crop=none"], "videos": [], "review_score": "", "published_ts": 1795102292, "published_at": "2026-11-19T15:31:32Z", "published_th": "19 พ.ย. 2026 • 22:31 น.", "category_hint": "Football"}, {"id": 1795105894608, "guid": "https://www.skysports.com/football/news/11095/13614031/premier-league-clubs-vote-to-cover-legal-costs-if-man-city-sponsors-sue-competitions-board-members", "original_title": "PL clubs vote to cover legal costs of board members if Man City sponsors sue", "thai_title": "สโมสรพรีเมียร์ลีกโหวตหนุนจ่ายค่าธรรมเนียมทางกฎหมายให้บอร์ดบริหาร หากถูกสปอนเซอร์แมนฯ ซิตี้ฟ้องร้อง", "tag": "Football", "sub_tag": "MAN CITY", "bullet_points": ["สโมสรในพรีเมียร์ลีกมีมติ 18-2 เสียง เห็นชอบให้ความคุ้มครองทางกฎหมายแก่สมาชิกบอร์ดบริหาร หากถูกฟ้องร้องส่วนตัวจากกรณีข้อพิพาทกับสปอนเซอร์ของแมนเชสเตอร์ ซิตี้", "การลงมติดังกล่าวเกิดขึ้นหลังจากคณะกรรมการอิสระตัดสินว่า แมนเชสเตอร์ ซิตี้ ทำสัญญา 'จอมปลอม' กับกลุ่มสปอนเซอร์ในช่วงปี 2009-2018", "เอทิฮัด แอร์เวย์ส และ เอทิซาลาต สองสปอนเซอร์หลักของแมนฯ ซิตี้ ได้ขู่ว่าจะดำเนินคดีทางกฎหมายกับพรีเมียร์ลีก", "แมนเชสเตอร์ ซิตี้ และ นอตทิงแฮม ฟอเรสต์ เป็นสองสโมสรที่โหวตคัดค้านมติดังกล่าว โดยการเปลี่ยนแปลงกฎต้องใช้เสียงข้างมาก 2 ใน 3 หรือ 14 สโมสร", "แมนเชสเตอร์ ซิตี้ ยืนยันความบริสุทธิ์และเตรียมยื่นอุทธรณ์ โดยระบุว่าข้อสรุปของคณะกรรมการมีข้อผิดพลาดทางกฎหมายและหลักการอย่างชัดเจน"], "full_paragraphs": ["สโมสรในพรีเมียร์ลีกได้จัดการประชุมขึ้นที่ใจกลางกรุงลอนดอนเมื่อช่วงเช้าที่ผ่านมา โดยมีมติด้วยคะแนนเสียง 18-2 เห็นชอบให้ความคุ้มครองทางกฎหมาย (Indemnity) แก่สมาชิกบอร์ดบริหารของพรีเมียร์ลีก ในกรณีที่พวกเขาถูกฟ้องร้องเป็นการส่วนตัวจากคดีหมิ่นประมาท สืบเนื่องจากผลการตัดสินของคณะกรรมการอิสระที่ระบุว่า แมนเชสเตอร์ ซิตี้ ได้ทำสัญญา 'จอมปลอม' กับกลุ่มผู้สนับสนุนของสโมสร", "เหตุการณ์นี้เกิดขึ้นหลังจากเมื่อเดือนกันยายนที่ผ่านมา คณะกรรมการอิสระได้ตัดสินว่า แมนเชสเตอร์ ซิตี้ มีความผิดจริงในการละเมิดกฎทางการเงินของพรีเมียร์ลีกมากกว่า 100 กระทง ในช่วงระหว่างปี 2009 ถึง 2018 ซึ่งในขณะนี้ทางสโมสรกำลังอยู่ในระหว่างการยื่นอุทธรณ์ต่อคำตัดสินดังกล่าว", "รายงานระบุว่า เอทิฮัด แอร์เวย์ส (Etihad Airways) และ เอทิซาลาต (Etisalat) ซึ่งเป็นสองสปอนเซอร์หลักของแมนเชสเตอร์ ซิตี้ ได้ออกมาขู่ว่าจะดำเนินคดีทางกฎหมายกับพรีเมียร์ลีก โดยในส่วนของ เอทิซาลาต บริษัทสื่อสารจากอาบูดาบี ก็กำลังพิจารณาที่จะดำเนินการทางกฎหมายต่อพรีเมียร์ลีกเช่นเดียวกัน", "สำหรับการลงมติในครั้งนี้ แมนเชสเตอร์ ซิตี้ และ นอตทิงแฮม ฟอเรสต์ เชื่อกันว่าเป็นสองสโมสรที่โหวตคัดค้าน โดยการเปลี่ยนแปลงกฎระเบียบดังกล่าวจำเป็นต้องได้รับเสียงข้างมาก 2 ใน 3 หรืออย่างน้อย 14 สโมสรจึงจะผ่านความเห็นชอบ", "สมาชิกบอร์ดบริหารของพรีเมียร์ลีกที่ได้รับความคุ้มครองประกอบด้วย อลิสัน บริตเทน (ประธานบอร์ด), ริชาร์ด มาสเตอร์ส (ประธานเจ้าหน้าที่บริหาร) รวมถึงกรรมการที่ไม่ใช่ผู้บริหารอย่าง ไม ไฟฟิลด์, ดาร์มาช มิสทรี และ แมทธิว ไรเดอร์", "นอกจากนี้ คณะกรรมการอิสระยังได้ระบุว่า เป็นเรื่องที่ 'น่าเสียดาย' ที่การตัดสินคดีนี้ใช้เวลานานเกินไป โดยการไต่สวนได้เกิดขึ้นในช่วงระหว่างเดือนกันยายนถึงธันวาคม 2024", "ทางด้าน แมนเชสเตอร์ ซิตี้ ได้ออกแถลงการณ์ระบุว่า 'สโมสรไม่มีความผิดตามข้อกล่าวหาที่พรีเมียร์ลีกระบุ และมีหลักฐานที่ไม่อาจโต้แย้งได้จำนวนมากเพื่อสนับสนุนจุดยืนของสโมสรในคดีนี้ ดังนั้นสโมสรจะดำเนินการอย่างไม่ลดละ และจะดำเนินการเชิงรุกในทุกช่องทางทางกฎหมายและหน่วยงานกำกับดูแลที่เหมาะสมหากจำเป็น'", "แถลงการณ์ยังระบุต่อว่า 'กระบวนการของพรีเมียร์ลีกยังคงดำเนินอยู่ โดยมีองค์ประกอบสำคัญหลายประการที่ยังไม่เสร็จสิ้น แมนเชสเตอร์ ซิตี้ จะดำเนินการอุทธรณ์ตามช่องทางที่มีอยู่ โดยมองว่าความเห็นดังกล่าวมีข้อผิดพลาดทางกฎหมาย หลักการ และข้อเท็จจริงที่ชัดเจน และไม่ปลอดภัย'", "สโมสรยังกล่าวทิ้งท้ายว่า 'สโมสรได้เคารพกระบวนการยุติธรรมมาโดยตลอดเป็นเวลา 8 ปี บนพื้นฐานที่ว่าบอร์ดบริหารและผู้บริหารของพรีเมียร์ลีกจะทำหน้าที่เป็นหน่วยงานกำกับดูแลที่เป็นอิสระ เป็นกลาง และยุติธรรม ปราศจากอิทธิพลจากฝ่ายใดฝ่ายหนึ่ง สโมสรถูกจำกัดในการแสดงความคิดเห็นเพิ่มเติมจนกว่ากระบวนการทั้งหมดจะเสร็จสิ้น'"], "link": "https://www.skysports.com/football/news/11095/13614031/premier-league-clubs-vote-to-cover-legal-costs-if-man-city-sponsors-sue-competitions-board-members", "canonical_link": "https://www.skysports.com/football/news/11095/13614031/premier-league-clubs-vote-to-cover-legal-costs-if-man-city-sponsors-sue-competitions-board-members", "cover_image_url": "https://e2.365dm.com/26/09/1920x1080/skysports-premier-league-trophy_7361300.jpg?20260925172954", "gallery_images": ["https://e0.365dm.com/26/09/1920x1080/skysports-man-city-premier-league_7364438.jpg?20260929194250", "https://e0.365dm.com/26/09/1920x1080/skysports-manchester-city-timeline_7364398.jpg?20260929183223"], "videos": [], "review_score": "", "published_ts": 1795101960, "published_at": "2026-11-19T15:26:00Z", "published_th": "19 พ.ย. 2026 • 22:26 น.", "category_hint": "Football"}, {"id": 1795107745360, "guid": "https://www.skysports.com/football/news/11095/13613844/mario-frick-aberdeens-new-head-coach-targets-scottish-premiership-top-six-with-heavy-metal-football", "original_title": "Frick targets Premiership top-six for Aberdeen with 'heavy metal football'", "thai_title": "มาริโอ ฟริค ตั้งเป้าพา อเบอร์ดีน จบครึ่งบนของตารางด้วยสไตล์ 'เฮฟวี่เมทัลฟุตบอล'", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["มาริโอ ฟริค กุนซือคนใหม่ของ อเบอร์ดีน ประกาศเป้าหมายพาทีมจบใน 6 อันดับแรกของตารางคะแนน แม้ปัจจุบันทีมจะรั้งอันดับ 11 ก็ตาม", "ฟริคเตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมเยือน คิลมาร์น็อค วันเสาร์นี้ โดยเน้นสไตล์การเล่นแบบ 'เฮฟวี่เมทัล' ที่เน้นการเพรสซิ่งสูงและเกมรุกที่ดุดัน", "อดีตกองหน้าทีมชาติลิกเตนสไตน์รายนี้มีประสบการณ์ในการกอบกู้สถานการณ์ทีมหนีตกชั้นมาก่อนสมัยคุม ลูเซิร์น", "สถานการณ์ของ อเบอร์ดีน กำลังวิกฤตหลังแพ้รวด 4 นัดติดต่อกัน ทำให้ สตีเฟน โรบินสัน ต้องพ้นจากตำแหน่งกุนซือไปก่อนหน้านี้"], "full_paragraphs": ["มาริโอ ฟริค เฮดโค้ชคนใหม่ของ อเบอร์ดีน ยืนยันว่าเขาจะไม่พอใจเพียงแค่การพาทีมรอดพ้นจากการตกชั้นในศึกสกอตติช พรีเมียร์ชิพฤดูกาลนี้เท่านั้น แต่เขายังตั้งเป้าหมายที่จะพาทีมจบใน 6 อันดับแรกของตารางให้ได้", "กุนซือวัย 52 ปี เข้ามารับงานต่อในขณะที่ทีมรั้งอยู่อันดับที่ 11 ของตาราง หลังจากที่ สตีเฟน โรบินสัน ถูกปลดออกจากตำแหน่งหลังพาทีมบุกไปพ่ายต่อ ฮิเบอร์เนียน 4-0 ก่อนช่วงพักเบรกทีมชาติ", "ฟริค ซึ่งเคยลงสนามรับใช้ทีมชาติลิกเตนสไตน์ถึง 125 นัด เคยผ่านงานคุมทีมเยาวชนในบ้านเกิด รวมถึงเคยคุมทีม วาดุซ และ ลูเซิร์น ซึ่งเขาสามารถพาทีมหลังรอดพ้นจากการตกชั้นมาได้สำเร็จ", "เขากล่าวถึงความมั่นใจในการรับงานครั้งนี้ว่า \"ผมมีอาชีพการเป็นนักฟุตบอลอาชีพที่ยาวนานมาก ดังนั้นผมจึงรู้ดีถึงแรงกดดันและผมเป็นคนมองโลกในแง่ดีเสมอ\" เมื่อถูกถามว่าทำไมเขาถึงมั่นใจว่าจะประสบความสำเร็จ เขาเสริมว่า \"ตอนที่ผมคุม ลูเซิร์น พวกเขาอยู่อันดับสุดท้ายของตารางโดยเหลือการแข่งขันอีก 18 นัดและมีเพียง 11 คะแนน บรรยากาศโดยรวมในตอนนั้นดูหดหู่มาก แต่เราก็สามารถช่วยให้พวกเขารอดมาได้ ผมค่อนข้างมั่นใจว่าเราสามารถทำแบบเดียวกันได้ที่นี่ และผมเป็นคนที่มีความทะเยอทะยานสูงมาก มันสำคัญมากที่จะต้องพาตัวเองออกจากสถานการณ์นี้ แต่เราต้องการที่จะก้าวไปสู่ท็อปซิกซ์ให้ได้\"", "ฟริคจะประเดิมคุมทีมข้างสนามเป็นครั้งแรกในวันเสาร์นี้ด้วยการบุกไปเยือนทีมบ๊วยอย่าง คิลมาร์น็อค และเขามุ่งมั่นที่จะสร้างผลกระทบต่อทีมทันทีด้วยสไตล์ฟุตบอลของเขา \"เฮฟวี่เมทัล\" เขากล่าว \"นั่นหมายถึงการเพรสซิ่งสูง การเคาน์เตอร์เพรสซิ่ง และการเล่นเกมรุกในแนวตั้งเพื่อสร้างโอกาสทำประตูให้ได้มากที่สุด\"", "อเบอร์ดีนทำประตูในลีกฤดูกาลนี้ไปเพียง 12 ลูกและเสียไปถึง 18 af0-e41a-11f1-b37c-b3a71d7200af.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795094982, "published_at": "2026-11-19T13:29:42Z", "published_th": "19 พ.ย. 2026 • 20:29 น.", "category_hint": "Football"}, {"id": 1795101334196, "guid": "https://www.skysports.com/football/news/11095/13613875/andoni-iraolas-liverpool-start-assessed-creating-chaos-going-direct-and-fixing-leaky-defence", "original_title": "Assessing Iraola's Liverpool start", "thai_title": "ประเมินผลงาน อันโดนี อิราโอลา กับการคุมทัพ ลิเวอร์พูล ครบ 10 นัดแรกในพรีเมียร์ลีก", "tag": "Football", "sub_tag": "LIVERPOOL", "bullet_points": ["อันโดนี อิราโอลา เข้ามาคุมทีมลิเวอร์พูลได้ไม่ถึง 6 เดือน แทนที่ อาร์เน สล็อต โดยพาทีมรั้งอันดับ 4 ของตารางหลังผ่านไป 10 นัด", "สไตล์การเล่นของลิเวอร์พูลภายใต้อิราโอลาเน้นความเข้มข้นและการเพรสซิ่งสูงคล้ายยุค เจอร์เกน คล็อปป์ แต่มีการปรับเปลี่ยนแท็กติกให้มีความยืดหยุ่นมากขึ้น", "ปัญหาการป้องกันลูกตั้งเตะที่เคยเป็นจุดอ่อนสำคัญในยุคก่อนได้รับการแก้ไขอย่างเห็นได้ชัด โดยเสียประตูจากลูกเซตพีซเพียง 2 ลูกในฤดูกาลนี้", "ลิเวอร์พูลแสดงให้เห็นถึงสปิริตในการกลับมาสู่เกมได้ดีขึ้น โดยเก็บแต้มจากสถานการณ์ที่เป็นฝ่ายตามหลังได้เท่ากับที่ทำได้ตลอดทั้งฤดูกาลที่แล้ว", "เกมบิ๊กแมตช์กับ แมนเชสเตอร์ ยูไนเต็ด ในวันอาทิตย์นี้ ถือเป็นโอกาสสำคัญที่อิราโอลาจะพาทีมคว้าชัยชนะในบ้านเป็นนัดที่สองของฤดูกาล"], "full_paragraphs": ["ลิเวอร์พูลเตรียมเปิดบ้านรับการมาเยือนของคู่ปรับตลอดกาลอย่าง แมนเชสเตอร์ ยูไนเต็ด โดยกุนซือคนใหม่อย่าง อันโดนี อิราโอลา ได้คุมทีมลงเล่นในพรีเมียร์ลีกครบ 10 นัดเป็นที่เรียบร้อยแล้ว ปัจจุบัน 'หงส์แดง' รั้งอันดับ 4 ของตาราง โดยแพ้ไปเพียง 2 นัดเท่านั้นในลีก", "อิราโอลาเข้ามารับงานในถิ่นแอนฟิลด์ได้ไม่ถึง 6 เดือน หลังจากเข้ามาแทนที่ อาร์เน สล็อต ในเดือนมิถุนายนที่ผ่านมา สืบเนื่องจากผลงานการป้องกันแชมป์พรีเมียร์ลีกที่ย่ำแย่ในฤดูกาลก่อนภายใต้การคุมทีมของกุนซือชาวดัตช์ ซึ่งจบเพียงอันดับ 5 และมีคะแนนน้อยกว่าฤดูกาลที่คว้าแชมป์ถึง 24 คะแนน", "อิราโอลาถูกดึงตัวเข้ามาเพื่อกอบกู้สถานการณ์และนำลิเวอร์พูลกลับสู่เส้นทางแห่งชัยชนะอีกครั้ง ด้วยสไตล์ฟุตบอลแบบ 'เฮฟวีเมทัล' ที่เน้นเกมรุกดุดันและสร้างความตื่นเต้นให้กับแฟนบอล เหมือนกับที่เขาเคยทำได้สำเร็จตลอด 3 ฤดูกาลกับ บอร์นมัธ", "เมื่อผ่านไป 10 นัดในลีก ลิเวอร์พูลภายใต้การคุมทีมของอิราโอลาแสดงให้เห็นถึงความเข้มข้นที่เพิ่มขึ้นอย่างชัดเจน ซึ่งแตกต่างจากฟอร์มการเล่นที่ดูเชื่องช้าในฤดูกาลที่ผ่านมา โดย เวอร์จิล ฟาน ไดค์ กัปตันทีมกล่าวว่า \"มันเป็นยุคสมัยที่แตกต่างออกไป ภายใต้เจอร์เกน เราเพรสซิ่งด้วยการขยับตำแหน่งและพยายามบีบให้คู่แข่งเล่นในพื้นที่แคบ แต่ฟุตบอลมันเปลี่ยนไปแล้ว\"", "ฟาน ไดค์ กล่าวเสริมว่า \"สิ่งที่ยังเหมือนเดิมคือจำนวนการสปรินต์ การวิ่ง และความพยายามในการแย่งบอลกลับมาให้เร็วที่สุด คุณต้องสร้างความโกลาหล แย่งบอลจังหวะสอง และเข้าปะทะ ซึ่งนั่นคือสิ่งที่เรากำลังเรียนรู้\" โดยอิราโอลาได้นำแท็กติกการประกบตัวแบบตัวต่อตัวมาใช้ในบางจังหวะ ซึ่งฟาน ไดค์ยอมรับว่าเป็นความท้าทายในการอ่านเกมเมื่อคู่แข่งพยายามล่อให้ทีมหลุดตำแหน่ง", "ความไม่แน่นอนของตำแหน่งแนวรุกเป็นอีกหนึ่งกลยุทธ์ของอิราโอลาที่ใช้สลับสับเปลี่ยนผู้เล่นเพื่อสร้างความประหลาดใจให้กับคู่แข่ง รวมถึงการปรับเปลี่ยนสไตล์การเล่นให้มีความหลากหลายมากขึ้น ซึ่งรวมถึงการวางบอลยาวจากแนวรับเพื่อทำลายการเพรสซิ่งของคู่ต่อสู้ โดยสถิติระบุว่าลิเวอร์พูลเล่นบอลยาวเฉลี่ย 50.8 ครั้งต่อเกมในฤดูกาลนี้ มากกว่าฤดูกาลที่แล้ว (46.3 ครั้ง) และฤดูกาลสุดท้ายของคล็อปป์ (49.6 ครั้ง)", "ฟาน ไดค์ อธิบายถึงความสมดุลว่า \"คุณต้องปรับตัวให้ได้ ผู้จัดการทีมวางแผนมา แต่เราในฐานะนักเตะมีความรับผิดชอบในการลงไปปฏิบัติและคว้าชัยชนะ เราต้องเล่นให้ตรงไปตรงมามากขึ้นและนั่นช่วยให้เราแย่งบอลในแดนบนได้สำเร็จ เราต้องหาจุดสมดุลที่เหมาะสมระหว่างการเล่นผ่านบอลหรือการวางบอลยาว\"", "จุดที่ลิเวอร์พูลพัฒนาขึ้นอย่างมากคือการป้องกันลูกตั้งเตะ ซึ่งเคยเป็นจุดอ่อนสำคัญที่เสียไปถึง 23 ประตูในฤดูกาลที่แล้ว แต่ในฤดูกาลนี้ทีมเสียจากลูกเซตพีซเพียง 2 ประตูเท่านั้น โดยอิราโอลายกเครดิตให้กับทีมงานสตาฟฟ์โค้ชอย่าง ทอมมี เอลฟิก และ ชอน คูเปอร์ รวมถึงการมี โรนัลด์ อเราโฮ เข้ามาช่วยเพิ่มความแข็งแกร่งในเกมรับ", "นับตั้งแต่การเข้ามาของอเราโฮในเดือนกันยายน ลิเวอร์พูลเสียประตูในลีกไปเพียง 3 ลูกเท่านั้นเมื่อมีผู้เล่นครบ 11 คน ซึ่งถือว่าดีขึ้นมากเมื่อเทียบกับฤดูกาลที่แล้วที่เสียไปถึง 53 ประตู นอกจากนี้ ทีมยัง skysports.com/football/news/11095/13613937/premier-league-fixtures-on-sky-sports-man-city-vs-arsenal-and-man-utd-vs-liverpool-live-in-january", "original_title": "Man City vs Arsenal and Man Utd vs Liverpool live on Sky in January", "thai_title": "สกายสปอร์ตส์ยืนยันโปรแกรมพรีเมียร์ลีกเดือนมกราคม บิ๊กแมตช์ แมนฯ ซิตี้ ดวล อาร์เซนอล และ แมนฯ ยูไนเต็ด พบ ลิเวอร์พูล", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["สกายสปอร์ตส์ประกาศโปรแกรมการแข่งขันพรีเมียร์ลีกช่วงเดือนมกราคมถึงต้นเดือนกุมภาพันธ์ โดยมีการถ่ายทอดสดรวม 18 นัด", "ไฮไลท์สำคัญคือศึกบิ๊กแมตช์ระหว่าง แมนเชสเตอร์ ซิตี้ พบกับ อาร์เซนอล และ แมนเชสเตอร์ ยูไนเต็ด เปิดบ้านรับการมาเยือนของ ลิเวอร์พูล", "การถ่ายทอดสดเริ่มต้นด้วย แมนเชสเตอร์ ยูไนเต็ด ภายใต้การคุมทีมของ เมาริซิโอ โปเช็ตติโน บุกเยือน แอสตัน วิลลา ในวันเสาร์ที่ 16 มกราคม", "สกายสปอร์ตส์ยืนยันการถ่ายทอดสดฟุตบอลพรีเมียร์ลีกตลอดฤดูกาล 2026/27 รวมไม่ต่ำกว่า 215 นัด", "โปรแกรมการแข่งขันยังรวมถึงคู่มันเดย์ไนท์ที่น่าสนใจอย่าง ลีดส์ ยูไนเต็ด พบกับ เชลซี ที่สนามเอลแลนด์โรด"], "full_paragraphs": ["สกายสปอร์ตส์ได้ประกาศยืนยันโปรแกรมการแข่งขันฟุตบอลพรีเมียร์ลีกอย่างเป็นทางการสำหรับช่วงเดือนมกราคม โดยมีแมตช์สำคัญที่แฟนบอลตั้งตารออย่างการที่ อาร์เซนอล จะยกพลไปเยือน แมนเชสเตอร์ ซิตี้ และการที่ แมนเชสเตอร์ ยูไนเต็ด จะเปิดรังโอลด์แทรฟฟอร์ดรับการมาเยือนของ ลิเวอร์พูล ซึ่งทั้งสองคู่ถือเป็นไฮไลท์สำคัญที่จะมีการถ่ายทอดสดผ่านทางสกายสปอร์ตส์", "การประกาศโปรแกรมล่าสุดนี้ได้เพิ่มจำนวนการถ่ายทอดสดของสกายสปอร์ตส์อีก 18 นัด ครอบคลุมช่วงเดือนมกราคมไปจนถึงวันที่ 1 กุมภาพันธ์ โดยจะเริ่มต้นความมันด้วยการที่ แมนเชสเตอร์ ยูไนเต็ด ภายใต้การคุมทีมของ เมาริซิโอ โปเช็ตติโน จะบุกไปเยือน แอสตัน วิลลา ในวันเสาร์ที่ 16 มกราคม เวลา 17.30 น. (ตามเวลาท้องถิ่น)", "ในสุดสัปดาห์ถัดมา แชมป์เก่าอย่าง อาร์เซนอล จะเปิดบ้านต้อนรับการมาเยือนของ นิวคาสเซิล ยูไนเต็ด ในรายการ 'Saturday Night Football' เวลา 17.30 น. นอกจากนี้ยังมีโปรแกรม 'Super Sunday' ที่อัดแน่นไปด้วยความตื่นเต้นถึง 4 คู่ โดยปิดท้ายด้วยศึกแห่งศักดิ์ศรีระหว่าง แมนเชสเตอร์ ยูไนเต็ด ที่จะเปิดบ้านพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในเว hettino-at-manchester-united-new-boss-vows-to-change-situation-at-old-trafford-in-first-interview", "original_title": "Pochettino vows to 'change things' at Man Utd", "thai_title": "เมาริซิโอ โปเช็ตติโน่ ลั่นพร้อม 'เปลี่ยนแปลง' แมนเชสเตอร์ ยูไนเต็ด หวังปลุกศักยภาพทีมคืนฟอร์มเก่ง", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ เข้ารับตำแหน่งกุนซือแมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการ พร้อมประกาศกร้าวเตรียมปรับเปลี่ยนทีมเพื่อทวงคืนความสำเร็จ", "ภารกิจเร่งด่วนของกุนซือชาวอาร์เจนไตน์คือการดึงศักยภาพของนักเตะชุดปัจจุบันออกมาให้ได้มากที่สุด แทนที่จะจดจ่ออยู่กับปัญหาที่เกิดขึ้น", "แมนเชสเตอร์ ยูไนเต็ด กำลังเผชิญสถานการณ์ยากลำบาก รั้งอันดับ 18 ของตารางพรีเมียร์ลีก ก่อนที่โปเช็ตติโน่จะประเดิมคุมทีมบุกเยือน ลิเวอร์พูล ในวันอาทิตย์นี้", "สโมสรเตรียมสนับสนุนงบประมาณเสริมทัพในตลาดเดือนมกราคม โดยเล็งเป้าหมายไปที่ตำแหน่งแบ็กซ้าย เซ็นเตอร์แบ็ก และกองหน้า", "โปเช็ตติโน่เน้นย้ำว่าต้องให้ความสำคัญกับการทำงานร่วมกับขุมกำลังที่มีอยู่ก่อนในช่วง 10 นัดข้างหน้า ก่อนที่ตลาดซื้อขายนักเตะจะเปิดขึ้น"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ ได้ให้คำมั่นสัญญาว่าจะ 'เปลี่ยนแปลงสิ่งต่างๆ' ที่โอลด์ แทรฟฟอร์ด ในการให้สัมภาษณ์ครั้งแรกอย่างมั่นใจในฐานะผู้จัดการทีมแมนเชสเตอร์ ยูไนเต็ด คนใหม่", "กุนซือชาวอาร์เจนไตน์เดินทางมาถึงโอลด์ แทรฟฟอร์ด หลังจากอำลาตำแหน่งหัวหน้าผู้ฝึกสอนทีมชาติสหรัฐอเมริกา โดยได้รับภารกิจสำคัญในการกอบกู้สถานการณ์ของปีศาจแดงหลังจากเริ่มต้นฤดูกาลได้อย่างย่ำแย่ ปัจจุบันแมนเชสเตอร์ ยูไนเต็ด รั้งอันดับที่ 18 ของตารางพรีเมียร์ลีก ก่อนที่โปเช็ตติโน่จะประเดิมคุมทีมข้างสนามนัดแรกในเกมบุกไปเยือน ลิเวอร์พูล ที่แอนฟิลด์ในวันอาทิตย์นี้ ซึ่งจะมีการถ่ายทอดสดทาง Sky Sports", "โปเช็ตติโน่เชื่อว่าจะเป็นความผิดพลาดหากมุ่งเน้นไปที่สถานการณ์อันเลวร้ายในปัจจุบันเพียงอย่างเดียว โดยเขายืนกรานว่าศักยภาพของสโมสรต่างหากที่ควรจะเป็นจุดเริ่มต้นสำหรับการทำงานของเขา", "เขากล่าวในการให้สัมภาษณ์ครั้งแรกในฐานะเฮดโค้ชของยูไนเต็ดว่า 'ผมคิดว่ามันเป็นความผิดพลาดหากเรามองแต่สถานการณ์ที่เป็นอยู่ เราจำเป็นต้องมองเห็นศักยภาพของสโมสรแห่งนี้'", "'มันถึงเวลาแล้วที่จะเริ่มลงมือทำและเปลี chester-united_7410113.jpg?20261119072308", "gallery_images": ["https://e0.365dm.com/26/11/1920x1080/skysports-football-manchester-united_7409250.jpg?20261118072425", "https://e0.365dm.com/26/11/1920x1080/skysports-man-utd-transfer_7408997.jpg?20261117183950", "https://e0.365dm.com/26/11/1920x1080/skysports-manchester-united_7405978.jpg?20261113172941"], "videos": [], "review_score": "", "published_ts": 1795086000, "published_at": "2026-11-19T11:00:00Z", "published_th": "19 พ.ย. 2026 • 18:00 น.", "category_hint": "Football"}, {"id": 1795086935969, "guid": "https://www.skysports.com/football/news/11095/13612519/chelsea-ten-things-weve-learnt-about-xabi-alonsos-blues-after-10-premier-league-games", "original_title": "Consistently inconsistent? Ten things we've learnt about Alonso's Chelsea so far", "thai_title": "สม่ำเสมอในความไม่สม่ำเสมอ? 10 สิ่งที่ได้เรียนรู้จากเชลซีในยุคของ ชาบี อลอนโซ", "tag": "Football", "sub_tag": "CHELSEA", "bullet_points": ["ปัญหาผู้รักษาประตูยังคงเป็นโจทย์ใหญ่ โดย ไมค์ เพนเดอร์ส เริ่มทำผลงานได้น่าประทับใจกว่า เอมิเลียโน มาร์ติเนซ", "เชลซีภายใต้การคุมทีมของ อลอนโซ ยังขาดความคงเส้นคงวาและยังไม่สามารถสร้างอัตลักษณ์การเล่นที่ชัดเจนได้", "การขาดแคลนกองหน้าตัวเป้าธรรมชาติส่งผลกระทบต่อเกมรุก แม้จะได้ โจเอา เปโดร มาเป็นตัวความหวังก็ตาม", "การทดลองใช้แผนการเล่นที่หลากหลายทั้งหลังสามและหลังสี่ สะท้อนให้เห็นว่ากุนซือชาวสเปนยังคงค้นหาสูตรสำเร็จที่ลงตัวที่สุด", "โคล พาลเมอร์ และ โจเอา เปโดร กลายเป็นหัวใจสำคัญในเกมรุก แต่ทีมยังคงมีปัญหาเรื่องความสมดุลในแดนกลาง"], "full_paragraphs": ["ผ่านไปแล้ว 10 นัดในพรีเมียร์ลีกสำหรับโปรเจกต์ของ ชาบี อลอนโซ ที่เชลซี ซึ่งมีประเด็นให้ต้องขบคิดมากมาย ตั้งแต่การแย่งชิงตำแหน่งมือหนึ่ง การจัดระเบียบแดนกลาง ไปจนถึงระบบการเล่นและลูกตั้งเตะ นี่คือ 10 สิ่งที่เราได้เรียนรู้จากช่วงเริ่มต้นของกุนซือชาวสเปนในถิ่นสแตมฟอร์ด บริดจ์", "ตำแหน่งผู้รักษาประตูเป็นปัญหาเรื้อรังของเชลซีมานาน แม้ อลอนโซ จะพูดถึงตัวเลือกที่มีอยู่ด้วยความมั่นใจหลังเข้ามารับงาน แต่ฟอร์มการเล่นที่น่าผิดหวังของ โรเบิร์ต ซานเชซ ในเกมแรกที่พบกับฟูแล่ม บีบให้สโมสรต้องขยับตัว โดยการคว้าตัว เอมิเลียโน มาร์ติเนซ เจ้าของแชมป์ฟุตบอลโลก 2022 ดูจะเป็นทางเลือกที่ชัดเจน ทว่านายทวารวัย 34 ปีกลับเสียถึง 3 ประตูในนัดประเดิมสนามกับไบรท์ตันและยังดูไม่มั่นคงนัก", "อาการบาดเจ็บของมาร์ติเนซเปิดโอกาสให้ดาวรุ่งฟอร์มแรงอย่าง ไมค์ เพนเดอร์ส ได้ลงสนาม แม้การทำเข้าประตูตัวเองในเกมพบสเปอร์สจะเป็นการเริ่มต้นที่เลวร้าย แต่การตอบสนองของเขานั้นน่าประทับใจ โดยสถิติระบุว่าเพนเดอร์สมีค่า Expected Goals Against (xGA) ที่เป็นบวก (เสียเพียง 3 ประตูจากโอกาสที่ควรจะเสีย 4.49) ในขณะที่มาร์ติเนซมีค่าเป็นลบ (เสีย 11 ประตูจากโอกาสที่ควรจะเสีย 9.17) ซึ่งทำให้อลอนโซต้องกลับมาทบทวนเรื่องมือหนึ่งอีกครั้ง", "เชลซีในฤดูกาลนี้มีความสม่ำเสมอในความไม่สม่ำเสมอ พวกเขาฟื้นตัวจากผลเสมอฮัลล์และพ่ายแพ้ต่อเบรนท์ฟอร์ดด้วยการถล่มบอร์นมัธ 5-1 แต่ความพ่ายแพ้ต่อสเปอร์สและซันเดอร์แลนด์ก็ทำให้ความคาดหวังลดลง หลังจากผ่านไป 10 นัด พวกเขาตามหลังอาร์เซนอลถึง 11 คะแนน และดูเหมือนจะยังห่างไกลจากการเป็นผู้ท้าชิงแชมป์", "ทีมชนะติดต่อกันในลีกเพียง 2 ครั้งเท่านั้น และยังไม่มีหลักฐานชัดเจนว่ากำลังสร้างอัตลักษณ์การเล่นที่แน่นอน อลอนโซย้ำเสมอว่าทีมจะดูแตกต่างไปจากนี้ในเดือนพฤษภาคม แต่เส้นทางสู่จุดหมายนั้นยังไม่ชัดเจน แม้จะแพ้ไปแล้ว 4 นัด แต่เชลซียังอยู่ในตำแหน่งที่ดีสำหรับการลุ้นพื้นที่ยูฟ่า แชมเปียนส์ลีก", "แนวทางการจัดการปัญหาอาการบาดเจ็บของ โจเอา เปโดร กลายเป็นประเด็นถกเถียง เชลซีเริ่มเกมโดยไม่มีกองหน้าอาชีพในนัดพบสเปอร์ส, แมนฯ ยูไนเต็ด และซันเดอร์แลนด์ โดย แดนนี เวลเบ็ค ได้ลงสนามเพียงไม่กี่นาทีในฐานะตัวสำรอง การที่สโมสรไม่ไว้วางใจเวลเบ็คและ เอ็มมานูเอล เอเมก้า รวมถึงการขาย ลิแอม ดีแลป, นิโคลัส แจ็คสัน และ มาร์ค กิว ออกไป ทำให้เชลซีดูขาดแคลนตัวเลือกในแดนหน้า", "มอร์แกน โรเจอร์ส และ เปโดร เนโต้ ถูกจับไปเล่นเป็น 'ฟอลส์ไนน์' (False Nine) แม้โรเจอร์สจะพอมีบทบาทบ้าง แต่การใช้เนโต้ในตำแหน่งนี้เป็นเรื่องที่เข้าใจยาก เวลเบ็คเองก็ทำผลงานได้ไม่ดีนักในบอลถ้วย เชลซีขาดจุดศูนย์กลางในแดนหน้า แม้จะมีสถิติการทำประตู (19 ประตู) สูงกว่าค่า Expected Goals (15.9) ซึ่งสะท้อนถึงการยิงประตูที่ยอดเยี่ยม แต่ก็ตั้งคำถามถึงความยั่งยืนในระยะยาวหลังจากยิงประตูไม่ได้ในเกมกับสเปอร์สและซันเดอร์แลนด์", "ในช่วงปรีซีซันมีการถกเถียงกันว่า อลอนโซ จะใช้แผนหลังสามที่เขาใช้ได้ดีกับไบเออร์ เลเวอร์คูเซน หรือหลังสี่แบบที่เขาเคยใช้ที่เรอัล มาดริด คำตอบคือเขาใช้ทั้งสองแบบ โดยเชลซีเริ่มเกมด้วยหลังสี่ไป 6 นัด และหลังสาม 4 นัด อลอนโซเน้นย้ำว่ารูปเกมระหว่างแข่งสำคัญกว่าแผนผัง แต่การปรับเปลี่ยนบ่อยครั้งแสดงให้เห็นว่าเขายังคงค้นหาสูตรที่ใช่ ซึ่งส่งผลต่อฟอร์มการเล่นที่ไม่นิ่งของทีม", "นอกจากแผนการเล่น สไตล์การเล่นของเชลซีภายใต้อลอนโซก็ถูกตั้งคำถาม ในครึ่งหนึ่งของจำนวนนัดที่ผ่านมา เชลซีครองบอลได้มากกว่าคู่แข่ง แต่ในอีกครึ่งหนึ่งกลับไม่ใช่เช่นนั้น โดยเฉพาะเกมที่ชนะไบรท์ตัน 4-3 ที่พวกเขาครองบอลเพียง 26% และเกมในบ้านที่แพ้สเปอร์สซึ่งครองบอลเพียง 31% สร้างความหงุดหงิดให้กับแฟนบอลอย่างมาก", "อลอนโซยอมรับว่าเขาต้องการให้ทีมครองบอลได้ดีขึ้น ซึ่งเป็นข้อความที่เขาเน้นย้ำในช่วงพักครึ่งเกมกับแมนฯ ยูไนเต็ด ในฐานะอดีตจอมทัพแดนกลาง อลอนโซให้ความสำคัญกับพื้นที่นี้มาก แต่เขากลับทดลองใช้คู่หูแดนกลางถึง 6 รูปแบบ การขาดหายไปของ มอยเซส ไกเซโด้ และ รีซ เจมส์ ส่งผลกระทบอย่างหนัก แม้ โรมิโอ ลาเวีย จะทำผลงานได้ดี แต่การขาย เอ็นโซ เฟร์นานเดซ ออกไปในช่วงท้ายตลาดโดยไม่มีตัวแทนที่เหมาะสมกลายเป็นปัญหาใหญ่ที่อาจต้องแก้ไขในเดือนมกราคม", "ในส่วนของลูกตั้งเตะ การดึงตัว ออสติน แมคฟี โค้ชชื่อดังจากแอสตัน วิลลา มาร่วมทีมถือเป็นเรื่องน่าสนใจ แต่ผลลัพธ์ยังก้ำกึ่ง เชลซียิงจากลูกตั้งเตะได้ 6 ประตู (ไม่รวมจุดโทษของพาลเมอร์) แต่ก็เสียประตูจากลูกตั้งเตะไปถึง 6 ประตูเช่นกัน ซึ่งเป็นจุดที่อลอนโซและแมคฟีต้องเร่งแก้ไข", "การแจ้งเกิดของ โจเอา เปโดร ทำให้โอกาสของ เอสเตเวา ดาวรุ่งชาวบราซิลลดน้อยลง ซึ่งกลายเป็นประเด็นที่แฟนบอลไม่พอใจ เนื่องจากเอสเตเวาเป็นขวัญใจของแฟนๆ การที่เขาได้ลงตัวจริงในพรีเมียร์ลีกเพียงนัดเดียวเป็นสถานการณ์ที่อลอนโซต้องบริหารจัดการให้ดี เพราะหากปล่อยให้ดาวรุ่งรายนี้เป็นเพียงตัวสำรองต่อไป สถานการณ์อาจไม่ยั่งยืน", "เสื้อหมายเลข 9 ของเชลซีมักเป็นภาระหนักสำหรับผู้สวมใส่ แต่ โจเอา เปโดร กำลังทำลายอาถรรพ์นั้น ด้วยผลงาน 5 ประตู 3 แอสซิสต์จากการลงเล่น 6 นัดในพรีเมียร์ลีก เกมรุกของเชลซีดูไหลลื่นขึ้นมากเมื่อเขายืนเป็นหัวหอก และเขากลายเป็นผู้เล่นที่สำคัญที่สุดของอลอนโซไปแล้ว โดยเชลซียิงได้เพียง 2 ประตูจาก 4 นัดที่เขาไม่ได้ลงสนาม", "โคล พาลเมอร์ และ มอร์แกน โรเจอร์ส เป็นเพียงสองคนที่ได้ลงตัวจริงครบทั้ง 10 นัด พาลเมอร์เริ่มกลับมาโชว์ฟอร์มเก่งและดูฟิตสมบูรณ์ขึ้น แม้ผลงานจะยังไม่สม่ำเสมอ แต่เขากลายเป็นคนละคนเมื่อมี โจเอา เปโดร ยืนอยู่ข้างหน้า อย่างไรก็ตาม การที่เขาถูกไล่ออกในเกมกับสเปอร์สแสดงให้เห็นถึงความหงุดหงิดที่เขามีต่อสถานการณ์ของทีม และสถานะในทีมชาติอังกฤษของเขาก็ยังคงเป็นประเด็นที่ถูกพูดถึงอย่างต่อเนื่อง"], "link": "https://www.skysports.com/football/news/11095/13612519/chelsea-ten-things-weve-learnt-about-xabi-alonsos-blues-after-10-premier-league-games", "canonical_link": "https://www.skysports.com/football/news/11095/13612519/chelsea-ten-things-weve-learnt-about-xabi-alonsos-blues-after-10-premier-league-games", "cover_image_url": "https://e1.365dm.com/26/11/1920x1080/skysports-premier-league-chelsea_7408490.jpg?20261117103110", "gallery_images": ["https://e0.365dm.com/26/09/1920x1080/skysports-leeds-penders-chelsea_7346483.jpg?20260909205405", "https://e0.365dm.com/26/10/1920x1080/skysports-carragher-alonso_7385400.jpg?20261024112419", "https://e0.365dm.com/26/08/1920x1080/skysports-chelsea-luton_7333026.jpg?20260827192252", "https://e0.365dm.com/26/11/1920x1080/skysports-chelsea-formation_7407201.png?20261115174201", "https://e0.365dm.com/26/11/1920x1080/skysports-chelsea-formation_7407202.png?20261115174229", "https://e0.365dm.com/26/11/1920x1080/skysports-chelsea-formation_7407203.png?20261115174256", "https://e0.365dm.com/26/11/1920x1080/skysports-cole-palmer-awards_7399726.jpg?20261107082451", "https://e0.365dm.com/26/10/1920x1080/skysports-football-chelsea_7373526.jpg?20261010183839"], "videos": [], "review_score": "", "published_ts": 1795086000, "published_at": "2026-11-19T11:00:00Z", "published_th": "19 พ.ย. 2026 • 18:00 น.", "category_hint": "Football"}, {"id": 1795087841910, "guid": "https://www.skysports.com/football/news/11095/13612885/everton-how-premier-leagues-sleeping-giant-are-exceeding-expectations-ahead-of-brentford-test", "original_title": "How 'sleeping giant' Everton are exceeding expectations", "thai_title": "ยักษ์หลับคืนชีพ! เอฟเวอร์ตันภายใต้การคุมทีมของ เดวิด มอยส์ กับผลงานที่เกินความคาดหมาย", "tag": "Football", "sub_tag": "EVERTON", "bullet_points": ["เอฟเวอร์ตันทำผลงานได้อย่างยอดเยี่ยมในฤดูกาลนี้ โดยรั้งอันดับ 6 ของตารางพรีเมียร์ลีก และมีลุ้นพื้นที่ฟุตบอลยุโรปอย่างเต็มตัว", "เดวิด มอยส์ กุนซือจอมเก๋า กำลังจะสร้างประวัติศาสตร์คุมทีมเอฟเวอร์ตันครบ 493 นัด ซึ่งเป็นสถิติสูงสุดของสโมสร", "เธียร์โน แบร์รี กองหน้าตัวหลักโชว์ฟอร์มร้อนแรง ยิงไปแล้ว 6 ประตูจากการลงเล่น 10 นัดแรกในลีก", "แม้จะมีข้อจำกัดด้านขนาดของขุมกำลังนักเตะ แต่ทีมสามารถยกระดับการเล่นและรักษามาตรฐานได้ดีกว่าฤดูกาลที่ผ่านมา", "สโมสรเตรียมวางแผนเสริมทัพในตลาดซื้อขายนักเตะเดือนมกราคม เพื่อป้องกันปัญหาขุมกำลังไม่เพียงพอในช่วงท้ายฤดูกาล"], "full_paragraphs": ["หลังจากผ่านช่วงซัมเมอร์ที่ยากลำบาก เอฟเวอร์ตันกำลังพิสูจน์ให้เห็นว่าพวกเขามีศักยภาพที่เหนือกว่าภาพรวมของนักเตะที่มีอยู่ ด้วยการเดินหน้าลุ้นพื้นที่ฟุตบอลยุโรปและโชว์ฟอร์มการเล่นที่ดุดัน โดยทีมมีคิวจะพบกับ เบรนท์ฟอร์ด ในศึก 'มันเดย์ ไนท์ ฟุตบอล' ทางช่อง Sky Sports", "บรรยากาศที่เอฟเวอร์ตันค่อนข้างหม่นหมองหลังปิดตลาดซื้อขายนักเตะช่วงซัมเมอร์ โดย เดวิด มอยส์ ใช้คำว่า 'น่าผิดหวัง' ในการอธิบายสถานการณ์ โดยเฉพาะหลังจากดีลคว้าตัว โฟลาริน บาโลกัน ในวันสุดท้ายไม่ประสบความสำเร็จ", "มอยส์กล่าวมาตลอดว่า 'ทอฟฟี่สีน้ำเงิน' จำเป็นต้องมีผู้เล่นเพิ่ม แต่แม้จะมีการประกาศต่อสาธารณะ เอฟเวอร์ตันก็เหลือผู้เล่นชุดใหญ่เพียง 18 คน และมีกองหน้าอาชีพเพียงคนเดียวจนกว่าจะถึงเดือนมกราคม ซึ่งเป็นสถานการณ์ที่เข้าใจได้ว่าทำไมมอยส์ถึงรู้สึกหงุดหงิด หลังจากที่ทีมพลาดโอกาสไปเล่นฟุตบอลยุโรปเมื่อฤดูกาลที่แล้วจนถูกมองว่าอาจต้องหนีตกชั้น", "กุนซือชาวสกอตกล่าวเมื่อเร็วๆ นี้ว่า \"ความคาดหวังของผมเปลี่ยนไปในช่วงตลาดซื้อขาย ผมไม่คิดว่าเอฟเวอร์ตันจะทุ่มเงินหลายร้อยล้านเพื่อยกระดับทีมได้ ดังนั้นสิ่งที่ผมทำได้คือการพัฒนาทีละเล็กละน้อยให้ดีขึ้นในทุกปี ซึ่งตอนแรกผมคิดว่ามันจะยากกว่านี้มาก แต่ผู้เล่นทุกคนกำลังทำผลงานได้อย่างยอดเยี่ยมกับอันดับในลีกปัจจุบัน\"", "ความคาดหวังทั้งหมดถูกทำลายลงด้วยผลงานที่เกินคาด เอฟเวอร์ตันกำลังลุ้นพื้นที่ยุโรปอย่างจริงจัง โดยรั้งอันดับ 6 ของพรีเมียร์ลีก ห่างจากท็อปโฟร์เพียง 2 แต้ม นอกจากนี้ยังผ่านเข้าสู่รอบก่อนรองชนะเลิศของ คาราบาว คัพ โดยจะพบกับ ฟลีตวูด ในเดือนหน้า", "เคียร์แนน ดิวส์บิวรี-ฮอลล์ กองกลางของเอฟเวอร์ตันกล่าวกับ Sky Sports ว่า \"นี่คือสโมสรที่ยิ่งใหญ่ เป็นยักษ์หลับของวงการฟุตบอลอังกฤษ ผมต้องการทำอะไรบางอย่างกับสโมสรแห่งนี้ หรือคว้าถ้วยรางวัลมาครองเพื่อมอบความสุขให้กับแฟนบอล\"", "แม้ฤดูกาลจะเพิ่งเริ่มต้น แต่ความเชื่อมั่นในทีมนั้นชัดเจน เอฟเวอร์ตันกำลังพิสูจน์ว่าพวกเขาแข็งแกร่งกว่าที่ใครคาดคิดภายใต้การนำของมอยส์ เอฟเวอร์ตันต้องทำงานหนักเพื่อเก็บแต้ม โดยในเกมที่เสมอ บอร์นมัธ และ แมนเชสเตอร์ ยูไนเต็ด พวกเขาทำประตูได้ในช่วงนาทีที่ 83 เป็นต้นไป และต้องพึ่งพาประตูในนาทีที่ 80 ของ ชาร์ลี อัลการาซ เพื่อเอาชนะ วูล์ฟแฮมป์ตัน ในคาราบาว คัพ รอบสาม", "ทอฟฟี่สีน้ำเงินยังพลิกสถานการณ์จากที่ตามหลัง โคเวนทรี ในเกมพรีเมียร์ลีกนัดล่าสุดก่อนช่วงพักเบรกทีมชาติ กลับมาเอาชนะได้ 3-1 แม้จะมีโชคช่วยอยู่บ้าง แต่แฟนบอลอาจมองว่าถึงเวลาแล้วที่พวกเขาควรได้รับผลการแข่งขันที่ดีบ้าง", "หลังจบเกมดังกล่าว ดิวส์บิวรี-ฮอลล์ กล่าวว่า \"ทัศนคติของเราในปีนี้แข็งแกร่งขึ้นเรื่อยๆ... เราไม่เคยยอมแพ้แม้จะตกเป็นรอง ทุกครั้งที่เราโดนนำในฤดูกาลนี้ เราตอบสนองกลับมาในเชิงบวกเสมอ\"", "ที่สำคัญคือพวกเขาสามารถปิดเกมได้เมื่อจำเป็น โดยมีชัยชนะและคลีนชีตในเกมพบกับ คริสตัล พาเลซ, อิปสวิช และ นิวคาสเซิล รวมถึงการเอาชนะ 'สาลิกาดง' ในคาราบาว คัพ รอบสี่ ได้อย่างขาดลอย 3-1 โดยทีมแพ้เพียง 2 นัดเท่านั้น คือการแพ้ เชลซี ในบ้าน และแพ้ อาร์เซนอล ทีมแชมป์เก่าในฐานะทีมเยือน ซึ่งไม่ใช่ผลการแข่งขันที่เลวร้าย", "หลังเอาชนะ นิวคาสเซิล ในพรีเมียร์ลีก มอยส์กล่าวว่า \"เรากำลังสร้างโอกาสได้ นั่นคือสิ่งที่สำคัญที่สุดสำหรับผม เราต้องการเป็นทีมที่สร้างโอกาสได้มากขึ้น ถ้าเราเล่นเกมรุกได้มากกว่านี้ นั่นคือสิ่งที่ผมต้องการ\"", "มอยส์กำลังสมหวัง เอฟเวอร์ตันทำผลงานได้ดีกว่าหรือเทียบเท่ากับสถิติเมื่อฤดูกาลที่แล้ว แม้จำนวนประตูต่อเกมจะใกล้เคียงกัน แต่พวกเขามีสถิติการยิงประตูและค่า xG ที่สูงขึ้น ส่วนสำคัญมาจากฟอร์มของ เธียร์โน แบร์รี กองหน้าตัวหลักที่เพื่อนร่วมทีมอย่าง ดิวส์บิวรี-ฮอลล์ กล่าวว่า \"เขากลับมาหลังจบซัมเมอร์เหมือนเป็นคนละคน\"", "แบร์รีเล่นตรงกลางมากขึ้นกว่าปีที่แล้ว และใกล้จะทำลายสถิติส่วนตัวจากทั้งฤดูกาลที่แล้วได้แม้เพิ่งลงเล่นไปเพียง 10 นัด เขายิงประตูได้ 3 นัดติดต่อกันเป็นครั้งแรก อย่างไรก็ตาม เขายังพลาดโอกาสทองไปถึง 16 ครั้ง ซึ่งมากที่สุดในพรีเมียร์ลีกฤดูกาลนี้ หากเขามีความเฉียบคมมากกว่านี้ เขาอาจเป็นตัวเต็งลุ้นรางวัลรองเท้าทองคำ", "สถิติของ แบร์รี คือการยิง 6 ประตูจากการลงเล่น 10 นัดแรก ซึ่งถือว่าดีที่สุดนับตั้งแต่ โดมินิก คัลเวิร์ต-เลวิน ทำไว้ในปี 2020-21 และเป็นผู้เล่นที่ไม่ใช่ชาวอังกฤษที่ทำผลงานได้ดีที่สุดนับตั้งแต่ โรเมลู ลูกากู ในปี 2016-17 โดยแบร์รีมีส่วนร่วมถึง 6 จาก 7 ประตูหลังสุดของทีม", "อีกหนึ่งผู้เล่นที่ฟอร์มโดดเด่นคือ ดิวส์บิวรี-ฮอลล์ ซึ่งได้รับคำชมจาก เจมี เรดแนปป์ นักวิเคราะห์ของ Sky Sports โดยเฉพาะในบทบาทหมายเลข 10 ที่คอยขับเคลื่อนเกมรุก ดิวส์บิวรี-ฮอลล์ กล่าวว่า \"ผมสนุกกับบทบาทนี้มาก กุนซือให้อิสระผมในการเคลื่อนที่ไปทั่วสนาม ผมมีความสัมพันธ์ที่ดีกับ เธียร์โน และดีใจที่เขาทำประตูได้ต่อเนื่อง\"", "มอยส์เป็นผู้จัดการทีมที่มีประสบการณ์มากที่สุดในพรีเมียร์ลีก เกมวันจันทร์นี้ที่พบกับ เบรนท์ฟอร์ด จะทำให้เขาทำสถิติคุมทีมเอฟเวอร์ตันสูงสุดตลอดกาลที่ 493 นัด แซงหน้า แฮร์รี แคทเทอริค ตลอดอาชีพการคุมทีม เขาขึ้นชื่อเรื่องการสร้างความมั่นคงและคว้าถ้วยรางวัลด้วยทรัพยากรที่จำกัด", "เมื่อเขากลับมาคุมทีมรอบสองในเดือนมกราคม 2025 เอฟเวอร์ตันอยู่ในอันดับที่ 16 และต้องหนีตกชั้น แต่เขาสามารถพาทีมจบอันดับที่ 13 ได้สำเร็จ และในฤดูกาลที่แล้วทีมก็ไม่ได้ถูกมองว่าเป็นทีมหนีตกชั้น แม้จะจบฤดูกาลด้วยความผิดหวัง แต่เขาก็สร้างความมั่นคงให้กับสโมสรได้อีกครั้ง", "อย่างไรก็ตาม มอยส์ยังคงเป็นคนมองโลกตามความเป็นจริง \"ผมไม่รังเกียจที่จะสร้างความคาดหวัง แต่สักวันหนึ่งจะมีคนถามว่า 'คุณได้ดูขนาดทีมและผู้เล่นที่คุณมีจริงๆ หรือยัง?' บางทีเมื่อถึงจุดนั้น คุณต้องบอกตัวเองว่า 'ใจเย็นๆ ลงหน่อย' ผมไม่ได้ใช้มันเป็นข้ออ้าง แต่ผมแค่บอกว่าอาจมีบางอย่างที่ไม่เป็นใจให้เราในอนาคต\"", "ความกังวลลึกๆ คือการที่เอฟเวอร์ตันอาจแผ่วปลายเหมือนฤดูกาลที่แล้วที่พลาดโอกาสไปเล่นฟุตบอลยุโรปหลังจากไม่ชนะใครเลยใน 7 นัดสุดท้าย มอยส์จึงต้องการเสริมทัพในเดือนมกราคมเพื่อไม่ให้ประวัติศาสตร์ซ้ำรอย โดยมีรายงานว่ากองหน้าและแบ็กขวาคือเป้าหมายหลัก", "แม้จะเพิ่งผ่านไปเพียง 10 นัด แต่เอฟเวอร์ตันกำลังเดินมาถูกทางและได้เรียนรู้จากความผิดพลาดในอดีต ด้วยผู้เล่นและกุนซือที่มีคุณภาพ เจมี เรดแนปป์ กล่าวสรุปไว้เมื่อไม่กี่สัปดาห์ก่อนว่า \"มีความรู้สึกที่ดีเกิดขึ้นที่เอฟเวอร์ตัน เดวิด มอยส์ ทำงานได้อย่างยอดเยี่ยม\" ซึ่งแฟนบอลทอฟฟี่หวังว่าความรู้สึกนี้จะคงอยู่ต่อไปตลอดทั้งฤดูกาล"], "link": "https://www.skysports.com/football/news/11095/13612885/everton-how-premier-leagues-sleeping-giant-are-exceeding-expectations-ahead-of-brentford-test", "canonical_link": "https://www.skysports.com/football/news/11095/13612885/everton-how-premier-leagues-sleeping-giant-are-exceeding-expectations-ahead-of-brentford-test", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-premier-league-everton_7408528.jpg?20261117111835", "gallery_images": ["https://e0.365dm.com/26/11/1920x1080/skysports-hlts-pl_7399601.jpg?20261106220645", "https://e0.365dm.com/26/11/1920x1080/skysports-everton-premier-league_7409721.png?20261118160736", "https://e0.365dm.com/26/11/1920x1080/skysports-thierno-barry-everton_7409723.png?20261118160826", "https://e0.365dm.com/26/07/1920x1080/skysports-david-moyes-everton_7309250.jpg?20260729114126", "https://e0.365dm.com/26/11/1920x1080/skysports-football-everton_7398398.jpg?20261105185655", "https://e0.365dm.com/26/11/1920x1080/skysports-everton-premier-league_7410268.jpg?20261119102253"], "videos": [], "review_score": "", "published_ts": 1795085100, "published_at": "2026-11-19T10:45:00Z", "published_th": "19 พ.ย. 2026 • 17:45 น.", "category_hint": "Football"}, {"id": 1795083339384, "guid": "https://www.skysports.com/football/news/11095/13612583/mauricio-pochettino-at-man-utd-seven-years-on-from-the-sack-at-spurs-what-sort-of-coach-is-he-now-we-will-soon-find-out", "original_title": "Seven years on from the sack at Spurs what sort of coach is Pochettino now?", "thai_title": "7 ปีหลังถูกปลดจากสเปอร์ส: เมาริซิโอ โปเช็ตติโน กับความท้าทายครั้งใหม่ที่ แมนเชสเตอร์ ยูไนเต็ด", "tag": "Football", "sub_tag": "SPURS", "bullet_points": ["เมาริซิโอ โปเช็ตติโน กลับสู่พรีเมียร์ลีกอีกครั้งในฐานะกุนซือ แมนเชสเตอร์ ยูไนเต็ด พร้อมความคาดหวังในการกอบกู้ทีม", "ผลงานในอดีตกับ ท็อตแนม ฮอตสเปอร์ คือเครื่องพิสูจน์ฝีมือ แต่การห่างหายจากงานคุมทีมในอังกฤษไปถึง 7 ปีทำให้เกิดคำถามถึงความสดใหม่ของแท็กติก", "สถิติการเพรสซิ่งและระยะทางการวิ่งของทีมภายใต้การคุมทีมของโปเช็ตติโนในอดีตมีความโดดเด่นมาก แต่ในงานล่าสุดที่ เชลซี ตัวเลขดังกล่าวลดลงอย่างเห็นได้ชัด", "ภารกิจที่ โอลด์ แทรฟฟอร์ด ถือเป็นงานใหญ่ที่ต้องใช้เวลาปรับจูนขุมกำลังให้เข้ากับปรัชญาฟุตบอลของเขาอีกครั้ง", "สัญญาของเขากับ แมนเชสเตอร์ ยูไนเต็ด มีระยะเวลาถึงปี 2029 ซึ่งสะท้อนถึงความเชื่อมั่นที่สโมสรมีต่อตัวกุนซือชาวอาร์เจนไตน์รายนี้"], "full_paragraphs": ["เจ็ดปีหลังจากถูกปลดจากตำแหน่งผู้จัดการทีม ท็อตแนม ฮอตสเปอร์ เมาริซิโอ โปเช็ตติโน ได้หวนคืนสู่พรีเมียร์ลีกอีกครั้งในฐานะกุนซือของ แมนเชสเตอร์ ยูไนเต็ด ด้วยชื่อเสียงที่ยังคงน่าเกรงขาม แต่เขาก็มีภารกิจที่ต้องพิสูจน์ตัวเองให้เห็นอีกครั้ง อดัม เบต ตั้งคำถามว่าเขาสามารถย้อนเวลากลับไปสร้างความสำเร็จเหมือนในอดีตที่ โอลด์ แทรฟฟอร์ด ได้หรือไม่", "สิ่งที่ เมาริซิโอ โปเช็ตติโน ทำไว้กับ ท็อตแนม ฮอตสเปอร์ ในช่วงทศวรรษที่ผ่านมานั้น ดูน่าประทับใจยิ่งกว่าในมุมมองปัจจุบันเมื่อเทียบกับช่วงเวลาที่เขาคุมทีมจริงๆ แมนเชสเตอร์ ยูไนเต็ด ควรจะหันมาดึงตัวกุนซือชาวอาร์เจนไตน์รายนี้มาร่วมงานตั้งนานแล้ว", "ตลอด 5 ฤดูกาลเต็มที่เขาคุมทีม สเปอร์ส จบใน 5 อันดับแรกของพรีเมียร์ลีกได้ทุกปี ซึ่งเป็นสถิติที่ไม่เคยมีใครทำได้ดีกว่านี้ในประวัติศาสตร์สโมสร เขาสามารถพาทีมจบอันดับเหนือ อาร์เซนอล ได้เป็นครั้งแรกในรอบหลายทศวรรษ และพาทีมเข้าสู่รอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก ได้เป็นครั้งแรกในประวัติศาสตร์สโมสรเช่นกัน", "แม้จะไม่มีถ้วยรางวัลติดมือซึ่งมักเป็นประเด็นที่นักวิจารณ์นำมาล้อเลียน แต่การที่ แมนเชสเตอร์ ซิตี้ ถูกตั้งข้อหาต่างๆ ก็เป็นเครื่องเตือนใจว่าในตอนนั้นเขาต้องทำงานภายใต้สถานการณ์ที่เสียเปรียบอย่างมาก เขาทำผลงานได้เกินความคาดหมาย และฟุตบอลที่ตื่นตาตื่นใจของเขายังคงอยู่ในความทรงจำของแฟนบอลเสมอ", "เขากลายเป็นตัวเลือกที่ยกระดับ แมนเชสเตอร์ ยูไนเต็ด ได้อย่างชัดเจน หลังจากสโมสรแห่งนี้เดินหมากผิดพลาดครั้งแล้วครั้งเล่า โดยในรอบกว่าทศวรรษที่ผ่านมา พวกเขาแต่งตั้งผู้จัดการทีมที่มีประสบการณ์ในพรีเมียร์ลีกเพียงคนเดียวเท่านั้น ซึ่งช่วงเวลาสั้นๆ ของ โอเล กุนนาร์ โซลชา ที่ คาร์ดิฟฟ์ แทบจะไม่ได้เป็นเครื่องการันตีความสามารถในการรับงานนี้เลย", "อย่างไรก็ตาม แม้ โปเช็ตติโน จะมีเสน่ห์ดึงดูดใจจนได้รับคำชื่นชมจากสื่อมวลชนมากมาย แต่เขาก็ยังมีเครื่องหมายคำถามติดตัวอยู่ เพราะช่วงเวลาที่เขาคุม ท็อตแนม นั้นจบลงเมื่อ 7 ปีที่แล้ว ซึ่งในโลกฟุตบอลถือเป็นเวลาที่ยาวนานมาก", "โชเซ มูรินโญ และ หลุยส์ ฟาน กัล ต่างถูกมองว่าเป็นกุนซือยุคเก่าตั้งแต่ตอนที่พวกเขาย้ายเข้ามาคุมทีม โดยเฉพาะ มูรินโญ ที่ปัจจุบันดูเหมือนจะห่างไกลจากความสำเร็จในอดีต แม้ว่าตอนนี้เขาจะกลับไปนั่งเก้าอี้กุนซือที่ เรอัล มาดริด ก็ตาม", "แต่ มูรินโญ ย้ายมา ยูไนเต็ด หลังจากคว้าแชมป์พรีเมียร์ลีกได้เพียง 2 ปี ส่วน ฟาน กัล นั้นถือเป็นงานสโมสรสุดท้ายของเขา แต่เขาก็เพิ่งทำผลงานได้ดีในฟุตบอลโลกและเคยพาทีม บาเยิร์น มิวนิก เข้าชิง ยูฟ่า แชมเปียนส์ลีก มาก่อนหน้านั้นเพียง 4 ปี ไม่ใช่ 7 ปีเหมือนกรณีของโปเช็ตติโน", "โปเช็ตติโน ไม่ได้ว่างเว้นจากการทำงานในช่วงที่ผ่านมา เขาคว้าแชมป์ลีกกับ ปารีส แซงต์ แชร์กแมง แม้จะต้องใช้ความพยายามถึงสองครั้งก็ตาม บางคนยกย่องผลงานของเขากับทีมชาติสหรัฐอเมริกา ขณะที่บางคนเห็นความคล้ายคลึงในวิธีที่เขาจัดการกับสถานการณ์ที่ยากลำบากที่ เชลซี ซึ่งความวุ่นวายเหล่านั้นอาจเตรียมความพร้อมให้เขาสำหรับงานใหม่นี้ได้เป็นอย่างดี", "มีข้อโต้แย้งว่า แทนที่แนวคิดฟุตบอลของเขาจะถูกลดทอนลงจากความท้าทายต่างๆ แต่เขากลับกลายเป็นโค้ชที่ครบเครื่องมากขึ้นจากประสบการณ์เหล่านั้น การรับมือกับอำนาจของผู้เล่นไม่ใช่เรื่องใหม่สำหรับคนที่เคยคุมแนวรุกอย่าง ลิโอเนล เมสซี, คีเลียน เอ็มบัปเป และ เนย์มาร์ มาแล้ว ซึ่งการจะให้ทั้งสามคนช่วยกันไล่เพรสซิ่งคู่แข่งนั้นเป็นเรื่องที่ยากยิ่ง", "อย่างไรก็ตาม ความสำเร็จในการสร้างทีม ท็อตแนม ในอดีตคือสิ่งที่สร้างความตื่นเต้นได้มากที่สุด คำถามคือเขาสามารถสร้างทีมแบบนั้นขึ้นมาอีกครั้งได้หรือไม่ หรือเขาต้องการจะทำเช่นนั้นหรือไม่ ในเมื่อลายเซ็นของโปเช็ตติโนดูจะจางหายไปในผลงานช่วงหลัง", "ในช่วง 6 ฤดูกาลแรกในฐานะผู้จัดการทีมพรีเมียร์ลีก ทีมของโปเช็ตติโนไม่เคยมีสถิติ PPDA (ตัวชี้วัดการเพรสซิ่ง) ต่ำกว่าอันดับ 3 เลย สเปอร์ส ของเขาคือเครื่องจักรสังหารในการเพรสซิ่ง เช่นเดียวกับที่ เอสปันญอล และ เซาแธมป์ตัน เคยเป็นมาก่อน", "ใน 4 ฤดูกาลสุดท้ายที่ สเปอร์ส ทีมของเขาไม่เคยมีสถิติระยะทางการวิ่งต่ำกว่าอันดับ 3 เช่นกัน แต่ทีม เชลซี ของเขากลับอยู่ในกลุ่ม 3 อันดับสุดท้ายในตัวชี้วัดเดียวกัน ซึ่งบ่งบอกว่าเขาต้องหาวิธีการใหม่ๆ เพื่อให้ได้ผลการแข่งขันที่ต้องการ", "นั่นจะเป็นสิ่งที่เกิดขึ้นที่ ยูไนเต็ด อย่างแน่นอนในช่วงแรก เขาได้รับช่วงต่อกลุ่มผู้เล่นที่ไม่เหมาะกับสไตล์ฟุตบอลที่สร้างชื่อให้เขา ดังที่กุนซือคนก่อนของเขาเคยกล่าวไว้อย่างน่าจดจำว่า 'ถ้าคุณไม่วิ่งไปข้างหน้าและไม่วิ่งกลับมา คุณก็ไม่มีทางชนะ'", "ข่าวดีคือชื่อเสียงของเขาควรจะซื้อเวลาและความเชื่อมั่นให้เขาได้มากพอที่จะทำให้แนวคิดของโปเช็ตติโนเริ่มปรากฏชัด เขาไม่ได้คุมทีมสโมสรนานถึง 2 ปีนับตั้งแต่จาก สเปอร์ส และตอนนี้เขากำลังถือสัญญาที่จะทำให้เขาอยู่กับ แมนเชสเตอร์ ยูไนเต็ด ไปจนถึงช่วงซัมเมอร์ปี 2029", "ความอดทนเป็นสิ่งจำเป็น เรายังจำบทสัมภาษณ์สุดท้ายของเขากับ Sky Sports ในช่วงที่คุม ท็อตแนม ได้ เมื่อจังหวะการเล่นเริ่มช้าลงและความสดใสของฟุตบอลเริ่มจางหายไป คำพูดเหล่านั้นยังคงมีความหมายกับ ยูไนเต็ด ในปัจจุบัน", "'สำหรับทีมที่เล่นใน แชมเปียนส์ลีก ทีมที่มีผู้เล่น 90 เปอร์เซ็นต์ติดทีมชาติ มันสำคัญมากที่ต้องจำไว้ว่าช่วงปรีซีซันนั้นสำคัญแค่ไหน' เขากล่าวกับ Sky Sports 'ปีนี้เราไม่มีความมั่นคงและเราเริ่มทำงานกันช้าไป'", "เป็นเรื่องน่าจดจำว่าก่อนที่เขาจะสร้างทีม สเปอร์ส ที่เต็มไปด้วยพลังนำโดย แฮร์รี เคน เขาต้องค่อยๆ ปรับจูนทีม ในฤดูกาลแรกเขาต้องใช้งานทั้ง เฟเดริโก ฟาซิโอ, วลาด คิริเคส, เอเตียน กาปู, เปาลินโญ, โรแบร์โต โซลดาโด และ เอ็มมานูเอล อเดบายอร์", "ที่ ยูไนเต็ด การเปลี่ยนแปลงบุคลากรและโชคชะตาจะต้องยิ่งใหญ่กว่านั้นมาก มันเป็นงานที่หนักหนาสาหัส แต่ก็อาจเป็นงานที่ดีที่สุดในชีวิตของเขา แม้ว่าโปเช็ตติโนจะมีอายุมากกว่า เซอร์ อเล็กซ์ เฟอร์กูสัน ถึงหนึ่งทศวรรษในตอนที่เขาย้ายเข้ามาคุมทีมก็ตาม บางทีพวกเขาอาจถูกสร้างมาเพื่อกันและกัน"], "link": "https://www.skysports.com/football/news/11095/13612583/mauricio-pochettino-at-man-utd-seven-years-on-from-the-sack-at-spurs-what-sort-of-coach-is-he-now-we-will-soon-find-out", "canonical_link": "https://www.skysports.com/football/news/11095/13612583/mauricio-pochettino-at-man-utd-seven-years-on-from-the-sack-at-spurs-what-sort-of-coach-is-he-now-we-will-soon-find-out", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-premier-league-manchester-united_7405659.jpg?20261113093243", "gallery_images": ["https://e0.365dm.com/26/11/1920x1080/skysports-manchester-united_7405978.jpg?20261113172941", "https://e0.365dm.com/26/11/1920x1080/skysports-football-man-utd_7405747.jpg?20261113114938", "https://e0.365dm.com/26/11/1920x1080/skysports-football-manchester-united_7405858.jpg?20261113141616"], "videos": [], "review_score": "", "published_ts": 1795082400, "published_at": "2026-11-19T10:00:00Z", "published_th": "19 พ.ย. 2026 • 17:00 น.", "category_hint": "Football"}, {"id": 1795079735647, "guid": "https://www.skysports.com/football/news/11095/13613559/man-city-vs-fulham-has-enzo-fernandez-given-enzo-maresca-a-problem-in-midfield-and-how-does-he-fix-the-imbalance", "original_title": "Man City have problems - is Fernandez their most obvious?", "thai_title": "แมนฯ ซิตี้ กำลังเจอปัญหาหนัก! เอ็นโซ เฟร์นานเดซ คือจุดอ่อนที่ชัดเจนที่สุดหรือไม่?", "tag": "Football", "sub_tag": "MAN CITY", "bullet_points": ["แมนเชสเตอร์ ซิตี้ ภายใต้การคุมทีมของ เอ็นโซ มาเรสก้า กำลังเผชิญวิกฤตพ่ายแพ้ในพรีเมียร์ลีก 3 นัดติดต่อกัน", "ปัญหาหลักของทีมคือเกมรับที่เปราะบาง โดยเฉพาะการป้องกันจังหวะสวนกลับ (Fast breaks) ซึ่งทีมเสียโอกาสยิงไปแล้วถึง 17 ครั้งในฤดูกาลนี้", "การจับคู่แดนกลางระหว่าง เอ็นโซ เฟร์นานเดซ และ เอลเลียต แอนเดอร์สัน ถูกวิจารณ์ว่าไม่สมดุลและขาดวินัยในตำแหน่ง ทำให้ทีมเสียเปรียบเมื่อต้องเล่นเกมรับ", "มีการเสนอทางเลือกให้ มาเรสก้า ปรับแท็กติกโดยใช้ อายยูบ บูอาดี้ ลงมาเสริมความแข็งแกร่งในตำแหน่งหมายเลข 6 หรือขยับ เฟร์นานเดซ ขึ้นไปเล่นเกมรุกเพื่อลดภาระในแดนกลาง"], "full_paragraphs": ["เอ็นโซ มาเรสก้า กำลังเผชิญกับสถานการณ์ที่ไม่เคยเกิดขึ้นมาก่อนในการคุมทีมฤดูกาลนี้ จนกระทั่งเมื่อไม่นานมานี้ ความมุ่งมั่นในเรื่องฟุตบอลของเขาช่วยกลบกระแสวิพากษ์วิจารณ์รอบสโมสรได้ แต่ในเวลานี้ ความผิดปกติของสถานการณ์ที่แมนเชสเตอร์ ซิตี้ กำลังเผชิญนั้นปรากฏชัดเจนทั้งในและนอกสนาม", "มาเรสก้าเริ่มต้นงานด้วยการพาทีมคว้าชัยชนะ 7 นัดรวดในทุกรายการ แต่หลังจากนั้นเขากลับต้องพบกับความพ่ายแพ้ในพรีเมียร์ลีกถึง 3 นัดติดต่อกัน แม้ข้อกังวลเกี่ยวกับระดับการเล่นในบางช่วงเวลาจะมีมาตั้งแต่ต้นฤดูกาล แต่ประเด็นเหล่านี้กลับชัดเจนขึ้นเรื่อยๆ เมื่อผลการแข่งขันดิ่งลงเหว", "ปัญหาที่ใหญ่ที่สุดอยู่ที่ไหน? ในเชิงรูปแบบการเล่น ซิตี้เปิดช่องว่างมากเกินไป ทีมถูกเจาะผ่านได้ง่ายพอๆ กับการถูกวางบอลข้ามหัว มีเพียงนิวคาสเซิล (20 ครั้ง) เท่านั้นที่เผชิญกับการถูกโจมตีด้วยจังหวะสวนกลับมากกว่าซิตี้ (17 ครั้ง) นับตั้งแต่เปิดฤดูกาล โดยในเกมที่พ่ายให้กับนอตทิงแฮม ฟอเรสต์ ก่อนช่วงพักเบรกทีมชาติ ซิตี้เสียถึง 2 ประตูจากสถานการณ์ดังกล่าว", "จังหวะเปลี่ยนผ่านจากรุกเป็นรับเป็นจุดอ่อนของซิตี้มานานก่อนยุคของมาเรสก้า อย่างไรก็ตาม โครงสร้างทีมในปัจจุบันทำให้ปัญหาดังกล่าวยังคงอยู่หรืออาจเลวร้ายลง การจับคู่ระหว่าง เอลเลียต แอนเดอร์สัน และ เอ็นโซ เฟร์นานเดซ ในระบบมิดฟิลด์คู่ถือเป็นการจัดวางที่ไม่เหมาะสมหากเลือกใช้ รายาน แชร์กี เป็นผู้เล่นในแดนกลางอีกคน เพราะทีมจะถูกบุกทะลวงได้ง่ายเกินไป", "แชร์กีแทบไม่ได้ช่วยงานในยามที่ทีมไม่มีบอล ซึ่งนั่นอาจไม่ใช่ปัญหาหากมิดฟิลด์ตัวต่ำสองคนช่วยกันไล่บอล แต่ที่ซิตี้กลับไม่ใช่เช่นนั้น การยืนตำแหน่งและความไร้ประสิทธิภาพในการดวลแย่งบอลของเฟร์นานเดซ ทำให้แอนเดอร์สันต้องโดดเดี่ยวเกินไป แม้แต่แอนเดอร์สัน ซึ่งเป็นหนึ่งในผู้เล่นที่ไว้ใจได้มากที่สุดของทีม ก็ยังพลาดในเกมที่ฟอเรสต์ และเป็นต้นเหตุของประตูแรกที่เสียให้กับ เลียม ดีแลป", "ในเกมดังกล่าว ซิตี้เสียจังหวะสวนกลับรวมทั้งสิ้น 8 ครั้ง ซึ่งไม่มีทีมใดเสียจังหวะสวนกลับในเกมเดียวมากเท่านี้ในฤดูกาลปัจจุบัน", "ในแง่ตำแหน่ง แอนเดอร์สันและเฟร์นานเดซมักจะขยับไปอยู่ในพื้นที่เดียวกันบ่อยครั้ง โดยทั้งคู่มักจะไปกระจุกตัวอยู่ทางฝั่งขวาของแดนกลาง เมื่อวัดสถิติต่อ 90 นาที พบว่าดาวเตะชาวอาร์เจนไตน์เข้าปะทะและแย่งบอลได้น้อยกว่าตอนที่เขาอยู่กับเชลซี ซึ่งทำให้พื้นที่ตรงกลางสนามเปิดกว้างเกินไป และสถิติเกมรุกของเขาก็ไม่ได้โดดเด่นพอที่จะชดเชยข้อบกพร่องนี้ได้", "ที่สนามซิตี้ กราวด์ ทั้ง ซาเวอร์ ชลาเกอร์ และ ไรอัน เยตส์ ต่างเล่นงานความไม่สมดุลนี้อย่างเต็มที่ โดยชลาเกอร์มีส่วนร่วมในเกมรับสูงสุดถึง 14 ครั้ง (วัดจากการเคลียร์บอล, บล็อก, ตัดบอล และเข้าปะทะ) ขณะที่เยตส์ทำได้ 11 ครั้ง ส่วนเฟร์นานเดซทำได้เพียง 4 ครั้ง ซึ่งน้อยกว่าแชร์กีที่ลงมาเป็นตัวสำรองเสียอีก", "มาเรสก้ากำลังเสี่ยงอย่างหนักที่ใช้งานทั้งคู่พร้อมกัน ความยากลำบากนี้ยิ่งทวีคูณขึ้นจากข้อเท็จจริงที่ว่าซิตี้ทุ่มเงินกว่า 320 ล้านปอนด์เพื่อสร้างแดนกลางใหม่ในช่วงซัมเมอร์นี้ แต่จนถึงตอนนี้ โปรไฟล์ของผู้เล่นค่าตัวระดับ 100 ล้านปอนด์ขึ้นไปทั้งสองคนกลับดูไม่เข้าขากัน ซึ่งเป็นโจทย์ใหญ่ที่มาเรสก้าต้องแก้ไข", "กุนซือชาวอิตาลีไม่ได้มีแนวคิดที่จะลอกเลียนแบบโมเดลที่กุนซือชาวสเปนคนก่อน (เป๊ป กวาร์ดิโอล่า) เคยทำไว้จนประสบความสำเร็จตลอด 10 ปีที่ซิตี้ แต่ในกรณีนี้อาจคุ้มค่าที่จะตั้งคำถามว่า: เป๊ป กวาร์ดิโอล่า จะทำอย่างไร?", "ทีมของเป๊ปมักจะสร้างความได้เปรียบทั้งในเชิงจำนวนและตำแหน่งในแดนกลางเสมอ แบร์นาร์โด ซิลวา คือปรมาจารย์ในศิลปะดังกล่าว และในแง่นี้ เขาอาจเป็นผู้เล่นที่ส่งผลกระทบต่อไดนามิกของซิตี้มากกว่าการขาดหายไปของ โรดรี้ เสียอีก ในทางทฤษฎี การจับคู่แบร์นาร์โดกับแอนเดอร์สันจะช่วยลดความผิดพลาดในยามที่ทีมไม่มีบอลที่กำลังเกิดขึ้นในปัจจุบันได้ แต่ปัญหาที่แท้จริงนั้นเป็นเรื่องของโครงสร้างโดยรวม", "ดังนั้น หากซิตี้ต้องการมิดฟิลด์ตัวตัดเกมเพื่อสร้างความมั่นคงจากฐานแดนกลาง ผู้ที่สามารถเล่นภายใต้ความกดดันได้ อายยูบ บูอาดี้ คือตัวเลือกที่ชัดเจนที่สุด ดาวรุ่งรายนี้ได้รับโอกาสลงสนามในลีกน้อยเกินไป โดยเพิ่งได้เล่นไปเพียง 177 นาที และตอนนี้เขาก็มีเวลาปรับตัวเข้ากับสภาพแวดล้อมใหม่แล้ว", "บูอาดี้มีรูปร่างที่แข็งแกร่งและมีความคล่องตัวสูง ซึ่งจะช่วยลดภาระในเกมรับของแอนเดอร์สันได้ นอกจากนี้เขายังมีวินัยในตำแหน่งที่ดีกว่าเฟร์นานเดซ จึงช่วยเพิ่มชั้นเชิงในการป้องกันได้อีกระดับ", "สำหรับทีมที่ขาดการควบคุมและถูกเปิดช่องว่างจากโครงสร้างทีมโดยคู่แข่งอย่าง ซันเดอร์แลนด์, อิปสวิช และล่าสุดคือฟอเรสต์ การเพิ่มตัวรับคือการปรับเปลี่ยนที่ง่ายและเห็นผลทันที บูอาดี้คือมิดฟิลด์หมายเลข 6 ที่พร้อมใช้งาน", "อย่างไรก็ตาม การอัดแน่นในแดนกลางไม่ได้หมายความว่าต้องดร็อปผู้เล่นที่มาเรสก้าพยายามอย่างหนักเพื่อคว้าตัวมาร่วมทีมเมื่อ 2 เดือนครึ่งก่อน หากนี่คือการทดลองเพื่อหาความสมดุล เฟร์นานเดซในตำแหน่งปลายแหลมของสามเหลี่ยมแดนกลางอาจเป็นทางเลือกแทนที่แชร์กี ขึ้นอยู่กับแผนการเล่นในแต่ละเกม เพราะนี่คือทีมที่ยังคงโดดเด เอาชนะฟูแล่มได้ตลอด 17 นัดหลังสุดที่พบกันในพรีเมียร์ลีก โดยยิงได้อย่างน้อยนัดละ 2 ประตูทุกครั้ง", "แอสตัน วิลล่า จบช่วงก่อนพักเบรกทีมชาติด้วยความรู้สึกผิดหวัง หลังจากปล่อยให้แมนเชสเตอร์ ยูไนเต็ด ไล่ตามตีเสมอ 4-4 ทั้งที่นำไปก่อนถึงสองครั้ง ในขณะที่ซันเดอร์แลนด์สามารถคว้าชัยชนะสำคัญเหนือเชลซี 1-0 ช่วยลดความกดดันให้กับ เรจิส เลอ บริส กุนซือของทีมได้สำเร็จ", "แม้ซันเดอร์แลนด์จะยังคงอยู่ในโซนตกชั้นจากผลงานช่วงต้นฤดูกาลที่ย่ำแย่ แต่การบุกไปเยือนวิลล่า พาร์ค ถือเป็นงานหนัก โดยเฉพาะเมื่อต้องขาดผู้เล่นอย่าง กรานิต ชาก้า และ ไบรอัน บร็อบบีย์ อย่างไรก็ตาม ชัยชนะเป็นสิ่งที่จำเป็นหากพวกเขาต้องการยุติกระแสข่าวการปลดกุนซือ", "ทัพ 'แมวดำ' มีสถิติเกมเยือนที่ไม่ดีนักในฤดูกาลนี้ โดยชนะเพียงนัดเดียวจากการไปเยือนตอร์เรนเซ่ ทีมในลีกรองของโปรตุเกส อีกทั้งบรรยากาศที่วิลล่า พาร์ค ในฤดูกาลนี้ยังดูเงียบเหงาลงจากการปิดอัฒจันทร์ฝั่งนอร์ทสแตนด์", "วัฏจักรการเปลี่ยนผู้จัดการทีมกลับมาหมุนเวียนอีกครั้ง โดยคริสตัล พาเลซ ได้แต่งตั้ง โธมัส แฟรงค์ เข้ามาคุมทีมที่เซลเฮิร์สต์ พาร์ค ด้วยความหวังใหม่ แต่การมีกุนซือคนใหม่ไม่ได้การันตีว่าจะได้ผลลัพธ์ที่ดีขึ้นเสมอไป", "ในความเป็นจริง ข้อมูลล่าสุดชี้ให้เห็นถึงสิ่งที่ตรงกันข้ามสำหรับทีมที่กำลังประสบปัญหา ทฤษฎี 'บอลเปลี่ยนโค้ช' เป็นสิ่งที่ถูกโรแมนติกเกินจริงไปมาก โดยสถิติระบุว่าจาก 6 ทีมท้ายตารางที่เปลี่ยนกุนซือในช่วงเดือนพฤศจิกายนถึงมีนาคม มีถึง 5 ทีมที่ค่าเฉลี่ยคะแนนต่อเกมลดลงใน 5 นัดถัดมา", "ตัวอย่างเช่น วิตอร์ เปเรย์รา ที่น็อตติงแฮม ฟอเรสต์, อีกอร์ ทูดอร์ ที่ท็อตแนม, ร็อบ เอ็ดเวิร์ดส์ ที่วูล์ฟส์, เกรแฮม พอตเตอร์ ที่เวสต์แฮม และ อิวาน ยูริช ที่เซาแธมป์ตัน นี่คือแนวโน้มที่น่าสนใจซึ่งควรเป็นคำเตือนสำหรับแฟนบอลพาเลซที่คาดหวังว่าแฟรงค์จะเข้ามาเสกมนต์วิเศษให้ทีม", "ความจริงก็คือทีมที่กำลังดิ้นรนหนีตกชั้นมักมีปัญหาฝังรากลึกที่ไม่สามารถแก้ไขได้ด้วยการปรับแท็กติกเพียงเล็กน้อยหรือการพูดปลุกใจ ความมั่นใจ โครงสร้างทีม และคุณภาพของผู้เล่น มักมีความสำคัญมากกว่าเสียงใหม่ๆ ในซุ้มม้านั่งสำรอง โดยพาเลซมีคิวพบกับโคเวนทรีเป็นด่านต่อไป", "บอร์นมัธไม่สามารถคว้าชัยชนะในพรีเมียร์ลีกได้เลยในช่วง 6 สัปดาห์แรกของฤดูกาล แต่ในเดือนที่ผ่านมาพวกเขากลายเป็นทีมที่หยุดไม่อยู่ โดยนับตั้งแต่ชน kysports-football-premier-league_7401407.jpg?20261108184941", "https://e0.365dm.com/26/11/1920x1080/skysports-liverpool-palace_7401170.jpg?20261108163909", "https://e0.365dm.com/26/11/1920x1080/skysports-ipswich-hlts_7401097.jpg?20261108160923", "https://e0.365dm.com/26/11/1920x1080/skysports-leeds-spurs_7399976.jpg?20261107150751", "https://e0.365dm.com/26/11/1920x1080/skysports-football-premier-league_7401076.jpg?20261108160610", "https://e0.365dm.com/26/11/1920x1080/skysports-brighton-brentford_7401063.jpg?20261108155942", "https://e0.365dm.com/26/11/1920x1080/skysports-poch-man-utd_7405343.jpg?20261112185035"], "videos": [], "review_score": "", "published_ts": 1795075200, "published_at": "2026-11-19T08:00:00Z", "published_th": "19 พ.ย. 2026 • 15:00 น.", "category_hint": "Football"}, {"id": 1795074396962, "guid": "https://www.bbc.co.uk/sport/football/articles/c6x28e93zv3jo", "original_title": "How Premier League's big six keep getting richer", "thai_title": "เจาะลึกเหตุผลที่ 'บิ๊กซิกซ์' พรีเมียร์ลีก ยิ่งรวยขึ้นและทิ้งห่างสโมสรอื่นแบบไม่เห็นฝุ่น", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["ช่องว่างรายได้ระหว่างกลุ่ม 'บิ๊กซิกซ์' กับสโมสรอื่นในพรีเมียร์ลีกขยายตัวขึ้นอย่างต่อเนื่องทุกฤดูกาล", "รายได้จากลิขสิทธิ์ถ่ายทอดสดระหว่างประเทศและข้อตกลงเชิงพาณิชย์ระดับโลกเป็นปัจจัยหลักที่ทำให้กลุ่มบิ๊กซิกซ์ทิ้งห่างคู่แข่ง", "ยูฟ่า (Uefa) มีระบบ 'Value Pillar' ที่จัดสรรรายได้มหาศาลให้กับสโมสรที่มีประวัติความสำเร็จในอดีต ทำให้ทีมใหญ่ได้เปรียบทั้งในและต่างประเทศ", "เชลซีเริ่มประสบปัญหาทางการเงินเมื่อเทียบกับทีมบิ๊กซิกซ์อื่น ๆ เนื่องจากข้อจำกัดด้านความจุของสนามสแตมฟอร์ด บริดจ์ ที่ไม่สามารถขยายเพิ่มได้", "เอฟเวอร์ตันเป็นตัวอย่างที่ชัดเจนของสโมสรดั้งเดิมที่ถูกทิ้งห่าง โดยช่องว่างรายได้เมื่อเทียบกับค่าเฉลี่ยของบิ๊กซิกซ์พุ่งสูงจาก 120 ล้านปอนด์ในปี 2009-10 เป็น 442 ล้านปอนด์ในฤดูกาล 2024-25"], "full_paragraphs": ["ผ่านไป 10 นัดในฤดูกาลพรีเมียร์ลีก อันดับท็อป 5 ของตารางถูกครอบครองโดยสโมสรในกลุ่ม 'บิ๊กซิกซ์' เกือบทั้งหมด โดยมีเพียง ไบรท์ตัน ทีมอันดับ 2 ที่มีโมเดลการบริหารงานอันเป็นที่น่าอิจฉาของคู่แข่งหลายทีมเท่านั้นที่สามารถแทรกตัวขึ้นมาได้", "ในแง่ของตัวเลขทางการเงินล้วนๆ เรื่องนี้ไม่ใช่เรื่องน่าประหลาดใจแต่อย่างใด เพราะสโมสรที่ใหญ่ที่สุด 6 แห่ง ได้แก่ แมนเชสเตอร์ ยูไนเต็ด, ลิเวอร์พูล, แมนเชสเตอร์ ซิตี้, อาร์เซนอล, ท็อตแนม ฮอตสเปอร์ และเชลซี ต่างทำรายได้มากกว่าทีมอื่นๆ ในลีกรวมกันหลายร้อยล้านปอนด์ และช่องว่างนี้กำลังขยายตัวขึ้นในทุกๆ ฤดูกาล", "BBC Sport ได้ทำการวิเคราะห์เจาะลึกว่าการเงินของกลุ่มบิ๊กซิกซ์พุ่งทะยานขึ้นได้อย่างไร พร้อมตรวจสอบแนวโน้มใหม่ๆ ผลกระทบต่อตลาดซื้อขายนักเตะ และตั้งคำถามว่าช่องว่างนี้มีความสำคัญมากน้อยเพียงใดในความเป็นจริง", "บริษัทต่างๆ มักนำเงินไปลงทุนในที่ที่แฟนบอลพร้อมจะจ่ายเงิน ซึ่งเป็นข้อเท็จจริงทางธุรกิจที่เรียบง่ายในทุกประเทศ และเป็นความจริงของห่วงโซ่อาหารในโลกฟุตบอล โดยในอังกฤษ ลิเวอร์พูล, อาร์เซนอล และแมนเชสเตอร์ ยูไนเต็ด ครองความนิยมทั้งในแง่ยอดผู้ชม พื้นที่สื่อ ยอดขายเสื้อ และสปอนเซอร์มาอย่างยาวนาน ก่อนที่ในช่วง 20 ปีที่ผ่านมาจะมี เชลซี, แมนเชสเตอร์ ซิตี้ และท็อตแนม ฮอตสเปอร์ เข้ามาสมทบ", "กลุ่มสโมสรเหล่านี้สร้างรายได้มหาศาลจนยากที่จะจินตนาการว่าพวกเขาจะล้มเหลวในระยะยาวได้อย่างไร แม้จะพิจารณาถึงปัญหาผลงานในสนามในระยะสั้นก็ตาม หากเราลองดูว่าช่องว่างนี้เติบโตขึ้นอย่างไร โดยใช้ เอฟเวอร์ตัน ซึ่งเป็นสโมสรเดียวที่ไม่ได้อยู่ในกลุ่มบิ๊กซิกซ์แต่ยังคงอยู่ในพรีเมียร์ลีกมาตั้งแต่ก่อตั้งในปี 1992 จะเห็นได้ชัดว่าแม้แต่สโมสรที่เป็นสมาชิกก่อตั้งลีกก็ยังถูกทิ้งห่างไปไกลเพียงใด", "ในปี 2009-10 ช่องว่างรายได้ระหว่างค่าเฉลี่ยของกลุ่มบิ๊กซิกซ์กับเอฟเวอร์ตันอยู่ที่ 120 ล้านปอนด์ แต่ในฤดูกาล 2024-25 ช่องว่างดังกล่าวขยายตัวขึ้นเป็น 442 ล้านปอนด์", "อะไรคือปัจจัยที่ขับเคลื่อนการเพิ่มขึ้นอย่างมหาศาลนี้? ส่วนใหญ่มาจากความเฟื่องฟูของลิขสิทธิ์ถ่ายทอดสดระหว่างประเทศ คีแรน แม็คไกวร์ ศาสตราจารย์ด้านการเงินฟุตบอลจากมหาวิทยาลัยลิเวอร์พูล กล่าวกับ BBC Sport ว่าสิ่งนี้ได้ดึงดูดบริษัทต่างๆ ที่พร้อมจะจ่ายเงินก้อนโตเพื่อสร้างความเชื่อมโยงกับสโมสรชั้นนำของพรีเมียร์ลีก", "แม็คไกวร์กล่าวว่า 'สโมสรฟุตบอลที่เป็นแบรนด์ใหญ่มีฐานแฟนบอลทั่วโลก ซึ่งทำให้พวกเขามีความน่าดึงดูดใจมากสำหรับพันธมิตรทางการค้าทั่วโลก โดยเฉพาะอย่างยิ่งสำหรับข้อตกลงด้านสปอนเซอร์และหน้าอกเสื้อ เมื่อรวมกับข้อเท็จจริงที่ว่าพรีเมียร์ลีกมีการถ่ายทอดสดไปยัง 190 ประเทศทั่วโลก โดยเฉพาะผู้ชมในต่างประเทศ สิ่งนี้ช่วยให้สโมสรสามารถเจรจาต่อรองราคาที่ดีมากได้'", "รายได้ของเอฟเวอร์ตันเพียง 10% เท่านั้นที่มาจากข้อตกลงทางการค้า ในขณะที่กลุ่มบิ๊กซิกซ์มีสัดส่วนสูงถึง 45% นั่นหมายความว่าเอฟเวอร์ตันและสโมสรอื่นๆ ในลีกต้องพึ่งพารายได้จากลิขสิทธิ์ถ่ายทอดสดเป็นหลัก ซึ่งคิดเป็น 66% ของรายได้ทั้งหมด อย่างน้อยสำหรับเอฟเวอร์ตัน สถานการณ์นี้อาจเปลี่ยนไปหลังจากการย้ายไปสนามแห่งใหม่ แต่ก็ไม่น่าจะเพียงพอที่จะหยุดยั้งช่องว่างที่เพิ่มขึ้นได้", "แม้ต้องใช้เวลาหลายปี แต่ แอสตัน วิลลา และ นิวคาสเซิล ยูไนเต็ด ก็เริ่มเพิ่มรายได้ของตนเองได้บ้าง ซึ่งส่วนใหญ่มาจากผลตอบแทนทางการเงินของการได้ไปเล่นในฟุตบอลยูฟ่า แชมเปียนส์ลีก แต่ถึงกระนั้น ยูฟ่าก็ได้สร้างระบบที่ตอกย้ำตำแหน่งของสโมสรที่ใหญ่ที่สุดเอาไว้", "เมื่อแผนการจัดตั้งยูโรเปียน ซูเปอร์ลีก ถูกทำลายลง ยูฟ่าได้สร้างข้อตกลงทางการเงินใหม่ที่เรียกว่า 'Value Pillar' ซึ่งสำรองรายได้ 35% ของรายได้ทั้งหมดจากแชมเปียนส์ลีก หรือคิดเป็น 713 ล้านปอนด์ ให้กับสโมสรที่ประสบความสำเร็จมากที่สุดในประวัติศาสตร์", "เมื่อสิ้นสุดรอบลีกในฤดูกาลที่แล้ว มีการประเมินว่า แมนเชสเตอร์ ซิตี้ ได้รับเงินจากส่วนนี้ไป 37.9 ล้านปอนด์, ลิเวอร์พูล 35.5 ล้านปอนด์ และเชลซี 33.3 ล้านปอนด์ ในขณะที่ นิวคาสเซิล ได้รับเพียง 13.6 ล้านปอนด์เท่านั้น ข่าวดีสำหรับ แอสตัน วิลลา คือค่าสัมประสิทธิ์ของพวกเขาดีขึ้นมากจากผลงานในยูโรปา ลีก ฤดูกาลที่แล้ว ทำให้คาดการณ์ว่าส่วนแบ่ง Value Pillar ของพวกเขาในฤดูกาลนี้จะอยู่ที่ 25 ล้านปอนด์ แต่ก็ยังน้อยกว่าสโมสรบิ๊กซิกซ์ที่เข้าร่วมการแข่งขันอยู่ดี", "สถานการณ์นี้ทำให้สโมสรที่มีความทะเยอทะยานต้องเผชิญกับความยากลำบาก ไม่ใช่แค่ในประเทศ แต่รวมถึงในยุโรปด้วย หากดูแนวโน้มทางการเงินของกลุ่มบิ๊กซิกซ์ สิ่งหนึ่งที่สังเกตได้ชัดคือ เชลซี กำลังเริ่มร่วงหล่นลงมา ในช่วงสองฤดูกาลที่ผ่านมาเป็นครั้งแรกในประวัติศาสตร์ยุคใหม่ที่ 'สิงห์บลูส์' มีรายได้ต่ำที่สุดในกลุ่มบิ๊กซิกซ์", "ไม่ใช่แค่เพียงเล็กน้อย แต่พวกเขามีรายได้น้อยกว่า ท็อตแนม ฮอตสเปอร์ ถึง 74 ล้านปอนด์ และน้อยกว่า ลิเวอร์พูล และ แมนเชสเตอร์ ซิตี้ ถึง 200 ล้านปอนด์ ปัญหาของเชลซีนั้นเรียบง่ายมาก นั่นคือ 'จำนวนที่นั่ง' สนามสแตมฟอร์ด บริดจ์ มีความจุเพียง 40,000 ที่นั่ง และไม่มีพื้นที่ให้ขยายได้ง่ายๆ ในขณะที่ทีมบิ๊กซิกซ์ที่เหลือต่างมีสนามที่จุผู้ชมได้อย่างน้อย 60,000 คน", "เชลซีมีค่าใช้จ่ายเฉลี่ยต่อแฟนบอลอยู่ที่ 80 ปอนด์ในปี 2024-25 ซึ่งสูงเป็นอันดับสองของลีกรองจาก อาร์เซนอล แต่ด้วยจำนวนตั๋วที่ขายได้น้อยกว่าคู่แข่งในกลุ่มบิ๊กซิกซ์ถึง 20,000 ใบ ทำให้รายได้รวมในวันแข่งขันของเชลซีถูกทิ้งห่างอย่างมหาศาล", "แม็คไกวร์กล่าวทิ้งท้ายว่า 'รายได้ในวันแข่งขันมีความสำคัญมากขึ้นเรื่อยๆ เนื่องจากรายได้จากลิขสิทธิ์ถ่ายทอดสดเริ่มคงที่โดยเฉพาะตั้งแต่ปี 2017 เป็นต้นมา ส่งผลให้สโมสรต่างๆ ต้องมองหาวิธีการเพิ่มรายได้ทางเลือก โดยเฉพาะอย่างยิ่งเมื่อต้นทุนทั้งในสนามและนอกสนามพุ่งสูงขึ้นอย่างรวดเร็ว' รายได้ในวันแข่งขันของเชลซีแทบจะหยุดนิ่ง โดยเพิ่มขึ้นเพียง 16 ล้านปอนด์ในช่วง 10 ปีที่ผ่านมา ในขณะที่ แมนเชสเตอร์ ยูไนเต็ด เพิ่มขึ้น 69 ล้านปอนด์ และ สเปอร์ส เพิ่มขึ้นถึง 85 ล้านปอนด์จากสนามแห่งใหม่", "'เชลซีต้องพึ่งพาการขายนักเตะมากกว่าสโมสรอื่น มีความแตกแยกที่เพิ่มขึ้นเพราะความน่าดึงดูดใจระดับโลกนั้นสอดคล้องกับสโมสรเพียง 3 หรือ 4 แห่งเท่านั้น อาร์เซนอลได้สร้างตัวเองขึ้นมาใหม่ด้วยความก้าวหน้าในแชมเปียนส์ลีก แมนเชสเตอร์ ยูไนเต็ด เป็นแบรนด์ในตัวของมันเอง และลิเวอร์พูลได้ขยายสนามแอนฟิลด์จาก 44,000 เป็น 61,000 ที่นั่ง โดยที่นั่งส่วนเกินจำนวนมากถูกนำไปใช้ในเชิงพาณิชย์' ซึ่งโมเดลการซื้อขายนักเตะที่ประสบความสำเร็จของเชลซีได้ช่วยจำกัดผลกระทบที่เกิดขึ้นได้ในระดับหนึ่งเท่านั้น"], "link": "https://www.bbc.co.uk/sport/football/articles/c6x28e93zv3jo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c6x28e93zv3jo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c612/live/1f6a6e00-e291-11f1-b166-176de21e2352.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795073902, "published_at": "2026-11-19T07:38:22Z", "published_th": "19 พ.ย. 2026 • 14:38 น.", "category_hint": "Football"}, {"id": 1795075248223, "guid": "https://www.bbc.co.uk/sport/football/articles/ck98z842gp11o", "original_title": "From Forest fringes to Glasner's go-to guy - the rise of McAtee", "thai_title": "จากตัวสำรองสู่หัวใจสำคัญ: เจมส์ แม็คอาที กับการแจ้งเกิดเต็มตัวภายใต้การคุมทีมของ กลาสเนอร์", "tag": "Football", "sub_tag": "FOREST", "bullet_points": ["เจมส์ แม็คอาที พัฒนาตัวเองจากนักเตะที่แทบไม่มีบทบาทในฤดูกาลก่อน กลายเป็นกำลังหลักที่ โอลิเวอร์ กลาสเนอร์ ไว้วางใจในฤดูกาลนี้", "แม็คอาทีทุ่มเทอย่างหนักในช่วงซัมเมอร์ด้วยการเพิ่มมวลกล้ามเนื้อและลดไขมัน พร้อมปรับทัศนคติด้วยการปรึกษานักจิตวิทยาเพื่อสร้างความมั่นใจ", "สถิติส่วนตัวของแม็คอาทีโดดเด่นอย่างมากในฤดูกาลนี้ ทั้งการผ่านบอลในพื้นที่สุดท้าย การสร้างโอกาส และการแย่งบอลคืน ซึ่งเหนือกว่าคู่แข่งในตำแหน่งเดียวกันหลายราย", "เป้าหมายสูงสุดของแม็คอาทีคือการก้าวขึ้นไปติดทีมชาติอังกฤษชุดใหญ่ของ โธมัส ทูเคิล โดยหวังว่าผลงานที่สม่ำเสมอจะช่วยให้เขาได้รับโอกาสในอนาคต"], "full_paragraphs": ["เจมส์ แม็คอาที เคยลงสนามให้แมนเชสเตอร์ ซิตี้ เพียง 6 นัดหลังจากก้าวขึ้นมาจากอคาเดมีของสโมสร แต่ในปัจจุบันเขากลายเป็นหนึ่งในนักเตะที่ทำผลงานได้โดดเด่นที่สุดในช่วงปรีซีซั่นที่ผ่านมา ซึ่งความประทับใจแรกของ โอลิเวอร์ กลาสเนอร์ กุนซือของน็อตติงแฮม ฟอเรสต์ ที่มีต่อกองกลางรายนี้ ได้กลายเป็นเครื่องพิสูจน์ถึงความเชื่อมั่นที่เฮดโค้ชชาวออสเตรียมีให้เขาอย่างเต็มที่", "ดูเหมือนว่าฟอเรสต์จะค้นพบตัวแทนของ เอลเลียต แอนเดอร์สัน จากภายในทีมเอง เมื่อแม็คอาทีกลายเป็นผู้เล่นคนสำคัญของกลาสเนอร์ หลังจากย้ายมาร่วมทีมด้วยค่าตัว 30 ล้านปอนด์ในปี 2025 แม็คอาทีต้องเผชิญกับช่วงเวลาที่ยากลำบากในการปรับตัวที่ซิตี้ กราวด์ แต่เขาก็มีบทบาทสำคัญในการช่วยให้ฟอเรสต์เอาชนะแมนเชสเตอร์ ซิตี้ และแอนเดอร์สันที่เพิ่งย้ายกลับมาได้สำเร็จ ก่อนช่วงพักเบรกทีมชาติ ซึ่งถือเป็นชัยชนะในบ้านนัดแรกของฤดูกาล", "แม้จะยังไม่มีกระแสเรียกร้องให้เขาติดทีมชาติอังกฤษ แต่คำถามที่น่าสนใจคือ โธมัส ทูเคิล มองข้ามแม็คอาทีไปอย่างไม่เป็นธรรมหรือไม่ และเขาก้าวจากม้านั่งสำรองมาเป็นผู้เล่นที่ขาดไม่ได้ได้อย่างไร? อดีตเด็กปั้นจากอคาเดมีของซิตี้รายนี้ได้ออกสตาร์ทเป็นตัวจริงในพรีเมียร์ลีกเพียง 2 นัดเมื่อฤดูกาลที่แล้ว ซึ่งเป็นหนึ่งในเหยื่อของความวุ่นวายในสโมสรที่เปลี่ยนผู้จัดการทีมถึง 4 คน", "แม้จะได้ลงตัวจริง 9 นัดในเส้นทางสู่รอบรองชนะเลิศยูโรปาลีก แต่ก็ไม่อาจกลบความผิดหวังตลอดทั้งฤดูกาลได้ มันควรจะเป็นเวทีแจ้งเกิดหลังจากที่เขาพาทีมชาติอังกฤษชุดอายุต่ำกว่า 21 ปีคว้าแชมป์ยูโร 2025 ในฐานะกัปตันทีม แต่เขากลับได้ลงเล่นในลีกเพียง 289 นาทีเท่านั้น อย่างไรก็ตาม แข้งวัย 24 ปีรายนี้ลงเล่นไปแล้วมากกว่าเดิมถึง 3 เท่าในฤดูกาลนี้ หลังจากกลายเป็นผู้เล่นหลักของกลาสเนอร์และได้ออกสตาร์ทเป็นตัวจริงในทุกเกมบนลีกสูงสุด", "เรื่องนี้เกิดขึ้นหลังจากที่ผู้จัดการทีมแนะนำในช่วงซัมเมอร์ว่า แม็คอาทีอาจเข้ามาแทนที่แอนเดอร์สันหลังจากที่เขาย้ายไปซิตี้ด้วยค่าตัว 116 ล้านปอนด์ ซึ่งเป็นสิ่งที่ทำให้แม็คอาทีรู้สึกไม่มั่นใจในตอนแรก โดยเขากล่าวที่สนามซ้อมของฟอเรสต์ว่า 'ตอนที่ผมเข้ามาครั้งแรกและกลาสเนอร์ให้ผมเล่นในตำแหน่งหมายเลข 6 ในวันที่สอง ในหัวผมคิดว่า เขาคงไม่เห็นผมอยู่ในแผนการทำทีมแน่ๆ เพราะผมต้องเล่นลึกกว่าเดิม'", "'ความมั่นใจของผมกำลังเพิ่มขึ้น แม้จะยังไม่เต็มร้อย แต่ผมคิดว่าเรากำลังมาถูกทาง ผมคิดว่าผมมีทักษะนี้อยู่ในตัว แต่ไม่เคยคิดว่าเขาจะลองให้ผมเล่นจริงๆ ในช่วงปรีซีซั่น ผมคิดว่าตอนนั้น อิบราฮิม่า ซ็องกาเร่ บาดเจ็บ ผมเลยคิดว่าผมแค่เข้ามาแทนที่อิบรา แต่พอปรีซีซั่นดำเนินไปเรื่อยๆ และผมได้เล่นตรงนั้น ผมก็รู้สึกสบายใจขึ้น'", "นี่คือหลักฐานของการทำงานหนักของแม็คอาทีหลังจากที่เขาใช้เวลาตลอดช่วงซัมเมอร์เพื่อเตรียมตัวสำหรับปรีซีซั่น เขาฝึกซ้อมกับ เดวิด นอร์ริส อดีตกองกลางของพลีมัธ ลีดส์ และอิปสวิช ซึ่งปัจจุบันเป็นเทรนเนอร์ส่วนตัว โดยเขาสามารถเพิ่มมวลกล้ามเนื้อได้ 2.5 กิโลกรัม และลดไขมันลงได้ 1 กิโลกรัม การฝึกซ้อมเวทเทรนนิ่งตามด้วยการฝึกความฟิตในช่วงเช้า คือสิ่งที่ทำให้กลาสเนอร์ชื่นชมความมุ่งมั่นของเขาในช่วงซัมเมอร์", "ความสัมพันธ์กับกลาสเนอร์มีความสำคัญอย่างยิ่ง กุนซือฟอเรสต์มอบความชัดเจนและความสงบให้กับทีมที่ต้องเผชิญกับความวุ่นวายเมื่อฤดูกาลที่แล้ว หลังจากความพ่ายแพ้ต่อเบรนท์ฟอร์ด 2-0 ได้กระตุ้นให้ทีมตอบสนองในทางที่ถูกต้อง หลังจากเริ่มต้นฤดูกาลจนทำให้ทีมอยู่อันดับที่ 16 ของตาราง หลังจากที่แม็คอาทีไม่สามารถรักษาความสม่ำเสมอได้ในฤดูกาลที่แล้ว กลาสเนอร์สัญญาว่าเขาจะให้เวลาและโอกาสหากเขาเล่นได้ไม่ดีในบางเกม", "'ผมคิดว่าฤดูกาลที่แล้วเป็นปัญหาที่ตัวผมเอง ผมพยายามอย่างหนักที่จะคว้าโอกาส' เขากล่าวหลังจากได้ใช้นักจิตวิทยาช่วยก่อนเริ่มปรีซีซั่น 'ผมไม่เคยเจอฤดูกาลแบบนั้นมาก่อน ผมเข้าๆ ออกๆ ตลอด มันน่าหงุดหงิด แต่มันก็เป็นบทเรียนที่ดี ในขณะที่ผมเห็นความมั่นใจของตัวเองลดลงเรื่อยๆ เมื่อดูคลิปการเล่นของตัวเอง ผมบอกได้เลยว่าตอนไหนที่ผมเริ่มฟอร์มตก ปีนี้ถ้าผมจ่ายบอลพลาด ผมจะไม่กังวลมากเท่าเดิมเพราะผมผ่านจุดนั้นมาแล้ว'", "แม็คอาทีได้รับการสนับสนุนที่ซิตี้ กราวด์มาโดยตลอด ผู้จัดการทีมทั้ง 4 คนต่างประทับใจในระดับการฝึกซ้อมของเขาเมื่อฤดูกาลที่แล้ว แต่เขามักจะอยู่ภายใต้ความกดดันที่ต้องโชว์ฟอร์มให้ได้เมื่อได้รับโอกาสเพียงน้อยนิด จอร์จ ซีเรียโนส ผู้อำนวยการฝ่ายเทคนิคของฟอเรสต์ ก็เป็นอีกคนที่คอยสนับสนุนแม็คอาทีภายในสโมสร สิ่งนี้ทำให้แม็คอาที ซึ่งมีพี่ชายชื่อ จอห์น ที่เล่นให้กับโบลตัน รู้สึกถึงความเชื่อมั่นหลังจากเรียนรู้จากความยากลำบากในอดีต โดยมีทีมชาติอังกฤษเป็นเป้าหมายในใจ", "เขากระตือรือร้นที่จะก้าวขึ้นสู่ทีมชุดใหญ่ของทูเคิลและได้รับการสนับสนุนจากสมาคมฟุตบอลอังกฤษ เขาให้ความสำคัญกับการเล่นให้ทีมชุด U21 ในศึกยูโร 2025 มากกว่าการไปเล่นสโมสรโลกกับซิตี้ และได้แสดงความมุ่งมั่นที่จะรับใช้ทีมชาติให้ เป๊ป กวาร์ดิโอล่า และ ซิกิ เบกิริสไตน์ ผู้อำนวยการฟุตบอลในขณะนั้นได้รับทราบ ตอนนี้ภายใต้การคุมทีมของกลาสเนอร์ หลังจากฤดูกาลแรกที่ยากลำบาก แม็คอาทีมีเวทีที่พร้อมแล้ว และยูโร 2028 ก็เป็นเป้าหมายที่เป็นไปได้จริง", "'ในตอนนี้ผมต้องมีปีที่ดีเพื่อให้มีโอกาสถูกเรียกตัว แต่การแข่งขันในตำแหน่งที่ผมเล่นนั้นสูงมาก' เขากล่าว 'ถ้าผมสามารถทำประตูหรือเพิ่มสถิติได้ มันอาจทำให้ผมมีโอกาสเข้าไปอยู่ในวงโคจรนั้น การแข่งขันในระดับนี้ถือว่าสูงมาก แต่นั่นคือเป้าหมายที่ผมวางไว้'", "ในเกมที่พบกับซิตี้ เขาถูกขยับขึ้นไปเล่นเกมรุกมากขึ้น โดยมี ไรอัน เยตส์ เข้ามาช่วยเพิ่มจำนวนผู้เล่นในแดนกลาง แต่สถิติยืนยันถึงการพัฒนาของแม็คอาทีได้เป็นอย่างดี เขาทำสถิติผ่านบอลในพื้นที่สุดท้ายได้มากที่สุดให้ฟอเรสต์ (151 ครั้ง) และจ่ายบอลทะลุช่องได้มากที่สุดเท่ากับ มอร์แกน กิ๊บบ์ส-ไวท์ (5 ครั้ง) การผ่านบอลรวม 426 ครั้งของเขาเป็นรองเพียง มูริลโล่ (501 ครั้ง) และเขาสร้างโอกาสไปแล้ว 18 ครั้ง ซึ่งน้อยกว่ากิ๊บบ์ส-ไวท์เพียง 6 ครั้งเท่านั้น", "แม็คอาทีมีระยะทางการพาบอล 1,180 เมตร ซึ่งตามหลังกิ๊บบ์ส-ไวท์เพียง 29 เมตร แต่เขาทำสถิติการพาบอลมากที่สุดถึง 109 ครั้ง และแย่งบอลคืนได้ถึง 63 ครั้ง โดยชนะการดวลภาคพื้นดิน 53% ซึ่งบ่งบอกว่าเขาพัฒนาความดุดันในการเล่นมากขึ้น เขายังทำผลงานได้เหนือกว่า เจมส์ การ์เนอร์ ของเอฟเวอร์ตัน ทั้งในด้านการสร้างโอกาส การจ่ายบอลไปข้างหน้า การดวลเกมรับ และการเข้าสกัดที่สำเร็จ นอกจากนี้เขายังทำสถิติการแย่งบอลคืน การเข้าสกัด การผ่านบอล และการเคลียร์บอลได้มากกว่า อดัม วาร์ตัน ของคริสตัล พาเลซ อีกด้วย", "ตอนนี้หลังจากที่เขาทำผลงานได้แบบเงียบๆ ในฤดูกาลนี้ เมื่อถึงช่วงพักเบรกทีมชาติในเดือนมีนาคม ทูเคิลอาจไม่สามารถมองข้ามเขาได้อีกต่อไป 'ผมมองว่านี่เป็นอีกด้านหนึ่งของตัวผม ผมมีความมั่นใจในสนามมากขึ้น และรู้สึกสบายใจขึ้นมาก' แม็คอาทีกล่าวทิ้งท้าย 'มันเหมือนกับว่าผมเป็นนักเตะคนละคนเลย'"], "link": "https://www.bbc.co.uk/sport/football/articles/ck98z842gp11o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/ck98z842gp11o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/cfef/live/f045c5a0-dc43-11f1-95cf-a38331e6cb4b.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/558d/live/50076d80-e357-11f1-acd4-25eaaa5def63.jpg"], "videos": [], "review_score": "", "published_ts": 1795072451, "published_at": "2026-11-19T07:14:11Z", "published_th": "19 พ.ย. 2026 • 14:14 น.", "category_hint": "Football"}, {"id": 1795037443661, "guid": "https://www.bbc.co.uk/sport/football/articles/cr930l71z5ejo", "original_title": "Ukrainian FA to blame for failed drugs test - Mudryk", "thai_title": "มูดริกชี้สมาคมฟุตบอลยูเครนต้องรับผิดชอบกรณีตรวจโด๊ปไม่ผ่าน", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["มิไคโล มูดริก ปีกตัวยืมของท็อตแนม ฮอตสเปอร์ ออกมากล่าวโทษสมาคมฟุตบอลยูเครนว่าเป็นต้นเหตุที่ทำให้เขาตรวจโด๊ปไม่ผ่าน", "มูดริกถูกแบนตั้งแต่เดือนพฤศจิกายน 2024 จนถึงเดือนกรกฎาคม 2026 หลังพบสารเมลโดเนียมในร่างกาย ซึ่งเขาเชื่อว่าได้รับมาระหว่างเข้าแคมป์ทีมชาติ", "นักเตะรายนี้ยื่นอุทธรณ์ต่อศาลอนุญาโตตุลาการกีฬา (CAS) จนประสบความสำเร็จและได้รับอนุญาตให้กลับมาลงสนามได้อีกครั้ง", "มูดริกวิจารณ์การทำงานของ อันดรีย์ เชฟเชนโก ประธานสมาคมฟุตบอลยูเครนว่าให้การสนับสนุนน้อยเกินไปและจัดการปัญหาล่าช้า", "เจ้าตัวเผยว่าต้องเสียค่าใช้จ่ายส่วนตัวหลายล้านปอนด์ไปกับค่าทนายความและการดูแลร่างกายในช่วงที่ถูกแบนจากสโมสรเชลซี"], "full_paragraphs": ["มิไคโล มูดริก ปีกตัวยืมของท็อตแนม ฮอตสเปอร์ ออกมาเปิดเผยว่าเขาโทษการบริหารงานของสมาคมฟุตบอลยูเครนว่าเป็นต้นเหตุที่ทำให้เขาตรวจสารกระตุ้นไม่ผ่านและถูกสั่งแบนจากการแข่งขันฟุตบอลในเวลาต่อมา", "ดาวเตะวัย 25 ปี ซึ่งปัจจุบันย้ายมาอยู่กับสเปอร์สด้วยสัญญายืมตัวตลอดฤดูกาลจากเชลซี ถูกสั่งพักการแข่งขันตั้งแต่เดือนพฤศจิกายน 2024 จนถึงเดือนกรกฎาคม 2026 หลังจากตรวจพบสารต้องห้ามประเภท 'เมลโดเนียม' (meldonium) ในร่างกาย ซึ่งเขาเชื่อว่าสารดังกล่าวเข้าสู่ระบบร่างกายของเขาในระหว่างที่ไปรับใช้ทีมชาติ", "หลังจากที่ตอนแรกต้องเผชิญกับบทลงโทษแบนยาวถึง 4 ปีจากสมาคมฟุตบอลอังกฤษ (FA) มูดริกได้ยื่นอุทธรณ์ต่อศาลอนุญาโตตุลาการกีฬา (CAS) จนประสบความสำเร็จ โดยเขากลับมาลงสนามได้อีกครั้งหลังจากยอมรับว่าได้ละเมิดกฎต่อต้านการใช้สารกระตุ้น และตกลงรับโทษแบนตามระยะเวลาที่เขาได้ชดใช้ไปแล้ว", "หลังจากได้ลงสนามให้เชลซีในช่วงทัวร์ปรีซีซั่นที่เอเชีย มูดริกได้ย้ายมาร่วมทีมท็อตแนม ฮอตสเปอร์ ในวันสุดท้ายของตลาดซื้อขายนักเตะ เพื่อกลับมาร่วมงานกับ โรแบร์โต เด แซร์บี อดีตผู้จัดการทีมของเขาที่ชัคตาร์ โดเนตส์ค อีกครั้ง", "ในการให้สัมภาษณ์อย่างยาวเหยียดกับช่องยูทูบของยูเครนที่ชื่อว่า 'Guest of Gordon' มูดริกถูกถามว่าเขาโทษใครที่เป็นต้นเหตุทำให้เขาต้องห่างหายไปจากวงการฟุตบอล", "เขากล่าวตอบว่า \"สภาพแวดล้อมและสถานการณ์ในทีมชาติยูเครน มันไม่ควรจะเกิดขึ้นเลย ผมอาจจะยังไม่เคยพูดเรื่องนี้ต่อสาธารณะมาก่อน แต่ตอนนี้ผมกำลังพูดแล้ว\"", "\"ผมไม่เคยได้ยินชื่อยาอย่างเมลโดเนียมมาก่อนเลย มันเป็นยาที่คุณจะหาได้เฉพาะในยุโรปตะวันออกเท่านั้น มันน่าจะเข้าสู่ร่างกายของผมได้ก็ต่อเมื่ออยู่ที่ยูเครน ในอังกฤษไม่มีขายยาแบบนี้หรอก\" มูดริกกล่าว", "เขาอธิบายเพิ่มเติมว่าเขาไปที่ยูเครนเพื่อเข้าแคมป์ทีมชาติเท่านั้น และ \"มันชี้ให้เห็นว่าสารนี้อยู่ในแคมป์ทีมชาติ\" เมื่อถูกถามเจาะจงว่าเขาโทษสมาคมฟุตบอลยูเครนใช่หรือไม่ มูดริกตอบว่า \"ใช่ครับ ชัดเจนเลย\"", "นอกจากนี้ เขายังกล่าวว่า อันดรีย์ เชฟเชนโก ประธานสมาคมฟุตบอลยูเครน (UAF) ให้การสนับสนุนเขาเพียงน้อยนิด พร้อมทั้งตำหนิสมาคมฯ เรื่องการปล่อยข้อมูลรั่วไหลระหว่างการพิจารณาคดี และอ้างว่าการจัดการปัญหาของสมาคมฯ ทำให้เขากลับมาลงสนามล่าช้ากว่าที่ควรจะเป็น", "มูดริกยังเปิดเผยว่าเขาต้องเสียเงินหลายล้านปอนด์ไปกับค่าทนายความ ค่าโค้ช ค่าเช่าสนาม และค่ากายภาพบำบัดส่วนตัว ในช่วงที่ไม่สามารถเข้าใช้บริการสิ่งอำนวยความสะดวกของเชลซีได้", "เขากล่าวเสริมว่า \"มันเหมือนฟ้าผ่าลงมากลางวันแสกๆ ผมไม่อยากจะเชื่อเลยว่ามันเป็นเรื่องจริง มันเหมือนกับการตกจากตึกระฟ้า ในฝันคุณอาจจะตกลงพื้น แต่ในชีวิตจริงผมรู้สึกเหมือนตกลงไปเรื่อยๆ ไม่สิ้นสุด มันส่งผลกระทบต่อจิตใจของผมอย่างรุนแรงมาก\"", "มูดริกยอมรับว่าเขาเคยร้องไห้และดื่มแอลกอฮอล์หลังจากทราบข่าวการถูกแบนในตอนแรก แต่เขาก็ไม่เคยสงสัยเลยว่าเขาจะสามารถกลับมาเล่นฟุตบอลระดับสูงได้อีกครั้ง", "ทั้งนี้ BBC Sport ได้ติดต่อไปยังสมาคมฟุตบอลยูเครน (UAF) เพื่อขอความคิดเห็นเกี่ยวกับเรื่องนี้แล้ว โดยเมื่อปีที่แล้วโฆษกของ UAF เคยกล่าวกับ BBC Sport ว่าทางสมาคมฯ \"ติดต่อกับทนายความของมูดริกอย่างใกล้ชิด\" แต่ยังไม่ได้รับการติดต่อจากสมาคมฟุตบอลอังกฤษ (FA) เกี่ยวกับคดีนี้แต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cr930l71z5ejo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cr930l71z5ejo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/000a/live/86e56660-e391-11f1-b4f3-9f0685d52a1f.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795036938, "published_at": "2026-11-18T21:22:18Z", "published_th": "19 พ.ย. 2026 • 04:22 น.", "category_hint": "Football"}, {"id": 1795018538414, "guid": "https://www.bbc.co.uk/sport/football/articles/cj3vgp36z063o", "original_title": "The tightest survival scrap for years? Why it's not too early to worry", "thai_title": "วิกฤตหนีตายพรีเมียร์ลีก: ทำไมการจมโซนแดงหลังผ่าน 10 นัดแรกถึงน่ากังวลกว่าที่คิด", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["สถิติชี้ชัดว่าทีมที่รั้ง 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรก มีโอกาสรอดตกชั้นเพียง 44% เท่านั้น", "พรีเมียร์ลีกฤดูกาลนี้มีความสูสีสูงมาก โดยมีช่องว่างคะแนนระหว่างทีมอันดับ 11 ถึงอันดับสุดท้ายเพียง 5 แต้มเท่านั้น", "คริสตัล พาเลซ และ แมนเชสเตอร์ ยูไนเต็ด ตัดสินใจเปลี่ยนกุนซือใหม่เพื่อกู้สถานการณ์ ในขณะที่ ซันเดอร์แลนด์ ยังคงให้ความเชื่อมั่นในตัว เรจิส เลอ บริส ต่อไป", "ด้วยความเบียดเสียดของตารางคะแนน ทำให้มีความเป็นไปได้ว่าฤดูกาลนี้อาจต้องใช้แต้มสูงถึง 40 คะแนนขึ้นไปเพื่อความอยู่รอด"], "full_paragraphs": ["แม้การแข่งขันพรีเมียร์ลีกจะเพิ่งผ่านไปเพียง 10 นัด แต่การต้องไปจมอยู่ในโซนตกชั้นตั้งแต่ช่วงต้นฤดูกาลนั้นถือเป็นเรื่องที่น่ากังวลมากกว่าที่คุณคิด อย่างไรก็ตาม ด้วยความสูสีของตารางคะแนนในฤดูกาลนี้ นี่อาจกลายเป็นหนึ่งในการต่อสู้เพื่อหนีตกชั้นที่ดุเดือดที่สุดเท่าที่เราเคยเห็นมาในรอบหลายปี", "สองจากสามทีมในโซนตกชั้นปัจจุบันอย่าง คริสตัล พาเลซ และ แมนเชสเตอร์ ยูไนเต็ด กำลังจะกลับมาลงสนามอีกครั้งในช่วงสุดสัปดาห์นี้ภายใต้การคุมทีมของกุนซือคนใหม่ คือ โทมัส แฟรงค์ และ เมาริซิโอ โปเช็ตติโน ตามลำดับ ในขณะที่ ซันเดอร์แลนด์ ซึ่งรั้งอันดับ 19 ยังไม่ได้กดปุ่มฉุกเฉินและยังคงให้ความเชื่อมั่นในตัว เรจิส เลอ บริส ต่อไป", "คำถามคือ มันเร็วเกินไปหรือไม่ที่จะต้องกังวล? เราได้ย้อนกลับไปดูสถิติของการต่อสู้หนีตกชั้นในอดีตเพื่อเรียนรู้ว่าสิ่งเหล่านี้บอกอะไรเราได้บ้างสำหรับช่วงเดือนต่อๆ ไป โดยหากพิจารณาทุกฤดูกาลของพรีเมียร์ลีกนับตั้งแต่เปลี่ยนมาเป็นระบบ 20 ทีมในปี 1995-96 จะพบว่าทีมในโซนตกชั้นปัจจุบันมีเหตุผลที่ต้องกังวลอย่างแท้จริง", "จาก 31 ฤดูกาลที่ผ่านมา มีถึง 19 ฤดูกาล (61%) ที่มีเพียงทีมเดียวจาก 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรกเท่านั้นที่สามารถรอดพ้นจากการตกชั้นได้ โดยเพื่อให้เกิดความยุติธรรมและแม่นยำ '3 อันดับสุดท้าย' ในที่นี้หมายถึงทีมที่มีผลงานแย่ที่สุดหลังผ่าน 10 นัด ไม่ใช่แค่ทีมที่อยู่ในโซนตกชั้น ณ สัปดาห์ที่ 10 เท่านั้น เนื่องจากบางฤดูกาลบางทีมอาจเพิ่งลงเล่นไปเพียง 9 นัด", "มีเพียง 10 ฤดูกาล (32%) เท่านั้นที่ทีมในโซนตกชั้น 3 อันดับแรกสามารถรอดตกชั้นได้ตั้งแต่ 2 ทีมขึ้นไป และเหตุการณ์นี้ไม่เคยเกิดขึ้นเลยตลอด 8 ฤดูกาลหลังสุด ครั้งสุดท้ายที่มีทีมรอดตกชั้นมากกว่า 1 ทีมคือฤดูกาล 2017-18 ซึ่งตอนนั้นทั้ง 3 ทีมสามารถอยู่รอดได้ทั้งหมด", "โดยรวมแล้ว จาก 93 ทีมที่เคยอยู่ใน 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรก มีเพียง 41 ทีมที่รอดพ้นจากการตกชั้น ในขณะที่ 52 ทีมต้องร่วงลงไป คิดเป็นอัตราการรอดชีวิตเพียง 44% เท่านั้น", "สำหรับ คริสตัล พาเลซ นี่เป็นครั้งที่ 3 แล้วที่พวกเขาจมบ๊วยหลังผ่าน 10 นัดแรก ซึ่งทั้งสองครั้งก่อนหน้านี้พวกเขาไม่เพียงแค่รอดตกชั้น แต่ยังทำผลงานได้ดีจนจบอันดับที่ 11 โดยครั้งแรกเกิดขึ้นภายใต้การคุมทีมของ โทนี่ พูลิส ในฤดูกาล 2013-14 และครั้งที่สองภายใต้ รอย ฮอดจ์สัน ในฤดูกาล 2017-18 ซึ่งกุนซือทั้งสองคนต่างเข้ามารับงานในช่วงต้นฤดูกาลหลังจากทีมทำผลงานย่ำแย่ภายใต้ เอียน ฮอลโลเวย์ และ แฟรงค์ เดอ บัวร์ ตามลำดับ", "ฤดูกาล 2013-14 เป็นครั้งเดียวที่ ซันเดอร์แลนด์ และ คริสตัล พาเลซ เคยอยู่ใน 2 อันดับสุดท้ายในช่วงเวลานี้ ซึ่งในตอนนั้น 'แมวดำ' ก็สามารถรอดตกชั้นได้สำเร็จจากการหนีตายในช่วงท้ายฤดูกาลภายใต้การคุมทีมของ กัส โปเยต์", "สำหรับ แมนเชสเตอร์ ยูไนเต็ด นี่เป็นครั้งแรกที่พวกเขาหล่นไปอยู่ใน 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรกของพรีเมียร์ลีก ด้วยขนาดสโมสรและทรัพยากรที่มี จึงเป็นเรื่องยากที่จะเชื่อว่าพวกเขาจะตกชั้น แต่สถิติระบุว่าทีมที่อยู่อันดับ 18 ในช่วงเวลานี้ต้องตกชั้นไปถึง 6 ฤดูกาลติดต่อกันแล้ว", "แฟนบอลของทั้ง 3 สโมสรคงหวังให้เกิดเหตุการณ์ซ้ำรอยปี 2017-18 ที่ทีมในโซนตกชั้นต่างยกระดับผลงานขึ้นมาได้อย่างน่าทึ่งจนจบฤดูกาลในอันดับกลางตารางได้อย่างสบายๆ แม้ประวัติศาสตร์จะชี้ว่ามีเพียงทีมเดียวที่มักจะรอด แต่ก็มีหลักฐานที่บ่งชี้ว่าฤดูกาลนี้อาจไม่ใช่ฤดูกาลปกติของพรีเมียร์ลีก", "คริสตัล พาเลซ มี 7 คะแนน ซึ่งถือเป็นคะแนนที่สูงที่สุดของทีมอันดับสุดท้ายหลังผ่าน 10 นัดในรอบ 24 ปี ส่วน ซันเดอร์แลนด์ ที่มี 8 คะแนน ก็เป็นคะแนนที่สูงที่สุดของทีมอันดับ 19 ในรอบ 16 ปีเช่นกัน ยิ่งไปกว่านั้น ช่องว่างระหว่างทีมอันดับ 11 อย่าง ท็อตแนม ฮ็อตสเปอร์ ที่มี 12 คะแนน กับ คริสตัล พาเลซ ที่มี 7 คะแนน ห่างกันเพียง 5 แต้มเท่านั้น ซึ่งถือเป็นช่องว่างที่น้อยที่สุดในรอบ 24 ปี", "อันดับสูงสุดที่ทีมซึ่งเคยจม 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรกทำได้เมื่อจบฤดูกาลคืออันดับ 8 ซึ่งเกิดขึ้นกับ โบลตัน ในปี 2003-04, ท็อตแนม ในปี 2008-09 และ เอฟเวอร์ตัน ในปี 2017-18 ซึ่งนั่นหมายความว่าสำหรับ แมนเชสเตอร์ ยูไนเต็ด แล้ว อย่างดีที่สุดอาจเป็นเพียงการไปเล่น คอนเฟอเรนซ์ ลีก ในฤดูกาลหน้า", "อย่างไรก็ตาม ตารางคะแนนมีความเบียดเสียดมากจนช่องว่างระหว่าง เชลซี ในอันดับ 5 กับ คริสตัล พ
