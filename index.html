พ้ 3 นัดรวดในลีก แต่มีสถิติข่มฟูแล่มอย่างหนัก", "แอสตัน วิลล่า เตรียมรับมือซันเดอร์แลนด์ที่เพิ่งคว้าชัยเหนือเชลซีมาได้", "ทฤษฎี 'บอลเปลี่ยนโค้ช' อาจไม่เป็นจริงเสมอไป เมื่อสถิติชี้ว่าหลายทีมมีผลงานแย่ลงหลังเปลี่ยนกุนซือ", "บอร์นมัธภายใต้การคุมทีมของ มาร์โก โรเซ่ กำลังอยู่ในช่วงฟอร์มร้อนแรงชนะ 8 นัดรวดทุกรายการ", "เชลซีและลีดส์ ยูไนเต็ด เตรียมทำศึกแห่งศักดิ์ศรีท่ามกลางฟอร์มการเล่นที่ไม่คงเส้นคงวาของทั้งสองทีม"], "full_paragraphs": ["พรีเมียร์ลีกกลับมาลงสนามอีกครั้งหลังจบช่วงพักเบรกทีมชาติ โดยทีมงานนักเขียนของ Sky Sports ได้ร่วมกันวิเคราะห์ประเด็นสำคัญต่างๆ ก่อนที่เกมการแข่งขันสุดสัปดาห์นี้จะเริ่มต้นขึ้น", "แมนเชสเตอร์ ซิตี้ กำลังอยู่ในสถานการณ์วิกฤตก่อนเกมที่จะเปิดบ้านพบกับฟูแล่มในวันเสาร์นี้หรือไม่? หลังจากที่ลูกทีมของ เอ็นโซ มาเรสก้า แพ้ในพรีเมียร์ลีกมา 3 นัดติดต่อกัน จนเสียตำแหน่งจ่าฝูงให้กับอาร์เซนอลไปเป็นที่เรียบร้อย", "ความพ่ายแพ้ต่อแอสตัน วิลล่า, ไบรท์ตัน และน็อตติงแฮม ฟอเรสต์ (ก่อนช่วงพักเบรก) ทำให้ซิตี้แพ้รวมไปแล้วเท่ากับจำนวนนัดที่พวกเขาเคยแพ้ตลอด 36 เกมลีกก่อนหน้านี้รวมกัน", "อย่างไรก็ตาม นับตั้งแต่ฤดูกาล 2007-08 เป็นต้นมา แมนเชสเตอร์ ซิตี้ เคยแพ้ในลีก 4 นัดติดต่อกันเพียงแค่ 2 ครั้งเท่านั้น คือในเดือนสิงหาคม 2008 และธันวาคม 2024 ดังนั้นจึงเป็นเรื่องยากที่จะเชื่อว่าฟูแล่มจะเป็นทีมที่สามารถสร้างความอับอายให้กับพวกเขาได้ในสุดสัปดาห์นี้", "ในความเป็นจริง หากมาเรสก้าสามารถเลือกคู่แข่งที่จะมาเจอเพื่อเรียกฟอร์มเก่งกลับมาได้ เขาคงเลือกฟูแล่ม เพราะซิตี้เอาชนะฟูแล่มได้ตลอด 17 นัดหลังสุดที่พบกันในพรีเมียร์ลีก โดยยิงได้อย่างน้อยนัดละ 2 ประตูทุกครั้ง", "แอสตัน วิลล่า จบช่วงก่อนพักเบรกทีมชาติด้วยความรู้สึกผิดหวัง หลังจากปล่อยให้แมนเชสเตอร์ ยูไนเต็ด ไล่ตามตีเสมอ 4-4 ทั้งที่นำไปก่อนถึงสองครั้ง ในขณะที่ซันเดอร์แลนด์สามารถคว้าชัยชนะสำคัญเหนือเชลซี 1-0 ช่วยลดความกดดันให้กับ เรจิส เลอ บริส กุนซือของทีมได้สำเร็จ", "แม้ซันเดอร์แลนด์จะยังคงอยู่ในโซนตกชั้นจากผลงานช่วงต้นฤดูกาลที่ย่ำแย่ แต่การบุกไปเยือนวิลล่า พาร์ค ถือเป็นงานหนัก โดยเฉพาะเมื่อต้องขาดผู้เล่นอย่าง กรานิต ชาก้า และ ไบรอัน บร็อบบีย์ อย่างไรก็ตาม ชัยชนะเป็นสิ่งที่จำเป็นหากพวกเขาต้องการยุติกระแสข่าวการปลดกุนซือ", "ทัพ 'แมวดำ' มีสถิติเกมเยือนที่ไม่ดีนักในฤดูกาลนี้ โดยชนะเพียงนัดเดียวจากการไปเยือนตอร์เรนเซ่ ทีมในลีกรองของโปรตุเกส อีกทั้งบรรยากาศที่วิลล่า พาร์ค ในฤดูกาลนี้ยังดูเงียบเหงาลงจากการปิดอัฒจันทร์ฝั่งนอร์ทสแตนด์", "วัฏจักรการเปลี่ยนผู้จัดการทีมกลับมาหมุนเวียนอีกครั้ง โดยคริสตัล พาเลซ ได้แต่งตั้ง โธมัส แฟรงค์ เข้ามาคุมทีมที่เซลเฮิร์สต์ พาร์ค ด้วยความหวังใหม่ แต่การมีกุนซือคนใหม่ไม่ได้การันตีว่าจะได้ผลลัพธ์ที่ดีขึ้นเสมอไป", "ในความเป็นจริง ข้อมูลล่าสุดชี้ให้เห็นถึงสิ่งที่ตรงกันข้ามสำหรับทีมที่กำลังประสบปัญหา ทฤษฎี 'บอลเปลี่ยนโค้ช' เป็นสิ่งที่ถูกโรแมนติกเกินจริงไปมาก โดยสถิติระบุว่าจาก 6 ทีมท้ายตารางที่เปลี่ยนกุนซือในช่วงเดือนพฤศจิกายนถึงมีนาคม มีถึง 5 ทีมที่ค่าเฉลี่ยคะแนนต่อเกมลดลงใน 5 นัดถัดมา", "ตัวอย่างเช่น วิตอร์ เปเรย์รา ที่น็อตติงแฮม ฟอเรสต์, อีกอร์ ทูดอร์ ที่ท็อตแนม, ร็อบ เอ็ดเวิร์ดส์ ที่วูล์ฟส์, เกรแฮม พอตเตอร์ ที่เวสต์แฮม และ อิวาน ยูริช ที่เซาแธมป์ตัน นี่คือแนวโน้มที่น่าสนใจซึ่งควรเป็นคำเตือนสำหรับแฟนบอลพาเลซที่คาดหวังว่าแฟรงค์จะเข้ามาเสกมนต์วิเศษให้ทีม", "ความจริงก็คือทีมที่กำลังดิ้นรนหนีตกชั้นมักมีปัญหาฝังรากลึกที่ไม่สามารถแก้ไขได้ด้วยการปรับแท็กติกเพียงเล็กน้อยหรือการพูดปลุกใจ ความมั่นใจ โครงสร้างทีม และคุณภาพของผู้เล่น มักมีความสำคัญมากกว่าเสียงใหม่ๆ ในซุ้มม้านั่งสำรอง โดยพาเลซมีคิวพบกับโคเวนทรีเป็นด่านต่อไป", "บอร์นมัธไม่สามารถคว้าชัยชนะในพรีเมียร์ลีกได้เลยในช่วง 6 สัปดาห์แรกของฤดูกาล แต่ในเดือนที่ผ่านมาพวกเขากลายเป็นทีมที่หยุดไม่อยู่ โดยนับตั้งแต่ชนะสตวร์ม กราซ 3-0 ในยูโรปาลีกเมื่อวันที่ 15 ตุลาคม ทัพ 'เดอะ เชอร์รีส์' ก็ชนะรวด 4 นัดในพรีเมียร์ลีก, 3 นัดในยุโรป และอีก 1 นัดในคาราบาวคัพ จนผ่านเข้าสู่รอบก่อนรองชนะเลิศได้สำเร็จ", "การชนะ 8 นัดติดต่อกันในทุกรายการถือเป็นการเทียบเท่าสถิติสูงสุดของสโมสร ซึ่งน่าทึ่งยิ่งขึ้นเมื่อพิจารณาว่า มาร์โก โรเซ่ เพิ่งเข้ามาคุมทีมได้เพียง 16 นัดเท่านั้น และนี่เป็นฤดูกาลแรกที่สโมสรได้เล่นฟุตบอลยุโรป โดยชัยชนะทั้ง 8 นัดเกิดขึ้นภายในเวลาเพียง 25 วันเท่านั้น", "อิปสวิชกำลังประสบปัญหาเรื่อง จูลิโอ เอ็นซิโซ ไม่ใช่เพราะเขาเล่นไม่ดี แต่เป็นเพราะเขาสำคัญเกินไปจนกลายเป็นกุญแจสำคัญที่คู่แข่งต้องหยุดให้ได้ ซึ่งบอร์นมัธได้พิสูจน์ให้เห็นแล้วก่อน ideos": [], "review_score": "", "published_ts": 1795075200, "published_at": "2026-11-19T08:00:00Z", "published_th": "19 พ.ย. 2026 • 15:00 น.", "category_hint": "Football"}, {"id": 1795074396962, "guid": "https://www.bbc.co.uk/sport/football/articles/c6x28e93zv3jo", "original_title": "How Premier League's big six keep getting richer", "thai_title": "เจาะลึกเหตุผลที่ 'บิ๊กซิกซ์' พรีเมียร์ลีก ยิ่งรวยขึ้นและทิ้งห่างสโมสรอื่นแบบไม่เห็นฝุ่น", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["ช่องว่างรายได้ระหว่างกลุ่ม 'บิ๊กซิกซ์' กับสโมสรอื่นในพรีเมียร์ลีกขยายตัวขึ้นอย่างต่อเนื่องทุกฤดูกาล", "รายได้จากลิขสิทธิ์ถ่ายทอดสดระหว่างประเทศและข้อตกลงเชิงพาณิชย์ระดับโลกเป็นปัจจัยหลักที่ทำให้กลุ่มบิ๊กซิกซ์ทิ้งห่างคู่แข่ง", "ยูฟ่า (Uefa) มีระบบ 'Value Pillar' ที่จัดสรรรายได้มหาศาลให้กับสโมสรที่มีประวัติความสำเร็จในอดีต ทำให้ทีมใหญ่ได้เปรียบทั้งในและต่างประเทศ", "เชลซีเริ่มประสบปัญหาทางการเงินเมื่อเทียบกับทีมบิ๊กซิกซ์อื่น ๆ เนื่องจากข้อจำกัดด้านความจุของสนามสแตมฟอร์ด บริดจ์ ที่ไม่สามารถขยายเพิ่มได้", "เอฟเวอร์ตันเป็นตัวอย่างที่ชัดเจนของสโมสรดั้งเดิมที่ถูกทิ้งห่าง โดยช่องว่างรายได้เมื่อเทียบกับค่าเฉลี่ยของบิ๊กซิกซ์พุ่งสูงจาก 120 ล้านปอนด์ในปี 2009-10 เป็น 442 ล้านปอนด์ในฤดูกาล 2024-25"], "full_paragraphs": ["ผ่านไป 10 นัดในฤดูกาลพรีเมียร์ลีก อันดับท็อป 5 ของตารางถูกครอบครองโดยสโมสรในกลุ่ม 'บิ๊กซิกซ์' เกือบทั้งหมด โดยมีเพียง ไบรท์ตัน ทีมอันดับ 2 ที่มีโมเดลการบริหารงานอันเป็นที่น่าอิจฉาของคู่แข่งหลายทีมเท่านั้นที่สามารถแทรกตัวขึ้นมาได้", "ในแง่ของตัวเลขทางการเงินล้วนๆ เรื่องนี้ไม่ใช่เรื่องน่าประหลาดใจแต่อย่างใด เพราะสโมสรที่ใหญ่ที่สุด 6 แห่ง ได้แก่ แมนเชสเตอร์ ยูไนเต็ด, ลิเวอร์พูล, แมนเชสเตอร์ ซิตี้, อาร์เซนอล, ท็อตแนม ฮอตสเปอร์ และเชลซี ต่างทำรายได้มากกว่าทีมอื่นๆ ในลีกรวมกันหลายร้อยล้านปอนด์ และช่องว่างนี้กำลังขยายตัวขึ้นในทุกๆ ฤดูกาล", "BBC Sport ได้ทำการวิเคราะห์เจาะลึกว่าการเงินของกลุ่มบิ๊กซิกซ์พุ่งทะยานขึ้นได้อย่างไร พร้อมตรวจสอบแนวโน้มใหม่ๆ ผลกระทบต่อตลาดซื้อขายนักเตะ และตั้งคำถามว่าช่องว่างนี้มีความสำคัญมากน้อยเพียงใดในความเป็นจริง", "บริษัทต่างๆ มักนำเงินไปลงทุนในที่ที่แฟนบอลพร้อมจะจ่ายเงิน ซึ่งเป็นข้อเท็จจริงทางธุรกิจที่เรียบง่ายในทุกประเทศ และเป็นความจริงของห่วงโซ่อาหารในโลกฟุตบอล โดยในอังกฤษ ลิเวอร์พูล, อาร์เซนอล และแมนเชสเตอร์ ยูไนเต็ด ครองความนิยมทั้งในแง่ยอดผู้ชม พื้นที่สื่อ ยอดขายเสื้อ และสปอนเซอร์มาอย่างยาวนาน ก่อนที่ในช่วง 20 ปีที่ผ่านมาจะมี เชลซี, แมนเชสเตอร์ ซิตี้ และท็อตแนม ฮอตสเปอร์ เข้ามาสมทบ", "กลุ่มสโมสรเหล่านี้สร้างรายได้มหาศาลจนยากที่จะจินตนาการว่าพวกเขาจะล้มเหลวในระยะยาวได้อย่างไร แม้จะพิจารณาถึงปัญหาผลงานในสนามในระยะสั้นก็ตาม หากเราลองดูว่าช่องว่างนี้เติบโตขึ้นอย่างไร โดยใช้ เอฟเวอร์ตัน ซึ่งเป็นสโมสรเดียวที่ไม่ได้อยู่ในกลุ่มบิ๊กซิกซ์แต่ยังคงอยู่ในพรีเมียร์ลีกมาตั้งแต่ก่อตั้งในปี 1992 จะเห็นได้ชัดว่าแม้แต่สโมสรที่เป็นสมาชิกก่อตั้งลีกก็ยังถูกทิ้งห่างไปไกลเพียงใด", "ในปี 2009-10 ช่องว่างรายได้ระหว่างค่าเฉลี่ยของกลุ่มบิ๊กซิกซ์กับเอฟเวอร์ตันอยู่ที่ 120 ล้านปอนด์ แต่ในฤดูกาล 2024-25 ช่องว่างดังกล่าวขยายตัวขึ้นเป็น 442 ล้านปอนด์", "อะไรคือปัจจัยที่ขับเคลื่อนการเพิ่มขึ้นอย่างมหาศาลนี้? ส่วนใหญ่มาจากความเฟื่องฟูของลิขสิทธิ์ถ่ายทอดสดระหว่างประเทศ คีแรน แม็คไกวร์ ศาสตราจารย์ด้านการเงินฟุตบอลจากมหาวิทยาลัยลิเวอร์พูล กล่าวกับ BBC Sport ว่าสิ่งนี้ได้ดึงดูดบริษัทต่างๆ ที่พร้อมจะจ่ายเงินก้อนโตเพื่อสร้างความเชื่อมโยงกับสโมสรชั้นนำของพรีเมียร์ลีก", "แม็คไกวร์กล่าวว่า 'สโมสรฟุตบอลที่เป็นแบรนด์ใหญ่มีฐานแฟนบอลทั่วโลก ซึ่งทำให้พวกเขามีความน่าดึงดูดใจมากสำหรับพันธมิตรทางการค้าทั่วโลก โดยเฉพาะอย่างยิ่งสำหรับข้อตกลงด้านสปอนเซอร์และหน้าอกเสื้อ เมื่อรวมกับข้อเท็จจริงที่ว่าพรีเมียร์ลีกมีการถ่ายทอดสดไปยัง 190 ประเทศทั่วโลก โดยเฉพาะผู้ชมในต่างประเทศ สิ่งนี้ช่วยให้สโมสรสามารถเจรจาต่อรองราคาที่ดีมากได้'", "รายได้ของเอฟเวอร์ตันเพียง 10% เท่านั้นที่มาจากข้อตกลงทางการค้า ในขณะที่กลุ่มบิ๊กซิกซ์มีสัดส่วนสูงถึง 45% นั่นหมายความว่าเอฟเวอร์ตันและสโมสรอื่นๆ ในลีกต้องพึ่งพารายได้จากลิขสิทธิ์ถ่ายทอดสดเป็นหลัก ซึ่งคิดเป็น 66% ของรายได้ทั้งหมด อย่างน้อยสำหรับเอฟเวอร์ตัน สถานการณ์นี้อาจเปลี่ยนไปหลังจากการย้ายไปสนามแห่งใหม่ แต่ก็ไม่น่าจะเพียงพอที่จะหยุดยั้งช่องว่างที่เพิ่มขึ้นได้", "แม้ต้องใช้เวลาหลายปี แต่ แอสตัน วิลลา และ นิวคาสเซิล ยูไนเต็ด ก็เริ่มเพิ่มรายได้ของตนเองได้บ้าง ซึ่งส่วนใหญ่มาจากผลตอบแทนทางการเงินของการได้ไปเล่นในฟุตบอลยูฟ่า แชมเปียนส์ลีก แต่ถึงกระนั้น ยูฟ่าก็ได้สร้างระบบที่ตอกย้ำตำแหน่งของสโมสรที่ใหญ่ที่สุดเอาไว้", "เมื่อแผนการจัดตั้งยูโรเปียน ซูเปอร์ลีก ถูกทำลายลง ยูฟ่าได้สร้างข้อตกลงทางการเงินใหม่ที่เรียกว่า 'Value Pillar' ซึ่งสำรองรายได้ 35% ของรายได้ทั้งหมดจากแชมเปียนส์ลีก หรือคิดเป็น 713 ล้านปอนด์ ให้กับสโมสรที่ประสบความสำเร็จมากที่สุดในประวัติศาสตร์", "เมื่อสิ้นสุดรอบลีกในฤดูกาลที่แล้ว มีการประเมินว่า แมนเชสเตอร์ ซิตี้ ได้รับเงินจากส่วนนี้ไป 37.9 ล้านปอนด์, ลิเวอร์พูล 35.5 ล้านปอนด์ และเชลซี 33.3 ล้านปอนด์ ในขณะที่ นิวคาสเซิล ได้รับเพียง 13.6 ล้านปอนด์เท่านั้น ข่าวดีสำหรับ แอสตัน วิลลา คือค่าสัมประสิทธิ์ของพวกเขาดีขึ้นมากจากผลงานในยูโรปา ลีก ฤดูกาลที่แล้ว ทำให้คาดการณ์ว่าส่วนแบ่ง Value Pillar ของพวกเขาในฤดูกาลนี้จะอยู่ที่ 25 ล้านปอนด์ แต่ก็ยังน้อยกว่าสโมสรบิ๊กซิกซ์ที่เข้าร่วมการแข่งขันอยู่ดี", "สถานการณ์นี้ทำให้สโมสรที่มีความทะเยอทะยานต้องเผชิญกับความยากลำบาก ไม่ใช่แค่ในประเทศ แต่รวมถึงในยุโรปด้วย หากดูแนวโน้มทางการเงินของกลุ่มบิ๊กซิกซ์ สิ่งหนึ่งที่สังเกตได้ชัดคือ เชลซี กำลังเริ่มร่วงหล่นลงมา ในช่วงสองฤดูกาลที่ผ่านมาเป็นครั้งแรกในประวัติศาสตร์ยุคใหม่ที่ 'สิงห์บลูส์' มีรายได้ต่ำที่สุดในกลุ่มบิ๊กซิกซ์", "ไม่ใช่แค่เพียงเล็กน้อย แต่พวกเขามีรายได้น้อยกว่า ท็อตแนม ฮอตสเปอร์ ถึง 74 ล้านปอนด์ และน้อยกว่า ลิเวอร์พูล และ แมนเชสเตอร์ ซิตี้ ถึง 200 ล้านปอนด์ ปัญหาของเชลซีนั้นเรียบง่ายมาก นั่นคือ 'จำนวนที่นั่ง' สนามสแตมฟอร์ด บริดจ์ มีความจุเพียง 40,000 ที่นั่ง และไม่มีพื้นที่ให้ขยายได้ง่ายๆ ในขณะที่ทีมบิ๊กซิกซ์ที่เหลือต่างมีสนามที่จุผู้ชมได้อย่างน้อย 60,000 คน", "เชลซีมีค่าใช้จ่ายเฉลี่ยต่อแฟนบอลอยู่ที่ 80 ปอนด์ในปี 2024-25 ซึ่งสูงเป็นอันดับสองของลีกรองจาก อาร์เซนอล แต่ด้วยจำนวนตั๋วที่ขายได้น้อยกว่าคู่แข่งในกลุ่มบิ๊กซิกซ์ถึง 20,000 ใบ ทำให้รายได้รวมในวันแข่งขันของเชลซีถูกทิ้งห่างอย่างมหาศาล", "แม็คไกวร์กล่าวทิ้งท้ายว่า 'รายได้ในวันแข่งขันมีความสำคัญมากขึ้นเรื่อยๆ เนื่องจากรายได้จากลิขสิทธิ์ถ่ายทอดสดเริ่มคงที่โดยเฉพาะตั้งแต่ปี 2017 เป็นต้นมา ส่งผลให้สโมสรต่างๆ ต้องมองหาวิธีการเพิ่มรายได้ทางเลือก โดยเฉพาะอย่างยิ่งเมื่อต้นทุนทั้งในสนามและนอกสนามพุ่งสูงขึ้นอย่างรวดเร็ว' รายได้ในวันแข่งขันของเชลซีแทบจะหยุดนิ่ง โดยเพิ่มขึ้นเพียง 16 ล้านปอนด์ในช่วง 10 ปีที่ผ่านมา ในขณะที่ แมนเชสเตอร์ ยูไนเต็ด เพิ่มขึ้น 69 ล้านปอนด์ และ สเปอร์ส เพิ่มขึ้นถึง 85 ล้านปอนด์จากสนามแห่งใหม่", "'เชลซีต้องพึ่งพาการขายนักเตะมากกว่าสโมสรอื่น มีความแตกแยกที่เพิ่มขึ้นเพราะความน่าดึงดูดใจระดับโลกนั้นสอดคล้องกับสโมสรเพียง 3 หรือ 4 แห่งเท่านั้น อาร์เซนอลได้สร้างตัวเองขึ้นมาใหม่ด้วยความก้าวหน้าในแชมเปียนส์ลีก แมนเชสเตอร์ ยูไนเต็ด เป็นแบรนด์ในตัวของมันเอง และลิเวอร์พูลได้ขยายสนามแอนฟิลด์จาก 44,000 เป็น 61,000 ที่นั่ง โดยที่นั่งส่วนเกินจำนวนมากถูกนำไปใช้ในเชิงพาณิชย์' ซึ่งโมเดลการซื้อขายนักเตะที่ประสบความสำเร็จของเชลซีได้ช่วยจำกัดผลกระทบที่เกิดขึ้นได้ในระดับหนึ่งเท่านั้น"], "link": "https://www.bbc.co.uk/sport/football/articles/c6x28e93zv3jo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c6x28e93zv3jo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c612/live/1f6a6e00-e291-11f1-b166-176de21e2352.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795073902, "published_at": "2026-11-19T07:38:22Z", "published_th": "19 พ.ย. 2026 • 14:38 น.", "category_hint": "Football"}, {"id": 1794844906400, "guid": "https://www.skysports.com/football/live-blog/11095/13025492/man-utd-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-and-contracts", "original_title": "Man Utd latest: Pochettino staff arrive in Manchester early to prepare for Liverpool", "thai_title": "อัปเดตสถานการณ์ แมนฯ ยูไนเต็ด: ทีมงานของ โปเช็ตติโน เดินทางถึงแมนเชสเตอร์แล้ว เตรียมพร้อมรับมือ ลิเวอร์พูล", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["รายงานความเคลื่อนไหวล่าสุดของ แมนเชสเตอร์ ยูไนเต็ด ท่ามกลางกระแสข่าวการเตรียมทีม", "ทีมงานของ เมาริซิโอ โปเช็ตติโน เดินทางถึงเมืองแมนเชสเตอร์ล่วงหน้าเพื่อเตรียมความพร้อม", "เป้าหมายสำคัญคือการวางแผนรับมือกับศึกใหญ่ที่จะพบกับ ลิเวอร์พูล", "สถานการณ์ภายในสโมสรยังคงเป็นที่จับตามองอย่างใกล้ชิดจากสื่อมวลชนและแฟนบอล"], "full_paragraphs": ["ความเคลื่อนไหวล่าสุดจากค่าย 'ปีศาจแดง' แมนเชสเตอร์ ยูไนเต็ด กำลังเป็นที่สนใจอย่างมากในขณะนี้ โดยมีรายงานว่าทีมงานของ เมาริซิโอ โปเช็ตติโน ได้เดินทางมาถึงเมืองแมนเชสเตอร์เป็นที่เรียบร้อยแล้ว เพื่อเริ่มต้นภารกิจในการเตรียมความพร้อมสำหรับโปรแกรมการแข่งขันนัดสำคัญที่จะพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล", "การเดินทางมาถึงล่วงหน้าของทีมงานชุดนี้ถือเป็นสัญญาณที่บ่งบอกถึงความจริงจังในการวางแผนงาน โดยเฉพาะอย่างยิ่งเมื่อต้องเผชิญกับความท้าทายในการเจอกับทีมระดับลุ้นแชมป์อย่าง ลิเวอร์พูล ซึ่งถือเป็นบททดสอบสำคัญสำหรับสถานการณ์ของสโมสรในเวลานี้", "แม้ว่าในขณะนี้จะยังไม่มีการประกาศรายละเอียดอย่างเป็นทางการเกี่ยวกับบทบาทที่ชัดเจนของทีมงานชุดดังกล่าว แต่การปรากฏตัวของพวกเขาก็สร้างกระแสวิพากษ์วิจารณ์และคาดการณ์ไปต่างๆ นานาในหมู่แฟนบอลและสื่อมวลชนสายกีฬาที่ติดตามสถานการณ์ของ แมนเชสเตอร์ ยูไนเต็ด อย่างใกล้ชิด", "ทั้งนี้ สถานการณ์ของสโมสรยังคงอยู่ในช่วงที่ต้องเร่งปรับจูนฟอร์มการเล่นให้กลับมาอยู่ในระดับที่คาดหวัง โดยการเตรียมตัวอย่างละเอียดรอบคอบก่อนเกม 'แดงเดือด' ถือเป็นหัวใจสำคัญที่จะช่วยให้ทีมสามารถรับมือกับความกดดันและผลงานในสนามได้อย่างมีประสิทธิภาพมากขึ้น"], "link": "https://www.skysports.com/football/live-blog/11095/13025492/man-utd-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-and-contracts", "canonical_link": "https://www.skysports.com/football/live-blog/11095/13025492/man-utd-transfer-news-rumours-and-gossip-live-updates-and-latest-on-deals-signings-loans-and-contracts", "cover_image_url": "https://e1.365dm.com/26/11/1920x1080/skysports-premier-league-manchester-united_7403807.jpg?20261111114625", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795073400, "published_at": "2026-11-19T07:30:00Z", "published_th": "19 พ.ย. 2026 • 14:30 น.", "category_hint": "Football"}, {"id": 1795075248223, "guid": "https://www.bbc.co.uk/sport/football/articles/ck98z842gp11o", "original_title": "From Forest fringes to Glasner's go-to guy - the rise of McAtee", "thai_title": "จากตัวสำรองสู่หัวใจสำคัญ: เจมส์ แม็คอาที กับการแจ้งเกิดเต็มตัวภายใต้การคุมทีมของ กลาสเนอร์", "tag": "Football", "sub_tag": "FOREST", "bullet_points": ["เจมส์ แม็คอาที พัฒนาตัวเองจากนักเตะที่แทบไม่มีบทบาทในฤดูกาลก่อน กลายเป็นกำลังหลักที่ โอลิเวอร์ กลาสเนอร์ ไว้วางใจในฤดูกาลนี้", "แม็คอาทีทุ่มเทอย่างหนักในช่วงซัมเมอร์ด้วยการเพิ่มมวลกล้ามเนื้อและลดไขมัน พร้อมปรับทัศนคติด้วยการปรึกษานักจิตวิทยาเพื่อสร้างความมั่นใจ", "สถิติส่วนตัวของแม็คอาทีโดดเด่นอย่างมากในฤดูกาลนี้ ทั้งการผ่านบอลในพื้นที่สุดท้าย การสร้างโอกาส และการแย่งบอลคืน ซึ่งเหนือกว่าคู่แข่งในตำแหน่งเดียวกันหลายราย", "เป้าหมายสูงสุดของแม็คอาทีคือการก้าวขึ้นไปติดทีมชาติอังกฤษชุดใหญ่ของ โธมัส ทูเคิล โดยหวังว่าผลงานที่สม่ำเสมอจะช่วยให้เขาได้รับโอกาสในอนาคต"], "full_paragraphs": ["เจมส์ แม็คอาที เคยลงสนามให้แมนเชสเตอร์ ซิตี้ เพียง 6 นัดหลังจากก้าวขึ้นมาจากอคาเดมีของสโมสร แต่ในปัจจุบันเขากลายเป็นหนึ่งในนักเตะที่ทำผลงานได้โดดเด่นที่สุดในช่วงปรีซีซั่นที่ผ่านมา ซึ่งความประทับใจแรกของ โอลิเวอร์ กลาสเนอร์ กุนซือของน็อตติงแฮม ฟอเรสต์ ที่มีต่อกองกลางรายนี้ ได้กลายเป็นเครื่องพิสูจน์ถึงความเชื่อมั่นที่เฮดโค้ชชาวออสเตรียมีให้เขาอย่างเต็มที่", "ดูเหมือนว่าฟอเรสต์จะค้นพบตัวแทนของ เอลเลียต แอนเดอร์สัน จากภายในทีมเอง เมื่อแม็คอาทีกลายเป็นผู้เล่นคนสำคัญของกลาสเนอร์ หลังจากย้ายมาร่วมทีมด้วยค่าตัว 30 ล้านปอนด์ในปี 2025 แม็คอาทีต้องเผชิญกับช่วงเวลาที่ยากลำบากในการปรับตัวที่ซิตี้ กราวด์ แต่เขาก็มีบทบาทสำคัญในการช่วยให้ฟอเรสต์เอาชนะแมนเชสเตอร์ ซิตี้ และแอนเดอร์สันที่เพิ่งย้ายกลับมาได้สำเร็จ ก่อนช่วงพักเบรกทีมชาติ ซึ่งถือเป็นชัยชนะในบ้านนัดแรกของฤดูกาล", "แม้จะยังไม่มีกระแสเรียกร้องให้เขาติดทีมชาติอังกฤษ แต่คำถามที่น่าสนใจคือ โธมัส ทูเคิล มองข้ามแม็คอาทีไปอย่างไม่เป็นธรรมหรือไม่ และเขาก้าวจากม้านั่งสำรองมาเป็นผู้เล่นที่ขาดไม่ได้ได้อย่างไร? อดีตเด็กปั้นจากอคาเดมีของซิตี้รายนี้ได้ออกสตาร์ทเป็นตัวจริงในพรีเมียร์ลีกเพียง 2 นัดเมื่อฤดูกาลที่แล้ว ซึ่งเป็นหนึ่งในเหยื่อของความวุ่นวายในสโมสรที่เปลี่ยนผู้จัดการทีมถึง 4 คน", "แม้จะได้ลงตัวจริง 9 นัดในเส้นทางสู่รอบรองชนะเลิศยูโรปาลีก แต่ก็ไม่อาจกลบความผิดหวังตลอดทั้งฤดูกาลได้ มันควรจะเป็นเวทีแจ้งเกิดหลังจากที่เขาพาทีมชาติอังกฤษชุดอายุต่ำกว่า 21 ปีคว้าแชมป์ยูโร 2025 ในฐานะกัปตันทีม แต่เขากลับได้ลงเล่นในลีกเพียง 289 นาทีเท่านั้น อย่างไรก็ตาม แข้งวัย 24 ปีรายนี้ลงเล่นไปแล้วมากกว่าเดิมถึง 3 เท่าในฤดูกาลนี้ หลังจากกลายเป็นผู้เล่นหลักของกลาสเนอร์และได้ออกสตาร์ทเป็นตัวจริงในทุกเกมบนลีกสูงสุด", "เรื่องนี้เกิดขึ้นหลังจากที่ผู้จัดการทีมแนะนำในช่วงซัมเมอร์ว่า แม็คอาทีอาจเข้ามาแทนที่แอนเดอร์สันหลังจากที่เขาย้ายไปซิตี้ด้วยค่าตัว 116 ล้านปอนด์ ซึ่งเป็นสิ่งที่ทำให้แม็คอาทีรู้สึกไม่มั่นใจในตอนแรก โดยเขากล่าวที่สนามซ้อมของฟอเรสต์ว่า 'ตอนที่ผมเข้ามาครั้งแรกและกลาสเนอร์ให้ผมเล่นในตำแหน่งหมายเลข 6 ในวันที่สอง ในหัวผมคิดว่า เขาคงไม่เห็นผมอยู่ในแผนการทำทีมแน่ๆ เพราะผมต้องเล่นลึกกว่าเดิม'", "'ความมั่นใจของผมกำลังเพิ่มขึ้น แม้จะยังไม่เต็มร้อย แต่ผมคิดว่าเรากำลังมาถูกทาง ผมคิดว่าผมมีทักษะนี้อยู่ในตัว แต่ไม่เคยคิดว่าเขาจะลองให้ผมเล่นจริงๆ ในช่วงปรีซีซั่น ผมคิดว่าตอนนั้น อิบราฮิม่า ซ็องกาเร่ บาดเจ็บ ผมเลยคิดว่าผมแค่เข้ามาแทนที่อิบรา แต่พอปรีซีซั่นดำเนินไปเรื่อยๆ และผมได้เล่นตรงนั้น ผมก็รู้สึกสบายใจขึ้น'", "นี่คือหลักฐานของการทำงานหนักของแม็คอาทีหลังจากที่เขาใช้เวลาตลอดช่วงซัมเมอร์เพื่อเตรียมตัวสำหรับปรีซีซั่น เขาฝึกซ้อมกับ เดวิด นอร์ริส อดีตกองกลางของพลีมัธ ลีดส์ และอิปสวิช ซึ่งปัจจุบันเป็นเทรนเนอร์ส่วนตัว โดยเขาสามารถเพิ่มมวลกล้ามเนื้อได้ 2.5 กิโลกรัม และลดไขมันลงได้ 1 กิโลกรัม การฝึกซ้อมเวทเทรนนิ่งตามด้วยการฝึกความฟิตในช่วงเช้า คือสิ่งที่ทำให้กลาสเนอร์ชื่นชมความมุ่งมั่นของเขาในช่วงซัมเมอร์", "ความสัมพันธ์กับกลาสเนอร์มีความสำคัญอย่างยิ่ง กุนซือฟอเรสต์มอบความชัดเจนและความสงบให้กับทีมที่ต้องเผชิญกับความวุ่นวายเมื่อฤดูกาลที่แล้ว หลังจากความพ่ายแพ้ต่อเบรนท์ฟอร์ด 2-0 ได้กระตุ้นให้ทีมตอบสนองในทางที่ถูกต้อง หลังจากเริ่มต้นฤดูกาลจนทำให้ทีมอยู่อันดับที่ 16 ของตาราง หลังจากที่แม็คอาทีไม่สามารถรักษาความสม่ำเสมอได้ในฤดูกาลที่แล้ว กลาสเนอร์สัญญาว่าเขาจะให้เวลาและโอกาสหากเขาเล่นได้ไม่ดีในบางเกม", "'ผมคิดว่าฤดูกาลที่แล้วเป็นปัญหาที่ตัวผมเอง ผมพยายามอย่างหนักที่จะคว้าโอกาส' เขากล่าวหลังจากได้ใช้นักจิตวิทยาช่วยก่อนเริ่มปรีซีซั่น 'ผมไม่เคยเจอฤดูกาลแบบนั้นมาก่อน ผมเข้าๆ ออกๆ ตลอด มันน่าหงุดหงิด แต่มันก็เป็นบทเรียนที่ดี ในขณะที่ผมเห็นความมั่นใจของตัวเองลดลงเรื่อยๆ เมื่อดูคลิปการเล่นของตัวเอง ผมบอกได้เลยว่าตอนไหนที่ผมเริ่มฟอร์มตก ปีนี้ถ้าผมจ่ายบอลพลาด ผมจะไม่กังวลมากเท่าเดิมเพราะผมผ่านจุดนั้นมาแล้ว'", "แม็คอาทีได้รับการสนับสนุนที่ซิตี้ กราวด์มาโดยตลอด ผู้จัดการทีมทั้ง 4 คนต่างประทับใจในระดับการฝึกซ้อมของเขาเมื่อฤดูกาลที่แล้ว แต่เขามักจะอยู่ภายใต้ความกดดันที่ต้องโชว์ฟอร์มให้ได้เมื่อได้รับโอกาสเพียงน้อยนิด จอร์จ ซีเรียโนส ผู้อำนวยการฝ่ายเทคนิคของฟอเรสต์ ก็เป็นอีกคนที่คอยสนับสนุนแม็คอาทีภายในสโมสร สิ่งนี้ทำให้แม็คอาที ซึ่งมีพี่ชายชื่อ จอห์น ที่เล่นให้กับโบลตัน รู้สึกถึงความเชื่อมั่นหลังจากเรียนรู้จากความยากลำบากในอดีต โดยมีทีมชาติอังกฤษเป็นเป้าหมายในใจ", "เขากระตือรือร้นที่จะก้าวขึ้นสู่ทีมชุดใหญ่ของทูเคิลและได้รับการสนับสนุนจากสมาคมฟุตบอลอังกฤษ เขาให้ความสำคัญกับการเล่นให้ทีมชุด U21 ในศึกยูโร 2025 มากกว่าการไปเล่นสโมสรโลกกับซิตี้ และได้แสดงความมุ่งมั่นที่จะรับใช้ทีมชาติให้ เป๊ป กวาร์ดิโอล่า และ ซิกิ เบกิริสไตน์ ผู้อำนวยการฟุตบอลในขณะนั้นได้รับทราบ ตอนนี้ภายใต้การคุมทีมของกลาสเนอร์ หลังจากฤดูกาลแรกที่ยากลำบาก แม็คอาทีมีเวทีที่พร้อมแล้ว และยูโร 2028 ก็เป็นเป้าหมายที่เป็นไปได้จริง", "'ในตอนนี้ผมต้องมีปีที่ดีเพื่อให้มีโอกาสถูกเรียกตัว แต่การแข่งขันในตำแหน่งที่ผมเล่นนั้นสูงมาก' เขากล่าว 'ถ้าผมสามารถทำประตูหรือเพิ่มสถิติได้ มันอาจทำให้ผมมีโอกาสเข้าไปอยู่ในวงโคจรนั้น การแข่งขันในระดับนี้ถือว่าสูงมาก แต่นั่นคือเป้าหมายที่ผมวางไว้'", "ในเกมที่พบกับซิตี้ เขาถูกขยับขึ้นไปเล่นเกมรุกมากขึ้น โดยมี ไรอัน เยตส์ เข้ามาช่วยเพิ่มจำนวนผู้เล่นในแดนกลาง แต่สถิติยืนยันถึงการพัฒนาของแม็คอาทีได้เป็นอย่างดี เขาทำสถิติผ่านบอลในพื้นที่สุดท้ายได้มากที่สุดให้ฟอเรสต์ (151 ครั้ง) และจ่ายบอลทะลุช่องได้มากที่สุดเท่ากับ มอร์แกน กิ๊บบ์ส-ไวท์ (5 ครั้ง) การผ่านบอลรวม 426 ครั้งของเขาเป็นรองเพียง มูริลโล่ (501 ครั้ง) และเขาสร้างโอกาสไปแล้ว 18 ครั้ง ซึ่งน้อยกว่ากิ๊บบ์ส-ไวท์เพียง 6 ครั้งเท่านั้น", "แม็คอาทีมีระยะทางการพาบอล 1,180 เมตร ซึ่งตามหลังกิ๊บบ์ส-ไวท์เพียง 29 เมตร แต่เขาทำสถิติการพาบอลมากที่สุดถึง 109 ครั้ง และแย่งบอลคืนได้ถึง 63 ครั้ง โดยชนะการดวลภาคพื้นดิน 53% ซึ่งบ่งบอกว่าเขาพัฒนาความดุดันในการเล่นมากขึ้น เขายังทำผลงานได้เหนือกว่า เจมส์ การ์เนอร์ ของเอฟเวอร์ตัน ทั้งในด้านการสร้างโอกาส การจ่ายบอลไปข้างหน้า การดวลเกมรับ และการเข้าสกัดที่สำเร็จ นอกจากนี้เขายังทำสถิติการแย่งบอลคืน การเข้าสกัด การผ่านบอล และการเคลียร์บอลได้มากกว่า อดัม วาร์ตัน ของคริสตัล พาเลซ อีกด้วย", "ตอนนี้หลังจากที่เขาทำผลงานได้แบบเงียบๆ ในฤดูกาลนี้ เมื่อถึงช่วงพักเบรกทีมชาติในเดือนมีนาคม ทูเคิลอาจไม่สามารถมองข้ามเขาได้อีกต่อไป 'ผมมองว่านี่เป็นอีกด้านหนึ่งของตัวผม ผมมีความมั่นใจในสนามมากขึ้น และรู้สึกสบายใจขึ้นมาก' แม็คอาทีกล่าวทิ้งท้าย 'มันเหมือนกับว่าผมเป็นนักเตะคนละคนเลย'"], "link": "https://www.bbc.co.uk/sport/football/articles/ck98z842gp11o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/ck98z842gp11o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/cfef/live/f045c5a0-dc43-11f1-95cf-a38331e6cb4b.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/558d/live/50076d80-e357-11f1-acd4-25eaaa5def63.jpg"], "videos": [], "review_score": "", "published_ts": 1795072451, "published_at": "2026-11-19T07:14:11Z", "published_th": "19 พ.ย. 2026 • 14:14 น.", "category_hint": "Football"}, {"id": 1795040133039, "guid": "https://www.skysports.com/football/chelsea-women-vs-paris-saint-germain-women/report/578268", "original_title": "Chelsea snatch late winner vs PSG to move top of WCL table", "thai_title": "เชลซีเฉือนชนะเปแอสเชช่วงท้ายเกม 1-0 ทะยานขึ้นจ่าฝูงยูฟ่า วีเมนส์ แชมเปียนส์ลีก", "tag": "Football", "sub_tag": "CHELSEA", "bullet_points": ["เชลซีคว้าชัยชนะเหนือ ปารีส แซงต์-แชร์กแมง 1-0 จากประตูชัยของ เวียร์เลอ บูร์มัน ในนาทีที่ 88", "ชัยชนะนัดนี้ส่งผลให้ทัพ 'สิงห์บลูส์หญิง' ขยับขึ้นไปรั้งตำแหน่งจ่าฝูงของตารางคะแนนในรอบลีกเฟส", "เชลซียังคงรักษาสถิติไร้พ่ายในรายการยุโรปฤดูกาลนี้ โดยชนะไปแล้ว 3 จาก 5 นัด", "ทีมของ โซเนีย บอมปาสตอร์ ต้องการเพียงผลการแข่งขันที่ดีในนัดสุดท้ายที่จะพบกับ โอเอช เลอเฟิน เพื่อการันตีการผ่านเข้าสู่รอบ 16 ทีมสุดท้าย"], "full_paragraphs": ["เวียร์เลอ บูร์มัน สวมบทฮีโร่ทำประตูชัย งจักรเกมรับอันยอดเยี่ยมของอาร์เซน่อล โดยผสมผสานความดุดันแบบดั้งเดิมเข้ากับการเล่นลูกกลางอากาศที่ไม่มีใครเทียบได้ทั้งในกรอบเขตโทษตัวเองและคู่แข่ง กาเบรียลทำประตูได้มากที่สุดในบรรดากองหลังพรีเมียร์ลีกนับตั้งแต่ฤดูกาล 2020/21 (21 ประตู) ทุกทีมที่คว้าแชมป์จำเป็นต้องมีนักรบ และอาร์เซน่อลก็มีเขาอยู่ในทีม", "ดาบิด รายา ผู้รักษาประตูรายนี้ช่วยยกระดับผลงานเกมรับของอาร์เซน่อล เขาไม่ใช่แค่คนเซฟประตู แต่เป็นผู้เล่นเอาต์ฟิลด์คนที่ 11 เป็นสวีปเปอร์ และเป็นความนิ่งที่รวมอยู่ในคนเดียว โดยเขาสามารถเก็บคลีนชีตได้มากที่สุดนับตั้งแต่ประเดิมสนามให้ทีม (55 ครั้ง) มากกว่าผู้รักษาประตูคนอื่นในพรีเมียร์ลีก เขาคือผู้รักษาประตูยุคใหม่ที่สมบูรณ์แบบ", "เดแคลน ไรซ์ ยังคงรั้งอันดับสองเหมือนเดิม เขาคือเครื่องยนต์ หัวใจ และกรมธรรม์ประกันภัยของอาร์เซน่อล ความสามารถในการครองเกมแดนกลาง การวิ่งครอบคลุมพื้นที่มหาศาล และการมีอิทธิพลต่อเกมทั้งในกรอบเขตโทษทั้งสองฝั่ง ทำให้เขาแทบจะเป็นนักเตะที่หาใครมาแทนไม่ได้", "เออร์ลิง ฮาแลนด์ คือปรากฏการณ์การทำประตูที่ตอนนี้ขึ้นมาครองอันดับ 1 ของตาราง ขยับขึ้นมาจากอันดับ 4 เมื่อเดือนมีนาคม ในช่วงเวลาดังกล่าวเขาทำไป 14 ประตูในพรีเมียร์ลีก ซึ่งเกือบเป็นสองเท่าของนักเตะคนถัดไปในรายการนี้ ฮาแลนด์คว้าบัลลังก์ไปจาก บรูโน่ แฟร์นันด์ส", "เช่นเดียวกับ แมนเชสเตอร์ ยูไนเต็ด บรูโน่ แฟร์นันด์ส ก็ร่วงลงมา กัปตันทีมปีศาจแดงเคยนั่งแท่นอันดับ 1 ของท็อป 25 พรีเมียร์ลีกเมื่อเดือนมีนาคม แต่ 8 เดือนผ่านไป เขาร่วงลงมาถึง 10 อันดับมาอยู่ที่ 11 นี่คือการตกต่ำครั้งใหญ่สำหรับนักเตะที่เคยถูกมองว่าเป็นผู้เล่นที่มีอิทธิพลมากที่สุดในลีก แฟร์นันด์สยังคงเป็นนักเตะที่มีความสามารถเหลือร้าย แต่ปัญหาของยูไนเต็ดทำให้ยากขึ้นเรื่อยๆ ที่จอมทัพรายนี้จะครองเกมได้", "และใครที่มาแย่งบัลลังก์ของเขา? ก็คือเครื่องจักรสังหารประตูชาวนอร์เวย์รายนี้ ฮาแลนด์ขยับจากอันดับ 4 ขึ้นมาเป็นที่ 1 เขาเหมือนสูตรโกงในเกมฟุตบอล เป็นมนุษย์ต่างดาวในคราบนักเตะ", "การเปลี่ยนแปลงครั้งใหญ่ที่สุดเกิดขึ้นในอันดับที่ต่ำลงมา มีนักเตะถึง 11 คนที่หลุดออกจากท็อป 25 ได้แก่ จานลุยจิ ดอนนารุมม่า, เยอร์เรียน ทิมเบอร์, อิกอร์ ติอาโก้, อูโก้ เอกิติเก้, มาร์ติน ซูบิเมนดี้, รีซ เจมส์, ไบรอัน เอ็มเบอโม่, มาร์ค เกฮี และ เอ็นโซ่ เฟร์นานเดซ รวมถึง แบร์นาร์โ thai_title": "วิกฤตหนีตายพรีเมียร์ลีก: ทำไมการจมโซนแดงหลังผ่าน 10 นัดแรกถึงน่ากังวลกว่าที่คิด", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["สถิติชี้ชัดว่าทีมที่รั้ง 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรก มีโอกาสรอดตกชั้นเพียง 44% เท่านั้น", "พรีเมียร์ลีกฤดูกาลนี้มีความสูสีสูงมาก โดยมีช่องว่างคะแนนระหว่างทีมอันดับ 11 ถึงอันดับสุดท้ายเพียง 5 แต้มเท่านั้น", "คริสตัล พาเลซ และ แมนเชสเตอร์ ยูไนเต็ด ตัดสินใจเปลี่ยนกุนซือใหม่เพื่อกู้สถานการณ์ ในขณะที่ ซันเดอร์แลนด์ ยังคงให้ความเชื่อมั่นในตัว เรจิส เลอ บริส ต่อไป", "ด้วยความเบียดเสียดของตารางคะแนน ทำให้มีความเป็นไปได้ว่าฤดูกาลนี้อาจต้องใช้แต้มสูงถึง 40 คะแนนขึ้นไปเพื่อความอยู่รอด"], "full_paragraphs": ["แม้การแข่งขันพรีเมียร์ลีกจะเพิ่งผ่านไปเพียง 10 นัด แต่การต้องไปจมอยู่ในโซนตกชั้นตั้งแต่ช่วงต้นฤดูกาลนั้นถือเป็นเรื่องที่น่ากังวลมากกว่าที่คุณคิด อย่างไรก็ตาม ด้วยความสูสีของตารางคะแนนในฤดูกาลนี้ นี่อาจกลายเป็นหนึ่งในการต่อสู้เพื่อหนีตกชั้นที่ดุเดือดที่สุดเท่าที่เราเคยเห็นมาในรอบหลายปี", "สองจากสามทีมในโซนตกชั้นปัจจุบันอย่าง คริสตัล พาเลซ และ แมนเชสเตอร์ ยูไนเต็ด กำลังจะกลับมาลงสนามอีกครั้งในช่วงสุดสัปดาห์นี้ภายใต้การคุมทีมของกุนซือคนใหม่ คือ โทมัส แฟรงค์ และ เมาริซิโอ โปเช็ตติโน ตามลำดับ ในขณะที่ ซันเดอร์แลนด์ ซึ่งรั้งอันดับ 19 ยังไม่ได้กดปุ่มฉุกเฉินและยังคงให้ความเชื่อมั่นในตัว เรจิส เลอ บริส ต่อไป", "คำถามคือ มันเร็วเกินไปหรือไม่ที่จะต้องกังวล? เราได้ย้อนกลับไปดูสถิติของการต่อสู้หนีตกชั้นในอดีตเพื่อเรียนรู้ว่าสิ่งเหล่านี้บอกอะไรเราได้บ้างสำหรับช่วงเดือนต่อๆ ไป โดยหากพิจารณาทุกฤดูกาลของพรีเมียร์ลีกนับตั้งแต่เปลี่ยนมาเป็นระบบ 20 ทีมในปี 1995-96 จะพบว่าทีมในโซนตกชั้นปัจจุบันมีเหตุผลที่ต้องกังวลอย่างแท้จริง", "จาก 31 ฤดูกาลที่ผ่านมา มีถึง 19 ฤดูกาล (61%) ที่มีเพียงทีมเดียวจาก 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรกเท่านั้นที่สามารถรอดพ้นจากการตกชั้นได้ โดยเพื่อให้เกิดความยุติธรรมและแม่นยำ '3 อันดับสุดท้าย' ในที่นี้หมายถึงทีมที่มีผลงานแย่ที่สุดหลังผ่าน 10 นัด ไม่ใช่แค่ทีมที่อยู่ในโซนตกชั้น ณ สัปดาห์ที่ 10 เท่านั้น เนื่องจากบางฤดูกาลบางทีมอาจเพิ่งลงเล่นไปเพียง 9 นัด", "มีเพียง 10 ฤดูกาล (32%) เท่านั้นที่ทีมในโซนตกชั้น 3 อันดับแรกสามารถรอดตกชั้นได้ตั้งแต่ 2 ทีมขึ้นไป และเหตุการณ์นี้ไม่เคยเกิดขึ้นเลยตลอด 8 ฤดูกาลหลังสุด ครั้งสุดท้ายที่มีทีมรอดตกชั้นมากกว่า 1 ทีมคือฤดูกาล 2017-18 ซึ่งตอนนั้นทั้ง 3 ทีมสามารถอยู่รอดได้ทั้งหมด", "โดยรวมแล้ว จาก 93 ทีมที่เคยอยู่ใน 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรก มีเพียง 41 ทีมที่รอดพ้นจากการตกชั้น ในขณะที่ 52 ทีมต้องร่วงลงไป คิดเป็นอัตราการรอดชีวิตเพียง 44% เท่านั้น", "สำหรับ คริสตัล พาเลซ นี่เป็นครั้งที่ 3 แล้วที่พวกเขาจมบ๊วยหลังผ่าน 10 นัดแรก ซึ่งทั้งสองครั้งก่อนหน้านี้พวกเขาไม่เพียงแค่รอดตกชั้น แต่ยังทำผลงานได้ดีจนจบอันดับที่ 11 โดยครั้งแรกเกิดขึ้นภายใต้การคุมทีมของ โทนี่ พูลิส ในฤดูกาล 2013-14 และครั้งที่สองภายใต้ รอย ฮอดจ์สัน ในฤดูกาล 2017-18 ซึ่งกุนซือทั้งสองคนต่างเข้ามารับงานในช่วงต้นฤดูกาลหลังจากทีมทำผลงานย่ำแย่ภายใต้ เอียน ฮอลโลเวย์ และ แฟรงค์ เดอ บัวร์ ตามลำดับ", "ฤดูกาล 2013-14 เป็นครั้งเดียวที่ ซันเดอร์แลนด์ และ คริสตัล พาเลซ เคยอยู่ใน 2 อันดับสุดท้ายในช่วงเวลานี้ ซึ่งในตอนนั้น 'แมวดำ' ก็สามารถรอดตกชั้นได้สำเร็จจากการหนีตายในช่วงท้ายฤดูกาลภายใต้การคุมทีมของ กัส โปเยต์", "สำหรับ แมนเชสเตอร์ ยูไนเต็ด นี่เป็นครั้งแรกที่พวกเขาหล่นไปอยู่ใน 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรกของพรีเมียร์ลีก ด้วยขนาดสโมสรและทรัพยากรที่มี จึงเป็นเรื่องยากที่จะเชื่อว่าพวกเขาจะตกชั้น แต่สถิติระบุว่าทีมที่อยู่อันดับ 18 ในช่วงเวลานี้ต้องตกชั้นไปถึง 6 ฤดูกาลติดต่อกันแล้ว", "แฟนบอลของทั้ง 3 สโมสรคงหวังให้เกิดเหตุการณ์ซ้ำรอยปี 2017-18 ที่ทีมในโซนตกชั้นต่างยกระดับผลงานขึ้นมาได้อย่างน่าทึ่งจนจบฤดูกาลในอันดับกลางตารางได้อย่างสบายๆ แม้ประวัติศาสตร์จะชี้ว่ามีเพียงทีมเดียวที่มักจะรอด แต่ก็มีหลักฐานที่บ่งชี้ว่าฤดูกาลนี้อาจไม่ใช่ฤดูกาลปกติของพรีเมียร์ลีก", "คริสตัล พาเลซ มี 7 คะแนน ซึ่งถือเป็นคะแนนที่สูงที่สุดของทีมอันดับสุดท้ายหลังผ่าน 10 นัดในรอบ 24 ปี ส่วน ซันเดอร์แลนด์ ที่มี 8 คะแนน ก็เป็นคะแนนที่สูงที่สุดของทีมอันดับ 19 ในรอบ 16 ปีเช่นกัน ยิ่งไปกว่านั้น ช่องว่างระหว่างทีมอันดับ 11 อย่าง ท็อตแนม ฮ็อตสเปอร์ ที่มี 12 คะแนน กับ คริสตัล พาเลซ ที่มี 7 คะแนน ห่างกันเพียง 5 แต้มเท่านั้น ซึ่งถือเป็นช่องว่างที่น้อยที่สุดในรอบ 24 ปี", "อันดับสูงสุดที่ทีมซึ่งเคยจม 3 อันดับสุดท้ายหลังผ่าน 10 นัดแรกทำได้เมื่อจบฤดูกาลคืออันดับ 8 ซึ่งเกิดขึ้นกับ โบลตัน ในปี 2003-04, ท็อตแนม ในปี 2008-09 และ เอฟเวอร์ตัน ในปี 2017-18 ซึ่งนั่นหมายความว่าสำหรับ แมนเชสเตอร์ ยูไนเต็ด แล้ว อย่างดีที่สุดอาจเป็นเพียงการไปเล่น คอนเฟอเรนซ์ ลีก ในฤดูกาลหน้า", "อย่างไรก็ตาม ตารางคะแนนมีความเบียดเสียดมากจนช่องว่างระหว่าง เชลซี ในอันดับ 5 กับ คริสตัล พาเลซ ห่างกันเพียง 9 แต้ม ซึ่งถือเป็นช่องว่างที่น้อยที่สุดในรอบ 16 ปี และด้วยเหตุที่อันดับ 5 มักเป็นโควตาไปเล่น แชมเปี้ยนส์ ลีก ในช่วงหลัง แฟนบอลยูไนเต็ดที่มองโลกในแง่ดีอาจจะยังไม่ตัดโอกาสนี้ทิ้งไปเสียทีเดียว", "นั่นหมายความว่าแม้แต่ทีมที่เริ่มต้นฤดูกาลได้ดีก็อาจถูกดึงเข้ามาพัวพันกับการหนีตกชั้นได้เช่นกัน โดยสถิติคะแนนสูงสุดของทีมที่ตกชั้นหลังผ่าน 10 นัดแรกคือ 14 คะแนน ซึ่งเกิดขึ้นกับ แมนเชสเตอร์ ซิตี้ ของ โจ รอยล์ ในฤดูกาล 2000-01 ส่วนทีมล่าสุดที่เริ่มต้นได้ดีแต่สุดท้ายต้องตกชั้นคือ บอร์นมัธ ของ เอ็ดดี้ ฮาว ในฤดูกาล 2019-20 ที่เคยรั้งอันดับ 9 ด้วยคะแนน 13 แต้ม แต่กลับต้องตกชั้นในวันสุดท้ายของฤดูกาล", "ดังที่กล่าวไป ฤดูกาลนี้มีทั้งทีมอันดับสุดท้ายที่มีคะแนนดีที่สุดและตารางคะแนนช่วงล่างที่เบียดเสียดที่สุดนับตั้งแต่ปี 2002-03 ซึ่งในฤดูกาลนั้น เวสต์แฮม ต้องตกชั้นในวันสุดท้ายด้วยคะแนนถึง 42 แต้ม ซึ่งถือเป็นคะแนนสูงสุดที่ทีมตกชั้นเคยทำได้ในประวัติศาสตร์พรีเมียร์ลีก และจากสถานการณ์ในฤดูกาลนี้ เป็นไปได้ว่า 40 คะแนนอาจไม่เพียงพอสำหรับการอยู่รอด"], "link": "https://www.bbc.co.uk/sport/football/articles/cj3vgp36z063o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cj3vgp36z063o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5f51/live/09641460-e33d-11f1-a094-5fdc692f3e33.png", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795018195, "published_at": "2026-11-18T16:09:55Z", "published_th": "18 พ.ย. 2026 • 23:09 น.", "category_hint": "Football"}, {"id": 1795022234940, "guid": "https://www.skysports.com/football/live-blog/11095/13612918/premier-league-predictor-predict-the-fixtures-each-gameweek-generate-your-table-and-share-results", "original_title": "Premier League predictor - play our new game each week!", "thai_title": "ท้าดวลกึ๋น! พรีเมียร์ลีกเปิดตัวเกมทำนายผลการแข่งขันใหม่ให้แฟนบอลร่วมสนุกทุกสัปดาห์", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["พรีเมียร์ลีกเปิดตัวเกมทำนายผลการแข่งขันรูปแบบใหม่ที่ให้แฟนบอลได้ร่วมสนุกในทุกสัปดาห์", "ผู้เล่นสามารถทำนายผลการแข่งขันของทุกคู่ในแต่ละสัปดาห์และเปรียบเทียบความคิดเห็นกับแฟนบอลคนอื่นๆ ได้", "มีฟีเจอร์เครื่องคำนวณตารางคะแนน (Table Calculator) เพื่อให้ผู้เล่นจำลองสถานการณ์ตารางคะแนนตามผลการทำนายของตนเอง", "ผู้เล่นสามารถแชร์ผลการทำนายและตารางคะแนนที่จำลองขึ้นให้กับเพื่อนๆ ได้", "ระบบรองรับการกลับมาเล่นใหม่ได้ในทุกสัปดาห์ที่มีการแข่งขันพรีเมียร์ลีก"], "full_paragraphs": ["พรีเมียร์ลีกได้เปิดตัวเกมใหม่ล่าสุดที่ให้แฟนบอลได้ร่วมสนุกด้วยการทำนายผลการแข่งขันในทุกสัปดาห์ โดยผู้เล่นสามารถคาดการณ์ผลการแข่งขันของทุกคู่ที่จะลงสนามในแต่ละสัปดาห์ เพื่อดูว่ามีแฟนบอลคนอื่นๆ คิดเห็นตรงกับคุณมากน้อยเพียงใด", "นอกจากความสนุกในการทำนายผลแล้ว เกมนี้ยังมีฟีเจอร์ 'เครื่องคำนวณตารางคะแนน' (Table Calculator) ที่ช่วยให้คุณสามารถจำลองสถานการณ์ตารางคะแนนพรีเมียร์ลีกได้ตามผลการแข่งขันที่คุณได้ทำนายไว้ ซึ่งจะช่วยให้เห็นภาพรวมว่าทีมโปรดของคุณจะมีโอกาสขยับอันดับไปอยู่ที่ใดในตาราง", "ผู้เล่นยังสามารถแชร์ผลการทำนายและตารางคะแนนที่จำลองขึ้นให้กับเพื่อนๆ เพื่อร่วมพูดคุยและท้าทายกันได้ โดยทางพรีเมียร์ลีกเชิญชวนให้แฟนบอลกลับเข้ามาเล่นเกมนี้ใหม่ได้ในทุกสัปดาห์ที่มีโปรแกรมการแข่งขัน", "อย่างไรก็ตาม ในขณะนี้มีรายงานแจ้งว่าบล็อกหรือหน้าเพจดังกล่าวอาจไม่สามารถใช้งานได้ชั่วคราว โดยระบบได้ขึ้นข้อความระบุว่า 'ขออภัย บล็อกนี้ไม่สามารถใช้งานได้ในขณะนี้ กรุณาลองใหม่อีกครั้งในภายหลัง' ซึ่งแฟนบอลที่สนใจสามารถรอติดตามและกลับมาใช้บริการได้อีกครั้งเมื่อระบบกลับมาเป็นปกติ"], "link": "https://www.skysports.com/football/live-blog/11095/13612918/premier-league-predictor-predict-the-fixtures-each-gameweek-generate-your-table-and-share-results", "canonical_link": "https://www.skysports.com/football/live-blog/11095/13612918/premier-league-predictor-predict-the-fixtures-each-gameweek-generate-your-table-and-share-results", "cover_image_url": "https://e1.365dm.com/26/11/1920x1080/skysports-premier-league-predictor_7408710.jpg?20261117135327", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795017600, "published_at": "2026-11-18T16:00:00Z", "published_th": "18 พ.ย. 2026 • 23:00 น.", "category_hint": "Football"}, {"id": 1795014933389, "guid": "https://www.skysports.com/football/news/11095/13613285/alex-scott-arsenal-keen-on-chelsea-and-liverpool-target-with-bournemouth-softening-stance-over-potential-sale", "original_title": "Arsenal willing to make sales to beat Chelsea and Liverpool to Scott signing", "thai_title": "อาร์เซนอลพร้อมขายนักเตะระดมทุนล่าตัว อเล็กซ์ สกอตต์ ตัดหน้า เชลซี และ ลิเวอร์พูล", "tag": "Football", "sub_tag": "LIVERPOOL", "bullet_points": ["อาร์เซนอล แชมป์พรีเมียร์ลีกให้ความสนใจคว้าตัว อเล็กซ์ สกอตต์ กองกลางทีมชาติอังกฤษของ บอร์นมัธ", "ทัพปืนใหญ่จำเป็นต้องปล่อยนักเตะในตำแหน่งกองกลางออกอย่างน้อย 1 ราย เพื่อเปิดทางและระดมทุนในการคว้าตัวแข้งวัย 23 ปี", "บอร์นมัธตั้งค่าตัวไว้สูงถึง 100 ล้านปอนด์ แต่แหล่งข่าวระบุว่าดีลอาจจบที่ตัวเลข 75-80 ล้านปอนด์บวกโบนัส", "เชลซี และ ลิเวอร์พูล ยังคงเป็นคู่แข่งสำคัญ โดยเฉพาะหงส์แดงที่ อันโดนี อิราโอลา กุนซือคนปัจจุบันชื่นชอบในตัวสกอตต์เป็นพิเศษ", "นอกจากนี้ อาร์เซนอลยังเล็งเสริมทัพในแนวรุกโดยมี อันโตนิโอ นูซา จาก แอร์เบ ไลป์ซิก เป็นเป้าหมายหลัก"], "full_paragraphs": ["อาร์เซนอล แชมป์พรีเมียร์ลีกอังกฤษ ตกเป็นข่าวว่าพร้อมที่จะพิจารณาปล่อยนักเตะในตำแหน่งกองกลางออกจากทีม เพื่อเปิดทางให้กับการคว้าตัว อเล็กซ์ สกอตต์ มิดฟิลด์วัย 23 ปีของ บอร์นมัธ โดยพวกเขาต้องการเอาชนะคู่แข่งร่วมลีกอย่าง เชลซี และ ลิเวอร์พูล ในการแย่งชิงลายเซ็นของนักเตะรายนี้ ซึ่งทาง บอร์นมัธ ได้ตั้งค่าตัวไว้สูงถึง 100 ล้านปอนด์", "รายงานจาก Sky Sports News ระบุว่า มิเกล อาร์เตตา ผู้จัดการทีมอาร์เซนอล และ อันเดรีย แบร์ตา ผู้อำนวยการกีฬา ได้มีการหารือเกี่ยวกับแผนการเสริมทัพสำหรับปี 2027 กันแล้ว โดยสโมสรจำเป็นต้องขายกองกลางปัจจุบันออกไปอย่างน้อยหนึ่งราย เพื่อให้การดำเนินการคว้าตัว สกอตต์ ในช่วงตลาดหน้าหนาวเดือนมกราคมหรือช่วงซัมเมอร์หน้ามีความเป็นไปได้มากขึ้น", "ในขณะที่ เดแคลน ไรซ์, บรูโน กิมาไรส์ และ ไมลส์ ลูอิส-สเกลลี กำลังทำผลงานได้อย่างยอดเยี่ยมในฤดูกาลนี้ มิเกล เมริโน กลายเป็นตัวเต็งที่อาจถูกปล่อยตัวออกไปเนื่องจากได้รับโอกาสลงสนามน้อย โดยเขาเพิ่งได้ออกสตาร์ทเป็นตัวจริงในพรีเมียร์ลีกเพียงนัดเดียวเท่านั้น และได้ให้สัมภาษณ์ระหว่างเก็บตัวกับทีมชาติสเปนเมื่อสัปดาห์ก่อนว่าเขาต้องการโอกาสลงเล่นมากกว่านี้", "เมริโน กล่าวถึงสถานการณ์ของตนเองว่า: \"เรารู้ดีว่าบทบาทของเราคืออะไร และเราทั้งคู่ต่างใจเย็นและมุ่งมั่นที่จะฝึกซ้อมอย่างหนักเพื่อแสดงให้เห็นว่าเรายังสามารถมีส่วนร่วมกับทีมได้ต่อไป\" อย่างไรก็ตามเขายอมรับว่า: \"การไม่ได้ลงสนามเป็นส่วนใหญ่ไม่ใช่เรื่องที่น่าพอใจสำหรับนักฟุตบอล อาร์เซนอลในปัจจุบันคือทีมที่ดีที่สุดในโลก และมันเป็นเรื่องยากมากที่จะได้รับโอกาสลงเล่น\"", "สำหรับ อเล็กซ์ สกอตต์ ถือเป็นหนึ่งในนักเตะเนื้อหอมที่สุดในตลาดซื้อขายนักเตะเดือนมกราคมนี้ โดยบอร์นมัธเริ่มมีท่าทีที่อ่อนลงเกี่ยวกับการขายนักเตะ หลังจากไม่สามารถตกลงสัญญาฉบับใหม่กับแข้งวัย 23 ปีรายนี้ได้ แม้ว่าพวกเขาจะยังคงต้องการค่าตัวในระดับสูงใกล้เคียง 100 ล้านปอนด์รวมเงื่อนไขเสริม แต่แหล่งข่าวระบุว่าตัวเลขราว 75-80 ล้านปอนด์บวกโบนัสอาจเพียงพอที่จะทำให้ดีลนี้เกิดขึ้นได้", "ทางด้าน เชลซี ยังคงแสดงความสนใจอย่างต่อเนื่องและเชื่อว่าพวกเขามีความได้เปรียบด้านการเงินเหนือสโมสรอื่น แต่สกอตต์ไม่ใช่เป้าหมายเดียวของพวกเขา โดย ชาบี อลอนโซ กุนซือเชลซี ยังคงเปิดกว้างในการเซ็นสัญญากองกลางเพิ่มหลังจากการจากไปของ เอ็นโซ เฟร์นานเดซ ในช่วงซัมเมอร์ที่ผ่านมา", "ขณะที่ ลิเวอร์พูล ต้องการเสริมความแข็งแกร่งในแดนกลางในระยะยาว โดยมองว่าสกอตต์เป็นตัวเลือกที่สมบูรณ์แบบในการเพิ่มความเฉลียวฉลาดและการผ่านบอลให้กับทีม โดยเฉพาะอย่างยิ่ง อันโดนี อิราโอลา กุนซือลิเวอร์พูล ซึ่งเคยร่วมงานกับสกอตต์ที่บอร์นมัธมาก่อน ยังคงชื่นชมในฝีเท้าของนักเตะรายนี้และเชื่อว่าเขาจะเป็นจิ๊กซอว์สำคัญในแผนการทำทีมในอนาคต", "นอกจากแผนการเสริมแดนกลางแล้ว อาร์เซนอลยังคงติดตามสถานการณ์ของ อันโตนิโอ นูซา จาก แอร์เบ ไลป์ซิก และ เควิน ชาเด จาก เบรนท์ฟอร์ด เพื่อเป็นทางเลือกในการเสริมแนวรุก หลังจากที่พลาดการคว้าตัวเป้าหมายหลักหลายรายในช่วงซัมเมอร์ที่ผ่านมา ทั้ง มอร์แกน โรเจอร์ส, วินิซิอุส จูเนียร์, , "published_th": "18 พ.ย. 2026 • 20:05 น.", "category_hint": "Football"}, {"id": 1795004266465, "guid": "https://www.skysports.com/football/news/11095/13613260/man-utd-transfer-news-calvin-bassey-and-jarrad-branthwaite-among-targets-with-mauricio-pochettino-set-to-be-backed-in-january", "original_title": "Man Utd expected to back Poch in January transfer window", "thai_title": "แมนฯ ยูไนเต็ด เตรียมหนุนหลัง โปเช็ตติโน่ เสริมทัพตลาดหน้าหนาว", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["แมนเชสเตอร์ ยูไนเต็ด เตรียมเดินหน้าเสริมทัพในตลาดซื้อขายนักเตะเดือนมกราคม โดยเน้นตำแหน่งแบ็กซ้าย เซ็นเตอร์แบ็ก และกองหน้า", "เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่จะมีส่วนร่วมสำคัญในการตัดสินใจเลือกเป้าหมายนักเตะที่จะดึงตัวมาร่วมทีม", "สโมสรให้ความสนใจในตัว คาลวิน บาสซีย์ จากฟูแล่ม และ จาร์ราด แบรนธ์เวต จากเอฟเวอร์ตัน เพื่อมาอุดรอยรั่วในแนวรับ", "อนาคตของ ลิซานโดร มาร์ติเนซ เริ่มมีความไม่แน่นอน เนื่องจากสัญญาปัจจุบันกำลังจะหมดลงในช่วงซัมเมอร์หน้า", "การเสริมทัพในแดนหน้าเป็นเรื่องจำเป็น เนื่องจาก เบนจามิน เซสโก้ กองหน้าตัวหลักยังคงมีอาการบาดเจ็บและต้องพักยาวถึงเดือนมกราคม"], "full_paragraphs": ["แมนเชสเตอร์ ยูไนเต็ด คาดว่าจะให้การสนับสนุน เมาริซิโอ โปเช็ตติโน่ เฮดโค้ชคนใหม่ในการเสริมทัพช่วงตลาดซื้อขายนักเตะเดือนมกราคมนี้ เพื่อแก้ไขสถานการณ์ผลงานที่น่าผิดหวังในช่วงเริ่มต้นฤดูกาล", "ตำแหน่งแบ็กซ้าย เซ็นเตอร์แบ็ก และกองหน้า คือพื้นที่ที่สโมสรต้องการเสริมความแข็งแกร่ง โดยคาดว่าโปเช็ตติโน่จะมีบทบาทสำคัญในการให้ความเห็นเกี่ยวกับเป้าหมายที่สโมสรจะดำเนินการคว้าตัวมาร่วมทีม", "แม้ว่าบอร์ดบริหารของสโมสรจะรู้สึกว่าทีมควรจะมีอันดับที่ดีกว่านี้ในตารางคะแนน แต่ก็ยอมรับว่าพวกเขาควรจะเสริมทัพให้ดีกว่านี้ในช่วงซัมเมอร์ที่ผ่านมาในจุดที่ทีมยังขาดความลึกของขุมกำลัง", "แหล่งข่าวของ Sky Sports News ระบุว่า สโมสรมีแผนที่จะขยับตัวในตลาดรอบหน้าอยู่แล้วตั้งแต่สมัยที่ ไมเคิล คาร์ริค ยังเป็นเฮดโค้ช ก่อนที่เขาจะถูกปลดออกจากตำแหน่งเมื่อเดือนที่แล้ว หลังทำผลงานช่วงออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี", "อย่างไรก็ตาม ในขณะนี้คาดว่าโปเช็ตติโน่จะได้รับเชิญให้เข้ามาหารือในช่วงไม่กี่สัปดาห์ข้างหน้า และจะมีสิทธิ์ตัดสินใจเกี่ยวกับนักเตะใหม่ที่จะดึงตัวเข้ามาในเดือนมกราคม", "สำหรับเป้าหมายในแนวรับ คาลวิน บาสซีย์ ของฟูแล่ม และ จาร์ราด แบรนธ์เวต ของเอฟเวอร์ตัน คือสองนักเตะที่ยูไนเต็ดกำลังจับตามอง แม้ฟูแล่มจะมีผลงานที่ไม่สู้ดีนักในฤดูกาลนี้ แต่บาสซีย์ถือเป็นนักเตะที่โชว์ฟอร์มได้น่าประทับใจ โดยเหลือสัญญาอีกเพียง 6 เดือน แต่ฟูแล่มมีออปชั่นขยายสัญญาเพิ่มได้อีก 1 ปี", "อัลบาโร่ อาร์เบลัว เฮดโค้ชของฟูแล่ม ได้กล่าวถึงกองหลังวัย 26 ปีรายนี้ว่าเป็นหนึ่งในกองหลังที่ดีที่สุดในโลก และยืนยันว่าเป้าหมายของสโมสรคือการต่อสัญญาฉบับใหม่กับบาสซีย์", "ในขณะที่ แบรนธ์เวต เป็นนักเตะที่ยูไนเต็ดให้ความสนใจมาอย่างยาวนาน โดยในปี 2024 ยูไนเต็ดเคยยื่นข้อเสนอขอซื้อตัวกองหลังรายนี้ถึง 2 ครั้ง แต่ถูกปฏิเสธทั้งหมด ซึ่งข้อเสนอครั้งที่สองมีมูลค่าสูงถึงประมาณ 50 ล้านปอนด์ โดยเอฟเวอร์ตันอยู่ในสถานะที่ได้เปรียบในการเจรจาเนื่องจากนักเตะวัย 24 ปีรายนี้ยังมีสัญญาอยู่จนถึงซัมเมอร์ปี 2030", "ยูไนเต็ดกำลังมองหาตัวเลือกเซ็นเตอร์แบ็กเท้าซ้ายเพื่อพิจารณาหาตัวแทนของ ลิซานโดร มาร์ติเนซ ซึ่งอนาคตในถิ่นโอลด์ แทรฟฟอร์ด ดูมีความไม่แน่นอนเมื่อถึงซัมเมอร์หน้า เนื่องจากสัญญาปัจจุบันกำลังจะหมดลง แม้สโมสรจะมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือน แต่มีแนวโน้มว่าเขาจะไม่ได้รับข้อเสนอสัญญาฉบับใหม่ ตามที่ Sky Sports News ได้รายงานไปเมื่อเดือนที่แล้ว", "สโมสรตัดสินใจไม่เสริมแบ็กซ้ายในช่วงซัมเมอร์ที่ผ่านมาเนื่องจากต้องการโฟกัสไปที่การสร้างแดนกลางใหม่ โดยเชื่อว่าเป้าหมายระยะยาวของพวกเขาจะสามารถคว้าตัวได้ง่ายขึ้นในปีหน้า ซึ่งยังคงต้องติดตามว่าจะเป็นเช่นนั้นจริงหรือไม่เมื่อจบฤดูกาล และจะส่งผลอย่างไรต่อผู้เล่นอย่าง ลูอิส ฮอลล์ ของนิวคาสเซิล ยูไนเต็ด แต่ด้วยการที่ทีมต้องใช้ผู้เล่นถึง 5 คนในตำแหน่งนี้โดยประสบความสำเร็จเพียงเล็กน้อย สโมสรจึงจะพิจารณาหาตัวเลือกแบ็กซ้ายเข้ามาเสริมในเดือนมกราคม", "แอนโทนี โรบินสัน แบ็กซ้ายของฟูแล่ม ยังคงเป็นนักเตะที่ถูกจับตามองตามรายงานครั้งแรกของ Sky Sports News เมื่อเดือนมีนาคมที่ผ่านมา ฟูแล่มรับทราบถึงความสนใจที่มีต่อโรบินสันอย่างกว้างขวาง แต่ยังไม่มีสโมสรใดขยับตัวอย่างจริงจังสำหรับนักเตะวัย 29 ปีรายนี้ ซึ่งเคยร่วมงานกับโปเช็ตติโน่สมัยคุมทีมชาติสหรัฐอเมริกา", "อเลฮานโดร บัลเด้ ของบาร์เซโลน่า เป็นนักเตะที่มีข่าว  เป็นสโมสรที่ลงทุนอย่างหนักในช่วงซัมเมอร์ แต่ยังคงเปิดกว้างสำหรับการเสริมทัพเพิ่มเติมเพื่อรักษามาตรฐานในพรีเมียร์ลีก"], "full_paragraphs": ["ตลาดซื้อขายนักเตะพรีเมียร์ลีกจะกลับมาเปิดทำการอีกครั้งในวันที่ 1 มกราคม 2027 และจะปิดตัวลงในวันที่ 1 กุมภาพันธ์ เวลา 23.00 น. โดยในขณะนี้หลายสโมสรกำลังเตรียมแผนงานสำหรับการเสริมทัพเพื่อเติมเต็มส่วนที่ยังขาดหายไปจากช่วงซัมเมอร์ที่ผ่านมา", "อาร์เซนอลพลาดการคว้าตัวกองหน้าชื่อดังในช่วงซัมเมอร์ และนั่นยังคงเป็นเป้าหมายหลักของพวกเขาในเดือนมกราคม โดยสโมสรแชมป์พรีเมียร์ลีกกำลังติดตามสถานการณ์ของ อันโตนิโอ นูซา จาก แอร์เบ ไลป์ซิก และ เควิน ชาเด้ จาก เบรนท์ฟอร์ด อาร์เซนอลต้องการกองหน้าที่เล่นทางฝั่งซ้ายได้เป็นหลัก แต่สามารถขยับไปเล่นทั่วแนวรุกได้ด้วย", "ในช่วงซัมเมอร์ อาร์เซนอลเคยพยายามคว้าตัว มอร์แกน โรเจอร์ส, วินิซิอุส จูเนียร์ และ ฮูเลียน อัลวาเรซ แต่ไม่สามารถตกลงดีลได้ โดยในรายของ อัลวาเรซ นั้นเชื่อว่าอาร์เซนอลกำลังถอยออกมาเนื่องจากนักเตะไม่ต้องการย้ายออกจากสเปน ส่วน โรเจอร์ส ย้ายไป เชลซี ด้วยค่าตัว 117 ล้านปอนด์ ซึ่งเป็นตัวเลขที่อาร์เซนอลไม่พร้อมจ่าย และ วินิซิอุส ได้ต่อสัญญาฉบับใหม่กับ เรอัล มาดริด", "นอกจากนี้ อาร์เซนอลยังให้ความสนใจในตัว อเล็กซ์ สกอตต์ กองกลางวัย 23 ปีของ บอร์นมัธ โดยเข้าใจว่าพวกเขาพร้อมที่จะปล่อยกองกลางในทีมออกไปเพื่อชิงตัวนักเตะรายนี้ตัดหน้า เชลซี และ ลิเวอร์พูล", "แอสตัน วิลล่า จบช่วงซัมเมอร์ด้วยความพอใจหลังจากผ่านตลาดที่ดูเหมือนจะยากลำบาก แม้จะมีการปล่อยนักเตะตัวหลักออกไปหลายราย แต่การเสริมทัพที่เข้ามาทดแทนทำให้ อูไน เอเมรี มีขุมกำลังที่อายุน้อยและน่าตื่นเต้น อย่างไรก็ตาม ภารกิจที่สำคัญกว่าการเซ็นสัญญานักเตะคือการต่อสัญญาฉบับใหม่ให้กับกุนซืออย่าง เอเมรี", "บอร์นมัธทำภารกิจที่วางไว้สำเร็จในช่วงซัมเมอร์ และการเสริมทัพในเดือนมกราคมจะขึ้นอยู่กับการปล่อยนักเตะออกไป โดย อเล็กซ์ สกอตต์ กำลังได้รับความสนใจจากหลายทีมใหญ่ ซึ่งบอร์นมัธอาจเรียกค่าตัวสูงถึง 100 ล้านปอนด์รวมส่วนเสริม หากต้องปล่อยตัวออกไป พวกเขาก็ต้องการเซ็นสัญญากองกลางคนใหม่เข้ามาทดแทน", "เบรนท์ฟอร์ดกำลังติดตามสถานการณ์ของ อาร์ชี่ เกรย์ ที่ ท็อตแนม ฮอตสเปอร์ อย่างใกล้ชิด หลังจากเคยสนใจคว้าตัวในช่วงซัมเมอร์ โดยจะดูว่านักเตะจะได้รับโอกาสลงสนามมากน้อยเพียงใดภ ์ให้เห็นว่ามีมาตรฐานการเล่นที่เทียบเท่ากับช่วงที่ ซาลิบา พาทีมคว้าแชมป์ลีก โดยข้อมูลบางส่วนยังระบุว่า คอนซา ทำผลงานได้ในระดับที่สูงกว่าด้วยซ้ำ", "ด้วยการที่ ซาลิบา กลับมาซ้อมและเรียกความฟิตอย่างต่อเนื่อง อาร์เตตา จึงมีภารกิจในการจัดการเรื่องการส่งผู้เล่นคนสำคัญกลับสู่ทีม ในขณะเดียวกันก็ต้องรักษาความมั่นใจของนักเตะที่กำลังอยู่ในฟอร์มที่ดีที่สุดอย่าง คอนซา เอาไว้ด้วย ซึ่งการตัดสินใจนี้มีความสำคัญอย่างยิ่งเมื่อพิจารณาจากโปรแกรมการแข่งขันที่จะต้องพบกับทีมอย่าง โบรุสเซีย ดอร์ทมุนด์, แมนเชสเตอร์ ซิตี้, ท็อตแนม, เรอัล มาดริด และ แมนเชสเตอร์ ยูไนเต็ด ก่อนถึงช่วงคริสต์มาส", "คอนซา ย้ายมาอาร์เซนอลด้วยชื่อเสียงในด้านการผ่านบอลที่แม่นยำและความสามารถในการดวลตัวต่อตัว ซึ่งเขายังคงรักษามาตรฐานนั้นไว้ได้เป็นอย่างดี โดยในฤดูกาลนี้เขาอยู่อันดับที่สองของพรีเมียร์ลีกทั้งในด้านความแม่นยำในการผ่านบอลและเปอร์เซ็นต์การชนะในการดวลบนพื้นสนาม ซึ่งตัวเลขเหล่านี้ทำให้เขาเป็นหนึ่งในกองหลังที่ดีที่สุดของลีกในแง่ของภาพรวมการเล่น", "ตามปกติแล้วฟอร์มการเล่นระดับนี้ควรทำให้ คอนซา เป็นผู้เล่นที่ขาดไม่ได้ แต่ปัญหาคือหนึ่งในเซ็นเตอร์แบ็กที่ดีที่สุดในโลกกำลังจะกลับมา ซึ่ง ซาลิบา ถือเป็นหัวใจสำคัญของแนวรับที่ อาร์เตตา สร้างขึ้นมาที่สโมสรแห่งนี้", "จุดที่แสดงให้เห็นถึงความสำคัญของ ซาลิบา คือความสูงเฉลี่ยของไลน์กองหลังอาร์เซนอล ในฤดูกาลนี้เมื่อไม่มี ซาลิบา แนวรับของปืนใหญ่ถอยต่ำลงอย่างน้อยหนึ่งเมตร ไม่ว่าจะเป็นจังหวะรุกหรือรับ แม้จะเป็นการเปลี่ยนแปลงเพียงเล็กน้อย แต่ในระดับนี้รายละเอียดเพียงเล็กน้อยก็สร้างความแตกต่างได้มหาศาล", "เมื่อ ซาลิบา ก้าวขึ้นมาเป็นตัวหลักในฤดูกาล 2022/23 แนวรับของอาร์เซนอลก็เปลี่ยนไปอย่างสิ้นเชิง ไลน์กองหลังขยับสูงขึ้นสองเมตรเมื่อเทียบกับฤดูกาลก่อนหน้า ส่วนหนึ่งเป็นเพราะความเร็วของกองหลังชาวฝรั่งเศส ซึ่งมักถูกเปรียบเปรยว่าเป็น 'สูตรโกง' (cheat code) ในการหยุดจังหวะสวนกลับของคู่แข่งได้อย่างง่ายดาย", "การยืนไลน์สูงช่วยให้คู่แข่งอยู่ห่างจากประตูของอาร์เซนอลมากขึ้น นำไปสู่การกดดันที่ดุดันและการครองบอลที่เหนือกว่า ซึ่ง อาร์เตตา มักกล่าวเสมอว่าเป้าหมายสำคัญของทีมคือ 'การไม่เปิดโอกาสให้คู่แข่งได้หายใจ'", "คอนซา ได้ทำหน้าที่กวาดล้างในไลน์กองหลังสูงของอาร์เซนอลในฤดูกาลนี้ได้ดีพอสมควร โดยเขาทำสถิติเข้าสกัดในฐานะคนสุดท้าย (last-man tackle) ได้สำเร็จถึง 3 ครั้ง ซึ่งรวมถึงจังหวะสำคัญที่ช่วยป้องกันประตูจาก มอร์แกน โรเจอร์ส ของเชลซี และ เลียม ดีแลป ของน็อตติงแฮม ฟอเรสต์ ช่วยให้ทีมรักษาชัยชนะได้สำเร็จ", "อย่างไรก็ตาม คู่เซ็นเตอร์แบ็กอย่าง คอนซา และ กาเบรียล ทำสถิติเข้าสกัดในฐานะคนสุดท้ายรวมกันในฤดูกาลนี้ไปแล้ว 7 ครั้ง ซึ่งมากกว่าที่ ซาลิบา และ กาเบรียล ทำไว้ตลอดทั้งฤดูกาลที่แล้ว (5 ครั้ง) ซึ่งสะท้อนว่าคู่แข่งเริ่มมีพื้นที่ในการเล่นและสร้างความกดดันได้มากขึ้นกว่าเดิม", "ในระบบที่อาร์เซนอลภาคภูมิใจกับการไม่เปิดโอกาสให้คู่แข่งได้ลุ้นทำประตู การนำ 'สูตรโกง' อย่าง ซาลิบา กลับมาจึงเป็นเรื่องที่มีมูลค่ามหาศาล", "สถานการณ์หนึ่งที่ คอนซา และ ซาลิบา อาจได้ลงเล่นร่วมกันคือการขยับกองหลังทีมชาติอังกฤษไปเล่นแบ็กขวา ซึ่งเป็นตำแหน่งที่เขาเคยเล่นมาก่อนในอาชีพค้าแข้ง ซึ่งจะสอดคล้องกับแผนการใช้แบ็กขวาของ อาร์เตตา ที่มักจะใช้ผู้เล่นที่ถนัดตำแหน่งนี้โดยธรรมชาติในช่วงหลัง เช่น เยอร์เรียน ทิมเบอร์, เบน ไวท์, ริคคาร์โด คาลาฟิออรี และ ปิเอโร ฮินกาปี ซึ่งล้วนเป็นเซ็นเตอร์แบ็กที่ถูกปรับมาเล่นริมเส้น", "อย่างไรก็ตาม ในช่วงสองปีที่ผ่านมา คอนซา เชี่ยวชาญในตำแหน่งเซ็นเตอร์แบ็กเป็นหลัก จนไม่ได้ลงเล่นในพรีเมียร์ลีกในตำแหน่งแบ็กขวามาเกือบสองปีแล้ว โดยการออกสตาร์ทในลีกครั้งล่าสุดในฐานะแบ็กขวาต้องย้อนไปถึงเดือนธันวาคม 2024 สมัยอยู่กับ แอสตัน วิลลา และตลอด 5,813 นาทีในลีกที่ผ่านมา หรือเทียบเท่ากับเกือบ 65 นัด เขาเล่นในตำแหน่งเซ็นเตอร์แบ็กมาโดยตลอด โดย อาร์เตตา กล่าวเมื่อต้นเดือนนี้ว่า 'เอซรี เขาเล่นเป็นแบ็กได้ แต่ผมคิดว่าตำแหน่งหลักของเขาคือเซ็นเตอร์แบ็ก'", "แน่นอนว่า คอนซา และ ซาลิบา สามารถเล่นเซ็นเตอร์แบ็กคู่กันได้ โดยให้ กาเบรียล ได้พักบ้างในยามจำเป็น ซึ่งอาจหมายถึงการขยับคนใดคนหนึ่งไปเล่นฝั่งซ้ายและถอดเซ็นเตอร์แบ็กเท้าซ้ายออกจากทีม แต่ผู้จัดการทีมอาร์เซนอลก็มั่นใจในเรื่องนี้ โดย อาร์เตตา กล่าวถึง คอนซา ว่า 'เขาสามารถเล่นได้ทั้งขวาและซ้าย วิลลี ก็เคยทำแบบเดียวกันกับทีมชาติและที่อาร์เซนอล นั่นจะเป็นสิ่งที่ส่งผลบวกต่อทีมอย่างมาก'", "แม้ว่านี่อาจเป็นเรื่องปวดหัวสำหรับ อาร์เตตา แต่มันก็เป็นปัญหาในเชิงบวก อาร์เซนอลเคยได้รับผลกระทบจากการบาดเจ็บของ ซาลิบา และ กาเบรียล ในอดีต ซึ่งบางครั้งทำให้พวกเขาพ ts-man-utd-transfer_7408997.jpg?20261117183950", "https://e0.365dm.com/26/11/1920x1080/skysports-poch-julien-laurens_7408527.jpg?20261117111719"], "videos": [], "review_score": "", "published_ts": 1794993660, "published_at": "2026-11-18T09:21:00Z", "published_th": "18 พ.ย. 2026 • 16:21 น.", "category_hint": "Football"}, {"id": 1795023115810, "guid": "https://www.theguardian.com/football/2026/nov/18/premier-league-teams-full-backs-opta-analyst", "original_title": "Overlap, underlap or sit back? How Premier League teams use their full-backs", "thai_title": "เจาะลึกบทบาทฟูลแบ็กยุคใหม่: จากเกมรับสู่หัวใจสำคัญของทีมพรีเมียร์ลีก", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["บทบาทฟูลแบ็กในพรีเมียร์ลีกวิวัฒนาการไปอย่างมาก จากเดิมที่เน้นเกมรับ กลายเป็นตำแหน่งที่มีความหลากหลายสูงทั้งการเติมเกมรุกและการหุบเข้าใน", "อาร์เซนอลเป็นทีมที่ฟูลแบ็กมีตำแหน่งการเล่นเฉลี่ยสูงที่สุดในลีก โดย เบน ไวท์ และ ริคคาร์โด คาลาฟิออรี มีส่วนร่วมกับประตูรวมกันถึง 6 ลูกในฤดูกาลนี้", "สถิติจาก Opta Vision เผยให้เห็นความแตกต่างของสไตล์การเล่น เช่น อาร์ชี เกรย์ ของท็อตแนมที่โดดเด่นเรื่องการวิ่งสอด (underlap) ในขณะที่ เอเดรียน ทรูฟเฟิร์ต ของบอร์นมัธคือราชาแห่งการวิ่งเติมเกมริมเส้น (overlap)", "แมนเชสเตอร์ ซิตี้ ภายใต้การคุมทีมของ เอ็นโซ มาเรสกา มีแนวทางการใช้ฟูลแบ็กที่น่าสนใจ โดยเน้นการยืนตำแหน่งที่ค่อนข้างต่ำแม้จะครองบอลได้มากที่สุดในลีก ซึ่งแตกต่างจากยุคของ เป๊ป กวาร์ดิโอลา อย่างสิ้นเชิง"], "full_paragraphs": ["บทบาทของฟูลแบ็กมีการเปลี่ยนแปลงไปอย่างมหาศาลในช่วงไม่กี่ปีที่ผ่านมา จากเดิมที่เป็นตำแหน่งที่เน้นเกมรับเป็นหลักและคอยสนับสนุนเกมรุกเพียงเล็กน้อย ปัจจุบันบทบาทนี้ได้พัฒนาไปสู่ความซับซ้อนที่มากขึ้นกว่าเดิมหลายเท่าตัว", "ลองถาม เบน ไวท์ แบ็กขวาของอาร์เซนอลดูได้ ซึ่งเขาและ ริคคาร์โด คาลาฟิออรี ทางฝั่งซ้าย กลายเป็นตัวละครสำคัญในการออกสตาร์ทฤดูกาลอันยอดเยี่ยมของ 'ปืนใหญ่' โดยไวท์เคยกล่าวไว้เมื่อไม่กี่ปีก่อนว่า: 'การเล่นฟูลแบ็กในแบบที่ [มิเกล อาร์เตตา] ต้องการนั้นแตกต่างจากผู้จัดการทีมคนอื่นโดยสิ้นเชิง การจะเล่นฟูลแบ็กให้เขา คุณต้องเป็นทั้งกองกลางตัวกลาง, เซ็นเตอร์แบ็ก, ปีก และหมายเลข 10 ในคนเดียวกัน'", "ทั้งไวท์และคาลาฟิออรีมีส่วนร่วมกับประตูให้อาร์เซนอลไปแล้วถึง 6 ลูกในพรีเมียร์ลีกฤดูกาลนี้ (ไวท์: 3 แอสซิสต์; คาลาฟิออรี: 1 ประตู, 2 แอสซิสต์) ซึ่งไม่มีกองหลังคนใดในลีกที่มีส่วนร่วมกับประตูเกิน 3 ลูกเท่ากับพวกเขา ทั้งคู่เป็นตัวอย่างที่ชัดเจนถึงอิทธิพลของฟูลแบ็กในยุคปัจจุบัน แต่ในเมื่อตำแหน่งนี้มีความต้องการสูงกว่าที่เคยเป็นมา แต่ละทีมในพรีเมียร์ลีกใช้งานฟูลแบ็กของตนอย่างไรบ้าง?", "ข้อมูลแสดงให้เห็นว่าฟูลแบ็กของอาร์เซนอลมีตำแหน่งการสัมผัสบอลเฉลี่ยสูงที่สุดในพรีเมียร์ลีกฤดูกาลนี้ โดยอยู่ที่ 58.2 เมตรจากประตูของตัวเอง ซึ่งสะท้อนให้เห็นถึงการครองพื้นที่ของอาร์เซนอล รวมถึงอิสระที่ไวท์และคาลาฟิออรีได้รับในการดันขึ้นไปอยู่ในแนวรุก โดยไวท์มีการสัมผัสบอลในกรอบเขตโทษคู่แข่งเฉลี่ย 3.4 ครั้งต่อ 90 นาที ซึ่งสูงที่สุดในบรรดาฟูลแบ็กหรือวิงแบ็กในลีก ส่วนคาลาฟิออรีรั้งอันดับ 3 ด้วยสถิติ 2.9 ครั้ง", "นอกจากนี้ ฟูลแบ็กของอาร์เซนอลยังมีตำแหน่งการสัมผัสบอลที่หุบเข้าในมากที่สุด ซึ่งตอกย้ำว่าพวกเขาได้เปลี่ยนผ่านจากการเป็นฟูลแบ็กแบบดั้งเดิมที่เน้นริมเส้น มาเป็นการเคลื่อนที่เข้าสู่พื้นที่ตรงกลางสนามมากขึ้น", "ทางด้าน ท็อตแนม ฮอตสเปอร์ ก็ใช้งานฟูลแบ็กในตำแหน่งที่สูงมากเช่นกัน โดยส่วนใหญ่เป็น อาร์ชี เกรย์ ทางฝั่งขวา และ แอนดี โรเบิร์ตสัน ทางฝั่งซ้าย ซึ่งจากการติดตามข้อมูลของ Opta Vision พบว่าเกรย์มีความโดดเด่นเรื่องความขยัน โดยเขาเป็นอันดับ 1 ของฟูลแบ็กพรีเมียร์ลีกในการวิ่งสอด (underlap) ทั้งจำนวนรวม (23 ครั้ง) และเฉลี่ยต่อ 90 นาที (2.9 ครั้ง) รวมถึงเป็นอันดับ 4 ในการวิ่งเติมเกมริมเส้น (overlap) ที่ 1.8 ครั้งต่อ 90 นาที", "ส่วนโรเบิร์ตสันก็ไม่น้อยหน้า โดยแบ็กวัย 32 ปีรายนี้รั้งอันดับ 7 ในการวิ่งสอดเฉลี่ยต่อ 90 นาที (1.4 ครั้ง) และติดท็อป 20 ในการวิ่งเติมเกมริมเส้น (1.1 ครั้ง) นอกจากนี้เขายังเป็นฟูลแบ็กที่ได้รับบอลในพื้นที่สุดท้าย (final third) มากที่สุดในลีกถึง 159 ครั้ง", "อาจเป็นเรื่องน่าประหลาดใจที่เห็นฟูลแบ็กของ โคเวนทรี ซิตี้ เล่นในตำแหน่งที่สูงมาก ทั้งที่พวกเขาไม่ได้ครองบอลเป็นหลัก (ครองบอล 39.1% ต่ำที่สุดเป็นอันดับ 2) และมักเริ่มเกมจากแดนหลัง อย่างไรก็ตาม นี่เป็นสิ่งที่พวกเขาทำได้ดีมาตั้งแต่ฤดูกาลที่แล้วในแชมเปียนชิป โดย แฟรงค์ แลมพาร์ด ได้ปรับมาใช้กองหลัง 5 คน pers: Pochettino could help Man Utd's pursuit of Paz", "thai_title": "สื่อเผย โปเช็ตติโน่ อาจเป็นกุญแจสำคัญพา แมนยู คว้าตัว นิโก้ ปาซ", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ อาจมีส่วนช่วยให้ แมนเชสเตอร์ ยูไนเต็ด คว้าตัว นิโก้ ปาซ กองกลางดาวรุ่งจาก โคโม่ มาร่วมทีม", "เรอัล มาดริด ยังคงมีเงื่อนไขซื้อตัว นิโก้ ปาซ กลับคืนในราคา 80 ล้านยูโร ในปี 2027", "วินเซนต์ กอมปานี เตรียมกลับมาคุมทีม บาเยิร์น มิวนิค อีกครั้งในวันศุกร์นี้ หลังประสบปัญหาอาการป่วยจนวูบที่สนามซ้อม", "ฟีฟ่าพิจารณาใช้กฎพักดื่มน้ำ (Hydration breaks) ในการแข่งขันฟุตบอลโลก 2030", "ข้อเสนอเรื่องกฎล้ำหน้าแบบ 'Daylight' ของ อาร์แซน เวนเกอร์ มีแนวโน้มจะถูกปฏิเสธหลังผ่านการทดลองใช้ในแคนาดา"], "full_paragraphs": ["รายงานข่าวจากสื่ออังกฤษประจำวันพฤหัสบดีระบุว่า การเข้ามาคุมทีมของ เมาริซิโอ โปเช็ตติโน่ ที่ แมนเชสเตอร์ ยูไนเต็ด อาจส่งผลดีต่อโอกาสในการคว้าตัว นิโก้ ปาซ กองกลางตัวเก่งของ โคโม่ อย่างไรก็ตาม เรอัล มาดริด ยังคงถือออปชั่นในการดึงตัวนักเตะรายนี้กลับสู่สโมสรด้วยค่าตัว 80 ล้านยูโร ในปี 2027 ตามรายงานจาก เดอะ ซัน", "ในขณะเดียวกัน คิม เฮลล์เบิร์ก กุนซือของ มิดเดิลสโบรห์ แสดงความมั่นใจว่า วิลล์ แลงค์เชียร์ จะยังคงอยู่กับทีมในศึกแชมเปี้ยนชิพต่อไปในช่วงตลาดซื้อขายนักเตะเดือนมกราคมนี้ แม้ว่าจะได้รับความสนใจจากหลายสโมสรในพรีเมียร์ลีกก็ตาม", "ทางด้าน แอสตัน วิลล่า ได้รับการยืนยันว่าเกมยูฟ่า แชมเปี้ยนส์ลีก ที่จะพบกับ กาลาตาซาราย ในวันอังคารนี้ จะยังคงแข่งขันตามกำหนดการเดิม แม้ว่าสภาพสนามในประเทศตุรกีจะอยู่ในสถานการณ์ที่น่ากังวลก็ตาม", "สำหรับความเคลื่อนไหวของ บาเยิร์น มิวนิค ประธานบริหารของสโมสรยืนยันว่า วินเซนต์ กอมปานี คาดว่าจะกลับมาทำหน้าที่ข้างสนามได้อีกครั้งในวันศุกร์นี้ หลังจากที่เขาเกิดอาการวูบหมดสติที่สนามซ้อมของสโมสรเมื่อไม่ถึงหนึ่งเดือนที่ผ่านมา", "ในส่วนของ ฟีฟ่า ได้มีการหยิบยกความเป็นไปได้ในการนำกฎพักดื่มน้ำ (Hydration breaks) มาใช้ในการแข่งขันฟุตบอลโลก 2030 โดยได้ระบุเรื่องนี้ไว้ในเอกสารที่ส่งให้กับผู้ถือลิขสิทธิ์ถ่ายทอดสดที่มีศักยภาพ นอกจากนี้ยังมีรายงานจาก เดอะ เทเลกราฟ ว่า จานนี่ อินฟานติโน่ ได้มีการเจรจาลับนานถึง 10 เดือนกับครอบครัวมหาเศรษฐี คุชเนอร์ ก่อนที
