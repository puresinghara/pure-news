: [], "videos": [], "review_score": "", "published_ts": 1794906900, "published_at": "2026-11-17T09:15:00Z", "published_th": "17 พ.ย. 2026 • 16:15 น.", "category_hint": "Football"}, {"id": 1794914157114, "guid": "https://www.skysports.com/football/news/11095/13613120/scotland-whats-going-wrong-for-head-coach-sebastien-pocognoli-and-can-he-turn-things-around", "original_title": "What is going wrong for Pocognoli and Scotland?", "thai_title": "เกิดอะไรขึ้นกับทีมชาติสกอตแลนด์? เจาะลึกปัญหาของ เซบาสเตียน โปโกญอลี", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["ทีมชาติสกอตแลนด์ปิดฉากเนชันส์ลีกด้วยความพ่ายแพ้ต่อสวิตเซอร์แลนด์ 4-0 ซึ่งถือเป็นความพ่ายแพ้ที่ยับเยินที่สุดนับตั้งแต่ยูโร 2024", "เซบาสเตียน โปโกญอลี กุนซือคนใหม่ทำผลงานชนะเพียง 2 จาก 6 นัดแรก ส่งผลให้สกอตแลนด์ต้องไปอยู่ในโถ 3 ในการจับสลากรอบคัดเลือกยูโร 2028", "ปัญหาสำคัญคือการที่โปโกญอลีพยายามปรับเปลี่ยนระบบการเล่นมาใช้หลังสาม แต่ดูเหมือนนักเตะในทีมจะไม่ตอบโจทย์กับแท็กติกดังกล่าว", "แอนดี โรเบิร์ตสัน กัปตันทีมและ จอห์น แม็กกินน์ ออกมาแสดงความกังวลอย่างชัดเจนว่าทีมไม่มีเวลามากพอสำหรับการลองผิดลองถูก และผลงานในปัจจุบันยังไม่เป็นไปในทิศทางที่ดี", "โปโกญอลีมีเวลาเก็บตัวกับลูกทีมรวม 24 วันในช่วงที่ผ่านมา ซึ่งถือว่านานพอสมควรสำหรับระดับทีมชาติ แต่เขายังไม่สามารถสร้างผลงานที่น่าประทับใจได้"], "full_paragraphs": ["ในโลกฟุตบอลระยะเวลาหนึ่งปีถือว่ายาวนานมาก และนั่นคือสิ่งที่เกิดขึ้นกับสถานการณ์ของทีมชาติสกอตแลนด์ในปัจจุบัน จากค่ำคืนแห่งประวัติศาสตร์ที่พวกเขาได้กลับไปลุยฟุตบอลโลกอีกครั้ง สู่ความพ่ายแพ้ที่น่าอับอาย 4-0 ต่อสวิตเซอร์แลนด์ในเกมปิดท้ายเนชันส์ลีก ความแตกต่างของทั้งสองช่วงเวลานั้นชัดเจนอย่างยิ่ง", "การล่มสลายในช่วงครึ่งหลังต่อทีมสวิตเซอร์แลนด์ชุดสำรองที่เมืองเซนต์กัลเลน ทำให้ทัพ 'ตาร์ตัน' ต้องพบกับความพ่ายแพ้ที่หนักที่สุดนับตั้งแต่โดนเยอรมนีถล่ม 5-1 ในศึกยูโร 2024", "หลังจากที่ สตีฟ คลาร์ก สามารถพาทีมไปลุยศึกยูโรได้ถึงสองสมัยติดต่อกัน การเข้ามารับไม้ต่อของ เซบาสเตียน โปโกญอลี จึงเป็นงานที่ยากลำบาก และหลังจากผ่านไปเพียง 6 นัด แฟนบอล 'ตาร์ตัน อาร์มี' บางส่วนก็เริ่มหมดความอดทนกับกุนซือรายนี้แล้ว", "กุนซือคนใหม่ทำผลงานชนะได้เพียง 2 นัดเท่านั้น ซึ่งเป็นการชนะนอร์ทมาซิโดเนียในกลุ่ม B1 การจบอันดับที่ 3 ทำให้สกอตแลนด์ต้องไปอยู่ในโถ 3 ในการจับสลากรอบคัดเลือกยูโร 2028 วันที่ 6 ธันวาคมนี้ ซึ่งหมายความว่าพวกเขาจะต้องเจอกับเส้นทางที่ยากลำบากกว่าเดิม", "โปโกญอลีต้องการเวลาในการทำทีม ซึ่งเป็นสิ่งที่ แอนดี โรเบิร์ตสัน กัปตันทีมยอมรับว่า 'ไม่มีให้' ในโลกฟุตบอลระดับทีมชาติ โดยกุนซือชาวเบลเยียมรายนี้เน้นย้ำเสมอถึงความอดทนในขณะที่เขาพยายามปรับเปลี่ยนสไตล์การเล่นให้เน้นเกมรุกมากขึ้น", "เขาชื่นชอบการใช้ระบบหลังสามที่มีวิงแบ็ก และมีกองกลางตัวรุกหรือเพลย์เมกเกอร์คอยสนับสนุนกองหน้าตัวเป้าเพียงคนเดียว เพื่อเน้นการเพรสซิ่งสูง แต่ปัญหาคือสกอตแลนด์ดูเหมือนจะไม่มีนักเตะที่เหมาะสมกับระบบนี้", "เบน กอนนอน-ดอค ปีกความเร็วสูงมักถูกจับไปเล่นในตำแหน่งวิงแบ็กขวาในระบบนี้ แต่พรสวรรค์ในการเล่นเกมรุกของเขาถูกจำกัดด้วยภาระหน้าที่ในเกมรับที่ระบบนี้ต้องการ", "ในขณะที่ สตีฟ คลาร์ก เคยใช้ระบบหลังห้าในช่วงแรกเพื่อรองรับทั้ง แอนดี โรเบิร์ตสัน และ จอห์น แม็กกินน์ แต่เขาก็กลับมาใช้ระบบหลังสี่แบบดั้งเดิมในเวลาต่อมา ทีมของคลาร์กอาจไม่ได้เล่นสนุกตื่นตาตื่นใจเสมอไป แต่พวกเขาก็ทำหน้าที่ได้สำเร็จเกือบทุกครั้ง", "คำถามสำหรับโปโกญอลีคือ เขาควรจะยึดมั่นในหลักการของตัวเองต่อไป หรือควรหันไปดูสิ่งที่กุนซือคนก่อนทำจนประสบความสำเร็จและสร้างความสุขให้แฟนบอลได้อีกครั้ง หลังจากผ่านไปสองแคมป์และ 6 นัด ช่วงเวลาแห่งการปรับตัวของกุนซือชาวเบลเยียมรายนี้ได้หมดลงแล้ว", "เวลาในการทำงานร่วมกับนักเตะเป็นสิ่งที่ผู้จัดการทีมชาติไม่มี แต่โปโกญอลีได้รับเวลามากกว่าคนอื่นด้วยซ้ำ จากช่วงพักเบรกทีมชาติที่ยาวนานระหว่างเดือนกันยายนถึงตุลาคม และแคมป์ล่าสุด ทำให้เขามีเวลารวมกับลูกทีมถึง 24 วัน ซึ่งเทียบเท่ากับเวลาที่สโมสรในสกอตติชพรีเมียร์ชิพมีตั้งแต่วันแรกของการปรีซีซั่นจนถึงเกมแรกในลีกคัพ", "แอนดี โรเบิร์ตสัน กลายเป็นนักเตะที่ติดทีมชาติสกอตแลนด์มากที่สุดในประวัติศาสตร์ในเกมที่พบกับสวิตเซอร์แลนด์ แต่กัปตันทีมรายนี้กลับไม่มีอะไรให้เฉลิมฉลอง 'สิ่งนั้นไม่ควรเกิดขึ้นในฟุตบอลระดับทีมชาติ' เขากล่าวกับ BBC Scotland หลังจบเกม", "'ผมไม่คิดว่าคุณจะมีเวลามากนักในฟุตบอลระดับทีมชาติ คุณต้องทำมันให้ได้ แฟนบอลที่เดินทางไปเชียร์ทุกที่ พวกเขาจะให้เวลาเราไห tre-live-football-transfer-news-updates-and-rumours", "original_title": "Transfer Centre LIVE! McKennie speaks on USA players reuniting with Poch at Man Utd", "thai_title": "เกาะติดตลาดซื้อขาย: แม็คเคนนีเปิดใจถึงโอกาสที่แข้งสหรัฐฯ จะได้ร่วมงานกับ โปเช็ตติโน ที่ แมนเชสเตอร์ ยูไนเต็ด", "tag": "Football", "sub_tag": "MAN UTD", "bullet_points": ["เวสตัน แม็คเคนนี กองกลางทีมชาติสหรัฐอเมริกา ออกมาแสดงความคิดเห็นถึงกระแสข่าวการดึงตัว เมาริซิโอ โปเช็ตติโน เข้ามาคุมทัพ แมนเชสเตอร์ ยูไนเต็ด", "มีการตั้งข้อสังเกตถึงความเป็นไปได้ที่นักเตะทีมชาติสหรัฐฯ หลายรายอาจย้ายไปร่วมงานกับ โปเช็ตติโน ในถิ่น โอลด์ แทรฟฟอร์ด", "แม็คเคนนี ยอมรับว่าการได้ร่วมงานกับกุนซือที่คุ้นเคยเป็นเรื่องที่น่าสนใจสำหรับนักเตะทุกคน", "สถานการณ์ในตลาดซื้อขายนักเตะยังคงเป็นที่จับตามองอย่างใกล้ชิดท่ามกลางความเปลี่ยนแปลงในสโมสรยักษ์ใหญ่แห่งพรีเมียร์ลีก"], "full_paragraphs": ["เวสตัน แม็คเคนนี กองกลางตัวเก่งของทีมชาติสหรัฐอเมริกา ได้ออกมาให้สัมภาษณ์ถึงประเด็นที่กำลังเป็นที่พูดถึงอย่างกว้างขวาง เกี่ยวกับโอกาสที่ เมาริซิโอ โปเช็ตติโน จะเข้ามาเป็นผู้จัดการทีมคนใหม่ของ แมนเชสเตอร์ ยูไนเต็ด โดยเฉพาะในแง่ของความสัมพันธ์ระหว่างกุนซือชาวอาร์เจนไตน์กับบรรดานักเตะทีมชาติสหรัฐฯ ที่อาจจะเกิดขึ้นในอนาคต", "ท่ามกลางกระแสข่าวลือที่หนาหูเกี่ยวกับการปรับเปลี่ยนโครงสร้างทีมในถิ่น โอลด์ แทรฟฟอร์ด ชื่อของ โปเช็ตติโน กลายเป็นตัวเต็งอันดับต้นๆ ที่จะเข้ามากอบกู้สถานการณ์ของ 'ปีศาจแดง' ซึ่งประเด็นที่น่าสนใจคือความเชื่อมโยงระหว่างเขากับนักเตะอเมริกันหลายคนที่กำลังทำผลงานได้ดีในยุโรป ซึ่งอาจนำไปสู่การย้ายทีมในช่วงตลาดซื้อขายนักเตะรอบถัดไป", "แม็คเคนนี ได้กล่าวถึงเรื่องนี้ว่า 'การได้ร่วมงานกับผู้จัดการทีมที่คุณรู้จักสไตล์การทำทีมเป็นอย่างดี หรือเป็นคนที่เข้าใจในตัวคุณ มันย่อมเป็นเรื่องที่น่าสนใจเสมอสำหรับนักฟุตบอลทุกคน โปเช็ตติโน เป็นโค้ชที่มีแนวทางชัดเจน และเขามีความสัมพันธ์ที่ดีกับนักเตะหลายคนในทีมชาติของเรา'", "อย่างไรก็ตาม กองกลางรายนี้ไม่ได้ยืนยันถึงแผนการย้ายทีมของตนเองหรือเพื่อนร่วมทีมแต่อย่างใด โดยเขาระบุเพียงว่า 'ในโลกของฟุตบอล อะไรก็เกิดขึ้นได้เสมอ โดยเฉพาะเมื่อมีการเปลี่ยนแปลงในระดับผู้จัดการทีม แต่ตอนนี้ผมยังคงโฟกัสอยู่กับหน้าท วิตการค้าแข้ง เขาอาจเป็นที่รู้จักจากวีรกรรมนอกสนามมากกว่าพรสวรรค์ที่ปฏิเสธไม่ได้ แต่กลับถูกมองว่าเสียของไปอย่างน่าเสียดาย ซึ่งดาวยิงชาวอิตาลีรายนี้มักจะตกเป็นพาดหัวข่าวอยู่เสมอ", "เวลาผ่านไป 15 ปีแล้วนับตั้งแต่การฉลองประตูอันโด่งดังด้วยเสื้อ 'Why always me?' (ทำไมต้องเป็นฉันเสมอ?) ในเกมแมนเชสเตอร์ดาร์บี้ ซึ่งเกิดขึ้นเพียงไม่กี่วันหลังจากที่เขาจุดพลุในห้องน้ำจนเกิดไฟไหม้บ้านพัก ปัจจุบันในวัย 36 ปี เขายังคงลงเล่นฟุตบอลอาชีพในลีกสูงสุดของสหรัฐอาหรับเอมิเรตส์กับสโมสร อัล-อิตติฟาค เคียงข้างกับ เอ็นอ็อค บาร์วูอาห์ พี่ชายแท้ๆ ของเขา", "BBC Sport จะพาไปย้อนดูเส้นทางอาชีพที่ผ่านสโมสรมาแล้วถึง 13 แห่ง ใน 6 ประเทศ รวมถึงการเป็นผู้จ่ายบอลให้เกิดประตูที่โด่งดังที่สุดในประวัติศาสตร์พรีเมียร์ลีก โดยเส้นทางของบาโลเตลลี่ไม่ได้เริ่มต้นจากอะคาเดมี่ของสโมสรยักษ์ใหญ่ แต่เขาเริ่มต้นจากการเล่นให้ ลูเมซซาเน่ ทีมในระดับดิวิชั่น 3 ของอิตาลี ใกล้บ้านเกิดในคอนเชซิโอ ก่อนจะไปทดสอบฝีเท้ากับ บาร์เซโลน่า แต่ไม่สำเร็จ และย้ายไปร่วมทีม อินเตอร์ มิลาน ในปี 2006", "ที่อินเตอร์ มิลาน บาโลเตลลี่ได้พบกับ โรแบร์โต้ มันชินี่ ผู้เป็นดั่งอาจารย์ใหญ่ ความสัมพันธ์ของทั้งคู่เปรียบเสมือนพ่อกับลูก ภายใต้การดูแลของกุนซือชาวอิตาลี บาโลเตลลี่ฉายแววโดดเด่นตั้งแต่อายุ 17 ปี โดยช่วยให้ทีมคว้าแชมป์กัลโช่ เซเรีย อา ฤดูกาล 2007-08 และเข้าถึงรอบชิงชนะเลิศโคปปา อิตาเลีย รวมถึงการทำ 2 ประตูใส่ ยูเวนตุส ในรอบก่อนรองชนะเลิศ", "ชีวิตของเขาเปลี่ยนไปเมื่อ โชเซ่ มูรินโญ่ เข้ามารับตำแหน่งต่อจากนั้น ไม่นานก็เกิดความขัดแย้งและการลงโทษทางวินัย โดยมูรินโญ่กล่าวว่าบาโลเตลลี่เป็นนักเตะที่ 'ควบคุมไม่ได้' และเคยวิจารณ์ฟอร์มการเล่นของเขาว่า 'ใกล้เคียงกับศูนย์' ความสัมพันธ์กับมูรินโญ่เต็มไปด้วยความตึงเครียด ซึ่งถือเป็นเรื่องยากที่กุนซือระดับ 'เดอะ สเปเชียล วัน' จะรับมือกับนักเตะคนหนึ่งไม่ได้ แม้บาโลเตลลี่จะคว้าแชมป์เซเรีย อา 3 สมัย และยูฟ่า แชมเปี้ยนส์ลีก กับอินเตอร์ แต่ชื่อเสียงในฐานะตัวปัญหาก็เริ่มบดบังผลงานในสนามของเขา", "ในเดือนสิงหาคม 2010 บาโลเตลลี่ย้ายไปร่วมทีม แมนเชสเตอร์ ซิตี้ เพื่อกลับมาร่วมงานกับมันชินี่อีกครั้ง กุนซือชาวอิตาลีพยายามพิสูจน์ว่าเขาสามารถควบคุมความคาดเดาไม่ได้ของบาโลเตลลี่ให้เป็นประโยชน์ต่อทีมได้ แต่ถึงกระนั้น บาโลเตลลี่ก็ยังคงสร้างประเด็นไม่หยุดหย่อน ทั้งการถูกใบแดง การขับรถชน และวีรกรรมปาปาเป้าใส่ผู้เล่นทีมเยาวชน ซึ่งแสดงให้เห็นถึงความไม่เป็นผู้ใหญ่", "หลังจากช่วยให้ แมนเชสเตอร์ ซิตี้ คว้าแชมป์เอฟเอ คัพ ในปี 2011 ซึ่งเป็นการสิ้นสุดการรอคอยถ้วยรางวัลใหญ่ในรอบ 35 ปี บาโลเตลลี่ก็ถูกวิจารณ์อย่างหนักจากการพยายามยิงท่าตอกส้นในเกมอุ่นเครื่องกับ แอลเอ กาแล็กซี่ จนมันชินี่ต้องเปลี่ยนตัวออกและตั้งคำถามถึงทัศนคติของเขาว่า 'ถ้าคุณจริงจัง คุณก็เล่นได้ 90 นาที แต่ถ้าไม่ คุณก็มานั่งข้างผมที่ม้านั่งสำรองได้เลย'", "บางครั้งความกล้าบ้าบิ่นของเขาก็ได้ผล เช่น ประตูที่ใช้หัวไหล่กระแทกเข้าประตูในเกมกับ นอริช ซิตี้ แต่ในเดือนตุลาคม 2011 เขาก็ตกเป็นข่าวใหญ่เมื่อหน่วยดับเพลิงต้องเข้าไประงับเหตุไฟไหม้ในห้องน้ำที่บ้านพักของเขา โดยบาโลเตลลี่อ้างว่าเป็นฝีมือของเพื่อน แต่ไม่กี่วันต่อมาเขาก็กลายเป็นฮีโร่ด้วยการทำประตูแรกในเกมที่ถล่ม แมนเชสเตอร์ ยูไนเต็ด 6-1 พร้อมโชว์เสื้อ 'Why always me?'", "มีเรื่องเล่ามากมายเกี่ยวกับเขา ทั้งการให้เงินคนไร้บ้าน 1,000 ปอนด์, การบุกไปที่โรงเรียนเพื่อจัดการกับเด็กที่รังแกนักเรียนคนอื่น หรือการขับรถแต่งตัวเป็นซานตาคลอสแจกของขวัญ ซึ่งแม้เจ้าตัวจะปฏิเสธหลายเรื่อง แต่ด้วยชื่อเสียงในตอนนั้นทำให้คนเชื่อว่าเป็นเรื่องจริง แฟนบอลซิตี้ถึงกับแต่งเพลงเชียร์ล้อเลียนอาการแพ้หญ้าของเขา และพฤติกรรมที่ชอบพกเงินสดเต็มกระเป๋าขับรถไปทั่วเมือง", "ในเดือนเมษายน 2012 บาโลเตลลี่ถูกใบแดงในเกมกับ อาร์เซน่อล ซึ่งดูเหมือนจะเป็นจุดจบของความหวังในการคว้าแชมป์ แต่หนึ่งเดือนต่อมา เขากลับเป็นคนแอสซิสต์ให้ เซร์คิโอ อเกวโร่ ทำประตูชัยในนาทีสุดท้ายในเกมกับ ควีนส์ปาร์ค เรนเจอร์ส ซึ่งทำให้ซิตี้คว้าแชมป์พรีเมียร์ลีกสมัยแรกได้สำเร็จ", "มิคาห์ ริชาร์ดส์ อดีตเพื่อนร่วมทีมกล่าวว่า 'เขาบ้าในทางที่ดี เขาเป็นสีสันของทีม เป็นฮีโร่ของแฟนบอลไม่ใช่แค่เรื่องนอกสนาม แต่ในสนามด้วย สิ่งที่ดีที่สุดคือเขาเป็นคนน่ารัก ไม่ได้หยิ่งผยองอย่างที่สื่อพยายามนำเสนอ เขาแค่บ้าๆ บอๆ นิดหน่อยเท่านั้น'", "อย่างไรก็ตาม ในเดือนมกราคม 2013 ความอดทนของมันชินี่ก็สิ้นสุดลงหลังจากมีปากเสียงกันในสนามซ้อม บาโลเตลลี่ถูกขายไปให้ เอซี มิลาน โดยมันชินี่กล่าวว่า 'เขาไม่ใช่คนเลวและเป็นนักเตะที่ยอดเยี่ยม แต่ผมเสียใจแทนเขาที่เขายังคงทำลายพรสวรรค์และคุณภาพของตั 2026-11-16T23:43:00Z", "published_th": "17 พ.ย. 2026 • 06:43 น.", "category_hint": "Football"}, {"id": 1794868254109, "guid": "https://www.skysports.com/football/switzerland-vs-scotland/report/554127", "original_title": "Scotland suffer heavy defeat in Switzerland as Robertson breaks caps record", "thai_title": "สกอตแลนด์พ่ายยับสวิตเซอร์แลนด์ 0-4 ปิดฉากเนชันส์ลีก พร้อมสถิติใหม่ของ โรเบิร์ตสัน", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["สกอตแลนด์บุกพ่ายสวิตเซอร์แลนด์ 0-4 ในศึกยูฟ่า เนชันส์ลีก กลุ่ม B1 ทำให้พลาดโอกาสลุ้นเพลย์ออฟ", "แอนดี โรเบิร์ตสัน สร้างประวัติศาสตร์ลงสนามรับใช้ทีมชาติสกอตแลนด์ครบ 103 นัด มากที่สุดตลอดกาล", "ทีมของ เซบาสเตียน โปโกญอลี จบอันดับ 3 ของกลุ่ม ทำให้เส้นทางสู่ยูโร 2028 ยากลำบากขึ้นจากการเสียโอกาสวางอันดับโถจับสลาก", "สถานการณ์ของกุนซือชาวเบลเยียมเริ่มสั่นคลอน หลังทำผลงานชนะเพียง 2 นัดจาก 6 เกมในรายการนี้"], "full_paragraphs": ["ทีมชาติสกอตแลนด์ประสบความพ่ายแพ้อย่างหนักในเกมเยือนสวิตเซอร์แลนด์ด้วยสกอร์ 0-4 ในศึกยูฟ่า เนชันส์ลีก กลุ่ม B1 ส่งผลให้พวกเขาพลาดโอกาสในการผ่านเข้าสู่รอบเพลย์ออฟ และทำให้เส้นทางสู่การแข่งขันฟุตบอลยูโร 2028 มีความท้าทายมากขึ้นกว่าเดิม", "ในค่ำคืนที่ แอนดี โรเบิร์ตสัน สร้างประวัติศาสตร์หน้าใหม่ด้วยการลงสนามรับใช้ทีมชาติสกอตแลนด์เป็นนัดที่ 103 ซึ่งเป็นสถิติสูงสุดตลอดกาลของทีมชาติ แต่ผลการแข่งขันที่สนามในเมืองเซนต์กัลเลนกลับกลายเป็นฝันร้ายสำหรับ เซบาสเตียน โปโกญอลี กุนซือของทีมที่กำลังเผชิญกับความกดดันอย่างหนัก", "ทัพสกอตแลนด์เริ่มต้นเกมได้อย่างสูสีกับทีมเจ้าบ้านที่การันตีแชมป์กลุ่มไปก่อนหน้านี้แล้ว จนกระทั่งในนาทีที่ 22 ลูอิส เฟอร์กูสัน กองกลางของทีมโชคร้ายสกัดบอลเข้าประตูตัวเอง ทำให้สวิตเซอร์แลนด์ขึ้นนำ 1-0", "ความผิดพลาดดังกล่าวส่งผลกระทบต่อสภาพจิตใจของผู้มาเยือนอย่างเห็นได้ชัด ประกอบกับการที่ อารอน ฮิกกีย์ วิงแบ็กตัวเก่งได้รับบาดเจ็บจนต้องถูกเปลี่ยนตัวออกก่อนจบครึ่งแรก สถานการณ์ของสกอตแลนด์ยิ่งเลวร้ายลงในนาทีที่ 47 เมื่อ วินสลีย์ โบเตลี ยิงประตูให้เจ้าบ้านหนีห่างเป็น 2-0 ตามด้วย อัลวิน ซานเชส ที่ซัดประตูที่สามในอีก 4 นาทีต่อมา และปิดท้ายด้วยประตูจากตัวสำรองอย่าง เซกี อัมดูนี ในช่วงท้ายเกม", "ส 30 ปี", "กองกลางวัย 27 ปีรายนี้ ย้ายจาก เวสต์แฮม มาร่วมทีม อาร์เซนอล ด้วยค่าตัวสถิติสโมสร 105 ล้านปอนด์ในปี 2023 เขาได้กลายเป็นสมาชิกคนสำคัญในกลุ่มผู้นำของ มิเกล อาร์เตตา และเป็นนักเตะที่กุนซือชาวสเปนรายนี้ใช้เป็นศูนย์กลางในการสร้างทีม", "ในการให้สัมภาษณ์เมื่อวันเสาร์ที่ผ่านมา ก่อนเกมเนชันส์ลีกนัดสุดท้ายของทีมชาติอังกฤษในสเปน ไรซ์ได้ยืนยันว่าเขากำลังใกล้ที่จะบรรลุข้อตกลงดังกล่าว", "ไรซ์กล่าวว่า 'ผมเป็นนักเตะที่ตั้งเป้าหมายให้ตัวเองเสมอ และผลักดันตัวเองให้ดียิ่งขึ้น ผมมีความมั่นคงกับสโมสรที่ผมอยู่มาโดยตลอด หวังว่าสัญญาฉบับใหม่จะเกิดขึ้นในเร็วๆ นี้'", "'ผมโชคดีมากที่ได้อยู่กับสโมสรอย่าง อาร์เซนอล ที่ผู้จัดการทีมแสดงความเชื่อมั่นในตัวผมอย่างมาก ผมมีเพื่อนร่วมทีมหลายคนที่ทุ่มเทพลังและความพยายามให้กับผมอย่างเต็มที่ ผมโชคดีมากที่ไม่ต้องกังวลเกี่ยวกับเรื่องเหล่านั้น มันทำให้การเล่นฟุตบอลเป็นเรื่องที่ง่ายขึ้นมาก'", "ในขณะเดียวกัน มาร์ติน โอเดการ์ด อีกหนึ่งกำลังสำคัญในทีมตัวจริงของ อาร์เซนอล ได้กล่าวว่าเขายังไม่ได้เริ่มการเจรจาสัญญาฉบับใหม่ แม้ว่าสัญญาปัจจุบันของเขาจะหมดลงในช่วงเวลาเดียวกับของไรซ์ก็ตาม", "กัปตันทีม อาร์เซนอล กล่าวระหว่างเก็บตัวกับทีมชาตินอร์เวย์ว่า 'ผมมีความสุขและหวังว่าจะได้อยู่ที่นี่ไปอีกนาน แต่จนถึงตอนนี้เรายังไม่ได้เริ่มคุยเรื่องนั้นกัน'", "'ไม่มีความกดดันอะไรเกี่ยวกับเรื่องนี้ ผมอยู่ในจุดที่ผมอยู่ และผมมีความสุขกับมันมาก ทุกอย่างกำลังไปได้สวย และมันไม่ใช่สิ่งที่ผมต้องกังวล อย่างที่ผมบอกไป ผมต้องการอยู่ที่นี่ไปอีกนาน ผมมีความสุขกับช่วงเวลานี้มาก'"], "link": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "canonical_link": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "cover_image_url": "https://e1.365dm.com/26/10/1920x1080/skysports-declan-rice-arsenal_7383215.jpg?20261021214729", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794863520, "published_at": "2026-11-16T21:12:00Z", "published_th": "17 พ.ย. 2026 • 04:12 น.", "category_hint": "Football"}, {"id": 1794864676665, "guid": "https://www.skysports.com/football/news/11095/13612984/wales-vs-portugal-no-cristiano-ronaldo-for-the-visitors-as-craig-bellamys-side-have-a-free-hit-in-final-nations-league-encounter", "original_title": "Wales have a free hit against Ronaldo-less Portugal", "thai_title": "เวลส์เตรียมดวลโปรตุเกสไร้เงา โรนัลโด ในศึกเนชันส์ลีก", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["ทีมชาติเวลส์เตรียมเปิดบ้านพบกับโปรตุเกสในศึกเนชันส์ลีก โดยไร้เงา คริสเตียโน โรนัลโด ที่ประกาศอำลาทีมชาติไปแล้ว", "เคร็ก เบลลามี กุนซือทีมชาติเวลส์ ยกย่อง โรนัลโด ว่าเป็นหนึ่งในนักเตะที่เก่งที่สุดตลอดกาลและรู้สึกเป็นเกียรติที่ได้คุมทีมเผชิญหน้ากับเขา", "เบน เดวีส์ กัปตันทีมเวลส์ ยอมรับแบบติดตลกว่าการไม่ต้องดวลกับ โรนัลโด ถือเป็นเรื่องดีสำหรับทีม", "เวลส์ตั้งเป้าเก็บผลการแข่งขันที่ดีเพื่อปิดฉากรอบแบ่งกลุ่ม แม้จะจบอันดับสุดท้ายของกลุ่มแต่ยังมีโอกาสลุ้นเพลย์ออฟเพื่อรักษาพื้นที่ในลีก A ต่อไป"], "full_paragraphs": ["ทีมชาติเวลส์มีคิวลงสนามพบกับโปรตุเกสในศึกเนชันส์ลีกวันอังคารนี้ โดยทีมเยือนจะไม่มี คริสเตียโน โรนัลโด ยอดดาวยิงระดับตำนานที่ประกาศอำลาทีมชาติไปแล้ว ซึ่ง เบน เดวีส์ กัปตันทีมเวลส์ยอมรับว่ารู้สึกยินดีที่กองหน้ารายนี้ไม่ได้อยู่ในทีมโปรตุเกสชุดนี้ ขณะที่ เคร็ก เบลลามี ผู้จัดการทีมเวลส์ไม่ได้แสดงท่าทีตื่นเต้นกับประเด็นดังกล่าวมากนัก", "สนามคาร์ดิฟฟ์ ซิตี้ สเตเดียม ขายบัตรเข้าชมจนหมดเกลี้ยงอย่างรวดเร็วเมื่อทราบผลการจับสลากว่าเวลส์จะต้องพบกับโปรตุเกสในนัดสุดท้ายของกลุ่ม D ซึ่งแฟนบอลต่างตั้งตารอวันที่ 17 พฤศจิกายน 2026 เพราะนี่อาจเป็นโอกาสสุดท้ายที่จะได้เห็น คริสเตียโน โรนัลโด ลงเล่นบนแผ่นดินสหราชอาณาจักร", "นี่ควรจะเป็นโอกาสอันยอดเยี่ยมในการได้เห็นหนึ่งในนักเตะที่ยิ่งใหญ่ที่สุดของโลกในช่วงท้ายของอาชีพค้าแข้งระดับทีมชาติ และยังเป็นการพิสูจน์ว่าเวลส์พัฒนาไปถึงระดับไหนหลังจากผ่านการแข่งขันในลีก A ซึ่งเป็นลีกสูงสุดของยุโรปมาตลอดทั้งทัวร์นาเมนต์ แต่เหตุการณ์กลับไม่เป็นเช่นนั้น เมื่อ โรนัลโด ไม่ได้ลงเล่นให้โปรตุเกสอีกเลยนับตั้งแต่เกมที่พบกับเวลส์ในลิสบอนช่วงต้นรายการ และเขาก็ได้ประกาศยุติเส้นทางทีมชาติท่ามกลางประเด็นดราม่า", "แม้ โรนัลโด จะไม่ได้มาที่เวลส์และบทสรุปการอำลาทีมชาติของเขาอาจไม่ได้สวยงามนัก แต่เขาก็เป็นที่จดจำของใครหลายคน โดย เคร็ก เบลลามี กุนซือเวลส์กล่าวว่า: \"ทันทีที่เขาประกาศรีไทร์ ทุกอย่างก็ดูวุ่นวายไปหมด เขาคือหนึ่งในนักเตะที่เก่งที่สุดเท่าที่เคยมีมา เราทุกคนจะคิดถึงเขา ตอนนี้เขายังเล่นในระดับสโมสร ดังนั้นเรายังพอมีโอกาสได้เห็นเขาเล่นอยู่บ้าง\"", "เบลลามีกล่าวเสริมว่า: \"จงรู้สึกขอบคุณที่คุณได้เห็นพรสวรรค์อันน่าเหลือเชื่อที่คุณสามารถเรียกได้ว่าเป็นของคุณ นี่คือสิ่งที่ผมพูดกับชาวโปรตุเกส แต่ผมรู้สึกขอบคุณที่เราได้เห็นความยืนหยัดของยอดนักเตะผู้ยิ่งใหญ่คนหนึ่ง ซึ่งสร้างผลกระทบอย่างมหาศาลต่อวงการฟุตบอลโดยรวม และจะยังคงสร้างแรงบันดาลใจให้กับเด็กๆ ที่เฝ้าดูเขาต่อไป ผมรู้สึกว่าตอนนี้ควรหยุดพูดแล้วหันมาเฉลิมฉลองกันดีกว่า ผมรู้สึกขอบคุณที่ได้เห็นเขาเล่นและขอบคุณที่ได้มีโอกาสคุมทีมเผชิญหน้ากับเขาด้วย\"", "ด้าน เบน เดวีส์ กัปตันทีมเวลส์เผยความรู้สึกในมุมมองของนักเตะฝั่งตรงข้ามด้วยรอยยิ้มว่า: \"เกมไหนที่คุณไม่ต้องเจอกับ คริสเตียโน โรนัลโด ผมคิดว่ามันเป็นเรื่องดีสำหรับคุณมากกว่า\" เดวีส์กล่าวด้วยความถ่อมตัวก่อนเสริมว่า: \"คุณไม่ต้องกังวลว่าเขาจะทำอะไรคุณได้บ้างในวันนั้น เขาคือนักเตะระดับโลก มันเป็นเกียรติและสิทธิพิเศษที่ได้แชร์สนามร่วมกับเขาเพราะสิ่งที่เขาทำไว้ในวงการฟุตบอล เราโชคดีที่ได้ทำแบบนั้นในลิสบอน แต่คงไม่มีนักเตะเวลส์คนไหนบ่นหรอกที่เขาไม่ได้มาที่นี่\"", "แม้เกมระหว่างเวลส์กับโปรตุเกสจะมีความสำคัญต่อทั้งสองชาติ แต่คำถามส่วนใหญ่ในงานแถลงข่าวกลับพุ่งเป้าไปที่ โรนัลโด มากกว่าประเด็นอื่น ทั้งนักข่าวเวลส์ อังกฤษ และโปรตุเกส ต่างก็ถามถึงการหายไปของเจ้าของเสื้อหมายเลข 7 รายนี้ ซึ่งเป็นเรื่องน่าเสียดายสำหรับแฟนบอลเกือบ 35,000 คนในสนามคาร์ดิฟฟ์ ซิตี้ สเตเดียม ที่หวังจะได้เห็นการอำลาสนามของยอดนักเตะรายนี้", "อย่างไรก็ตาม สิ่งที่แฟนบอลจะได้เห็นคือทีมโปรตุเกสที่เต็มไปด้วยนักเตะพรสวรรค์ ซึ่งคุณภาพและความลึกของขุมกำลังในหน้ากระดาษนั้นถือว่าน่าเหลือเชื่อ แต่ทีมชุดนี้เพิ่งจะบอบช้ำมาจากการพ่ายแพ้คาบ้านต่อเดนมาร์กถึง 1-4 เมื่อสุดสัปดาห์ที่ผ่านมา", "นี่คือสภาพของโปรตุเกสหากไม่มี โรนัลโด หรือไม่? ผมไม่คิดเช่นนั้น แต่เวลส์มีโอกาสที่จะเล่นแบบไร้ความกดดันในเกมนี้ แม้ผลงานในลีก A จะเก็บชัยชนะได้เพียงนัดเดียว แต่หากไม่นับเกมที่แพ้เดนมาร์กในบ้าน ทีมของเบลลามีก็สามารถต่อกรกับทั้งโปรตุเกสและนอร์เวย์ได้อย่างสูสี", "เบลลามีกล่าวอย่างเสียดายว่ามีหลาย \"จังหวะ\" ในทุกเกมที่เวลส์แสดงให้เห็นถึงคุณภาพและความสม่ำเสมอที่เหนือกว่าคู่แข่ง ซึ่งนำไปสู่ชัยชนะเหนือทีมชาตินอร์เวย์ แต่ในอีก 4 เกมที่เหลือ เวลส์ยังทำได้ไม่ดีพอ แม้จะพยายามอย่างเต็มที่แล้วก็ตาม", "แม้แต่แฟนบอลเวลส์ที่เข้าขั้นแฟนพันธุ์แท้แต่ไม่ใช่ \"แฟนคลับเบลลามี\" ก็ไม่อาจปฏิเสธสถิติที่ชัดเจนได้ เวลส์ครองบอลได้ดีในทุกเกมที่ลงเล่นในลีก A และสร้างโอกาสทำประตูได้มากมาย เช่น 12 ครั้งในเกมที่พบกับนอร์เวย์เมื่อวันเสาร์ที่ผ่านมา บางทีสิ่งที่ขาดหายไปคือเพชฌฆาตหน้าปากประตูที่จะเปลี่ยนโอกาสเหล่านั้นให้เป็นประตูจริงๆ", "สำหรับเบลลามี แคมเปญในลีก A ครั้งนี้ถือว่าประสบความสำเร็จหากมองข้ามผลลัพธ์ระยะสั้น: \"คุณต้องการเผชิญหน้ากับทีมระดับนี้ มันเป็นแรงจูงใจชั้นดีในการเล่นกับทีมเหล่านี้ และแม้แต่ช่วงเวลาที่ไม่เป็นใจ คุณก็ได้เรียนรู้ คุณเข้าใจใช่ไหม? เหมือนกับจังหวะตัดสินเกมเหล่านั้น\"", "\"คุณไม่สามารถพลาดได้เลยใช่ไหม? ในตอนนี้เราทำได้แค่ยิงไปเข้าข้างตาข่าย นั่นคือความแตกต่าง ผมคิดว่าเรานำเสนอเวอร์ชันที่ดีของตัวเองในเกมเหล่านี้ เราแข่งขันได้ดีอย่างแน่นอน และผมคาดหวังให้เราเป็นเช่นนั้น แต่มันติดอยู่ที่รายละเอียดเล็กๆ น้อยๆ ในช่วงท้ายเกม\"", "\"เราสร้างโอกาสทำประตูได้ไหม? ค่า xG ของเราสูงกว่าจำนวนประตูที่ทำได้ นั่นบอกคุณว่าเรากำลังสร้างโอกาสทองได้จริง\" เบลลามีกล่าว \"นั่นคือช่วงเวลาที่สามารถเปลี่ยนฟอร์มการเล่นที่ดีให้กลายเป็นชัยชนะ และผมเชื่อว่าวิธีที่ดีที่สุดคือการได้ลงเล่นกับทีมเหล่านี้เป็นประจำ\"", "ทีมของเบลลามีจะจบอันดับสุดท้ายของกลุ่ม แต่สถิติของพวกเขายังดีกว่าหลายทีมในลีก A เช่น สาธารณรัฐเช็ก เซอร์เบีย และตุรกี ดังนั้นพวกเขาจะไม่ตกชั้นโดยอัตโนมัติ โดยเวลส์จะต้องไปเล่นรอบเพลย์ออฟในเดือนมีนาคมปีหน้ากับทีมอันดับสองจากลีก B ซึ่งเวลส์พร้อมรับมือและมั่นใจในโอกาสของตนเอง โดยเฉพาะการได้เล่นในบ้านในนัดที่สอง", "ด้วยเป้าหมายระยะยาวคือ ยูโร 2028 และเป้าหมายระยะกลางคือการอยู่ในลีก A ต่อไป เป้าหมายระยะสั้นของเวลส์คือการทำผลงานให้เหมือนกับทีมรักบี้ของพวกเขา นั่นคือการท้าทายคำวิจารณ์และคู่แข่งที่ \"เหนือ าไป ทำให้สกอร์ขยับเป็น 2-1", "อย่างไรก็ตาม เซตฟอร์ด ก็ไม่สามารถทำอะไรได้ในประตูตีเสมอของฝรั่งเศส เมื่อ เวอร์ซินี ตัดสินใจยิงไกลจากระยะไกล บอลพุ่งเสียบตาข่ายเข้าไปอย่างสวยงาม", "ทว่าอังกฤษก็สามารถทวงคืนความได้เปรียบกลับมาได้ในอีก 4 นาทีต่อมา เมื่อ แฮร์ริสัน อาร์มสตรอง จ่ายบอลให้ ดาวแมน ที่ยืนว่างอยู่คนเดียวในกรอบเขตโทษ ก่อนจะแปบอลเข้าประตูโล่งๆ กลายเป็นประตูประวัติศาสตร์ในที่สุด"], "link": "https://www.skysports.com/football/england-u21-vs-france-u21/report/578798", "canonical_link": "https://www.skysports.com/football/england-u21-vs-france-u21/report/578798", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-dowman-england_7408188.jpg?20261116220011", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-england-france_7408194.jpg?20261116220603"], "videos": [], "review_score": "", "published_ts": 1794856020, "published_at": "2026-11-16T19:07:00Z", "published_th": "17 พ.ย. 2026 • 02:07 น.", "category_hint": "Football"}, {"id": 1794843039513, "guid": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "original_title": "How Frank can restore reputation and save Crystal Palace", "thai_title": "ภารกิจกู้ชีพ! โธมัส แฟรงค์ เตรียมรับงานคุม คริสตัล พาเลซ หวังฟื้นฟูชื่อเสียงในพรีเมียร์ลีก", "tag": "Football", "sub_tag": "CRYSTAL PALACE", "bullet_points": ["โธมัส แฟรงค์ เตรียมเข้ารับตำแหน่งผู้จัดการทีมคนใหม่ของ คริสตัล พาเลซ หลังทีมทำผลงานย่ำแย่รั้งอันดับบ๊วยของตาราง", "ความท้าทายสำคัญของแฟรงค์คือการปรับปรุงเกมรับที่เสียประตูมากที่สุดในลีกถึง 24 ลูก และการสร้างความเชื่อมั่นให้กับทีมที่ขาดคุณภาพหลังจากเสียผู้เล่นตัวหลักไปในช่วงซัมเมอร์", "แม้สถานการณ์จะดูยากลำบาก แต่พาเลซยังมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายในช่วง 10 นัดแรกในรอบ 24 ปี", "แฟรงค์ตั้งเป้าใช้ประสบการณ์จากการคุม เบรนท์ฟอร์ด มาปรับใช้เพื่อสร้างความมั่นคงและยกระดับทีมให้กลับมาแข่งขันได้อีกครั้ง"], "full_paragraphs": ["คริสตัล พาเลซ กำลังจะกลายเป็นสโมสรที่ 3 ในลอนดอนที่ โธมัส แฟรงค์ เข้ามาคุมทีม ต่อจาก เบรนท์ฟอร์ด และ ท็อตแนม ฮอตสเปอร์", "เมื่อเดือนมิถุนายนที่ผ่านมา โธมัส แฟรงค์ ได้กล่าวไว้ว่า \"เมื่อถึงเวลาที่เหมาะสม ผมจะตั้งตารอการกลับมาทำหน้าที่ผู้จัดการทีมอีกครั้ง พร้อมที่จะทุ่มเทให้กับงานด้วยพลังงานและความมุ่งมั่นอย่างเต็มที่\" และเวลานั้นก็มาถึงแล้ว เมื่อกุนซือชาวเดนมาร์กรายนี้กำลังจะได้รับการประกาศให้เป็นนายใหญ่คนใหม่ของ คริสตัล พาเลซ ทีมที่ปัจจุบันรั้งอันดับบ๊วยของตารางพรีเมียร์ลีก โดยมีแต้มห่างจากโซนปลอดภัยอยู่ 2 คะแนน และมีผลต่างประตูได้เสียที่เป็นรอง", "ก่อนหน้านี้ ปิแอร์ เซจ อดีตหัวหน้าผู้ฝึกสอนของพาเลซ เพิ่งถูกปลดออกจากตำแหน่งเมื่อสัปดาห์ที่ผ่านมา หลังจากคุมทีมไปเพียง 16 นัดรวมทุกรายการ ซึ่งการเข้ามารับงานในครั้งนี้ถือเป็นโอกาสสำคัญที่แฟรงค์จะกู้ชื่อเสียงของตนเองกลับคืนมา หลังจากถูก ท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมาหลังคุมทีมได้เพียง 8 เดือน", "ร็อบ กรีน อดีตผู้รักษาประตูทีมชาติอังกฤษและ เวสต์แฮม ยูไนเต็ด กล่าวกับ BBC Sport ว่า \"มันจะเป็นเรื่องที่น่าตกใจสำหรับ โธมัส แฟรงค์ เล็กน้อย เขาเคยประสบความสำเร็จที่ เบรนท์ฟอร์ด ซึ่งเป็นสโมสรที่มีการบริหารจัดการที่ดีเยี่ยม มีการวางแผนและคิดมาอย่างดีในการดึงนักเตะเข้ามาทดแทนคนที่ขายออกไปเพื่อทำกำไร แต่สิ่งนั้นไม่ได้เกิดขึ้นที่ คริสตัล พาเลซ พวกเขาสูญเสียผู้เล่นไปแล้วต้องรีบหาคนมาแทนอย่างฉุกละหุก ทีมชุดนี้ถูกลดทอนคุณภาพลงจากการขายนักเตะออกไปโดยไม่มีใครที่มีคุณภาพเท่าเดิมเข้ามาแทนที่ โธมัส แฟรงค์ จำเป็นต้องค้นหาบางอย่างภายในทีมเพื่อสร้างความเชื่อมั่นว่าพวกเขาสามารถแข่งขันในพรีเมียร์ลีกได้ เพราะในตอนนี้มันดูห่างไกลจากจุดนั้นมาก\"", "นับตั้งแต่ถูกปลดจาก ท็อตแนม ฮอตสเปอร์ หลังคุมทีมในลีกไป 26 นัดเมื่อฤดูกาลที่แล้ว แฟรงค์ว่างเว้นจากการคุมทีมมานานกว่าช่วงเวลาที่เขาคุมทีมสเปอร์สเสียอีก ในช่วงซัมเมอร์เขาเคยออกแถลงการณ์ว่า \"มีการพูดคุยและโอกาสต่างๆ\" เข้ามาให้เขากลับไปทำงาน แต่เขา \"ตัดสินใจที่จะไม่รีบร้อนรับงานถัดไป\"", "พอล โรบินสัน อดีตผู้รักษาประตู ท็อตแนม ฮอตสเปอร์ และทีมชาติอังกฤษ กล่าวว่า \"พาเลซเคยมีหนึ่งในผู้จัดการทีมที่ดีที่สุดเท่าที่พวกเขาเคยมีมา หรืออาจจะดีที่สุดตลอดกาลด้วยซ้ำ ที่พาทีมคว้าถ้วยรางวัลมาครอง ลองดูสิ่งที่พวกเขาทำได้เมื่อฤดูกาลที่แล้วสิ แทนที่จะต่อยอดจากจุดนั้น พวกเขากลับรื้อทีมทิ้ง พวกเขาถอยหลังลงคลอง\"", "แฟรงค์เคยเปรียบเปรยการเป็นผู้จัดการทีมว่าเหมือนการอยู่บน \"วงล้อหนูถีบจักร\" และ \"ละครสัตว์ที่บ้าคลั่ง\" ดังนั้นการที่เขาตัดสินใจกลับมาคุมทีมที่รั้งท้ายตารางในตอนนี้ จึงเป็นเรื่องที่น่าสนใจ โดยแฟรงค์ซึ่งเคยเป็นส่วนหนึ่งของทีมวิเคราะห์ฟุตบอลโลกของ BBC Sport ในช่วงซัมเมอร์ จะกลับมาทำงานด้วยความสดชื่นและพลังงานที่เต็มเปี่ยมหลังจากห่างหายจากวงการไปหลายเดือน", "ระหว่างการรับตำแหน่งที่ เบรนท์ฟอร์ด ในเดือนตุลาคม 2018 จนถึงวันที่ถูกปลดจาก สเปอร์ส เมื่อต้นปีนี้ เขาทำงานโดยไม่มีวันหยุดพักมานานถึง 7 ปีกับอีก 4 เดือน การใช้เวลาช่วงไม่กี่เดือนที่ผ่านมาห่างจากความกดดันของพรีเมียร์ลีก ทำให้แฟรงค์ได้ \"ศึกษา สังเกต และเรียนรู้จากผู้นำคนอื่นๆ ทั้งในและนอกวงการกีฬา\" ตามคำกล่าวของเขาเอง", "แฟรงค์ซึ่งให้ความสำคัญอย่างยิ่งกับการจัดระเบียบลูกตั้งเตะ จะต้องรีบปรับจูนทีมทันทีที่ คริสตัล พาเลซ ซึ่งแพ้ในลีกมา 4 นัดติดต่อกัน โดยทีมเสียประตูไปแล้วถึง 24 ลูก ซึ่งมากที่สุดในพรีเมียร์ลีก และยิงได้เพียง 10 ประตูเท่านั้น", "ทอม อัลนัตต์ นักข่าวฟุตบอลจาก The Times กล่าวกับรายการ Football Daily ของ BBC Radio 5 Live ว่า \"หากคุณต้องการใครสักคนเข้ามาเพื่อสร้างความมั่นคงและความแข็งแกร่งในเกมรับ พร้อมกับปรับปรุงเรื่องลูกตั้งเตะ โธมัส แฟรงค์ คือคนที่สมบูรณ์แบบสำหรับงานนี้\"", "ด้วยการที่พรีเมียร์ลีกเพิ่งผ่านไปเพียง 10 นัด แฟรงค์ยังมีเวลามากพอที่จะพลิกสถานการณ์ และเขาน่าจะมีเป้าหมายในใจสำหรับการเสริมทัพเมื่อตลาดซื้อขายนักเตะเปิดขึ้นในเดือนมกราคม โดยในช่วงซัมเมอร์ที่ผ่านมา พาเลซขาย แม็กซองซ์ ลาครัวซ์ กองหลังชาวฝรั่งเศสให้ เชลซี ในราคา 52 ล้านปอนด์ และ ดาเนียล มูญอซ แบ็กขวาชาวโคลอมเบียให้ นอตทิงแฮม ฟอเรสต์ ในราคา 22 ล้านปอนด์ ซึ่งอัลนัตต์เสริมว่า \"เรารู้ว่าพวกเขาขายนักเตะฝีเท้าดีออกไปเยอะมาก และจนถึงตอนนี้ผมไม่คิดว่าพวกเขาจะหาใครมาแทนที่ได้อย่างเหมาะสม\"", "ความท้าทายอีกประการสำหรับแฟรงค์คือการดึงฟอร์มเก่งของ อดัม วอร์ตัน กองกลางที่ไม่ได้ลงเล่นให้ทีมชาติอังกฤษมาตั้งแต่เดือนมีนาคมให้กลับมาอีกครั้ง ซึ่งสิ่งเหล่านี้คือความท้าทายที่ผู้จัดการทีมคนใหม่พร้อมจะเผชิญ", "พอล โรบินสัน กล่าวทิ้งท้ายว่า \"คริสตัล พาเลซ และ โธมัส แฟรงค์ ดูจะเป็นส่วนผสมที่ลงตัวมาก\" ทั้งนี้ โธมัส แฟรงค์ มีงานหนักรออยู่ เพรา ยถูกแฟนบอลบางส่วนโห่ใส่ในเกมที่เสมอกับยูเครน 1-1 เมื่อเดือนมีนาคมที่ผ่านมา หลังจากที่เขากลับมาติดทีมชาติอีกครั้งภายใต้การคุมทีมของ โทมัส ทูเคิล", "\"เหตุการณ์ที่เกิดขึ้นกับเบนมันผ่านไปกว่า 5 ปีแล้ว ผมไม่รู้จริงๆ ว่าทำไมเรื่องนี้ถึงยังคงเป็นประเด็นที่ถูกหยิบยกมาพูดถึงอยู่\" ไรซ์กล่าวกับ BBC Radio 5 Live", "\"เมื่อรู้จักเบน และรู้จักตัวตนของเขา ผมบอกได้เลยว่าเขาได้ก้าวข้ามเรื่องราวทั้งหมดนั้นไปเรียบร้อยแล้ว เขาภูมิใจเสมอที่ได้สวมเสื้อทีมชาติ และทุกครั้งที่เขาลงสนาม เขาจะทุ่มเทเต็มร้อยเปอร์เซ็นต์เสมอ\"", "\"มันแสดงให้เห็นถึงตัวตนของเขา การถูกโห่ใส่ตอนลงสนามที่เวมบลีย์ไม่ใช่เรื่องง่ายเลย แต่การที่เขาสามารถแสดงความแข็งแกร่งทางจิตใจเพื่อลงเล่นและทำผลงานได้ดี เหมือนกับที่เขาทำได้ในช่วงหลายเดือนที่ผ่านมานั้น ถือเป็นเครื่องพิสูจน์ตัวเขาได้อย่างแท้จริง\"", "ไรซ์ยังกล่าวเสริมว่า บรรดาผู้เล่นในทีมไม่ได้มีการพูดคุยถึงสถานการณ์นี้เลย และทุกคนต่างก้าวข้ามเรื่องดังกล่าวไปแล้ว พร้อมระบุว่า ไวท์ยังมี \"อนาคตที่น่าตื่นเต้นรออยู่กับทีมชาติอังกฤษชุดนี้\"", "ก่อนหน้านี้ ไวท์เคยกล่าวว่า ผู้คนยังไม่ทราบ \"เรื่องราวทั้งหมด\" เบื้องหลังการตัดสินใจถอนตัวจากแคมป์กาตาร์ แต่เขาก็ยังคงยืนหยัดในการตัดสินใจของตนเอง", "ในประเด็นอื่น ไรซ์ยังยืนยันว่าเขากำลังใกล้ที่จะเซ็นสัญญาฉบับใหม่กับอาร์เซนอล โดย BBC Sport ได้รายงานครั้งแรกเมื่อวันที่ 7 ตุลาคมว่า กองกลางรายนี้เตรียมเซ็นสัญญาฉบับใหม่ระยะยาวที่เอมิเรตส์ สเตเดียม ซึ่งนักเตะวัย 27 ปีได้กล่าวถึงเรื่องนี้ก่อนเกมที่อังกฤษจะพบกับสเปนในวันอาทิตย์ว่า \"สัญญาฉบับใหม่น่าจะเกิดขึ้นในเร็วๆ นี้ และผมโชคดีมากที่ได้อยู่กับสโมสรอย่างอาร์เซนอล ที่ซึ่งผู้จัดการทีมแสดงความเชื่อมั่นในตัวผมอย่างมาก รวมถึงเพื่อนร่วมทีมที่ทุ่มเทพลังให้กับผมอย่างเต็มที่\"", "สัญญาปัจจุบันของไรซ์จะหมดลงในปี 2028 แต่คาดว่าอดีตดาวเตะเวสต์แฮมรายนี้จะขยายระยะเวลาการค้าแข้งในลอนดอนเหนือออกไป หลังจากย้ายมาจากลอนดอน สเตเดียม ในปี 2023 ด้วยค่าตัว 105 ล้านปอนด์ โดยสัญญาฉบับใหม่นี้จะทำให้เขากลายเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของอาร์เซนอลเทียบเท่ากับ บูกาโย ซากา", "ไรซ์สามารถหลีกเลี่ยงความวุ่นวายตลอดอาชีพการค้าแข้งของเขา และเขาเชื่อว่าความต่อเนื่องนี้เองที่ช่วยให้เขาเติบโตขึ้น \"ผมโชคดีมากที่สามารถเล่นในระดับที่สม่ำเสมอได้ตลอดอาชีพการค้าแข้ง ผมตั้งเป้าหมายให้ตัวเองเสมอและผลักดันตัวเองให้มากขึ้น\"", "\"ผมโชคดีมากที่ไม่ต้องกังวลกับเรื่องเหล่านั้น เพราะมันทำให้การเล่นฟุตบอลเป็นเรื่องที่ง่ายขึ้นมาก\""], "link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5f63/live/321873e0-ef8b-11ee-975b-efffd9777018.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6615/live/ce8996a0-7ab8-11f0-83cc-c5da98c419b8.png"], "published_th": "15 พ.ย. 2026 • 05:26 น.", "category_hint": "Football", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "guid": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "published_ts": 1794695216, "published_at": "2026-11-14T22:26:56Z", "videos": [], "review_score": "", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794902503279, "guid": "https://www.skysports.com/football/news/11095/13611443/mauricio-pochettino-to-man-utd-what-does-a-pochettino-team-look-like-and-how-will-he-set-up-struggling-red-devils", "original_title": "What does a Pochettino team look like?", "thai_title": "เจาะลึกสไตล์การทำทีมของ เมาริซิโอ โปเช็ตติโน่ กับภารกิจกอบกู้ แมนเชสเตอร์ ยูไนเต็ด", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ เข้ามารับตำแหน่งผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ต่อจาก ไมเคิล คาร์ริค โดยนำประสบการณ์คุมทีมในพรีเมียร์ลีกมาปรับใช้", "ปรัชญาการทำทีมของโปเช็ตติโน่เน้นความเข้มข้นในการเพรสซิ่งและการเล่นเกมรุกที่รวดเร็ว ซึ่งเป็นเอกลักษณ์ที่เขาใช้มาตั้งแต่สมัยคุม เซาแธมป์ตัน และ ท็อตแน่ม ฮ็อทสเปอร์", "ความท้าทายสำคัญของกุนซือชาวอาร์เจนไตน์คือการปรับจูนขุมกำลังของปีศาจแดงที่มีอายุเฉลี่ยค่อนข้างสูง ให้สามารถเล่นตามแท็กติกที่ต้องใช้พลังงานสูงได้", "โปเช็ตติโน่แสดงให้เห็นถึงการปรับตัวในอดีต ทั้งการคุมทีมซูเปอร์สตาร์ที่ ปารีส แซงต์-แชร์กแมง และการปรับระบบกับทีมชาติสหรัฐอเมริกา ซึ่งสะท้อนถึงความยืดหยุ่นในการทำทีม"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ ได้รับการแต่งตั้งให้เป็นผู้จัดการทีมคนใหม่ของ แมนเชสเตอร์ ยูไนเต็ด หลังจาก ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่ง ดังนั้นแฟนบอลควรคาดหวังอะไรได้บ้างจากผลงานในสนาม?", "กุนซือวัย 54 ปี ผู้ซึ่งเพิ่งพาทีมชาติสหรัฐอเมริกาผ่านเข้าสู่รอบ 16 ทีมสุดท้ายในฟุตบอลโลกครั้งล่าสุด กำลังหวนคืนสู่เกาะอังกฤษอีกครั้ง หลังจากเคยผ่านประสบการณ์คุมทีม เซาแธมป์ตัน, ท็อตแน่ม ฮ็อทสเปอร์ และ เชลซี มาก่อนหน้านี้", "เราจะย้อนกลับไปดูตั้งแต่ช่วงที่เขาคุม เซาแธมป์ตัน จนถึงช่วงเวลา 18 เดือนในฐานะเฮดโค้ชของ ปารีส แซงต์-แชร์กแมง เพื่อวิเคราะห์ว่าเขาจัดระเบียบทีมอย่างไรในแต่ละบทบาท และคาดการณ์ว่าเขาอาจจะทำอย่างไรกับ แมนเชสเตอร์ ยูไนเต็ด", "ระบบ 4-2-3-1 กลายเป็นแผนการเล่นที่โปเช็ตติโน่ชื่นชอบอย่างรวดเร็วสมัยคุม เซาแธมป์ตัน โดยเขายังคงโครงสร้างทีมที่คล้ายกับ ไนเจล แอดกินส์ ผู้จัดการทีมคนก่อน แต่เปลี่ยนสไตล์การเล่นไปอย่างสิ้นเชิงด้วยการเน้นการเพรสซิ่งสูงในแดนบน", "ในแง่ของตัวผู้เล่น รายชื่อ 11 ตัวจริงของเขามีความคงเส้นคงวาอย่างมาก โดยมีเพียง เดยัน ลอฟเรน และ วิคเตอร์ วานยาม่า เท่านั้นที่เป็นการเซ็นสัญญาหลักที่ก้าวขึ้นมาเป็นตัวจริงในช่วงเวลาปีครึ่งที่เขาคุมทีม", "ในทางกลับกัน โปเช็ตติโน่แสดงให้เห็นถึงความสามารถในการยกระดับผู้เล่นที่มีอยู่เดิม โดยมี อดัม ลัลลาน่า, มอร์แกน ชไนเดอร์ลิน, เจย์ โรดริเกซ, ลุค ชอว์ และ นาธาเนียล ไคลน์ เป็นกลุ่มนักเตะที่ฉายแววโดดเด่นขึ้นมาหลังจากปรับตัวเข้ากับความต้องการของเขาได้", "อดัม ลัลลาน่า ได้สะท้อนถึงช่วงเวลานั้นในภายหลังว่า 'ตอนที่ผมเริ่มเล่นให้เซาแธมป์ตัน ผมเล่นทางฝั่งซ้ายและเป็นหมายเลข 10 ซึ่งเกือบจะเป็นผู้เล่นประเภทที่ทีมต้องคอยประคบประหงม แต่เมื่อโปเช็ตติโน่เข้ามา มันชัดเจนตั้งแต่วันแรกว่าในทีมของเขาจะไม่มีที่ว่างสำหรับผู้เล่นประเภทนั้น'", "โปเช็ตติโน่นำแนวทางเดียวกันนี้มาใช้ที่ สเปอร์ส ซึ่งทีมของเขากลายเป็นที่จดจำจากความดุดันและความเข้มข้นในการเล่นเกมรับ รวมถึงการจ่ายบอลแนวตั้งที่รวดเร็วเพื่อสร้างเกมรุกในสไตล์ของ มาร์เซโล่ บิเอลซ่า โดยโปเช็ตติโน่ถือว่าบิเอลซ่าเป็นอิทธิพลด้านการโค้ชที่ยิ่งใหญ่ที่สุดของเขาเคียงคู่กับ เซอร์ อเล็กซ์ เฟอร์กูสัน", "ที่สเปอร์ส เขายังคงใช้ระบบ 4-2-3-1 เป็นหลัก และช่วยให้ผู้เล่นดาวรุ่งหลายคนแจ้งเกิดได้สำเร็จ รวมถึง เดเล่ อัลลี่ และ แฮร์รี่ เคน ที่ประสานงานกันได้อย่างยอดเยี่ยมในฐานะหมายเลข 10 และหมายเลข 9 ตามลำดับ", "โปเช็ตติโน่ใช้แบ็กทั้งสองข้างในการเติมเกมรุก โดยให้กองกลางตัวรับอย่าง เอริค ดายเออร์ ถอยลงมาเป็นเซ็นเตอร์แบ็กคนที่สามในขณะครองบอล ซึ่งเปิดโอกาสให้ อัลลี่, คริสเตียน อีริคเซ่น และ ซน ฮึง-มิน ได้เล่นใกล้ชิดกับ เคน มากขึ้น", "เขาใช้ผู้เล่นดาวรุ่งเหล่านั้นเปลี่ยนโฉมหน้าสเปอร์สจนเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปี้ยนส์ ลีก และจบอันดับท็อป 3 ของพรีเมียร์ลีกได้ถึง 3 ฤดูกาลติดต่อกัน แต่เมื่อเวลาผ่านไป อายุเฉลี่ยของทีมก็มากขึ้น ความสดลดลง และการเสริมทัพที่ไม่เพียงพอทำให้สเปอร์สไม่สามารถรักษาความเข้มข้นไว้ได้ การจากไปของเขาในปี 2019 จึงเป็นการสิ้นสุดวงจรหนึ่งของทีม", "โปเช็ตติโน่กลับมาคุมทีมอีกครั้งหลังจากออกจากสเปอร์สได้หนึ่งปี โดยรับงานที่ ปารีส แซงต์-แชร์กแมง ซึ่งเป็นเรื่องราวของการปรับปรัชญาให้เข้ากับลักษณะเฉพาะของผู้เล่นในทีม", "เพื่อรองรับ ลิโอเนล เมสซี่, คีลิยัน เอ็มบัปเป้ และ เนย์มาร์ โปเช็ตติโน่ต้องละทิ้งแท็กติกการเพรสซิ่งสูงที่เคยเป็นเอกลักษณ์ เพราะรู้ดีว่าสามประสานแดนหน้าซูเปอร์สตาร์ของเขาไม่เหมาะกับแนวทางการเล่นที่ต้องใช้พลังงานสูงเช่นนั้น", "ระบบ 4-3-3 เป็นแผนที่เขาใช้บ่อยที่สุด โดยมีแบ็กจอมบุกอย่าง อาชราฟ ฮาคิมี่ และ นูโน่ เมนเดส แต่สถานการณ์บังคับให้ทีมเปแอสเชของเขาห่างไกลจากสไตล์ที่เขาชื่นชอบอย่างมาก", "ที่ เชลซี เขาเริ่มด้วยระบบ 3-4-2-1 ในช่วงแรกก่อนจะเปลี่ยนมาใช้ 4-2-3-1 ที่เขาโปรดปราน โดย โคล พาลเมอร์ กลายเป็นนักเตะที่แจ้งเกิดภายใต้การคุมทีมของเขาด้วยผลงาน 22 ประตู กับ 11 แอสซิสต์ในพรีเมียร์ลีก", "อย่างไรก็ตาม โดยรวมแล้วโปเช็ตติโน่พบว่ามันยากที่จะถ่ายทอดแนวคิดของเขาให้ลูกทีมเข้าใจ ในเดือนเมษายนของฤดูกาลเดียวที่เขาคุมทีมในถิ่น สแตมฟอร์ด บริดจ์ เขาได้ตั้งคำถามถึงทัศนคติและความมุ่งมั่นของกลุ่มผู้เล่นว่า 'เรายังคงต้องสร้างทัศนคติที่จะช่วยให้เราก้าวไปข้างหน้า คุณต้องเรียกร้องจากตัวเองและเพื่อนร่วมทีมให้มากขึ้น'", "ทีมสเปอร์สของโปเช็ตติโน่เคยติดอันดับต้นๆ ของพรีเมียร์ลีกในเรื่องระยะทางวิ่งรวม แต่เชลซีในฤดูกาล 2023/24 กลับมีสถิติวิ่งรวมน้อยที่สุดเป็นอันดับ 3 ของลีก", "โปเช็ตติโน่ยังคงปรับตัวกับทีมชาติสหรัฐอเมริกา โดยสลับไปมาระหว่างกองหลัง 3 คนและ 4 คน และลดความเป็นระบบที่ตายตัวลง ระบบที่เขาใช้บ่อยที่สุดในฟุตบอลโลกคือ 4-3-3 แต่เปิดโอกาสให้ผู้เล่นเกมรุกได้เคลื่อนที่อย่างอิสระ ซึ่งช่วยให้พวกเขาเอาชนะ ปารากวัย, ออสเตรเลีย และ บอสเนียและเฮอร์เซโกวีนา ได้ ก่อนจะตกรอบด้วยน้ำมือของ เบลเยียม", "เขายังได้รับคำชมในการสร้างความเป็นน้ำหนึ่งใจเดียวกัน โดยการเพรสซิ่งสูงอย่างเป็นระบบกลายเป็นหัวใจสำคัญในฟุตบอลโลก ซึ่งพวกเขามีสถิติการแย่งบอลในแดนบนเฉลี่ย 8 ครั้งต่อเกม ถือเป็นหนึ่งในทีมที่มีสถิติดีที่สุดในรายการ", "ทีมของโปเช็ตติโน่ที่ แมนเชสเตอร์ ยูไนเต็ด น่าจะมีหน้าตาคล้ายกับทีมของ คาร์ริค ในช่วงแรก ซึ่งใช้ระบบ 4-2-3-1 เช่นกัน แต่จะมีการปรับเปลี่ยนบางจุด", "ความเร็วของ เลนี่ โยโร่ อาจจำเป็นในตำแหน่งเซ็นเตอร์แบ็กหากเขาต้องการดันไลน์กองหลังขึ้นสูง ในขณะที่ความสดของ แพทริค ดอร์กู อาจเป็นตัวเลือกที่น่าสนใจกว่า ลุค ชอว์ ในวัย 31 ปี ส่วน คาร์ลอส บาเลบา น่าจะเป็นกุญแจสำคัญในแดนกลางด้วยความแข็งแกร่งทางร่างกาย", "แต่โปเช็ตติโน่อาจต้องยอมรับเหมือนในอดีตว่า เขาไม่สามารถเรียกร้องการเล่นที่เข้มข้นสูงเกินไปได้หากพิจารณาจากขุมกำลังที่มีอยู่", "กุนซือชาวอาร์เจนไตน์มักชื่นชอบผู้เล่นอายุน้อย แต่ยูไนเต็ดมีทีมชุดใหญ่ที่อายุเฉลี่ยมากที่สุดทีมหนึ่งในพรีเมียร์ลีกฤดูกาลนี้ เชีย เลซี่ อาจเป็นตัวเลือกที่เข้ามาเติมพลังงานความสดใหม่ได้หรือไม่?", "บรูโน่ แฟร์นันด์ส จะเป็นหัวใจสำคัญในตำแหน่งหมายเลข 10 อย่างไม่ต้องสงสัย แต่ในวัย 32 ปี เขายังมีพลังงานพอที่จะวิ่งสอดขึ้นไปข้างหน้ากองหน้าในสไตล์ของ อัลลี่ สมัยเล่นกับ เคน ที่สเปอร์สหรือไม่?", "ทีมที่รั้งอันดับ 19 ของลีกในเรื่องระยะทางวิ่งรวมฤดูกาลนี้ จะสามารถบรรลุระดับความเข้มข้นที่โปเช็ตติโน่ต้องการได้หรือไม่?", "ในการครองบอล โปเช็ตติโน่อาจพยายามพัฒนาการโจมตีโดยตรงและการโต้กลับในสไตล์ที่เขาเคยทำกับสเปอร์สและเชลซี แต่เขาต้องเจองานหนักในการปรับปรุงระบบการเพรสซิ่งของทีม", "สิ่งเหล่านี้เพิ่มความน่าสนใจว่าอะไรจะเกิดขึ้นต่อไป โปเช็ตติโน่รู้สึกว่าเขาได้พัฒนาขึ้นแล้ว โดยเขากล่าวเมื่อเร็วๆ นี้ว่า 'ถ้าคุณไม่เปลี่ยนแปลง คุณก็ตาย' ทัศนคตินั้นน่าจะเป็นสิ่งที่จำเป็นที่ยูไนเต็ด ซึ่งเขาได้รับช่วงต่อทีมที่แตกต่างจากทีมที่เขาเคยมีในช่วงเวลาที่ดีที่สุดที่สเปอร์สอย่างสิ้นเชิง"], "link": "https://www.skysports.com/football/news/11095/13611443/mauricio-pochettino-to-man-utd-what-does-a-pochettino-team-look-like-and-how-will-he-set-up-struggling-red-devils", "canonical_link": "https://www.skysports.com/football/news/11095/13611443/mauricio-pochettino-to-man-utd-what-does-a-pochettino-team-look-like-and-how-will-he-set-up-struggling-red-devils", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-premier-league-manchester-united_7405659.jpg?20261113093243", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-mauricio-pochettino_7404952.png?20261112122042", "https://e0.365dm.com/26/11/768x432/skysports-football-manchester-united_7405858.jpg?20261113141616", "https://e0.365dm.com/26/11/768x432/skysports-kane-potchettino_7404051.jpg?20261111150710", "https://e0.365dm.com/26/11/768x432/skysports-pochettino-mauricio_7404951.png?20261112122020", "https://e0.365dm.com/26/11/768x432/skysports-psg-pochettinp-maruicio_7404991.png?20261112130141", "https://e0.365dm.com/26/11/768x432/skysports-mauricio-pochettino_7405857.jpg?20261113141506", "https://e0.365dm.com/26/11/768x432/skysports-chelsea-pochettinop_7405632.png?20261113090015", "https://e0.365dm.com/26/11/768x432/skysports-football-premier-league_7403829.jpg?20261111120638"], "videos": [], "review_score": "", "published_ts": 1794639600, "published_at": "2026-11-14T07:00:00Z", "published_th": "14 พ.ย. 2026 • 14:00 น.", "category_hint": "Football"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นความคล่องตัวสูง คุณจำเป็นต้องวิ่ง คุณต้องสามารถวิ่งและทำความเร็วสูงได้ พื้นฐานที่สุดคือต้องฟิต\"", "\"ผู้จัดการทีมทุกคนต้องการช่วงปรีซีซั่นที่ดีและเวลาในการถ่ายทอดไอเดียรวมถึงสร้างความฟิต แต่นักเตะจะรู้สึกได้ทันทีว่ามันเป็นคนละระดับกัน นี่คือสิ่งที่ต้องทำทุกวันที่สนามซ้อม ต้องเต็มที่ 100% นั่นคือสิ่งที่เขาขอและต้องการ มันจะเป็นความแตกต่างครั้งใหญ่สำหรับนักเตะและพวกเขาจะเห็นผลลัพธ์ทันที\"", "\"ในเกมแชมเปียนส์ลีก รอบรองชนะเลิศ เราตามหลัง 3-0 (ในเกมพบกับ อาแจ็กซ์) เขาไม่ได้พูดเรื่องแท็กติกในช่วงพักครึ่งเลย เขาแค่บอกว่า 'พวกคุณต้องใช้ร่างกายเข้าสู้ ต้องสู้ คุณต้องการแค่ประตูเดียวเพื่อกลับมาสู่เกม จงเชื่อว่าทุกอย่างเป็นไปได้' นั่นเป็นช่วงเวลาที่สำคัญมาก เพราะตอนนั้นเราสู้ อาแจ็กซ์ ไม่ได้เลย แต่เราเปลี่ยนทุกอย่างด้วยความเข้มข้นและการเข้าปะทะ ผมจำได้ว่ามีการวางบอลยาวให้ เฟร์นานโด ยอเรนเต และเราก็แค่สู้และถามกันว่า 'พวกคุณต้องการมันมากแค่ไหน?' ทุกอย่างเปลี่ยนไปตั้งแต่นาทีนั้น\""], "link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8125/live/1aaff900-dfb9-11f1-b154-657b8bcda5ea.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/1da8/live/872e4dc0-ddd4-11f1-9053-236ccb99630c.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794610397, "published_at": "2026-11-13T22:53:17Z", "published_th": "14 พ.ย. 2026 • 05:53 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776975, "guid": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "original_title": "Tearful Pochettino on 'difficult' decision to leave USA for Man Utd", "thai_title": "โปเช็ตติโน่หลั่งน้ำตา ยอมรับการตัดสินใจอำลาทีมชาติสหรัฐฯ เพื่อคุมทัพแมนเชสเตอร์ ยูไนเต็ด เป็นเรื่องยากที่สุดในอาชีพ", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ ตัดสินใจอำลาตำแหน่งกุนซือทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานคุมทีมแมนเชสเตอร์ ยูไนเต็ด โดยเซ็นสัญญาเป็นเวลา 2 ปีครึ่ง", "ปีศาจแดงยอมจ่ายค่าฉีกสัญญาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่และทีมงานสตาฟฟ์โค้ชมาจากสหรัฐฯ", "โปเช็ตติโน่ยอมรับว่านี่เป็นการตัดสินใจที่ยากลำบากที่สุดครั้งหนึ่งในอาชีพ แต่โอกาสในการคุมทีมระดับโอลด์แทรฟฟอร์ดนั้นยากที่จะปฏิเสธ", "กุนซือชาวอาร์เจนไตน์จะประเดิมคุมทีมแมนเชสเตอร์ ยูไนเต็ด นัดแรกในเกมเยือนลิเวอร์พูล วันที่ 22 พฤศจิกายนนี้", "สถานการณ์ของแมนเชสเตอร์ ยูไนเต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะลุช่องโดยตรง ไม่ได้แตกต่างจากสิ่งที่ คาร์ริค พยายามจะทำ และแม้ว่านั่นอาจทำให้แฟนบอล ยูไนเต็ด กังวล แต่ความคล้ายคลึงในหลักการจะส่งผลดีต่อตัวผู้เล่น", "\"ปรัชญาของผมคือการมอบสไตล์ที่อิสระภายใต้การจัดระเบียบที่ดี\" คือคำพูดของ โปเช็ตติโน ในปี 2014 แม้ปรัชญาจะคล้ายกัน แต่ส่วนหลังคือ 'การจัดระเบียบที่ชัดเจน' ซึ่งน่าจะเป็นสิ่งที่ คาร์ริค ยังไม่สามารถมอบให้ผู้เล่นได้อย่างมั่นคง", "สำหรับแฟนบอลทีมใหญ่ ฟุตบอลที่รวดเร็วและเน้นแนวตั้งมักได้รับการยอมรับเมื่อมันมาจากความตั้งใจที่จะเป็นฝ่ายรุกก่อน เช่น ยูไนเต็ด ยุค เฟอร์กูสัน หรือ ลิเวอร์พูล ยุค เจอร์เกน คล็อปป์ แต่ฟุตบอลลักษณะนี้มักถูกมองในแง่ลบหากมันมาจากการยอมสละการครองบอลและเน้นตั้งรับหน้าประตูตัวเองเป็นเวลานาน", "การจ้าง โปเช็ตติโน จะเป็นจุดเริ่มต้นในการเปลี่ยน ยูไนเต็ด ให้กลายเป็นทีมที่มีระเบียบวินัยสูง สามารถกดดันคู่แข่งได้อย่างเข้มข้นและเป็นระบบมากขึ้น"], "link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f043/live/468fa2e0-dddf-11f1-b465-b9821c2582d4.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4aad/live/3387a800-df42-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6ab2/live/cf053980-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/681d/live/dceb6bf0-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c36b/live/e04246d0-de17-11f1-93e1-3b657b665bcf.jpg"], "videos": [], "review_score": "", "published_ts": 1794571788, "published_at": "2026-11-13T12:09:48Z", "published_th": "13 พ.ย. 2026 • 19:09 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776979, "guid": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo", "original_title": "Fernandes rejects second Man Utd contract offer", "thai_title": "บรูโน่ แฟร์นันด์ส ปฏิเสธข้อเสนอสัญญาฉบับใหม่จาก แมนเชสเตอร์ ยูไนเต็ด เป็นครั้งที่สอง", "tag": "Football", "bullet_points": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สอง", "สัญญาปัจจุบันของดาวเตะวัย 32 ปีจะหมดลงหลังจบฤดูกาลนี้ แต่สโมสรมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028", "แมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการเจรจาสัญญาใหม่ แต่การเจรจายังคงไม่มีความคืบหน้า", "สโมสรหวังว่าการเข้ามาคุมทีมของ เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่ จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป", "ฟอร์มการเล่นของแฟร์นันด์สในฤดูกาลนี้ตกลงไปจากเดิมอย่างเห็นได้ชัด โดยทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด"], "full_paragraphs": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในวันที่ 22 พฤศจิกายนนี้", "ทางสโมสรหวังว่าการเข้ามาของโปเช็ตติโน่จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป ทั้งนี้ แฟร์นันด์สเคยเกือบจะได้ย้ายไปร่วมทีมท็อตแนม ฮ็อตสเปอร์ ของโปเช็ตติโน่ในปี 2019 แต่การย้ายทีมไม่เกิดขึ้น ก่อนที่เขาจะย้ายมาอยู่กับแมนเชสเตอร์ ยูไนเต็ด ในอีก 6 เดือนต่อมา โดยในฤดูกาลนี้ อดีตมิดฟิลด์สปอร์ติ้ง ลิสบอน รายนี้ทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด", "ในทางทฤษฎีแล้ว สถานการณ์ความขัดแย้งเรื่องสัญญาปัจจุบันระหว่างแมนเชสเตอร์ ยูไนเต็ด และบรูโน่ แฟร์นันด์ส ไม่ใช่เรื่องใหญ่โตนัก เพราะเป็นเรื่องปกติที่ข้อเสนอครั้งแรก ครั้งที่สอง หรือแม้แต่ครั้งต่อๆ ไปจะถูกปฏิเสธ ซึ่งเป็นส่วนหนึ่งของกระบวนการเจรจาต่อรอง", "แม้แมนเชสเตอร์ ยูไนเต็ด จะมีออปชั่นในการขยายสัญญาเพิ่มอีกหนึ่งปี แต่ก็มีเหตุผลที่ทั้งสองฝ่ายอาจจะยังไม่ต้องการผูกมัดกันเกินกว่านั้นในขณะนี้ ในฝั่งของแฟร์นันด์ส เขามีความปรารถนาอย่างแรงกล้าที่จะ  "full_paragraphs": ["ปิแอร์ เซจ ยุติบทบาทการเป็นผู้จัดการทีมคริสตัล พาเลซ ลงเป็นที่เรียบร้อยแล้ว หลังจากเข้ามารับงานได้เพียง 5 เดือนและคุมทีมไปทั้งหมด 16 นัด โดยปัจจุบันสโมสรกำลังรั้งตำแหน่งบ๊วยของตารางพรีเมียร์ลีก", "ในขณะนี้ โธมัส แฟรงค์ อดีตกุนซือของเบรนท์ฟอร์ดและท็อตแนม ฮอตสเปอร์ กำลังอยู่ในระหว่างการเจรจาขั้นสูงเพื่อเข้ามารับตำแหน่งผู้จัดการทีมคนใหม่แทนที่เซจ", "ความพ่ายแพ้ต่อลิเวอร์พูล 3-1 เมื่อวันอาทิตย์ที่ผ่านมา ถือเป็นความพ่ายแพ้นัดที่ 4 ติดต่อกันของพาเลซในพรีเมียร์ลีก โดยทัพ 'ดิ อีเกิลส์' เก็บชัยชนะได้เพียง 2 นัดจาก 10 เกมแรก และยังมีสถิติเกมรับที่แย่ที่สุดในลีกจากการเสียไปถึง 24 ประตู นอกจากนี้ในรายการยูโรปา ลีก พวกเขายังรั้งอันดับที่ 21 จากทั้งหมด 36 ทีม โดยชนะเพียงนัดเดียวจาก 4 นัดที่ลงสนาม", "ทางสโมสรได้ออกแถลงการณ์ระบุว่า ทีมงานสตาฟฟ์โค้ชของเซจ 3 ราย ได้แก่ จามาล อาลีอุย, ดาเมียน เดลลา ซานตา และ แซนดี้ กีชาร์ด ได้อำลาทีมไปพร้อมกัน โดยระบุว่า 'สโมสรขอขอบคุณปิแอร์และทีมงานสำหรับความทุ่มเทตลอดช่วงเวลาที่อยู่ในลอนดอนใต้ และขอให้พวกเขาโชคดีในอนาคต ส่วนความคืบหน้าเรื่องการแต่งตั้งผู้จัดการทีมคนใหม่จะมีการแจ้งให้ทราบในลำดับถัดไป'", "ปิแอร์ เซจ ถือเป็นผู้จัดการทีมรายที่สองในพรีเมียร์ลีกที่ถูกปลดในฤดูกาลนี้ ต่อจาก ไมเคิล คาร์ริค ที่ถูกแมนเชสเตอร์ ยูไนเต็ด ปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา กุนซือชาวฝรั่งเศสวัย 47 ปีรายนี้ เข้ามารับงานด้วยสัญญา 3 ปีเมื่อเดือนมิถุนายนที่ผ่านมา หลังจาก โอลิเวอร์ กลาสเนอร์ อำลาทีมไปเมื่อสิ้นสุดฤดูกาลก่อน โดยก่อนหน้านี้เซจเคยพา ล็องส์ จบอันดับที่ 2 ในลีกเอิง และคว้าแชมป์เฟรนช์คัพได้เป็นครั้งแรกในประวัติศาสตร์ 120 ปีของสโมสร", "อย่างไรก็ตาม เซจไม่สามารถสร้างผลงานได้เทียบเท่ากับกลาสเนอร์ ซึ่งปัจจุบันคุมทีม น็อตติงแฮม ฟอเรสต์ โดยกลาสเนอร์เคยพาพาเลซคว้าแชมป์เอฟเอ คัพ และแชมป์ยูโรปา คอนเฟอเรนซ์ ลีก มาครองได้สำเร็จ", "พาเลซไม่ชนะใครในลีกมาตั้งแต่วันที่ 11 ตุลาคม โดยช่วงที่ฟอร์มตกต่ำเริ่มขึ้นจากความพ่ายแพ้ต่อคู่ปรับสำคัญอย่าง ไบรท์ตัน 5-0 ซึ่งหลังจบเกมนั้น เซจกล่าวว่าเขารู้สึก 'ละอายใจ' กับผลการแข่งขัน และยอมรับว่าไม่มั่นใจว่าจะได้รับโอกาสให้คุมทีมต่อไปเพื่อกอบกู้สถานการณ์หรือไม่", "แม้จะมีกระแสความเห็นใจจากคนภายในสโมสรบางส่วนหลัง 1794927860, "published_at": "2026-11-17T15:04:20Z", "published_th": "17 พ.ย. 2026 • 22:04 น.", "category_hint": "Technology"}, {"id": 1794927648887, "guid": "https://www.theverge.com/?p=1035258", "original_title": "This E Ink photo frame can double as your family’s digital dashboard", "thai_title": "Trmnl เปิดตัวกรอบรูป E Ink จอสีขนาดใหญ่ 31.5 นิ้ว เปลี่ยนบ้านให้เป็น Digital Dashboard สุดล้ำ", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Trmnl เปิดตัว 'The Frame' กรอบรูปดิจิทัลที่ใช้หน้าจอ E Ink Spectra 6 ขนาด 31.5 นิ้ว รองรับการแสดงผลสีได้หลายพันเฉดสี", "ตัวเครื่องทำจากไม้แท้แฮนด์เมด มีให้เลือก 4 ชนิดไม้ ได้แก่ ไวท์โอ๊ค, เชอร์รี่, ซาเปลี และวอลนัท", "โดดเด่นด้วยความเป็น Open-source รองรับปลั๊กอินกว่า 1,400 รายการ เพื่อเปลี่ยนกรอบรูปให้เป็นแดชบอร์ดแสดงข้อมูล เช่น สภาพอากาศ หรือรายการสิ่งที่ต้องทำ", "มาพร้อมเทคโนโลยี Lazarus ซึ่งเป็นเอนจิ้นแปลงสีที่บริษัทเคลมว่าให้การจับคู่สีที่ดีที่สุดในตลาดสำหรับจอ Spectra 6", "เปิดให้พรีออเดอร์แล้วในราคา 1,299 ดอลลาร์สหรัฐ โดยจำกัดการผลิตล็อตแรกเพียง 470 เครื่อง และคาดว่าจะเริ่มจัดส่งได้ในช่วงต้นปี 2027"], "full_paragraphs": ["Trmnl บริษัทที่ขึ้นชื่อเรื่องการผลิตแดชบอร์ด E Ink ที่ปรับแต่งได้สูง ซึ่งสามารถทำหน้าที่ได้ตั้งแต่ปฏิทินบนโต๊ะทำงานไปจนถึงเครื่องติดตามราคาหุ้น ได้เปิดตัวหน้าจอรุ่นใหม่ที่ออกแบบมาเพื่อแสดงผลงานศิลปะและภาพถ่ายโดยเฉพาะ แม้จะไม่ใช่ผลิตภัณฑ์จอสี E Ink รุ่นแรกของบริษัท แต่แทนที่จะจำกัดอยู่เพียงแค่ 4 สีเหมือนรุ่นก่อนหน้า The Frame รุ่นใหม่นี้สามารถแสดงเฉดสีได้หลายพันเฉดด้วยแผงหน้าจอ E Ink Spectra 6 ขนาด 31.5 นิ้ว ซึ่งเป็นเทคโนโลยีเดียวกับที่พบในผลิตภัณฑ์จากแบรนด์ Aura และ Pocketbook", "ขณะนี้ The Frame เปิดให้พรีออเดอร์แล้วในราคา 1,299 ดอลลาร์สหรัฐ โดยตัวเครื่องผลิตจากไม้แท้แฮนด์เมด ซึ่งผู้ซื้อสามารถเลือกประเภทไม้ได้ 4 ชนิด ได้แก่ ไวท์โอ๊ค (white oak), เชอร์รี่ (cherry), ซาเปลี (sapele) และวอลนัท (walnut) สำหรับการผลิตล็อตแรกจะเป็นรุ่นจำกัดจำนวนเพียง 470 เครื่อง ซึ่งในขณะนี้มียอดจองไปแล้วกว่าครึ่งหนึ่ง โดยคาดว่าการจัดส่งหน้าจอส่วนใหญ่จะเกิดขึ้นในช่วงต้นปี 2027 นอกจากนี้ยังมีอุปกรณ์เสริมให้เลือกซื้อเพิ่มเติม เช่น ขาตั้งไม้ที่เข้าชุดกันหากไม่ต้องการติดตั้งบนผนัง และแบตเตอรี่ขนาดใหญ่ 20,000mAh อย่างไรก็ตาม ตัวเครื่องมาตรฐานที่มาพร้อมแบตเตอรี่ 10,000mAh ก็สามารถใช้งานได้นานหลายเดือนต่อการชาร์จหนึ่งครั้ง", "สิ่งที่ทำให้ The Frame แตกต่างจากกรอบรูปศิลปะและโปสเตอร์ E Ink ขนาดใหญ่อื่นๆ ในตลาด คือความเป็น Open-source ที่สามารถทำได้มากกว่าการแสดงภาพนิ่ง ผ่านการใช้งานปลั๊กอินที่คุณสามารถสร้างขึ้นเอง หรือดาวน์โหลดจาก Marketplace ที่ปัจจุบันมีให้เลือกมากกว่า 1,400 รายการ ทำให้ The Frame สามารถเปลี่ยนบทบาทเป็นแดชบอร์ดแสดงข้อมูลสภาพอากาศ รายการสิ่งที่ต้องทำ (to-do lists) หรือข้อมูลใดๆ ก็ตามที่คุณต้องการให้แสดงอยู่บนผนังบ้านของคุณ", "ในกรณีที่คุณต้องการใช้เพื่อแสดงภาพถ่าย Trmnl ได้พัฒนา Lazarus ซึ่งเป็นเอนจิ้นแปลงสี (color conversion engine) ที่บริษัทเชื่อมั่นว่ามอบ “การจับคู่สีที่ดีที่สุดในตลาดสำหรับจอแสดงผล Spectra 6 ทุกรุ่น” และหากคุณไม่เห็นด้วยกับค่าสีที่ตั้งมา เนื่องจาก The Frame เป็นระบบ Open-source คุณจึงสามารถปรับจูนสีให้ตรงกับความต้องการส่วนตัวของคุณได้เช่นกัน", "เช่นเดียวกับผลิตภัณฑ์ E Ink อื่นๆ ของ Trmnl ตัว The Frame สามารถเชื่อมต่ออินเทอร์เน็ตเพื่อแสดงข้อมูลที่คุณต้องการแบบไดนามิกได้ แต่เพื่อยืดอายุการใช้งานแบตเตอรี่ให้ยาวนานยิ่งขึ้น คุณยังสามารถใส่ไฟล์ภาพลงใน microSD card และใช้งาน The Frame ในโหมดออฟไลน์ได้อีกด้วย คุณสามารถปรับแต่งความถี่ในการเปลี่ยนภาพ หรือตั้งตารางเวลาเพื่อให้ผลงานศิลปะชิ้นโปรดของคุณแสดงอยู่บนหน้าจอนานกว่าภาพอื่นๆ แม้ว่า The Frame จะมีราคาสูงกว่าผลิตภัณฑ์จอ E Ink Spectra 6 อื่นๆ ที่มีวางจำหน่ายในปัจจุบัน แต่จุดเด่นสำคัญคือความยืดหยุ่นในการใช้งานที่มากกว่าการเป็นเพียงโปสเตอร์ดิจิทัลทั่วไป"], "link": "https://www.theverge.com/tech/1035258/trmnl-e-ink-spectra-6-frame-dashboard-display-poster-photos", "canonical_link": "https://www.theverge.com/tech/1035258/trmnl-e-ink-spectra-6-frame-dashboard-display-poster-photos", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/frame1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/frame.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794926961, "published_at": "2026-11-17T14:49:21Z", "published_th": "17 พ.ย. 2026 • 21:49 น.", "category_hint": "Technology"}, {"id": 1794926739346, "guid": "https://www.theverge.com/?p=1035257", "original_title": "Get ready for a nationwide emergency alert test at 2:20PM ET today", "thai_title": "เตรียมรับการทดสอบระบบแจ้งเตือนภัยฉุกเฉินทั่วประเทศสหรัฐฯ บ่ายวันนี้", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["FEMA และ FCC กำหนดทดสอบระบบแจ้งเตือนภัยฉุกเฉิน (Emergency Alert System) ทั่วประเทศในเวลา 14:20 น. ตามเวลา ET", "การทดสอบนี้จะส่งผลให้รายการวิทยุและโทรทัศน์ถูกขัดจังหวะเป็นเวลาประมาณ 1 นาที", "ครอบคลุมผู้ให้บริการทั้งระบบเคเบิล ดาวเทียม และวิทยุโทรทัศน์ แต่ไม่รวมถึงการแจ้งเตือนผ่านโทรศัพท์มือถือ", "หากเกิดเหตุฉุกเฉินจริงในวันนี้ การทดสอบจะถูกเลื่อนออกไปเป็นวันที่ 3 ธันวาคมแทน"], "full_paragraphs": ["เตรียมตัวให้พร้อม รายการวิทยุและโทรทัศน์จะถูกขัดจังหวะชั่วคราวในช่วงบ่ายวันนี้", "การออกอากาศทางวิทยุและโทรทัศน์จะถูกขัดจังหวะเป็นเวลาประมาณหนึ่งนาที ในเวลา 14:20 น. ตามเวลา ET ของวันอังคารนี้ ในขณะที่หน่วยงานจัดการภาวะฉุกเฉินกลาง (FEMA) และคณะกรรมการกลางกำกับดูแลกิจการสื่อสาร (FCC) ดำเนินการทดสอบระบบแจ้งเตือนภัยฉุกเฉินของประเทศ ซึ่งแตกต่างจากเหตุการณ์ระบบสื่อสารขัดข้องที่เกิดขึ้นเมื่อเร็วๆ นี้ นี่คือการขัดจังหวะที่วางแผนไว้ล่วงหน้าซึ่ง FEMA มีข้อกำหนดให้ต้องดำเนินการทุกๆ สามปี โดย FEMA ระบุว่าการทดสอบในวันนี้จะครอบคลุมถึงผู้ให้บริการวิทยุและโทรทัศน์ ระบบเคเบิล ผู้ให้บริการวิทยุและโทรทัศน์ผ่านดาวเทียม รวมถึงผู้ให้บริการวิดีโอผ่านสายสัญญาณ อย่างไรก็ตาม การทดสอบนี้จะไม่รวมถึงโทรศัพท์มือถือ", "คุณจะได้ยินเสียงสัญญาณเตือนความถี่สูงและข้อความทดสอบดังต่อไปนี้: “นี่คือการทดสอบระบบแจ้งเตือนภัยฉุกเฉินทั่วประเทศ ออกโดยหน่วยงานจัดการภาวะฉุกเฉินกลาง นี่เป็นเพียงการทดสอบเท่านั้น ประชาชนไม่จำเป็นต้องดำเนินการใดๆ”", "รายการวิทยุและโทรทัศน์จะดำเนินต่อไปตามปกติหลังจากเสร็จสิ้นการทดสอบ ทั้งนี้ FEMA ดำเนินการทดสอบในลักษณะนี้ในช่วงเวลาที่ไม่มีเหตุฉุกเฉินจริง เพื่อใ Lifestyle-Press-Image.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/03/Amazon-Fire-TV-Stick-4K-Press-Image-2023.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/EA-Sports-FC-27.png?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/09/268738_Apple_Watch_Series_12_AKrales_0280.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/24374429/236487_Sony_DualSense_Edge_AKrales_0032.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794925507, "published_at": "2026-11-17T14:25:07Z", "published_th": "17 พ.ย. 2026 • 21:25 น.", "category_hint": "Technology"}, {"id": 1794924943274, "guid": "https://www.theverge.com/?p=1035159", "original_title": "Windows 11 actually runs better on 8GB of RAM now", "thai_title": "Windows 11 ทำงานได้ลื่นไหลขึ้นบน RAM 8GB แล้ว หลัง Microsoft ปรับจูนระบบครั้งใหญ่", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Microsoft อัปเดต Windows 11 เพื่อเพิ่มประสิทธิภาพการจัดการหน่วยความจำ ช่วยให้เครื่องที่มี RAM 8GB ทำงานได้ดีขึ้นอย่างเห็นได้ชัด", "การปรับปรุงครั้งนี้ช่วยลดปัญหา Hard Faults หรือการที่ระบบต้องดึงข้อมูลจาก SSD มาใช้แทน RAM ซึ่งเป็นสาเหตุหลักของอาการเครื่องหน่วง", "ผลการทดสอบจริงพบว่าการเปิด Chrome กว่า 30 แท็บพร้อมสตรีมวิดีโอ 4K ทำได้ลื่นไหลขึ้น และแอปพลิเคชันต่างๆ มีการรีเฟรชตัวเองน้อยลง", "แม้ประสิทธิภาพจะดีขึ้น แต่ผู้เชี่ยวชาญยังคงแนะนำว่าการเลือกซื้อโน้ตบุ๊กที่มี RAM 16GB ยังคงเป็นตัวเลือกที่ดีกว่าสำหรับการใช้งานในระยะยาว"], "full_paragraphs": ["เมื่อช่วงต้นปีที่ผ่านมา RAM ขนาด 16GB เคยเป็นมาตรฐานทั่วไปสำหรับโน้ตบุ๊ก Windows ในราคาต่ำกว่า 800 ดอลลาร์ ซึ่งช่วยชดเชยความรู้สึกที่ว่า Windows 11 เริ่มกินทรัพยากรเครื่องมากขึ้นเรื่อยๆ แต่ด้วยราคา RAM ที่พุ่งสูงขึ้นในปีนี้ ทำให้ RAM 8GB กลับมาเป็นสเปกเริ่มต้นมาตรฐานอีกครั้ง แม้ว่า MacBook รุ่นใหม่จะจัดการกับ RAM ขนาดนี้ได้ดี แต่โน้ตบุ๊ก Windows รวมถึง Surface Laptop ขนาด 13 นิ้วของ Microsoft เองกลับประสบปัญหาอย่างหนัก อย่างไรก็ตาม ดูเหมือนว่าความพยายามของ Microsoft ในการทำให้ Windows ทำงานได้เร็วและเสถียรขึ้นก่อนที่จะเกิดวิกฤตราคา RAM จะเริ่มเห็นผลลัพธ์ที่ชัดเจนแล้วในขณะนี้", "เมื่อต้นเดือนที่ผ่านมา Pavan Davuluri รองประธานบริหารฝ่าย Windows และอุปกรณ์ของ Microsoft ได้เผยรายละเอียดผ่านบล็อกโพสต์เกี่ยวกับความสำเร็จในการปรับปรุง Windows 11 เพื่อแก้ปัญหาข้อจำกัดของพีซีที่มี RAM 8GB โดย Davuluri ระบุว่า 'Windows มีการตอบสนองเร็วขึ้นสูงสุด 20% และการทำงานแบบ Multitasking เร็วขึ้นสูงสุด 40% ในการทดสอบในห้องปฏิบัติการของเรา'", "การเปลี่ยนแปลงที่สำคัญที่สุดคือการจัดการหน่วยความจำ (Memory Management) เมื่อหน่วยความจำไม่เพียงพอต่อการจัดการข้อมูลที่ใช้งานอยู่ ระบบจำเป็นต้องย้ายข้อมูลบางส่วน (หรือที่เรียกว่า Paged out) ไปยังพื้นที่จัดเก็บข้อมูล ซึ่ง SSD โดยเฉพาะในโน้ตบุ๊กรุ่นประหยัดนั้นมีความเร็วต่ำกว่า RAM มาก", "เมื่อ Windows จำเป็นต้องเข้าถึงข้อมูลที่ถูกย้ายจาก RAM ไปยัง SSD จะเกิดสิ่งที่เรียกว่า Hard Fault (หรือ Page Fault) หากเหตุการณ์นี้เกิดขึ้นบ่อยครั้ง เช่น ในโน้ตบุ๊กที่มี RAM เพียง 8GB จะนำไปสู่ปัญหาเครื่องหน่วง เช่น แท็บเบราว์เซอร์ที่ต้องโหลดใหม่ก่อนที่คุณจะเข้าถึงได้อีกครั้ง Davuluri กล่าวว่า 'ขณะนี้ Windows สามารถเก็บข้อมูลที่ใช้งานอยู่ได้มากขึ้นสูงสุด 2GB ในหน่วยความจำ แทนที่จะย้ายไปยังพื้นที่จัดเก็บข้อมูลที่ช้ากว่า ดังนั้นแอปหรือแท็บที่คุณเปิดทิ้งไว้จึงมีโอกาสน้อยลงที่จะต้องโหลดใหม่เมื่อคุณกลับมาใช้งาน'", "เพื่อพิสูจน์เรื่องนี้ ผมได้นำ Surface Laptop ขนาด 13 นิ้วที่มี RAM 8GB เครื่องเดิมที่เคยรีวิวไปเมื่อเดือนกรกฎาคมกลับมาทดสอบอีกครั้ง ซึ่งในตอนนั้นผมเคยสรุปว่า 8GB นั้นไม่เพียงพอสำหรับ Windows โดยเครื่องนี้ถือเป็นหนึ่งในตัวอย่างที่เลวร้ายที่สุดของผลกระทบจากวิกฤต RAM ในปัจจุบัน ด้วย RAM ที่น้อยกว่ารุ่นเริ่มต้นของปีที่แล้วถึงครึ่งหนึ่ง ทำให้มันแทบจะรับมือกับภาระงานปกติของผมไม่ไหว และนี่คือฮาร์ดแวร์ของ Microsoft เอง", "ก่อนที่จะอัปเดต Surface เป็น Windows 11 เวอร์ชันล่าสุด ผมได้ทดลองใช้งานเครื่องนี้กับ Windows เวอร์ชันเดิม (25H2, build 26200.8875) ซึ่งผลลัพธ์นั้นย่ำแย่มาก การเปิดแท็บ Chrome ประมาณ 20 แท็บ พร้อมสตรีมวิดีโอ YouTube 4K และใช้งาน Slack กับ Signal ทำให้ทุกอย่างตั้งแต่การคลิกแท็บไปจนถึงการปัดนิ้วผ่าน Trackpad รู้สึกหน่วงไปหมด แท็บ Chrome และแอปต่างๆ จะรีเฟรชตัวเองทันทีหลังจากทิ้งไว้เบื้องหลังเพียงครู่เดียว เมื่อคุณทำงานหลายอย่างพร้อมกันและสลับไปมาระหว่างหลายแท็บ เช่น ในระหว่างการค้นหาข้อมูล การรีเฟรชเหล่านี้ก็น่าหงุดหงิดอย่างยิ่ง แถมพัดลมยังทำงานเสียงดังตลอดเวลา การเปิด Resource Monitor ทิ้งไว้แสดงให้เห็นว่ามี Hard Fault เกิดขึ้นตั้งแต่ 700 ครั้งต่อวินาที ไปจนถึง 29,000 ครั้งต่อวินาที ซึ่งเป็นช่วงที่ Windows แทบจะหยุดทำงานไปเลย การเห็นตัวเลขนี้พุ่งทะลุกราฟแสดงให้เห็นว่า Windows 11 จัดการหน่วยความจำบน RAM 8GB ได้แย่เพียงใดก่อนการอัปเดต", "หลังจากอัปเดต Surface Laptop เป็น Windows 11 เวอร์ชัน 26H2, build 26300.9974 (การปรับปรุงหน่วยความจำเริ่มมีผลตั้งแต่ build 26300.9818 เป็นต้นไป) สถานการณ์ก็ดีขึ้นมาก ผมเปิดแท็บ Chrome มากกว่า 30 แท็บ พร้อมสตรีมวิดีโอ YouTube 4K เดิม และรันแอปแชทตัวเดิม Windows มีอาการช้าลงบ้าง แต่ไม่ใกล้เคียงกับความย่ำแย่ก่อนหน้านี้ ผมรู้สึกได้ว่า Task View ตอบสนองช้าลงเล็กน้อยและมีอาการกระตุกบ้างในบางครั้ง แต่นั่นเป็นสิ่งที่คาดหวังได้เมื่อใช้งานระบบอย่างหนัก แท็บ Chrome ต้องการการรีเฟรชที่น้อยลง พัดลมก็ใช้เวลานานขึ้นกว่าจะเริ่มทำงาน และทำงานเงียบลงรวมถึงใช้เวลาสั้นลงเมื่อพัดลมหมุน", "เมื่อตรวจสอบ Resource Monitor อีกครั้ง พบว่า Hard Fault ในการใช้งานปกติลดลงเหลือต่ำกว่า 300 ครั้งต่อวินาที โดยมีการกระโดดขึ้นไปที่ประมาณ 1,000 ครั้งเป็นครั้งคราว ประสิทธิภาพดียิ่งขึ้นไปอีกเมื่อผมเปลี่ยนจาก Chrome มาใช้ Microsoft Edge ซึ่ง Edge ให้ความรู้สึกตอบสนองได้ดีกว่าภายใต้ภาระงานหนัก และมี Hard Fault น้อยกว่าเมื่อเปิด 30 แท็บ พร้อมวิดีโอ YouTube 4K และการประชุมผ่าน Google Meet", "ผมรู้สึกยินดีที่เห็นว่า Surface Laptop รุ่น RAM 8GB มีประสิทธิภาพดีขึ้น และรู้สึกโล่งใจที่ Windows 11 เริ่มดูมีความเป็นไปได้มากขึ้นบน RAM 8GB (แม้ว่าจะเป็นเรื่องน่าเสียดายที่ Surface Laptop รุ่น 8GB มีราคาแพงกว่ารุ่น 16GB ของปีที่แล้วก็ตาม) แต่ถ้าถามว่าผมต้องการ RAM 8GB ในโน้ตบุ๊กที่ผมจะซื้อเองหรือไม่? คำตอบคือไม่", "อย่างที่ผมเคยกล่าวไว้ตอนรีวิว Dell XPS 13 รุ่นล่าสุด ผมชื่นชมที่ 8GB สามารถใช้งานได้จริง และน่าจะเพียงพอสำหรับความต้องการพื้นฐานในปัจจุบัน แต่ผมยังคงแนะนำให้เลือก 16GB หากคุณทำได้ เพราะพื้นที่หน่วยความจำที่เหลือเฟือจะช่วยให้เครื่องทำงานได้รวดเร็วในระยะยาว โดยเฉพาะหลังจากที่คุณเริ่มใช้งานเครื่องไปนานๆ จนมีไฟล์ แอป หรือเกมจำนวนมาก และแม้ว่า Surface Laptop รุ่น 8GB จะดีขึ้นมาก แต่ผมก็ยังสามารถทำให้ Chrome ค้างได้ด้วยการเปิดแท็บไม่ถึง 36 แท็บ Microsoft ทำผลงานได้ดีขึ้นกับโน้ตบุ๊กรุ่นเริ่มต้น แต่ก็ยังไม่ใช่ปาฏิหาริย์", "วิกฤต RAM ที่เราเผชิญอยู่ทำให้การใช้ชีวิตด้วยหน่วยความจำที่น้อยลงกลายเป็นความจริงที่โหดร้าย แน่นอนว่า Microsoft มีส่วนต้องรับผิดชอบในเรื่องนี้ และบริษัทก็ไม่ได้ช่วยให้สถานการณ์ดีขึ้นด้วยการยัดเยียดฟีเจอร์ต่างๆ เข้ามาใน Windows 11 ในยุค Copilot / AI ในขณะที่ OS อื่นๆ เช่น Linux, macOS และ ChromeOS สามารถจัดการกับทรัพยากรที่น้อยกว่าได้ดีกว่า อย่างไรก็ตาม ผมดีใจที่ได้เห็น Microsoft พยายามแก้ไขสถานการณ์ในจุดนี้แม้เพียงเล็กน้อยก็ตาม"], "link": "https://www.theverge.com/tech/1035159/windows-11-8gb-ram-updates-performance-improvements-surface-laptop-testing", "canonical_link": "https://www.theverge.com/tech/1035159/windows-11-8gb-ram-updates-performance-improvements-surface-laptop-testing", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/268655_Microsoft_Surface_Laptop_13-inch_8GB_2026_review_ADiBenedetto_0018.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/268655_Microsoft_Surface_Laptop_13-inch_8GB_2026_review_ADiBenedetto_0015.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Screenshot-2026-11-12-115533.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com
