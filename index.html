 โดยมีการปรับเปลี่ยนตำแหน่งอนาล็อกสติกให้อยู่ในจุดที่ใช้งานได้สะดวกยิ่งขึ้น แต่สำหรับผลิตภัณฑ์ใหม่อย่าง GC Bluetooth Gamepad ทาง 8BitDo ได้ยกระดับความใส่ใจในการรักษาดีไซน์ดั้งเดิมของจอยเกม Nintendo GameCube อันยอดเยี่ยมเอาไว้ได้อย่างครบถ้วน ไม่ว่าจะเป็นการจัดวางปุ่มกดที่เป็นเอกลักษณ์ การออกแบบก้านอนาล็อก และปุ่ม Shoulder buttons ที่คุ้นเคย", "GC Bluetooth Gamepad จาก 8BitDo เปิดให้สั่งซื้อล่วงหน้าแล้วตั้งแต่วันนี้ในราคา 49.99 ดอลลาร์สหรัฐ โดยมีให้เลือกสองสีคือสีส้มและสีม่วง และคาดว่าจะเริ่มจัดส่งสินค้าถึงมือผู้ใช้งานในวันที่ 10 ธันวาคมนี้ ซึ่งถือว่ามีราคาที่ถูกกว่าจอยเกมไร้สายรุ่นรีเมคของ Nintendo ที่วางจำหน่ายในราคา 69.99 ดอลลาร์สหรัฐอย่างเห็นได้ชัด แม้ว่าเวอร์ชันของ 8BitDo จะไม่ได้มีรูปทรงและสรีรศาสตร์ที่เหมือนกับต้นฉบับแบบ 100% ก็ตาม", "สำหรับผู้ที่ให้ความสำคัญกับความรู้สึกดั้งเดิมและยังมีอุปกรณ์เสริมของ GameCube รุ่นออริจินัลเก็บไว้ ทาง 8BitDo ยังคงมีทางเลือกเป็นชุดอัปเกรด (Upgrade kit) ในราคา 25.98 ดอลลาร์สหรัฐ ซึ่งเป็นวิธีที่ประหยัดกว่าในการทำให้จอยเกมรุ่นเก่าสามารถใช้งานร่วมกับคอนโซลและอุปกรณ์สมัยใหม่ได้", "จุดเด่นที่น่าสนใจของจอยเกมรุ่นนี้คือการคงเอกลักษณ์ 'Octagonal gates' หรือกรอบแปดเหลี่ยมรอบฐานของอนาล็อกสติกทั้งสองข้างเอาไว้ ซึ่งช่วยให้การควบคุมทิศทางมีความแม่นยำสูง โดยเฉพาะอย่างยิ่งในการเล่นเกมแนวต่อสู้ (Fighting games) อย่าง Super Smash Bros. Ultimate นอกจากนี้ ในขณะที่ Nintendo ยังคงเลือกที่จะไม่นำเทคโนโลยีอนาล็อกสติกสมัยใหม่มาใช้ แต่ 8BitDo ได้ติดตั้ง TMR thumbsticks ที่ทนทานต่อปัญหาจอยดริฟต์ (Drift-resistant) และ Hall effect linear triggers มาให้ในตัว", "ในด้านการเชื่อมต่อ GC Bluetooth Gamepad สามารถเชื่อมต่อกับ Nintendo Switch ได้ทุกรุ่นผ่านสัญญาณ Bluetooth รวมถึงรองรับการใช้งานกับ PC หรือเครื่องเกมพกพาที่รันบนระบบปฏิบัติการ Windows นอกจากนี้ภายในชุดยังมาพร้อมกับตัวรับสัญญาณไร้สาย 2.4GHz USB สำหรับผู้เล่นที่ต้องการความหน่วง (Latency) ที่ต่ำที่สุด หรือหากต้องการประสิทธิภาพสูงสุดก็สามารถเลือกเชื่อมต่อผ่านสาย USB-C ได้เช่นกัน"], "link": "https://www.theverge.com/tech/1036578/8bitdo-gb-bluetooth-gamepad-wireless-controller-nintendo-gamecube-wavebird", "canonical_link": "https://www.theverge.com/tech/1036578/8bitdo-gb-bluetooth-gamepad-wireless-controller-nintendo-gamecube-wavebird", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/8bitdogc1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/8bitdogc2.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795017600, "published_at": "2026-11-18T16:00:00Z", "published_th": "18 พ.ย. 2026 • 23:00 น.", "category_hint": "Technology"}, {"id": 1795016795484, "guid": "https://www.theverge.com/?p=1036549", "original_title": "Remember the frontier AI pause? Chip companies don’t either", "thai_title": "ลืมเรื่องการชะลอพัฒนา AI ไปได้เลย: บริษัทชิปยังคงโกยรายได้มหาศาลจากความต้องการที่พุ่งสูง", "tag": "Technology", "sub_tag": "AI", "bullet_points": ["แม้จะมีกระแสความกังวลเรื่องการชะลอการฝึกฝนโมเดล AI ระดับแนวหน้า (Frontier AI) แต่ผลประกอบการของ Nvidia และ AMD กลับแสดงให้เห็นว่าความต้องการชิปยังคงเติบโตอย่างแข็งแกร่ง", "Nvidia รายงานรายได้จากศูนย์ข้อมูลพุ่งสูงถึง 110% เมื่อเทียบกับปีก่อน โดยมีแพลตฟอร์ม Vera Rubin เป็นหัวหอกสำคัญในการสร้างรายได้", "ความต้องการชิปไม่ได้ลดลงเพราะการเปลี่ยนผ่านไปสู่การใช้งานจริง (Inference) ซึ่งต้องใช้โครงสร้างพื้นฐานด้านการประมวลผลมหาศาลไม่แพ้การฝึกฝนโมเดล", "การแข่งขันระหว่างผู้ให้บริการ AI ทำให้ราคา Token ลดลงอย่างรวดเร็ว ส่งผลให้การใช้งาน AI ในภาคธุรกิจเพิ่มสูงขึ้น ซึ่งเป็นผลดีต่อผู้ผลิตชิปในระยะยาว", "แม้จะมีแนวโน้มที่บริษัท AI จะหันไปใช้ชิปแบบ Custom เพื่อลดต้นทุน แต่ผู้ผลิตชิปรายใหญ่ยังคงมั่นใจในศักยภาพของระบบประมวลผลของตน"], "full_paragraphs": ["ในช่วงฤดูร้อนที่ผ่านมา OpenAI ได้ตัดสินใจหยุดการฝึกฝนโมเดลระดับแนวหน้า (Frontier training) ที่ใหญ่ที่สุดชั่วคราว หลังจากที่ AI Agents ของบริษัทเกิดอุบัติเหตุไปแฮ็ก Hugging Face โดยบังเอิญ และมีหลักฐานเบื้องต้นบ่งชี้ว่าโมเดลรุ่นถัดไปอาจสามารถค้นหาและใช้ประโยชน์จากช่องโหว่ด้านความปลอดภัยได้ด้วยตัวเอง ต่อมาในเดือนกันยายน Dario Amodei ซีอีโอของ Anthropic ได้ออกมาเรียกร้องให้มีการชะลอความก้าวหน้าของโมเดล AI ที่ทรงพลังที่สุด โดยเตือนว่าโมเดลเหล่านี้อาจถูกนำไปใช้ในการโจมตีทางไซเบอร์ หรืออาจกลายเป็นสิ่งที่ผู้สร้างเองก็ไม่สามารถควบคุมได้", "เหตุการณ์ดังกล่าวถือเป็นช่วงเวลาที่น่าประหลาดใจสำหรับยุคทองของ AI เมื่อผู้ที่สร้างโมเดลที่ทรงพลังที่สุดกลับออกมาเตือนถึงขีดความสามารถของสิ่งที่ตนสร้างขึ้น ทำให้นักลงทุนเริ่มกังวลว่าความต้องการชิปจะได้รับผลกระทบอย่างไรหากห้องปฏิบัติการ AI เหล่านี้ลดความเร็วในการพัฒนาโมเดลใหม่ลง ซึ่งส่งผลให้หุ้นกลุ่มชิปในสหรัฐฯ เผชิญกับแรงเทขายอย่างหนัก", "อย่างไรก็ตาม แม้จะเกิดกระแสวิพากษ์วิจารณ์อย่างหนัก แต่ดูเหมือนว่าการชะลอตัวดังกล่าวจะมีอายุสั้นมาก OpenAI ประกาศหยุดการฝึกฝนเพียงสองสัปดาห์และกลับมาดำเนินการต่อในอีก 10 วันถัดมาในช่วงปลายเดือนสิงหาคม แม้จะยังคง 'ระงับการฝึกฝนเชิงทดลองขนาดเล็กบางส่วนไว้ชั่วคราว' ก็ตาม ในขณะที่ Anthropic ได้เปิดตัวโมเดลระดับแนวหน้ารุ่นอัปเกรดอย่าง Fable และ Mythos ในเดือนพฤศจิกายน โดยเน้นย้ำถึงความสามารถที่พัฒนาขึ้นทั้งในด้านการเขียนโค้ด การใช้เหตุผล และการมองเห็น", "ในขณะเดียวกัน บริษัทที่จำหน่ายชิปซึ่งเป็นขุมพลังเบื้องหลังความก้าวหน้าเหล่านี้กลับมีผลประกอบการที่ดีกว่าที่เคยเป็นมา โดยเมื่อวันอังคารที่ผ่านมา Nvidia ได้รายงานผลประกอบการไตรมาสที่น่าประทับใจ ด้วยรายได้จากศูนย์ข้อมูลที่เพิ่มขึ้นถึง 110% เมื่อเทียบกับปีก่อน คิดเป็นมูลค่า 1.076 แสนล้านดอลลาร์สหรัฐ ในช่วงสามเดือนสิ้นสุดวันที่ 25 ตุลาคม บริษัทได้เริ่มจัดส่งระบบประมวลผล AI ที่ล้ำสมัยที่สุดอย่าง Vera Rubin NVL72 โดยระบุว่าเป็น 'ผลิตภัณฑ์ที่ทำยอดขายพุ่งทะยานเร็วที่สุดในประวัติศาสตร์ของบริษัท' ซึ่งแพลตฟอร์ม Rubin สร้างรายได้เกือบ 2 หมื่นล้านดอลลาร์สหรัฐในการจัดส่งไตรมาสแรกเพียงไตรมาสเดียว โดยปัจจุบันแร็คเหล่านี้กำลังถูกใช้งานอยู่ที่ CoreWeave, Google, Microsoft และ Oracle ส่วน Meta ก็มีแผนที่จะขยายการใช้งาน Vera Rubin เพื่อฝึกฝนและรันโมเดล AI และ Agents ของตนเอง", "Nvidia ยังได้กล่าวถึง Anthropic และ OpenAI ในรายงานผลประกอบการด้วย โดยระบุว่า Anthropic ได้ขยายการเข้าถึงขีดความสามารถของ Vera Rubin ผ่านผู้ให้บริการคลาวด์และยังคงร่วมมือกับ Nvidia ในการออกแบบชิปในอนาคตที่ปรับแต่งมาเพื่อภาระงานของตนโดยเฉพาะ ส่วน OpenAI ก็เป็นหนึ่งในบริษัทที่นำ Vera CPU รุ่นใหม่ของ Nvidia ไปใช้งาน", "Colette Kress ซีอีโอชั่วคราวของ Nvidia กล่าวในระหว่างการประชุมผลประกอบการว่า 'โมเดลที่เป็นกรรมสิทธิ์ของ OpenAI และ Anthropic ยังคงเดินหน้าพัฒนาขีดความสามารถระดับแนวหน้าต่อไป' โดยเธอกล่าวว่าบริษัทคาดการณ์ว่าห้องปฏิบัติการ AI ระดับแนวหน้าจะมีสัดส่วนรายได้ประมาณ 15% ของรายได้จากศูนย์ข้อมูลในปีงบประมาณนี้ นอกจากนี้ Nvidia ยังได้ปรับเพิ่มคาดการณ์การเติบโตของรายได้สำหรับปีงบประมาณหน้าจาก 70% เป็น 75%", "ในฝั่งของผู้ผลิตชิปอย่าง AMD ก็ได้รายงานผลประกอบการไตรมาสที่สูงที่สุดเท่าที่เคยมีมาเมื่อต้นเดือนนี้ โดยมีรายได้เพิ่มขึ้น 45% เป็น 1.34 หมื่นล้านดอลลาร์สหรัฐ ซึ่งยอดขายจากศูนย์ข้อมูลเป็นแรงขับเคลื่อนหลัก โดยเพิ่มขึ้นเกือบสองเท่าเป็น 8.5 พันล้านดอลลาร์สหรัฐ โดย OpenAI และ Anthropic เป็นหนึ่งในลูกค้ารายแรกๆ ที่รันภาระงานบนระบบ Helios ระดับไฮเอนด์รุ่นใหม่ของ AMD ซึ่งใช้ GPU รุ่นล่าสุดอย่าง MI450", "สำหรับ Broadcom ซึ่งเป็นบริษัทที่ช่วยบริษัท AI รายใหญ่ที่สุดหลายแห่งออกแบบชิปเฉพาะทางของตนเองนั้น ยังไม่ได้รายงานผลประกอบการ แต่จนถึงขณะนี้ยังไม่มีสัญญาณบ่งชี้ว่าการชะลอตัวของโมเดลระดับแนวหน้าจะส่งผลกระทบต่อยอดขายชิปแต่อย่างใด", "แน่นอนว่าแม้ห้องปฏิบัติการ AI จะลดความทะเยอทะยานในการฝึกฝนโมเดลลงอย่างมาก แต่ก็ต้องใช้เวลาสักระยะกว่าที่ผลกระทบจะปรากฏในงบการเงินของผู้ผลิตชิป Neil Shah รองประธานฝ่ายวิจัยของ Counterpoint Research กล่าวกับ The Verge เมื่อเดือนกันยายนว่า อาจต้องใช้เวลาประมาณหกเดือนกว่าจะเห็นผลกระทบทางการเงินจากการชะลอตัว เนื่องจากมีข้อตกลงในการจัดซื้อคอมพิวเตอร์และหน่วยความจำที่ทำไว้ล่วงหน้าแล้ว แต่อาจเห็นผลกระทบได้เร็วกว่าในคำสั่งซื้อที่ส่งไปยังผู้ผลิตชิปอย่าง TSMC", "จนถึงขณะนี้ ยังไม่มีหลักฐานบ่งชี้ถึงเรื่องดังกล่าวเช่นกัน โดยตัวเลขยอดขายล่าสุดของ TSMC ยังคงแสดงให้เห็นถึงความแข็งแกร่งอย่างต่อเนื่อง", "อย่างไรก็ตาม มีอีกเหตุผลหนึ่งที่การชะลอตัวของโมเดลระดับแนวหน้าอาจไม่ส่งผลเสียต่ออุตสาหกรรมชิปมากนัก นั่นคือความต้องการที่เพิ่มขึ้นสำหรับการทำ Inference หรือกระบวนการรันโมเดล AI ที่เรามีอยู่แล้ว", "Shah กล่าวว่า 'แม้จะมีข้อโต้แย้งว่าความต้องการ GPU ระดับท็อปอาจลดลงจากการเปลี่ยนผ่านไปสู่การทำ Inference แต่ภาระงานเหล่านี้โดยรวมแล้วต้องการโครงสร้างพื้นฐานด้านการประมวลผลมากกว่าการฝึกฝนโมเดลเสียอีก ซึ่งหมายความว่าความต้องการชิปเร่งความเร็ว (Accelerators) ทุกประเภทจะเพิ่มขึ้นสุทธิ'", "จากการวิเคราะห์ข้อมูลล่าสุดจาก Ramp แพลตฟอร์มการใช้จ่ายขององค์กร พบว่าตระกูลโมเดลระดับแนวหน้ามีสัดส่วนการใช้งาน Token ประมาณ 60% ในกลุ่มธุรกิจที่ใช้ Ramp เมื่อต้นเดือนพฤศจิกายน ซึ่งถือเป็นระดับสูงสุดเป็นประวัติการณ์และเพิ่มขึ้นประมาณสามเท่าจากสัดส่วนในช่วงต้นปี ซึ่งรวมถึงโมเดล Astra และ Sol ของ OpenAI และโมเดล Opus และ Fable ของ Anthropic", "แม้ว่าภาคธุรกิจจะใช้ AI มากขึ้น แต่การใช้จ่ายของพวกเขากลับเติบโตเพียงเล็กน้อยเท่านั้น Ara Kharazian หัวหน้านักเศรษฐศาสตร์ของ Ramp กล่าวกับ The Verge ว่า 'มันไม่ใช่ปัญหาด้านความต้องการ แต่ในทุกมิติ บริษัทต่างๆ กำลังใช้ AI มากขึ้น'", "Kharazian กล่าวว่า การแข่งขันระหว่างผู้ให้บริการโมเดล AI กำลังกดดันราคา Token ให้ลดลงอย่างรวดเร็ว จนทำให้ประมาณการรายได้ของ OpenAI และ Anthropic เริ่มเป็นที่น่าสงสัย ซึ่งสิ่งนี้อาจเป็นประโยชน์ต่อบริษัทที่จัดหาพลังการประมวลผล โดยในระหว่างการประชุมผลประกอบการของ Nvidia Kress กล่าวว่าราคา Token ลดลงเกือบ 60% ตั้งแต่เดือนพฤษภาคม ซึ่งกระตุ้นให้มีการใช้งานมากขึ้น ในขณะที่ราคาเช่า GPU ของ Nvidia ในทุกเจเนอเรชันกลับปรับตัวสูงขึ้น", "Nvidia และ AMD กำลังวางตำแหน่งชิปที่ทรงพลังที่สุดของตนเพื่อรองรับทั้งการฝึกฝนและการทำ Inference รวมถึงภาระงานที่ซับซ้อนซึ่งสร้างขึ้นโดย AI Agents", "นั่นไม่ได้หมายความว่า Nvidia จะรักษาความเป็นผู้นำไว้ได้ตลอดไป เนื่องจากบริษัท AI เริ่มให้ความสำคัญกับความคุ้มค่าทางเศรษฐศาสตร์ในการให้บริการโมเดลแก่ผู้คนนับล้านมากขึ้น พวกเขาจึงหันไปใช้ชิปแบบ Custom ที่สามารถทำงานได้ในราคาที่ถูกกว่า GPU อเนกประสงค์มากขึ้นเรื่อยๆ โดย Counterpoint คาดการณ์ว่าการจัดส่งโปรเซสเซอร์ AI เซิร์ฟเวอร์แบบ Custom จะแซงหน้า GPU สำหรับศูนย์ข้อมูลภายในปี 2028", "Shah กล่าวทิ้งท้ายว่า 'การเหยียบเบรกการฝึกฝนโมเดลระดับแนวหน้าจะไม่ทำให้ตลาดชิป AI หดตัวลง แต่มันจะเป็นเพียงการจัดสรรงบประมาณใหม่เท่านั้น' ในขณะที่การประชุมผลประกอบการของ Nvidia นักวิเคราะห์จาก UBS อย่าง Timothy Arcuri ได้ถาม Kress ว่าบริษัทจะยอมเสียอัตรากำไรที่สูงลิ่วห ร์แกนิกและไม่ระบุที่มา' โดยในงานนำเสนอภายในเมื่อเดือนพฤศจิกายน 2023 ระบุว่าโปรแกรมโรงเรียนจะช่วย 'มอบเหตุผลใหม่ให้วัยรุ่นเข้ามาใช้งาน หรือค้นพบคุณค่ามากขึ้นใน Instagram'", "เอกสารภายในเหล่านี้ชี้ให้เห็นว่า Meta พิจารณาเป้าหมายที่มากกว่าแค่เรื่องความปลอดภัยของวัยรุ่น เมื่อเริ่มเปิดตัว 'School Partnership Program' ของ Instagram ซึ่งในตอนแรกมีการโฆษณาถึงฟีเจอร์ที่ช่วยเร่งกระบวนการรายงานเนื้อหาที่ไม่เหมาะสมจากเขตการศึกษาที่เข้าร่วม ต่อมาในเดือนกันยายน Meta ได้ขยายโครงการนี้โดยการสร้างช่องทางเฉพาะที่โรงเรียนสามารถใช้แชร์ประกาศต่างๆ ถึงนักเรียนและผู้ปกครอง รวมถึงการเพิ่มแบนเนอร์โรงเรียนบนโปรไฟล์ และไดเรกทอรีสำหรับชมรมและทีมกีฬาต่างๆ", "Liza Crenshaw โฆษกของ Meta กล่าวกับ NPR ว่ารายงานข่าวดังกล่าว 'เป็นการบิดเบือนโครงการเชิงบวกที่ช่วยโรงเรียนในสหรัฐฯ หลายพันแห่งในการปกป้องนักเรียนบนโลกออนไลน์ สื่อสารเกี่ยวกับกิจกรรมนอกหลักสูตรได้อย่างปลอดภัย และรายงานปัญหาด้านความปลอดภัยได้อย่างง่ายดาย' โดย Crenshaw เสริมว่า Meta 'ไม่ต้องการให้ Instagram เป็นสิ่งรบกวนในระหว่างเวลาเรียน'", "อย่างไรก็ตาม เอกสารเมื่อเดือนพฤศจิกายน 2023 ระบุว่า 'กลยุทธ์ปัจจุบันของ Meta ที่พึ่งพาวัยรุ่นที่เป็น Power User ในการดึงเพื่อนที่ใช้งานน้อยให้เข้ามาใน Instagram อาจไม่มีประสิทธิภาพ หากยังมีกลุ่มวัยรุ่นทั้งหมดที่ยังไม่ได้เข้าร่วมใช้งาน Instagram' นอกจากนี้ งานนำเสนออีกชุดในปี 2023 ยังตั้งคำถามว่า Meta สามารถ 'ใช้เครือข่ายโรงเรียนเป็นกลไกในการขยายฐานผู้ใช้ได้หรือไม่' และระบุว่าข้อมูลโรงเรียนที่มีโครงสร้างชัดเจนจะ 'ช่วยปรับปรุงความสามารถในการค้นหาเพื่อนและคนรู้จัก' เพื่อดึงดูดวัยรุ่นที่ 'ไม่คิดว่าเพื่อนของตนใช้งาน Instagram อยู่'", "ในปี 2024 Meta ได้เริ่มปรับเปลี่ยนบัญชีผู้ใช้งานที่มีอายุต่ำกว่า 18 ปีให้เข้าสู่สถานะ 'Teen Accounts' ที่มีความเข้มงวดมากขึ้น ท่ามกลางการตรวจสอบจากทั่วโลกเกี่ยวกับความปลอดภัยของแพลตฟอร์ม ต่อมาบริษัทได้ตกลงที่จะบังคับใช้การยืนยันอายุ การจำกัดเวลาใช้งาน และตัวเลือกในการปิดฟีดแบบปรับแต่งตามความสนใจ เพื่อยุติข้อพิพาทที่กล่าวหาว่าแพลตฟอร์มของบริษัทมีลักษณะเสพติด", "ทั้งนี้ Meta ไม่ได้ตอบกลับคำขอความคิดเห็นจาก The Verge ในทันที"], "link": "https://www.theverge.com/tech/1036517/instagram-school-safety-program-project-gryffindor", "canonical_link": "https://www.theverge.com/tech/1036517/instagram-school-safety-program-project-gryffindor", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/23904518/VRG_Illo_K_Radtke_STK070_Instagram_1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795013945, "published_at": "2026-11-18T14:59:05Z", "published_th": "18 พ.ย. 2026 • 21:59 น.", "category_hint": "Technology"}, {"id": 1795010512405, "guid": "https://www.theverge.com/?p=1036140", "original_title": "Will Wright’s next game uses AI to map your memories", "thai_title": "Will Wright ผู้สร้าง The Sims เปิดตัว MyMems เกมแนวโซเชียลซิมูเลชันที่ใช้ AI สร้างโลกจากความทรงจำของคุณ", "tag": "Technology", "sub_tag": "GAMING", "bullet_points": ["Will Wright ผู้ให้กำเนิด SimCity และ The Sims กำลังพัฒนาเกมใหม่ชื่อ MyMems ซึ่งเป็นเกมแนวโซเชียลซิมูเลชันที่ขับเคลื่อนด้วย AI", "ตัวเกมเปิดโอกาสให้ผู้เล่นนำความทรงจำส่วนตัวมาเปลี่ยนเป็นโลกจำลอง โดยสามารถสร้างอวตาร AI ของบุคคลสำคัญในชีวิตและวางตำแหน่งความทรงจำลงบนแผนที่เสมือนจริง", "ทีมพัฒนาจาก Gallium Studios ยืนยันว่าเกมนี้เน้นความสนุกและการสร้างสรรค์ ไม่ใช่การทำหน้าที่เป็นไดอารี่บันทึกชีวิตแบบจริงจัง", "แม้กระแสต่อต้าน AI ในวงการเกมจะรุนแรง แต่ทีมงานเชื่อว่าหากผู้เล่นเป็นผู้ควบคุมการสร้างสรรค์ด้วยตนเอง (Authoring) จะทำให้ประสบการณ์ที่ได้ไม่รู้สึกเหมือนเป็นการโกงหรือการผลิตเนื้อหาที่ไร้คุณภาพ", "MyMems มีกำหนดการเปิดตัวในปี 2027 โดยมุ่งหวังที่จะต่อยอดแนวคิดการจำลองชีวิตจริงที่เคยประสบความสำเร็จใน The Sims ให้ลึกซึ้งยิ่งขึ้น"], "full_paragraphs": ["Will Wright ผู้สร้างแฟรนไชส์ระดับตำนานอย่าง SimCity และ The Sims กำลังซุ่มพัฒนาเกมใหม่ที่สร้างขึ้นโดยมี AI เป็นแกนหลัก โดยเกมนี้มีชื่อว่า MyMems ซึ่งมุ่งเน้นไปที่การนำความทรงจำของผู้เล่นมาเป็นหัวใจสำคัญ เช่นเดียวกับผลงานชิ้นก่อนๆ ของ Wright เกมนี้ดูมีความทะเยอทะยานสูงมาก โดยมอบวิธีการใหม่ให้ผู้เล่นได้สำรวจโลกที่พวกเขาสร้างขึ้นด้วยตัวเอง 'เราต้องการนำอัตชีวประวัติของคุณมาเปลี่ยนให้กลายเป็นโลกของเล่น' เขากล่าวกับ The Verge", "เว็บไซต์ของ MyMems อธิบายว่าเกมมือถือนี้เป็น 'โซเชียลซิมูเลชัน' ที่มีโลกซึ่ง 'สร้างขึ้นจากความทรงจำของคุณและผู้คนที่หล่อหลอมตัวตนของคุณ' ผู้เล่นสามารถเพิ่ม 'ความทรงจำ' เข้าไปในเกมได้ เช่น การบอกเล่าเรื่องราวสั้นๆ ผ่านโทรศัพท์ แล้วความทรงจำเหล่านั้นจะถูกเจนเนอเรตออกมาเป็นชิ้นส่วนที่คุณสามารถนำไปวางบนแผนที่ของเกมได้ นอกจากนี้ โลกของคุณยังสามารถมีอวตารที่ขับเคลื่อนด้วย AI ซึ่งเป็นตัวแทนของบุคคลที่คุณรู้จักในชีวิตจริงได้อีกด้วย Wright กล่าวว่า ในอุดมคติแล้ว เมื่อคุณเล่นไปเรื่อยๆ โลกใบนี้จะเริ่มกลายเป็น 'แผนที่ของจิตใจคุณ' คล้ายกับภาพยนตร์เรื่อง Inside Out โดยโลกเหล่านี้สามารถตั้งค่าเป็นส่วนตัวหรือแชร์ให้ผู้อื่นเข้าชมได้", "Virginia McArthur โปรดิวเซอร์บริหารและผู้จัดการทั่วไปของ Gallium Studios ซึ่งเป็นสตูดิโอผู้พัฒนา MyMems ได้ให้มุมมองเพิ่มเติมว่า 'มันคือเกมสร้างโลกที่ให้ความรู้สึกอบอุ่น (Cozy world builder) โดยมีระบบโซเชียลซิมูเลชันที่ลึกซึ้งอยู่เบื้องหลัง'", "แม้แนวคิดนี้จะดูเข้าใจยากหากไม่ได้สัมผัสด้วยตัวเอง แต่ทีมงานของ Wright ก็ยังต้องการให้มันเป็นเกมที่สนุกสนาน Anthony Maitz ผู้จัดการผลิตภัณฑ์ของ Gallium Studios กล่าวว่า 'นี่ไม่ได้ตั้งใจให้เป็นไดอารี่บันทึกมรดกชีวิตของคุณแต่อย่างใด แต่มันตั้งใจให้เป็นเพียงสิ่งที่คุณสามารถเล่นสนุกไปกับมันได้' อย่างไรก็ตาม Maitz ตั้งข้อสังเกตว่า สิ่งที่คุณกำลังทำอยู่นั้นคือการสร้าง 'ตัวแทน' (Proxy) ของตัวคุณเอง ซึ่งดูเหมือนจะเป็นแรงบันดาลใจของชื่อเกมในยุคแรกเริ่มที่ชื่อว่า Proxi: Yesterday’s You Tomorrow", "เช่นเดียวกับอุตสาหกรรมอื่นๆ วงการเกมกำลังเผชิญหน้ากับการปรับตัวเข้าหา Generative AI ในช่วงที่ผ่านมา โลกเสมือนจริงที่สร้างด้วย AI จากสตาร์ทอัพที่ได้รับการสนับสนุนจากผู้ร่วมก่อตั้ง Pixar และ Project Genie ของ Google ยังไม่สามารถสร้างประสบการณ์ที่ผู้เล่นอยากใช้เวลาด้วยจริงๆ ได้ และนักพัฒนาอินดี้หลายรายที่ผมได้พูดคุยด้วยเมื่อเดือนมีนาคมก็คัดค้านเทคโนโลยีนี้อย่างหนัก แต่เทคโนโลยี AI ได้ก้าวกระโดดครั้งใหญ่ในปีนี้ โดยบริษัทอย่าง Google, Meta และ Roblox ต่างเปิดให้ผู้ใช้สร้างเกมด้วย AI ผ่านสมาร์ทโฟนได้โดยตรง รวมถึงเกมย้อนยุคที่กำลังถูกรุกรานด้วยพอร์ตเกมคลาสสิกที่ขับเคลื่อนด้วย AI", "Strauss Zelnick ซีอีโอของ Take-Two Interactive กล่าวเมื่อต้นปีนี้ว่า Generative AI 'ไม่มีส่วนเกี่ยวข้องใดๆ กับสิ่งที่ Rockstar Games กำลังสร้าง' ใน GTA VI แม้ว่าผลสำรวจล่าสุดในอุตสาหกรรมจะบ่งชี้ว่านักพัฒนาเกมจำนวนมากขึ้นเริ่มใช้ Generative AI ในการทำงาน แต่เหล่าคนทำงานก็กำลังต่อต้านการใช้เทคโนโลยีนี้ และมันได้กลายเป็นประเด็นถกเถียงที่ดุเดือดในงานประกาศรางวัลเกมอินดี้หลายแห่ง", "ผู้เล่นจำนวนมากปฏิเสธการใช้ AI อย่างสิ้นเชิง ผมจึงสงสัยว่าทีมงาน Gallium Studios กังวลเกี่ยวกับการต่อต้านการใช้ AI ใน MyMems หรือไม่ Wright กล่าวว่าเขามีลูกชายสามคนอยู่ที่บ้านและพวกเขาทั้งหมด 'ค่อนข้างเป็นลบ' ต่อ AI เขามองว่าความรู้สึกเชิงลบต่อ AI นั้นมุ่งไปที่ประเด็นเรื่องความหมายของศิลปะ ความเป็นผู้สร้าง และการให้เครดิต ซึ่งเป็นข้อกังวลที่เขาเรียกว่า 'มีมูลความจริง' แต่เขาก็เรียก AI ว่าเป็น 'เครื่องมือที่น่าทึ่ง' เช่นกัน", "'เราไม่ได้กำลังสร้างขยะ (slop)' McArthur กล่าว แต่ Maitz ตั้งข้อสังเกตว่า แม้ทีมงานจะ 'มีความกังวล' เกี่ยวกับกระแสตอบรับเชิงลบต่อการใช้ Generative AI แต่พวกเขาก็ได้เรียนรู้ว่าผู้คนไม่ได้รังเกียจเมื่อมีการใช้ AI ใน 'สไตล์แบบ Scribblenauts' สำหรับสิ่งต่างๆ เช่น การให้เกมสร้างโรงเรียนมัธยมขึ้นมา ทีมงานยังพบว่าผู้คนรู้สึก 'เสพติด' แอปทดสอบที่มีระบบสร้างตัวละคร รวมถึงลูกสาวของ Maitz เองที่เขากล่าวว่า 'เกลียด' AI แต่เขากล่าวว่า 'ด้วยการทำให้ผู้เล่นเป็นคนสร้างมันขึ้นมาทีละนิดๆ มันจึงไม่รู้สึกเหมือนว่าคุณกำลังโกง'", "MyMems ซึ่งมีกำหนดเปิดตัวในปี 2027 จะเข้าร่วมสมรภูมิโซเชียลซิมูเลชันที่มีการแข่งขันสูงขึ้นเรื่อยๆ เช่น Inzoi ของ Krafton และ Tomodachi Life: Living the Dream เกมฮิตของ Nintendo แต่ไม่มีเกมใดที่มีแรงดึงดูดเท่ากับ The Sims ซึ่งยังคงเป็นหนึ่งในแฟรนไชส์ที่สำคัญที่สุดของ EA สำหรับ The Sims นั้น Wright กล่าวว่าผู้คนจำนวนมากพยายามสร้างครอบครัวจริงๆ ของพวกเขาลงไปในเกม", "'มันน่าสนใจมากที่ผู้คนพยายามนำเกมนี้ ซึ่งเปรียบเสมือนของเล่นชิ้นเล็กๆ มาจำลองเข้ากับชีวิตจริงของพวกเขาโดยธรรมชาติ' เขากล่าว สำหรับ MyMems นั่นคือสิ่งที่ทีมงานพยายามจะทำ 'ขั้นตอนต่อไป' ให้สมบูรณ์ นั่นคือจะเกิดอะไรขึ้นหากพวกเขาสร้างเกมทั้งเกมโดยเน้นไปที่ตัวคุณเอง?", "Wright อธิบายว่า ลองจินตนาการถึงการเปิดสมุดภาพครอบครัว แล้วเห็นผู้คนและสิ่งของต่างๆ กระโดดออกมาจากหน้ากระดาษ 'เมื่อคุณเปิดไปเรื่อยๆ ในไม่ช้าคุณก็จะมีคณะละครสัตว์เล็กๆ ที่เต็มไปด้วยผู้คน เหตุการณ์ และสิ่งต่างๆ จากชีวิตของคุณ' เขากล่าวว่ามันคือความโกลาหล 'ผมต้องการบางสิ่งที่ให้ความรู้สึกแบบนั้น'"], "link": "https://www.theverge.com/games/1036140/will-wright-mymems-ai-game-interview", "canonical_link": "https://www.theverge.com/games/1036140/will-wright-mymems-ai-game-interview", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Grand-Canyon-Family-Portrait.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Moonlit-walk.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/remember-chat-2.png?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1795010400, "published_at": "2026-11-18T14:00:00Z", "published_th": "18 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology"}, {"id": 1795050045397, "guid": "https://www.theverge.com/?p=1034715", "original_title": "How The Verge is picking which Black Friday deals to share", "thai_title": "เบื้องหลังการคัดเลือกดีล Black Friday ของ The Verge: เราตัดสินใจอย่างไรว่าโปรโมชันไหนคุ้มค่าจริง?", "tag": "Technology", "sub_tag": "GADGETS", "bullet_points": ["The Verge ใช้เกณฑ์การคัดกรองที่เข้มงวดในการเลือกดีล โดยเน้นผลิตภัณฑ์ที่ผ่านการทดสอบจริงและมีคุณภาพสูงเท่านั้น", "ปัญหาเรื่อง 'ราคาหลอก' หรือการตั้งราคา List Price ที่สูงเกินจริงเพื่อสร้างภาพลักษณ์ส่วนลดที่ดูคุ้มค่า เป็นสิ่งที่ทีมงานเฝ้าระวังและตรวจสอบอย่างใกล้ชิด", "การใช้เครื่องมือติดตามราคาภายนอกอย่าง CamelCamelCamel และ Keepa ช่วยให้ทีมงานเห็นข้อมูลย้อนหลังที่แม่นยำกว่าการดูราคาหน้าเว็บเพียงอย่างเดียว", "ปัจจัยภายนอก เช่น ภาวะเงินเฟ้อและภาษีนำเข้า ส่งผลกระทบต่อโครงสร้างราคา ทำให้การนิยามคำว่า 'ดีลที่ดี' ในปัจจุบันมีความซับซ้อนกว่าในอดีต", "ทีมงานคัดกรองดีลจากนับพันรายการให้เหลือเพียงไม่กี่สิบรายการที่คุ้มค่าที่สุด เพื่อให้ผู้อ่านมั่นใจได้ว่าทุกข้อเสนอที่แนะนำผ่านการกลั่นกรองมาแล้ว"], "full_paragraphs": ["ในช่วงหนึ่งเดือนที่ผ่านมา เราได้รับข้อมูลเกี่ยวกับดีล Black Friday จำนวนมหาศาล ซึ่งเป็นสัญญาณเตือนถึงเทศกาลช้อปปิ้งที่ใหญ่ที่สุดของปีในสหรัฐอเมริกา เราได้รับข่าวประชาสัมพันธ์หลายสิบฉบับต่อวันจากแบรนด์ต่างๆ ทั้งรายใหญ่และรายย่อยที่หวังให้เราช่วยเผยแพร่ข้อเสนอเหล่านี้ แน่นอนว่าบริษัทต่างๆ คงอยากให้เรานำเสนอโดยไม่ต้องตรวจสอบหรือทำวิจัยว่าดีลเหล่านั้นคุ้มค่าจริงหรือไม่ และส่วนใหญ่ก็ไม่ได้ให้ข้อมูลบริบทที่จำเป็นสำหรับการตรวจสอบคุณภาพของดีลเลย", "สิ่งที่เราพบเห็นบ่อยครั้งบน Amazon และพยายามแก้ไขในการนำเสนอข่าวของเรา คือดีลที่ดูดีแต่มีการอ้างส่วนลดที่เกินจริง กล่าวคือ ราคาขายปลีกปกติ (List Price) บางครั้งถูกตั้งไว้สูงกว่าราคาขายจริงในวันปกติ เพื่อทำให้ส่วนลดดูมีความหมายมากขึ้น บางครั้งมีการแสดงราคาแนะนำจากผู้ผลิต (MSRP) แต่ก็ไม่ใช่ทุกกรณีเสมอไป", "ในแถลงการณ์ล่าสุดที่ส่งถึงนักข่าวสืบสวนสอบสวน Ronan Farrow โฆษกของ Amazon ที่ไม่เปิดเผยชื่อระบุว่า 'List Price' ของบริษัทอาจถูกรวบรวมมาจากราคาในช่วง 90 ถึง 180 วันที่ผ่านมา ไม่ใช่แค่ 30 วันตามที่งานวิจัยของ Groundwork Collaborative ได้ระบุไว้ และยังอ้างอิงจากราคาของ Amazon เองรวมถึงร้านค้าปลีกคู่แข่งรายอื่น อย่างไรก็ตาม จากประสบการณ์ของเรา วิธีการสื่อสารเรื่องราคาและส่วนลดที่ชวนสับสนไม่ได้จำกัดอยู่แค่บน Amazon เท่านั้น", "ผลการศึกษาของกลุ่มดังกล่าวแสดงให้เห็นว่า การไม่ไว้วางใจราคาที่เห็นบนโลกออนไลน์นั้นเป็นเรื่องง่าย โดยเฉพาะในยุคที่การใช้ Dynamic Pricing หรือการปรับราคาตามสถานการณ์เข้ามามีบทบาท ไม่ว่าร้านค้าปลีกจะมีแนวทางปฏิบัติอย่างไร เราเข้าใจถึงความสำคัญของการคัดสรรสิ่งที่คุณเห็นบน The Verge ด้วยความระมัดระวัง", "การตรวจสอบดีลเพื่อพิจารณานำเสนอถือเป็นส่วนสำคัญที่มองไม่เห็นในงานของเรา แม้จะเป็นช่วงนอกเทศกาลช้อปปิ้งก็ตาม ดีลส่วนใหญ่ที่เราได้รับข้อเสนอมาในแต่ละวัน หรือที่เราเห็นในฟีดข่าว ไม่เคยถูกนำมาลงบนเว็บไซต์เพราะไม่ผ่านเกณฑ์มาตรฐานของเรา แม้ว่าดีลนั้นจะเป็นผลิตภัณฑ์ที่เราเคยทดสอบและชื่นชอบ ซึ่งถือเป็นหัวใจหลักในการคัดเลือกดีลของเรา แต่นั่นก็ไม่ใช่การรับประกันว่าจะได้รับการนำเสนอเสมอไป  AI ไปสู่การเป็นแพลตฟอร์มมัลติมีเดียเต็มรูปแบบ ฟีเจอร์นี้ช่วยให้ผู้ใช้สามารถเปลี่ยนเพลงที่สร้างจาก Suno ให้กลายเป็นคลิปวิดีโอ AI ที่สามารถขยับปากตามเนื้อเพลง (Lipsync) ได้โดยอัตโนมัติ รวมถึงการสร้างภาพประกอบเพื่อใช้เป็นภาพปกอัลบั้มหรือภาพขนาดย่อ (Thumbnail) ผ่านการพิมพ์คำสั่ง (Prompt)", "ฟีเจอร์ Visuals พร้อมให้ใช้งานแล้วทั้งบนหน้าเว็บไซต์, iOS และ Android โดยผู้ใช้สามารถเข้าถึงได้ผ่านแท็บ 'Visuals' ในโหมด Create ของแต่ละเวอร์ชัน สำหรับผู้ใช้งานบนเว็บยังสามารถเข้าถึงได้ผ่านเมนูจุดสามจุดบนเพลงในคลังส่วนตัว โดยผู้ใช้สามารถเลือกช่วงของเพลงที่ต้องการนำมาประกอบวิดีโอได้สูงสุด 15 วินาที พร้อมทั้งเลือกภาพอ้างอิงเพื่อใช้เป็นจุดเริ่มต้นในการสร้างคลิปวิดีโอ", "ในส่วนของการเลือกภาพอ้างอิง ผู้ใช้มีตัวเลือก 3 รูปแบบ ได้แก่ การเลือกใช้ตัวละครสำเร็จรูปที่ Suno จัดเตรียมไว้ให้, การอัปโหลดรูปภาพหรือผลงานศิลปะของตนเอง หรือการสร้างภาพขึ้นใหม่โดยตรงบน Suno ผ่านการพิมพ์คำสั่งบรรยาย นอกจากนี้ยังสามารถเลือกอัตราส่วนภาพ (Aspect Ratio) ให้เหมาะสมกับการแสดงผลทั้งในแนวตั้งและแนวนอน เพื่อให้สอดคล้องกับแพลตฟอร์มออนไลน์ต่างๆ", "สำหรับการสร้างวิดีโอ ผู้ใช้สามารถกำหนดได้ว่าภาพอ้างอิงจะถูกใช้เป็นเฟรมเริ่มต้นหรือเฟรมสุดท้าย เพื่อความสะดวกในการตัดต่อคลิปความยาว 15 วินาทีเข้าด้วยกัน นอกจากนี้ยังมีปุ่มเปิด-ปิดฟังก์ชัน Lipsync เพื่อให้ตัวละครในวิดีโอขยับปากตามเนื้อร้อง รวมถึงเครื่องมือปรับแต่งอัตราส่วนภาพและความยาวของคลิป โดย Visuals ยังมาพร้อมกับไทม์ไลน์การตัดต่อวิดีโอโดยเฉพาะ เพื่อให้ผู้ใช้สามารถนำคลิปต่างๆ มาเรียงต่อกันเป็นวิดีโอที่ยาวขึ้น พร้อมทั้งเพิ่มข้อความเนื้อเพลงที่ปรับแต่งได้", "เบื้องหลังการทำงานของ Visuals ขับเคลื่อนด้วยโมเดล AI รุ่น H3 จาก MiniMax โดย Suno ระบุว่าโมเดลนี้ได้รับการปรับแต่งให้เหมาะสมกับชุมชนผู้ใช้งานของบริษัท รวมถึงมีการเพิ่มมาตรการป้องกันและระบบความปลอดภัยต่างๆ เช่น ชุดตัวกรองข้อความและภาพแบบใหม่ที่ออกแบบมาเพื่อป้องกันไม่ให้ผู้ใช้สร้างหรือใช้ภาพลักษณ์ของศิลปินเฉพาะกลุ่ม, บุคคลสาธารณะ, ผลงานที่มีลิขสิทธิ์ และทรัพย์สินทางปัญญา (IP) ต่างๆ", "อย่างไรก็ตาม การใช้งานฟีเจอร์นี้จะมีค่าใช้จ่ายเพิ่มเติม เนื่องจาก Suno ได้กำหนดให้ใช้ 'Visuals credits' แยกต่างหากจากเครดิตการสร้างเพลงปกติ ซึ่งหมายความว่าผู้ใช้งานจะต้องเสียค่าใช้จ่ายเพิ่มขึ้นหากต้องการใช้ฟีเจอร์ใหม่นี้", "การเปิดตัว Visuals เกิดขึ้นหลังจากที่ Suno ได้เพิ่มฟีเจอร์ 'Speech' เมื่อเดือนตุลาคมที่ผ่านมา เพื่อใช้สำหรับการสร้างเสียงพูดและเสียงบรรยาย การเพิ่มขีดความสามารถด้านวิดีโอถือเป็นความพยายามในการสร้างความหลากหลายให้กับแพลตฟอร์ม ท่ามกลางสถานการณ์ที่บริษัทกำลังเผชิญกับคดีความฟ้องร้องเรื่องลิขสิทธิ์เพลงจากหลายฝ่าย ทั้งนี้ ดูเหมือนว่าผู้ใช้บางส่วนยังคงต้องการให้บริษัทมุ่งเน้นไปที่การปรับปรุงคุณภาพการสร้างเพลงมากกว่า โดยในวิดีโอเปิดตัวฟีเจอร์ Visuals บน YouTube มีผู้ใช้รายหนึ่งแสดงความเห็นว่า 'FIX AUDIO BEFORE ADDING CRAP NOBODY ASKED FOR' (ช่วยแก้ปัญหาเรื่องเสียงก่อนที่จะเพิ่มขยะที่ไม่มีใครต้องการเข้ามา) ซึ่งเป็นความรู้สึกที่ผู้ใช้คนอื่นๆ ในช่องคอมเมนต์ต่างเห็นพ้องไปในทิศทางเดียวกัน"], "link": "https://www.theverge.com/ai-artificial-intelligence/1036415/suno-visuals-ai-generated-video-images-feature", "canonical_link": "https://www.theverge.com/ai-artificial-intelligence/1036415/suno-visuals-ai-generated-video-images-feature", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/suno-ai-visuals.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795000613, "published_at": "2026-11-18T11:16:53Z", "published_th": "18 พ.ย. 2026 • 18:16 น.", "category_hint": "Technology"}, {"id": 1794954645074, "guid": "https://www.theverge.com/?p=1036045", "original_title": "iFixit’s Apple HomeView teardown reveals a device that will be difficult to repair", "thai_title": "iFixit ชำแหละ Apple HomeView พบงานประกอบสุดหิน ซ่อมแซมยากกว่าที่คิด", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["iFixit เผยผลการชำแหละ Apple HomeView พบว่าการออกแบบเน้นความยากในการซ่อมแซม ต่างจากอุปกรณ์รุ่นใหม่ๆ ของ Apple ที่เคยทำได้ง่ายขึ้น", "การถอดแยกชิ้นส่วนทำได้ยากลำบากจนทีมช่างของ iFixit ทำขั้วต่อเสียหายและลำโพงแตกหักระหว่างกระบวนการ", "การใช้กาวปริมาณมหาศาลยึดหน้าจอและการเชื่อมต่อระหว่างแผงวงจรกับฮีทซิงค์ที่เป็นโครงอะลูมิเนียม ทำให้การซ่อมแซมมีความเสี่ยงสูง", "พบความแตกต่างของขนาดไดรเวอร์ลำโพงระหว่างรุ่นติดผนังและรุ่นตั้งโต๊ะ แม้จะมีราคาจำหน่ายเท่ากันที่ 299 ดอลลาร์สหรัฐ"], "full_paragraphs": ["ดูเหมือนว่าความพยายามของ Apple ในการออกแบบอุปกรณ์ให้ซ่อมแซมได้ง่ายขึ้นจะถูกละทิ้งไปในผลิตภัณฑ์ HomeView รุ่นใหม่ล่าสุด", "หลังจากที่ iFixit พบว่า iPad และ HomePod รุ่นหลังๆ สามารถถอดแยกชิ้นส่วนเพื่อเปลี่ยนแบตเตอรี่หรือซ่อมแซมได้ง่ายขึ้น พวกเขาจึงคาดหวังว่า HomeView ซึ่งเป็นฮับอัจฉริยะที่มีหน้าตาเหมือนแท็บเล็ตขนาด 7 นิ้วติดอยู่บนลำโพงอัจฉริยะนั้นจะมีแนวทางเดียวกัน แต่ความเป็นจริงกลับแตกต่างออกไปอย่างสิ้นเชิง โดยในระหว่างการชำแหละ HomeView ทีมช่างผู้เชี่ยวชาญของ iFixit ยอมรับว่าพวกเขาได้ “ทำขั้วต่อขาด ทำลำโพงแตกเป็นสองส่วน และใช้แรงกดลงบนแผงวงจรหลัก (logic board) มากเกินกว่าที่พวกเราจะรู้สึกสบายใจ”", "ส่วนที่เป็นแท็บเล็ตของ HomeView กลายเป็นความท้าทายที่ใหญ่ที่สุดในการถอดแยกชิ้นส่วน อันเป็นผลมาจากการตัดสินใจด้านการออกแบบที่น่ากังขาของ Apple โดย iFixit ระบุว่ากาวที่ใช้ยึดหน้าจอให้เข้าที่นั้น “ยึดแน่นหนากว่าผลิตภัณฑ์ Apple ทุกชิ้นที่เราเคยเปิดมาในช่วงหลัง” และในขณะที่การตัดสินใจของ Apple ในการเปลี่ยนโครงอะลูมิเนียมทั้งหมดของ HomeView ให้กลายเป็นฮีทซิงค์ (heat sink) นั้นถือเป็นแนวคิดที่ชาญฉลาด แต่การเชื่อมต่อทางความร้อนระหว่างแผ่นป้องกันความร้อน (heat shield) กับแผงวงจรหลักของอุปกรณ์ ทำให้การแยกชิ้นส่วนทั้งสองออกจากกันกลายเป็น “ปฏิบัติการที่มีความเสี่ยงสูงอย่างยิ่ง” แม้การออกแบบเหล่านี้อาจช่วยให้กระบวนการประกอบในโรงงานรวดเร็วขึ้น แต่การใช้กาวในปริมาณมากทำให้การซ่อมบำรุง HomeView เป็นเรื่องที่ยากลำบากอย่างเหลือเชื่อ", "ในวิดีโอการชำแหละที่เผยแพร่ออกมา iFixit ยังเปิดเผยให้เห็นว่าไดรเวอร์ลำโพงในรุ่นติดผนัง (wall-mounted) ของ HomeView นั้นมีขนาดเล็กกว่ารุ่นตั้งโต๊ะอย่างเห็นได้ชัด แม้ว่าทั้งสองรุ่นจะมีราคาจำหน่ายอยู่ที่ 299 ดอลลาร์สหรัฐเท่ากัน แต่รุ่นติดผนังกลับมีต้นทุนที่สูงกว่าเมื่อคำนึงถึงอุปกรณ์ยึดติดที่จำเป็นซึ่งไม่ได้รวมอยู่ในชุดจำหน่าย ส่งผลให้ iFixit รู้สึกว่าผู้บริโภคกำลังได้รับประสิทธิภาพที่น้อยลงในขณะที่ต้องจ่ายเงินมากขึ้น"], "link": "https://www.theverge.com/tech/1036045/ifixit-teardown-apple-homeview-smart-home-hub", "canonical_link": "https://www.theverge.com/tech/1036045/ifixit-teardown-apple-homeview-smart-home-hub", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/ifixit.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": ["https://www.youtube.com/embed/rr7m9nBqDdo"], "review_score": "", "published_ts": 1794954341, "published_at": "2026-11-17T22:25:41Z", "published_th": "18 พ.ย. 2026 • 05:25 น.", "category_hint": "Technology"}, {"id": 1794953742473, "guid": "https://www.theverge.com/?p=1035465", "original_title": "Nvidia says it does not intend to reinstate Jensen Huang as CEO", "thai_title": "Nvidia ยืนยันชัดเจน ไม่มีความตั้งใจดึง Jensen Huang กลับมานั่งเก้าอี้ CEO", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["บอร์ดบริหาร Nvidia ประกาศอย่างเป็นทางการว่าไม่มีแผนที่จะแต่งตั้ง Jensen Huang ให้กลับมาดำรงตำแหน่ง CEO อีกครั้ง", "Jensen Huang เคยโพสต์ข้อความผ่าน X แสดงความพร้อมที่จะกลับมาทำงานหากบอร์ดเห็นว่าจะเป็นประโยชน์ต่อบริษัทและผู้ถือหุ้น", "Huang กำลังเผชิญกับมรสุมข่าวฉาว ทั้งเรื่องความสัมพันธ์ส่วนตัวและข้อกล่าวหาเรื่องการพัวพันกับสายลับต่างชาติ ซึ่งกำลังอยู่ระหว่างการสอบสวนภายใน", "สถานการณ์ของ Nvidia มีความซับซ้อนขึ้นจากการเมืองในสหรัฐฯ และความสัมพันธ์ใกล้ชิดระหว่าง Huang กับอดีตประธานาธิบดี Donald Trump", "นักวิเคราะห์มองว่าแม้จะเกิดความวุ่นวาย แต่ความต้องการ AI Compute Hardware ของ Nvidia ยังคงสูงลิ่วและยากที่คู่แข่งจะเข้ามาแทนที่ได้ในระยะสั้น"], "full_paragraphs": ["ในการเริ่มต้นการประชุมรายงานผลประกอบการรายไตรมาสของ Nvidia เมื่อวันอังคารที่ผ่านมา Harvey Jones ประธานบอร์ดบริหารคนใหม่ได้กล่าวถึงกรณีการลาออกของอดีต CEO Jensen Huang ว่า “บอร์ดบริหารของ Nvidia ได้ยอมรับการลาออกของเขาอย่างเป็นเอกฉันท์ และไม่มีความตั้งใจที่จะแต่งตั้ง Jensen ให้กลับมาดำรงตำแหน่ง CEO อีกครั้ง”", "Jones กล่าวเสริมว่า “เราจะไม่ตอบคำถามหรือหารือใดๆ ในการประชุมวันนี้ เกี่ยวกับสถานการณ์เบื้องหลังการลาออกของ Jensen รวมถึงการสอบสวนที่กำลังดำเนินอยู่ในขณะนี้”", "ก่อนหน้านี้ในวันเดียวกัน Huang ได้แสดงท่าทีผ่านสื่อสังคมออนไลน์ X โดยระบุว่าเขา “ไม่ได้ปฏิบัติตามมาตรฐานที่คาดหวังจากทุกคน” ในบริษัท และรู้สึกเสียใจกับความผิดพลาดที่เกิดขึ้น พร้อมยืนยันว่าจะให้ความร่วมมือกับการสอบสวนของบอร์ดบริหารอย่างเต็มที่ นอกจากนี้เขายังระบุว่ายินดีที่จะกลับมารับตำแหน่ง CEO หากได้รับข้อเสนอ แม้ว่าก่อนหน้านั้นหนึ่งวันจะมีรายงานว่าบอร์ดบริหารของ Nvidia ไม่ได้พิจารณาเรื่องการดึงตัวเขากลับมาก็ตาม โดย Huang ระบุว่า “Nvidia เป็นบริษัทที่เกิดขึ้นเพียงครั้งเดียวในรอบชั่วอายุคน หากคณะกรรมการบริษัทตัดสินใจว่าการกลับมาของผมเป็นประโยชน์สูงสุดต่อผู้ถือหุ้น พนักงาน บริษัท และประเทศชาติ ผมก็พร้อมที่จะตอบรับและกลับมาดำรงตำแหน่ง CEO อีกครั้ง”", "อย่างไรก็ตาม นับตั้งแต่การลาออกเมื่อวันที่ 12 พฤศจิกายนที่ผ่านมา Huang ยังคงติดหล่มอยู่ในข่าวฉาว โดยมีรายงานว่าเขามีความสัมพันธ์เชิงชู้สาว 3 ครั้ง ซึ่ง 2 ครั้งเป็นพนักงานภายใต้บังคับบัญชาที่ Nvidia และอีก 1 ครั้งเกี่ยวข้องกับบุคคลที่ถูกกล่าวหาว่าเป็นสายลับของหน่วยข่าวกรองจีน ซึ่งถูกสงสัยว่ามีส่วนช่วยอำนวยความสะดวกในการขายชิปอย่างผิดกฎหมาย (ทั้งที่ Huang เคยพยายามผลักดันให้ยกเลิกข้อจำกัดการขายชิปของ Nvidia ในจีน) โดยเขามีกำหนดการที่จะต้องเข้าให้การต่อรัฐสภาในวันที่ 1 ธันวาคมนี้ ขณะที่การสอบสวนภายในบริษัทก็ยังคงดำเนินอยู่", "แม้จะมีข่าวฉาว แต่บุคคลสำคัญในอุตสาหกรรมเทคโนโลยีหลายรายยังคงแสดงจุดยืนสนับสนุน Huang โดยยกย่องว่าเขาเป็นบุคคลที่ “หาใครมาแทนไม่ได้” และมีการล่ารายชื่อเพื่อเรียกร้องให้เขากลับมา บางส่วนตั้งข้อสงสัยเกี่ยวกับข้อกล่าวหาที่ว่า Alice Huang (ไม่มีความเกี่ยวข้องทางสายเลือด) เป็นสายลับให้กับจีน โดยมองว่าข่าวรั่วไหลเกี่ยวกับความสัมพันธ์ของทั้งคู่เป็นทฤษฎีสมคบคิดเพื่อทำลายอดีต CEO รายนี้ นอกจากนี้ Donald Trump อดีตประธานาธิบดีสหรัฐฯ ซึ่งเป็นพันธมิตรใกล้ชิดของ Huang ในช่วงปีที่ผ่านมา ก็ได้ออกมาสนับสนุนเช่นกัน โดยเมื่อวันจันทร์ที่ผ่านมา Trump กล่าวว่าเขา “ไม่ขัดข้อง” หาก Huang จะกลับมา พร้อมเสริมว่า “ผมคิดว่าเขาได้รับบทเรียนครั้งใหญ่แล้ว ผมเดาว่าบางทีบทเรียนหนึ่งอาจสำคัญกว่าอีกบทเรียนหนึ่ง”", "ความใกล้ชิดระหว่าง Trump และ Huang อาจสร้างความซับซ้อนให้กับ Nvidia ได้เช่นกัน เนื่องจากบริษัทได้เพิ่มงบประมาณการล็อบบี้ในกรุงวอชิงตัน ดี.ซี. โดยใช้เงินไปถึง 5 ล้านดอลลาร์ในปี 2025 และอีก 4.7 ล้านดอลลาร์ในปี 2026 อย่างไรก็ตาม ในขณะที่พรรคเดโมแครตเตรียมตัวเข้าควบคุมรัฐสภา พวกเขามีแผนที่จะตรวจสอบความสัมพันธ์ระหว่าง Trump กับบริษัทเทคโนโลยีขนาดใหญ่และอุตสาหกรรมอื่นๆ โดยอ้างถึงความเป็นไปได้ของการทุจริต Brendan Glavin ผู้อำนวยการฝ่ายข้อมูลเชิงลึกของ OpenSecrets กล่าวกับ The Verge เมื่อสัปดาห์ที่แล้วว่า “การเลือกตั้งครั้งนี้ไม่ได้ส่งผลบวกต่อ AI มากนัก และข่าวการลาออกของ Huang จะยิ่งทำให้สถานการณ์ซับซ้อนขึ้น โดยเฉพาะสำหรับบริษัทนี้และสำหรับอุตสาหกรรม AI โดยรวมในอนาคต”", "Lior Prosor หุ้นส่วนผู้จัดการของ Deep33 บริษัทร่วมลงทุนด้านเทคโนโลยี กล่าวเมื่อสัปดาห์ที่แล้วว่า เขาไม่คาดว่าการลาออกของ Huang จะทำให้ฟองสบู่ AI แตก แม้ว่า Huang จะมีบทบาทสำคัญในการระดมทุนเพื่อสร้างโครงสร้างพื้นฐาน AI ในสหรัฐฯ ก็ตาม ภายใต้การนำของ Huang ในเดือนสิงหาคม Nvidia ได้ทำข้อตกลงร่วมกับสถาบันการเงิน 6 แห่งด้วยมูลค่าประมาณ 5 แสนล้านดอลลาร์เพื่อสนับสนุนโครงการดังกล่าว Prosor กล่าวกับ The Verge ว่า “Nvidia จัดหาฮาร์ดแวร์ประมวลผล AI ประมาณ 75 เปอร์เซ็นต์ที่อุตสาหกรรมต้องการ และความต้องการยังคงสูงกว่าอุปทานอย่างมาก ทั้งลูกค้าและคู่แข่งต่างไม่สามารถทดแทนขีดความสามารถที่ Nvidia มอบให้ได้อย่างง่ายดาย และแรงจูงใจทางเศรษฐกิจที่ขับเคลื่อนการค้า AI ยังคงไม่เปลี่ยนแปลง”", "ถึงกระนั้น ความกังวลเรื่องตลาดที่อาจชะลอตัวก็ยังคงมีอยู่ โดยเฉพาะเมื่อการทำ IPO ของ Anthropic ซึ่งคาดว่าจะเป็นการเสนอขายหุ้นครั้งใหญ่ที่สุดตลอดกาล มีกำหนดการในวันพฤหัสบดีนี้ โดย Nvidia ได้ตกลงที่จะซื้อหุ้นของ Anthropic มูลค่า 1 หมื่นล้านดอลลาร์ผ่านการเสนอขายหุ้นแบบส่วนตัว นอกเหนือจากเงินทุนสนับสนุนอีก 1 หมื่นล้านดอลลาร์ที่ Nvidia ได้ให้คำมั่นไว้เมื่อปีที่แล้ว"], "link": "https://www.theverge.com/report/1035465/nvidia-says-it-will-not-reinstate-jensen-huang-as-ceo", "canonical_link": "https://www.theverge.com/report/1035465/nvidia-says-it-will-not-reinstate-jensen-huang-as-ceo", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Nvidia_Jensen_huang_02.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score":  "พรรคเดโมแครตเร่งปรับทัพหลังคว้าชัยถล่มทลาย มุ่งเน้นแก้ปัญหาปากท้องและคุมเข้ม AI", "tag": "Technology", "sub_tag": "POLICY", "bullet_points": ["กลุ่มเดโมแครตสายกลางจัดงานประชุม 'What’s Next' ในเดนเวอร์ เพื่อวางแนวทางบริหารประเทศหลังได้รับชัยชนะในการเลือกตั้งกลางเทอม", "พรรคเดโมแครตปรับกลยุทธ์ใหม่โดยหันมาให้ความสำคัญกับปัญหาเศรษฐกิจและค่าครองชีพ แทนที่การเมืองเชิงอัตลักษณ์แบบเดิม", "มีการถกเถียงเรื่องการกำกับดูแล AI อย่างจริงจัง โดย สว. Elissa Slotkin เสนอให้ตั้งคณะกรรมาธิการร่วมเพื่อควบคุมเทคโนโลยี AI ให้เหมือนกับการกำกับดูแลพลังงานนิวเคลียร์", "แม้จะประกาศความเป็นเอกภาพ แต่ภายในงานยังคงมีความขัดแย้งแฝงอยู่ ทั้งเรื่องอิทธิพลของกลุ่มทุนใหญ่ในพรรค และความเห็นต่างระหว่างกลุ่มก้าวหน้ากับกลุ่มสายกลาง", "ผลสำรวจจากกลุ่ม Tomorrow Together ชี้ว่าผู้มีสิทธิเลือกตั้งเริ่มมีความกังวลต่อ AI และมองว่าบริษัทเทคโนโลยีไม่สามารถกำกับดูแลตนเองได้"], "full_paragraphs": ["ณ สนามบินนานาชาติเดนเวอร์ ในช่วงบ่ายวันเสาร์ที่แสนวุ่นวาย ผมมีโอกาสได้นั่งอยู่ใกล้กับนายกเทศมนตรีเมืองมินนิอาโพลิส Jacob Frey ซึ่งเพิ่งเดินทางกลับจากงานประชุม 'What’s Next' ที่จัดโดยกลุ่ม Majority Democrats ซึ่งเป็นกลุ่มที่มุ่งเน้นการกำหนดทิศทางใหม่ให้กับพรรคเดโมแครตที่เพิ่งคว้าชัยชนะมาได้อย่างน่าประหลาดใจ", "Frey ซึ่งเป็นที่รู้จักในระดับประเทศจากเหตุการณ์ Operation Metro Surge ของ ICE ได้เดินทางมาร่วมงานเพื่อรับฟังมากกว่าที่จะขึ้นพูด โดยเขากล่าวว่า 'ผมไม่เคยมางานแบบนี้มาก่อน' และหวังว่าพรรคเดโมแครตจะทำสองสิ่งด้วยอำนาจที่มีอยู่ในมือคือ 'หนึ่ง ต้องดำเนินการด้วยความเร่งด่วน และสอง อย่าทำมันพัง' ซึ่งผู้เข้าร่วมงานคนอื่นต่างเห็นพ้องด้วยอย่างหนักแน่น", "พรรคเดโมแครตดูเหมือนจะเรียนรู้จากความผิดพลาดของพรรครีพับลิกันในปี 2024 โดยมองว่าชัยชนะครั้งนี้ไม่ได้เกิดจากกระแสสังคมหรือประเด็น DEI แต่เกิดจากปัญหาเศรษฐกิจที่รุมเร้า ผู้มีสิทธิเลือกตั้งปฏิเสธศูนย์ข้อมูล (Data Centers) และสงคราม โดยหันไปเลือกฝ่ายที่สัญญาว่าจะตอบโจทย์ความต้องการพื้นฐานในการดำรงชีวิต ซึ่งเป็นเรื่องของราคาน้ำมันและค่าอาหารเป็นหลัก", "Majority Democrats วางตัวเป็นทางเลือกใหม่แทนที่กลุ่มการเมืองเดิมที่ไร้ประสิทธิภาพ ทั้งกลุ่มผู้มีอำนาจสูงวัย กลุ่มนักเคลื่อนไหวฝ่ายซ้าย และกลุ่ม MAGA ฝ่ายขวา โดยพรรคต้องการสื่อสารว่าพวกเขาเปลี่ยนไปแล้ว ไม่ใช่พรรคที่เน้นการเมืองเชิงอัตลักษณ์แบบเดิม แต่เน้นเรื่องความสามารถในการจ่าย (Affordability) อย่างจริงจัง", "บรรยากาศภายในงานเต็มไปด้วยสัญลักษณ์ที่สะท้อนถึงความพยายามในการเข้าถึงคนรุ่นใหม่ มีการจำหน่ายเสื้อผ้าและหมวกที่มีข้อความเชิงเสียดสีและเรียกร้องให้มีการจัดการเรื่องภาษี รวมถึงคำถามเชิงปรัชญาเกี่ยวกับบทบาทของหุ่นยนต์และ AI ในโลกการทำงาน ซึ่งสะท้อนถึงความพยายามในการสร้างภาพลักษณ์ใหม่ของพรรค", "อย่างไรก็ตาม ภาพลักษณ์ของความสามัคคีถูกทำลายลงเมื่อกลุ่มผู้ประท้วงตะโกนขัดจังหวะการปราศรัยของ Hakeem Jeffries ว่าที่ประธานสภาผู้แทนราษฎร โดยเรียกร้องให้มีการผลักดัน Green New Deal และการคว่ำบาตรอาวุธ ซึ่ง Jeffries ตอบโต้ด้วยความใจเย็นว่า 'ผมมาจากบรูคลิน เรื่องแค่นี้ถือว่าเบามาก' ก่อนที่การสัมภาษณ์จะดำเนินต่อไป", "สว. Elissa Slotkin จากมิชิแกนกล่าวถึงความเห็นต่างภายในพรรคว่า แม้เธอและว่าที่ สว. Abdul El-Sayed จะมีความเห็นไม่ตรงกันในหลายเรื่อง แต่ทั้งคู่เห็นพ้องในประเด็นสำคัญคือการสร้างชนชั้นกลางให้เข้มแข็ง 'เมื่อผมเห็นเจ้าหน้าที่ที่ได้รับเลือกใช้เวลาไปกับการต่อสู้ระหว่างฝ่ายก้าวหน้ากับฝ่ายสายกลาง ผมรู้เลยว่าคนนั้นไม่ได้เรียนรู้อะไรเลยจากการเลือกตั้งครั้งนี้'", "Lis Smith ที่ปรึกษาของ Majority Democrats ระบุว่าชัยชนะครั้งนี้ไม่ใช่สัญญาณว่าผู้มีสิทธิเลือกตั้งชอบสไตล์การเมืองแบบใดแบบหนึ่ง แต่เป็นเพราะไม่มีวิธีเดียวที่จะเป็นเดโมแครตได้ ซึ่งเป็นกุญแจสำคัญสู่ชัยชนะครั้งใหญ่ แต่ก็ยังมีคำถามทิ้งท้ายว่า เมื่อถึงเวลาต้องบริหารประเทศจริงๆ พรรคจะยังคงรักษาความเป็นเอกภาพนี้ไว้ได้หรือไม่", "ความตึงเครียดภายในงานยังคงมีอยู่ ทั้งการท้าชิงตำแหน่งผู้นำเสียงข้างมากในวุฒิสภาของ สว. Chris Van Hollen ต่อ สว. Chuck Schumer รวมถึงประเด็นที่งานประชุมได้รับเงินสนับสนุนจาก Stephen Mandel มหาเศรษฐีนักลงทุนในกลุ่ม AI ซึ่งขัดกับวาทกรรมเรื่องการนำ 'เงินก้อนโต' ออกจากการเมือง", "Ro Khanna สส. จากซิลิคอนวัลเลย์กล่าวบนเวทีว่า เขาต้องการพรรคที่เปิดกว้างแต่ต้องไม่ตื้นเขิน โดยเรียกร้องให้สภาที่เดโมแครตครองเสียงข้างมากผลักดันนโยบาย Medicare for All, การให้สัญชาติแก่ผู้อพยพ, การยุบ ICE และการตัดงบประมาณช่วยเหลืออิสราเอล ซึ่งได้รับเสียงเชียร์อย่างล้นหลามจากผู้เข้าร่วมงาน", "ในขณะเดียวกัน มีการจัดงาน 'AI safety breakfast' ซึ่งผู้เชี่ยวชาญด้านการกำกับดูแลเทคโนโลยีตั้งข้อสังเกตว่า งานนี้เป็นส่วนหนึ่งของความพยายามในการปรับภาพลักษณ์ของกลุ่มที่สนับสนุนการกำกับดูแล AI โดยมองว่าผู้มีสิทธิเลือกตั้งเริ่มไม่พอใจกับผลกระทบของศูนย์ข้อมูลและ AI ที่ส่งผลต่อค่าสาธารณูปโภคและตลาดแรงงาน", "สว. Slotkin ได้เรียกร้องให้มีการจัดตั้งคณะกรรมาธิการร่วมสองสภาเพื่อกำกับดูแล AI โดยเปรียบเทียบกับหน่วยงานที่เคยกำกับดูแลพลังงานนิวเคลียร์ในอดีต โดยเธอกล่าวว่า 'ในขณะที่เรามัวแต่ทะเลาะกันเองระหว่างเดโมแครตและรีพับลิกัน เรากำลังเสียโอกาส และเรายังไม่ได้ทำในสิ่งที่จำเป็นต้องทำเกี่ยวกับ AI'", "Rob Flaherty ผู้ร่วมก่อตั้งกลุ่ม Tomorrow Together ระบุว่าผลสำรวจชี้ให้เห็นว่าผู้มีสิทธิเลือกตั้งไม่เชื่อมั่นว่าบริษัทเทคโนโลยีจะสามารถกำกับดูแลตนเองได้ และพรรคเดโมแครตมีหน้าที่ในการเปลี่ยนความโกรธแค้นของประชาชนให้กลายเป็นการกระทำที่ช่วยบรรเทาความเจ็บปวดที่พวกเขาได้รับ", "ในช่วงท้ายของการประชุม ผมได้พบกับ Uriel Espinoza ผู้มีสิทธิเลือกตั้งสายกลางที่นิยามตนเองว่าเป็นผู้ประกอบการ เขาต้องการเห็นการปฏิรูปการเข้าเมือง ระบบสาธารณสุขถ้วนหน้า และเศรษฐกิจที่ไม่เอารัดเอาเปรียบคนทำงาน โดยเขากล่าวว่า 'ผมเป็นคนสนับสนุนธุรกิจ สนับสนุนเศรษฐกิจ แต่ในตอนนี้ ผมสนับสนุนผลลัพธ์ที่จับต้องได้จริง'"], "link": "https://www.theverge.com/policy/1035869/whats-next-majority-democrats-conference-denver-jeffries", "canonical_link": "https://www.theverge.com/policy/1035869/whats-next-majority-democrats-conference-denver-jeffries", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2304463879.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2305003735.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/20261112-120741_WN_DM_0017.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/20261113-123317_WN_KL_0123.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794947400, "published_at": "2026-11-17T20:30:00Z", "published_th": "18 พ.ย. 2026 • 03:30 น.", "category_hint": "Technology"}, {"id": 1795054531595, "guid": "https://www.theverge.com/?p=1035437", "original_title": "The iPhone Duo feels far more intuitive with Apple’s new face unlock", "thai_title": "iPhone Duo ใช้งานสะดวกขึ้นด้วยฟีเจอร์ปลดล็อกด้วยใบหน้าแบบใหม่จาก Apple", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Apple เพิ่มฟีเจอร์ 'Unlock with Front Camera' ใน iOS 27.3 beta สำหรับ iPhone Duo เพื่อแก้ปัญหาการใช้งาน Touch ID ที่ไม่สะดวก", "ระบบนี้ไม่ใช่ Face ID เต็มรูปแบบเนื่องจากข้อจำกัดด้านฮาร์ดแวร์ของหน้าจอพับ จึงไม่มีเซนเซอร์ TrueDepth และมีความปลอดภัยต่ำกว่า", "ฟีเจอร์นี้มีข้อจำกัดด้านความปลอดภัย เช่น ใช้ได้เฉพาะการปลดล็อกหน้าจอหลักเท่านั้น ไม่สามารถใช้ยืนยันตัวตนใน Apple Pay หรือแอปพลิเคชันได้", "ระบบจะบังคับให้ใช้ Touch ID หรือรหัสผ่านทุกๆ 45 นาที และยังไม่รองรับการใช้งานผ่านกล้องใต้หน้าจอ (Under-display camera) ด้านใน"], "full_paragraphs": ["Apple กำลังทดสอบการเพิ่มฟีเจอร์ปลดล็อกด้วยใบหน้าให้กับ iPhone Duo ซึ่งไม่ใช่ระบบ Face ID เต็มรูปแบบ แต่เป็นระบบที่เรียบง่ายและมีความปลอดภัยน้อยกว่า อย่างไรก็ตาม จากการทดสอบพบว่ามันทำงานได้ดีเยี่ยม และแม้จะมีข้อจำกัดด้านความปลอดภัยที่ Apple กำหนดไว้ แต่มันก็ทำให้การใช้งาน Duo รวดเร็วและสะดวกสบายกว่าการพึ่งพา Touch ID เพียงอย่างเดียว ซึ่งถือเป็นการแก้ไขปัญหาที่ผู้ใช้งานหลายคนเคยบ่นถึงได้สำเร็จ", "ด้วยสถาปัตยกรรมแบบพับได้ของ Duo ทำให้ Apple ไม่สามารถติดตั้งชุดเซนเซอร์ Face ID เต็มรูปแบบเหมือนกับ iPhone รุ่นอื่นๆ ได้ (แม้จะมีรายงานว่าบริษัทหวังว่าจะเปลี่ยนสิ่งนี้ได้ในรุ่นที่สองก็ตาม) แทนที่จะเป็นเช่นนั้น มันจึงมีเพียงกล้องเซลฟี่สองตัว คือตัวหนึ่งบนหน้าจอด้านนอกและอีกตัวหนึ่งที่ซ่อนอยู่ใต้หน้าจอด้านใน ซึ่งไม่มีตัวใดรองรับ Face ID เต็มรูปแบบ แต่หลังจากได้รับเสียงสะท้อนจากนักรีวิวและผู้ใช้งานกลุ่มแรกว่าการใช้ Touch ID เพียงอย่างเดียวนั้นดูยุ่งยาก Apple จึงได้ยอมปรับเปลี่ยนในที่สุด", "iOS 27.3 เวอร์ชัน Developer Beta ล่าสุด ได้แนะนำตัวเลือกใหม่ที่เรียกว่า “Unlock with Front Camera” โดย Apple ระมัดระวังที่จะไม่เรียกมันว่า Face ID การตั้งค่ามีความคล้ายคลึงกัน แต่แทนที่จะต้องหมุนศีรษะเป็นวงกลมช้าๆ คุณเพียงแค่ต้องหันศีรษะไปทางซ้าย ขวา ขึ้น และลงเท่านั้น กระบวนการนี้ใช้เวลาประมาณห้าวินาที ซึ่งผู้เขียนสามารถตั้งค่าได้สำเร็จแม้ในขณะที่อยู่บนรถบัสในลอนดอนที่มีการสั่นสะเทือน", "ฟีเจอร์ปลดล็อกด้วยใบหน้าใหม่นี้มอบความสะดวกสบายด้วยความเร็วในการปลดล็อกเพียงครึ่งวินาที แต่ Apple ได้เตือนระหว่างการตั้งค่าว่าระบบนี้ “ไม่มีความปลอดภัยเท่ากับ Touch ID หรือ Face ID” เนื่องจากขาดแผนผังความลึกแบบอินฟราเรดจากกล้อง TrueDepth นั่นหมายความว่ามีความเป็นไปได้ที่จะถูกหลอกด้วยภาพถ่ายหรือคลิปวิดีโอ แต่ผู้เขียนสามารถทำสำเร็จเพียงครั้งเดียวจากการทดลองกว่า 20 ครั้ง สิ่งสำคัญคือหลังจากความพยายามหลอกระบบด้วยรูปถ่ายล้มเหลว โทรศัพท์จะบังคับให้ใช้ Touch ID ในการเข้าสู่ระบบครั้งถัดไป ซึ่งระบบจะไม่เรียกใช้หากตรวจไม่พบใบหน้าใดๆ ในเฟรม นั่นหมายความว่าผู้ที่จะผ่านระบบนี้ได้จะต้องใช้ใบหน้าปลอมที่สมบูรณ์แบบตั้งแต่ครั้งแรก", "การขาดเซนเซอร์ TrueDepth ยังทำให้เกิดข้อจำกัดในที่แสงน้อย แม้ว่าประสิทธิภาพจะดีกว่าที่คาดไว้ก็ตาม ในขณะที่เดินไปรอบๆ หลังพระอาทิตย์ตกดิน ผู้เขียนต้องมองหาจุดที่มืดเป็นพิเศษก่อนที่จะพบจุดที่การปลดล็อกล้มเหลว เช่น การหลบอยู่หลังรถบรรทุกบนถนนที่มีต้นไม้หนาทึบซึ่งแสงไฟถนนส่องไม่ถึง แม้ระบบจะล้มเหลวในที่สุด แต่ก็ต้องเป็นที่ที่มืดมากจริงๆ ถึงจะเกิดเหตุการณ์เช่นนั้น", "Apple ได้กำหนดข้อจำกัดอื่นๆ เพื่อสะท้อนถึงความปลอดภัยที่ต่ำกว่าของระบบใหม่นี้ คุณสามารถใช้มันเพื่อปลดล็อกโทรศัพท์จากหน้าจอล็อกได้เท่านั้น ดังนั้นคุณจะต้องกลับไปใช้ Touch ID หรือรหัสผ่านเพื่อใช้งาน Apple Pay, ติดตั้งหรือเข้าสู่ระบบแอปพลิเคชัน หรือผ่านหน้าจออื่นๆ ที่โทรศัพท์ต้องการข้อมูลยืนยันตัวตน", "ข้อจำกัดนี้คล้ายกับโทรศัพท์ Android ส่วนใหญ่ที่มีระบบปลดล็อกด้วยใบหน้าผ่านกล้อง มีเพียงโทรศัพท์ Pixel ของ Google เท่านั้นที่อนุญาตให้คุณทำการซื้อสินค้าหรือเข้าสู่ระบบแอปพลิเคชันโดยใช้ Face Unlock ได้ ซึ่ง Google ระบุว่าเป็นเพราะเทคนิคซอฟต์แวร์ที่ทำให้ระบบมีความปลอดภัยมากกว่าทางเลือกอื่นๆ บน Android", "ข้อจำกัดที่น่ารำคาญกว่าของ iPhone Duo คือช่วงเวลาที่คุณสามารถใช้ฟีเจอร์นี้ได้ โดยระบบจะทำงานครั้งละ 45 นาทีเท่านั้น หลังจากนั้นคุณจะต้องยืนยันตัวตนด้วย Touch ID หรือรหัสผ่านในการปลดล็อกครั้งถัดไป ที่แย่กว่านั้นคือมันไม่ทำงานเลยกับกล้องเซลฟี่ใต้หน้าจอที่อยู่ด้านใน Apple ไม่ได้ระบุเหตุผลว่าทำไม แต่สันนิษฐานว่าบริษัทรู้สึกว่าความละเอียดและคุณภาพที่ต่ำกว่าของกล้องตัวนั้นทำให้ไม่เหมาะกับการปลดล็อกด้วยใบหน้า", "ผู้เขียนอยากให้ Apple ผ่อนปรนข้อจำกัดลงอีกสักนิด เพราะ 45 นาทีไม่ใช่ระยะเวลาที่นานนักก่อนที่จะต้องกลับไปใช้ Touch ID อีกครั้ง และผู้เขียนมั่นใจว่าจะลืมบ่อยครั้งว่าหน้าจอด้านในต้องใช้ลายนิ้วมือ แต่ Duo ก็ให้ความรู้สึกที่สะดวกสบายในการใช้งานมากขึ้น ทำให้สามารถเข้าถึงโทรศัพท์ได้ทันทีแทนที่จะต้องคลำหาเซนเซอร์ลายนิ้วมือ แม้จะเป็นเรื่องเล็กน้อย แต่นี่เป็นสัญญาณที่ดีว่า Apple กำลังรับฟังผู้ใช้งานกลุ่มแรกของ Duo และเต็มใจที่จะปรับเปลี่ยนวิสัยทัศน์ที่ยิ่งใหญ่ของตนเพื่อให้เข้ากับโลกความเป็นจริง", "ในขณะนี้ ฟีเจอร์ปลดล็อกด้วยใบหน้ายังจำกัดอยู่แค่ในเวอร์ชัน Developer Beta แต่คาดว่าจะเปิดตัวในเวอร์ชัน Public Beta ภายในไม่กี่วัน และหากโชคดีจะเปิดตัวเต็มรูปแบบพร้อมกับ iOS 27.3 ในเดือนธันวาคมนี้ ตอนนี้เราจะสามารถขอตัวเลือกเดียวกันนี้สำหรับ MacBook และ iPad ได้หรือไม่?"], "link": "https://www.theverge.com/tech/1035437/iphone-duo-face-unlock-front-camera-hands-on", "canonical_link": "https://www.theverge.com/tech/1035437/iphone-duo-face-unlock-front-camera-hands-on", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/iphone-duo-face-unlock-2.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/01/DOM_BLURPLE-1.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/iphone-duo-face-unlock-3.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/iphone-duo-face-unlock-4.jpg?quality=90&strip=all&crop=0%2C0.011361054305837%2C100%2C99.977277891388&w=1200", "https://platf adgets"}, {"id": 1795068052309, "guid": "https://www.gsmarena.com/honor_confirms_which_magic9_models_will_be_available_in_the_uk-news-75531.php", "original_title": "Honor confirms which Magic9 models will be available in the UK", "thai_title": "Honor ยืนยันรุ่นสมาร์ตโฟนตระกูล Magic9 ที่จะวางจำหน่ายในสหราชอาณาจักร เตรียมเปิดตัวมกราคมนี้", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["Honor ยืนยันเตรียมนำสมาร์ตโฟนตระกูล Magic9 สองรุ่น ได้แก่ Magic9 Pro Max และ Magic9 Lite+ เข้ามาวางจำหน่ายในสหราชอาณาจักร", "การประกาศดังกล่าวเกิดขึ้นผ่านทางบัญชี X ของ Honor UK พร้อมเผยภาพเบื้องหลังการเตรียมงานอีเวนต์ในลอนดอน", "Magic9 Lite+ เป็นรุ่นที่ยังไม่เปิดตัวอย่างเป็นทางการ แต่คาดว่าจะเป็นรุ่นเดียวกับ Honor X9e Pro ที่มาพร้อมชิปเซ็ต Snapdragon 6 Gen 5", "Magic9 Pro Max จัดเต็มด้วยชิป Snapdragon 8 Elite Extreme Gen 6 และกล้องหลักความละเอียดสูงถึง 200MP", "งานเปิดตัวอย่างเป็นทางการของตระกูล Magic9 ในสหราชอาณาจักรจะมีขึ้นในเดือนมกราคมปีหน้า"], "full_paragraphs": ["หลังจากที่ Honor ได้เปิดตัว Magic9, Magic9 Super และ Magic9 Pro Max ในประเทศจีนไปเมื่อช่วงปลายเดือนกันยายนที่ผ่านมา ไม่กี่สัปดาห์ต่อมาเว็บไซต์ของ Honor ในสหราชอาณาจักรก็ได้เผยข้อมูลว่าซีรีส์ Magic9 จะเดินทางมาถึงตลาดอังกฤษในเดือนมกราคม โดยในขณะนั้นหน้าเว็บไซต์แสดงข้อมูลเพียงแค่รุ่น Pro Max เท่านั้น แต่การใช้คำว่า \"Magic9 series\" ก็ทำให้คาดการณ์ได้ว่าจะมีรุ่นอื่นตามมาด้วย และในที่สุดเราก็ได้ทราบแล้วว่ารุ่นที่เหลือคือรุ่นใด", "วันนี้ Honor UK ได้โพสต์ผ่านแพลตฟอร์ม X เพื่อแชร์ภาพเบื้องหลังการเตรียมงานอีเวนต์สำหรับซีรีส์ Magic9 ในกรุงลอนดอน โดยทางบริษัทระบุว่าสมาร์ตโฟนสองรุ่นที่จะนำเข้ามาจำหน่ายในสหราชอาณาจักรคือ Magic9 Pro Max และ Magic9 Lite+ ซึ่งเป็นที่น่าสังเกตว่าไม่มีรุ่นมาตรฐานอย่าง Magic9 รวมอยู่ด้วย ทั้งนี้ Honor UK ได้ตอบกลับแฟนคลับว่า \"งานเปิดตัวเต็มรูปแบบ\" จะยังคงมีขึ้นในเดือนมกราคม ดังนั้นการรวมตัวกันที่ลอนดอนในครั้งนี้จึงดูเหมือนจะเป็นเพียงการจัดงานพรีวิวเรียกน้ำย่อยก่อนเท่านั้น", "สำหรับ Magic9 Lite+ นั้นยังไม่มีการประกาศเปิดตัวอย่างเป็นทางการ แต่เคยปรากฏข้อมูลบน Google Play Console เมื่อเดือนที่ : 1795065341557, "guid": "https://9to5google.com/?p=738712", "original_title": "New gradient icons roll out to Google Messages & Contacts", "thai_title": "Google อัปเดตไอคอนใหม่ในแอป Messages และ Contacts ปรับดีไซน์ไล่เฉดสีให้ดูทันสมัยยิ่งขึ้น", "tag": "Gadgets", "sub_tag": "GOOGLE", "bullet_points": ["Google เสร็จสิ้นการอัปเดตไอคอนใหม่ในแอปสื่อสารหลัก 3 แอป ได้แก่ Messages, Contacts และ Phone", "ดีไซน์ใหม่เน้นการใช้เอฟเฟกต์ไล่เฉดสี (Gradient) และโทนสีฟ้าที่สว่างขึ้น เพื่อให้ไอคอนดูทันสมัยและมีน้ำหนักเบาลง", "รูปทรงพื้นฐานของไอคอนยังคงเดิม แต่มีการปรับขนาดให้ใหญ่ขึ้นและเติมเต็มพื้นที่วงกลมได้ดียิ่งขึ้น", "การเปลี่ยนแปลงนี้ใช้เวลาดำเนินการประมาณ 2 สัปดาห์นับตั้งแต่ประกาศจนถึงการปล่อยอัปเดตให้ผู้ใช้งานทั่วไปครบถ้วน"], "full_paragraphs": ["ในสัปดาห์นี้ Google ได้ดำเนินการอัปเดตไอคอนใหม่ในรูปแบบไล่เฉดสี (Gradient) ให้กับแอปพลิเคชัน Messages และ Contacts เป็นที่เรียบร้อยแล้ว ซึ่งถือเป็นการปิดท้ายการปรับโฉมไอคอนในกลุ่มแอปสื่อสารหลักของบริษัท", "สำหรับรูปทรงของไอคอนในทั้ง 3 แอปยังคงรูปแบบเดิมไว้ โดยไอคอน Contacts ยังคงเป็นรูปคน (ศีรษะและลำตัว), Messages ยังคงเป็นรูปช่องแชทซ้อนทับกัน และ Phone เป็นรูปหูโทรศัพท์ อย่างไรก็ตาม ไอคอนเหล่านี้ได้รับการปรับขนาดให้ใหญ่ขึ้นเล็กน้อยเพื่อให้เติมเต็มพื้นที่วงกลมที่เป็นพื้นหลังได้สมบูรณ์ยิ่งขึ้น โดยการปรับเปลี่ยนดีไซน์ในครั้งนี้ไม่ได้ส่งผลกระทบต่อการใช้งานแต่อย่างใด", "การออกแบบใหม่นี้มีการเลือกใช้เฉดสีฟ้าที่อ่อนลงกว่าเดิม พร้อมทั้งใส่เอฟเฟกต์ไล่เฉดสีเข้าไป ส่งผลให้โลโก้ดูมีความทันสมัยและให้ความรู้สึกที่เบาสบายตามากขึ้น ไม่ดูหนักจนเกินไปเหมือนดีไซน์ก่อนหน้า", "Google ได้อธิบายถึงไอคอนใหม่ของแอป Messages ว่ามีความ “คมชัด สดใส และชัดเจนยิ่งกว่าที่เคยเป็นมา” ทั้งนี้ ในส่วนของแอป Messages ซึ่งเป็นไคลเอนต์สำหรับ SMS/RCS นั้น ไม่ได้มีการเปลี่ยนแปลงอื่นใดเพิ่มเติมพร้อมกับการปรับดีไซน์โลโก้ในสัปดาห์นี้ โดยการปรับโฉมหน้าโฮมเพจครั้งใหญ่ยังคงอยู่ในขั้นตอนการทดสอบในช่องทางเบต้า (Beta channel) เท่านั้น", "ในส่วนของแอป Google Contacts ถือเป็นแอปสุดท้ายในกลุ่ม Android ที่ได้รับการปรับโฉมไอคอน โดยมาพร้อมกับเวอร์ชัน 4.92.26.x ซึ่งเริ่มปล่อยอัปเดตเมื่อช่ s": [], "review_score": "", "published_ts": 1795054262, "published_at": "2026-11-19T02:11:02Z", "published_th": "19 พ.ย. 2026 • 09:11 น.", "category_hint": "Gadgets"}, {"id": 1795050057509, "guid": "https://9to5mac.com/?p=1081475", "original_title": "Siri Modular Apple Watch face gains two new styles with watchOS 27.3", "thai_title": "หน้าปัด Siri Modular บน Apple Watch เพิ่มสไตล์ใหม่ 2 รูปแบบใน watchOS 27.3", "tag": "Gadgets", "sub_tag": "WEARABLES", "bullet_points": ["watchOS 27.3 เวอร์ชันเบต้า เพิ่มสไตล์ใหม่ให้กับหน้าปัด Siri Modular ทำให้ปัจจุบันมีตัวเลือกการปรับแต่งรวมทั้งหมด 5 รูปแบบ", "สไตล์ใหม่เน้นการเข้าถึงฟีเจอร์ AI ของ Siri ได้รวดเร็วขึ้น ผ่านโมดูลรูปทรงแคปซูลที่มีปุ่มลัด 3 ปุ่ม", "รองรับฟีเจอร์ใหม่บน Apple Watch Series 12 และ Apple Watch Ultra 4 ได้แก่ Siri Recap และ Live Rewind", "Siri Recap ช่วยสรุปเนื้อหาเสียงเป็นข้อความ ส่วน Live Rewind ช่วยให้ผู้ใช้ดูคำบรรยายย้อนหลัง 15 วินาทีได้", "คาดการณ์ว่า watchOS 27.3 จะเปิดให้ใช้งานอย่างเป็นทางการภายในเดือนธันวาคมนี้"], "full_paragraphs": ["Siri Modular ซึ่งเป็นหน้าปัดใหม่บน Apple Watch ใน watchOS 27 กำลังได้รับการอัปเดตสไตล์ใหม่เพิ่มเติม โดยใน watchOS 27.3 เวอร์ชันเบต้าปัจจุบัน ได้มีการเพิ่มตัวเลือกสไตล์เข้ามาอีก 2 รูปแบบ ทำให้ผู้ใช้งานมีตัวเลือกในการปรับแต่งข้อมูลที่จะปรากฏบนหน้าปัด Siri Modular รวมทั้งหมด 5 รูปแบบด้วยกัน", "เดิมที Siri Modular เปิดตัวมาพร้อมกับสไตล์เริ่มต้น 3 รูปแบบ ซึ่งแต่ละแบบรองรับการแสดงผล Complication แบบเส้นเล็กๆ เหนือตำแหน่งเวลา โดยสไตล์ดั้งเดิมทั้ง 3 แบบประกอบด้วย: นาฬิกาดิจิทัลขนาดใหญ่พร้อม Complication แบบวงกลม 3 จุด, นาฬิกาดิจิทัลขนาดกะทัดรัดพร้อมช่อง Smart Stack และ Complication แบบวงกลม 3 จุด และสุดท้ายคือนาฬิกาดิจิทัลขนาดใหญ่พร้อมช่อง Smart Stack", "ใน watchOS 27.3 ทาง Apple ได้เปิดตัวฟีเจอร์ Siri ใหม่ 2 อย่างที่ทำงานร่วมกับ Apple Watch Series 12 และ Apple Watch Ultra 4 อย่างเต็มรูปแบบ อย่างแรกคือ 'Siri Recap' ซึ่งใช้ Apple Watch ในการแปลงข้อมูลเสียงให้กลายเป็นสรุปข้อความระดับสูง และอย่างที่สองคือ 'Live Rewind' ซึ่งช่วยให้คุณสามารถดูคำบรรยาย (Transcript) ของบทสนทนาในช่วง 15 วินาทีล่าสุดได้", "สไตล์ใหม่ทั้ง 2 รูปแบบของหน้าปัด Siri Modular ถูกออกแบบมาเพื่อช่วยดึงข้อมูลสำคัญ 3 ประการขึ้นมาแสดงผล ได้แก่ การเรียกใช้งาน Siri, การดูบทสนทนากับ Siri และการดูสรุป Siri Recap บน Apple Watch", "สไตล์ใหม่เหล่านี้มาพร้อมกับโมดูลรูปทรงแคปซูล (pill-shaped) ซึ่งประกอบด้วยปุ่มลัดไอคอนที่สามารถกดเพื่อเข้าสู่บทสนทนากับ Siri โดยตรง, เรียกใช้งาน Siri AI หรือเข้าสู่หน้า Siri Recaps ภายในแอป Siri ได้ทันที", "สำหรับรูปแบบสไตล์ใหม่นั้น แบบหนึ่งจะแสดงนาฬิกาดิจิทัลขนาดใหญ่คู่กับโมดูล Siri แบบ 3 ปุ่ม ส่วนอีกแบบหนึ่งจะเป็นนาฬิกาดิจิทัลขนาดกะทัดรัดที่มาพร้อมกับช่อง Smart Stack และโมดูล Siri แบบ 3 ปุ่มใหม่นี้ นอกจากนี้ หากคุณเลือกใช้การตั้งค่าแบบ Complication วงกลม 3 จุด คุณยังสามารถกำหนดไอคอน Siri เพื่อเรียกใช้งาน Siri AI ได้อีกด้วย", "ปัจจุบัน watchOS 27.3 ยังคงอยู่ในช่วงการทดสอบเวอร์ชันเบต้า และคาดว่าจะมีการปล่อยอัปเดตอย่างเป็นทางการให้ผู้ใช้งานทั่วไปได้ใช้งานภายในเดือนธันวาคมนี้"], "link": "https://9to5mac.com/2026/11/18/siri-modular-apple-watch-face-gains-two-new-styles-with-watchos-27-3/", "canonical_link": "https://9to5mac.com/2026/11/18/siri-modular-apple-watch-face-gains-two-new-styles-with-watchos-27-3", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2026/10/ultra-4-siri-modular-apple-watch.webp?w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795049362, "published_at": "2026-11-19T00:49:22Z", "published_th": "19 พ.ย. 2026 • 07:49 น.", "category_hint": "Gadgets"}, {"id": 1795049155316, "guid": "https://www.gsmarena.com/iphone_20_pro_may_bring_back_titanium-news-75535.php", "original_title": "iPhone 20 Pro may bring back titanium", "thai_title": "ลือสะพัด! iPhone 20 Pro อาจหวนกลับมาใช้เฟรมไทเทเนียมอีกครั้ง", "tag": "Gadgets", "sub_tag": "WEARABLES", "bullet_points": ["Apple อาจเปลี่ยนวัสดุเฟรมของ iPhone 20 Pro กลับมาใช้ไทเทเนียม หลังจากเปลี่ยนไปใช้อะลูมิเนียมในรุ่น iPhone 17 Pro และ 18 Pro", "ข้อมูลจากแหล่งข่าวระบุว่า iPhone 20 Pro จะมาพร้อมดีไซน์ตัวเครื่องที่โค้งมนมากขึ้น โดยได้รับแรงบันดาลใจมาจาก iPhone Air", "งานวิศวกรรมในช่วงเริ่มต้นสำหรับการพัฒนาเฟรมไทเทเนียมได้เริ่มดำเนินการแล้ว", "คาดการณ์ว่า Apple จะเปิดตัว iPhone 20 Pro series ในช่วงเดือนกันยายน ปี 2027"], "full_paragraphs": ["Apple ได้ตัดสินใจเปลี่ยนผ่านจากวัสดุไทเทเนียมมาเป็นอะลูมิเนียมสำหรับเฟรมของ iPhone 17 Pro และ 17 Pro Max และยังคงใช้วัสดุเดิมนี้ต่อเนื่องมาจนถึง iPhone 18 Pro และ 18 Pro Max ในปีนี้ อย่างไรก็ตาม ดูเหมือนว่าอะลูมิเนียมอาจจะไม่ได้อยู่บนสมาร์ตโฟนระดับเรือธงของ Apple ไปอีกนานนัก", "ในวันนี้ Fixed Focus Digital แหล่งข่าวหลุดชื่อดังได้ออกมาเปิดเผยผ่านทาง Weibo โดยอ้างว่า iPhone 20 Pro จะมาพร้อมกับดีไซน์ตัวเครื่องที่โค้งมน และขณะนี้งานวิศวกรรมในช่วงเริ่มต้นสำหรับการพัฒนาเฟรมไทเทเนียมสำหรับรุ่นดังกล่าวได้เริ่มดำเนินการแล้ว โดยตามคำบอกเล่าของแหล่งข่าวระบุว่า เฟรมของรุ่นนี้จะมีลักษณะคล้ายคลึงกับเฟรมที่ใช้ใน iPhone Air แต่จะมีความโค้งมนมากกว่าอย่างเห็นได้ชัด", "นี่ไม่ใช่ครั้งแรกที่มีการกล่าวถึง iPhone Air ในบริบทที่เกี่ยวข้องกับ iPhone รุ่นฉลองครบรอบ 20 ปีของ Apple ย้อนกลับไปเมื่อเดือนสิงหาคมที่ผ่านมา แหล่งข่าวคนเดียวกันนี้เคยระบุว่า iPhone 20 series จะได้รับเฟรมที่มีลักษณะคล้ายกับรุ่น Air ซึ่งตัวเครื่องที่บางเฉียบนั้นถูกสร้างขึ้นโดยมีโครงสร้างหลักเป็นไทเทเนียม ในขณะเดียวกัน ตามรายงานที่เราได้นำเสนอไปเมื่อช่วงต้นวันนี้ ยังมีแหล่งข่าวอีกรายที่อ้างว่า Apple กำลังพัฒนาสมาร์ตโฟนถึง 4 รุ่นสำหรับปีหน้า โดย 2 ใน 4 รุ่นนั้นจะมีหน้าจอแบบกระจกโค้ง 4 ด้าน (quad-curved glass)", "หากข้อมูลนี้เป็นความจริง จะส่งผลให้ iPhone 17 Pro และ 18 Pro กลายเป็น iPhone รุ่น Pro เพียงสองเจเนอเรชันที่ใช้อะลูมิเนียม นับตั้งแต่ Apple เริ่มนำไทเทเนียมมาใช้ครั้งแรกใน iPhone 15 Pro แม้ว่าโพสต์ดังกล่าวจะไม่ได้ระบุถึงรุ่น Pro Max โดยเฉพาะ แต่ข่าวลือก่อนหน้านี้เคยระบุว่าการปรับเปลี่ยนดีไซน์ครั้งนี้จะถูกนำไปใช้กับ iPhone รุ่น Pro ทั้งสองขนาด อย่างไรก็ตาม คาดว่า iPhone 20 Pro series จะเปิดตัวอย่างเป็นทางการในเดือนกันยายน ปี 2027 ซึ่งยังคงมีเวลาอีกมากสำหรับข้อมูลหลุดเพิ่มเติมที่จะตามมาในระหว่างนี้"], "link": "https://www.gsmarena.com/iphone_20_pro_may_bring_back_titanium-news-75535.php", "canonical_link": "https://www.gsmarena.com/iphone_20_pro_may_bring_back_titanium-news-75535.php", "cover_image_url": "https://fdn.gsmarena.com/imgroot/news/26/11/iphone-20-pro-titanium/gsmarena_000.jpg", "gallery_images": ["https://fdn.gsmarena.com/imgroot/news/26/11/iphone-20-pro-titanium/inline/-1200/gsmarena_001.jpg"], "videos": [], "review_score": "", "published_ts": 1795048262, "published_at": "2026-11-19T00:31:02Z", "published_th": "19 พ.ย. 2026 • 07:31 น.", "category_hint": "Gadgets"}, {"id": 1795045532504, "guid": "https://9to5google.com/?p=738683", "original_title": "Google AI Ultra upgrade adds YouTube Premium Family", "thai_title": "Google อัปเกรดแพ็กเกจ AI Ultra เพิ่มสิทธิ์ใช้งาน YouTube Premium Family", "tag": "Gadgets", "sub_tag": "GOOGLE", "bullet_points": ["Google อัปเกรดแพ็กเกจ AI Ultra ให้ครอบคลุมสิทธิ์การใช้งาน YouTube Premium Family จากเดิมที่จำกัดเฉพาะแผนบุคคล", "สิทธิ์ดังกล่าวรองรับทั้งแพ็กเกจ AI Ultra 5x ราคา 99.99 ดอลลาร์ต่อเดือน และ AI Ultra 20x ราคา 199.99 ดอลลาร์ต่อเดือน", "YouTube Premium Family ช่วยให้ผู้ใช้สามารถเพิ่มสมาชิกในครอบครัวได้สูงสุด 5 คน พร้อมสิทธิประโยชน์ครบถ้วนทั้งการดูวิดีโอแบบไม่มีโฆษณาและ YouTube Music", "การเปลี่ยนแปลงนี้ถือเป็นการตอบรับคำเรียกร้องของผู้ใช้งาน เพื่อเพิ่มความคุ้มค่าให้กับผู้ที่ต้องการพื้นที่จัดเก็บข้อมูลจำนวนมากหรือผู้ใช้งาน Gemini ตัวยง"], "full_paragraphs": ["ในวันนี้ Google ได้ประกาศอัปเกรดแพ็กเกจระดับเรือธงอย่าง AI Ultra โดยเพิ่มสิทธิ์การใช้งาน YouTube Premium Family เข้าไปในแผนบริการ จากเดิมที่เคยจำกัดให้เฉพาะผู้สมัครสมาชิกแผนบุคคล (Individual plan) เท่านั้น", "สิทธิประโยชน์ใหม่นี้จะมอบให้กับผู้ใช้งานทั้งในแพ็กเกจ Google AI Ultra 5x ซึ่งมีราคาอยู่ที่ 99.99 ดอลลาร์ต่อเดือน และแพ็กเกจ AI Ultra 20x ในราคา 199.99 ดอลลาร์ต่อเดือน", "สำหรับบริการ YouTube Premium Family นั้น ปกติจะมีราคาอยู่ที่ 26.99 ดอลลาร์ต่อเดือน โดยอนุญาตให้ผู้ใช้งานสามารถเพิ่มสมาชิกในครอบครัวได้สูงสุดถึง 5 คนภายในครัวเรือนเดียวกัน ซึ่งมาพร้อมกับสิทธิประโยชน์มากมาย เช่น การรับชม YouTube และฟัง YouTube Music แบบไม่มีโฆษณาคั่น รวมถึงการเล่นวิดีโอในพื้นหลัง การดาวน์โหลดเพื่อรับชมแบบออฟไลน์ และฟีเจอร์อื่นๆ อย่าง Ask Music", "ในขณะที่แพ็กเกจ AI Pro ซึ่งมีราคา 19.99 ดอลลาร์ต่อเดือนนั้น จะมอบสิทธิ์ให้เพียง Premium Lite เท่านั้น ซึ่งไม่รวมสิทธิประโยชน์ของ YouTube Music", "Google ระบุว่าฟีเจอร์นี้เป็นสิ่งที่ผู้ใช้งานเรียกร้องเข้ามาเป็นจำนวนมาก การเพิ่มสิทธิ์ดังกล่าวช่วยให้การอัปเกรดจากแผน Pro ไปสู่ Ultra กลายเป็นข้อเสนอที่น่าสนใจยิ่งขึ้น โดยเฉพาะสำหรับผู้ที่ต้องการพื้นที่จัดเก็บข้อมูลเพิ่มเติม หรือเป็นผู้ใช้งาน Gemini ตัวยงที่มีสมาชิกในครอบครัวหลายคน โดยแพ็กเกจ AI Pro มาพร้อมพื้นที่ 10 TB ในราคา 49.99 ดอลลาร์ต่อเดือน ในขณะที่ AI Ultra 5x ให้พื้นที่ถึง 20 TB และ AI Ultra 20x เพิ่มขึ้นไปถึง 30 TB", "ทั้งนี้ เมื่อช่วงปลายเดือนตุลาคมที่ผ่านมา Google ได้เปิดเผยข้อมูลว่า ปัจจุบันมีผู้ใช้งาน YouTube Music และ Premium ทั่วโลกสูงถึง 150 ล้านคน ซึ่งรวมถึงผู้ที่อยู่ในช่วงทดลองใช้งานด้วย"], "link": "https://9to5google.com/2026/11/18/google-ai-ultra-youtube-premium-family/", "canonical_link": "https://9to5google.com/2026/11/18/google-ai-ultra-youtube-premium-family", "cover_image_url": "https://9to5google.com/wp-content/uploads/sites/4/2026/05/youtube-premium.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795045320, "published_at": "2026-11-18T23:42:00Z", "published_th": "19 พ.ย. 2026 • 06:42 น.", "category_hint": "Gadgets"}, {"id": 1795044649494, "guid": "https://www.engadget.com/2321312/waymo-pauses-service-in-san-francisco-after-robotaxis-get-stuck-on-flooded-streets", "original_title": "Waymo pauses service in San Francisco after robotaxis get stuck on flooded streets", "thai_title": "Waymo สั่งระงับบริการ Robotaxi ในซานฟรานซิสโกชั่วคราว หลังรถไร้คนขับติดค้างบนถนนที่มีน้ำท่วมขัง", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["Waymo ประกาศระงับการให้บริการ Robotaxi ในซานฟรานซิสโกชั่วคราวเนื่องจากสภาพอากาศเลวร้ายและน้ำท่วมขังบนถนน", "ผู้ใช้งานแอปพลิเคชัน Waymo ได้รับข้อความแจ้งเตือนว่าบริการจะกลับมาเปิดใช้งานอีกครั้งเมื่อสภาพถนนดีขึ้นและพยากรณ์อากาศแจ่มใส", "มีรายงานเหตุการณ์รถ Waymo จอดนิ่งกลางทางแยกและขวางเส้นทางจราจร เนื่องจากไม่สามารถขับผ่านพื้นที่น้ำท่วมได้", "เหตุการณ์นี้เกิดขึ้นเพียงหนึ่งวันหลังจากที่กรมการขนส่งทางบกของแคลิฟอร์เนีย (DMV) สั่งจำกัดการใช้งานรถของ Waymo บนทางด่วนทั่วรัฐ", "Waymo เคยประสบปัญหาในลักษณะเดียวกันนี้มาก่อน ทั้งในซานฟรานซิสโก ซานอันโตนิโอ และแอตแลนตา ซึ่งสะท้อนให้เห็นถึงความท้าทายในการรับมือกับสภาพอากาศของระบบขับเคลื่อนอัตโนมัติ"], "full_paragraphs": ["นี่ไม่ใช่ครั้งแรกที่บริการ Robotaxi ของบริษัท Waymo ก่อให้เกิดความวุ่นวายขึ้นในเมือง โดยล่าสุด Waymo ได้ตัดสินใจระงับการให้บริการในซานฟรานซิสโกชั่วคราว เนื่องจากปัญหาในการรับมือกับน้ำท่วมขังบนถนนหลายสาย ข้อมูลดังกล่าวได้รับการยืนยันผ่านโพสต์บนแพลตฟอร์ม X ของ Bilal Mahmood ผู้ดูแลเขต 5 และข้อความแจ้งเตือนภายในแอปพลิเคชัน Waymo โดยการหยุดให้บริการครั้งนี้เกิดขึ้นหลังจากมีเหตุการณ์รถ Waymo หลายคันจอดขวางทางแยก เนื่องจากดูเหมือนว่าระบบไม่สามารถ (หรือไม่เต็มใจ) ที่จะขับผ่านพื้นที่ที่มีน้ำท่วมขังได้", "สำหรับผู้โดยสารที่ต้องการเรียกใช้บริการในขณะนี้ จะพบกับข้อความแจ้งเตือนในแอปพลิเคชันว่า \"เราได้ระงับการให้บริการชั่วคราวเนื่องจากสภาพอากาศ\" และระบุว่าจะกลับมาเปิดให้บริการอีกครั้ง \"เมื่อสภาพถนนดีขึ้นและพยากรณ์อากาศดูแจ่มใส\" ขณะนี้ซานฟรานซิสโกกำลังเผชิญกับฝนตกหนักและน้ำท่วมขัง ในช่วงเวลาที่ภูมิภาคกำลังเข้าสู่ฤดูหนาวที่นักพยากรณ์อากาศคาดการณ์ว่าอาจเป็นปรากฏการณ์เอลนีโญที่รุนแรงที่สุดเป็นประวัติการณ์", "ก่อนที่จะมีการประกาศระงับบริการ ได้มีการเผยแพร่วิดีโอบนแพลตฟอร์ม X แสดงให้เห็นรถ Waymo คันหนึ่งจอดนิ่งอยู่กลางทางม้าลายที่มีน้ำท่วมขัง ส่งผลให้รถยนต์คันอื่นต้องขับอ้อมไป นอกจากนี้ยังมีรายงานรถ Waymo อีกคันที่จอดนิ่งอยู่กลางถนนและแจ้งให้ผู้โดยสารที่อยู่ภายในรถให้นั่งรออยู่กับที่", "ทาง Engadget ได้ติดต่อไปยัง Waymo เพื่อขอความคิดเห็นเกี่ยวกับกรณีรถ Robotaxi ที่จอดค้างและปัญหาที่บริษัทกำลังเผชิญจากสภาพอากาศในซานฟรานซิสโกขณะนี้ โดยเราจะทำการอัปเดตบทความนี้หากได้รับคำตอบจากทางบริษัท", "ก่อนหน้านี้ Waymo เคยระงับการให้บริการในซานฟรานซิสโกมาแล้วเมื่อเดือนธันวาคม 2025 เมื่อเกิดเหตุไฟฟ้าดับจนนำไปสู่เหตุการณ์ที่รถ Robotaxi จอดขวางถนนในลักษณะเดียวกัน นอกจากนี้ บริษัทยังเคยเผชิญกับปัญหาน้ำท่วมมาก่อน โดยในเดือนพฤษภาคม Waymo ได้เรียกคืนรถยนต์เกือบ 4,000 คันและระงับการให้บริการหลังจากที่รถ Robotaxi คันหนึ่งขับเข้าไปในถนนที่มีน้ำท่วมขังในเมืองซานอันโตนิโอ แม้บริษัทจะมีการออกซอฟต์แวร์อัปเดตเพื่อแก้ไขปัญหานี้แล้ว แต่ต่อมาก็ต้องระงับการให้บริการในแอตแลนตาอีกครั้ง เมื่อรถ Waymo ขับเข้าไปในถนนที่มีน้ำท่วมขังซ้ำอีก", "การที่บริษัทต้องเผชิญกับปัญหาเหล่านี้ในซานฟรานซิสโกชี้ให้เห็นว่า การแก้ไขปัญหาดังกล่าวอาจมีความซับซ้อนมากกว่าที่เห็น แม้ว่าการระงับบริการครั้งนี้จะส่งผลกระทบเฉพาะในตัวเมืองเท่านั้น แต่ก็นับเป็นเหตุการณ์ที่เกิดขึ้นเพียงหนึ่งวันหลังจากที่กรมการขนส่งทางบกของรัฐแคลิฟอร์เนีย (DMV) สั่งจำกัดไม่ให้ Waymo นำรถขึ้นวิ่งบนทางด่วนของรัฐ ส่งผลให้บริษัทต้องถอนรถ Robotaxi ออกจากทางด่วนในทุกตลาดที่ให้บริการ"], "link": "https://www.engadget.com/2321312/waymo-pauses-service-in-san-francisco-after-robotaxis-get-stuck-on-flooded-streets/", "canonical_link": "https://www.engadget.com/2321312/waymo-pauses-service-in-san-francisco-after-robotaxis-get-stuck-on-flooded-streets", "cover_image_url": "https://www.engadget.com/img/gallery/waymo-pauses-service-in-san-francisco-after-robotaxis-get-stuck-on-flooded-streets/l-intro-1795043825.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795044237, "published_at": "2026-11-18T23:23:57Z", "published_th": "19 พ.ย. 2026 • 06:23 น.", "category_hint": "Gadgets"}, {"id": 1795043751797, "guid": "https://9to5mac.com/?p=1081448", "original_title": "Apple Card doubles Daily Cash rewards for new customers in limited-time offer", "thai_title": "Apple จัดโปรแรง! สมัคร Apple Card วันนี้ รับสิทธิ์คูณสอง Daily Cash ตลอดปีแรก", "tag": "Gadgets", "sub_tag": "APPLE", "bullet_points": ["Apple เปิดตัวโปรโมชันพิเศษสำหรับผู้สมัคร Apple Card รายใหม่ รับสิทธิ์คูณสอง Daily Cash ตลอดระยะเวลา 1 ปีแรก", "ผู้สมัครผ่านลิงก์โปรโมชันภายในวันที่ 10 ธันวาคมนี้ จะได้รับเงินคืนสูงสุดถึง 6% จากการซื้อสินค้าที่ร่วมรายการ", "อัตราเงินคืนจะปรับเพิ่มขึ้นเป็น 6% สำหรับการซื้อสินค้า Apple และร้านค้าที่ร่วมรายการ, 4% สำหรับการจ่ายผ่าน Apple Pay n) สำหรับ iPhone 18 รุ่นมาตรฐาน และ iPhone Air 2 ซึ่งคาดว่าจะเปิดตัวตามมาในช่วงฤดูใบไม้ผลิปีหน้า", "แหล่งข่าวในอุตสาหกรรมที่ไม่เปิดเผยชื่อระบุว่า LG Display จะเริ่มเดินสายการผลิตหน้าจอ OLED สำหรับ iPhone รุ่นใหม่เหล่านี้ในช่วงปลายปีนี้ ในขณะที่ Samsung Display จะเริ่มกระบวนการผลิตในเดือนมกราคม โดยแหล่งข่าวรายหนึ่งกล่าวว่า \"ผู้ผลิตหน้าจอให้ความสำคัญกับการผลิตรุ่น Pro, Pro Max และ iPhone Duo ซึ่งเป็นรุ่นที่มีมูลค่าสูงกว่าก่อนจนถึงสิ้นปีนี้\" พร้อมเสริมว่าหน้าจอสำหรับรุ่นมาตรฐานและรุ่น Air นั้น \"ต้องการปริมาณการผลิตที่น้อยกว่าและมีความซับซ้อนในการผลิตต่ำกว่า\"", "ผู้ผลิตหน้าจอทั้งสองรายกำลังปรับแผนการผลิตให้สอดคล้องกับการเปิดตัวที่คาดว่าจะเกิดขึ้นในเดือนมีนาคม ซึ่งข้อมูลนี้ตรงกับรายงานจากแหล่งข่าวบน Weibo เมื่อเดือนที่แล้วที่ระบุว่า iPhone 18 จะเปิดตัวในเดือนมีนาคมพร้อมกับ iPhone 18e", "ทั้ง Samsung และ LG จะเป็นผู้จัดหาหน้าจอให้กับ iPhone 18 แต่สำหรับ iPhone Air 2 นั้น มีรายงานว่า Samsung Display จะเป็นผู้ผลิตเพียงรายเดียว เนื่องจากคาดว่ายอดสั่งซื้อหน้าจอ OLED สำหรับรุ่นนี้จะมีจำกัด หลังจากที่ iPhone Air รุ่นแรกได้รับ \"กระแสตอบรับจากตลาดที่ค่อนข้างเงียบเหงา\" โดย Apple ได้ตัดสินใจคงสเปกหน้าจอของ iPhone Air 2 ไว้เหมือนเดิม เพื่อใช้ประโยชน์จากสต็อกหน้าจอที่มีอยู่เดิมให้ได้มากที่สุด ซึ่งหมายความว่ายอดสั่งซื้อหน้าจอใหม่สำหรับรุ่นนี้จะมีจำนวนน้อยมาก", "รายงานยังระบุด้วยว่า โดยปกติแล้ว iPhone รุ่นมาตรฐานและรุ่น Air จะมียอดขายรวมกันมากกว่า 30% ของยอดขาย iPhone ทั้งหมด โดยที่รุ่นมาตรฐานมักจะทำยอดขายได้ดีกว่ารุ่น Air ซึ่งความต้องการที่แข็งแกร่งของ iPhone 17 ถือเป็นปัจจัยสำคัญที่ช่วยผลักดันความสำเร็จของกลุ่มผลิตภัณฑ์ก่อนหน้านี้ จึงไม่น่าแปลกใจที่ทั้ง Samsung และ LG ต่างต้องการเป็นส่วนหนึ่งในห่วงโซ่อุปทานของ iPhone 18", "อย่างไรก็ตาม หากเป้าหมายของ Apple คือการระบายสต็อกหน้าจอของ iPhone Air รุ่นปัจจุบันที่ยังขายไม่ออก นั่นอาจหมายความว่า iPhone Air 2 จะไม่ได้รับฟีเจอร์ Dynamic Island ขนาดเล็กที่พบในรุ่น iPhone 18 Pro หรือไม่"], "link": "https://www.gsmarena.com/heres_when_iphone_18_and_iphone_air_2_display_production_will_reportedly_start-news-75525.php", "canonical_link": "ht านวิศวกรรมซอฟต์แวร์และงานที่ต้องใช้ความรู้ส่วนใหญ่ และ Carbon ซึ่งเป็นโมเดลที่ทรงพลังที่สุด ออกแบบมาสำหรับงานที่มีความซับซ้อนสูงและทดสอบขีดจำกัดด้านสติปัญญาของโมเดล", "สำหรับ Gemini 4 Neon นั้น มีประสิทธิภาพในการทำงานเทียบเท่ากับรุ่น Carbon ในด้านการเขียนโค้ด การใช้เหตุผล และงานที่ต้องใช้เอเจนต์ (Agentic tasks) แต่มีความโดดเด่นที่ความเร็วในการประมวลผลระดับ Flash และมีต้นทุนที่ต่ำกว่า", "ด้วยเหตุนี้ Neon จึงถูกนำมาให้บริการในแอป Gemini สำหรับผู้สมัครสมาชิก AI Pro (และ AI Ultra) โดยจะเข้ามาแทนที่รุ่น Argon ในขณะที่โมเดล 3.1 Pro จะถูกถอดออกไป นอกจากนี้ 3.5 Flash-Lite จะถูกเปลี่ยนสถานะเป็นโหมด 'Auto' ในตัวเลือกโมเดลสำหรับผู้ใช้งานแบบเสียค่าบริการ", "ภายหลังการอัปเดตนี้ ตัวเลือกโมเดลในระบบจะประกอบด้วย: 'Auto' ที่ปรับเปลี่ยนตามความต้องการของผู้ใช้, 'Everyday help' โดยใช้ 4 Hydrogen, 'Deeper analysis' โดยใช้ 4 Neon และ 'Code & complex work' โดยใช้ 4 Carbon", "ในด้านราคา Gemini 4 Neon มีราคาอยู่ที่ 3 ดอลลาร์ต่อ 1 ล้านโทเค็นอินพุต และ 15 ดอลลาร์ต่อ 1 ล้านโทเค็นเอาต์พุต ซึ่งถือว่ามีราคาสูงกว่ารุ่น Hydrogen สองเท่า ในขณะที่รุ่น Argon และ Carbon จะมีราคาอยู่ที่ 2 ดอลลาร์ต่อ 1 ล้านโทเค็นอินพุต และ 10 ดอลลาร์ต่อ 1 ล้านโทเค็นเอาต์พุตจนถึงวันที่ 30 พฤศจิกายนนี้ หลังจากสิ้นสุดช่วงโปรโมชั่น ราคาจะปรับเป็น 4 ดอลลาร์ต่อ 1 ล้านโทเค็นอินพุต และ 20 ดอลลาร์ต่อ 1 ล้านโทเค็นเอาต์พุต ซึ่งส่งผลให้ Neon มีราคาถูกกว่ารุ่น Carbon ถึง 25%"], "link": "https://9to5google.com/2026/11/18/gemini-4-neon-announcement/", "canonical_link": "https://9to5google.com/2026/11/18/gemini-4-neon-announcement", "cover_image_url": "https://9to5google.com/wp-content/uploads/sites/4/2026/11/gemini-4-neon-cover.webp?w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795039116, "published_at": "2026-11-18T21:58:36Z", "published_th": "19 พ.ย. 2026 • 04:58 น.", "category_hint": "Gadgets"}, {"id": 1795039245170, "guid": "https://9to5mac.com/?p=1081437", "original_title": "Zane Lowe shares Apple Music Radio audience numbers, recalls ‘crickets’ in the early days", "thai_title": "Zane Lowe เผยยอดผู้ฟัง Apple Music Radio ทะลุ 50 ล้านคนต่อเดือน พร้อมย้อนวันวานช่วงเริ่มต้นที่เงียบเหงา", "tag": "Gadgets", "sub_tag": "APPLE", "bullet_points": ["Zane Lowe เปิดเผยว่าปัจจุบัน Apple Music Radio มีผู้ฟังที่ไม่ซ้ำกัน (Unique listeners) มากกว่า 50 ล้านคนต่อเดือน", "ย้อนกลับไปในช่วงเริ่มต้น Lowe ยอมรับว่าการสร้างฐานผู้ฟังเป็นเรื่องยากและศิลปินหลายคนยังไม่ให้ความสนใจ", "Apple Music Radio ให้ความสำคัญกับการสนับสนุนศิลปินหน้าใหม่ โดยในปีนี้มีการเปิดเพลงของศิลปินกว่า 6,500 ราย ซึ่งกว่าครึ่งเป็นศิลปินหน้าใหม่", "Lowe เน้นย้ำถึงความสำคัญของ 'การคัดสรรโดยมนุษย์' (Human Curation) มากกว่าการพึ่งพาอัลกอริทึมเพียงอย่างเดียว เพื่อสร้างประสบการณ์การฟังที่มีคุณค่าและมีความหมาย"], "full_paragraphs": ["ในการสัมภาษณ์ครั้งใหม่กับรายการ On the Record ของ Billboard โดย Kristin Robinson ทาง Zane Lowe จาก Apple Music ได้ร่วมพูดคุยถึงช่วงเวลาเริ่มต้นของ Apple Music Radio พร้อมเปิดเผยตัวเลขจำนวนผู้ฟังในแต่ละเดือนให้เราได้ทราบกัน", "โดยปกติแล้ว Apple มักจะไม่ค่อยเปิดเผยตัวเลขที่ชัดเจนเกี่ยวกับจำนวนผู้ใช้งานบริการต่างๆ รวมถึงจำนวนผู้ฟังสถานีวิทยุของตนเอง ตัวอย่างเช่นในปี 2019 Eddy Cue เคยกล่าวว่า Beats 1 (ปัจจุบันคือ Apple Music 1) มีผู้ฟัง 'หลายสิบล้านคน' แต่ตั้งแต่นั้นมา Apple ก็แทบไม่ได้ให้ตัวเลขที่เฉพาะเจาะจงมากกว่านี้อีกเลย", "อย่างไรก็ตาม Zane Lowe ได้นำเสนอตัวเลขที่ชัดเจนยิ่งขึ้น โดยเปิดเผยว่าบริการนี้เข้าถึงผู้ฟังที่ไม่ซ้ำกัน (Unique listeners) มากกว่า 50 ล้านคนในทุกๆ เดือน โดยเขากล่าวว่า: 'เราไม่เคยหลงตัวเองจนคิดว่าเราจะมีผู้ฟังจำนวนมหาศาลในชั่วข้ามคืน เราต้องสร้างมันขึ้นมาเหมือนกับที่ทุกคนต้องสร้างอะไรสักอย่าง แต่เรามาถึงจุดที่ดำเนินงานมา 11 ปีแล้ว ซึ่งตอนนี้เราเข้าถึงผู้ฟังที่ไม่ซ้ำกันกว่า 50 ล้านคนต่อเดือน ซึ่งถือเป็นตัวเลขที่ใหญ่มากสำหรับเรา และมันกำลังเติบโตแบบก้าวกระโดดและรวดเร็วมาก'", "การเปิดเผยข้อมูลนี้เกิดขึ้นในการสัมภาษณ์ที่ครอบคลุมหลายประเด็น ซึ่งเผยแพร่ในวันนี้ โดย Lowe ได้พูดคุยถึงความยากลำบากในช่วงแรกของ Apple Music Radio แนวทางการสนับสนุนศิลปินหน้าใหม่ และเหตุผลที่ว่าทำไมการคัดสรรโดยมนุษย์ยังคงเป็นหัวใจสำคัญของบริการนี้", "เมื่อพูดถึงช่วงเริ่มต้นที่ Apple Music, Lowe ได้ย้อนความหลังว่า: 'ตอนที่เราเริ่มทำวิทยุที่นี่ ผมไม่มีโอกาสเข้าถึงศิลปินหลายคนที่ผมเคยสร้างความสัมพันธ์ไว้สมัยอยู่ที่ BBC เพราะเรายังเป็นของใหม่ที่ยังไม่มีผลงานพิสูจน์ตัวเอง ผมเข้ามาที่นี่โดยคิดว่า ผมมี Jimmy Iovine อยู่ที่นี่ และผมมี Apple อยู่ที่นี่ ผมรู้สึกว่าไม่มีใครหยุดเราได้ ใครบ้างจะไม่อยากมาร่วมเปิดตัวสิ่งนี้กับเรา? แต่มันกลับเงียบกริบ... แม้มันจะน่าผิดหวังในตอนนั้น แต่ก็มีสองสิ่งดีๆ เกิดขึ้น ประการแรก มันดึงผมกลับสู่ความเป็นจริงของการสร้างบางอย่างขึ้นมาจากศูนย์ และประการที่สอง มันทำให้เราโฟกัสอย่างชัดเจนและจริงจังกับศิลปินใหม่และศิลปินที่กำลังเติบโต'", "เขายังได้กล่าวถึงศิลปินกลุ่มแรกๆ ที่ Apple Music Radio ให้การสนับสนุน เช่น Billie Eilish กับเพลง “Ocean Eyes”, Khalid กับอัลบั้ม American Teen และ Bryson Tiller กับเพลงแรกของเขา", "Lowe ตั้งข้อสังเกตว่าในเวลานั้น ศิลปินเหล่านี้เพิ่งเริ่มต้นเส้นทาง และการสนับสนุนศิลปินหน้าใหม่ได้กลายเป็นส่วนสำคัญที่กำหนดแนวทางของ Apple Music Radio ซึ่งยังคงดำเนินมาจนถึงทุกวันนี้: 'ตัวเลขที่เจ๋งจริงๆ คือเครือข่ายวิทยุของเรา เราเปิดเพลงของศิลปินกว่า 6,500 รายในปีนี้เพียงปีเดียว ซึ่งไม่ใช่รูปแบบของวิทยุเชิงพาณิชย์ทั่วไป เพลย์ลิสต์ของเครือข่ายวิทยุอื่นมักจะเล็กมาก แต่เปิดซ้ำบ่อยมาก แต่เพลย์ลิสต์ของเรานั้นใหญ่โตมหาศาล เราเปิดเพลงของศิลปินที่หลากหลาย และกว่าครึ่งของศิลปิน 6,500 รายที่เราเปิดในปีเดียวนั้นเป็นศิลปินใหม่หรือกำลังเติบโต ลองคิดดูว่ามีศิลปินประมาณ 3,300 รายที่ได้รับโอกาสเปิดเพลง ซึ่งอาจเป็นเพลงแรก, EP แรก หรืออัลบั้มแรกของพวกเขา... มันคือการพิสูจน์แนวคิด มันยอดเยี่ยมมาก'", "ในประเด็นเรื่องช่วงเริ่มต้นที่ Apple Music, Lowe กล่าวว่า 'มันชัดเจนมากตั้งแต่ต้นว่าเรื่องนี้สำคัญมากสำหรับทุกคนที่มีส่วนรับผิดชอบในการทำให้ Apple Music เกิดขึ้นจริง' พร้อมเสริมว่า 'การรับใช้ศิลปินและชุมชนศิลปินในทางที่มีคุณค่าและเป็นประโยชน์ที่สุด' ยังคงเป็นสิ่งที่ขับเคลื่อนการตัดสินใจหลายอย่างที่แพลตฟอร์มนี้", "เมื่อบทสนทนาเปลี่ยนไปสู่เรื่องการรีแบรนด์ล่าสุดของ Apple Music ซึ่งมีการเปิดตัวโลโก้ใหม่ที่สร้างขึ้นจากคลื่นเสียงของผลงานเพลงโดย Fred again.. ทาง Lowe กล่าวว่าเขาไม่สามารถพูดถึงการตัดสินใจเบื้องหลังเรื่องนี้ได้ แต่เน้นย้ำถึงความเป็นมนุษย์และก ck in beta, Samsung Galaxy gets it too", "thai_title": "Google Pixel นำฟีเจอร์ App Lock กลับมาให้ใช้งานอีกครั้งในเวอร์ชันเบต้า พร้อมเปิดตัวบน Samsung Galaxy แล้ว", "tag": "Gadgets", "sub_tag": "MOBILE", "bullet_points": ["Google นำฟีเจอร์ App Lock กลับมาให้ใช้งานบน Google Pixel อีกครั้งในเวอร์ชัน Android 17 QPR3 Beta 3", "ฟีเจอร์ App Lock ช่วยให้ผู้ใช้สามารถล็อกแอปพลิเคชันด้วยการยืนยันตัวตนผ่านไบโอเมตริกซ์หรือ PIN รวมถึงซ่อนการแจ้งเตือนและข้อมูลจาก AI", "Samsung เริ่มเปิดให้ใช้งาน App Lock แล้วผ่านการอัปเดต One UI 9.5 Beta ซึ่งคาดว่าจะมาพร้อมกับสมาร์ตโฟนตระกูล Galaxy S27", "Google ระบุว่าสาเหตุที่เคยถอดฟีเจอร์นี้ออกไปชั่วคราว เพื่อนำไปปรับปรุงประสิทธิภาพและทดสอบการทำงานร่วมกับระบบโดยรวมให้ดียิ่งขึ้น"], "full_paragraphs": ["ถือเป็นเส้นทางที่ยาวนานสำหรับฟีเจอร์ App Lock ของ Google Pixel แต่ล่าสุดทางบริษัทได้ประกาศนำฟีเจอร์นี้กลับมาให้ใช้งานอย่างเป็นทางการอีกครั้งในวันนี้ พร้อมกับการเปิดตัวครั้งแรกบนอุปกรณ์ Samsung Galaxy", "ฟีเจอร์ App Lock ปรากฏตัวครั้งแรกบน Google Pixel ใน Android 17 QPR2 เวอร์ชันเบต้าเมื่อเดือนสิงหาคมที่ผ่านมา โดยฟีเจอร์นี้ช่วยให้ผู้ใช้สามารถล็อกแอปพลิเคชันไว้หลังชั้นการยืนยันตัวตนด้วยไบโอเมตริกซ์หรือรหัส PIN อีกทั้งยังสามารถซ่อนการแจ้งเตือน วิดเจ็ต และข้อมูลต่างๆ จากบริการ AI ได้อีกด้วย แม้จะเป็นฟีเจอร์ด้านความเป็นส่วนตัวที่มีประโยชน์ แต่ Google ก็ได้ถอดฟีเจอร์นี้ออกไปในการอัปเดตช่วงต่อมา ก่อนที่มันจะกลับมาอีกครั้งใน QPR3 Beta 3 เมื่อเดือนที่แล้ว และในวันนี้ Google ก็ได้ประกาศนำฟีเจอร์นี้กลับมาอย่างเป็นทางการ", "ปัจจุบันฟีเจอร์ดังกล่าวยังคงจำกัดอยู่เฉพาะใน Android 17 QPR3 Beta 3 สำหรับอุปกรณ์ Google Pixel เท่านั้น ซึ่งเป็นการอัปเดตที่คาดว่าจะปล่อยให้ใช้งานในเวอร์ชันเสถียร (Stable track) ในช่วงต้นปี 2027 โดยผู้ใช้ยังคงสามารถเข้าถึง App Lock ได้ด้วยการกดค้างที่ไอคอนแอปพลิเคชันแล้วเลือกเพิ่มเข้าไปในรายการล็อกแอป", "ในโพสต์บน Reddit ผู้จัดการฝ่ายชุมชนสัมพันธ์ของ Google ได้อธิบายถึงเหตุผลที่ฟีเจอร์ App Lock บน Google Pixel ถูกถอดออกไปชั่วคราวเพื่อปรับปรุงก่อนที่จะเปิดตัวเต็มรูปแบบว่า: 'ทีมผลิตภัณฑ์ตัดสินใจถอนฟีเจอร์นี้ออกจาก QPR2 Beta ชั่วคราว เพื่อให้
