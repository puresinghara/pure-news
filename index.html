นแดชบอร์ดแสดงข้อมูล เช่น สภาพอากาศ หรือรายการสิ่งที่ต้องทำ", "มาพร้อมเทคโนโลยี Lazarus ซึ่งเป็นเอนจินแปลงสีที่บริษัทเคลมว่าให้การจับคู่สีที่ดีที่สุดในตลาดสำหรับจอ Spectra 6", "เปิดให้สั่งจองล่วงหน้าแล้วในราคา 1,299 ดอลลาร์สหรัฐ โดยคาดว่าจะเริ่มจัดส่งได้ในช่วงต้นปี 2027"], "full_paragraphs": ["Trmnl บริษัทที่ขึ้นชื่อเรื่องแดชบอร์ด E Ink แบบปรับแต่งได้สูง ซึ่งสามารถใช้งานได้หลากหลายตั้งแต่ปฏิทินบนโต๊ะทำงานไปจนถึงเครื่องติดตามราคาหุ้น ได้เปิดตัวจอแสดงผลรุ่นใหม่ที่ออกแบบมาให้เหมาะกับการแสดงงานศิลปะและรูปภาพ โดยนี่ไม่ใช่ผลิตภัณฑ์จอ E Ink สีรุ่นแรกของบริษัท แต่แทนที่จะจำกัดอยู่เพียงแค่ 4 สีเหมือนรุ่นก่อนหน้า Frame รุ่นใหม่นี้สามารถแสดงเฉดสีได้หลายพันเฉดด้วยแผงหน้าจอ E Ink Spectra 6 ขนาด 31.5 นิ้ว ซึ่งเป็นเทคโนโลยีเดียวกับที่พบในผลิตภัณฑ์จากแบรนด์อย่าง Aura และ Pocketbook", "ปัจจุบัน Frame เปิดให้สั่งจองล่วงหน้าแล้วในราคา 1,299 ดอลลาร์สหรัฐ โดยตัวเครื่องทำจากไม้แท้ทำมือซึ่งผู้ใช้สามารถเลือกประเภทของไม้ได้ 4 ชนิด ได้แก่ ไวท์โอ๊ค (white oak), เชอร์รี่ (cherry), ซาเปล (sapele) และวอลนัท (walnut) สำหรับการผลิตล็อตแรกจะเป็นรุ่นลิมิเต็ดจำนวนประมาณ 470 เครื่อง ซึ่งในขณะนี้มียอดจองไปแล้วกว่าครึ่งหนึ่ง โดยคาดว่าการจัดส่งจอแสดงผลส่วนใหญ่จะเกิดขึ้นในช่วงต้นปี 2027 นอกจากนี้ยังมีอุปกรณ์เสริมให้เลือกซื้อเพิ่มเติม เช่น ขาตั้งไม้ที่เข้าชุดกันหากคุณไม่ต้องการแขวนไว้บนผนัง และแบตเตอรี่ขนาดใหญ่ 20,000mAh อย่างไรก็ตาม ตัวเครื่อง Frame สามารถใช้งานได้นานหลายเดือนต่อการชาร์จหนึ่งครั้งด้วยแบตเตอรี่มาตรฐานขนาด 10,000mAh ที่ให้มา", "Frame สามารถใช้งานได้ทั้งในรูปแบบการแสดงภาพถ่ายและงานศิลปะเพียงอย่างเดียว หรือคุณสามารถเพิ่มข้อมูลพิเศษโดยใช้ปลั๊กอินที่ดาวน์โหลดได้จำนวนมาก", "สิ่งที่ทำให้ Frame แตกต่างจากกรอบรูปและโปสเตอร์ E Ink ขนาดใหญ่อื่นๆ คือการเป็น Open-source และสามารถทำได้มากกว่าแค่การแสดงภาพ ผ่านปลั๊กอินที่คุณสามารถสร้างขึ้นเองหรือดาวน์โหลดจากมาร์เก็ตเพลสที่มีให้เลือกกว่า 1,400 รายการในขณะนี้ Frame สามารถเปลี่ยนหน้าที่เป็นแดชบอร์ดเพื่อแสดงสภาพอากาศ รายการสิ่งที่ต้องทำ (to-do lists) หรือข้อมูลใดก็ตามที่คุณต้องการให้ปรากฏอยู่บนผนังบ้านของคุณ", "หากคุณเลือกใช้เพื่อแสดงรูปภาพ Trmnl ได้พัฒนา Lazarus ซึ่งเป็นเอนจินแปลงสี (color conversion engine) ที่บริษัทเชื่อว่ามอบ “การจับคู่สีที่ดีที่สุดในตลาดสำหรับจอแสดงผล Spectra 6 ทุกรุ่น” และหากคุณมีความเห็นต่าง เนื่องจาก Frame เป็นระบบ Open-source คุณจึงสามารถปรับจูนสีให้ตรงกับความต้องการส่วนตัวของคุณได้เช่นกัน", "เช่นเดียวกับผลิตภัณฑ์ E Ink อื่นๆ ของ Trmnl ตัว Frame สามารถเชื่อมต่อกับอินเทอร์เน็ตเพื่อแสดงข้อมูลที่คุณต้องการแบบเรียลไทม์ แต่เพื่อยืดอายุการใช้งานแบตเตอรี่ให้ยาวนานยิ่งขึ้น คุณยังสามารถใส่ไฟล์รูปภาพลงใน microSD card และใช้งาน Frame แบบออฟไลน์ได้ คุณสามารถปรับแต่งความถี่ในการเปลี่ยนรูปภาพใหม่ หรือตั้งค่าตารางเวลาเพื่อให้งานศิลปะชิ้นโปรดของคุณแสดงอยู่บนหน้าจอนานกว่าภาพอื่นๆ แม้ว่า Frame จะมีราคาสูงกว่าผลิตภัณฑ์จอ E Ink Spectra 6 อื่นๆ ที่มีวางจำหน่ายในปัจจุบัน แต่จุดดึงดูดสำคัญคือความยืดหยุ่นในการใช้งานที่มากกว่าแค่การเป็นโปสเตอร์ดิจิทัลทั่วไป"], "link": "https://www.theverge.com/tech/1035258/trmnl-e-ink-spectra-6-frame-dashboard-display-poster-photos", "canonical_link": "https://www.theverge.com/tech/1035258/trmnl-e-ink-spectra-6-frame-dashboard-display-poster-photos", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/frame1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/frame.jpg?quality=90&strip=all&crop=16.6875%2C0%2C66.625%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794926961, "published_at": "2026-11-17T14:49:21Z", "published_th": "17 พ.ย. 2026 • 21:49 น.", "category_hint": "Technology"}, {"id": 1794997898704, "guid": "https://www.theverge.com/?p=1034612", "original_title": "The Fire TV Stick 4K Plus is on sale for less than Amazon’s entry-level streamer", "thai_title": "ดีลเดือด! Fire TV Stick 4K Plus ลดราคาเหลือ 29.99 ดอลลาร์ ถูกกว่ารุ่นเริ่มต้นของ Amazon", "tag": "Technology", "sub_tag": "GADGETS", "bullet_points": ["Amazon ปรับลดราคา Fire TV Stick 4K Plus เหลือเพียง 29.99 ดอลลาร์ ซึ่งถูกกว่ารุ่น Fire TV Stick HD และรุ่น 4K ใหม่ล่าสุด", "แม้จะถูกถอดออก ้องการรับชม ควบคุมอุปกรณ์สมาร์ทโฮมที่รองรับ เช่น ไฟและเทอร์โมสตัท ตรวจสอบคะแนนกีฬา และอื่นๆ อีกมากมายได้โดยไม่ต้องลุกจากโซฟา เพียงแต่อย่าคาดหวังปุ่มลัดที่ปรับแต่งได้ เนื่องจากฟีเจอร์นั้นเป็นเอกสิทธิ์เฉพาะสำหรับรีโมท Fire TV รุ่นล่าสุดเท่านั้น", "ข้อสังเกตสุดท้ายคือ รุ่น Plus มาพร้อมกับระบบปฏิบัติการ Fire OS ของ Amazon ซึ่งแตกต่างจาก Vega OS ที่ติดตั้งมาในสตรีมมิงสติ๊กรุ่นใหม่ๆ โดย Fire OS รุ่นเดิมนี้อนุญาตให้ผู้ใช้สามารถ Sideload แอป Android TV ได้ หากนั่นเป็นฟีเจอร์ที่คุณให้ความสนใจ"], "link": "https://www.theverge.com/gadgets/1034612/amazon-fire-tv-stick-4k-plus-black-friday-2026-deal-sale", "canonical_link": "https://www.theverge.com/gadgets/1034612/amazon-fire-tv-stick-4k-plus-black-friday-2026-deal-sale", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/06/Amazon-Fire-TV-Stick-4K-Lifestyle-Press-Image.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/03/Amazon-Fire-TV-Stick-4K-Press-Image-2023.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/03/268387_Apple_MacBook_Neo_AKrales_0543.jpg?quality=90&strip=all&crop=5.9486979166667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25819374/jbl2.jpg?quality=90&strip=all&crop=16.666666666667%2C0%2C66.666666666667%2C100&w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/04/rev-1-GRC-14350_High_Res_JPEG.jpeg?quality=90&strip=all&crop=20.785055568692%2C0%2C58.429888862615%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794925507, "published_at": "2026-11-17T14:25:07Z", "published_th": "17 พ.ย. 2026 • 21:25 น.", "category_hint": "Technology"}, {"id": 1794924943274, "guid": "https://www.theverge.com/?p=1035159", "original_title": "Windows 11 actually runs better on 8GB of RAM now", "thai_title": "Windows 11 ทำงานได้ลื่นไหลขึ้นบน RAM 8GB แล้ว หลัง Microsoft ปรับจูนระบบครั้งใหญ่", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Microsoft อัปเดต Windows 11 เพื่อเพิ่มประสิทธิภาพการจัดการหน่วยความจำ ช่วยให้เครื่องที่มี RAM 8GB ทำงานได้ดีขึ้นอย่างเห็นได้ชัด", "การปรับปรุงครั้งนี้ช่วยลดปัญหา Hard Faults หรือการที่ระบบต้องดึงข้อมูลจาก SSD มาใช้แทน RAM ซึ่งเป็นสาเหตุหลักของอาการเครื่องหน่วง", "ผลการทดสอบจริงพบว่าการเปิด Chrome กว่า 30 แท็บพร้อมสตรีมวิดีโอ 4K ทำได้ลื่นไหลขึ้น และแอปพลิเคชันต่างๆ มีการรีเฟรชตัวเองน้อยลง", "แม้ประสิทธิภาพจะดีขึ้น แต่ผู้เชี่ยวชาญยังคงแนะนำว่าการเลือกซื้อโน้ตบุ๊กที่มี RAM 16GB ยังคงเป็นตัวเลือกที่ดีกว่าสำหรับการใช้งานในระยะยาว"], "full_paragraphs": ["เมื่อช่วงต้นปีที่ผ่านมา RAM ขนาด 16GB เคยเป็นมาตรฐานทั่วไปสำหรับโน้ตบุ๊ก Windows ในราคาต่ำกว่า 800 ดอลลาร์ ซึ่งช่วยชดเชยความรู้สึกที่ว่า Windows 11 เริ่มกินทรัพยากรเครื่องมากขึ้นเรื่อยๆ แต่ด้วยราคา RAM ที่พุ่งสูงขึ้นในปีนี้ ทำให้ RAM 8GB กลับมาเป็นสเปกเริ่มต้นมาตรฐานอีกครั้ง แม้ว่า MacBook รุ่นใหม่จะจัดการกับ RAM ขนาดนี้ได้ดี แต่โน้ตบุ๊ก Windows รวมถึง Surface Laptop ขนาด 13 นิ้วของ Microsoft เองกลับประสบปัญหาอย่างหนัก อย่างไรก็ตาม ดูเหมือนว่าความพยายามของ Microsoft ในการทำให้ Windows ทำงานได้เร็วและเสถียรขึ้นก่อนที่จะเกิดวิกฤตราคา RAM จะเริ่มเห็นผลลัพธ์ที่ชัดเจนแล้วในขณะนี้", "เมื่อต้นเดือนที่ผ่านมา Pavan Davuluri รองประธานบริหารฝ่าย Windows และอุปกรณ์ของ Microsoft ได้เผยรายละเอียดผ่านบล็อกโพสต์เกี่ยวกับความสำเร็จในการปรับปรุง Windows 11 เพื่อแก้ปัญหาข้อจำกัดของพีซีที่มี RAM 8GB โดย Davuluri ระบุว่า 'Windows มีการตอบสนองเร็วขึ้นสูงสุด 20% และการทำงานแบบ Multitasking เร็วขึ้นสูงสุด 40% ในการทดสอบในห้องปฏิบัติการของเรา'", "การเปลี่ยนแปลงที่สำคัญที่สุดคือการจัดการหน่วยความจำ (Memory Management) เมื่อหน่วยความจำไม่เพียงพอต่อการจัดการข้อมูลที่ใช้งานอยู่ ระบบจำเป็นต้องย้ายข้อมูลบางส่วน (หรือที่เรียกว่า Paged out) ไปยังพื้นที่จัดเก็บข้อมูล ซึ่ง SSD โดยเฉพาะในโน้ตบุ๊กรุ่นประหยัดนั้นมีความเร็วต่ำกว่า RAM มาก", "เมื่อ Windows จำเป็นต้องเข้าถึงข้อมูลที่ถูกย้ายจาก RAM ไปยัง SSD จะเกิดสิ่งที่เรียกว่า Hard Fault (หรือ Page Fault) หากเหตุการณ์นี้เกิดขึ้นบ่อยครั้ง เช่น ในโน้ตบุ๊กที่มี RAM เพียง 8GB จะนำไปสู่ปัญหาเครื่องหน่วง เช่น แท็บเบราว์เซอร์ที่ต้องโหลดใหม่ก่อนที่คุณจะเข้าถึงได้อีกครั้ง Davuluri กล่าวว่า 'ขณะนี้ Windows สามารถเก็บข้อมูลที่ใช้งานอยู่ได้มากขึ้นสูงสุด 2GB ในหน่วยความจำ แทนที่จะย้ายไปยังพื้นที่จัดเก็บข้อมูลที่ช้ากว่า ดังนั้นแอปหรือแท็บที่คุณเปิดทิ้งไว้จึงมีโอกาสน้อยลงที่จะต้องโหลดใหม่เมื่อคุณกลับมาใช้งาน'", "เพื่อพิสูจน์เรื่องนี้ ผมได้นำ Surface Laptop ขนาด 13 นิ้วที่มี RAM 8GB เครื่องเดิมที่เคยรีวิวไปเมื่อเดือนกรกฎาคมกลับมาทดสอบอีกครั้ง ซึ่งในตอนนั้นผมเคยสรุปว่า 8GB นั้นไม่เพียงพอสำหรับ Windows โดยเครื่องนี้ถือเป็นหนึ่งในตัวอย่างที่เลวร้ายที่สุดของผลกระทบจากวิกฤต RAM ในปัจจุบัน ด้วย RAM ที่น้อยกว่ารุ่นเริ่มต้นของปีที่แล้วถึงครึ่งหนึ่ง ทำให้มันแทบจะรับมือกับภาระงานปกติของผมไม่ไหว และนี่คือฮาร์ดแวร์ของ Microsoft เอง", "ก่อนที่จะอัปเดต Surface เป็น Windows 11 เวอร์ชันล่าสุด ผมได้ทดลองใช้งานเครื่องนี้กับ Windows เวอร์ชันเดิม (25H2, build 26200.8875) ซึ่งผลลัพธ์นั้นย่ำแย่มาก การเปิดแท็บ Chrome ประมาณ 20 แท็บ พร้อมสตรีมวิดีโอ YouTube 4K และใช้งาน Slack กับ Signal ทำให้ทุกอย่างตั้งแต่การคลิกแท็บไปจนถึงการปัดนิ้วผ่าน Trackpad รู้สึกหน่วงไปหมด แท็บ Chrome และแอปต่างๆ จะรีเฟรชตัวเองทันทีหลังจากทิ้งไว้เบื้องหลังเพียงครู่เดียว เมื่อคุณทำงานหลายอย่างพร้อมกันและสลับไปมาระหว่างหลายแท็บ เช่น ในระหว่างการค้นหาข้อมูล การรีเฟรชเหล่านี้ก็น่าหงุดหงิดอย่างยิ่ง แถมพัดลมยังทำงานเสียงดังตลอดเวลา การเปิด Resource Monitor ทิ้งไว้แสดงให้เห็นว่ามี Hard Fault เกิดขึ้นตั้งแต่ 700 ครั้งต่อวินาที ไปจนถึง 29,000 ครั้งต่อวินาที ซึ่งเป็นช่วงที่ Windows แทบจะหยุดทำงานไปเลย การเห็นตัวเลขนี้พุ่งทะลุกราฟแสดงให้เห็นว่า Windows 11 จัดการหน่วยความจำบน RAM 8GB ได้แย่เพียงใดก่อนการอัปเดต", "หลังจากอัปเดต Surface Laptop เป็น Windows 11 เวอร์ชัน 26H2, build 26300.9974 (การปรับปรุงหน่วยความจำเริ่มมีผลตั้งแต่ build 26300.9818 เป็นต้นไป) สถานการณ์ก็ดีขึ้นมาก ผมเปิดแท็บ Chrome มากกว่า 30 แท็บ พร้อมสตรีมวิดีโอ YouTube 4K เดิม และรันแอปแชทตัวเดิม Windows มีอาการช้าลงบ้าง แต่ไม่ใกล้เคียงกับความ านาน โดย Google ได้เพิ่มฟีเจอร์นี้เข้ามาใน Android 17 QPR2 สำหรับโทรศัพท์ Pixel และเป็นฟีเจอร์ที่พบเห็นได้ทั่วไปในสมาร์ตโฟน Android รุ่นอื่นๆ ดังนั้นในที่สุดผู้ใช้ Samsung ก็จะได้รับฟังก์ชันการใช้งานนี้เช่นกัน โดย App Lock จะช่วยให้คุณสามารถล็อกแอปพลิเคชันด้วยการยืนยันตัวตนผ่านไบโอเมตริกซ์หรือรหัส PIN ได้", "One UI 9.5 เวอร์ชันเบต้าเปิดให้ใช้งานตั้งแต่วันนี้เป็นต้นไปสำหรับ Galaxy S26 series ในประเทศสหรัฐอเมริกา, สหราชอาณาจักร, เยอรมนี, อินเดีย, เกาหลี และโปแลนด์ ผ่านทางแอป Samsung Members ตามปกติ โดยคาดว่าเวอร์ชันสมบูรณ์ (Stable release) จะปล่อยออกมาในช่วงต้นปีหน้า ซึ่งน่าจะเริ่มใช้งานบน Galaxy S27 series เป็นกลุ่มแรก"], "link": "https://9to5google.com/2026/11/18/samsung-one-ui-9-5-beta-release/", "canonical_link": "https://9to5google.com/2026/11/18/samsung-one-ui-9-5-beta-release", "cover_image_url": "https://9to5google.com/wp-content/uploads/sites/4/2026/03/galaxy-s26-ultra-review-2.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795009500, "published_at": "2026-11-18T13:45:00Z", "published_th": "18 พ.ย. 2026 • 20:45 น.", "category_hint": "Gadgets"}, {"id": 1795008651064, "guid": "https://9to5mac.com/?p=1081126", "original_title": "Leaker claims Apple developing four models of 20th anniversary iPhone", "thai_title": "ลือ Apple กำลังซุ่มพัฒนา iPhone รุ่นฉลองครบรอบ 20 ปี ถึง 4 โมเดล พร้อมดีไซน์กระจกโค้งมนรอบทิศทาง", "tag": "Gadgets", "sub_tag": "MOBILE", "bullet_points": ["Ice Universe เผย Apple กำลังพัฒนา iPhone รุ่นฉลองครบรอบ 20 ปี (iPhone 20) โดยมีต้นแบบถึง 4 รุ่น", "แบ่งเป็นรุ่นฝาหลังกระจกแบน 2 รุ่น และรุ่นฝาหลังกระจกโค้ง 4 ด้าน (Quad-curved) อีก 2 รุ่น", "Apple ใช้เวลาพัฒนาดีไซน์กระจกโค้งมานานถึง 3 ปี และมีการปรับแก้ความโค้งให้เหมาะสมอยู่ตลอด", "ดีไซน์ใหม่คาดว่าจะมาพร้อมขอบจอที่บางเฉียบเพียง 1 มม. เพื่อสร้างเอฟเฟกต์ไร้ขอบที่สมบูรณ์แบบ", "นี่ถือเป็นการปรับโฉมครั้งใหญ่ที่สุดของ iPhone นับตั้งแต่การเปิดตัว iPhone X"], "full_paragraphs": ["Ice Universe แหล่งข่าวหลุดชื่อดังเปิดเผยว่า ขณะนี้ Apple กำลังอยู่ใน ุ่มผลิตภัณฑ์ใหม่นี้ประกอบไปด้วยโคมไฟตั้งพื้นแนวตั้งที่มีโซนแสงที่สามารถควบคุมแยกกันได้ถึง 18 โซน และไฟเส้น LED รุ่นใหม่ที่มอบการไล่เฉดสีที่ไร้รอยต่อ เอฟเฟกต์แสงแบบไดนามิกที่ไหลลื่น และฟีเจอร์การซิงโครไนซ์เข้ากับจังหวะดนตรี", "ผลิตภัณฑ์ใหม่ทั้งหมดนี้รองรับมาตรฐาน Matter ซึ่งช่วยให้สามารถบูรณาการเข้ากับ Apple Home ได้อย่างสมบูรณ์ นอกจากนี้ยังรองรับระบบนิเวศคู่แข่งอื่น ๆ ได้อย่างครบถ้วน ไม่ว่าจะเป็น Amazon Alexa, Google Home, Samsung SmartThings, Home Assistant และ Homey", "เมื่อใช้งานร่วมกับเซนเซอร์ที่รองรับอย่าง FP400 ผลิตภัณฑ์ใหม่ทั้งหมดจะสามารถใช้งานฟีเจอร์ Spatial Intelligence ได้ โดยทางบริษัทระบุว่า 'สิ่งนี้ช่วยให้ระบบอัตโนมัติสามารถตอบสนองได้มากกว่าแค่การตรวจจับว่ามีคนอยู่หรือไม่ แต่ยังรวมถึงการระบุตำแหน่งที่แน่ชัดของผู้คนภายในพื้นที่และทิศทางการเคลื่อนที่ของพวกเขาด้วย ตัวอย่างเช่น ไฟส่องสว่างโดยรอบสามารถเปิดและปิดได้ตามการเคลื่อนไหวของคุณจากโซฟาไปยังโต๊ะรับประทานอาหาร'", "นอกจากนี้ อัลกอริทึมการตรวจจับด้วย AI อัจฉริยะยังช่วยปรับปรุงความน่าเชื่อถือได้อย่างมาก โดยการลดการแจ้งเตือนที่ผิดพลาดซึ่งเกิดจากปัจจัยด้านสิ่งแวดล้อม เช่น สัตว์เลี้ยง การไหลเวียนของอากาศ และหุ่นยนต์ดูดฝุ่น อีกทั้งยังมีเซนเซอร์วัดแสงโดยรอบในตัวที่ช่วยกระตุ้นฉากสมาร์ทโฮมตามกิจกรรมของมนุษย์และสภาพแสงในขณะนั้นอีกด้วย", "ผู้ใช้งานอาจพบความยากลำบากเล็กน้อยในการค้นหาผลิตภัณฑ์ใหม่เหล่านี้ในส่วนสินค้าใหม่บนหน้าร้านค้า Amazon ของบริษัท เนื่องจากแทนที่จะแยกหมวดหมู่สินค้าแต่ละรายการ คุณจำเป็นต้องคลิกหรือแตะที่ตัวผลิตภัณฑ์ในภาพหลักเพื่อดูรายละเอียด", "สำหรับราคาของผลิตภัณฑ์ใหม่นี้เริ่มต้นที่ 24 ดอลลาร์สำหรับหลอดไฟอัจฉริยะรุ่นใหม่ ไปจนถึง 320 ดอลลาร์สำหรับไฟเส้นประดับภายนอกอาคารแบบถาวรที่มีความยาวถึง 100 ฟุต โดยผู้ที่สนใจสามารถตรวจสอบและเลือกซื้อผลิตภัณฑ์ใหม่ทั้งหมดได้ผ่านช่องทางออนไลน์ของ Aqara"], "link": "https://9to5mac.com/2026/11/18/six-new-aqara-smart-lights-with-apple-home-support-and-spatial-intelligence/", "canonical_link": "https://9to5mac.com/2026/11/18/six-new-aqara-smart-lights-with-apple-home-support-and-spatial-intelligence", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2026/11/Six-new-Aqara-smart-lights-with-Apple-Home-support-and-spatial-intelligence.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795007192, "published_at": "2026-11-18T13:06:32Z", "published_th": "18 พ.ย. 2026 • 20:06 น.", "category_hint": "Gadgets"}, {"id": 1795007748761, "guid": "https://www.engadget.com/2320303/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi", "original_title": "You'll need the latest PS5 firmware update to play GTA VI", "thai_title": "เตรียมตัวให้พร้อม! Sony บังคับอัปเดตเฟิร์มแวร์ PS5 ก่อนเล่น Grand Theft Auto VI", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["Sony ปล่อยเฟิร์มแวร์เวอร์ชัน 14.23 สำหรับ PS5 ซึ่งเป็นข้อบังคับที่ต้องติดตั้งก่อนจึงจะสามารถเข้าเล่นเกม Grand Theft Auto VI ได้", "การอัปเดตนี้มีขนาดไฟล์ 1.267GB โดยระบุว่าเป็นการปรับปรุงความปลอดภัยของระบบซอฟต์แวร์", "คาดการณ์ว่าการอัปเดตนี้อาจเป็นการปิดช่องโหว่ที่เกี่ยวข้องกับการเจลเบรก (Jailbreak) หลังจากมีรายงานว่ามีการดึงข้อมูลเกมบนเฟิร์มแวร์เวอร์ชันก่อนหน้า", "ผู้เล่นควรเตรียมตัวดาวน์โหลดและติดตั้งล่วงหน้าก่อนเกมเปิดให้เล่นอย่างเป็นทางการในเที่ยงคืนวันที่ 19 พฤศจิกายน เพื่อไม่ให้เสียเวลาในการเข้าเล่น", "ตัวเกม Grand Theft Auto VI เวอร์ชันดิจิทัลมีขนาดไฟล์สูงถึง 212GB ซึ่งผู้เล่นควรเผื่อเวลาในการดาวน์โหลดให้เพียงพอ"], "full_paragraphs": ["ดูเหมือนว่า Sony กำลังพยายามอุดช่องโหว่ด้านความปลอดภัยที่อาจนำไปสู่การเจลเบรกเครื่องเกม ก่อนที่เกมฟอร์มยักษ์ที่สุดแห่งปีจะวางจำหน่ายอย่างเป็นทางการ", "แฟนเกม Grand Theft Auto VI จำเป็นต้องดาวน์โหลดอัปเดตใหม่สำหรับเครื่อง PlayStation 5 มิฉะนั้นจะไม่สามารถเข้าเล่นเกมได้ โดย Sony ได้ปล่อยเฟิร์มแวร์ตัวใหม่สำหรับคอนโซลซึ่งถือเป็นข้อบังคับในการเข้าถึงเกมที่ทุกคนรอคอยนี้ ทั้งนี้ทางบริษัทได้ออกมาสนับสนุนให้แฟนๆ ผ่านทางแพลตฟอร์ม X ให้รีบดาวน์โหลดและติดตั้งอัปเดตดังกล่าวให้เรียบร้อยก่อนที่เกมจะเปิดให้เล่นในเวลาเที่ยงคืนของวันที่ 19 พฤศจิกายน เพื่อให้ทุกคนสามารถเริ่มเล่นได้ทันทีโดยไม่ต้องรอเวลาเพิ่มเติม", "ตามรายงานจาก IGN ระบุว่าเฟิร์มแวร์ PS5 เวอร์ชัน 14.23 มีขนาดไฟล์อยู่ที่ 1.267GB และประกอบไปด้วย 'การแก้ไขด้านความปลอดภัยของซอฟต์แวร์ระบบ' แม้ว่าทาง Sony จะไม่ได้ระบุเหตุผลชัดเจนว่าทำไมจึงต้องบังคับอัปเดตเพื่อเล่น GTA VI แต่ IGN ตั้งข้อสังเกตว่าอัปเดตนี้ถูกปล่อยออกมาเพียงหนึ่งวันหลังจากที่มีนักเจลเบรก PS5 ชื่อดังรายหนึ่งอ้างว่าสามารถดึงข้อมูลไฟล์เกม (Game Binary) บนเฟิร์มแวร์เวอร์ชัน 14.22 ได้สำเร็จ ซึ่งหมายความว่าพวกเขาสามารถคัดลอกข้อมูลจากแผ่นเกมหรือเวอร์ชันดิจิทัลของเกม PS5 ได้ ดังนั้นจึงมีความเป็นไปได้สูงว่าเฟิร์มแวร์ 14.23 ถูกปล่อยออกมาเพื่อปิดช่องโหว่ดังกล่าว", "สำหรับผู้ที่วางแผนจะซื้อเกมในวันนี้ อาจต้องรีบดำเนินการซื้อและติดตั้งให้เร็วที่สุด เนื่องจากตัวเกมเวอร์ชันดิจิทัลมีขนาดไฟล์ใหญ่ถึง 212GB ซึ่งสำหรับผู้ที่มีความเร็วอินเทอร์เน็ต 1Gbps อาจต้องใช้เวลาดาวน์โหลดนานกว่าหนึ่งชั่วโมง นอกจากนี้ Rockstar Games ยังได้ทยอยปล่อยแพตช์ก่อนวางจำหน่ายออกมาตั้งแต่ช่วงที่เปิดให้สั่งจองล่วงหน้า โดยแพตช์ล่าสุดมีขนาด 600MB ซึ่งแพตช์เหล่านี้ควรจะดาวน์โหลดโดยอัตโนมัติสำหรับผู้ที่ทำการ Preload เกมไว้แล้ว", "ทาง Sony Interactive ได้ออกประกาศผ่านทาง PlayStation Support US ว่า 'Sony Interactive ได้ออกอัปเดตซอฟต์แวร์ระบบ PS5 ซึ่งจำเป็นต้องติดตั้งก่อนการเล่น Grand Theft Auto VI ผู้เล่นควรดาวน์โหลดอัปเดตนี้ก่อนเที่ยงคืนของวันที่ 19 พฤศจิกายน เพื่อให้พร้อมสำหรับการเล่นในวันเปิดตัววันที่ 19 พฤศจิกายนนี้'"], "link": "https://www.engadget.com/2320303/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi/", "canonical_link": "https://www.engadget.com/2320303/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi", "cover_image_url": "https://www.engadget.com/img/gallery/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi/l-intro-1795006628.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/youll-need-the-latest-ps5-firmware-update-to-play-gta-vi/intro-1795006628.jpg"], "videos": [], "review_score": "", "published_ts": 1795006902, "published_at": "2026-11-18T13:01:42Z", "published_th": "18 พ.ย. 2026 • 20:01 น.", "category_hint": "Gadgets"}, {"id": 1795010538909, "guid": "https://gizmodo.com/?p=2000841142", "original_title": "Sonos’ New Voice Assistant Is Fine for Music but Bad at Spelling (and More)", "thai_title": "Sonos Voice Control ผู้ช่วยอัจฉริยะตัวใหม่: ฟังเพลงได้ดี แต่ยังสอบตกเรื่องการสะกดคำและงานทั่วไป", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["Sonos Voice Control เปิดตัวเพื่อเน้นการควบคุมลำโพงภายในบ้านโดยเฉพาะ", "โดดเด่นในการสั่งงานกลุ่มลำโพงและการค้นหาเพลงผ่านรายละเอียดหน้าปกอัลบั้ม", "ประสิทธิภาพในการแนะนำเพลงยังทำได้ไม่ดีนักเมื่อเทียบกับคู่แข่งในตลาด", "พบปัญหาในการประมวลผลคำถามเชิงตรรกะและการสะกดคำที่ซับซ้อน"], "full_paragraphs": ["Sonos ได้เปิดตัวระบบสั่งงานด้วยเสียงตัวใหม่ที่ชื่อว่า Sonos Voice Control ซึ่งถูกออกแบบมาเพื่อยกระดับประสบการณ์การใช้งานลำโพงภายในบ้านของผู้ใช้ให้มีความสะดวกสบายมากยิ่งขึ้น โดยเน้นไปที่การควบคุมการเล่นเพลงและการจัดการอุปกรณ์ภายในระบบนิเวศของ Sonos เป็นหลัก", "จากการทดสอบพบว่า Sonos Voice Control ทำหน้าที่ได้ดีเยี่ยมในการสั่งงานพื้นฐาน เช่น การจัดกลุ่มลำโพง (Grouping) หรือการยกเลิกการจัดกลุ่มลำโพง (Ungrouping) นอกจากนี้ยังมีฟีเจอร์ที่น่าสนใจอย่างการค้นหาเพลงผ่านการอธิบายรายละเอียดของหน้าปกอัลบั้ม ซึ่งถือเป็นจุดเด่นที่ช่วยให้ผู้ใช้เข้าถึงคลังเพลงได้ง่ายขึ้นโดยไม่ต้องจำชื่อเพลงหรือศิลปินเป๊ะๆ", "อย่างไรก็ตาม ในแง่ของความฉลาดในการแนะนำเพลง (Recommendations) ระบบนี้ยังถือว่าทำได้ไม่ดีนักเมื่อเทียบกับผู้ช่วยอัจฉริยะเจ้าตลาดรายอื่นๆ ที่มีอัลกอริทึมการเรียนรู้พฤติกรรมผู้ใช้ที่ซับซ้อนกว่า ทำให้การค้นหาเพลงใหม่ๆ ที่ตรงใจผู้ใช้ยังคงเป็นจุดที่ต้องปรับปรุง", "นอกจากนี้ ระบบยังแสดงให้เห็นถึงข้อจำกัดที่ชัดเจนในด้านการประมวลผลภาษาและการสะกดคำ ตัวอย่างที่เห็นได้ชัดคือเมื่อผู้ใช้ถามคำถามเชิงตรรกะหรือการสะกดคำ เช่น การถามว่ามีตัวอักษร 'r' กี่ตัวในคำว่า 'strawberry' ระบบกลับไม่สามารถให้คำตอบที่ถูกต้องได้ ซึ่งสะท้อนให้เห็นว่า Sonos Voice Control ยังคงเน้นไปที่การควบคุมฮาร์ดแวร์มากกว่าการเป็นผู้ช่วยอัจฉริยะที่รอบรู้ในทุกด้าน"], "link": "https://gizmodo.com/sonos-27voice-hands-on-2000841142", "canonical_link": "https://gizmodo.com/sonos-27voice-hands-on-2000841142", "cover_image_url": "https://gizmodo.com/app/uploads/2026/03/sonos-play-review-8.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795006832, "published_at": "2026-11-18T13:00:32Z", "published_th": "18 พ.ย. 2026 • 20:00 น.", "category_hint": "Gadgets"}, {"id": 1795006867040, "guid": "https://9to5mac.com/?p=1081094", "original_title": "MacPaw’s Moonlock comes to iPhone, helping users detect potential scams", "thai_title": "MacPaw เปิดตัว Moonlock บน iPhone ช่วยผู้ใช้ตรวจจับกลโกงและเสริมความปลอดภัย", "tag": "Gadgets", "sub_tag": "MOBILE", "bullet_points": ["MacPaw ขยายบริการ Moonlock จาก Mac มาสู่ iPhone เพื่อช่วยผู้ใช้ตรวจจับกลโกงและเพิ่มความปลอดภัยให้กับอุปกรณ์", "แอปพลิเคชันเน้นการตรวจสอบข้อความที่น่าสงสัย ภาพหน้าจอ และ QR Code รวมถึงตรวจสอบการรั่วไหลของข้อมูลอีเมล", "ฟีเจอร์เด่นประกอบด้วยระบบคัดกรอง SMS ขยะ, การประเมินคะแนนความปลอดภัย (Security Score) และคำแนะนำในการตั้งค่าอุปกรณ์", "Moonlock สำหรับ iPhone เปิดให้ดาวน์โหลดฟรี โดยมีรูปแบบการสมัครสมาชิกรายเดือนในราคา 9.99 ดอลลาร์ หรือรายปี 49.99 ดอลลาร์"], "full_paragraphs": ["หลังจากที่ MacPaw ได้เปิดตัว Moonlock สำหรับ Mac ไปเมื่อปีที่แล้ว ล่าสุดบริษัทได้นำแอปพลิเคชันตรวจจับกลโกงนี้มาลงบน iPhone อย่างเป็นทางการแล้วในวันนี้", "เมื่อครั้งที่ MacPaw เปิดตัว Moonlock บน Mac ทางบริษัทได้อธิบายว่าแอปนี้เป็นเครื่องมือที่เข้ามาเสริมความปลอดภัยที่มีอยู่เดิมของ Apple ช่วยป้องกันมัลแวร์เฉพาะของ Mac และช่วยให้ผู้ใช้เข้าใจเรื่องความปลอดภัยทางไซเบอร์ได้ดียิ่งขึ้น", "ในทางปฏิบัติ แอปบน Mac จะมีการป้องกันภัยคุกคามแบบเรียลไทม์ ผู้ใช้สามารถสแกนหาไฟล์มัลแวร์ที่ซ่อนอยู่ในโฟลเดอร์ระบบหรือไฟล์แนบในอีเมลได้ด้วยตนเอง นอกจากนี้ยังมี VPN สำหรับเข้ารหัสข้อมูลการใช้งานอินเทอร์เน็ต รวมถึงเครื่องมือตรวจสอบเครือข่ายที่แสดงว่าแอปต่างๆ กำลังส่งข้อมูลไปที่ใด และระบบ AI ที่ช่วยวิเคราะห์ข้อความเพื่อหาเบาะแสของการฟิชชิ่ง (Phishing)", "สำหรับการเปิดตัว Moonlock บน iPhone ในวันนี้ ทางบริษัทระบุว่าแอปนี้จะช่วยให้ผู้คนสามารถจดจำกลโกงที่อาจเกิดขึ้น เข้าใจสถานะความปลอดภัยของ iPhone และดำเนินการตามขั้นตอนที่ใช้งานได้จริงเพื่อปรับปรุงความปลอดภัยให้ดียิ่งขึ้น", "อย่างไรก็ตาม Moonlock บน iPhone จะแตกต่างจากเวอร์ชัน Mac ตรงที่จะไม่มีการสแกนหามัลแวร์ เนื่องจากข้อจำกัดของ iOS ที่ป้องกันไม่ให้แอปภายนอกเข้าถึงแอปอื่นหรือไฟล์ของแอปเหล่านั้นได้ โดยแอปจะมุ่งเน้นไปที่การระบุกลโกง การตรวจสอบข้อมูลส่วนบุคคลที่อาจรั่วไหล และการช่วยให้ผู้ใช้ปรับปรุงการตั้งค่าความปลอดภัยของ iPhone แทน", "บน iPhone ผู้ใช้สามารถตรวจสอบข้อความ ภาพหน้าจอ และ QR Code ที่น่าสงสัยได้อย่างรวดเร็วเพื่อหาการฟิชชิ่ง รวมถึงตรวจสอบว่าที่อยู่อีเมลของผู้ใช้เคยปรากฏอยู่ในเหตุการณ์ข้อมูลรั่วไหล (Data Breach) ที่เป็นที่รู้จักหรือไม่", "MacPaw อธิบายว่าฟีเจอร์ 'Scam Detect' ของ Moonlock จะช่วยให้ผู้คนตรวจสอบข้อความที่น่าสงสัยที่พบเจอในแต่ละวันได้ ไม่ว่าจะเป็นข้อความ SMS ภาพหน้าจอที่เพื่อนแชร์มา หรือ QR Code โดยผู้ใช้สามารถคัดลอก สแกน หรือแชร์เนื้อหาเหล่านั้นไปยัง Moonlock เพื่อรับการประเมินว่าเหตุใดเนื้อหานั้นจึงอาจเข้าข่ายน่าสงสัย", "Oleg Stukalenko หัวหน้าฝ่ายจัดการผลิตภัณฑ์ของ Moonlock จาก MacPaw กล่าวถึงการเปิดตัวในครั้งนี้ว่า: 'ตอนที่เราเปิดตัว Moonlock เป้าหมายของเราคือการทำให้ความปลอดภัยทางไซเบอร์เป็นสิ่งที่ใครๆ ก็เข้าใจและใช้งานได้ แต่ในปัจจุบันกิจกรรมส่วนใหญ่ของผู้คน ตั้งแต่การทำธุรกรรมธนาคารไปจนถึงการสนทนาในชีวิตประจำวัน ต่างเกิดขึ้นบนโทรศัพท์มือถือ การนำ Moonlock มาสู่ iPhone จึงเป็นก้าวต่อไปที่สำคัญ เราต้องการช่วยให้ผู้คนตรวจพบกลโกงก่อนที่จะกดคลิก ดูว่าสถานะความปลอดภัยของตนเป็นอย่างไร และรู้ว่าต้องทำอย่างไรต่อไป'", "MacPaw ระบุเพิ่มเติมว่า Moonlock สำหรับ iPhone ยังมาพร้อมกับฟีเจอร์อื่นๆ ได้แก่ Safe SMS ที่จะคัดกรองข้อความที่น่าสงสัยออกจากกล่องข้อความโดยอัตโนมัติเมื่อเปิดใช้งาน พร้อมบันทึกข้อมูลว่าข้อความใดถูกตรวจพบและเพราะเหตุใด", "นอกจากนี้ยังมีฟีเจอร์ Security Score ที่ให้คะแนนความปลอดภัยตั้งแต่ 0 ถึง 100 ซึ่งสะท้อนถึงการตั้งค่าความปลอดภัยของ iPhone พร้อมคำแนะนำทีละขั้นตอนเพื่อช่วยให้ผู้ใช้ปรับปรุงความปลอดภัยให้ดียิ่งขึ้น รวมถึงฟีเจอร์ Email Breach History ที่แจ้งเตือนหากอีเมลของผู้ใช้รั่วไหล และ Device and Network Checks ที่ช่วยตรวจสอบความปลอดภัยของ Wi-Fi, การตั้งรหัสผ่าน, การอัปเดต iOS และสัญญาณของการเจลเบรก (Jailbreaking)", "Moonlock สำหรับ iPhone เปิดให้ดาวน์โหลดฟรีบน App Store โดยมีตัวเลือกการสมัครสมาชิกในราคา 9.99 ดอลลาร์ต่อเดือน หรือ 49.99 ดอลลาร์ต่อปี"], "link": "https://9to5mac.com/2026/11/18/macpaws-moonlock-comes-to-iphone-helping-users-detect-potential-scams/", "canonical_link": "https://9to5mac.com/2026/11/18/macpaws-moonlock-comes-to-iphone-helping-users-detect-potential-scams", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2026/11/macpaw-moonlock.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795006800, "published_at": "2026-11-18T13:00:00Z", "published_th": "18 พ.ย. 2026 • 20:00 น.", "category_hint": "Gadgets"}, {"id": 1795005064251, "guid": "https://9to5mac.com/?p=1081063", "original_title": "Banks, FAA, Microsoft, Apple – no systemic attack on the US, says White House", "thai_title": "ทำเนียบขาวและรัฐบาลสหรัฐฯ ยืนยัน เหตุระบบไอทีล่มของ Microsoft, FAA, ธนาคาร และ Apple ไม่ใช่การโจมตีทางไซเบอร์ระดับประเทศ", "tag": "Gadgets", "sub_tag": "APPLE", "bullet_points": ["เกิดเหตุระบบไอทีขัดข้องต่อเนื่องในสหรัฐฯ ทั้ง Microsoft 365, ระบบควบคุมการจราจรทางอากาศของ FAA, ระบบธนาคาร Chase และบริการของ Apple", "ทำเนียบขาวและเจ้าหน้าที่ระดับสูงยืนยันว่าเหตุการณ์เหล่านี้ไม่เกี่ยวข้องกันและไม่ใช่การโจมตีจากรัฐต่างชาติหรือกลุ่มแฮกเกอร์", "Marco Rubio รัฐมนตรีต่างประเทศสหรัฐฯ ระบุว่าแต่ละเหตุการณ์มีสาเหตุที่แตกต่างกันโดยสิ้นเชิง", "วุฒิสมาชิก Mark Warner เตือนให้บริษัทและหน่วยงานรัฐต้องเร่งอุดช่องโหว่ความปลอดภัยให้เร็วขึ้น เนื่องจาก AI ช่วยให้ผู้ไม่หวังดีหาช่องโหว่ได้รวดเร็วขึ้น"], "full_paragraphs": ["การเกิดเหตุระบบไอทีขัดข้องครั้งใหญ่หลายครั้งติดต่อกันในช่วงที่ผ่านมา ทำให้เกิดกระแสคาดการณ์ไปต่างๆ นานาว่าเหตุการณ์เหล่านี้อาจมีความเชื่อมโยงกัน และอาจเป็นสัญญาณว่าสหรัฐอเมริกากำลังเผชิญกับการโจมตีอย่างเป็นระบบจากรัฐที่เป็นศัตรู อย่างไรก็ตาม หลักฐานทั้งหมดที่มีในขณะนี้บ่งชี้ไปในทิศทางตรงกันข้าม โดยแต่ละเหตุการณ์มีคำอธิบายแยกจากกันอย่างชัดเจน ซึ่งล่าสุดทำเนียบขาวได้ออกมาให้ข้อมูลเพื่อยุติความกังวลดังกล่าวแล้ว", "เหตุการณ์เริ่มขึ้นเมื่อวันพฤหัสบดีที่ผ่านมา โดยระบบ Microsoft 365 เกิดการล่มเป็นวงกว้างและต่อเนื่องไปจนถึงวันถัดมาเนื่องจากมีปัญหาทางเทคนิคสองประการที่เกิดขึ้นพร้อมกันโดยไม่เกี่ยวข้องกัน ต่อมาในวันศุกร์ เกิดเหตุระงับการบินทั่วสหรัฐฯ เนื่องจากปัญหาด้านการสื่อสารที่ส่งผลกระทบต่อศูนย์ควบคุมการจราจรทางอากาศทั้งหมด จากนั้นในวันจันทร์ ระบบของธนาคาร Chase เกิดข้อผิดพลาด (Bug) ส่งผลกระทบต่อทั้งตัวธนาคารเองและธนาคารอื่นๆ ที่ทำธุรกรรมร่วมกับ Chase และล่าสุดเมื่อวานนี้ บริการหลายอย่างของ Apple ก็ไม่สามารถใช้งานได้ รวมถึงร้านค้าปลีกของ Apple ก็ได้รับผลกระทบด้วยเช่นกัน", "แม้ว่าเหตุการณ์ที่ Apple จะดูเหมือนไม่ได้อยู่ในความสนใจของฝ่ายบริหารมากนัก แต่รายงานจาก CBS News ระบุว่า Marco Rubio รัฐมนตรีต่างประเทศสหรัฐฯ ได้ออกมากล่าวว่าเหตุการณ์ที่เกิดขึ้นทั้งหมดนั้นไม่มีความเกี่ยวข้องกัน", "Marco Rubio กล่าวว่า “เหตุการณ์ที่เกิดขึ้นกับ Microsoft ไม่เกี่ยวข้องอะไรกับสิ่งที่เราเห็นจาก FAA และ FAA ก็ไม่เกี่ยวข้องกับสิ่งที่เราเห็นจากธนาคารเมื่อไม่กี่วันก่อน ปัญหาทางเทคนิคเหล่านี้ที่เราพบนั้นไม่มีความเกี่ยวข้องกันเลยแม้แต่น้อย”", "เขายังกล่าวเสริมอีกว่า “เราไม่มีหลักฐานหรือเหตุผลใดๆ ที่จะเชื่อได้ว่าเหตุการณ์ที่เกิดขึ้นแยกกันหรือเป็นรายกรณีเหล่านี้เกี่ยวข้องกับผู้ไม่หวังดี แฮกเกอร์ อาชญากร รัฐต่างชาติ หรือผู้ที่มีเจตนาร้ายใดๆ ทั้งสิ้น แต่ละเหตุการณ์มีความแตกต่างกันและมีสาเหตุที่มาที่แตกต่างกันอย่างชัดเจน”", "คำแถลงดังกล่าวได้รับการสนับสนุนจากวุฒิสมาชิก Mark Warner ซึ่งเป็นรองประธานคณะกรรมาธิการข่าวกรองของวุฒิสภา โดยเขากล่าวเมื่อวันอังคารว่า ไม่มีข้อบ่งชี้ใดๆ ว่าเหตุการณ์เหล่านี้เป็นผลมาจากการโจมตี", "อย่างไรก็ตาม Warner ได้กล่าวทิ้งท้ายว่า ความสามารถของระบบ AI ในการค้นหาช่องโหว่ด้วย “ความเร็วที่ไม่เคยปรากฏมาก่อน” หมายความว่าทั้งบริษัทเอกชนและหน่วยงานรัฐบาลจำเป็นต้องเตรียมพร้อมที่จะแก้ไขช่องโหว่เหล่านั้นในทันที"], "link": "https://9to5mac.com/2026/11/18/banks-faa-microsoft-apple-no-systemic-attack-on-the-us-says-white-house/", "canonical_link": "https://9to5mac.com/2026/11/18/banks-faa-microsoft-apple-no-systemic-attack-on-the-us-says-white-house", "cover_image_url": "https://9to5mac.com/wp-content/uploads/sites/6/2026/11/Banks-FAA-Microsoft-Apple-–-no-systemic-attack-on-the-US-says-White-House.jpg?quality=82&strip=all&w=1600", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795005024, "published_at": "2026-11-18T12:30:24Z", "published_th": "18 พ.ย. 2026 • 19:30 น.", "category_hint": "Gadgets"}, {"id": 1795005064254, "guid": "https://www.gsmarena.com/samsung_one_ui_9_5_app_lock_feature-news-75522.php", "original_title": "Samsung brings the native App Lock feature to Galaxy phones with One UI 9.5", "thai_title": "Samsung เปิดตัวฟีเจอร์ App Lock ใน One UI 9.5 บนสมาร์ตโฟน Galaxy อย่างเป็นทางการ", "tag": "Gadgets", "sub_tag": "WEARABLES", "bullet_points": ["Samsung ประกาศเปิดตัวโปรแกรมทดสอบ One UI 9.5 Beta สำหรับซีรีส์ Galaxy S26 ในบางประเทศ", "ฟีเจอร์ใหม่ 'App Lock' ช่วยให้ผู้ใช้ล็อกแอปพลิเคชันรายตัวด้วย PIN, รูปแบบ, รหัสผ่าน หรือลายนิ้วมือ", "เมื่อล็อกแอปฯ ระบบจะซ่อนการแจ้งเตือนและนำวิดเจ็ตออกจากหน้าจอหลักโดยอัตโนมัติเพื่อความเป็นส่วนตัว", "One UI 9.5 มาพร้อมการอัปเกรดฟีเจอร์ด้านสุขภาพ, กล้องถ่ายภาพ, ความเป็นส่วนตัว และการเข้าถึง (Accessibility) ที่ดียิ่งขึ้น", "โปรแกรม Beta เปิดให้ทดสอบแล้วในเยอรมนี, อินเดีย, โปแลนด์, เกาหลีใต้, สหราชอาณาจักร และสหรัฐอเมริกา"], "full_paragraphs": ["Samsung ได้ประกาศเปิดตัวโปรแกรมทดสอบ One UI 9.5 Beta สำหรับสมาร์ตโฟนตระกูล Galaxy S26 ในบางประเทศอย่างเป็นทางการ โดยการอัปเดตในเวอร์ชันนี้มาพร้อมกับฟีเจอร์ใหม่ที่น่าสนใจมากมาย รวมถึงฟีเจอร์ที่ผู้ใช้รอคอยอย่าง App Lock แบบเนทีฟ (Native App Lock)", "สำหรับฟีเจอร์ App Lock ตามชื่อเรียกของมันคือการเปิดโอกาสให้ผู้ใช้งานสามารถล็อกแอปพลิเคชันแต่ละตัวได้โดยตรง ซึ่งแอปฯ ที่ถูกล็อกจะสามารถเข้าถึงได้ก็ต่อเมื่อมีการยืนยันตัวตนผ่าน PIN, รูปแบบ (Pattern), รหัสผ่าน หรือการสแกนลายนิ้วมือที่ลงทะเบียนไว้เท่านั้น", "นอกจากนี้ เมื่อคุณทำการล็อกแอปพลิเคชันด้วย App Lock ระบบจะทำการซ่อนการแจ้งเตือนของแอปฯ นั้นๆ และนำวิดเจ็ตออกจากหน้าจอหลักโดยอัตโนมัติ เพื่อป้องกันไม่ให้ผู้อื่นเห็นข้อมูลสำคัญ และสำหรับผู้ใช้งาน Galaxy S26 Ultra ยังสามารถตั้งค่าให้ฟีเจอร์ Privacy Display เปิดใช้งานโดยอัตโนมัติทุกครั้งที่เปิดแอปฯ ที่ถูกล็อกไว้ได้อีกด้วย", "ในส่วนของโปรแกรม One UI 9.5 Beta นั้น ขณะน lus และนักลงทุนชื่อดัง กำลังผลักดันโครงการที่ผสมผสานความหลงใหลในโปรเจกต์สุดโต่งและแนวคิดเสรีนิยมเข้าด้วยกัน SLAB เป็นแผนงานที่ไม่เป็นทางการสำหรับการสร้าง 'Seastead' หรือเมืองลอยน้ำที่ออกแบบมาให้คงอยู่ได้นานถึงหนึ่งพันปี ซึ่ง Luckey ระบุว่ามันจะทำหน้าที่เป็นรัฐอธิปไตยเพื่อหลีกเลี่ยงกฎหมายที่เข้มงวดซึ่งเขามองว่าเป็นการ 'บั่นทอน' ศักยภาพขององค์กรต่างๆ", "ภาพเรนเดอร์จาก AI ในช่วงเริ่มต้นเผยให้เห็นเกาะเทียมขนาดมหึมาที่สร้างขึ้นเหนือระดับน้ำทะเล ประกอบด้วยอาคารสำนักงาน อพาร์ตเมนต์ โรงกลั่น และสิ่งที่ดูคล้ายกับศูนย์ข้อมูลตั้งอยู่บริเวณมุมซ้ายบนของโครงสร้าง", "Luckey ได้เขียนข้อความผ่านโพสต์ที่สร้างความฮือฮาว่า 'ในขณะที่ชุมชน Seasteading ส่วนใหญ่อยากจะหนีออกจากสหรัฐฯ เพื่อไปสูบกัญชา แต่โปรเจกต์นี้ถูกออกแบบมาอย่างชัดเจนเพื่อทำให้สหรัฐฯ แข็งแกร่งขึ้น โดยเป็นวาล์วระบายแรงดันสำหรับกฎระเบียบที่ล้าสมัยหรือขาดการพิจารณาอย่างรอบคอบ'", "สำหรับผู้ที่สงสัยว่า 'Seasteading คืออะไร' หรือ 'นี่ไม่ใช่แค่ศูนย์ข้อมูล AI ลอยน้ำหรอกหรือ?' ความสับสนนี้ถือเป็นเรื่องปกติ เนื่องจากโปรเจกต์นี้ใช้ภาษาและแนวคิดที่ล้ำสมัยเกินกว่าที่คนทั่วไปหรือผู้ที่ไม่ใช่มหาเศรษฐีสายเทคโนโลยีจะคุ้นเคย", "ในโพสต์บน X (Twitter) ของเขา Luckey ระบุว่า 'การขาย Oculus ให้กับ Facebook ในปี 2014 ทำให้ผมมีเงินทุนสำหรับเรียนขับเฮลิคอปเตอร์และพัฒนา Seastead ที่ชื่อว่า SLAB ซึ่งมีอายุการใช้งานถึง 1,000 ปี เป้าหมายคือการทำให้มีต้นทุนที่ถูกกว่าการสร้างบนบก และปราศจากกฎหมายระดับรัฐหรือท้องถิ่นที่บั่นทอนอุตสาหกรรมสำคัญของอเมริกา เช่น การแปรรูปโลหะ, การวิจัย/การรักษาทางการแพทย์, การกลั่นน้ำทะเล, การกลั่นน้ำมัน และวิศวกรรมเคมี'", "แนวคิดเรื่อง Seasteading คือการสร้างโครงสร้างลอยน้ำในมหาสมุทรที่ห่างไกลพอ เพื่อให้สามารถสร้างเมืองและกำหนดกฎหมายของตนเองได้ แนวคิดนี้ถูกพูดถึงมานานหลายปีโดยกลุ่มมหาเศรษฐีสายเทคโนโลยี เช่น Peter Thiel และ Joe Lonsdale อย่างไรก็ตาม Seastead แห่งเดียวที่เคยเป็นข่าวโด่งดังคือ Sea Island ซึ่งครั้งหนึ่งเว็บไซต์ Pirate Bay เคยเล็งไว้เพื่อใช้เป็นฐานปฏิบัติการ", "Luckey กล่าวเสริมว่า 'แม้ว่าหนทางยังอีกยาวไกล แต่ก็มีความคืบหน้าอย่างมีนัยสำคัญสู่เป้าหมายของผมในการฟื้นฟูแนวคิด Manifest Destiny และการขยายอิทธิพลไปทางตะวั e will start boosting public view counts when you watch on a TV", "thai_title": "YouTube เตรียมปรับเพิ่มยอดวิวบนทีวีด้วยระบบนับผู้ชมร่วม (Co-viewing) แบบใหม่", "tag": "Gadgets", "sub_tag": "WEARABLES", "bullet_points": ["YouTube เตรียมนำระบบนับยอดวิวแบบ 'Co-viewing' มาใช้สำหรับการรับชมผ่านทีวี เพื่อสะท้อนจำนวนผู้ชมที่แท้จริงในกรณีที่มีคนดูพร้อมกันหลายคน", "ระบบนี้จะครอบคลุมทั้งวิดีโอยาว, YouTube Shorts และวิดีโอไลฟ์สด โดยเน้นเฉพาะการรับชมผ่านหน้าจอทีวีเท่านั้น", "YouTube ยืนยันว่าจะไม่มีการใช้กล้อง ไมโครโฟน หรืออุปกรณ์ตรวจจับใดๆ แต่จะใช้ 'โมเดลทางสถิติที่ปลอดภัยต่อความเป็นส่วนตัว' ในการประเมินผล", "การปรับเปลี่ยนนี้จะไม่ส่งผลกระทบต่อรายได้จากโฆษณา หรือเกณฑ์การเข้าร่วม YouTube Partner Program (YPP) แต่อย่างใด"], "full_paragraphs": ["ยอดวิวบน YouTube กำลังจะเพิ่มสูงขึ้นอีกครั้งด้วยตัวชี้วัดใหม่ โดยแพลตฟอร์มวิดีโอสตรีมมิ่งของ Google แห่งนี้อาจเริ่มนับจำนวนผู้ชมมากกว่าหนึ่งคนในกรณีที่มีการรับชมวิดีโอผ่านหน้าจอทีวี ข้อมูลดังกล่าวมาจากโพสต์บน X (Twitter เดิม) ของ YouTube Creator Insider ซึ่งระบุว่ายอดวิวส่วนเกินที่เรียกว่า 'Co-views' นี้ จะถูกนำมาใช้กับทั้งวิดีโอยาว (Long-form), YouTube Shorts และวิดีโอไลฟ์สด โดยมีผลเฉพาะกับการรับชมผ่านทีวีเท่านั้น", "YouTube เชื่อว่าที่ผ่านมามีการนับจำนวนผู้ชมต่ำกว่าความเป็นจริงในสถานการณ์ที่มีการรับชมเป็นกลุ่ม ทำให้ครีเอเตอร์ไม่เห็นภาพรวมที่แท้จริงของการเข้าถึงวิดีโอ โดยทางแพลตฟอร์มระบุว่าเป้าหมายของตัวชี้วัดใหม่นี้คือการ '[ปรับให้สอดคล้อง] กับมาตรฐานอุตสาหกรรมทีวี ซึ่งรวมถึงวิธีการที่เครือข่ายการออกอากาศแบบดั้งเดิมและเครือข่ายสตรีมมิ่งใช้ในการประเมินจำนวนผู้ที่ได้รับชมเนื้อหาทั้งหมด'", "หลายคนอาจสงสัยว่า YouTube จะทราบได้อย่างไรว่ามีใครกำลังรับชมอยู่บ้างนอกจากเจ้าของบัญชี? ทางแพลตฟอร์มได้เน้นย้ำว่า จะไม่มีการใช้ 'อุปกรณ์, กล้อง, ไมโครโฟน หรือสิ่งใดก็ตามในลักษณะนั้น' แต่ยอดวิวจะถูกประเมินโดยใช้ 'โมเดลทางสถิติที่ปลอดภัยต่อความเป็นส่วนตัว' (privacy-safe statistical model) ซึ่งอ้างอิงจากรูปแบบข้อมูลประชากรและระยะเวลาในการรับชม โดยมีการปรับเทียบกับข้อมูลจากการทดสอบในสถานการณ์จริง อย่างไรก็ตาม YouTube ไม่ได้เปิดเผยรายละเอียดเชิงลึกเกี่ยวกับวิธีการคำนวณเพิ่มเติมแต่อย่างใด", "ระบบใหม่นี้จะแสดงยอดวิวสาธารณะและระยะเวลาในการรับชมที่สูงขึ้นสำหรับวิดีโอต่างๆ ซึ่งจะช่วยให้ครีเอเตอร์มีข้อมูลมากขึ้นในการวางกลยุทธ์ช่อง การนำเสนอแบรนด์ และอื่นๆ (โดยพารามิเตอร์ Co-view จะไม่มีผลย้อนหลังกับวิดีโอเก่า) แต่สิ่งที่ครีเอเตอร์จะไม่ได้รับเพิ่มคือรายได้จากโฆษณา โดย YouTube Creator Insider ระบุว่า 'Co-views ไม่ส่งผลกระทบต่อรายได้จากโฆษณาหรือเกณฑ์ของ YPP โดยรายได้ของครีเอเตอร์ การจ่ายเงินผ่าน AdSense และคุณสมบัติในการเข้าร่วม YouTube Partner Program จะยังคงอ้างอิงจากยอดวิวที่มีคุณภาพ (Qualified Views) และชั่วโมงการรับชม (Watch Hours) ตามเดิม'"], "link": "https://www.engadget.com/2320163/youtube-will-start-boosting-public-view-counts-when-you-watch-on-a-tv/", "canonical_link": "https://www.engadget.com/2320163/youtube-will-start-boosting-public-view-counts-when-you-watch-on-a-tv", "cover_image_url": "https://www.engadget.com/img/gallery/youtube-will-start-boosting-public-view-counts-when-you-watch-on-a-tv/l-intro-1794981997.jpg", "gallery_images": ["https://www.engadget.com/img/gallery/youtube-will-start-boosting-public-view-counts-when-you-watch-on-a-tv/intro-1794981997.jpg"], "videos": [], "review_score": "", "published_ts": 1794982080, "published_at": "2026-11-18T06:08:00Z", "published_th": "18 พ.ย. 2026 • 13:08 น.", "category_hint": "Gadgets"}, {"id": 1794978979353, "guid": "https://www.gsmarena.com/iqoo_z12_lite_shows_up_in_the_google_play_console_has_key_specs_revealed-news-75514.php", "original_title": "iQOO Z12 Lite shows up in the Google Play Console, has key specs revealed", "thai_title": "iQOO Z12 Lite ปรากฏชื่อบน Google Play Console เผยสเปกเบื้องต้นเตรียมวางจำหน่ายเร็วๆ นี้", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["iQOO Z12 Lite (โมเดล I2510) ปรากฏข้อมูลบนฐานข้อมูล Google Play Console แล้ว", "สเปกเบื้องต้นมาพร้อมชิปเซ็ต MediaTek Dimensity 6300 และ RAM ขนาด 4GB หรือ 6GB", "หน้าจอมีความละเอียด 720x1600 พิกเซล และรันบนระบบปฏิบัติการ Android 16", "มีความเป็นไปได้สูงว่ารุ่นนี้จะเป็นการรีแบรนด์มาจาก i ecting 90% of Fortune 500 Firms", "thai_title": "สตาร์ทอัพ Vibe ค้นพบช่องโหว่ร้ายแรง กระทบ 90% ของบริษัทในกลุ่ม Fortune 500", "tag": "Gadgets", "sub_tag": "GADGETS", "bullet_points": ["บริษัทสตาร์ทอัพด้านความปลอดภัยไซเบอร์ชื่อ Vibe ค้นพบช่องโหว่ซอฟต์แวร์ที่มีความสำคัญระดับสูง", "ช่องโหว่ดังกล่าวส่งผลกระทบต่อบริษัทขนาดใหญ่ถึง 90% ในกลุ่ม Fortune 500", "Calif กำลังสร้างชื่อเสียงในฐานะผู้เชี่ยวชาญด้านการตรวจพบข้อผิดพลาด (Bugs) ที่มีผลกระทบในวงกว้าง", "การค้นพบครั้งนี้เน้นย้ำถึงความเปราะบางของโครงสร้างพื้นฐานดิจิทัลที่องค์กรระดับโลกใช้งานอยู่"], "full_paragraphs": ["บริษัทสตาร์ทอัพที่ชื่อว่า Vibe ได้สร้างความฮือฮาในวงการความปลอดภัยไซเบอร์ หลังจากที่พวกเขาประสบความสำเร็จในการค้นพบช่องโหว่ซอฟต์แวร์ที่มีความสำคัญอย่างยิ่ง ซึ่งส่งผลกระทบต่อบริษัทขนาดใหญ่ถึง 90% ของรายชื่อ Fortune 500 การค้นพบครั้งนี้ถือเป็นเครื่องพิสูจน์ถึงความสามารถของทีมงานในการเจาะลึกและตรวจสอบระบบที่ซับซ้อนซึ่งองค์กรระดับโลกต่างพึ่งพา", "ในขณะเดียวกัน Calif กำลังก้าวขึ้นมาเป็นชื่อที่น่าจับตามองในอุตสาหกรรมเทคโนโลยี โดยเฉพาะอย่างยิ่งในด้านการค้นพบข้อผิดพลาด (Bugs) ที่มีผลกระทบในวงกว้าง บริษัทกำลังสร้างชื่อเสียงจากการตรวจสอบที่เข้มข้นและการระบุปัญหาที่อาจกลายเป็นภัยคุกคามร้ายแรงต่อโครงสร้างพื้นฐานดิจิทัลขององค์กรต่างๆ", "การค้นพบช่องโหว่ในครั้งนี้ไม่ได้เป็นเพียงแค่เรื่องของความผิดพลาดทางเทคนิคทั่วไป แต่เป็นประเด็นที่สะท้อนให้เห็นถึงความเปราะบางของซอฟต์แวร์ที่ใช้กันอย่างแพร่หลายในระดับองค์กร ซึ่งหากไม่ได้รับการแก้ไขอย่างทันท่วงที อาจนำไปสู่ความเสี่ยงด้านความปลอดภัยที่ประเมินค่าไม่ได้สำหรับบริษัทชั้นนำทั่วโลก", "ด้วยผลงานที่โดดเด่นนี้ Vibe และ Calif ได้กลายเป็นกรณีศึกษาสำคัญที่แสดงให้เห็นว่า สตาร์ทอัพขนาดเล็กที่มีความเชี่ยวชาญเฉพาะทางสามารถสร้างแรงกระเพื่อมและเปลี่ยนแปลงมาตรฐานความปลอดภัยในโลกไซเบอร์ได้อย่างไร โดยเฉพาะเมื่อต้องรับมือกับระบบที่ดูเหมือนจะมั่นคงและปลอดภัยในระดับ Fortune 500"], "link": "https://gizmodo.com/a-startup-vibe-coded-its-way-to-finding-a-vulnerability-affecting-90-of-fortune-500-firms-2000841501", "canonical_link": "https://gizmodo.com/a-startup-vibe-coded-its-way-to-finding-a-vulnerability-affecting-90-of-fortune-500-firms-2000841501", "cover_image_url": "https://gizmodo.com/app/uploads/2026/11/java-script-code.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794970162, "published_at": "2026-11-18T02:49:22Z", "published_th": "18 พ.ย. 2026 • 09:49 น.", "category_hint": "Gadgets"}, {"id": 1794970000245, "guid": "https://9to5mac.com/?p=1081047", "original_title": "Apple announces App Store price changes in multiple countries, new California tax rules", "thai_title": "Apple ประกาศปรับราคา App Store ในหลายประเทศ พร้อมอัปเดตเกณฑ์ภาษีใหม่ในรัฐแคลิฟอร์เนีย", "tag": "Gadgets", "sub_tag": "APPLE", "bullet_points": ["Apple ประกาศปรับราคาแอปพลิเคชันและ In-App Purchases ใน 5 ประเทศ เริ่มมีผลตั้งแต่วันที่ 3 ธันวาคมนี้", "มีการปรับเปลี่ยนเกณฑ์ภาษีใน 4 ประเทศ ได้แก่ บอตสวานา แคเมอรูน โกตดิวัวร์ และรวันดา เพื่อให้สอดคล้องกับกฎหมายภาษีท้องถิ่น", "เพิ่มหมวดหมู่ภาษีใหม่ 'Software as a Service (SaaS)' สำหรับนักพัฒนาใน App Store Connect", "ตั้งแต่วันที่ 1 มกราคม 2027 เป็นต้นไป แอปฯ ในหมวด SaaS และหมวดอื่นๆ จะต้องเสียภาษีการขายและภาษีการใช้งานในรัฐแคลิฟอร์เนีย"], "full_paragraphs": ["Apple ได้ประกาศอย่างเป็นทางการว่า ราคาของแอปพลิเคชันและรายการซื้อภายในแอป (In-App Purchases) บน App Store จะมีการปรับเปลี่ยนใน 5 ประเทศ เริ่มตั้งแต่วันที่ 3 ธันวาคมนี้ โดยเป็นผลสืบเนื่องมาจากการเปลี่ยนแปลงด้านภาษีและอัตราแลกเปลี่ยนเงินตราต่างประเทศ", "ในประกาศที่เผยแพร่ผ่านพอร์ทัลสำหรับนักพัฒนา Apple ได้ระบุถึงชุดการเปลี่ยนแปลงด้านราคาบน App Store รวมถึงการอัปเดตกฎเกณฑ์ทางภาษีที่มีผลกระทบต่อนักพัฒนาและลูกค้าในหลายประเทศ รวมถึงสหรัฐอเมริกาด้วย", "ตามข้อมูลจากบริษัท รายได้ของนักพัฒนาจากการขายแอปและ In-App Purchases ที่เข้าเกณฑ์ได้ถูกปรับเปลี่ยนใน 4 ประเทศ เพื่อสะท้อนถึงการอัปเดตภาษีดังนี้: บอตสวานา (มีการนำภาษีมูลค่าเพิ่ม VAT มาใช้ที่ 14%), แคเมอรูน (มีการนำภาษี Significant Economic Presence หรือ SEP มาใช้ที่ 3%), โกตดิวัวร์ (มีการนำภาษี SEP มาใช้ที่ 3%) และรวันดา (มีการนำภาษีมูลค่าเพิ่ม VAT มาใช้ที่ 18%)", "สำหรับในกรณีของบอตสวานาและรวันดา Apple ระบุว่า 'ภาคผ จำ เว้นแต่คุณจะเป็นผู้เชี่ยวชาญด้านไอที โชคดีที่หากปัญหาเกิดจากซอฟต์แวร์ คุณมักจะไม่ต้องเสียค่าใช้จ่ายใดๆ ในการแก้ไข", "ขั้นตอนแรกคือการตัดประเด็นเรื่องฮาร์ดแวร์ที่มีปัญหาออกไปก่อน ลองเสียบไดรฟ์เข้ากับพอร์ตอื่น หรือเปลี่ยนไปใช้สาย USB หรือ Thunderbolt เส้นอื่นที่รองรับ ทั้งนี้สาย Thunderbolt สามารถรองรับทั้งการชาร์จ การถ่ายโอนข้อมูล และวิดีโอ ดังนั้นจึงควรใช้สายและพอร์ตที่ถูกต้องเสมอ นอกจากนี้ โปรดจำไว้ว่า External Drive ทุกตัวต้องการแหล่งจ่ายไฟ พอร์ต USB บนคอมพิวเตอร์บางพอร์ตอาจจ่ายไฟไม่เพียงพอ และแน่นอนว่าหากไดรฟ์ของคุณมีช่องสำหรับเสียบอะแดปเตอร์ AC คุณจำเป็นต้องเสียบปลั๊กให้เรียบร้อยก่อน หากเป็นไปได้ให้ลองนำไดรฟ์ไปเสียบกับคอมพิวเตอร์เครื่องที่สองเพื่อทดสอบ", "ในบางกรณี Windows หรือ macOS อาจตรวจพบไดรฟ์แต่ไม่สามารถโหลดข้อมูลได้ ซึ่งอาจเกิดจากการฟอร์แมตที่ไม่ถูกต้อง สำหรับ Windows 11 ให้เปิด Device Manager โดยค้นหาจากแถบงาน (Taskbar) จากนั้นขยายส่วน Disk drives หากไดรฟ์ของคุณปรากฏขึ้นมา คุณอาจสามารถกู้คืนได้โดยการคลิกขวาที่ไดรฟ์ เลือก Properties > Volumes > Populate", "ถัดมาให้คลิกที่ Disk Management และมองหาหมายเลขดิสก์ที่คุณเห็นก่อนหน้านี้ หากไม่มีการกำหนดอักษรระบุไดรฟ์ (Drive Letter) คุณอาจสามารถกำหนดค่าได้ด้วยตนเอง แต่หากไดรฟ์ไม่มีการฟอร์แมตแบบ NTFS คุณอาจต้องฟอร์แมตใหม่เพื่อให้ใช้งานกับ Windows ได้ ซึ่งการทำเช่นนี้จะทำให้ข้อมูลที่มีอยู่เดิมสูญหายทั้งหมด ดังนั้นให้ถือว่าวิธีนี้เป็นทางเลือกสุดท้าย ก่อนที่จะฟอร์แมตใหม่ แนะนำให้ลองใช้เครื่องมือ CHKDSK ของ Windows โดยเปิดแอป Terminal ผ่านการค้นหาในแถบงาน แล้วพิมพ์คำสั่ง chkdsk [drive letter] /r ซึ่งวิธีนี้จะช่วยทั้งการแก้ไขข้อผิดพลาดและกู้คืนเซกเตอร์ที่เสียหาย", "สำหรับผู้ใช้ Mac วิธีแก้ปัญหาทางซอฟต์แวร์ที่ครอบคลุมที่สุดคือการใช้ Disk Utility เมื่อเปิดแอปแล้ว ให้เลือก View > Show All Devices หากคุณเห็นไดรฟ์ของคุณ ให้คลิกที่รายการนั้นแล้วเลือก Mount ที่ด้านบนของแอป หากวิธีนี้ไม่ได้ผล ให้คลิกที่ First Aid แทน ซึ่งอาจช่วยให้คุณซ่อมแซมข้อผิดพลาดได้โดยไม่สูญเสียข้อมูล แต่หากไม่สำเร็จ Disk Utility จะอนุญาตให้คุณฟอร์แมตไดรฟ์ใหม่ ซึ่งจะทำให้ข้อมูลทั้งหมดถูกลบออกไป", "ความเป็นไปได้ที่ง่ายกว่านั้นคือคุณอาจจำเป็นต้องอัปเดตไดร dgets"}, {"id": 1795008664781, "guid": "https://www.rockpapershotgun.com/steamdb-will-add-affiliate-links-to-authorised-game-retailers-and-a-new-tab-dedicated-to-mods-first-update-since-nexus-mods-takeover-confirms", "original_title": "SteamDB will add \"affiliate links to authorised game retailers\" and a new tab dedicated to mods, first update since Nexus Mods takeover confirms", "thai_title": "SteamDB เตรียมเพิ่มระบบ Affiliate ลิงก์ร้านค้าและแท็บ Mod ใหม่ หลังถูก Nexus Mods เข้าซื้อกิจการ", "tag": "Gaming", "sub_tag": "GAMING", "bullet_points": ["SteamDB ประกาศอัปเดตฟีเจอร์ใหม่ครั้งใหญ่ครั้งแรกหลังถูก Nexus Mods เข้าซื้อกิจการเมื่อเดือนกันยายนที่ผ่านมา", "เตรียมเพิ่มแท็บ Mod ใหม่ที่แสดงข้อมูลจาก Nexus Mods โดยตรง เพื่อช่วยให้ผู้ใช้ค้นหาและเข้าถึง Mod ได้ง่ายขึ้น", "เพิ่มระบบ Affiliate ลิงก์สำหรับร้านค้าเกมที่ได้รับอนุญาต เพื่อช่วยให้ผู้ใช้เปรียบเทียบราคาเกมที่ถูกที่สุด", "ยืนยันว่าจะไม่รองรับตลาดมืด (Grey-market) และการจัดลำดับราคาจะยึดตามความถูกที่สุด ไม่ใช่ค่าคอมมิชชันที่ได้รับ", "ทีมงานเน้นย้ำว่านี่เป็นเพียงช่วงเริ่มต้นของการพัฒนา และจะมีการปรับปรุงระบบหลังบ้านให้เสถียรยิ่งขึ้นในอนาคต"], "full_paragraphs": ["นับเป็นครั้งแรกที่มีการอัปเดตครั้งสำคัญหลังจากที่เจ้าของ Nexus Mods ได้เข้าซื้อกิจการ SteamDB จากผู้ก่อตั้งเดิมเมื่อเดือนกันยายนที่ผ่านมา ล่าสุดทั้งสองฝ่ายได้ประกาศถึงฟีเจอร์ใหม่ที่จะถูกเพิ่มเข้ามาในฐานข้อมูลเกมที่ขับเคลื่อนโดยชุมชนแห่งนี้ โดยจะมีการเพิ่ม Affiliate ลิงก์เพื่อช่วยให้ผู้ใช้งานค้นหาราคาเกมที่ถูกที่สุด และการเพิ่มแท็บใหม่สำหรับแสดง Mod จาก Nexus Mods โดยเฉพาะ พร้อมกับการปรับปรุงระบบหลังบ้านอย่างต่อเนื่อง", "Victor Folmann ซีอีโอของ Chosen ซึ่งเป็นบริษัทเจ้าของ Nexus Mods ได้เขียนบล็อกบน SteamDB ว่า \"ตอนนี้ผ่านไปสองสามเดือนแล้วนับตั้งแต่มีการประกาศ [การเข้าซื้อกิจการ] ผมจึงคิดว่าถึงเวลาแล้วที่เราจะแชร์อัปเดตสั้นๆ เกี่ยวกับสิ่งที่เรากำลังทำอยู่เบื้องหลัง รวมถึงการเปลี่ยนแปลงบางอย่างที่คุณจะเริ่มเห็นในช่วงสัปดาห์ต่อจากนี้\"", "Folmann ได้ชี้ให้เห็นถึงฟีเจอร์ใหม่หลักๆ สองอย่างที่จะปรากฏบน SteamDB ในเร็วๆ นี้ อย่างแรกคือแท็บใหม่ในหน้าเพจของเกมที่รองรับการลง Mod ซึ่งจะแสดงรายการ Mod ที่โฮสต์อยู่บน Nexus Mods รวมถึงข้อมูลที่เกี่ยวข้องกับการ Mod ต่างๆ \"แท็บใหม่นี้จะช่วยให้คุณค้นพบ Mod สำหรับเกมที่คุณกำลังดูอยู่บน SteamDB ทำให้ง่ายต่อการตรวจสอบว่าเกมนั้นมีชุมชน Mod ที่คึกคักหรือไม่ และสำรวจว่ามีอะไรให้เล่นบ้าง\" Folmann กล่าว \"สำหรับตอนนี้ เราจะแสดงเฉพาะ Mod จาก Nexus Mods เท่านั้น เนื่องจากเรามีข้อมูล Mod จำนวนมหาศาลอยู่แล้ว ซึ่งถือเป็นจุดเริ่มต้นที่ง่ายที่สุดสำหรับฟีเจอร์ใหม่นี้\"", "เขายังกล่าวเสริมถึงประเด็นที่หลายคนอาจสงสัยว่า \"เราเข้าใจดีว่าบางคนอาจสงสัยว่าทำไมเราถึงไม่รวม Steam Workshop เข้าไปด้วย ซึ่งแน่นอนว่าเราเปิดกว้างที่จะสำรวจความเป็นไปได้นี้ในขณะที่เราพัฒนาฟีเจอร์ให้ก้าวหน้าขึ้น รวมถึงแหล่งที่มาของ Mod อื่นๆ ด้วย หากคุณเป็นผู้ดูแลเว็บไซต์ Mod และสนใจที่จะนำ Mod ของชุมชนคุณมาแสดงร่วมกับเรา เรายินดีที่จะรับฟังจากคุณ\"", "ในขณะที่ฟีเจอร์แรกดูเหมือนจะเป็นเรื่องปกติ แต่ฟีเจอร์ถัดมากลับเป็นประเด็นที่ถกเถียงกันมากกว่า เนื่องจากในอดีต SteamDB ไม่ได้มุ่งเน้นเรื่องการหารายได้ \"สิ่งหนึ่งที่เราเห็นผู้คนเรียกร้องคือวิธีที่ง่ายกว่าในการค้นหาแหล่งซื้อเกมที่ถูกที่สุด และตอนนี้เรากำลังดำเนินการเพื่อให้สิ่งนั้นเกิดขึ้น\" Folmann ระบุ \"เราจะแนะนำ Affiliate ลิงก์ไปยังร้านค้าเกมที่ได้รับอนุญาต เพื่อให้คุณมีตัวเลือกมากขึ้นเมื่อมองหาราคาที่ดีที่สุดสำหรับเกมนั้นๆ\"", "เขายังย้ำถึงความกังวลในเรื่องนี้ว่า \"เราตระหนักดีว่าการนำ Affiliate ลิงก์มาใช้อาจก่อให้เกิดความกังวล ดังนั้นเราจึงอยากให้ชัดเจนว่ามันจะทำงานอย่างไร อย่างแรกและสำคัญที่สุดคือ เราจะแสดงเฉพาะร้านค้าที่ได้รับอนุญาตเท่านั้น เราจะไม่รวมร้านค้าในตลาดมืด (Grey-market) เข้ามาเด็ดขาด นอกจากนี้เรายังตัดสินใจอย่างชัดเจนเกี่ยวกับวิธีการแสดงราคา โดยร้านค้าจะถูกจัดลำดับตามราคาที่ถูกที่สุดในสกุลเงินของคุณ ไม่ใช่ร้านค้าที่ให้ค่าคอมมิชชันแก่เราสูงสุด หากร้านค้าใดไม่มีราคาในสกุลเงินของคุณ เราจะยังคงแสดงดีลในสกุลเงินอื่นหากมีให้บริการในภูมิภาคของคุณ\"", "ในการประกาศเข้าซื้อกิจการครั้งแรก Folmann ได้ระบุชัดเจนว่าผู้บริหารของ Nexus Mods จะมองหาวิธีการที่ SteamDB จะสามารถสร้างรายได้เพื่อเลี้ยงตัวเองได้ ดังนั้นการเพิ่มลิงก์เหล่านี้จึงไม่ใช่เรื่องที่น่าแปลกใจนัก ส่วนผู้ใช้งานป 0p เป็น 1080p"], "full_paragraphs": ["ถือเป็นข่าวร้ายสำหรับแฟนเกม GTA 6 ที่ยังคงคาดหวังว่าจะได้เห็นตัวเลือกการเล่นที่ 60fps บนเครื่อง PlayStation 5 Pro แม้ว่าเครื่องคอนโซลรุ่นอัปเกรดของ Sony จะถือเป็นเครื่องที่ทรงพลังที่สุดในตลาดปัจจุบัน แต่ก็ยังไม่สามารถรันผลงานชิ้นเอกชิ้นใหม่ของ Rockstar ที่ 60fps ได้ ข้อมูลนี้มาจาก Marc Chambers ผู้อำนวยการฝ่ายผลิตเทคโนโลยีของเกม ซึ่งยอมรับว่า PS5 Pro มีขีดจำกัดในการประมวลผล", "ในประเด็นที่ค่อนข้างเป็นที่ถกเถียงกัน GTA 6 ได้กำหนดเป้าหมายเฟรมเรตไว้ที่ 30fps ในทุกแพลตฟอร์มคอนโซลที่รองรับ โดยมีอัตราเฟรมเรตเท่ากันหมดตั้งแต่เครื่อง Xbox Series S ที่มีสเปกต่ำกว่า ไปจนถึงเครื่องที่ทรงพลังที่สุดอย่าง PS5 Pro", "แน่นอนว่ามีความแตกต่างในด้านอื่น ๆ และเวอร์ชัน PS5 Pro ก็มีฟีเจอร์เสริมพิเศษเพิ่มเข้ามา แต่ใครก็ตามที่คาดหวังว่าจะได้เห็นเฟรมเรตที่ลื่นไหลกว่านี้จำเป็นต้องปรับความคาดหวังลง อย่างน้อยก็จนกว่าเวอร์ชัน PC จะวางจำหน่ายในอนาคต", "Chambers กล่าวกับ Kotaku ว่า 'แม้ว่าหน่วยประมวลผลกลางของ PS5 Pro จะดีกว่าเครื่อง PS5 รุ่นมาตรฐานเล็กน้อย แต่มันก็ยังไม่ทรงพลังพอที่จะรันระบบจำลองที่ซับซ้อนของเกมในเฟรมเรตที่สูงขึ้นได้'", "อย่างไรก็ตาม เขากล่าวเสริมว่า PS5 Pro ยังคงมอบการปรับปรุงในด้านอื่น ๆ โดยระบุว่า 'การนำเสนอพื้นฐานของเราใช้การสะท้อนแสงแบบ Ray-traced และ Global illumination อยู่แล้ว แต่บน PS5 Pro สิ่งเหล่านี้จะถูกยกระดับขึ้นด้วยการเพิ่ม Ray-traced shadows รวมถึงความคมชัดโดยรวมที่เพิ่มขึ้นผ่านการใช้ PlayStation Spectral Super Resolution (PSSR) ซึ่ง PS5 Pro มีหน่วยประมวลผลกราฟิกที่ได้รับการอัปเกรดและเทคโนโลยีการอัปสเกลที่เรานำมาใช้เพื่อเพิ่มความละเอียดของภาพในเกมให้ดียิ่งขึ้น'", "ในการให้สัมภาษณ์กับ IGN ทาง Rob Nelson หัวหน้าสตูดิโอและหัวหน้าฝ่ายพัฒนาของ Rockstar กล่าวว่า หากจะให้ GTA 6 รันที่ 60fps จะต้องมีการเปลี่ยนแปลงพื้นฐานของเกม 'มากเกินไป' โดยเขากล่าวในบทสัมภาษณ์ใหญ่เกี่ยวกับ GTA 6 ที่เผยแพร่วันนี้ว่า 'มากเกินไปจริงๆ มันเป็นสิ่งที่ยอมรับไม่ได้สำหรับใครทั้งนั้น คำตอบง่ายๆ คือเมื่อคุณถามทีมเทคนิค พวกเขาก็จะตอบกลับมาว่า คุณได้เห็นมันหรือยัง? มันมีการประนีประนอม (ลดทอนคุณภาพ) มากเกินไปที่จะต้องทำเพื่อให้ได้สิ่งนั้น นั่นคือคำตอบสั้นๆ'", "นอกจากนี้ ยังมีรายละเอียดเพิ่มเติมเกี่ยวกับประสิทธิภาพของ GTA 6 บนเครื่อง Xbox Series S ซึ่งจะเป็นหนึ่งในเกมแรก ๆ ที่ใช้เทคโนโลยี AMD FSR 4.1 บน Xbox เพื่ออัปสเกลเกมที่กินทรัพยากรกราฟิกสูงจากความละเอียด 720p ขึ้นไปเป็น 1080p", "IGN ได้รวบรวมทุกข้อมูลที่คุณจำเป็นต้องทราบสำหรับการเปิดตัว GTA 6 รวมถึงเวลาการวางจำหน่ายทั่วโลก และรายละเอียดเกี่ยวกับการอัปเดต PS5 ในนาทีสุดท้ายที่คุณจำเป็นต้องดาวน์โหลด และหากคุณพลาดไป เมื่อคืนที่ผ่านมาเราได้ทราบตัวตนในชีวิตจริงของ Lucia ตัวละครหลักจาก GTA 6 แล้ว และขณะนี้เรากำลังเปิดบล็อกสดสำหรับการเปิดตัว GTA 6 ซึ่งเราจะใช้เพื่ออัปเดตทุกเรื่องราวเกี่ยวกับเกมนี้ให้คุณทราบตลอดหลายชั่วโมงข้างหน้า"], "link": "https://www.ign.com/articles/gta-6-will-never-get-a-60fps-update-on-playstation-pro-as-its-not-powerful-enough", "canonical_link": "https://www.ign.com/articles/gta-6-will-never-get-a-60fps-update-on-playstation-pro-as-its-not-powerful-enough", "cover_image_url": "https://assets-prd.ignimgs.com/2026/11/18/gtavi-18-1795006209352.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795006238, "published_at": "2026-11-18T12:50:38Z", "published_th": "18 พ.ย. 2026 • 19:50 น.", "category_hint": "Gaming"}, {"id": 1795010548186, "guid": "4f57a99e-5247-4ed7-aac8-53ed0dcea8e7", "original_title": "GTA 6 Uses FSR 4.1 on Xbox Series S to Upscale From 720p to 1080p", "thai_title": "เผยเบื้องหลัง GTA 6 บน Xbox Series S ใช้เทคโนโลยี FSR 4.1 อัปสเกลภาพจาก 720p สู่ 1080p", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["GTA 6 บน Xbox Series S ใช้เทคโนโลยี AMD FSR 4.1 ในการอัปสเกลภาพจากความละเอียดพื้นฐาน 720p ขึ้นไปเป็น 1080p", "การเลือกใช้ FSR 4.1 ช่วยให้ Rockstar สามารถรักษาเฟรมเรตของเกมไว้ที่ระดับ 30 fps บนคอนโซลรุ่นประหยัดอย่าง Xbox Series S ได้", "Xbox Series X และ PS5 รุ่นมาตรฐานเลือกใช้เทคโนโลยี TAA (Temporal Anti-Aliasing) ของ Rockstar เอง ในขณะที่ PS5 Pro ใช้ PSSR 2.0", "แม้จะมีข้อจำกัดด้านความละเอียด แต่ GTA 6 ได้รับการยกย่องว่าเป็นความสำเร็จครั้งยิ่งใหญ่และเป็นเกมที่ได้รับคะแนนรีวิวสูงสุดตลอดกาลบน Metacritic"], "full_paragraphs": ["ในที่สุด GTA 6 ก็วางจำหน่ายอย่างเป็นทางการแล้ว และถือเป็นผลงานระดับมาสเตอร์พีซทางเทคนิคบนทุกแพลตฟอร์มที่เกมรันอยู่ โดยเฉพาะอย่างยิ่งความสามารถของ Xbox Series S ที่สามารถรันเกมระดับนี้ได้ ซึ่งล่าสุดเราได้ทราบข้อมูลเพิ่มเติมแล้วว่า Rockstar สามารถทำสิ่งนี้ให้เกิดขึ้นได้อย่างไร", "จากการสัมภาษณ์กับ Wccftech พบว่าแทนที่จะเรนเดอร์เกมที่ความละเอียด Native 1440p ทาง Rockstar ได้เลือกใช้เทคโนโลยี FSR 4.1 ของ AMD เพื่ออัปสเกลภาพจาก 720p ขึ้นไปเป็น 1080p ซึ่งทำให้ GTA 6 กลายเป็นหนึ่งในเกมแรกๆ ที่ใช้เทคโนโลยีอัปสเกลตัวใหม่นี้บน Xbox และน่าจะเป็นปัจจัยสำคัญที่ทำให้เกมสามารถเล่นได้บนคอนโซลรุ่นประหยัดนี้", "จากการทดลองเล่น GTA 6 บน Xbox Series S แม้ว่าภาพจะดูมีความหยาบอยู่บ้างในบางจุด แต่ผลลัพธ์ที่ได้กลับดูดีกว่าที่คาดไว้มาก วัตถุต่างๆ ในเกมยังคงมีความละเอียดสูง แต่ขอบของวัตถุบางอย่าง โดยเฉพาะอาคารที่อยู่ไกลออกไปและเส้นผม จะเห็นรอยหยัก (Aliasing) ได้ค่อนข้างชัดเจน อย่างไรก็ตาม การเรนเดอร์ที่ความละเอียดต่ำกว่านี้คือสิ่งที่ทำให้เกมสามารถรักษาเฟรมเรตไว้ที่ประมาณ 30 fps ได้เป็นส่วนใหญ่ (แม้ว่าจะสังเกตเห็นอาการเฟรมตกไปอยู่ที่ระดับ 20 กลางๆ บ้างในบางจังหวะก็ตาม)", "ตามข้อมูลจากการสัมภาษณ์ Xbox Series S เป็นเวอร์ชันเดียวที่รันด้วย FSR 4 ในขณะที่เวอร์ชัน Xbox Series X และ PS5 รุ่นมาตรฐานเลือกใช้โซลูชัน TAA (Temporal Anti-Aliasing) ที่ Rockstar พัฒนาขึ้นเอง ส่วน PS5 Pro นั้นใช้เทคโนโลยี PSSR 2.0 นอกจากนี้ยังไม่น่าแปลกใจที่ Xbox Series S จะรันที่ความละเอียด Input ต่ำที่สุดในบรรดาคอนโซลทั้งหมดที่ 720p เมื่อเทียบกับ 1440p บนคอนโซลรุ่นอื่นๆ", "เมื่อ Wccftech สอบถาม Rockstar เกี่ยวกับเหตุผลที่เลือกใช้โซลูชันการอัปสเกลที่แตกต่างกันในแต่ละเครื่อง ทางทีมงานระบุว่า: \"ส่วนหนึ่งของกระบวนการ [ในการตั้งเป้าหมายที่ 30 fps] คือการกำหนดความละเอียดพื้นฐานและโซลูชันการอัปสเกลของเรา เราได้ประเมินแนวทางที่หลากหลายสำหรับคอนโซลแต่ละเครื่อง จากนั้นจึงเลือกการผสมผสานที่ให้ทั้งภาพและประสิทธิภาพตามที่เราต้องการ\" และถึงแม้จะมีปัญหาเรื่องพื้นผิวที่มีสัญญาณรบกวนและรอยหยักบ้าง แต่ FSR 4 ก็ช่วยให้ Rockstar บรรลุเป้าหมาย 30 fps บน Xbox Series S ได้อย่างแน่นอน", "ไม่ว่าอย่างไรก็ตาม GTA 6 ถือเป็นความสำเร็จครั้งยิ่งใหญ่ โดยในขณะนี้ได้กลายเป็นเกมที่ได้รับคะแนนรีวิวสูงที่สุดตลอดกาลบน Metacritic แล้ว และทาง IGN ได้ให้คะแนนไว้ที่ 10 เต็ม โดย Luke Reilly ผู้รีวิวได้กล่าวไว้ว่า: \"ด้วยรายละเอียดที่ประณีตบรรจง เต็มไปด้วยพื้นที่ให้ทดลองเล่นอย่างไม่สิ้นสุด และผ่านการออกแบบทางวิศวกรรมอย่างไม่มีการประนีประนอม Grand Theft Auto 6 คือวิดีโอเกมที่น่าประทับใจที่สุดเท่าที่ผมเคยเล่นมา\"", "นอกจากนี้ เรายังมีการรายงานสดการวางจำหน่ายของ GTA 6 ซึ่งถือเป็นการเปิดตัวที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์วงการเกมอย่างไม่ต้องสงสัย"], "link": "https://www.ign.com/articles/gta-6-uses-fsr-41-on-xbox-series-s-to-upscale-from-720p-to-1080p", "canonical_link": "https://www.ign.com/articles/gta-6-uses-fsr-41-on-xbox-series-s-to-upscale-from-720p-to-1080p", "cover_image_url": "https://assets-prd.ignimgs.com/2026/11/18/gtavi-41-1795004610502.jpg", "gallery_images": ["https://assets-prd.ignimgs.com/2026/11/18/gtavi-41-1795004663533.jpg"], "videos": [], "review_score": "", "published_ts": 1795004685, "published_at": "2026-11-18T12:24:45Z", "published_th": "18 พ.ย. 2026 • 19:24 น.", "category_hint": "Gaming"}, {"id": 1795006912075, "guid": "1965027", "original_title": "GTA 6’s GTA+ Subscription Includes A Free Supercar, Discounts, And More", "thai_title": "บริการสมาชิก GTA+ ใน GTA 6 มอบสิทธิพิเศษจัดเต็ม ทั้งรถซูเปอร์คาร์ฟรี ส่วนลด และสิทธิประโยชน์มากมาย", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["Rockstar Games ยืนยันการขยายบริการสมาชิก GTA+ ให้ครอบคลุมทั้ง GTA Online และ GTA 6 ในราคา 8 ดอลลาร์ต่อเดือน", "ผู้ที่สั่งซื้อ GTA 6 ล่วงหน้าจะได้รับสิทธิ์สมาชิก GTA+ ฟรี 1 เดือน", "สิทธิประโยชน์ใน GTA 6 ประกอบด้วยรถซูเปอร์คาร์ '90 Annis Venturas BLVD Elegy, โรงจอดรถส่วนตัว, และส่วนลด 10% สำหรับร้านค้าต่างๆ", "บริการสมาชิก GTA+ จะใช้งานได้เฉพาะช่วงที่ยังคงสถานะสมาชิกอยู่เท่านั้น หากยกเลิกสิทธิ์จะถูกระงับทันที", "GTA 6 ได้รับคะแนนรีวิวเต็มจาก GameSpot โดยได้รับการยกย่องว่าเป็นเกมที่ทะเยอทะยานที่สุดของ Rockstar"], "full_paragraphs": ["ในขณะที่ GTA 6 กำลังทยอยเปิดตัวไปทั่วโลก หากคุณเป็นสมาชิก GTA+ คุณจะสามารถรับไอเทมและสิทธิประโยชน์พิเศษเพิ่มเติมสำหรับการผจญภัยใน Vice City ได้ โดยทางผู้พัฒนาอย่าง Rockstar Games ได้เปิดเผยว่าจะมีการยกระดับบริการสมาชิกนี้ให้ครอบคลุมทั้ง GTA Online และ GTA 6 ด้วยค่าบริการ 8 ดอลลาร์ต่อเดือน ซึ่งผู้เล่นจะสามารถปลดล็อกสิทธิประโยชน์ภายในเกมได้มากมาย ไม่ว่าจะเป็นส่วนลดในร้านค้า ตัวเลือกการเดินทางสาธารณะที่มากขึ้น และความสามารถในการต่อรองราคาที่ดีขึ้น", "สำหรับผู้ที่สั่งซื้อ GTA 6 ล่วงหน้า คุณจะได้รับสิทธิ์สมาชิก GTA+ ฟรีเป็นเวลาหนึ่งเดือนโดยอัตโนมัติ อย่างไรก็ตาม มีข้อควรทราบคือบริการเหล่านี้จะสามารถใช้งานได้เฉพาะในขณะที่คุณยังเป็นสมาชิกอยู่เท่านั้น หากสมาชิกภาพของคุณหมดอายุหรือคุณทำการยกเลิก สิทธิประโยชน์เหล่านั้นจะไม่สามารถใช้งานได้อีกต่อไป ต่อไปนี้คือรายละเอียดของสิ่งที่คุณจะได้รับหากยังคงสถานะสมาชิกไว้", "รูปลักษณ์ภายนอกเป็นสิ่งสำคัญใน Vice City และคงไม่มีอะไรจะดูดีไปกว่าการขับรถซูเปอร์คาร์ '90 Annis Venturas BLVD Elegy ออกไปโลดแล่นบนท้องถนน โดยรถความเร็วสูงคันนี้สามารถนำไปเก็บไว้อย่างปลอดภัยในโรงจอดรถส่วนตัวที่ Crosstown ซึ่งภายในโรงจอดรถยังมีตู้เก็บอาวุธและความสามารถในการรับซื้อของโจรโดยตรงอีกด้วย คุณจะได้รับสิทธิ์เข้าถึงรถคันนี้หลังจากสำเร็จภารกิจในบทที่ 3 ของ GTA 6", "หากคุณต้องการใช้บริการขนส่งสาธารณะ คุณสามารถอัปเกรดสิ่งอำนวยความสะดวกเหล่านี้ได้ ซึ่งรวมถึงบริการ Scooter Bros Premium, สมาชิกพรีเมียมบนแอปพลิเคชันเรียกรถ RydeMe, บริการเช่าสกู๊ตเตอร์ จักรยาน และ Seashark ฟรี รวมถึงการใช้บริการขนส่งสาธารณะ Leonida ได้โดยไม่มีค่าใช้จ่าย", "นอกจากนี้ ธุรกิจบางแห่งทั่วเมืองจะมอบส่วนลด 10% สำหรับการใช้บริการของคุณ ซึ่งรวมถึงร้านขายอาวุธ ร้านเสื้อผ้า ร้านทำผม ร้านสัก ร้านแต่งรถ และอื่นๆ อีกมากมาย ยิ่งไปกว่านั้น การขายยานพาหนะที่เข้าเงื่อนไขจะทำให้คุณได้รับเงินเพิ่มขึ้นอีก 10% อีกด้วย", "ในขณะเดียวกัน ผู้เล่น GTA Online ก็จะได้รับความคุ้มค่าจาก GTA+ ในเดือนนี้เช่นกัน โดยสามารถปลดล็อกรถฟรี ส่วนลดภายในเกม ฟีเจอร์ของ Vinewood Car Club โบนัส และอื่นๆ อีกมากมาย หากคุณกำลังวางแผนจะไปเยือน Vice City อย่าลืมตรวจสอบศูนย์รวมคำแนะนำของ GTA 6 จาก GameSpot ซึ่งมีทั้งเคล็ดลับ กลเม็ด และบทสรุปที่จะช่วยให้คุณก้าวขึ้นสู่จุดสูงสุดของห่วงโซ่อาหารในโลกอาชญากรรมได้อย่างรวดเร็ว ตั้งแต่รายการสูตรโกง GTA 6 ไปจนถึงบทสรุปวิธีท้าทายโชคชะตาด้วยการทำระดับดาวหนีตำรวจให้ถึง 6 ดาว", "ปัจจุบัน GTA 6 กำลังได้รับคำวิจารณ์ในเชิงบวกอย่างล้นหลาม และบน GameSpot เกมนี้ถือเป็นเกมที่สองของปีที่ได้รับคะแนนเต็ม ซึ่งเป็นสิ่งที่เกิดขึ้นได้ยากมาก โดย Tamoor Hussain บรรณาธิการของ GameSpot ได้เขียนไว้ในบทวิจารณ์ GTA 6 ว่า 'เกมที่ทะเยอทะยานที่สุดของ Rockstar คุ้มค่าแก่การรอคอยอย่างแท้จริง'"], "link": "https://www.gamespot.com/articles/gta-6-gta-subscription-includes-a-free-supercar-discounts-and-more/", "canonical_link": "https://www.gamespot.com/articles/gta-6-gta-subscription-includes-a-free-supercar-discounts-and-more", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/GTA-6-launch-screens-23.jpg?w=300", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1795004575, "published_at": "2026-11-18T12:22:55Z", "published_th": "18 พ.ย. 2026 • 19:22 น.", "category_hint": "Gaming"}, {"id": 1795006912081, "guid": "e6e9ec65-3e8e-42fb-9bef-8b8919221be1", "original_title": "GTA 6 Xbox Series S Performance: How Does the Weakest Console Handle the Biggest Game of All Time?", "thai_title": "เจาะลึกประสิทธิภาพ GTA 6 บน Xbox Series S: คอนโซลรุ่นเล็กรับมือเกมฟอร์มยักษ์ได้แค่ไหน?", "tag": "Gaming", "sub_tag": "GTA", "bullet_points": ["GTA 6 บน Xbox Series S ทำเฟรมเรตได้ค่อนข้างคงที่ที่ 30 fps ในช่วงต้นเกม แม้จะมีอาการเฟรมตกบ้างในบางจังหวะ", "ตัวเกมใช้เทคโนโลยี FSR 4 ในการอัปสเกลภาพจาก 720p ขึ้นไปที่ 1080p ทำให้ภาพมีความนุ่มนวลและมีปัญหาเรื่องรอยหยัก (Aliasing) ตามขอบวัตถุ", "คุณภาพกราฟิกโดยรวมยังคงน่าประทับใจด้วยรายละเอียดตัวละครและสภาพแวดล้อมที่สวยงาม แม้จะขาดฟีเจอร์ระดับสูงอย่าง Ray Traced Shadows และ PSSR แบบบน PS5 Pro", "การทดสอบนี้เป็นเพียงช่วงต้นของเกมเท่านั้น ซึ่งต้องรอดูประสิทธิภาพในฉากแอ็กชันที่เข้มข้นกว่านี้ในช่วงท้ายเกมต่อไป"], "full_paragraphs": ["ในที่สุด GTA 6 ก็วางจำหน่ายแล้ว และหนึ่งในคำถามที่ใหญ่ที่สุดก่อนการเปิดตัวคือ Xbox Series S ซึ่งเป็นคอนโซลที่มีสเปกต่ำที่สุดในยุคนี้ จะสามารถรับมือกับเกมที่ยิ่งใหญ่ที่สุดตลอดกาลเกมนี้ได้อย่างไร ล่าสุดผมมีโอกาสได้ทดลองเล่นเกมนี้บนเครื่อง Xbox รุ่นจิ๋วนี้เป็นที่เรียบร้อยแล้ว", "Rockstar ได้ประกาศไว้เมื่อสองสามสัปดาห์ก่อนว่า GTA 6 ทุกเวอร์ชันจะ 'ตั้งเป้า' ไว้ที่ 30 fps แม้จะเป็นเรื่องน่าผิดหวังที่แม้แต่ PS5 Pro ก็ไม่สามารถทำเฟรมเรตได้ถึง 60 fps แต่ประสิทธิภาพระดับนี้ก็เป็นสิ่งที่ผมคาดการณ์ไว้สำหรับ Xbox Series S และในขณะที่ผมกำลังรอผลการวิเคราะห์เฟรมเรตจากคลิปแรกที่บันทึกไว้ ต้องบอกว่าเวอร์ชัน Xbox Series S นั้นทำออกมาได้ค่อนข้างดีเมื่อพิจารณาจากปัจจัยหลายๆ อย่าง", "แน่นอนว่า Xbox Series S ไม่ได้มีลูกเล่นด้านกราฟิกที่จัดเต็มเหมือนเวอร์ชัน PS5 Pro แต่ถึงแม้จะไม่มี Ray Traced Shadows และ PSSR ตัวเกมก็ยังดูดีบนเครื่องที่รองรับความละเอียด 1440p นี้ โมเดลตัวละครยังคงมีความละเอียดสูงมาก รวมถึงมีการใช้เทคนิค Subsurface Scattering ที่ดูดี และสภาพแวดล้อมก็สวยงามอย่างน่าทึ่ง ซึ่งไม่ต้องสงสัยเลยว่าเป็นการเรียนรู้มาจากประสบการณ์ของ Rockstar ในช่วงที่พัฒนา Red Dead Redemption 2", "อย่างไรก็ตาม จุดที่ Xbox Series S ยังทำได้ไม่ดีนักคือรายละเอียดที่เล็กน้อย ขอบของพื้นผิวเกือบทุกจุดมีอาการรอยหยัก (Aliasing) จนดูเหมือนมีเส้นขอบของสัญญาณรบกวนรอบตัวละครและอาคาร โดยเฉพาะบริเวณเส้นผม นอกจากนี้ยังมีฉากช่วงต้นเกมบนเรือที่ใบหน้าของ Jason ดูนุ่มนวลอย่างเห็นได้ชัดจนกว่ากล้องจะซูมเข้าไปใกล้ ซึ่งไม่ต้องสงสัยเลยว่าเป็นการลดภาระของ GPU ลง ทั้งนี้ตามรายงานของ Wccftech ระบุว่า GTA 6 บน Xbox Series S ใช้เทคโนโลยี FSR 4 ในการอัปสเกลภาพจาก 720p ขึ้นไปที่ 1080p ดังนั้นความนุ่มนวลของภาพจึงเป็นสิ่งที่คาดเดาได้อยู่แล้ว", "ตลอดช่วงบทนำของเกม GTA 6 มักจะรักษาระดับเฟรมเรตไว้ที่ 30 fps บน Xbox Series S ได้อย่างคงที่และลื่นไหลอย่างน่าประหลาดใจ อย่างไรก็ตาม มีบางช่วงของเกม เช่น ตอนที่ Lucia ชักปืนออกมาในฉากแรกๆ ที่เฟรมเรตตกลงไปบ้าง โดยปกติแล้วอาการเฟรมตกเหล่านี้จะเกิดขึ้นเพียงเล็กน้อย แต่ผมสังเกตเห็นว่ามีบางจังหวะที่เฟรมเรตตกลงไปต่ำถึง 24 fps ตามข้อมูลจาก Trdrop ถึงกระนั้น ผมต้องบอกว่าผมแทบไม่รู้สึกถึงอาการเฟรมตกส่วนใหญ่ที่เกิดขึ้นเลย", "ผมไม่ได้รับสิทธิ์เข้าถึงเกม GTA 6 ก่อนใคร ดังนั้นข้อมูลทั้งหมดนี้จึงอ้างอิงจากช่วงแรกของเกมเท่านั้น บททดสอบที่แท้จริงของประสิทธิภาพ GTA 6 จะอยู่ท เคยทำไว้ 98 คะแนน", "แม้ The Legend of Zelda: Ocarina of Time เวอร์ชันรีเมคจะเสียแชมป์คะแนนรีวิวไป แต่ก็ประสบความสำเร็จอย่างมหาศาลด้วยยอดขายกว่า 5 ล้านชุดภายใน 4 วันแรก", "บทวิจารณ์จาก GameSpot ยกย่องว่า GTA 6 คือจุดสูงสุดของเกมแนว Open-world ที่ยากจะมีเกมอื่นมาเทียบชั้นได้ในอนาคตอันใกล้"], "full_paragraphs": ["Grand Theft Auto 6 ได้วางจำหน่ายอย่างเป็นทางการแล้ว และไม่น่าแปลกใจเลยที่เกมนี้จะได้รับคำวิจารณ์ในเชิงบวกอย่างล้นหลาม แม้ว่าในปีนี้จะมีเกมคุณภาพเยี่ยมหลายเกมเปิดตัวออกมา แต่คำถามสำคัญคือ GTA 6 จะมีแรงส่งมากพอที่จะโค่นแชมป์เกมที่ได้รับคะแนนรีวิวสูงสุดของปีอย่าง The Legend of Zelda: Ocarina of Time เวอร์ชันรีเมคลงได้หรือไม่ คำตอบคือ 'ได้' อย่างชัดเจน เพราะไม่เพียงแต่ GTA 6 จะได้รับคะแนนรีวิวสูงกว่าเกมของ Nintendo เท่านั้น แต่ยังก้าวขึ้นมาเป็นหนึ่งในเกมที่ได้รับคะแนนสูงที่สุดตลอดกาลอีกด้วย", "เมื่อ The Legend of Zelda: Ocarina of Time เวอร์ชันรีเมคเปิดตัวในช่วงต้นเดือนพฤศจิกายน มันพุ่งทะยานขึ้นสู่จุดสูงสุดของตาราง Metacritic อย่างรวดเร็ว โดยทำคะแนน Metascore ได้ถึง 96 คะแนนจากเว็บไซต์พันธมิตรของ GameSpot ซึ่งคะแนนดังกล่าวมาจากบทวิจารณ์ทั้งหมด 128 สำนัก และ Metacritic จัดให้เกมนี้อยู่ในระดับ 'Universal Acclaim' สำหรับ GTA 6 นั้น ในขณะที่เขียนบทความนี้ เกมทำคะแนนรวมอยู่ที่ 99 คะแนนจากบทวิจารณ์ 98 สำนัก ซึ่งขาดไปเพียงแต้มเดียวก็จะได้รับคะแนนเต็ม อย่างไรก็ตาม ควรตั้งข้อสังเกตว่า The Legend of Zelda: Ocarina of Time มีจำนวนบทวิจารณ์มากกว่า GTA 6 ซึ่งส่งผลต่อการถ่วงน้ำหนักคะแนน แต่โดยรวมแล้วทั้งสองเกมต่างได้รับคะแนนจากสื่อชั้นนำทั่วโลกอย่างกว้างขวาง", "GTA 6 เป็นเกมที่สองในประวัติศาสตร์ที่ได้รับคะแนน Metascore สูงถึง 98 คะแนน และที่น่าสนใจคือมันทำคะแนนได้เท่ากับ The Legend of Zelda: Ocarina of Time ภาคต้นฉบับเมื่อปี 1998 พอดี ในเชิงประวัติศาสตร์ เกมตระกูล GTA มักจะมีคะแนนรีวิวรวมอยู่ในระดับสูงสุดเสมอ โดยเฉพาะหลังจากที่ซีรีส์เปลี่ยนผ่านเข้าสู่ยุค 3 มิติ เริ่มตั้งแต่ GTA 3 เป็นต้นมา ภาคหลักทุกภาคต่างได้รับคะแนน Metascore ในระดับ 90 ปลายๆ โดยที่ Grand Theft Auto 4 เคยเป็นเกมที่ได้รับคะแนนสูงสุดในแฟรนไชส์จนกระทั่ง GTA 6 เข้ามาทำลายสถิตินี้", "สำหรับคะแนน Metascore ของเกมใ  of Time", "tag": "Gaming", "sub_tag": "ZELDA", "bullet_points": ["GTA 6 สร้างประวัติศาสตร์ด้วยการทำคะแนนรีวิวเฉลี่ยบน Metacritic สูงถึง 99 คะแนน", "ขึ้นแท่นเป็นเกมที่ได้คะแนนสูงสุดตลอดกาลร่วมกับ The Legend of Zelda: Ocarina of Time บนเครื่อง N64", "IGN มอบคะแนนรีวิวให้ GTA 6 เต็ม 10 โดยยกย่องว่าเป็นเกมที่ออกแบบมาอย่างประณีตและไร้ที่ติ", "เกมระดับตำนานอื่นๆ ในยุคหลัง เช่น The Legend of Zelda: Breath of the Wild และ Red Dead Redemption 2 ทำคะแนนได้ที่ 97"], "full_paragraphs": ["GTA 6 ได้กลายเป็นเกมที่ได้รับคะแนนรีวิวสูงสุดตลอดกาลร่วมกัน หลังจากที่มีการเผยแพร่บทวิจารณ์จากสื่อต่างๆ ทั่วโลกในช่วงชั่วโมงที่ผ่านมา", "ผลงานชิ้นเอกของ Rockstar Games ปัจจุบันครองคะแนนเฉลี่ยสูงสุดตลอดกาลที่ 99 คะแนนบน Metacritic ซึ่งเป็นเกียรติยศที่เคยมีเพียง The Legend of Zelda: Ocarina of Time เวอร์ชันดั้งเดิมที่วางจำหน่ายบนเครื่อง N64 เมื่อปี 1997 หรือเกือบ 30 ปีที่แล้วเท่านั้นที่ทำได้ โดยนับตั้งแต่นั้นมายังไม่มีเกมใดสามารถทำสถิตินี้ได้ (สำหรับเวอร์ชันใหม่ของ Ocarina บน Switch 2 นั้นทำคะแนนไปได้ที่ 96 คะแนน)", "มีเกมเพียงไม่กี่ชื่อที่วางจำหน่ายในช่วงไม่กี่ปีที่ผ่านมาที่ทำคะแนนได้ใกล้เคียงกับระดับนี้ แม้ว่าหากย้อนกลับไปในยุคคอนโซลก่อนหน้า ทั้ง The Legend of Zelda: Breath of the Wild และ Super Mario Odyssey จาก Nintendo ต่างทำคะแนนเฉลี่ยได้ที่ 97 คะแนน ซึ่งเป็นระดับเดียวกับที่ Red Dead Redemption 2 ของ Rockstar เคยทำไว้", "บทวิจารณ์ GTA 6 ของ IGN ได้เผยแพร่ออกมาแล้วเช่นกัน โดยให้คะแนนเต็ม 10/10 พร้อมคำบรรยายว่าเกมนี้ \"เต็มไปด้วยรายละเอียดที่ประณีต พร้อมให้ผู้เล่นได้ทดลองสิ่งต่างๆ อย่างไม่สิ้นสุด และถูกสร้างสรรค์ขึ้นมาอย่างไม่มีการประนีประนอม\" รวมถึงยังเป็นเกมที่ \"ไม่เคยมีมาก่อน เหลือเชื่อ และเป็นเกมที่ห้ามพลาดด้วยประการทั้งปวง\"", "IGN ได้เตรียมข้อมูลทุกอย่างที่คุณจำเป็นต้องทราบสำหรับการเปิดตัว GTA 6 รวมถึงเวลาการวางจำหน่ายทั่วโลกของ GTA 6 และรายละเอียดเกี่ยวกับการอัปเดตบน PS5 ในนาทีสุดท้ายที่คุณจำเป็นต้องดาวน์โหลด นอกจากนี้ หากคุณพลาดข่าวไป เมื่อคืนที่ผ่านมาเราได้ทราบถึงตัวตนในชีวิตจริงของผู้ให้เสียงพากย์ตัวละคร Lucia ใน GTA 6 แล้ว และขณะนี้เรากำลังถ่ายทอดสดผ่านบล็อกเปิดตัว GTA 6 ซึ่งเรา ่วงถาม-ตอบของรายงานผลประกอบการไตรมาสที่ 3 ปี 2027 Harvey Jones ประธานบอร์ดบริหารของ Nvidia ได้กล่าวว่า คณะกรรมการกำลังให้ความสำคัญกับการสรรหาครั้งนี้อย่างจริงจังที่สุด", "“เราจะพิจารณาทั้งผู้สมัครจากภายในองค์กรและผู้สมัครจากภายนอก” Jones กล่าว “ทางบอร์ดตระหนักดีว่าเรากำลังอยู่ในโลกที่เทคโนโลยีซิลิคอนขั้นสูงและพลวัตด้านความมั่นคงของชาติกำลังสร้างการเปลี่ยนแปลงครั้งใหญ่ในตลาดของเรา ดังนั้น CEO คนใหม่ของเราจะต้องมีความสามารถในการนำพาบริษัทผ่านสถานการณ์เหล่านี้ไปได้อย่างระมัดระวังที่สุด”", "Jones ยังกล่าวเสริมอีกว่า บริษัท “จะไม่เร่งรีบแต่งตั้ง CEO จนกว่าจะพบคนที่เหมาะสมที่สุดอย่างแท้จริง” อย่างไรก็ตาม Jeff Bezos บอสใหญ่แห่ง Amazon ดูเหมือนจะมีความเห็นว่าการจ้างคนจากภายนอกเข้ามาบริหาร Nvidia อาจเป็นความผิดพลาดครั้งใหญ่", "“ถ้าคุณไม่สามารถดึง Jensen กลับมาได้ ผมก็จะไม่จ้างคนนอกเข้ามาเด็ดขาด” Bezos กล่าวระหว่างการประชุม Silicon Valley & The World เมื่อวันอังคารที่ผ่านมา (อ้างอิงจาก Yahoo Finance) “Nvidia มีความซับซ้อนเกินไป ผมคิดว่า CEO ที่มาจากภายนอกในบริษัทที่มีความซับซ้อนสูงนั้นมีโอกาสประสบความสำเร็จน้อยมาก ดังนั้นผมจึงมองว่านั่นควรเป็นทางเลือกสุดท้ายเสมอ”", "ในขณะนี้ Nvidia ได้ให้ Collette Kress ซึ่งดำรงตำแหน่ง CFO เข้ามารับหน้าที่รักษาการ CEO ไปก่อน ในขณะที่มีรายงานข่าวออกมาว่าอาจมีความเป็นไปได้ที่ Huang จะหวนคืนสู่บริษัทอีกครั้ง", "อดีตประธานของ Nvidia เคยกล่าวว่าเขาพร้อมจะกลับมา “หากคณะกรรมการบริษัทตัดสินใจว่าการกลับมาของผมเป็นประโยชน์สูงสุดต่อผู้ถือหุ้น พนักงาน บริษัท และประเทศชาติ” หลังจากที่มีการล่ารายชื่อเรียกร้องให้เขากลับมารับตำแหน่งเดิม แต่ทางบอร์ดบริหารของ Nvidia ได้ออกมาดับฝันในประเด็นนี้ไปเรียบร้อยแล้ว", "“บอร์ดบริหารของ Nvidia ยอมรับการลาออกของเขาอย่างเป็นเอกฉันท์ และไม่มีความตั้งใจที่จะแต่งตั้ง Jensen ให้กลับมาดำรงตำแหน่ง CEO อีกครั้ง” Jones กล่าวระหว่างช่วงเปิดการประชุมรายงานผลประกอบการ", "ไม่ว่าใครจะเป็นผู้ที่เข้ามารับไม้ต่อเป็นผู้นำคนใหม่ของ Nvidia แต่สิ่งหนึ่งที่ชัดเจนคือ พวกเขาจะต้องแบกรับภาระหน้าที่อันยิ่งใหญ่ หรืออย่างน้อยที่สุดก็ต้องสวมแจ็คเก็ตหนังราคาแพงตัวนั้นให้ได้เหมือนกับที่ Jensen เคยทำ"], "link": "https://www.pcgamer.com/hardware/graphics
