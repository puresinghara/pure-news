", "โปโกญอลีมีเวลาเก็บตัวกับลูกทีมรวม 24 วันในช่วงที่ผ่านมา ซึ่งถือว่านานพอสมควรสำหรับระดับทีมชาติ แต่เขายังไม่สามารถสร้างผลงานที่น่าประทับใจได้"], "full_paragraphs": ["ในโลกฟุตบอลระยะเวลาหนึ่งปีถือว่ายาวนานมาก และนั่นคือสิ่งที่เกิดขึ้นกับสถานการณ์ของทีมชาติสกอตแลนด์ในปัจจุบัน จากค่ำคืนแห่งประวัติศาสตร์ที่พวกเขาได้กลับไปลุยฟุตบอลโลกอีกครั้ง สู่ความพ่ายแพ้ที่น่าอับอาย 4-0 ต่อสวิตเซอร์แลนด์ในเกมปิดท้ายเนชันส์ลีก ความแตกต่างของทั้งสองช่วงเวลานั้นชัดเจนอย่างยิ่ง", "การล่มสลายในช่วงครึ่งหลังต่อทีมสวิตเซอร์แลนด์ชุดสำรองที่เมืองเซนต์กัลเลน ทำให้ทัพ 'ตาร์ตัน' ต้องพบกับความพ่ายแพ้ที่หนักที่สุดนับตั้งแต่โดนเยอรมนีถล่ม 5-1 ในศึกยูโร 2024", "หลังจากที่ สตีฟ คลาร์ก สามารถพาทีมไปลุยศึกยูโรได้ถึงสองสมัยติดต่อกัน การเข้ามารับไม้ต่อของ เซบาสเตียน โปโกญอลี จึงเป็นงานที่ยากลำบาก และหลังจากผ่านไปเพียง 6 นัด แฟนบอล 'ตาร์ตัน อาร์มี' บางส่วนก็เริ่มหมดความอดทนกับกุนซือรายนี้แล้ว", "กุนซือคนใหม่ทำผลงานชนะได้เพียง 2 นัดเท่านั้น ซึ่งเป็นการชนะนอร์ทมาซิโดเนียในกลุ่ม B1 การจบอันดับที่ 3 ทำให้สกอตแลนด์ต้องไปอยู่ในโถ 3 ในการจับสลากรอบคัดเลือกยูโร 2028 วันที่ 6 ธันวาคมนี้ ซึ่งหมายความว่าพวกเขาจะต้องเจอกับเส้นทางที่ยากลำบากกว่าเดิม", "โปโกญอลีต้องการเวลาในการทำทีม ซึ่งเป็นสิ่งที่ แอนดี โรเบิร์ตสัน กัปตันทีมยอมรับว่า 'ไม่มีให้' ในโลกฟุตบอลระดับทีมชาติ โดยกุนซือชาวเบลเยียมรายนี้เน้นย้ำเสมอถึงความอดทนในขณะที่เขาพยายามปรับเปลี่ยนสไตล์การเล่นให้เน้นเกมรุกมากขึ้น", "เขาชื่นชอบการใช้ระบบหลังสามที่มีวิงแบ็ก และมีกองกลางตัวรุกหรือเพลย์เมกเกอร์คอยสนับสนุนกองหน้าตัวเป้าเพียงคนเดียว เพื่อเน้นการเพรสซิ่งสูง แต่ปัญหาคือสกอตแลนด์ดูเหมือนจะไม่มีนักเตะที่เหมาะสมกับระบบนี้", "เบน กอนนอน-ดอค ปีกความเร็วสูงมักถูกจับไปเล่นในตำแหน่งวิงแบ็กขวาในระบบนี้ แต่พรสวรรค์ในการเล่นเกมรุกของเขาถูกจำกัดด้วยภาระหน้าที่ในเกมรับที่ระบบนี้ต้องการ", "ในขณะที่ สตีฟ คลาร์ก เคยใช้ระบบหลังห้าในช่วงแรกเพื่อรองรับทั้ง แอนดี โรเบิร์ตสัน และ จอห์น แม็กกินน์ แต่เขาก็กลับมาใช้ระบบหลังสี่แบบดั้งเดิมในเวลาต่อมา ทีมของคลาร์กอาจไม่ได้เล่นสนุกตื่นตาตื่นใจเสมอไป แต่พวกเขาก็ทำหน้าที่ได้สำเร็จเกือบทุกครั้ง", "คำถามสำหรับโปโกญอลีคือ เขาควรจะยึดมั่นในหลักการของตัวเองต่อไป หรือควรหันไปดูสิ่งที่กุนซือคนก่อนทำจนประสบความสำเร็จและสร้างความสุขให้แฟนบอลได้อีกครั้ง หลังจากผ่านไปสองแคมป์และ 6 นัด ช่วงเวลาแห่งการปรับตัวของกุนซือชาวเบลเยียมรายนี้ได้หมดลงแล้ว", "เวลาในการทำงานร่วมกับนักเตะเป็นสิ่งที่ผู้จัดการทีมชาติไม่มี แต่โปโกญอลีได้รับเวลามากกว่าคนอื่นด้วยซ้ำ จากช่วงพักเบรกทีมชาติที่ยาวนานระหว่างเดือนกันยายนถึงตุลาคม และแคมป์ล่าสุด ทำให้เขามีเวลารวมกับลูกทีมถึง 24 วัน ซึ่งเทียบเท่ากับเวลาที่สโมสรในสกอตติชพรีเมียร์ชิพมีตั้งแต่วันแรกของการปรีซีซั่นจนถึงเกมแรกในลีกคัพ", "แอนดี โรเบิร์ตสัน กลายเป็นนักเตะที่ติดทีมชาติสกอตแลนด์มากที่สุดในประวัติศาสตร์ในเกมที่พบกับสวิตเซอร์แลนด์ แต่กัปตันทีมรายนี้กลับไม่มีอะไรให้เฉลิมฉลอง 'สิ่งนั้นไม่ควรเกิดขึ้นในฟุตบอลระดับทีมชาติ' เขากล่าวกับ BBC Scotland หลังจบเกม", "'ผมไม่คิดว่าคุณจะมีเวลามากนักในฟุตบอลระดับทีมชาติ คุณต้องทำมันให้ได้ แฟนบอลที่เดินทางไปเชียร์ทุกที่ พวกเขาจะให้เวลาเราไหม? ไม่เลย คนที่อยู่ในแฮมป์เดนจะให้เวลาเราไหม? ไม่ คนที่อยู่นอกแฮมป์เดนที่จะวิจารณ์เรา ซึ่งก็สมควรแล้ว พวกเขาจะให้เวลาเราไหม? ไม่ เราไม่มีเวลา นักเตะไม่มีเวลา เราต้องก้าวข้ามมันไปให้ได้'", "จอห์น แม็กกินน์ กล่าวเสริมกัปตันทีมเมื่อถูกถามว่าสกอตแลนด์กำลังเดินมาถูกทางหรือไม่ว่า 'ก็นะ เห็นได้ชัดว่าผลลัพธ์ที่ออกมามันเป็นไปไม่ได้เลยที่ผมจะตอบว่าใช่'", "โปรแกรมทีมชาตินัดถัดไปจะมีขึ้นในเดือนมีนาคม โดยจะมีเกมอุ่นเครื่องสองนัดก่อนที่รอบคัดเลือกยูโร 2028 จะเริ่มต้นขึ้น โรเบิร์ตสันยอมรับว่าการรอคอยที่ยาวนานนี้ 'ไม่ใช่เรื่องดี' ในขณะที่พวกเขาต้องพยายามรวมพลังกันใหม่หลังจากความผิดหวังในเนชันส์ลีก", "แม้ว่าจะไม่มีเวลาในสนามซ้อมกับนักเตะ แต่โปโกญอลีจะมีเวลาในการประเมินขุมกำลังและแท็กติกของเขา หากสมาคมฟุตบอลสกอตแลนด์ตัดสินใจว่าเขายังคงเป็นคนที่ใช่ในการนำทีมชาติไปสู่ทัวร์นาเมนต์ใหญ่ครั้งต่อไป"], "link": "https://www.skysports.com/football/news/11095/13613120/scotland-whats-going-wrong-for-head-coach-sebastien-pocognoli-and-can-he-turn-things-around", "canonical_link": "https://www.skysports.com/football/news/11095/13613120/scotland-whats-going-wrong-for-head-coach-sebastien-pocognoli-and-can-he-turn-things-around", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-sebastien-pocognoli_7408472.jpg?20261117101348", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-scotland-switzerland_7408196.png?20261116220706", "https://e0.365dm.com/26/11/768x432/skysports-scotland-switzerland_7408110.jpg?20261116202357", "https://e0.365dm.com/26/11/768x432/skysports-scotland-switzerland_7408139.jpg?20261116210244", "https://e0.365dm.com/26/11/768x432/skysports-andy-robertson_7408481.png?20261117102104", "https://e0.365dm.com/26/10/768x432/skysports-scotland-sebastien_7370084.jpg?20261006225012"], "videos": [], "review_score": "", "published_ts": 1794905640, "published_at": "2026-11-17T08:54:00Z", "published_th": "17 พ.ย. 2026 • 15:54 น.", "category_hint": "Football"}, {"id": 1794902503272, "guid": "https://www.bbc.co.uk/sport/football/articles/cvgxvg4v981o", "original_title": "Why always him? The rise and fall of Balotelli", "thai_title": "ทำไมต้องเป็นเขาเสมอ? ย้อนรอยเส้นทางชีวิตและจุดเปลี่ยนของ มาริโอ บาโลเตลลี่", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["มาริโอ บาโลเตลลี่ อดีตกองหน้าชื่อดังชาวอิตาลี ผู้มีพรสวรรค์สูงแต่ถูกจดจำจากวีรกรรมนอกสนามมากกว่าผลงานในสนาม", "ความสัมพันธ์อันซับซ้อนกับ โรแบร์โต้ มันชินี่ กุนซือคู่บุญที่เปรียบเสมือนพ่อคนที่สอง และความขัดแย้งกับ โชเซ่ มูรินโญ่ ที่มองว่าเขาเป็นนักเตะที่ควบคุมไม่ได้", "วีรกรรมสุดแสบที่กลายเป็นตำนาน เช่น การจุดพลุในห้องน้ำจนเกิดไฟไหม้ และการฉลองประตูด้วยเสื้อ 'Why always me?' ในเกมแมนเชสเตอร์ดาร์บี้", "บทบาทสำคัญในการแอสซิสต์ให้ เซร์คิโอ อเกวโร่ ทำประตูชัยคว้าแชมป์พรีเมียร์ลีกครั้งแรกในประวัติศาสตร์ของ แมนเชสเตอร์ ซิตี้", "ปัจจุบันในวัย 36 ปี บาโลเตลลี่ยังคงค้าแข้งอยู่ในลีกสูงสุดของสหรัฐอาหรับเอมิเรตส์กับสโมสร อัล-อิตติฟาค"], "full_paragraphs": ["คำนิยามอย่าง 'จอมนอกคอก', 'ตัวปัญหา' หรือ 'ควบคุมไม่ได้' คือสิ่งที่ มาริโอ บาโลเตลลี่ ต้องเผชิญมาตลอดชีวิตการค้าแข้ง เขาอาจเป็นที่รู้จักจากวีรกรรมนอกสนามมากกว่าพรสวรรค์ที่ปฏิเสธไม่ได้ แต่กลับถูกมองว่าเสียของไปอย่างน่าเสียดาย ซึ่งดาวยิงชาวอิตาลีรายนี้มักจะตกเป็นพาดหัวข่าวอยู่เสมอ", "เวลาผ่านไป 15 ปีแล้วนับตั้งแต่การฉลองประตูอันโด่งดังด้วยเสื้อ 'Why always me?' (ทำไมต้องเป็นฉันเสมอ?) ในเกมแมนเชสเตอร์ดาร์บี้ ซึ่งเกิดขึ้นเพียงไม่กี่วันหลังจากที่เขาจุดพลุในห้องน้ำจนเกิดไฟไหม้บ้านพัก ปัจจุบันในวัย 36 ปี เขายังคงลงเล่นฟุตบอลอาชีพในลีกสูงสุดของสหรัฐอาหรับเอมิเรตส์กับสโมสร อัล-อิตติฟาค เคียงข้างกับ เอ็นอ็อค บาร์วูอาห์ พี่ชายแท้ๆ ของเขา", "BBC Sport จะพาไปย้อนดูเส้นทางอาชีพที่ผ่านสโมสรมาแล้วถึง 13 แห่ง ใน 6 ประเทศ รวมถึงการเป็นผู้จ่ายบอลให้เกิดประตูที่โด่งดังที่สุดในประวัติศาสตร์พรีเมียร์ลีก โดยเส้นทางของบาโลเตลลี่ไม่ได้เริ่มต้นจากอะคาเดมี่ของสโมสรยักษ์ใหญ่ แต่เขาเริ่มต้นจากการเล่นให้ ลูเมซซาเน่ ทีมในระดับดิวิชั่น 3 ของอิตาลี ใกล้บ้านเกิดในคอนเชซิโอ ก่อนจะไปทดสอบฝีเท้ากับ บาร์เซโลน่า แต่ไม่สำเร็จ และย้ายไปร่วมทีม อินเตอร์ มิลาน ในปี 2006", "ที่อินเตอร์ มิลาน บาโลเตลลี่ได้พบกับ โรแบร์โต้ มันชินี่ ผู้เป็นดั่งอาจารย์ใหญ่ ความสัมพันธ์ของทั้งคู่เปรียบเสมือนพ่อกับลูก ภายใต้การดูแลของกุนซือชาวอิตาลี บาโลเตลลี่ฉายแววโดดเด่นตั้งแต่อายุ 17 ปี โดยช่วยให้ทีมคว้าแชมป์กัลโช่ เซเรีย อา ฤดูกาล 2007-08 และเข้าถึงรอบชิงชนะเลิศโคปปา อิตาเลีย รวมถึงการทำ 2 ประตูใส่ ยูเวนตุส ในรอบก่อนรองชนะเลิศ", "ชีวิตของเขาเปลี่ยนไปเมื่อ โชเซ่ มูรินโญ่ เข้ามารับตำแหน่งต่อจากนั้น ไม่นานก็เกิดความขัดแย้งและการลงโทษทางวินัย โดยมูรินโญ่กล่าวว่าบาโลเตลลี่เป็นนักเตะที่ 'ควบคุมไม่ได้' และเคยวิจารณ์ฟอร์มการเล่นของเขาว่า 'ใกล้เคียงกับศูนย์' ความสัมพันธ์กับมูรินโญ่เต็มไปด้วยความตึงเครียด ซึ่งถือเป็นเรื่องยากที่กุนซือระดับ 'เดอะ สเปเชียล วัน' จะรับมือกับนักเตะคนหนึ่งไม่ได้ แม้บาโลเตลลี่จะคว้าแชมป์เซเรีย อา 3 สมัย และยูฟ่า แชมเปี้ยนส์ลีก กับอินเตอร์ แต่ชื่อเสียงในฐานะตัวปัญหาก็เริ่มบดบังผลงานในสนามของเขา", "ในเดือนสิงหาคม 2010 บาโลเตลลี่ย้ายไปร่วมทีม แมนเชสเตอร์ ซิตี้ เพื่อกลับมาร่วมงานกับมันชินี่อีกครั้ง กุนซือชาวอิตาลีพยายามพิสูจน์ว่าเขาสามารถควบคุมความคาดเดาไม่ได้ของบาโลเตลลี่ให้เป็นประโยชน์ต่อทีมได้ แต่ถึงกระนั้น บาโลเตลลี่ก็ยังคงสร้างประเด็นไม่หยุดหย่อน ทั้งการถูกใบแดง การขับรถชน และวีรกรรมปาปาเป้าใส่ผู้เล่นทีมเยาวชน ซึ่งแสดงให้เห็นถึงความไม่เป็นผู้ใหญ่", "หลังจากช่วยให้ แมนเชสเตอร์ ซิตี้ คว้าแชมป์เอฟเอ คัพ ในปี 2011 ซึ่งเป็นการสิ้นสุดการรอคอยถ้วยรางวัลใหญ่ในรอบ 35 ปี บาโลเตลลี่ก็ถูกวิจารณ์อย่างหนักจากการพยายามยิงท่าตอกส้นในเกมอุ่นเครื่องกับ แอลเอ กาแล็กซี่ จนมันชินี่ต้องเปลี่ยนตัวออกและตั้งคำถามถึงทัศนคติของเขาว่า 'ถ้าคุณจริงจัง คุณก็เล่นได้ 90 นาที แต่ถ้าไม่ คุณก็มานั่งข้างผมที่ม้านั่งสำรองได้เลย'", "บางครั้งความกล้าบ้าบิ่นของเขาก็ได้ผล เช่น ประตูที่ใช้หัวไหล่กระแทกเข้าประตูในเกมกับ นอริช ซิตี้ แต่ในเดือนตุลาคม 2011 เขาก็ตกเป็นข่าวใหญ่เมื่อหน่วยดับเพลิงต้องเข้าไประงับเหตุไฟไหม้ในห้องน้ำที่บ้านพักของเขา โดยบาโลเตลลี่อ้างว่าเป็นฝีมือของเพื่อน แต่ไม่กี่วันต่อมาเขาก็กลายเป็นฮีโร่ด้วยการทำประตูแรกในเกมที่ถล่ม แมนเชสเตอร์ ยูไนเต็ด 6-1 พร้อมโชว์เสื้อ 'Why always me?'", "มีเรื่องเล่ามากมายเกี่ยวกับเขา ทั้งการให้เงินคนไร้บ้าน 1,000 ปอนด์, การบุกไปที่โรงเรียนเพื่อจัดการกับเด็กที่รังแกนักเรียนคนอื่น หรือการขับรถแต่งตัวเป็นซานตาคลอสแจกของขวัญ ซึ่งแม้เจ้าตัวจะปฏิเสธหลายเรื่อง แต่ด้วยชื่อเสียงในตอนนั้นทำให้คนเชื่อว่าเป็นเรื่องจริง แฟนบอลซิตี้ถึงกับแต่งเพลงเชียร์ล้อเลียนอาการแพ้หญ้าของเขา และพฤติกรรมที่ชอบพกเงินสดเต็มกระเป๋าขับรถไปทั่วเมือง", "ในเดือนเมษายน 2012 บาโลเตลลี่ถูกใบแดงในเกมกับ อาร์เซน่อล ซึ่งดูเหมือนจะเป็นจุดจบของความหวังในการคว้าแชมป์ แต่หนึ่งเดือนต่อมา เขากลับเป็นคนแอสซิสต์ให้ เซร์คิโอ อเกวโร่ ทำประตูชัยในนาทีสุดท้ายในเกมกับ ควีนส์ปาร์ค เรนเจอร์ส ซึ่งทำให้ซิตี้คว้าแชมป์พรีเมียร์ลีกสมัยแรกได้สำเร็จ", "มิคาห์ ริชาร์ดส์ อดีตเพื่อนร่วมทีมกล่าวว่า 'เขาบ้าในทางที่ดี เขาเป็นสีสันของทีม เป็นฮีโร่ของแฟนบอลไม่ใช่แค่เรื่องนอกสนาม แต่ในสนามด้วย สิ่งที่ดีที่สุดคือเขาเป็นคนน่ารัก ไม่ได้หยิ่งผยองอย่างที่สื่อพยายามนำเสนอ เขาแค่บ้าๆ บอๆ นิดหน่อยเท่านั้น'", "อย่างไรก็ตาม ในเดือนมกราคม 2013 ความอดทนของมันชินี่ก็สิ้นสุดลงหลังจากมีปากเสียงกันในสนามซ้อม บาโลเตลลี่ถูกขายไปให้ เอซี มิลาน โดยมันชินี่กล่าวว่า 'เขาไม่ใช่คนเลวและเป็นนักเตะที่ยอดเยี่ยม แต่ผมเสียใจแทนเขาที่เขายังคงทำลายพรสวรรค์และคุณภาพของตัวเอง ผมไม่มีคำพูดใดๆ สำหรับพฤติกรรมของเขา ผมหวังว่าเขาจะเข้าใจว่าเขากำลังทำลายอนาคตของตัวเอง'", "เนดุม โอนูโอฮา อดีตเพื่อนร่วมทีมอีกคนกล่าวทิ้งท้ายว่า 'ครั้งหนึ่ง มาริโอเชื่อจริงๆ ว่าเขาเป็นหนึ่งในนักเตะที่ดีที่สุดในโลก มีเรื่องเล่าเกี่ยวกับเขามากมายที่ซิตี้ แต่ที่ผมจำได้แม่นคือตอนที่ใครสักคนพูดถึง ลิโอเนล เมสซี่ และ คริสเตียโน่ โรนัลโด้ แล้วมาริโอก็บอกว่าเขาเก่งเท่ากับคนเหล่านั้น และเขาพูดด้วยความจริงจังอย่างที่สุด'"], "link": "https://www.bbc.co.uk/sport/football/articles/cvgxvg4v981o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cvgxvg4v981o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/033a/live/effd2720-ddf4-11f1-8445-15eb55286f71.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9053/live/0a8541a0-ddf4-11f1-bb8c-51310f5678ed.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8ed9/live/d8473500-e14e-11f1-b11b-dd14e59ca2da.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f890/live/21593d20-a08f-11f1-84af-1fbec28b23b2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/cf03/live/de6139f0-a08e-11f1-84af-1fbec28b23b2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4783/live/9e740110-e14d-11f1-b11b-dd14e59ca2da.jpg"], "videos": [], "review_score": "", "published_ts": 1794896143, "published_at": "2026-11-17T06:15:43Z", "published_th": "17 พ.ย. 2026 • 13:15 น.", "category_hint": "Football"}, {"id": 1794864676663, "guid": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "original_title": "Rice verbally agrees new Arsenal contract", "thai_title": "ดีแคลน ไรซ์ ตกลงเงื่อนไขสัญญาฉบับใหม่กับ อาร์เซนอล ด้วยวาจาแล้ว", "tag": "Football", "sub_tag": "ARSENAL", "bullet_points": ["ดีแคลน ไรซ์ บรรลุข้อตกลงด้วยวาจาในการต่อสัญญาฉบับใหม่ระยะยาวกับ อาร์เซนอล", "ค่าเหนื่อยในสัญญาฉบับใหม่จะปรับขึ้นให้เท่ากับ บูกาโย ซากา ซึ่งเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของสโมสร", "ไรซ์ย้ายจาก เวสต์แฮม มาร่วมทีมด้วยค่าตัวสถิติสโมสร 105 ล้านปอนด์ในปี 2023 และกลายเป็นหัวใจสำคัญในทีมของ มิเกล อาร์เตตา", "ในขณะที่ มาร์ติน โอเดการ์ด กัปตันทีมยืนยันว่ายังไม่ได้เริ่มเจรจาสัญญาฉบับใหม่ แม้สัญญาปัจจุบันจะเหลือเวลาเท่ากับไรซ์ก็ตาม"], "full_paragraphs": ["ดีแคลน ไรซ์ ได้บรรลุข้อตกลงด้วยวาจาเกี่ยวกับเงื่อนไขในสัญญาฉบับใหม่ระยะยาวกับ อาร์เซนอล แล้ว ตามรายงานจาก สกาย สปอร์ตส์ นิวส์", "แหล่งข่าวระบุว่า สัญญาฉบับใหม่นี้จะทำให้ไรซ์ได้รับค่าเหนื่อยในระดับเดียวกับ บูกาโย ซากา ซึ่งปัจจุบันเป็นนักเตะที่รับค่าเหนื่อยสูงสุดในถิ่น เอมิเรตส์ สเตเดียม", "ไรซ์และตัวแทนของเขาได้ดำเนินการเจรจากับสโมสรมาเป็นเวลาหลายเดือน โดยทาง อาร์เซนอล มีความต้องการอย่างยิ่งที่จะรั้งตัวหนึ่งในนักเตะคนสำคัญที่สุดของทีมเอาไว้ แม้ว่าสัญญาฉบับปัจจุบันจะยังเหลือเวลาอีก 18 เดือน พร้อมเงื่อนไขขยายสัญญาเพิ่มได้อีก 1 ปีก็ตาม", "ไรซ์ได้รับเลือกให้เป็นนักเตะยอดเยี่ยมแห่งปีของ อาร์เซนอล ในฤดูกาลที่ผ่านมา ซึ่งเป็นปีที่ทีมคว้าแชมป์พรีเมียร์ลีก และสัญญาฉบับใหม่นี้จะครอบคลุมช่วงเวลาการค้าแข้งของเขาไปจนถึงช่วงต้นวัย 30 ปี", "กองกลางวัย 27 ปีรายนี้ ย้ายจาก เวสต์แฮม มาร่วมทีม อาร์เซนอล ด้วยค่าตัวสถิติสโมสร 105 ล้านปอนด์ในปี 2023 เขาได้กลายเป็นสมาชิกคนสำคัญในกลุ่มผู้นำของ มิเกล อาร์เตตา และเป็นนักเตะที่กุนซือชาวสเปนรายนี้ใช้เป็นศูนย์กลางในการสร้างทีม", "ในการให้สัมภาษณ์เมื่อวันเสาร์ที่ผ่านมา ก่อนเกมเนชันส์ลีกนัดสุดท้ายของทีมชาติอังกฤษในสเปน ไรซ์ได้ยืนยันว่าเขากำลังใกล้ที่จะบรรลุข้อตกลงดังกล่าว", "ไรซ์กล่าวว่า 'ผมเป็นนักเตะที่ตั้งเป้าหมายให้ตัวเองเสมอ และผลักดันตัวเองให้ดียิ่งขึ้น ผมมีความมั่นคงกับสโมสรที่ผมอยู่มาโดยตลอด หวังว่าสัญญาฉบับใหม่จะเกิดขึ้นในเร็วๆ นี้'", "'ผมโชคดีมากที่ได้อยู่กับสโมสรอย่าง อาร์เซนอล ที่ผู้จัดการทีมแสดงความเชื่อมั่นในตัวผมอย่างมาก ผมมีเพื่อนร่วมทีมหลายคนที่ทุ่มเทพลังและความพยายามให้กับผมอย่างเต็มที่ ผมโชคดีมากที่ไม่ต้องกังวลเกี่ยวกับเรื่องเหล่านั้น มันทำให้การเล่นฟุตบอลเป็นเรื่องที่ง่ายขึ้นมาก'", "ในขณะเดียวกัน มาร์ติน โอเดการ์ด อีกหนึ่งกำลังสำคัญในทีมตัวจริงของ อาร์เซนอล ได้กล่าวว่าเขายังไม่ได้เริ่มการเจรจาสัญญาฉบับใหม่ แม้ว่าสัญญาปัจจุบันของเขาจะหมดลงในช่วงเวลาเดียวกับของไรซ์ก็ตาม", "กัปตันทีม อาร์เซนอล กล่าวระหว่างเก็บตัวกับทีมชาตินอร์เวย์ว่า 'ผมมีความสุขและหวังว่าจะได้อยู่ที่นี่ไปอีกนาน แต่จนถึงตอนนี้เรายังไม่ได้เริ่มคุยเรื่องนั้นกัน'", "'ไม่มีความกดดันอะไรเกี่ยวกับเรื่องนี้ ผมอยู่ในจุดที่ผมอยู่ และผมมีความสุขกับมันมาก ทุกอย่างกำลังไปได้สวย และมันไม่ใช่สิ่งที่ผมต้องกังวล อย่างที่ผมบอกไป ผมต้องการอยู่ที่นี่ไปอีกนาน ผมมีความสุขกับช่วงเวลานี้มาก'"], "link": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "canonical_link": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "cover_image_url": "https://e1.365dm.com/26/10/1920x1080/skysports-declan-rice-arsenal_7383215.jpg?20261021214729", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794863520, "published_at": "2026-11-16T21:12:00Z", "published_th": "17 พ.ย. 2026 • 04:12 น.", "category_hint": "Football"}, {"id": 1794843039513, "guid": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "original_title": "How Frank can restore reputation and save Crystal Palace", "thai_title": "ภารกิจกู้ชีพ! โธมัส แฟรงค์ เตรียมรับงานคุม คริสตัล พาเลซ หวังฟื้นฟูชื่อเสียงในพรีเมียร์ลีก", "tag": "Football", "sub_tag": "CRYSTAL PALACE", "bullet_points": ["โธมัส แฟรงค์ เตรียมเข้ารับตำแหน่งผู้จัดการทีมคนใหม่ของ คริสตัล พาเลซ หลังทีมทำผลงานย่ำแย่รั้งอันดับบ๊วยของตาราง", "ความท้าทายสำคัญของแฟรงค์คือการปรับปรุงเกมรับที่เสียประตูมากที่สุดในลีกถึง 24 ลูก และการสร้างความเชื่อมั่นให้กับทีมที่ขาดคุณภาพหลังจากเสียผู้เล่นตัวหลักไปในช่วงซัมเมอร์", "แม้สถานการณ์จะดูยากลำบาก แต่พาเลซยังมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายในช่วง 10 นัดแรกในรอบ 24 ปี", "แฟรงค์ตั้งเป้าใช้ประสบการณ์จากการคุม เบรนท์ฟอร์ด มาปรับใช้เพื่อสร้างความมั่นคงและยกระดับทีมให้กลับมาแข่งขันได้อีกครั้ง"], "full_paragraphs": ["คริสตัล พาเลซ กำลังจะกลายเป็นสโมสรที่ 3 ในลอนดอนที่ โธมัส แฟรงค์ เข้ามาคุมทีม ต่อจาก เบรนท์ฟอร์ด และ ท็อตแนม ฮอตสเปอร์", "เมื่อเดือนมิถุนายนที่ผ่านมา โธมัส แฟรงค์ ได้กล่าวไว้ว่า \"เมื่อถึงเวลาที่เหมาะสม ผมจะตั้งตารอการกลับมาทำหน้าที่ผู้จัดการทีมอีกครั้ง พร้อมที่จะทุ่มเทให้กับงานด้วยพลังงานและความมุ่งมั่นอย่างเต็มที่\" และเวลานั้นก็มาถึงแล้ว เมื่อกุนซือชาวเดนมาร์กรายนี้กำลังจะได้รับการประกาศให้เป็นนายใหญ่คนใหม่ของ คริสตัล พาเลซ ทีมที่ปัจจุบันรั้งอันดับบ๊วยของตารางพรีเมียร์ลีก โดยมีแต้มห่างจากโซนปลอดภัยอยู่ 2 คะแนน และมีผลต่างประตูได้เสียที่เป็นรอง", "ก่อนหน้านี้ ปิแอร์ เซจ อดีตหัวหน้าผู้ฝึกสอนของพาเลซ เพิ่งถูกปลดออกจากตำแหน่งเมื่อสัปดาห์ที่ผ่านมา หลังจากคุมทีมไปเพียง 16 นัดรวมทุกรายการ ซึ่งการเข้ามารับงานในครั้งนี้ถือเป็นโอกาสสำคัญที่แฟรงค์จะกู้ชื่อเสียงของตนเองกลับคืนมา หลังจากถูก ท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมาหลังคุมทีมได้เพียง 8 เดือน", "ร็อบ กรีน อดีตผู้รักษาประตูทีมชาติอังกฤษและ เวสต์แฮม ยูไนเต็ด กล่าวกับ BBC Sport ว่า \"มันจะเป็นเรื่องที่น่าตกใจสำหรับ โธมัส แฟรงค์ เล็กน้อย เขาเคยประสบความสำเร็จที่ เบรนท์ฟอร์ด ซึ่งเป็นสโมสรที่มีการบริหารจัดการที่ดีเยี่ยม มีการวางแผนและคิดมาอย่างดีในการดึงนักเตะเข้ามาทดแทนคนที่ขายออกไปเพื่อทำกำไร แต่สิ่งนั้นไม่ได้เกิดขึ้นที่ คริสตัล พาเลซ พวกเขาสูญเสียผู้เล่นไปแล้วต้องรีบหาคนมาแทนอย่างฉุกละหุก ทีมชุดนี้ถูกลดทอนคุณภาพลงจากการขายนักเตะออกไปโดยไม่มีใครที่มีคุณภาพเท่าเดิมเข้ามาแทนที่ โธมัส แฟรงค์ จำเป็นต้องค้นหาบางอย่างภายในทีมเพื่อสร้างความเชื่อมั่นว่าพวกเขาสามารถแข่งขันในพรีเมียร์ลีกได้ เพราะในตอนนี้มันดูห่างไกลจากจุดนั้นมาก\"", "นับตั้งแต่ถูกปลดจาก ท็อตแนม ฮอตสเปอร์ หลังคุมทีมในลีกไป 26 นัดเมื่อฤดูกาลที่แล้ว แฟรงค์ว่างเว้นจากการคุมทีมมานานกว่าช่วงเวลาที่เขาคุมทีมสเปอร์สเสียอีก ในช่วงซัมเมอร์เขาเคยออกแถลงการณ์ว่า \"มีการพูดคุยและโอกาสต่างๆ\" เข้ามาให้เขากลับไปทำงาน แต่เขา \"ตัดสินใจที่จะไม่รีบร้อนรับงานถัดไป\"", "พอล โรบินสัน อดีตผู้รักษาประตู ท็อตแนม ฮอตสเปอร์ และทีมชาติอังกฤษ กล่าวว่า \"พาเลซเคยมีหนึ่งในผู้จัดการทีมที่ดีที่สุดเท่าที่พวกเขาเคยมีมา หรืออาจจะดีที่สุดตลอดกาลด้วยซ้ำ ที่พาทีมคว้าถ้วยรางวัลมาครอง ลองดูสิ่งที่พวกเขาทำได้เมื่อฤดูกาลที่แล้วสิ แทนที่จะต่อยอดจากจุดนั้น พวกเขากลับรื้อทีมทิ้ง พวกเขาถอยหลังลงคลอง\"", "แฟรงค์เคยเปรียบเปรยการเป็นผู้จัดการทีมว่าเหมือนการอยู่บน \"วงล้อหนูถีบจักร\" และ \"ละครสัตว์ที่บ้าคลั่ง\" ดังนั้นการที่เขาตัดสินใจกลับมาคุมทีมที่รั้งท้ายตารางในตอนนี้ จึงเป็นเรื่องที่น่าสนใจ โดยแฟรงค์ซึ่งเคยเป็นส่วนหนึ่งของทีมวิเคราะห์ฟุตบอลโลกของ BBC Sport ในช่วงซัมเมอร์ จะกลับมาทำงานด้วยความสดชื่นและพลังงานที่เต็มเปี่ยมหลังจากห่างหายจากวงการไปหลายเดือน", "ระหว่างการรับตำแหน่งที่ เบรนท์ฟอร์ด ในเดือนตุลาคม 2018 จนถึงวันที่ถูกปลดจาก สเปอร์ส เมื่อต้นปีนี้ เขาทำงานโดยไม่มีวันหยุดพักมานานถึง 7 ปีกับอีก 4 เดือน การใช้เวลาช่วงไม่กี่เดือนที่ผ่านมาห่างจากความกดดันของพรีเมียร์ลีก ทำให้แฟรงค์ได้ \"ศึกษา สังเกต และเรียนรู้จากผู้นำคนอื่นๆ ทั้งในและนอกวงการกีฬา\" ตามคำกล่าวของเขาเอง", "แฟรงค์ซึ่งให้ความสำคัญอย่างยิ่งกับการจัดระเบียบลูกตั้งเตะ จะต้องรีบปรับจูนทีมทันทีที่ คริสตัล พาเลซ ซึ่งแพ้ในลีกมา 4 นัดติดต่อกัน โดยทีมเสียประตูไปแล้วถึง 24 ลูก ซึ่งมากที่สุดในพรีเมียร์ลีก และยิงได้เพียง 10 ประตูเท่านั้น", "ทอม อัลนัตต์ นักข่าวฟุตบอลจาก The Times กล่าวกับรายการ Football Daily ของ BBC Radio 5 Live ว่า \"หากคุณต้องการใครสักคนเข้ามาเพื่อสร้างความมั่นคงและความแข็งแกร่งในเกมรับ พร้อมกับปรับปรุงเรื่องลูกตั้งเตะ โธมัส แฟรงค์ คือคนที่สมบูรณ์แบบสำหรับงานนี้\"", "ด้วยการที่พรีเมียร์ลีกเพิ่งผ่านไปเพียง 10 นัด แฟรงค์ยังมีเวลามากพอที่จะพลิกสถานการณ์ และเขาน่าจะมีเป้าหมายในใจสำหรับการเสริมทัพเมื่อตลาดซื้อขายนักเตะเปิดขึ้นในเดือนมกราคม โดยในช่วงซัมเมอร์ที่ผ่านมา พาเลซขาย แม็กซองซ์ ลาครัวซ์ กองหลังชาวฝรั่งเศสให้ เชลซี ในราคา 52 ล้านปอนด์ และ ดาเนียล มูญอซ แบ็กขวาชาวโคลอมเบียให้ นอตทิงแฮม ฟอเรสต์ ในราคา 22 ล้านปอนด์ ซึ่งอัลนัตต์เสริมว่า \"เรารู้ว่าพวกเขาขายนักเตะฝีเท้าดีออกไปเยอะมาก และจนถึงตอนนี้ผมไม่คิดว่าพวกเขาจะหาใครมาแทนที่ได้อย่างเหมาะสม\"", "ความท้าทายอีกประการสำหรับแฟรงค์คือการดึงฟอร์มเก่งของ อดัม วอร์ตัน กองกลางที่ไม่ได้ลงเล่นให้ทีมชาติอังกฤษมาตั้งแต่เดือนมีนาคมให้กลับมาอีกครั้ง ซึ่งสิ่งเหล่านี้คือความท้าทายที่ผู้จัดการทีมคนใหม่พร้อมจะเผชิญ", "พอล โรบินสัน กล่าวทิ้งท้ายว่า \"คริสตัล พาเลซ และ โธมัส แฟรงค์ ดูจะเป็นส่วนผสมที่ลงตัวมาก\" ทั้งนี้ โธมัส แฟรงค์ มีงานหนักรออยู่ เพราะ คริสตัล พาเลซ คือทีมที่แย่ที่สุดในพรีเมียร์ลีกฤดูกาลนี้อย่างไม่ต้องสงสัย โดยรั้งอันดับบ๊วยทั้งในแง่ของคะแนน (7 คะแนน) ผลต่างประตูได้เสีย (-14) และค่าคาดหวังประตูได้เสีย (-8.1)", "ในส่วนของเกมรับคือจุดที่แฟรงค์ต้องให้ความสำคัญมากที่สุด ไม่เพียงแต่เสียประตูมากที่สุด (24 ลูก) แต่ยังปล่อยให้คู่แข่งยิงมากที่สุด (189 ครั้ง) และมีค่าคาดหวังการเสียประตู (xGA) แย่ที่สุดในลีกที่ 21.9", "อย่างไรก็ตาม ในส่วนของเกมรุกถือว่าไม่ได้แย่จนเกินไป แม้จะมีเพียง ฮัลล์ ซิตี้ เท่านั้นที่ยิงน้อยกว่า แต่พาเลซก็สร้างโอกาสได้ดีและอาจโชคร้ายที่ยิงประตูไม่ได้มากกว่านี้จากโอกาสที่มี", "นอกจากนี้ยังมีปัจจัยสำคัญที่เข้าทางแฟรงค์ แม้พาเลซจะรั้งอันดับบ๊วย แต่พวกเขายังไม่ถูกทิ้งห่าง เพราะมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน โดยทีมที่รั้งอันดับสุดท้ายในช่วงเวลานี้ของ 10 ฤดูกาลหลังสุดมีค่าเฉลี่ยเพียง 3 คะแนน แต่สำหรับพาเลซ แม้ผลงานจะแย่เพียงใด พวกเขาก็ยังมีถึง 7 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายหลังผ่านไป 10 นัดในรอบ 24 ปี"], "link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/a30c/live/69f709f0-df63-11f1-a8af-15d7a25dc0d1.png", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794851176, "published_at": "2026-11-16T17:46:16Z", "published_th": "17 พ.ย. 2026 • 00:46 น.", "category_hint": "Football"}, {"id": 1794955528055, "guid": "https://www.skysports.com/football/live-blog/11095/13427059/england-football-news-live-updates-schedule-and-analysis-of-thomas-tuchels-three-lions", "original_title": "England latest: FA registers interest to host Nations League finals", "thai_title": "สมาคมฟุตบอลอังกฤษแสดงความสนใจเสนอตัวเป็นเจ้าภาพรอบสุดท้ายศึกเนชันส์ลีก", "tag": "Football", "sub_tag": "ENGLAND", "bullet_points": ["สมาคมฟุตบอลอังกฤษ (FA) ได้ดำเนินการลงทะเบียนแสดงความสนใจอย่างเป็นทางการเพื่อขอเป็นเจ้าภาพจัดการแข่งขันฟุตบอลยูฟ่า เนชันส์ลีก รอบสุดท้าย", "ความเคลื่อนไหวดังกล่าวเกิดขึ้นท่ "original_title": "White has 'exciting future' despite boos - Rice", "thai_title": "ไรซ์ปกป้อง ไวท์ หลังถูกแฟนบอลโห่ใส่ที่เวมบลีย์ พร้อมชี้อนาคตกับทีมชาติยังสดใส", "tag": "Football", "bullet_points": ["เดแคลน ไรซ์ ออกโรงปกป้อง เบน ไวท์ เพื่อนร่วมทีมอาร์เซนอล หลังถูกแฟนบอลโห่ใส่ในเกมที่อังกฤษชนะโครเอเชีย 2-1", "ไรซ์ชื่นชมความแข็งแกร่งทางจิตใจของไวท์ที่ยังคงทำผลงานได้ดีแม้จะเผชิญกับสถานการณ์ที่ยากลำบาก", "ไวท์เคยถอนตัวจากแคมป์ทีมชาติในฟุตบอลโลก 2022 และไม่ได้ถูกเรียกตัวติดทีมชาติในช่วงที่แกเร็ธ เซาธ์เกต คุมทีม", "เดแคลน ไรซ์ ยืนยันว่าเขากำลังอยู่ในระหว่างการเจรจาสัญญาฉบับใหม่กับอาร์เซนอล ซึ่งคาดว่าจะทำให้เขากลายเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของสโมสร", "ไรซ์เชื่อมั่นว่าความต่อเนื่องในการเล่นฟุตบอลในระดับสูงช่วยให้เขาพัฒนาฝีเท้าได้อย่างมั่นคง"], "full_paragraphs": ["เดแคลน ไรซ์ ได้ออกมาปกป้อง เบน ไวท์ เพื่อนร่วมทีมอาร์เซนอล หลังจากที่กองหลังรายนี้ถูกแฟนบอลโห่ใส่ที่สนามเวมบลีย์ ในระหว่างเกมที่ทีมชาติอังกฤษเอาชนะโครเอเชียไปได้ 2-1 เมื่อวันพฤหัสบดีที่ผ่านมา", "สำหรับ เบน ไวท์ ซึ่งถูกส่งลงสนามในฐานะตัวสำรองในเกมเนชันส์ลีกนัดนี้ เคยตัดสินใจถอนตัวจากแคมป์ทีมชาติอังกฤษในศึกฟุตบอลโลก 2022 ที่กาตาร์ เพื่อเดินทางกลับบ้านด้วยเหตุผลส่วนตัว", "หลังจากเหตุการณ์ดังกล่าว ไวท์ไม่ได้ถูกเรียกตัวติดทีมชาติอีกเลยตลอดช่วงเวลาที่ แกเร็ธ เซาธ์เกต ดำรงตำแหน่งผู้จัดการทีมชาติอังกฤษ นอกจากนี้ เขายังเคยถูกแฟนบอลบางส่วนโห่ใส่ในเกมที่เสมอกับยูเครน 1-1 เมื่อเดือนมีนาคมที่ผ่านมา หลังจากที่เขากลับมาติดทีมชาติอีกครั้งภายใต้การคุมทีมของ โทมัส ทูเคิล", "\"เหตุการณ์ที่เกิดขึ้นกับเบนมันผ่านไปกว่า 5 ปีแล้ว ผมไม่รู้จริงๆ ว่าทำไมเรื่องนี้ถึงยังคงเป็นประเด็นที่ถูกหยิบยกมาพูดถึงอยู่\" ไรซ์กล่าวกับ BBC Radio 5 Live", "\"เมื่อรู้จักเบน และรู้จักตัวตนของเขา ผมบอกได้เลยว่าเขาได้ก้าวข้ามเรื่องราวทั้งหมดนั้นไปเรียบร้อยแล้ว เขาภูมิใจเสมอที่ได้สวมเสื้อทีมชาติ และทุกครั้งที่เขาลงสนาม เขาจะทุ่มเทเต็มร้อยเปอร์เซ็นต์เสมอ\"", "\"มันแสดงให้เห็นถึงตัวตนของเขา การถูกโห่ใส่ตอนลงสนามที่เวมบลีย์ไม่ใช่เรื่องง่ายเลย แต่การที่เขาสามารถแสดงความแข็งแกร่งทางจิตใจเพื่อลงเล่นและทำผลงานได้ดี เหมือนกับที่เขาทำได้ในช่วงหลายเดือนที่ผ่านมานั้น ถือเป็นเครื่องพิสูจน์ตัวเขาได้อย่างแท้จริง\"", "ไรซ์ยังกล่าวเสริมว่า บรรดาผู้เล่นในทีมไม่ได้มีการพูดคุยถึงสถานการณ์นี้เลย และทุกคนต่างก้าวข้ามเรื่องดังกล่าวไปแล้ว พร้อมระบุว่า ไวท์ยังมี \"อนาคตที่น่าตื่นเต้นรออยู่กับทีมชาติอังกฤษชุดนี้\"", "ก่อนหน้านี้ ไวท์เคยกล่าวว่า ผู้คนยังไม่ทราบ \"เรื่องราวทั้งหมด\" เบื้องหลังการตัดสินใจถอนตัวจากแคมป์กาตาร์ แต่เขาก็ยังคงยืนหยัดในการตัดสินใจของตนเอง", "ในประเด็นอื่น ไรซ์ยังยืนยันว่าเขากำลังใกล้ที่จะเซ็นสัญญาฉบับใหม่กับอาร์เซนอล โดย BBC Sport ได้รายงานครั้งแรกเมื่อวันที่ 7 ตุลาคมว่า กองกลางรายนี้เตรียมเซ็นสัญญาฉบับใหม่ระยะยาวที่เอมิเรตส์ สเตเดียม ซึ่งนักเตะวัย 27 ปีได้กล่าวถึงเรื่องนี้ก่อนเกมที่อังกฤษจะพบกับสเปนในวันอาทิตย์ว่า \"สัญญาฉบับใหม่น่าจะเกิดขึ้นในเร็วๆ นี้ และผมโชคดีมากที่ได้อยู่กับสโมสรอย่างอาร์เซนอล ที่ซึ่งผู้จัดการทีมแสดงความเชื่อมั่นในตัวผมอย่างมาก รวมถึงเพื่อนร่วมทีมที่ทุ่มเทพลังให้กับผมอย่างเต็มที่\"", "สัญญาปัจจุบันของไรซ์จะหมดลงในปี 2028 แต่คาดว่าอดีตดาวเตะเวสต์แฮมรายนี้จะขยายระยะเวลาการค้าแข้งในลอนดอนเหนือออกไป หลังจากย้ายมาจากลอนดอน สเตเดียม ในปี 2023 ด้วยค่าตัว 105 ล้านปอนด์ โดยสัญญาฉบับใหม่นี้จะทำให้เขากลายเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของอาร์เซนอลเทียบเท่ากับ บูกาโย ซากา", "ไรซ์สามารถหลีกเลี่ยงความวุ่นวายตลอดอาชีพการค้าแข้งของเขา และเขาเชื่อว่าความต่อเนื่องนี้เองที่ช่วยให้เขาเติบโตขึ้น \"ผมโชคดีมากที่สามารถเล่นในระดับที่สม่ำเสมอได้ตลอดอาชีพการค้าแข้ง ผมตั้งเป้าหมายให้ตัวเองเสมอและผลักดันตัวเองให้มากขึ้น\"", "\"ผมโชคดีมากที่ไม่ต้องกังวลกับเรื่องเหล่านั้น เพราะมันทำให้การเล่นฟุตบอลเป็นเรื่องที่ง่ายขึ้นมาก\""], "link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o?at_medium=RSS&at_campaign=rss", "cover_image_url": "https://ichef.bbci.co.uk/ace/branded_sport/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f186/live/c0295b40-e074-11f1-9f6f-67b1fda6424e.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5f63/live/321873e0-ef8b-11ee-975b-efffd9777018.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6615/live/ce8996a0-7ab8-11f0-83cc-c5da98c419b8.png"], "published_th": "15 พ.ย. 2026 • 05:26 น.", "category_hint": "Football", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "guid": "https://www.bbc.co.uk/sport/football/articles/cq0mdzrjn0j2o", "published_ts": 1794695216, "published_at": "2026-11-14T22:26:56Z", "videos": [], "review_score": "", "sub_tag": "PREMIER LEAGUE"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นความคล่องตัวสูง คุณจำเป็นต้องวิ่ง คุณต้องสามารถวิ่งและทำความเร็วสูงได้ พื้นฐานที่สุดคือต้องฟิต\"", "\"ผู้จัดการทีมทุกคนต้องการช่วงปรีซีซั่นที่ดีและเวลาในการถ่ายทอดไอเดียรวมถึงสร้างความฟิต แต่นักเตะจะรู้สึกได้ทันทีว่ามันเป็นคนละระดับกัน นี่คือสิ่งที่ต้องทำทุกวันที่สนามซ้อม ต้องเต็มที่ 100% นั่นคือสิ่งที่เขาขอและต้องการ มันจะเป็นความแตกต่างครั้งใหญ่สำหรับนักเตะและพวกเขาจะเห็นผลลัพธ์ทันที\"", "\"ในเกมแชมเปียนส์ลีก รอบรองชนะเลิศ เราตามหลัง 3-0 (ในเกมพบกับ อาแจ็กซ์) เขาไม่ได้พูดเรื่องแท็กติกในช่วงพักครึ่งเลย เขาแค่บอกว่า 'พวกคุณต้องใช้ร่างกายเข้าสู้ ต้องสู้ คุณต้องการแค่ประตูเดียวเพื่อกลับมาสู่เกม จงเชื่อว่าทุกอย่างเป็นไปได้' นั่นเป็นช่วงเวลาที่สำคัญมาก เพราะตอนนั้นเราสู้ อาแจ็กซ์ ไม่ได้เลย แต่เราเปลี่ยนทุกอย่างด้วยความเข้มข้นและการเข้าปะทะ ผมจำได้ว่ามีการวางบอลยาวให้ เฟร์นานโด ยอเรนเต และเราก็แค่สู้และถามกันว่า 'พวกคุณต้องการมันมากแค่ไหน?' ทุกอย่างเปลี่ยนไปตั้งแต่นาทีนั้น\""], "link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8125/live/1aaff900-dfb9-11f1-b154-657b8bcda5ea.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/1da8/live/872e4dc0-ddd4-11f1-9053-236ccb99630c.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794610397, "published_at": "2026-11-13T22:53:17Z", "published_th": "14 พ.ย. 2026 • 05:53 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776975, "guid": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "original_title": "Tearful Pochettino on 'difficult' decision to leave USA for Man Utd", "thai_title": "โปเช็ตติโน่หลั่งน้ำตา ยอมรับการตัดสินใจอำลาทีมชาติสหรัฐฯ เพื่อคุมทัพแมนเชสเตอร์ ยูไนเต็ด เป็นเรื่องยากที่สุดในอาชีพ", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ ตัดสินใจอำลาตำแหน่งกุนซือทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานคุมทีมแมนเชสเตอร์ ยูไนเต็ด โดยเซ็นสัญญาเป็นเวลา 2 ปีครึ่ง", "ปีศาจแดงยอมจ่ายค่าฉีกสัญญาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่และทีมงานสตาฟฟ์โค้ชมาจากสหรัฐฯ", "โปเช็ตติโน่ยอมรับว่านี่เป็นการตัดสินใจที่ยากลำบากที่สุดครั้งหนึ่งในอาชีพ แต่โอกาสในการคุมทีมระดับโอลด์แทรฟฟอร์ดนั้นยากที่จะปฏิเสธ", "กุนซือชาวอาร์เจนไตน์จะประเดิมคุมทีมแมนเชสเตอร์ ยูไนเต็ด นัดแรกในเกมเยือนลิเวอร์พูล วันที่ 22 พฤศจิกายนนี้", "สถานการณ์ของแมนเชสเตอร์ ยูไนเต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะลุช่องโดยตรง ไม่ได้แตกต่างจากสิ่งที่ คาร์ริค พยายามจะทำ และแม้ว่านั่นอาจทำให้แฟนบอล ยูไนเต็ด กังวล แต่ความคล้ายคลึงในหลักการจะส่งผลดีต่อตัวผู้เล่น", "\"ปรัชญาของผมคือการมอบสไตล์ที่อิสระภายใต้การจัดระเบียบที่ดี\" คือคำพูดของ โปเช็ตติโน ในปี 2014 แม้ปรัชญาจะคล้ายกัน แต่ส่วนหลังคือ 'การจัดระเบียบที่ชัดเจน' ซึ่งน่าจะเป็นสิ่งที่ คาร์ริค ยังไม่สามารถมอบให้ผู้เล่นได้อย่างมั่นคง", "สำหรับแฟนบอลทีมใหญ่ ฟุตบอลที่รวดเร็วและเน้นแนวตั้งมักได้รับการยอมรับเมื่อมันมาจากความตั้งใจที่จะเป็นฝ่ายรุกก่อน เช่น ยูไนเต็ด ยุค เฟอร์กูสัน หรือ ลิเวอร์พูล ยุค เจอร์เกน คล็อปป์ แต่ฟุตบอลลักษณะนี้มักถูกมองในแง่ลบหากมันมาจากการยอมสละการครองบอลและเน้นตั้งรับหน้าประตูตัวเองเป็นเวลานาน", "การจ้าง โปเช็ตติโน จะเป็นจุดเริ่มต้นในการเปลี่ยน ยูไนเต็ด ให้กลายเป็นทีมที่มีระเบียบวินัยสูง สามารถกดดันคู่แข่งได้อย่างเข้มข้นและเป็นระบบมากขึ้น"], "link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/f043/live/468fa2e0-dddf-11f1-b465-b9821c2582d4.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/4aad/live/3387a800-df42-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/6ab2/live/cf053980-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/681d/live/dceb6bf0-de1d-11f1-9d68-c1daaffc01f2.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/c36b/live/e04246d0-de17-11f1-93e1-3b657b665bcf.jpg"], "videos": [], "review_score": "", "published_ts": 1794571788, "published_at": "2026-11-13T12:09:48Z", "published_th": "13 พ.ย. 2026 • 19:09 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776979, "guid": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo", "original_title": "Fernandes rejects second Man Utd contract offer", "thai_title": "บรูโน่ แฟร์นันด์ส ปฏิเสธข้อเสนอสัญญาฉบับใหม่จาก แมนเชสเตอร์ ยูไนเต็ด เป็นครั้งที่สอง", "tag": "Football", "bullet_points": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สอง", "สัญญาปัจจุบันของดาวเตะวัย 32 ปีจะหมดลงหลังจบฤดูกาลนี้ แต่สโมสรมีออปชั่นขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028", "แมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการเจรจาสัญญาใหม่ แต่การเจรจายังคงไม่มีความคืบหน้า", "สโมสรหวังว่าการเข้ามาคุมทีมของ เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่ จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป", "ฟอร์มการเล่นของแฟร์นันด์สในฤดูกาลนี้ตกลงไปจากเดิมอย่างเห็นได้ชัด โดยทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด"], "full_paragraphs": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในวันที่ 22 พฤศจิกายนนี้", "ทางสโมสรหวังว่าการเข้ามาของโปเช็ตติโน่จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป ทั้งนี้ แฟร์นันด์สเคยเกือบจะได้ย้ายไปร่วมทีมท็อตแนม ฮ็อตสเปอร์ ของโปเช็ตติโน่ในปี 2019 แต่การย้ายทีมไม่เกิดขึ้น ก่อนที่เขาจะย้ายมาอยู่กับแมนเชสเตอร์ ยูไนเต็ด ในอีก 6 เดือนต่อมา โดยในฤดูกาลนี้ อดีตมิดฟิลด์สปอร์ติ้ง ลิสบอน รายนี้ทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด", "ในทางทฤษฎีแล้ว สถานการณ์ความขัดแย้งเรื่องสัญญาปัจจุบันระหว่างแมนเชสเตอร์ ยูไนเต็ด และบรูโน่ แฟร์นันด์ส ไม่ใช่เรื่องใหญ่โตนัก เพราะเป็นเรื่องปกติที่ข้อเสนอครั้งแรก ครั้งที่สอง หรือแม้แต่ครั้งต่อๆ ไปจะถูกปฏิเสธ ซึ่งเป็นส่วนหนึ่งของกระบวนการเจรจาต่อรอง", "แม้แมนเชสเตอร์ ยูไนเต็ด จะมีออปชั่นในการขยายสัญญาเพิ่มอีกหนึ่งปี แต่ก็มีเหตุผลที่ทั้งสองฝ่ายอาจจะยังไม่ต้องการผูกมัดกันเกินกว่านั้นในขณะนี้ ในฝั่งของแฟร์นันด์ส เขามีความปรารถนาอย่างแรงกล้าที่จะคว้าแชมป์รายการใหญ่ที่สุด และเขากำลังเห็นช่วงเวลาที่ดีที่สุดในอาชีพค้าแข้งค่อยๆ ผ่านไป โดยยูไนเต็ดล้มเหลวในการต่อยอดจากฤดูกาลที่ดูมีอนาคตอีกครั้ง และเขาต้องการรอดูว่าเมาริซิโอ โปเช็ตติโน่ จะสร้างผลกระทบอย่างไรเมื่อเขาย้ายมาจากสหรัฐอเมริกา", "แฟร์นันด์สเคยเป็นที่หมายปองของสโมสรในซาอุดี โปรลีก เมื่อ 18 เดือนก่อน แม้จะมีความรู้สึกว่าเขาต้องการค้าแข้งในยุโรปต่อไปมากกว่าก็ตาม ในขณะที่ฝั่งของแมนเชสเตอร์ ยูไนเต็ด ก็ตระหนักดีถึงฟอร์มการเล่นที่ตกลงไปอย่างน่าตกใจของแฟร์นันด์ส เมื่อเทียบกับมาตรฐานที่เขาเคยทำได้ในฤดูกาลที่แล้ว ซึ่งเขาทำลายสถิติการแอสซิสต์ในพรีเมียร์ลีกและกวาดรางวัลผู้เล่นยอดเยี่ยมทุกรายการ", "ลิเวอร์พูลเคยทุ่มเงินมหาศาลให้กับสัญญาฉบับล่าสุดของ โมฮาเหม็ด ซาลาห์ ซึ่งกลายเป็นภาระทางการเงินที่หนักอึ้ง ดังนั้นแมนเชสเตอร์ ยูไนเต็ด จึงไม่ต้องการแบกรับภาระสัญญาฉบับใหญ่ในระยะยาวให้กับผู้เล่นที่ฟอร์มการเล่นตกลงไปเช่นนี้"], "link": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cm782d4pz9jyo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "gallery_images": ["https://ich d": "https://www.bbc.co.uk/sport/football/articles/cv5y18lkk87do", "original_title": "Crystal Palace sack boss Sage after 16 games", "thai_title": "คริสตัล พาเลซ ประกาศปลด ปิแอร์ เซจ พ้นตำแหน่งกุนซือหลังคุมทีมได้เพียง 16 นัด", "tag": "Football", "bullet_points": ["คริสตัล พาเลซ ตัดสินใจแยกทางกับ ปิแอร์ เซจ หลังทำผลงานย่ำแย่พาทีมรั้งบ๊วยของตารางพรีเมียร์ลีก", "สโมสรกำลังอยู่ในระหว่างการเจรจาขั้นสูงกับ โธมัส แฟรงค์ อดีตกุนซือเบรนท์ฟอร์ดและท็อตแนม ฮอตสเปอร์ เพื่อดึงตัวมาคุมทีมแทน", "ปิแอร์ เซจ กลายเป็นผู้จัดการทีมรายที่สองในพรีเมียร์ลีกที่ถูกปลดในฤดูกาลนี้ ต่อจาก ไมเคิล คาร์ริค ของแมนเชสเตอร์ ยูไนเต็ด", "พาเลซประสบปัญหาเกมรับที่อ่อนแอที่สุดในลีก โดยเสียไปแล้วถึง 24 ประตูจากการลงเล่น 10 นัดแรก", "สโมสรยืนยันว่าทีมงานสตาฟฟ์โค้ชของเซจอีก 3 คน ได้แก่ จามาล อาลีอุย, ดาเมียน เดลลา ซานตา และ แซนดี้ กีชาร์ด ได้อำลาทีมไปพร้อมกัน"], "full_paragraphs": ["ปิแอร์ เซจ ยุติบทบาทการเป็นผู้จัดการทีมคริสตัล พาเลซ ลงเป็นที่เรียบร้อยแล้ว หลังจากเข้ามารับงานได้เพียง 5 เดือนและคุมทีมไปทั้งหมด 16 นัด โดยปัจจุบันสโมสรกำลังรั้งตำแหน่งบ๊วยของตารางพรีเมียร์ลีก", "ในขณะนี้ โธมัส แฟรงค์ อดีตกุนซือของเบรนท์ฟอร์ดและท็อตแนม ฮอตสเปอร์ กำลังอยู่ในระหว่างการเจรจาขั้นสูงเพื่อเข้ามารับตำแหน่งผู้จัดการทีมคนใหม่แทนที่เซจ", "ความพ่ายแพ้ต่อลิเวอร์พูล 3-1 เมื่อวันอาทิตย์ที่ผ่านมา ถือเป็นความพ่ายแพ้นัดที่ 4 ติดต่อกันของพาเลซในพรีเมียร์ลีก โดยทัพ 'ดิ อีเกิลส์' เก็บชัยชนะได้เพียง 2 นัดจาก 10 เกมแรก และยังมีสถิติเกมรับที่แย่ที่สุดในลีกจากการเสียไปถึง 24 ประตู นอกจากนี้ในรายการยูโรปา ลีก พวกเขายังรั้งอันดับที่ 21 จากทั้งหมด 36 ทีม โดยชนะเพียงนัดเดียวจาก 4 นัดที่ลงสนาม", "ทางสโมสรได้ออกแถลงการณ์ระบุว่า ทีมงานสตาฟฟ์โค้ชของเซจ 3 ราย ได้แก่ จามาล อาลีอุย, ดาเมียน เดลลา ซานตา และ แซนดี้ กีชาร์ด ได้อำลาทีมไปพร้อมกัน โดยระบุว่า 'สโมสรขอขอบคุณปิแอร์และทีมงานสำหรับความทุ่มเทตลอดช่วงเวลาที่อยู่ในลอนดอนใต้ และขอให้พวกเขาโชคดีในอนาคต ส่วนความคืบหน้าเรื่องการแต่งตั้งผู้จัดการทีมคนใหม่จะมีการแจ้งให้ทราบในลำดับถัดไป'", "ปิแอร์ เซจ ถือเป็นผู้จัดการทีมรายที่สองในพรีเมียร์ลีกที่ถูกปลดในฤดูกาลนี้ ต่อจาก ไมเคิล คาร์ริค ที่ถูกแมนเชสเตอร์ ยูไนเต็ด ปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา กุนซือชาวฝรั่งเศสวัย 47 ปีรายนี้ เข้ามารับงานด้วยสัญญา 3 ปีเมื่อเดือนมิถุนายนที่ผ่านมา หลังจาก โอลิเวอร์ กลาสเนอร์ อำลาทีมไปเมื่อสิ้นสุดฤดูกาลก่อน โดยก่อนหน้านี้เซจเคยพา ล็องส์ จบอันดับที่ 2 ในลีกเอิง และคว้าแชมป์เฟรนช์คัพได้เป็นครั้งแรกในประวัติศาสตร์ 120 ปีของสโมสร", "อย่างไรก็ตาม เซจไม่สามารถสร้างผลงานได้เทียบเท่ากับกลาสเนอร์ ซึ่งปัจจุบันคุมทีม น็อตติงแฮม ฟอเรสต์ โดยกลาสเนอร์เคยพาพาเลซคว้าแชมป์เอฟเอ คัพ และแชมป์ยูโรปา คอนเฟอเรนซ์ ลีก มาครองได้สำเร็จ", "พาเลซไม่ชนะใครในลีกมาตั้งแต่วันที่ 11 ตุลาคม โดยช่วงที่ฟอร์มตกต่ำเริ่มขึ้นจากความพ่ายแพ้ต่อคู่ปรับสำคัญอย่าง ไบรท์ตัน 5-0 ซึ่งหลังจบเกมนั้น เซจกล่าวว่าเขารู้สึก 'ละอายใจ' กับผลการแข่งขัน และยอมรับว่าไม่มั่นใจว่าจะได้รับโอกาสให้คุมทีมต่อไปเพื่อกอบกู้สถานการณ์หรือไม่", "แม้จะมีกระแสความเห็นใจจากคนภายในสโมสรบางส่วนหลังความพ่ายแพ้นัดดังกล่าว แต่ปัญหาอาการบาดเจ็บของผู้เล่น รวมถึงการขาดหายไปของกองหน้าอย่าง ฌอง-ฟิลิปป์ มาเตต้า และ อิสไมล่า ซาร์ ซึ่งมีปัญหาทั้งเรื่องความฟิตและประเด็นส่วนตัวเกี่ยวกับความต้องการย้ายออกจากสโมสร ก็ส่งผลกระทบต่อแผนการทำทีมของเขาอย่างหลีกเลี่ยงไม่ได้", "หลังจากนั้น พาเลซก็พ่ายแพ้ติดต่อกันอีก 3 นัด โดยในเกมที่แพ้ลิเวอร์พูลที่เซลเฮิร์สท์ พาร์ค พวกเขาโชคร้ายที่ยิงไปชนคานและมีลูกที่ถูกริบประตูคืนด้วย โดยสรุปแล้ว เซจพาทีมชนะไปเพียง 5 นัดจาก 16 นัดในทุกรายการ สำหรับโปรแกรมพรีเมียร์ลีกนัดถัดไปของพาเลซคือการไปเยือน โคเวนทรี ในวันที่ 21 พฤศจิกายน หลังจบช่วงพักเบรกทีมชาติ", "สำหรับ โธมัส แฟรงค์ เคยถูกท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมา หลังจากคุมทีมได้ไม่ถึง 8 เดือน โดยทิ้งทีมไว้ในอันดับที่ 16 ของตารางพรีเมียร์ลีก ห่างจากโซนตกชั้นเพียง 5 คะแนน หลังจากไม่ชนะใครในลีกติดต่อกัน 8 นัด", "ทางสโมสรคริสตัล พาเลซ เชื่อมั่นว่าแฟรงค์คือคนที่เหมาะสมที่สุดในการพานำทีมหนีจากโซนตกชั้น โดยคาดว่าการเจรจาอยู่ในขั้นตอนสุดท้ายและมีความหวังว่าจะสามารถบรรลุข้อตกลงได้ก่อนเริ่มสัปดาห์หน้า ซึ่งเป็นช่วงที่นักเตะจะทยอยกลับจากการรับใช้ทีมชาติ", "นอกจากนี้ สโมสรยังได้พิจารณาทางเลือกอื่นไว้ด้วย เช่น ฌอน ไดช์ อดีตกุนซือเอฟเวอร์ตันและน็อตติงแฮม ฟอเรสต์ รวม "Microsoft มุ่งเน้นกลยุทธ์การกระจายอำนาจผ่านการให้ลูกค้าองค์กรเลือกใช้โมเดลที่หลากหลาย เพื่อป้องกันการรวมศูนย์อำนาจของ AI ไว้ที่บริษัทใดบริษัทหนึ่ง"], "full_paragraphs": ["Satya Nadella ซีอีโอของ Microsoft กล่าวว่าเขากลายเป็นผู้ที่เชื่อในพลังของ AGI (Artificial General Intelligence) แล้ว โดยเฉพาะในประเด็นที่ว่า AI จะเข้ามาสร้างการเปลี่ยนแปลงอย่างฉับพลันต่อโครงสร้างเศรษฐกิจและส่งผลกระทบต่อการเมืองอย่างไร “ผมเชื่อใน AGI ในแง่ที่ว่าในระดับเศรษฐกิจนั้น การจัดระเบียบเศรษฐกิจการเมืองรอบตัว AGI จะเป็นอย่างไร?” เขากล่าวระหว่างการสนทนาแบบโต๊ะกลมหลังจบงาน Microsoft Ignite ที่ Chase Center ในซานฟรานซิสโก", "อย่างไรก็ตาม Nadella ไม่เชื่อว่าโมเดลระดับแนวหน้าอย่าง Claude จะมีความรู้สึกนึกคิด “ผมไม่คิดอย่างนั้น” เขากล่าว พร้อมเสริมว่าเขาเห็นด้วยกับมุมมองของ Mustafa Suleyman ซีอีโอของ Microsoft AI ที่ว่าบริษัทต่างๆ ไม่ควรให้สิทธิแก่โมเดลหรือปฏิบัติต่อพวกมันเสมือนว่ามีสถานะทางศีลธรรม ซึ่งเป็นสิ่งที่บริษัทอย่าง Anthropic ยึดถือเป็นหลักการ โดย Suleyman เคยกล่าวกับผู้เขียนว่าเขามองว่าทีมงานของ Anthropic กำลังหลงทางและแนวทางดังกล่าวเป็นสิ่งที่อันตราย", "Nadella ไม่ได้แสดงจุดยืนที่แข็งกร้าวขนาดนั้น “มันเป็นประเด็นที่น่าถกเถียง” เขากล่าว “ผมไม่ได้ยึดติดกับแนวคิดใดแนวคิดหนึ่ง สิ่งที่ผมกำลังจะบอกคือประเด็นทางสังคมและเทคนิคที่สำคัญที่สุดที่เราต้องจัดการคือ เราจะทำอย่างไรให้มั่นใจว่าเศรษฐกิจจะสามารถกระจายเทคโนโลยีนี้ออกไปได้อย่างกว้างขวาง?”", "เมื่อผู้เขียนถาม Nadella ว่าเขามีมุมมองต่อ AI อย่างไรหลังจากได้ยินคำตอบของเขาเกี่ยวกับกรณีที่ Anthropic ปล่อยผลิตภัณฑ์ใหม่ในชุดโปรแกรมสำนักงาน Nadella ได้พูดคุยอย่างละเอียดเกี่ยวกับความเป็นไปได้ที่เศรษฐกิจจะล่มสลายและจุดจบของระบอบประชาธิปไตย หากปล่อยให้โมเดล AI เพียงโมเดลเดียวสามารถครองสถานะผูกขาดได้", "“หากมองในมุมแบบมาร์กซิสต์ว่ามีเพียงบริษัทเดียวที่เหลืออยู่ นั่นก็คือจุดจบใช่ไหม? สำหรับพวกเราทุกคน”", "“คนส่วนใหญ่มองว่านี่คือการแข่งขันระหว่างบริษัทเทคโนโลยี ซึ่งแน่นอนว่ามันจะเป็นเช่นนั้น” เขากล่าว “แต่จำไว้ว่าโมเดลไม่มีขีดจำกัด มันอาจเป็นบริษัทดูแลสุขภาพ เป็นบริษัทบริการทางการเงิน หรือเป็นอะไรก็ได้หากมันต้องการ มันสามารถเข้าควบคุมรัฐบาลได้ การมองว่านี่เป็นเพียงการแข่งขันแคบๆ ระหว่างบริษัทเทคโนโลยีว่าใครจะไปถึงมูลค่าตลาดล้านล้านดอลลาร์ถัดไปนั้น เป็นวิธีคิดที่แปลกและแคบที่สุดวิธีหนึ่ง”", "Nadella กล่าวต่อไปว่าธรรมชาติของบริษัทต่างๆ กำลังจะถูกทำลายในอนาคต “หากความฉลาดมีผลกระทบทางเครือข่าย (Network Effects) อนาคตของบริษัทจะเป็นอย่างไร?” เขาตั้งคำถาม “หากโมเดลสามารถมองเห็นทุกอย่างและเรียนรู้มัน และโดยพื้นฐานแล้วทุนมนุษย์ทั้งหมดถูกยุบรวมกลายเป็นทุนโทเค็น (Token Capital) บทบาทของบริษัทและทุนมนุษย์ในบริษัทคืออะไร? นั่นคือประเด็นที่ต้องถกเถียงกัน”", "“ผมคิดว่าเศรษฐกิจการเมืองจะน่าสนใจมากขึ้นเรื่อยๆ ในบริบทนั้น ไม่มีใคร—อย่างน้อยก็ในระบอบประชาธิปไตย—จะสามารถชนะการเลือกตั้งได้หากสถานการณ์เป็นไปในทิศทางนั้น หากมีเพียงทุนแต่ไม่มีแรงงาน ผมหมายถึง ผมไม่รู้สิ นั่นไม่ใช่เศรษฐกิจ”", "“หากมองในมุมแบบมาร์กซิสต์ว่ามีเพียงบริษัทเดียวที่เหลืออยู่ นั่นก็คือจุดจบใช่ไหม? สำหรับพวกเราทุกคน ไม่ใช่แค่สำหรับผม คุณเองก็จะกลายเป็นบริษัทในเครือของ Anthropic ด้วยวิธีใดวิธีหนึ่งเช่นกัน”", "ไม่ต้องบอกก็รู้ว่า นี่ไม่ใช่แนวทางที่ซีอีโอสายเทคโนโลยีมักจะใช้พูดถึงการเปิดตัวซอฟต์แวร์สเปรดชีตของคู่แข่ง", "แน่นอนว่า Nadella ยังคงโปรโมตเครื่องมือ AI ต่างๆ ของ Microsoft ในงาน Ignite ซึ่งสัญญาว่าจะช่วยให้ลูกค้าองค์กรสามารถเลือกโมเดลที่คุ้มค่าที่สุดสำหรับงานต่างๆ สามารถรันโมเดลของตนเอง และควบคุมข้อมูลของตนเองในรูปแบบต่างๆ ได้ แนวคิดในที่นี้คือตลาดจะต้องการโมเดลที่หลากหลายและอธิปไตยของข้อมูล เพื่อป้องกันไม่ให้การควบคุมถูกรวมศูนย์ ซึ่งเป็นประเด็นที่ Nadella ย้ำอยู่เสมอระหว่างการสนทนา", "“ผมคิดว่าหากคุณเชื่อว่าโลกและเศรษฐกิจต้องการบริษัทมากกว่าหนึ่งหรือสองแห่ง โดยนิยามแล้วจำเป็นต้องมีโมเดลจำนวนมากพอๆ กับจำนวนบริษัทในรูปแบบใดรูปแบบหนึ่ง” เขากล่าว"], "link": "https://www.theverge.com/tech/1036111/satya-nadella-says-hes-agi-pilled-now", "canonical_link": "https://www.theverge.com/tech/1036111/satya-nadella-says-hes-agi-pilled-now", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Screenshot-2026-11-17-at-3.00.15-PM.png?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794958878, "published_at": "2026-11-17T23:41:18Z", "published_th": "18 พ.ย. 2026 • 06:41 น.", "category_hint": "Technology"}, {"id": 1794955531443, "guid": "https://www.theverge.com/?p=1036110", "original_title": "Jeff Bezos says he was ‘heavily involved’ in picking the new James Bond", "thai_title": "Jeff Bezos เผยมีส่วนร่วมอย่างมากในการคัดเลือกนักแสดงรับบท James Bond คนใหม่", "tag": "Technology", "sub_tag": "ENTERTAINMENT", "bullet_points": ["Jeff Bezos ผู้ก่อตั้ง Amazon ยืนยันว่าเขามีบทบาทสำคัญในการตัดสินใจเลือก Robert Pattinson มารับบท James Bond คนใหม่", "กระบวนการคัดเลือกเริ่มต้นจากกลุ่มนักแสดงขนาดใหญ่จนเหลือผู้เข้ารอบสุดท้าย 5 คน ก่อนจะเข้าสู่การทดสอบหน้ากล้อง (Screen test) อย่างเต็มรูปแบบ", "Bezos ยอมรับว่าในตอนแรกทีมงานมีความกังวลเรื่องชื่อเสียงที่โด่งดังเกินไปของ Pattinson แต่ผลงานการแสดงในการทดสอบกลับทำให้ทุกคนเปลี่ยนใจอย่างรวดเร็ว", "การเข้ามามีส่วนร่วมอย่างใกล้ชิดของ Bezos สะท้อนให้เห็นถึงทิศทางใหม่ของแฟรนไชส์ Bond ภายใต้การดูแลของ Amazon ที่เน้นความพิถีพิถันในทุกขั้นตอน"], "full_paragraphs": ["การประกาศให้ Robert Pattinson มารับบท James Bond ดูจะเป็นเรื่องที่สมเหตุสมผลเมื่อพิจารณาจากผลงานล่าสุดของเขาร่วมกับผู้กำกับ Denis Villeneuve ซึ่งกำลังรับหน้าที่สร้างภาพยนตร์ภาคถัดไปของแฟรนไชส์นี้ให้กับ Amazon แต่ล่าสุดมีการเปิดเผยว่า Jeff Bezos ผู้ก่อตั้ง Amazon ก็มีบทบาทสำคัญในการตัดสินใจครั้งสุดท้ายนี้ด้วยเช่นกัน", "ระหว่างการประชุม Semafor’s Silicon Valley and the World ในวันนี้ Bezos ได้กล่าวว่าเขามีส่วนร่วมอย่างมากในกระบวนการคัดเลือกนักแสดงที่จะมารับบท 007 คนล่าสุด โดยระบุว่า 'เราดำเนินกระบวนการที่เข้มงวดมากและได้ข้อสรุปการตัดสินใจครั้งสุดท้ายเมื่อวันศุกร์ที่ผ่านมา ในช่วงแรกมีกลุ่มนักแสดงจำนวนมาก ก่อนที่เราจะคัดเลือกจนเหลือผู้เข้ารอบสุดท้าย 5 คน'", "Bezos อธิบายถึงขั้นตอนการคัดเลือกต่อว่า 'จากนั้นเราได้ทำการทดสอบหน้ากล้องแบบดั้งเดิมกับผู้เข้ารอบสุดท้ายทั้ง 5 คน ซึ่งน่าสนใจมาก เพราะเราใช้เครื่องแต่งกายเต็มรูปแบบ ฉากจริง และนักแสดงสมทบคนอื่นๆ เราถ่ายทำฉากที่แตกต่างกัน 3 ฉากกับผู้เข้ารอบสุดท้ายแต่ละคน จากนั้นเรามารวมตัวกันในวันศุกร์เพื่อใช้เวลาสองสามชั่วโมงในการดูผลการทดสอบหน้ากล้องทั้งหมดและทบทวนรายละเอียด ซึ่งนักแสดงทุกคนล้วนมีความสามารถที่โดดเด่นมาก'", "เขากล่าวเสริมถึงเหตุผลที่เลือก Pattinson ว่า 'เมื่อถึงรายชื่อ 5 คนสุดท้าย พวกเขาทุกคนล้วนยอดเยี่ยม แต่มีบางสิ่งที่พิเศษเกี่ยวกับ Rob Pattinson และการแสดงของเขา มันเป็นสิ่งที่แทบไม่ต้องถกเถียงกันเลย Denis ซึ่งเป็นผู้กำกับและพวกเราทุกคนต่างเทใจไปที่ Rob โดยที่จริงแล้ว ในตอนแรกผมต้องบอกว่าเรามีความลำเอียงต่อต้านเขานิดหน่อย เพียงเพราะเขาโด่งดังมากเกินไป เราคิดกันว่า บางทีเราควรเลือกคนที่ยังไม่เป็นที่รู้จักมากกว่านี้ แต่ในการทดสอบหน้ากล้อง มันชัดเจนมาก เขาคือ James Bond'", "การที่ผู้นำสตูดิโอต้องการมีส่วนร่วมในการคัดเลือกนักแสดงนำสำหรับหนึ่งในแฟรนไชส์ที่ทำเงินได้มากที่สุดนั้นไม่ใช่เรื่องน่าแปลกใจแต่อย่างใด แต่ด้วยความที่ Bezos เข้ามาดูแลอย่างใกล้ชิดด้วยตัวเองเช่นนี้ ทำให้หลายคนอดจินตนาการไม่ได้ว่ายุคใหม่ของภาพยนตร์ Bond จะมีหน้าตาและบรรยากาศเป็นอย่างไรเมื่อ Amazon เริ่มนำออกฉายในโรงภาพยนตร์"], "link": "https://www.theverge.com/entertainment/1036110/jeff-bezos-james-bond-casting-amazon", "canonical_link": "https://www.theverge.com/entertainment/1036110/jeff-bezos-james-bond-casting-amazon", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/IMG_0270.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794955121, "published_at": "2026-11-17T22:38:41Z", "published_th": "18 พ.ย. 2026 • 05:38 น.", "category_hint": "Technology"}, {"id": 1794954920857, "guid": "https://www.theverge.com/?p=1036160", "original_title": "Read everything that Nvidia’s board chair had to say about Jensen Huang", "thai_title": "เปิดคำแถลงประธานบอร์ด Nvidia ยืนยันไม่รับ Jensen Huang กลับนั่งแท่นซีอีโอ หลังลาออกปมฉาว", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Harvey C. Jones ประธานบอร์ด Nvidia ยืนยันมติเอกฉันท์ไม่รับ Jensen Huang กลับเข้าดำรงตำแหน่งซีอีโออีกครั้ง", "Nvidia แต่งตั้ง Colette Kress อดีต CFO ขึ้นเป็นซีอีโอรักษาการ พร้อมเริ่มกระบวนการสรรหาซีอีโอคนใหม่ผ่านบริษัท Heidrick and Struggles", "บริษัทจัดตั้งคณะกรรมการกำกับดูแลความมั่นคงแห่งชาติและการควบคุมการส่งออก เพื่อตรวจสอบประเด็นที่อาจกระทบต่อความมั่นคงและข้อมูลความลับ", "Nvidia ประกาศรายได้ไตรมาสล่าสุดที่ 1.158 แสนล้านดอลลาร์สหรัฐ ท่ามกลางการเปลี่ยนผ่านผู้นำองค์กรครั้งสำคัญ", "บอร์ดบริหารปฏิเสธการตอบคำถามหรือให้ข้อมูลเพิ่มเติมเกี่ยวกับรายละเอียดการลาออกและการสอบสวน Jensen Huang ในระหว่างการประชุมแถลงผลประกอบการ"], "full_paragraphs": ["Harvey C. Jones ประธานคณะกรรมการบริหารของ Nvidia ได้ออกมาประกาศชัดเจนว่า ทางบริษัทจะไม่มีการตอบคำถามหรือให้ข้อมูลใดๆ เพิ่มเติม 'เกี่ยวกับสถานการณ์การลาออกของ Jensen' ในระหว่างการประชุมแถลงผลประกอบการไตรมาสล่าสุด ซึ่งถือเป็นการประชุมครั้งแรกภายใต้การนำของ Colette Kress ในฐานะซีอีโอรักษาการและ CFO ร่วมกับ Harvey C. Jones ในฐานะประธานบอร์ดคนแรกของบริษัท", "การเปลี่ยนแปลงระดับผู้นำครั้งนี้เกิดขึ้นหลังจาก Jensen Huang ได้ยื่นลาออกเมื่อสัปดาห์ที่ผ่านมา ท่ามกลางรายงานข่าวเรื่องความสัมพันธ์ส่วนตัวหลายกรณี รวมถึงความสัมพันธ์กับ Alice Huang อดีตผู้บริหารของ Megaspeed ซึ่งถูกกล่าวหาว่าเป็นสายลับให้กับจีน และความสัมพันธ์กับพนักงานในสายบังคับบัญชาโดยตรงอย่าง Kimberly Powell โดยขณะนี้ Nvidia กำลังอยู่ในระหว่างการตรวจสอบว่าความสัมพันธ์ของ Huang กับอดีตผู้บริหารรายดังกล่าวส่งผลกระทบต่อความมั่นคงของชาติหรือความลับของบริษัทหรือไม่ นอกจากนี้ Huang ยังมีกำหนดการที่จะต้องเข้าให้การต่อหน้าสภานิติบัญญัติในวันที่ 1 ธันวาคมนี้", "ก่อนหน้าการประชุมแถลงผลประกอบการในวันอังคาร Huang ได้แสดงความจำนงว่าเขาพร้อมที่จะกลับมารับตำแหน่งซีอีโออีกครั้ง อย่างไรก็ตาม ในระหว่างการประชุม Jones ได้กล่าวอย่างชัดเจนว่า 'คณะกรรมการของ Nvidia มีมติเป็นเอกฉันท์ในการยอมรับการลาออกของ Huang และไม่มีเจตนาที่จะแต่งตั้งให้ Jensen กลับมาดำรงตำแหน่งซีอีโออีกครั้ง' พร้อมทั้งย้ำว่าบริษัทจะไม่ตอบคำถามเกี่ยวกับรายละเอียดการลาออกและการสอบสวนที่กำลังดำเนินอยู่ โดยเสริมว่า 'คณะกรรมการกำลังจัดการกับผลกระทบที่เกิดขึ้นกับบริษัทในทันทีอย่างเชิงรุก รวมถึงการยกระดับขีดความสามารถในการกำกับดูแลของเราต่อไปในอนาคต'", "ในรายงานผลประกอบการไตรมาสล่าสุด Nvidia สามารถทำรายได้ไปได้ถึง 1.158 แสนล้านดอลลาร์สหรัฐ ซึ่งเป็นการเติบ อดแยกชิ้นส่วนเพื่อเปลี่ยนแบตเตอรี่หรือซ่อมแซมได้ง่ายขึ้น พวกเขาจึงคาดหวังว่า HomeView ซึ่งเป็นฮับอัจฉริยะที่มีหน้าตาเหมือนแท็บเล็ตขนาด 7 นิ้วติดอยู่บนลำโพงอัจฉริยะนั้นจะมีแนวทางเดียวกัน แต่ความเป็นจริงกลับแตกต่างออกไปอย่างสิ้นเชิง โดยในระหว่างการชำแหละ HomeView ทีมช่างผู้เชี่ยวชาญของ iFixit ยอมรับว่าพวกเขาได้ “ทำขั้วต่อขาด ทำลำโพงแตกเป็นสองส่วน และใช้แรงกดลงบนแผงวงจรหลัก (logic board) มากเกินกว่าที่พวกเราจะรู้สึกสบายใจ”", "ส่วนที่เป็นแท็บเล็ตของ HomeView กลายเป็นความท้าทายที่ใหญ่ที่สุดในการถอดแยกชิ้นส่วน อันเป็นผลมาจากการตัดสินใจด้านการออกแบบที่น่ากังขาของ Apple โดย iFixit ระบุว่ากาวที่ใช้ยึดหน้าจอให้เข้าที่นั้น “ยึดแน่นหนากว่าผลิตภัณฑ์ Apple ทุกชิ้นที่เราเคยเปิดมาในช่วงหลัง” และในขณะที่การตัดสินใจของ Apple ในการเปลี่ยนโครงอะลูมิเนียมทั้งหมดของ HomeView ให้กลายเป็นฮีทซิงค์ (heat sink) นั้นถือเป็นแนวคิดที่ชาญฉลาด แต่การเชื่อมต่อทางความร้อนระหว่างแผ่นป้องกันความร้อน (heat shield) กับแผงวงจรหลักของอุปกรณ์ ทำให้การแยกชิ้นส่วนทั้งสองออกจากกันกลายเป็น “ปฏิบัติการที่มีความเสี่ยงสูงอย่างยิ่ง” แม้การออกแบบเหล่านี้อาจช่วยให้กระบวนการประกอบในโรงงานรวดเร็วขึ้น แต่การใช้กาวในปริมาณมากทำให้การซ่อมบำรุง HomeView เป็นเรื่องที่ยากลำบากอย่างเหลือเชื่อ", "ในวิดีโอการชำแหละที่เผยแพร่ออกมา iFixit ยังเปิดเผยให้เห็นว่าไดรเวอร์ลำโพงในรุ่นติดผนัง (wall-mounted) ของ HomeView นั้นมีขนาดเล็กกว่ารุ่นตั้งโต๊ะอย่างเห็นได้ชัด แม้ว่าทั้งสองรุ่นจะมีราคาจำหน่ายอยู่ที่ 299 ดอลลาร์สหรัฐเท่ากัน แต่รุ่นติดผนังกลับมีต้นทุนที่สูงกว่าเมื่อคำนึงถึงอุปกรณ์ยึดติดที่จำเป็นซึ่งไม่ได้รวมอยู่ในชุดจำหน่าย ส่งผลให้ iFixit รู้สึกว่าผู้บริโภคกำลังได้รับประสิทธิภาพที่น้อยลงในขณะที่ต้องจ่ายเงินมากขึ้น"], "link": "https://www.theverge.com/tech/1036045/ifixit-teardown-apple-homeview-smart-home-hub", "canonical_link": "https://www.theverge.com/tech/1036045/ifixit-teardown-apple-homeview-smart-home-hub", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/ifixit.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": ["https://www.youtube.com/embed/rr7m9nBqDdo"], "review_score": "", "published_ts": 1794954341, "published_at": "2026-11-17T22:25:41Z", "published_th": "18 พ.ย. 2026 • 05:25 น.", "category_hint": "Technology"}, {"id": 1794953742473, "guid": "https://www.theverge.com/?p=1035465", "original_title": "Nvidia says it does not intend to reinstate Jensen Huang as CEO", "thai_title": "Nvidia ยืนยันชัดเจน ไม่มีความตั้งใจดึง Jensen Huang กลับมานั่งเก้าอี้ CEO", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["บอร์ดบริหาร Nvidia ประกาศอย่างเป็นทางการว่าไม่มีแผนที่จะแต่งตั้ง Jensen Huang ให้กลับมาดำรงตำแหน่ง CEO อีกครั้ง", "Jensen Huang เคยโพสต์ข้อความผ่าน X แสดงความพร้อมที่จะกลับมาทำงานหากบอร์ดเห็นว่าจะเป็นประโยชน์ต่อบริษัทและผู้ถือหุ้น", "Huang กำลังเผชิญกับมรสุมข่าวฉาว ทั้งเรื่องความสัมพันธ์ส่วนตัวและข้อกล่าวหาเรื่องการพัวพันกับสายลับต่างชาติ ซึ่งกำลังอยู่ระหว่างการสอบสวนภายใน", "สถานการณ์ของ Nvidia มีความซับซ้อนขึ้นจากการเมืองในสหรัฐฯ และความสัมพันธ์ใกล้ชิดระหว่าง Huang กับอดีตประธานาธิบดี Donald Trump", "นักวิเคราะห์มองว่าแม้จะเกิดความวุ่นวาย แต่ความต้องการ AI Compute Hardware ของ Nvidia ยังคงสูงลิ่วและยากที่คู่แข่งจะเข้ามาแทนที่ได้ในระยะสั้น"], "full_paragraphs": ["ในการเริ่มต้นการประชุมรายงานผลประกอบการรายไตรมาสของ Nvidia เมื่อวันอังคารที่ผ่านมา Harvey Jones ประธานบอร์ดบริหารคนใหม่ได้กล่าวถึงกรณีการลาออกของอดีต CEO Jensen Huang ว่า “บอร์ดบริหารของ Nvidia ได้ยอมรับการลาออกของเขาอย่างเป็นเอกฉันท์ และไม่มีความตั้งใจที่จะแต่งตั้ง Jensen ให้กลับมาดำรงตำแหน่ง CEO อีกครั้ง”", "Jones กล่าวเสริมว่า “เราจะไม่ตอบคำถามหรือหารือใดๆ ในการประชุมวันนี้ เกี่ยวกับสถานการณ์เบื้องหลังการลาออกของ Jensen รวมถึงการสอบสวนที่กำลังดำเนินอยู่ในขณะนี้”", "ก่อนหน้านี้ในวันเดียวกัน Huang ได้แสดงท่าทีผ่านสื่อสังคมออนไลน์ X โดยระบุว่าเขา “ไม่ได้ปฏิบัติตามมาตรฐานที่คาดหวังจากทุกคน” ในบริษัท และรู้สึกเสียใจกับความผิดพลาดที่เกิดขึ้น พร้อมยืนยันว่าจะให้ความร่วมมือกับการสอบสวนของบอร์ดบริหารอย่างเต็มที่ นอกจากนี้เขายังระบุว่ายินดีที่จะกลับมารับตำแหน่ง CEO หากได้รับข้อเสนอ แม้ว่าก่อนหน้านั้นหนึ่งวันจะมีรายงานว่าบอร์ดบริหารของ Nvidia ไม่ได้พิจารณาเรื่องการดึงตัวเขากลับมาก็ตาม โดย Huang ระบุว่า “Nvidia เป็นบริษัทที่เกิดขึ้นเพียงครั้งเดียวในรอบชั่วอายุคน หากคณะกรรมการบริษัทตัดสินใจว่าการกลับมาของผมเป็นประโยชน์สูงสุดต่อผู้ถือหุ้น พนักงาน บริษัท และประเทศชาติ ผมก็พร้อมที่จะตอบรับและกลับมาดำรงตำแหน่ง CEO อีกครั้ง”", "อย่างไรก็ตาม นับตั้งแต่การลาออกเมื่อวันที่ 12 พฤศจิกายนที่ผ่านมา Huang ยังคงติดหล่มอยู่ในข่าวฉาว โดยมีรายงานว่าเขามีความสัมพันธ์เชิงชู้สาว 3 ครั้ง ซึ่ง 2 ครั้งเป็นพนักงานภายใต้บังคับบัญชาที่ Nvidia และอีก 1 ครั้งเกี่ยวข้องกับบุคคลที่ถูกกล่าวหาว่าเป็นสายลับของหน่วยข่าวกรองจีน ซึ่งถูกสงสัยว่ามีส่วนช่วยอำนวยความสะดวกในการขายชิปอย่างผิดกฎหมาย (ทั้งที่ Huang เคยพยายามผลักดันให้ยกเลิกข้อจำกัดการขายชิปของ Nvidia ในจีน) โดยเขามีกำหนดการที่จะต้องเข้าให้การต่อรัฐสภาในวันที่ 1 ธันวาคมนี้ ขณะที่การสอบสวนภายในบริษัทก็ยังคงดำเนินอยู่", "แม้จะมีข่าวฉาว แต่บุคคลสำคัญในอุตสาหกรรมเทคโนโลยีหลายรายยังคงแสดงจุดยืนสนับสนุน Huang โดยยกย่องว่าเขาเป็นบุคคลที่ “หาใครมาแทนไม่ได้” และมีการล่ารายชื่อเพื่อเรียกร้องให้เขากลับมา บางส่วนตั้งข้อสงสัยเกี่ยวกับข้อกล่าวหาที่ว่า Alice Huang (ไม่มีความเกี่ยวข้องทางสายเลือด) เป็นสายลับให้กับจีน โดยมองว่าข่าวรั่วไหลเกี่ยวกับความสัมพันธ์ของทั้งคู่เป็นทฤษฎีสมคบคิดเพื่อทำลายอดีต CEO รายนี้ นอกจากนี้ Donald Trump อดีตประธานาธิบดีสหรัฐฯ ซึ่งเป็นพันธมิตรใกล้ชิดของ Huang ในช่วงปีที่ผ่านมา ก็ได้ออกมาสนับสนุนเช่นกัน โดยเมื่อวันจันทร์ที่ผ่านมา Trump กล่าวว่าเขา “ไม่ขัดข้อง” หาก Huang จะกลับมา พร้อมเสริมว่า “ผมคิดว่าเขาได้รับบทเรียนครั้งใหญ่แล้ว ผมเดาว่าบางทีบทเรียนหนึ่งอาจสำคัญกว่าอีกบทเรียนหนึ่ง”", "ความใกล้ชิดระหว่าง Trump และ Huang อาจสร้างความซับซ้อนให้กับ Nvidia ได้เช่นกัน เนื่องจากบริษัทได้เพิ่มงบประมาณการล็อบบี้ในกรุงวอชิงตัน ดี.ซี. โดยใช้เงินไปถึง 5 ล้านดอลลาร์ในปี 2025 และอีก 4.7 ล้านดอลลาร์ในปี 2026 อย่างไรก็ตาม ในขณะที่พรรคเดโมแครตเตรียมตัวเข้าควบคุมรัฐสภา พวกเขามีแผนที่จะตรวจสอบความสัมพันธ์ระหว่าง Trump กับบริษัทเทคโนโลยีขนาดใหญ่และอุตสาหกรรมอื่นๆ โดยอ้างถึงความเป็นไปได้ของการทุจริต Brendan Glavin ผู้อำนวยการฝ่ายข้อมูลเชิงลึกของ OpenSecrets กล่าวกับ The Verge เมื่อสัปดาห์ที่แล้วว่า “การเลือกตั้งครั้งนี้ไม่ได้ส่งผลบวกต่อ AI มากนัก และข่าวการลาออกของ Huang จะยิ่งทำให้สถานการณ์ซับซ้อนขึ้น โดยเฉพาะสำหรับบริษัทนี้และสำหรับอุตสาหกรรม AI โดยรวมในอนาคต”", "Lior Prosor หุ้นส่วนผู้จัดการของ Deep33 บริษัทร่วมลงทุนด้านเทคโนโลยี กล่าวเมื่อสัปดาห์ที่แล้วว่า เขาไม่คาดว่าการลาออกของ Huang จะทำให้ฟองสบู่ AI แตก แม้ว่า Huang จะมีบทบาทสำคัญในการระดมทุนเพื่อสร้างโครงสร้างพื้นฐาน AI ในสหรัฐฯ ก็ตาม ภายใต้การนำของ Huang ในเดือนสิงหาคม Nvidia ได้ทำข้อตกลงร่วมกับสถาบันการเงิน 6 แห่งด้วยมูลค่าประมาณ 5 แสนล้านดอลลาร์เพื่อสนับสนุนโครงการดังกล่าว Prosor กล่าวกับ The Verge ว่า “Nvidia จัดหาฮาร์ดแวร์ประมวลผล AI ประมาณ 75 เปอร์เซ็นต์ที่อุตสาหกรรมต้องการ และความต้องการยังคงสูงกว่าอุปทานอย่างมาก ทั้งลูกค้าและคู่แข่งต่างไม่สามารถทดแทนขีดความสามารถที่ Nvidia มอบให้ได้อย่างง่ายดาย และแรงจูงใจทางเศรษฐกิจที่ขับเคลื่อนการค้า AI ยังคงไม่เปลี่ยนแปลง”", "ถึงกระนั้น ความกังวลเรื่องตลาดที่อาจชะลอตัวก็ยังคงมีอยู่ โดยเฉพาะเมื่อการทำ IPO ของ Anthropic ซึ่งคาดว่าจะเป็นการเสนอขายหุ้นครั้งใหญ่ที่สุดตลอดกาล มีกำหนดการในวันพฤหัสบดีนี้ โดย Nvidia ได้ตกลงที่จะซื้อหุ้นของ Anthropic มูลค่า 1 หมื่นล้านดอลลาร์ผ่านการเสนอขายหุ้นแบบส่วนตัว นอกเหนือจากเงินทุนสนับสนุนอีก 1 หมื่นล้านดอลลาร์ที่ Nvidia ได้ให้คำมั่นไว้เมื่อปีที่แล้ว"], "link": "https://www.theverge.com/report/1035465/nvidia-says-it-will-not-reinstate-jensen-huang-as-ceo", "canonical_link": "https://www.theverge.com/report/1035465/nvidia-says-it-will-not-reinstate-jensen-huang-as-ceo", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/Nvidia_Jensen_huang_02.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794953105, "published_at": "2026-11-17T22:05:05Z", "published_th": "18 พ.ย. 2026 • 05:05 น.", "category_hint": "Technology"}, {"id": 1794952845464, "guid": "https://www.theverge.com/?p=1035932", "original_title": "The MacBook Neo is receiving a rare $50 discount ahead of Black Friday", "thai_title": "MacBook Neo ปรับลดราคาพิเศษ 50 ดอลลาร์ ต้ งรองเท้า Nike Air จะมีความสม่ำเสมอกันทั่วทั้งพื้นรองเท้า แต่กระบวนการผลิตใหม่นี้สามารถสร้างช่องอากาศหลายช่องที่มีระดับการรองรับแรงกระแทกและความมั่นคงที่แตกต่างกันได้", "Nike ได้ใส่ช่องอากาศไว้ในรองเท้ามานานเกือบ 50 ปี เพื่อเพิ่มความสบายและการรองรับแรงกระแทกพร้อมทั้งทำให้น้ำหนักรองเท้าเบาลง ช่องอากาศเหล่านี้ยังถูกนำไปใช้ในเครื่องแต่งกายเพื่อช่วยเพิ่มการกักเก็บความร้อนจากร่างกายอีกด้วย อย่างไรก็ตาม Nike วางแผนที่จะใช้เทคโนโลยี Tuned Air ใหม่นี้เพื่อปรับแต่งประสบการณ์การรองรับแรงกระแทกในรองเท้าให้เหมาะสมกับนักกีฬาและประเภทกีฬาเฉพาะทาง โดยคาดว่ารองเท้าคู่แรกที่ใช้เทคโนโลยีนี้จะเปิดตัวในช่วงปลายปี 2027 และจะมุ่งเน้นไปที่กลุ่มนักวิ่งเป็นหลัก", "แม้ว่าหนึ่งในความสำเร็จยุคแรกของ Nike คือรองเท้าวิ่งที่มีดีไซน์พื้นรองเท้าได้รับแรงบันดาลใจจากเตาอบวาฟเฟิล แต่บริษัทระบุว่าแรงบันดาลใจสำหรับเทคโนโลยีรองเท้าล่าสุดนี้มาจาก “สีสันที่สดใสบนหน้าปกนิตยสาร” พื้นรองเท้า Tuned Air ผลิตขึ้นโดยใช้ “กระบวนการพิมพ์ดิจิทัลและลามิเนตแบบเฉพาะตัว (proprietary digital print and selective lamination process)” ซึ่งมีการใช้หมึกพิมพ์ในรูปแบบที่กำหนดเพื่อระบุตำแหน่งที่ชั้นวัสดุจะยึดติดกัน กระบวนการนี้สามารถนำไปใช้สร้างช่องอากาศภายในที่มีรูปร่างและขนาดได้ไม่จำกัด และด้วยการปรับจูนปริมาณอากาศในแต่ละช่องอย่างละเอียด ทำให้บางส่วนของพื้นรองเท้าสามารถให้ความรู้สึกที่แน่นขึ้น ในขณะที่บางส่วนให้ความรู้สึกที่นุ่มนวลกว่าได้", "เทคโนโลยี Tuned Air จะไม่เพียงแต่ช่วยให้ Nike สามารถปรับแต่งความพอดีและความรู้สึกของรองเท้าพื้นอากาศสำหรับกีฬาประเภทต่างๆ ได้อย่างละเอียดเท่านั้น แต่ยังช่วยรักษาประโยชน์ของการปรับแต่งเฉพาะตัวให้คงที่ในทุกขนาดไซส์อีกด้วย นอกจากนี้ กระบวนการผลิตใหม่ยังช่วยลดระยะเวลาที่ Nike ใช้ตั้งแต่ขั้นตอนแนวคิดไปจนถึงการออกแบบขั้นสุดท้ายที่พร้อมสำหรับการผลิต โดยบริษัทระบุในข่าวประชาสัมพันธ์วันนี้ว่า “ต้นแบบที่เคยใช้เวลาสามสัปดาห์ ปัจจุบันสามารถทำเสร็จได้ภายในสามวัน” ซึ่งสิ่งนี้ช่วยให้ดีไซเนอร์ของ Nike มีเวลามากขึ้นในการปรับปรุงรองเท้ารุ่นใหม่ๆ และมีโอกาสในการทดลองสิ่งใหม่ๆ ได้มากขึ้น"], "link": "https://www.theverge.com/tech/1035911/nike-shoes-tuned-air-sole-printing-variable-cushioning", "canonical_link": "https://www.theverge.com/tech/1035911/nike-shoes-tuned-air-sole-printing-variable-cushioning", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/nike1.jpg?quality=90&strip=all&crop=0,0,100,100&w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/nike2.jpg?quality=90&strip=all&crop=0%2C0%2C100%2C100&w=1200"], "videos": [], "review_score": "", "published_ts": 1794951488, "published_at": "2026-11-17T21:38:08Z", "published_th": "18 พ.ย. 2026 • 04:38 น.", "category_hint": "Technology"}, {"id": 1794950134648, "guid": "https://www.theverge.com/?p=1035957", "original_title": "Not even Sam Altman is safe from AI deepfakes on Instagram", "thai_title": "แม้แต่ Sam Altman ก็ไม่รอด: เมื่อผู้บริหาร Meta ใช้ AI Deepfake ล้อเลียนคู่แข่งบน Instagram", "tag": "Technology", "sub_tag": "TECH", "bullet_points": ["Alexandr Wang ประธานเจ้าหน้าที่ฝ่าย AI ของ Meta โพสต์คลิปวิดีโอ Deepfake ล้อเลียน Sam Altman ซีอีโอของ OpenAI ลงบน Instagram", "คลิปดังกล่าวเป็นส่วนหนึ่งของการโปรโมต Muse ซึ่งเป็น AI Agent ของ Meta โดยแสดงภาพ Altman ในชุดมาสคอตขนฟู", "Meta ยืนยันว่าโพสต์ของ Wang ไม่ผิดกฎ เนื่องจากมีการติดป้ายกำกับว่าเป็นเนื้อหาที่สร้างโดย AI อย่างชัดเจน", "ประเด็นเรื่อง Deepfake กำลังเป็นที่วิพากษ์วิจารณ์อย่างหนัก โดยเฉพาะกรณีภาพ AI ของนักแสดง Mia Goth ที่ไม่มีการติดป้ายกำกับและถูกแชร์โดยบัญชีที่ผ่านการยืนยันตัวตน", "นโยบายของ Meta ยังคงมีความแตกต่างระหว่างวิดีโอที่ต้องติดป้ายกำกับ กับภาพนิ่งที่ไม่มีข้อบังคับดังกล่าว"], "full_paragraphs": ["Instagram กำลังเต็มไปด้วยเนื้อหาประเภท Deepfake ที่สร้างโดย AI ซึ่งล่าสุดรวมถึงเนื้อหาที่มาจากหนึ่งในผู้บริหารระดับสูงของ Meta เองด้วย", "เมื่อช่วงต้นเดือนพฤศจิกายนที่ผ่านมา Alexandr Wang ประธานเจ้าหน้าที่ฝ่าย AI ของ Meta ได้แชร์คลิปวิดีโอสั้นเพื่อโปรโมต Muse ซึ่งเป็น AI Agent สำหรับผู้บริโภคของบริษัท ในคลิปที่สร้างขึ้นโดย AI นี้ Wang, Mark Zuckerberg ซีอีโอของ Meta, Sam Altman ซีอีโอของ OpenAI และ Jolly มาสคอตตัวการ์ตูนของ Muse กำลังวิดีโอคอลคุยกันสี่สาย โดยเมื่อ Altman ปรากฏตัวในสาย เขากลับแต่งกายด้วยชุดมาสคอตขนฟูและเพนต์หน้าให้เหมือนกับตัวละคร Jolly พร้อมคำบรรยายใต้คลิปว่า “When the homies meet about openai product strategy” ซึ่งเป็นการล้อเลียนการแข่งขันในตลาด AI Agent และความนิยมของ Muse ในขณะนี้", "ย้อนกลับไปเพียงไม่กี่ปี เนื้อหา AI ที่นำเสนอภาพบุคคลจริงมักนำไปสู่การวิพากษ์วิจารณ์อย่างรุนแรงจากสาธารณชน โดยมีการประณามการใช้เทคโนโลยีเพื่อเลียนแบบมนุษย์ และในบางกรณีถึงขั้นมีการขู่ว่าจะดำเนินคดีทางกฎหมาย แต่ในปัจจุบัน เนื้อหา AI ได้กลายเป็นส่วนหนึ่งของความเป็นจริงใหม่ โดยเฉพาะบนโซเชียลมีเดีย ตัวอย่างเช่น ในช่วงก่อนการเลือกตั้งกลางเทอม กลุ่มการเมืองได้ทุ่มเงินหลายล้านดอลลาร์ไปกับการซื้อโฆษณาที่สร้างโดย AI เพื่อโจมตีคู่แข่ง", "Wang ได้ทำสิ่งที่หลายคนเรียกว่า “Anti-PR” เพื่อโปรโมต Muse โดยเขาทวีตข้อความหลายร้อยครั้งและเรียกนักการตลาดแบบดั้งเดิมว่า “corposlops” อย่างไรก็ตาม การที่ผู้บริหารระดับสูงของบริษัทเทคโนโลยีรายใหญ่โพสต์วิดีโอ AI ของคู่แข่งถือเป็นเรื่องที่น่าจับตามอง โดยเฉพาะบนแพลตฟอร์มที่เพิ่งถูกวิพากษ์วิจารณ์อย่างหนักเกี่ยวกับเนื้อหาที่สร้างโดย AI หลังจากภาพ AI ของนักแสดงสาว Mia Goth กลายเป็นกระแสในเดือนตุลาคม ตัวแทนของนักแสดงจากเรื่อง Pearl ได้กล่าวกับ The Verge ว่า “เป็นเรื่องที่ไม่สามารถเข้าใจได้” ที่ Instagram ปล่อยให้ภาพดังกล่าวแพร่กระจาย แทนที่จะมุ่งเน้นไปที่ “การปกป้องและความสมบูรณ์ของภาพลักษณ์ของบุคคลสาธารณะ”", "นอกจากนี้ยังมีคนดังคนอื่นๆ รวมถึง Scarlett Johansson ที่ตกเป็นเป้าหมายของภาพ AI ที่มีเนื้อหาทางเพศอยู่บ่อยครั้ง ซึ่งที่ผ่านมา Meta ได้ลบหลายบัญชีที่พบว่ามีการสวมรอยเป็นบุคคลอื่นและใช้ภาพลักษณ์ของพวกเขา", "Meta มีข้อกำหนดว่าวิดีโอที่สร้างโดย AI ซึ่งแสดงภาพบุคคลจะต้องมีการติดป้ายกำกับว่าเป็น AI เช่นเดียวกับโพสต์ของ Wang อย่างไรก็ตาม ภาพนิ่งไม่มีข้อกำหนดดังกล่าว ซึ่งหมายความว่าภาพ AI ของ Goth ไม่มีการเปิดเผยข้อมูลใดๆ ยิ่งไปกว่านั้น ภาพดังกล่าวยังถูกแชร์โดยบัญชีแฟนคลับที่มีเครื่องหมายยืนยันตัวตน (Blue Badge) ที่ออกโดย Instagram อีกด้วย", "เมื่อสอบถามไปยัง Meta ทางโฆษก Tracy Clayton ได้ตั้งข้อสังเกตว่าโพสต์ของ Wang มีการติดป้ายกำกับว่าเป็นเนื้อหา AI แล้ว นอกจากนี้ Clayton ยังชี้ให้เห็นว่า Altman เองก็ได้เปิดให้มีการนำภาพลักษณ์
