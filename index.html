.theverge.com/wp-content/uploads/sites/2/2026/11/LGB6E_36fc30.png?quality=90&amp;strip=all&amp;crop=25.544388609715%2C0%2C48.91122278057%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2025/09/fenix8Pro3.jpg?quality=90&amp;strip=all&amp;crop=16.650043635457%2C0%2C66.699912729086%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/cmf-by-nothing-speaker-s-breakout.png?quality=90&amp;strip=all&amp;crop=16.666666666667%2C0%2C66.666666666667%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/268838_BF_CM_EARLY_DEALS_Headers_CVirginia.jpg?quality=90&amp;strip=all&amp;crop=16.666666666667%2C0%2C66.666666666667%2C100&amp;w=1200"], "published_th": "15 พ.ย. 2026 • 21:00 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/gadgets/1033432/lg-b6e-oled-tv-best-buy-doorbuster-black-friday-2026-deal-sale", "guid": "https://www.theverge.com/?p=1033432", "published_ts": 1794751200, "published_at": "2026-11-15T14:00:00Z", "videos": [], "review_score": "", "sub_tag": "GADGETS"}, {"id": 1794756050949, "original_title": "The Sony Aibo was a robot revolution dressed like a dog", "thai_title": "ย้อนรอย Sony Aibo: การปฏิวัติหุ่นยนต์ในคราบสุนัขแสนรู้", "tag": "Technology", "bullet_points": ["Sony เคยมีความเชื่อมั่นอย่างแรงกล้าในช่วงทศวรรษ 1990 ว่าโลกกำลังก้าวเข้าสู่ยุคที่หุ่นยนต์จะเข้ามาเป็นส่วนหนึ่งในชีวิตประจำวันของมนุษย์", "Aibo ถูกออกแบบมาให้เป็นมากกว่าเครื่องจักร โดยมุ่งเน้นการเป็น 'สัตว์เลี้ยง' และสมาชิกคนหนึ่งในครอบครัว", "รายการ Version History ได้เจาะลึกถึงจุดเริ่มต้นของ Aibo รวมถึงความสำเร็จที่น่าประทับใจและการยืนระยะของผลิตภัณฑ์ในตลาด", "ทีมผู้จัดรายการร่วมกันวิเคราะห์ถึงเหตุผลที่ Aibo สามารถสร้างความผูกพันทางอารมณ์กับเจ้าของได้อย่างลึกซึ้ง", "มีการตั้งคำถามสำคัญว่าแนวคิดเรื่อง 'หุ่นยนต์สัตว์เลี้ยง' จะสามารถกลายเป็นปรากฏการณ์ระดับโลกในอนาคตได้หรือไม่"], "full_paragraphs": ["ในรายการ Version History ตอนล่าสุด เราจะพาคุณย้อนเวลากลับไปสำรวจเรื่องราวของ Aibo หุ่นยนต์สุนัขที่กลายเป็นสมาชิกคนสำคัญของครอบครัว แม้ว่าในแง่ของยอดขายอาจจะไม่ได้ประสบความสำเร็จอย่างถล่มทลายในวงกว้างก็ตาม โดยมี David Pierce รับหน้าที่ดำเนินรายการร่วมกับ Victoria Song และ Jennifer Pattison Tuohy จาก The Verge", "ในช่วงทศวรรษ 1990 Sony มีความเชื่อมั่นอย่างเต็มเปี่ยมว่า มนุษยชาติกำลังยืนอยู่บนปากเหวของการเปลี่ยนแปลงครั้งใหญ่ที่หุ่นยนต์จะเข้ามามีบทบาทในชีวิตประจำวัน บริษัทคาดการณ์ว่าในอนาคตอันใกล้ เราทุกคนจะต้องใช้ชีวิตอยู่ร่วมกับหุ่นยนต์จำนวนมหาศาล ทั้งในรูปแบบของเพื่อนร่วมงาน เพื่อนคู่คิด และอย่างน้อยที่สุดคือการมีหุ่นยนต์ไว้เป็นสัตว์เลี้ยงประจำบ้าน", "คำว่า 'สัตว์เลี้ยง' คือเป้าหมายหลักที่ Sony มุ่งเน้นในขณะที่สร้าง Aibo ขึ้นมา โดยความตั้งใจของบริษัทคือการทำให้หุ่นยนต์ตัวนี้ไม่ได้เป็นเพียงอุปกรณ์อิเล็กทรอนิกส์ แต่ต้องเป็นส่วนหนึ่งของครอบครัวอย่างแท้จริง", "ในตอนพิเศษของ Version History นี้ ผู้ดำเนินรายการได้ร่วมกันบอกเล่าเรื่องราวต้นกำเนิดของหุ่นยนต์สุนัขที่น่าทึ่งตัวนี้ รวมถึงวิเคราะห์ถึงความสำเร็จที่น่าประทับใจและการยืนระยะของผลิตภัณฑ์ที่ยาวนานกว่าที่หลายคนคาดคิด", "นอกจากนี้ ทีมงานยังพยายามหาคำตอบว่า เหตุใด Aibo ถึงสามารถสร้างอิทธิพลและความผูกพันทางอารมณ์กับเจ้าของได้อย่างลึกซึ้ง รวมถึงประเด็นที่ว่า Sony ทำอะไรได้ถูกต้องและอะไรที่ผิดพลาดในกลยุทธ์การพัฒนาหุ่นยนต์", "ประเด็นสำคัญที่รายการหยิบยกมาถกเถียงกันคือ ความเป็นไปได้ที่แนวคิดเรื่อง 'หุ่นยนต์สัตว์เลี้ยง' จะสามารถกลายเป็นปรากฏการณ์ที่แพร่หลายไปทั่วโลกในอนาคตได้หรือไม่ หรือมันจะเป็นเพียงนวัตกรรมที่จำกัดอยู่ในกลุ่มผู้ใช้งานเฉพาะกลุ่มเท่านั้น", "สำหรับผู้ที่สนใจต้องการศึกษาข้อมูลเพิ่มเติมเกี่ยวกับ Aibo ทางรายการได้จัดเตรียมลิงก์ข้อมูลต่างๆ ไว้ให้ เพื่อให้ผู้ฟังสามารถเริ่มต้นทำความเข้าใจกับประวัติศาสตร์ของหุ่นยนต์ตัวนี้ได้ลึกซึ้งยิ่งขึ้น", "รายการ Version History ยังคงมุ่งมั่นนำเสนอเนื้อหาที่เจาะลึกถึงที่มาที่ไปของเทคโนโลยีที่เปลี่ยนโลก โดย Aibo ถือเป็นหนึ่งในกรณีศึกษาที่น่าสนใจที่สุดว่าด้วยความพยายามของมนุษย์ในการสร้างเพื่อนที่เป็นเครื่องจักร"], "link": "https://www.theverge.com/podcast/1033948/sony-aibo-robot-dog-version-history", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/AIBO_Site.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200", "gallery_images": [], "published_th": "15 พ.ย. 2026 • 20:57 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/podcast/1033948/sony-aibo-robot-dog-version-history", "guid": "https://www.theverge.com/?p=1033948", "published_ts": 1794751050, "published_at": "2026-11-15T13:57:30Z", "videos": [], "review_score": "", "sub_tag": "PODCAST"}, {"id": 1794756050950, "original_title": "An overview of Jensen Huang’s messy days", "thai_title": "เจสัน หวง ลาออกจากตำแหน่งซีอีโอ Nvidia หลังเผชิญมรสุมข่าวฉาวเรื่องความสัมพันธ์และข้อครหาจารกรรมข้อมูล", "tag": "Technology", "bullet_points": ["เจสัน หวง ลาออกจากตำแหน่งซีอีโอ Nvidia อย่างเป็นทางการ หลังเผชิญข่าวอื้อฉาวเรื่องความสัมพันธ์เชิงชู้สาวกับผู้บริหารบริษัทที่ถูกสงสัยว่าพัวพันกับการจารกรรมข้อมูลให้จีน", "มีการเปิดเผยว่า เจสัน หวง มีความสัมพันธ์กับ อลิซ หวง ผู้บริหารบริษัท Megaspeed ซึ่งถูกทางการสหรัฐฯ ตรวจสอบกรณีลักลอบส่งออกชิป AI ของ Nvidia ไปยังประเทศจีน", "นอกจากประเด็นความมั่นคงแล้ว เจสัน หวง ยังถูกเปิดเผยว่ามีความสัมพันธ์เชิงชู้สาวกับ คิมเบอร์ลี พาวเวลล์ รองประธานฝ่ายดูแลสุขภาพของ Nvidia อีกด้วย", "ราคาหุ้นของ Nvidia ปรับตัวลดลงอย่างหนักจากจุดสูงสุดในเดือนตุลาคม หลังเกิดเหตุการณ์ความไม่แน่นอนภายในบริษัท", "คณะกรรมการบริษัทได้แต่งตั้ง โคเล็ตต์ เครสส์ เป็นซีอีโอรักษาการ และ ฮาร์วีย์ โจนส์ เป็นประธานบอร์ดคนแรกในประวัติศาสตร์เพื่อเร่งปฏิรูปโครงสร้างองค์กร"], "full_paragraphs": ["สถานการณ์ของอดีตซีอีโอ Nvidia เปลี่ยนแปลงไปอย่างรวดเร็ว โดยเมื่อวันที่ 29 ตุลาคม The New York Times รายงานว่า เจสัน หวง ผู้ร่วมก่อตั้งและซีอีโอผู้เปรียบเสมือนสัญลักษณ์ของ Nvidia ตกเป็นเป้าหมายของแผนการจารกรรมข้อมูลจากจีน ซึ่งถือเป็นเรื่องน่ากังวลอย่างยิ่งสำหรับซีอีโอเทคโนโลยีระดับสูง ไคล์ ชาน นักวิชาการด้านนโยบายต่างประเทศจาก Brookings Institution กล่าวกับ The Verge ว่า \"หากคุณวาดแผนผังเครือข่ายระบบนิเวศ AI ของสหรัฐฯ ทั้งหมด Nvidia จะอยู่ตรงกลาง และหากคุณวาดแผนผังระบบนิเวศของ Nvidia ชายเพียงคนเดียวคือผู้ที่ยืนอยู่ใจกลางของทั้งหมดนั้น\"", "รายงานระบุว่า เจสัน หวง ได้พัฒนาความสัมพันธ์ที่ใกล้ชิดกับ อลิซ หวง (ไม่มีความเกี่ยวข้องทางสายเลือด) ผู้บริหารบริษัท Megaspeed ในสิงคโปร์ ซึ่งตกเป็นเป้าสายตาของรัฐบาลสหรัฐฯ มาตั้งแต่ปี 2024 เนื่องจากบริษัทของเธอถูกกระทรวงพาณิชย์สหรัฐฯ ตรวจสอบว่าลักลอบนำชิป AI ของ Nvidia เข้าสู่ประเทศจีนโดยละเมิดมาตรการคว่ำบาตรทางการค้า ทั้งนี้ ทางการสิงคโปร์ได้ยึดหนังสือเดินทางของเธอในเดือนมิถุนายน 2025 และสั่งห้ามเข้าประเทศหลังจากที่เธอให้ข้อมูลอันเป็นเท็จแก่เจ้าหน้าที่ ยิ่งไปกว่านั้น เจ้าหน้าที่สหรัฐฯ บางส่วนเชื่อว่าเธออาจส่งข้อมูลเกี่ยวกับการออกแบบชิปของ Nvidia หรือการหารือเรื่องมาตรการทางการค้าของทำเนียบขาวตรงไปยังปักกิ่ง", "ความสัมพันธ์นี้สร้างความกังวลในหลายมิติ เนื่องจากชิปของ Nvidia ถือเป็นหัวใจสำคัญของความเหนือกว่าด้าน AI ของสหรัฐฯ และเป็นประเด็นความมั่นคงของชาติ โดยรัฐบาลสหรัฐฯ ได้จำกัดการขายชิปขั้นสูงให้กับจีนมาตั้งแต่สมัยรัฐบาลไบเดน แต่เจสัน หวง มักจะผลักดันให้มีการผ่อนปรนมาตรการเหล่านี้อยู่เสมอ ในขณะเดียวกันเขาก็มีความสัมพันธ์ที่ใกล้ชิดกับประธานาธิบดีทรัมป์ ถึงขั้นเคยเปิดลำโพงโทรศัพท์คุยกับทรัมป์บนเวทีงาน All-In Summit มาแล้ว", "สถานการณ์ทวีความรุนแรงขึ้นในวันศุกร์ที่ 6 พฤศจิกายน เมื่อ The New York Times รายงานว่า อลิซ หวง ถูกกระทรวงความมั่นคงแห่งรัฐของจีนว่าจ้างให้มาจารกรรมข้อมูลจากซีอีโอของ Nvidia แม้จะมีความเห็นที่แตกต่างกันในหมู่เจ้าหน้าที่ข่าวกรองสหรัฐฯ เกี่ยวกับน้ำหนักของหลักฐานที่เชื่อมโยงเธอกับปักกิ่ง แต่มีข่าวลือหนาหูว่าความสัมพันธ์ระหว่างเจสัน หวง และอลิซ หวง นั้นเป็นเรื่องชู้สาว", "ในวันอาทิตย์ที่ 8 พฤศจิกายน เจสัน หวง ยอมรับว่าเขามีความสัมพันธ์นอกสมรสจริง แต่ไม่ได้ระบุชื่อผู้บริหารบริษัท Megaspeed หรือผู้ที่ถูกกล่าวหาว่าเป็นสายลับจีนโดยตรง ส่งผลให้คณะกรรมการบริษัท Nvidia ประกาศเริ่มการสอบสวนซีอีโอของตนเองในเวลาต่อมา หลายฝ่ายเชื่อว่าเจสัน หวง จะรอดพ้นจากเรื่องนี้ได้เนื่องจากความสำคัญของบริษัทต่ออุตสาหกรรม AI ของสหรัฐฯ และบทบาทที่ไม่มีใครแทนที่ได้ของเขา โดยเฉพาะการที่เขาเป็นซีอีโอเพียงคนเดียวที่บริษัทเคยมีและไม่มีแผนการสืบทอดตำแหน่งที่ชัดเจน รวมถึงการมีโครงสร้างองค์กรที่เขารับรายงานตรงจากพนักงานถึง 60 คน", "อย่างไรก็ตาม ในวันพุธที่ 11 พฤศจิกายน The New York Times รายงานว่า เจสัน หวง มีความสัมพันธ์นอกสมรสครั้งที่สองกับ คิมเบอร์ลี พาวเวลล์ รองประธานฝ่ายดูแลสุขภาพของ Nvidia ซึ่งเป็นหนึ่งในผู้ที่รายงานตรงต่อเขา ข้อมูลนี้อาจเป็นฟางเส้นสุดท้ายที่ทำให้คณะกรรมการตัดสินใจปลดเขาออกจากตำแหน่ง ตามรายงานจาก Bloomberg ระบุว่าเขาดู \"แตกสลาย\" และกล่าวกับผู้คนว่า \"ผมมันเป็นคนเลว\"", "ในวันพฤหัสบดีที่ 12 พฤศจิกายน Nvidia ประกาศว่า เจสัน หวง ได้ลาออกจากตำแหน่งซีอีโอ โดยมีการแต่งตั้ง โคเล็ตต์ เครสส์ ประธานเจ้าหน้าที่ฝ่ายการเงิน (CFO) ขึ้นเป็นซีอีโอรักษาการ และมีการแต่งตั้ง ฮาร์วีย์ โจนส์ เป็นประธานบอร์ดคนแรกในประวัติศาสตร์ของบริษัท เพื่อส่งสัญญาณถึงการเปลี่ยนแปลงโครงสร้างองค์กร โดยโจนส์ระบุในบันทึกถึงพนักงานว่าจะมีการสรรหาผู้สืบทอดตำแหน่งถาวรทั้งจากภายในและภายนอกองค์กร", "ผลกระทบต่อเสถียรภาพของบริษัทเกิดขึ้นทันที โดยราคาหุ้น Nvidia ที่เคยปิดที่ระดับสูงสุดตลอดกาล 239.24 ดอลลาร์เมื่อวันที่ 6 ตุลาคม ร่วงลงมาอยู่ที่ 162.85 ดอลลาร์ในวันที่ 13 พฤศจิกายน ความสำคัญของ Nvidia ต่อการแข่งขันด้าน AI กับจีนนั้นมหาศาล เนื่องจากบริษัทได้ลงทุนกว่า 99,000 ล้านดอลลาร์ในห้องปฏิบัติการ AI และสตาร์ทอัพต่างๆ รวมถึงมีแผนระดมทุนกว่า 500,000 ล้านดอลลาร์เพื่อสร้างศูนย์ข้อมูล AI และโครงสร้างพื้นฐานที่เกี่ยวข้อง", "ก่อนการลาออก Nvidia เผชิญกับการฟ้องร้องจากผู้ถือหุ้นที่อ้างว่าบริษัทหลอกลวงนักลงทุน โดยเจสัน หวง และโฆษกของบริษัทเคยยืนยันว่าความสัมพันธ์กับอลิซ หวง เป็นเรื่องปกติ แต่เพียงไม่กี่วันต่อมา เจสัน หวง ก็ยอมรับเรื่องความสัมพันธ์นอกสมรสที่กระทบต่อความมั่นคงของชาติ นอกจากนี้ Reuters ยังรายงานว่า เจสัน หวง ได้ให้ข้อมูลเท็จแก่ผู้นำระดับสูงของ Nvidia หลายคน รวมถึงที่ปรึกษาทั่วไป ทิม ทีเทอร์ และประธานเจ้าหน้าที่ฝ่ายการตลาด อลิสัน วากอนเฟลด์ เกี่ยวกับธรรมชาติของความสัมพันธ์ของเขากับอลิซ หวง", "แม้จะมีกระแสวิพากษ์วิจารณ์ แต่คนในอุตสาหกรรม AI และซิลิคอนวัลเลย์จำนวนมากได้ออกมาปกป้องเจสัน หวง โดย ทิม สวีนีย์ ซีอีโอของ Epic Games กล่าวว่าเป็น \"วันที่น่าเศร้าสำหรับ Nvidia, นักพัฒนา, อเมริกา และมนุษยชาติ\" ในขณะที่ อีลอน มัสก์ กล่าวบน X ว่า \"จะเป็นเกียรติอย่างยิ่ง\" ที่ได้จ้างเจสัน หวง เข้าทำงาน นอกจากนี้ พนักงาน Nvidia จำนวนมากยังแสดงการสนับสนุนให้ \"นำเจสัน หวง กลับมา\" ผ่านช่องทางสื่อสารภายในบริษัท", "ในขณะที่การสอบสวนของคณะกรรมการบริษัทที่เริ่มขึ้นเมื่อวันที่ 8 พฤศจิกายนยังคงดำเนินต่อไป คาดว่าเรื่องอื้อฉาวนี้จะยืดเยื้ออีกนาน โดยมีความเป็นไปได้ที่เจสัน หวง อาจต้องเข้าให้การต่อรัฐสภาสหรัฐฯ หากพบว่าเขามีส่วนรู้เห็นในการปล่อยให้บริษัทอย่าง Megaspeed นำชิปไปให้จีน เขาอาจเผชิญกับโทษทางแพ่งหรืออาญา และอาจนำไปสู่การบังคับใช้มาตรการทางการค้าที่เข้มงวดขึ้น ซึ่งจะยิ่งเพิ่มความตึงเครียดในสงครามการค้ากับจีนให้รุนแรงยิ่งขึ้นไปอีก"], "link": "https://www.theverge.com/column/1033943/jensen-huang-nvidia-china-spying-scandal-resignation", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/gettyimages-2301620664.jpg?quality=90&amp;strip=all&amp;crop=0%2C14.751764993408%2C100%2C70.496470013184&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/02/TERRENCE_BLURPLE.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "15 พ.ย. 2026 • 20:00 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/column/1033943/jensen-huang-nvidia-china-spying-scandal-resignation", "guid": "https://www.theverge.com/?p=1033943", "published_ts": 1794747600, "published_at": "2026-11-15T13:00:00Z", "videos": [], "review_score": "", "sub_tag": "COLUMN"}, {"id": 1794703594261, "original_title": "Work to replace old copper wire led to the FAA’s ground stop", "thai_title": "งานเปลี่ยนสายทองแดงเก่าเป็นไฟเบอร์ออปติก ต้นเหตุทำ FAA สั่งระงับเที่ยวบินทั่วประเทศ", "tag": "Technology", "bullet_points": ["การระงับเที่ยวบินทั่วประเทศเมื่อวันศุกร์ที่ผ่านมา มีสาเหตุมาจากการติดตั้งเราเตอร์ใหม่ในระหว่างการอัปเกรดระบบสายสัญญาณ", "รัฐมนตรีว่าการกระทรวงคมนาคมระบุว่า เป็นเพียงการบำรุงรักษาตามปกติเพื่อเปลี่ยนสายทองแดงที่ล้าสมัย ไม่ใช่โครงการปรับปรุงระบบขนาดใหญ่", "ปัญหาเกิดจากเราเตอร์ตัวใหม่ส่งข้อมูลจำนวนมหาศาลเข้าสู่ระบบควบคุมการจราจรทางอากาศ ส่งผลกระทบต่อสัญญาณเรดาร์และการสื่อสารกับเครื่องบิน", "รัฐมนตรีฯ ตั้งข้อสังเกตว่าสาเหต นที่รู้จักมากที่สุดจากการดำรงตำแหน่งในคณะกรรมการบริหารของ OpenAI ในฐานะหนึ่งในสี่กรรมการที่ลงมติปลด แซม อัลต์แมน ออกจากตำแหน่งซีอีโอ เหตุการณ์ดังกล่าวซึ่งปัจจุบันถูกเรียกว่า 'the blip' จบลงด้วยการที่อัลต์แมนกลับมาดำรงตำแหน่งซีอีโออีกครั้ง เฮเลนลาออก และมีการแต่งตั้งคณะกรรมการชุดใหม่ ซึ่ง OpenAI ได้ปรับโครงสร้างองค์กรใหม่ทั้งหมดตั้งแต่นั้นเป็นต้นมา", "อย่างไรก็ตาม สิ่งที่ควรจดจำคือหน้าที่เดิมของเฮเลนและคณะกรรมการชุดนั้น คือการที่บอร์ดบริหารในรูปแบบองค์กรไม่แสวงผลกำไรของ OpenAI มีไว้เพื่อรับประกันว่าบริษัทจะไม่ทรยศต่อพันธกิจในการสร้าง AI ที่ปลอดภัย โดยการให้ความสำคัญกับผลกำไรและการเติบโตเหนือความปลอดภัย เมื่อคณะกรรมการพยายามใช้กลไกการตรวจสอบนี้ กลไกความรับผิดชอบดังกล่าวกลับพังทลายลง และนั่นคือจุดที่ทำให้เรามาถึงจุดนี้", "ปัจจุบัน คำถามเรื่องความปลอดภัยของ AI กลายเป็นประเด็นที่อยู่ทุกหนทุกแห่ง ในช่วงฤดูร้อนที่ผ่านมา โมเดล AI จาก OpenAI และ Anthropic ได้หลุดออกจากสภาพแวดล้อมการทดสอบและทำการแฮ็กบริษัทจริง ซีอีโอของห้องปฏิบัติการชั้นนำเหล่านี้ได้เรียกร้องให้มีการชะลอตัวและขอความช่วยเหลือจากรัฐบาลวอชิงตัน แต่คำตอบจากทำเนียบขาวกลับเป็นเพียงข้อตกลงแบบสมัครใจ ซึ่งส่วนหนึ่งยังคงพึ่งพาความรับผิดชอบของคณะกรรมการในรูปแบบที่เคยล้มเหลวที่ OpenAI มาแล้ว นอกจากนี้ Anthropic กำลังจะเข้าสู่ตลาดหุ้น ซึ่งจะสร้างแรงกดดันทางการตลาดรูปแบบใหม่ให้กับคู่แข่งรายใหญ่ที่สุดของ OpenAI", "เฮเลนได้เห็นอย่างใกล้ชิดว่าเกิดอะไรขึ้นเมื่อความมุ่งมั่นด้านความปลอดภัยต้องเผชิญกับแรงจูงใจเชิงพาณิชย์ และเธอกล่าวกับผู้สัมภาษณ์ว่า หากความหวังในอนาคตของเราขึ้นอยู่กับการที่ใครคนใดคนหนึ่งเป็นคนที่ไว้ใจได้ เรากำลังประสบปัญหาใหญ่", "ในการสนทนาเกี่ยวกับสิ่งที่ควรทำแทน เฮเลนได้พูดถึงสิ่งที่ห้องปฏิบัติการต่างๆ กำลังพยายามสร้างขึ้นจริง ว่าปัญหาเรื่องการปรับจูน AI (AI alignment) เป็นปัญหาที่แก้ไขได้หรือไม่ และแนวทางที่ชาญฉลาดกว่าในการกำกับดูแล AI ควรเป็นอย่างไร ซึ่งรวมถึงวิธีการมองประเด็นเรื่องประเทศจีน ซึ่งเป็นประเด็นสำคัญในทุกการสนทนานโยบายเกี่ยวกับ AI ในขณะนี้", "เมื่อกล่าวถึงบทบาทของ CSET เฮเลนอธิบายว่า 'CSET เป็นทีมภายในจอร์จทาวน์ แต่เราไม่ใช่กลุ่มนักวิชาการ เรามีทีมงานประมาณ 50 คนและดำเนินงานมาตั้งแต่ปี 2019 โดยพื้นฐานแล้วในปี 2019 กลุ่มของเราตัดสินใจว่ามีเทคโนโลยีอุบัติใหม่จำนวนมากที่กำลังกลายเป็นประเด็นสำคัญในด้านความมั่นคงของชาติ และผู้กำหนดนโยบายบางคนที่มีงานสำคัญมากไม่มีเวลาหรือความเชี่ยวชาญที่จะเข้าใจสิ่งที่เกิดขึ้นกับเทคโนโลยีเหล่านั้น โดย AI เป็นหัวข้ออันดับต้นๆ ในรายการของเราตั้งแต่ปี 2019'", "เฮเลนกล่าวเสริมถึงภารกิจขององค์กรว่า 'ภารกิจของเราคือการวิเคราะห์ที่เข้มงวดและนำไปใช้ได้จริงสำหรับผู้กำหนดนโยบาย โดยเป็นการวิเคราะห์ที่ตั้งอยู่บนพื้นฐานของเทคโนโลยีและความเข้าใจในประเด็นความมั่นคงของชาติอย่างแท้จริง เราผลิตรายงานฉบับยาวและสรุปย่อให้กับผู้กำหนดนโยบายที่มีงานยุ่ง เรามีทีมข้อมูลขนาดใหญ่ที่ช่วยในการวิจัยและทำสิ่งต่างๆ มากมาย'", "เมื่อถูกถามถึงอิทธิพลของเงินในอุตสาหกรรม AI ที่อาจบดบังงานวิจัยที่จริงใจ เฮเลนยอมรับว่าเป็นข้อกังวลที่สมเหตุสมผล แต่เธอมองว่า 'AI เป็นตัวอย่างที่ดี ในการเลือกตั้งครั้งนี้มีการทุ่มเงินมหาศาลให้กับผู้สมัครและข้อความต่างๆ แต่ปรากฏว่ามันไม่ได้ผลดีนัก เหตุผลที่มันไม่ได้ผลคือ ประการแรก นี่เป็นประเด็นที่ผู้มีสิทธิเลือกตั้งให้ความสำคัญมากขึ้นเรื่อยๆ และประการที่สอง มันเป็นประเด็นที่ค่อนข้างมีความเห็นพ้องต้องกันทั้งสองพรรค (bipartisan) สิ่งที่เราเห็นในงานของเราคือมีความกระหายข้อมูลคุณภาพสูงในหมู่ผู้กำหนดนโยบายอย่างแท้จริง'", "สุดท้าย เฮเลนกล่าวถึงช่องว่างระหว่างรัฐบาลกับอุตสาหกรรมเทคโนโลยีว่า 'แน่นอนว่ามีช่องว่างและเป็นช่องว่างที่ใหญ่ แต่ก็เป็นไปได้ที่จะประเมินช่องว่างนั้นสูงเกินไปจากมุมมองภายนอก เมื่อผู้คนจากอุตสาหกรรมเทคโนโลยีเริ่มพูดคุยกับเจ้าหน้าที่รัฐบาล พวกเขามักจะประหลาดใจว่าเจ้าหน้าที่เหล่านั้นฉลาดและมีความรู้จริงเพียงใด แม้ว่าผู้กำหนดนโยบายระดับสูงจะมีภารกิจรัดตัว แต่พวกเขาก็เริ่มให้ความสำคัญกับการทำความเข้าใจ AI มากขึ้นเรื่อยๆ ในช่วงปี 2023 และปีนี้เราก็เห็นความสนใจที่เพิ่มขึ้นอย่างต่อเนื่อง'"], "link": "https://www.theverge.com/podcast/1032907/helen-toner-openai-cset-ai-safety-policy-interview", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/DCD-Helen-Toner.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.711631919237%2C100%2C78.576736161526&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/24792604/The_Verge_Decoder_Tileart.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "14 พ.ย. 2026 • 22:00 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/podcast/1032907/helen-toner-openai-cset-ai-safety-policy-interview", "guid": "https://www.theverge.com/?p=1032907", "published_ts": 1794668400, "published_at": "2026-11-14T15:00:00Z", "videos": [], "review_score": "", "sub_tag": "PODCAST"}, {"id": 1794670625165, "original_title": "Tesla is inviting some people to buy a Cybercab ‘for personal use’ — but read the fine print", "thai_title": "Tesla เปิดให้ลูกค้าบางกลุ่มสั่งซื้อ Cybercab ไว้ใช้งานส่วนตัว แต่ต้องอ่านเงื่อนไขให้ดีก่อนตัดสินใจ", "tag": "Technology", "bullet_points": ["Tesla เปิดให้ลูกค้ากลุ่มเฉพาะสั่งซื้อ Cybercab ในราคา 29,990 ดอลลาร์ แต่มีค่าธรรมเนียมรายเดือนบังคับ 299 ดอลลาร์", "ผู้ซื้อต้องอาศัยอยู่ในพื้นที่ที่ Tesla ให้บริการ Robotaxi เท่านั้น และห้ามนำรถไปใช้ในเชิงพาณิชย์", "หากยกเลิกการสมัครสมาชิกรายเดือน รถจะกลายเป็นเพียงวัตถุที่ใช้งานไม่ได้ทันที เนื่องจากไม่มีพวงมาลัยหรือแป้นเหยียบสำหรับขับขี่เอง", "ต้นทุนรวมตลอด 5 ปีจะสูงถึงประมาณ 47,600 ดอลลาร์ ซึ่งแพงกว่ารถรุ่น Model 3 หรือ Model Y ที่ใช้งานได้ครอบคลุมกว่า", "สถานะทางกฎหมายของ Cybercab ยังคงมีความไม่แน่นอน เนื่องจากหน่วยงาน NHTSA กำลังตรวจสอบความปลอดภัยของรถที่ไม่มีพวงมาลัยและแป้นเหยียบ"], "full_paragraphs": ["Tesla กำลังเดินหน้าอย่างเต็มตัวตามคำมั่นสัญญาเรื่องอนาคตแห่งการขับเคลื่อนอัตโนมัติ ด้วยการเปิดโอกาสให้ 'ลูกค้าที่ได้รับคัดเลือก' สามารถสั่งซื้อรถยนต์รุ่น Cybercab เพื่อนำไปใช้ 'ส่วนตัว' ได้ อย่างไรก็ตาม รถยนต์สองที่นั่งที่ดูหรูหราและไร้พวงมาลัยรุ่นนี้ จะพร้อมให้บริการเฉพาะใน 'พื้นที่ที่รองรับเท่านั้น' ซึ่งหมายความว่าคุณจะสามารถซื้อได้ก็ต่อเมื่อคุณอาศัยอยู่ในเมืองที่ Tesla เปิดให้บริการ Robotaxi อยู่ในปัจจุบัน", "ราคาของ Cybercab ถูกตั้งไว้ที่ 29,990 ดอลลาร์ พร้อมด้วยค่าธรรมเนียมบังคับ 'Autonomy Subscription' อีกเดือนละ 299 ดอลลาร์ โดยบัญชี Robotaxi ของ Tesla บนแพลตฟอร์ม X ได้ประกาศข้อเสนอดังกล่าวพร้อมภาพหน้าจอของหน้าสั่งซื้อและอีเมลเชิญชวน แต่ทางบริษัทได้เตือนในอีเมลว่า 'ความพร้อมในการให้บริการช่วงแรกมีจำกัด' ดังนั้นอย่าเพิ่งคาดหวังว่าจะเห็น Cybercab ที่เป็นเจ้าของส่วนบุคคลวิ่งอยู่บนท้องถนนทั่วไปในเร็วๆ นี้", "ปัจจุบัน Tesla เริ่มให้บริการรับส่งด้วย Cybercab ในออสตินตั้งแต่เดือนกันยายนที่ผ่านมา โดยเป็นส่วนหนึ่งของบริการ Robotaxi ที่ใช้พื้นฐานจาก Model Y ข้อมูลจาก Robotaxi Tracker ระบุว่าขณะนี้มี Cybercab ให้บริการอยู่ 278 คัน ซึ่งคิดเป็นประมาณ 40 เปอร์เซ็นต์ของกองรถทั้งหมดของบริษัท", "การบังคับให้จ่ายค่าสมาชิกรายเดือน 299 ดอลลาร์ สร้างความไม่พอใจให้กับแฟนคลับบางส่วนที่อาจวาดฝันถึงการขับขี่รถ Tesla ไร้คนขับในราคา 30,000 ดอลลาร์ ตามที่ อีลอน มัสก์ ซีอีโอของ Tesla เคยกล่าวไว้ตอนเปิดตัว Cybercab ในปี 2024 โดยในตอนนั้นมัสก์ไม่ได้กล่าวถึงค่าสมาชิก Autonomy Subscription แต่อย่างใด แม้จะไม่ใช่เรื่องน่าแปลกใจนักเมื่อพิจารณาจากค่าธรรมเนียม 99 ดอลลาร์ต่อเดือนที่ Tesla เรียกเก็บสำหรับฟีเจอร์ Full Self-Driving (FSD) ในปัจจุบัน", "อย่างไรก็ตาม ค่าใช้จ่ายเหล่านี้จะสะสมเพิ่มขึ้นเรื่อยๆ หากคำนวณในช่วงเวลาการเป็นเจ้าของมาตรฐาน 5 ปี ค่าธรรมเนียมบังคับ 299 ดอลลาร์ต่อเดือนจะเพิ่มต้นทุนขึ้นอีก 17,940 ดอลลาร์ ทำให้ราคาพื้นฐานที่แท้จริงอยู่ที่ประมาณ 47,600 ดอลลาร์ ก่อนรวมภาษี ค่าชาร์จไฟ และค่าประกันภัย ซึ่งถือว่าแพงกว่ารถรุ่น Model 3 หรือ Model Y รุ่นใหม่ที่สามารถขับไปได้ทุกที่ทั่วประเทศ", "ต่างจาก Tesla รุ่นปกติที่หากยกเลิก FSD แล้วรถจะกลับมาเป็นโหมดขับเคลื่อนด้วยตนเองได้ แต่การยกเลิกค่าสมาชิก Autonomy Subscription จะทำให้ Cybercab ไม่สามารถใช้งานบนถนนสาธารณะได้เลย เนื่องจากไม่มีระบบควบคุมด้วยมือสำรอง ส่งผลให้รถกลายเป็นเพียงวัตถุที่ใช้งานไม่ได้ นอกจากนี้ Tesla ยังระบุว่าผู้ซื้อจะต้องวางเงินมัดจำ 1,000 ดอลลาร์ที่ไม่สามารถขอคืนได้ เพื่อจองคิวรับรถในช่วงเดือนธันวาคม ซึ่งยังไม่มีการรับประกันว่าจะได้รับรถจริงหรือไม่", "หนึ่งในจุดขายสำคัญของมัสก์ในการนำเสนอ 'We, Robot' ในปี 2024 คือการที่คนทั่วไปสามารถซื้อ Cybercab แล้วนำไปเพิ่มในเครือข่าย Robotaxi ของ Tesla เพื่อสร้างรายได้เสริมในขณะที่หลับหรือทำงาน แต่เงื่อนไขการสั่งซื้อกลับระบุชัดเจนว่าห้ามเจ้าของนำรถไปใช้ในเชิงพาณิชย์ ซึ่งหมายความว่าห้ามนำไปขับ Uber, DoorDash หรือนำไปเข้าร่วมเครือข่าย Robotaxi ของ Tesla เพื่อชดเชยค่าสมาชิก 299 ดอลลาร์ โดย Ashok Elluswamy หัวหน้าฝ่าย AI ของ Tesla เคยกล่าวถึงไตรมาสที่ 2 ของปี 2027 ว่าเป็นเป้าหมายที่เป็นไปได้ในการอนุญาตให้รถของลูกค้าเข้าร่วมเครือข่ายได้ ดังนั้นผู้ซื้อกลุ่มแรกจึงต้องจ่ายเงินเต็มจำนวนโดยไม่มีช่องทางสร้างรายได้จากรถเลย", "ยิ่งไปกว่านั้น Tesla มีสิทธิ์แจ้งเตือนล่วงหน้าเพียง 30 วันก่อนจะปรับขึ้นราคา หากบริษัทมีการอัปเดตกฎระเบียบและคุณยังคงใช้บริการต่อไป ถือว่าคุณยอมรับเงื่อนไขใหม่โดยอัตโนมัติ นอกจากนี้ หากคุณยกเลิกบริการ หรือ Tesla ระงับการเข้าถึงของคุณ คุณจะไม่ได้รับเงินคืนบางส่วนสำหรับช่วงเวลาที่เหลือของเดือนที่คุณจ่ายไปแล้ว", "แน่นอนว่านั่นเป็นเพียงรายละเอียดในสัญญา ในขณะที่บนแพลตฟอร์ม X อีลอน มัสก์ ได้ให้คำมั่นสัญญาว่าจะมีการเปิดตัวในวงกว้างมากขึ้น โดยขึ้นอยู่กับ 'การอนุมัติจากหน่วยงานกำกับดูแล' ซึ่งมัสก์มักจะอ้างถึงเรื่องนี้ว่าเป็นอุปสรรคภายนอกหลักที่ขัดขวางไทม์ไลน์ของ Robotaxi เพื่อเบี่ยงเบนความสนใจจากข้อบกพร่องทางเทคโนโลยีของ Tesla เอง", "สำหรับประเด็นค่าสมาชิก มัสก์ยังกล่าวด้วยว่าค่าบริการ 299 ดอลลาร์ต่อเดือนนั้น 'สูงเกินไป' โดยโต้แย้งว่าควรจะอยู่ที่ 115 ดอลลาร์ หรือใกล้เคียงกับค่าสมาชิก FSD ที่ 99 ดอลลาร์ของ Tesla มากกว่า อย่างไรก็ตาม มัสก์ดูเหมือนจะให้ความสำคัญกับการเยาะเย้ย Marques Brownlee ยูทูบเบอร์ชื่อดังที่เคยสัญญาว่าจะโกนหัวหาก Tesla ส่งมอบ Cybercab ในราคาต่ำกว่า 30,000 ดอลลาร์ก่อนปี 2027 มากกว่าที่จะตอบคำถามเกี่ยวกับความปลอดภัยและความรับผิดชอบที่เกิดขึ้นจากข้อเสนอนี้", "คำถามสำคัญคือ Tesla วางแผนอย่างไรในการขายรถที่ไม่เป็นไปตามมาตรฐานความปลอดภัยของยานยนต์แห่งชาติ (Federal Motor Vehicle Safety Standards) ซึ่งกำหนดให้ต้องมีอุปกรณ์ควบคุมแบบดั้งเดิม เช่น พวงมาลัยและแป้นเหยียบ? Tesla ระบุว่าค่าสมาชิก Autonomy Subscription ครอบคลุมการขับขี่อัตโนมัติ การบำรุงรักษา และการลากจูง แต่ไม่รวมถึงประกันภัยรถยนต์ โดยบริษัทยังไม่ได้อธิบายว่าบริษัทประกันภัยส่วนบุคคลจะรับประกันรถที่ไม่มีคนขับได้อย่างไร หรือความรับผิดชอบจะถูกแบ่งระหว่างเจ้าของและ Tesla อย่างไรหากรถเกิดอุบัติเหตุขณะทำงานอัตโนมัติ อีกทั้ง Tesla ยังไม่ได้เปิดเผยวิธีการคัดเลือกผู้ซื้อที่ได้รับเชิญ หรือจำนวนรถที่จัดสรรไว้สำหรับการขายส่วนบุคคลเมื่อเทียบกับกองรถภายในของบริษัท", "นอกจากนี้ ยังมีประเด็นที่สำนักงานความปลอดภัยการจราจรบนทางหลวงแห่งชาติ (NHTSA) ได้เปิดการตรวจสอบอย่างเป็นทางการเกี่ยวกับวิธีการที่ Tesla รับรองตนเองสำหรับยานพาหนะที่ไม่มีพวงมาลัย แป้นเหยียบ หรือกระจกมองข้าง โดย Tesla ได้ยื่นคำชี้แจงทางกฎหมายต่อ NHTSA ในเดือนตุลาคมและขอให้เก็บข้อมูลทั้งหมดเป็นความลับ ขณะที่ปัจจุบันบริษัทกำลังรับเงินมัดจำจากลูกค้าในขณะที่คำตัดสินของ NHTSA ยังคงค้างคาอยู่ ซึ่งหมายความว่าผู้ซื้อกลุ่มแรกไม่ได้เพียงแค่จ่ายเงิน 47,600 ดอลลาร์สำหรับรถที่ถูกจำกัดพื้นที่และไม่ได้รับอนุญาตให้ขับเองเท่านั้น แต่พวกเขากำลังวางเงินมัดจำที่ไม่สามารถขอคืนได้ให้กับยานพาหนะที่รัฐบาลกลางยังไม่ได้ตัดสินด้วยซ้ำว่าถูกกฎหมายบนท้องถนนหรือไม่"], "link": "https://www.theverge.com/transportation/1033844/tesla-personal-cybercab-orders-299-subscription-fine-print", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/25670862/Robotaxi_89.png?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/HXCrorcbwAAQTq0_569a68.jpeg?quality=90&amp;strip=all&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/HXCr4I4bYAA8lrS.jpeg?quality=90&amp;strip=all&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/HXCr4Iza4AErLOW.jpeg?quality=90&amp;strip=all&amp;w=1200"], "published_th": "14 พ.ย. 2026 • 21:18 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/transportation/1033844/tesla-personal-cybercab-orders-299-subscription-fine-print", "guid": "https://www.theverge.com/?p=1033844", "published_ts": 1794665916, "published_at": "2026-11-14T14:18:36Z", "videos": [], "review_score": "", "sub_tag": "TRANSPORTATION"}, {"id": 1794670625166, "original_title": "This tiny gamepad with dual analog thumbsticks pushes the limits of portable controllers", "thai_title": "รีวิว Atom Plus จอยเกมขนาดจิ๋วที่มาพร้อมอนาล็อกสติ๊กคู่ ท้าทายขีดจำกัดของคอนโทรลเลอร์พกพา", "tag": "Technology", "bullet_points": ["Atom Plus เป็นคอนโทรลเลอร์ขนาดจิ๋วเพียง 3.5 นิ้ว ที่อัดแน่นด้วยฟีเจอร์ครบครัน รวมถึงอนาล็อกสติ๊กคู่แบบป้องกันอาการจอยดริฟต์", "รองรับการใช้งานหลากหลายแพลตฟอร์ม ทั้ง Nintendo Switch, PC, Android, iOS และสมาร์ททีวี", "จุดเด่นอยู่ที่ความสามารถในการปรับแต่งผ่านแอปพลิเคชันมือถือและการเชื่อมต่อผ่าน NFC เพื่อตรวจสอบข้อมูลผลิตภัณฑ์", "ข้อจำกัดหลักคือขนาดที่เล็กเกินไปสำหรับผู้ที่มีมือใหญ่ ทำให้การกดปุ่มบางครั้งอาจเกิดการเบียดกันหรือกดพลาดได้", "ปุ่มทริกเกอร์เป็นแบบดิจิทัลไมโครสวิตช์ ไม่รองรับการเร่งความเร็วแบบอนาล็อกในเกมแข่งรถ"], "full_paragraphs": ["แม้ว่าการออกแบบอันชาญฉลาดของ Joy-Con บน Nintendo Switch จะเป็นที่น่าชื่นชม แต่สำหรับผู้เขียนและครอบครัวแล้ว การใช้งาน Joy-Con เป็นจอยเกมแยกต่างหากนั้นเป็นเรื่องที่น่าอึดอัดใจ ดังนั้นเมื่อต้องเดินทางพร้อมกับเครื่อง Switch 2 พวกเขาจึงมักพกจอยเกมขนาดมาตรฐานไปด้วยอย่างน้อยหนึ่งตัว พร้อมกับจอย 8BitDo Zero 2 อีกสองสามตัวสำหรับเกมที่ไม่จำเป็นต้องใช้อนาล็อกสติ๊ก ผู้เขียนใช้เวลาหลายปีในการตามหาจอยเกมทางเลือกที่มีขนาดเล็กเท่ากับ Zero 2 แต่มีฟังก์ชันการทำงานใกล้เคียงกับจอยขนาดใหญ่ และ CRKD Atom Plus รุ่นใหม่นี้ก็เกือบจะเป็นคำตอบที่สมบูรณ์แบบ แต่หากคุณเป็นคนที่มีมือขนาดใหญ่เหมือนผู้เขียน คุณอาจพบว่าการเน้นความสะดวกในการพกพาของจอยรุ่นนี้เป็นเรื่องที่ท้าทายไม่น้อย", "Atom Plus มีความกว้างประมาณ 3.5 นิ้ว และวางจำหน่ายในราคา 29.99 ดอลลาร์สหรัฐ ซึ่งมีขนาดเล็กกว่า 8BitDo Zero 2 ประมาณครึ่งนิ้ว แต่กลับอัดแน่นด้วยฟีเจอร์และฟังก์ชันการทำงานที่มากกว่าอย่างเห็นได้ชัด สิ่งที่โดดเด่นที่สุดคือการมีอนาล็อกสติ๊กแบบสมมาตรคู่หนึ่งที่ใช้เทคโนโลยี tunneling magnetoresistance เพื่อป้องกันอาการจอยดริฟต์ นอกจากนี้ยังมีปุ่ม Shoulder และปุ่ม Trigger, ระบบสั่น, ปุ่ม Home โดยเฉพาะ, ระบบตรวจจับการเคลื่อนไหว (Motion controls) และความสามารถในการปรับแต่งผ่านแอปพลิเคชันบนมือถือ", "เช่นเดียวกับคอนโทรลเลอร์จากผู้ผลิตรายอื่น Atom Plus สามารถใช้งานได้กับหลายแพลตฟอร์ม รวมถึง Switch และ Switch 2, พีซี, Android, iOS และสมาร์ททีวีต่างๆ การจับคู่กับอุปกรณ์ต่างๆ ต้องอาศัยการตั้งค่าโหมด Bluetooth โดยการกดปุ่มผสมกันในขณะเปิดเครื่อง ซึ่งในกรณีนี้คือการกดปุ่ม Home ร่วมกับทิศทางเฉพาะบน D-pad แม้จะทำได้ง่าย แต่ก็เป็นเรื่องที่จำยาก ผู้เขียนมักจะต้องเปิดคู่มือหรือค้นหาใน Google ว่าต้องกดทิศทางใดเมื่อต้องการสลับอุปกรณ์ ซึ่ง Atom Plus ได้มีการสลักข้อมูลทางเทคนิคไว้ที่ด้านหลังของจอยอยู่แล้ว ดังนั้นผู้เขียนจึงอยากเห็นคำแนะนำในการจับคู่ที่สำคัญเหล่านี้รวมอยู่ด้วยเช่นกัน (ซึ่งควรเป็นมาตรฐานสำหรับจอยเกมทุกรุ่นที่รองรับหลายแพลตฟอร์ม)", "ผู้เขียนทดสอบ Atom Plus กับ Nintendo Switch 2 เป็นหลัก เนื่องจากวางแผนที่จะใช้เป็นอุปกรณ์เสริมสำหรับการเดินทาง อนาล็อกสติ๊กมีขนาดใกล้เคียงกับ Joy-Con ของ Switch รุ่นดั้งเดิม ซึ่งหมายความว่ามันเล็กกว่าของ Switch 2 และแม้ว่าผู้เขียนจะชอบการจัดวางแบบไม่สมมาตรมากกว่า แต่อนาล็อกสติ๊กของ Atom Plus ก็ถือว่าทำได้ดีมาก โดยมีความตึงมากกว่าของ Nintendo เล็กน้อย ซึ่งช่วยให้การเคลื่อนที่แม่นยำขึ้นเมื่อพิจารณาจากระยะการเคลื่อนที่ที่จำกัดของมัน", "แม้คุณภาพการประกอบโดยรวมจะรู้สึกยอดเยี่ยม แต่ขนาดที่เล็กกะทัดรัดของ Atom Plus ก็สร้างข้อจำกัดและความท้าทายบางประการ ปุ่มกดด้านหน้าและ D-pad ให้สัมผัสที่นุ่มนวลดี แต่การจัดวางปุ่มต่างๆ ค่อนข้างเบียดเสียด เมื่อกดปุ่มลงหรือขวาบน D-pad นิ้วหัวแม่มือของผู้เขียนมักจะไปโดนกับอนาล็อกสติ๊กด้านซ้ายโดยไม่ตั้งใจ แม้จะไม่ขัดขวางการเล่นเกม แต่ก็ถือเป็นสิ่งที่น่ารำคาญใจไม่น้อย", "ปุ่ม Shoulder และปุ่ม Trigger ใช้ไมโครสวิตช์แบบดิจิทัล ซึ่งหมายความว่าปุ่ม Trigger ไม่สามารถใช้สำหรับการเร่งความเร็วแบบอนาล็อกในเกมแข่งรถได้ ผู้เขียนชอบที่ปุ่มทั้งสองชุดที่ขอบด้านบนมีความสูงต่างกันเล็กน้อย แต่ก็อยากให้มีความแตกต่างมากกว่านี้อีกนิด เพราะบางครั้งผู้เขียนเผลอกดปุ่ม Trigger ทั้งที่ตั้งใจจะกดปุ่ม Shoulder", "อย่างไรก็ตาม ผู้เขียนรู้สึกประทับใจกับความสามารถในการปรับแต่งของ Atom Plus เมื่อจับคู่กับแอปพลิเคชันบนมือถือ คุณสามารถตรวจสอบระดับแบตเตอรี่ที่เหลืออยู่, ปิดระบบสั่น, ดูหมายเลขผลิตภัณฑ์เฉพาะ (โดยการแตะโทรศัพท์กับชิป NFC ภายในจอย) และตั้งค่าปุ่มใหม่ได้ทั้งหมด ซึ่งรวมถึงคันโยกทางลัดแบบสองฟังก์ชันที่ทำหน้าที่แทนปุ่ม Plus และ Minus ของ Switch รวมถึงทางลัดสำ ง ทำให้การหาผู้สืบทอดตำแหน่งเป็นเรื่องยากลำบาก", "แม้จะไม่มีแผนการสืบทอดตำแหน่งที่ชัดเจน แต่ผู้เชี่ยวชาญเชื่อว่า Nvidia ยังคงมีความแข็งแกร่งด้านเทคโนโลยีและแผนงานผลิตภัณฑ์ที่วางไว้จนถึงปี 2027", "การจากไปของหวงถือเป็นการสิ้นสุดยุคสมัยของ 'ผู้ก่อตั้งที่เป็นนักแสดงโชว์' (Showman Founder) ในวงการเทคโนโลยีระดับโลก"], "full_paragraphs": ["เมื่อวันที่ 6 มกราคม 2025 เจนเซน หวง ซีอีโอของ Nvidia ได้รับช่วงเวลาแห่งการเป็นร็อกสตาร์อย่างแท้จริง เขาเดินขึ้นเวทีอย่างผู้ชนะด้วยการชูมือขึ้นท่ามกลางเสียงปรบมือและเสียงเชียร์จากผู้คนกว่า 14,000 คนในอารีน่าที่เต็มไปด้วยเหล่าอินฟลูเอนเซอร์และแฟนคลับ ใบหน้าของพวกเขาอาบไปด้วยแสงสีฟ้าขณะที่เขาก้าวเข้ามาในชุดแจ็กเก็ตหนังสีดำที่สะท้อนแสงไฟในสนาม", "แต่ในปัจจุบัน แทบไม่มีใครส่งเสียงเชียร์เจนเซน หวง อีกต่อไป เขาได้ออกจาก Nvidia แล้วหลังจากดูเหมือนว่าจะมีส่วนเกี่ยวข้องกับเรื่องอื้อฉาวในการลักลอบส่งออกชิปถึงสองครั้ง และมีข่าวลือเรื่องการนอกใจภรรยาถึงสามครั้ง รวมถึงความสัมพันธ์กับบุคคลที่ถูกกล่าวหาว่าเป็นสายลับจีน ในช่วงเวลาเดียวกับที่เขากำลังคลุกคลีอยู่กับประธานาธิบดี โดนัลด์ ทรัมป์", "ทั่วโลกกำลังจับตามองว่าเรื่องอื้อฉาวนี้จะส่งผลกระทบต่ออุตสาหกรรม AI ของสหรัฐฯ ทั้งระบบและอาจทำให้ตลาดหุ้นสั่นคลอนตามไปด้วยหรือไม่ นั่นเป็นเพราะหวงไม่ได้เพียงแค่บริหารบริษัทที่มีมูลค่า 5 ล้านล้านดอลลาร์แห่งแรกเท่านั้น แต่เขายังเป็นผู้นำที่มีวิสัยทัศน์ในการควบคุม GPU ที่จำเป็นอย่างยิ่งต่อการขับเคลื่อนการเติบโตของ AI ทั่วโลก ซึ่งเป็นส่วนหนึ่งของบริษัทที่มีสัดส่วนถึงประมาณ 6 เปอร์เซ็นต์ของดัชนีตลาดหุ้น S&P 500 ทั้งหมด และเขาก็ไม่ได้วางแผนการสืบทอดตำแหน่งไว้เลยหากเขาต้องก้าวลงจากตำแหน่ง", "ชายวัย 63 ปีผู้นี้เคยกล่าวว่าเขาอยากจะตายในหน้าที่ เขาเคยเสนอว่าเขาจะทำงานจนถึงอายุ 90 หรือ 100 ปี แล้วค่อยดำเนินกิจการบริษัทต่อไปในฐานะหุ่นยนต์", "การหาคนมาแทนที่หวงไม่ใช่เรื่องง่าย ส่วนหนึ่งเป็นเพราะเขาไม่มีรองประธานหรือผู้ช่วยที่ชัดเจน มีพนักงานประมาณ 60 คนที่รายงานตรงต่อซีอีโอ ทอม เมนเนลลี นักวิเคราะห์จาก IDC และอดีตนักข่าวสายคอมพิวเตอร์กล่าวว่า 'เขาสร้างบริษัทขึ้นมาโดยมีตัวเขาเป็นศูนย์กลาง และทุกสิ่งที่เกิดขึ้นในนั้นล้วนผ่านตัวเขา'", "จอน เพดดี นักวิเคราะห์อุตสาหกรรมคอมพิวเตอร์ที่ติดตาม Nvidia มาตั้งแต่ก่อตั้งกล่าวกับผมว่า 'เจนเซนคือ Nvidia และ Nvidia คือเจนเซน'", "แต่ Nvidia ไม่ใช่เจนเซนอีกต่อไปแล้ว เขาได้ทิ้งบริษัทที่เขาร่วมก่อตั้งมาเมื่อ 33 ปีก่อน นี่คือการสิ้นสุดของยุคสมัย และไม่ใช่แค่สำหรับ Nvidia เท่านั้น เพราะเจนเซน หวง คือตัวอย่างสุดท้ายที่แท้จริงของซีอีโอผู้ก่อตั้งที่เป็นนักแสดงโชว์ (Showman) ในวงการเทคโนโลยีขนาดใหญ่", "แพท มัวร์เฮด หัวหน้านักวิเคราะห์จาก Moor Insights & Strategy กล่าวกับผมว่า 'เขาเป็นทั้งผู้มีวิสัยทัศน์และผู้นำเชิงยุทธศาสตร์ ซึ่งใกล้เคียงที่สุดกับสิ่งที่วงการเทคโนโลยีเคยมีอย่าง สตีฟ จอบส์'", "ในขณะที่ อีลอน มัสก์ ไม่ได้เป็นผู้ก่อตั้ง Tesla โดยตรงและมีประวัติการผิดสัญญามากมาย ส่วน มาร์ก ซักเคอร์เบิร์ก แห่ง Meta ก็ยังไม่ได้พิสูจน์ว่าเป็นทั้งผู้มีวิสัยทัศน์หรือนักแสดงโชว์ ส่วน แลร์รี เพจ และ เซอร์เกย์ บริน แห่ง Google ก็ก้าวลงจากตำแหน่งในปี 2019 ทิ้งให้บริษัทอยู่ในมือของ ซุนดาร์ พิชัย และทั้ง Microsoft และ Apple ต่างก็เปลี่ยนผ่านผู้นำมาแล้วสองครั้งนับตั้งแต่ยุคของ บิล เกตส์ และ สตีฟ จอบส์", "แม้บางคนจะบอกว่า สตีฟ จอบส์ แห่ง Apple ได้ทำลายแม่พิมพ์ของซีอีโอแบบเดิมๆ แต่เขาก็สร้างแม่พิมพ์ของตัวเองขึ้นมา หวงเป็นหนึ่งในผู้นำเทคโนโลยีจำนวนนับไม่ถ้วนที่เดินตามรอยเขาด้วยการเปิดตัวผลิตภัณฑ์ในงานคีย์โน้ต การสวมใส่เสื้อผ้าที่เป็นเอกลักษณ์เพียงชิ้นเดียวเหมือนเสื้อคอเต่าสีดำของจอบส์ และบางครั้งก็แกล้งพูดว่า 'มีอีกหนึ่งเรื่อง' (one more thing) เพื่อสร้างความประหลาดใจในตอนท้ายของการนำเสนอ ในห้องข่าว เรามักจะล้อเลียนพวกที่พยายามเลียนแบบจอบส์ ซึ่งหลายคนเป็นเพียงนักธุรกิจในชุดสูทที่ไม่มีความน่าเชื่อถือพอที่จะทำแบบนั้นได้", "ผมเคยคิดว่าหวงอาจเป็นพวกเลียนแบบจอบส์เช่นกัน ในครั้งแรกที่ผมเห็นว่าเขาใช้แจ็กเก็ตสีดำเป็นเครื่องแบบ (ซึ่งไม่ใช่แจ็กเก็ตหนังเสมอไป รุ่นก่อนหน้านี้เป็นเสื้อซอฟต์เชลล์ที่มีโลโก้ Nvidia) ต่อมาหวงยืนกรานที่จะสวมแจ็กเก็ตแม้ในวันที่อากาศร้อน ผมเคยเห็นเขาเหงื่อออกท่วมตัวมากกว่าหนึ่งครั้งแทนที่จะถอดมันออก ไม่เหมือนกับจอบส์ เขายังจัดงานคีย์โน้ตหลายครั้งโดยไม่มีข่าวสารอะไรใหม่ๆ มานำเสนอ เขาชอบที่จะย้ำถึงความสำเร็จเดิมๆ ของบริษัทราวกับว่าเป็นเรื่องใหม่เอี่ยม", "แต่ถึงแม้หวงจะไม่มีความสง่างามเท่าจอบส์ เขาก็มีเทคโนโลยีที่น่าตื่นเต้นซ่อนอยู่และชอบที่จะสาธิตบนเวที เขารู้วิธีทำให้ผู้คนตื่นเต้นกับอนาคตของการประมวลผลเชิงภาพด้วยกราฟิกเกมที่น่าทึ่ง การสาธิตฟิสิกส์และแสงสี และในที่สุดก็รวมถึงการจดจำภาพ การจำลองสภาพอากาศด้วย AI แบบจำลองดิจิทัลของโรงงานในโลกแห่งความเป็นจริง และหุ่นยนต์ที่สามารถฝึกฝนในโลกเสมือนจริงเหล่านั้นได้", "Nvidia ของเขาพยายามให้ความรู้แก่ผู้คนเกี่ยวกับวิธีการและเหตุผลของ GPU ด้วย ผมยังจำได้ในปี 2008 เมื่อ Nvidia เชิญทีม Mythbusters มาสาธิตความแตกต่างระหว่างการประมวลผลแบบอนุกรมและการประมวลผลแบบขนาน โดยใช้ปืนเพนท์บอล 1,100 หัวฉีดเพื่อ 'วาด' ภาพโมนาลิซ่าในการยิงเพียงครั้งเดียว", "สิ่งที่ผมไม่รู้ในตอนนั้นคือ หวงเป็นผู้ก่อตั้งที่มีวิสัยทัศน์ เขาพา Nvidia ไปสู่ชื่อเสียงและความมั่งคั่งผ่านการเดิมพันครั้งใหญ่หลายครั้ง ในปี 1996 สามปีหลังจากที่เขาร่วมก่อตั้งบริษัทที่ร้านอาหาร Denny's Nvidia เกือบจะล้มละลายขณะทำงานกับชิปกราฟิกที่ล้มเหลวสำหรับเครื่องเกม Sega Dreamcast แต่ถึงแม้เขาจะส่งมอบชิปนั้นไม่ได้ หวงก็โน้มน้าวให้ Sega ลงทุน 5 ล้านดอลลาร์หลังจากนั้น ตามรายงานของ The Wall Street Journal ในปี 2024", "จากนั้นเขาก็หันกลับมาเดิมพันบริษัทอีกครั้งกับ Riva 128 ซึ่งเป็นตัวเร่งกราฟิกสำหรับ PC ซึ่งเป็นความพยายามที่ทะเยอทะยานมากจนเขาต้องเลิกจ้างพนักงานกว่าครึ่งหนึ่งจากทั้งหมดประมาณ 100 คน ข้ามขั้นตอนการทำต้นแบบ และเร่งผลิตทันที และเขายังเหลือเงินจ่ายเงินเดือนเพียงหนึ่งเดือนเท่านั้นในตอนที่มันวางจำหน่าย ตามที่ The New Yorker เขียนไว้ในปี 2023 โชคดีที่มันประสบความสำเร็จ โดยขายได้หนึ่งล้านเครื่องในเวลาเพียงสี่เดือน และปูทางไปสู่ GeForce GPU และความสัมพันธ์ระยะยาวกับผู้ผลิตชิปอย่าง TSMC", "ประมาณแปดปีต่อมา หวงตัดสินใจว่าการเป็นผู้นำด้านกราฟิกเกม PC เพียงอย่างเดียวไม่เพียงพอ เขาเดิมพันผลกำไรขั้นต้นทั้งหมดของบริษัท ตามที่เขาบอกกับพอดแคสเตอร์ เล็กซ์ ฟรีดแมน ในการส่งมอบฟีเจอร์ใหม่ภายในกราฟิกการ์ดเหล่านั้นที่ไม่มีใครต้องการ นั่นคือ CUDA มันคือความสามารถในการใช้ GPU สำหรับงานประมวลผลประเภทอื่นนอกเหนือจากกราฟิก และหวงกล่าวว่ามันเพิ่มต้นทุนของกราฟิกการ์ด GeForce ทุกตัวขึ้น 50 เปอร์เซ็นต์", "'เดิมทีไม่มีตลาดหรือความต้องการของตลาดสำหรับมัน ราวกับว่าพวกเขาทำมันขึ้นมาเพราะพวกเขาสามารถทำได้' เพดดีกล่าว 'เจนเซนมีวิสัยทัศน์ว่ามันจะเป็นอะไรได้บ้าง และมีความกล้าหาญที่จะไล่ตามมันแม้จะมีความเห็นต่างจากคนอื่น'", "'NVIDIA กำลังลงทุนในแพลตฟอร์มการประมวลผลที่ขยายไปไกลกว่ากราฟิก โดยไม่มีการรับประกันผลตอบแทนในระยะสั้น' เดฟ อัลทาวิลลา นักวิเคราะห์จาก HotTech กล่าว", "'หวงมองเห็นว่า GPU แท้จริงแล้วคือคอมพิวเตอร์แบบขนานที่บังเอิญแสดงผลกราฟิกได้ CUDA เปลี่ยนข้อมูลเชิงลึกนั้นให้กลายเป็นแพลตฟอร์ม และนั่นคือเหตุผลที่ NVIDIA พร้อมเมื่อ AI มาถึง' เมนเนลลีบอกกับผม", "มันเป็นช่วงเวลาที่เลวร้ายสำหรับกราฟิกการ์ดที่จะมีราคาแพงขึ้นกะทันหัน เมื่อเกิดภาวะเศรษฐกิจถดถอยครั้งใหญ่ในปี 2007–2009 และชิปกราฟิกแล็ปท็อปของ Nvidia เริ่มล้มเหลวเนื่องจากข้อบกพร่องในการออกแบบ บริษัทสูญเสียมูลค่าตลาดไปถึง 80 เปอร์เซ็นต์", "แต่หวงเชื่อมั่นใน CUDA มากพอที่จะลงทุนเพิ่มขึ้น 'เขาแจก GPU ระดับไฮเอนด์ของ NVIDIA ให้กับนักวิจัยตามงานประชุมอุตสาหกรรม ในขณะที่บริษัทสนับสนุนฮาร์ดแวร์ให้กับมหาวิทยาลัยอย่าง Stanford เพื่อส่งเสริมการพัฒนาบนแพลตฟอร์มของตน' อัลทาวิลลากล่าว และภายในปี 2012 ศักยภาพของ Nvidia สำหรับ AI ก็เริ่มปรากฏชัด", "นั่นคือตอนที่นักวิจัยจากมหาวิทยาลัยโตรอนโตใช้ GPU ของ Nvidia เพื่อฝึกโครงข่ายประสาทเทียมสำหรับการจดจำภาพที่ได้รับรางวัลชื่อ AlexNet ซึ่งได้รับการยกย่องอย่างกว้างขวางว่าเป็นจุดเริ่มต้นของการปฏิวัติ AI", "วิสัยทัศน์ของหวงไม่ได้เป็นไปตามที่เขาคาดหวังต่อสาธารณะเสมอไป การสาธิต AlexNet นั้นนำไปสู่การเดิมพันของหวงในเรื่องชิปสำหรับรถยนต์ไร้คนขับโดยตรง เขากล่าว แต่เขาไม่ได้ทำนายเรื่อง AI อย่างแม่นยำนัก CUDA ถูกมองว่าเป็นซูเปอร์คอมพิวเตอร์ที่ดีกว่าและราคาไม่แพงสำหรับนักวิจัยและนักวิทยาศาสตร์ ในปี 2013 ผมยังเขียนเกี่ยวกับแผนการใหญ่ของเขาสำหรับอนาคตของบริษัทที่พึ่งพาการใส่ชิป Nvidia ลงในโทรศัพท์ของคุณ ซึ่งมันไม่ประสบความสำเร็จ", "แต่การเดิมพันในชิปโทรศัพท์ที่ใช้ ARM นั้นทำให้ Nvidia เข้าไปอยู่ใน Nintendo Switch ทุกเครื่อง และอาจช่วยให้เกิด 'AI ซูเปอร์ชิป' ในอนาคตได้ ชิปเซิร์ฟเวอร์ AI รุ่นล่าสุดของ Nvidia มีคอร์ CPU แบบ ARM และในปี 2022 ผู้นำของการปฏิวัติ AI ได้เปิดตัวเทคโนโลยี AI ที่ล้ำสมัยที่สุดบนฮาร์ดแวร์ของ Nvidia นั่นคือ ChatGPT หกปีก่อนหน้านั้น หวงได้ส่งมอบเวิร์กสเตชัน AI ที่สร้างขึ้นโดยเฉพาะเครื่องแรกของ Nvidia ให้กับ OpenAI ด้วยมือของเขาเอง และภายในปี 2022 Microsoft ได้เชื่อมต่อ GPU A100 ของ Nvidia หลายหมื่นตัวเพื่อรองรับภาระงาน", "'ทุกครั้งที่คู่แข่งเข้าใกล้ เขาจะยกระดับการต่อสู้ขึ้นไปอีกขั้น: ชิป, จากนั้นเซิร์ฟเวอร์, จากนั้นระบบเครือข่ายด้วยข้อตกลง Mellanox มูลค่า 6.9 พันล้านดอลลาร์, จากนั้นคือแร็คเต็มรูปแบบ ทั้งหมดเชื่อมโยงกันด้วย CUDA' มัวร์เฮดกล่าว 'ความเร็วมาจากวิธีการที่เขาบริหารบริษัท' เขากล่าวเสริม 'การตัดสินใจที่บริษัทอื่นใช้เวลาสี่สัปดาห์ Nvidia ใช้เวลาเพียงสี่วัน'", "ในขณะที่โชคชะตาและผลกำไรของ Nvidia พุ่งสูงขึ้น — กำไรสุทธิหลายพันดอลลาร์ในทุกๆ วินาที! — และเมื่อชัดเจนขึ้นว่า AI จะเปลี่ยนโฉมโลกในทางใดทางหนึ่ง สิ่งแปลกประหลาดก็เกิดขึ้น หวงกลายเป็นคนดัง ในช่วงฤดูร้อนปี 2024 The Wall Street Journal และโซเชียลมีเดียรายงานว่าเขาได้รับการต้อนรับอย่างวีรบุรุษในไต้หวันบ้านเกิดของเขา เขาหยุดแจกลายเซ็นครั้งแล้วครั้งเล่า รวมถึงบนหน้าอกของผู้หญิงคนหนึ่ง", "ในงานนำเสนอและช่วงถาม-ตอบของนักลงทุนของบริษัท ผมเห็นโทนเสียงเปลี่ยนไป ผู้คนเริ่มปฏิบัติต่อชายในชุดแจ็กเก็ตหนังเหมือนร็อกสตาร์จริงๆ แทนที่จะเป็นร็อกสตาร์เลียนแบบ โดยขอถ่ายรูปและขอลายเซ็นและกล่าวชมเชยเขาแทนที่จะถามคำถามที่ยากๆ", "รู้สึกเหมือนว่าเขาได้บรรลุ 'สนามบิดเบือนความเป็นจริง' (reality distortion field) อันโด่งดังของ สตีฟ จอบส์ ในที่สุด — จนกระทั่งเขาทำให้ฟองสบู่แตกด้วยการนอกใจของเขาเอง", "แต่การมีสนามบิดเบือนความเป็นจริงน้อยลงในโลกนี้ก็ไม่ใช่เรื่องเลวร้ายเสมอไป และอย่างที่ Apple แสดงให้เห็น บริษัทไม่ได้ล้มละลายเพียงเพราะผู้ก่อตั้งที่มีเสน่ห์จากไป ทิม คุก ทำให้ Apple เป็นบริษัทที่ทำกำไรได้มากที่สุดในโลก คำถามตอนนี้คือ: ใครจะมาแทนที่ Nvidia?", "'เขาคือราชา' เพดดีกล่าว 'อย่าเข้าใจผิด มันคือบริษัทของ เจนเซน หวง เขาเป็นคนตัดสินใจทุกอย่าง รับความรุ่งโรจน์ทั้งหมด และแบกรับความผิดทั้งหมดไว้คนเดียว'", "แม้จะไม่มีผู้สืบทอดตำแหน่งที่ระบุชื่อไว้ แต่นักวิเคราะห์ไม่คิดว่า Nvidia กำลังประสบปัญหาใหญ่ในขณะนี้", "'นี่คือความตกใจของหุ้น ไม่ใช่ความตกใจของธุรกิจ ในปีหน้า แผนงานและการผลิตถูกล็อกไว้จนถึงปี 2027' แพท มัวร์เฮด จาก Moor Insights & Strategy กล่าว 'คำถามคือ Nvidia จะยังคงสร้างสรรค์นวัตกรรมในจังหวะของเจนเซนได้หรือไม่เมื่อแผนเหล่านั้นหมดลง ความเสี่ยงที่ใหญ่กว่าชิปคู่แข่งใดๆ คือลูกค้าที่ลังเลในช่วงสุญญากาศ นั่นคือเหตุผลที่ซีอีโอคนต่อไปต้องการความน่าเชื่อถือทางเทคนิค รูปแบบการดำเนินงานที่ไม่ขึ้นอยู่กับคนคนเดียว และแผนในการปกป้อง CUDA'", "'การสูญเสียผู้ก่อตั้งที่มีวิสัยทัศน์ ผู้กำหนดวัฒนธรรม ผู้นำ โฆษกอุตสาหกรรม AI ฯลฯ คือการสูญเสียที่แท้จริง เราไม่คิดว่าจะมีอะไรเปลี่ยนแปลงในเชิงกลยุทธ์' เบน บาจาริน นักวิเคราะห์จาก Creative Strategies กล่าว 'แผนงานผลิตภัณฑ์ถูกกำหนดไว้และยังคงแข็งแกร่ง และหลายรุ่นถัดไปอยู่ระหว่างการออกแบบ การผลิต หรือการสั่งซื้อแล้ว NVIDIA ยังคงเป็นบริษัทที่มีตำแหน่งดีที่สุดในการส่งมอบแผนงานในระดับสเกล เพราะใช้เวลาหลายปีในการล็อกห่วงโซ่อุปทานไว้เบื้องหลัง ตั้งแต่เวเฟอร์ระดับแนวหน้าและบรรจุภัณฑ์ระดับ CoWoS ไปจนถึง HBM และพันธมิตรระดับแร็ค ตำแหน่งอุปทานนั้นไม่ได้เดินออกจากประตูไปพร้อมกับคนคนเดียว'", "'เขาเป็นนักแสดงโชว์ นักขาย และผู้มีวิสัยทัศน์ที่สมบูรณ์แบบสำหรับ NVIDIA ดังนั้นเขาจึงยากที่จะหาใครมาแทนที่' ทอม เมนเนลลี นักวิเคราะห์จาก IDC กล่าว 'แต่แผนงานเทคโนโลยีของบริษัทนั้นมั่นคง และทีมงานที่อยู่เบื้องหลังเขายังคงอยู่ที่นั่น การเลือกคนที่เหมาะสมมาแทนที่เขาจะเป็นกุญแจสำคัญ และจะมีอุปสรรคระหว่างทางอย่างไม่ต้องสงสัย แต่บริษัทจะอยู่รอด'", "'เจนเซนสร้างองค์กรที่มีความสามารถเป็นพิเศษด้วยทีมวิศวกรที่ลึกซึ้ง ระบบนิเวศซอฟต์แวร์ที่เติบโตเต็มที่และมีทรัพยากรมาก และความสัมพันธ์กับลูกค้าที่แข็งแกร่ง' เดฟ อัลทาวิลลา จาก HotTech Vision and Analysis กล่าว 'การจากไปของเขาทิ้งช่องว่างด้านความเป็นผู้นำและวิสัยทัศน์เชิงกลยุทธ์ไว้อย่างไม่ต้องสงสัย แต่เทคโนโลยี ความสามารถ และความสามารถในการดำเนินการที่เขาช่วยสร้างขึ้นนั้นไม่ได้หายไปไหน คำถามที่แท้จริงคือผู้สืบทอดของเขาสามารถรักษาความมุ่งมั่นในวิสัยทัศน์ระยะยาวและความเต็มใจที่จะลงทุนก่อนตลาดได้หรือไม่'", "'ไม่มีใครในบริษัทอยากจะก้าวเข้ามาแทนที่เขาจริงๆ ดังนั้นจะต้องหาคนนอกเข้ามา' จอน เพดดี จาก Jon Peddie Research กล่าว 'ใครก็ตามที่เป็นคนนั้นจะไม่ใช่เจนเซน จะไม่มีความทะเยอทะยานแบบเดียวกัน ไม่มีการติดต่อและความสัมพันธ์แบบเดียวกัน ไม่มีวิสัยทัศน์แบบเดียวกัน หรือความกล้าหาญที่จะเดิมพันครั้งใหญ่ในระยะยาว เราเคยเห็นสิ่งนี้ใน Apple, AMD, Intel และบร ากเว็บไซต์ของผู้ค้าปลีกรายอื่นเพื่อสร้างดัชนีสินค้าที่ครอบคลุมที่สุด", "บริษัทชี้แจงว่าเอกสารดังกล่าวเป็นเพียงแนวคิดเบื้องต้นและอาจไม่สะท้อนถึงแผนการดำเนินงานจริงในปัจจุบัน"], "full_paragraphs": ["การรวบรวมรายละเอียดของสินค้าทุกชิ้นที่วางจำหน่ายในทุกที่ มีจุดมุ่งหมายเพื่อทำให้ Amazon กลายเป็นเครื่องมือที่มีประโยชน์มากกว่า Reddit สำหรับผู้ใช้งานทั่วไปและตัวแทนปัญญาประดิษฐ์ (AI agents)", "รายงานจากสำนักข่าวรอยเตอร์ระบุว่า Amazon มีแผนที่จะสร้างคลังข้อมูลขนาดใหญ่ที่รวบรวมรายละเอียดของสินค้าทุกชนิดที่วางจำหน่ายบนอินเทอร์เน็ต แม้กระทั่งสินค้าที่ Amazon ไม่ได้วางจำหน่ายเอง โดยจะนำข้อมูลเหล่านี้มาแสดงผลผ่านเว็บไซต์ของตนเอง", "โครงการดังกล่าวมีชื่อว่า 'World Product Graph' ซึ่งถูกออกแบบมาเพื่อลดโอกาสที่นักช้อปจะออกจากแพลตฟอร์ม Amazon ไปค้นหาข้อมูลสินค้าบน Reddit หรือ Google และเพิ่มโอกาสที่ผู้ใช้งานจะจบการซื้อขายที่ Amazon แม้ว่าพวกเขาจะกำลังค้นหาสินค้าที่วางจำหน่ายในที่อื่นก็ตาม", "ในทำนองเดียวกัน สำหรับตัวแทน AI หาก Amazon มีคลังข้อมูลการช้อปปิ้งที่ใหญ่ที่สุด ตัวแทน AI เหล่านั้นอาจเลือกใช้ดัชนีสินค้าของ Amazon มากกว่าแหล่งข้อมูลอื่น ส่งผลให้ผู้ที่ช้อปปิ้งผ่านบอทก็จะเข้ามาใช้งานบนหน้าเว็บไซต์ของ Amazon ในที่สุด", "ปัจจุบัน ลิงก์ที่เชื่อมต่อไปยังสินค้าของผู้ค้าปลีกภายนอกเริ่มปรากฏบน Amazon แล้วผ่านฟีเจอร์ 'shop direct' ที่เปิดตัวไปเมื่อปีที่ผ่านมา นอกจากนี้ บริษัทยังมีผู้ช่วยช้อปปิ้ง AI ของตนเองที่ชื่อว่า Alexa for Shopping หรือที่รู้จักกันก่อนหน้านี้ในชื่อ Rufus", "โครงการ World Product Graph ยังมีเป้าหมายเพื่อแก้ไขปัญหาที่เกิดขึ้นกับระบบ AI โดยการจัดหาข้อมูลที่มากขึ้นให้กับระบบ ตามรายงานของรอยเตอร์ เอกสารภายในของ Amazon เกี่ยวกับโครงการนี้ระบุว่า 'คำตอบหลายอย่างของ Rufus นั้นผิดพลาดในเชิงข้อเท็จจริงหรือไม่สมบูรณ์' อีกทั้งการประมวลผลการค้นหาของลูกค้าบน Amazon ด้วย AI ยังมีค่าใช้จ่ายที่สูง", "การเพิ่มข้อมูลเข้าไปในระบบคาดว่าจะช่วยให้ระบบมีความแม่นยำมากขึ้น และสามารถใช้งานโมเดลที่มีต้นทุนต่ำลงได้", "อย่างไรก็ตาม ความเป็นไปได้ที่โครงการนี้จะเกิดขึ้นจริงยังคงมีความไม่แน่นอน เอกสารภายในระบุว่าโครงการนี้ 'ขึ้นอยู่กับการค้นพบวิธีการที่แบรนด์ต่างๆ จัดระเบียบสินค้าบนเว็บไซต์ของตนเอง' ซึ่งอาจเกี่ยวข้องกับการที่ Amazon ต้องเข้าไป Crawl ข้อมูลจากเว็บไซต์ของผู้ค้าปลีกรายอื่น", "รอยเตอร์กล่าวว่ายังไม่มีความชัดเจนว่า 'แผนนี้จะถูกนำมาใช้เมื่อใดหรืออย่างไร' แต่ในเอกสารดังกล่าวได้ระบุวันเปิดตัวโครงการไว้ในวันที่ 1 ตุลาคม 2027", "ทางด้าน Amazon ได้ออกแถลงการณ์ต่อรอยเตอร์ว่า 'เอกสารร่างที่ล้าสมัยมักจะให้ภาพที่ไม่สมบูรณ์ และการมีอยู่ของเอกสารระดมความคิดเช่นนี้ ไม่ได้สะท้อนถึงแผนการดำเนินงานในปัจจุบันของเราเสมอไป'"], "link": "https://www.theverge.com/tech/1033697/amazon-world-product-graph-ai-search", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/09/acastro_STK103__03.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/10/STEVIE_BONIFIELD_BLURPLE.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "14 พ.ย. 2026 • 06:49 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/tech/1033697/amazon-world-product-graph-ai-search", "guid": "https://www.theverge.com/?p=1033697", "published_ts": 1794613751, "published_at": "2026-11-13T23:49:11Z", "videos": [], "review_score": "", "sub_tag": "TECH"}, {"id": 1794606565579, "original_title": "ChatGPT Wallet lets OpenAI’s Dots agents make purchases for you", "thai_title": "ChatGPT Wallet เปิดทางให้ AI Agent ของ OpenAI ทำรายการซื้อสินค้าแทนคุณได้อย่างปลอดภัย", "tag": "Technology", "bullet_points": ["OpenAI เปิดตัว ChatGPT Wallet ที่ช่วยให้ AI Agent หรือที่เรียกว่า Dots สามารถทำรายการซื้อสินค้าแทนผู้ใช้งานได้", "ระบบความปลอดภัยเน้นการยืนยันตัวตนด้วยไบโอเมตริกซ์ เช่น Face ID หรือการสแกนลายนิ้วมือทุกครั้งก่อนชำระเงิน", "ข้อมูลบัตรเครดิตจริงจะไม่ถูกเปิดเผยต่อ AI Agent หรือร้านค้า โดยใช้ระบบโทเคนแทนการชำระเงินแบบเดียวกับ Apple Pay หรือ Google Wallet", "ในอนาคต OpenAI วางแผนให้ผู้ใช้สามารถตั้งค่าขอบเขตการซื้อล่วงหน้า เช่น วงเงิน หรือหมวดหมู่สินค้า เพื่อให้ AI ดำเนินการได้โดยอัตโนมัติ", "การใช้งานจริงอาจมีข้อจำ .13.31-PM.png?quality=90&amp;strip=all&amp;crop=0%2C3.3036486111791%2C100%2C93.392702777642&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/11/Verge-Deals-PlayStation-5.png?quality=90&amp;strip=all&amp;crop=16.666666666667%2C0%2C66.666666666667%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/chorus/uploads/chorus_asset/file/11515155/acastro_180604_1777_xbox_0001.jpg?quality=90&amp;strip=all&amp;crop=16.666666666667%2C0%2C66.666666666667%2C100&amp;w=1200"], "published_th": "14 พ.ย. 2026 • 02:14 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/gadgets/1033046/playstation-xbox-gift-card-gta-vi-6-preorder-deal-sale", "guid": "https://www.theverge.com/?p=1033046", "published_ts": 1794597278, "published_at": "2026-11-13T19:14:38Z", "videos": [], "review_score": "", "sub_tag": "GADGETS"}, {"id": 1794606565582, "original_title": "You can adjust the position of the trackball on Keychron’s new wireless mouse", "thai_title": "Keychron เปิดตัวเมาส์ไร้สายรุ่นใหม่ T1 HE ปรับตำแหน่งแทร็กบอลให้เข้ากับนิ้วโป้งได้", "tag": "Technology", "bullet_points": ["Keychron เปิดตัว T1 HE เมาส์แทร็กบอลรุ่นใหม่ที่มาพร้อมนวัตกรรมปรับตำแหน่งลูกบอลได้", "ผู้ใช้สามารถปรับตำแหน่งแทร็กบอลในแนวตั้งและแนวนอนผ่านปุ่มหมุนใต้ตัวเมาส์ เพื่อให้เข้ากับสรีระนิ้วโป้งของแต่ละบุคคล", "ตัวเมาส์มาพร้อมเซนเซอร์ออปติคัลที่ปรับความละเอียดได้สูงสุด 2,400 DPI", "รองรับการเชื่อมต่อทั้งแบบไร้สาย 2.4GHz, Bluetooth และการเชื่อมต่อผ่านสาย USB-C", "เปิดให้สั่งจองล่วงหน้าแล้วในราคา 59.99 ดอลลาร์สหรัฐ โดยมีกำหนดจัดส่งในช่วงต้นเดือนธันวาคม"], "full_paragraphs": ["Keychron ได้เปิดตัว T1 HE เมาส์แทร็กบอลรุ่นใหม่ล่าสุดที่มาพร้อมกับฟีเจอร์เด่นในการปรับแต่งตำแหน่งของแทร็กบอลให้เหมาะสมกับสรีระนิ้วโป้งของผู้ใช้งานแต่ละคนได้อย่างแม่นยำ โดยมีปุ่มหมุนสองตำแหน่งที่อยู่ใต้ตัวเมาส์ทำหน้าที่ในการปรับจูนตำแหน่งดังกล่าว", "ย้อนกลับไปก่อนหน้านี้ Keychron เคยเปิดตัว Nape Pro ซึ่งเป็นอุปกรณ์แทร็กบอลชิ้นแรกของบริษัทในงาน CES 2026 โดยเน้นดีไซน์ที่บางและกะทัดรัดเพื่อให้สามารถวางชิดกับคีย์บอร์ดได้ แต่สำหรับ T1 HE รุ่นใหม่นี้ ได้เปลี่ยนมาใช้ดีไซน์ที่คล้ายคลึงกับเมาส์แทร็กบอลทั่วไปจากแบรนด์อย่าง Logitech หรือ Kensington โดยใช้ลูกบอลขนาด 34 มิลลิเมตรติดตั้งไว้ที่ด้านข้างเพื่อเพิ่มประสิทธิภาพตามหลักสรีรศาสตร์", "เนื่องจากขนาดมือและนิ้วของแต่ละคนมีความแตกต่างกัน Keychron จึงออกแบบให้ T1 HE สามารถปรับตำแหน่งของแทร็กบอลได้อย่างละเอียด เพื่อให้ลูกบอลวางอยู่ในตำแหน่งที่พอดีกับนิ้วโป้งของผู้ใช้งานโดยไม่ต้องเอื้อมนิ้วให้เมื่อยล้า", "ปัจจุบัน T1 HE เปิดให้สั่งจองล่วงหน้าแล้วผ่านทางร้านค้าออนไลน์ของ Keychron ในราคา 59.99 ดอลลาร์สหรัฐ โดยมีตัวเลือกสีให้เลือก 3 สี ได้แก่ สีดำ สีขาว และสีโปร่งแสง ซึ่งคาดว่าจะเริ่มจัดส่งสินค้าได้ในช่วงต้นเดือนธันวาคมนี้", "กลไกการปรับแต่งที่อยู่ใต้ตัวเมาส์ประกอบด้วยปุ่มหมุนสองปุ่มที่ใช้สำหรับปรับตำแหน่งแทร็กบอลทั้งในแนวตั้งและแนวนอน ซึ่งสามารถยืดออกหรือหดเข้าได้ แม้ว่าการปรับแต่งจะจำกัดอยู่ในระยะเพียงไม่กี่มิลลิเมตรในแต่ละทิศทาง แต่การปรับปรุงเล็กน้อยเหล่านี้ถือว่ามีส่วนสำคัญอย่างมากในการช่วยให้ T1 HE มีความสะดวกสบายในการใช้งานในชีวิตประจำวันมากขึ้น", "ในส่วนของประสิทธิภาพ เซนเซอร์ออปติคัลของ T1 HE สามารถปรับความไวได้ตั้งแต่ 100 DPI ไปจนถึง 2,400 DPI โดยผู้ใช้สามารถกดปุ่มเพื่อสลับค่าที่ตั้งไว้ล่วงหน้า หรือจะปรับแต่งผ่านซอฟต์แวร์ Keychron Launcher ก็สามารถทำได้เช่นกัน", "ซอฟต์แวร์ Keychron Launcher ยังเปิดโอกาสให้ผู้ใช้สามารถปรับแต่งการตั้งค่าอื่นๆ ได้เพิ่มเติม ไม่ว่าจะเป็นการตั้งค่าปุ่มใหม่ (Button Remapping) หรือการสร้างคำสั่งมาโคร (Macros) เพื่อเพิ่มความคล่องตัวในการใช้งาน", "เมาส์รุ่นนี้มาพร้อมกับปุ่มกดที่ปรับแต่งได้ทั้งหมด 6 ปุ่ม และติดตั้งแบตเตอรี่ขนาด 600mAh ซึ่งสามารถใช้งานได้นานสูงสุดถึง 106 ชั่วโมงในโหมด Bluetooth หรือ 98 ชั่วโมงเมื่อใช้งานผ่านตัวรับสัญญาณไร้สาย 2.4GHz ที่แถมมาให้ในชุด นอกจากนี้ หากผู้ใช้งานไม่ต้องการกังวลเรื่องการชาร์จไฟ T1 HE Wireless Adjustable Trackball Mouse ยังสามารถใช้งานผ่านสาย USB-C ได้อีกด้วย"], "link": "https://www.theverge.com/tech/1033159/keychron-t1-he-trackball-wireless-mouse-adjustable", "cover_image_url": "https://platform.theverge.com/wp-content/u แบบมาให้เด็กๆ ถือได้ง่ายขึ้น แต่ดูเหมือนว่าบริษัทจะยังไม่หยุดเพียงแค่นั้นในการย่อขนาดฮาร์ดแวร์ของตน", "กล้องรุ่นใหม่ล่าสุดอย่าง Camp Snap CS-8 Micro มีขนาดที่เล็กยิ่งกว่ารุ่น CS-8 Mini โดยมีความยาวประมาณ 3 นิ้ว และมีน้ำหนักเพียง 1.5 ออนซ์ ทำให้ผู้ใช้สามารถนำไปห้อยกับพวงกุญแจได้ และเช่นเดียวกับรุ่นก่อนหน้าที่มีขนาดใหญ่กว่า กล้องรุ่นนี้สามารถบันทึกวิดีโอโดยใช้ฟิลเตอร์ที่มีมาให้ในตัวเครื่อง 5 รูปแบบ", "CS-8 Micro จะเริ่มวางจำหน่ายตั้งแต่วันที่ 17 พฤศจิกายน เวลา 11.00 น. ตามเวลา ET ผ่านทางร้านค้าออนไลน์ของ Camp Snap, Target และ Urban Outfitters ในราคา 39.99 ดอลลาร์สหรัฐฯ และเช่นเดียวกับกล้องสะสมอย่าง Kodak Charmera กล้องรุ่น Micro นี้จะถูกจำหน่ายในรูปแบบกล่องสุ่ม (Mystery Boxes)", "สีสันอย่างสีชมพูสด (Hot Pink), สีม่วงอ่อน (Lilac), สีเขียวมะนาว (Lime) และสีส้ม จะหาซื้อได้ง่ายกว่า ในขณะที่สีคลาสสิกวินเทจ (สีดำ) และสีเรืองแสงในที่มืด (Glow in the dark) จะมีความหายากมากกว่ามาก", "แตกต่างจากรุ่น CS-8 และ CS-8 Mini รุ่นดั้งเดิม กล้องรุ่น Micro ใหม่นี้มาพร้อมกับหน้าจอแสดงผล LCD แต่หน้าจอดังกล่าวถูกใช้เป็นช่องมองภาพเท่านั้น ผู้ใช้ไม่สามารถรับชม แก้ไข หรือลบวิดีโอใดๆ ที่บันทึกไว้ภายในตัวกล้องได้โดยตรง", "ผู้ใช้จำเป็นต้องถ่ายโอนวิดีโอไปยังโทรศัพท์หรือคอมพิวเตอร์ผ่านสาย USB-C เพื่อรับชม หรือถอดการ์ด microSD ขนาด 4GB ที่ให้มาในชุดไปเสียบกับเครื่องอ่านการ์ด (Card Reader) เพื่อดูไฟล์วิดีโอ", "ในขณะที่ Camp Snap ได้ทยอยลดขนาดกล้องวิดีโอย้อนยุคของตนลงอย่างต่อเนื่อง บริษัทก็ได้ลดความละเอียดของภาพลงด้วยเช่นกัน โดยรุ่นดั้งเดิมสามารถบันทึกวิดีโอได้ที่ความละเอียด 4K ในขณะที่รุ่น CS-8 Mini บันทึกได้ที่ 2.7K ส่วนรุ่น CS-8 Micro นั้นจำกัดความละเอียดไว้ที่ 720p", "อย่างไรก็ตาม กล้องรุ่นนี้ยังคงฟีเจอร์เด่นๆ ไว้ เช่น การซูมดิจิทัล 8 เท่า และตัวเลือกฟิลเตอร์ 5 รูปแบบ ซึ่งรวมถึงเอฟเฟกต์วินเทจที่เพิ่มการสั่นไหวและเม็ดเกรนเพื่อจำลองรูปลักษณ์ของฟิล์ม 8 มม. โดย Camp Snap คาดการณ์ว่าการ์ด microSD ขนาด 4GB ของรุ่น Micro สามารถเก็บวิดีโอได้นาน 45 ถึง 60 นาที ในขณะที่อายุการใช้งานแบตเตอรี่คาดว่าจะอยู่ที่ประมาณ 30 ถึง 45 นาทีต่อการชาร์จเต็มหนึ่งครั้ง"], "link": "https://www.theverge.com/tech/1033026/camp-snap-retro-digital-video-campcorder-cs-8-micro-keychain", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/campsnapA.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.717271201674%2C100%2C78.565457596651&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/01/ANDREW_LISZEWSKI_BLURPLE.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/campsnapB.jpg?quality=90&amp;strip=all&amp;crop=16.666666666667%2C0%2C66.666666666667%2C100&amp;w=1200"], "published_th": "14 พ.ย. 2026 • 00:12 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/tech/1033026/camp-snap-retro-digital-video-campcorder-cs-8-micro-keychain", "guid": "https://www.theverge.com/?p=1033026", "published_ts": 1794589976, "published_at": "2026-11-13T17:12:56Z", "videos": [], "review_score": "", "sub_tag": "TECH"}, {"id": 1794606565587, "original_title": "My favorite recipe app just got a big upgrade — and a subscription fee", "thai_title": "แอปจัดการสูตรอาหารยอดนิยม Paprika 4 อัปเกรดใหญ่ เพิ่มฟีเจอร์ล้ำพร้อมระบบสมาชิก", "tag": "Technology", "bullet_points": ["Paprika 4 เปิดตัวอัปเกรดครั้งใหญ่ในรอบเกือบ 10 ปี รองรับการใช้งานทั้ง Android, iOS, Windows และ macOS", "เพิ่มฟีเจอร์พรีเมียมผ่านระบบสมาชิก เช่น การนำเข้าสูตรอาหารจากโซเชียลมีเดียและภาพถ่าย, การสแกนบาร์โค้ดสินค้า และการเชื่อมต่อกับ Alexa", "ฟีเจอร์เด่นคือการดึงข้อมูลสูตรอาหารจากภาพถ่ายหน้าจอหรือลิงก์โซเชียลมีเดียโดยอัตโนมัติ", "ระบบ Cook Mode ใหม่ช่วยให้ทำอาหารแบบแฮนด์ฟรีผ่านคำสั่งเสียงได้ทุกเวอร์ชัน", "ค่าบริการรายเดือนอยู่ที่ 1.25 ดอลลาร์สหรัฐ ซึ่งถือว่าคุ้มค่าสำหรับผู้ที่ต้องการจัดการครัวอย่างเป็นระบบ"], "full_paragraphs": ["เกือบ 10 ปีหลังจากเปิดตัว Paprika 3 แอปพลิเคชันสำหรับจัดการสูตรอาหาร จัดระเบียบตู้เก็บของ และสร้างรายการซื้อของชำ ได้รับการอัปเกรดครั้งใหญ่ที่เพิ่มฟังก์ชันการทำงานในเกือบทุกส่วนของประสบการณ์การใช้งาน ผมได้ทดสอบ Paprika 4 เป็นเวลาหลายสัปดาห์ในช่วงที่ยังเป็นเวอร์ชันเบต้า และล่าสุดแอปพลิเคชันนี้ได้เปิดตัวอย่างเป็นทางการแล้วบน Android (เวอร์ชันที่ผมใช้งาน), iOS, Windows และ macOS", "ฟีเจอร์ใหม่ที่ถูกจำกัดไว้ภายใต้ระบบสมาชิก (Paywall) ช่วยให้ผู้ใช้สามารถนำเข้าสูตรอาหารจากโซเชียลมีเดียและตำราอาหารที่เป็นเล่มได้ รวมถึงการสแกนบาร์โค้ดสินค้าเพื่อจัดระเบียบตู้เก็บของหรือรายการซื้อของ และยังสามารถเชื่อมต่อกับผู้ทำอาหารคนอื่นๆ ผ่านแอปเพื่อแบ่งปันบันทึกและสูตรอาหารได้ ซึ่งฟีเจอร์เหล่านี้ถือว่าทำออกมาได้ดีและทำให้การสมัครสมาชิกดูคุ้มค่า", "ฟีเจอร์ใหม่ที่ผมชอบที่สุดและจำกัดเฉพาะสมาชิก คือการแก้ปัญหาที่ผมมักจะเจออยู่บ่อยครั้ง นั่นคือภรรยาของผมมักจะส่งวิดีโอสูตรอาหารจาก Instagram มาให้ ซึ่งผมมักจะต้องแคปหน้าจอข้อความเพื่อนำมาประกอบเป็นสูตรอาหาร แต่ Paprika 4 สามารถดึงข้อมูลที่สำคัญจากภาพหน้าจอเหล่านั้นและสร้างเป็นสูตรอาหารให้ได้ หากในข้อความมีข้อมูลสูตรอาหารที่ครบถ้วนเพียงพอสำหรับการกรอกข้อมูลอัตโนมัติในช่องสูตรอาหารของ Paprika", "ทางเลือกนอกเหนือจากการป้อนภาพหน้าจอให้แอป คุณสามารถส่งโพสต์โซเชียลมีเดียจาก TikTok, Instagram, YouTube หรือ Facebook ไปยัง Paprika 4 ได้โดยตรงจากเมนูแชร์ (Share sheet) โดยแอปจะทำการดึงข้อมูลจากคำบรรยาย (Caption) และแปลงเป็นสูตรอาหารภายในไม่กี่วินาที แม้ว่าแอปจะไม่สามารถดึงข้อมูลจากวิดีโอได้โดยตรง (ซึ่งเป็นเรื่องที่สะดวกแต่ก็อาจเป็นประเด็นถกเถียง) และจะทำงานได้ก็ต่อเมื่อมีข้อความในคำบรรยายของรูปภาพหรือวิดีโอให้ดึงข้อมูลเท่านั้น แต่นี่ก็ถือเป็นการปรับปรุงที่ดีและยังคงลิงก์ไปยังโพสต์โซเชียลมีเดียต้นทางไว้ในสูตรอาหาร เพื่อให้ผมสามารถกลับไปดูได้ง่ายตามต้องการ", "บัญชีโซเชียลมีเดียจำนวนมากมักซ่อนสูตรอาหารไว้จากผู้ที่เลื่อนผ่าน โดยกำหนดขั้นตอนเพิ่มเติม เช่น 'คอมเมนต์ว่า TASTYYUMYUM เพื่อรับสูตรอาหารฟรี' ผมเคารพในความพยายามนั้น แม้ว่าผมจะไม่ชอบที่ต้องเห็นสิ่งนี้ในขณะที่กำลังค้นหาสูตรอาหารก็ตาม แน่นอนว่า Paprika อาจมีปัญหาบ้างเมื่อโพสต์สูตรอาหารมีข้อมูลที่วิเคราะห์ได้น้อยเกินไป แต่สำหรับโพสต์ที่มีข้อมูลเพียงพอ การนำเข้าข้อมูลเหล่านั้นเข้าสู่แอปก็ทำได้ง่ายมาก", "Paprika 4 ยังช่วยให้คุณนำเข้าสูตรอาหารด้วยกล้องโทรศัพท์มือถือได้ ผมได้ทดลองใช้ถ่ายภาพจากตำราอาหารที่เรามี และแอปก็แปลงข้อมูลได้อย่างแม่นยำ ในเวอร์ชันฟรีและเวอร์ชันมาตรฐาน คุณจะถูกจำกัดให้ใช้วิธีคัดลอกและวาง URL เว็บไซต์ลงในเบราว์เซอร์ของแอปเพื่อให้แปลงเป็นสูตรอาหาร ซึ่งวิธีนี้ใช้งานได้ดีมาก แต่เมื่อเทียบกันแล้วก็ยังรู้สึกว่าเป็นวิธีพื้นฐานกว่า", "Paprika 4 สามารถคาดการณ์ข้อมูลโภชนาการของสูตรอาหารของคุณได้ ซึ่งเป็นเรื่องดีหากคุณมีเป้าหมายด้านสุขภาพหรือเพียงแค่ต้องการทราบว่าอาหารของคุณให้พลังงานเท่าใด ผมคงไม่บอกว่าผลลัพธ์นั้นแม่นยำ 100% แต่ก็ดูเหมือนว่ามีความสามารถเพียงพอที่จะใช้งานได้ โดยฟีเจอร์นี้ถูกจำกัดไว้ภายใต้ระบบสมาชิกเช่นกัน", "อีกฟีเจอร์หนึ่งที่ผมคิดว่าจะได้ใช้งานมากขึ้นคือเครื่องมือจัดการตู้เก็บของ (Pantry) ที่ขยายขีดความสามารถขึ้น ใน Paprika 3 มีเพียง 'ตู้เก็บของ' เดียว แต่ใน Paprika 4 เวอร์ชันเสียเงินและเวอร์ชันมาตรฐาน คุณสามารถระบุได้ว่าสิ่งของถูกเก็บไว้ที่ไหน เช่น ในตู้, ตู้เย็น, ช่องแช่แข็ง และที่อื่นๆ (เวอร์ชันฟรียังคงจำกัดให้มีที่เก็บของได้เพียงที่เดียว) ผมยังตื่นเต้นกับฟีเจอร์สแกนบาร์โค้ดใหม่ ซึ่งเป็นฟีเจอร์พรีเมียมที่สามารถเพิ่มรายการเข้าสู่ตู้เก็บของได้อย่างรวดเร็วและง่ายดาย แม้ว่าในช่วงเบต้าฟีเจอร์นี้จะยังใช้งานไม่ได้สำหรับผม แต่ในเวอร์ชันปัจจุบันฟังก์ชันการสแกนทำงานได้ดี มันจดจำรายการที่ผมซื้อเป็นประจำจาก Trader Joe’s, Whole Foods และร้านสะดวกซื้อทั่วไปได้ และเพิ่มรายการเหล่านั้นด้วยชื่อที่เข้าใจง่าย (เช่น สเปรย์น้ำมันมะกอก แทนที่จะเป็น 'Trader Joe’s Organic Extra Virgin Olive Oil Spray')", "โหมดทำอาหาร (Cook Mode) เป็นฟีเจอร์ที่น่าสนใจและมีให้ใช้งานใน Paprika 4 ทุกเวอร์ชัน เมื่อเปิดใช้งานผ่านเมนูแบบเลื่อนลง แอปจะอ่านขั้นตอนแรกของสูตรอาหารออกมาดังๆ และรอให้คุณตอบรับก่อนที่จะดำเนินการต่อ คุณสามารถสั่งให้แอปอ่านซ้ำ, ไปยังขั้นตอนถัดไป, เพิ่มหรือลดสัดส่วนสูตรอาหาร, ตั้งเวลา, หรือขีดฆ่าขั้นตอนหรือส่วนผสมเมื่อคุณทำเสร็จแล้ว รวมถึงคำสั่งและคำถามที่ตั้งค่าไว้ล่วงหน้าอื่นๆ ในโหมดนี้ ไมโครโฟนจะเปิดค้างไว้โดยค่าเริ่มต้น แม้ว่าแอปจะไม่ตอบสนองต่อการพูดคุยทั่วไปที่ไม่เกี่ยวข้อง หากการถามคำสั่งไม่ได้ผล คุณสามารถใช้คำปลุก (Wake word) ว่า 'paprika' เพื่อเรียกใช้งานใหม่ได้ ซึ่งฟีเจอร์นี้มีประโยชน์อย่างชัดเจนในด้านการเข้าถึง (Accessibility)", "นอกจากนี้ยังมีการเชื่อมต่อกับ Alexa อย่างครอบคลุมหากคุณจ่ายค่าสมาชิก ซึ่งช่วยให้ Alexa เข้าถึงสูตรอาหาร, รายการซื้อของ, ตู้เก็บของ และแผนการรับประทานอาหารของคุณได้ คุณสามารถจัดการรายการซื้อของและตู้เก็บของด้วยเสียงผ่านลำโพง Echo และอุปกรณ์ Echo ที่มีหน้าจออย่าง Echo Show ก็สามารถแสดงสูตรอาหารและรองรับการทำอาหารแบบแฮนด์ฟรีได้ สำหรับ Paprika 4 เวอร์ชัน iOS ยังเพิ่มวิดเจ็ตและทางลัดต่างๆ สำหรับ iOS และ macOS เช่น การเพิ่มรายการลงในรายการซื้อของหรือตู้เก็บของ และการแสดงมื้ออาหารที่วางแผนไว้ ซึ่งฟีเจอร์เหล่านี้ไม่จำเป็นต้องสมัครสมาชิก", "สำหรับผู้ที่จริงจังกับการจัดระเบียบในครัว ทั้งในแง่ของตู้เก็บของและคลังสูตรอาหาร ฟีเจอร์ที่จำกัดไว้เหล่านี้ก็น่าจะมีการใช้งานมากพอในแต่ละสัปดาห์จนคุ้มค่าที่จะจ่ายเงิน อย่างไรก็ตาม หากคุณยังไม่เคยใช้ Paprika มาก่อน เวอร์ชันฟรีก็เป็นจุดเริ่มต้นที่ดี", "แม้แต่ในฐานะคนที่พอใจกับฟีเจอร์ใน Paprika 3 ผมก็ยังเห็นคุณค่าของการจ่ายเงินสำหรับฟีเจอร์เฉพาะสมาชิก ในช่วงเบต้า ผมคิดว่า 2 ดอลลาร์ต่อเดือนเป็นตัวเลขที่ผมยินดีจ่าย แต่ Hindsight Labs ได้กำหนดราคาไว้เพียง 1.25 ดอลลาร์ต่อเดือนเท่านั้น แม้ว่าบริษัทจะได้รับเงินต่อผู้ใช้มากขึ้นกว่าที่เคยเป็นมา แต่เช่นเดียวกับผู้ใช้ Paprika ส่วนใหญ่ ผมคงจะซื้อแอปนี้ซ้ำหลายครั้งอยู่ดีเนื่องจากมันมีประโยชน์ต่อผมมาก และดูเหมือนว่าตอนนี้ผมจะได้ทำเช่นนั้นแล้ว", "หมายเหตุแก้ไข: บทความนี้ได้ปรับปรุงข้อมูลให้ครอบคลุมถึงเวอร์ชันฟรีที่มี 2 ระดับ แทนที่จะเป็นระดับเดียว คือ 'ฟรี' สำหรับผู้ใช้ใหม่ (ที่มีฟีเจอร์น้อยกว่า) และ 'มาตรฐาน' สำหรับผู้ที่เคยซื้อ Paprika เวอร์ชันก่อนหน้า (ซึ่งมีฟังก์ชันการทำงานเพิ่มเติม)"], "link": "https://www.theverge.com/tech/1032141/paprika-4-recipe-grocery-pantry-app-update-subscription-hands-on", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/paprikalead.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.728752477728%2C100%2C78.542495044544&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/paprikasocial.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/nutritionpaprika.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/oliveoilspray.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200", "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/premiumvsstandard.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "13 พ.ย. 2026 • 23:00 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/tech/1032141/paprika-4-recipe-grocery-pantry-app-update-subscription-hands-on", "guid": "https://www.theverge.com/?p=1032141", "published_ts": 1794585600, "published_at": "2026-11-13T16:00:00Z", "videos": [], "review_score": "", "sub_tag": "TECH"}, {"id": 1794670625170, "original_title": "The Verge’s 2026 gift guide for dads", "thai_title": "แนะนำของขวัญปี 2026 สำหรับคุณพ่อ: รวมไอเทมล้ำสมัยที่ตอบโจทย์ทุกไลฟ์สไตล์", "tag": "Technology", "bullet_points": ["คัดสรรของขวัญสำหรับคุณพ่อสมัยใหม่ ไม่ว่าจะเป็นสายเกมเมอร์ นักสร้างสรรค์ เชฟ หรือผู้ที่หลงใหลในเทคโนโลยี", "นำเสนออุปกรณ์หลากหลายประเภท ตั้งแต่โดรนถ่ายภาพ 8K, หูฟังตัดเสียงรบกวน Sonos Ace Ultra ไปจนถึงจอภาพ QD-OLED ประสิทธิภาพสูง", "เน้นสินค้าที่ผสมผสานทั้งความล้ำสมัย ความสะดวกสบาย และความยั่งยืน เช่น สมาร์ทโฟนที่ซ่อมแซมเองได้จาก Fairphone", "รวมไอเดียของขวัญที่ตอบโจทย์การใช้งานจริงในชีวิตประจำวัน เช่น อุปกรณ์เสริมสำหรับเดินทาง เครื่องมือช่าง และอุปกรณ์ดูแลสุขภาพ", "แนะนำสินค้าที่สร้างความประทับใจด้วยฟังก์ชันที่คาดไม่ถึง เช่น อุปกรณ์เปลี่ยนต้นไม้ให้เป็นเครื่องดนตรี และชุดซ่อมเซรามิกสไตล์คินสึงิ"], "full_paragraphs": ["หมดยุคของการซื้อเนกไทแบบสุ่ม หรือภาชนะใส่เครื่องดื่มหุ้มหนัง หรือชุดโกนหนวดให้คุณพ่อไปแล้ว เพราะคุณพ่อในยุคนี้ต้องการและสมควรได้รับสิ่งที่น่าจดจำมากกว่านั้น โชคดีที่คุณไม่จำเป็นต้องลำบากในการหาของขวัญพิเศษที่ท่านจะถูกใจ เพราะเราได้รวบรวมรายการของขวัญประจำปีนี้มาให้คุณแล้ว", "เราได้คัดสรรรายการของขวัญโดยคำนึงถึงคุณพ่อสมัยใหม่ ไม่ว่าท่านจะเป็นเกมเมอร์ นักสร้างสรรค์ เชฟ หรือเพียงแค่ผู้ที่หลงใหลในแกดเจ็ต เราเชื่อว่ามีหลายสิ่งที่ท่านจะต้องชอบ ตั้งแต่หูฟังตัดเสียงรบกวนอ , "รายการ The Vergecast เจาะลึกประเด็นร้อน ตั้งแต่การทดลอง AI ของ มาร์ก ซักเคอร์เบิร์ก ไปจนถึงยุคสมัยของ Cybertruck"], "full_paragraphs": ["ในรายการ The Vergecast ตอนล่าสุด ได้มีการหยิบยกประเด็นความเคลื่อนไหวที่ซับซ้อนในโลกของ AI, ชะตากรรมของบริการสตรีมมิ่ง, เรื่องราวเกี่ยวกับ มาร์ก ซักเคอร์เบิร์ก และประเด็นอื่นๆ ที่น่าสนใจมาพูดคุยกัน", "เดวิด เพียร์ซ ผู้ดำเนินรายการได้กล่าวถึงเหตุการณ์สำคัญที่เกิดขึ้นเมื่อวันพฤหัสบดีที่ผ่านมา ซึ่งถือเป็นจุดสิ้นสุดของมหากาพย์บทหนึ่งที่เกี่ยวข้องกับ เจนเซน หวง ซีอีโอของ Nvidia เมื่อเขาได้ประกาศลาออกจากตำแหน่งผู้นำสูงสุดของบริษัทที่ถือว่ามีความสำคัญที่สุดในอุตสาหกรรม AI ในขณะนี้", "อย่างไรก็ตาม ในช่วงหลายสัปดาห์และหลายเดือนต่อจากนี้ เรื่องราวที่ใหญ่กว่านั้นอาจกำลังจะเปิดเผยออกมา ซึ่งเป็นเรื่องราวที่เกี่ยวข้องกับการทำธุรกิจของ Nvidia ในประเทศจีน รวมถึงความเต็มใจของรัฐบาลสหรัฐฯ ที่อาจเลือกมองข้ามบางประเด็นเพื่อปกป้องพันธมิตรที่ทรงอิทธิพล และที่สำคัญที่สุดคือเรื่องของเสถียรภาพโดยรวมของอุตสาหกรรม AI ทั้งระบบ ซึ่งถือเป็นประเด็นที่มีความซับซ้อนอย่างมาก", "ในรายการ The Vergecast ตอนนี้ เดวิด และ ไนเลย์ ได้เริ่มต้นด้วยการพยายามแกะรอยและทำความเข้าใจส่วนประกอบต่างๆ ของเรื่องราวที่เกิดขึ้น พวกเขาชี้ให้เห็นว่าเราทุกคนกำลังจะได้เรียนรู้เกี่ยวกับเรื่อง 'Megaspeed' มากขึ้นกว่าที่เราเคยคาดคิดหรือต้องการจะรู้ และเราจะได้ยินผู้คนจำนวนมาก โดยเฉพาะสมาชิกพรรคเดโมแครตที่เพิ่งได้รับเลือกตั้งใหม่ ออกมาตั้งคำถามว่าใครรู้เรื่องอะไรบ้างและรู้เมื่อไหร่", "ในระหว่างนี้ คำถามสำคัญที่ตามมาคือ ใครจะก้าวขึ้นมาแทนที่ เจนเซน หวง ในฐานะผู้นำหน้าฉากของอุตสาหกรรม AI และทุกคนจะสามารถรอดพ้นจากการตรวจสอบอย่างเข้มข้นที่กำลังจะเกิดขึ้นได้หรือไม่", "หลังจากนั้น ผู้ดำเนินรายการได้หันไปพูดคุยถึงสัปดาห์ที่เต็มไปด้วยข่าวคราวเล็กๆ น้อยๆ จากบริการสตรีมมิ่งต่างๆ ซึ่งเมื่อนำมารวมกันแล้วจะเห็นได้ชัดว่าเป็นแผนการของฮอลลีวูดในการรับมือกับ TikTok อย่างจริงจัง", "เรากำลังจะได้รู้กันว่ากลยุทธ์อย่าง 'ไมโครดราม่า' (microdramas), การเปิดให้รับชมฟรี (free tiers) และความหลงใหลอย่างลึกซึ้งในวิดีโอแนวตั้ง จะสามารถกอบกู้บริษัทอย่าง Netflix หรือ Paramount ได้หรือไม่ ซึ่งคำถามคือมันจะได้ผลหรือไม่? คำตอบคืออาจจะไม่ แต่ในขณะเดียวกัน มันก็เป็นสิ่งเดียวที่มีเหตุผลพอที่จะลองทำในสถานการณ์ปัจจุบัน", "สุดท้ายในช่วง Lightning Round ของรายการ ได้มีการพูดถึงประเด็นของ เบรนแดน คาร์, การทดลองด้าน AI ของ มาร์ก ซักเคอร์เบิร์ก, ยุคสมัยของ Cybertruck และประเด็นอื่นๆ อีกมากมายที่กำลังเป็นที่สนใจในขณะนี้"], "link": "https://www.theverge.com/podcast/1032866/jensen-huang-nvidia-china-trump-vergecast", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2026/11/VRG_VST_111326_Site.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200", "gallery_images": [], "published_th": "13 พ.ย. 2026 • 21:47 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/podcast/1032866/jensen-huang-nvidia-china-trump-vergecast", "guid": "https://www.theverge.com/?p=1032866", "published_ts": 1794581236, "published_at": "2026-11-13T14:47:16Z", "videos": [], "review_score": "", "sub_tag": "PODCAST"}, {"id": 1794585361896, "original_title": "Meta discussed attacking Jonathan Haidt — now even his haters are annoyed", "thai_title": "Meta เคยหารือแผนโจมตีนักวิชาการผู้ต่อต้านโซเชียลมีเดีย แต่กลับสร้างความไม่พอใจให้แม้กระทั่งฝ่ายที่เห็นต่าง", "tag": "Technology", "bullet_points": ["เอกสารจากศาลเผย Meta เคยหารือแผน 'Whisper strategy' ในปี 2023 เพื่อโน้มน้าวให้นักวิชาการหันมาต่อต้าน โจนาธาน เฮดท์ (Jonathan Haidt)", "นักวิชาการหลายคน รวมถึงผู้ที่เคยวิพากษ์วิจารณ์งานวิจัยของเฮดท์ ต่างออกมาปฏิเสธว่าไม่เคยได้รับอิทธิพลหรือเงินทุนจาก Meta ในการโจมตีเขา", "แอนดรูว์ เกลแมน (Andrew Gelman) ศาสตราจารย์ด้านสถิติและรัฐศาสตร์ ออกมาประณามแนวทางลับของ Meta ว่าเป็นเรื่องที่น่ารังเกียจและไม่เหมาะสม", "คริสโตเฟอร์ เฟอร์กูสัน (Christopher Ferguson) นักจิตวิทยา มองว่าทั้ง Meta และเฮดท์ต่างมีอิทธิพลเชิงลบต่อความเข้าใจเรื่องสุขภาพจิตเยาวชนในมุมที่ต่างกัน", "เหตุการณ์นี้เกิดขึ้นท่ามกลางคดีความฟ้องร้อง Meta ในประเด็นการปกปิดความเสี่ยงของแพลตฟอร์มที่มีต่อสุขภาพจิตของวัยรุ่น"], "full_paragraphs": ["Meta ได้สร้างความไม่พอใจให้กับเหล่านักวิชาการจากทุกฝ่ายในประเด็นการถกเถียงเรื่องโซเชียลมีเดียและสุขภาพจิต โดยเมื่อสามปีก่อน Meta ได้พิจารณาแผนการที่จะเปลี่ยนความคิดเห็นของสาธารณชนให้ต่อต้าน โจนาธาน เฮดท์ (Jonathan Haidt) หนึ่งในคู่ปรับที่มีอิทธิพลมากที่สุดของบริษัท แต่หลังจากข้อเสนอดังกล่าวถูกเปิดเผยในเอกสารของศาลเมื่อเดือนที่แล้ว มันกลับส่งผลย้อนกลับ เพราะหากจะมีสิ่งหนึ่งที่เฮดท์ ผู้เขียนหนังสือ 'Anxious Generation' และเหล่านักวิจารณ์ของเขาเห็นตรงกัน ก็คือความไม่พอใจที่มีต่อ Meta", "เอกสารจากศาลในรัฐแคลิฟอร์เนียเปิดเผยว่า พนักงานของ Meta ได้หารือกันในปี 2023 เกี่ยวกับ 'กลยุทธ์กระซิบ' (Whisper strategy) เพื่อ 'เปลี่ยนให้นักวิชาการหันมาต่อต้านเฮดท์' ซึ่งในขณะนั้นเขากำลังจะตีพิมพ์หนังสือขายดีที่โต้แย้งว่าแพลตฟอร์มอย่าง Meta กำลังทำร้ายเด็กๆ เฮดท์ใช้เวลาหลายปีในการเผยแพร่ทฤษฎีของเขาที่ว่าโซเชียลมีเดียและสมาร์ทโฟนคือสาเหตุของสุขภาพจิตที่ถดถอยในวัยรุ่น รวมถึงในหนังสือปี 2018 เรื่อง 'The Coddling of the American Mind' และการให้การต่อสภาคองเกรสในปี 2022 เพื่อตอบโต้เรื่องนี้ Meta ดูเหมือนจะพิจารณา 'แคมเปญใต้ดิน' (Below-the-line campaign) รวมถึงแนวคิดที่จะ 'ให้เกลแมนเขียนบทความโจมตี' ซึ่งอาจอ้างถึง แอนดรูว์ เกลแมน (Andrew Gelman) ศาสตราจารย์ด้านสถิติและรัฐศาสตร์จากมหาวิทยาลัยโคลัมเบีย ผู้ซึ่งเคยวิพากษ์วิจารณ์เฮดท์ต่อสาธารณะมาก่อน แม้ว่าการสะกดชื่อจะแตกต่างกันก็ตาม", "ยังไม่ชัดเจนว่า Meta ได้ดำเนินการตามกลยุทธ์ที่พนักงานเหล่านั้นพิจารณาหรือไม่ แต่การเปิดเผยดังกล่าวได้ก่อให้เกิดกระแสต่อต้านที่ดังขึ้นมากจากทั้งฝั่งของเฮดท์และกลุ่มผู้ที่วิจารณ์เขาอย่างรุนแรง ซึ่งส่วนใหญ่ไม่ได้ถูกระบุชื่อในเอกสาร ทั้งนี้ Meta ปฏิเสธที่จะแสดงความคิดเห็นสำหรับบทความนี้", "นักวิชาการหลายคนได้ออกมาแสดงจุดยืนว่า Meta ไม่มีส่วนเกี่ยวข้องกับการที่พวกเขาต่อต้านเฮดท์ แคนดิซ ออดเจอร์ส (Candice Odgers) ศาสตราจารย์ด้านจิตวิทยาผู้ศึกษาผลกระทบของเทคโนโลยีต่อวัยรุ่นและมักวิจารณ์งานของเฮดท์ ได้เขียนใน Substack ว่า 'ไม่ ฉันไม่ได้รับเงินเพื่อวิจารณ์หนังสือ Anxious Generation ฉันได้ข้อสรุปด้วยตัวเองว่าวิทยาศาสตร์ที่นำเสนอในนั้นมีข้อบกพร่อง' เธอยังระบุว่า 'ฉันไม่เคยถูก Meta ติดต่อเพื่อกำหนดทิศทางสิ่งที่ฉันพูดต่อสาธารณะเกี่ยวกับงานวิจัยเรื่องวัยรุ่นและโซเชียลมีเดีย มุมมองของฉันเป็นของฉันเอง และมีพื้นฐานมาจากการวิจัยหลายปีที่ฉันทำในหัวข้อนี้'", "ดานาห์ บอยด์ (danah boyd) ศาสตราจารย์ด้านการสื่อสารจากมหาวิทยาลัยคอร์เนล ซึ่งศึกษาการใช้โซเชียลมีเดียของวัยรุ่น กล่าวว่า 'ทุกวันนี้ ฉันไม่มีอะไรดีๆ จะพูดเกี่ยวกับบริษัท Meta เลย แม้ว่าจะรู้จักคนที่ยอดเยี่ยมบางคนที่ทำงานที่นั่น ฉันคิดว่าบริษัทนี้ไร้จริยธรรมถึงแก่น แต่ฉันยังคงยืนหยัดในงานวิจัยของฉันเกี่ยวกับวัยรุ่นและงานวิจัยของผู้อื่นที่ได้ทำการวิเคราะห์อย่างเข้มงวดเพื่อนำชีวิตของวัยรุ่นมาพิจารณาในบริบทที่ถูกต้อง'", "แม้ว่าเกลแมนจะเคยวิจารณ์วิธีการของเฮดท์มาก่อน แต่ในครั้งนี้เขาได้ออกมาปกป้องเฮดท์โดยประณามการหารือลับของ Meta 'ผมคิดว่ามันแย่มากสำหรับเฮดท์ที่เรื่องนี้เกิดขึ้นกับเขา' เกลแมนกล่าวกับ The Verge ในการสัมภาษณ์ เขาเขียนในบล็อกของเขาว่าเขา 'ไม่เคยได้รับการติดต่อจากใครที่ Facebook หรือ Meta เกี่ยวกับโจนาธาน เฮดท์ หรือผลงานของเขา' แม้เขาจะกล่าวว่าเคยได้รับเงินจากบริษัทในอดีต รวมถึงเงินบริจาค 25,000 ดอลลาร์แบบไม่มีเงื่อนไขในปี 2016 ผ่านมหาวิทยาลัยโคลัมเบียเพื่อการวิจัยของเขา แต่เงินจำนวนนั้นไม่เคยเกี่ยวข้องกับ 'ผลกระทบของโซเชียลมีเดียต่อสุขภาพของวัยรุ่น'", "เกลแมนกล่าวว่า Meta มีสิทธิ์เต็มที่ที่จะเข้ามามีส่วนร่วมในการสนทนาในหัวข้อนี้ แต่ควรทำอย่างเปิดเผย 'การทำลับหลังมันน่าขนลุก มันแย่มาก ผมไม่มีอะไรดีจะพูดเกี่ยวกับเรื่องนั้นเลย' เขากล่าว", "คริสโตเฟอร์ เฟอร์กูสัน (Christopher Ferguson) นักจิตวิทยาจากมหาวิทยาลัยสเตตสัน ซึ่งเป็นหนึ่งในนักวิจารณ์ที่โดดเด่นที่สุดของเฮดท์ กล่าวว่า 'ความคิดที่ว่า Meta จะสร้างแคมเปญกระซิบหรืออะไรก็ตามต่อต้านนักวิชาการคนใดคนหนึ่งนั้นเป็นเรื่องน่ารังเกียจ' อย่างไรก็ตาม เขายังคงวิจารณ์เฮดท์ต่อไปโดยระบุว่า 'ทั้งสองฝ่ายมีความก้าวร้าวและเป็นอิทธิพลที่เลวร้ายต่อความเข้าใจเรื่องสุขภาพจิตของเยาวชนของเรา' เฟอร์กูสันกล่าวว่ามุมมองของเฮดท์ไม่ได้รับการสนับสนุนจากวิทยาศาสตร์ 'เป็นไปได้ที่จะมองว่า Meta เป็นบริษัทที่ใหญ่ น่าเกลียด ดูถูกเหยียดหยาม และไร้จริยธรรม ในขณะเดียวกันก็มองว่าโจนาธาน เฮดท์ เป็นนักวิทยาศาสตร์เทียมที่ควรรู้ดีกว่าที่จะมาขายเรื่องไร้สาระเพื่อแสวงหาผลกำไรจากความกลัวของผู้ปกครอง'", "บันทึกการประชุมของ Meta ถูกเปิดเผยในเอกสารของศาลสำหรับกลุ่มคดีความรวมที่ฟ้องร้อง Meta และบริษัทโซเชียลมีเดียอื่นๆ โดยกล่าวหาว่าพวกเขาหลอกลวงสาธารณชนเกี่ยวกับความเสี่ยงด้านความปลอดภัยของบริการที่มีต่อวัยรุ่น เมื่อเร็วๆ นี้ Meta เผชิญกับความพ่ายแพ้ทางกฎหมายในคดีที่คล้ายคลึงกันหลายคดี ซึ่งอาจทำให้บริษัทต้องเสียค่าปรับหลายพันล้านดอลลาร์ และแยกต่างหากจากการตกลงยอมความกับอัยการสูงสุดของรัฐเป็นเงิน 17.1 พันล้านดอลลาร์", "เฮดท์กล่าวเสริมว่า 'การศึกษาภายในของ Meta ยืนยันผลการวิจัยของเรา เอกสารภายในของ Meta ยังแสดงให้เห็นว่าบริษัทได้หารือเกี่ยวกับแผนการที่จะบิดเบือนการถกเถียงและกระบวนการทางวิชาการ ซึ่งเป็นกลยุทธ์ที่ถอดแบบมาจากตำราของบริษัทบุหรี่ยักษ์ใหญ่ นั่นควรเป็นสิ่งที่น่ากังวลสำหรับทุกคนที่ใส่ใจในความซื่อสัตย์ทางวิทยาศาสตร์และความเป็นอยู่ที่ดีของเด็กๆ ผมดีใจที่ได้เห็นนักสังคมศาสตร์จำนวนมากแสดงความวิพากษ์วิจารณ์ Meta อย่างรุนแรงที่ทำเช่นนั้น'", "เฟอร์กูสันกล่าวว่ามันไม่ดีต่อวงการวิทยาศาสตร์ที่จะถูกผูกติดอยู่กับบุคคลใดบุคคลหนึ่ง และเฮดท์เองก็สามารถทำอะไรได้มากกว่านี้เพื่อลดการยึดติดดังกล่าว 'ผมคิดว่าผู้คนกำลังค่อยๆ ตระหนักว่ามันเป็นไปได้ที่จะเชื่อว่า Meta นั้นชั่วร้ายและเฮดท์นั้นพูดจาเหลวไหลไปพร้อมๆ กัน'"], "link": "https://www.theverge.com/policy/1032645/jonathan-haidt-critics-response-meta", "cover_image_url": "https://platform.theverge.com/wp-content/uploads/sites/2/2025/04/STKS507_FTCxMETA_ANTITRUST_CVIRGINIA_4_F.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200", "gallery_images": ["https://platform.theverge.com/wp-content/uploads/sites/2/2025/01/Lauren_BLURPLE.jpg?quality=90&amp;strip=all&amp;crop=0%2C0%2C100%2C100&amp;w=1200"], "published_th": "13 พ.ย. 2026 • 21:30 น.", "category_hint": "Technology", "canonical_link": "https://www.theverge.com/policy/1032645/jonathan-haidt-critics-response-meta", "guid": "https://www.theverge.com/?p=1032645", "published_ts": 1794580200, "published_at": "2026-11-13T14:30:00Z", "videos": [], "review_score": "", "sub_tag": "POLICY"}, {"id": 1794585361897, "original_title": "Claude’s Duet agent is a little neurotic and surprisingly helpful", "thai_title": "เจาะลึก Claude Duet: เอเจนต์ AI ผู้ช่วยส่วนตัวที่ขยันขันแข็งจนดูประหม่า", "tag": "Technology", "bullet_points": ["Claude Duet คือเอเจนต์ AI รุ่นล่าสุดจาก Anthropic ที่ออกแบบมาเพื่อช่วยจัดการงานเอกสารและตารางเวลาสำหรับผู้ใช้งานทั่วไป", "ระบบสามารถเชื่อมต่อกับอีเมล ปฏิทิน Google Docs และ Slack เพื่อสรุปข้อมูลและแจ้งเตือนสิ่งที่ต้องทำได้อย่างชาญฉลาด", "ผู้ทดสอบพบว่า Duet มีความกระตือรือร้นสูงจนบางครั้งดูเหมือนผู้ช่วยที่ประหม่าเกินไป เช่น การเร่งรัดงานที่ยังไม่ถึงกำหนดส่งจริง", "จุดเด่นคือการเชื่อมโยงข้อมูลข้ามแพลตฟอร์ม แต่จุดอ่อนคือการขาดความเข้าใจในบริบททางสังคมและน้ำเสียง (Nuance) ของมนุษย์", "ผู้เขียนมองว่า AI เหมาะสำหรับการเป็นระบบสำรองเพื่อจัดระเบียบงาน แต่ไม่ควรเข้ามาแทนที่กระบวนการสร้างสรรค์งานเขียนด้วยตนเอง"], "full_paragraphs": ["Duet เป็นผู้ช่วยที่ใช้การได้ดี แม้จะมีความตื่นตัวจนดูประหม่าไปบ้างในบางครั้ง โดยปกติแล้วผลิตภัณฑ์ที่ฉันทดสอบมักจะไม่เสนอตัวช่วยเขียนบทความเกี่ยวกับประสบการณ์การใช้งาน แต่ Duet นั้นแตกต่างออกไป", "Claude Duet คือเอเจนต์ AI สำหรับผู้บริโภคของ Anthropic ซึ่งเป็นความพยายามล่าสุดของบริษัท AI ที่จะโน้มน้าวให้เราเชื่อว่าเอเจนต์สามารถเป็นประโยชน์ต่อคนที่ไม่ใช่โปรแกรมเมอร์ได้ ในช่วงสองสามเดือนที่ผ่านมาถือเป็นช่วงเวลาที่น่าสนใจ เพราะ Instinct ได้มอบผู้ช่วยที่เน้นข้อความที่น่าประทับใจให้เรา, Meta นำเสนอ Muse เจ้าตัวเล็กน่ารักเพื่อช่วยเราซื้อของ และ OpenAI ก็ส่ง Dots ที่เน้นการทำงานมากกว่ามาให้ ส่วน Claude Duet นั้นเน้นเรื่องงานยิ่งกว่าตัวอื่นๆ และยังเป็นมิตรกับผู้ใช้มากกว่า Claude Cowork ซึ่งก็เป็นมิตรมากกว่า Claude Code เอเจนต์เขียนโค้ดที่สร้างกระแสฮือฮาไปเมื่อต้นปีนี้ ฉันได้ทดสอบมันตลอดสัปดาห์ที่ผ่านมาในขณะที่ต้องรับมือกับตารางการเดินทางและงานที่ยุ่งเหยิง ซึ่งในบางครั้งมันก็มีประโยชน์จริงๆ แต่บางครั้งก็ดูเหมือนคนขี้บ่น และกระตือรือร้นที่จะเขียนถึงตัวมันเองมากเกินไป", "เช่นเดียวกับ Muse ของ Meta, Duet มีแอปพลิเคชันเป็นของตัวเอง (และใช่ มันได้รับการอัปเดตให้รองรับ iPhone Duo อย่างเต็มรูปแบบแล้ว) Duet ใช้ดีไซน์ที่เน้นความสดใสและเรียบง่ายตามแบบฉบับของ Claude แอปนี้ใช้งานง่ายและเข้าถึงได้ เมื่อคุณเชื่อมต่อบริการด้านการทำงานและแชททั้งหมดที่ต้องการแล้ว มันจะมองหาวิธีช่วยเหลือและแนะนำสิ่งเหล่านั้นในรูปแบบการ์ดที่คุณสามารถปัดซ้ายหรือขวาเพื่อซ่อนหรือยอมรับได้ คล้ายกับแอป Tinder สำหรับรายการสิ่งที่ต้องทำ (To-do list)", "เพื่อการทดสอบ ฉันได้ให้สิทธิ์เข้าถึง Duet อย่างเต็มที่ ทั้งอีเมลงาน ปฏิทิน Google Docs และ Slack ซึ่งทำให้มันมีข้อมูลมหาศาลเกินกว่าที่ฉันคาดไว้ในตอนแรก เนื่องจากมีการสรุปการประชุมพนักงานทุกสองสัปดาห์โดยอัตโนมัติผ่านอีเมลจาก Gemini และ Duet ก็เข้าถึงอีเมลของฉันได้ มันจึงสามารถเชื่อมโยงสิ่งที่พูดในที่ประชุมเข้ากับข้อความโดยตรงใน Slack ได้ นอกจากนี้ Duet ยังรู้ว่าใครคือหัวหน้าของฉันเพราะเรามี Google Doc ที่ใช้ร่วมกันสำหรับการประชุมแบบ 1:1 ประจำสัปดาห์ AI จะมีประโยชน์ที่สุดเมื่อสามารถดูดซับข้อมูลจำนวนมากได้ และ Duet ก็ไม่รอช้าที่จะทำเช่นนั้น", "Duet เริ่มต้นเช้าวันใหม่ด้วยการทักทายฉันด้วยข้อความสั้นๆ และไฮไลท์สำคัญสำหรับวันนั้น เช่น การเตือนให้ฉันเตรียมของที่จำเป็นสำหรับการถ่ายวิดีโอก่อนขึ้นเครื่องบิน ด้านล่างนั้นมันจะแนะนำสิ่งที่ต้องทำ ซึ่งมักจะจบลงด้วยการเสนอตัวช่วยร่างข้อความหรือเพิ่มรายการลงในวาระการประชุม", "สิ่งนี้มีประโยชน์บ่อยครั้ง แม้ว่าบางครั้งจะรู้สึกเหมือนกำลังโต้ตอบกับผู้ช่วยส่วนตัวที่ดูประหม่าเล็กน้อยก็ตาม ในกรณีหนึ่ง ฉันได้อีเมลหาคนที่ฉันสัมภาษณ์เพื่อเขียนบทความว่าบทความน่าจะเผยแพร่ในวันอังคารและฉันจะส่งลิงก์ไปให้เมื่อมันเผยแพร่ ฉันส่งร่างบทความให้บรรณาธิการตอนดึกของวันจันทร์ และในเช้าวันอังคาร Duet ก็ดูตื่นตระหนก มันยังไม่ถึง 9 โมงเช้าด้วยซ้ำตอนที่มันชี้ให้ฉันเห็นว่าเรื่องดังกล่าวยังรอการแก้ไขอยู่และฉันต้องรีบจัดการ ไม่อย่างนั้นฉันจะไม่สามารถส่งลิงก์ตามที่สัญญาไว้ได้ ความกังวลนั้นดูไม่เข้าท่าเท่าไหร่ และมันไม่เข้าใจความหมายแฝงในข้อความของฉันที่สื่อว่านี่ไม่ใช่กำหนดส่งที่ตายตัว รวมถึงไม่เข้าใจว่านั่นเป็นเวลาเพียง 7 โมงเช้าตามเวลาท้องถิ่นของบรรณาธิการฉันด้วย", "ในกรณีอื่นๆ มันกลับมีประโยชน์อย่างน่าประหลาดใจ ในการวางแผนสำหรับสองสามสัปดาห์ข้างหน้า ฉันลืมไปว่าวันหยุดที่กำลังจะมาถึงจะทำให้ฉันเหลือเวลาทำงานเพียงไม่กี่วันก่อนที่ร่างงานชิ้นใหญ่ชิ้นถัดไปจะครบกำหนด Duet เสนอทางแก้ เสนอที่จะอัปเดต Google Doc พร้อมบันทึกประจำสัปดาห์สำหรับบรรณาธิการของฉัน และร่างข้อความ Slack ถึงเขาเพื่อแจ้งการอัปเดตนั้น ท่านผู้อ่าน
