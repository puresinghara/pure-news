<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure News</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=Prompt:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Prompt', sans-serif; }
    .brand-title { font-family: 'Chakra Petch', sans-serif; letter-spacing: -0.02em; }
  </style>
</head>
<body class="bg-[#09090b] text-zinc-100 min-h-screen antialiased selection:bg-[#ff3366] selection:text-white">

  <!-- Clean Minimal Header (Logo + Pure News + Category Tabs) -->
  <header class="border-b border-zinc-800 bg-[#0c0c0e]/95 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <img src="logo.jpg" alt="Pure News" class="w-10 h-10 rounded-md object-cover border border-zinc-700/80 shadow-sm bg-[#faf7f2]">
        <h1 class="brand-title text-2xl md:text-3xl font-extrabold uppercase text-white tracking-wider leading-none">
          PURE NEWS
        </h1>
      </div>

      <!-- Clean Category Filter Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
        <button onclick="filterTag('ALL')" id="filterALL" class="px-3.5 py-1.5 bg-white text-black font-mono font-bold text-xs rounded transition whitespace-nowrap">ALL</button>
        <button onclick="filterTag('Football')" id="filterFootball" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-mono text-xs rounded transition whitespace-nowrap">PREMIER LEAGUE</button>
        <button onclick="filterTag('Technology')" id="filterTechnology" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-cyan-400 font-mono text-xs rounded transition whitespace-nowrap">THE VERGE</button>
        <button onclick="filterTag('Gadgets')" id="filterGadgets" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-emerald-400 font-mono text-xs rounded transition whitespace-nowrap">GADGETS</button>
        <button onclick="filterTag('Gaming')" id="filterGaming" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-amber-400 font-mono text-xs rounded transition whitespace-nowrap">GAMING</button>
        <button onclick="filterTag('Review')" id="filterReview" class="px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 text-purple-400 font-mono text-xs rounded transition whitespace-nowrap">GAME REVIEWS</button>
        <button onclick="refreshLiveNews(this)" title="ดึงข้อมูลข่าวล่าสุด" class="p-1.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 rounded transition ml-1 shrink-0">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
      </div>

    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="newsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Cards rendered here -->
    </div>
  </main>

  <!-- Top-Pinned Modal Dialog -->
  <div id="modalOverlay" onclick="if(event.target===this) closeModal()" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-start sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
    <div class="w-full max-w-3xl bg-[#0c0c0e] sm:border sm:border-zinc-800 sm:rounded-lg shadow-2xl overflow-hidden my-0 sm:my-auto max-h-screen sm:max-h-[92vh] flex flex-col">
      
      <!-- Modal Header (Sticky) -->
      <div class="flex items-center justify-between px-3.5 sm:px-6 py-3 border-b border-zinc-800 bg-[#0e0e11] sticky top-0 z-10 gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="modalTag" class="px-2 py-0.5 rounded text-[11px] sm:text-xs font-mono font-bold uppercase tracking-wider bg-[#ff3366]/15 text-[#ff3366] border border-[#ff3366]/30 truncate"></span>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <div id="ttsControls" class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button id="ttsBtn" onclick="toggleSpeech()" title="ฟังเสียงอ่านข่าว" class="px-2.5 py-1 text-xs font-mono font-bold text-emerald-400 hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1">
              <span id="ttsIcon">🔊</span>
              <span id="ttsLabel" class="hidden sm:inline">ฟังข่าว</span>
            </button>
            <button id="ttsRateBtn" onclick="cycleSpeechRate()" title="ความเร็วเสียงอ่าน" class="px-2 py-1 text-[11px] font-mono text-zinc-400 hover:text-white hover:bg-zinc-800 rounded-full transition">1x</button>
          </div>
          <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-0.5">
            <button onclick="changeFontSize(-1)" title="ลดขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A-</button>
            <span id="fontSizeLabel" class="hidden sm:inline text-[11px] font-mono text-zinc-500 px-1.5 select-none">100%</span>
            <button onclick="changeFontSize(1)" title="เพิ่มขนาดตัวอักษร" class="px-2 sm:px-2.5 py-1 text-xs font-mono font-bold text-zinc-300 hover:text-white hover:bg-zinc-800 rounded-full transition">A+</button>
          </div>
          <button onclick="closeModal()" aria-label="Close" class="w-8 h-8 rounded-full bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center text-xl transition leading-none">&times;</button>
        </div>
      </div>

      <!-- Modal Body (Always resets to scrollTop = 0) -->
      <div id="modalBody" class="p-5 sm:p-6 md:p-8 overflow-y-auto space-y-5 sm:space-y-6">
        <!-- HD Cover Image (16:9 aspect-video so cover never gets awkwardly cropped) -->
        <div class="w-full aspect-video overflow-hidden rounded-md border border-zinc-800 bg-zinc-950 relative">
          <img id="modalImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" referrerpolicy="no-referrer" alt="" class="w-full h-full object-cover">
          <div id="modalScoreBadge" class="hidden absolute top-3 right-3 bg-[#ff3366] text-white font-mono font-extrabold text-sm px-3 py-1.5 rounded shadow-xl border border-white/20"></div>
        </div>

        <!-- Sub-Tag & Publish Date Row -->
        <div class="flex items-center flex-wrap gap-2 text-xs font-mono text-zinc-400">
          <span id="modalSubTag" class="hidden px-2 py-0.5 rounded text-[11px] font-mono font-semibold uppercase tracking-wider bg-zinc-800 text-zinc-200 border border-zinc-700"></span>
          <span id="modalDate" class="text-xs font-mono text-zinc-400"></span>
        </div>

        <!-- Title -->
        <h2 id="modalTitle" class="brand-title text-xl md:text-2xl font-bold text-white leading-snug"></h2>

        <!-- Key Facts Box -->
        <div class="bg-black/60 border-l-2 border-[#ff3366] p-4 rounded-sm">
          <div class="text-xs font-mono text-[#ff3366] uppercase font-bold tracking-wider mb-2">📌 สรุปประเด็นสำคัญ (KEY FACTS):</div>
          <ul id="modalBullets" class="space-y-2 text-sm text-zinc-200"></ul>
        </div>

        <!-- Video Section (Shown when article has YouTube trailers/videos) -->
        <div id="modalVideoSection" class="hidden space-y-3 pt-1">
          <div class="text-xs font-mono text-red-400 uppercase tracking-widest flex items-center gap-1.5 font-bold">
            <span>🎬 วิดีโอตัวอย่าง / TRAILER ในข่าว :</span>
          </div>
          <div id="modalVideoContainer" class="space-y-4"></div>
        </div>

        <!-- Full Multi-Paragraph Translation with Interleaved Magazine Screenshots -->
        <div class="space-y-4 pt-2">
          <div class="text-xs font-mono text-zinc-500 uppercase tracking-widest">// เนื้อหาฉบับเต็ม :</div>
          <div id="modalFullContent" class="space-y-4 text-zinc-300 text-sm md:text-base leading-relaxed font-light"></div>
        </div>

        <!-- Remaining Screenshots Gallery -->
        <div id="modalGallerySection" class="hidden pt-4 border-t border-zinc-800/80">
          <div class="text-xs font-mono text-amber-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
            <span>📸 ภาพประกอบเพิ่มเติม :</span>
          </div>
          <div id="modalGalleryGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5"></div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 border-t border-zinc-800 bg-[#0e0e11] flex items-center justify-between">
        <a id="modalSource" href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 bg-zinc-900 border border-zinc-700 text-xs font-mono text-white rounded-sm hover:bg-zinc-800 flex items-center gap-1.5 transition">
          <span>อ่านต้นฉบับเต็ม</span>
          <span>→</span>
        </a>
        <button onclick="closeModal()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs font-mono text-zinc-300 rounded-sm transition">ปิด</button>
      </div>

    </div>
  </div>

  <script>
    const TRANSPARENT_GIF = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    const SVG_FALLBACK_URI = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#18181b"/><stop offset="100%" stop-color="#09090b"/>' +
      '</linearGradient></defs>' +
      '<rect width="800" height="450" fill="url(#g)"/>' +
      '<text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" fill="#ff3366" font-family="monospace" font-size="36" font-weight="bold">PURE NEWS</text>' +
      '<text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="16">IMAGE UNAVAILABLE</text>' +
      '</svg>'
    );
    const CATEGORY_FALLBACKS = {
      Football: 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=1200&q=80',
      Technology: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=1200&q=80',
      Gadgets: 'https://images.unsplash.com/photo-1519389950473-47ba0277781c?w=1200&q=80',
      Gaming: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200&q=80',
      Review: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200&q=80'
    };

    const FONT_STEPS = [
      { pct: '85%', body: '0.875rem', bullet: '0.8125rem', title: '1.25rem' },
      { pct: '100%', body: '1rem', bullet: '0.875rem', title: '1.5rem' },
      { pct: '115%', body: '1.125rem', bullet: '1rem', title: '1.65rem' },
      { pct: '130%', body: '1.25rem', bullet: '1.0625rem', title: '1.8rem' },
      { pct: '150%', body: '1.4rem', bullet: '1.15rem', title: '2rem' }
    ];
    let currentFontIdx = 1;
    try {
      const savedIdx = parseInt(localStorage.getItem('pureNewsFontIdx') || '1', 10);
      if (!isNaN(savedIdx) && savedIdx >= 0 && savedIdx < FONT_STEPS.length) {
        currentFontIdx = savedIdx;
      }

วิงแบ็กขวาในระบบนี้ แต่พรสวรรค์ในการเล่นเกมรุกของเขาถูกจำกัดด้วยภาระหน้าที่ในเกมรับที่ระบบนี้ต้องการ", "ในขณะที่ สตีฟ คลาร์ก เคยใช้ระบบหลังห้าในช่วงแรกเพื่อรองรับทั้ง แอนดี โรเบิร์ตสัน และ จอห์น แม็กกินน์ แต่เขาก็กลับมาใช้ระบบหลังสี่แบบดั้งเดิมในเวลาต่อมา ทีมของคลาร์กอาจไม่ได้เล่นสนุกตื่นตาตื่นใจเสมอไป แต่พวกเขาก็ทำหน้าที่ได้สำเร็จเกือบทุกครั้ง", "คำถามสำหรับโปโกญอลีคือ เขาควรจะยึดมั่นในหลักการของตัวเองต่อไป หรือควรหันไปดูสิ่งที่กุนซือคนก่อนทำจนประสบความสำเร็จและสร้างความสุขให้แฟนบอลได้อีกครั้ง หลังจากผ่านไปสองแคมป์และ 6 นัด ช่วงเวลาแห่งการปรับตัวของกุนซือชาวเบลเยียมรายนี้ได้หมดลงแล้ว", "เวลาในการทำงานร่วมกับนักเตะเป็นสิ่งที่ผู้จัดการทีมชาติไม่มี แต่โปโกญอลีได้รับเวลามากกว่าคนอื่นด้วยซ้ำ จากช่วงพักเบรกทีมชาติที่ยาวนานระหว่างเดือนกันยายนถึงตุลาคม และแคมป์ล่าสุด ทำให้เขามีเวลารวมกับลูกทีมถึง 24 วัน ซึ่งเทียบเท่ากับเวลาที่สโมสรในสกอตติชพรีเมียร์ชิพมีตั้งแต่วันแรกของการปรีซีซั่นจนถึงเกมแรกในลีกคัพ", "แอนดี โรเบิร์ตสัน กลายเป็นนักเตะที่ติดทีมชาติสกอตแลนด์มากที่สุดในประวัติศาสตร์ในเกมที่พบกับสวิตเซอร์แลนด์ แต่กัปตันทีมรายนี้กลับไม่มีอะไรให้เฉลิมฉลอง 'สิ่งนั้นไม่ควรเกิดขึ้นในฟุตบอลระดับทีมชาติ' เขากล่าวกับ BBC Scotland หลังจบเกม", "'ผมไม่คิดว่าคุณจะมีเวลามากนักในฟุตบอลระดับทีมชาติ คุณต้องทำมันให้ได้ แฟนบอลที่เดินทางไปเชียร์ทุกที่ พวกเขาจะให้เวลาเราไหม? ไม่เลย คนที่อยู่ในแฮมป์เดนจะให้เวลาเราไหม? ไม่ คนที่อยู่นอกแฮมป์เดนที่จะวิจารณ์เรา ซึ่งก็สมควรแล้ว พวกเขาจะให้เวลาเราไหม? ไม่ เราไม่มีเวลา นักเตะไม่มีเวลา เราต้องก้าวข้ามมันไปให้ได้'", "จอห์น แม็กกินน์ กล่าวเสริมกัปตันทีมเมื่อถูกถามว่าสกอตแลนด์กำลังเดินมาถูกทางหรือไม่ว่า 'ก็นะ เห็นได้ชัดว่าผลลัพธ์ที่ออกมามันเป็นไปไม่ได้เลยที่ผมจะตอบว่าใช่'", "โปรแกรมทีมชาตินัดถัดไปจะมีขึ้นในเดือนมีนาคม โดยจะมีเกมอุ่นเครื่องสองนัดก่อนที่รอบคัดเลือกยูโร 2028 จะเริ่มต้นขึ้น โรเบิร์ตสันยอมรับว่าการรอคอยที่ยาวนานนี้ 'ไม่ใช่เรื่องดี' ในขณะที่พวกเขาต้องพยายามรวมพลังกันใหม่หลังจากความผิดหวังในเนชันส์ลีก", "แม้ว่าจะไม่มีเวลาในสนามซ้อมกับนักเตะ แต่โปโกญอลีจะมีเวลาในการประเมินขุมกำลังและแท็กติกของเขา หากสมาคมฟุตบอลสกอตแลนด์ตัดสินใจว่าเขายังคงเป็นคนที่ใ ี้", "ปัจจุบันในวัย 36 ปี บาโลเตลลี่ยังคงค้าแข้งอยู่ในลีกสูงสุดของสหรัฐอาหรับเอมิเรตส์กับสโมสร อัล-อิตติฟาค"], "full_paragraphs": ["คำนิยามอย่าง 'จอมนอกคอก', 'ตัวปัญหา' หรือ 'ควบคุมไม่ได้' คือสิ่งที่ มาริโอ บาโลเตลลี่ ต้องเผชิญมาตลอดชีวิตการค้าแข้ง เขาอาจเป็นที่รู้จักจากวีรกรรมนอกสนามมากกว่าพรสวรรค์ที่ปฏิเสธไม่ได้ แต่กลับถูกมองว่าเสียของไปอย่างน่าเสียดาย ซึ่งดาวยิงชาวอิตาลีรายนี้มักจะตกเป็นพาดหัวข่าวอยู่เสมอ", "เวลาผ่านไป 15 ปีแล้วนับตั้งแต่การฉลองประตูอันโด่งดังด้วยเสื้อ 'Why always me?' (ทำไมต้องเป็นฉันเสมอ?) ในเกมแมนเชสเตอร์ดาร์บี้ ซึ่งเกิดขึ้นเพียงไม่กี่วันหลังจากที่เขาจุดพลุในห้องน้ำจนเกิดไฟไหม้บ้านพัก ปัจจุบันในวัย 36 ปี เขายังคงลงเล่นฟุตบอลอาชีพในลีกสูงสุดของสหรัฐอาหรับเอมิเรตส์กับสโมสร อัล-อิตติฟาค เคียงข้างกับ เอ็นอ็อค บาร์วูอาห์ พี่ชายแท้ๆ ของเขา", "BBC Sport จะพาไปย้อนดูเส้นทางอาชีพที่ผ่านสโมสรมาแล้วถึง 13 แห่ง ใน 6 ประเทศ รวมถึงการเป็นผู้จ่ายบอลให้เกิดประตูที่โด่งดังที่สุดในประวัติศาสตร์พรีเมียร์ลีก โดยเส้นทางของบาโลเตลลี่ไม่ได้เริ่มต้นจากอะคาเดมี่ของสโมสรยักษ์ใหญ่ แต่เขาเริ่มต้นจากการเล่นให้ ลูเมซซาเน่ ทีมในระดับดิวิชั่น 3 ของอิตาลี ใกล้บ้านเกิดในคอนเชซิโอ ก่อนจะไปทดสอบฝีเท้ากับ บาร์เซโลน่า แต่ไม่สำเร็จ และย้ายไปร่วมทีม อินเตอร์ มิลาน ในปี 2006", "ที่อินเตอร์ มิลาน บาโลเตลลี่ได้พบกับ โรแบร์โต้ มันชินี่ ผู้เป็นดั่งอาจารย์ใหญ่ ความสัมพันธ์ของทั้งคู่เปรียบเสมือนพ่อกับลูก ภายใต้การดูแลของกุนซือชาวอิตาลี บาโลเตลลี่ฉายแววโดดเด่นตั้งแต่อายุ 17 ปี โดยช่วยให้ทีมคว้าแชมป์กัลโช่ เซเรีย อา ฤดูกาล 2007-08 และเข้าถึงรอบชิงชนะเลิศโคปปา อิตาเลีย รวมถึงการทำ 2 ประตูใส่ ยูเวนตุส ในรอบก่อนรองชนะเลิศ", "ชีวิตของเขาเปลี่ยนไปเมื่อ โชเซ่ มูรินโญ่ เข้ามารับตำแหน่งต่อจากนั้น ไม่นานก็เกิดความขัดแย้งและการลงโทษทางวินัย โดยมูรินโญ่กล่าวว่าบาโลเตลลี่เป็นนักเตะที่ 'ควบคุมไม่ได้' และเคยวิจารณ์ฟอร์มการเล่นของเขาว่า 'ใกล้เคียงกับศูนย์' ความสัมพันธ์กับมูรินโญ่เต็มไปด้วยความตึงเครียด ซึ่งถือเป็นเรื่องยากที่กุนซือระดับ 'เดอะ สเปเชียล วัน' จะรับมือกับนักเตะคนหนึ่งไม่ได้ แม้บาโลเตลลี่จะคว้าแชมป์เซเรีย อา 3 สมัย และยูฟ่า แชมเปี้ยนส์ลีก กับอินเตอร์ แต่ชื่อเสียงในฐานะตัวปัญหาก็เริ่มบดบังผลงานในสนามของเขา", "ในเดือนสิงหาคม 2010 บาโลเตลลี่ย้ายไปร่วมทีม แมนเชสเตอร์ ซิตี้ เพื่อกลับมาร่วมงานกับมันชินี่อีกครั้ง กุนซือชาวอิตาลีพยายามพิสูจน์ว่าเขาสามารถควบคุมความคาดเดาไม่ได้ของบาโลเตลลี่ให้เป็นประโยชน์ต่อทีมได้ แต่ถึงกระนั้น บาโลเตลลี่ก็ยังคงสร้างประเด็นไม่หยุดหย่อน ทั้งการถูกใบแดง การขับรถชน และวีรกรรมปาปาเป้าใส่ผู้เล่นทีมเยาวชน ซึ่งแสดงให้เห็นถึงความไม่เป็นผู้ใหญ่", "หลังจากช่วยให้ แมนเชสเตอร์ ซิตี้ คว้าแชมป์เอฟเอ คัพ ในปี 2011 ซึ่งเป็นการสิ้นสุดการรอคอยถ้วยรางวัลใหญ่ในรอบ 35 ปี บาโลเตลลี่ก็ถูกวิจารณ์อย่างหนักจากการพยายามยิงท่าตอกส้นในเกมอุ่นเครื่องกับ แอลเอ กาแล็กซี่ จนมันชินี่ต้องเปลี่ยนตัวออกและตั้งคำถามถึงทัศนคติของเขาว่า 'ถ้าคุณจริงจัง คุณก็เล่นได้ 90 นาที แต่ถ้าไม่ คุณก็มานั่งข้างผมที่ม้านั่งสำรองได้เลย'", "บางครั้งความกล้าบ้าบิ่นของเขาก็ได้ผล เช่น ประตูที่ใช้หัวไหล่กระแทกเข้าประตูในเกมกับ นอริช ซิตี้ แต่ในเดือนตุลาคม 2011 เขาก็ตกเป็นข่าวใหญ่เมื่อหน่วยดับเพลิงต้องเข้าไประงับเหตุไฟไหม้ในห้องน้ำที่บ้านพักของเขา โดยบาโลเตลลี่อ้างว่าเป็นฝีมือของเพื่อน แต่ไม่กี่วันต่อมาเขาก็กลายเป็นฮีโร่ด้วยการทำประตูแรกในเกมที่ถล่ม แมนเชสเตอร์ ยูไนเต็ด 6-1 พร้อมโชว์เสื้อ 'Why always me?'", "มีเรื่องเล่ามากมายเกี่ยวกับเขา ทั้งการให้เงินคนไร้บ้าน 1,000 ปอนด์, การบุกไปที่โรงเรียนเพื่อจัดการกับเด็กที่รังแกนักเรียนคนอื่น หรือการขับรถแต่งตัวเป็นซานตาคลอสแจกของขวัญ ซึ่งแม้เจ้าตัวจะปฏิเสธหลายเรื่อง แต่ด้วยชื่อเสียงในตอนนั้นทำให้คนเชื่อว่าเป็นเรื่องจริง แฟนบอลซิตี้ถึงกับแต่งเพลงเชียร์ล้อเลียนอาการแพ้หญ้าของเขา และพฤติกรรมที่ชอบพกเงินสดเต็มกระเป๋าขับรถไปทั่วเมือง", "ในเดือนเมษายน 2012 บาโลเตลลี่ถูกใบแดงในเกมกับ อาร์เซน่อล ซึ่งดูเหมือนจะเป็นจุดจบของความหวังในการคว้าแชมป์ แต่หนึ่งเดือนต่อมา เขากลับเป็นคนแอสซิสต์ให้ เซร์คิโอ อเกวโร่ ทำประตูชัยในนาทีสุดท้ายในเกมกับ ควีนส์ปาร์ค เรนเจอร์ส ซึ่งทำให้ซิตี้คว้าแชมป์พรีเมียร์ลีกสมัยแรกได้สำเร็จ", "มิคาห์ ริชาร์ดส์ อดีตเพื่อนร่วมทีมกล่าวว่า 'เขาบ้าในทางที่ดี เขาเป็นสีสันของทีม เป็นฮีโร่ของแฟนบอลไม่ใช่แค่เรื่องนอกสนาม แต่ในสนามด้วย สิ่งที่ดีที่สุดคือเขาเป็นคนน่ารัก ไม่ได้หยิ่งผยองอย่างที่สื่อพยายามนำเสนอ เขาแค่บ้าๆ บอๆ นิดหน่อยเท่านั้น'", "อย่างไร eve-clarkes-side", "cover_image_url": "https://e0.365dm.com/26/11/1920x1080/skysports-scotland-sebastien_7408198.jpg?20261116220749", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794872580, "published_at": "2026-11-16T23:43:00Z", "published_th": "17 พ.ย. 2026 • 06:43 น.", "category_hint": "Football"}, {"id": 1794868254109, "guid": "https://www.skysports.com/football/switzerland-vs-scotland/report/554127", "original_title": "Scotland suffer heavy defeat in Switzerland as Robertson breaks caps record", "thai_title": "สกอตแลนด์พ่ายยับสวิตเซอร์แลนด์ 0-4 ปิดฉากเนชันส์ลีก พร้อมสถิติใหม่ของ โรเบิร์ตสัน", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["สกอตแลนด์บุกพ่ายสวิตเซอร์แลนด์ 0-4 ในศึกยูฟ่า เนชันส์ลีก กลุ่ม B1 ทำให้พลาดโอกาสลุ้นเพลย์ออฟ", "แอนดี โรเบิร์ตสัน สร้างประวัติศาสตร์ลงสนามรับใช้ทีมชาติสกอตแลนด์ครบ 103 นัด มากที่สุดตลอดกาล", "ทีมของ เซบาสเตียน โปโกญอลี จบอันดับ 3 ของกลุ่ม ทำให้เส้นทางสู่ยูโร 2028 ยากลำบากขึ้นจากการเสียโอกาสวางอันดับโถจับสลาก", "สถานการณ์ของกุนซือชาวเบลเยียมเริ่มสั่นคลอน หลังทำผลงานชนะเพียง 2 นัดจาก 6 เกมในรายการนี้"], "full_paragraphs": ["ทีมชาติสกอตแลนด์ประสบความพ่ายแพ้อย่างหนักในเกมเยือนสวิตเซอร์แลนด์ด้วยสกอร์ 0-4 ในศึกยูฟ่า เนชันส์ลีก กลุ่ม B1 ส่งผลให้พวกเขาพลาดโอกาสในการผ่านเข้าสู่รอบเพลย์ออฟ และทำให้เส้นทางสู่การแข่งขันฟุตบอลยูโร 2028 มีความท้าทายมากขึ้นกว่าเดิม", "ในค่ำคืนที่ แอนดี โรเบิร์ตสัน สร้างประวัติศาสตร์หน้าใหม่ด้วยการลงสนามรับใช้ทีมชาติสกอตแลนด์เป็นนัดที่ 103 ซึ่งเป็นสถิติสูงสุดตลอดกาลของทีมชาติ แต่ผลการแข่งขันที่สนามในเมืองเซนต์กัลเลนกลับกลายเป็นฝันร้ายสำหรับ เซบาสเตียน โปโกญอลี กุนซือของทีมที่กำลังเผชิญกับความกดดันอย่างหนัก", "ทัพสกอตแลนด์เริ่มต้นเกมได้อย่างสูสีกับทีมเจ้าบ้านที่การันตีแชมป์กลุ่มไปก่อนหน้านี้แล้ว จนกระทั่งในนาทีที่ 22 ลูอิส เฟอร์กูสัน กองกลางของทีมโชคร้ายสกัดบอลเข้าประตูตัวเอง ทำให้สวิตเซอร์แลนด์ขึ้นนำ 1-0", "ความผิดพลาดดังกล่าวส่งผลกระทบต่อสภาพจิตใจของผู้มาเยือนอย่างเห็นได้ชัด ประกอบกับการที่ อารอน ฮิกกีย์ วิงแบ็กตัวเก่งได้รับบาดเจ็บจนต้องถูกเปลี่ยนตัวออกก่อนจบครึ่งแรก สถานการณ์ของสกอตแลนด์ยิ่งเลวร้ายลงในนาทีที่ 47 เมื่อ วินสลีย์ โบเตลี ยิงประตูให้เจ้าบ้านหนีห่างเป็น 2-0 ตามด้วย อัลวิน ซานเชส ที่ซัดประตูที่สามในอีก 4 นาทีต่อมา และปิดท้ายด้วยประตูจากตัวสำรองอย่าง เซกี อัมดูนี ในช่วงท้ายเกม", "สกอตแลนด์จบการแข่งขันในอันดับที่ 3 ของกลุ่ม ตามหลังสวิตเซอร์แลนด์และสโลวีเนีย โดยเก็บได้เพียง 7 คะแนนจาก 6 นัด ทำให้พลาดโอกาสในการลุ้นเลื่อนชั้นผ่านรอบเพลย์ออฟ และส่งผลเสียต่อการจัดอันดับโถจับสลากในรอบคัดเลือกฟุตบอลชิงแชมป์แห่งชาติยุโรปที่จะมีขึ้นในเดือนหน้า", "ผลงานในแคมเปญแรกของกุนซือชาวเบลเยียมผู้เข้ามารับช่วงต่อจาก สตีฟ คลาร์ก ถือว่าน่าผิดหวังอย่างยิ่ง โดยทำได้เพียงชนะ 2 นัด ซึ่งเป็นการชนะทีมบ๊วยอย่าง นอร์ทมาซิโดเนีย ทั้งสองนัด จากการลงเล่นทั้งหมด 6 นัด ทำให้ตอนนี้ โปโกญอลี กำลังตกเป็นเป้าสายตาและถูกวิพากษ์วิจารณ์อย่างหนักเพียงไม่กี่เดือนหลังเข้ารับตำแหน่ง", "แอนดี โรเบิร์ตสัน กัปตันทีมชาติสกอตแลนด์ กล่าวกับ BBC Sport หลังจบเกมว่า: 'ในครึ่งแรกเรายังอยู่ในเกม แต่เรากลับเสียประตูที่งี่เง่า ผมคิดว่าเรามีโอกาสและน่าจะตีเสมอเป็น 1-1 ได้ตั้งแต่ก่อนจบครึ่งแรก'", "'เราคุยกันในช่วงพักครึ่ง เราบอกตัวเองให้สู้ต่อ แต่พอถึงนาทีที่ 50 เรากลับตามหลัง 0-3? สิ่งนี้ไม่ควรเกิดขึ้นในฟุตบอลระดับนานาชาติ นั่นคือสิ่งที่เกิดขึ้นในคืนนี้ เรากำลังเล่นกับทีมที่ดี แต่ในเมื่อเราอยู่ในเกมได้ในครึ่งแรก คุณต้องรักษามาตรฐานนั้นให้ได้ตลอด 90 นาที พอตามหลัง 0-3 ที่นี่มันเป็นงานที่ยากมาก เป็นค่ำคืนที่หนักหนาสาหัสสำหรับเราจริงๆ'", "'ผมไม่คิดว่าเราจะมีเวลามากนักในฟุตบอลระดับนานาชาติ คุณต้องทำให้ได้ แฟนบอลที่เดินทางตามมาเชียร์ทุกที่ พวกเขาจะให้เวลาเราไหม? ไม่เลย คนที่อยู่ในสนามแฮมป์เดนจะให้เวลาเราไหม? ไม่เลย แล้วคนที่อยู่ข้างนอกแฮมป์เดนที่จะวิจารณ์เรา ซึ่งก็สมควรแล้วล่ะ พวกเขาจะให้เวลาไหม? ก็ไม่เช่นกัน'", "'เราไม่มีเวลา นักเตะไม่มีเวลา เราต้องยกระดับตัวเองขึ้นมา ตอนนี้เรามีช่วงพักยาวไปจนถึงเดือนมีนาคม ซึ่งไม่ใช่เรื่องดีนัก และมันเป็นสิ่งที่ยากจะยอมรับจริงๆ เราจำเป็นต้องยกระดับตัวเองอีกครั้ง เพราะในฟุตบอลระดับนานาชาติ คุณไม่มีเวลาให้รอคอยหรอก'"], "link": "https://www.skysports.com/football/switzerland-vs-scotland/report/554127", "canonical_link": "https://www.skysports.com/football/switzerland-vs-scotland/report/554127", "cover_image_url": "https://e2.365dm.com/26/11/1920x1080/skysports-scotland-switzerland_7408139.jpg?20261116210244", "gallery_images": ["https://e0.365dm.com/26/11/768x432/skysports-scotland-switzerland_7408110.jpg?20261116202357", "https://e0.365dm.com/26/11/768x432/skysports-scotland-switzerland_7408196.png?20261116220706", "https://e0.365dm.com/26/11/768x432/skysports-andy-robertson-scotland_7408195.jpg?20261116220646"], "videos": [], "review_score": "", "published_ts": 1794864900, "published_at": "2026-11-16T21:35:00Z", "published_th": "17 พ.ย. 2026 • 04:35 น.", "category_hint": "Football"}, {"id": 1794864676663, "guid": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "original_title": "Rice verbally agrees new Arsenal contract", "thai_title": "ดีแคลน ไรซ์ ตกลงเงื่อนไขสัญญาฉบับใหม่กับ อาร์เซนอล ด้วยวาจาแล้ว", "tag": "Football", "sub_tag": "ARSENAL", "bullet_points": ["ดีแคลน ไรซ์ บรรลุข้อตกลงด้วยวาจาในการต่อสัญญาฉบับใหม่ระยะยาวกับ อาร์เซนอล", "ค่าเหนื่อยในสัญญาฉบับใหม่จะปรับขึ้นให้เท่ากับ บูกาโย ซากา ซึ่งเป็นนักเตะที่รับค่าเหนื่อยสูงสุดของสโมสร", "ไรซ์ย้ายจาก เวสต์แฮม มาร่วมทีมด้วยค่าตัวสถิติสโมสร 105 ล้านปอนด์ในปี 2023 และกลายเป็นหัวใจสำคัญในทีมของ มิเกล อาร์เตตา", "ในขณะที่ มาร์ติน โอเดการ์ด กัปตันทีมยืนยันว่ายังไม่ได้เริ่มเจรจาสัญญาฉบับใหม่ แม้สัญญาปัจจุบันจะเหลือเวลาเท่ากับไรซ์ก็ตาม"], "full_paragraphs": ["ดีแคลน ไรซ์ ได้บรรลุข้อตกลงด้วยวาจาเกี่ยวกับเงื่อนไขในสัญญาฉบับใหม่ระยะยาวกับ อาร์เซนอล แล้ว ตามรายงานจาก สกาย สปอร์ตส์ นิวส์", "แหล่งข่าวระบุว่า สัญญาฉบับใหม่นี้จะทำให้ไรซ์ได้รับค่าเหนื่อยในระดับเดียวกับ บูกาโย ซากา ซึ่งปัจจุบันเป็นนักเตะที่รับค่าเหนื่อยสูงสุดในถิ่น เอมิเรตส์ สเตเดียม", "ไรซ์และตัวแทนของเขาได้ดำเนินการเจรจากับสโมสรมาเป็นเวลาหลายเดือน โดยทาง อาร์เซนอล มีความต้องการอย่างยิ่งที่จะรั้งตัวหนึ่งในนักเตะคนสำคัญที่สุดของทีมเอาไว้ แม้ว่าสัญญาฉบับปัจจุบันจะยังเหลือเวลาอีก 18 เดือน พร้อมเงื่อนไขขยายสัญญาเพิ่มได้อีก 1 ปีก็ตาม", "ไรซ์ได้รับเลือกให้เป็นนักเตะยอดเยี่ยมแห่งปีของ อาร์เซนอล ในฤดูกาลที่ผ่านมา ซึ่งเป็นปีที่ทีมคว้าแชมป์พรีเมียร์ลีก และสัญญาฉบับใหม่นี้จะครอบคลุมช่วงเวลาการค้าแข้งของเขาไปจนถึงช่วงต้นวัย 30 ปี", "กองกลางวัย 27 ปีรายนี้ ย้ายจาก เวสต์แฮม มาร่วมทีม อาร์เซนอล ด้วยค่าตัวสถิติสโมสร 105 ล้านปอนด์ในปี 2023 เขาได้กลายเป็นสมาชิกคนสำคัญในกลุ่มผู้นำของ มิเกล อาร์เตตา และเป็นนักเตะที่กุนซือชาวสเปนรายนี้ใช้เป็นศูนย์กลางในการสร้างทีม", "ในการให้สัมภาษณ์เมื่อวันเสาร์ที่ผ่านมา ก่อนเกมเนชันส์ลีกนัดสุดท้ายของทีมชาติอังกฤษในสเปน ไรซ์ได้ยืนยันว่าเขากำลังใกล้ที่จะบรรลุข้อตกลงดังกล่าว", "ไรซ์กล่าวว่า 'ผมเป็นนักเตะที่ตั้งเป้าหมายให้ตัวเองเสมอ และผลักดันตัวเองให้ดียิ่งขึ้น ผมมีความมั่นคงกับสโมสรที่ผมอยู่มาโดยตลอด หวังว่าสัญญาฉบับใหม่จะเกิดขึ้นในเร็วๆ นี้'", "'ผมโชคดีมากที่ได้อยู่กับสโมสรอย่าง อาร์เซนอล ที่ผู้จัดการทีมแสดงความเชื่อมั่นในตัวผมอย่างมาก ผมมีเพื่อนร่วมทีมหลายคนที่ทุ่มเทพลังและความพยายามให้กับผมอย่างเต็มที่ ผมโชคดีมากที่ไม่ต้องกังวลเกี่ยวกับเรื่องเหล่านั้น มันทำให้การเล่นฟุตบอลเป็นเรื่องที่ง่ายขึ้นมาก'", "ในขณะเดียวกัน มาร์ติน โอเดการ์ด อีกหนึ่งกำลังสำคัญในทีมตัวจริงของ อาร์เซนอล ได้กล่าวว่าเขายังไม่ได้เริ่มการเจรจาสัญญาฉบับใหม่ แม้ว่าสัญญาปัจจุบันของเขาจะหมดลงในช่วงเวลาเดียวกับของไรซ์ก็ตาม", "กัปตันทีม อาร์เซนอล กล่าวระหว่างเก็บตัวกับทีมชาตินอร์เวย์ว่า 'ผมมีความสุขและหวังว่าจะได้อยู่ที่นี่ไปอีกนาน แต่จนถึงตอนนี้เรายังไม่ได้เริ่มคุยเรื่องนั้นกัน'", "'ไม่มีความกดดันอะไรเกี่ยวกับเรื่องนี้ ผมอยู่ในจุดที่ผมอยู่ และผมมีความสุขกับมันมาก ทุกอย่างกำลังไปได้สวย และมันไม่ใช่สิ่งที่ผมต้องกังวล อย่างที่ผมบอกไป ผมต้องการอยู่ที่นี่ไปอีกนาน ผมมีความสุขกับช่วงเวลานี้มาก'"], "link": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "canonical_link": "https://www.skysports.com/football/news/11095/13612986/declan-rice-contract-arsenal-midfielder-verbally-agrees-new-320000-a-week-deal-with-the-premier-league-champions", "cover_image_url": "https://e1.365dm.com/26/10/1920x1080/skysports-declan-rice-arsenal_7383215.jpg?20261021214729", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794863520, "published_at": "2026-11-16T21:12:00Z", "published_th": "17 พ.ย. 2026 • 04:12 น.", "category_hint": "Football"}, {"id": 1794864676665, "guid": "https://www.skysports.com/football/news/11095/13612984/wales-vs-portugal-no-cristiano-ronaldo-for-the-visitors-as-craig-bellamys-side-have-a-free-hit-in-final-nations-league-encounter", "original_title": "Wales have a free hit against Ronaldo-less Portugal", "thai_title": "เวลส์เตรียมดวลโปรตุเกสไร้เงา โรนัลโด ในศึกเนชันส์ลีก", "tag": "Football", "sub_tag": "PREMIER LEAGUE", "bullet_points": ["ทีมชาติเวลส์เตรียมเปิดบ้านพบกับโปรตุเกสในศึกเนชันส์ลีก โดยไร้เงา คริสเตียโน โรนัลโด ที่ประกาศอำลาทีมชาติไปแล้ว", "เคร็ก เบลลามี กุนซือทีมชาติเวลส์ ยกย่อง โรนัลโด ว่าเป็นหนึ่งในนักเตะที่เก่งที่สุดตลอดกาลและรู้สึกเป็นเกียรติที่ได้คุมทีมเผชิญหน้ากับเขา", "เบน เดวีส์ กัปตันทีมเวลส์ ยอมรับแบบติดตลกว่าการไม่ต้องดวลกับ โรนัลโด ถือเป็นเรื่องดีสำหรับทีม", "เวลส์ตั้งเป้าเก็บผลการแข่งขันที่ดีเพื่อปิดฉากรอบแบ่งกลุ่ม แม้จะจบอันดับสุดท้ายของกลุ่มแต่ยังมีโอกาสลุ้นเพลย์ออฟเพื่อรักษาพื้นที่ในลีก A ต่อไป"], "full_paragraphs": ["ทีมชาติเวลส์มีคิวลงสนามพบกับโปรตุเกสในศึกเนชันส์ลีกวันอังคารนี้ โดยทีมเยือนจะไม่มี คริสเตียโน โรนัลโด ยอดดาวยิงระดับตำนานที่ประกาศอำลาทีมชาติไปแล้ว ซึ่ง เบน เดวีส์ กัปตันทีมเวลส์ยอมรับว่ารู้สึกยินดีที่กองหน้ารายนี้ไม่ได้อยู่ในทีมโปรตุเกสชุดนี้ ขณะที่ เคร็ก เบลลามี ผู้จัดการทีมเวลส์ไม่ได้แสดงท่าทีตื่นเต้นกับประเด็นดังกล่าวมากนัก", "สนามคาร์ดิฟฟ์ ซิตี้ สเตเดียม ขายบัตรเข้าชมจนหมดเกลี้ยงอย่างรวดเร็วเมื่อทราบผลการจับสลากว่าเวลส์จะต้องพบกับโปรตุเกสในนัดสุดท้ายของกลุ่ม D ซึ่งแฟนบอลต่างตั้งตารอวันที่ 17 พฤศจิกายน 2026 เพราะนี่อาจเป็นโอกาสสุดท้ายที่จะได้เห็น คริสเตียโน โรนัลโด ลงเล่นบนแผ่นดินสหราชอาณาจักร", "นี่ควรจะเป็นโอกาสอันยอดเยี่ยมในการได้เห็นหนึ่งในนักเตะที่ยิ่งใหญ่ที่สุดของโลกในช่วงท้ายของอาชีพค้าแข้งระดับทีมชาติ และยังเป็นการพิสูจน์ว่าเวลส์พัฒนาไปถึงระดับไหนหลังจากผ่านการแข่งขันในลีก A ซึ่งเป็นลีกสูงสุดของยุโรปมาตลอดทั้งทัวร์นาเมนต์ แต่เหตุการณ์กลับไม่เป็นเช่นนั้น เมื่อ โรนัลโด ไม่ได้ลงเล่นให้โปรตุเกสอีกเลยนับตั้งแต่เกมที่พบกับเวลส์ในลิสบอนช่วงต้นรายการ และเขาก็ได้ประกาศยุติเส้นทางทีมชาติท่ามกลางประเด็นดราม่า", "แม้ โรนัลโด จะไม่ได้มาที่เวลส์และบทสรุปการอำลาทีมชาติของเขาอาจไม่ได้สวยงามนัก แต่เขาก็เป็นที่จดจำของใครหลายคน โดย เคร็ก เบลลามี กุนซือเวลส์กล่าวว่า: \"ทันทีที่เขาประกาศรีไทร์ ทุกอย่างก็ดูวุ่นวายไปหมด เขาคือหนึ่งในนักเตะที่เก่งที่สุดเท่าที่เคยมีมา เราทุกคนจะคิดถึงเขา ตอนนี้เขายังเล่นในระดับสโมสร ดังนั้นเรายังพอมีโอกาสได้เห็นเขาเล่นอยู่บ้าง\"", "เบลลามีกล่าวเสริมว่า: \"จงรู้สึกขอบคุณที่คุณได้เห็นพรสวรรค์อันน่าเหลือเชื่อที่คุณสามารถเรียกได้ว่าเป็นของคุณ นี่คือสิ่งที่ผมพูดกับชาวโปรตุเกส แต่ผมรู้สึกขอบคุณที่เราได้เห็นความยืนหยัดของยอดนักเตะผู้ยิ่งใหญ่คนหนึ่ง ซึ่งสร้างผลกระทบอย่างมหาศาลต่อวงการฟุตบอลโดยรวม และจะยังคงสร้างแรงบันดาลใจให้กับเด็กๆ ที่เฝ้าดูเขาต่อไป ผมรู้สึกว่าตอนนี้ควรหยุดพูดแล้วหันมาเฉลิมฉลองกันดีกว่า ผมรู้สึกขอบคุณที่ได้เห็นเขาเล่นและขอบคุณที่ได้มีโอกาสคุมทีมเผชิญหน้ากับเขาด้วย\"", "ด้าน เบน เดวีส์ กัปตันทีมเวลส์เผยความรู้สึกในมุมมองของนักเตะฝั่งตรงข้ามด้วยรอยยิ้มว่า: \"เกมไหนที่คุณไม่ต้องเจอกับ คริสเตียโน โรนัลโด ผมคิดว่ามันเป็นเรื่องดีสำหรับคุณมากกว่า\" เดวีส์กล่าวด้วยความถ่อมตัวก่อนเสริมว่า: \"คุณไม่ต้องกังวลว่าเขาจะทำอะไรคุณได้บ้างในวันนั้น เขาคือนักเตะระดับโลก มันเป็นเกียรติและสิทธิพิเศษที่ได้แชร์สนามร่วมกับเขาเพราะสิ่งที่เขาทำไว้ในวงการฟุตบอล เราโชคดีที่ได้ทำแบบนั้นในลิสบอน แต่คงไม่มีนักเตะเวลส์คนไหนบ่นหรอกที่เขาไม่ได้มาที่นี่\"", "แม้เกมระหว่างเวลส์กับโปรตุเกสจะมีความสำคัญต่อทั้งสองชาติ แต่คำถามส่วนใหญ่ในงานแถลงข่าวกลับพุ่งเป้าไปที่ โรนัลโด มากกว่าประเด็นอื่น ทั้งนักข่าวเวลส์ อังกฤษ และโปรตุเกส ต่างก็ถามถึงการหายไปของเจ้าของเสื้อหมายเลข 7 รายนี้ ซึ่งเป็นเรื่องน่าเสียดายสำหรับแฟนบอลเกือบ 35,000 คนในสนามคาร์ดิฟฟ์ ซิตี้ สเตเดียม ที่หวังจะได้เห็นการอำลาสนามของยอดนักเตะรายนี้", "อย่างไรก็ตาม สิ่งที่แฟนบอลจะได้เห็นคือทีมโปรตุเกสที่เต็มไปด้วยนักเตะพรสวรรค์ ซึ่งคุณภาพและความลึกของขุมกำลังในหน้ากระดาษนั้นถือว่าน่าเหลือเชื่อ แต่ทีมชุดนี้เพิ่งจะบอบช้ำมาจากการพ่ายแพ้คาบ้านต่อเดนมาร์กถึง 1-4 เมื่อสุดสัปดาห์ที่ผ่านมา", "นี่คือสภาพของโปรตุเกสหากไม่มี โรนัลโด หรือไม่? ผมไม่คิดเช่นนั้น แต่เวลส์มีโอกาสที่จะเล่นแบบไร้ความกดดันในเกมนี้ แม้ผลงานในลีก A จะเก็บชัยชนะได้เพียงนัดเดียว แต่หากไม่นับเกมที่แพ้เดนมาร์กในบ้าน ทีมของเบลลามีก็สามารถต่อกรกับทั้งโปรตุเกสและนอร์เวย์ได้อย่างสูสี", "เบลลามีกล่าวอย่างเสียดายว่ามีหลาย \"จังหวะ\" ในทุกเกมที่เวลส์แสดงให้เห็นถึงคุณภาพและความสม่ำเสมอที่เหนือกว่าคู่แข่ง ซึ่งนำไปสู่ชัยชนะเหนือทีมชาตินอร์เวย์ แต่ในอีก 4 เกมที่เหลือ เวลส์ยังทำได้ไม่ดีพอ แม้จะพยายามอย่างเต็มที่แล้วก็ตาม", "แม้แต่แฟนบอลเวลส์ที่เข้าขั้นแฟนพันธุ์แท้แต่ไม่ใช่ \"แฟนคลับเบลลามี\" ก็ไม่อาจปฏิเสธสถิติที่ชัดเจนได้ เวลส์ครองบอลได้ดีในทุกเกมที่ลงเล่นในลีก A และสร้างโอกาสทำประตูได้มากมาย เช่น 12 ครั้งในเกมที่พบกับนอร์เวย์เมื่อวันเสาร์ที่ผ่านมา บางทีสิ่งที่ขาดหายไปคือเพชฌฆาตหน้าปากประตูที่จะเปลี่ยนโอกาสเหล่านั้นให้เป็นประตูจริงๆ", "สำหรับเบลลามี แคมเปญในลีก A ครั้งนี้ถือว่าประสบความสำเร็จหากมองข้ามผลลัพธ์ระยะสั้น: \"คุณต้องการเผชิญหน้ากับทีมระดับนี้ มันเป็นแรงจูงใจชั้นดีในการเล่นกับทีมเหล่านี้ และแม้แต่ช่วงเวลาที่ไม่เป็นใจ คุณก็ได้เรียนรู้ คุณเข้าใจใช่ไหม? เหมือนกับจังหวะตัดสินเกมเหล่านั้น\"", "\"คุณไม่สามารถพลาดได้เลยใช่ไหม? ในตอนนี้เราทำได้แค่ยิงไปเข้าข้างตาข่าย นั่นคือความแตกต่าง ผมคิดว่าเรานำเสนอเวอร์ชันที่ดีของตัวเองในเกมเหล่านี้ เราแข่งขันได้ดีอย่างแน่นอน และผมคาดหวังให้เราเป็นเช่นนั้น แต่มันติดอยู่ที่รายละเอียดเล็กๆ น้อยๆ ในช่วงท้ายเกม\"", "\"เราสร้างโอกาสทำประตูได้ไหม? ค่า xG ของเราสูงกว่าจำนวนประตูที่ทำได้ นั่นบอกคุณว่าเรากำลังสร้างโอกาสทองได้จริง\" เบลลามีกล่าว \"นั่นคือช่วงเวลาที่สามารถเปลี่ยนฟอร์มการเล่นที่ดีให้กลายเป็นชัยชนะ และผมเชื่อว่าวิธีที่ดีที่สุดคือการได้ลงเล่นกับทีมเหล่านี้เป็นประจำ\"", "ทีมของเบลลามีจะจบอันดับสุดท้ายของกลุ่ม แต่สถิติของพวกเขายังดีกว่าหลายทีมในลีก A เช่น สาธารณรัฐเช็ก เซอร์เบีย และตุรกี ดังนั้นพวกเขาจะไม่ตกชั้นโดยอัตโนมัติ โดยเวลส์จะต้องไปเล่นรอบเพลย์ออฟในเดือนมีนาคมปีหน้ากับทีมอันดับสองจากลีก B ซึ่งเวลส์พร้อมรับมือและมั่นใจในโอกาสของ บการณ์จากการคุม เบรนท์ฟอร์ด มาปรับใช้เพื่อสร้างความมั่นคงและยกระดับทีมให้กลับมาแข่งขันได้อีกครั้ง"], "full_paragraphs": ["คริสตัล พาเลซ กำลังจะกลายเป็นสโมสรที่ 3 ในลอนดอนที่ โธมัส แฟรงค์ เข้ามาคุมทีม ต่อจาก เบรนท์ฟอร์ด และ ท็อตแนม ฮอตสเปอร์", "เมื่อเดือนมิถุนายนที่ผ่านมา โธมัส แฟรงค์ ได้กล่าวไว้ว่า \"เมื่อถึงเวลาที่เหมาะสม ผมจะตั้งตารอการกลับมาทำหน้าที่ผู้จัดการทีมอีกครั้ง พร้อมที่จะทุ่มเทให้กับงานด้วยพลังงานและความมุ่งมั่นอย่างเต็มที่\" และเวลานั้นก็มาถึงแล้ว เมื่อกุนซือชาวเดนมาร์กรายนี้กำลังจะได้รับการประกาศให้เป็นนายใหญ่คนใหม่ของ คริสตัล พาเลซ ทีมที่ปัจจุบันรั้งอันดับบ๊วยของตารางพรีเมียร์ลีก โดยมีแต้มห่างจากโซนปลอดภัยอยู่ 2 คะแนน และมีผลต่างประตูได้เสียที่เป็นรอง", "ก่อนหน้านี้ ปิแอร์ เซจ อดีตหัวหน้าผู้ฝึกสอนของพาเลซ เพิ่งถูกปลดออกจากตำแหน่งเมื่อสัปดาห์ที่ผ่านมา หลังจากคุมทีมไปเพียง 16 นัดรวมทุกรายการ ซึ่งการเข้ามารับงานในครั้งนี้ถือเป็นโอกาสสำคัญที่แฟรงค์จะกู้ชื่อเสียงของตนเองกลับคืนมา หลังจากถูก ท็อตแนม ฮอตสเปอร์ ปลดออกจากตำแหน่งเมื่อเดือนกุมภาพันธ์ที่ผ่านมาหลังคุมทีมได้เพียง 8 เดือน", "ร็อบ กรีน อดีตผู้รักษาประตูทีมชาติอังกฤษและ เวสต์แฮม ยูไนเต็ด กล่าวกับ BBC Sport ว่า \"มันจะเป็นเรื่องที่น่าตกใจสำหรับ โธมัส แฟรงค์ เล็กน้อย เขาเคยประสบความสำเร็จที่ เบรนท์ฟอร์ด ซึ่งเป็นสโมสรที่มีการบริหารจัดการที่ดีเยี่ยม มีการวางแผนและคิดมาอย่างดีในการดึงนักเตะเข้ามาทดแทนคนที่ขายออกไปเพื่อทำกำไร แต่สิ่งนั้นไม่ได้เกิดขึ้นที่ คริสตัล พาเลซ พวกเขาสูญเสียผู้เล่นไปแล้วต้องรีบหาคนมาแทนอย่างฉุกละหุก ทีมชุดนี้ถูกลดทอนคุณภาพลงจากการขายนักเตะออกไปโดยไม่มีใครที่มีคุณภาพเท่าเดิมเข้ามาแทนที่ โธมัส แฟรงค์ จำเป็นต้องค้นหาบางอย่างภายในทีมเพื่อสร้างความเชื่อมั่นว่าพวกเขาสามารถแข่งขันในพรีเมียร์ลีกได้ เพราะในตอนนี้มันดูห่างไกลจากจุดนั้นมาก\"", "นับตั้งแต่ถูกปลดจาก ท็อตแนม ฮอตสเปอร์ หลังคุมทีมในลีกไป 26 นัดเมื่อฤดูกาลที่แล้ว แฟรงค์ว่างเว้นจากการคุมทีมมานานกว่าช่วงเวลาที่เขาคุมทีมสเปอร์สเสียอีก ในช่วงซัมเมอร์เขาเคยออกแถลงการณ์ว่า \"มีการพูดคุยและโอกาสต่างๆ\" เข้ามาให้เขากลับไปทำงาน แต่เขา \"ตัดสินใจที่จะไม่รีบร้อนรับงานถัดไป\"", "พอล โรบินสัน อดีตผู้รักษาประตู ท็อตแนม ฮอตสเปอร์ และทีมชาติอังกฤษ กล่าวว่า \"พาเลซเคยมีหนึ่งในผู้จัดการทีมที่ดีที่สุดเท่าที่พวกเขาเคยมีมา หรืออาจจะดีที่สุดตลอดกาลด้วยซ้ำ ที่พาทีมคว้าถ้วยรางวัลมาครอง ลองดูสิ่งที่พวกเขาทำได้เมื่อฤดูกาลที่แล้วสิ แทนที่จะต่อยอดจากจุดนั้น พวกเขากลับรื้อทีมทิ้ง พวกเขาถอยหลังลงคลอง\"", "แฟรงค์เคยเปรียบเปรยการเป็นผู้จัดการทีมว่าเหมือนการอยู่บน \"วงล้อหนูถีบจักร\" และ \"ละครสัตว์ที่บ้าคลั่ง\" ดังนั้นการที่เขาตัดสินใจกลับมาคุมทีมที่รั้งท้ายตารางในตอนนี้ จึงเป็นเรื่องที่น่าสนใจ โดยแฟรงค์ซึ่งเคยเป็นส่วนหนึ่งของทีมวิเคราะห์ฟุตบอลโลกของ BBC Sport ในช่วงซัมเมอร์ จะกลับมาทำงานด้วยความสดชื่นและพลังงานที่เต็มเปี่ยมหลังจากห่างหายจากวงการไปหลายเดือน", "ระหว่างการรับตำแหน่งที่ เบรนท์ฟอร์ด ในเดือนตุลาคม 2018 จนถึงวันที่ถูกปลดจาก สเปอร์ส เมื่อต้นปีนี้ เขาทำงานโดยไม่มีวันหยุดพักมานานถึง 7 ปีกับอีก 4 เดือน การใช้เวลาช่วงไม่กี่เดือนที่ผ่านมาห่างจากความกดดันของพรีเมียร์ลีก ทำให้แฟรงค์ได้ \"ศึกษา สังเกต และเรียนรู้จากผู้นำคนอื่นๆ ทั้งในและนอกวงการกีฬา\" ตามคำกล่าวของเขาเอง", "แฟรงค์ซึ่งให้ความสำคัญอย่างยิ่งกับการจัดระเบียบลูกตั้งเตะ จะต้องรีบปรับจูนทีมทันทีที่ คริสตัล พาเลซ ซึ่งแพ้ในลีกมา 4 นัดติดต่อกัน โดยทีมเสียประตูไปแล้วถึง 24 ลูก ซึ่งมากที่สุดในพรีเมียร์ลีก และยิงได้เพียง 10 ประตูเท่านั้น", "ทอม อัลนัตต์ นักข่าวฟุตบอลจาก The Times กล่าวกับรายการ Football Daily ของ BBC Radio 5 Live ว่า \"หากคุณต้องการใครสักคนเข้ามาเพื่อสร้างความมั่นคงและความแข็งแกร่งในเกมรับ พร้อมกับปรับปรุงเรื่องลูกตั้งเตะ โธมัส แฟรงค์ คือคนที่สมบูรณ์แบบสำหรับงานนี้\"", "ด้วยการที่พรีเมียร์ลีกเพิ่งผ่านไปเพียง 10 นัด แฟรงค์ยังมีเวลามากพอที่จะพลิกสถานการณ์ และเขาน่าจะมีเป้าหมายในใจสำหรับการเสริมทัพเมื่อตลาดซื้อขายนักเตะเปิดขึ้นในเดือนมกราคม โดยในช่วงซัมเมอร์ที่ผ่านมา พาเลซขาย แม็กซองซ์ ลาครัวซ์ กองหลังชาวฝรั่งเศสให้ เชลซี ในราคา 52 ล้านปอนด์ และ ดาเนียล มูญอซ แบ็กขวาชาวโคลอมเบียให้ นอตทิงแฮม ฟอเรสต์ ในราคา 22 ล้านปอนด์ ซึ่งอัลนัตต์เสริมว่า \"เรารู้ว่าพวกเขาขายนักเตะฝีเท้าดีออกไปเยอะมาก และจนถึงตอนนี้ผมไม่คิดว่าพวกเขาจะหาใครมาแทนที่ได้อย่างเหมาะสม\"", "ความท้าทายอีกประการสำหรับแฟรงค์คือการดึงฟอร์มเก่งของ อดัม วอร์ตัน กองกลางที่ไม่ได้ลงเล่นให้ทีมชาติอังกฤษมาตั้งแต่เดือนมีนาคมให้กลับมาอีกครั้ง ซึ่งสิ่งเหล่านี้คือความท้าทายที่ผู้จัดการทีมคนใหม่พร้อมจะเผชิญ", "พอล โรบินสัน กล่าวทิ้งท้ายว่า \"คริสตัล พาเลซ และ โธมัส แฟรงค์ ดูจะเป็นส่วนผสมที่ลงตัวมาก\" ทั้งนี้ โธมัส แฟรงค์ มีงานหนักรออยู่ เพราะ คริสตัล พาเลซ คือทีมที่แย่ที่สุดในพรีเมียร์ลีกฤดูกาลนี้อย่างไม่ต้องสงสัย โดยรั้งอันดับบ๊วยทั้งในแง่ของคะแนน (7 คะแนน) ผลต่างประตูได้เสีย (-14) และค่าคาดหวังประตูได้เสีย (-8.1)", "ในส่วนของเกมรับคือจุดที่แฟรงค์ต้องให้ความสำคัญมากที่สุด ไม่เพียงแต่เสียประตูมากที่สุด (24 ลูก) แต่ยังปล่อยให้คู่แข่งยิงมากที่สุด (189 ครั้ง) และมีค่าคาดหวังการเสียประตู (xGA) แย่ที่สุดในลีกที่ 21.9", "อย่างไรก็ตาม ในส่วนของเกมรุกถือว่าไม่ได้แย่จนเกินไป แม้จะมีเพียง ฮัลล์ ซิตี้ เท่านั้นที่ยิงน้อยกว่า แต่พาเลซก็สร้างโอกาสได้ดีและอาจโชคร้ายที่ยิงประตูไม่ได้มากกว่านี้จากโอกาสที่มี", "นอกจากนี้ยังมีปัจจัยสำคัญที่เข้าทางแฟรงค์ แม้พาเลซจะรั้งอันดับบ๊วย แต่พวกเขายังไม่ถูกทิ้งห่าง เพราะมีแต้มห่างจากโซนปลอดภัยเพียง 2 คะแนน โดยทีมที่รั้งอันดับสุดท้ายในช่วงเวลานี้ของ 10 ฤดูกาลหลังสุดมีค่าเฉลี่ยเพียง 3 คะแนน แต่สำหรับพาเลซ แม้ผลงานจะแย่เพียงใด พวกเขาก็ยังมีถึง 7 คะแนน ซึ่งถือเป็นสถิติที่ดีที่สุดของทีมอันดับสุดท้ายหลังผ่านไป 10 นัดในรอบ 24 ปี"], "link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmge3y2qjlyro", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/a30c/live/69f709f0-df63-11f1-a8af-15d7a25dc0d1.png", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794851176, "published_at": "2026-11-16T17:46:16Z", "published_th": "17 พ.ย. 2026 • 00:46 น.", "category_hint": "Football"}, {"id": 1794849331773, "guid": "https://www.skysports.com/football/news/11095/13610988/thomas-frank-crystal-palace-appoint-former-spurs-and-brentford-boss-as-pierre-sages-successor-at-selhurst-park", "original_title": "Frank appointed Crystal Palace manager", "thai_title": "คริสตัล พาเลซ แต่งตั้ง โธมัส แฟรงค์ นั่งแท่นกุนซือคนใหม่", "tag": "Football", "sub_tag": "CRYSTAL PALACE", "bullet_points": ["คริสตัล พาเลซ ประกาศแต่งตั้ง โธมัส แฟรงค์ เข้ามารับตำแหน่งผู้จัดการทีมคนใหม่ด้วยสัญญาถึงช่วงซัมเมอร์ปี 2029", "แฟรงค์ เข้ามารับงานต่อจาก ปิแอร์ เซจ ที่ถูกปลดออกจากตำแหน่งเมื่อวันที่ 12 พฤศจิกายน หลังพาทีมพ่ายแพ้ในลีกเป็นนัดที่ 7", "ปัจจุบัน 'ปราสาทเรือนแก้ว' รั้งอันดับบ๊วยของตารางพรีเมียร์ลีก โดยมีเพียง 7 คะแนนจาก 10 นัดแรก", "ทีมงานสต๊าฟฟ์โค้ชของแฟรงค์จะประกอบไปด้วย แพดดี้ แม็คคาร์ธีย์ และ แอนดี้ คิว โดยสโมสรกำลังทาบทาม เบอร์นาร์โด คูเอวา, จัสติน คอเครน และ คริส ฮาสลัม เข้ามาร่วมทีม", "ภารกิจแรกของ โธมัส แฟรงค์ คือการพาทีมบุกไปเยือน โคเวนทรี ในวันเสาร์ที่ 21 พฤศจิกายนนี้ เพื่อทำคะแนนหนีโซนตกชั้น"], "full_paragraphs": ["คริสตัล พาเลซ ได้ประกาศแต่งตั้ง โธมัส แฟรงค์ เข้ามารับตำแหน่งผู้จัดการทีมคนใหม่เป็นที่เรียบร้อยแล้ว โดยกุนซือชาวเดนมาร์กรายนี้จะเข้ามาทำหน้าที่แทน ปิแอร์ เซจ ซึ่งถูกปลดออกจากตำแหน่งเมื่อวันที่ 12 พฤศจิกายนที่ผ่านมา หลังจากพาทีมพ่ายแพ้ในลีกเป็นนัดที่ 7 ของฤดูกาลต่อ ลิเวอร์พูล", "แฟรงค์ ได้จรดปากกาเซ็นสัญญาคุมทีมในถิ่น เซลเฮิร์สต์ พาร์ก จนถึงช่วงซัมเมอร์ปี 2029 ทั้งนี้ แฟรงค์ ถือเป็นหนึ่งในรายชื่อกุนซือที่ พาเลซ เคยพิจารณาในช่วงซัมเมอร์ที่ผ่านมา ก่อนที่จะตัดสินใจเลือก เซจ เข้ามารับงานในตอนนั้น นอกจากนี้ยังมีแคนดิเดตรายอื่นที่สโมสรให้ความสนใจ อาทิ แฟรงค์ แลมพาร์ด, ฌอน ไดช์, วิตอร์ เปเรย์รา, คิม เฮลล์เบิร์ก, วิตอร์ มาโตส, โทนี่ โปโปวิช, เยนส์ เบอร์เทล อัสคู และ โอเล่ เวอร์เนอร์", "สำหรับผลงานในอดีต โธมัส แฟรงค์ เคยประสบความสำเร็จอย่างสูงกับ เบรนท์ฟอร์ด ตลอดระยะเวลา 7 ปี ระหว่างปี 2018 ถึง 2025 โดยสามารถพาทีมเลื่อนชั้นขึ้นสู่พรีเมียร์ลีกและสร้างทีมให้กลายเป็นสโมสรระดับท็อปไฟลต์ได้สำเร็จ โดยทำผลงานดีที่สุดด้วยการจบอันดับที่ 9 ในปี 2023 ก่อนจะย้ายไปคุม ท็อตแนม ฮอตสเปอร์ เมื่อฤดูกาลที่แล้วเพื่อแทนที่ อังเก้ ปอสเตโคกลู แต่กลับถูกปลดออกจากตำแหน่งหลังจากคุมทีมได้ไม่ถึง 8 เดือน ในขณะที่ทีมรั้งอันดับที่ 16 และมีคะแนนห่างจากโซนตกชั้นเพียง 5 แต้มเท่านั้น", "ในช่วงเวลาที่คุม สเปอร์ส นั้น แฟรงค์ ไม่สามารถเอาชนะใจแฟนบอลได้ โดยช่วงเวลาสั้นๆ ของเขามีเหตุการณ์เชิงลบเกิดขึ้นมากมาย รวมถึงกรณีที่เขาดื่มน้ำจากแก้ ในภายหลังว่า 'ตอนที่ผมเริ่มเล่นให้เซาแธมป์ตัน ผมเล่นทางฝั่งซ้ายและเป็นหมายเลข 10 ซึ่งเกือบจะเป็นผู้เล่นประเภทที่ทีมต้องคอยประคบประหงม แต่เมื่อโปเช็ตติโน่เข้ามา มันชัดเจนตั้งแต่วันแรกว่าในทีมของเขาจะไม่มีที่ว่างสำหรับผู้เล่นประเภทนั้น'", "โปเช็ตติโน่นำแนวทางเดียวกันนี้มาใช้ที่ สเปอร์ส ซึ่งทีมของเขากลายเป็นที่จดจำจากความดุดันและความเข้มข้นในการเล่นเกมรับ รวมถึงการจ่ายบอลแนวตั้งที่รวดเร็วเพื่อสร้างเกมรุกในสไตล์ของ มาร์เซโล่ บิเอลซ่า โดยโปเช็ตติโน่ถือว่าบิเอลซ่าเป็นอิทธิพลด้านการโค้ชที่ยิ่งใหญ่ที่สุดของเขาเคียงคู่กับ เซอร์ อเล็กซ์ เฟอร์กูสัน", "ที่สเปอร์ส เขายังคงใช้ระบบ 4-2-3-1 เป็นหลัก และช่วยให้ผู้เล่นดาวรุ่งหลายคนแจ้งเกิดได้สำเร็จ รวมถึง เดเล่ อัลลี่ และ แฮร์รี่ เคน ที่ประสานงานกันได้อย่างยอดเยี่ยมในฐานะหมายเลข 10 และหมายเลข 9 ตามลำดับ", "โปเช็ตติโน่ใช้แบ็กทั้งสองข้างในการเติมเกมรุก โดยให้กองกลางตัวรับอย่าง เอริค ดายเออร์ ถอยลงมาเป็นเซ็นเตอร์แบ็กคนที่สามในขณะครองบอล ซึ่งเปิดโอกาสให้ อัลลี่, คริสเตียน อีริคเซ่น และ ซน ฮึง-มิน ได้เล่นใกล้ชิดกับ เคน มากขึ้น", "เขาใช้ผู้เล่นดาวรุ่งเหล่านั้นเปลี่ยนโฉมหน้าสเปอร์สจนเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปี้ยนส์ ลีก และจบอันดับท็อป 3 ของพรีเมียร์ลีกได้ถึง 3 ฤดูกาลติดต่อกัน แต่เมื่อเวลาผ่านไป อายุเฉลี่ยของทีมก็มากขึ้น ความสดลดลง และการเสริมทัพที่ไม่เพียงพอทำให้สเปอร์สไม่สามารถรักษาความเข้มข้นไว้ได้ การจากไปของเขาในปี 2019 จึงเป็นการสิ้นสุดวงจรหนึ่งของทีม", "โปเช็ตติโน่กลับมาคุมทีมอีกครั้งหลังจากออกจากสเปอร์สได้หนึ่งปี โดยรับงานที่ ปารีส แซงต์-แชร์กแมง ซึ่งเป็นเรื่องราวของการปรับปรัชญาให้เข้ากับลักษณะเฉพาะของผู้เล่นในทีม", "เพื่อรองรับ ลิโอเนล เมสซี่, คีลิยัน เอ็มบัปเป้ และ เนย์มาร์ โปเช็ตติโน่ต้องละทิ้งแท็กติกการเพรสซิ่งสูงที่เคยเป็นเอกลักษณ์ เพราะรู้ดีว่าสามประสานแดนหน้าซูเปอร์สตาร์ของเขาไม่เหมาะกับแนวทางการเล่นที่ต้องใช้พลังงานสูงเช่นนั้น", "ระบบ 4-3-3 เป็นแผนที่เขาใช้บ่อยที่สุด โดยมีแบ็กจอมบุกอย่าง อาชราฟ ฮาคิมี่ และ นูโน่ เมนเดส แต่สถานการณ์บังคับให้ทีมเปแอสเชของเขาห่างไกลจากสไตล์ที่เขาชื่นชอบอย่างมาก", "ที่ เชลซี เขาเริ่มด้วยระบบ 3-4-2-1 ในช่วงแรกก่อนจะเปลี่ยนมาใช้ 4-2-3-1 ที่เขาโปรดปราน โดย โคล พาลเมอร์ กลายเป็นนักเตะที่แจ้งเกิดภายใต้การคุมทีมของเขาด้วยผลงาน 22 ประตู กับ 11 แอสซิสต์ในพรีเมียร์ลีก", "อย่างไรก็ตาม โดยรวมแล้วโปเช็ตติโน่พบว่ามันยากที่จะถ่ายทอดแนวคิดของเขาให้ลูกทีมเข้าใจ ในเดือนเมษายนของฤดูกาลเดียวที่เขาคุมทีมในถิ่น สแตมฟอร์ด บริดจ์ เขาได้ตั้งคำถามถึงทัศนคติและความมุ่งมั่นของกลุ่มผู้เล่นว่า 'เรายังคงต้องสร้างทัศนคติที่จะช่วยให้เราก้าวไปข้างหน้า คุณต้องเรียกร้องจากตัวเองและเพื่อนร่วมทีมให้มากขึ้น'", "ทีมสเปอร์สของโปเช็ตติโน่เคยติดอันดับต้นๆ ของพรีเมียร์ลีกในเรื่องระยะทางวิ่งรวม แต่เชลซีในฤดูกาล 2023/24 กลับมีสถิติวิ่งรวมน้อยที่สุดเป็นอันดับ 3 ของลีก", "โปเช็ตติโน่ยังคงปรับตัวกับทีมชาติสหรัฐอเมริกา โดยสลับไปมาระหว่างกองหลัง 3 คนและ 4 คน และลดความเป็นระบบที่ตายตัวลง ระบบที่เขาใช้บ่อยที่สุดในฟุตบอลโลกคือ 4-3-3 แต่เปิดโอกาสให้ผู้เล่นเกมรุกได้เคลื่อนที่อย่างอิสระ ซึ่งช่วยให้พวกเขาเอาชนะ ปารากวัย, ออสเตรเลีย และ บอสเนียและเฮอร์เซโกวีนา ได้ ก่อนจะตกรอบด้วยน้ำมือของ เบลเยียม", "เขายังได้รับคำชมในการสร้างความเป็นน้ำหนึ่งใจเดียวกัน โดยการเพรสซิ่งสูงอย่างเป็นระบบกลายเป็นหัวใจสำคัญในฟุตบอลโลก ซึ่งพวกเขามีสถิติการแย่งบอลในแดนบนเฉลี่ย 8 ครั้งต่อเกม ถือเป็นหนึ่งในทีมที่มีสถิติดีที่สุดในรายการ", "ทีมของโปเช็ตติโน่ที่ แมนเชสเตอร์ ยูไนเต็ด น่าจะมีหน้าตาคล้ายกับทีมของ คาร์ริค ในช่วงแรก ซึ่งใช้ระบบ 4-2-3-1 เช่นกัน แต่จะมีการปรับเปลี่ยนบางจุด", "ความเร็วของ เลนี่ โยโร่ อาจจำเป็นในตำแหน่งเซ็นเตอร์แบ็กหากเขาต้องการดันไลน์กองหลังขึ้นสูง ในขณะที่ความสดของ แพทริค ดอร์กู อาจเป็นตัวเลือกที่น่าสนใจกว่า ลุค ชอว์ ในวัย 31 ปี ส่วน คาร์ลอส บาเลบา น่าจะเป็นกุญแจสำคัญในแดนกลางด้วยความแข็งแกร่งทางร่างกาย", "แต่โปเช็ตติโน่อาจต้องยอมรับเหมือนในอดีตว่า เขาไม่สามารถเรียกร้องการเล่นที่เข้มข้นสูงเกินไปได้หากพิจารณาจากขุมกำลังที่มีอยู่", "กุนซือชาวอาร์เจนไตน์มักชื่นชอบผู้เล่นอายุน้อย แต่ยูไนเต็ดมีทีมชุดใหญ่ที่อายุเฉลี่ยมากที่สุดทีมหนึ่งในพรีเมียร์ลีกฤดูกาลนี้ เชีย เลซี่ อาจเป็นตัวเลือกที่เข้ามาเติมพลังงานความสดใหม่ได้หรือไม่?", "บรูโน่ แฟร์นันด์ส จะเป็นหัวใจสำคัญในตำแหน่งหมายเลข 10 อย่างไม่ต้องสงสัย แต่ในวัย 32 ปี เขายังมีพลังงานพอที่จะวิ่งสอดขึ้นไปข้างหน้ากองหน้าในสไตล์ของ อัลลี่ สมัยเล่นกับ เคน ที่สเปอร์สหรือไม่?", "  • 14:00 น.", "category_hint": "Football"}, {"id": 1794802776973, "guid": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "original_title": "Fitness obsessed & 'control freak' - what can Man Utd expect from Pochettino?", "thai_title": "เจาะลึกสไตล์ 'เมาริซิโอ โปเช็ตติโน' กับความคาดหวังที่ แมนเชสเตอร์ ยูไนเต็ด: บ้าพลังและควบคุมทุกรายละเอียด", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน เตรียมเข้าคุมทีม แมนเชสเตอร์ ยูไนเต็ด อย่างเป็นทางการในวันที่ 18 พฤศจิกายนนี้ ด้วยสัญญาจนถึงเดือนมิถุนายน 2029", "โทบี อัลเดอร์ไวเรลด์ อดีตลูกทีมที่ ท็อตแนม ฮอตสเปอร์ ยืนยันว่าโปเช็ตติโนเป็นกุนซือที่เน้นระเบียบวินัยสูงและให้ความสำคัญกับเรื่องความฟิตเป็นอันดับหนึ่ง", "สไตล์การทำทีมของโปเช็ตติโนเน้นการเล่นเกมรุก กดดันคู่แข่ง และใช้ความเข้มข้นสูง ซึ่งต้องอาศัยสภาพร่างกายที่แข็งแกร่งเป็นพื้นฐานสำคัญ", "กุนซือชาวอาร์เจนไตน์รายนี้ขึ้นชื่อเรื่องการเป็น 'คนบ้าควบคุม' (control freak) ในเชิงบวก โดยจะดูแลทุกรายละเอียดทั้งในสนามและนอกสนามเพื่อให้นักเตะพร้อมสำหรับการแข่งขันเสมอ", "ปัญหาเรื่องความฟิตของนักเตะ แมนเชสเตอร์ ยูไนเต็ด ในฤดูกาลนี้ที่ถูกวิจารณ์อย่างหนัก อาจได้รับการแก้ไขด้วยโปรแกรมการฝึกซ้อมที่เข้มข้นของโปเช็ตติโน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน กำลังจะก้าวเข้าสู่ถิ่นโอลด์ แทรฟฟอร์ด พร้อมกับชื่อเสียงในเรื่องการจัดโปรแกรมปรีซีซั่นที่ 'โหดหิน' ความหลงใหลในเรื่องความฟิตของนักเตะ และแนวทางการทำงานที่ตรงไปตรงมาไม่เกรงใจใคร", "แมนเชสเตอร์ ยูไนเต็ด ยืนยันเมื่อวันศุกร์ที่ผ่านมาว่า โปเช็ตติโน จะเข้ามารับตำแหน่งผู้จัดการทีมในวันที่ 18 พฤศจิกายนนี้ แทนที่ ไมเคิล คาร์ริก โดยได้เซ็นสัญญาคุมทีมยาวไปจนถึงเดือนมิถุนายน 2029", "คำถามสำคัญคือ เหล่านักเตะและทีมงานจะเจอกับอะไรบ้างเมื่อกุนซือชาวอาร์เจนไตน์รายนี้เข้ามาคุมบังเหียนในช่วงปลายสัปดาห์หน้า? BBC Sport ได้พูดคุยกับ โทบี อัลเดอร์ไวเรลด์ ซึ่งเคยร่วมงานกับโปเช็ตติโนที่ ท็อตแนม ฮอตสเปอร์ มานานถึง 4 ปี ในช่วงเวลาที่ประสบความสำเร็จจนสามารถผ่านเข้าถึงรอบชิงชนะเลิศ ยูฟ่า แชมเปียนส์ลีก และจบอันดับสองในพรีเมียร์ลีกได้", "อัลเดอร์ไวเรลด์ ในวัย 37 ปี กล่าวว่า โปเช็ตติโน มีแนวทางการบริหารจัดการที่ชัดเจนและสามารถดึงศักยภาพที่ดีที่สุดของนักเตะออกมาได้ ตราบใดที่นักเตะเหล่านั้นยอมทำตามแผนของเขา \"เขาเป็นคนที่เข้าถึงง่าย แต่คุณต้องทำตามแผนของเขา ถ้าคุณไม่ทำตาม คุณก็จะถูกจับแยกออกไปข้างสนามและไม่มีวันได้กลับมาอีก\"", "\"คุณต้องคิดถึงทีม ทีม และทีม ถ้าคุณคิดถึงแต่ตัวเอง คุณก็จบเห่ ในฐานะนักเตะคุณมีชีวิตส่วนตัว มีสถานการณ์ส่วนตัว แต่เขาจะบอกว่า 'ฟังนะ ผมเข้าใจและคุณคุยกับผมได้ แต่ทีมต้องมาก่อน' นั่นคือวิถีของเขา และถ้าคุณไม่ทำตาม เขาก็จะจับคุณนั่งข้างสนาม\"", "\"เขาเป็นคนตรงไปตรงมา มีไอเดียเป็นของตัวเอง คุณอาจจะเห็นด้วยหรือไม่เห็นด้วยกับเขาก็ได้ นั่นเป็นเรื่องของคุณ แต่คุณต้องเดินตามเขา และผมคิดว่านั่นคือสิ่งที่ แมนเชสเตอร์ ยูไนเต็ด ต้องการ คือคนที่มีคาแรกเตอร์ชัดเจน ทุกคนมุ่งไปในทิศทางเดียวกัน ทำตามแผน ถ้าไม่ทำก็ไม่มีปัญหา คุณก็แค่ย้ายออกไป เขาคือเจ้านายใหญ่\"", "\"เขาเป็นคนที่ฉลาดมาก รู้วิธีการพูดกับสื่อและรู้ว่าควรพูดอะไร เขาจะสร้างสภาพแวดล้อมแบบ 'เราสู้กับคนทั้งโลก' เรากำลังฟิต เราเป็นหนึ่งเดียวกันในฐานะทีม ไม่สำคัญว่าคนอื่นจะพูดอย่างไร มาทำงานร่วมกันและคว้าผลการแข่งขันไปด้วยกัน\"", "\"ที่สเปอร์ส เขามีทีมงานสตาฟฟ์โค้ช แต่เขาก็จะอยู่ที่นั่นด้วยเสมอ เขารู้ทุกอย่าง ถ้าเขาไม่อยู่ในสนาม เขาก็จะดูวิดีโอและข้อมูลสถิติ เขารู้ทุกเรื่องเกี่ยวกับนักเตะทั้งในและนอกสนาม นักเตะทุกคนจะถูกจับตามอง\"", "\"เขาเป็นคนบ้าควบคุมในเชิงบวก เพราะเขาบอกเสมอว่าร่างกายของคุณคืออาวุธ และมันต้องพร้อมสำหรับการลงสนามเสมอ\"", "แมนเชสเตอร์ ยูไนเต็ด ถูกวิจารณ์อย่างหนักในฤดูกาลนี้เรื่องความฟิตที่ดูไม่เพียงพอและวิ่งน้อยเกินไปในระหว่างเกม โดยสถิติระบุว่าพวกเขาอยู่ในกลุ่ม 5 อันดับสุดท้ายของลีกในด้านระยะทางรวมและการวิ่งด้วยความเร็วสูง (high-intensity runs) ซึ่งอัลเดอร์ไวเรลด์ยืนยันว่าความต้องการอันดับหนึ่งของโปเช็ตติโนคือความฟิตและการวิ่ง", "\"อย่างแรกเลย เขาทำให้พวกเราฟิตมาก ช่วงปรีซีซั่นมันโหดมาก วิธีที่เขาต้องการให้เล่น คือการบุกกดดันคู่แข่ง การยืนไลน์กองหลังสูง และการเล่นที่เน้นความคล่องตัวสูง คุณจำเป็นต้องวิ่ง คุณต้องสามารถวิ่งและทำความเร็วสูงได้ พื้นฐานที่สุดคือต้องฟิต\"", "\"ผู้จัดการทีมทุกคนต้องการช่วงปรีซีซั่นที่ดีและเวลาในการถ่ายทอดไอเดียรวมถึงสร้างความฟิต แต่นักเตะจะรู้สึกได้ทันทีว่ามันเป็นคนละระดับกัน นี่คือสิ่งที่ต้องทำทุกวันที่สนามซ้อม ต้องเต็มที่ 100% นั่นคือสิ่งที่เขาขอและต้องการ มันจะเป็นความแตกต่างครั้งใหญ่สำหรับนักเตะและพวกเขาจะเห็นผลลัพธ์ทันที\"", "\"ในเกมแชมเปียนส์ลีก รอบรองชนะเลิศ เราตามหลัง 3-0 (ในเกมพบกับ อาแจ็กซ์) เขาไม่ได้พูดเรื่องแท็กติกในช่วงพักครึ่งเลย เขาแค่บอกว่า 'พวกคุณต้องใช้ร่างกายเข้าสู้ ต้องสู้ คุณต้องการแค่ประตูเดียวเพื่อกลับมาสู่เกม จงเชื่อว่าทุกอย่างเป็นไปได้' นั่นเป็นช่วงเวลาที่สำคัญมาก เพราะตอนนั้นเราสู้ อาแจ็กซ์ ไม่ได้เลย แต่เราเปลี่ยนทุกอย่างด้วยความเข้มข้นและการเข้าปะทะ ผมจำได้ว่ามีการวางบอลยาวให้ เฟร์นานโด ยอเรนเต และเราก็แค่สู้และถามกันว่า 'พวกคุณต้องการมันมากแค่ไหน?' ทุกอย่างเปลี่ยนไปตั้งแต่นาทีนั้น\""], "link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/c85y13pv69xwo", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/8125/live/1aaff900-dfb9-11f1-b154-657b8bcda5ea.jpg", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/1da8/live/872e4dc0-ddd4-11f1-9053-236ccb99630c.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794610397, "published_at": "2026-11-13T22:53:17Z", "published_th": "14 พ.ย. 2026 • 05:53 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776975, "guid": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "original_title": "Tearful Pochettino on 'difficult' decision to leave USA for Man Utd", "thai_title": "โปเช็ตติโน่หลั่งน้ำตา ยอมรับการตัดสินใจอำลาทีมชาติสหรัฐฯ เพื่อคุมทัพแมนเชสเตอร์ ยูไนเต็ด เป็นเรื่องยากที่สุดในอาชีพ", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน่ ตัดสินใจอำลาตำแหน่งกุนซือทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานคุมทีมแมนเชสเตอร์ ยูไนเต็ด โดยเซ็นสัญญาเป็นเวลา 2 ปีครึ่ง", "ปีศาจแดงยอมจ่ายค่าฉีกสัญญาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่และทีมงานสตาฟฟ์โค้ชมาจากสหรัฐฯ", "โปเช็ตติโน่ยอมรับว่านี่เป็นการตัดสินใจที่ยากลำบากที่สุดครั้งหนึ่งในอาชีพ แต่โอกาสในการคุมทีมระดับโอลด์แทรฟฟอร์ดนั้นยากที่จะปฏิเสธ", "กุนซือชาวอาร์เจนไตน์จะประเดิมคุมทีมแมนเชสเตอร์ ยูไนเต็ด นัดแรกในเกมเยือนลิเวอร์พูล วันที่ 22 พฤศจิกายนนี้", "สถานการณ์ของแมนเชสเตอร์ ยูไนเต็ด ในปัจจุบันอยู่ในภาวะวิกฤต โดยรั้งอันดับ 18 ของตารางพรีเมียร์ลีก หลังออกสตาร์ทฤดูกาลได้ย่ำแย่ที่สุดในรอบ 40 ปี"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน่ เปิดเผยว่าการตัดสินใจอำลาตำแหน่งผู้จัดการทีมชาติสหรัฐอเมริกา เพื่อเข้ามารับงานเป็นหัวหน้าผู้ฝึกสอนของแมนเชสเตอร์ ยูไนเต็ด ถือเป็นหนึ่งในการตัดสินใจที่ยากลำบากที่สุดในอาชีพการทำงานของเขา", "กุนซือชาวอาร์เจนไตน์ได้รับการประกาศให้เป็นผู้สืบทอดตำแหน่งต่อจาก ไมเคิล คาร์ริค ในถิ่นโอลด์แทรฟฟอร์ดเมื่อวันศุกร์ที่ผ่านมา โดยแหล่งข่าวระบุกับ BBC Sport ว่าเขาได้เซ็นสัญญาคุมทีมเป็นระยะเวลา 2 ปีครึ่ง", "แมนเชสเตอร์ ยูไนเต็ด ยอมจ่ายค่าฉีกสัญญาในราคาประมาณ 7.4 ล้านปอนด์ เพื่อดึงตัวโปเช็ตติโน่ออกจากสัญญาเดิมกับทีมชาติสหรัฐฯ พร้อมทั้งมีการจ่ายเงินเพิ่มเติมสำหรับทีมงานสตาฟฟ์โค้ชของเขาด้วย", "โปเช็ตติโน่เพิ่งจะเซ็นสัญญาฉบับใหม่ระยะเวลา 4 ปีกับทีมชาติสหรัฐฯ ไปเมื่อช่วงซัมเมอร์ที่ผ่านมา แต่เขาจะอำลาทีมหลังจากเสร็จสิ้นภารกิจคุมทีมชาติลงเล่นในนัดที่จะพบกับเฮติ ในวันที่ 14 และ 18 พฤศจิกายนนี้", "กุนซือวัย 54 ปี ถึงกับหลั่งน้ำตาในระหว่างการแถลงข่าวครั้งแรกหลังจากมีการยืนยันการย้ายไปคุมทีมปีศาจแดง โดยเขาได้กล่าวขอบคุณสมาคมฟุตบอลสหรัฐฯ สำหรับการสนับสนุนที่ผ่านมา", "เขากล่าวว่า \"มันยากที่จะพูดในตอนนี้ ผมเป็นคนที่มีอารมณ์ร่วมสูงมาก มันเป็นการตัดสินใจที่น่าเศร้าจริงๆ แต่เราคือมืออาชีพ และเรากำลังพยายามทำให้ความฝันของเรากลายเป็นจริง\"", "เมื่อถูกถามว่าเหตุใดจึงตัดสินใจเซ็นสัญญาฉบับใหม่กับทีมชาติทั้งที่ตั้งใจจะรับข้อเสนอจากยูไนเต็ด โปเช็ตติโน่ตอบว่าโอกาสในการคุมทีมที่โอลด์แทรฟฟอร์ดนั้นดีเกินกว่าจะปฏิเสธได้ \"ผมไม่เคยพูดว่าผมต้องการกลับไป แต่พวกเขารู้ดีว่าโอกาสที่จะเกิดขึ้นในอาชีพการงานของคุณเหมือนกับแมนเชสเตอร์ ยูไนเต็ด นั้นมีไม่มากนัก เมื่อมันมาถึง มันจึงเป็นเรื่องยากที่จะปฏิเสธ\"", "ก่อนหน้านี้ ไมเคิล คาร์ริค ถูกปลดออกจากตำแหน่งเมื่อวันพฤหัสบดีที่ผ่านมา หลังจากแมนเชสเตอร์ ยูไนเต็ด ออกสตาร์ทฤดูกาลในประเทศได้ย่ำแย่ที่สุดในรอบ 40 ปี ส่งผลให้ทีมหล่นไปอยู่อันดับที่ 18 ของตารางพรีเมียร์ลีก", "โปเช็ตติโน่จะเข้ามารับช่วงต่อในทีมที่ชนะเพียงนัดเดียวจากการลงเล่นในลีก 10 นัดในฤดูกาลนี้ และมีคะแนนนำหน้าทีมบ๊วยอย่างซันเดอร์แลนด์เพียงแค่ 1 คะแนนเท่านั้น โดยนัดแรกที่เขาจะคุมทีมคือการออกไปเยือนลิเวอร์พูลในวันที่ 22 พฤศจิกายน", "การมาถึงของโปเช็ตติโน่ที่โอลด์แทรฟฟอร์ดถือเป็นการสิ้นสุดความพยายามในการดึงตัวเขามาร่วมทีมที่ยืดเยื้อมานานนับทศวรรษ หลังจากที่เขาเคยสร้างชื่อเสียงโด่งดังจากการคุมทีมเซาแธมป์ตันและท็อตแนม ฮ็อตสเปอร์ มาก่อนหน้านี้", "หลังจากได้รับการแต่งตั้ง ไมเคิล คาร์ริค ได้ออกแถลงการณ์ผ่านโซเชียลมีเดียเพื่อขอบคุณแฟนบอลยูไนเต็ดสำหรับการสนับสนุนในช่วงเวลาที่เขาคุมทีม โดยระบุว่า \"ถึงแฟนบอลยูไนเต็ดทุกคน ผมได้รับเกียรติอย่างยิ่งที่ได้นำทัพแมนเชสเตอร์ ยูไนเต็ด สโมสรฟุตบอลที่ผมรัก มีคนเพียงไม่กี่คนที่ได้รับโอกาสได้ใช้ชีวิตและสัมผัสกับสิ่งนี้ และผมรู้สึกขอบคุณอย่างเหลือเชื่อ\"", "คาร์ริคซึ่งเพิ่งเซ็นสัญญา 2 ปีกับสโมสรเมื่อเดือนพฤษภาคมที่ผ่านมา ได้กล่าวถึงวัฒนธรรมและค่านิยมของสโมสรว่า \"ท้ายที่สุดแล้ว คุณต้องผลักดันตัวเองให้ดีที่สุด แต่มันมีวัฒนธรรม มีค่านิยม และพฤติกรรมที่คุณต้องยึดถือและเคารพ ซึ่งถูกสร้างขึ้นมาเป็นเวลานาน มันเป็นสโมสรฟุตบอลที่มีเอกลักษณ์ มีเนื้อหาและประวัติศาสตร์ที่ไม่สามารถมองข้ามได้ นี่คือสิ่งที่สร้างแรงบันดาลใจให้ผมทุกวัน\"", "ในส่วนของเบื้องหลังการบริหาร แมนเชสเตอร์ ยูไนเต็ด ยืนยันชัดเจนว่าโปเช็ตติโน่เป็นโค้ชเพียงคนเดียวที่พวกเขาเจรจาโดยตรงเพื่อเข้ามารับงานที่โอลด์แทรฟฟอร์ด ท่ามกลางกระแสข่าวลือเกี่ยวกับความขัดแย้งระหว่างตระกูลเกลเซอร์และเซอร์ จิม แรตคลิฟฟ์ ซึ่งสโมสรยืนยันว่าไม่เป็นความจริงแต่อย่างใด"], "link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o?at_medium=RSS&at_campaign=rss", "canonical_link": "https://www.bbc.co.uk/sport/football/articles/cmd61qne8352o", "cover_image_url": "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/fcb8/live/8a5ea400-df72-11f1-b844-3146c4983677.png", "gallery_images": ["https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/9f4c/live/65464ec0-df45-11f1-a48c-75dd2efdacb5.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/561c/live/2c8292a0-eeda-11ee-b0e1-b9dd5ac46984.jpg", "https://ichef.bbci.co.uk/ace/standard/1200/cpsprodpb/5b83/live/19a2af80-7aca-11f0-a34f-318be3fb0481.png"], "videos": [], "review_score": "", "published_ts": 1794583686, "published_at": "2026-11-13T15:28:06Z", "published_th": "13 พ.ย. 2026 • 22:28 น.", "category_hint": "Football", "sub_tag": "MAN UTD"}, {"id": 1794802776977, "guid": "https://www.bbc.co.uk/sport/football/articles/cm2kljzkw77ko", "original_title": "How Ferguson-inspired Pochettino can succeed where Carrick failed at Man Utd", "thai_title": "ถอดรหัส เมาริซิโอ โปเช็ตติโน กับภารกิจกู้ศรัทธา แมนฯ ยูไนเต็ด ด้วยจิตวิญญาณแบบ เซอร์ อเล็กซ์ เฟอร์กูสัน", "tag": "Football", "bullet_points": ["เมาริซิโอ โปเช็ตติโน ได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด โดยมี เซอร์ อเล็กซ์ เฟอร์กูสัน เป็นแรงบันดาลใจสำคัญในการทำทีม", "ปัญหาของ แมนฯ ยูไนเต็ด ในยุคหลังคือความไม่ชัดเจนระหว่างการเน้นผลการแข่งขันหรือการรักษาอัตลักษณ์ฟุตบอลแบบดั้งเดิม", "ไมเคิล คาร์ริค เคยพยายามปรับเปลี่ยนสไตล์การเล่นของทีมให้มีความลื่นไหลมากขึ้น แต่ประสบปัญหาในการเปลี่ยนผ่านจากทีมที่เน้นสวนกลับไปสู่ทีมที่ครองบอลบุกได้ดี", "โปเช็ตติโน นำเสนอแนวทางการทำทีมที่เน้นการเพรสซิ่งสูงและฟุตบอลที่ดุดัน ซึ่งผสมผสานระหว่างความอิสระของผู้เล่นกับระบบการจัดการที่ชัดเจน"], "full_paragraphs": ["เมาริซิโอ โปเช็ตติโน ถูกกล่าวถึงในฐานะแคนดิเดตผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด ครั้งแรกตั้งแต่สมัยที่ หลุยส์ ฟาน กัล ถูกปลดออกจากตำแหน่งในเดือนพฤษภาคม 2016", "เมื่อครั้งที่ โปเช็ตติโน ถูกถามถึงรายชื่อผู้จัดการทีมพรีเมียร์ลีก 3 คนที่เขาอยากจะเล่นให้มากที่สุด คำตอบของเขานั้นชัดเจนและหนักแน่น \"เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน, เซอร์ อเล็กซ์ เฟอร์กูสัน\" คือคำตอบของกุนซือชาวอาร์เจนไตน์ผู้ซึ่งเพิ่งได้รับการแต่งตั้งเป็นผู้จัดการทีม แมนเชสเตอร์ ยูไนเต็ด เมื่อวันศุกร์ที่ผ่านมา", "ในปี 2023 ขณะที่เขายังคุมทีม เชลซี และสวมชุดฝึกซ้อมของสโมสร โปเช็ตติโน ได้ให้สัมภาษณ์กับ สกาย สปอร์ตส์ และเขายังคงแสดงความชื่นชมอย่างสุดซึ้งต่อ เฟอร์กูสัน เช่นเดิม โดยย้อนกลับไปเมื่อ 6 ปีก่อนหน้านั้น ในช่วงที่เขายังคุมทีม ท็อตแนม ฮอตสเปอร์ เขาเคยได้รับประทานอาหารกลางวันร่วมกับตำนานกุนซือปีศาจแดงผู้นี้", "\"ตอนที่ผมยังเด็ก ตอนที่ผมเริ่มอาชีพผู้จัดการทีม เขาคือแรงบันดาลใจและเป็นต้นแบบของผมเสมอ\" โปเช็ตติโน กล่าว \"และเมื่อคุณมีโอกาสได้ใช้เวลา 2 ชั่วโมงกับบุคคลที่เป็นผู้จัดการทีมที่ยิ่งใหญ่ที่สุดในประวัติศาสตร์ฟุตบอล คุณทำได้เพียงแค่ดื่มด่ำกับช่วงเวลานั้น\"", "การสรรหาผู้จัดการทีมของ แมนฯ ยูไนเต็ด กลายเป็นเรื่องซับซ้อนนับตั้งแต่การอำลาทีมของ เฟอร์กูสัน ในปี 2013 โดยหนึ่งในประเด็นถกเถียงสำคัญคือเรื่อง 'ดีเอ็นเอ' ของสโมสร สำหรับบางคนมองว่าชัยชนะคือสิ่งสำคัญที่สุดไม่ว่าจะด้วยวิธีใดก็ตาม ในขณะที่อีกกลุ่มเชื่อว่าสไตล์การเล่นและมรดกทางวัฒนธรรมในช่วงที่สโมสรประสบความสำเร็จสูงสุดคือหัวใจสำคัญของตัวตนสโมสร", "ในช่วงหลายปีที่ผ่านมา การเปลี่ยนผ่านกุนซือของ ยูไนเต็ด สลับไปมาระหว่างโค้ชชาวต่างชาติที่มีสไตล์การเล่นตายตัว กับอดีตนักเตะในยุคของ เฟอร์กูสัน แต่ด้วยแท็กติกที่เขาเลือกใช้และความชื่นชมที่มีต่ออดีตบอสปีศาจแดง ทำให้ โปเช็ตติโน อาจเป็นคนที่มีความเหมาะสมอย่างยิ่งในการเชื่อมช่องว่างระหว่างสองแนวคิดนี้เข้าด้วยกัน", "ผลงานของ ไมเคิล คาร์ริค กับ แมนฯ ยูไนเต็ด ในช่วงท้ายฤดูกาลที่ผ่านมาถือว่ายอดเยี่ยมและไม่มีทีมใดในลีกทำได้ดีเท่า แต่ความสำเร็จนั้นสร้างขึ้นบนพื้นฐานของการโจมตีในจังหวะเปลี่ยนผ่าน (Transition) เป็นหลัก ภายใต้การคุมทีมของ คาร์ริค ในเกมที่พวกเขาครองบอลน้อยกว่า 50% พวกเขาแพ้เพียงนัดเดียวจาก 13 เกม โดยมีอัตราการชนะสูงถึง 62% แต่ตัวเลขนี้ลดลงเหลือ 36% ในเกมที่พวกเขาเป็นฝ่ายครองบอลมากกว่า", "สไตล์การเล่นนี้เหมาะกับแนวรุกที่เน้นความรวดเร็วและช่วยปกป้องแนวรับไปในตัว ในขณะเดียวกัน ความสามารถในการเล่นลูกตั้งเตะของ กาเซมิโร ก็เป็นอาวุธสำคัญที่ช่วยให้ ยูไนเต็ด เจาะตาข่ายคู่แข่งที่เน้นตั้งรับลึกได้ ซึ่งเป็นปัญหาที่ทีมเผชิญมาตลอดฤดูกาล เมื่อ ยูไนเต็ด ขึ้นนำ คู่แข่งก็จำเป็นต้องดันเกมขึ้นมา ทำให้ทีมของ คาร์ริค มีพื้นที่ในการเล่นสวนกลับมากขึ้น ซึ่งมันได้ผลดี", "อย่างไรก็ตาม ทีมระดับท็อปมักไม่ต้องการเล่นในลักษณะนี้ วิสัยทัศน์ของ คาร์ริค คือการสร้างทีมที่เล่นฟุตบอลอย่างลื่นไหล มีการผ่านบอลสั้นในจังหวะสร้างเกม โดยได้รับแรงบันดาลใจจากแดนกลางของ ปารีส แซงต์ แชร์กแมง แต่ความพยายามที่จะเปลี่ยน ยูไนเต็ด จากทีมที่เน้นสวนกลับให้กลายเป็นทีมที่ครองบอลบุกได้อย่างมั่นคงนั้น เป็นอุปสรรคเดียวกันกับที่ทำให้ โอเล กุนนาร์ โซลชา และ เอริก เทน ฮาก ต้องประสบปัญหา", "โปเช็ตติโน มอบทางออกที่น่าสนใจให้กับปัญหานี้ โดยเขาเคยกล่าวไว้ว่าทีมของเขาจำเป็นต้อง \"เป็นตัวเอกเสมอ เพรสซิ่งสูง ทำงานหนัก และมีความคล่องตัว\" เขาเรียกตัวเองว่าเป็น 'ศิษย์' ของ มาร์เซโล บิเอลซา ตำนานกุนซือชาวอาร์เจนไตน์ที่เขาเคยร่วมงานด้วย หากจะเปรียบเทียบโค้ชในพรีเมียร์ลีกที่มีแนวคิดคล้ายกับ โปเช็ตติโน ในเรื่องการครองบอล ก็คงต้องนึกถึง อันโดนี อิราโอลา ของ ลิเวอร์พูล ที่ยกย่อง บิเอลซา เป็นต้นแบบเช่นกัน", "โค้ชเหล่านี้คือกลุ่มที่เน้นการเป็นฝ่ายรุก แต่ก็สนับสนุนฟุตบอลที่เน้นแนวตั้ง (Vertical football) ซึ่งแฟนบอลทั้งของ ยูไนเต็ด และ ลิเวอร์พูล ต่างก็เคยมีความสุขกับความสำเร็จเมื่อทีมเล่นฟุตบอลด้วยความเร็วสูง", "ฟุตบอลโลกที่ผ่านมาเป็นเวทีที่แสดงให้เห็นถึงสไตล์การเล่นและการปรับตัวทางแท็กติกของ โปเช็ตติโน ได้เป็นอย่างดี แทนที่จะยึดติดกับตำแหน่งตายตัวเหมือนกับ เอ็นโซ มาเรสกา ของ แมนฯ ซิตี้ ทีมสหรัฐอเมริกาของ โปเช็ตติโน มีเพียงผู้เล่นบางตำแหน่งเท่านั้นที่ได้รับมอบหมายให้ยืนประจำตำแหน่ง", "แนวทางนี้สร้างปัญหาให้กับทีมที่เน้นการป้องกันแบบโซน การที่กองกลางสหรัฐฯ สามารถเคลื่อนที่ได้อย่างอิสระทำให้พวกเขาสามารถแทรกตัวเข้าไปในพื้นที่ระหว่างโซนที่คู่แข่งป้องกันอยู่ ส่งผลให้ผู้เล่นมักจะว่างและมีเวลาในการเล่นบอลมากขึ้น นอกจากนี้ การผ่านบอลในพื้นที่แคบๆ ยังช่วยดึงคู่แข่งให้เข้ามาหาบอลและเปิดพื้นที่ให้เพื่อนร่วมทีมคนอื่น", "การผสมผสานระหว่างแดนกลางที่ยืดหยุ่น การผ่านบอลในพื้นที่แคบ และการจ่ายบอลทะลุช่องโดยตรง ไม่ได้แตกต่างจากสิ่งที่ คาร์ริค พยายามจะทำ และแม้ว่านั่นอาจทำให้แฟนบอล ยูไนเต็ด กังวล แต่ความคล้ายคลึงในหลักการจะส่งผลดีต่อตัวผู้เล่น", "\"ปรัชญาของผมคือการมอบสไตล์ที่อิสระภายใต้การจัดระเบียบที่ดี\" คือคำพูดของ โปเช็ตติโน ในปี 2014 แม้ปรัชญาจะคล้ายกัน แต่ส่วนหลังคือ 'การจัดระเบียบที่ชัดเจน' ซึ่งน่าจะเป็นสิ่งที่ คาร์ริค ยังไม่สามารถมอบให้ผู้เล่นได้อย่างมั่นคง", "สำหรับแฟนบอลทีมใหญ่ ฟุตบอลที่รวดเร็วและเน้นแนว มของ เมาริซิโอ โปเช็ตติโน่ กุนซือคนใหม่ จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป", "ฟอร์มการเล่นของแฟร์นันด์สในฤดูกาลนี้ตกลงไปจากเดิมอย่างเห็นได้ชัด โดยทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด"], "full_paragraphs": ["บรูโน่ แฟร์นันด์ส กัปตันทีมแมนเชสเตอร์ ยูไนเต็ด ได้ปฏิเสธข้อเสนอสัญญาฉบับใหม่จากสโมสรเป็นครั้งที่สองแล้ว โดยกองกลางทีมชาติโปรตุเกสรายนี้กำลังจะหมดสัญญาหลังจบฤดูกาลนี้ แม้ว่าสโมสรจะมีออปชั่นในการขยายสัญญาเพิ่มอีก 12 เดือนจนถึงปี 2028 ก็ตาม", "ทางสโมสรแมนเชสเตอร์ ยูไนเต็ด ต้องการหลีกเลี่ยงการใช้ออปชั่นดังกล่าวด้วยการขยายสัญญาฉบับปัจจุบันของดาวเตะวัย 32 ปีออกไป และได้มีการพูดคุยกับตัวแทนของนักเตะมาตลอดในช่วงหลายเดือนที่ผ่านมา อย่างไรก็ตาม แหล่งข่าวได้ยืนยันกับ BBC Sport ว่า แฟร์นันด์สได้ปฏิเสธข้อเสนอครั้งที่สองที่ทางสโมสรยื่นให้เพื่อต่อสัญญาในถิ่นโอลด์ แทรฟฟอร์ด", "หากแมนเชสเตอร์ ยูไนเต็ด ไม่สามารถบรรลุข้อตกลงสัญญาฉบับใหม่กับแฟร์นันด์สได้ เป็นที่แน่นอนว่าสโมสรจะใช้ออปชั่นขยายสัญญาเพิ่ม 12 เดือนก่อนวันที่ 1 มกราคม ซึ่ง ณ เวลานั้น กองกลางรายนี้จะสามารถเซ็นสัญญาล่วงหน้ากับสโมสรต่างแดนได้ เนื่องจากสัญญาของเขาจะเหลือระยะเวลาไม่ถึง 6 เดือน", "ยังไม่มีความชัดเจนว่าแฟร์นันด์สปฏิเสธข้อเสนอดังกล่าวเมื่อใด แต่ดูเหมือนว่าการหาข้อยุติในเรื่องนี้ยังไม่น่าจะเกิดขึ้นในเร็ววัน ท่ามกลางความวุ่นวายภายในสโมสร โดยเมื่อวันพฤหัสบดีที่ผ่านมา ไมเคิล คาร์ริค ได้ถูกปลดออกจากตำแหน่งหัวหน้าผู้ฝึกสอน หลังจากทีมทำผลงานย่ำแย่ที่สุดในรอบ 40 ปีนับตั้งแต่เปิดฤดูกาล", "เมาริซิโอ โปเช็ตติโน่ กุนซือทีมชาติสหรัฐอเมริกา คาดว่าจะเข้ามารับหน้าที่แทนคาร์ริค โดยกุนซือชาวอาร์เจนไตน์รายนี้เตรียมประเดิมคุมทีมข้างสนามนัดแรกในเกมที่แมนเชสเตอร์ ยูไนเต็ด จะบุกไปเยือนแอนฟิลด์เพื่อพบกับคู่ปรับตลอดกาลอย่าง ลิเวอร์พูล ในวันที่ 22 พฤศจิกายนนี้", "ทางสโมสรหวังว่าการเข้ามาของโปเช็ตติโน่จะช่วยโน้มน้าวให้แฟร์นันด์สตัดสินใจฝากอนาคตไว้กับทีมต่อไป ทั้งนี้ แฟร์นันด์สเคยเกือบจะได้ย้ายไปร่วมทีมท็อตแนม ฮ็อตสเปอร์ ของโปเช็ตติโน่ในปี 2019 แต่การย้ายทีมไม่เกิดขึ้น ก่อนที่เขาจะย้ายมาอยู่กับแมนเชสเตอร์ ยูไนเต็ด ในอีก 6 เดือนต่อมา โดยในฤดูกาลนี้ อดีตมิดฟิลด์สปอร์ติ้ง ลิสบอน รายนี้ทำไปแล้ว 6 ประตูจากการลงสนาม 13 นัด"
